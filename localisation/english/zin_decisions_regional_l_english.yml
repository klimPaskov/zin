l_english:
 zin_regional_buldor_contracts:0 "The Company Books"
 zin_regional_buldor_contracts_desc:0 "Heralds come to the paymaster from every court that has a war to fight. The Company Books list the contracts the companies may take, the fee for each and the day it ends."
 zin_regional_buldor_recall_company:0 "Recall a Company"
 zin_regional_buldor_recall_company_desc:0 "Call back the newest company before its term is out. Its employer loses their service at once, and the men march home to the drill fields of Buldor."
 zin_regional_buldor_sell_contract:0 "Sell a Contract"
 zin_regional_buldor_sell_contract_desc:0 "Offer a company's service to a realm at war. If the employer signs, it pays the fee in advance and the company serves for a year and a day. The paymaster counts the coin, and the veterans come home afterwards."
