l_english:
 zin_east_buy_road_lords:0 "Buy the Road Lords of [FROM.GetName]"
 zin_east_buy_road_lords_desc:0 "The lords of the road keep the wells and set the tolls. Gold in the right hands makes a court lean your way, and makes your caravans welcome on every road it holds."
 zin_east_caravan_war_strain:0 "The Roads at War"
 zin_east_caravan_war_strain_desc:0 "Every caravan travels with swords drawn and every well has a guard. Goods are dear, tempers are short, and the people have decided that someone else started it."
 zin_east_caravan_wealth:0 "Caravan Wealth"
 zin_east_caravan_wealth_desc:0 "Each road that holds the charter of this court fills the treasury and the markets a little. The merchants pay for the roads in ways the ledgers do not show."
 zin_east_charter_lost:0 "Lost a Charter"
 zin_east_coalition_ambition:0 "Beyond the Rift"
 zin_east_coalition_ambition_desc:0 "Across the narrow sea lie green and weakly held lands. Every captain in the host has heard of them, and none wishes to be the one who stayed at home."
 zin_east_concord:0 "The Concord of the Roads"
 zin_east_concord_of_the_roads:0 "Offer a Concord of the Roads"
 zin_east_concord_of_the_roads_desc:0 "Share the roads. The charters stand as they are, and each side counts every road as half its own. The rivalry will not be allowed to grow for five years."
 zin_east_court_envoys:0 "Send Envoys to [FROM.GetName]"
 zin_east_court_envoys_desc:0 "A few clever people with letters and a willingness to be polite for months. The court will lean a little toward you."
 zin_east_court_gifts:0 "Gifts from the Court"
 zin_east_courts:0 "Courts of the East"
 zin_east_courts_desc:0 "Envoys, gifts, invitations and offers of protection. A court leans toward one side or the other for its own reasons, and the reasons change with the season."
 zin_east_debt_forgiven:0 "Debt Forgiven"
 zin_east_desert:0 "Wells of the South"
 zin_east_desert_desc:0 "In the southern desert a state without a well is a state without a road. A dug well helps every army that marches through it."
 zin_east_dig_wells:0 "Dig Wells in [FROM.GetName]"
 zin_east_dig_wells_desc:0 "Send the diggers into the sand. A stone well in this state feeds the garrison and the caravans, and for everyone who holds the state after you."
 zin_east_dry_land:0 "Dry Land"
 zin_east_dry_land_desc:0 "No well within a day's march. Armies carry their water and lose half of it to the sand."
 zin_east_feed_the_quarrel:0 "Feed the Caravan Quarrel"
 zin_east_feed_the_quarrel_desc:0 "The Council's friends in Furvior and Postondoroth are asked to remember each other's slights. The eastern branch pays for a few well-placed rumours. The rivalry worsens, and the Council's veil is a little thinner."
 zin_east_free_crown_kin:0 "Crowns That Did Not Kneel"
 zin_east_free_crowns:0 "The Free Crowns"
 zin_east_free_crowns_desc:0 "Crowns that would not kneel to [zin_loc_deliverer] hold together, because they know what each would be alone."
 zin_east_gifts_to_king:0 "Gifts to the King"
 zin_east_host_delayed:0 "Delayed the Host"
 zin_east_invite_to_league:0 "Invite [FROM.GetName] into the League"
 zin_east_invite_to_league_desc:0 "A court that leans this far is ready to swear. Send the invitation with a feast, and see whether it sits at your table or looks at the door."
 zin_east_kings_debt:0 "The King's Debt"
 zin_east_kings_debt_desc:0 "The levies are home and the host is gone, but the treasury still owes for what the kneeling cost. The clerks go through the books, and nobody enjoys what they find."
 zin_east_knelt:0 "Knelt to the King"
 zin_east_ledger:0 "The Ledger of the East"
 zin_east_ledger_desc:0 "The bankers of Postondoroth lend to princes in trouble and write down what they owe. A loan is a thread; enough threads make a rope."
 zin_east_name_gold:0 "the Gold Road"
 zin_east_name_lake:0 "the Lake Road"
 zin_east_name_rift:0 "the Rift Road"
 zin_east_name_salt:0 "the Salt Road"
 zin_east_name_sand:0 "the Sand Road"
 zin_east_offer_protection:0 "Offer Protection to [FROM.GetName]"
 zin_east_offer_protection_desc:0 "A court that cannot defend itself may be glad of a shield, and a shield casts a long shadow. If it accepts, it becomes your subject."
 zin_east_rally_free_crowns:0 "Rally [FROM.GetName] to the Free Crowns"
 zin_east_rally_free_crowns_desc:0 "Invite a court that would not kneel to stand with the rest. It need only say yes, and it will not stand alone."
 zin_east_rationed_water:0 "Rationed Water"
 zin_east_rationed_water_desc:0 "The wells are low and the skins are counted at the gates. People are patient, as they are always patient, until they are not."
 zin_east_report:0 "Hear the Eastern Report"
 zin_east_report_desc:0 "The eastern branch sends its summary: how many courts are ready, how many have pledged, how many would march."
 zin_east_road_gold_free:0 "The Gold Road: free. Your weight on it: §Y[?zin_east_inf_gold|0]§!."
 zin_east_road_gold_noris:0 "The Gold Road: held by Furvior. Your weight on it: §Y[?zin_east_inf_gold|0]§!."
 zin_east_road_gold_stabilo:0 "The Gold Road: held by Postondoroth. Your weight on it: §Y[?zin_east_inf_gold|0]§!."
 zin_east_road_lake_free:0 "The Lake Road: free. Your weight on it: §Y[?zin_east_inf_lake|0]§!."
 zin_east_road_lake_noris:0 "The Lake Road: held by Furvior. Your weight on it: §Y[?zin_east_inf_lake|0]§!."
 zin_east_road_lake_stabilo:0 "The Lake Road: held by Postondoroth. Your weight on it: §Y[?zin_east_inf_lake|0]§!."
 zin_east_road_rift_free:0 "The Rift Road: free. Your weight on it: §Y[?zin_east_inf_rift|0]§!."
 zin_east_road_rift_noris:0 "The Rift Road: held by Furvior. Your weight on it: §Y[?zin_east_inf_rift|0]§!."
 zin_east_road_rift_stabilo:0 "The Rift Road: held by Postondoroth. Your weight on it: §Y[?zin_east_inf_rift|0]§!."
 zin_east_road_salt_free:0 "The Salt Road: free. Your weight on it: §Y[?zin_east_inf_salt|0]§!."
 zin_east_road_salt_noris:0 "The Salt Road: held by Furvior. Your weight on it: §Y[?zin_east_inf_salt|0]§!."
 zin_east_road_salt_stabilo:0 "The Salt Road: held by Postondoroth. Your weight on it: §Y[?zin_east_inf_salt|0]§!."
 zin_east_road_sand_free:0 "The Sand Road: free. Your weight on it: §Y[?zin_east_inf_sand|0]§!."
 zin_east_road_sand_noris:0 "The Sand Road: held by Furvior. Your weight on it: §Y[?zin_east_inf_sand|0]§!."
 zin_east_road_sand_stabilo:0 "The Sand Road: held by Postondoroth. Your weight on it: §Y[?zin_east_inf_sand|0]§!."
 zin_east_roads:0 "The Caravan Roads"
 zin_east_roads_desc:0 "Five roads cross the East, and Furvior and Postondoroth have never agreed on whose they are. Influence is the weight of a power's factors, wells and guards along a road. The charter goes to the side that can hold it.\n[zin_east_road_salt_line]\n[zin_east_road_gold_line]\n[zin_east_road_rift_line]\n[zin_east_road_lake_line]\n[zin_east_road_sand_line]\nThe rivalry stands at §Y[?global.zin_east_rivalry|0]§! of a hundred."
 zin_east_send_caravan_gold:0 "A Great Caravan on the Gold Road"
 zin_east_send_caravan_gold_desc:0 "The gold of the south must be carried, and the one who carries it is thanked. Send a train that no road lord can ignore."
 zin_east_send_caravan_lake:0 "A Great Caravan on the Lake Road"
 zin_east_send_caravan_lake_desc:0 "Through the highlands to the lake towns, with grain and cloth. The folk of the lakes buy from whoever comes back."
 zin_east_send_caravan_rift:0 "A Great Caravan on the Rift Road"
 zin_east_send_caravan_rift_desc:0 "Salt and glass for the harbours of the rift. Let the sea-captains see that one side of the desert has goods enough."
 zin_east_send_caravan_salt:0 "A Great Caravan on the Salt Road"
 zin_east_send_caravan_salt_desc:0 "Fill the camels, double the guards and send them across the wells of the north. The road remembers who comes with plenty."
 zin_east_send_caravan_sand:0 "A Great Caravan on the Sand Road"
 zin_east_send_caravan_sand_desc:0 "Down the dune road to the pass-lords of the south-west, where every jar of water has a price."
 zin_east_send_court_gifts:0 "Send Gifts to [FROM.GetName]"
 zin_east_send_court_gifts_desc:0 "Horses, spices and a tutor for the heir. A gift is remembered longer than a promise, and the court leans further toward you."
 zin_east_shared_roads:0 "The Concord of the Roads"
 zin_east_shared_roads_desc:0 "Furvior and Postondoroth have agreed that a camel is worth more on the road than behind a ledger. The caravans travel with fewer guards and sell at gentler prices."
 zin_east_talks_at_the_wells:0 "Propose Talks at the Wells"
 zin_east_talks_at_the_wells_desc:0 "Meet the rival's envoys on neutral ground, with water on the table and swords outside. Either they come to talk, or they refuse and the quarrel grows."
 zin_east_talks_held:0 "Talks at the Wells"
 zin_east_temple_loan:0 "Generous Friends"
 zin_east_temple_loan_desc:0 "The relief houses of the temples have lent the treasury enough to pay the soldiers and mend the granaries. Their clerks sit at the back of the council hall and take notes."
 zin_east_undercut_rival:0 "Undercut the Rival"
 zin_east_undercut_rival_desc:0 "Sell salt below its price, buy guides at a loss, pay the rival's wellkeepers to forget their duties. Where both of you are strong, it hurts him more. The quarrel gets worse."
 zin_east_united_crown:0 "The United East"
 zin_east_united_crown_desc:0 "From the rift coast to the southern sands, one court now decides where the caravans may go. It is an outcome of this game, and no history says it must be so."
 zin_east_vindicated:0 "Vindicated"
 zin_east_vindicated_desc:0 "The crown that would not kneel stands in the market with its head up. Nobody now remembers who called it a fool."
 zin_east_wells:0 "Wells"
 zin_east_wells_desc:0 "Stone wells, deep and kept. Anyone who holds this land can feed an army from it, and anyone who takes it will be glad of them."
 zin_east_wells_quarrel:0 "The Quarrel at the Wells"
 zin_east_whisper_of_the_rift:0 "A Whisper of the Rift"
 zin_east_whisper_of_the_rift_desc:0 "Now that the Golden King is dead, the eastern branch lets its friends speak of the green lands across the rift, and of the weak hands that hold them. Every court with strong ties will listen for a year. The Council's veil thins."
 zin_east.10.a:0 "The road is ours."
 zin_east.10.b:0 "We will win it back."
 zin_east.10.c:0 "So it goes."
 zin_east.10.d_court:0 "The charter of [zin_east_last_road_name] has changed hands. The court that owns the road's wells has been told who to deal with in future, and waits to see what it costs."
 zin_east.10.d_loser:0 "The charter of [zin_east_last_road_name] has gone to our rival. The caravans will pay him now, and the road lords sound relieved. We keep the ledgers and the memory."
 zin_east.10.d_winner:0 "The charter of [zin_east_last_road_name] is ours. The clerks have copied the seal, the road lords have sent word, and the caravans wear our colours."
 zin_east.10.t:0 "A Charter Changes Hands"
 zin_east.15.a:0 "Pay the blood-price."
 zin_east.15.b:0 "Punish the raiders."
 zin_east.15.c:0 "Ask for a joint inquiry."
 zin_east.15.d:0 "A caravan was turned from a well at dawn, and by noon three men were dead in the sand. Each side swears the other started it, and each has a story that fits a great deal of what happened. The rest of the road has stopped to see what we do."
 zin_east.15.t:0 "Trouble at the Wells"
 zin_east.16.a:0 "Refuse, and say nothing."
 zin_east.16.b:0 "Agree, and send our clerks."
 zin_east.16.d:0 "Our rival asks that clerks of both courts sit at the well where the men died, and read the sand together. It is a fair offer, and a hard one to refuse in public."
 zin_east.16.t:0 "A Joint Inquiry"
 zin_east.20.a:0 "We have nothing to say to them."
 zin_east.20.b:0 "Let the envoys talk."
 zin_east.20.d:0 "[FROM.GetName] proposes that the two courts meet at a well, with water on the table and no swords inside the tent. It would be a small thing to say yes. It would also be a small thing to say no."
 zin_east.20.t:0 "Talks at the Wells"
 zin_east.21.a:0 "So it stands."
 zin_east.21.d_no:0 "The rival's court has sent back a civil refusal. The envoys did not even take the road. The quarrel is worse for being ignored."
 zin_east.21.d_yes:0 "The rival's envoys came and sat. The talks were long, and nothing was settled, but the tent stayed standing and the tea was drunk. The rivalry eases."
 zin_east.21.t:0 "The Answer from the Wells"
 zin_east.23.a:0 "Not yet."
 zin_east.23.b:0 "We sign."
 zin_east.23.d:0 "[FROM.GetName] offers to share the roads: charters as they are, every road counted half each, the rivalry held down for five years. It is a good offer. It is also an offer a rival makes when he wants to be left alone."
 zin_east.23.t:0 "A Concord of the Roads"
 zin_east.24.a:0 "May it hold."
 zin_east.24.d:0 "Furvior and Postondoroth have signed a concord. Charters will hold as they are, and each court counts every road as half its own. The caravans are said to be singing in the markets, which no caravan has done in living memory."
 zin_east.24.t:0 "The Concord of the Roads"
 zin_east.25.a:0 "Grim news."
 zin_east.25.d:0 "Furvior and Postondoroth are at war. The roads are shut, the wells have guards, and every charter is a claim. The courts between them are choosing which side to fear."
 zin_east.25.t:0 "The Caravan War"
 zin_east.26.a:0 "We fight on."
 zin_east.26.b:0 "Yield the road states."
 zin_east.26.d:0 "[FROM.GetName] offers terms at the well: give up the road states it claims and have peace, or fight on and have the war. The sand is wide and the dead are the same on both sides."
 zin_east.26.t:0 "Terms at the Wells"
 zin_east.27.a:0 "The roads reopen."
 zin_east.27.d:0 "The Caravan War is over. The loser has given up the road states it held, and the winner has lifted the guards from the wells. The caravans are already moving again."
 zin_east.27.t:0 "The Caravan Peace"
 zin_east.30.a:0 "Decline politely."
 zin_east.30.b:0 "Accept the loan."
 zin_east.30.c:0 "Borrow from Postondoroth instead."
 zin_east.30.d:0 "A clerk of the relief houses has come to the treasury with a small, sealed chest. The temples have heard that the court is short of coin, he says, and they would be glad to help. The interest is gentle, and the clerk smiles often. The temple at the corner has been painted lately, and it has a new roof."
 zin_east.30.t:0 "The Generous Friends Offer a Loan"
 zin_east.31.a:0 "Noted."
 zin_east.31.d:0 "The eastern branch has sent its summary to the Council. [?global.zin_east_rep_footholds|0] courts are held by three footholds or more. [?global.zin_east_rep_pledged|0] have pledged themselves to the faithful. [?global.zin_east_rep_ready|0] would march if the rift were opened. Court by court:\n[Y11.GetName]: footholds §Y[?Y11.zin_footholds|0]§!, leaning to the faithful §Y[?Y11.zin_east_kneel_bias|0]§!, ready to march §Y[?Y11.zin_east_coalition_weight|0]§!.\n[Y12.GetName]: footholds §Y[?Y12.zin_footholds|0]§!, leaning to the faithful §Y[?Y12.zin_east_kneel_bias|0]§!, ready to march §Y[?Y12.zin_east_coalition_weight|0]§!.\n[Y13.GetName]: footholds §Y[?Y13.zin_footholds|0]§!, leaning to the faithful §Y[?Y13.zin_east_kneel_bias|0]§!, ready to march §Y[?Y13.zin_east_coalition_weight|0]§!.\n[Y14.GetName]: footholds §Y[?Y14.zin_footholds|0]§!, leaning to the faithful §Y[?Y14.zin_east_kneel_bias|0]§!, ready to march §Y[?Y14.zin_east_coalition_weight|0]§!.\n[Y15.GetName]: footholds §Y[?Y15.zin_footholds|0]§!, leaning to the faithful §Y[?Y15.zin_east_kneel_bias|0]§!, ready to march §Y[?Y15.zin_east_coalition_weight|0]§!.\n[Y16.GetName]: footholds §Y[?Y16.zin_footholds|0]§!, leaning to the faithful §Y[?Y16.zin_east_kneel_bias|0]§!, ready to march §Y[?Y16.zin_east_coalition_weight|0]§!.\n[Y17.GetName]: footholds §Y[?Y17.zin_footholds|0]§!, leaning to the faithful §Y[?Y17.zin_east_kneel_bias|0]§!, ready to march §Y[?Y17.zin_east_coalition_weight|0]§!.\n[Y18.GetName]: footholds §Y[?Y18.zin_footholds|0]§!, leaning to the faithful §Y[?Y18.zin_east_kneel_bias|0]§!, ready to march §Y[?Y18.zin_east_coalition_weight|0]§!.\n[Y56.GetName]: footholds §Y[?Y56.zin_footholds|0]§!, leaning to the faithful §Y[?Y56.zin_east_kneel_bias|0]§!, ready to march §Y[?Y56.zin_east_coalition_weight|0]§!.\n[Y57.GetName]: footholds §Y[?Y57.zin_footholds|0]§!, leaning to the faithful §Y[?Y57.zin_east_kneel_bias|0]§!, ready to march §Y[?Y57.zin_east_coalition_weight|0]§!.\n[Y58.GetName]: footholds §Y[?Y58.zin_footholds|0]§!, leaning to the faithful §Y[?Y58.zin_east_kneel_bias|0]§!, ready to march §Y[?Y58.zin_east_coalition_weight|0]§!.\n[Y59.GetName]: footholds §Y[?Y59.zin_footholds|0]§!, leaning to the faithful §Y[?Y59.zin_east_kneel_bias|0]§!, ready to march §Y[?Y59.zin_east_coalition_weight|0]§!.\n[Y5A.GetName]: footholds §Y[?Y5A.zin_footholds|0]§!, leaning to the faithful §Y[?Y5A.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5A.zin_east_coalition_weight|0]§!.\n[Y5B.GetName]: footholds §Y[?Y5B.zin_footholds|0]§!, leaning to the faithful §Y[?Y5B.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5B.zin_east_coalition_weight|0]§!.\n[Y5C.GetName]: footholds §Y[?Y5C.zin_footholds|0]§!, leaning to the faithful §Y[?Y5C.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5C.zin_east_coalition_weight|0]§!.\n[Y5D.GetName]: footholds §Y[?Y5D.zin_footholds|0]§!, leaning to the faithful §Y[?Y5D.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5D.zin_east_coalition_weight|0]§!.\n[Y5E.GetName]: footholds §Y[?Y5E.zin_footholds|0]§!, leaning to the faithful §Y[?Y5E.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5E.zin_east_coalition_weight|0]§!.\n[Y5F.GetName]: footholds §Y[?Y5F.zin_footholds|0]§!, leaning to the faithful §Y[?Y5F.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5F.zin_east_coalition_weight|0]§!.\n[Y5G.GetName]: footholds §Y[?Y5G.zin_footholds|0]§!, leaning to the faithful §Y[?Y5G.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5G.zin_east_coalition_weight|0]§!.\n[Y5H.GetName]: footholds §Y[?Y5H.zin_footholds|0]§!, leaning to the faithful §Y[?Y5H.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5H.zin_east_coalition_weight|0]§!.\n[Y5I.GetName]: footholds §Y[?Y5I.zin_footholds|0]§!, leaning to the faithful §Y[?Y5I.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5I.zin_east_coalition_weight|0]§!.\n[Y5J.GetName]: footholds §Y[?Y5J.zin_footholds|0]§!, leaning to the faithful §Y[?Y5J.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5J.zin_east_coalition_weight|0]§!.\n[Y5K.GetName]: footholds §Y[?Y5K.zin_footholds|0]§!, leaning to the faithful §Y[?Y5K.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5K.zin_east_coalition_weight|0]§!.\n[Y5L.GetName]: footholds §Y[?Y5L.zin_footholds|0]§!, leaning to the faithful §Y[?Y5L.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5L.zin_east_coalition_weight|0]§!.\n[Y5M.GetName]: footholds §Y[?Y5M.zin_footholds|0]§!, leaning to the faithful §Y[?Y5M.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5M.zin_east_coalition_weight|0]§!.\n[Y5N.GetName]: footholds §Y[?Y5N.zin_footholds|0]§!, leaning to the faithful §Y[?Y5N.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5N.zin_east_coalition_weight|0]§!.\n[Y5O.GetName]: footholds §Y[?Y5O.zin_footholds|0]§!, leaning to the faithful §Y[?Y5O.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5O.zin_east_coalition_weight|0]§!.\n[Y5P.GetName]: footholds §Y[?Y5P.zin_footholds|0]§!, leaning to the faithful §Y[?Y5P.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5P.zin_east_coalition_weight|0]§!.\n[Y5Q.GetName]: footholds §Y[?Y5Q.zin_footholds|0]§!, leaning to the faithful §Y[?Y5Q.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5Q.zin_east_coalition_weight|0]§!.\n[Y5R.GetName]: footholds §Y[?Y5R.zin_footholds|0]§!, leaning to the faithful §Y[?Y5R.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5R.zin_east_coalition_weight|0]§!.\n[Y5S.GetName]: footholds §Y[?Y5S.zin_footholds|0]§!, leaning to the faithful §Y[?Y5S.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5S.zin_east_coalition_weight|0]§!.\n[Y5T.GetName]: footholds §Y[?Y5T.zin_footholds|0]§!, leaning to the faithful §Y[?Y5T.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5T.zin_east_coalition_weight|0]§!.\n[Y5U.GetName]: footholds §Y[?Y5U.zin_footholds|0]§!, leaning to the faithful §Y[?Y5U.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5U.zin_east_coalition_weight|0]§!.\n[Y5V.GetName]: footholds §Y[?Y5V.zin_footholds|0]§!, leaning to the faithful §Y[?Y5V.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5V.zin_east_coalition_weight|0]§!.\n[Y5W.GetName]: footholds §Y[?Y5W.zin_footholds|0]§!, leaning to the faithful §Y[?Y5W.zin_east_kneel_bias|0]§!, ready to march §Y[?Y5W.zin_east_coalition_weight|0]§!.\nThe master, [zin_loc_deliverer], has been told."
 zin_east.31.t:0 "Report of the Eastern Branch"
 zin_east.32.a:0 "Write it in the book."
 zin_east.32.d:0 "[FROM.GetName] was offered a loan by the generous friends and came to our bankers instead. The loan is small and the interest fair. The temples will not be pleased, and that is a matter for the court, not the ledger."
 zin_east.32.t:0 "A Debtor Comes to Postondoroth"
 zin_east.35.a:0 "Mark the wells they found."
 zin_east.35.b:0 "Sell the stories."
 zin_east.35.d:0 "A caravan went south past the last well and walked into the dunes. It came back three months later with salt, glass and stories, and half the men could not say how far they had been. The wells they found are marked on the best map we have."
 zin_east.35.t:0 "Into the Deep Sand"
 zin_east.36.a:0 "Ration the water."
 zin_east.36.b:0 "Dig deeper."
 zin_east.36.d:0 "The wells are low this year. The diggers say they can go deeper, if there is coin for rope and stone. The elders say the water will come back, if people use less. Both are probably right."
 zin_east.36.t:0 "Dry Wells"
 zin_east.40.a:0 "Old tales."
 zin_east.40.b:0 "Rich lands, weak kings."
 zin_east.40.d:0 "Envoys back from the rift coast speak of a country across the water, rich in cattle and glass and ruled by a kingdom in trouble. Some say it is there for the taking. Others say it is only an old tale. The court listens, and the court decides which kind of people it is."
 zin_east.40.t:0 "Envoys Speak of the Rift"
 zin_east.70.a:0 "Decline."
 zin_east.70.b:0 "Join."
 zin_east.70.d_free:0 "[FROM.GetName] invites us to stand with the Free Crowns. We would not be alone, it says, and we have not been alone since we refused. It is true as far as it goes."
 zin_east.70.d_noris:0 "Furvior invites us to sit with the Noris Treaty. The envoys are polite and the terms are written on good paper. A court that sits at that table is protected, and also watched."
 zin_east.70.d_stabilo:0 "Postondoroth invites us to join the Stabilo Pact. The bankers have brought copies of the terms in three languages. A court that signs the Pact is never poor, and never quite free."
 zin_east.70.t:0 "An Invitation"
 zin_east.71.a:0 "Refuse."
 zin_east.71.b:0 "Accept."
 zin_east.71.d:0 "[FROM.GetName] offers us a shield. The envoy says it as if it were a gift, and the shield is very large. If we accept, we become a subject. If we refuse, we will remember that we were asked."
 zin_east.71.t:0 "An Offer of Protection"
 zin_east.72.a:0 "So be it."
 zin_east.72.d_no:0 "The court has said no. The envoys came back with polite words, and not a great deal else."
 zin_east.72.d_yes:0 "The court has said yes. The envoys came back with signed papers and an invitation to dinner."
 zin_east.72.t:0 "The Answer of the Courts"
 zin_east.73.a:0 "Refuse."
 zin_east.73.b:0 "Pay homage."
 zin_east.73.d:0 "[FROM.GetName] calls itself High King of the East and asks our crown to bow. The ask is made in a great hall, before witnesses, so that refusal will be public too."
 zin_east.73.t:0 "The High King Asks Homage"
 zin_east.80.a:0 "A new age."
 zin_east.80.d:0 "[FROM.GetName] has called every eastern court to a great hall and, one by one, the courts have come. The East has one crown, and it is not the one the old stories promised. It is an outcome of this game, and no history says it must be so."
 zin_east.80.t:0 "The East United"
 zin_stabilo_call_in_debt:0 "Call In a Debt from [FROM.GetName]"
 zin_stabilo_call_in_debt_desc:0 "Send a clerk to the gate with the ledger open. The court may pay in gold, pay in iron, or refuse and live with the consequences."
 zin_stabilo_forgive_debt:0 "Forgive Part of the Debt of [FROM.GetName]"
 zin_stabilo_forgive_debt_desc:0 "Draw a line through twenty in the ledger. A court that is forgiven leans to the one who forgave it, and tells its neighbours."
 zin_stabilo_great_loan:0 "Lend a Great Sum to [FROM.GetName]"
 zin_stabilo_great_loan_desc:0 "A king's loan, in coin by the cartload. A great court that takes it will remember who its creditor is."
 zin_stabilo_lend:0 "Lend to [FROM.GetName]"
 zin_stabilo_lend_desc:0 "The bankers of Postondoroth offer a loan at a fair rate. If the court accepts, it owes the ledger and leans a little to the lender."
