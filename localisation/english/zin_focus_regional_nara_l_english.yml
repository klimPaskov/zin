l_english:
 zin_regional_nara_a_welcome_on_every_shore:0 "A Welcome on Every Shore"
 zin_regional_nara_a_welcome_on_every_shore_desc:0 "From the largest island to the smallest skerry, every beach in [ROOT.GetName] has a fire, a boat-shed and someone to keep the door open. Sailors say they would rather be wrecked here than anywhere else."
 zin_regional_nara_ancha_fisheries:0 "Fisheries of Ancha"
 zin_regional_nara_ancha_fisheries_desc:0 "Smoke-houses stand in every village, and the smell of drying fish carries across the water. Nara's smoked fish is sold on every quay from the isles to the coast."
 zin_regional_nara_carry_it_to_gala:0 "Carry It to Gala"
 zin_regional_nara_carry_it_to_gala_desc:0 "The islanders have a saying: when the tales of men grow too old for any man to explain, carry them to Gala. A boat is fitted out with a scribe, a drum and a bundle of the island's oldest songs."
 zin_regional_nara_carry_it_to_gala_tip_1:0 "When the tales of men grow too old for any man to explain, carry them to Gala."
 zin_regional_nara_charts_of_the_southern_seas:0 "Charts of the Southern Seas"
 zin_regional_nara_charts_of_the_southern_seas_desc:0 "Charts woven from palm-ribs and shells record the currents, reefs and island-chains of the southern seas. A navigator can read the whole weave at a glance."
 zin_regional_nara_close_the_houses_of_the_isle:0 "Close the Houses of the Isle"
 zin_regional_nara_close_the_houses_of_the_isle_desc:0 "The house on the quay is shuttered, the well sealed and the healers' ledgers surrendered to the elders. The island's kindness has limits, and the elders have chosen where they lie."
 zin_regional_nara_elders_moot:0 "The Elders' Moot"
 zin_regional_nara_elders_moot_desc:0 "The elders of every village sit in a ring on the beach, the eldest on a driftwood log. A matter is settled when the ring has been round three times."
 zin_regional_nara_eldest_speaks:0 "The Eldest Speaks"
 zin_regional_nara_eldest_speaks_desc:0 "Nara's eldest wears the island's name and speaks for the moot with a voice that carries from point to point. Her words are repeated at every hearth before the tide turns."
 zin_regional_nara_far_from_the_kings_wars:0 "Far From the Kings' Wars"
 zin_regional_nara_far_from_the_kings_wars_desc:0 "The island declares that the wars of the great are not its wars. The harbour is closed to warships, the boats stay in their sheds, and the elders send word to every side that [ROOT.GetName] wants only to be left alone."
 zin_regional_nara_far_from_the_war:0 "Far From the Kings' Wars"
 zin_regional_nara_far_from_the_war_desc:0 "The harbour is closed to warships and the boats stay in their sheds. The island wants only to be left alone."
 zin_regional_nara_fisherfolk_of_ancha:0 "Fisherfolk of Ancha"
 zin_regional_nara_fisherfolk_of_ancha_desc:0 "Ancha has more fishers than farmers, and more boats than roads. A new fish-quay is built at each of the larger villages, and the nets are mended in the open air."
 zin_regional_nara_galleys_of_the_isles:0 "Galleys of the Isles"
 zin_regional_nara_galleys_of_the_isles_desc:0 "Long galleys with a hundred paddles and a high stern take shape in the boat-sheds of [ROOT.GetName]. They are built for speed, for the open sea and for crews that sing while they row."
 zin_regional_nara_guest_right:0 "The Guest-Right"
 zin_regional_nara_guest_right_desc:0 "No guest is turned from a door. He is fed, warmed and housed for three days before anyone asks his name."
 zin_regional_nara_healers_at_the_quays:0 "Healers at the Quays"
 zin_regional_nara_healers_at_the_quays_desc:0 "Healers in grey robes tend the sick on the quay and feed the hungry."
 zin_regional_nara_hulls_for_hire:0 "Hulls for Hire"
 zin_regional_nara_hulls_for_hire_desc:0 "The kings of the West are looking for hulls to cross the sea, and the boatwrights of [ROOT.GetName] have a dozen to hire. Western agents arrive with silver and leave with promises."
 zin_regional_nara_island_feasts:0 "Island Feasts"
 zin_regional_nara_island_feasts_desc:0 "Visitors arrive in ones and twos, then in boatloads. The islanders of [ROOT.GetName] roast what they have, pour what they have and sing until the moon has set."
 zin_regional_nara_island_navigators:0 "Island Navigators"
 zin_regional_nara_island_navigators_desc:0 "The navigators of [ROOT.GetName] read the sea by the swell, the stars and the flight of birds. They cross open water without chart or compass, and they have never been known to miss a landfall."
 zin_regional_nara_island_navigators_spirit:0 "Island Navigators"
 zin_regional_nara_island_navigators_spirit_desc:0 "The navigators read the sea by the swell, the stars and the flight of birds."
 zin_regional_nara_lamps_on_the_reefs:0 "Lamps on the Reefs"
 zin_regional_nara_lamps_on_the_reefs_desc:0 "Tallow lamps are hung on poles above the dangerous reefs, lit at dusk by children who are paid in sweet cakes. Ships that once smashed on the rocks now pass them in the dark."
 zin_regional_nara_lights_on_the_reef:0 "Lights on the Reef"
 zin_regional_nara_lights_on_the_reef_desc:0 "A line of lamps is lit on the rocks each dusk, and a keeper is sent out in a skiff to trim them. The reef is still dangerous, but it is no longer dark."
 zin_regional_nara_masters_of_the_southern_seas:0 "Masters of the Southern Seas"
 zin_regional_nara_masters_of_the_southern_seas_desc:0 "The navigators of [ROOT.GetName] are called the best in the south, and no one argues. Their boats have been to every shore and their charts hang in every harbour-house."
 zin_regional_nara_navigators_for_gala:0 "Navigators for Gala"
 zin_regional_nara_navigators_for_gala_desc:0 "Gala sends word that it needs navigators who know the southern seas, and the best of [ROOT.GetName] sign on. They sail with a king's blessing and come home with strange stories."
 zin_regional_nara_night_custom:0 "No Boat at Night"
 zin_regional_nara_night_custom_desc:0 "After dark the boats are drawn up above the tide-line and the lamps are shaded. The catch is smaller and the fishers come home."
 zin_regional_nara_no_boat_at_night:0 "No Boat at Night"
 zin_regional_nara_no_boat_at_night_desc:0 "The custom is made law: after dark the boats stay on the sand. The catch is smaller, the funerals are fewer, and the elders say the trade is fair."
 zin_regional_nara_priests_at_the_quays:0 "Priests at the Quays"
 zin_regional_nara_priests_at_the_quays_desc:0 "Grey-robed priests from the north have begun to meet the ships, offering blessings, bread and news. The islanders of [ROOT.GetName] are polite to them, and a little curious."
 zin_regional_nara_reef_lamps:0 "Lamps on the Reefs"
 zin_regional_nara_reef_lamps_desc:0 "Tallow lamps on poles mark the dangerous reefs, and ships that once smashed on the rocks now pass them in the dark."
 zin_regional_nara_reef_lights:0 "Lights on the Reef"
 zin_regional_nara_reef_lights_desc:0 "Beacon-fires burn on the reef at dusk and are fed with driftwood until dawn. Passing ships steer by them and are grateful."
 zin_regional_nara_send_them_on_their_way:0 "Send Them on Their Way"
 zin_regional_nara_send_them_on_their_way_desc:0 "The elders of [ROOT.GetName] thank the priests for their kindness, give them a good meal and put them on the next boat out. There is no insult in it, only the island's way of keeping what is its own."
 zin_regional_nara_shelter_for_the_wrecked:0 "Shelter for the Wrecked"
 zin_regional_nara_shelter_for_the_wrecked_desc:0 "A reef-wardens' hut is raised on every headland, stocked with dry blankets, salt fish and a signal horn. When a ship goes down, the islanders pull the survivors ashore before the tide has turned."
 zin_regional_nara_ships_for_the_strangers_host:0 "Ships for the Gathering Host"
 zin_regional_nara_ships_for_the_strangers_host_desc:0 "When a host gathers against the dead, the isles can send it boats and men."
 zin_regional_nara_smoked_fish_for_the_ships:0 "Smoked Fish for the Ships"
 zin_regional_nara_smoked_fish_for_the_ships_desc:0 "Smoked fish keeps for a year, and ships' captains buy it by the barrel. The smokers sell from the quay and keep their recipes in their families."
 zin_regional_nara_southern_seas:0 "Masters of the Southern Seas"
 zin_regional_nara_southern_seas_desc:0 "The best navigators in the south, and no one argues."
 zin_regional_nara_the_catch_of_ancha:0 "The Catch of Ancha"
 zin_regional_nara_the_catch_of_ancha_desc:0 "Salted, smoked and dried fish fill the storehouses of every village, and the elders see to it that no household goes without. A lean winter on Ancha is a quiet one."
 zin_regional_nara_the_elders_law:0 "The Elders' Law"
 zin_regional_nara_the_elders_law_desc:0 "The old law is cut on a row of driftwood posts at the head of the beach, and the posts are replaced as they rot. A fisher who breaks it must repair a post."
 zin_regional_nara_the_elders_moot:0 "The Elders' Moot"
 zin_regional_nara_the_elders_moot_desc:0 "The elders meet on the beach at the new moon, and the villages send word of their needs. The moot has never voted: it has waited, and the matter has settled itself."
 zin_regional_nara_the_elders_of_ancha:0 "The Elders of Ancha"
 zin_regional_nara_the_elders_of_ancha_desc:0 "Nara is the island of Ancha, a long coast of fishing villages ruled by a moot of elders. Its eldest speaks for all, and wants nothing from the wider world but fair prices for smoked fish."
 zin_regional_nara_the_eldest_speaks:0 "The Eldest Speaks"
 zin_regional_nara_the_eldest_speaks_desc:0 "The eldest takes the island's own name and a staff of grey wood, and speaks first in every gathering. Nobody on Ancha can remember a time when she did not."
 zin_regional_nara_the_guest_right:0 "The Guest-Right"
 zin_regional_nara_the_guest_right_desc:0 "No wrecked sailor, no stray fisherman and no weary traveller has ever been turned from a door in [ROOT.GetName]. A guest is fed, warmed and housed for three days before anyone asks his name."
 zin_regional_nara_the_isles_stand_together:0 "The Isles Stand Together"
 zin_regional_nara_the_isles_stand_together_desc:0 "Boats go out to every neighbouring island carrying a knotted cord, the island way of saying that peace is promised. [ROOT.GetName] and its neighbours agree to keep the peace between them for as long as the war lasts."
 zin_regional_nara_the_net_menders:0 "The Net-Menders"
 zin_regional_nara_the_net_menders_desc:0 "Net-menders work in long sheds on the beaches, twisting hemp into line and knotting line into mesh. A new net is blessed with the first catch."
 zin_regional_nara_the_reef_of_voices:0 "The Reef of Voices"
 zin_regional_nara_the_reef_of_voices_desc:0 "Off the eastern point lies a reef where drowned voices are said to call ships onto the rocks. The fishers will not cross it at night, and nobody asks them why."
 zin_regional_nara_the_reef_pilots:0 "The Reef Guides"
 zin_regional_nara_the_reef_pilots_desc:0 "Fishers who know the reef by heart are paid to guide passing ships through the channel by daylight. They carry a bell, a pole and a very long memory."
 zin_regional_nara_the_silent_reef:0 "The Silent Reef"
 zin_regional_nara_the_silent_reef_desc:0 "Since the storm year the voices have gone quiet, and the fishers have begun to talk of crossing the reef by night again. The elders listen and say little."
 zin_regional_nara_the_storm_years:0 "The Storm Years"
 zin_regional_nara_the_storm_years_desc:0 "Word arrives by every boat that the kings of the north and west are at war. The islanders of [ROOT.GetName] look out across the empty sea, count their stores and decide to keep the war on the far side of the horizon."
 zin_regional_nara_voices_of_the_villages:0 "Voices of the Villages"
 zin_regional_nara_voices_of_the_villages_desc:0 "Each village sends a speaker to the moot, chosen by the women who mend the nets and the men who mind the boats. The speakers stand, one at a time, and are heard."
 zin_regional_nara_watch_the_southern_waves:0 "Watch the Southern Waves"
 zin_regional_nara_watch_the_southern_waves_desc:0 "Whatever else the war brings, it may bring ships. Lookouts take their places on the headlands of [ROOT.GetName], and the boats are kept ready on their rollers."
 zin_regional_nara_welcome_the_healers:0 "Welcome the Healers"
 zin_regional_nara_welcome_the_healers_desc:0 "The healers of the Deliverer ask for a house on the quay, where the sick can be tended and the hungry fed. [ROOT.GetName] gives them a building, a well and a cautious welcome."
 zin_regional_nara.1.a:0 "Keep the old custom"
 zin_regional_nara.1.b:0 "Let the bold ones go"
 zin_regional_nara.1.d:0 "Young fishers want to cross the reef at night, where the catch is best. The old ones say that voices are heard on the water there, and that no boat has ever come back who answered."
 zin_regional_nara.1.t:0 "The Reef at Night"
 zin_regional_nara.2.a:0 "Keep the custom anyway"
 zin_regional_nara.2.b:0 "Cross at night again"
 zin_regional_nara.2.d:0 "Since the storm year, nobody has heard the voices on the reef. The fishers say that a stranger carried the stranded children home through the surf, and that afterwards the sea went quiet."
 zin_regional_nara.2.t:0 "The Silent Reef"
