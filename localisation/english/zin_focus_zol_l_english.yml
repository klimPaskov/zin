l_english:
 zin_zol_a_concealed_allegiance:0 "A Concealed Allegiance"
 zin_zol_a_concealed_allegiance_desc:0 "Those who serve do so quietly. No banner is raised and no name is spoken, and the north goes on being quiet."
 zin_zol_a_fraction_of_a_god:0 "The Servant Called"
 zin_zol_a_fraction_of_a_god_desc:0 "What the north can spare of its master's strength may be lent, for a short time and at a great price, to the one who serves him best, and it is not a thing to be done lightly."
 zin_zol_a_greater_hour:0 "A Greater Hour"
 zin_zol_a_greater_hour_desc:0 "A greater hour than the first. The north will wait until the living are tired and the age is nearly done."
 zin_zol_a_presence_deepened:0 "A Presence Deepened"
 zin_zol_a_presence_deepened_desc:0 "The presence deepens. It cannot be seen, but the cold has grown, and the nights are longer than they were."
 zin_zol_a_presence_vast_and_quiet:0 "A Presence Vast and Quiet"
 zin_zol_a_presence_vast_and_quiet_desc:0 "The presence is vast and quiet. It does not move, it does not speak, and it fills the whole of the north."
 zin_zol_a_road_toward_the_south:0 "A Road Toward the South"
 zin_zol_a_road_toward_the_south_desc:0 "The roads of power run together toward a single point in the south. The north has begun to prepare for it."
 zin_zol_a_seat_without_a_face:0 "A Seat Without a Face"
 zin_zol_a_seat_without_a_face_desc:0 "The seat is kept. It has a hand and a voice, and no face. Those who come to Furviatlon are not told whom they have met."
 zin_zol_against_the_fading:0 "Against the Fading"
 zin_zol_against_the_fading_desc:0 "The Fading erodes what is old. The presence leans against it and, for a time, holds."
 zin_zol_against_the_middle_kingdom:0 "Against the Middle Kingdom"
 zin_zol_against_the_middle_kingdom_desc:0 "The dead march south against the Golden Kingdom. The road is open and there is no one to stop them."
 zin_zol_alone_against_all:0 "Alone Against All"
 zin_zol_alone_against_all_desc:0 "The north takes no ally. Every living thing and every other dark is its enemy, and it will meet them all alone."
 zin_zol_alone_against_all_spirit:0 "Alone Against All"
 zin_zol_alone_against_all_spirit_desc:0 "The north takes no ally. Every living thing and every other dark is its enemy."
 zin_zol_black_hulls:0 "Black Hulls"
 zin_zol_black_hulls_desc:0 "Hulls of black wood are built in the shadow of the islands. They have no crews that can be seen, and they sail well."
 zin_zol_black_hulls_spirit:0 "Black Hulls"
 zin_zol_black_hulls_spirit_desc:0 "Hulls of black wood sail without crews that can be seen. They keep station in the dark and do not tire."
 zin_zol_death_marches:0 "Death Marches South"
 zin_zol_death_marches_desc:0 "Death marches south. The roads lie empty before it and the living huddle behind their walls."
 zin_zol_death_marches_south:0 "Death Marches South"
 zin_zol_death_marches_south_desc:0 "Death marches south. Roads lie empty before it, and the living huddle behind their walls."
 zin_zol_deathless_1:0 "The Deathless"
 zin_zol_deathless_1_desc:0 "These are not the dead of the old tales. They do not wail, they do not wander, and they do not forget their orders."
 zin_zol_deathless_2:0 "Shapes Broken, Not Ended"
 zin_zol_deathless_2_desc:0 "A shape that is broken is not ended. It is gathered, mended and put back into the line."
 zin_zol_deathless_3:0 "Deathless Endurance"
 zin_zol_deathless_3_desc:0 "The dead do not tire and now they do not break. Their line holds through blows that would turn a living army."
 zin_zol_deathless_endurance:0 "Deathless Endurance"
 zin_zol_deathless_endurance_desc:0 "The dead do not tire, and now they do not break. Their line holds through blows that would turn a living army."
 zin_zol_deeper_service:0 "Deeper Service"
 zin_zol_deeper_service_desc:0 "The service deepens. What the orders give, they give more freely, and what is given is not lost."
 zin_zol_every_black_isle:0 "Every Black Isle"
 zin_zol_every_black_isle_desc:0 "Every black isle wakes. The sea is full of them, and none can be told from another."
 zin_zol_faceless_seat:0 "A Seat Without a Face"
 zin_zol_faceless_seat_2:0 "The Seat Endures"
 zin_zol_faceless_seat_2_desc:0 "The seat endures. It has been strong before, and it will be strong again."
 zin_zol_faceless_seat_desc:0 "Furviatlon is kept. It has a hand and a voice, and no face."
 zin_zol_gods_who_serve:0 "Gods Who Serve an Older God"
 zin_zol_gods_who_serve_desc:0 "Younger gods have bent their knees to an older god. Why they have done so is not recorded."
 zin_zol_grave_arms:0 "Grave Arms"
 zin_zol_grave_arms_desc:0 "Arms are taken from the graves of the old wars, cleaned, balanced and handed out. They have been waiting too."
 zin_zol_great_host:0 "The Great Host"
 zin_zol_great_host_desc:0 "The Great Host is vast, silent and numbered by the hundred, and it faces south."
 zin_zol_held_and_spent:0 "What Is Held, What Is Spent"
 zin_zol_held_and_spent_desc:0 "What is held, and what is spent, are weighed together. The presence may draw on its store, but each drawing leaves it thinner."
 zin_zol_hulls_without_living_crews:0 "Hulls Without Living Crews"
 zin_zol_hulls_without_living_crews_desc:0 "The hulls sail without living crews. They keep station in the dark, and they do not tire."
 zin_zol_into_the_dark_again:0 "Into the Dark Again"
 zin_zol_into_the_dark_again_desc:0 "The servant has gone back into the dark he came from, wounded and silent, and the presence gathers itself again around the black isles."
 zin_zol_it_grows_each_day:0 "It Grows Each Day"
 zin_zol_it_grows_each_day_desc:0 "It grows, slowly, each day. No one remarks on it, because no one is looking."
 zin_zol_keep_the_isles_dark:0 "Keep the Isles Dark"
 zin_zol_keep_the_isles_dark_desc:0 "The islands are kept dark. Fishermen who stray near them are turned back by fog, and their tales die in the harbour."
 zin_zol_labours_of_the_lesser:0 "Labours of the Lesser"
 zin_zol_labours_of_the_lesser_desc:0 "The lesser labour in places where no one goes, and their work is seen only when it is not done."
 zin_zol_landing_grounds:0 "Landing Grounds"
 zin_zol_landing_grounds_desc:0 "Landing grounds are prepared on shores no one visits. They are flat, dark and ready."
 zin_zol_landing_grounds_spirit:0 "Landing Grounds"
 zin_zol_landing_grounds_spirit_desc:0 "Flat, dark landing grounds lie ready on shores no one visits."
 zin_zol_let_them_talk:0 "Let Them Talk"
 zin_zol_let_them_talk_desc:0 "The fishermen talk of lights and shapes in the water. The north does nothing to stop them, and the tales spread."
 zin_zol_long_war:0 "The Long War of the Dead"
 zin_zol_long_war_desc:0 "The war of the dead does not end in a season. It ends when the dead decide to stop."
 zin_zol_matters_for_another_age:0 "Matters for Another Age"
 zin_zol_matters_for_another_age_desc:0 "There are matters for another age. The north is silent now, and it waits."
 zin_zol_no_hunger:0 "No Hunger, No Cold"
 zin_zol_no_hunger_desc:0 "They feel neither hunger nor cold. A march that would kill a living army is for them only a march."
 zin_zol_no_hunger_no_cold:0 "No Hunger, No Cold"
 zin_zol_no_hunger_no_cold_desc:0 "They feel neither hunger nor cold. A march that would kill a living army is for them only a march."
 zin_zol_not_as_elzons_dead:0 "Not as Elzon's Dead"
 zin_zol_not_as_elzons_dead_desc:0 "These are not the dead of the old tales. They do not wail, they do not wander, and they do not forget their orders."
 zin_zol_old_strength_bent:0 "Old Strength Bent to Service"
 zin_zol_old_strength_bent_desc:0 "Strength that once ruled is turned, without complaint, to a quieter use. The north does not ask for gratitude."
 zin_zol_older_than_kings:0 "Older Than Kings"
 zin_zol_older_than_kings_desc:0 "The north was old before the first crown of men was forged. What was already old does not hurry."
 zin_zol_open_service:0 "Service Unhidden"
 zin_zol_open_service_desc:0 "The service is given openly. It cannot be described, but it can be seen, and the north grows stronger for it."
 zin_zol_orders_apart:0 "Orders Apart"
 zin_zol_orders_apart_desc:0 "The three orders are kept apart, as water is kept from pitch. What each gives, none of the others learns."
 zin_zol_out_of_the_isles:0 "Out of the Isles"
 zin_zol_out_of_the_isles_desc:0 "The dead come out of the isles. They walk on water that is not frozen and pass through fog that has no end."
 zin_zol_out_of_the_isles_spirit:0 "Out of the Isles"
 zin_zol_out_of_the_isles_spirit_desc:0 "The dead come out of the isles over water that is not frozen and through fog that has no end."
 zin_zol_patience:0 "The Patient Dark"
 zin_zol_patience_2:0 "A Presence Vast and Quiet"
 zin_zol_patience_2_desc:0 "The presence is vast and quiet. It does not move, it does not speak, and it fills the whole of the north."
 zin_zol_patience_desc:0 "The dark is patient. It has waited since before the first king and can wait for the last."
 zin_zol_presence_takes_form:0 "The Servant Takes the Field"
 zin_zol_presence_takes_form_desc:0 "His most loyal servant stands on the field, vast and dark and silent, and the ground he stands upon goes quiet around him."
 zin_zol_reluctance_of_gods:0 "The Reluctance of Gods"
 zin_zol_reluctance_of_gods_desc:0 "Not every god gives gladly. Some give little, some give late, and some give nothing at all."
 zin_zol_routes_beneath_the_isles:0 "Routes Beneath the Isles"
 zin_zol_routes_beneath_the_isles_desc:0 "Beneath the islands, other roads run. They join and part like veins, and all of them lead south."
 zin_zol_servants_at_war:0 "Servants at War"
 zin_zol_servants_at_war_desc:0 "The orders go to war beside the dead. Their work is seen in the ranks, and it is not described."
 zin_zol_servants_at_war_spirit:0 "Servants at War"
 zin_zol_servants_at_war_spirit_desc:0 "The orders go to war beside the dead, and their work is seen in the ranks."
 zin_zol_servants_unseen:0 "Servants Unseen"
 zin_zol_servants_unseen_desc:0 "The service continues, as it always has, out of sight. It is neither asked nor told, and the north does not speak of it."
 zin_zol_service_without_end:0 "Service Without End"
 zin_zol_service_without_end_desc:0 "The service has no term. It was not asked for a season, and it will not be released at the end of one."
 zin_zol_service_without_shame:0 "Service Without Shame"
 zin_zol_service_without_shame_desc:0 "Those who serve do so openly. Their names are not written, but their work is seen, and the north grows stronger for it."
 zin_zol_shapes_broken_not_ended:0 "Shapes Broken, Not Ended"
 zin_zol_shapes_broken_not_ended_desc:0 "A shape that is broken is not ended. It is gathered, mended and put back into the line."
 zin_zol_silence_of_the_north:0 "The Silence of the North"
 zin_zol_silence_of_the_north_desc:0 "The north is silent, and the silence is not empty. A presence that has no body, no court and no name fills the cold with its patience."
 zin_zol_sodoloro:0 "Šodolôro"
 zin_zol_sodoloro_desc:0 "Šodolôro is a black plain on the northern shore. It is empty now, and it will not always be."
 zin_zol_sodoloro_stirs:0 "Šodolôro Stirs"
 zin_zol_sodoloro_stirs_desc:0 "Šodolôro stirs. The black plain is no longer still, and the dust moves against the wind."
 zin_zol_southward_to_aenor:0 "Southward to Aenor"
 zin_zol_southward_to_aenor_desc:0 "The dead march south toward the Golden Kingdom. The way is long, the road is open, and there is no one to stop them."
 zin_zol_stirring_among_the_isles:0 "Stirring Among the Isles"
 zin_zol_stirring_among_the_isles_desc:0 "The islands stir. Lights have been seen on their shores where no one lives."
 zin_zol_strike_while_they_sleep:0 "Strike While They Sleep"
 zin_zol_strike_while_they_sleep_desc:0 "The south sleeps, and the dead do not. A blow struck now will land before the sleepers wake."
 zin_zol_strike_while_they_sleep_spirit:0 "Strike While They Sleep"
 zin_zol_strike_while_they_sleep_spirit_desc:0 "The south sleeps and the dead do not. A blow struck now will land before the sleepers wake."
 zin_zol_the_appointed_hour:0 "The Appointed Hour"
 zin_zol_the_appointed_hour_desc:0 "There is an hour, and it has been appointed. The north will wait for it, and rise on it, and not before."
 zin_zol_the_black_fleet:0 "The Black Fleet"
 zin_zol_the_black_fleet_desc:0 "The black fleet is assembled in the dark. Its hulls are many, its crews are none, and its course is set."
 zin_zol_the_black_islands:0 "The Black Islands"
 zin_zol_the_black_islands_desc:0 "The black islands lie in the cold sea and are said to be empty. Fishermen who pass them at night say otherwise."
 zin_zol_the_black_wastes:0 "The Black Wastes"
 zin_zol_the_black_wastes_desc:0 "The black wastes harden against intruders. Roads vanish, wells run dry, and the wind carries a sound like a closing door."
 zin_zol_the_brief_accord:0 "The Brief Accord"
 zin_zol_the_brief_accord_desc:0 "A third power has come, and two darknesses have a common foe. The north is willing to hear an offer."
 zin_zol_the_cost_of_form:0 "The Price of the Field"
 zin_zol_the_cost_of_form_desc:0 "The north learns what it must give each week to keep its servant on the field, and learns to give a little less of it."
 zin_zol_the_dead_of_zol:0 "The Dead of Zol"
 zin_zol_the_dead_of_zol_desc:0 "The dead of Zol lie in the black and the cold, and they do not decay. They have been waiting for a long time."
 zin_zol_the_dead_rise:0 "The Dead Rise"
 zin_zol_the_dead_rise_armed:0 "The Dead Rise Armed"
 zin_zol_the_dead_rise_armed_desc:0 "The dead rise, armed and in order. Another host is added to the ranks and takes its place without being told."
 zin_zol_the_dead_rise_desc:0 "The hour has come. The dead rise, the north opens, and the silence ends."
 zin_zol_the_divine_keep_silence:0 "The Divine Keep Their Silence"
 zin_zol_the_divine_keep_silence_desc:0 "The younger gods say nothing of what they give. Silence is their only gift and their entire courtesy."
 zin_zol_the_edge_of_the_woods:0 "The Edge of the Elven Woods"
 zin_zol_the_edge_of_the_woods_desc:0 "The dead come to the edge of the elven woods. The trees watch them, and the trees do not move."
 zin_zol_the_fallen_return:0 "The Fallen Return"
 zin_zol_the_fallen_return_desc:0 "The fallen return, in their time. A fallen soldier of the north is a soldier waiting to be raised."
 zin_zol_the_first_host:0 "The First Host"
 zin_zol_the_first_host_desc:0 "The First Host stands on the black plain. Its ranks are even, its banners are numbered, and it does not tire."
 zin_zol_the_gathered_hosts:0 "The Gathered Hosts"
 zin_zol_the_gathered_hosts_desc:0 "The hosts are gathered, rank by rank, on the plains of the north. They are numbered, and they wait."
 zin_zol_the_grave_march:0 "The Grave March"
 zin_zol_the_grave_march_desc:0 "The dead are taught to march in ranks, at an even pace, for days at a time. They learn easily."
 zin_zol_the_great_bear_the_weight:0 "The Great Bear the Weight"
 zin_zol_the_great_bear_the_weight_desc:0 "The great bear the heaviest portion without being asked. They stand beneath it as pillars stand beneath a roof."
 zin_zol_the_great_host:0 "The Great Host"
 zin_zol_the_great_host_desc:0 "The Great Host assembles at last. It is vast, silent and numbered by the hundred, and it faces south."
 zin_zol_the_great_who_serve:0 "The Great Who Serve"
 zin_zol_the_great_who_serve_desc:0 "The oldest of the orders gives what it gives. Its weight is felt in the cold, in the stillness and in the length of the nights."
 zin_zol_the_hastened_hour:0 "The Hastened Hour"
 zin_zol_the_hastened_hour_desc:0 "The hour may be hastened, at a price. The Fading leans harder on a presence that rushes."
 zin_zol_the_island_hosts:0 "The Island Hosts"
 zin_zol_the_island_hosts_desc:0 "Ranks stand on the islands, in the black, facing the sea. They do not move and they do not speak."
 zin_zol_the_isles_hold:0 "The Isles Hold"
 zin_zol_the_isles_hold_desc:0 "The islands are fortified. Black stone is piled upon black stone, and whatever stands behind them is not seen."
 zin_zol_the_land_made_waste:0 "The Land Made Waste"
 zin_zol_the_land_made_waste_desc:0 "Where the dead have walked, nothing grows. The soil is grey, the wells are dry, and the sky is white."
 zin_zol_the_late_rising:0 "The Late Rising"
 zin_zol_the_late_rising_desc:0 "The late rising comes when the age is spent. The dead walk into a world that has no more strength to resist."
 zin_zol_the_lesser_multitude:0 "The Lesser Multitude"
 zin_zol_the_lesser_multitude_desc:0 "The lesser orders are many, and their labours are small. Together they hold up the long dark."
 zin_zol_the_long_patience:0 "The Long Patience"
 zin_zol_the_long_patience_desc:0 "The north has waited an age. It may wait another, and let the living wear each other down."
 zin_zol_the_long_war_of_the_dead:0 "The Long War of the Dead"
 zin_zol_the_long_war_of_the_dead_desc:0 "The war of the dead is long. It does not end in a season or a year. It ends when the dead decide to stop."
 zin_zol_the_mistake_endures:0 "The Mistake Endures"
 zin_zol_the_mistake_endures_desc:0 "The Mistake endures. It is smaller than it was, but it is whole, and it does not forget."
 zin_zol_the_northern_shores:0 "The Northern Shores"
 zin_zol_the_northern_shores_desc:0 "The dead turn to the northern shores, where the sea-kings keep their strait. They have not been warned."
 zin_zol_the_old_roads_of_power:0 "The Old Roads of Power"
 zin_zol_the_old_roads_of_power_desc:0 "Old roads of power lie open beneath the ice. By whom they were laid, and for what, is not told."
 zin_zol_the_outer_arc:0 "The Outer Arc"
 zin_zol_the_outer_arc_desc:0 "The outer arc of islands is woken. The sea between them is black, and no ship that enters it keeps its course."
 zin_zol_the_patient_dark:0 "The Patient Dark"
 zin_zol_the_patient_dark_desc:0 "The dark is patient. It has waited since before the first king and can wait for the last."
 zin_zol_the_presence_takes_form:0 "The Servant Takes the Field"
 zin_zol_the_presence_takes_form_desc:0 "His most loyal servant stands on the field, vast and dark and silent, and the hosts that march beside him do not falter."
 zin_zol_the_seat_at_furviatlon:0 "The Seat at Furviatlon"
 zin_zol_the_seat_at_furviatlon_desc:0 "Furviatlon is a seat of stone in the north. It is occupied, and who occupies it is not known."
 zin_zol_the_seat_at_furviatlon_tip_1:0 "Who keeps the seat is not known."
 zin_zol_the_seat_endures:0 "The Seat Endures"
 zin_zol_the_seat_endures_desc:0 "The seat endures. The north has been strong before, and it will be strong again."
 zin_zol_the_seats_long_reach:0 "The Seat's Long Reach"
 zin_zol_the_seats_long_reach_desc:0 "The seat's reach is long. Its writ runs to the edge of the ice, and further than anyone has gone to test it."
 zin_zol_the_tending:0 "The Tending"
 zin_zol_the_tending_desc:0 "The presence must be tended as a fire is tended in winter. It requires patience, a steady hand and no thanks."
 zin_zol_the_tireless_march:0 "The Tireless March"
 zin_zol_the_tireless_march_desc:0 "The march continues through the night and the day. The dead reach the end of their road and find that they have not rested."
 zin_zol_the_unanswering_magic:0 "The Unanswering Magic"
 zin_zol_the_unanswering_magic_desc:0 "The magic of Aoaz does not answer an older god. It is a refusal that has lasted an age, and the presence has learned to live inside it."
 zin_zol_the_unending_patience:0 "The Unending Patience"
 zin_zol_the_unending_patience_desc:0 "The north will not rise in this age unless it is struck. It is content, and it asks for nothing."
 zin_zol_the_unpeopled_land:0 "The Unpeopled Land"
 zin_zol_the_unpeopled_land_desc:0 "The land is without people, and it will remain so. A garrison is a small thing in a country that has no one to garrison."
 zin_zol_the_unwatched_north:0 "The Unwatched North"
 zin_zol_the_unwatched_north_desc:0 "The north goes unwatched. Its fires are put out, its roads are left to the snow, and the world forgets that it was ever feared."
 zin_zol_the_wandering_dead:0 "The Wandering Dead"
 zin_zol_the_wandering_dead_desc:0 "The dead walk the wastes. Whose they are is not known, and no one has been willing to ask."
 zin_zol_the_weight_of_the_dead:0 "The Weight of the Dead"
 zin_zol_the_weight_of_the_dead_desc:0 "The weight of the dead is great, and it is gathered. Each fallen soldier adds to the sum."
 zin_zol_the_whole_service:0 "The Whole Service"
 zin_zol_the_whole_service_desc:0 "All three orders give together, and the north grows heavy with it. The presence deepens, and the cold deepens with it."
 zin_zol_through_islands_and_straits:0 "Through Islands and Straits"
 zin_zol_through_islands_and_straits_desc:0 "Through islands and through straits, the dead come south. No chart records the way."
 zin_zol_through_the_straits:0 "Through Islands and Straits"
 zin_zol_through_the_straits_desc:0 "No chart records the way the dead come south, through islands and through straits."
 zin_zol_tireless:0 "The Tireless March"
 zin_zol_tireless_desc:0 "The march continues through the night and the day, and the dead reach the end of their road without having rested."
 zin_zol_toward_the_straits:0 "Toward the Straits"
 zin_zol_toward_the_straits_desc:0 "The hulls turn toward the straits. The chart-makers of the south have no names for the water they will cross."
 zin_zol_two_darknesses_meet:0 "Two Darknesses Meet"
 zin_zol_two_darknesses_meet_desc:0 "Two darknesses meet at the edge of the world. Neither retreats, and the ground between them is not recovered."
 zin_zol_unpeopled_land:0 "The Unpeopled Land"
 zin_zol_unpeopled_land_desc:0 "The land has no people. A garrison is a small thing in a country that has no one to garrison."
 zin_zol_veiled_service:0 "Veiled Service"
 zin_zol_veiled_service_desc:0 "The service is given quietly. No banner is raised and no name is spoken, and the north goes on being quiet."
 zin_zol_watch_from_the_north:0 "Watch from the North"
 zin_zol_watch_from_the_north_desc:0 "The north watches. It sees the living build and burn and sees nothing it cannot outlast."
 zin_zol_what_can_end_them:0 "What Can End Them"
 zin_zol_what_can_end_them_desc:0 "The dead can be ended, though not by ordinary weapons. Only potent magic ends them, and the north knows it."
 zin_zol_what_can_end_them_tip_1:0 "Only potent magic can end them."
 zin_zol_what_the_war_leaves:0 "What the War Leaves"
 zin_zol_what_the_war_leaves_desc:0 "The war has filled the fields with dead. The north is nearer to them than it was before."
 zin_zol_when_hosts_are_broken:0 "When Hosts Are Broken"
 zin_zol_when_hosts_are_broken_desc:0 "When a host is broken, its breaking is not wasted. The presence draws on it and is stronger for the loss."
 zin_zol_when_servants_falter:0 "When Servants Falter"
 zin_zol_when_servants_falter_desc:0 "Service sometimes fails. A bond that is lost may return, if it is waited for and not demanded."
 zin_zol_wounded_not_slain:0 "Wounded, Not Slain"
 zin_zol_wounded_not_slain_desc:0 "His servant withdrew from the field wounded, and he was not slain, and what the north lent him comes slowly home."
 zin_zol.1.a:0 "Press them."
 zin_zol.1.b:0 "Leave them their silence."
 zin_zol.1.d:0 "Some of the younger gods give less than they gave. No one can say why. The presence feels the difference as a draught in a closed room."
 zin_zol.1.t:0 "The Reluctance of Gods"
 zin_zol.10.a:0 "Another age."
 zin_zol.10.d:0 "The age turns. The north is silent, and it waits."
 zin_zol.10.t:0 "Matters for Another Age"
 zin_zol.2.a:0 "The north remembers."
 zin_zol.2.d:0 "The north was old before the first crown of men was forged. The presence remembers, and the cold remembers with it."
 zin_zol.2.t:0 "Older Than Kings"
 zin_zol.3.a:0 "Let them wander."
 zin_zol.3.b:0 "Let the land keep them."
 zin_zol.3.d:0 "The dead walk the wastes. Whose they are is not known, and none of the living has asked them."
 zin_zol.3.t:0 "Those Who Wander"
 zin_zol.4.a:0 "Let them stand."
 zin_zol.4.d:0 "Ranks stand in the black at Šodolôro and do not tire. They are numbered, they are silent, and they face the south."
 zin_zol.4.t:0 "The First Host"
 zin_zol.5.a:0 "Let them be kept."
 zin_zol.5.d:0 "Paths long prepared lie open beneath the ice. How they were laid, and by whom, is not told."
 zin_zol.5.t:0 "The Old Roads of Power"
 zin_zol.6.a:0 "So it gathers."
 zin_zol.6.d:0 "The war of the living has filled the fields with dead. The north is closer to them now than it has ever been."
 zin_zol.6.t:0 "What the War Leaves"
 zin_zol.7.a:0 "We wait."
 zin_zol.7.d:0 "Not yet. Not for years. The hour is greater than the first, and the north will wait for it."
 zin_zol.7.t:0 "A Greater Hour"
 zin_zol.8.a:0 "Let the living have their age."
 zin_zol.8.d:0 "The north will not rise in this age unless it is struck. It is content, and it asks for nothing from the living."
 zin_zol.8.t:0 "The Unending Patience"
 zin_zol.9.a:0 "The dark is patient."
 zin_zol.9.d:0 "The servant came back into the dark of the north with a shard of the blue sword in his side. He was wounded and he was not slain, and the north has outlasted worse."
 zin_zol.9.t:0 "Wounded, Not Slain"
