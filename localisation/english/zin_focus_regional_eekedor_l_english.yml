l_english:
 zin_regional_eekedor_a_republic_of_ledgers:0 "A Realm of Ledgers"
 zin_regional_eekedor_a_republic_of_ledgers_desc:0 "The council of Eekedor writes its customs into a charter: every house has a voice, every contract has a witness and every debt has a date. The charter is read aloud once a year, and copies are sold at the door."
 zin_regional_eekedor_an_impartial_bench:0 "An Impartial Bench"
 zin_regional_eekedor_an_impartial_bench_desc:0 "The judges swear to hear every case without favour, and to rule against their own house if the law requires. The oath is public, and it is tested often."
 zin_regional_eekedor_arbitration:0 "The Court Accepted"
 zin_regional_eekedor_bills_of_exchange:0 "Bills of Exchange"
 zin_regional_eekedor_bills_of_exchange_desc:0 "The houses of Eekedor issue bills drawn on one another, accepted in every harbour from the strait to the Aenoran coast. A merchant can travel with a purse of paper, and be paid in silver at the other end."
 zin_regional_eekedor_cargo_insurance:0 "Insurance for Cargoes"
 zin_regional_eekedor_cargo_insurance_desc:0 "For a small fee, the houses of Eekedor guarantee a cargo against storm, wreck and theft. Shippers pay it gladly, and sleep better."
 zin_regional_eekedor_chapels_of_the_counting_houses:0 "Chapels of the Counting Houses"
 zin_regional_eekedor_chapels_of_the_counting_houses_desc:0 "The almoners of the Houses of the First Light ask the counting houses to fund a hall of healing. The merchants are cautious with gifts, and fond of ledgers."
 zin_regional_eekedor_coin_for_the_coalition:0 "Coin for the Coalition"
 zin_regional_eekedor_coin_for_the_coalition_desc:0 "The Heir has returned, and the counting houses open their strongrooms. Silver and arms go to the coalition, because a debtor who wins is worth more than a creditor who loses."
 zin_regional_eekedor_compact_harbour_rights:0 "Compact Harbour Rights"
 zin_regional_eekedor_compact_harbour_rights_desc:0 "Ships of the Compact have the right to anchor in Eekedor's harbour, take fresh water and unload for a fixed fee. The harbour is widened to hold them."
 zin_regional_eekedor_compact_tariffs:0 "Compact Tariffs"
 zin_regional_eekedor_compact_tariffs_desc:0 "The council sets a reduced tariff for Compact members, collected at the harbour and kept in a separate ledger. Merchants say that the Compact is worth joining for this alone."
 zin_regional_eekedor_compact_tariffs_spirit:0 "Compact Tariffs"
 zin_regional_eekedor_compact_tariffs_spirit_desc:0 "The Compact members trade with one another at a reduced tariff, set by the Eekedor council. The merchants say that the Compact is worth joining for this alone."
 zin_regional_eekedor_convoy_the_compact:0 "Escort the Compact"
 zin_regional_eekedor_convoy_the_compact_desc:0 "Eekedor's galleys escort the Compact's merchant ships through the northern waters. Their captains are paid by the voyage and are very prompt."
 zin_regional_eekedor_council_in_eekedor:0 "The Compact Council in Eekedor"
 zin_regional_eekedor_council_in_eekedor_desc:0 "The Speaker proposes that the Compact Council meet in Eekedor, at the houses' expense. The crown at Sonargur may sit at the head of the table, but the table is in Eekedor."
 zin_regional_eekedor_counting_houses:0 "The Counting Houses"
 zin_regional_eekedor_counting_houses_2:0 "Wealth of the East Shore"
 zin_regional_eekedor_counting_houses_2_desc:0 "The east shore is the richest strip of coast in the North. Its bills are accepted in every port of the Middle Lands and many beyond."
 zin_regional_eekedor_counting_houses_desc:0 "Eekedor's counting houses lend to Sonargur, to the Compact and quietly, to the merchants of Parim. They trade in trust, and their ledgers have never been burnt."
 zin_regional_eekedor_impartial_bench:0 "An Impartial Bench"
 zin_regional_eekedor_impartial_bench_desc:0 "Eekedor's judges have a name for fairness, and the council has taken steps to deserve it. A merchant who lost his case in Eekedor leaves complaining of the law, not of the judge."
 zin_regional_eekedor_insurance_for_cargoes:0 "Insurance for Cargoes"
 zin_regional_eekedor_insurance_for_cargoes_desc:0 "The houses guarantee a cargo against storm and wreck for a fee. A shipper who pays it sleeps easy, and a house that is wrong loses a great deal."
 zin_regional_eekedor_judges_of_the_strait:0 "Judges of the Strait"
 zin_regional_eekedor_judges_of_the_strait_desc:0 "The court makes the strait toll its first case, and sends a judge to Sonargur and another to Parim to take evidence. Neither crown is pleased, and neither can refuse."
 zin_regional_eekedor_law_merchant:0 "The Law Merchant"
 zin_regional_eekedor_law_merchant_desc:0 "A code of trade, written by the bench and sworn to by the houses, covers every kind of contract. Merchants of a dozen realms quote it, and many have copied it."
 zin_regional_eekedor_ledgers_at_war:0 "Ledgers at War"
 zin_regional_eekedor_ledgers_at_war_desc:0 "The houses open a second set of ledgers for the war, with columns for loans, escorts and losses. Eekedor's money works harder in a war than in peace."
 zin_regional_eekedor_loan_goodwill:0 "A Loan Remembered"
 zin_regional_eekedor_loans_to_parims_merchants:0 "Loans to Parim's Merchants"
 zin_regional_eekedor_loans_to_parims_merchants_desc:0 "The houses also lend, quietly, to the merchants of Parim. The Speaker knows it, the council knows it and Sonargur does not ask."
 zin_regional_eekedor_loans_to_sonargur:0 "Loans to Sonargur"
 zin_regional_eekedor_loans_to_sonargur_desc:0 "Eekedor's houses lend to the crown at Sonargur, at a modest rate and over many years. The loans bind the crown to the Compact more tightly than any treaty."
 zin_regional_eekedor_merchant_council:0 "The Council of Merchant Houses"
 zin_regional_eekedor_merchant_council_2:0 "Open Ledgers"
 zin_regional_eekedor_merchant_council_2_desc:0 "The ledgers of the houses are open to the council and to anyone who asks. A house that cheats is found out in a season, and a house that does not is trusted for a generation."
 zin_regional_eekedor_merchant_council_desc:0 "Eekedor is ruled by a council of merchant houses that elects a Speaker every four years. The last election was held in 4A 1745, and nobody has yet found a reason to hold another."
 zin_regional_eekedor_merchant_marines:0 "Merchant Sea-Guard"
 zin_regional_eekedor_merchant_marines_desc:0 "The houses hire a sea-guard of sturdy sailors and old soldiers to guard their cargoes. They are paid well, they drill often and they know how to fight on a crowded deck."
 zin_regional_eekedor_neutral_counting_houses:0 "Neutral Counting Houses"
 zin_regional_eekedor_neutral_counting_houses_desc:0 "Lerendor has left the old treaty, and Eekedor follows it out. The counting houses declare themselves neutral, and promise to lend to all sides alike."
 zin_regional_eekedor_neutral_houses:0 "Neutral Counting Houses"
 zin_regional_eekedor_neutral_houses_desc:0 "The counting houses lend to all sides and favour none. A cargo insured in Eekedor is safe on any sea, and a debt owed to Eekedor is honoured by any flag."
 zin_regional_eekedor_offer_arbitration:0 "Offer Arbitration"
 zin_regional_eekedor_offer_arbitration_desc:0 "The council offers to judge the toll quarrel between Lerendor and Parim. The strait's two masters have both accused each other, and neither has so far been willing to hear a third party."
 zin_regional_eekedor_open_ledgers:0 "Open Ledgers"
 zin_regional_eekedor_open_ledgers_desc:0 "The houses agree to open their ledgers to the council. A house that cheats is found out in a season, and a house that does not is trusted for a generation."
 zin_regional_eekedor_partnership:0 "The Partnership Sealed"
 zin_regional_eekedor_partnership_desc:0 "Eekedor and Lerendor have signed a partnership in full, with a seal on each page. The Compact holds firmer, and the houses of Eekedor hold the strings."
 zin_regional_eekedor_the_arbitration_court:0 "The Arbitration Court"
 zin_regional_eekedor_the_arbitration_court_desc:0 "The merchants of Eekedor have a name for fairness, and the council proposes to use it. A court is opened in the harbour hall, with three judges and a seal."
 zin_regional_eekedor_the_compacts_partner:0 "The Compact's Partner"
 zin_regional_eekedor_the_compacts_partner_desc:0 "Eekedor is Lerendor's partner in the Leren Compact, and the Speaker takes pains to remind the crown of it. His envoys sit on the Compact's left hand, and pay for the dinner."
 zin_regional_eekedor_the_council_of_eekedor:0 "The Council of Eekedor"
 zin_regional_eekedor_the_council_of_eekedor_desc:0 "Eekedor is one rich state on the east shore, ruled by a council of merchant houses. Speaker Pertav Oirt wants the treaty to last, the toll to stay low and the ledgers to balance."
 zin_regional_eekedor_the_counting_houses:0 "The Counting Houses"
 zin_regional_eekedor_the_counting_houses_desc:0 "The counting houses of Eekedor are tall and narrow, with a strongroom in the cellar and a ledger-clerk at every window. They lend to Sonargur, and quietly, to the merchants of Parim."
 zin_regional_eekedor_the_court_of_the_north:0 "The Court of the North"
 zin_regional_eekedor_the_court_of_the_north_desc:0 "The court becomes known across the North as the place where quarrels are settled. Embassies come to it, and merchants swear their contracts there."
 zin_regional_eekedor_the_eastern_squadron:0 "The Eastern Flotilla"
 zin_regional_eekedor_the_eastern_squadron_desc:0 "Eekedor builds a flotilla of galleys for the eastern waters, and mans it with hired captains and a few young merchants. It is small, quick and well supplied."
 zin_regional_eekedor_the_eekedor_mint:0 "The Eekedor Mint"
 zin_regional_eekedor_the_eekedor_mint_desc:0 "The council opens a mint beside the harbour, and strikes a silver piece with the sign of the pillared exchange. It becomes the standard coin of the east shore."
 zin_regional_eekedor_the_harbour_exchange:0 "The Harbour Exchange"
 zin_regional_eekedor_the_harbour_exchange_desc:0 "A hall of columns is built beside the harbour for the daily trade in bills and cargoes. Traders cry their prices from the steps, and the harbour clerks note them down."
 zin_regional_eekedor_the_houses_vote:0 "The Houses Vote"
 zin_regional_eekedor_the_houses_vote_desc:0 "Each of the merchant houses has a vote, weighted by its tax paid. The count is public, and the dispute over weights takes longer than the debate."
 zin_regional_eekedor_the_law_merchant:0 "The Law Merchant"
 zin_regional_eekedor_the_law_merchant_desc:0 "The bench writes a code of trade that covers contracts, debts, shipwrecks and bills of exchange. Merchants of a dozen realms quote it, and many have copied it."
 zin_regional_eekedor_the_ledgers_balance:0 "The Ledgers Balance"
 zin_regional_eekedor_the_ledgers_balance_desc:0 "The war is over, the loans are repaid and the books are closed. The houses settle their accounts, and the Speaker reads the final sum aloud in the council hall."
 zin_regional_eekedor_the_partnership_sealed:0 "The Partnership Sealed"
 zin_regional_eekedor_the_partnership_sealed_desc:0 "Eekedor and Lerendor put their seals to a partnership in full: shared harbours, shared tariffs and a shared table. The Speaker has what he wanted, and the crown has what it needs."
 zin_regional_eekedor_the_speakers_chair:0 "The Speaker's Chair"
 zin_regional_eekedor_the_speakers_chair_desc:0 "The Speaker's chair is carved of a single block of oak, from the harbour pile that held up the first quay of Eekedor. It is plain, hard and very old."
 zin_regional_eekedor_war_ledgers:0 "Ledgers at War"
 zin_regional_eekedor_war_ledgers_desc:0 "The houses keep a second set of books for the war, with columns for loans, escorts and losses. Eekedor's money works harder in a war than in peace."
 zin_regional_eekedor_war_loans:0 "War Loans"
 zin_regional_eekedor_war_loans_desc:0 "The houses extend loans to the Compact's crowns at a reasonable rate. The money buys arms for the Long Watch, and Eekedor holds the bonds."
 zin_regional_eekedor_wealth_of_the_east_shore:0 "Wealth of the East Shore"
 zin_regional_eekedor_wealth_of_the_east_shore_desc:0 "The east shore of the North is the richest strip of coast in the world, or so its factors say. Eekedor's bills are accepted in every port, and its warehouses are full."
 zin_regional_eekedor.1.a:0 "Charity is a matter for each house"
 zin_regional_eekedor.1.b:0 "Fund it"
 zin_regional_eekedor.1.d:0 "The almoners of the Houses of the First Light ask the counting houses to fund a hall of healing on the east shore. It would tend the poor, keep a granary and register every birth in the council's own ledger. The houses are generous with loans, and rather less so with gifts."
 zin_regional_eekedor.1.t:0 "A Gift for the Houses"
 zin_regional_eekedor.2.a:0 "The crown owes no merchants"
 zin_regional_eekedor.2.b:0 "Accept"
 zin_regional_eekedor.2.d:0 "A banker of Eekedor has been shown into the court at Sonargur, with a strongbox and a bill of exchange. The council offers the crown a loan at a modest rate, repayable over ten years. The terms are reasonable, and the lender is a friend."
 zin_regional_eekedor.2.t:0 "A Loan from Eekedor"
 zin_regional_eekedor.3.a:0 "Sonargur presides"
 zin_regional_eekedor.3.b:0 "Let it sit in Eekedor"
 zin_regional_eekedor.3.d:0 "The Speaker of Eekedor has asked that the next meeting of the Compact Council be held in his city. The counting houses will pay for the hall, the feast and the hospitality, and the council will have a fine view of the harbour."
 zin_regional_eekedor.3.t:0 "The Compact Council in Eekedor"
 zin_regional_eekedor.4.a:0 "Parim answers to no merchants"
 zin_regional_eekedor.4.b:0 "Accept the court"
 zin_regional_eekedor.4.d:0 "A judge of Eekedor presents himself at the court in Parim, in a plain grey robe. The council of merchants, he says, would be glad to hear the quarrel over the strait toll in its court, and to give a ruling that both sides can accept."
 zin_regional_eekedor.4.t:0 "Eekedor Offers Arbitration"
