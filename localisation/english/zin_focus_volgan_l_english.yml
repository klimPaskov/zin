l_english:
 zin_volgan_a_host_greater:0 "A Host Greater Than the First Age"
 zin_volgan_a_host_greater_desc:0 "A host greater than any since the First Age stands drawn up on the black plain. Its banners hang limp in the still air, and not one of its soldiers draws breath."
 zin_volgan_abyss_born:0 "Abyss-Born Companies"
 zin_volgan_abyss_born_companies:0 "Abyss-Born Companies"
 zin_volgan_abyss_born_companies_desc:0 "Those who live in the Abyss are persuaded to take service. They are strange, silent and very hard to kill."
 zin_volgan_abyss_born_desc:0 "Those who live in the deep have taken service. They are strange, silent and very hard to kill."
 zin_volgan_ash_mines:0 "The Ash Mines"
 zin_volgan_ash_mines_desc:0 "Shafts are sunk into the black hills to reach iron that has lain untouched since the First Age. Gangs of the dead work the seams in perfect silence."
 zin_volgan_bargain_with_the_king:0 "Bargain with the King of Demons"
 zin_volgan_bargain_with_the_king_desc:0 "The King of Demons names his price, and Volgan agrees to pay it. The bargain of this reign is written in fire and sealed with an ember."
 zin_volgan_bend_the_nether:0 "Bend the Nether to Nafeher"
 zin_volgan_bend_the_nether_desc:0 "The Nether is made to serve. Its gates open on command, its armies march when told, and its king is left to nurse his pride."
 zin_volgan_bind_the_restless:0 "Bind the Restless"
 zin_volgan_bind_the_restless_desc:0 "Not every dead man rises with a mind to obey. The Grave-Wardens bind the restless with rune-chains, and their rage is turned to purpose."
 zin_volgan_black_compact:0 "The Black Compact"
 zin_volgan_black_compact_desc:0 "The two powers of the dead meet at the edge of the world and agree on a single enemy. The compact is brief, bleak and binding."
 zin_volgan_bone_kilns:0 "The Bone Kilns"
 zin_volgan_bone_kilns_desc:0 "Kilns burn day and night on the southern plains, baking bone and clay into tiles for roofs and fire-bricks for forges. The air tastes of ash."
 zin_volgan_bone_road:0 "The Bone Road"
 zin_volgan_bone_road_desc:0 "A road of white bone-dust and packed stone runs from the barrows to the capital. It is wide enough for six columns of the dead."
 zin_volgan_bound_restless:0 "The Restless Bound"
 zin_volgan_bound_restless_desc:0 "Rune-chains bind the restless dead, and their rage is turned to purpose. They drill together and hold the line."
 zin_volgan_break_concord_south:0 "Break the Concord's South"
 zin_volgan_break_concord_south_desc:0 "The southern marches of the Concord are claimed. Herez is the first, and the others will follow when they hear."
 zin_volgan_break_the_veil:0 "Break the Veil"
 zin_volgan_break_the_veil_desc:0 "The veil falls, the storms part and the host of Volgan marches before the world is ready. It is a bold move, and it will not be forgotten."
 zin_volgan_champion_of_men:0 "The Champion of Men"
 zin_volgan_champion_of_men_desc:0 "A champion of men walks the roads of the north, and the lord has set his hosts to find him. The ground itself is made to listen for his footsteps."
 zin_volgan_children_dominion:0 "The Children of Volgan"
 zin_volgan_children_dominion_desc:0 "The realms of north and south are bound in a single oath and pray to a lord who does not answer."
 zin_volgan_children_of_volgan:0 "The Children of Volgan"
 zin_volgan_children_of_volgan_desc:0 "The realms of the north and south are bound to one throne in a single oath. They call themselves the Children of Volgan, and they pray to a lord who does not answer."
 zin_volgan_clash_of_darks:0 "The Dead Against the Dead"
 zin_volgan_clash_of_darks_desc:0 "The dead of the south and the dead of the north meet, and neither side retreats. Bones are broken, raised and broken again."
 zin_volgan_client_crown_of_mirolon:0 "A Client Crown in Mirolon"
 zin_volgan_client_crown_of_mirolon_desc:0 "Mirolon is given back to a crowned client, a living lord who rules in the lord's name. It is a gesture of mercy and a snare."
 zin_volgan_client_crowns:0 "Client Crowns"
 zin_volgan_client_crowns_desc:0 "Fallen realms are not annexed but crowned anew, each with a client king, a garrison of the dead and an oath. They are the lord's children, and they know it."
 zin_volgan_court_of_nafeher:0 "The Court of Nafeher"
 zin_volgan_court_of_nafeher_desc:0 "The court of Nafeher is a hall of black stone where nothing is said that has not been weighed. Volgan's voice is heard only in the heat."
 zin_volgan_court_of_nafeher_spirit:0 "The Court of Nafeher"
 zin_volgan_court_of_nafeher_spirit_desc:0 "A hall of black stone where nothing is said that has not been weighed."
 zin_volgan_dead_against_dead:0 "The Dead Against the Dead"
 zin_volgan_dead_against_dead_desc:0 "The dead of the south meet the dead of the north, and neither side retreats. Bones are broken, then raised, then broken again."
 zin_volgan_dead_garrison:0 "A Garrison of the Dead"
 zin_volgan_dead_garrison_desc:0 "The conquered lands are garrisoned with the dead. They do not drink, they do not sleep, and they do not take bribes."
 zin_volgan_dead_garrison_spirit:0 "A Garrison of the Dead"
 zin_volgan_dead_garrison_spirit_desc:0 "The conquered lands are held by the dead. They do not drink, they do not sleep, and they take no bribes."
 zin_volgan_dead_of_the_north:0 "The Dead of the North"
 zin_volgan_dead_of_the_north_desc:0 "Scouts report another host of dead in the far north, wearing no banner and speaking no word. They are not Volgan's."
 zin_volgan_deep_barrows:0 "The Deep Barrows"
 zin_volgan_deep_barrows_desc:0 "Beneath the old barrows lie older ones, sealed with iron doors and lead seals. The doors are opened one by one."
 zin_volgan_descend_into_the_abyss:0 "Descend into the Abyss"
 zin_volgan_descend_into_the_abyss_desc:0 "Volgan's scouts go down the stair. Whatever they meet, they are not the same when they come up."
 zin_volgan_dolon_sworn_anew:0 "Dolon Sworn Anew"
 zin_volgan_dolon_sworn_anew_desc:0 "Dolon's lords are proud, hard and practical. They renew their oath for the plain reason that no one else is strong enough to protect them."
 zin_volgan_dominion_at_war:0 "The Dominion at War"
 zin_volgan_dominion_at_war_desc:0 "The forges burn night and day and the roads fill with carts. Volgan has put the whole Dominion on a war footing, and nobody is permitted to ask why."
 zin_volgan_dominion_endures:0 "The Dominion Endures"
 zin_volgan_dominion_endures_desc:0 "The long recovery is over. The Dominion is no longer a ruin, and its servants will no longer hide the fact."
 zin_volgan_dominion_tribute:0 "The Dominion's Tribute"
 zin_volgan_dominion_tribute_desc:0 "Demon, Dolon and Nezer send ore, grain and fighting men to Nafeher each year, and the tribute-wagons arrive on time."
 zin_volgan_dominion_war_council:0 "The Dominion War-Council"
 zin_volgan_dominion_war_council_desc:0 "The lords of the Dominion meet in the great hall and are told the plan. They have the grace to look afraid."
 zin_volgan_dominion_war_economy:0 "The Dominion at War"
 zin_volgan_dominion_war_economy_desc:0 "The whole Dominion is on a war footing. Its people eat little, its forges burn day and night, and nothing is wasted."
 zin_volgan_dread_doctrine:0 "The Dread Doctrine"
 zin_volgan_dread_doctrine_desc:0 "Terror is made a doctrine. Every soldier of the Dominion is taught that the sight of him is a weapon."
 zin_volgan_drowned_musters:0 "The Drowned Musters"
 zin_volgan_drowned_musters_desc:0 "The lakes of the south are drained and the drowned are raised in their thousands. They march with weed in their hair and water in their lungs."
 zin_volgan_ember_lands_endure:0 "The Ember Lands Endure"
 zin_volgan_ember_lands_endure_desc:0 "The Ember Lands endure. The storms still turn above them, and the forges still burn."
 zin_volgan_ember_lands_endure_spirit:0 "The Ember Lands Endure"
 zin_volgan_ember_lands_endure_spirit_desc:0 "The storms still turn above the Ember Lands, and the forges still burn. The Dominion has outlived its lord."
 zin_volgan_empty_setting:0 "The Empty Setting"
 zin_volgan_empty_setting_desc:0 "In the deep there is a niche carved for a jewel that was taken long ago. The setting is empty, and the dust around it has not been disturbed in an age."
 zin_volgan_envoys_to_the_nether:0 "Envoys to the Nether"
 zin_volgan_envoys_to_the_nether_desc:0 "Envoys are sent to the Nether, the realm of fire beneath the Ember Lands. Their instructions are to listen, to bow, and to say nothing of the lord's intent."
 zin_volgan_false_quiet:0 "The False Quiet"
 zin_volgan_false_quiet_desc:0 "A message goes to Mirolon, in the old courtly forms, offering a quiet peace between old rivals. It is courteous, convincing and quite false."
 zin_volgan_fire_of_the_nether:0 "Fire of the Nether"
 zin_volgan_fire_of_the_nether_desc:0 "The King's fire-mages share their arts, and the Dominion's sorcerers are astonished. The fire they learn burns cold and clings like pitch."
 zin_volgan_forges_in_the_heat:0 "Forges in the Heat"
 zin_volgan_forges_in_the_heat_desc:0 "Deep in the Ember Lands, where the ground is warm and the rivers run grey, Volgan lights the first of his forges. The smoke is lost in the storms, and no watcher sees it."
 zin_volgan_forges_never_cool:0 "Forges That Never Cool"
 zin_volgan_forges_never_cool_desc:0 "The last fire in the great forge is never banked. Smiths come and go in shifts, and the anvils ring through the dark months."
 zin_volgan_forges_of_dolon:0 "The Forges of Dolon"
 zin_volgan_forges_of_dolon_desc:0 "The forges of Dolon are fired for the Dominion's service. Their arms are sent north in sealed crates marked with the lord's seal."
 zin_volgan_gates_behind_the_passes:0 "Gates Behind the Passes"
 zin_volgan_gates_behind_the_passes_desc:0 "The Nether's gates are opened behind the passes, and fire pours through. Mirolon's second line is taken from behind."
 zin_volgan_gates_opened:0 "The Gates Opened"
 zin_volgan_gates_opened_desc:0 "The gates of the Nether are open, and fire pours through. The Dominion's hosts fight with a hot, wild fury."
 zin_volgan_gifts_to_the_orc_holds:0 "Gifts to the Orc Holds"
 zin_volgan_gifts_to_the_orc_holds_desc:0 "Gifts of iron, salt and wine are sent to the orc holds. The orcs take the gifts and say nothing, which is considered a courteous reply."
 zin_volgan_goldoroth_question:0 "The Goldoroth Question"
 zin_volgan_goldoroth_question_desc:0 "Goldoroth is the strongest of the Dark Lands, and the proudest. An envoy goes south to ask whether it knows who its true master is."
 zin_volgan_goldoroth_refused:0 "Goldoroth Refused the Envoy"
 zin_volgan_grave_fields:0 "The Grave-Fields of the South"
 zin_volgan_grave_fields_desc:0 "South of Nafeher lie the fields where the First Age dead were laid. The graves have not been opened, and the dead in them are waiting to be asked."
 zin_volgan_grave_warden_order:0 "The Grave-Warden's Order"
 zin_volgan_grave_warden_order_desc:0 "The Grave-Warden is a keeper of the barrows, and his order tends the dead as a shepherd tends a flock. They know every name, every grave and every grievance."
 zin_volgan_grave_wardens:0 "The Grave-Wardens"
 zin_volgan_grave_wardens_desc:0 "The keepers of the barrows know every name and every grievance of the dead. They are very good at making the dead rise."
 zin_volgan_great_muster:0 "The Great Muster"
 zin_volgan_great_muster_desc:0 "Every barrow, every drowned lake and every bone-field is emptied at once. The veil of silence is torn away, and the host of Volgan marches into the open."
 zin_volgan_green_crystal:0 "The Green Crystal"
 zin_volgan_green_crystal_desc:0 "Word reaches Nafeher of a green crystal, the heart of an old shield-bearer. The lord has wanted it for a long time."
 zin_volgan_heat_hardened_steel:0 "Heat-Hardened Iron"
 zin_volgan_heat_hardened_steel_desc:0 "Blades are quenched in the waters of the grey rivers and tempered in the heat of the fumaroles. They do not rust, and they do not break."
 zin_volgan_hidden_century:0 "The Hidden Century"
 zin_volgan_hidden_century_desc:0 "For a hundred years the Dominion has rebuilt in silence. The records are brought to the throne room and read aloud, and the court is satisfied."
 zin_volgan_hold_court_at_nafeher:0 "Hold Court at Nafeher"
 zin_volgan_hold_court_at_nafeher_desc:0 "The lords of Demon, Dolon and Nezer attend the court in person. They are seated in order of age, and no one speaks until the lord has spoken."
 zin_volgan_hold_the_ember_lands:0 "Hold the Ember Lands"
 zin_volgan_hold_the_ember_lands_desc:0 "The host withdraws to the Ember Lands. The passes are closed, the storms called back and the old walls manned."
 zin_volgan_host_fights_on:0 "The Host Fights On"
 zin_volgan_host_fights_on_desc:0 "The host fights on without its master. It is a bitter, desperate war, and many of the lords begin to look to their own borders."
 zin_volgan_host_of_first_age:0 "A Host Greater Than the First Age"
 zin_volgan_host_of_first_age_desc:0 "The standing dead number more than the living of any realm in Aoaz. Their banners hang limp, and no soldier draws breath."
 zin_volgan_hosts_without_number:0 "Hosts Without Number"
 zin_volgan_hosts_without_number_desc:0 "Where the fields are full, the next fields are opened. By the end of the season there are more standing dead than the garrison of Nafeher can count."
 zin_volgan_hunt_the_champion:0 "Hunt the Champion"
 zin_volgan_hunt_the_champion_desc:0 "The host has been set to find a champion of men. The ground itself is made to listen."
 zin_volgan_iron_for_the_host:0 "Iron for the Host"
 zin_volgan_iron_for_the_host_desc:0 "Carts of iron roll from the mines to the arsenal, and carts of weapons roll from the arsenal to the muster-fields. The tally-keepers have stopped counting."
 zin_volgan_keep_the_oaths:0 "Keep the Oaths"
 zin_volgan_keep_the_oaths_desc:0 "The steward sends a written reminder to every lord of the Dominion: their oaths were sworn to a throne, not a body."
 zin_volgan_kings_due:0 "The King's Due"
 zin_volgan_kings_due_desc:0 "The King of Demons sends a messenger to Nafeher with a bill. It is written on a sheet of flayed obsidian and has no figure on it at all."
 zin_volgan_labour_never_tires:0 "Labour That Never Tires"
 zin_volgan_labour_never_tires_desc:0 "The dead work the kilns and mines without sleep, without food and without complaint. Production climbs, and the overseers have nothing to do."
 zin_volgan_lake_assault:0 "The Lake Assault"
 zin_volgan_lake_assault_desc:0 "The dead walk along the lake bed to reach the towns, and the defenders' boats are sunk beneath them."
 zin_volgan_leave_north_to_its_dead:0 "Leave the North to Its Dead"
 zin_volgan_leave_north_to_its_dead_desc:0 "A message is sent to the north: let the south keep the south and the north its own. Whether anything is there to read it is not known."
 zin_volgan_ledger_of_the_dead:0 "The Ledger of the Dead"
 zin_volgan_ledger_of_the_dead_desc:0 "Every barrow, every grave and every battlefield of the south is entered in a ledger. The scribes who keep it are no longer living."
 zin_volgan_lieutenants_assemble:0 "The Captains Assemble"
 zin_volgan_lieutenants_assemble_desc:0 "The Ember Herald, the Grave-Warden and Ghorvak of the Hundred Clubs are summoned to Nafeher. They come, they kneel, and they take their commands."
 zin_volgan_long_recovery:0 "The Long Recovery"
 zin_volgan_long_recovery_desc:0 "The Dominion lay broken for an age and is still mending. Its hosts are thin, its drill is slow, and its people are willing."
 zin_volgan_lords_of_the_deep:0 "Lords of the Deep"
 zin_volgan_lords_of_the_deep_desc:0 "The lords of the deep send two hosts to the Dominion's march. They are given no banners, because they have no use for them."
 zin_volgan_lords_of_the_deep_tip_1:0 "Two Abyss Host companies join the march."
 zin_volgan_march_north:0 "The March North"
 zin_volgan_march_north_desc:0 "The host of the Dominion marches north from the passes, banners unfurled, drums beating and the whole length of the Ember Lands emptying behind it. The world has not seen such a host since the First Age."
 zin_volgan_mirolon_retaken:0 "Mirolon Retaken"
 zin_volgan_mirolon_retaken_desc:0 "Mirolon is taken. The passes that have barred the south for an age are held again by the lord who first held them."
 zin_volgan_monster_and_grave:0 "Rule by Monster and Grave"
 zin_volgan_monster_and_grave_desc:0 "Orcs, trolls and the dead rule side by side in the conquered lands. No one remembers who asked them to."
 zin_volgan_monster_clans:0 "The Monster Clans"
 zin_volgan_monster_clans_desc:0 "The monster clans of the deep forests answer the call of the drum. They come in twos and threes, and they bring their own teeth."
 zin_volgan_monster_clans_spirit:0 "The Monster Clans"
 zin_volgan_monster_clans_spirit_desc:0 "The monster clans of the forests answer the drum. They come in twos and threes, and they bring their own teeth."
 zin_volgan_nether_bargain:0 "The Bargain of This Reign"
 zin_volgan_nether_bargain_desc:0 "Volgan has agreed to the King of Demons' price and pays it each season. The price is high, and the Nether is grateful."
 zin_volgan_nether_unrest:0 "Unrest in the Nether"
 zin_volgan_nether_unrest_desc:0 "The Nether was bent to Nafeher's will, and its lords have not forgiven it. Unrest simmers along the border."
 zin_volgan_netherborn_companies:0 "Netherborn Companies"
 zin_volgan_netherborn_companies_desc:0 "Companies of Netherborn are raised from the fire-pits and drilled in the old way. They march at double speed and do not sweat."
 zin_volgan_netherborn_companies_spirit:0 "Netherborn Companies"
 zin_volgan_netherborn_companies_spirit_desc:0 "Companies of fire-born warriors drill in the old way. They move fast, hit hard and do not tire."
 zin_volgan_netherborn_levies:0 "Demon's Netherborn Levies"
 zin_volgan_netherborn_levies_desc:0 "Demon sends its Netherborn, creatures of fire and shadow who obey no one but the lord. They are fierce, fast and difficult to feed."
 zin_volgan_nezer_confederacy:0 "The Confederacy of Nezer"
 zin_volgan_nezer_confederacy_desc:0 "Nezer is a confederacy of clans that have never agreed on anything except their fear of the south. They agree on this oath."
 zin_volgan_nezer_war_bands:0 "Nezer's War-Bands"
 zin_volgan_nezer_war_bands_desc:0 "The clans of Nezer send their war-bands to drill beside the Dominion's hosts. They bring their own songs, and the dead listen to them."
 zin_volgan_not_all_will_answer:0 "Not All Will Answer"
 zin_volgan_not_all_will_answer_desc:0 "Some holds refuse, some do not reply and some send back the messenger in pieces. Volgan has anticipated this and plans accordingly."
 zin_volgan_oath_of_demon:0 "The Oath of Demon"
 zin_volgan_oath_of_demon_desc:0 "Demon is the oldest of the Dominion's realms, and its lords still tell tales of the lord who raised them. They kneel again, a little slower than before."
 zin_volgan_old_barrows:0 "Wake the Old Barrows"
 zin_volgan_old_barrows_desc:0 "The oldest barrows are opened with ritual care. What stands up from them is not quite as it was in life, but it remembers how to hold a spear."
 zin_volgan_old_battlefields:0 "Wake the Old Battlefields"
 zin_volgan_old_battlefields_desc:0 "The fields where the First Age died are walked by the host. Where the dead lie thickest, the dead rise."
 zin_volgan_old_claim:0 "The Old Claim on Mirolon"
 zin_volgan_old_claim_desc:0 "Mirolon was Volgan's in the First Age, and the passes were his before the first stones of Parim were laid. The claim is written out in full and read aloud to the court."
 zin_volgan_old_claim_tip_1:0 "Mirolon was Volgan's in the First Age."
 zin_volgan_old_conquest:0 "The Old Conquest"
 zin_volgan_old_conquest_desc:0 "The host of the Dominion marches out of the storm, and the passes of Mirolon see it come. The war that began in the First Age begins again."
 zin_volgan_old_portals:0 "The Old Portals"
 zin_volgan_old_portals_desc:0 "The old portals between the Ember Lands and the Nether are cleared of rubble and relit. At full strength, the gates will open in war."
 zin_volgan_old_portals_tip_1:0 "At 70, the gates open in war."
 zin_volgan_one_dominion:0 "One Dominion Under Nafeher"
 zin_volgan_one_dominion_desc:0 "Three realms with one will, one purse and one throne. The old quarrels are forgotten and the lords no longer remember them."
 zin_volgan_one_dominion_under_nafeher:0 "One Dominion Under Nafeher"
 zin_volgan_one_dominion_under_nafeher_desc:0 "The three realms are bound as one, with one will, one purse and one throne. The old quarrels fade, and the lords no longer remember what they were."
 zin_volgan_one_will:0 "One Will in Nafeher"
 zin_volgan_one_will_desc:0 "The orders and the warlords bow to a single will. The court of Nafeher speaks as one, and what it says is done."
 zin_volgan_orders_ascendant:0 "The Orders Ascendant"
 zin_volgan_orders_ascendant_desc:0 "The necromantic orders keep the keys of the court. The dead rise in greater numbers, and they are drilled with grim speed."
 zin_volgan_out_of_the_storms:0 "Out of the Storms"
 zin_volgan_out_of_the_storms_desc:0 "The host strikes out of the storm with no warning. Mirolon's pickets are overrun before they can light the beacons."
 zin_volgan_pact_of_spoils:0 "The Pact of Spoils"
 zin_volgan_pact_of_spoils_desc:0 "The holds that answered are offered a place at the table when the north is divided. Most sign without reading what the table is made of."
 zin_volgan_pass_breakers:0 "Pass-Breakers"
 zin_volgan_pass_breakers_desc:0 "The dead have taken the passes in a night, and the host rides on with the momentum of a flood."
 zin_volgan_passes_are_ours:0 "The Passes Are Ours"
 zin_volgan_passes_are_ours_desc:0 "The passes are held, the roads north are open, and the whole of the southern plain lies behind the host. The way to the north is clear."
 zin_volgan_patience_of_ages:0 "The Patience of Ages"
 zin_volgan_patience_of_ages_desc:0 "Volgan has waited a thousand years. His servants have learned the lesson, and the court is calm."
 zin_volgan_patient_lord:0 "The Patient Lord"
 zin_volgan_patient_lord_desc:0 "Volgan has waited a thousand years, and he is not about to be hurried. His servants learn the lesson of patience."
 zin_volgan_raise_the_veil:0 "The Veil of Storms"
 zin_volgan_raise_the_veil_desc:0 "The storms of the Ember Lands have always guarded the southern marches. Volgan teaches them to hide what lies beneath, and the world sees only weather."
 zin_volgan_retreat_south:0 "Hold the Ember Lands"
 zin_volgan_retreat_south_desc:0 "The host withdraws to the Ember Lands and shuts the passes. The old walls are manned, and the storms are called back."
 zin_volgan_rites_of_the_storm:0 "Rites of the Storm"
 zin_volgan_rites_of_the_storm_desc:0 "Rites are performed on the high ground at the storm's heart. The dead sing, and the storm answers, and for a time the Ember Lands are invisible even to the stars."
 zin_volgan_road_to_parim:0 "The Road to Parim"
 zin_volgan_road_to_parim_desc:0 "The road to Parim lies open, white and straight. At its end is the throne of the Middle Lands."
 zin_volgan_roads_under_storms:0 "Roads Under the Storms"
 zin_volgan_roads_under_storms_desc:0 "Roads are cut beneath the storm-cloud where no scout can see them. The dead lay the stone, and the stone is true."
 zin_volgan_rule_through_orders:0 "Rule Through the Orders"
 zin_volgan_rule_through_orders_desc:0 "The necromantic orders are given the keys of the court. They raise more dead, and faster, and the living warlords grumble."
 zin_volgan_rule_through_warlords:0 "Rule Through the Warlords"
 zin_volgan_rule_through_warlords_desc:0 "The warlords are seated at the high table. Their hosts are fewer but harder, and the orders are made to wait for their turn."
 zin_volgan_seal_the_depths:0 "Seal the Depths"
 zin_volgan_seal_the_depths_desc:0 "The stair is walled and sealed, and the wardens posted above it keep their eyes on the stone. Whatever lives below, it is kept below."
 zin_volgan_second_front_north:0 "A Second Front in the North"
 zin_volgan_second_front_north_desc:0 "The Dark Lands in the north are given arms and told to strike while the world looks south. Their raids tie down garrisons on the northern coasts."
 zin_volgan_siege_engines:0 "Siege Engines of the Old War"
 zin_volgan_siege_engines_desc:0 "The old engines of Nafeher are dug out of their halls, restored and fitted with new throwing arms. They have not been used since the walls of Mirolon fell."
 zin_volgan_siege_of_parim:0 "The Siege of Parim"
 zin_volgan_siege_of_parim_desc:0 "Parim is besieged. Its walls are high and its garrison brave, but the host that surrounds it has no need of sleep."
 zin_volgan_siege_of_parim_spirit:0 "The Siege of Parim"
 zin_volgan_siege_of_parim_spirit_desc:0 "The city is ringed by a host that needs no sleep, and each day the garrison grows thinner."
 zin_volgan_silence_the_watchers:0 "Silence the Watchers"
 zin_volgan_silence_the_watchers_desc:0 "Spies and scouts are lured into the storms, and the ones who return do not remember what they saw. The borders are closed from the inside."
 zin_volgan_silent_throne:0 "The Silent Throne"
 zin_volgan_silent_throne_desc:0 "The lord's body is gone, and his throne is silent. His steward stands before it, a servant without a master, and decides what to do next."
 zin_volgan_southern_dominion:0 "The Southern Dominion"
 zin_volgan_southern_dominion_desc:0 "Demon, Dolon and Nezer lie in the shadow of Nafeher and have sworn it their loyalty since the First Age. The oaths are old, and the lord intends to renew them."
 zin_volgan_southern_marches:0 "Through the Southern Marches"
 zin_volgan_southern_marches_desc:0 "The Middle Lands' southern marches are open to the host, and its roads are the best in the world. The dead are on them before the news arrives."
 zin_volgan_southern_marches_spirit:0 "Through the Southern Marches"
 zin_volgan_southern_marches_spirit_desc:0 "The southern marches' great roads carry the host faster than any enemy can respond."
 zin_volgan_spoils_promised:0 "Spoils Promised"
 zin_volgan_spoils_promised_desc:0 "The lords are promised the spoils of the north. Each is shown a map, a coastline and a price, and each remembers it."
 zin_volgan_steward_war:0 "The Steward's War"
 zin_volgan_steward_war_desc:0 "The steward takes the field, and the old commanders follow because they cannot imagine doing otherwise."
 zin_volgan_stewards_war:0 "The Steward's War"
 zin_volgan_stewards_war_desc:0 "The steward takes the field, and the old commanders follow because they cannot imagine doing otherwise."
 zin_volgan_storm_breaks:0 "The Storm Breaks"
 zin_volgan_storm_breaks_desc:0 "The storm breaks over the Ember Lands. Whatever has been built behind the veil comes out of it at once, and the world learns what it has been sleeping beside."
 zin_volgan_storm_coast_wardens:0 "Wardens of the Storm Coast"
 zin_volgan_storm_coast_wardens_desc:0 "Wardens are posted along the coast to turn back every ship that approaches. The few who return tell stories no one believes."
 zin_volgan_storm_girt_realm:0 "The Storm-Girt Realm"
 zin_volgan_storm_girt_realm_desc:0 "The Ember Lands lie beneath a ring of storms and heat. Armies from beyond the ring do not endure them, and the realm's own do."
 zin_volgan_storm_harbours:0 "Harbours Behind the Storms"
 zin_volgan_storm_harbours_desc:0 "Harbours on the southern coast are dug into black rock behind the storm-wall. No ship has ever found them without being invited."
 zin_volgan_storm_rites:0 "Rites of the Storm"
 zin_volgan_storm_rites_desc:0 "The dead sing on the high ground at the heart of the storm, and for a time the Ember Lands are hidden from the very stars."
 zin_volgan_storm_the_passes:0 "Storm the Passes"
 zin_volgan_storm_the_passes_desc:0 "The passes are narrow, steep and fortified, and the dead take them in a night. They do not tire, and they are not afraid."
 zin_volgan_sworn_to_nafeher:0 "Sworn to Nafeher"
 zin_volgan_sworn_to_nafeher_desc:0 "Three of the Dark Lands are offered the Dominion's oath. In war, those who accept will march at Nafeher's call."
 zin_volgan_terror_before_the_host:0 "Terror Before the Host"
 zin_volgan_terror_before_the_host_desc:0 "Riders gallop ahead of the host with word of its coming. Whole towns empty before the first dead man is seen."
 zin_volgan_terror_host:0 "Terror Before the Host"
 zin_volgan_terror_host_desc:0 "Riders gallop ahead with word of the host's coming. Whole towns empty before the first of the dead is seen."
 zin_volgan_the_dominions_tribute:0 "The Dominion's Tribute"
 zin_volgan_the_dominions_tribute_desc:0 "Each realm of the Dominion sends a yearly tribute of ore, grain and fighting men to Nafeher. The tribute-wagons arrive on time."
 zin_volgan_the_gates_opened:0 "The Gates Opened"
 zin_volgan_the_gates_opened_desc:0 "The gates open, and the Nether pours out. The fires of the south are answered by the fires of the deep."
 zin_volgan_the_lake_towns:0 "The Lake Towns"
 zin_volgan_the_lake_towns_desc:0 "The towns on the great lake are taken one by one. The dead walk along the lake bed to reach them, and the boats of the defenders sink beneath them."
 zin_volgan_throne_in_parim:0 "A Throne in Parim"
 zin_volgan_throne_in_parim_desc:0 "The throne of the Middle Lands is taken. A seat is set beside it, empty, and the whole court understands for whom."
 zin_volgan_throne_of_dread:0 "The Throne of Dread"
 zin_volgan_throne_of_dread_desc:0 "Terror is a doctrine at Nafeher. Every servant is taught that the sight of the lord is a weapon."
 zin_volgan_tireless_dead:0 "The Tireless Dead"
 zin_volgan_tireless_dead_desc:0 "Orders are changed so that the dead no longer sleep in the field. They march by night and by day, and the living hosts of the world cannot match their pace."
 zin_volgan_tireless_dead_spirit:0 "The Tireless Dead"
 zin_volgan_tireless_dead_spirit_desc:0 "The dead march by night and by day and do not stop to eat. Supply wagons and winter alike matter less to them."
 zin_volgan_tireless_labour:0 "Labour That Never Tires"
 zin_volgan_tireless_labour_desc:0 "The dead work the kilns and mines without sleep, and the overseers have nothing to do."
 zin_volgan_troll_forest_price:0 "The Troll Forest's Price"
 zin_volgan_troll_forest_price_desc:0 "The trolls of the Troll Forest want meat, stone and to be left alone. The Dominion can offer two of the three."
 zin_volgan_two_darks:0 "Two Darks, One Field"
 zin_volgan_two_darks_desc:0 "The south and the north march under one sky against one foe. For a season the living world holds its breath."
 zin_volgan_two_darks_one_field:0 "Two Darks, One Field"
 zin_volgan_two_darks_one_field_desc:0 "The south and the north march under one sky, against one foe. For a season, the living world holds its breath."
 zin_volgan_veil_of_storms:0 "The Veil of Storms"
 zin_volgan_veil_of_storms_desc:0 "The storms of the Ember Lands hide what lies beneath them. The world sees weather where it should see armies."
 zin_volgan_voice_in_the_heat:0 "The Voice in the Heat"
 zin_volgan_voice_in_the_heat_desc:0 "In the dark of the throne room a voice speaks out of the heat, and the court bows. Whether it comes from the lord or the wind, no one dares ask."
 zin_volgan_voices_to_the_dark_lands:0 "Voices to the Dark Lands"
 zin_volgan_voices_to_the_dark_lands_desc:0 "Envoys are sent to the independent holds of the Dark Lands with gifts, flattery and a plain statement of the south's strength. Few will answer, and fewer will believe."
 zin_volgan_volgan_takes_the_field:0 "Volgan Takes the Field"
 zin_volgan_volgan_takes_the_field_desc:0 "The lord himself rides out of the storm at the head of the host. The sight of him turns the strongest knight's knees to water."
 zin_volgan_wait_for_the_storm:0 "Wait for the Storm"
 zin_volgan_wait_for_the_storm_desc:0 "The Dominion is patient. The world will find its own war, and when it does, Volgan will strike out of the storm where no one is looking."
 zin_volgan_war_forges:0 "War-Forges of Nafeher"
 zin_volgan_war_forges_desc:0 "The mighty forges of Nafeher are lit for the first time in an age. The anvils are old, the hammers are new, and the smoke rises through a vent a mile wide."
 zin_volgan_warlords_seated:0 "The Warlords Seated"
 zin_volgan_warlords_seated_desc:0 "The warlords sit at the high table. Their hosts are fewer and harder, and the orders must wait their turn."
 zin_volgan_watchers_at_the_abyss:0 "Watchers at the Abyss"
 zin_volgan_watchers_at_the_abyss_desc:0 "Watchers are posted at the lip of the Abyss, where a stair of black stone descends into red-lit darkness. They report what they hear, and what they hear is not wind."
 zin_volgan_what_remains:0 "What Remains of Volgan"
 zin_volgan_what_remains_desc:0 "Something remains of Volgan. No one living can say what, or whether it hears."
 zin_volgan_whispers_in_parim:0 "Whispers in Parim"
 zin_volgan_whispers_in_parim_desc:0 "Tales are told in the taverns of Parim that Volgan is a nursery fable and the Ember Lands a ruin. Those who tell them are well paid."
 zin_volgan.1.a:0 "Let them kneel."
 zin_volgan.1.d:0 "The Ember Herald, the Grave-Warden and Ghorvak of the Hundred Clubs have come to Nafeher. They stand before the black throne in silence, awaiting the lord's command."
 zin_volgan.1.t:0 "The Captains Assemble"
 zin_volgan.10.a:0 "Another year, then."
 zin_volgan.10.d:0 "The scouts return empty-handed. The stair is dark, the air is cold, and nothing has answered. The captain says that it was like speaking to a well."
 zin_volgan.10.t:0 "The Depths Are Silent"
 zin_volgan.11.a:0 "Seal the stair."
 zin_volgan.11.d:0 "The scouts did not return. A sound rose from the stair that afternoon and has not stopped, and the watchers are drawing back from the lip."
 zin_volgan.11.t:0 "The Depths Answer in Wrath"
 zin_volgan.12.a:0 "A thief from the north, long ago. Let the thief's master keep his prize, for now."
 zin_volgan.12.d:0 "In the deep there is a niche carved for a jewel that was taken long ago. A thief from the north, long ago, took it, and the setting has been empty since. The court agrees to let the thief's master keep his prize, for now."
 zin_volgan.12.t:0 "The Empty Setting"
 zin_volgan.13.a:0 "Dondor would make fine spoils."
 zin_volgan.13.b:0 "Goldoroth bows to no spirit."
 zin_volgan.13.d:0 "A messenger in storm-grey livery stands in the hall of Goldoroth. He speaks politely of the south's strength, the north's weakness and the spoils of Dondor, and he does not use the word master."
 zin_volgan.13.t:0 "An Envoy from the South"
 zin_volgan.14.a:0 "Watch the cold north for it."
 zin_volgan.14.d:0 "Word has reached Nafeher of a green crystal, the heart of an old shield-bearer, carried somewhere in the cold north. The lord has wanted it for a long time."
 zin_volgan.14.t:0 "The Green Crystal"
 zin_volgan.15.a:0 "Let the south keep the south."
 zin_volgan.15.b:0 "The dead answer no one."
 zin_volgan.15.d:0 "A messenger has come from the south to the black isles, bearing a sealed message. It asks that the south keep the south, and the north its own. No one in the north has ever answered."
 zin_volgan.15.t:0 "A Word to the Mistake"
 zin_volgan.16.a:0 "Find him."
 zin_volgan.16.d:0 "A single man walks the roads of the north, and wherever he walks the dead are stirred. The lord has taken notice, and has set his hosts to find him."
 zin_volgan.16.t:0 "The Champion of Men"
 zin_volgan.17.a:0 "Rule in his name."
 zin_volgan.17.b:0 "Rule as he would."
 zin_volgan.17.d:0 "The lord's body is gone. His throne is silent, his storm has thinned, and the hosts of the south wait for a word. No one living can say what remains, or whether it hears."
 zin_volgan.17.t:0 "What Remains of Volgan"
 zin_volgan.18.a:0 "Then take it from him."
 zin_volgan.18.d:0 "The green crystal is not in the cold north. It is in the keeping of a champion of men, and the lord has sent word to the Dominion's hosts: take it from him."
 zin_volgan.18.t:0 "The Green Crystal Taken"
 zin_volgan.2.a:0 "Accept the quiet."
 zin_volgan.2.b:0 "We know what the quiet hides."
 zin_volgan.2.d:0 "A courier has come to Mirolon from the south with a message in the old courtly forms. Nafeher offers a quiet peace between old rivals, free of tolls, spies and quarrels. The court of Mirolon wonders what the quiet hides."
 zin_volgan.2.t:0 "Words from Nafeher"
 zin_volgan.3.a:0 "We come."
 zin_volgan.3.b:0 "We come, slowly."
 zin_volgan.3.d:0 "The lord of Nafeher has summoned his sworn lords to court. The summons is in the old form, and the penalty for ignoring it is not stated."
 zin_volgan.3.t:0 "Summoned to Nafeher"
 zin_volgan.4.a:0 "The Dominion marches as one."
 zin_volgan.4.d:0 "The lords of the Dominion gather in the great hall of Nafeher and are shown the plan. They have the grace to look afraid, and the sense to say nothing."
 zin_volgan.4.t:0 "The War-Council"
 zin_volgan.5.a:0 "Speak as a guest."
 zin_volgan.5.b:0 "Speak as a master."
 zin_volgan.5.d:0 "Volgan's envoy stands in the court of the King of Demons, in a hall of living flame. He must decide whether to speak as a guest or as a master, and the King is watching which he chooses."
 zin_volgan.5.t:0 "The Court in the Nether"
 zin_volgan.6.a:0 "Pay it."
 zin_volgan.6.b:0 "The Dominion pays no one."
 zin_volgan.6.d:0 "The King of Demons has sent his bill to Nafeher: a sheet of black glass with no figures on it. The Dominion's treasurers can read it, and they are pale."
 zin_volgan.6.t:0 "The King's Due"
 zin_volgan.7.a:0 "Watch, and wait."
 zin_volgan.7.d:0 "The watchers at the lip of the Abyss report sounds from the stair at night. They are not footsteps, nor voices, nor wind, and the watchers will not describe them further."
 zin_volgan.7.t:0 "Watchers at the Abyss"
 zin_volgan.9.a:0 "Let them climb."
 zin_volgan.9.d:0 "The scouts have returned from the Abyss, and behind them come others. They are tall, thin and silent, and they stand at the foot of the stair waiting to be spoken to."
 zin_volgan.9.t:0 "The Depths Answer"
