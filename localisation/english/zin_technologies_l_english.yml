 zin_cat_warships_research:0 "Warships Research"
 zin_cat_yards:0 "Shipyards"
 zin_cat_yards_research:0 "Shipyards Research"
 zin_doctrine_folder_air:0 "Doctrine of the Winged"
 zin_doctrine_folder_air_desc:0 "How the winged are taught to hunt, scout and strike."
 zin_doctrine_folder_land:0 "Doctrine of the Host"
 zin_doctrine_folder_land_desc:0 "How the hosts of a realm are taught to stand, march and break."
 zin_doctrine_folder_naval:0 "Sea Doctrine"
 zin_doctrine_folder_naval_desc:0 "How the fleets of a realm are taught to row, sail and board."
 zin_doctrine_folder_special_forces:0 "Hidden Doctrine"
 zin_doctrine_folder_special_forces_desc:0 "Held in reserve. Nothing of this folder is shown."
 zin_engines_folder:0 "Engines and Walls"
 zin_engines_folder_desc:0 "Throwing engines and bolt-throwers, and the walls and harbour chains that answer them."
 zin_gd_command_of_the_sea:0 "The Command of the Sea"
 zin_gd_command_of_the_sea_desc:0 "Win the sea with the weight of the line: warships in order of battle, galleys on the flanks."
 zin_gd_corsair_fleets:0 "The Corsair Fleets"
 zin_gd_corsair_fleets_desc:0 "Win the trade with hidden hulls: strike the cogs, burn the quays and be gone by dawn."
 zin_gd_deathless_tide:0 "The Deathless Tide"
 zin_gd_deathless_tide_desc:0 "The dead that Zol raises need no rest, no bread and no hope. They stand because he wills it."
 zin_gd_grave_muster:0 "The Grave Muster"
 zin_gd_grave_muster_desc:0 "The dead rise, march and fall, and rise again at the next muster."
 zin_gd_great_muster:0 "The Great Muster"
 zin_gd_great_muster_desc:0 "Call every able man to the banner. A host of many makes up in numbers what it lacks in craft."
 zin_gd_griffin_eyries:0 "Griffin Eyries"
 zin_gd_griffin_eyries_desc:0 "The doctrine of the bred beasts: many wings, quick and light, loosed from the cliff-top roosts."
 zin_gd_horse_and_lance:0 "Horse and Lance"
 zin_gd_horse_and_lance_desc:0 "Strike from the saddle and let the foot follow. The doctrine of the riders of the plains."
 zin_gd_nether_fury:0 "Nether Fury"
 zin_gd_nether_fury_desc:0 "The Netherborn fight with the fury of those who have nothing left to lose."
 zin_gd_oar_and_ram:0 "Oar and Ram"
 zin_gd_oar_and_ram_desc:0 "Win the coast with fast galleys: oars for speed, the ram for the kill and boarders to follow."
 zin_gd_old_ways:0 "The Old Ways"
 zin_gd_old_ways_desc:0 "The elves fight as they have always fought: by ground, by bow and by patience."
 zin_gd_shield_wall:0 "The Shield Wall"
 zin_gd_shield_wall_desc:0 "Hold the line, dig in and let the foe break upon it. The doctrine of Aenor and the old crowns."
 zin_gd_strength_of_the_wild:0 "Strength of the Wild"
 zin_gd_strength_of_the_wild_desc:0 "The great kin fight as they live: in groves, on mountains and in the cold, and they are hard to move."
 zin_gd_sun_guard:0 "The Sun Guard"
 zin_gd_sun_guard_desc:0 "Few, tall and slow to move, the Sunhot hold a field as a wall holds a gate."
 zin_gd_warband:0 "Blood and Warband"
 zin_gd_warband_desc:0 "A warband lives for the charge. It hits first, hits hardest and hits in the dark."
 zin_gd_wings_of_the_mountain:0 "Wings of the Mountain"
 zin_gd_wings_of_the_mountain_desc:0 "The doctrine of dragon pacts: few wings, great strength and a rider who knows his beast."
 zin_lore_folder:0 "Lore and Wards"
 zin_lore_folder_desc:0 "Healers' craft, wardsong and hallowed arms, and the dark rites kept in the south."
 zin_mounts_folder:0 "Mounts and Kin"
 zin_mounts_folder_desc:0 "Horses, camels and the great kin: what carries a host to battle and what outweighs it when it arrives."
 zin_naval_folder:0 "Galleys and Warships"
 zin_naval_folder_desc:0 "Hulls, oars and sails, and the harbours that feed them."
 zin_skies_folder:0 "Eyries"
 zin_skies_folder_desc:0 "The lore of the winged: dragon keeping and, where the beasts are bred, griffin riding."
 zin_sub_ambush_and_raid:0 "Ambush and Raid"
 zin_sub_ambush_and_raid_darkened_blades:0 "Darkened Blades"
 zin_sub_ambush_and_raid_darkened_blades_desc:0 "Blades blackened with soot do not shine in moonlight."
 zin_sub_ambush_and_raid_desc:0 "Strike from cover, strike at night, and withdraw before the enemy can gather."
 zin_sub_ambush_and_raid_forest_hides:0 "Forest Hides"
 zin_sub_ambush_and_raid_forest_hides_desc:0 "Fighters learn to wait in cover without a sound."
 zin_sub_ambush_and_raid_rolling_withdrawal:0 "Rolling Withdrawal"
 zin_sub_ambush_and_raid_rolling_withdrawal_desc:0 "A raiding party falls back in good order, covering its own retreat."
 zin_sub_archer_screens:0 "Archer Screens"
 zin_sub_archer_screens_covering_fire:0 "Covering Fire"
 zin_sub_archer_screens_covering_fire_desc:0 "Archers shoot from behind stakes and shields, and are hard to reach."
 zin_sub_archer_screens_desc:0 "Archers loose over the heads of the foot, and the enemy has to close under a hail of shafts."
 zin_sub_archer_screens_long_draws:0 "Long Draws"
 zin_sub_archer_screens_long_draws_desc:0 "Archers practise until their draw is long and steady, and their fire holds to the last shaft."
 zin_sub_archer_screens_massed_volleys:0 "Massed Volleys"
 zin_sub_archer_screens_massed_volleys_desc:0 "Whole companies loose together, and the arrows fall as one."
 zin_sub_ballista_decks:0 "Ballista Decks"
 zin_sub_ballista_decks_catapult_fire:0 "Catapult Fire"
 zin_sub_ballista_decks_catapult_fire_desc:0 "Catapult decks fling stones and burning pots at the enemy's sails."
 zin_sub_ballista_decks_desc:0 "Decks of ballistae sweep the enemy's rail with long bolts."
 zin_sub_ballista_decks_long_bolts:0 "Long Bolts"
 zin_sub_ballista_decks_long_bolts_desc:0 "Heavier bolts with longer shafts carry further across the water."
 zin_sub_ballista_decks_steady_aim:0 "Steady Aim"
 zin_sub_ballista_decks_steady_aim_desc:0 "Crews learn to wait for the roll of the sea and loose on the rise."
 zin_sub_bolt_walls:0 "Bolt Walls"
 zin_sub_bolt_walls_desc:0 "Ballistae and scorpions are set in rows behind the line, and a charge of horse or monster runs into a wall of bolts."
 zin_sub_bolt_walls_long_bolts:0 "Long Bolts"
 zin_sub_bolt_walls_long_bolts_desc:0 "Heavier bolts with broader heads fly further and bite deeper."
 zin_sub_bolt_walls_rows_of_scorpions:0 "Rows of Scorpions"
 zin_sub_bolt_walls_rows_of_scorpions_desc:0 "Scorpions set wheel to wheel make a fence that nothing winged can cross."
 zin_sub_bolt_walls_steady_beds:0 "Steady Beds"
 zin_sub_bolt_walls_steady_beds_desc:0 "Engines mounted on deeper beds stand firm and are harder to overturn."
 zin_sub_coastal_watch:0 "Coastal Watch"
 zin_sub_coastal_watch_desc:0 "Galleys keep the home waters, with watch-fires on every headland."
 zin_sub_coastal_watch_harbour_chain_drill:0 "Harbour Chain Drill"
 zin_sub_coastal_watch_harbour_chain_drill_desc:0 "Crews practise closing the harbour chain before the foe's prow is in the mouth."
 zin_sub_coastal_watch_home_waters:0 "Home Waters"
 zin_sub_coastal_watch_home_waters_desc:0 "Fleets that fight near their harbours are fed and mended with ease."
 zin_sub_coastal_watch_signal_fires:0 "Signal Fires"
 zin_sub_coastal_watch_signal_fires_desc:0 "A line of fires along the coast passes a warning from port to port."
 zin_sub_cog_escorts:0 "Cog Escorts"
 zin_sub_cog_escorts_desc:0 "Galleys sail beside the cogs and drive off any raider that comes near."
 zin_sub_cog_escorts_lanes_learned:0 "Lanes Learned"
 zin_sub_cog_escorts_lanes_learned_desc:0 "Escorts learn which waters the raiders prefer and keep to the others."
 zin_sub_cog_escorts_sweeps:0 "Sweeps"
 zin_sub_cog_escorts_sweeps_desc:0 "Galleys sweep ahead of the cogs and flush out the lurking raiders."
 zin_sub_cog_escorts_watch_the_weather:0 "Watch the Weather"
 zin_sub_cog_escorts_watch_the_weather_desc:0 "Pilots read the sky and tell the fleet when to run for harbour."
 zin_sub_corsair_packs:0 "Corsair Packs"
 zin_sub_corsair_packs_desc:0 "Raiders hunt in threes and fall on a cog from all sides."
 zin_sub_corsair_packs_packs_of_three:0 "Packs of Three"
 zin_sub_corsair_packs_packs_of_three_desc:0 "Three hulls working together take a cog that one could not."
 zin_sub_corsair_packs_rally_cry:0 "Rally Cry"
 zin_sub_corsair_packs_rally_cry_desc:0 "A cry from the lead hull and every raider turns as one."
 zin_sub_corsair_packs_shared_lookouts:0 "Shared Lookouts"
 zin_sub_corsair_packs_shared_lookouts_desc:0 "Lookouts on each hull call to the others, and the pack sees twice as far."
 zin_sub_dread:0 "Dread"
 zin_sub_dread_black_banners:0 "Black Banners"
 zin_sub_dread_black_banners_desc:0 "Black banners and drums announce the host a day before it arrives."
 zin_sub_dread_desc:0 "The sight of the host is itself a weapon, and the foe who sees it has lost heart before the first blow."
 zin_sub_dread_no_quarter:0 "No Quarter"
 zin_sub_dread_no_quarter_desc:0 "A foe that knows no mercy is shown will break sooner."
 zin_sub_dread_ships:0 "Dread Ships"
 zin_sub_dread_ships_burn_the_quays:0 "Burn the Quays"
 zin_sub_dread_ships_burn_the_quays_desc:0 "A raider in the harbour mouth can set a whole waterfront alight."
 zin_sub_dread_ships_desc:0 "A ship that burns the quays of a port has taught every port to fear its name."
 zin_sub_dread_ships_pitch_and_fire:0 "Pitch and Fire"
 zin_sub_dread_ships_pitch_and_fire_desc:0 "Fire-pots in the bows set a rival's sails alight before the hulls touch."
 zin_sub_dread_ships_terror_of_the_dark:0 "Terror of the Dark"
 zin_sub_dread_ships_terror_of_the_dark_desc:0 "Crews that meet a dread ship at night seldom stay to fight."
 zin_sub_dread_terror_of_the_dark:0 "Terror of the Dark"
 zin_sub_dread_terror_of_the_dark_desc:0 "The dark hours belong to the host, and the foe will not stand in them."
 zin_sub_eyrie_scouts:0 "Eyrie Scouts"
 zin_sub_eyrie_scouts_desc:0 "Scouts ride high over the home country and see every raider long before it reaches the roosts."
 zin_sub_eyrie_scouts_home_skies:0 "Home Skies"
 zin_sub_eyrie_scouts_home_skies_desc:0 "Riders who know their own valleys fight best above them."
 zin_sub_eyrie_scouts_watch_posts:0 "Watch Posts"
 zin_sub_eyrie_scouts_watch_posts_desc:0 "Posts on every hilltop signal the wing before the foe is in sight."
 zin_sub_eyrie_scouts_wide_eyes:0 "Wide Eyes"
 zin_sub_eyrie_scouts_wide_eyes_desc:0 "A scout sees a whole province in one sweep and returns to say what is in it."
 zin_sub_field_engines:0 "Field Engines"
 zin_sub_field_engines_always_ready:0 "Always Ready"
 zin_sub_field_engines_always_ready_desc:0 "Spare skeins, spare arms and a spare hand for every engine."
 zin_sub_field_engines_desc:0 "Light engines travel with the host and shoot in the open, not only at walls."
 zin_sub_field_engines_light_frames:0 "Light Frames"
 zin_sub_field_engines_light_frames_desc:0 "Frames of ash and rope can be taken apart, carried and raised again in an hour."
 zin_sub_field_engines_ranged_shots:0 "Ranged Shots"
 zin_sub_field_engines_ranged_shots_desc:0 "Crews learn to range their engines by marks cut into the frame."
 zin_sub_fire_from_above:0 "Fire From Above"
 zin_sub_fire_from_above_desc:0 "The dragon is loosed on the host below, and what it burns is not rebuilt."
 zin_sub_fire_from_above_near_the_front:0 "Near the Front"
 zin_sub_fire_from_above_near_the_front_desc:0 "Roosts are set close to the line, and a dragon can be there in an hour."
 zin_sub_fire_from_above_scorched_lines:0 "Scorched Lines"
 zin_sub_fire_from_above_scorched_lines_desc:0 "A dragon burns a whole rank of foot in a single pass."
 zin_sub_fire_from_above_strike_the_wagons:0 "Strike the Wagons"
 zin_sub_fire_from_above_strike_the_wagons_desc:0 "Riders learn to burn the baggage first, and the host starves."
 zin_sub_forest_ways:0 "Forest Ways"
 zin_sub_forest_ways_branch_and_shadow:0 "Branch and Shadow"
 zin_sub_forest_ways_branch_and_shadow_desc:0 "Archers shoot from the boughs and are seen only after the shaft lands."
 zin_sub_forest_ways_desc:0 "Elven foot know the forest as no other host does, and fight best among the trees."
 zin_sub_forest_ways_silent_steps:0 "Silent Steps"
 zin_sub_forest_ways_silent_steps_desc:0 "The elves cross the leaf-mould without a sound."
 zin_sub_forest_ways_the_green_wall:0 "The Green Wall"
 zin_sub_forest_ways_the_green_wall_desc:0 "In their own woods the elves are a wall that cannot be seen until it strikes."
 zin_sub_grave_ranks:0 "Grave Ranks"
 zin_sub_grave_ranks_desc:0 "The risen dead are drilled in dense ranks, and an order given to one is carried out by all."
 zin_sub_grave_ranks_no_retreat:0 "No Retreat"
 zin_sub_grave_ranks_no_retreat_desc:0 "The grave hosts have no will to flee, and each body must be struck down where it stands."
 zin_sub_grave_ranks_rank_on_rank:0 "Rank on Rank"
 zin_sub_grave_ranks_rank_on_rank_desc:0 "The grave hosts close up as one body, and a blow that fells one does not shake the others."
 zin_sub_grave_ranks_unbroken_silence:0 "Unbroken Silence"
 zin_sub_grave_ranks_unbroken_silence_desc:0 "A host that never cries out cannot be frightened by cries."
 zin_sub_harbour_works:0 "Harbour Works"
 zin_sub_harbour_works_desc:0 "Yards, stores and shipwrights at every quay keep the fleet fed and mended."
 zin_sub_harbour_works_quick_refit:0 "Quick Refit"
 zin_sub_harbour_works_quick_refit_desc:0 "Shipwrights mend a hull in the time it takes to unload its cargo."
 zin_sub_harbour_works_repair_at_sea:0 "Repair at Sea"
 zin_sub_harbour_works_repair_at_sea_desc:0 "Carpenters aboard every ship mend leaks and splinters while the fleet sails."
 zin_sub_harbour_works_victualling_yards:0 "Victualling Yards"
 zin_sub_harbour_works_victualling_yards_desc:0 "Yards stock every harbour with biscuit, water and rope."
 zin_sub_heavy_charge:0 "Heavy Charge"
 zin_sub_heavy_charge_closed_knees:0 "Closed Knees"
 zin_sub_heavy_charge_closed_knees_desc:0 "Knights ride knee to knee, and no gap opens for a lance to enter."
 zin_sub_heavy_charge_desc:0 "Mailed knights ride in tight ranks at the centre of the foe's line, and what they hit does not stand."
 zin_sub_heavy_charge_the_last_thunder:0 "The Last Thunder"
 zin_sub_heavy_charge_the_last_thunder_desc:0 "The knights rally for one more charge, and the host is moved by the sight."
 zin_sub_heavy_charge_weight_of_iron:0 "Weight of Iron"
 zin_sub_heavy_charge_weight_of_iron_desc:0 "Horse and rider together meet the line like a falling wall."
 zin_sub_hidden_special_forces:0 "Held in Reserve"
 zin_sub_hidden_special_forces_desc:0 "Nothing of this doctrine is shown. It exists so that the folder is not empty."
 zin_sub_hidden_special_forces_reserve_one:0 "Reserve One"
 zin_sub_hidden_special_forces_reserve_one_desc:0 "Held in reserve."
 zin_sub_hidden_special_forces_reserve_three:0 "Reserve Three"
 zin_sub_hidden_special_forces_reserve_three_desc:0 "Held in reserve."
 zin_sub_hidden_special_forces_reserve_two:0 "Reserve Two"
 zin_sub_hidden_special_forces_reserve_two_desc:0 "Held in reserve."
 zin_sub_hold_the_line:0 "Hold the Line"
 zin_sub_hold_the_line_deep_ditches:0 "Deep Ditches"
 zin_sub_hold_the_line_deep_ditches_desc:0 "Ditches dug twice as deep keep the foe at the foot of the rampart."
 zin_sub_hold_the_line_desc:0 "The host is taught to stay in its trenches and let the enemy tire himself on its works."
 zin_sub_hold_the_line_not_a_step_back:0 "Not a Step Back"
 zin_sub_hold_the_line_not_a_step_back_desc:0 "A line that will not yield can be broken only by killing every man in it."
 zin_sub_hold_the_line_sentries_on_the_works:0 "Sentries on the Works"
 zin_sub_hold_the_line_sentries_on_the_works_desc:0 "Sentries on every rampart see an attack before it starts."
 zin_sub_horse_archery:0 "Horse Archery"
 zin_sub_horse_archery_desc:0 "Mounted bowmen shoot at the gallop and are gone before the foe can answer."
 zin_sub_horse_archery_light_mail:0 "Light Mail"
 zin_sub_horse_archery_light_mail_desc:0 "A short coat of rings is light enough for a bowman in the saddle."
 zin_sub_horse_archery_parting_volleys:0 "Parting Volleys"
 zin_sub_horse_archery_parting_volleys_desc:0 "A rider shoots over his shoulder as he withdraws, and the pursuit is checked."
 zin_sub_horse_archery_wheel_and_loose:0 "Wheel and Loose"
 zin_sub_horse_archery_wheel_and_loose_desc:0 "The whole line wheels as one and looses as it turns."
 zin_sub_kin_handling:0 "Kin Handling"
 zin_sub_kin_handling_desc:0 "Drovers and speakers learn to command the great kin and keep them in the fight."
 zin_sub_kin_handling_drovers_calls:0 "Drovers' Calls"
 zin_sub_kin_handling_drovers_calls_desc:0 "A call, a horn and a goad keep a troll or a giant standing when it would flee."
 zin_sub_kin_handling_goad_and_rein:0 "Goad and Rein"
 zin_sub_kin_handling_goad_and_rein_desc:0 "Handlers drive the kin at the weakest point of the foe's line."
 zin_sub_kin_handling_rage_harnessed:0 "Rage Harnessed"
 zin_sub_kin_handling_rage_harnessed_desc:0 "A kin that has been well handled can take a wound and fight on."
 zin_sub_lance_wings:0 "Lance Wings"
 zin_sub_lance_wings_close_formation:0 "Close Formation"
 zin_sub_lance_wings_close_formation_desc:0 "Riders learn to turn together, and the wing becomes one beast."
 zin_sub_lance_wings_closed_wings:0 "Closed Wings"
 zin_sub_lance_wings_closed_wings_desc:0 "A wing that flies close breaks a lone foe in a single pass."
 zin_sub_lance_wings_desc:0 "Griffin knights ride in tight wings with levelled lances and sweep the sky clear."
 zin_sub_lance_wings_veteran_lances:0 "Veteran Lances"
 zin_sub_lance_wings_veteran_lances_desc:0 "A wing that has lost no one learns to lose no one."
 zin_sub_levy_drill:0 "Levy Drill"
 zin_sub_levy_drill_desc:0 "Levies are called up, drilled at the village green and sent home, and a realm can raise a host in half the time."
 zin_sub_levy_drill_drilled_hands:0 "Drilled Hands"
 zin_sub_levy_drill_drilled_hands_desc:0 "Levies who have drilled together keep their nerve longer."
 zin_sub_levy_drill_muster_days:0 "Muster Days"
 zin_sub_levy_drill_muster_days_desc:0 "Fixed days of drill each season keep every village ready."
 zin_sub_levy_drill_village_pride:0 "Village Pride"
 zin_sub_levy_drill_village_pride_desc:0 "Men fight harder beside their neighbours and give up less easily."
 zin_sub_line_of_battle:0 "Line of Battle"
 zin_sub_line_of_battle_closed_ranks:0 "Closed Ranks"
 zin_sub_line_of_battle_closed_ranks_desc:0 "A line sailed close leaves no gap for a ram to enter."
 zin_sub_line_of_battle_concentrated_volleys:0 "Concentrated Volleys"
 zin_sub_line_of_battle_concentrated_volleys_desc:0 "The whole line fires at the same mark, and the mark does not survive."
 zin_sub_line_of_battle_desc:0 "Warships sail in one line, bow to stern, and fire in order, each covering the next."
 zin_sub_line_of_battle_flagship_banners:0 "Flagship Banners"
 zin_sub_line_of_battle_flagship_banners_desc:0 "The admiral's banner flies high, and every captain sees it."
 zin_sub_long_marches:0 "Long Marches"
 zin_sub_long_marches_desc:0 "The host learns to cover great distances in good order and arrive ready to fight."
 zin_sub_long_marches_foraging_parties:0 "Foraging Parties"
 zin_sub_long_marches_foraging_parties_desc:0 "Parties sent ahead gather food from the country before the host arrives."
 zin_sub_long_marches_forced_pace:0 "Forced Pace"
 zin_sub_long_marches_forced_pace_desc:0 "A host trained to march hard reaches the field a day sooner."
 zin_sub_long_marches_road_discipline:0 "Road Discipline"
 zin_sub_long_marches_road_discipline_desc:0 "A column that keeps its order loses fewer men to the road."
 zin_sub_night_raiders:0 "Night Raiders"
 zin_sub_night_raiders_dark_hulls:0 "Dark Hulls"
 zin_sub_night_raiders_dark_hulls_desc:0 "Hulls blackened with tar and sails dyed the shade of dusk."
 zin_sub_night_raiders_desc:0 "Raiders strike under cover of darkness and hide by day."
 zin_sub_night_raiders_slip_away:0 "Slip Away"
 zin_sub_night_raiders_slip_away_desc:0 "After the strike a raider turns for the nearest cove and is lost to sight."
 zin_sub_night_raiders_strikes_in_the_dark:0 "Strikes in the Dark"
 zin_sub_night_raiders_strikes_in_the_dark_desc:0 "Raiders learn to find their quarry by sound and by the stars."
 zin_sub_oar_squadrons:0 "Oar Squadrons"
 zin_sub_oar_squadrons_desc:0 "Galleys keep station in lines of oars and can turn, charge and withdraw as one."
 zin_sub_oar_squadrons_packs_of_galleys:0 "Packs of Galleys"
 zin_sub_oar_squadrons_packs_of_galleys_desc:0 "Galleys hunt in packs and surround a lone warship."
 zin_sub_oar_squadrons_rowers_pride:0 "Rowers' Pride"
 zin_sub_oar_squadrons_rowers_pride_desc:0 "Rowers who have pulled together for years keep a stroke that does not tire."
 zin_sub_oar_squadrons_swift_withdrawal:0 "Swift Withdrawal"
 zin_sub_oar_squadrons_swift_withdrawal_desc:0 "A squadron can back water and be gone before the foe has closed."
 zin_sub_ocean_pilots:0 "Ocean Pilots"
 zin_sub_ocean_pilots_desc:0 "Pilots who know the stars and the currents guide fleets across the open sea."
 zin_sub_ocean_pilots_landfall:0 "Landfall"
 zin_sub_ocean_pilots_landfall_desc:0 "Pilots who have crossed the sea before know where to land a host."
 zin_sub_ocean_pilots_star_and_chart:0 "Star and Chart"
 zin_sub_ocean_pilots_star_and_chart_desc:0 "A pilot with a chart and a clear night can find any shore."
 zin_sub_ocean_pilots_storm_sense:0 "Storm Sense"
 zin_sub_ocean_pilots_storm_sense_desc:0 "Old pilots feel a gale in the swell a day before it breaks."
 zin_sub_raiding_riders:0 "Raiding Riders"
 zin_sub_raiding_riders_desc:0 "Light riders live off the land and strike far behind the line."
 zin_sub_raiding_riders_far_riding:0 "Far Riding"
 zin_sub_raiding_riders_far_riding_desc:0 "Riders learn the long roads and cross a province in a day."
 zin_sub_raiding_riders_fast_forage:0 "Fast Forage"
 zin_sub_raiding_riders_fast_forage_desc:0 "Riders take what they need from the country they cross."
 zin_sub_raiding_riders_hit_and_away:0 "Hit and Away"
 zin_sub_raiding_riders_hit_and_away_desc:0 "Raiders strike, wheel and go before the foe is ready."
 zin_sub_ram_and_grapple:0 "Ram and Grapple"
 zin_sub_ram_and_grapple_boarders_at_the_rail:0 "Boarders at the Rail"
 zin_sub_ram_and_grapple_boarders_at_the_rail_desc:0 "Boarders wait at the rail and spring the moment the hulls touch."
 zin_sub_ram_and_grapple_desc:0 "Close with the foe, ram him and board in the confusion."
 zin_sub_ram_and_grapple_grapnel_drill:0 "Grapnel Drill"
 zin_sub_ram_and_grapple_grapnel_drill_desc:0 "Crews learn to hold a ship fast with hooks and chains."
 zin_sub_ram_and_grapple_iron_shod_prows:0 "Iron-Shod Prows"
 zin_sub_ram_and_grapple_iron_shod_prows_desc:0 "Prows shod with iron strike harder and break less."
 zin_sub_sappers_craft:0 "Sappers' Craft"
 zin_sub_sappers_craft_desc:0 "Sappers lay bridges, breach palisades and dig a host across any river in a night."
 zin_sub_sappers_craft_mine_and_counter_mine:0 "Mine and Counter-Mine"
 zin_sub_sappers_craft_mine_and_counter_mine_desc:0 "Sappers hear the enemy's tunnels through the earth and dig to meet them."
 zin_sub_sappers_craft_night_work:0 "Night Work"
 zin_sub_sappers_craft_night_work_desc:0 "Sappers do their hardest work in the dark, where no archer can find them."
 zin_sub_sappers_craft_pontoon_teams:0 "Pontoon Teams"
 zin_sub_sappers_craft_pontoon_teams_desc:0 "Teams carry boats and planks on their backs and bridge a stream before the foe can react."
 zin_sub_sea_castles:0 "Sea Castles"
 zin_sub_sea_castles_bastion_decks:0 "Bastion Decks"
 zin_sub_sea_castles_bastion_decks_desc:0 "Fighting towers at bow and stern shoot down into any boat that comes alongside."
 zin_sub_sea_castles_desc:0 "Great warships are built as floating castles, tall and thick, and almost impossible to board."
 zin_sub_sea_castles_fire_watch:0 "Fire Watch"
 zin_sub_sea_castles_fire_watch_desc:0 "A fire watch with buckets and wet hides keeps burning pitch from taking hold."
 zin_sub_sea_castles_layered_timbers:0 "Layered Timbers"
 zin_sub_sea_castles_layered_timbers_desc:0 "Hulls planked two and three layers deep stop a ram that would stave a lighter ship."
 zin_sub_shield_and_spear:0 "Shield and Spear"
 zin_sub_shield_and_spear_desc:0 "Short spears over locked shields: the foot hold their ground and dig in where they stand."
 zin_sub_shield_and_spear_ground_held:0 "Ground Held"
 zin_sub_shield_and_spear_ground_held_desc:0 "A line that has dug in does not give the ground back."
 zin_sub_shield_and_spear_locked_rims:0 "Locked Rims"
 zin_sub_shield_and_spear_locked_rims_desc:0 "Shields overlap more closely, and fewer blows find a gap."
 zin_sub_shield_and_spear_second_rank_thrusts:0 "Second Rank Thrusts"
 zin_sub_shield_and_spear_second_rank_thrusts_desc:0 "The rank behind thrusts over the shoulders of the first."
 zin_sub_siege_trains:0 "Siege Parks"
 zin_sub_siege_trains_desc:0 "Engines, ladders, rams and carters travel in one park, and a host can sit down before any wall."
 zin_sub_siege_trains_ram_and_ladder:0 "Ram and Ladder"
 zin_sub_siege_trains_ram_and_ladder_desc:0 "Rams and scaling ladders go forward with the engines, so a breach is stormed at once."
 zin_sub_siege_trains_sap_the_foot:0 "Sap the Foot"
 zin_sub_siege_trains_sap_the_foot_desc:0 "Diggers tunnel beneath a wall and prop its foundation, then burn the props."
 zin_sub_siege_trains_wall_breakers:0 "Wall Breakers"
 zin_sub_siege_trains_wall_breakers_desc:0 "Crews trained on one wall after another learn exactly where a wall is weakest."
 zin_sub_skirmish_lines:0 "Skirmish Lines"
 zin_sub_skirmish_lines_broken_ground_fighting:0 "Broken-Ground Fighting"
 zin_sub_skirmish_lines_broken_ground_fighting_desc:0 "Skirmishers are taught to use every ditch and thicket."
 zin_sub_skirmish_lines_desc:0 "Foot fight in open order, scouting ahead and falling back before a charge."
 zin_sub_skirmish_lines_light_marching:0 "Light Marching"
 zin_sub_skirmish_lines_light_marching_desc:0 "Packs are trimmed to the bare need, and the column moves faster."
 zin_sub_skirmish_lines_watchful_pickets:0 "Watchful Pickets"
 zin_sub_skirmish_lines_watchful_pickets_desc:0 "A ring of pickets warns the camp long before the foe is near."
 zin_sub_storm_riders:0 "Storm Riders"
 zin_sub_storm_riders_beacon_guided:0 "Beacon-Guided"
 zin_sub_storm_riders_beacon_guided_desc:0 "Watch-fires on the coast guide the dragon home through cloud and night."
 zin_sub_storm_riders_desc:0 "Dragons ride the gale over open water and fall on ships from out of the cloud."
 zin_sub_storm_riders_over_grey_water:0 "Over Grey Water"
 zin_sub_storm_riders_over_grey_water_desc:0 "A dragon can find a single ship in an empty sea."
 zin_sub_storm_riders_through_the_gale:0 "Through the Gale"
 zin_sub_storm_riders_through_the_gale_desc:0 "A rider and his beast learn to fly where others cannot."
 zin_sub_war_councils:0 "War Councils"
 zin_sub_war_councils_chart_tables:0 "Chart Tables"
 zin_sub_war_councils_chart_tables_desc:0 "Maps of the realm are kept in one hall, and a plan can be made in days."
 zin_sub_war_councils_counsel_of_captains:0 "Counsel of Captains"
 zin_sub_war_councils_counsel_of_captains_desc:0 "Captains of long standing are heard, and the plan is better for it."
 zin_sub_war_councils_desc:0 "Captains meet before the march, draw the plan on the table and each know what the others will do."
 zin_sub_war_councils_one_voice:0 "One Voice"
 zin_sub_war_councils_one_voice_desc:0 "In battle the whole host moves to one command."
 zin_sub_warband_rush:0 "Warband Rush"
 zin_sub_warband_rush_desc:0 "The warband charges at once and in a mass, and the first blow decides the fight."
 zin_sub_warband_rush_first_charge:0 "First Charge"
 zin_sub_warband_rush_first_charge_desc:0 "The first rush is the hardest blow a warband can strike."
 zin_sub_warband_rush_fury_unchecked:0 "Fury Unchecked"
 zin_sub_warband_rush_fury_unchecked_desc:0 "Once the warband is committed, nothing can turn it."
 zin_sub_warband_rush_howling_host:0 "Howling Host"
 zin_sub_warband_rush_howling_host_desc:0 "The din of a charging warband breaks the nerve of less fierce foes."
 zin_tech_anchor_stones:0 "The Anchor-Stones"
 zin_tech_anchor_stones_desc:0 "Stones that once held the dead to their task were broken at the end of the dark age. The masters of the grave rites search for the way to raise them again."
 zin_tech_arch_and_vault:0 "Arch and Vault"
 zin_tech_arch_and_vault_desc:0 "Masons roof wide halls and bridge deep gorges with a ring of wedged stones. Larger works go up in less time."
 zin_tech_armourers:0 "Armourers"
 zin_tech_armourers_desc:0 "Armourers with portable forges mend broken weapons on the march, and gather what the foe has dropped."
 zin_tech_arquebuses:0 "Arquebuses"
 zin_tech_arquebuses_desc:0 "Heavy hand-guns fired from a forked rest. Their ball stops a knight in plate at a hundred paces."
 zin_tech_assayers_rolls:0 "Assayers' Rolls"
 zin_tech_assayers_rolls_desc:0 "Assayers keep rolls of every seam they have tested, so no miner digs where the rock has already been proved poor."
 zin_tech_barded_griffins:0 "Barded Griffins"
 zin_tech_barded_griffins_desc:0 "Light barding of leather and scale lets a griffin close with its prey and come back."
 zin_tech_bark_and_hide:0 "Bark and Hide"
 zin_tech_bark_and_hide_desc:0 "Armour of hardened bark and hide makes no sound among the trees and turns a blow as well as mail."
 zin_tech_bastions:0 "Bastions"
 zin_tech_bastions_desc:0 "Angled towers that jut from the curtain let defenders shoot along the foot of every wall, so there is no blind ground to shelter an assault."
 zin_tech_bell_towers:0 "Bell-Towers"
 zin_tech_bell_towers_desc:0 "Every parish has its bell, and when the bells ring from tower to tower the levy is on the road by the next morning."
 zin_tech_black_powder:0 "Black Powder"
 zin_tech_black_powder_desc:0 "Saltpetre, sulphur and charcoal, ground together and kept dry, burn all at once. Packed into an iron tube behind a stone ball, the powder throws the ball through a wall."
 zin_tech_blackened_iron:0 "Blackened Iron"
 zin_tech_blackened_iron_desc:0 "Blades blackened in the pit-fires hit harder and are meant to be wielded in the dark."
 zin_tech_boarding_parties:0 "Boarding Parties"
 zin_tech_boarding_parties_desc:0 "Picked fighters, hooks and gangplanks turn any hull into a landing craft or a floating fortress."
 zin_tech_bound_demons:0 "Bound Demons"
 zin_tech_bound_demons_desc:0 "Demons held to service by binding oaths, who fight where they are sent and nowhere else."
 zin_tech_bronze_fleets:0 "Bronze Trade-Fleets"
 zin_tech_bronze_fleets_desc:0 "Fleets of bronze-bound trading ships sail under one charter, and every port wants their cargo."
 zin_tech_bronze_rams:0 "Bronze Rams"
 zin_tech_bronze_rams_desc:0 "Cast bronze beaks on stout galleys turn the fleet into a weapon: the rowers drive, the beak breaks."
 zin_tech_bronze_sheathing:0 "Bronze Sheathing"
 zin_tech_bronze_sheathing_desc:0 "Bronze plates below the waterline stop rot and borers, and a sheathed hull rams and is rammed with less harm."
 zin_tech_brute_ranks:0 "Brute Ranks"
 zin_tech_brute_ranks_desc:0 "The biggest men of the realm are fed for war from boyhood and put in the front rank."
 zin_tech_burrow_gardens:0 "Burrow-Gardens"
 zin_tech_burrow_gardens_desc:0 "Gardens on every slope above the burrows feed a village twice over, and the cellars below keep the harvest sweet all winter."
 zin_tech_camel_breeding:0 "Camel Breeding"
 zin_tech_camel_breeding_desc:0 "Camels bred for speed and patience carry warriors across sand no horse could cross."
 zin_tech_camel_corps:0 "Camel Host"
 zin_tech_camel_corps_desc:0 "In the dry lands riders go to war on camels, which cross sands and thirst that would kill a horse."
 zin_tech_cast_bombards:0 "Cast Bombards"
 zin_tech_cast_bombards_desc:0 "Founders cast bombards whole in bronze, in clay moulds sunk in the foundry floor. A cast piece bends before it bursts, and a light one can follow the host."
 zin_tech_catapults:0 "Catapults"
 zin_tech_catapults_desc:0 "Frames of timber and rope fling stones over walls. A host with catapults need not wait for a gate to open."
 zin_tech_chanceries:0 "Chanceries"
 zin_tech_chanceries_desc:0 "One office seals the realm's letters and reads its neighbours', and the same clerks learn both crafts."
 zin_tech_charcoal_leagues:0 "Charcoal-Burners' Leagues"
 zin_tech_charcoal_leagues_desc:0 "The woodland burners bind themselves into leagues and promise every forge its charcoal on a fixed day."
 zin_tech_chieftains_iron:0 "Chieftains' Iron"
 zin_tech_chieftains_iron_desc:0 "A chief who arms his whole warband from one forge has a warband that fights as one."
 zin_tech_cipher_scripts:0 "Cipher Scripts"
 zin_tech_cipher_scripts_desc:0 "Scribes agree on secret alphabets, so that a stolen letter is only a page of nonsense."
 zin_tech_cipher_wheels:0 "Cipher Wheels"
 zin_tech_cipher_wheels_desc:0 "Turning bronze wheels, a patient clerk can try a thousand keys against a stolen letter before supper."
 zin_tech_clan_muster:0 "Clan Muster"
 zin_tech_clan_muster_desc:0 "When the clan chief sends the fiery cross, every hall sends its sons, and kin stand beside kin in the line."
 zin_tech_composite_bows:0 "Composite Bows"
 zin_tech_composite_bows_desc:0 "Horn, sinew and wood are glued into one short bow that outshoots the plain stave and can be drawn from the saddle."
 zin_tech_cord_reckoning:0 "Cord-Reckoning"
 zin_tech_cord_reckoning_desc:0 "The cord-mothers of the drowned low country kept account of every field and of everything a field had given, one tie at a time. A realm that can read their cords can reckon what its own land can give without asking too much of it."
 zin_tech_cord_reckoning_recovered_tt:0 "The count of the cords and the count of the Eldest Cairn brought together"
 zin_tech_corned_powder:0 "Corned Powder"
 zin_tech_corned_powder_desc:0 "Powder pressed wet and dried in grains burns evenly, keeps on the march and throws the ball harder."
 zin_tech_corsair_craft:0 "Corsair Craft"
 zin_tech_corsair_craft_desc:0 "Lean, dark hulls that lurk in coves and strike the cogs of rivals before slipping out to sea."
 zin_tech_corsair_havens:0 "Corsair Havens"
 zin_tech_corsair_havens_desc:0 "Hidden coves with careening beaches and watchers on the cliffs keep the raiders fed, mended and out of sight."
 zin_tech_couched_lance:0 "The Couched Lance"
 zin_tech_couched_lance_desc:0 "With the lance held under the arm and the whole weight of horse and rider behind its point, a charge breaks a line outright."
 zin_tech_counting_houses:0 "Counting-Houses"
 zin_tech_counting_houses_desc:0 "Merchant houses keep ledgers of every bale and coin, and a city buys what it needs at the right price."
 zin_tech_courier_ciphers:0 "Couriers' Ciphers"
 zin_tech_courier_ciphers_desc:0 "The couriers of the old resistance carried letters no governor could read. Their keys were burned when the danger passed; scholars can work them out again from what survives."
 zin_tech_covered_yards:0 "Covered Yards"
 zin_tech_covered_yards_desc:0 "Roofs over the shipways and the timber yards let the work go on through rain and snow."
 zin_tech_crop_rotation:0 "Crop Rotation"
 zin_tech_crop_rotation_desc:0 "Grain, beans and fallow follow one another field by field, a way of farming that outlasted every hard winter of the occupation. Provisions come in steadier."
 zin_tech_crossbows:0 "Crossbows"
 zin_tech_crossbows_desc:0 "A stock, a lath and a trigger: any levy can be taught to shoot a bolt that pierces mail at fifty paces."
 zin_tech_crown_assizes:0 "Crown Assizes"
 zin_tech_crown_assizes_desc:0 "Royal judges ride from town to town with the bells and the barges, and a wrong done anywhere is heard within the season."
 zin_tech_crown_chargers:0 "Crown Chargers"
 zin_tech_crown_chargers_desc:0 "The royal studs breed for size and for nerve, and their chargers carry an armoured rider into a line without flinching."
 zin_tech_crown_foundries:0 "Crown Foundries"
 zin_tech_crown_foundries_desc:0 "The crown raises vast foundries under its own seal, and the greatest castings of the age are poured there."
 zin_tech_crown_post:0 "The Crown Post"
 zin_tech_crown_post_desc:0 "A royal office runs the pack trains on a fixed timetable, and the depots fill before they empty."
 zin_tech_crown_steel:0 "Crown Iron"
 zin_tech_crown_steel_desc:0 "The royal forges blend mountain iron with the best of every smithy, and a host goes to war with blades that match."
 zin_tech_culverins:0 "Culverins"
 zin_tech_culverins_desc:0 "Long, lighter bombards on wheeled carriages reach further than any engine and keep pace with the host."
 zin_tech_curtain_walls:0 "Curtain Walls"
 zin_tech_curtain_walls_desc:0 "Long walls link tower to tower and fort to fort, until a whole frontier can be held as one work."
 zin_tech_deathless_tide_1:0 "The Deathless Tide I"
 zin_tech_deathless_tide_1_desc:0 "The first stirring of the Old God's dead in the Mistake: shapes that stand because he wills it."
 zin_tech_deathless_tide_2:0 "The Deathless Tide II"
 zin_tech_deathless_tide_2_desc:0 "The tide runs stronger. The dead rise in greater numbers and hold their shapes against the blows of mortal arms."
 zin_tech_deathless_tide_3:0 "The Deathless Tide III"
 zin_tech_deathless_tide_3_desc:0 "At the full flood of the tide, the dead are no longer shapes at all, and nothing mortal can end them."
 zin_tech_deep_adits:0 "Deep Adits"
 zin_tech_deep_adits_desc:0 "Long tunnels driven into the hillside drain the deepest workings, and veins that drowned a generation ago are worked again."
 zin_tech_deep_forges:0 "Deep Forges"
 zin_tech_deep_forges_desc:0 "Forges far under the mountain burn hot and steady, out of the wind, and the holds' smiths never lack for heat."
 zin_tech_deep_road_shoring:0 "Deep-Road Shoring"
 zin_tech_deep_road_shoring_desc:0 "The delvers who cut roads under three seas shored them in a way no hold has needed since the roads were drowned. The names on the four doors tell the elders where the old methods were written down."
 zin_tech_deep_road_shoring_recovered_tt:0 "The names read on all four Sea-Doors"
 zin_tech_deep_shafts:0 "Deep Shafts"
 zin_tech_deep_shafts_desc:0 "Shafts sink past the old workings into untouched rock, braced and aired by those who have learned how."
 zin_tech_deep_water_hulls:0 "Deep-Water Hulls"
 zin_tech_deep_water_hulls_desc:0 "Deep keels and broad beams let warships keep the open sea for weeks, and the merchant cogs that follow them can carry a host over the wide water."
 zin_tech_deep_wells:0 "Deep Wells"
 zin_tech_deep_wells_desc:0 "The learned of the Great Library chart where the wells run deepest, and the boldest sink shafts to them."
 zin_tech_deeper_rites:0 "Deeper Rites"
 zin_tech_deeper_rites_desc:0 "The masters descend into older rites, and the grave hosts they raise stand firmer than any before them."
 zin_tech_dike_craft:0 "Dike-Craft of the Low Country"
 zin_tech_dike_craft_desc:0 "Men and giants together once held a whole plain below the level of the sea behind dikes of field-stone. Their way of laying stone against water was lost with the plain and can be learned again from what the sea gives back."
 zin_tech_dike_craft_recovered_tt:0 "The Mothers' Stone raised from the Mound, or the dike-stones given by the giants"
 zin_tech_division_of_labour:0 "Many Hands"
 zin_tech_division_of_labour_desc:0 "Each worker learns one step of the making and does it all day. The work is quicker, and the apprentices learn faster."
 zin_tech_dragon_kinship:0 "Dragon Kinship"
 zin_tech_dragon_kinship_desc:0 "A bond of long trust between rider and dragon makes each one bolder in the other's company."
 zin_tech_dragon_lore:0 "Dragon Lore"
 zin_tech_dragon_lore_desc:0 "What the elves know of the dragons of the high mountain: their moods, their ways and the pact that lets one fly at their side."
 zin_tech_drainage_wheels:0 "Drainage Wheels"
 zin_tech_drainage_wheels_desc:0 "Wheels of buckets lift water out of the deep workings, and the gold-bearing veins can be followed below the springs."
 zin_tech_dressed_stone:0 "Dressed Stone"
 zin_tech_dressed_stone_desc:0 "Masons learn to square and fit their blocks, so walls rise straight and halls stand longer. Building goes faster and repairs come cheaper."
 zin_tech_dry_docks:0 "Dry Docks"
 zin_tech_dry_docks_desc:0 "A basin with a sea-gate takes a ship in, is pumped dry, and leaves the hull open to the shipwright's tools."
 zin_tech_elven_arms:0 "Elven Arms"
 zin_tech_elven_arms_desc:0 "Slender blades and long bows, made by elven hands from wood and metal that were old before the Fourth Age began."
 zin_tech_elven_hulls:0 "Elven Hulls"
 zin_tech_elven_hulls_desc:0 "Hulls of grown wood with sails the shade of dawn, which catch every breath of wind and need little rest."
 zin_tech_elven_mastery:0 "Elven Mastery"
 zin_tech_elven_mastery_desc:0 "After centuries of practice, a master's arms are made once and last as long as the wood grows."
 zin_tech_elven_steeds:0 "Elven Steeds"
 zin_tech_elven_steeds_desc:0 "Slender horses that answer to a word, trained by the elves to run without road or rein."
 zin_tech_engine_corps:0 "Engine Crews"
 zin_tech_engine_corps_desc:0 "Standing crews of engineers, carpenters and teamsters keep the great engines working and the host's stones flying."
 zin_tech_ent_moots:0 "The Moots"
 zin_tech_ent_moots_desc:0 "When the ents decide to walk, a grove walks with them. They decide slowly, and cannot be turned back once they have."
 zin_tech_eyries:0 "Eyries"
 zin_tech_eyries_desc:0 "High stone roosts on cliffs and towers, where griffins are bred, fed and trained to carry a rider."
 zin_tech_far_eyries:0 "Far-Flying Eyries"
 zin_tech_far_eyries_desc:0 "Griffins bred for the long flight carry riders to scout and to carry word far beyond the host."
 zin_tech_far_seeing_glass:0 "Far-Seeing Glass"
 zin_tech_far_seeing_glass_desc:0 "Ground lenses in brass tubes bring distant hulls close, and the watchers on the towers see a fleet hours before it lands."
 zin_tech_field_culverins:0 "Field Culverins"
 zin_tech_field_culverins_desc:0 "Long bronze pieces light enough for a team of horses go with the host into the field, not only to the siege."
 zin_tech_field_engine_trains:0 "Field Engine Trains"
 zin_tech_field_engine_trains_desc:0 "Lighter engines on wheeled carriages keep pace with the host and shoot from the march."
 zin_tech_field_healers:0 "Field Healers"
 zin_tech_field_healers_desc:0 "Healers follow the host with herbs, bandages and clean water. Fewer wounded die and more return to the line."
 zin_tech_field_hospitals:0 "Field Hospitals"
 zin_tech_field_hospitals_desc:0 "Tents of healers behind the camp take in the wounded by the hundred, and many walk back into the line."
 zin_tech_field_kitchens:0 "Field Kitchens"
 zin_tech_field_kitchens_desc:0 "Cooks with copper pots follow the host and feed it hot meals, and the sick list grows shorter."
 zin_tech_fire_pots:0 "Fire-Pots"
 zin_tech_fire_pots_desc:0 "Clay pots of burning pitch burst over a camp or a rooftop, and the fire does the work that stones cannot."
 zin_tech_fire_ships:0 "Fireships"
 zin_tech_fire_ships_desc:0 "Hulls packed with pitch and brush, steered into a crowded anchorage and set alight."
 zin_tech_firelocks:0 "Firelocks"
 zin_tech_firelocks_desc:0 "A flint on a cock does the wheel's work for half the price, and every powder company can be armed alike."
 zin_tech_forest_rangers:0 "Forest Rangers"
 zin_tech_forest_rangers_desc:0 "Wardens of the green wood, who walk unseen beneath the trees and strike when the foe is far from his road."
 zin_tech_forge_pits:0 "Forge-Pits"
 zin_tech_forge_pits_desc:0 "Orcs and trolls dig their forges into the hillside and feed them day and night. What comes out is rough and plentiful."
 zin_tech_forged_steel:0 "Forged Iron"
 zin_tech_forged_steel_desc:0 "Smiths fold and hammer the iron until it is tougher and takes a keener edge."
 zin_tech_free_companies:0 "Free Companies"
 zin_tech_free_companies_desc:0 "Companies that serve year after year keep their own captains and their own drill, and teach both to every recruit."
 zin_tech_frost_wardens:0 "Frost Wardens"
 zin_tech_frost_wardens_desc:0 "Watch-companies who winter in the high passes hold them against anyone foolish enough to come in the snows."
 zin_tech_full_plate:0 "Full Plate"
 zin_tech_full_plate_desc:0 "Shaped plates, fitted to the man, cover him from crown to heel, and a wearer who is properly trained can move as freely as in cloth."
 zin_tech_galley_squadrons:0 "Galley Squadrons"
 zin_tech_galley_squadrons_desc:0 "Galleys sail in fixed squadrons under one captain each and keep their places in the line of battle."
 zin_tech_gate_commercial_reactor:0 "The Fifth Sealed Work"
 zin_tech_gate_commercial_reactor_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_fuel_silo:0 "The Sixth Sealed Work"
 zin_tech_gate_fuel_silo_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_mega_gun:0 "The Second Sealed Work"
 zin_tech_gate_mega_gun_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_nuclear_reactor:0 "The Third Sealed Work"
 zin_tech_gate_nuclear_reactor_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_nuclear_reactor_heavy_water:0 "The Fourth Sealed Work"
 zin_tech_gate_nuclear_reactor_heavy_water_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_rocket_site:0 "The First Sealed Work"
 zin_tech_gate_rocket_site_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_gate_synthetic_refinery:0 "The Seventh Sealed Work"
 zin_tech_gate_synthetic_refinery_desc:0 "No craft of Aoaz reaches this work. It is kept shut, and nothing researches it."
 zin_tech_giant_kin:0 "Giant Kin"
 zin_tech_giant_kin_desc:0 "The giants rouse their kin to war, a few huge hosts and a few great hurlers who fling boulders over walls."
 zin_tech_glass_towers:0 "Glass Towers"
 zin_tech_glass_towers_desc:0 "Tall towers crowned with great lenses and signal lamps watch the whole horizon, and no coast is left unwatched."
 zin_tech_goblin_swarms:0 "Goblin Swarms"
 zin_tech_goblin_swarms_desc:0 "The chiefs stop beating the goblins into the line and let them run ahead in packs, where they do the most harm."
 zin_tech_grave_binding:0 "Grave Binding"
 zin_tech_grave_binding_desc:0 "Rites of the south bind the fallen to their weapons and set them marching again. They need no bread and do not tire."
 zin_tech_grave_legions:0 "Grave Legions"
 zin_tech_grave_legions_desc:0 "The hosts of the south are bound in legions under one master each, and a legion keeps its ranks long after its living officers are gone."
 zin_tech_grave_riders:0 "Grave Riders"
 zin_tech_grave_riders_desc:0 "Horses that have died and risen carry riders who have done the same, and the two never tire."
 zin_tech_great_bombards:0 "Great Bombards"
 zin_tech_great_bombards_desc:0 "Bombards so heavy that a team of oxen draws each one. Their shot breaks a gate tower in a day, and no wall of the age stands long before them."
 zin_tech_great_depots:0 "Great Depots"
 zin_tech_great_depots_desc:0 "Storehouses the size of castles hold a campaign's grain, and the host can march a whole season from them."
 zin_tech_great_engines:0 "Great Engines"
 zin_tech_great_engines_desc:0 "Engines as tall as a hall, built by crews that do nothing else, and their throw is heard in the next valley."
 zin_tech_great_halls:0 "Great Halls"
 zin_tech_great_halls_desc:0 "The guilds gather their forges and benches under one great roof, where a hundred smiths share a fire. It shuts out the Village Forges."
 zin_tech_great_herds:0 "The Great Herds"
 zin_tech_great_herds_desc:0 "The riders' herds cover the downs to the horizon, and every child can ride before it can walk."
 zin_tech_great_library:0 "The Great Library"
 zin_tech_great_library_desc:0 "One vast house holds every book the realm can gather. When the shelves are full, another chair is set for a scholar to work in."
 zin_tech_great_scaffolds:0 "Great Scaffolds"
 zin_tech_great_scaffolds_desc:0 "Timber frames climb as high as the stone does, and the work no longer waits on the weather."
 zin_tech_great_studs:0 "Great Studs"
 zin_tech_great_studs_desc:0 "The crown founds great studs where the best stallions are kept and the best mares sent, and a finer breed of warhorse follows."
 zin_tech_great_warships:0 "Great Warships"
 zin_tech_great_warships_desc:0 "The greatest ships of the age: three decks, three masts, decks of war-engines and crews of hundreds, the flagships of a realm's fleet."
 zin_tech_great_yards:0 "Great Yards"
 zin_tech_great_yards_desc:0 "Whole shipyards are planned as one work, with ropewalks, sawpits and berths side by side."
 zin_tech_griffin_harness:0 "Griffin Harness"
 zin_tech_griffin_harness_desc:0 "A saddle that fits the beast and a rider who can trust it: the first harness light enough for a griffin to fly in."
 zin_tech_guild_charters:0 "Guild Charters"
 zin_tech_guild_charters_desc:0 "The crown writes the guilds' customs into charters: fixed measures, sworn inspectors and a fair price for good work."
 zin_tech_guild_companies:0 "Guild Companies"
 zin_tech_guild_companies_desc:0 "Each guild of the western towns keeps its own armed company, drilled on feast days and paid from the guild chest."
 zin_tech_hall_delving:0 "Hall-Delving"
 zin_tech_hall_delving_desc:0 "The holds cut their halls from the living rock, pillar by pillar, and know the stone as farmers know their soil."
 zin_tech_hallowed_arms:0 "Hallowed Arms"
 zin_tech_hallowed_arms_desc:0 "Blades and spear-heads washed in blessed water and marked with the sign of warding. The dead feel them, if only a little."
 zin_tech_hand_guns:0 "Hand-Guns"
 zin_tech_hand_guns_desc:0 "A short iron tube on a wooden stock, fired by a match held to the touch-hole. A company of hand-gunners frightens horses and men alike, and its balls go through mail."
 zin_tech_harbour_chains:0 "Harbour Chains"
 zin_tech_harbour_chains_desc:0 "A chain across the harbour mouth, raised by a windlass, closes the port to any hull that does not fly the right flag."
 zin_tech_harbour_works:0 "Harbour Works"
 zin_tech_harbour_works_desc:0 "Quays, moles and wharves that shelter the fleet and speed its repairs, with masthead lookouts to spot a sail before it spots you."
 zin_tech_healers_rolls:0 "The Healers' Case-Rolls"
 zin_tech_healers_rolls_desc:0 "Healers once kept rolls of every case they treated and what saved the patient. Copied out again from scattered pages, they still teach."
 zin_tech_hearth_watch:0 "Hearth-Watch"
 zin_tech_hearth_watch_desc:0 "Every household keeps a bow and a horn by the door, and a stranger in the fields is watched from a dozen windows."
 zin_tech_heavy_harness:0 "Harness of Proof"
 zin_tech_heavy_harness_desc:0 "Every plate is tested against a crossbow bolt before it leaves the armourer. The wearer is slow but very hard to bring down."
 zin_tech_hedge_fighting:0 "Hedge-Fighting"
 zin_tech_hedge_fighting_desc:0 "Men who would not kneel learned to fight from hedge, wood and hillside, and the knowledge passed from parent to child."
 zin_tech_heralds:0 "Heralds and Beacons"
 zin_tech_heralds_desc:0 "Heralds with horns, flags and beacons carry orders along a line of march and tell each captain what the others are doing."
 zin_tech_hidden_refuges:0 "Hidden Refuges"
 zin_tech_hidden_refuges_desc:0 "Caves, hill farms and forest steadings where a hunted company could eat, sleep and heal. Every village still knows a few."
 zin_tech_high_castled_warships:0 "High-Castled Warships"
 zin_tech_high_castled_warships_desc:0 "Fighting castles at bow and stern give archers the height to shoot over any rail, and a deck of catapults shatters hulls at range."
 zin_tech_high_roads:0 "The High Roads"
 zin_tech_high_roads_desc:0 "Raised and paved roads link the great towns, and wagons run on them in any season."
 zin_tech_highland_charge:0 "Highland Charge"
 zin_tech_highland_charge_desc:0 "The clans come down the hillside at a run, and a line that has not fled by the time they arrive rarely holds."
 zin_tech_hill_companies:0 "Hill Companies"
 zin_tech_hill_companies_desc:0 "Men of the high valleys are formed into companies that climb where hosts cannot march and hold the passes."
 zin_tech_hired_companies:0 "Hired Companies"
 zin_tech_hired_companies_desc:0 "The cities pay seasoned companies to fight for them, and the city sons learn from the hired veterans."
 zin_tech_hold_engineers:0 "Hold Engineers"
 zin_tech_hold_engineers_desc:0 "The holds' tunnellers go to war with the host, and no wall stands long over their mines."
 zin_tech_hold_the_pass:0 "Hold the Pass"
 zin_tech_hold_the_pass_desc:0 "A handful of wardens in a narrow place can stop a host, and they have practised it all their lives."
 zin_tech_horn_bows:0 "Horn Bows"
 zin_tech_horn_bows_desc:0 "Short bows of horn, sinew and wood throw an arrow from the saddle as far as a footman's longbow."
 zin_tech_horn_chains:0 "Horn Chains"
 zin_tech_horn_chains_desc:0 "Horns on every hilltop answer one another from tower to tower, and a warning crosses a province before a rider could mount."
 zin_tech_horse_archery:0 "Horse Archery"
 zin_tech_horse_archery_desc:0 "Riders who shoot from the saddle at a gallop and wheel away before the foe can answer."
 zin_tech_hunt_songs:0 "Songs of the Hunt"
 zin_tech_hunt_songs_desc:0 "Quicker songs, sung on the move, keep the archers' aim together and their arrows falling as one."
 zin_tech_hunting_bows:0 "Hunting Bows"
 zin_tech_hunting_bows_desc:0 "Hunters' bows of yew and ash arm companies of archers who can loose a dozen shafts before the foe closes."
 zin_tech_ice_fishing:0 "Ice-Fishing"
 zin_tech_ice_fishing_desc:0 "Holes cut through the lake ice feed whole villages through the long dark when the fields are buried."
 zin_tech_iron_arms:0 "Iron Arms"
 zin_tech_iron_arms_desc:0 "Spears, swords and axes of forged iron, in the hands of levies and trained foot alike. Every realm with a smith can arm a host."
 zin_tech_iron_tribute:0 "Iron Tribute"
 zin_tech_iron_tribute_desc:0 "Every vassal pays the warlord in iron, and the warlord pays his host in blades."
 zin_tech_irrigation_canals:0 "Irrigation Canals"
 zin_tech_irrigation_canals_desc:0 "Canals carry the spring flood to dry fields. Harvests swell, and villages grow where hunger once held them back."
 zin_tech_island_marines:0 "Surf Warriors"
 zin_tech_island_marines_desc:0 "Island warriors wade ashore through surf and coral, and they are fighting before their boats have grounded."
 zin_tech_kalioth_forge:0 "The Kalioth Forge"
 zin_tech_kalioth_forge_desc:0 "The mountain kings of the Kalioth forged heavy horse-armour and siege iron in halls under their forts. The forges were walled up with their diadem, and whoever opens the wall finds their working as well."
 zin_tech_kalioth_forge_recovered_tt:0 "The diadem of the Kalioth kings melted or worn"
 zin_tech_kin_harness:0 "Kin Harness"
 zin_tech_kin_harness_desc:0 "Smiths learn to shape plates and straps for the great kin, and their gear no longer breaks at the first hard blow."
 zin_tech_kin_lords:0 "Kin-Lords"
 zin_tech_kin_lords_desc:0 "The greatest of the kin are armed and honoured as lords of war, and the rest follow where they stride."
 zin_tech_kin_mastery:0 "Kin Mastery"
 zin_tech_kin_mastery_desc:0 "Generations of work with the great kin give their gear a fit and a weight that no earlier smith could have found."
 zin_tech_lake_barges:0 "Lake Barges"
 zin_tech_lake_barges_desc:0 "Flat barges carry grain, timber and soldiers across the Great Lake faster than any road."
 zin_tech_lantern_wards:0 "Lantern Wards"
 zin_tech_lantern_wards_desc:0 "Lanterns of ward-glass, blessed tokens and the old words say how to hold off what the dead cannot be hurt by."
 zin_tech_layered_walls:0 "Layered Walls"
 zin_tech_layered_walls_desc:0 "An outer wall, a ditch and an inner wall: an attacker who breaches one finds another behind it."
 zin_tech_leaf_craft:0 "Leaf-Craft"
 zin_tech_leaf_craft_desc:0 "The elves coax living wood into the shapes they need, and the forest gives its timber without a tree falling."
 zin_tech_leaf_steel:0 "Leaf-Forging"
 zin_tech_leaf_steel_desc:0 "Elven smiths forge blades as thin as a leaf, light enough to lift with one finger and strong enough to cut mail."
 zin_tech_letter_counts:0 "Letter Counts"
 zin_tech_letter_counts_desc:0 "Scholars count how often each letter appears in a secret page, and the commonest signs give themselves away."
 zin_tech_ley_stone_channels:0 "Ley-Stone Channels"
 zin_tech_ley_stone_channels_desc:0 "Channels cut into the old stones guide the Essence to where it can be gathered, and little is lost on the way."
 zin_tech_libraries:0 "Libraries"
 zin_tech_libraries_desc:0 "The copied books are gathered, shelved and catalogued, and a scholar can find in an hour what once took a year."
 zin_tech_light_harness:0 "Half-Harness"
 zin_tech_light_harness_desc:0 "Breastplate, helm and gauntlets and no more: the heavy foot keeps its guard and gains its legs."
 zin_tech_light_horse:0 "Light Horse"
 zin_tech_light_horse_desc:0 "Riders in leather on quick horses scout, raid and harry, and leave the charge to others."
 zin_tech_lime_mortar:0 "Slaked Lime"
 zin_tech_lime_mortar_desc:0 "Burnt lime, slaked in pits and mixed with sand, binds a wall into one stone. Building and repair go faster again."
 zin_tech_long_matchlocks:0 "Long Matchlocks"
 zin_tech_long_matchlocks_desc:0 "Longer barrels of better iron throw the ball further and straighter, and the ranks learn to fire in turns."
 zin_tech_long_watch:0 "The Long Watch"
 zin_tech_long_watch_desc:0 "The elves held the borders of their forests through the whole of the dark age and never let them fall. They have not forgotten how."
 zin_tech_longships:0 "Longships"
 zin_tech_longships_desc:0 "Long, low ships with oar and sail land a crew on any beach and are gone with the tide."
 zin_tech_mail:0 "Mail Shirts"
 zin_tech_mail_desc:0 "Thousands of riveted rings make a shirt that turns a blade. Heavy foot can stand where light foot would break."
 zin_tech_masons_lodges:0 "Masons' Lodges"
 zin_tech_masons_lodges_desc:0 "Masons band into lodges that keep their secrets, teach their sons and travel to wherever a great work is begun."
 zin_tech_master_engines:0 "Master Engines"
 zin_tech_master_engines_desc:0 "Master engineers refit every engine of the realm with better skeins, better frames and better aim."
 zin_tech_master_forges:0 "The Master Forges"
 zin_tech_master_forges_desc:0 "The great forges of the realm are given to masters who answer to no one for their methods, and their blades are the best the age has seen."
 zin_tech_master_shipwrights:0 "Master Shipwrights"
 zin_tech_master_shipwrights_desc:0 "The greatest builders refit every class of hull, and a navy at last has ships that match its sailors."
 zin_tech_masters_benches:0 "Masters' Benches"
 zin_tech_masters_benches_desc:0 "The best hands keep their benches and teach whoever sits beside them, and a new workshop reaches full skill sooner. It shuts out the Pattern Books."
 zin_tech_masterwork_plate:0 "Masterwork Plate"
 zin_tech_masterwork_plate_desc:0 "A suit that takes a master a full year to make is worth a village, and the lords who own one do not lend it."
 zin_tech_matchlocks:0 "Matchlocks"
 zin_tech_matchlocks_desc:0 "A lever brings the burning match down to the pan, so the gunner can hold the piece with both hands and aim with both eyes."
 zin_tech_merchant_cogs:0 "Merchant Cogs"
 zin_tech_merchant_cogs_desc:0 "Broad, deep-bellied cogs carry grain, timber and iron from harbour to harbour."
 zin_tech_mirror_signals:0 "Mirror Signals"
 zin_tech_mirror_signals_desc:0 "Polished mirrors flash news from tower to tower by day, faster than any rider."
 zin_tech_moonsilver_arms:0 "Moon-Silver Arms"
 zin_tech_moonsilver_arms_desc:0 "The elven smiths work silver into their blades at night, as their teachers did, and the edge does not dull."
 zin_tech_mountain_steel:0 "Mountain Iron"
 zin_tech_mountain_steel_desc:0 "Ore from the deepest mountain seams makes iron so clean that a blade made of it outlasts three owners."
 zin_tech_necromantic_orders:0 "Necromantic Orders"
 zin_tech_necromantic_orders_desc:0 "Orders of robed masters keep the rites alive, mend the fallen between battles and raise new hosts from the slain."
 zin_tech_nether_forges:0 "Nether Forges"
 zin_tech_nether_forges_desc:0 "Forges fed by the heat of the deep earth hammer out weapons that no mortal smith could have shaped."
 zin_tech_nether_pacts:0 "Nether Pacts"
 zin_tech_nether_pacts_desc:0 "Pacts struck below the earth call the Netherborn to arms, each bound by an oath that ends only with death."
 zin_tech_oared_galleys:0 "Oared Galleys"
 zin_tech_oared_galleys_desc:0 "Narrow hulls driven by rows of oars, with an iron-shod ram at the prow, and fast enough to catch anything that sails."
 zin_tech_oasis_wells:0 "Oasis Wells"
 zin_tech_oasis_wells_desc:0 "The desert folk know every well and hidden spring, and a host that marches with them never runs dry."
 zin_tech_ogre_pacts:0 "Ogre Pacts"
 zin_tech_ogre_pacts_desc:0 "Chieftains bargain with the ogre clans for brutes who will fight beside the warbands for plunder."
 zin_tech_old_horse_lines:0 "The Old Horse-Lines"
 zin_tech_old_horse_lines_desc:0 "The stud books of the old kingdoms named every great line of horse. The breeds scattered in the dark age; with the books read again, they can be bred back."
 zin_tech_old_sea_roads:0 "The Old Sea-Roads"
 zin_tech_old_sea_roads_desc:0 "Old pilots knew sea-roads between the coasts that later captains forgot. Their notes lie in temple archives, waiting to be read."
 zin_tech_old_songs:0 "The Old Songs"
 zin_tech_old_songs_desc:0 "Songs older than the Fourth Age steady the elves in battle, and they do not give way before what is hard to look upon."
 zin_tech_old_wall_craft:0 "The Old Wall-Craft"
 zin_tech_old_wall_craft_desc:0 "The great walls of the old wars were raised by masters whose methods died with them. Masons who can read their marks can build that way again."
 zin_tech_open_sea_charts:0 "Open-Sea Charts"
 zin_tech_open_sea_charts_desc:0 "Charts of the deep water, made by captains who sailed out of sight of land and came back."
 zin_tech_outrigger_galleys:0 "Outrigger Galleys"
 zin_tech_outrigger_galleys_desc:0 "Galleys with outrigger floats ride the open swell between the islands and never capsize."
 zin_tech_parish_granaries:0 "Parish Granaries"
 zin_tech_parish_granaries_desc:0 "Every parish keeps a stone granary and a reeve to count it, so no valley starves while the next one has bread."
 zin_tech_pass_forts:0 "Pass-Forts"
 zin_tech_pass_forts_desc:0 "A small fort at the head of every pass, kept by the same families for generations."
 zin_tech_pattern_books:0 "Pattern Books"
 zin_tech_pattern_books_desc:0 "Every pattern is drawn and kept in a book, so a workshop can turn from one making to another without losing a week. It shuts out the Masters' Benches."
 zin_tech_pattern_welding:0 "Pattern-Welded Blades"
 zin_tech_pattern_welding_desc:0 "Rods of hard and soft iron are twisted and welded into one bar. The blade bends but does not break, and its pattern shows the smith's name."
 zin_tech_phials_and_vials:0 "Phials and Vials"
 zin_tech_phials_and_vials_desc:0 "Sealed phials of warded glass let Essence be kept and carried, and a realm can lay some by for hard times."
 zin_tech_pike_and_shot:0 "Pike and Shot"
 zin_tech_pike_and_shot_desc:0 "Powder-men stand in the corners of the pike square, and the pikes keep the horse off them while they load."
 zin_tech_pike_squares:0 "Pike Squares"
 zin_tech_pike_squares_desc:0 "Ranks of long pikes make a hedge no horse will charge, and the same square can advance behind its points."
 zin_tech_pit_props:0 "Pit Props"
 zin_tech_pit_props_desc:0 "Timber props hold the roof of a shaft, and miners follow the iron seam deeper than before."
 zin_tech_plains_destriers:0 "Destriers of the Plains"
 zin_tech_plains_destriers_desc:0 "Over generations the herds of the open plains are crossed with the great studs, and the result is a mount of strength and wind that no other breed matches."
 zin_tech_plate_and_mail:0 "Plate and Mail"
 zin_tech_plate_and_mail_desc:0 "Iron plates cover the chest, head and limbs, with mail where a joint must bend."
 zin_tech_post_roads:0 "Post Roads"
 zin_tech_post_roads_desc:0 "Posting houses every few leagues keep fresh teams ready, and the heavy wagons of the high roads never stop for long."
 zin_tech_proofed_plate:0 "Proofed Plate"
 zin_tech_proofed_plate_desc:0 "Plate struck and tested at the forge, marked with the armourer's proof, and fitted to each wearer."
 zin_tech_provosts:0 "Provosts"
 zin_tech_provosts_desc:0 "Provosts keep order in camp and in taken towns, hang looters and hold the peace of the roads behind the host."
 zin_tech_quarry_songs:0 "Quarry-Songs"
 zin_tech_quarry_songs_desc:0 "Giants sing to the rock until it breaks along the line they want, and their quarries give stone in great clean blocks."
 zin_tech_quarry_wedges:0 "Quarry Wedges"
 zin_tech_quarry_wedges_desc:0 "Iron wedges and wet wood split the rock along its grain. Quarries give more stone for less sweat."
 zin_tech_quartermasters:0 "Quartermasters"
 zin_tech_quartermasters_desc:0 "Officers who count every sack and every nail and see that the host eats before it fights."
 zin_tech_raider_mounts:0 "Raider Mounts"
 zin_tech_raider_mounts_desc:0 "Wiry mounts, half tamed, carry orc raiders far across the border before the alarm can be raised."
 zin_tech_ranger_craft:0 "Ranger Craft"
 zin_tech_ranger_craft_desc:0 "Foresters who can track, hide and shoot are formed into bands that fight best where the land is wild."
 zin_tech_reading_rooms:0 "Reading Rooms"
 zin_tech_reading_rooms_desc:0 "A locked chamber where trained readers work through every captured letter, and nothing that passes through it is forgotten."
 zin_tech_reef_lore:0 "Reef-Lore"
 zin_tech_reef_lore_desc:0 "The islanders know every reef and channel, and an enemy fleet that comes in without them runs aground."
 zin_tech_refuge_granaries:0 "The Refuge Granaries"
 zin_tech_refuge_granaries_desc:0 "In the worst of the occupation hidden refuges kept seed, grain and the rules for sharing them. The rolls that described them were scattered; learned clerks can piece them together again."
 zin_tech_reindeer_sledges:0 "Reindeer Sledges"
 zin_tech_reindeer_sledges_desc:0 "Reindeer pull loaded sledges across the frozen lakes, and the host's stores travel faster in winter than in summer."
 zin_tech_remount_depots:0 "Remount Depots"
 zin_tech_remount_depots_desc:0 "Fresh horses wait at every depot along the roads, so a rider never has to ride a dying mount."
 zin_tech_riding_horde:0 "The Riding Horde"
 zin_tech_riding_horde_desc:0 "The whole people rides to war as one horde, and its outriders sweep the land a day ahead of the host."
 zin_tech_riding_horses:0 "Riding Horses"
 zin_tech_riding_horses_desc:0 "Sturdy mounts bred for the saddle carry riders across the open lands faster than any host can march."
 zin_tech_rites_of_unbinding:0 "Rites of Unbinding"
 zin_tech_rites_of_unbinding_desc:0 "At the end of the dark age the bound dead were set free with words and wards that few now remember. The fragments that survive can be studied and made whole."
 zin_tech_river_barges:0 "River Barges"
 zin_tech_river_barges_desc:0 "Barge-masters know every ford and shallow, and a host that marches with them crosses rivers others must bridge."
 zin_tech_roadside_smithies:0 "Roadside Smithies"
 zin_tech_roadside_smithies_desc:0 "Smithies beside the high roads mend wagons and tools on the spot, and the work never waits for a distant guild."
 zin_tech_royal_academies:0 "Royal Academies"
 zin_tech_royal_academies_desc:0 "The crown pays scholars to argue, measure and write in one house, and what they find is copied for every university."
 zin_tech_royal_dockyards:0 "Royal Dockyards"
 zin_tech_royal_dockyards_desc:0 "Walled yards with their own timber ponds, ropewalks and smithies build the crown's ships from keel to masthead."
 zin_tech_royal_works:0 "The Royal Works"
 zin_tech_royal_works_desc:0 "A standing office of masons, carters and clerks plans every great building of the realm and keeps its stone moving."
 zin_tech_sailing_warships:0 "Sailing Warships"
 zin_tech_sailing_warships_desc:0 "High-sided hulls under canvas carry heavier bolt-throwers than any galley and can keep the sea in rough weather."
 zin_tech_salt_roads:0 "Salt Roads"
 zin_tech_salt_roads_desc:0 "Caravans of salt and spice cross the sands on roads marked from well to well, and every market knows the desert merchants."
 zin_tech_sappers:0 "Sappers"
 zin_tech_sappers_desc:0 "Diggers and carpenters bridge rivers, clear roads, undermine walls and raise palisades in a single night."
 zin_tech_scholars_conclaves:0 "Scholars' Conclaves"
 zin_tech_scholars_conclaves_desc:0 "The learned of many halls meet each year to read their findings aloud, and each leaves with the others' work."
 zin_tech_scorpions:0 "Scorpions"
 zin_tech_scorpions_desc:0 "Bolt-throwers on swivels, aimed upward at whatever flies. They guard towers and camps against the winged."
 zin_tech_scouts:0 "Scouts"
 zin_tech_scouts_desc:0 "Light riders and runners range ahead of the host, find the foe and the fords, and lead the column home."
 zin_tech_scrap_forges:0 "Scrap-Forges"
 zin_tech_scrap_forges_desc:0 "Every broken blade and buckle is melted down in the warren forges and comes back as something useful."
 zin_tech_scriptoria:0 "Scriptoria"
 zin_tech_scriptoria_desc:0 "Scribes copy the records of the realm in warm rooms, and what one scholar learns no longer dies with him."
 zin_tech_sea_king_raids:0 "Sea-King Raids"
 zin_tech_sea_king_raids_desc:0 "The sea-kings send their ships out in packs each summer, and no merchant coast is safe from them."
 zin_tech_sea_soldiers:0 "Sea Soldiers"
 zin_tech_sea_soldiers_desc:0 "Soldiers drilled to fight from a deck and to land through surf, ready to storm a quay from the cogs that bring them."
 zin_tech_sealed_couriers:0 "Sealed Couriers"
 zin_tech_sealed_couriers_desc:0 "Sworn riders carry sealed pouches by relays of fresh horses, and never read what they carry."
 zin_tech_seed_reserves:0 "Seed Reserves"
 zin_tech_seed_reserves_desc:0 "Sealed stone granaries hold seed against a bad year, so one failed harvest no longer empties the realm's provisions."
 zin_tech_shield_rails:0 "Shield-Rail Crews"
 zin_tech_shield_rails_desc:0 "Every rower is a warrior with his shield on the rail, and the crew that rows ashore fights ashore."
 zin_tech_shield_wall_drill:0 "Shield-Wall Drill"
 zin_tech_shield_wall_drill_desc:0 "Foot are taught to lock shields rim to rim and hold the line while the second rank thrusts over their shoulders."
 zin_tech_ships_of_the_line:0 "Ships of the Line"
 zin_tech_ships_of_the_line_desc:0 "The great ships fight in one line, each covering the next, and no enemy can come at them one by one."
 zin_tech_siege_towers:0 "Siege Towers and Rams"
 zin_tech_siege_towers_desc:0 "Wheeled towers and iron-headed rams carry sappers to the foot of a wall and over it."
 zin_tech_sky_lances:0 "Sky Lances"
 zin_tech_sky_lances_desc:0 "Long lances, balanced for a rider in flight, let a griffin knight strike at another beast from above."
 zin_tech_slipways:0 "Slipways"
 zin_tech_slipways_desc:0 "Greased slipways of stone and timber let a hull be laid down, built and launched without a single wasted tide."
 zin_tech_snow_craft:0 "Snow-Craft"
 zin_tech_snow_craft_desc:0 "Skis, furs and snow-houses let the winter folk travel and fight where others freeze."
 zin_tech_stair_builders_measure:0 "The Stair-Builders' Measure"
 zin_tech_stair_builders_measure_desc:0 "The builders of the old bridge kingdom of the East raised stairs above the flood-line and a road over the neck of land that the sea later took. Their measure of a river and a road is written in the oldest marks of the first stair."
 zin_tech_stair_builders_measure_recovered_tt:0 "The Gate-Stones of the broken city, or the treaty of passage"
 zin_tech_standard_patterns:0 "Standard Patterns"
 zin_tech_standard_patterns_desc:0 "Guilds agree on one pattern for each piece, so parts made in different workshops fit together and a changed order costs less."
 zin_tech_star_forts:0 "Star Forts"
 zin_tech_star_forts_desc:0 "Low, thick walls drawn out in points, so every stretch is swept from two sides and no wall stands bare to a battery."
 zin_tech_star_paths:0 "Star-Paths"
 zin_tech_star_paths_desc:0 "Navigators who steer by the stars take the galleys far beyond the sight of land and bring them home again."
 zin_tech_steading_foundries:0 "Steading Foundries"
 zin_tech_steading_foundries_desc:0 "Even a small steading raises a foundry of its own, and no single fire holds the realm's whole craft."
 zin_tech_steel_bows:0 "Iron-Bowed Crossbows"
 zin_tech_steel_bows_desc:0 "Bows of forged iron, spanned with a rack, throw a bolt that crosses a field and still goes through a shield."
 zin_tech_steppe_breeds:0 "Steppe Breeds"
 zin_tech_steppe_breeds_desc:0 "Small, tireless horses bred on the open downs carry a rider all day and need nothing but grass."
 zin_tech_steppe_remounts:0 "Steppe Remounts"
 zin_tech_steppe_remounts_desc:0 "Each rider leads three spare horses, and the host changes mounts on the move instead of resting."
 zin_tech_stone_forts:0 "Stone Forts"
 zin_tech_stone_forts_desc:0 "Stone walls, towers and gatehouses let a few hold a pass or a harbour against many."
 zin_tech_storm_rigging:0 "Storm Rigging"
 zin_tech_storm_rigging_desc:0 "Extra stays, double sheets and storm sails let a fleet ride out gales that would drive older ships onto the rocks."
 zin_tech_sun_guard:0 "The Sun Guard"
 zin_tech_sun_guard_desc:0 "The towering folk of the sunlit south form their guard: few in number, slow to rouse and nearly impossible to break."
 zin_tech_sunfields_hull_craft:0 "Sunfields Hull-Craft"
 zin_tech_sunfields_hull_craft_desc:0 "The first sailors of the north-west built hulls for cold seas long before any chart was drawn. Bronze prows from the ice show how they were fitted, and three peoples who kept their sea-words can read them."
 zin_tech_sunfields_hull_craft_recovered_tt:0 "The three names of the land under the ice known as one"
 zin_tech_supply_columns:0 "Supply Columns"
 zin_tech_supply_columns_desc:0 "Pack-animals and drovers feed the host from the depots, and its supply no longer depends on the nearest village."
 zin_tech_sword_and_buckler:0 "Sword-and-Buckler Men"
 zin_tech_sword_and_buckler_desc:0 "Companies of swordsmen with small round shields close inside the spears and fight where no square can form."
 zin_tech_tempered_plate:0 "Tempered Plate"
 zin_tech_tempered_plate_desc:0 "Plate that has been quenched and tempered stops a bolt at close range, and armourers sign each piece in gold."
 zin_tech_tempered_steel:0 "Tempered Iron"
 zin_tech_tempered_steel_desc:0 "Quenched in water and drawn back in the coals, a blade keeps its edge and does not snap."
 zin_tech_tinkers_benches:0 "Tinkers' Benches"
 zin_tech_tinkers_benches_desc:0 "Clever hands at small benches mend and remake anything, and nothing that can be reworked is thrown away."
 zin_tech_torsion_engines:0 "Torsion Engines"
 zin_tech_torsion_engines_desc:0 "Twisted skeins of sinew store the strength of many men. They fling heavier stones and shoot long bolts that pierce the hide of monsters."
 zin_tech_towered_elephants:0 "Towered Elephants"
 zin_tech_towered_elephants_desc:0 "Leather barding and a wooden tower of archers turn each elephant into a walking fort."
 zin_tech_travelling_smiths:0 "Travelling Smiths"
 zin_tech_travelling_smiths_desc:0 "Smiths with a cart, an anvil and a charter go where the need is, and the realm's best hands are never idle."
 zin_tech_treadwheel_cranes:0 "Treadwheel Cranes"
 zin_tech_treadwheel_cranes_desc:0 "Men walking inside great wheels lift beams and anvils that no gang of porters could raise."
 zin_tech_trebuchets:0 "Counterweight Trebuchets"
 zin_tech_trebuchets_desc:0 "A long arm, a sling and a box of stones: the trebuchet throws a heavy stone further and harder than any engine before it."
 zin_tech_tree_paths:0 "Tree-Paths"
 zin_tech_tree_paths_desc:0 "Hidden paths through the deep woods let a whole host move unseen where strangers lose their way."
 zin_tech_trip_hammers:0 "Trip-Hammers"
 zin_tech_trip_hammers_desc:0 "A cam lifts a heavy hammer and lets it fall, over and over, while the smith turns the iron."
 zin_tech_triton_charts:0 "The Triton Charts"
 zin_tech_triton_charts_desc:0 "The island-folk's charts of tides, currents and star-bearings give a captain the sea lanes that were once their secret."
 zin_tech_troll_brood:0 "Troll Brood"
 zin_tech_troll_brood_desc:0 "The troll broods bring their brutes to the war-moot, each wrapped in hide and swinging an iron-bound club."
 zin_tech_tunnel_raids:0 "Tunnel Raids"
 zin_tech_tunnel_raids_desc:0 "Raiders come up behind the line through tunnels dug in the night and are gone before the alarm is raised."
 zin_tech_universities:0 "Universities"
 zin_tech_universities_desc:0 "Masters and students dwell together under a charter, and learning is taught, disputed and handed on in the open."
 zin_tech_valley_wardens:0 "Valley Wardens"
 zin_tech_valley_wardens_desc:0 "The temple's small guard of valley wardens, sworn to keep the roads and shrines in peace."
 zin_tech_vaulted_halls:0 "Vaulted Halls"
 zin_tech_vaulted_halls_desc:0 "Stone vaults roof the halls wider than timber ever could, with room for more benches and more fires."
 zin_tech_vent_forges:0 "Vent-Forges"
 zin_tech_vent_forges_desc:0 "In the Ember Lands the hot vents of the earth feed forges that never go cold, and Essence rises with the fumes."
 zin_tech_veteran_sergeants:0 "Veteran File-Leaders"
 zin_tech_veteran_sergeants_desc:0 "Old soldiers with scars to show lead each file and keep the line closed when the first rank falls."
 zin_tech_village_forges:0 "Village Forges"
 zin_tech_village_forges_desc:0 "A forge in every village and a smith in every forge: the work is spread wide and can turn to any need. It shuts out the Great Halls."
 zin_tech_wagon_trains:0 "Wagon Trains"
 zin_tech_wagon_trains_desc:0 "Long strings of ox-wagons carry grain and stores along the high roads, a season's march in one column."
 zin_tech_wall_wardens:0 "Wall Wardens"
 zin_tech_wall_wardens_desc:0 "Garrisons that do nothing but guard a wall learn every stone of it, and no attack takes them by surprise."
 zin_tech_war_camps:0 "War Camps"
 zin_tech_war_camps_desc:0 "Standing camps behind the front keep recruits drilled and ready, and gaps in the line are filled within days."
 zin_tech_war_elephants:0 "War Elephants"
 zin_tech_war_elephants_desc:0 "Great grey beasts from the far south are trained to bear riders and to trample a line flat."
 zin_tech_war_galleys:0 "War Galleys"
 zin_tech_war_galleys_desc:0 "Galleys built for war, with banks of ballistae, benches for stronger oarsmen and a mast for the long haul."
 zin_tech_war_horses:0 "War Horses"
 zin_tech_war_horses_desc:0 "Great horses, bred for weight and trained to stand under the din, can bear a rider in mail through a line of foot."
 zin_tech_war_longbows:0 "War Longbows"
 zin_tech_war_longbows_desc:0 "Archers drilled from boyhood draw staves as tall as themselves, and their volleys darken the air above a field."
 zin_tech_warband_iron:0 "Warband Iron"
 zin_tech_warband_iron_desc:0 "Rough iron, quickly made, for war bands that count on numbers and fury."
 zin_tech_ward_schools:0 "Ward-Schools"
 zin_tech_ward_schools_desc:0 "Every province keeps a school where wardens learn the lanterns, the tokens and the old words before they ever see the dead."
 zin_tech_warded_hulls:0 "Warded Hulls"
 zin_tech_warded_hulls_desc:0 "Hulls marked with the old wards and hung with blessed lanterns, so that what climbs up from the dark water finds no purchase."
 zin_tech_warden_signals:0 "Warden Signals"
 zin_tech_warden_signals_desc:0 "Mirrors and smoke pass word from fort to fort, and the wardens know of a raid before it reaches the valley."
 zin_tech_wards_against_death:0 "Wards Against Death"
 zin_tech_wards_against_death_desc:0 "The highest wards that men have learned: a circle drawn, a name spoken and the shapes of the dead are held back for a time."
 zin_tech_wardsong:0 "Wardsong"
 zin_tech_wardsong_desc:0 "The elves sing over their arms in the old tongue, and what they sing is a ward that the dead remember."
 zin_tech_warlord_retinues:0 "Warlord Retinues"
 zin_tech_warlord_retinues_desc:0 "Every warlord keeps a household of armoured champions who eat at his table and die at his side."
 zin_tech_warren_tunnels:0 "Warren-Tunnels"
 zin_tech_warren_tunnels_desc:0 "The warrens run under every hill they hold, and a goblin knows a way out of any fight."
 zin_tech_watch_fires:0 "Watch Fires"
 zin_tech_watch_fires_desc:0 "A pile of dry wood on every headland, tended night and day. When a sail is seen the next fire is lit, and the word runs down the coast."
 zin_tech_water_caravans:0 "Water Caravans"
 zin_tech_water_caravans_desc:0 "Skins and casks of water follow the column across dry country, and the heat takes fewer men."
 zin_tech_water_wheels:0 "Water-Wheels"
 zin_tech_water_wheels_desc:0 "A river turns the bellows and the grindstones, and the guild workshops make more with the same hands."
 zin_tech_wax_seals:0 "Wax Seals"
 zin_tech_wax_seals_desc:0 "A letter closed with a signet and wax cannot be opened without showing it. Couriers and clerks learn to trust the mark."
 zin_tech_wellspring_tapping:0 "Wellspring Tapping"
 zin_tech_wellspring_tapping_desc:0 "At the known wells, careful hands draw Essence into sealed jars. The work is slow, local and never done alone."
 zin_tech_wheel_locks:0 "Wheel-Locks"
 zin_tech_wheel_locks_desc:0 "A spring-wound wheel strikes the spark, so a powder-man fires without a burning match, in rain and in wind."
 zin_tech_windlass_crossbows:0 "Windlass Crossbows"
 zin_tech_windlass_crossbows_desc:0 "A winding crank spans the strongest lath, and the bolt goes through plate. The crank is slow, and that is the price."
 zin_tech_winter_quarters:0 "Winter Quarters"
 zin_tech_winter_quarters_desc:0 "Stout huts, stacked wood and warm food let a host winter in the field without losing a man in ten."
 zin_tech_woodland_ambush:0 "Woodland Ambush"
 zin_tech_woodland_ambush_desc:0 "Woodsmen wait in the branches and the brush, and an enemy column learns of them when the first arrows fall."
 zin_tech_written_law:0 "Written Law"
 zin_tech_written_law_desc:0 "Every judgement of the Lake courts is written down and kept, and a lord who wants a quarrel must first find a law that allows it."
 zin_tech_yeti_hunts:0 "Yeti Hunts"
 zin_tech_yeti_hunts_desc:0 "The great hunts of the frozen north become war-bands, furred, tireless and unaffected by the cold."
