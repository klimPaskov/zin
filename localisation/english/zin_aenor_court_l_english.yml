l_english:
 zin_aenor_captains_regency:0 "The Captains' Regency"
 zin_aenor_cat_concord:0 "The Middle Kingdom Concord"
 zin_aenor_cat_concord_desc:0 "Twenty-six dominions sworn to Parim by the Charters. Each has its own lords, its own charter and its own patience."
 zin_aenor_cat_court:0 "The Golden Court"
 zin_aenor_cat_court_desc:0 "The palace district of Parim, where offices, titles and charters are bought, and where the kingdom's gold goes."
 zin_aenor_cat_empty_throne:0 "The Thirty Days"
 zin_aenor_cat_empty_throne_desc:0 "The King is dead and the seals lie on an empty chair. Whoever is chosen to hold them has thirty days to make the choice stick."
 zin_aenor_cat_kings_health:0 "The King's Health"
 zin_aenor_cat_kings_health_desc:0 "Questions that a careful court asks about a king who sleeps too well after feasts. They are asked quietly, and answered more quietly still."
 zin_aenor_cat_lost_cause:0 "The Lost Cause"
 zin_aenor_cat_lost_cause_desc:0 "The King's league against the dark. Its strength is the frontier companies and the scholars, not the parade."
 zin_aenor_charters_for_loyal:0 "Charters for the Loyal"
 zin_aenor_charters_for_loyal_desc:0 "Every dominion that stays with the Concord is promised a Free Charter. The ones that leave get nothing."
 zin_aenor_concord_council:0 "Convene the Concord Council"
 zin_aenor_concord_council_desc:0 "Summon the lords of every dominion to Parim. They may be told what the crown needs, or they may be told what they are owed."
 zin_aenor_concord_levy:0 "Call the Concord Levy"
 zin_aenor_concord_levy_desc:0 "Every dominion whose lords are steadfast sends men to Parim's banner, and loses a little of its patience doing it. Those who are restless find reasons to send no one."
 zin_aenor_concord_speaker:0 "The Speaker of the Concord"
 zin_aenor_court_audit:0 "Open the Ledgers of the Court"
 zin_aenor_court_audit_desc:0 "Send the Chamber of Accounts into the Golden Court under the King's seal. Some offices will be emptied and many friends lost, and for a season the rot recedes."
 zin_aenor_court_audit_tt:0 "Offices are emptied and the court grumbles."
 zin_aenor_court_dismiss_favourites:0 "Dismiss the Favourites"
 zin_aenor_court_dismiss_favourites_desc:0 "With the old King gone, the new rule may strip the office-buyers of what they bought. They will not forget it, and neither will their friends."
 zin_aenor_court_feast_of_offices:0 "Hold the Feast of Offices"
 zin_aenor_court_feast_of_offices_desc:0 "A feast in the gilded halls at which every seat has a price. The treasury sings and the kingdom's judges are not what they were."
 zin_aenor_follow_the_coin:0 "Follow the Coin"
 zin_aenor_follow_the_coin_desc:0 "A purse changed hands near the King's kitchens. Set scribes to follow it through the ledgers of the Houses until it stops."
 zin_aenor_free_dominion:0 "A Free Dominion"
 zin_aenor_free_dominion_desc:0 "The lords have broken their Charter and answer to no crown in Parim. They are proud of it, and a little afraid."
 zin_aenor_frontier_company:0 "Raise a Frontier Company"
 zin_aenor_frontier_company_desc:0 "The rangers and archers of the Lost Cause are the one part of the league that fights. A frontier company is raised from the marches and posted where the dark presses nearest."
 zin_aenor_golden_court:0 "The Golden Court"
 zin_aenor_golden_court_desc:0 "Offices, titles and charters are bought in the palace district of Parim. The more is sold, the more the court pays the crown in favours and the less the kingdom works."
 zin_aenor_golden_regency:0 "The Regency of the Golden Court"
 zin_aenor_hailed_king:0 "The Hailed King"
 zin_aenor_hailed_king_desc:0 "The realm has hailed a king who has not yet been crowned. Men fight better for a name they have shouted in the street."
 zin_aenor_hidden_hand:0 "The Hidden Hand"
 zin_aenor_hidden_hand_desc:0 "The offices held by friends of the temples are the reach of a will that hides behind them. It still tends the sick and fills the granaries."
 zin_aenor_interregnum:0 "The Empty Throne"
 zin_aenor_interregnum_desc:0 "The seals lie on an empty chair. Every office waits to learn whom it serves, and no one will give an order he cannot prove is his to give."
 zin_aenor_invite_to_shield:0 "Call [FROM.GetName] to the Shield"
 zin_aenor_invite_to_shield_desc:0 "Offer a foreign crown a seat in the Lost Cause. It would owe no oath and fight no wars it does not choose, but its banner would fly beside the Concord's against the dark."
 zin_aenor_kings_tasters:0 "The King's Tasters"
 zin_aenor_kings_tasters_desc:0 "Nothing reaches the King's lips that three servants have not tasted first. It slows whatever hand reaches for him, and tells it that someone watches."
 zin_aenor_lay_proof:0 "Lay the Proof Before the King"
 zin_aenor_lay_proof_desc:0 "Bring what the scribes found to the King himself, with the seal of the Lost Cause upon it. A king who believes may act. A king who does not will remember who brought it."
 zin_aenor_lost_cause_court:0 "The Lost Cause"
 zin_aenor_lost_cause_court_desc:0 "The Golden King's league against the powers of the dark. Its parades are for the court; its frontier companies and its scholars are real."
 zin_aenor_open_treasury:0 "Open the Treasury"
 zin_aenor_open_treasury_desc:0 "The treasury is opened to every hand that will hold a banner for the Golden Court. It will not close again quickly."
 zin_aenor_party_court:0 "The Golden Court"
 zin_aenor_party_court_long:0 "The Golden Court of Aenor"
 zin_aenor_party_dominions:0 "The Free Dominions"
 zin_aenor_party_dominions_long:0 "The Free Dominions of the Concord"
 zin_aenor_party_faithful:0 "The Deliverer's Faithful"
 zin_aenor_party_faithful_long:0 "The Faithful of the Deliverer"
 zin_aenor_party_faithful_revealed:0 "Afrit's Supporters"
 zin_aenor_party_faithful_revealed_long:0 "The Supporters of Afrit"
 zin_aenor_party_host:0 "The Stranger's Host"
 zin_aenor_party_host_long:0 "The Host of the Stranger"
 zin_aenor_party_host_named:0 "Eindil's Host"
 zin_aenor_party_host_named_long:0 "The Host of Eindil"
 zin_aenor_question_physicians:0 "Question the Royal Physicians"
 zin_aenor_question_physicians_desc:0 "Ask the King's own physicians, one by one and out of each other's hearing, how he sleeps and what he eats. The answers will say little. The way they are given may say more."
 zin_aenor_reissue_charter_free:0 "Grant a Free Charter to [FROM.GetName]"
 zin_aenor_reissue_charter_free_desc:0 "The dominion rules itself in all but the crown's defence, and gives its tithe freely."
 zin_aenor_reissue_charter_golden:0 "Sell a Golden Charter to [FROM.GetName]"
 zin_aenor_reissue_charter_golden_desc:0 "The lords of the dominion pay in coin and trade for privileges the Golden Court is glad to write. Parim draws more from them, and the lords grumble at the price."
 zin_aenor_reissue_charter_old:0 "Restore the Old Charter of [FROM.GetName]"
 zin_aenor_reissue_charter_old_desc:0 "The Charters of Parim as they were first sworn: the dominion keeps its liberties, no more and no less."
 zin_aenor_reissue_charter_shield:0 "Grant a Shield Charter to [FROM.GetName]"
 zin_aenor_reissue_charter_shield_desc:0 "The dominion keeps a standing company for the Lost Cause, trains it hard, and has the means to do so."
 zin_aenor_reissue_charter_wall:0 "Grant a Wall Charter to [FROM.GetName]"
 zin_aenor_reissue_charter_wall_desc:0 "The dominion keeps a stretch of the Great Wall, and the crown leaves it the means."
 zin_aenor_restore_charter:0 "Restore the Charter of [FROM.GetName]"
 zin_aenor_restore_charter_desc:0 "A dominion that tore up its Charter is told that the Charter was never the dominion's to tear. The crown will say it again with the host behind it."
 zin_aenor_rightful_king:0 "The Rightful King"
 zin_aenor_rightful_king_desc:0 "The Crown of Aen sits on a head that the people chose. Whatever it costs, the kingdom has a king it wanted."
 zin_aenor_seventeen_centuries:0 "Seventeen Centuries of the Crown"
 zin_aenor_seventeen_centuries_desc:0 "Whatever the King does, the courts sit, the roads are kept and the tithe is counted. Seventeen centuries of habit keep a bad king's kingdom running."
 zin_aenor_silence_dissenters:0 "Silence the Dissenters"
 zin_aenor_silence_dissenters_desc:0 "Every voice that names another claimant is told to be quiet, and some are made quiet. It works only once; a kingdom does not forgive it twice."
 zin_aenor_strangers_word:0 "The Stranger's Word"
 zin_aenor_strangers_word_desc:0 "The frontier captains and the scholars carry word of the stranger from hall to hall, and the commoners shout it back."
 zin_aenor_temple_favour:0 "Temple Favour"
 zin_aenor_temple_favour_desc:0 "How many offices are held by friends of the temples. The temples truly help: the granaries are full and the sick are tended. That is why nobody asks what they ask in return."
 zin_aenor_temples_speak:0 "The Temples Speak"
 zin_aenor_temples_speak_desc:0 "Every temple in the kingdom is asked to name the god's choice from its altar, on the same morning."
 zin_aenor_throne_abandoned:0 "The Throne Abandoned"
 zin_aenor_throne_abandoned_desc:0 "The god-king has left the palace and not said when he will return. Parim holds its breath, and the Captains keep the gates."
 zin_aenor_tt_court_corruption_minus_1:0 "Court corruption -1"
 zin_aenor_tt_court_corruption_minus_2:0 "Court corruption -2"
 zin_aenor_tt_court_corruption_minus_4:0 "Court corruption -4"
 zin_aenor_tt_court_corruption_plus_1:0 "Court corruption +1"
 zin_aenor_tt_court_corruption_plus_2:0 "Court corruption +2"
 zin_aenor_tt_court_corruption_plus_3:0 "Court corruption +3"
 zin_aenor_tt_loyalty_of_every_dominion_minus_5:0 "Loyalty of every dominion -5"
 zin_aenor_tt_loyalty_of_every_dominion_plus_5:0 "Loyalty of every dominion +5"
 zin_aenor_tt_support_of_the_stranger_s_host_minus_10:0 "Support of the Stranger's Host -10"
 zin_aenor_tt_support_of_the_stranger_s_host_plus_10:0 "Support of the Stranger's Host +10"
 zin_aenor_tt_support_of_the_stranger_s_host_plus_5:0 "Support of the Stranger's Host +5"
 zin_aenor_tt_temple_favour_minus_1:0 "Temple Favour -1"
 zin_aenor_tt_temple_favour_minus_2:0 "Temple Favour -2"
 zin_aenor_tt_temple_favour_plus_1:0 "Temple Favour +1"
 zin_aenor_tt_temple_favour_plus_2:0 "Temple Favour +2"
 zin_aenor_tt_temple_favour_plus_3:0 "Temple Favour +3"
 zin_aenor_tt_temple_favour_plus_6:0 "Temple Favour +6"
 zin_aenor_tt_the_lost_cause_gains_10:0 "The Lost Cause gains 10"
 zin_aenor_tt_the_lost_cause_gains_2:0 "The Lost Cause gains 2"
 zin_aenor_tt_the_lost_cause_gains_3:0 "The Lost Cause gains 3"
 zin_aenor_tt_the_lost_cause_gains_5:0 "The Lost Cause gains 5"
 zin_aenor_tt_the_lost_cause_loses_10:0 "The Lost Cause loses 10"
 zin_aenor_tt_the_lost_cause_loses_2:0 "The Lost Cause loses 2"
 zin_aenor_tt_the_lost_cause_loses_5:0 "The Lost Cause loses 5"
 zin_aenor.1.a:0 "The month turns."
 zin_aenor.10.a:0 "Open the great hall to all."
 zin_aenor.10.b:0 "A small table and a short night."
 zin_aenor.10.desc:0 "Another feast in the gilded halls. Half the court is invited; the other half is offended, and has already sent a servant to count the candles."
 zin_aenor.10.t:0 "A Feast in the Golden Court"
 zin_aenor.100.a:0 "The King's tribute is due."
 zin_aenor.100.b:0 "The old liberties are kept."
 zin_aenor.100.desc:0 "The lords of every dominion sit in the old hall at Parim, beneath the banners of the Charters, and wait to hear what the crown asks of them this year."
 zin_aenor.100.t:0 "The Concord Council"
 zin_aenor.101.a:0 "Hear them, and ease the tithe."
 zin_aenor.101.b:0 "The Charter says what the crown says it says."
 zin_aenor.101.desc:0 "The lords of [zin_aenor_petitioner.GetName] send a petition to Parim. They say the tithe has outrun the Charter, and that the Charter was written to be kept by both sides."
 zin_aenor.101.t:0 "A Charter Grievance"
 zin_aenor.102.a:0 "We have read it. We will keep it."
 zin_aenor.102.desc:0 "Riders from Parim bring a new Charter under the crown's seal. The lords of our land read it aloud in the hall and weigh what it gives against what it costs."
 zin_aenor.102.t:0 "A New Charter"
 zin_aenor.103.a:0 "Note it in the rolls."
 zin_aenor.103.desc:0 "[zin_aenor_levy_refuser.GetName] sends no men to the levy. Its lords write that the Concord was sworn to defend the kingdom, not to follow the crown's quarrels, and that their harvest will not bring itself in."
 zin_aenor.103.t:0 "The Levy Refused"
 zin_aenor.11.a:0 "Sell the seat."
 zin_aenor.11.b:0 "The seat is not for sale."
 zin_aenor.11.desc:0 "A merchant house offers gold for a judgeship in the lake cities. The house is rich, and the seat has been empty since the spring."
 zin_aenor.11.t:0 "Offices for Sale"
 zin_aenor.110.a:0 "Take the Free Charter."
 zin_aenor.110.b:0 "We stay free."
 zin_aenor.110.desc:0 "Letters under the seal of [zin_aenor_rejoin_realm.GetName] reach our free hall. They offer a Free Charter: rule of our own lands in all but defence, and no tithe but what our lords grant."
 zin_aenor.110.t:0 "Letters to the Free Dominions"
 zin_aenor.12.a:0 "Strike his name from the rolls."
 zin_aenor.12.b:0 "Let the song die by itself."
 zin_aenor.12.desc:0 "A steward bought his seat and the whole city knows the price. The singers of the lake quarters have already made a song of it, and the song has a second verse about the one who sold it."
 zin_aenor.12.t:0 "A Scandal in the Gilded Halls"
 zin_aenor.150.a:0 "Let the banners fly."
 zin_aenor.150.b:0 "Spend the day on the wall instead."
 zin_aenor.150.desc:0 "The banners of the Lost Cause are carried through Parim in the sun. The court cheers the parade. The frontier captains in the crowd count the swords behind the banners, and say nothing."
 zin_aenor.150.t:0 "The League's Triumph"
 zin_aenor.151.a:0 "Laugh, and pour the envoy wine."
 zin_aenor.151.b:0 "Send scouts to the passes."
 zin_aenor.151.desc:0 "An envoy from the passes of Mirolon asks to be heard. He says the Ember Lands are arming, and that the beacons of the south were lit twice in the winter. The court remembers 4A 1736 and smiles."
 zin_aenor.151.t:0 "Warnings from Mirolon"
 zin_aenor.152.a:0 "Sailors have always told tales."
 zin_aenor.152.b:0 "Send a cutter to look."
 zin_aenor.152.desc:0 "Fishermen tell of black hulls in the north that carry no lamps and cast no wake. Nobody at court believes them, and the harbour masters have stopped writing the tales down."
 zin_aenor.152.t:0 "Tales of Black Ships"
 zin_aenor.160.a:0 "The league stands with the crown."
 zin_aenor.160.b:0 "Let the captains hear him."
 zin_aenor.160.desc:0 "Word of a stranger on Selen's shore has divided the league that the Golden King founded. Its court branch stands with the crown. Its frontier captains and its scholars ask to hear the stranger before they judge him."
 zin_aenor.160.t:0 "The Lost Cause Divided"
 zin_aenor.2.a:0 "The month turns."
 zin_aenor.20.a:0 "Set the seal to it."
 zin_aenor.20.b:0 "Answer in our own words."
 zin_aenor.20.desc:0 "Merovan, Keeper of the Seals, has already drafted the King's answer to the letters of the dominions. It is a good answer, and it is written in a clear hand. He asks only for the seal."
 zin_aenor.20.t:0 "The Seal-Keeper's Counsel"
 zin_aenor.200.a:0 "The bells of Parim toll."
 zin_aenor.200.b:0 "A king is dead in Parim."
 zin_aenor.200.desc:0 "The Golden King, who outlived every man who ever wished him dead, died in his bed of nothing but his years. The physicians found no poison, and for once nobody looked for one. The seals of Parim lie on an empty cushion."
 zin_aenor.200.desc1:0 "The Golden King died in his sleep after the Gaelor feast. He reigned twenty-one years. The seals of Parim lie on an empty cushion."
 zin_aenor.200.t:0 "The King Is Dead"
 zin_aenor.201.a:0 "Let the council decide."
 zin_aenor.201.b:0 "Follow the Faithful."
 zin_aenor.201.c:0 "Follow the Golden Court."
 zin_aenor.201.d:0 "Follow the Free Dominions."
 zin_aenor.201.desc:0 "The seals lie on an empty cushion. Four voices claim to speak for Aenor, and the thirty days have begun. The Golden Court holds [?ROOT.zin_aenor_camp_court|0] of a hundred, the Free Dominions [?ROOT.zin_aenor_camp_dominions|0], [zin_loc_camp_faithful] [?ROOT.zin_aenor_camp_faithful|0], [zin_loc_camp_host] [?ROOT.zin_aenor_camp_host|0]."
 zin_aenor.201.desc1:0 "The seals lie on an empty cushion. Three voices claim to speak for Aenor, and the thirty days have begun. The Golden Court holds [?ROOT.zin_aenor_camp_court|0] of a hundred, the Free Dominions [?ROOT.zin_aenor_camp_dominions|0], [zin_loc_camp_faithful] [?ROOT.zin_aenor_camp_faithful|0]."
 zin_aenor.201.e:0 "Follow the Stranger's Host."
 zin_aenor.201.t:0 "Whom Will You Follow?"
 zin_aenor.21.a:0 "Take the grain, and thank the Houses."
 zin_aenor.21.b:0 "The crown feeds its own poor."
 zin_aenor.21.desc:0 "The Houses of the First Light offer grain for the poor quarters of Parim. The carts are at the gate, the grain is clean, and the priests who drive them ask for nothing."
 zin_aenor.21.t:0 "Gifts from the Houses"
 zin_aenor.210.a:0 "Let it be done."
 zin_aenor.210.b:0 "So Parim has chosen."
 zin_aenor.210.desc:0 "The seals of Parim are given. The temples and the councillors carry them from the empty cushion to the hands that will keep them, and the bells ring again."
 zin_aenor.210.desc1:0 "The seals of Parim are given to the Golden Court. No king is named; the Regency will keep the crown warm for one."
 zin_aenor.210.desc2:0 "The seals of Parim are given to the Concord. The lords of the dominions will choose a Speaker, and the Charters will be written again."
 zin_aenor.210.desc3:0 "The seals of Parim are given to the friends of the stranger. A man of the First Men is hailed by the frontier and the scholars, though no crown has been set on his head."
 zin_aenor.210.desc4:0 "The seals of Parim are given."
 zin_aenor.210.t:0 "The Seals of Parim"
 zin_aenor.211.a:0 "The banners are raised."
 zin_aenor.211.desc:0 "Parim's Golden Court will not accept the seals. Its lords have bought too much to see it given away, and they raise their own banners in the hinterland estates of the capital."
 zin_aenor.211.t:0 "The Golden Court Rises"
 zin_aenor.212.a:0 "So it begins."
 zin_aenor.212.desc:0 "The temples of Parim will not accept the seals. [zin_loc_camp_faithful] raise their own banners in the cities of the Great Lake, and call the lords of the faith to them."
 zin_aenor.212.t:0 "The Faithful Rise"
 zin_aenor.213.a:0 "So it begins."
 zin_aenor.213.desc:0 "The frontier will not accept the seals. [zin_loc_camp_host] raise their banners along the marches and call every captain of the Lost Cause to them."
 zin_aenor.213.t:0 "The Host Rises"
 zin_aenor.214.a:0 "The Concord is broken."
 zin_aenor.214.desc:0 "The lords of the dominions have torn up their charters. They name themselves free, and gather beneath one banner that is not the crown's."
 zin_aenor.214.t:0 "The Dominions Declare Themselves Free"
 zin_aenor.215.a:0 "Let the halls be quiet."
 zin_aenor.215.desc:0 "Those who would not accept the new order have been sent from Parim, or are quiet. The halls are emptier than they were a month ago, and the people who remain speak to each other more slowly."
 zin_aenor.215.t:0 "The Dissenters Silenced"
 zin_aenor.216.a:0 "Then it will be settled by the sword."
 zin_aenor.216.desc:0 "A party that was silent at the thirtieth day has grown strong enough to call the lords to its own banner. It says that the seals were given wrongly, and it has the swords to say so."
 zin_aenor.216.t:0 "A Rival for the Crown"
 zin_aenor.22.a:0 "Let the offices pass to other hands."
 zin_aenor.22.b:0 "Fill the empty seats with the temples' friends."
 zin_aenor.22.desc:0 "The temples' friends at court are fewer this year. Their seats stand empty at the long table, and the men who took the places beside them are not yet sure where to put their hands."
 zin_aenor.22.t:0 "The Temples Lose Favour"
 zin_aenor.220.a:0 "We are free."
 zin_aenor.220.b:0 "Let it be written in the rolls."
 zin_aenor.220.desc:0 "The charter lies in pieces on the council table. Our lords swear to one another instead of to the crown, and the Concord's banner comes down from the hall."
 zin_aenor.220.desc1:0 "Another dominion has torn up its charter and sent back the seals of the Concord. The council hall is a smaller room than it was."
 zin_aenor.220.t:0 "A Dominion Breaks Its Charter"
 zin_aenor.230.a:0 "The month turns."
 zin_aenor.240.a:0 "Let their word be written down."
 zin_aenor.240.desc:0 "The physicians keep their voices low. The King is sound, they say, and sleeps as a man of his years should."
 zin_aenor.240.desc1:0 "The physicians keep their voices low. The King is tired, they say, more than a feast and a hunt can account for, and they would like to see him rest."
 zin_aenor.240.desc2:0 "The physicians keep their voices low, and will not meet your eye. The King is failing, they say, and they cannot tell you why."
 zin_aenor.240.t:0 "The King's Physicians"
 zin_aenor.241.a:0 "Seal the chest."
 zin_aenor.241.b:0 "Burn the ledgers, and begin again."
 zin_aenor.241.desc:0 "The scribes have followed the purse through three ledgers and a temple kitchen. It ended in the hand of a man who serves the King's cup, and the men who paid him wear temple robes. The proof is sealed in a chest, and it can be laid before the King."
 zin_aenor.241.desc1:0 "The scribes lost the purse among the ledgers of the Houses. It may have gone to a baker or to a hand that serves the King's cup; the books do not say. The King's table is no safer than it was."
 zin_aenor.241.t:0 "Where the Coin Went"
 zin_aenor.242.a:0 "Show him the rest."
 zin_aenor.242.b:0 "Take the letters back before he reads them."
 zin_aenor.242.desc:0 "The King listens in silence. He turns the sealed letters over in his hands, and looks for a long time at the cup beside him. When he speaks, it is to ask who else has read them."
 zin_aenor.242.t:0 "The King Hears the Proof"
 zin_aenor.250.a:0 "The Lost Cause will guard him."
 zin_aenor.250.desc:0 "The King has read the letters twice. He has had the cup tasted three times and sent for his guards. He says only that he will remember who sat at his table, and the court understands that he means every one of them."
 zin_aenor.250.t:0 "The King Learns"
 zin_aenor.260.a:0 "The King's league will answer."
 zin_aenor.260.desc:0 "The temples will not bow to a king who looks at them across a cup. They raise their banners in the name of the Deliverer, and the Seal-Keeper has gone with them, riding as Lord Protector of the faithful."
 zin_aenor.260.desc1:0 "The friends of the temples have lost their seats at court, one by one, and without a sound. The Seal-Keeper left Parim by night, and nobody has asked where he went."
 zin_aenor.260.t:0 "The Temples Answer"
 zin_aenor.261.a:0 "Long may he reign."
 zin_aenor.261.desc:0 "The banners of the temples are down and the lords who rose with them have been counted. The King lives, and the court goes on. He does not sleep without a taster, and he has never again drunk what was poured for him."
 zin_aenor.261.t:0 "The King Endures"
 zin_aenor.300.a:0 "The captains hold the seals."
 zin_aenor.300.desc:0 "The King has gone east. The Seal-Keeper's chair is empty. The captains of the Lost Cause hold the seals, and say they hold them for a king who will return."
 zin_aenor.300.desc1:0 "[zin_loc_deliverer] has abandoned the throne of Aenor and gone east. The country that served him waits to learn who will rule in his place."
 zin_aenor.300.t:0 "The Throne Abandoned"
 zin_aenor.320.a:0 "Hail him."
 zin_aenor.320.b:0 "No man is king before he is crowned."
 zin_aenor.320.desc:0 "Aenoran survivors who stood with him in the west and in the north have begun to hail him as king. They have not asked leave of anyone. The word has reached our halls, and it is louder than any herald."
 zin_aenor.320.t:0 "The Hailed King"
 zin_aenor.321.a:0 "Let the banners be raised."
 zin_aenor.321.desc:0 "The soldiers who followed the stranger home have taken the road to the marches, and the captains of the frontier have opened the gates to them. They do not ask our leave. They ask only which side of the wall we will stand on."
 zin_aenor.321.t:0 "The Host Rises"
 zin_aenor.330.a:0 "The Captains hold."
 zin_aenor.330.desc:0 "Word comes down the palace road: the Hailed King fell, and no one has found him. The Captains take the seals and swear to keep them for him, and for no one else."
 zin_aenor.330.t:0 "The King Is Lost"
 zin_aenor.331.a:0 "Long live the King."
 zin_aenor.331.desc:0 "He walks into the camp on his own feet, thin and silent, and the Captains give back the seals one by one. Nobody asks how far he fell."
 zin_aenor.331.t:0 "The King Returns"
 zin_aenor.400.a:0 "Long live the King."
 zin_aenor.400.desc:0 "The captains, the lords of the dominions and the stranded soldiers of half of Aoaz stand in the ruins of Parim and ask Eindil, son of Ein and grandson of Aen, to take the crown. Around his neck he wears the Necklace of the Abyss. Its price is not yet known."
 zin_aenor.400.t:0 "The Crown of Aen"
 zin_aenor.401.a:0 "Long live the King."
 zin_aenor.401.b:0 "A king sits in Parim."
 zin_aenor.401.desc:0 "The Fourth Age has a king of Aen's line again. His coronation did not erase the grievances of those who watched it."
 zin_aenor.401.t:0 "Eindil Is Crowned"
 zin_aenor.402.a:0 "We take the Free Charter."
 zin_aenor.402.b:0 "We stay as we are."
 zin_aenor.402.desc:0 "The new king offers every dominion a Free Charter, or freedom. He forces neither. The offer is written in his own hand, and the Concord is asked to read it aloud."
 zin_aenor.402.t:0 "A Charter of Equals"
 zin_aenor.460.a:0 "Name him heir."
 zin_aenor.460.b:0 "No stranger sits on this throne."
 zin_aenor.460.desc:0 "The Golden King has heard of the man the frontier calls the stranger, and has asked to see the letters that speak of his blood. He is old, he has no heir he would trust with the cup, and he asks the council what a king ought to do about a rival who may be a gift."
 zin_aenor.460.t:0 "The King and the Stranger"
 zin_concord_charter_free:0 "Free Charter"
 zin_concord_charter_free_desc:0 "The dominion rules itself in all but the crown's defence, and gives its tithe freely."
 zin_concord_charter_golden:0 "Golden Charter"
 zin_concord_charter_golden_desc:0 "Its lords bought their privileges from the Golden Court. Parim draws more from them, and they grumble at the price."
 zin_concord_charter_old:0 "Old Charter"
 zin_concord_charter_old_desc:0 "The dominion keeps the liberties the first Charters of Parim gave it, no more and no less."
 zin_concord_charter_shield:0 "Shield Charter"
 zin_concord_charter_shield_desc:0 "The dominion keeps a standing company for the Lost Cause and trains it hard."
 zin_concord_charter_wall:0 "Wall Charter"
 zin_concord_charter_wall_desc:0 "The dominion keeps a stretch of the Great Wall, and the crown leaves it the means."
