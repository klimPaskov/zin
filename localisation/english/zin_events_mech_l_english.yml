l_english:
 zin_aenor.470.a:0 "A king without a kingdom."
 zin_aenor.470.desc:0 "Aenor has fallen to its enemies, but the Golden King was not taken with his crown. He left Parim by the lake road with his household and as much of the treasury as the wagons would carry, and he keeps his court now as the guest of whoever will feed it."
 zin_aenor.470.t:0 "The Golden King in Exile"
 zin_afrit.10.a:0 "Then the King's years are numbered."
 zin_afrit.10.desc:0 "Merovan, Keeper of the Seals, has come up from Parim to the hermitage, and he sits with Ilvane the High Confessor and Corvel, Master of Couriers, in the cold room behind the reliquary. They put before you again the judgement the Council reached two years ago: the Golden King's taxes anger the dominions, and his league of crowns could grow into a seat of power that answers to no temple. Merovan believes the King can still be taught to drink less and sign more, but Ilvane does not, and neither, Afrit, do you."
 zin_afrit.10.t:0 "The Council's Verdict"
 zin_afrit.11.a:0 "The physicians of the Houses."
 zin_afrit.11.b:0 "An accident on the King's hunt."
 zin_afrit.11.c:0 "The fever-blessing of the Censers."
 zin_afrit.11.desc:0 "Corvel lays three ways before the Council, and none of them is new. The Houses keep physicians at court who mix the King's evening draught, the Couriers know which of his huntsmen owe them money, and the Censer Chapter can send a fever-blessing that works slowly and leaves no mark at all. Merovan asks only that whatever is chosen should look like the will of the gods."
 zin_afrit.11.t:0 "Choose the Instrument"
 zin_afrit.14.a:0 "Choose the night."
 zin_afrit.14.desc:0 "Everything is in place, and only the night remains to be chosen. The physicians know their work, the guards on the King's stair have been changed for men the Couriers trust, and Merovan keeps a fair copy of the proclamation of mourning in his desk."
 zin_afrit.14.t:0 "The Night Is Near"
 zin_afrit.15.a:0 "Not this year."
 zin_afrit.15.a.tt:0 "The Council waits a year and asks again."
 zin_afrit.15.b:0 "At the feast of Gaelor."
 zin_afrit.15.c:0 "At the first chance."
 zin_afrit.15.d:0 "Stay the hand."
 zin_afrit.15.d.tt:0 "The Council's preparations are put away, and the King lives."
 zin_afrit.15.desc:0 "The feast of Gaelor is the King's favourite, and he always sleeps late after it. Merovan says the court will be drunk and the guards tired by the small hours, and that a death in the month of mourning will surprise nobody in Parim."
 zin_afrit.15.t:0 "Choose the Night"
 zin_afrit.16.a:0 "Bury what can be buried."
 zin_afrit.16.desc:0 "Somebody at court has talked, and the King's guard has taken two of the Houses' physicians from their beds. Merovan swears that neither of them knows the Council's name, and Ilvane has the temples praying loudly for the King's health, but the work of years is undone and the court of Parim is watching every priest."
 zin_afrit.16.t:0 "Found Out"
 zin_afrit.17.a:0 "Treason in Parim, of all places."
 zin_afrit.17.desc:0 "The chancery of Parim announces that servants of the temples have been accused of conspiring against the life of the Golden King. The King is well and has given thanks at the great temple on the lake, and the accused have been taken to the island fortress to wait for his judgement."
 zin_afrit.17.t:0 "Treason in the Golden Court"
 zin_afrit.20.a:0 "Let the seals wait."
 zin_afrit.20.a.tt:0 "Merovan keeps the seals for another month."
 zin_afrit.20.b:0 "Take the crown."
 zin_afrit.20.c:0 "Raise a pliant heir."
 zin_afrit.20.d:0 "Rule from Parim in person."
 zin_afrit.20.d.tt:0 "You leave the hermitage to Ilvane and take the throne of Parim yourself."
 zin_afrit.20.desc:0 "The Golden King is buried, the Thirty Days are over and the Faithful hold Parim. Merovan has ridden to the hermitage with the seals of the kingdom in a plain box, and he lays them on the table in front of you. After all the long years behind the throne you may sit on it at last, or you may set a pliant boy on it and keep your hands where they have always been."
 zin_afrit.20.t:0 "The Seals Pass to the Deliverer"
 zin_afrit.21.a:0 "Long live the King."
 zin_afrit.21.desc:0 "The King is dead, and the council and the temples have laid the crown of Parim before [zin_loc_deliverer], who has guarded Aenor since the fall of Elzon. He is King of Aenor, First of His Name, and New God of Men, and the bells of every temple on the lake rang for him from dawn until the evening prayer."
 zin_afrit.21.t:0 "Aurevan, First of His Name"
 zin_afrit.22.a:0 "Silence them."
 zin_afrit.22.b:0 "Spare them."
 zin_afrit.22.desc:0 "Some at court still ask questions: a judge of the lake courts, two lords of the lake cities and a captain of the Lost Cause who will not kneel in the temple. They are few, and none of them is a fool, which is exactly why Corvel would like an answer from you before the month is out."
 zin_afrit.22.t:0 "Dissenters at Court"
 zin_afrit.23.a:0 "Long live King Eronel."
 zin_afrit.23.desc:0 "The temples and the council have crowned Prince Eronel of Arcedor in Parim. He is young and willing, the Keeper of the Seals stands at his right hand, and the priests say that [zin_loc_deliverer] himself blessed the choice."
 zin_afrit.23.t:0 "A New King in Parim"
 zin_afrit.31.a:0 "Stay where you are."
 zin_afrit.31.b:0 "Go north and lie in wait."
 zin_afrit.31.c:0 "Go north and take the crystal at once."
 zin_afrit.31.c.tt:0 "On arrival the party goes straight into the hall."
 zin_afrit.31.d:0 "Send others."
 zin_afrit.31.d.tt:0 "The Council's hunters wait for the elven ship without you."
 zin_afrit.31.desc:0 "A courier of the Whispers has come up from the south with sea salt still on his cloak. The guest of the Gala court has a name now, and the name is Eindil, son of Ein. Your brother is alive, Afrit, and the elves mean to send him north by sea, towards the silent castle where Horos keeps the crystal you have wanted for so long."
 zin_afrit.31.t:0 "Word from the Lands of the Sun"
 zin_afrit.32.a:0 "Steer for the north."
 zin_afrit.32.desc:0 "The pilgrim ships have put out from the cold harbours with the Deliverer aboard, and Merovan holds the seals until he comes back. The captains have been told that they carry a holy man on retreat, which is true in its way, and they have stopped asking why the holy man's guard is so well armed."
 zin_afrit.32.t:0 "The Northern Voyage"
 zin_afrit.33.a:0 "Let them land."
 zin_afrit.33.a.tt:0 "No blade is drawn on the shore, and the crew walk up to the castle with him."
 zin_afrit.33.b:0 "Spare none."
 zin_afrit.33.b.tt:0 "Your men fall on the crew as they come up the path."
 zin_afrit.33.desc:0 "The elven ship is in the bay below the silent castle, and your men are lying in the snow above the landing path. The crew are coming ashore in two boats, and the tall man in the first of them is your brother."
 zin_afrit.33.t:0 "The Ambush on the Shore"
 zin_afrit.34.a:0 "Rest, and let the temples sing."
 zin_afrit.34.desc:0 "The pilgrim ships have brought the Deliverer home from the north, and the wound he took in the hall of Yeldenne has not closed. Whatever was said in that hall, your brother heard it, and the Couriers will have to work very hard indeed to keep it from reaching Parim."
 zin_afrit.34.t:0 "Return from Yeldenne"
 zin_afrit.43.a:0 "So that is whom they prayed to."
 zin_afrit.43.desc:0 "The name is spoken in Parim at last, first in the guardrooms and then in the temples themselves: the god the kingdom worshipped as the Deliverer is Afrit, son of Ein, and the stranger from the ice is his brother. The priests of the Houses are being asked a great many questions, and most of them have no answers to give."
 zin_afrit.43.desc1:0 "The name is spoken in Parim at last, first in the guardrooms and then in the temples themselves: the god the kingdom worshipped as the Deliverer is Afrit, son of Ein, a man of the line of the First Men. The priests of the Houses are being asked a great many questions, and most of them have no answers to give."
 zin_afrit.43.t:0 "The Name Behind the Deliverer"
 zin_afrit.45.a:0 "Close the Houses."
 zin_afrit.45.b:0 "Watch them."
 zin_afrit.45.desc:0 "The Houses of the First Light served the false god of Parim, although many of the physicians and scribes who work in them never knew it. The court must decide whether to shut their doors and lose the hospitals with them, or to leave them open and watch who comes and goes."
 zin_afrit.45.t:0 "The Houses Under Suspicion"
 zin_afrit.51.a:0 "Refuse him."
 zin_afrit.51.b:0 "Kneel to the King of the East."
 zin_afrit.51.desc:0 "An embassy has come over the caravan roads from the west with news that the god-king of Aenor has left his throne, and that he asks the courts of the East to take him for their king. His envoys speak warmly of the Houses we have sheltered for so long, and rather more quietly of the debts our councillors owe them."
 zin_afrit.51.t:0 "The Deliverer Comes East"
 zin_afrit.52.a:0 "A king in the East, then."
 zin_afrit.52.desc:0 "In the East, kings have knelt to [zin_loc_deliverer] and named him their king, although not every crown along the caravan roads agrees with them, and the ones that do not are already counting their spears."
 zin_afrit.52.t:0 "A King in the East"
 zin_afrit.53.a:0 "Merovan follows us east."
 zin_afrit.53.a.tt:0 "The Keeper of the Seals brings what he knows of every court on the lake."
 zin_afrit.53.b:0 "Merovan stays in Parim."
 zin_afrit.53.b.tt:0 "The Keeper of the Seals stays in Parim and keeps his friends at court."
 zin_afrit.53.desc:0 "Merovan has kept the seals of Parim for you through two reigns, and now he asks whether he is to follow you east or stay behind with them. He would be useful in either place, and he knows it, which is why he has asked so politely."
 zin_afrit.53.t:0 "The Keeper's Choice"
 zin_afrit.60.a:0 "Turn the banners west."
 zin_afrit.60.desc:0 "Volgan's body is broken in the south, the dead of the north have gone back behind their gate, and your brother is still weak from the field. Aenor lies open, and the Host of the East has been ready to march since the thaw."
 zin_afrit.60.desc1:0 "The Host of the East is ready to march, and Aenor will not wait for a better season. Whoever holds Parim now holds it without you, and the kings who knelt to you would like to see what it was they knelt for."
 zin_afrit.60.t:0 "The Return from the East"
 zin_afrit.61.a:0 "Go to the cliff."
 zin_afrit.61.desc:0 "Your brother is on the cliff road above the gorge, still weak from the field, with a guard too small for the road. You have hated him since the day your father refused you, and you have never explained it to anyone, not even to Merovan, and tonight you will not need to."
 zin_afrit.61.t:0 "Brother Against Brother"
 zin_afrit.62.a:0 "Every court has heard it."
 zin_afrit.62.desc:0 "[zin_loc_deliverer] has taken Parim again and proclaims himself king of Aenor, of the East and of every people of Aoaz, which is a larger claim than the lands he holds. Heralds are riding to every court with copies of the proclamation, and some of them are being received."
 zin_afrit.62.t:0 "Lord of All Aoaz"
 zin_afrit.70.a:0 "Wake the hermitage."
 zin_afrit.70.desc:0 "Someone is in the service passages under the palace. The wards on the lower doors have woken one after another, and the captain of the guard says that the footprints in the dust of the old kitchens are fresh."
 zin_afrit.70.t:0 "The Palace Wards"
 zin_afrit.71.a:0 "Trust the wards."
 zin_afrit.71.a.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.71.b:0 "Burn the reserves."
 zin_afrit.71.b.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.71.c:0 "Draw on the Necklace."
 zin_afrit.71.c.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.71.d:0 "Go through the doors."
 zin_afrit.71.d.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.71.desc:0 "The intruders have reached the long gallery and the guard is wavering. If the Deliverer shows himself at the head of the stair the men will hold, and the Ring of Doors on your hand would carry you out of any room that turned against you."
 zin_afrit.71.t:0 "The Eye and the Ring"
 zin_afrit.72.a:0 "Trust the wards."
 zin_afrit.72.a.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.72.b:0 "Burn the reserves."
 zin_afrit.72.b.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.72.c:0 "Draw on the Necklace."
 zin_afrit.72.c.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.72.desc:0 "The rebels of the palace have found the chamber where the seals of the crown are kept, and every seal they break takes something from the Crown of Witnesses you wear. Ilvane is sending every priest in the palace to the seal chamber, though few of them have held a sword."
 zin_afrit.72.t:0 "The Seals of the Crown"
 zin_afrit.73.a:0 "Trust the wards."
 zin_afrit.73.a.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.73.b:0 "Burn the reserves."
 zin_afrit.73.b.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.73.c:0 "Draw on the Necklace."
 zin_afrit.73.c.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.73.desc:0 "Your brother has reached the inner hall, and he is turning your own workings against you, which he can only have learned from the crystal he carries. The Bracelet of the First Seal grows warm on your wrist each time he speaks."
 zin_afrit.73.t:0 "The Bracelet"
 zin_afrit.74.a:0 "Trust the wards."
 zin_afrit.74.a.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.74.b:0 "Burn the reserves."
 zin_afrit.74.b.tt:0 "The intruders press on, and the hermitage meets them."
 zin_afrit.74.desc:0 "Your brother is on the floor at your feet and your blade is at his throat, and there is nothing left between you and the end of it but the Necklace of the Abyss and whatever it will still give you tonight."
 zin_afrit.74.t:0 "The Necklace"
 zin_afrit.75.a:0 "A god who could die."
 zin_afrit.75.desc:0 "Afrit, who was worshipped in Parim as the Deliverer, is dead. His brother killed him in the palace after the treasures of the hermitage had been torn from him one by one, and he died as a mortal man dies, without a miracle."
 zin_afrit.75.desc1:0 "[zin_loc_deliverer] is dead, killed in the palace of Parim by [zin_loc_eindil] after the treasures he wore had been torn from him one by one. He died as a mortal man dies, and the priests who had promised a miracle have stopped promising anything."
 zin_afrit.75.t:0 "The False God Falls"
 zin_afrit.76.a:0 "Seal the passages."
 zin_afrit.76.desc:0 "The intruders have gone back into the passages they came by, and your brother went with them, bleeding. The palace holds, although the captain of the guard has not slept since the wards woke, and neither have you."
 zin_afrit.76.t:0 "The Palace Holds"
 zin_afrit.77.a:0 "Let the hunters ride."
 zin_afrit.77.desc:0 "The realm that sheltered [zin_loc_deliverer] has fallen, and he was not found among the dead or the prisoners. Some say he went into the hills with a handful of priests, and the courts that hunt him have put a price on his head that would buy a small kingdom."
 zin_afrit.77.desc1:0 "The realm that sheltered [zin_loc_deliverer] has fallen, and he has fled to the court of [zin_afrit_refuge.GetName], which has taken him in with every honour it could find at short notice."
 zin_afrit.77.t:0 "The Hunt for the False God"
