l_english:
 zin_lore_jubilee_feast:0 "The Jubilee Feast"
 zin_lore_jubilee_feast_desc:0 "The tables were long, the toasts were longer, and for half a year the people of Parim will say that they remember what peace tasted like."
 zin_lore_old_report:0 "The Old Report"
 zin_lore_old_report_desc:0 "The Marshal has read the Mirolonese report from cover to cover, and has put marks in the margin where the court laughed."
 zin_lore.1.a:0 "Long live the Golden King."
 zin_lore.1.d:0 "For seventeen centuries the Middle Kingdom has known peace. The Golden King is in the nineteenth year of his reign. The Concord's dominions grumble at his taxes, and the Golden Court sells what it likes: a judgeship to the highest bidder, a charter to the next.\n\nThe peace is permanent, the court says. The Deliverer protects the crown, and the temples are full. Volgan is a legend told to children, and the dominions will obey, as they always have.\n\nThe King wants glory and gold, and a triumph for his Lost Cause. The court wants offices. The dominions want lower taxes, and none of them has said so to the King's face."
 zin_lore.1.t:0 "The Year 1748"
 zin_lore.10.a:0 "Every road ends in Postondoroth."
 zin_lore.10.d:0 "Stabilo's merchant princes rule from Postondoroth and lead the Stabilo Pact with Drak. Their fleets of river-barges go down the river with the spring floods, and their agents sit in every market between the Rift and the southern dunes.\n\nNoris is the rival that matters. The gold road and the salt road have been one road in the minds of two courts for as long as either has had a court.\n\nYou mean to win the southern trade routes."
 zin_lore.10.t:0 "The Year 1748"
 zin_lore.101.a:0 "Spend, and let the city see it."
 zin_lore.101.a_tip:0 "A feast that all Parim will talk of for half a year."
 zin_lore.101.b:0 "A modest feast."
 zin_lore.101.d:0 "The Lord Steward has laid out the Jubilee accounts: a feast for the peace of seventeen centuries, with the Golden Court's own musicians, forty kinds of fish from the Great Lake and a bill the size of a small shire. The temples have sent word that they will bless the tables whatever the cost."
 zin_lore.101.t:0 "The Jubilee Remembered"
 zin_lore.102.a:0 "Sell the seat."
 zin_lore.102.b:0 "Refuse the merchant."
 zin_lore.102.d:0 "A merchant of the Great Lake ports has come to the Golden Court with a purse the weight of a child, and a request for the vacant judgeship of the lower bench. He has read no law. He has, he says, read the Lord Steward, who has read the purse."
 zin_lore.102.t:0 "The Price of a Seat"
 zin_lore.103.a:0 "Pay for the parade."
 zin_lore.103.b:0 "Let the frontier keep the money."
 zin_lore.103.d:0 "The league the Golden King founded against the powers of the dark marches through Parim behind the King, in gilt cuirasses cut for the occasion. The frontier companies that make up its real strength have been told to march at the back, where their mud will not be seen."
 zin_lore.103.t:0 "The Lost Cause Parades"
 zin_lore.104.a:0 "Laugh with him."
 zin_lore.104.b:0 "Ask the Marshal to read the old report."
 zin_lore.104.b_tip:0 "The army will study the report for half a year."
 zin_lore.104.d:0 "A courtier has found it amusing to mimic the Mirolonese envoy who came to Parim twelve years ago to warn of arming in the Ember Lands. The envoy had a stammer. The court laughs; the old marshal does not."
 zin_lore.104.t:0 "A Joke at Court"
 zin_lore.105.a:0 "Honour Selen first."
 zin_lore.105.b:0 "Honour the crown."
 zin_lore.105.d:0 "Selen keeps the day that Harion the Restorer was crowned at Parim. The rangers say that he was Selen's son before he was Aenor's king, and the children are taught the rhyme before they are taught the letters. Parim keeps the same day with a banquet and does not mention where he was born."
 zin_lore.105.t:0 "The Restorer's Day"
 zin_lore.106.a:0 "Let them sing."
 zin_lore.106.d:0 "The ploughmen of the old grave-fields sing at the furrow of the wizard who lifted the curse from the soil, and of the small purple servant who carried his lamp. The tune is older than the words, and some of the words have worn smooth."
 zin_lore.106.t:0 "Songs of the Unbinding"
 zin_lore.107.a:0 "Waive it."
 zin_lore.107.a_tip:0 "The Magical Forest will think well of Kingson."
 zin_lore.107.b:0 "Keep it."
 zin_lore.107.d:0 "Elven traders at the great gate refuse to pay a new toll, and say that the Wall Accord names no such toll. The customs-master has read the Accord twice. He thinks that the elves are right, and that the crown will not thank him for saying so."
 zin_lore.107.t:0 "Customs at the Wall"
 zin_lore.11.a:0 "The clans are weary."
 zin_lore.11.d:0 "After fifty years of war with Girdon, Gunwaith keeps the Truce of the Grey Ford, signed three years ago. The clans have put their swords on the rafters, and the lawspeakers are busy for the first time in a generation with disputes about cattle.\n\nThe truce is fragile. Aenor once tried to rule the West, and it still taxes the West through its tariffs, which is an older grievance than the feud with Girdon.\n\nYou want peace at home, lower tariffs, and the old claims of Parim buried for good."
 zin_lore.11.t:0 "The Year 1748"
 zin_lore.110.a:0 "Reaffirm the old refusal."
 zin_lore.110.b:0 "Remember that Aoaz is shared."
 zin_lore.110.d:0 "In the House of Elders the old ones recall the march into the Ember Lands after Dardan, and the thousands who did not return from it, and the war-king who would not hear that the war was won. The young ones listen. They have heard it before, and they listen all the same."
 zin_lore.110.t:0 "Edran's Folly"
 zin_lore.111.a:0 "The roosts are well."
 zin_lore.111.d:0 "At dusk the dragons rise from the high roosts and circle the mountain in a slow wheel, as they have every evening of the year since the elves began to count. The roost wardens count them aloud, and say that the number is right."
 zin_lore.111.t:0 "Wings over Dragon Mountain"
 zin_lore.112.a:0 "Bless them."
 zin_lore.112.a_tip:0 "A court somewhere will remember the welcome."
 zin_lore.112.b:0 "Keep the gifts."
 zin_lore.112.d:0 "A caravan of pilgrims has come to the hermitage from a far court, footsore, grateful and carrying gifts for the Deliverer: dates in wax, a bale of white wool, a box of silver coins tied up in a child's sock. They ask to be allowed to kiss the threshold."
 zin_lore.112.t:0 "Pilgrims at Zilin"
 zin_lore.12.a:0 "Iron and fire."
 zin_lore.12.d:0 "The Warking of Cocanoor rules the inner Dark Lands, where the fire-clans of the volcano country gave up their quarrels three hundred years ago for the pleasure of making them with someone else. Dondor and its Accord stand in the way.\n\nThe Dark Lands should be one kingdom, and the kingdom is yours. Every clan that sends its sons to the Warking's march is a clan that does not send them to a rival.\n\nYou mean to subdue Dondor and the free holds."
 zin_lore.12.t:0 "The Year 1748"
 zin_lore.120.a:0 "Remember it."
 zin_lore.120.b:0 "Let it rest."
 zin_lore.120.d:0 "It is the anniversary of the toll quarrel, when Leren envoys were made to wait three days at the door of the Golden Court in the rain and were then asked to pay for the privilege. The skalds of Sonargur recite the list of the insults, in order, to a hall that knows it by heart."
 zin_lore.120.t:0 "The Toll of 1716"
 zin_lore.121.a:0 "One kingdom."
 zin_lore.121.d:0 "The festival of the union is kept in Sonargur with torches along the harbour wall and a procession of both royal houses, the elder carrying the sceptre of Lerendor and the younger the sceptre of Lerenwaith. The crowd cheers each in turn, and louder for the two together."
 zin_lore.121.t:0 "Two Crowns, One Kingdom"
 zin_lore.122.a:0 "Read it with honour."
 zin_lore.122.b:0 "Read it with a smirk."
 zin_lore.122.d:0 "Custom requires that the Treaty of the Narrow Strait be read aloud once a year in the great hall of Sonargur. The reader this year is a young skald who has been told by an uncle at court how he is to read it, and by a cousin at the harbour how he is to read it otherwise."
 zin_lore.122.t:0 "The Treaty Read Aloud"
 zin_lore.13.a:0 "The watch never sleeps."
 zin_lore.13.d:0 "Mirolon is free again, long after Volgan took it in the First Age. Its wardens watch the passes to the south and write the names of their dead on the wall of the pass-house, four hundred years of them in stone.\n\nVolgan is arming. Mirolon has told Parim so for twelve years, and Parim has sent a scholar to look at the maps. Nobody in the north will listen.\n\nYou mean to hold the passes and to win allies, and to see to it that the second goes faster than the first."
 zin_lore.13.t:0 "The Year 1748"
 zin_lore.130.a:0 "Keep the feast."
 zin_lore.130.b:0 "Parade on the border."
 zin_lore.130.b_tip:0 "Isengard will not forgive the drums."
 zin_lore.130.d:0 "The kings of Coldor brought the frozen interior under one crown on this day, nine hundred years ago, and Isengard refused. The envoy of Isengard sends his compliments on the anniversary every year, in a letter composed to be read aloud and to be hurtful."
 zin_lore.130.t:0 "The Winter Crown"
 zin_lore.131.a:0 "Pass the cup."
 zin_lore.131.d:0 "A trader came back from the far north with a green light in his story and a good reason for not having gone nearer: he saw it, and turned round. Nobody at the fire called him a coward. The silent castle has been there longer than anyone's grandmother, and has not yet sent for anyone."
 zin_lore.131.t:0 "The Silent Castle"
 zin_lore.14.a:0 "Light the beacons."
 zin_lore.14.d:0 "Dondor holds the northern Dark Lands with Belonton's help in the Dark Sea Accord. Its beacon-towers stand a day's march apart along the whole border, and its levies drill on market days whatever the weather.\n\nGoldoroth is the danger. Its warlord is patient, and patient warlords are the worst kind.\n\nYou mean to survive Goldoroth, and to make sure that surviving does not become a habit."
 zin_lore.14.t:0 "The Year 1748"
 zin_lore.140.a:0 "Keep the feast together."
 zin_lore.140.a_tip:0 "The two courts will like each other better."
 zin_lore.140.b:0 "Feast alone."
 zin_lore.140.b_tip:0 "The two courts will like each other less."
 zin_lore.140.d:0 "The third anniversary of the Truce of the Grey Ford falls today. Gunwaith's thanes and Girdon's wardens have each been asked to the other's feast, and each has been told by an uncle that it would be unwise to go. Nobody wishes to be the first to refuse."
 zin_lore.140.t:0 "Truce Day"
 zin_lore.141.a:0 "Grumble."
 zin_lore.141.a_tip:0 "Parim will like us less."
 zin_lore.141.b:0 "Pay."
 zin_lore.141.d:0 "Parim has raised a duty on western grain, and the customs-houses on the central sea have posted the new rate in a script that few of the factors can read. The merchants have gathered on the quay to decide who will tell the king, and have not agreed."
 zin_lore.141.t:0 "Aenoran Tariffs"
 zin_lore.142.a:0 "Sing it again."
 zin_lore.142.d:0 "A bard sings in the hall of Gunwaith's banner at Dardan, and of Taryn who would not draw a sword until her people had been named on the roll beside Aenor's. The thanes bang their cups on the table at the verse where she wins the argument."
 zin_lore.142.t:0 "Taryn's Song"
 zin_lore.15.a:0 "Who walks here?"
 zin_lore.15.d:0 "In the frozen north of the Cold Lands, the Castle of Yeldenne keeps its silence. Its lord, Horos, guards Glo, a crystal of old and holy power that has burned there longer than the castle has had walls. Nobody has come to the gate in living memory.\n\nGlo is for the worthy, Horos has said, and has not said who they are.\n\nYou mean to keep Glo from the unworthy."
 zin_lore.15.t:0 "The Year 1748"
 zin_lore.150.a:0 "Sell them."
 zin_lore.150.b:0 "Keep them."
 zin_lore.150.d:0 "A crown on the mainland wants to buy the new charts of the Pupor Ocean, drawn in the chart-hall this winter with the currents of the outer isles marked in three colours. The chart-masters say that a chart sold is a chart copied, and that a chart kept is a chart not paid for."
 zin_lore.150.t:0 "Charts for Sale"
 zin_lore.160.a:0 "Retaliate quietly."
 zin_lore.160.a_tip:0 "The other court will like us less."
 zin_lore.160.b:0 "Pay the blood-price."
 zin_lore.160.d:0 "A band crossed the border in the night and drove off forty head of cattle and burned a barn. No war has been declared, and no one has been killed, which both courts have remarked on with the care of men who intend to remember it."
 zin_lore.160.t:0 "Raids on the Border"
 zin_lore.161.a:0 "Refuse."
 zin_lore.161.b:0 "Accept."
 zin_lore.161.b_tip:0 "The south will remember who took its gifts."
 zin_lore.161.d:0 "A stranger from the Ember Lands has come to our hold with a string of mules. He brings iron, salt and good wine, and asks for nothing but a night's lodging and the pleasure of our company. He speaks well of everyone and has not once said whom he serves."
 zin_lore.161.t:0 "Gifts from the South"
 zin_lore.170.a:0 "Send word to Parim."
 zin_lore.170.a_tip:0 "Parim will think better of us, and do nothing."
 zin_lore.170.b:0 "Fortify."
 zin_lore.170.b_tip:0 "A stone fort will rise in the capital's border country."
 zin_lore.170.d:0 "Scouts returned from the southern road with dust on their cloaks and a count of the columns they had seen: three, and a fourth they could not count. The wardens at the pass-house have heard such reports before. They write this one down, in the book that Parim does not read."
 zin_lore.170.t:0 "What the Scouts Saw"
 zin_lore.171.a:0 "Continue."
 zin_lore.171.d:0 "The hosts drill where no ship can see. The drill-masters have been given the old rolls of the First Age and a year to teach the young how a great host marches in step. They find that it can be taught, if it is taught by the same voice for long enough."
 zin_lore.171.t:0 "Behind the Storms"
 zin_lore.180.a:0 "Disbelieve them."
 zin_lore.180.b:0 "Send a boat."
 zin_lore.180.b_tip:0 "The boat will not come back."
 zin_lore.180.d:0 "Fishermen have come to the harbour-master with a tale of black ships among the islands, ships with no crews that the tide moves in the wrong direction. The harbour-master has promised to look into it. He has put the tale at the bottom of the pile."
 zin_lore.180.t:0 "Black Ships"
 zin_lore.190.a:0 "Undercut back."
 zin_lore.190.a_tip:0 "The other court will like us less."
 zin_lore.190.b:0 "Hold the price."
 zin_lore.190.d:0 "The rival court has undercut the price of salt on the road by a copper to the load, and every caravan-master from the river to the dunes knows it before the sun is up. The treasurer wants to know whether we answer in kind, or in silence."
 zin_lore.190.t:0 "The Caravan Price War"
 zin_lore.2.a:0 "The Council sits."
 zin_lore.2.d:0 "The hermitage of the Zilin Hills holds three valleys and almost no army. Its strength is the pilgrims, couriers and confessors who pass through it to every court in Aoaz, and the bread that the Houses of the First Light give away at every gate. You are Afrit. The world knows you as $zin_name_aurevan$ the Deliverer.\n\nThe Golden King is a liability, the Council believes. The Lost Cause could become a rival seat of power, and the dominions grumble where they should be grateful. The Council judged so in 4A 1746, in the room where the Council judges.\n\nYou mean to take Aenor's crown openly, to keep the eastern courts as a reserve against the day it is needed, and one day to hold Glo."
 zin_lore.2.t:0 "The Year 1748"
 zin_lore.200.a:0 "Let the boats stay in."
 zin_lore.200.d:0 "The fisherfolk will not cross the reef at night. They say that it sings, and that what it sings is a name you know, and that this is the reason not to go. The old men tell the story slightly differently every time."
 zin_lore.200.t:0 "The Reef of Voices"
 zin_lore.201.a:0 "Let them chant."
 zin_lore.201.d:0 "At low tide the priests of the half-drowned shrine chant the name cut into its lintel, as their grandmothers' grandmothers did. Aen, they chant. No priest can say who Aen was, and none has thought it right to ask the tide."
 zin_lore.201.t:0 "The Name in the Shrine"
 zin_lore.210.a:0 "Let him speak."
 zin_lore.210.d:0 "The King speaks of Dardan to a hall of young elves who were born a thousand years after it. He does not speak of the victory. He speaks of the smell of the field on the second morning, and of the order in which the names were read out, and the hall sits very still."
 zin_lore.210.t:0 "Lorien's Audience"
 zin_lore.211.a:0 "Send it south."
 zin_lore.211.d:0 "An old tale too strange to explain has come down to us from a grandmother, and the family has agreed that it must go to Gala, where the old ones are. A boat is being fitted for the voyage, and the tale is being written down by three people in three hands, so that it cannot be lost."
 zin_lore.211.t:0 "Carry It to Gala"
 zin_lore.220.a:0 "Read on."
 zin_lore.220.d:0 "The Council's record lies open on the table of the room where the Council sits. At the end of the Third Age Afrit shielded the people at the fall of Elzon, and was hailed the Deliverer. In 4A 1 he was acclaimed in the open under the name Aurevan. Some time after the Thousand-Year Jubilee the Council took its four seats: Seals, Censers, Whispers and Relics.\n\nThe record goes on. Priests teach princes, and councillors rise by the god's favour. Kings reign; the Council governs. In 4A 1611 the thief returned from the Abyss with the Necklace, and was granted unending life. Between then and 4A 1700 the lesser artifacts were gathered. Not one name in the ledger has changed in three hundred years."
 zin_lore.220.t:0 "The Ledger of Kings"
 zin_lore.221.a:0 "So it is written."
 zin_lore.221.a_tip:0 "The Council's preparations begin."
 zin_lore.221.d:0 "The Council confirms its judgement of the Golden King. He sells offices to men the Council did not choose. His league, the Lost Cause, has frontier companies that answer to no seat. The dominions grumble at his taxes in rooms that the Council does not hear. A liability, the Seals say. The Censers agree. The Whispers offer to arrange it quietly, in the year the Council names."
 zin_lore.221.t:0 "The Decision of 4A 1746"
 zin_lore.3.a:0 "The North remembers."
 zin_lore.3.d:0 "The two crowns of Lerendor and Lerenwaith are one kingdom, and its fleets guard the Narrow Strait. The ships of the North have kept the water for twelve generations, and the harbour-masters of Sonargur can tell a Leren keel from an Aenoran one by the sound of the oars.\n\nAenor despises the North. The toll of 4A 1716 proves it, and the court at Sonargur has not forgotten the shape of that insult. The treaty serves Parim, the lords say, and Parim has never once thanked the sea that guards it.\n\nYou may honour the Treaty of the Narrow Strait, break it, or bend it into Leren mastery of the strait. The North remembers either way."
 zin_lore.3.t:0 "The Year 1748"
 zin_lore.300.a:0 "Keep the feast."
 zin_lore.300.b:0 "A day like any other."
 zin_lore.300.d:0 "Today the temples remember how the Deliverer shielded the people when Elzon fell. Bread is blessed at every temple door and given away to anyone who asks, and the queue goes round the corner twice. The old women say that the bread tastes the same as it did in their mothers' time, and that this is the point."
 zin_lore.300.t:0 "The Feast of Deliverance"
 zin_lore.301.a:0 "Reward the Houses."
 zin_lore.301.a_tip:0 "The Houses' friends will think well of us."
 zin_lore.301.b:0 "Thank the healer."
 zin_lore.301.d:0 "A healer of the Houses of the First Light saved a lord's child from the spotted fever, sitting up with the boy for nine nights, and would take no payment. She said only that the bread at her House was enough. The lord has been asking his stewards what a man can give to someone who will not be paid."
 zin_lore.301.t:0 "A Healer Who Asks Nothing"
 zin_lore.302.a:0 "Let them copy the rolls."
 zin_lore.302.b:0 "We keep our own rolls."
 zin_lore.302.d:0 "The Houses of the First Light ask to copy our birth rolls, to keep them safe in the vaults of Parim beside the rolls of every other dominion. They say that fire and damp take parish books, and that the Houses have never lost a roll. Our own clerk, who has lost several, has been very quiet."
 zin_lore.302.t:0 "The Birth Rolls"
 zin_lore.303.a:0 "So it is sung."
 zin_lore.303.d:0 "In Parim the High Confessor preaches that seventeen centuries of peace are the Deliverer's gift, and that a grateful kingdom is a safe one. The nave is full to the doors. A cloth-merchant, standing at the back, is heard to say that he is grateful for the roof as well."
 zin_lore.303.t:0 "A Sermon on Gratitude"
 zin_lore.304.a:0 "Be grateful."
 zin_lore.304.b:0 "Ask who paid for the grain."
 zin_lore.304.d:0 "A poor harvest in the hills. The Houses opened their grain stores before our own officials had counted the sacks, and the carts were on the roads before the steward had finished his report. Nobody is starving. The steward is unhappy and cannot say why."
 zin_lore.304.t:0 "Grain From the Temple Stores"
 zin_lore.305.a:0 "Let the temple keep its gifts."
 zin_lore.305.b:0 "Tax the temple land."
 zin_lore.305.d:0 "A provincial governor complains that the local temple owns more land than he does, and that its tenants pay their rent in blessings. He has a map with the temple's holdings marked in blue. The blue is most of the map."
 zin_lore.305.t:0 "A Temple Too Rich"
 zin_lore.310.a:0 "Store it."
 zin_lore.310.b:0 "Sell it abroad."
 zin_lore.310.d:0 "The grain fleet of the Great Lake is in. The harbours of Parim are full to the breakwater, and the quay-masters have been shouting themselves hoarse since dawn. The granary-wardens ask what is to be done with the surplus, and the Lord Steward has several suggestions."
 zin_lore.310.t:0 "The Lake Fleet Comes In"
 zin_lore.311.a:0 "Buy the spices."
 zin_lore.311.b:0 "Tax the caravan."
 zin_lore.311.d:0 "An eastern caravan has come through the elven roads, with pepper in oiled bags, glass the colour of weak tea and stories of rich courts across the rift. The drivers are polite and tired. They want to sell everything they carry and to buy nothing but salt."
 zin_lore.311.t:0 "A Caravan From Beyond the Wall"
 zin_lore.312.a:0 "Send the best furs."
 zin_lore.312.d:0 "The fur ships sail south before the ice closes the harbours. The West Lands pay well this year, the factors say, and the best pelts are already reserved for the ones who paid in advance. The holds are being loaded by lantern-light, and the dockmen sing as they stack."
 zin_lore.312.t:0 "Furs for the South"
 zin_lore.313.a:0 "Trade fairly."
 zin_lore.313.a_tip:0 "One of the sun-realms will remember it."
 zin_lore.313.d:0 "Traders from the tall folk's realms have anchored with white-gold silk in the hold, and are buying salt fish by the barrel. They pay in coin and in courtesy, and they ask after the health of the harbour-master's mother by name. Nobody remembers telling them."
 zin_lore.313.t:0 "Sun-Silk at the Harbour"
 zin_lore.314.a:0 "Pay it."
 zin_lore.314.b:0 "Make do without."
 zin_lore.314.d:0 "Salt from Cocanoor's pans costs twice what it did, and nobody else sells it. The pans are worked by gangs of the Warking's own clansmen, and the price rises every time a caravan arrives. The cook has asked whether the soup can be made with less."
 zin_lore.314.t:0 "The Price of Salt"
 zin_lore.315.a:0 "Build boats."
 zin_lore.315.b:0 "Sell the timber to Aenor."
 zin_lore.315.b_tip:0 "Parim will think well of us."
 zin_lore.315.d:0 "Log rafts come down the rivers from the northern forests, twelve to a tow, bound for the shipyards. The raftsmen are paid by the log and by the day, and the foreman has taken to sleeping on the rearmost raft with a cudgel in his arms."
 zin_lore.315.t:0 "Timber Rafts on the River"
 zin_lore.316.a:0 "Hang him too."
 zin_lore.316.b:0 "Fine him and let him sail."
 zin_lore.316.d:0 "Three pirates are hanged on the quay at dusk. Their captain swears from the gallows that he was a merchant who missed a toll, and that the toll was posted in a script nobody can read. The crowd is large and quiet and unsure which way to look."
 zin_lore.316.t:0 "Pirates Hanged at Adel"
 zin_lore.317.a:0 "Attend."
 zin_lore.317.d:0 "Two houses of Postondoroth marry their fortunes. The feast lasts nine days, and the fountains of the lower city run with wine on the third. The notaries of both houses have drawn up contracts in three languages, and have asked, in confidence, that they not be asked to read them aloud."
 zin_lore.317.t:0 "A Merchant Prince's Wedding"
 zin_lore.320.a:0 "A blessing."
 zin_lore.320.b:0 "Ask the university."
 zin_lore.320.d:0 "For three days the Great Lake did not ripple. The priests call it a blessing. The fishermen do not go out, and the ferrymen sit on the jetties and look at the water as one looks at a sleeping dog. On the fourth day the wind comes back, and nobody mentions it."
 zin_lore.320.t:0 "The Lake Is Too Still"
 zin_lore.321.a:0 "A hard winter, then."
 zin_lore.321.d:0 "The seabirds have left the northern cliffs a month early. Old women say it means a hard winter, and the wood-stacks in the village are already higher than usual. The children are told that the birds will be back, and the children are sensible enough not to ask when."
 zin_lore.321.t:0 "Birds Leave the Northern Cliffs"
 zin_lore.322.a:0 "Write it down."
 zin_lore.322.b:0 "Volcanoes in the Ember Lands."
 zin_lore.322.d:0 "Grey ash fell on the marches in a week without clouds, and the washerwomen of the border villages found their linen speckled with it. It came from the south. The wardens of Mirolon have written to ask whether Herez has seen it too."
 zin_lore.322.d_mirolon:0 "Grey ash fell on the passes in a week without clouds. It came from the south, and it fell thickest in the places where the old watchfires burned. The wardens swept it from the pass-house steps and found, an hour later, that the steps needed sweeping again."
 zin_lore.322.t:0 "Ash on the Wind"
 zin_lore.323.a:0 "Sell it to a travelling show."
 zin_lore.323.b:0 "Let the priests bless it."
 zin_lore.323.d:0 "A calf with two heads was born in a village near the capital. Half the province has come to see it, and the miller's wife has begun to sell little cakes shaped like calves. It has not lived beyond the first night, and its keeper has been offered large sums for the skin."
 zin_lore.323.t:0 "A Two-Headed Calf"
 zin_lore.324.a:0 "Not this year."
 zin_lore.324.b:0 "The clans grow restless."
 zin_lore.324.c:0 "Light the beacons."
 zin_lore.324.d:0 "The moon was red over the orc country. Our watchmen counted the fires on the far hills, and counted them again, and the number was the same both times. The captain of the beacons has asked for extra tallow for the towers."
 zin_lore.324.d_goldoroth:0 "The Fire-Speakers say that the red moon wants war. The Warking has asked them what the moon wants in particular, and for how long, and they have asked for a week to consult the embers."
 zin_lore.324.t:0 "A Red Moon Over Cocanoor"
 zin_lore.325.a:0 "Pay for the best one."
 zin_lore.325.b:0 "Dismiss them."
 zin_lore.325.d:0 "A star fell over the desert in the second watch of the night, and was seen from three cities. Court astrologers have written three opinions on it and charge for each. The first says that it was a sign, the second that it was not, and the third that the first two were paid for."
 zin_lore.325.t:0 "A Star Falls in the East"
 zin_lore.326.a:0 "Let the young laugh."
 zin_lore.326.d:0 "An elder says she saw smoke far to the south and far to the north on the same evening, from the same hill. The young ones laugh at her, politely, and bring her tea. She drinks it, and says that she is too old to be told what she saw."
 zin_lore.326.t:0 "Smoke Seen From the Elven Hills"
 zin_lore.327.a:0 "The wind."
 zin_lore.327.d:0 "A harbour bell rang at midnight with no one in the tower. The wind, says the harbour master, who has been to the tower and found the door locked from the inside. The bell-ringer's apprentice, who sleeps beneath it, has asked to be moved."
 zin_lore.327.t:0 "The Bell That Rang by Itself"
 zin_lore.330.a:0 "Fishermen's tales."
 zin_lore.330.b:0 "Send a clerk to look."
 zin_lore.330.d:0 "The fishermen of the north coast say their nets came up full of water as black as ink, and no fish in them. They sold the nets at a loss and went home. The old men say that black water is a thing that happens. The young men are less sure."
 zin_lore.330.t:0 "Nets Full of Black Water"
 zin_lore.331.a:0 "Pay the widows."
 zin_lore.331.b:0 "Keep it in the village."
 zin_lore.331.d:0 "A fishing boat drifted home with its nets folded and its crew gone. There was no storm, and the breakfast was still warm in the pot. The village has not yet decided whether to put the boat on the shingle or to burn it."
 zin_lore.331.t:0 "The Boat That Came Back Empty"
 zin_lore.332.a:0 "Laugh with the court."
 zin_lore.332.b:0 "Give him a pension and silence."
 zin_lore.332.d:0 "An old fisherman insists before the court that he saw men walking on the sea floor among the black islands, in rows, at low tide. The court laughs. He does not. He has brought a witness, a boy of eleven, who confirms every word and is sent home with a sweet."
 zin_lore.332.t:0 "A Fisherman Before the Court"
 zin_lore.333.a:0 "Order them north."
 zin_lore.333.b:0 "Let them fish where they like."
 zin_lore.333.d:0 "This spring the fishing fleets will not sail north of the last cape. No captain will say why. The harbour master has asked each in turn, and each has found a different reason that did not survive the second question."
 zin_lore.333.t:0 "The Fleet Stays South"
 zin_lore.340.a:0 "Add none this year."
 zin_lore.340.b:0 "Read them aloud."
 zin_lore.340.d:0 "On the wardens' wall in the passes, the names of scouts who never came back fill four hundred years of stone. The mason who cuts them has run out of wall on the east face and begun on the west. He asks whether this year's names are to be added, or whether the year has not yet earned them."
 zin_lore.340.t:0 "The Wall of Names"
 zin_lore.341.a:0 "Copy them for the archives."
 zin_lore.341.b:0 "Tracks blow away."
 zin_lore.341.d:0 "Scouts found tracks in the ash south of the passes: many tread, in step, not all of them human. They followed the tracks for a morning and found no end. They came home with a drawing of one print, and the drawing is still on the table where the High Warden put it."
 zin_lore.341.t:0 "Tracks in the Ash"
 zin_lore.342.a:0 "Give him a pension."
 zin_lore.342.b:0 "Send him back south."
 zin_lore.342.d:0 "A scout came back from beyond the storms. He eats and sleeps, and he does not speak of what he saw. He wakes in the night with his hand on the hilt of a sword that he has not worn since he was a boy. The healers say that there is nothing wrong with him that they can name."
 zin_lore.342.t:0 "A Scout Comes Back Changed"
 zin_lore.343.a:0 "Send the count to Parim."
 zin_lore.343.a_tip:0 "Parim will think better of us, and do nothing."
 zin_lore.343.b:0 "Keep counting."
 zin_lore.343.d:0 "The wardens counted the fires in the Ember Lands this autumn. There are more than last year. There were more last year than the year before. Each autumn the count has been carried to Parim in a sealed box, and each autumn it has been sent back with a polite note that does not mention the number."
 zin_lore.343.t:0 "The Night Fires Counted"
 zin_lore.344.a:0 "Watch with them."
 zin_lore.344.a_tip:0 "Mirolon will think well of us."
 zin_lore.344.b:0 "Mirolon frets."
 zin_lore.344.d:0 "The High Warden writes to Herez again: watch the south. Herez's lords have read such letters before, and keep them in a drawer in the order they arrived. The drawer is getting full."
 zin_lore.344.t:0 "A Letter From Mirolon"
 zin_lore.345.a:0 "As long as Volgan lives."
 zin_lore.345.b:0 "Lighten the levy."
 zin_lore.345.d:0 "The lake towns pay for the watch on the passes. Their councils ask how long they must pay for a war that nobody else believes in, and the treasurer has brought the ledgers to show them how little of it has been fought. He has a way of saying that is not a comfort."
 zin_lore.345.t:0 "The Lake Towns Count the Cost"
 zin_lore.346.a:0 "Boys will be boys."
 zin_lore.346.b:0 "Let the masters hear them."
 zin_lore.346.d:0 "Students from Mirolon at the University of Parim are mocked as the boys who fear the dark. They have asked the masters for a hearing, and the masters have agreed to one on a day that falls in the vacation. The students have not yet worked out whether this is a courtesy or an answer."
 zin_lore.346.t:0 "Mirolonese Students in Parim"
 zin_lore.350.a:0 "Let Parim see it."
 zin_lore.350.a_tip:0 "Parim will not like to be looked down on."
 zin_lore.350.b:0 "Move it to the hall."
 zin_lore.350.d:0 "Selen's square has a new statue of Harion the Restorer, cast in the foundry by the river and set up on a plinth of Selen limestone. It is taller than any statue of a king in Parim. The sculptor was told to make him a Selen man first and a king second, and the statue's boots have mud on them."
 zin_lore.350.t:0 "The Restorer's Statue"
 zin_lore.351.a:0 "Let them count."
 zin_lore.351.d:0 "The ents have counted the rings of the oldest tree in the forest again. They lost count, and began again. They have been counting for as long as there have been ents, and the trouble is, they say, that the tree keeps growing."
 zin_lore.351.t:0 "Ents Count the Rings"
 zin_lore.352.a:0 "Trade."
 zin_lore.352.d:0 "Giants come down to the lake for the fair, wading in to the thigh, and the merchants of the little towns sell them boots that are never big enough. The giants buy them every year and wear them as hats. Everyone agrees that this is the best part of the fair."
 zin_lore.352.t:0 "The Giants' Fair"
 zin_lore.353.a:0 "Sell to the riders."
 zin_lore.353.b:0 "Sell to Parim anyway."
 zin_lore.353.d:0 "At the riders' horse fair a lord of Parim offers too little for the best stallion and is laughed home. The stallion belongs to a girl of fourteen, who has refused three offers and has asked the price of the horse's name."
 zin_lore.353.t:0 "Horse Fair at Hunhun"
 zin_lore.354.a:0 "Keep the old custom."
 zin_lore.354.a_tip:0 "The Magical Forest will think well of Kingson."
 zin_lore.354.d:0 "Once a year the great gate in the Wall stands open from dawn to dusk, and elves and men trade in its shadow without a toll. The custom is older than the Accord and has outlived two attempts to end it. The gate-wardens stand on either side in their ceremonial plain wool."
 zin_lore.354.t:0 "Gate Day at Kingson"
 zin_lore.355.a:0 "We wish to be left alone."
 zin_lore.355.d:0 "The Veiled Elder sent back every envoy of the year with their letters unopened. The envoys were fed, lodged and sent home with presents. Not one of them could say afterwards what the Elder looked like, or whether the Elder was a man or a woman."
 zin_lore.355.t:0 "Every Envoy Returned"
 zin_lore.356.a:0 "Good hunting."
 zin_lore.356.b:0 "Double the border watch."
 zin_lore.356.d:0 "Raiders from the Bloody Forest burned a barn on our border. They took a goat and left a message in blood on the door, which the barn's owner has been scrubbing for a day. It said, in a bad hand, that they would be back."
 zin_lore.356.d_forest:0 "Our young men raided a farm across the border. The farmer's dog bit one of them, which the others are not allowing him to forget. The raid was a success, in the sense that nobody was killed and a goat was taken."
 zin_lore.356.t:0 "Raids From the Red Woods"
 zin_lore.357.a:0 "Ring the harbour bells."
 zin_lore.357.d:0 "Asgard remembers that its harbour was the first the Aenoran ships reached, long ago. The houses on the quay still keep the day, with bunting in the shape of the old square sails. The children are told that the first sailors were all hungry, and that it was Asgard's grandmothers who fed them."
 zin_lore.357.t:0 "The First Port"
 zin_lore.358.a:0 "Smile at both."
 zin_lore.358.d:0 "Sonargur and Parim both sent envoys this month. Each asked for the same thing, which was nothing in particular, and each wanted it written down. The seal-keeper of Molot has drafted two replies in identical words and is trying to decide which seal goes on which."
 zin_lore.358.t:0 "Between Two Masters"
 zin_lore.359.a:0 "Raise it."
 zin_lore.359.a_tip:0 "Lerendor will not thank us."
 zin_lore.359.b:0 "Keep it."
 zin_lore.359.d:0 "Ships between the Leren and the Aenoran seas pay R'en's toll at the gateway of the strait, and captains from both seas complain of it in the same words. The toll-keeper has begun to keep a list of the complaints. It is longer than the list of the dues."
 zin_lore.359.t:0 "The Gateway Toll"
 zin_lore.360.a:0 "Share it."
 zin_lore.360.d:0 "The yeti of the white valleys go on the long hunt in the dead of the year. They come back with more than they need, and they share it. The elders say that this is the whole of their law, and that other people's laws are longer but do not do more."
 zin_lore.360.t:0 "The Long Hunt"
 zin_lore.361.a:0 "Set it again."
 zin_lore.361.d:0 "The Frost-King sets a riddle for every envoy. Nobody has answered it in a hundred years, and the envoys have stopped trying. They tell the Frost-King that the answer is a secret, and he nods gravely, and all agree that this is the best answer that has been offered."
 zin_lore.361.t:0 "The Frost-King's Riddle"
 zin_lore.362.a:0 "To the winners."
 zin_lore.362.d:0 "The sea-city races its ships round the capes. Coldor's captains lose again, as they have every year since the race began, and send a barrel of their best to the winners with a note that says only: next year."
 zin_lore.362.t:0 "The Windwaith Regatta"
 zin_lore.363.a:0 "Let Fandanar see it."
 zin_lore.363.b:0 "Count it."
 zin_lore.363.d:0 "Isengard builds another fort on the march. The watchtower at the border has counted eleven since the last thaw, and the garrison's commander has asked whether the count is a boast or a threat. Nobody at the Winter Court is sure."
 zin_lore.363.d_isengard:0 "Another fort rises on the march, of grey stone dragged by oxen from the old quarries. The masons sing at their work. The Refusal of 850 is not mentioned in the songs, and is the reason for all of them."
 zin_lore.363.t:0 "Isengard's New Fort"
 zin_lore.364.a:0 "Guard the caravans."
 zin_lore.364.d:0 "The Buldor companies look for contracts. In a year of peace the only buyers are merchants who want guards, and the captains are learning what it is to be hired by a man who cares whether the wagons arrive with their wheels on."
 zin_lore.364.t:0 "Companies for Hire"
 zin_lore.365.a:0 "Back the guilds."
 zin_lore.365.a_tip:0 "Parim will not like it."
 zin_lore.365.b:0 "End the strike."
 zin_lore.365.d:0 "Kradlon's guilds stop the forges for a week over Aenoran tariffs on their iron. The apprentices sit on the cold anvils and the masters stand with their arms folded. The city has gone quiet in a way it has not been quiet in living memory, and the sound is not restful."
 zin_lore.365.t:0 "The Guild Strike"
 zin_lore.366.a:0 "Publish them."
 zin_lore.366.d:0 "The trading city opens its ledgers to the townsfolk once a year, and they come with their own books to compare. This year, for the first time in anyone's memory, they balance. The treasurer has had to sit down."
 zin_lore.366.t:0 "Ledger Day in Corogon"
 zin_lore.367.a:0 "Redraw the charts."
 zin_lore.367.d:0 "The autumn storms came early. Two charts were wrong, and one was wrong in a way that the chart-masters will not discuss in front of the apprentices. A fishing fleet came home a week late and a boat short, with a story about a current that the charts do not show."
 zin_lore.367.t:0 "Storm Season in the Pupor Ocean"
 zin_lore.368.a:0 "Keep the rule."
 zin_lore.368.d:0 "Orcs, men and goblins trade in Blackton's market under one rule: no blades drawn. The rule is chalked on the gate in four scripts. Last winter a goblin stallholder pulled a knife on an orc who had insulted his scales, and was thrown out of the market by the other goblins, who were embarrassed."
 zin_lore.368.t:0 "Blackton's Free Market"
 zin_lore.369.a:0 "Iron, then."
 zin_lore.369.d:0 "Travellers through the Troll Forest pay at the old bridge. The trolls take payment in iron, not gold, and are unmoved by arguments about the relative value. A merchant has been trying for an hour to persuade them that his gold is heavier than their iron."
 zin_lore.369.t:0 "The Troll Bridge Toll"
 zin_lore.370.a:0 "Sing louder."
 zin_lore.370.a_tip:0 "Andos Enda will not like it."
 zin_lore.370.b:0 "Sing back."
 zin_lore.370.b_tip:0 "Herrodon will not like it."
 zin_lore.370.d:0 "Herrodon is singing about us again. The grove songs this year name an old slight, and the singers have found a rhyme for Andos Enda that the elders consider uncalled for."
 zin_lore.370.d_herrodon:0 "The grove songs this year name an old slight from Andos Enda. It is a very old slight, and the song is a very long one, and the young singers have to be reminded of the second verse."
 zin_lore.370.t:0 "Grove Songs in Herrodon"
 zin_lore.371.a:0 "The passes are ours."
 zin_lore.371.d:0 "Nolorim's pass-wardens change the guard on the high road, as they have every spring for ages. The old guard hands the new one a staff and a lantern and a list of the names of those who have passed since autumn. The list is short."
 zin_lore.371.t:0 "Wardens of the High Passes"
 zin_lore.372.a:0 "A good year."
 zin_lore.372.d:0 "The giant mushrooms bloomed in one night, and the glow could be seen from the Wall. Watchmen on the towers took it for a fire and rang the bells, and the elves of the forest came out with lanterns to put it out. They found nothing burning."
 zin_lore.372.t:0 "The Mushroom Forest Blooms"
 zin_lore.373.a:0 "Give thanks."
 zin_lore.373.d:0 "The breeze from the sea that Olen calls holy blew for nine days this summer, and the washing dried in an hour. The priests of the breeze held a procession on the tenth day, at which several people were seen to be weeping with relief at having their shirts back."
 zin_lore.373.t:0 "The Holy Breeze"
 zin_lore.374.a:0 "Watch the games."
 zin_lore.374.d:0 "Nan's warlord holds games. The winners join his guard, and the losers are given a meal and a place on the benches. The crowd is large, and the warlord is said to be paying more attention to the losers' faces than to the winners'."
 zin_lore.374.t:0 "The Warlord's Games"
 zin_lore.375.a:0 "Vote."
 zin_lore.375.d:0 "Mora's lake towns send their speakers to the assembly. It argues for a month about fishing rights, and ends by passing the same rule it passed last year, with a clause added about nets."
 zin_lore.375.t:0 "The Lake Assembly"
 zin_lore.376.a:0 "Let them close them."
 zin_lore.376.d:0 "Avalon's revolutionaries celebrate the anniversary of the day they threw out their lords, marching through the streets under red banners, and the neighbouring kings close their borders for a day. The marchers consider this the best compliment of the year."
 zin_lore.376.t:0 "Red Banners"
 zin_lore.377.a:0 "Store it."
 zin_lore.377.d:0 "The rice terraces of Howan gave a double harvest, and there was not enough room in the granaries to hold it. The village headmen stood about the heaped sacks like men who have been given too much change."
 zin_lore.377.t:0 "The Rice Harvest"
 zin_lore.378.a:0 "We won."
 zin_lore.378.d:0 "The islands race their canoes across the strait. Both claim the victory, and both can show the judge a witness who saw the other's canoe turn back. The judge has been rowing between the islands for two days with a cup that neither will take."
 zin_lore.378.t:0 "The Canoe Race"
 zin_lore.379.a:0 "Keep the silence."
 zin_lore.379.d:0 "At noon on the longest day the tall folk gather in silence to watch the sun stand still. A child coughs, and the whole assembly turns its head, and then the sun moves on, and nobody is certain which of them it was waiting for."
 zin_lore.379.t:0 "The Noon Festival"
 zin_lore.380.a:0 "Walk with them."
 zin_lore.380.d:0 "Pilgrims walk to the shore of the Sea of Gods to throw flowers on the water. They go in a line, barefoot, with baskets, and they do not speak. The tide carries the flowers a little way out and brings some of them back."
 zin_lore.380.t:0 "Pilgrims to the Sea of Gods"
 zin_lore.4.a:0 "Patience."
 zin_lore.4.d:0 "Behind the storms and the heat of the Ember Lands, the hosts drill where no ship can see. Demon, Dolon and Nezer are sworn to you, and the storm-wall that keeps strangers out has kept your people in for a hundred years.\n\nThe kingdoms of men always divide. Their time is passing, and they have not noticed. They have forgotten Dardan the way a man forgets a wound that has stopped hurting.\n\nYou mean to retake Mirolon, to march north, and to possess the green crystal of the north."
 zin_lore.4.t:0 "The Year 1748"
 zin_lore.400.a:0 "Mourn the King."
 zin_lore.400.d:0 "The markets are hung with black ribbons, and the cloth merchants have never sold so much. In the Great Lake ports the fishermen row out at dawn with a black cloth on the prow, and the harbour bells ring once, very slowly, for a king that few of them could have named at a feast."
 zin_lore.400.t:0 "Black Ribbons in the Market"
 zin_lore.401.a:0 "Sing them."
 zin_lore.401.b:0 "Our court keeps its own hymns."
 zin_lore.401.d:0 "The temples sing new hymns: [zin_loc_deliverer] wears Aenor's crown. The choirs have learned them in a week from copies carried by couriers in grey cloaks, and the old women, who prefer the old ones, sing the new ones a little more slowly."
 zin_lore.401.t:0 "Hymns for the God-King"
 zin_lore.402.a:0 "Sing it again."
 zin_lore.402.d:0 "Bards sing of the war-king who made the peace at the Grey Ford and gave the crown back. They call him the King Without a House, and no bard knows more of him than the verse. The song is short, and the bards say that this is because the man was."
 zin_lore.402.t:0 "Songs of the Grey Ford"
 zin_lore.403.a:0 "Nobody goes in."
 zin_lore.403.d:0 "Traders say that the lord of the silent castle in the north is dead. A warden keeps its gates now, and nobody goes in. The warden is said to be courteous to travellers, and to give them water, and to ask them to go no farther."
 zin_lore.403.t:0 "Silence at the Castle"
 zin_lore.404.a:0 "Open the granaries."
 zin_lore.404.b:0 "Let the market settle it."
 zin_lore.404.d:0 "The price of bread has doubled in a season. The bakers say it is the carters, the carters say it is the millers, and the millers say it is the wars, and nobody who has worked it out has been able to make the sums come to less."
 zin_lore.404.t:0 "Bread Doubles in Price"
 zin_lore.405.a:0 "Sign the best."
 zin_lore.405.d:0 "Every company in the West has a contract now. Some have two. The recruiting-captains of the great houses have taken to waiting outside the tavern doors of the companies' captains, with purses."
 zin_lore.405.t:0 "Swords for Hire"
 zin_lore.406.a:0 "Bring them inland."
 zin_lore.406.d:0 "The fishing villages of the north coast are empty. The fishermen were right, and have gone inland with their nets in carts, and the cats of the villages sit on the doorsteps and look at the sea."
 zin_lore.406.t:0 "Empty Villages on the Coast"
 zin_lore.407.a:0 "Punish the breakers."
 zin_lore.407.b:0 "Leave the images broken."
 zin_lore.407.d:0 "In the night someone broke the Deliverer's image at the temple door. In the morning the poor still came for bread, and found it, and stood a little apart from the broken stone as they ate, as at the grave of a relative they have only now learned they disliked."
 zin_lore.407.t:0 "Broken Images"
 zin_lore.408.a:0 "Watch the south."
 zin_lore.408.d:0 "Sailors say the storms over the south are thinner this season, and that a ship can stand in to the old coast for half a day before the sky closes. Nobody knows what it means. The masters have begun to chart the gaps."
 zin_lore.408.t:0 "The Storms Thin"
 zin_lore.409.a:0 "Hang them."
 zin_lore.409.d:0 "The towers of the south hang white banners for the King of Gala. Nobody in the sun-realms has been asked to, and every tower has done it on the same morning. Old men who were children when he last came north stand in the squares with their hats in their hands."
 zin_lore.409.t:0 "White Banners in the South"
 zin_lore.410.a:0 "Help them home."
 zin_lore.410.d:0 "The roads to the Great Lake are full again, this time going home. Families walk with their bedding on their backs, past the villages where they used to buy bread, and stop to look at the doors that are still standing."
 zin_lore.410.t:0 "Refugees Come Home"
 zin_lore.411.a:0 "It is."
 zin_lore.411.a_tip:0 "Aenor will think well of us."
 zin_lore.411.b:0 "We will see."
 zin_lore.411.d:0 "Bells ring in Parim for a king of Aen's line. In our own streets, people argue whether that is good news, and the arguments run along the oldest lines of the quarrel: those who say that a king is a king, and those who say that Aen's line has not been good for the West."
 zin_lore.411.t:0 "Bells for a New King"
 zin_lore.412.a:0 "It chose."
 zin_lore.412.d:0 "A dragon has left the high roosts with a rider. The roost wardens say it went of its own will, and that no one asked it to, and they have the claw-marks on the ledge to show it. The elder of the roosts has gone out to the ledge and is sitting there alone."
 zin_lore.412.t:0 "A Dragon Leaves the Roosts"
 zin_lore.413.a:0 "Man our side."
 zin_lore.413.d:0 "Half the Wall's watchtowers are empty. The garrisons went to Parim, or east, or home. The gatehouse is manned by an old gate-captain and his grandson, who is learning to light the beacons."
 zin_lore.413.t:0 "The Wall Without Its Watch"
 zin_lore.414.a:0 "Count the silver."
 zin_lore.414.d:0 "Every hull that can float has been hired for the western crossing. Our harbours are empty and our purses full. The chart-masters have been paid to draw the central sea three times over, and each time to a different scale."
 zin_lore.414.t:0 "Ships in Every Harbour"
 zin_lore.5.a:0 "…"
 zin_lore.5.d:0 "The black north is silent. The dead walk the wastes, and the islands of the Kusmeel lie dark. The tide comes in and goes out. Nothing on the shore looks at it.\n\nNo one in Aoaz can say what the north believes.\n\nIt grows, very slowly."
 zin_lore.5.t:0 "The Year 1748"
 zin_lore.6.a:0 "The woods endure."
 zin_lore.6.d:0 "The oldest and most peaceful of the elven realms is ruled by its council of houses, which has not once in a thousand years taken a decision in less than a season. The Great Wall keeps the kings of men on their side of it, and the dragons of Dragon Mountain on theirs.\n\nMen break alliances. The Elven Refusal still stands. The Wall keeps the peace, and the peace is worth keeping.\n\nThe woods mean to stay apart, to keep the dragons safe, and to keep the Wall a customs line and not a border of war."
 zin_lore.6.t:0 "The Year 1748"
 zin_lore.7.a:0 "Memory is a duty."
 zin_lore.7.d:0 "King Lorien, who fought at Dardan, keeps his ancient court among the realms of the Lands of the Sun. The young ones come to hear him speak of it on feast days, and go away quieter than they came.\n\nHuman kings turn common victories into dominion, he has said. Still, Aoaz's fate is not a matter that a king may stop caring about because he is tired.\n\nGala means to keep its memory, and its distance."
 zin_lore.7.t:0 "The Year 1748"
 zin_lore.8.a:0 "The winter is long."
 zin_lore.8.d:0 "The Winter Crown rules the frozen interior and the western ports. Horidor stands with it in the Northern Accord; Isengard stands against it, and has stood against it since the year Coldor's first king was crowned.\n\nIsengard is the enemy. The Cold Lands are a world of their own, and the rest of Aoaz is a rumour that comes in through the harbours with the grain.\n\nYou mean to bring Isengard to heel and to keep the Accord."
 zin_lore.8.t:0 "The Year 1748"
 zin_lore.9.a:0 "The roads are ours."
 zin_lore.9.d:0 "Noris holds the Salt Road and the desert, and leads the Noris Treaty with Gondolin. The camel-riders of the dunes pay their tithe in salt, and the caravan-masters of Furvior keep their ledgers in three scripts.\n\nStabilo is the rival that matters. Aenor is a distant market, rich and badly governed, and the only thing the Deliverer's friends have ever asked of Noris is hospitality.\n\nYou mean to own the caravan roads."
 zin_lore.9.t:0 "The Year 1748"
