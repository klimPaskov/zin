l_english:
 zin_shared_delving_holds_axes_and_hammers:0 "Axes and Hammers"
 zin_shared_delving_holds_axes_and_hammers_desc:0 "A dwarf fights with the axe and the hammer, never with the bow, and the hold's companies drill in the old way in the long hall below the gate."
 zin_shared_delving_holds_bombards_for_one_court:0 "Bombards for One Court"
 zin_shared_delving_holds_bombards_for_one_court_desc:0 "Gromkerm will sell its siege bombards to one western court alone, which makes that court everyone else's worry, and offers them to the clan kingdom of Gunwyn."
 zin_shared_delving_holds_bombards_for_sonargur:0 "Bombards for Sonargur"
 zin_shared_delving_holds_bombards_for_sonargur_desc:0 "The High Crown's royal ships have carried Hrakbrund's bombards since 4A 1612, and the lord offers Sonargur a new casting at the old price, with powder enough to fire it."
 zin_shared_delving_holds_bowshot_rule:0 "The Bowshot Rule"
 zin_shared_delving_holds_bowshot_rule_desc:0 "No company of armed men may come within a bowshot of the outer gate of [ROOT.GetName], and the gate-forts have never yet had to remind anyone twice."
 zin_shared_delving_holds_bury_the_grudge:0 "Bury the Grudge"
 zin_shared_delving_holds_bury_the_grudge_desc:0 "Some of the younger clans say a grudge older than the Fourth Age has been fed long enough. The hall lets them be heard, and the grumbling in the galleries is loud."
 zin_shared_delving_holds_charter_of_the_gate:0 "The Charter of the Gate"
 zin_shared_delving_holds_charter_of_the_gate_desc:0 "A charter written in the hold's runes and the Common Speech lets men live and trade inside the outer gate, and the wardens take their seats in the hall as speakers for the gate-folk."
 zin_shared_delving_holds_clan_council:0 "The Council of Clans"
 zin_shared_delving_holds_clan_council_2:0 "The Elders in the Deep"
 zin_shared_delving_holds_clan_council_2_desc:0 "The elders sit below the oldest galleries, where the stone is warm and the arguments are long, and a ruling made there is obeyed in every hall of [ROOT.GetName]."
 zin_shared_delving_holds_clan_council_desc:0 "The clan-elders of [ROOT.GetName] meet in the deep hall as their grandfathers did, and nothing is decided until every clan has grumbled about it."
 zin_shared_delving_holds_council_of_clans:0 "The Council of Clans"
 zin_shared_delving_holds_council_of_clans_desc:0 "The elders keep the hall as their grandfathers kept it: slowly, by long argument, and with every clan holding a key to the treasury."
 zin_shared_delving_holds_crown_iron:0 "Iron for the Crown"
 zin_shared_delving_holds_crown_iron_desc:0 "The iron of Lunhrim goes to Parim's armouries first and to the Kingson forts second, and the crown pays by the honest pound."
 zin_shared_delving_holds_crown_iron_paid:0 "Iron for the Crown"
 zin_shared_delving_holds_delve_deeper:0 "Delve Deeper"
 zin_shared_delving_holds_delve_deeper_desc:0 "The oldest delving lines say there is better iron below the galleries their grandfathers dug, and the council has finally agreed to pay for the digging."
 zin_shared_delving_holds_dwarves_come_down:0 "The Dwarves Come Down"
 zin_shared_delving_holds_dwarves_come_down_desc:0 "As in the days of the Order, the dwarves of the High Mountains have come down the valleys under the Hill Pact, and the hill crowns are glad to see their banners."
 zin_shared_delving_holds_elders_in_the_deep:0 "The Elders in the Deep"
 zin_shared_delving_holds_elders_in_the_deep_desc:0 "The council moves its sittings below the oldest galleries, where no message from the gate can hurry it, and the clans find that they like being asked."
 zin_shared_delving_holds_fire_for_the_crossing:0 "Fire for the Crossing"
 zin_shared_delving_holds_fire_for_the_crossing_desc:0 "The courts of the West mean to cross the sea, and the lord of the deepest hall offers to sell them fire for the siege lines of the Middle Lands, which Parim has rarely had to face."
 zin_shared_delving_holds_fire_for_whoever_pays:0 "Fire for Whoever Pays"
 zin_shared_delving_holds_fire_for_whoever_pays_desc:0 "The fire-hold sells powder-pieces to the guild workshops of Kradlon and the companies of Buldor, who have paid for them before and complain about the price every time."
 zin_shared_delving_holds_fire_hold:0 "The Fire-Hold"
 zin_shared_delving_holds_fire_hold_2:0 "The Fire-Hold Endures"
 zin_shared_delving_holds_fire_hold_2_desc:0 "Whatever the courts of the West decided, the fire-hold is still the fire-hold, and the saltpetre of the Dusty Mountains still comes up its roads."
 zin_shared_delving_holds_fire_hold_desc:0 "Hrennost is named for the forge where the West first made black powder, and its smiths still keep the best of the recipe in their heads."
 zin_shared_delving_holds_forge_lord_rule:0 "The Rule of the Forge-Lord"
 zin_shared_delving_holds_forge_lord_rule_desc:0 "The greatest of the forge-masters takes the lord's seat and the council's keys together, and [ROOT.GetName] is ruled from the forge-hall by one voice that does not wait for the elders."
 zin_shared_delving_holds_forge_lord_rule_spirit:0 "The Rule of the Forge-Lord"
 zin_shared_delving_holds_forge_lord_rule_spirit_desc:0 "One lord rules [ROOT.GetName] from the forge-hall, and the clans that grumbled at it have found that the forges answer quicker than the council ever did."
 zin_shared_delving_holds_forge_masters:0 "The Forge-Masters' Voice"
 zin_shared_delving_holds_forge_masters_desc:0 "The masters of the great forges sit in the council now, and they speak loudest about iron, powder and the price of both."
 zin_shared_delving_holds_gate_charter:0 "The Charter of the Gate"
 zin_shared_delving_holds_gate_charter_desc:0 "A written charter lets merchants of men live and trade inside the outer gate of [ROOT.GetName], under the hold's law and the wardens' eye."
 zin_shared_delving_holds_gate_forts_of_the_kulolo:0 "The Gate-Forts of the Kulolo"
 zin_shared_delving_holds_gate_forts_of_the_kulolo_desc:0 "The gate-forts are pushed down the slope to the river, with their own armoury and a garrison that drills every morning in full view of the boats."
 zin_shared_delving_holds_gate_wardens:0 "The Wardens of the Gate"
 zin_shared_delving_holds_gate_wardens_desc:0 "The wardens who deal with men at the outer gate have been given seats in the hall, and they bring the gossip of half the markets of Aoaz with them."
 zin_shared_delving_holds_gold_and_gems:0 "Gold and Gems"
 zin_shared_delving_holds_gold_and_gems_desc:0 "The deep seams of [ROOT.GetName] give gold and stones that the jewellers of every court bid for, and the hall has decided to let them bid higher."
 zin_shared_delving_holds_grudge_eased:0 "An Old Grudge Eased"
 zin_shared_delving_holds_hill_pact:0 "The Hill Pact"
 zin_shared_delving_holds_hill_pact_spirit:0 "The Hill Pact"
 zin_shared_delving_holds_hill_pact_spirit_desc:0 "The dwarves of the High Mountains and the three hill crowns of Heodwa are sworn to each other's defence, as they have been since the raiders of the Order came up the valleys."
 zin_shared_delving_holds_hold_marches:0 "The Hold Marches"
 zin_shared_delving_holds_hold_marches_desc:0 "The axe-companies of [ROOT.GetName] have come down from the mountain, which the old dwarves say happens once in an age and never quietly."
 zin_shared_delving_holds_hrennost_the_fire_hold:0 "Hrennost, the Fire-Hold"
 zin_shared_delving_holds_hrennost_the_fire_hold_desc:0 "The smiths of Hrennost found their own way to black powder in 4A 1561, out of the Dusty Mountains' saltpetre, and the deep hall took its name from the forge where they did it."
 zin_shared_delving_holds_hrunost_the_old_hold:0 "Hrunost, the Old Hold"
 zin_shared_delving_holds_hrunost_the_old_hold_desc:0 "The Kunerm gate-wardens have kept the doors of Hrunost since 1A 210, and they keep the names of everyone who ever wronged the hold as carefully as they keep its gold."
 zin_shared_delving_holds_iron_charter:0 "The Iron Charter"
 zin_shared_delving_holds_iron_charter_desc:0 "Iron for the crown, and no elf on the hold's roads: the clans swore it in 4A 3, and they hold the crown to its half as strictly as they keep their own."
 zin_shared_delving_holds_iron_down_the_kulolo:0 "Iron Down the Kulolo"
 zin_shared_delving_holds_iron_down_the_kulolo_desc:0 "New quays are built at the foot of the gate so that the iron boats can load in a day, and the guild towns downriver find the price fixed and the supply generous."
 zin_shared_delving_holds_iron_for_the_crown:0 "Iron for the Crown"
 zin_shared_delving_holds_iron_for_the_crown_desc:0 "The clans send the year's iron to Parim's armouries in full and on time, and the Lord of the Deep Hall reminds the crown that it has never once been short."
 zin_shared_delving_holds_iron_refused:0 "Iron Withheld"
 zin_shared_delving_holds_iron_withheld:0 "Iron Withheld"
 zin_shared_delving_holds_iron_withheld_desc:0 "The clans do not hold the ruler in Parim to be lawful, and the Lord of the Deep Hall closes the Western Gate to the crown's buyers until one is."
 zin_shared_delving_holds_iron_withheld_spirit:0 "Iron Withheld"
 zin_shared_delving_holds_iron_withheld_spirit_desc:0 "The clans will not sell a pound of iron to a ruler in Parim they do not hold to be lawful, and the forges work for the hold alone until they do."
 zin_shared_delving_holds_keep_the_secret:0 "Keep the Secret"
 zin_shared_delving_holds_keep_the_secret_desc:0 "The powder stays in the mountain, and the bombards it feeds stand in the hold's own gate-forts, where no crown of men can borrow them."
 zin_shared_delving_holds_kingson_road:0 "The Kingson Road"
 zin_shared_delving_holds_kulolo_contract:0 "The Kulolo Contract"
 zin_shared_delving_holds_lamp_truce:0 "The Lamp Truce"
 zin_shared_delving_holds_leaf_and_cheese:0 "Leaf and Cheese"
 zin_shared_delving_holds_leaf_and_cheese_desc:0 "The small folk pay for the shut passes in hearth-leaf and good cheese, and the halls of Brundahrim have grown very fond of both."
 zin_shared_delving_holds_looting_remembered:0 "The Looting Remembered"
 zin_shared_delving_holds_lords_of_the_great_wall:0 "Lords of the Great Wall"
 zin_shared_delving_holds_lords_of_the_great_wall_desc:0 "From the Organ cliffs to the Kingson ring the range is Kunhrim's country, and every crown that wants to cross it, or to fight across it, must first come to the Western Gate."
 zin_shared_delving_holds_lords_of_the_high_mountains:0 "Lords of the High Mountains"
 zin_shared_delving_holds_lords_of_the_high_mountains_desc:0 "The High Mountains and the Loso heights answer to the White Hall, and every crown of the North has learned to ask Hrakbrund's price before it asks Hrakbrund's help."
 zin_shared_delving_holds_lords_of_the_range:0 "Lords of the Great Wall"
 zin_shared_delving_holds_lords_of_the_range_desc:0 "From the Organ cliffs to the Kingson ring the range is the clans' own country, and every pass road that crosses it does so by their leave."
 zin_shared_delving_holds_no_elf_on_our_roads:0 "No Elf on Our Roads"
 zin_shared_delving_holds_no_elf_on_our_roads_desc:0 "The hall repeats the old rule in front of the whole hold: no elf walks the roads of [ROOT.GetName], whatever letters he carries and whoever sent him."
 zin_shared_delving_holds_no_fire_beyond_the_sea:0 "No Fire Beyond the Sea"
 zin_shared_delving_holds_no_fire_beyond_the_sea_desc:0 "Whatever the courts of men decide to do across the water, the fire-hold will not sell them the means to do it, and the West can fight its old quarrels with what it already has."
 zin_shared_delving_holds_old_grudge:0 "The Old Grudge"
 zin_shared_delving_holds_old_hold_unbroken_spirit:0 "The Old Hold Unbroken"
 zin_shared_delving_holds_old_hold_unbroken_spirit_desc:0 "Hrunost has kept its doors since men first knocked on them, and it means to keep them a while longer."
 zin_shared_delving_holds_one_voice_at_the_gate:0 "One Voice at the Gate"
 zin_shared_delving_holds_one_voice_at_the_gate_desc:0 "However the quarrel in the hall ended, [ROOT.GetName] now answers men with one voice, and the factors at the gate no longer have to guess whose word will hold."
 zin_shared_delving_holds_our_own_mountains:0 "Our Own Mountains"
 zin_shared_delving_holds_our_own_mountains_desc:0 "The lord lets the pact lapse with courtesy and good gifts. The High Mountains have defended themselves since before men came north, and they can go on doing it."
 zin_shared_delving_holds_own_mountains:0 "Our Own Mountains"
 zin_shared_delving_holds_own_mountains_desc:0 "The White Hall keeps its own counsel, and the snows above it are all the pact it needs."
 zin_shared_delving_holds_packmen_of_the_notch:0 "Packmen of the Notch"
 zin_shared_delving_holds_packmen_of_the_notch_desc:0 "Kunhrim's packmen carry iron and salt over the Lunhrim Notch on foot from late spring to the first snow, and the hold gives them waystations cut into the saddle."
 zin_shared_delving_holds_powder_bought:0 "Powder Bought and Paid For"
 zin_shared_delving_holds_powder_for_the_pass_forts:0 "Powder for the Pass Forts"
 zin_shared_delving_holds_powder_for_the_pass_forts_desc:0 "The Kingson Pass forts have stood on Kunhrim's powder since the Powder Compact of 4A 1612, and the clans offer the Lord of the Gate a fresh store and new bombards to go with it."
 zin_shared_delving_holds_powder_kept:0 "The Powder Kept"
 zin_shared_delving_holds_powder_kept_2:0 "The Great Bombards of the Hold"
 zin_shared_delving_holds_powder_kept_2_desc:0 "The great bombards stand in the gate-forts with their crews beside them, and no host of men has yet found a way up the mountain that they do not cover."
 zin_shared_delving_holds_powder_kept_desc:0 "The making of black powder stays inside the hold, and the bombards of [ROOT.GetName] fire for its own walls and nobody else's."
 zin_shared_delving_holds_powder_trade:0 "The Powder Trade"
 zin_shared_delving_holds_powder_trade_2:0 "Powder for the Crowns of Men"
 zin_shared_delving_holds_powder_trade_2_desc:0 "Half the siege lines of men are fed from the forges of [ROOT.GetName], and every crown that buys knows whom to thank and whom not to offend."
 zin_shared_delving_holds_powder_trade_desc:0 "Casks of black powder go down the mountain under oilcloth, and silver and favours come back up."
 zin_shared_delving_holds_ronbo_oath:0 "The Ronbo Oath"
 zin_shared_delving_holds_saltpetre_of_the_dusty_mountains:0 "Saltpetre of the Dusty Mountains"
 zin_shared_delving_holds_saltpetre_of_the_dusty_mountains_desc:0 "The dry Dusty Mountains are the only place in the West where saltpetre lies thick on the cave floors, and the hold digs new workings to take it."
 zin_shared_delving_holds_sell_the_powder:0 "Sell the Powder"
 zin_shared_delving_holds_sell_the_powder_desc:0 "Black powder is worth more than gold to a crown with a wall to break, and [ROOT.GetName] means to be paid for it, though it will choose its buyers with care."
 zin_shared_delving_holds_sell_to_all_comers:0 "Sell to All Comers"
 zin_shared_delving_holds_sell_to_all_comers_desc:0 "Iron, gold and worked stone go to anyone who can pay at the gate, and the wardens are told to ask a buyer's purse before they ask his name."
 zin_shared_delving_holds_sworn_buyers_only:0 "Sworn Buyers Only"
 zin_shared_delving_holds_sworn_buyers_only_desc:0 "The hold sells only to buyers who have sworn at the gate to keep their bargains, which makes for fewer customers and much less trouble."
 zin_shared_delving_holds_the_bombard_foundries:0 "The Bombard Foundries"
 zin_shared_delving_holds_the_bombard_foundries_desc:0 "Founders cast bombards in clay moulds sunk in the foundry floor, each one longer than a cart and named by the clan that paid for it."
 zin_shared_delving_holds_the_bowshot_rule:0 "The Bowshot Rule"
 zin_shared_delving_holds_the_bowshot_rule_desc:0 "No company of armed men may come within a bowshot of the Outer Gate, a rule kept since the gate reopened in 2A 1795, and the hold raises new forts to make sure of it."
 zin_shared_delving_holds_the_charter_reopened:0 "The Charter Reopened"
 zin_shared_delving_holds_the_charter_reopened_desc:0 "The clans would like the crown to remember that a charter is a bargain between two parties, and they send a speaker to Parim with a list of what they would change in theirs."
 zin_shared_delving_holds_the_clan_moot:0 "The Clan Moot"
 zin_shared_delving_holds_the_clan_moot_desc:0 "Every clan of [ROOT.GetName] sends its elders down to the deep hall, and for once they have come to argue about the future instead of the past. The question is who will speak for the hold when men come asking."
 zin_shared_delving_holds_the_deep_hall:0 "The Deep Hall Speaks"
 zin_shared_delving_holds_the_deep_hall_desc:0 "The lord of the deepest hall has called the clans together, as he does when the world above starts to knock louder at the gate. [ROOT.GetName] has iron, gold and a secret that the crowns of men would pay dearly for, and it must decide what to do with all three."
 zin_shared_delving_holds_the_deep_roads:0 "The Deep Roads"
 zin_shared_delving_holds_the_deep_roads_desc:0 "Old tunnels between the halls are widened for carts and lit with lamps, so that iron from the far galleries reaches the gate in days instead of weeks."
 zin_shared_delving_holds_the_dwarves_come_down:0 "The Dwarves Come Down"
 zin_shared_delving_holds_the_dwarves_come_down_desc:0 "War has reached the hills, and the White Hall answers as it answered the Order: the axe-companies come down the valleys to stand beside the hill crowns."
 zin_shared_delving_holds_the_fire_hold_endures:0 "The Fire-Hold Endures"
 zin_shared_delving_holds_the_fire_hold_endures_desc:0 "Whatever the West has done with its powder, Hrennost is still the forge where it was first made, and the saltpetre still comes up its roads."
 zin_shared_delving_holds_the_forge_masters:0 "The Forge-Masters"
 zin_shared_delving_holds_the_forge_masters_desc:0 "The masters of the great forges make the powder and cast the bombards that the whole world wants, and they think it is time the hall listened to them before it listened to old men."
 zin_shared_delving_holds_the_gate_forts:0 "The Gate-Forts"
 zin_shared_delving_holds_the_gate_forts_desc:0 "The forts above the outer gate are cut deeper into the rock and given new embrasures, so that the only road up the mountain can be swept from three sides."
 zin_shared_delving_holds_the_gate_market:0 "The Gate Market"
 zin_shared_delving_holds_the_gate_market_desc:0 "New halls are cut beside the outer gate for the market, with stalls for the factors of men and stables for their mules."
 zin_shared_delving_holds_the_gate_wardens:0 "The Wardens of the Gate"
 zin_shared_delving_holds_the_gate_wardens_desc:0 "The wardens of the outer gate know men better than any dwarf alive, and they argue that a hold which sells to the world had better understand it."
 zin_shared_delving_holds_the_great_bombards:0 "The Great Bombards"
 zin_shared_delving_holds_the_great_bombards_desc:0 "The founders cast the greatest bombards the hold has ever made, and how [ROOT.GetName] chose to use its powder decides where they will stand."
 zin_shared_delving_holds_the_great_forges:0 "The Great Forges"
 zin_shared_delving_holds_the_great_forges_desc:0 "The forge-halls are doubled in size and given new bellows, and the smiths of [ROOT.GetName] turn out mail and axe-heads faster than the hold can find hands to carry them."
 zin_shared_delving_holds_the_grudge_answered:0 "The Grudge Answered"
 zin_shared_delving_holds_the_grudge_answered_desc:0 "Word of the hall's choice has gone over the mountains, and the gate-wardens are told that sooner or later someone will come to test it."
 zin_shared_delving_holds_the_halls_below_the_halls:0 "The Halls Below the Halls"
 zin_shared_delving_holds_the_halls_below_the_halls_desc:0 "Under the deepest hall the delvers break into a cavern larger than the hall itself, and the clans begin the work of a hundred years: a second hold beneath the first."
 zin_shared_delving_holds_the_hammer_companies:0 "The Hammer Companies"
 zin_shared_delving_holds_the_hammer_companies_desc:0 "Every clan raises a company of hammer-bearers in heavy mail, and the armouries of [ROOT.GetName] are emptied to arm them."
 zin_shared_delving_holds_the_high_passes_opened:0 "The High Passes Opened"
 zin_shared_delving_holds_the_high_passes_opened_desc:0 "The factors would like to sell iron over the high passes as well as at the Outer Gate, and the lord, against the advice of half his hall, opens them."
 zin_shared_delving_holds_the_hill_pact_renewed:0 "The Hill Pact Renewed"
 zin_shared_delving_holds_the_hill_pact_renewed_desc:0 "The Hill Pact of 3A 806 binds the White Hall and the three hill crowns of Heodwa to each other's defence, and the lord rides down to Pand to swear it again on the old stone."
 zin_shared_delving_holds_the_hold_marches:0 "The Hold Marches"
 zin_shared_delving_holds_the_hold_marches_desc:0 "The old dwarves say the hold comes down from the mountain once in an age. [ROOT.GetName] opens the gate-forts, and the axe-companies march out to fight under the open sky."
 zin_shared_delving_holds_the_iron_charter:0 "The Iron Charter"
 zin_shared_delving_holds_the_iron_charter_desc:0 "The clans of Lunhrim took the Charters of Parim in 4A 3 under the Iron Charter: iron for the crown, and no elf on their roads. Kunhrim keeps its half of that bargain to the letter, and it watches the crown's half just as closely."
 zin_shared_delving_holds_the_iron_seams:0 "The Iron Seams"
 zin_shared_delving_holds_the_iron_seams_desc:0 "The new galleries strike a seam of iron as thick as a man is tall, and the forges of [ROOT.GetName] have more ore than they can smelt."
 zin_shared_delving_holds_the_kingson_road:0 "The Kingson Road"
 zin_shared_delving_holds_the_kingson_road_desc:0 "The road down from Hrakkerm to the Kingson Vale is widened for the iron carts, and the vale-folk who drive them stop calling the dwarves strangers."
 zin_shared_delving_holds_the_kulolo_contract_renewed:0 "The Kulolo Contract Renewed"
 zin_shared_delving_holds_the_kulolo_contract_renewed_desc:0 "The contract of 4A 1530 sends the hold's iron down the Kulolo through Saopon's guilds at a fixed price, and the lord renews it without forgiving anybody."
 zin_shared_delving_holds_the_lamp_truce:0 "The Lamp Truce"
 zin_shared_delving_holds_the_lamp_truce_desc:0 "The Lamp Truce of 4A 96 has kept the goblins of Burrikkrit out of the dwarves' galleries, broken only once in the Tunnel Fight, and the hall sends a lamp-keeper to the hobgoblin king to swear it again."
 zin_shared_delving_holds_the_looting_remembered:0 "The Looting Remembered"
 zin_shared_delving_holds_the_looting_remembered_desc:0 "Companies hired by Saopon's guilds looted the gate in 2A 1712, and the lord can recite the name of every guild master who paid them, which he does on feast days."
 zin_shared_delving_holds_the_loso_heights:0 "The Loso Heights"
 zin_shared_delving_holds_the_loso_heights_desc:0 "Watch-forts go up on the Loso heights, where the snow lies all year and a lookout can see the strait on a clear morning."
 zin_shared_delving_holds_the_names_of_the_guild_masters:0 "The Names of the Guild Masters"
 zin_shared_delving_holds_the_names_of_the_guild_masters_desc:0 "A dwarf of Hrunost goes down the Kulolo to Saopon with the list of names and the sum the hold reckons it is owed, and waits in the guildhall for an answer."
 zin_shared_delving_holds_the_nuatax_road:0 "The Road to Nuatax"
 zin_shared_delving_holds_the_nuatax_road_desc:0 "Dwarf masons cut a road down to the valley of Nuatax, where the hold's companies broke the Order's raiders in 3A 1022, so that they can come down again quickly if they must."
 zin_shared_delving_holds_the_old_grudge:0 "The Old Grudge"
 zin_shared_delving_holds_the_old_grudge_desc:0 "Every dwarf of [ROOT.GetName] grows up knowing that the elves sent no help when the war from within set the peoples against each other, and most of them know it better than their letters."
 zin_shared_delving_holds_the_old_hold_unbroken:0 "The Old Hold Unbroken"
 zin_shared_delving_holds_the_old_hold_unbroken_desc:0 "Hrunost has kept its doors since men first knocked on them, and every court of the West knows by now that it means to keep them."
 zin_shared_delving_holds_the_outer_gate:0 "The Outer Gate"
 zin_shared_delving_holds_the_outer_gate_desc:0 "Men are never let further than the outer gate, but the gate itself is a market town carved into the mountain, and it can be made a good deal bigger."
 zin_shared_delving_holds_the_powder_secret:0 "The Powder Secret"
 zin_shared_delving_holds_the_powder_secret_desc:0 "The powder-masters of [ROOT.GetName] know how to turn saltpetre, charcoal and the yellow crust of the deep caves into black powder, and the hall has to decide what that knowledge is for."
 zin_shared_delving_holds_the_powder_secret_tip_1:0 "The powder-masters are listed in the hall's book, and only the hall decides who may buy what they make."
 zin_shared_delving_holds_the_price_of_the_north:0 "The Price of the North"
 zin_shared_delving_holds_the_price_of_the_north_desc:0 "Sonargur and Parim both send buyers to the High Gate, and the lord has decided that his price will be the same to both, and high."
 zin_shared_delving_holds_the_ronbo_oath_kept:0 "The Ronbo Oath Kept"
 zin_shared_delving_holds_the_ronbo_oath_kept_desc:0 "Since 3A 904 the dwarves have kept the high passes above the small folk's basin shut, and the lord sends word to Luddum that they will stay shut while there is a dwarf in Brundahrim."
 zin_shared_delving_holds_the_white_hall:0 "The White Hall"
 zin_shared_delving_holds_the_white_hall_desc:0 "Ilmahrim, the white hall under the snows, has been ruled by the Ilmord line since men first traded at the High Gate, and the lord means to show the North that the line still knows its business."
 zin_shared_delving_holds_tunnel_fighters:0 "The Tunnel Companies"
 zin_shared_delving_holds_tunnel_fighters_desc:0 "Delvers who know the dark are trained to fight in it, to bring a tunnel down on an enemy and to come up behind him through another."
 zin_shared_delving_holds_white_hall_lords:0 "Lords of the High Mountains"
 zin_shared_delving_holds_white_hall_lords_desc:0 "The High Mountains and the Loso heights answer to the White Hall, and the crowns below have learned to ask its price before they ask its help."
 zin_shared_delving_holds.1.a:0 "The Iron Charter stands as it was sworn."
 zin_shared_delving_holds.1.b:0 "Give the clans a free charter."
 zin_shared_delving_holds.1.d:0 "The Lord of the Deep Hall has sent a speaker to Parim with the Iron Charter in a lead case and a list of what the clans would change in it. He is perfectly polite, and he has brought no iron with him."
 zin_shared_delving_holds.1.t:0 "[FROM.GetName] Asks to Reopen Its Charter"
 zin_shared_delving_holds.2.a:0 "Send the factors home."
 zin_shared_delving_holds.2.b:0 "Pay their price."
 zin_shared_delving_holds.2.d:0 "Dwarf factors of [FROM.GetName] have come with casks under oilcloth and a price written on a slate, and they will not bargain below it. Whoever buys will have powder for the walls and bombards for the siege lines, and will owe the dwarves for both."
 zin_shared_delving_holds.2.t:0 "[FROM.GetName] Offers Black Powder"
 zin_shared_delving_holds.3.a:0 "Turn him away, courteously."
 zin_shared_delving_holds.3.b:0 "Let him in and hear him out."
 zin_shared_delving_holds.3.d:0 "An elven envoy stands at the outer gate in a grey travelling cloak and asks, very courteously, to speak with the lord of the hall. The gate-wardens have not let an elf through in living memory, and they are waiting to be told what to do."
 zin_shared_delving_holds.3.t:0 "An Elf at the Gate"
 zin_shared_delving_holds.4.a:0 "We pay nothing for an old crime."
 zin_shared_delving_holds.4.b:0 "Pay the weregild and be done with it."
 zin_shared_delving_holds.4.d:0 "A dwarf of Hrunost has stood in the guildhall of [ROOT.GetName] and read out the names of every guild master who paid the companies that looted the gate in the Second Age, and then the sum the hold reckons it is owed. He would like an answer before the river freezes."
 zin_shared_delving_holds.4.t:0 "[FROM.GetName] Asks the Price of the Looting"
