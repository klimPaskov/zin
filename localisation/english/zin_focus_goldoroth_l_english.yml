l_english:
 zin_goldoroth_a_forge_for_every_clan:0 "A Forge for Every Clan"
 zin_goldoroth_a_forge_for_every_clan_desc:0 "Each clan is granted a forge of its own and the iron to feed it. Rivalry between smiths improves the metal and lengthens the tales told about it."
 zin_goldoroth_a_price_in_iron:0 "A Price in Iron"
 zin_goldoroth_a_price_in_iron_desc:0 "A thousand weapons are shipped south in sealed wagons. The south sends back its thanks, in a voice nobody in Cocanoor wants to hear again."
 zin_goldoroth_across_the_southern_strait:0 "Across the Southern Strait"
 zin_goldoroth_across_the_southern_strait_desc:0 "Black-sailed ships cross the narrow water in a single night. The Middle Lands have not seen orc banners on their shore in living memory."
 zin_goldoroth_against_the_southern_host:0 "Against the Southern Host"
 zin_goldoroth_against_the_southern_host_desc:0 "Holds that have knelt to the south are named enemies of the Dark, and the black iron host marches against them."
 zin_goldoroth_ally_of_the_south:0 "Ally of the South"
 zin_goldoroth_ally_of_the_south_desc:0 "A pact is sworn in the grey city, between a crown that bows to no one and a master who asks for little. Gold flows north, and the favour is not forgotten."
 zin_goldoroth_ash_rites:0 "The Ash Rites"
 zin_goldoroth_ash_rites_desc:0 "The fire-speakers smear the war-clans' brows with ash and lead them in a slow, grim dance. The clans come out of it calm, and a little ashamed of how calm."
 zin_goldoroth_beyond_the_straits:0 "Beyond the Straits"
 zin_goldoroth_beyond_the_straits_desc:0 "From the walls of Cocanoor the Warking can see the shores of the Middle Lands and the North Lands. When the Last Crowns go to war, old claims on them are dusted off."
 zin_goldoroth_black_iron_crown:0 "The Black Iron Crown"
 zin_goldoroth_black_iron_crown_desc:0 "Cocanoor answers the south in a single sentence: no spirit rules the Dark. Goldoroth will be a crown of its own, or none."
 zin_goldoroth_black_iron_endures:0 "The Black Iron Endures"
 zin_goldoroth_black_iron_endures_desc:0 "The south has fallen silent. Cocanoor stands, its crown unbroken, and the free holds, who stood with it, remember."
 zin_goldoroth_black_iron_endures_spirit:0 "The Black Iron Endures"
 zin_goldoroth_black_iron_endures_spirit_desc:0 "Whatever came out of the south has gone, and the crown of Cocanoor is still on the Warking's head. The orcs do not forget it."
 zin_goldoroth_black_iron_for_sale:0 "Black Iron for Sale"
 zin_goldoroth_black_iron_for_sale_desc:0 "Cocanoor sells black iron to any hold that will pay, and many do. The orcs consider this good business and a fine way to be thanked."
 zin_goldoroth_black_iron_seams:0 "Black Iron Seams"
 zin_goldoroth_black_iron_seams_desc:0 "Scouts find rich seams in the hills around Cocanoor, and miners are sent to dig. The iron comes up dark, heavy and nearly impossible to bend, which is exactly what the smiths want."
 zin_goldoroth_black_iron_throne:0 "The Black Iron Throne"
 zin_goldoroth_black_iron_throne_desc:0 "The Dark Lands have a ruler and a throne, and the orcs who see it from a mile off lower their eyes."
 zin_goldoroth_black_iron_trade:0 "Black Iron for Sale"
 zin_goldoroth_black_iron_trade_desc:0 "Merchants from the free holds come to Cocanoor for black iron, and go home with debts as well as blades."
 zin_goldoroth_black_sail_corsairs:0 "The Black-Sail Corsairs"
 zin_goldoroth_black_sail_corsairs_desc:0 "Rask Black-Sail takes a galley, a crew of cut-throats and a letter from the Warking to say they are not pirates. Everyone agrees it is a very good letter."
 zin_goldoroth_black_sail_shipwrights:0 "Black-Sail Shipwrights"
 zin_goldoroth_black_sail_shipwrights_desc:0 "Orc shipwrights build broad, black-hulled galleys with tarred sails and iron-shod prows. They are not elegant, and they are very hard to sink."
 zin_goldoroth_blood_and_warband:0 "Blood and Warband"
 zin_goldoroth_blood_and_warband_desc:0 "A doctrine is written down for the first time: the war-band is the unit, the chieftain is the captain, and blood is the oath."
 zin_goldoroth_blood_contests:0 "The Blood Contests"
 zin_goldoroth_blood_contests_desc:0 "Disputes between warriors are settled in the ring instead of in the corridors. Fewer knives are drawn in the dark, and the hall is a little louder."
 zin_goldoroth_bordon_question:0 "The Bordon Question"
 zin_goldoroth_bordon_question_desc:0 "Bordon's chief is a careful, tired old orc. The Warking's envoys put the question gently: would he like to be friends with Cocanoor, or merely protected by it?"
 zin_goldoroth_break_the_belonton_oath:0 "Break the Belonton Oath"
 zin_goldoroth_break_the_belonton_oath_desc:0 "Belonton's oath to Dondor is old, but not as old as the fear of Cocanoor. A messenger carries the Warking's offer: leave the Accord, or burn."
 zin_goldoroth_bring_the_defiant_to_heel:0 "Bring the Defiant to Heel"
 zin_goldoroth_bring_the_defiant_to_heel_desc:0 "Holds that have refused the yoke are named enemies, and the host marches against them. Their halls are old, and their walls are weak."
 zin_goldoroth_britags_drill:0 "Warchief Britag's Drill"
 zin_goldoroth_britags_drill_desc:0 "Britag drills the war-clans in the mud of Cocanoor's courtyard, shouting. The orcs complain loudly and march better than they ever have."
 zin_goldoroth_britags_drill_spirit:0 "Britag's Drill"
 zin_goldoroth_britags_drill_spirit_desc:0 "The war-clans march in step now, and complain about it loudly. Britag takes both as praise."
 zin_goldoroth_burn_the_landings:0 "Burn the Landings"
 zin_goldoroth_burn_the_landings_desc:0 "Every landing-place on the Dark Shore is ringed with forts, fire-pits and watchtowers. If the dead want the shore, they will have to cross the flame."
 zin_goldoroth_charts_of_the_dark_sea:0 "Charts of the Dark Sea"
 zin_goldoroth_charts_of_the_dark_sea_desc:0 "Captured charts, merchants' logs and fishermen's rumours are copied and corrected. The chart-room in Cocanoor knows every reef on the northern coast."
 zin_goldoroth_chiefs_at_cocanoor:0 "Chiefs at Cocanoor"
 zin_goldoroth_chiefs_at_cocanoor_desc:0 "The chiefs of the free holds are invited to a feast in the black hall. No one is required to agree to anything, and everyone knows that an invitation can be refused only once."
 zin_goldoroth_chiefs_keep_their_halls:0 "Chiefs Keep Their Halls"
 zin_goldoroth_chiefs_keep_their_halls_desc:0 "Cocanoor lets the chiefs keep their halls, their fires and their quarrels, and asks only for tribute and spears. The holds find the yoke bearable, and sometimes almost welcome."
 zin_goldoroth_clan_council:0 "The Clan Council"
 zin_goldoroth_clan_council_desc:0 "Each clan has a seat and a veto. Nothing happens quickly, and nothing happens without leave."
 zin_goldoroth_clan_forges:0 "A Forge for Every Clan"
 zin_goldoroth_clan_forges_desc:0 "Each clan has its own forge and its own pride in it. They compete to make the best blade, and sometimes to break the other clans'."
 zin_goldoroth_clans_rule_together:0 "The Clans Rule Together"
 zin_goldoroth_clans_rule_together_desc:0 "The moot is made a council: each clan has a seat, a voice and a veto. The Warking becomes first among equals, and has to be persuaded like anyone else."
 zin_goldoroth_clashes_on_the_march:0 "Clashes on the March"
 zin_goldoroth_clashes_on_the_march_desc:0 "The tension on the border is a rope pulled tight. A war-band crosses the line, a patrol answers and the dead lie on the frontier before anyone has sent a letter."
 zin_goldoroth_custom_of_the_blood_price:0 "The Custom of the Blood-Price"
 zin_goldoroth_custom_of_the_blood_price_desc:0 "When a raid goes wrong, a price in iron or livestock is paid to settle the dead. The old way keeps blood from becoming war."
 zin_goldoroth_dark_lands_stand_alone:0 "The Dark Lands Stand Alone"
 zin_goldoroth_dark_lands_stand_alone_desc:0 "A host marches from the south. The free holds of the Dark Lands, orc and troll alike, raise their banners beside Cocanoor's. It is a short list of friends, and the Warking is glad of every name on it."
 zin_goldoroth_dark_sea_charts:0 "Charts of the Dark Sea"
 zin_goldoroth_dark_sea_charts_desc:0 "The chart-room of Cocanoor holds every reef and current from the northern straits to the southern. Captains who steal them are rewarded."
 zin_goldoroth_dark_sea_won:0 "The Dark Sea Is Ours"
 zin_goldoroth_dark_sea_won_desc:0 "The Sea of Darkness belongs to Cocanoor. Merchants pay for the privilege of passing, and they pay gladly."
 zin_goldoroth_dead_on_the_dark_shore:0 "The Dead on the Dark Shore"
 zin_goldoroth_dead_on_the_dark_shore_desc:0 "Black ships come out of the northern fog with decks full of silent shapes. The orcs of the shore watch them land and learn that the dead do not stay down."
 zin_goldoroth_dreson_question:0 "The Dreson Question"
 zin_goldoroth_dreson_question_desc:0 "Dreson sits on the road between Cocanoor and the sea. Its chief sees a good deal of traffic and keeps an even better ledger."
 zin_goldoroth_dulundur_question:0 "The Dulundur Question"
 zin_goldoroth_dulundur_question_desc:0 "Dulundur is proud and poor. Cocanoor offers it iron and a place at the feast, and watches to see how long its pride will last."
 zin_goldoroth_envoys_to_nafeher:0 "Envoys to Nafeher"
 zin_goldoroth_envoys_to_nafeher_desc:0 "Cocanoor sends its own envoys to the grey city where Volgan sits. They return with fewer men than they left with and a promise they cannot read."
 zin_goldoroth_every_hold_a_hearth:0 "Every Hold a Hearth"
 zin_goldoroth_every_hold_a_hearth_desc:0 "The old holds are made provinces of the one kingdom, their chiefs wardens, their halls forts. The Warking promises a fire in every hall and keeps the promise in his own way."
 zin_goldoroth_eyes_in_notbuton:0 "Eyes in Notbuton"
 zin_goldoroth_eyes_in_notbuton_desc:0 "Goldoroth's agents sit in Dondor's seat, drink in its taverns and write long letters home. Notbuton's people suspect nothing, or pretend not to."
 zin_goldoroth_eyes_in_notbuton_spirit:0 "Eyes in Notbuton"
 zin_goldoroth_eyes_in_notbuton_spirit_desc:0 "Goldoroth's agents drink in Dondor's taverns and write long reports. Notbuton is the best-read city in the Dark Lands, for all the wrong reasons."
 zin_goldoroth_eyes_on_the_south:0 "Eyes on the South"
 zin_goldoroth_eyes_on_the_south_desc:0 "Scouts are posted in the southern hills to watch the roads that lead out of the Ember Lands. They bring back what they see, and what they see is troubling."
 zin_goldoroth_eyes_on_the_south_spirit:0 "Eyes on the South"
 zin_goldoroth_eyes_on_the_south_spirit_desc:0 "Scouts in the southern hills watch the roads out of the Ember Lands. Their reports arrive late at night and are read before breakfast."
 zin_goldoroth_fire_against_the_dead:0 "Fire Breaks Their Shapes"
 zin_goldoroth_fire_against_the_dead_desc:0 "Burning pitch and flaming brands scatter the dead, if only for a time. The orcs have learned that time is worth buying."
 zin_goldoroth_fire_breaks_their_shapes:0 "Fire Breaks Their Shapes"
 zin_goldoroth_fire_breaks_their_shapes_desc:0 "Orc smiths pour burning pitch over the fallen, and the shapes break apart in the flames. They gather again; but it buys time."
 zin_goldoroth_fire_in_the_blood:0 "Fire in the Blood"
 zin_goldoroth_fire_in_the_blood_desc:0 "The clans hear the rites and go out of the hall with eyes bright and knuckles white. For a season the war-bands are impatient and fine."
 zin_goldoroth_fire_in_the_blood_spirit:0 "Fire in the Blood"
 zin_goldoroth_fire_in_the_blood_spirit_desc:0 "After the rites the war-bands are keen and quick. They leave the hall with a glow in their eyes that does not fade for weeks."
 zin_goldoroth_fire_mountain_speaks:0 "The Fire-Mountain Speaks"
 zin_goldoroth_fire_mountain_speaks_desc:0 "Above Cocanoor a great mountain breathes smoke. Fire-speakers climb its slopes each season and read the shapes in the plume."
 zin_goldoroth_fire_speakers:0 "The Fire-Speakers"
 zin_goldoroth_fire_speakers_desc:0 "Bredo the Fire-Speaker is given a seat at the Warking's right hand. The clans find that a smoke-reader at the table makes everyone more careful of what they say."
 zin_goldoroth_fire_speakers_spirit:0 "The Fire-Speakers"
 zin_goldoroth_fire_speakers_spirit_desc:0 "The smoke-readers sit at the Warking's right hand, and their quiet words are heard in every loud room."
 zin_goldoroth_fire_tempered_iron:0 "Fire-Tempered Iron"
 zin_goldoroth_fire_tempered_iron_desc:0 "Smiths learn to quench black iron in melted fat and fire-speaker's ash, and the blades come out harder than any the holds have seen."
 zin_goldoroth_fire_through_the_holds:0 "Fire Through the Holds"
 zin_goldoroth_fire_through_the_holds_desc:0 "The host burns its way from hall to hall. The holds that hold are broken, and the ones that fall have time to regret it."
 zin_goldoroth_forge_pits:0 "The Forge-Pits of Cocanoor"
 zin_goldoroth_forge_pits_desc:0 "Beneath the black hall the forge-pits glow day and night. Orc smiths work the iron there as their ancestors did, only faster and with more shouting."
 zin_goldoroth_forges_never_cool:0 "The Forges Never Cool"
 zin_goldoroth_forges_never_cool_desc:0 "In war the forges are lit by shifts and kept burning around the clock. Smiths sleep where they fall, and the racks fill."
 zin_goldoroth_forges_never_cool_spirit:0 "The Forges Never Cool"
 zin_goldoroth_forges_never_cool_spirit_desc:0 "The fires are fed day and night, and the smiths work in shifts. Nothing else is made, because nothing else is needed."
 zin_goldoroth_forts_on_the_march:0 "Forts on the Dondor March"
 zin_goldoroth_forts_on_the_march_desc:0 "A line of stone keeps rises along the border, each with its own signal-pyre and its own grim captain. They are meant to say: we can do this the hard way."
 zin_goldoroth_gifts_of_black_iron:0 "Gifts of Black Iron"
 zin_goldoroth_gifts_of_black_iron_desc:0 "Heralds carry blades, helms and ingots to the free holds. The chieftains accept them with great dignity and count them carefully afterwards."
 zin_goldoroth_goblin_skirmishers:0 "Goblin Skirmishers"
 zin_goldoroth_goblin_skirmishers_desc:0 "Goblins with short bows and slings are formed into quick companies. They are bad at standing still and excellent at being somewhere else."
 zin_goldoroth_goblin_skirmishers_spirit:0 "Goblin Skirmishers"
 zin_goldoroth_goblin_skirmishers_spirit_desc:0 "Goblins who run light and carry short bows are formed into companies that nobody can pin down."
 zin_goldoroth_goblin_tallymen:0 "The Goblin Tallymen"
 zin_goldoroth_goblin_tallymen_desc:0 "Goblin clerks with notched sticks and quick tongues count every sack and spear in the kingdom. They are rarely thanked and never cheated."
 zin_goldoroth_great_warband:0 "The Great Warband"
 zin_goldoroth_great_warband_desc:0 "Every war-band in the kingdom is under the Warking's banner. It is loud, it is hungry, and it is very large."
 zin_goldoroth_hard_yoke:0 "A Hard Yoke"
 zin_goldoroth_hard_yoke_desc:0 "The holds that bow to Cocanoor are broken in and held fast. They are quiet, and they are not happy."
 zin_goldoroth_heirs_of_the_uniting:0 "Heirs of the Uniting"
 zin_goldoroth_heirs_of_the_uniting_desc:0 "Goldoroth was made one about 4A 1450 by a Warking who fought four chiefs and fed them all afterwards. Whose blood will rule it next is a question the clans prefer to have asked aloud."
 zin_goldoroth_hold_assault:0 "Fire Through the Holds"
 zin_goldoroth_hold_assault_desc:0 "The host burns its way from hall to hall, and small holds fall faster than the news of them."
 zin_goldoroth_hold_the_shore:0 "Hold the Shore"
 zin_goldoroth_hold_the_shore_desc:0 "Orcs of the Dark Shore stand to arms on the beaches, with fire-pits lit and spears set. The dead, they have learned, do not stay down."
 zin_goldoroth_hold_tribute:0 "The Tribute of the Holds"
 zin_goldoroth_hold_tribute_desc:0 "Wagons of iron, grain and hide arrive at Cocanoor each season. The Warking's steward notes each one, and so do the holds."
 zin_goldoroth_holds_of_the_inner_dark:0 "The Holds of the Inner Dark"
 zin_goldoroth_holds_of_the_inner_dark_desc:0 "Bordon, Dreson, Dulundur and a dozen smaller halls keep their own fires within a few days' march of Cocanoor. Goldoroth means to bring them under one smoke, by gifts if it can and by iron if it must."
 zin_goldoroth_horde_unbound:0 "The Horde Unbound"
 zin_goldoroth_horde_unbound_desc:0 "The Warking lets the war-bands off the leash, and they run at the enemy with a roar. There are no battle plans after the first charge."
 zin_goldoroth_horde_unbound_spirit:0 "The Horde Unbound"
 zin_goldoroth_horde_unbound_spirit_desc:0 "The war-bands run at the enemy with a roar and no plan, and the roar is often enough."
 zin_goldoroth_horde_without_end:0 "A Horde Without End"
 zin_goldoroth_horde_without_end_desc:0 "The kingdom's mothers are honoured, the broods are counted and the clans compete to send the most sons to the banner. There is no shortage of orcs."
 zin_goldoroth_horde_without_end_spirit:0 "A Horde Without End"
 zin_goldoroth_horde_without_end_spirit_desc:0 "Broods are counted, mothers honoured and sons sent to the banner by the hundred. There is always another warband."
 zin_goldoroth_hour_of_the_black_iron:0 "The Hour of the Black Iron"
 zin_goldoroth_hour_of_the_black_iron_desc:0 "The moot has waited long, and the time has come. The war-horns of Cocanoor are blown, and the clans rise as one."
 zin_goldoroth_hunt_the_envoys:0 "Hunt the Southern Envoys"
 zin_goldoroth_hunt_the_envoys_desc:0 "Hunters are sent into the hills to find southern envoys who have been seen speaking to the holds. When found, they are escorted to the border, politely and at spear-point."
 zin_goldoroth_iron_clans_speak:0 "The Iron Clans Speak"
 zin_goldoroth_iron_clans_speak_desc:0 "Forge-Mistress Ulgra's clans want iron, charcoal and peace long enough to use them. She puts her case in a quiet voice and a heavy hammer."
 zin_goldoroth_iron_discipline:0 "Iron Discipline"
 zin_goldoroth_iron_discipline_desc:0 "War-bands are broken into companies, and companies into files. An orc who leaves the line is beaten, and an orc who holds it is fed."
 zin_goldoroth_iron_discipline_spirit:0 "Iron Discipline"
 zin_goldoroth_iron_discipline_spirit_desc:0 "Companies, files and orders. An orc who holds the line is fed; an orc who breaks it learns why the Warking is called what he is."
 zin_goldoroth_iron_tithe:0 "The Iron Tithe"
 zin_goldoroth_iron_tithe_desc:0 "Every forge-pit in the kingdom sends a tenth of its output to Cocanoor. The Warking's hall is never short of blades, and the Iron Clans know exactly how many."
 zin_goldoroth_iron_tithe_spirit:0 "The Iron Tithe"
 zin_goldoroth_iron_tithe_spirit_desc:0 "A tenth of all that the forge-pits make goes to the Warking's hall. The Iron Clans say it is a high price; the Warking says it is a fair one."
 zin_goldoroth_iron_yoke:0 "The Iron Yoke"
 zin_goldoroth_iron_yoke_desc:0 "A hold that kneels to Cocanoor pays tribute, sends sons to the banner and keeps its own hall. This is the Iron Yoke, and there are chiefs who say it is lighter than it looks."
 zin_goldoroth_keep_the_armed_peace:0 "Keep the Armed Peace"
 zin_goldoroth_keep_the_armed_peace_desc:0 "The Warking decides that the border will stay a border. The raids lessen, the keeps are manned and the clans, with some grumbling, find other things to fight about."
 zin_goldoroth_kneel_to_nafeher:0 "Kneel to Nafeher"
 zin_goldoroth_kneel_to_nafeher_desc:0 "The Warking goes south and bends his knee to Volgan. It is a small gesture, and it changes what Goldoroth is."
 zin_goldoroth_landing_galleys:0 "Landing Galleys"
 zin_goldoroth_landing_galleys_desc:0 "Flat-bottomed galleys with drop-ramps are built for the work of putting orcs on beaches. They are ugly, they smell and they work."
 zin_goldoroth_landing_galleys_spirit:0 "Landing Galleys"
 zin_goldoroth_landing_galleys_spirit_desc:0 "Flat-bottomed galleys with drop-ramps put orcs on beaches faster than any watch can ring a bell."
 zin_goldoroth_law_of_the_moot:0 "The Law of the Moot"
 zin_goldoroth_law_of_the_moot_desc:0 "The moot agrees the first written law of Goldoroth: who may speak, in what order and with what weapons. It is short, and it has been read aloud so often that most clans know it by heart."
 zin_goldoroth_law_of_the_moot_spirit:0 "The Law of the Moot"
 zin_goldoroth_law_of_the_moot_spirit_desc:0 "The moot has a law now, and the clans say it is theirs. It was written by someone who understood how orcs argue."
 zin_goldoroth_levies_of_the_warrens:0 "Levies of the Warrens"
 zin_goldoroth_levies_of_the_warrens_desc:0 "The goblin warrens send levies by the thousand, small, swift and difficult to count. Their chiefs assure the Warking that there are more where those came from."
 zin_goldoroth_light_yoke:0 "A Light Yoke"
 zin_goldoroth_light_yoke_desc:0 "The chiefs keep their halls and their pride. The tribute is paid, the spears are sent and the holds find less to complain about than they expected."
 zin_goldoroth_lord_of_the_inner_dark:0 "Lord of the Inner Dark"
 zin_goldoroth_lord_of_the_inner_dark_desc:0 "A quarter of the Dark Lands now answers to Cocanoor, and the Warking is called its lord by chiefs who would once have spat. He has the grace not to remind them."
 zin_goldoroth_lord_of_the_inner_dark_spirit:0 "Lord of the Inner Dark"
 zin_goldoroth_lord_of_the_inner_dark_spirit_desc:0 "A quarter of the Dark Lands answers to Cocanoor, and a Warking sits in a chair not made for the one before him."
 zin_goldoroth_markets_of_the_holds:0 "Markets of the Holds"
 zin_goldoroth_markets_of_the_holds_desc:0 "Traders from the free holds are allowed to set stalls outside Cocanoor's gates, paying in coin or in iron. The Warking watches, and the holds learn to need what they are sold."
 zin_goldoroth_master_of_the_clans:0 "Master of the Clans"
 zin_goldoroth_master_of_the_clans_desc:0 "The Warking has the favour of every clan, and no one in the moot dares to challenge him. It will not last forever, but while it lasts it is very quiet."
 zin_goldoroth_masters_of_the_dark_sea:0 "Masters of the Dark Sea"
 zin_goldoroth_masters_of_the_dark_sea_desc:0 "No other fleet on the Sea of Darkness is larger than Goldoroth's, and the captains know it. They sail the waters as if they owned them, and for the moment they do."
 zin_goldoroth_masters_of_the_dark_sea_spirit:0 "Masters of the Dark Sea"
 zin_goldoroth_masters_of_the_dark_sea_spirit_desc:0 "No fleet on the Sea of Darkness is larger, and its captains sail as if the waves paid tribute."
 zin_goldoroth_men_of_blackton:0 "The Men of Blackton"
 zin_goldoroth_men_of_blackton_desc:0 "Blackton is a hold of men, not orcs: farmers and fishers with a grim sense of humour. Cocanoor offers them protection and the unspoken fact of its size."
 zin_goldoroth_mercy_for_the_kneeling:0 "Mercy for Those Who Kneel"
 zin_goldoroth_mercy_for_the_kneeling_desc:0 "A hold that lays down its spears is spared, and its chief keeps his chair. The word goes before the host, and fewer halls choose to fight."
 zin_goldoroth_night_marches:0 "Night Marches"
 zin_goldoroth_night_marches_desc:0 "Orcs see well in the dark, and the Warking's marshals have noticed. Columns now set out at dusk and arrive before the enemy has finished breakfast."
 zin_goldoroth_night_marches_spirit:0 "Night Marches"
 zin_goldoroth_night_marches_spirit_desc:0 "Orc columns set out at dusk and arrive before dawn. The enemy, who had planned for the morning, has to improvise."
 zin_goldoroth_no_masters:0 "No Spirit Rules the Dark"
 zin_goldoroth_no_masters_desc:0 "The words are carved over the gate of Cocanoor. Southern whispers find no purchase in a kingdom that has made up its mind."
 zin_goldoroth_no_spirit_rules_the_dark:0 "No Spirit Rules the Dark"
 zin_goldoroth_no_spirit_rules_the_dark_desc:0 "The words are carved over the gate of Cocanoor in letters a man's height. No whisper from the south has a place in the moot."
 zin_goldoroth_notbuton_assault:0 "The Storm of Notbuton"
 zin_goldoroth_notbuton_assault_desc:0 "The host climbs the high rock of Notbuton in a tide of black iron, and the defenders learn the meaning of a long siege."
 zin_goldoroth_ogre_pacts:0 "Ogre Pacts of the Dark Lands"
 zin_goldoroth_ogre_pacts_desc:0 "The ogres of the hills take a Warking's coin and a Warking's food and, when told to charge, charge. The pact is simple, and it works."
 zin_goldoroth_ogres_from_the_south:0 "Ogres from the South"
 zin_goldoroth_ogres_from_the_south_desc:0 "Companies of ogres arrive in the hills, hired with southern gold. They eat enormously, break everything they touch and cannot be talked out of a charge."
 zin_goldoroth_one_fire_under_cocanoor:0 "One Fire Under Cocanoor"
 zin_goldoroth_one_fire_under_cocanoor_desc:0 "The Warking declares that a hold which has paid tribute long enough shall become part of Goldoroth itself, its chief a warden and its hall a barracks. Some say it is overdue; others say it is an ending."
 zin_goldoroth_one_warking_one_law:0 "One Warking, One Law"
 zin_goldoroth_one_warking_one_law_desc:0 "Gorduth decrees that no clan shall make war, peace or pact without his word. The clans grumble, and the Warking looks pleased with the silence."
 zin_goldoroth_opinion_free_dark:0 "Standing with Cocanoor"
 zin_goldoroth_opinion_oath_kept:0 "Oath Kept"
 zin_goldoroth_opinion_troll_silver:0 "Troll Silver"
 zin_goldoroth_overlord_of_the_holds:0 "Overlord of the Holds"
 zin_goldoroth_overlord_of_the_holds_desc:0 "Half of the Dark Lands pays tribute to Cocanoor. The Warking sits on a tall chair of black iron, and few who see it laugh."
 zin_goldoroth_overlord_of_the_holds_spirit:0 "Overlord of the Holds"
 zin_goldoroth_overlord_of_the_holds_spirit_desc:0 "Half the Dark Lands kneels, or pays tribute, or watches nervously from behind its walls. The black iron chair is high, and the view from it is wide."
 zin_goldoroth_quarrelsome_clans:0 "Quarrelsome Clans"
 zin_goldoroth_quarrelsome_clans_desc:0 "Four clans share one kingdom and one fire. They agree on iron and on little else."
 zin_goldoroth_quiet_march:0 "The Quiet March"
 zin_goldoroth_quiet_march_desc:0 "The border is guarded, not bled. Merchants cross it with their wares, and for the first time in years nobody burns a barn."
 zin_goldoroth_raider_mounts:0 "Raider Mounts"
 zin_goldoroth_raider_mounts_desc:0 "Mounts bred in the northern hills carry orc raiders at a gallop. The beasts are bad-tempered, hungry and fast."
 zin_goldoroth_raiders_of_the_marches:0 "Raiders of the Marches"
 zin_goldoroth_raiders_of_the_marches_desc:0 "Fast riders slip across the Dondor line at night, burn a barn or two and are home by dawn. The Warking never ordered it; the Warking would be surprised if it stopped."
 zin_goldoroth_roads_of_slag:0 "Roads of Slag and Ash"
 zin_goldoroth_roads_of_slag_desc:0 "Forge-waste is rammed into the cart tracks between the pits and the hold. The roads are black, hard and ugly, and they last."
 zin_goldoroth_shield_of_the_free_dark:0 "The Shield of the Free Dark"
 zin_goldoroth_shield_of_the_free_dark_desc:0 "Cocanoor calls on every free hold to stand together against any master who comes out of the south. Some will answer; some will be afraid of both Warking and master."
 zin_goldoroth_smoke_over_the_south:0 "Smoke over the South"
 zin_goldoroth_smoke_over_the_south_desc:0 "Bredo reports storms in the far south, and the tread of marching things beneath them. He will say no more than that, and the Warking does not press him."
 zin_goldoroth_southern_bargain:0 "The Southern Bargain"
 zin_goldoroth_southern_bargain_desc:0 "Cocanoor decides that the strangers' offer is too good to refuse: gold from the south, ogres from the south and a promise of Dondor's lands to follow."
 zin_goldoroth_southern_gold:0 "Gold from the South"
 zin_goldoroth_southern_gold_desc:0 "Southern coin arrives in iron-bound chests, and the Warking's steward counts it with a growing unease. It spends as well as any other gold."
 zin_goldoroth_southern_ogres:0 "Ogres from the South"
 zin_goldoroth_southern_ogres_desc:0 "The ogres eat what the Warking feeds them, break what he points at and ask no questions. They are the cheapest army money can buy."
 zin_goldoroth_sow_doubt_in_the_accord:0 "Sow Doubt in the Accord"
 zin_goldoroth_sow_doubt_in_the_accord_desc:0 "Goldoroth's envoys carry gold to Belonton and soft words about the price of loyalty. The Dark Sea Accord is not so firm as it looks."
 zin_goldoroth_spoils_of_dondor:0 "The Spoils of Dondor"
 zin_goldoroth_spoils_of_dondor_desc:0 "The south has named Dondor's lands as Goldoroth's reward. The war-clans take the promise as a debt already half paid."
 zin_goldoroth_storm_notbuton:0 "Storm Notbuton"
 zin_goldoroth_storm_notbuton_desc:0 "Dondor's seat stands on a high rock above the sea. The host climbs it the hard way, and the climb is paid for in blood."
 zin_goldoroth_strait_crossing:0 "Across the Strait"
 zin_goldoroth_strait_crossing_desc:0 "Black-sailed galleys cross the narrow water by night and put their orcs ashore before the beacons are lit."
 zin_goldoroth_strangers_from_the_south:0 "Strangers from the South"
 zin_goldoroth_strangers_from_the_south_desc:0 "Travellers from the far south arrive in Cocanoor with gifts and a polite request to meet the Warking. They do not say who sent them."
 zin_goldoroth_sworn_to_nafeher:0 "Sworn to Nafeher"
 zin_goldoroth_sworn_to_nafeher_desc:0 "Goldoroth's Warking has knelt to the grey city. The host marches well, the court is silent and everyone remembers who holds the leash."
 zin_goldoroth_the_accord_must_break:0 "The Accord Must Break"
 zin_goldoroth_the_accord_must_break_desc:0 "Dondor and Belonton have leaned on each other for too long. Goldoroth's host is ordered to take the first from the second."
 zin_goldoroth_the_armed_peace:0 "The Armed Peace"
 zin_goldoroth_the_armed_peace_desc:0 "Goldoroth and Dondor have not been at war for a generation. They have also not been at peace, and the border is a tangle of old grudges and new patrols."
 zin_goldoroth_the_black_iron_throne:0 "The Black Iron Throne"
 zin_goldoroth_the_black_iron_throne_desc:0 "A throne of black iron is raised in Cocanoor, high enough to be seen from the sea. The Warking sits on it, and the Dark Lands, for the first time in memory, have one ruler."
 zin_goldoroth_the_dark_lands_are_one:0 "The Dark Lands Are One"
 zin_goldoroth_the_dark_lands_are_one_desc:0 "Every hall from the Sea of Darkness to the southern straits sends its banner to Cocanoor. The Warking is crowned in black iron, and the kingdom is called Great Goldoroth."
 zin_goldoroth_the_dark_sea_is_ours:0 "The Dark Sea Is Ours"
 zin_goldoroth_the_dark_sea_is_ours_desc:0 "Dondor's fleet is sunk, its harbours taken, its watchfires out. The Sea of Darkness is Goldoroth's, and so are the straits."
 zin_goldoroth_the_great_warband:0 "The Great Warband"
 zin_goldoroth_the_great_warband_desc:0 "Every war-band in the kingdom is gathered under the Warking's own banner. It is the biggest host the Dark Lands have seen in a century."
 zin_goldoroth_the_holds_are_one:0 "The Holds Are One"
 zin_goldoroth_the_holds_are_one_desc:0 "No free hold remains on Goldoroth's borders. The inner Dark is one realm, and its Warking sits on its one throne."
 zin_goldoroth_the_living_together:0 "The Living Together"
 zin_goldoroth_the_living_together_desc:0 "Old enemies find that the dead have no preferences. Goldoroth offers Dondor a truce for as long as the black ships last."
 zin_goldoroth_the_long_grudge:0 "The Long Grudge"
 zin_goldoroth_the_long_grudge_desc:0 "Goldoroth names Dondor a thief of orc lands, and the claim is read aloud in the moot. It is a promise as much as a complaint."
 zin_goldoroth_the_northern_front:0 "The Northern Front"
 zin_goldoroth_the_northern_front_desc:0 "The south has marched, and Goldoroth marches with it. Dondor's seat is the first target, and the black host goes down the coast road at dawn."
 zin_goldoroth_the_sea_of_darkness:0 "The Sea of Darkness"
 zin_goldoroth_the_sea_of_darkness_desc:0 "Goldoroth is a land power with a long, dark coast. The Warking decides that he will not leave the sea to Dondor."
 zin_goldoroth_the_warbands:0 "The Warbands of Goldoroth"
 zin_goldoroth_the_warbands_desc:0 "The kingdom's host is a hundred warbands, each with its own banner, its own war-cry and its own pride. The Warking's task is to teach them to march in one direction."
 zin_goldoroth_tolls_on_the_dark_straits:0 "Tolls on the Dark Straits"
 zin_goldoroth_tolls_on_the_dark_straits_desc:0 "Goldoroth declares that ships using the straits shall pay a toll, collected at the gunwale by an orc with a long hook. Merchants find this uncivil, and pay it."
 zin_goldoroth_tribute_of_the_holds:0 "The Tribute of the Holds"
 zin_goldoroth_tribute_of_the_holds_desc:0 "Wagons of iron, grain and hides roll to Cocanoor. The Warking's steward counts them with a smile, and the holds count the days until the next."
 zin_goldoroth_troll_kin:0 "The Troll-Kin of the Forest"
 zin_goldoroth_troll_kin_desc:0 "In the deep forest live trolls who answer to no king and take no oaths, but who can be hired for the right price."
 zin_goldoroth_war_clans_speak:0 "The War-Clans Speak"
 zin_goldoroth_war_clans_speak_desc:0 "Warchief Britag stands in the moot and says what the war-clans have been muttering all winter: a host that does not march goes to rust. The Warking hears him out."
 zin_goldoroth_war_pits:0 "The War-Pits"
 zin_goldoroth_war_pits_desc:0 "New forge-pits are dug in the hills for war-work: great fires that burn night and day, tended by teams of sweating smiths."
 zin_goldoroth_warband_armouries:0 "The Warband Armouries"
 zin_goldoroth_warband_armouries_desc:0 "Every warband has its own rack-house, filled and kept by its own smiths. The armouries are the proudest buildings in the kingdom."
 zin_goldoroth_wardens_of_the_dark_shore:0 "Wardens of the Dark Shore"
 zin_goldoroth_wardens_of_the_dark_shore_desc:0 "Watchtowers rise along the northern shore, each with its own beacon and its own captain. If anything comes across the straits, Cocanoor will know first."
 zin_goldoroth_warking_law:0 "One Warking, One Law"
 zin_goldoroth_warking_law_desc:0 "The Warking's word is the only word in Goldoroth. It is a short law, and it is enforced by large orcs."
 zin_goldoroth_warking_of_cocanoor:0 "The Warking of Cocanoor"
 zin_goldoroth_warking_of_cocanoor_desc:0 "Gorduth rules from the black hall of Cocanoor, where four clans share one fire and quarrel over the wood. A kingdom of clans is held together by a Warking who can feed them, scare them or surprise them."
 zin_goldoroth_warking_takes_the_field:0 "The Warking Takes the Field"
 zin_goldoroth_warking_takes_the_field_desc:0 "Gorduth puts on the black armour of his fathers and leads the host himself. The war-clans, seeing it, forget their quarrels."
 zin_goldoroth_warrens_have_a_voice:0 "The Warrens Have a Voice"
 zin_goldoroth_warrens_have_a_voice_desc:0 "The goblin warrens have always been counted last and blamed first. Snikkit Many-Knives is given a seat in the moot, and the warrens find that being heard is a sort of loyalty."
 zin_goldoroth_warrens_heard:0 "The Warrens Heard"
 zin_goldoroth_warrens_heard_desc:0 "The goblin warrens have a voice in the moot, and they use it, loudly and often. They also stop slipping away from the muster."
 zin_goldoroth_weigh_the_south:0 "Weigh the South"
 zin_goldoroth_weigh_the_south_desc:0 "The Warking's council sits to weigh what the strangers want. The war-clans are curious, the fire-speakers wary and the goblins counting what the gifts cost."
 zin_goldoroth_when_the_mountain_wakes:0 "When the Mountain Wakes"
 zin_goldoroth_when_the_mountain_wakes_desc:0 "The old mountain rumbles, throws a plume of ash across the sky and glows at night. The clans want to know what it means; the fire-speakers have a great many answers."
 zin_goldoroth_when_the_south_falls_silent:0 "When the South Falls Silent"
 zin_goldoroth_when_the_south_falls_silent_desc:0 "The voice from the grey city stops. Goldoroth's chiefs wait for orders that do not come, and slowly, one by one, they begin to give their own."
 zin_goldoroth_word_to_sonargur:0 "Word to Sonargur"
 zin_goldoroth_word_to_sonargur_desc:0 "Cocanoor sends a letter to Lerendor's seat. It offers trade, and says in a footnote that it would prefer not to raid Leren ships."
 zin_goldoroth.1.a:0 "The moot is open."
 zin_goldoroth.1.a_tip_1:0 "The four blocs are the Volcano Clans, the Iron Clans, the War-Clans and the Goblin Warrens. Their favour is shown in the Horde panel."
 zin_goldoroth.1.d:0 "The four clans have come to Cocanoor: the Volcano Clans behind their fire-speakers, the Iron Clans with soot on their hands, the War-Clans with their weapons on their backs and the Goblin Warrens in a chattering huddle at the back of the hall. Gorduth lifts his hands, and for a moment there is silence."
 zin_goldoroth.1.t:0 "The Clans Assemble"
 zin_goldoroth.10.a:0 "Hear the Fire-Speakers."
 zin_goldoroth.10.a_tip_1:0 "The Black Iron Crown keeps Goldoroth free of the south. The Southern Bargain takes the south's gold and its debts."
 zin_goldoroth.10.b:0 "Hear the War-Clans."
 zin_goldoroth.10.b_tip_1:0 "The Southern Bargain takes the south's gold and its debts. The Black Iron Crown keeps Goldoroth free of the south."
 zin_goldoroth.10.d:0 "The Warking sits in council to weigh the strangers' offer. Bredo says that the south is stirring and that the Dark should be wary. Britag says that a strong friend in the south is worth more than a weak pride in the north. Both are listened to."
 zin_goldoroth.10.t:0 "The Warking's Council"
 zin_goldoroth.11.a:0 "We stand alone."
 zin_goldoroth.11.b:0 "Stand with Cocanoor."
 zin_goldoroth.11.d:0 "Riders from Cocanoor reach your hall with a message under the Warking's seal. A master may come out of the south, and the free holds of the Dark Lands are asked to stand together against him. The riders wait for an answer."
 zin_goldoroth.11.t:0 "Against the South?"
 zin_goldoroth.12.a:0 "Muster the warbands."
 zin_goldoroth.12.d:0 "The watchers in the southern hills send word by fire and by rider: the roads from the Ember Lands are full of marching columns. The Warking reads the message once, puts it down and asks for the war-horns."
 zin_goldoroth.12.t:0 "The South Is Moving"
 zin_goldoroth.13.a:0 "Orcs bargain; Nafeher commands."
 zin_goldoroth.13.b:0 "Welcome Cocanoor."
 zin_goldoroth.13.d:0 "Envoys of Goldoroth, black-cloaked and wary, have reached the grey city with gifts of iron and a proposal. Cocanoor is willing to bargain, they say, but not to bow."
 zin_goldoroth.13.t:0 "Cocanoor Sends Envoys"
 zin_goldoroth.14.a:0 "Not yet."
 zin_goldoroth.14.b:0 "Rise, servant."
 zin_goldoroth.14.d:0 "Warking Gorduth has come to the grey city in person, with a handful of guards and a black iron crown wrapped in cloth. He asks to be taken as Nafeher's sworn servant, and waits for the answer with his eyes on the floor."
 zin_goldoroth.14.t:0 "Cocanoor Kneels"
 zin_goldoroth.15.a:0 "We were never his."
 zin_goldoroth.15.b:0 "Fight on in his name."
 zin_goldoroth.15.d:0 "No orders have come from the grey city for many days. The chiefs of Cocanoor gather in the hall, and for the first time since the knee was bent, nobody looks at the south. The Warking is asked what will be done."
 zin_goldoroth.15.t:0 "When the South Falls Silent"
 zin_goldoroth.16.a:0 "Sonargur does not trade with Cocanoor."
 zin_goldoroth.16.b:0 "Trade, and no raids on our friends."
 zin_goldoroth.16.d:0 "A ship under black sails has put into Sonargur with a letter from the Warking of Goldoroth. It offers trade in iron and timber and, in a final line that the harbour-master has read three times, assures Leren ships of safe passage."
 zin_goldoroth.16.t:0 "Cocanoor Offers Trade"
 zin_goldoroth.17.a:0 "Then we burn them again, and again."
 zin_goldoroth.17.d:0 "The first of the black ships has landed on the shore. The silent shapes that come off it fall to the orcs' axes and rise again, and the shore-captains send word that the dead do not stay down. The Warking sends back one line: burn them again, and again."
 zin_goldoroth.17.t:0 "They Do Not Stay Down"
 zin_goldoroth.18.a:0 "Notbuton stands alone."
 zin_goldoroth.18.b:0 "Stand with the orcs, for now."
 zin_goldoroth.18.d:0 "A rider from Cocanoor reaches Notbuton under a white flag. The Warking proposes a truce for as long as the black ships last: no raids, no claims, no war, until the dead have been dealt with. He does not call it friendship."
 zin_goldoroth.18.t:0 "A Truce Against the Dead"
 zin_goldoroth.19.a:0 "Belonton keeps its oath."
 zin_goldoroth.19.b:0 "Leave the Accord."
 zin_goldoroth.19.d:0 "A messenger from Cocanoor stands in Belonton's hall and delivers the Warking's offer in plain words. Belonton may leave the Dark Sea Accord, or Belonton may burn. The messenger has been told to wait for an answer."
 zin_goldoroth.19.t:0 "Leave the Accord or Burn"
 zin_goldoroth.2.a:0 "Sungor's line."
 zin_goldoroth.2.b:0 "Ulgra's line."
 zin_goldoroth.2.c:0 "Britag's line."
 zin_goldoroth.2.d:0 "Goldoroth was made one in about 4A 1450 by a Warking who fought four chiefs and fed them all afterwards. The old hall rings with the names of his heirs, and the clans are asked to say whose blood they would follow after Gorduth."
 zin_goldoroth.2.t:0 "Heirs of the Uniting"
 zin_goldoroth.20.a:0 "Read it aloud."
 zin_goldoroth.20.d:0 "A rider returns from the grey city with a sealed reply. The seal is plain and the wax is cold. The Warking reads it alone, and then he calls for the council."
 zin_goldoroth.20.t:0 "Nafeher Answers"
 zin_goldoroth.21.a:0 "Hear the answer."
 zin_goldoroth.21.d:0 "The ship with the black sails comes back from Sonargur, and its captain has an answer. He delivers it with the deliberate flatness of a man who has learned not to look pleased or displeased."
 zin_goldoroth.21.t:0 "Sonargur Answers"
 zin_goldoroth.22.a:0 "Read it aloud."
 zin_goldoroth.22.d:0 "Dondor's answer reaches Cocanoor under a white flag. The envoy has been told to say only what is written, and says it twice."
 zin_goldoroth.22.t:0 "Notbuton Answers"
 zin_goldoroth.23.a:0 "Read it aloud."
 zin_goldoroth.23.d:0 "Belonton's reply arrives by a single rider. It is short and the Warking reads it without comment."
 zin_goldoroth.23.t:0 "Belonton Answers"
 zin_goldoroth.24.a:0 "Hear the answer."
 zin_goldoroth.24.d:0 "The envoys return from the grey city with Nafeher's answer written in a hand that does not shake. They have been told to say nothing until the Warking asks, and he does not ask at once."
 zin_goldoroth.24.t:0 "Nafeher Receives Cocanoor"
 zin_goldoroth.3.a:0 "The mountain wants iron."
 zin_goldoroth.3.b:0 "The mountain wants blood."
 zin_goldoroth.3.c:0 "The mountain wants patience."
 zin_goldoroth.3.d:0 "Smoke rises from the mountain above Cocanoor in a column that bends toward the hall. Bredo the Fire-Speaker studies it for most of a day, then comes down and announces that the mountain wants something. He will not say what until he is asked."
 zin_goldoroth.3.t:0 "The Fire-Mountain Speaks"
 zin_goldoroth.4.a:0 "Watch the south."
 zin_goldoroth.4.d:0 "Bredo comes down from the mountain with grey on his cheeks. He has seen storms in the far south, he says, and the tread of marching things beneath them, and he will say no more than that. The Warking does not press him. The hall is quieter than it was."
 zin_goldoroth.4.t:0 "Smoke over the South"
 zin_goldoroth.5.a:0 "A sign for patience."
 zin_goldoroth.5.b:0 "A sign for war."
 zin_goldoroth.5.d:0 "The mountain over Cocanoor shakes the hall, throws ash across the sky and glows red at night. Fire-speakers climb its flanks to read the signs, and the clans gather in the courtyard to hear what they say."
 zin_goldoroth.5.t:0 "When the Mountain Wakes"
 zin_goldoroth.6.a:0 "Feast them well."
 zin_goldoroth.6.b:0 "Show them the forges."
 zin_goldoroth.6.d:0 "The chiefs of the free holds sit at the long table in the black hall, in order of age and of grudge. The Warking asks what the feast shall be, and what the chiefs shall be shown."
 zin_goldoroth.6.t:0 "Chiefs at Cocanoor"
 zin_goldoroth.7.a:0 "Trolls fight for pay."
 zin_goldoroth.7.b:0 "The forest answers no one."
 zin_goldoroth.7.d:0 "A messenger from Cocanoor stands at the edge of the forest with a sack of iron and a request. The trolls of the forest are not great talkers, and the messenger has been waiting for most of a day."
 zin_goldoroth.7.t:0 "The Troll-Kin of the Forest"
 zin_goldoroth.8.a:0 "Take the gold, keep the oath."
 zin_goldoroth.8.b:0 "Send it back to Cocanoor."
 zin_goldoroth.8.d:0 "A courier from Cocanoor brings a purse to Belonton's court with no letter attached. The courier says only that the Warking remembers his friends, and that the purse is for any who might remember Cocanoor in return."
 zin_goldoroth.8.t:0 "Gold from Cocanoor"
 zin_goldoroth.9.a:0 "Let them talk. Then we decide."
 zin_goldoroth.9.d:0 "The chiefs report strangers from the far south at the gate, with gifts and a polite request for an audience. They are tall, grey-cloaked and entirely courteous. None of them has said who sent them."
 zin_goldoroth.9.t:0 "Strangers from the South"
