l_english:
 zin_regional_yeti_lands_bone_and_hide:0 "Bone and Hide"
 zin_regional_yeti_lands_bone_and_hide_desc:0 "Bone is carved into needles, hooks and spear-heads, and hide is cured into boots and tents. Yeti craftsmen make their gear to outlast the owner."
 zin_regional_yeti_lands_claws_in_the_storm:0 "Claws in the Storm"
 zin_regional_yeti_lands_claws_in_the_storm_desc:0 "The yeti fight with hooked claws of bone and iron, forged in the same smithies that make their hunting tools. In a blizzard, they are everywhere at once."
 zin_regional_yeti_lands_crown_trackers:0 "Trackers for the Crown"
 zin_regional_yeti_lands_crown_trackers_desc:0 "Yeti trackers walk beside the Winter Crown's scouts and read the snow for them. What they find, they report truly, and what they do not find is not there."
 zin_regional_yeti_lands_deep_snow:0 "The Deep Snow"
 zin_regional_yeti_lands_deep_snow_desc:0 "The yeti have turned their faces from every truce and every crown. The snow is deep, the trails are theirs, and strangers do not find the way."
 zin_regional_yeti_lands_eldests_fire:0 "The Eldest's Fire"
 zin_regional_yeti_lands_eldests_fire_desc:0 "The clans of the yeti meet around one fire in the deep snow, and Grumhal the Eldest speaks for them. A fire that has burned for so long is hard to argue with."
 zin_regional_yeti_lands_hearth_and_height_kept:0 "Hearth and Height"
 zin_regional_yeti_lands_hearth_and_height_kept_desc:0 "The oldest truce is renewed in full: hearth for the lowlands, height for the yeti. The two sides swear that neither will see the other beset alone, and seal the oath with a shared cup of snow-water."
 zin_regional_yeti_lands_herds_of_the_high_snow:0 "Herds of the High Snow"
 zin_regional_yeti_lands_herds_of_the_high_snow_desc:0 "Long-haired snow oxen are driven up to the high pastures in summer and down to the sheltered valleys in autumn. A clan with a good herd does not fear the winter."
 zin_regional_yeti_lands_hunters_against_the_dead:0 "Hunters Against the Dead"
 zin_regional_yeti_lands_hunters_against_the_dead_desc:0 "The best hunters say that anything which walks can be tracked, and anything tracked can be stopped. They take their bone spears down from the pegs and go to find the dead."
 zin_regional_yeti_lands_long_stride:0 "Long Stride"
 zin_regional_yeti_lands_long_stride_bands:0 "Long Stride"
 zin_regional_yeti_lands_long_stride_bands_desc:0 "Bands led by Oruk Long-Stride cross in a day what other folk cross in three, and arrive with breath to spare. A yeti column is gone before the watch has finished counting it."
 zin_regional_yeti_lands_long_stride_desc:0 "Oruk Long-Stride can cross a mountain in a day and be hunting before dusk. He teaches the young to run on crust and to rest on the move, and the bands who follow him do not tire."
 zin_regional_yeti_lands_moot_of_fires:0 "The Moot of Fires"
 zin_regional_yeti_lands_moot_of_fires_desc:0 "Each clan now keeps its own fire at the moot-ground, and the Eldest walks from fire to fire to hear them. It is slower than one fire, and a great deal harder to put out."
 zin_regional_yeti_lands_no_road_through_the_snow:0 "No Road Through the Snow"
 zin_regional_yeti_lands_no_road_through_the_snow_desc:0 "The yeti obliterate the old trails with deliberate care, filling pits, pulling down cairns and leaving the high snow without a mark. No road runs through the deep snow now, and none will."
 zin_regional_yeti_lands_silent_snows:0 "The Snows Stay Silent"
 zin_regional_yeti_lands_silent_snows_desc:0 "The yeti keep to their high ground and say nothing to anyone. The war is a thing of the lowlands, and the snow has its own business."
 zin_regional_yeti_lands_snowline_fairs:0 "Snowline Fairs"
 zin_regional_yeti_lands_snowline_fairs_desc:0 "At the snowline, where the forest ends and the ice begins, the yeti hold a fair each year. Furs, horn and carved bone are traded for salt, iron and cloth, and the prices are kept honest by the Eldest's own eye."
 zin_regional_yeti_lands_songs_of_the_long_snow:0 "Songs of the Long Snow"
 zin_regional_yeti_lands_songs_of_the_long_snow_desc:0 "The yeti keep their history in songs that last all night, and Sima Who Remembers knows more of them than any other living singer. Her voice is thin and clear, and the clans fall silent when she begins."
 zin_regional_yeti_lands_stores_of_the_long_winter:0 "Stores of the Long Winter"
 zin_regional_yeti_lands_stores_of_the_long_winter_desc:0 "Snow caves are dug into the hillsides and filled with dried meat, rendered fat and frozen berries. They keep for years, and the clans know where every cave is."
 zin_regional_yeti_lands_storm_bands:0 "The Storm Bands"
 zin_regional_yeti_lands_storm_bands_desc:0 "In the worst weather, when no one else will move, the storm bands go out. They fall on a camp from the blizzard and vanish into it."
 zin_regional_yeti_lands_the_castles_compact:0 "The Castle's Compact"
 zin_regional_yeti_lands_the_castles_compact_desc:0 "Word comes from the northern ice of the Castle of Yeldenne and its lord, who offers a compact: no quarrel between the castle and the yeti, and passage for those who keep the peace. The Eldest sends back a bone knife as a sign of agreement."
 zin_regional_yeti_lands_the_clans_of_the_deep_snow:0 "The Clans of the Deep Snow"
 zin_regional_yeti_lands_the_clans_of_the_deep_snow_desc:0 "Clans that once met only to quarrel now meet to hunt and trade, and each leaves a feather at the Eldest's fire to show it was there. The fires burn brighter for the company."
 zin_regional_yeti_lands_the_dead_and_the_snow:0 "The Dead and the Snow"
 zin_regional_yeti_lands_the_dead_and_the_snow_desc:0 "Cold shapes move in the south, and the singers say they do not feel the cold. The Eldest calls the clans to the fire to hear what must be done about the dead."
 zin_regional_yeti_lands_the_deep_snow_host:0 "The Deep Snow Host"
 zin_regional_yeti_lands_the_deep_snow_host_desc:0 "When the Eldest's drum is beaten, the clans send their best spears to the host-ground. They arrive by dawn, in white fur and with ice on their beards, and the host is ready by noon."
 zin_regional_yeti_lands_the_deep_snow_is_ours:0 "The Deep Snow Is Ours"
 zin_regional_yeti_lands_the_deep_snow_is_ours_desc:0 "A few clans say that the deep snow is the yeti's and the lowlanders have no truce to offer. They have kept their own counsel for a long time, and they would like to go on doing so."
 zin_regional_yeti_lands_the_eldests_fire:0 "The Eldest's Fire"
 zin_regional_yeti_lands_the_eldests_fire_desc:0 "The fire of the yeti clans has burned in the deep snow since before the oldest song, and Grumhal the Eldest sits beside it. Nobody speaks before the Eldest has spoken, and nobody lies while the fire watches."
 zin_regional_yeti_lands_the_far_snows:0 "The Far Snows"
 zin_regional_yeti_lands_the_far_snows_desc:0 "Beyond the last hunting ground lie the far snows, where no clan has a name for the valleys and the wind never stops. The Eldest sends out scouts, and listens when they return."
 zin_regional_yeti_lands_the_fire_moot:0 "The Fire Moot"
 zin_regional_yeti_lands_the_fire_moot_desc:0 "At the turn of each season the clans gather and each lays a branch on the fire. The branches burn together, and the moot decides what must be done."
 zin_regional_yeti_lands_the_great_hunt_mustered:0 "The Great Hunt Mustered"
 zin_regional_yeti_lands_the_great_hunt_mustered_desc:0 "Every clan sends its best hunters to the great ground, and the Eldest names the quarry. They go out in long lines across the snow, and what they bring back is more than meat."
 zin_regional_yeti_lands_the_hunting_grounds:0 "The Hunting Grounds"
 zin_regional_yeti_lands_the_hunting_grounds_desc:0 "The high hunting grounds of the yeti stretch from the snowline to the far ice, and every clan has its own valley and its own game. Hunters leave their marks on the cairns so that none will wander into another's trap."
 zin_regional_yeti_lands_the_hunting_truce:0 "The Hunting Truce"
 zin_regional_yeti_lands_the_hunting_truce_desc:0 "Coldor has offered a Hunting Truce: lowland hunters keep to the forest, yeti hunters keep to the snow, and neither crosses the other's line. The Eldest listens, and the fire does not object."
 zin_regional_yeti_lands_the_light_in_the_north:0 "The Light in the North"
 zin_regional_yeti_lands_the_light_in_the_north_desc:0 "A green light stands in the northern sky, steady and cold, and it does not move with the stars. The yeti sing about it and keep their distance."
 zin_regional_yeti_lands_the_light_in_the_north_tip_1:0 "The green light in the north does not move with the stars."
 zin_regional_yeti_lands_the_man_who_walked_from_the_ice:0 "The Man Who Walked from the Ice"
 zin_regional_yeti_lands_the_man_who_walked_from_the_ice_desc:0 "A tale is told at the Eldest's fire of a man who came out of the ice with no name and no memory, and who was fed and sheltered before he went south. The singers add a verse each year."
 zin_regional_yeti_lands_the_old_truces:0 "The Old Truces"
 zin_regional_yeti_lands_the_old_truces_desc:0 "The old truces were sworn between the yeti and the lowland clans before the first crown, and they have been renewed or broken in every generation since. The Eldest asks what the clans want of them now."
 zin_regional_yeti_lands_the_snows_stay_silent:0 "The Snows Stay Silent"
 zin_regional_yeti_lands_the_snows_stay_silent_desc:0 "The yeti choose silence: no smoke, no horns, no answer to any call. The dead may walk the lowlands, but they will find no road into the snow."
 zin_regional_yeti_lands_the_storm_bands:0 "The Storm Bands"
 zin_regional_yeti_lands_the_storm_bands_desc:0 "The strongest clans are drawn into bands of two hundred, each with its own drummer and its own battle-cry. A storm band marches in the worst weather, when no one else will."
 zin_regional_yeti_lands_the_storm_walks_south:0 "The Storm Walks South"
 zin_regional_yeti_lands_the_storm_walks_south_desc:0 "A storm band leaves the snow, white against the grey of the lowland spring. Behind it walk a hundred more, in single file, tracking the dead across the plains."
 zin_regional_yeti_lands_the_white_silence:0 "The White Silence"
 zin_regional_yeti_lands_the_white_silence_desc:0 "The yeti go quiet. Smoke ceases to rise from the high camps, hunters stop leaving marks and the traders at the snowline find the fair empty."
 zin_regional_yeti_lands_trackers_for_the_crown:0 "Trackers for the Crown"
 zin_regional_yeti_lands_trackers_for_the_crown_desc:0 "Yeti trackers go south to walk beside the Winter Crown's scouts in the forest passes. They are paid in salt, fed from the same pot and trusted for their noses."
 zin_regional_yeti_lands_tracks_without_end:0 "Tracks Without End"
 zin_regional_yeti_lands_tracks_without_end_desc:0 "The scouts follow tracks across the ice for days and find no end to them. A few of them come back with frostbitten fingers and a very good idea of where the road goes."
 zin_regional_yeti_lands_white_silence:0 "The White Silence"
 zin_regional_yeti_lands_white_silence_desc:0 "No smoke rises from the high camps and no bell is heard in the passes. The yeti have gone quiet, and a quiet yeti is a great deal worse than a loud one."
 zin_regional_yeti_lands.1.a:0 "Trade furs for salt."
 zin_regional_yeti_lands.1.b:0 "Send them back down."
 zin_regional_yeti_lands.1.d:0 "A line of lowland traders has come to the snowline with salt, iron and cloth. They stand at the edge of the ice and wait to be noticed, which the yeti are in no hurry to do."
 zin_regional_yeti_lands.1.t:0 "Traders at the Snowline"
