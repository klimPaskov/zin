l_english:
 zin_kusven:0 "Kusven"
 ZIN_MISTAKE_BAND_FAINT:0 "Faint"
 ZIN_MISTAKE_BAND_GATHERED:0 "Gathered"
 ZIN_MISTAKE_BAND_STIRRING:0 "Stirring"
 ZIN_MISTAKE_BAND_WAKING:0 "Waking"
 ZIN_MISTAKE_BOND_DIVINE:0 "The New Gods"
 ZIN_MISTAKE_BOND_GREAT:0 "The Great Spirits"
 ZIN_MISTAKE_BOND_LESSER:0 "The Lesser Spirits"
 ZIN_MISTAKE_BUTTON:0 "The Presence"
 ZIN_MISTAKE_BUTTON_tt:0 "Open the account of the Presence."
 ZIN_MISTAKE_CONV:0 "The Convergence: §Y[?ROOT.zin_zol_convergence|0]§! of 100."
 ZIN_MISTAKE_ISLES:0 "The black isles that stir: §Y[?ROOT.zin_zol_islands_stirring|0]§!. Hosts raised: §Y[?ROOT.zin_zol_hosts|0]§! of §Y[?ROOT.zin_zol_host_cap|0]§!."
 ZIN_MISTAKE_LAPSED:0 "Whether he returns is not for us to know. The servants keep faith."
 ZIN_MISTAKE_POWER:0 "How much of his presence can act in Aoaz: [ROOT.zin_mistake_band_word] (§Y[?ROOT.zin_mistake_power|0]§!)."
 ZIN_MISTAKE_POWER_NOTE:0 "Not his whole power, which no one has measured."
 zin_mistake_presence:0 "The Presence"
 zin_mistake_presence_desc:0 "What the Old God does through his servants, and what it costs him. There is little here for a ruler to buy, and a great deal to wait for."
 ZIN_MISTAKE_SEAT:0 "Furviatlon, seat of the Mistake."
 ZIN_MISTAKE_SERVE:0 "Those who serve:"
 ZIN_MISTAKE_TAB1:0 "The Presence"
 ZIN_MISTAKE_TITLE:0 "The Presence"
 zin_mistake.1.a:0 "The month turns."
 zin_mistake.3.a:0 "It is noted. The silence is part of the work."
 zin_mistake.3.desc:0 "The third order of his servants gave nothing, and no one in Aoaz can say why. The Presence does not thin. It waits."
 zin_mistake.3.t:0 "Silence Among the Divine"
 zin_mistake.30.a:0 "So it is."
 zin_mistake.30.desc:0 "The black hulls are seen among the islands again, and the dead are on the roads. The north stirs a second time."
 zin_mistake.30.t:0 "A Second Stirring"
 zin_mistake.4.a:0 "It is given less. It will be given again."
 zin_mistake.4.desc:0 "For reasons no one in Aoaz can name, one order of his servants gives less."
 zin_mistake.4.t:0 "A Service Falters"
 zin_mistake.5.a:0 "Then the work must be tended."
 zin_mistake.5.desc:0 "The Presence is faint. If it goes lower the hosts will stand down, and the north will be quiet in a way it has not been before."
 zin_mistake.5.t:0 "The Presence Thins"
 zin_mistake.6.a:0 "We wait."
 zin_mistake.6.desc:0 "The Presence has gone out of Aoaz for now. Whether he returns is not for us to know. The servants keep faith."
 zin_mistake.6.desc1:0 "The Presence has come back. It is faint, and it is there."
 zin_mistake.6.t:0 "The Presence Lapses"
 zin_mistake.7.a:0 "The month turns."
 zin_trait_kusven_grave_wind:0 "The Grave-Wind"
 zin_trait_kusven_grave_wind_desc:0 "Where he passes the breath goes out of the living, and the dead who follow him stand up straighter for it."
 zin_zol_bane:0 "The Bane of the Potent"
 zin_zol_bane_desc:0 "Weapons that carry old power can end what ordinary iron cannot. The dead press harder against those who bear them."
 zin_zol_bane_known:0 "The Bane Known"
 zin_zol_bane_known_desc:0 "The hosts have learned where the potent blades stand and how to meet them. The dead press less blindly."
 zin_zol_black_waste:0 "The Black Wastes"
 zin_zol_black_waste_desc:0 "Nothing grows and nothing is easy to cross. The dead walk it without hunger."
 zin_zol_call_the_rising:0 "The Dead Rise"
 zin_zol_call_the_rising_desc:0 "The dead are sent out of the north. The black hulls leave the islands, and the roads of the Mistake fill with ranks that do not tire."
 zin_zol_call_upon_divine:0 "Call Upon the Divine"
 zin_zol_call_upon_divine_desc:0 "The third order is asked for more. It is the least certain, and it answers less often than it should."
 zin_zol_call_upon_great:0 "Call Upon the Great"
 zin_zol_call_upon_great_desc:0 "The first order of his servants is asked for more. They answer, or they do not, and no one in Aoaz can say why."
 zin_zol_call_upon_lesser:0 "Call Upon the Lesser"
 zin_zol_call_upon_lesser_desc:0 "The second order is asked for more, as it has been asked before."
 zin_zol_deathfield:0 "The Land Made Waste"
 zin_zol_deathfield_desc:0 "Where the form stood, the land is dead for years: the soil gives nothing, and nothing wants to stay."
 zin_zol_forewarned:0 "Forewarned of Black Ships"
 zin_zol_forewarned_desc:0 "Someone sent a ship to look when the fishermen spoke of black hulls. The crown that did so has not been surprised since."
 zin_zol_host_tt:0 "A host of the dead is raised in fifteen days."
 zin_zol_kusven_in_field:0 "Kusven Takes the Field"
 zin_zol_kusven_in_field_desc:0 "Kusven, Zol's most loyal servant, has come out of the black north and leads the dead himself. The hosts that march with him do not waver, and the Presence pays every week to keep him there."
 zin_zol_kusven_wounded:0 "The Servant Wounded"
 zin_zol_kusven_wounded_desc:0 "Kusven has gone back into the dark of the Mistake with a wound that a shard of the blue sword gave him. He was not slain, but the hosts feel his absence in every rank."
 zin_zol_presence:0 "The Presence"
 zin_zol_presence_desc:0 "How much of the Old God's presence can act in Aoaz. Not his whole power, which no one has measured."
 zin_zol_raise_a_host:0 "Raise a Host"
 zin_zol_raise_a_host_desc:0 "A host of the dead stands up where the black ground is thickest. It needs two hundred of the living to fill it and a thousand bonds to hold it, and it does not tire."
 zin_zol_second_stirring:0 "A Second Stirring"
 zin_zol_second_stirring_desc:0 "The age turns. The dead are called out of the north again."
 zin_zol_send_kusven_decision:0 "Send the Servant"
 zin_zol_send_kusven_decision_desc:0 "His most loyal servant will go out of the black north and take the field himself. What the Presence spends to keep him there is not given back."
 zin_zol_shadow_on_the_land:0 "A Shadow on the Land of [FROM.GetName]"
 zin_zol_shadow_on_the_land_desc:0 "A shadow comes down on a neighbour's fields. The people there lose heart and no one can say why."
 zin_zol_stillness_before_the_form:0 "Stillness Before the Form"
 zin_zol_stillness_before_the_form_desc:0 "The hosts stand still and the islands hold their breath. The Convergence deepens."
 zin_zol_tend_the_presence:0 "Tend the Presence"
 zin_zol_tend_the_presence_desc:0 "The servants sustain him as they have always done. A ruler who attends the work adds a little to what they bring."
 zin_zol_the_dead_endure:0 "The Dead Endure"
 zin_zol_the_dead_endure_desc:0 "A breath of the Old God's will goes through the host. Broken ranks stand and the fallen rise."
 zin_zol_the_dormancy:0 "The Dormancy"
 zin_zol_the_dormancy_desc:0 "The north is quiet, as it has been for an age. The dead stir in the islands and the living do not hear."
 zin_zol_the_form_endures:0 "The Servant Holds the Field"
 zin_zol_the_form_endures_desc:0 "Kusven can stand on the field for a few weeks and no longer. When the weeks are out he goes back into the dark of the north."
 zin_zol_the_rising:0 "The Rising"
 zin_zol_the_rising_desc:0 "The dead have come out of the north. Nothing the living have built was made for them."
 zin_zol_wake_an_island:0 "Wake an Island"
 zin_zol_wake_an_island_desc:0 "One of the black islands of the Kusmeel is told to stir. Fishermen will see lights there that are not fires, and some will say so."
 zin_zol_wake_tt:0 "The island stirs in thirty days."
 zin_zol_without_a_body:0 "Without a Body"
 zin_zol_without_a_body_desc:0 "The Old God has no body in Aoaz and cannot take one. What he commands, he commands from the dark, through those who serve."
