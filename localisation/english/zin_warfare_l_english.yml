 zin_grave_arms_equipment_2_desc:0 "Arms edged with bone and bound by deeper rites."
 zin_grave_arms_equipment_2_short:0 "Bone-Edged Arms"
 zin_grave_arms_equipment_desc:0 "Rusted blades and bone-edged spears bound to the dead by rite."
 zin_grave_arms_equipment_short:0 "Grave Arms"
 zin_great_spirit:0 "A Great Spirit"
 zin_great_spirit_desc:0 "A great spirit bound to the host, old and mighty. Its coming steadies the dark ranks."
