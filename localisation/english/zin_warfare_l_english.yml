 zin_grave_arms_equipment_0_desc:0 "Old blades, taken from the barrows and bound again."
 zin_grave_arms_equipment_0_short:0 "Grave Blades"
 zin_grave_arms_equipment_1:0 "Rimed Blades"
 zin_grave_arms_equipment_1_desc:0 "Blades rimed with grave-frost, cold in the hand."
 zin_grave_arms_equipment_1_short:0 "Rimed Blades"
