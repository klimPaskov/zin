 zin_griffin_equipment_2_desc:0 "Griffins and riders trained to charge with lances."
 zin_griffin_equipment_2_short:0 "Lance Griffins"
 zin_griffin_equipment_desc:0 "Bred griffins trained to carry a rider and fight in the air."
