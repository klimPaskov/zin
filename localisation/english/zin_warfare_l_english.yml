 zin_catapult_equipment_1_desc:0 "Twisted-cord engines that throw a heavy stone."
 zin_catapult_equipment_1_short:0 "Torsion Catapults"
 zin_catapult_equipment_2:0 "Great Catapults"
 zin_catapult_equipment_2_desc:0 "Engines of the great pattern, with long arms and iron frames."
 zin_catapult_equipment_2_short:0 "Great Catapults"
 zin_catapult_equipment_3:0 "Master Catapults"
 zin_catapult_equipment_3_desc:0 "The best engines the lodges can build."
 zin_catapult_equipment_3_short:0 "Master Catapults"
 zin_catapult_equipment_desc:0 "Torsion catapults that throw stone shot and fire-pots."
 zin_catapult_equipment_short:0 "Catapults"
 zin_dead_grave_riders:0 "Grave Riders"
 zin_dead_grave_riders_desc:0 "Dead horsemen on dead horses, silent and quick. They hunt down what flees the Grave Host."
 zin_dead_necromancers:0 "Necromantic Order"
 zin_dead_necromancers_desc:0 "Robed adepts who keep the Grave Host standing. Where they walk, fewer of the fallen stay down."
 zin_deathless_equipment:0 "Deathless Bonds"
 zin_deathless_equipment_0:0 "Bonds of the First Tide"
 zin_deathless_equipment_0_desc:0 "The first tide of the Mistake's power."
 zin_deathless_equipment_0_short:0 "Bonds of the First Tide"
 zin_deathless_equipment_1:0 "Bonds of the Second Tide"
 zin_deathless_equipment_1_desc:0 "A stronger tide, a firmer hold."
 zin_deathless_equipment_1_short:0 "Bonds of the Second Tide"
 zin_deathless_equipment_2:0 "Bonds of the Third Tide"
 zin_deathless_equipment_2_desc:0 "The third tide, at its height."
 zin_deathless_equipment_2_short:0 "Bonds of the Third Tide"
 zin_deathless_equipment_desc:0 "The will that holds a fallen body upright. Zol's alone; it cannot be made, only given."
 zin_deathless_equipment_short:0 "Deathless Bonds"
 zin_demons_bound:0 "Bound Host"
 zin_demons_bound_desc:0 "Demons held to a service they cannot refuse. What binds them is not told."
 zin_demons_netherborn:0 "Netherborn"
 zin_demons_netherborn_desc:0 "Demons of the deep halls, quick and cruel. Heat does not trouble them; frost does."
 zin_demons_shachihata:0 "Shachihata"
 zin_demons_shachihata_desc:0 "A great demon of fire and horn, rare beyond counting. No realm can make one; a realm can only be given one."
 zin_dragon_equipment:0 "Dragons"
 zin_dragon_equipment_0:0 "A Dragon"
 zin_dragon_equipment_0_desc:0 "A dragon of the old mountain."
 zin_dragon_equipment_0_short:0 "A Dragon"
 zin_dragon_equipment_desc:0 "A dragon of the old mountain, lent to a realm by pact. It cannot be built, bought or replaced."
 zin_dragon_equipment_short:0 "Dragons"
 zin_elven_arms_equipment:0 "Elven Arms"
 zin_elven_arms_equipment_0:0 "Elven Blades"
 zin_elven_arms_equipment_0_desc:0 "Blades and bows of an older craft."
 zin_elven_arms_equipment_0_short:0 "Elven Blades"
 zin_elven_arms_equipment_1:0 "Leaf-Edged Arms"
 zin_elven_arms_equipment_1_desc:0 "Long blades and longbows, thin and bright."
 zin_elven_arms_equipment_1_short:0 "Leaf-Edged Arms"
 zin_elven_arms_equipment_2:0 "Leaf-Forged Arms"
 zin_elven_arms_equipment_2_desc:0 "Arms forged under the trees, a song to each blade."
 zin_elven_arms_equipment_2_short:0 "Leaf-Forged Arms"
 zin_elven_arms_equipment_3:0 "Song-Forged Arms"
 zin_elven_arms_equipment_3_desc:0 "Arms whose edge was sung, not hammered."
 zin_elven_arms_equipment_3_short:0 "Song-Forged Arms"
 zin_elven_arms_equipment_desc:0 "Swords, spears and longbows of the elven smiths, light and keen."
 zin_elven_arms_equipment_short:0 "Elven Arms"
 zin_elves_archers:0 "Elven Archers"
 zin_elves_archers_desc:0 "Longbowmen whose arrows fly farther and truer than any mortal bow. They shoot until dusk and rarely miss."
 zin_elves_rangers:0 "Forest Rangers"
 zin_elves_rangers_desc:0 "Elven scouts and snipers who live among the trees for years at a time."
 zin_elves_riders:0 "Elven Riders"
 zin_elves_riders_desc:0 "Light riders on tall steeds who move through the forest without a sound."
 zin_elves_warden:0 "Elven Wardens"
 zin_elves_warden_desc:0 "Swordsmen of the old forests, long trained and slow to tire. Under the trees they are very hard to dislodge."
 zin_elves_wardsingers:0 "Wardsingers"
 zin_elves_wardsingers_desc:0 "Elven singers who weave the old wards into song. The host that hears them fights with a steadier heart."
 zin_ent_grove_equipment:0 "Grove Wardings"
 zin_ent_grove_equipment_0:0 "Grove Wardings"
 zin_ent_grove_equipment_0_desc:0 "The moot's old wardings, cut into bark and root."
 zin_ent_grove_equipment_0_short:0 "Grove Wardings"
 zin_ent_grove_equipment_1:0 "Deep Roots"
 zin_ent_grove_equipment_1_desc:0 "Wardings that reach down to the old rock."
 zin_ent_grove_equipment_1_short:0 "Deep Roots"
 zin_ent_grove_equipment_2:0 "Heartwood"
 zin_ent_grove_equipment_2_desc:0 "Wardings sung into the heartwood itself."
 zin_ent_grove_equipment_2_short:0 "Heartwood"
 zin_ent_grove_equipment_desc:0 "The care of the moot: bark, sap and stone that keep an ent whole."
 zin_ent_grove_equipment_short:0 "Grove Wardings"
 zin_ents_grove:0 "Ent Grove"
 zin_ents_grove_desc:0 "Ancient tree-folk, slow to rouse and very hard to break. In their forests they are nearly unbeatable."
 zin_giant_gear_equipment:0 "Giant Gear"
 zin_giant_gear_equipment_0:0 "Great Weapons"
 zin_giant_gear_equipment_0_desc:0 "Tree-trunk clubs, great axes and slings of rope."
 zin_giant_gear_equipment_0_short:0 "Great Weapons"
 zin_giant_gear_equipment_1:0 "Giant Harness"
 zin_giant_gear_equipment_1_desc:0 "Plates and straps made for a giant's reach."
 zin_giant_gear_equipment_1_short:0 "Giant Harness"
 zin_giant_gear_equipment_2:0 "Giant War-Gear"
 zin_giant_gear_equipment_2_desc:0 "The heavy gear of the oldest giant houses."
 zin_giant_gear_equipment_2_short:0 "Giant War-Gear"
 zin_giant_gear_equipment_desc:0 "Great weapons, slings and straps sized for giants."
 zin_giant_gear_equipment_short:0 "Giant Gear"
 zin_giants_host:0 "Giant Host"
 zin_giants_host_desc:0 "Giants of the hills and the ice, each worth a company of men. A few of them can hold a pass."
 zin_giants_hurlers:0 "Giant Hurlers"
 zin_giants_hurlers_desc:0 "Giants who throw boulders and felled trees. They need no engine and no crew."
 zin_glo_bearer:0 "The Bearer of Glo"
 zin_glo_bearer_desc:0 "One who carries Glo, the great light. Where the bearer stands, the dead cannot."
 zin_glo_blade_equipment:0 "The Bearer of Glo"
 zin_glo_blade_equipment_0:0 "Glo, Whole"
 zin_glo_blade_equipment_0_desc:0 "The light of Glo at its full strength."
 zin_glo_blade_equipment_0_short:0 "Glo, Whole"
 zin_glo_blade_equipment_desc:0 "The great light, carried in a bearer's hand. It cannot be made or traded."
 zin_glo_blade_equipment_shard:0 "Glo, Shard"
 zin_glo_blade_equipment_shard_desc:0 "What the light keeps after the blade was broken. It still wounds the greatest of the dead."
 zin_glo_blade_equipment_shard_short:0 "Glo, Shard"
 zin_glo_blade_equipment_short:0 "The Bearer of Glo"
 zin_grave_arms_equipment:0 "Grave Arms"
