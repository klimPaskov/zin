 zin_hull_raider_0_desc:0 "A low, dark ship with oars for the calm and a single sail for the long run."
 zin_hull_raider_0_short:0 "Corsair Craft"
 zin_hull_raider_1:0 "Black-Hulled Corsair"
 zin_hull_raider_1_desc:0 "A corsair tarred and sheathed to run unseen."
 zin_hull_raider_1_short:0 "Black-Hulled Corsair"
 zin_hull_raider_desc:0 "Raider Hull"
 zin_hull_raider_short:0 "Raider Hull"
 zin_hull_warship:0 "Warship Hull"
 zin_hull_warship_0:0 "Sailing Warship"
 zin_hull_warship_0_desc:0 "A tall three-masted ship with ballista decks fore and aft."
 zin_hull_warship_0_short:0 "Sailing Warship"
 zin_hull_warship_1:0 "High-Castled Warship"
 zin_hull_warship_1_desc:0 "A warship with raised castles from which engines can throw stone."
 zin_hull_warship_1_short:0 "High-Castled Warship"
 zin_hull_warship_2:0 "Master-Built Warship"
 zin_hull_warship_2_desc:0 "A warship of the best timbers and the best joinery."
 zin_hull_warship_2_short:0 "Master-Built Warship"
 zin_hull_warship_desc:0 "Warship Hull"
 zin_hull_warship_short:0 "Warship Hull"
 zin_men_archers:0 "Archers"
 zin_men_archers_desc:0 "Bowmen and crossbowmen who shoot over the shields of the foot. Their volleys wear down a host before it closes."
 zin_men_camel_riders:0 "Camel Riders"
 zin_men_camel_riders_desc:0 "Desert warriors on camels, at home on sand and salt flats, ill at ease in forest and marsh."
 zin_men_cavalry:0 "Cavalry"
 zin_men_cavalry_desc:0 "Riders with lance and sword on strong horses. They strike the flank and run down the broken."
 zin_men_heavy_infantry:0 "Heavy Infantry"
 zin_men_heavy_infantry_desc:0 "Foot in mail and plate who hold the line where others give way. Slow, costly and hard to kill."
 zin_men_hill_companies:0 "Hill Companies"
 zin_men_hill_companies_desc:0 "Mountain-bred spearmen who fight best on slopes and passes, and who know every goat track."
 zin_men_horse_archers:0 "Horse Archers"
 zin_men_horse_archers_desc:0 "Riders who shoot at the gallop, as on the steppe. They wheel, loose and wheel again."
 zin_men_infantry:0 "Line Infantry"
 zin_men_infantry_desc:0 "Trained spearmen and swordsmen in good iron, the core of every host of men."
 zin_men_knights:0 "Knights"
 zin_men_knights_desc:0 "Mailed riders on war horses. Their charge breaks lines, but they founder in woods, marsh and streets."
 zin_men_levy:0 "Levy"
 zin_men_levy_desc:0 "Farmers and townsmen called out with spears and clubs. They come cheap, they come fast, and they break first."
 zin_men_rangers:0 "Rangers"
 zin_men_rangers_desc:0 "Bowmen of the woods and hills who shoot from cover and vanish. Selen's rangers are the model."
 zin_men_sea_soldiers:0 "Sea Soldiers"
 zin_men_sea_soldiers_desc:0 "Shipborne spears and boarding axes. They land from cogs and galleys and take a beach before the defenders form."
 zin_men_temple_wardens:0 "Valley Wardens"
 zin_men_temple_wardens_desc:0 "The sworn guard of the Zilin valleys, in plain grey with iron caps. They keep the roads and the pilgrim houses."
 zin_mod_archers_deck:0 "Archers' Deck"
 zin_mod_archers_deck_desc:0 "A fighting platform for bowmen, who clear a deck and sweep the sky."
 zin_mod_archers_deck_short:0 "Archers' Deck"
 zin_mod_ballista_battery:0 "Ballista Rack"
 zin_mod_ballista_battery_desc:0 "A rack of great bolt-throwers along the rail."
 zin_mod_ballista_battery_short:0 "Ballista Rack"
 zin_mod_black_sails:0 "Black Sails"
 zin_mod_black_sails_desc:0 "Black sails that fill without wind. No oarsmen are needed."
 zin_mod_black_sails_short:0 "Black Sails"
 zin_mod_boarding_party:0 "Boarding Party"
 zin_mod_boarding_party_desc:0 "Sea soldiers with grapnels and axes, ready to board or to land."
 zin_mod_boarding_party_short:0 "Boarding Party"
 zin_mod_bronze_sheathing:0 "Bronze Sheathing"
 zin_mod_bronze_sheathing_desc:0 "Bronze plates below the waterline and over the bow."
 zin_mod_bronze_sheathing_short:0 "Bronze Sheathing"
 zin_mod_catapult_deck:0 "Catapult Deck"
 zin_mod_catapult_deck_desc:0 "A raised deck with torsion catapults that throw stone and fire."
 zin_mod_catapult_deck_short:0 "Catapult Deck"
 zin_mod_elven_sails:0 "Elven Sails"
 zin_mod_elven_sails_desc:0 "Sails woven by elven hands that catch the lightest air."
 zin_mod_elven_sails_short:0 "Elven Sails"
 zin_mod_fire_pots:0 "Fire-Pots"
 zin_mod_fire_pots_desc:0 "Clay pots of pitch and tar hurled onto an enemy deck."
 zin_mod_fire_pots_short:0 "Fire-Pots"
 zin_mod_lookouts:0 "Lookouts"
 zin_mod_lookouts_desc:0 "Sharp-eyed watchers in the masthead and the bow."
 zin_mod_lookouts_short:0 "Lookouts"
 zin_mod_oars:0 "Oars"
 zin_mod_oars_and_sail:0 "Oars and Sail"
 zin_mod_oars_and_sail_desc:0 "A sail for the open sea and oars for the harbour."
 zin_mod_oars_and_sail_short:0 "Oars and Sail"
 zin_mod_oars_desc:0 "Banks of oars. Quick and handy in a calm, short in range."
 zin_mod_oars_short:0 "Oars"
 zin_mod_planking:0 "Planking"
 zin_mod_planking_desc:0 "Plain oak planking, the baseline of every ship."
 zin_mod_planking_short:0 "Planking"
 zin_mod_ram:0 "Ram"
 zin_mod_ram_desc:0 "An iron-shod beak at the waterline. It does its worst in the first clash."
 zin_mod_ram_short:0 "Ram"
 zin_mod_rowers_benches:0 "Rowers' Benches"
 zin_mod_rowers_benches_desc:0 "More benches and more rowers, for speed at the cost of room below."
 zin_mod_rowers_benches_short:0 "Rowers' Benches"
 zin_mod_sails:0 "Sails"
 zin_mod_sails_desc:0 "Masts, yards and sailcloth. The wind carries a ship a long way."
 zin_mod_sails_short:0 "Sails"
 zin_mod_warded_hull:0 "Warded Hull"
 zin_mod_warded_hull_desc:0 "Wards painted on the hull and lanterns on the rail. Boarders of the dead find it hard to climb aboard."
 zin_mod_warded_hull_short:0 "Warded Hull"
 zin_mounts_equipment:0 "War Mounts"
 zin_mounts_equipment_0:0 "Riding Horses"
 zin_mounts_equipment_0_desc:0 "Sound riding horses and steady camels."
 zin_mounts_equipment_0_short:0 "Riding Horses"
 zin_mounts_equipment_1:0 "War Horses"
 zin_mounts_equipment_1_desc:0 "Heavy horses bred to carry a mailed rider."
 zin_mounts_equipment_1_short:0 "War Horses"
 zin_mounts_equipment_2:0 "Great Studs"
 zin_mounts_equipment_2_desc:0 "Stud-bred stallions of great size and nerve."
 zin_mounts_equipment_2_short:0 "Great Studs"
 zin_mounts_equipment_3:0 "Plains Destriers"
 zin_mounts_equipment_3_desc:0 "The great horses of the plains, fast and tireless."
 zin_mounts_equipment_3_short:0 "Plains Destriers"
 zin_mounts_equipment_desc:0 "Horses, camels and other beasts trained to carry a rider into battle."
 zin_mounts_equipment_short:0 "War Mounts"
 zin_nether_arms_equipment:0 "Nether Arms"
 zin_nether_arms_equipment_0:0 "Nether Blades"
 zin_nether_arms_equipment_0_desc:0 "Hooked blades from the deep halls."
 zin_nether_arms_equipment_0_short:0 "Nether Blades"
 zin_nether_arms_equipment_1:0 "Black Iron Arms"
 zin_nether_arms_equipment_1_desc:0 "Arms of black iron, hard and cold."
 zin_nether_arms_equipment_1_short:0 "Black Iron Arms"
 zin_nether_arms_equipment_2:0 "Nether-Forged Arms"
 zin_nether_arms_equipment_2_desc:0 "Arms forged where the flame burns cold."
 zin_nether_arms_equipment_2_short:0 "Nether-Forged Arms"
 zin_nether_arms_equipment_desc:0 "Black iron blades and hooked spears from the deep forges."
 zin_nether_arms_equipment_short:0 "Nether Arms"
 zin_ogre_gear_equipment:0 "Ogre Gear"
 zin_ogre_gear_equipment_0:0 "Ogre Clubs"
 zin_ogre_gear_equipment_0_desc:0 "Iron-bound clubs and heaps of chain."
 zin_ogre_gear_equipment_0_short:0 "Ogre Clubs"
 zin_ogre_gear_equipment_1:0 "Ogre Harness"
 zin_ogre_gear_equipment_1_desc:0 "Chain and plate riveted to fit an ogre."
 zin_ogre_gear_equipment_1_short:0 "Ogre Harness"
 zin_ogre_gear_equipment_2:0 "Ogre War-Plate"
 zin_ogre_gear_equipment_2_desc:0 "Thick plate made in the orc forges."
 zin_ogre_gear_equipment_2_short:0 "Ogre War-Plate"
 zin_ogre_gear_equipment_desc:0 "Great iron-bound clubs and chain for ogres."
 zin_ogre_gear_equipment_short:0 "Ogre Gear"
 zin_ogres_brutes:0 "Ogre Brutes"
 zin_ogres_brutes_desc:0 "Hulking ogres with clubs of iron-bound oak. Spears barely mark them."
 ZIN_OPERATIVE_CODENAME_THEME:0 "Agents of the Courts"
 zin_orcs_goblins:0 "Goblin Skirmishers"
 zin_orcs_goblins_desc:0 "Swarms of small, quick slingers and trappers. They harass, steal and run."
 zin_orcs_raiders:0 "Orc Raiders"
 zin_orcs_raiders_desc:0 "Orc riders on shaggy mounts that no one else will ride. They burn farms and are gone by morning."
 zin_orcs_warrior:0 "Orc Warband"
 zin_orcs_warrior_desc:0 "A warband under one chief, fierce in the first rush and fiercer at night. They need little training and less pay."
 zin_scorpion_equipment:0 "Scorpions"
 zin_scorpion_equipment_0:0 "Scorpions"
 zin_scorpion_equipment_0_desc:0 "Swivel bolt-throwers that watch the sky."
 zin_scorpion_equipment_0_short:0 "Scorpions"
 zin_scorpion_equipment_1:0 "Master Scorpions"
 zin_scorpion_equipment_1_desc:0 "Scorpions with a longer reach and a steadier aim."
 zin_scorpion_equipment_1_short:0 "Master Scorpions"
 zin_scorpion_equipment_desc:0 "Light bolt-throwers on wheeled frames, set to shoot upward."
 zin_scorpion_equipment_short:0 "Scorpions"
 zin_shachihata_equipment:0 "Shachihata"
 zin_shachihata_equipment_0:0 "A Shachihata"
 zin_shachihata_equipment_0_desc:0 "A great demon of fire and horn."
 zin_shachihata_equipment_0_short:0 "A Shachihata"
 zin_shachihata_equipment_desc:0 "A great demon of fire and horn. It cannot be made; it can only be given."
 zin_shachihata_equipment_short:0 "Shachihata"
 zin_ship_galley:0 "War Galley"
 zin_ship_galley_desc:0 "A fast oared ship with a ram. It screens the fleet and runs down what it catches."
 zin_ship_great_warship:0 "Great Warship"
 zin_ship_great_warship_desc:0 "A towering ship with castles fore and aft. Few realms can build more than one."
 zin_ship_raider:0 "Corsair"
 zin_ship_raider_desc:0 "A low, dark ship that creeps up on merchant fleets and strikes by night."
 zin_ship_warship:0 "Warship"
 zin_ship_warship_desc:0 "A tall sailing ship with bolt-throwers on her decks, the strength of any fleet."
 zin_siege_catapult:0 "Catapults"
 zin_siege_catapult_desc:0 "Torsion catapults throwing stone. They batter walls and break up massed ranks."
 zin_siege_trebuchet:0 "Trebuchets"
 zin_siege_trebuchet_desc:0 "Counterweight trebuchets that throw a great weight a long way. Slow to bring up, terrible against stone."
 zin_sun_elves_bowmen:0 "Sun Bowmen"
 zin_sun_elves_bowmen_desc:0 "Sunhot archers whose great bows throw arrows like spears."
 zin_sun_elves_guard:0 "Sun Guard"
 zin_sun_elves_guard_desc:0 "Sunhot guardsmen over three metres tall, armoured in gilt bronze. Few in number and enormous in weight."
 zin_support_armourers:0 "Armourers"
 zin_support_armourers_desc:0 "Smiths with portable forges who mend broken gear and strip the fallen."
 zin_support_ballistae:0 "Ballista Company"
 zin_support_ballistae_desc:0 "Great bolt-throwers that pierce the hides of monsters and the plate of knights."
 zin_support_catapults:0 "Catapult Company"
 zin_support_catapults_desc:0 "A few light catapults that follow the host and answer its needs."
 zin_support_healers:0 "Field Healers"
 zin_support_healers_desc:0 "Surgeons and herb-wives who tend the wounded behind the line. Fewer men die, and more come back."
 zin_support_heralds:0 "Heralds and Beacons"
 zin_support_heralds_desc:0 "Horn-blowers, banner-bearers and beacon crews. Orders arrive sooner and the host moves as one."
 zin_support_pack_train:0 "Pack Train Company"
 zin_support_pack_train_desc:0 "Mule strings and pack carts that serve the depots. No host takes them to the field."
 zin_support_provosts:0 "Provosts"
 zin_support_provosts_desc:0 "Sworn marshals who keep order in the rear and the peace in a conquered town."
 zin_support_quartermasters:0 "Quartermasters"
 zin_support_quartermasters_desc:0 "Wagon-masters and storekeepers. A host that eats well marches farther."
 zin_support_sappers:0 "Sappers"
 zin_support_sappers_desc:0 "Masons and carpenters who dig trenches, build ladders and undermine walls."
 zin_support_scorpions:0 "Scorpion Company"
 zin_support_scorpions_desc:0 "Light bolt-throwers on wheeled frames. They keep winged things off the host."
 zin_support_scouts:0 "Scouts"
 zin_support_scouts_desc:0 "Light riders and woodsmen who ride ahead of the host. They tell the captain what lies beyond the next hill."
 zin_support_wardens:0 "Wardens"
 zin_support_wardens_desc:0 "Bearers of lantern-glass and hallowed tokens, who carry the old wards to the front. Ordinary iron cannot end the dead; their wards can."
 zin_the_dead_revenant:0 "Grave Host"
 zin_the_dead_revenant_desc:0 "The restless dead of the Ember Lands, raised in ranks. They cost little, tire never, and fade when carried far from home."
 zin_trebuchet_equipment:0 "Trebuchets"
 zin_trebuchet_equipment_0:0 "Counterweight Trebuchets"
 zin_trebuchet_equipment_0_desc:0 "A long arm, a sling and a box of stones."
 zin_trebuchet_equipment_0_short:0 "Counterweight Trebuchets"
 zin_trebuchet_equipment_1:0 "Great Trebuchets"
 zin_trebuchet_equipment_1_desc:0 "Trebuchets of the great pattern, with a heavier weight."
 zin_trebuchet_equipment_1_short:0 "Great Trebuchets"
 zin_trebuchet_equipment_2:0 "Master Trebuchets"
 zin_trebuchet_equipment_2_desc:0 "Engines that throw a stone through a curtain wall."
 zin_trebuchet_equipment_2_short:0 "Master Trebuchets"
 zin_trebuchet_equipment_desc:0 "Counterweight engines that throw a great stone a long way."
 zin_trebuchet_equipment_short:0 "Trebuchets"
 zin_troll_gear_equipment:0 "Troll Gear"
 zin_troll_gear_equipment_0:0 "Iron-Bound Clubs"
 zin_troll_gear_equipment_0_desc:0 "Great clubs of oak ringed with iron, and hide plates."
 zin_troll_gear_equipment_0_short:0 "Iron-Bound Clubs"
 zin_troll_gear_equipment_1:0 "Troll Harness"
 zin_troll_gear_equipment_1_desc:0 "Boiled hide and riveted plates on the troll frame."
 zin_troll_gear_equipment_1_short:0 "Troll Harness"
 zin_troll_gear_equipment_2:0 "Troll War-Plate"
 zin_troll_gear_equipment_2_desc:0 "Heavy plate beaten for the largest brood-lords."
 zin_troll_gear_equipment_2_short:0 "Troll War-Plate"
 zin_troll_gear_equipment_desc:0 "Iron-bound clubs and hide plates cut for troll limbs."
 zin_troll_gear_equipment_short:0 "Troll Gear"
 zin_trolls_brute:0 "Troll Brutes"
 zin_trolls_brute_desc:0 "Trolls with clubs and hide plates. They shrug off arrows and tear a shield wall apart."
 zin_upgrade_battery:0 "Heavier Bolts"
 zin_upgrade_battery_desc:0 "Heavier bolts and stronger engines, at some cost in speed."
 zin_upgrade_planking:0 "Thicker Planking"
 zin_upgrade_planking_desc:0 "Thicker oak over the vital places."
 zin_upgrade_ram:0 "Iron-Shod Prows"
 zin_upgrade_ram_desc:0 "Stronger prows that hit harder, and drag more."
 zin_upgrade_rigging:0 "Better Rigging"
 zin_upgrade_rigging_desc:0 "Cleaner lines and better cordage."
 zin_upgrade_seaworthiness:0 "Seaworthy Hulls"
 zin_upgrade_seaworthiness_desc:0 "Sturdier frames that stay sound in a gale."
 zin_volgan_presence:0 "Volgan Himself"
 zin_volgan_presence_desc:0 "The Lord of the Ember Lands rides with the host. His presence is felt in every rank."
 zin_volgan_presence_equipment:0 "Volgan's Presence"
 zin_volgan_presence_equipment_0:0 "Volgan's Presence"
 zin_volgan_presence_equipment_0_desc:0 "The Lord of the Ember Lands in the field."
 zin_volgan_presence_equipment_0_short:0 "Volgan's Presence"
 zin_volgan_presence_equipment_desc:0 "The Lord of the Ember Lands in the field. It cannot be made or traded."
 zin_volgan_presence_equipment_short:0 "Volgan's Presence"
 zin_ward_equipment:0 "Wards"
 zin_ward_equipment_0:0 "Lantern Glass"
 zin_ward_equipment_0_desc:0 "Glass lanterns that burn with a pale flame."
 zin_ward_equipment_0_short:0 "Lantern Glass"
 zin_ward_equipment_1:0 "Hallowed Tokens"
 zin_ward_equipment_1_desc:0 "Tokens blessed at the turn of the seasons."
 zin_ward_equipment_1_short:0 "Hallowed Tokens"
 zin_ward_equipment_2:0 "Close-Set Wards"
 zin_ward_equipment_2_desc:0 "Wards set so close that no gap opens between them."
 zin_ward_equipment_2_short:0 "Close-Set Wards"
 zin_ward_equipment_3:0 "Wards Against Death"
 zin_ward_equipment_3_desc:0 "The strongest wards the rites allow, bright enough to unmake what ought to lie still."
 zin_ward_equipment_3_short:0 "Wards Against Death"
 zin_ward_equipment_desc:0 "Lantern-glass, hallowed tokens and wardsong, carried to the front by those who know the rites."
 zin_ward_equipment_short:0 "Wards"
 zin_yeti_band:0 "Yeti Band"
 zin_yeti_band_desc:0 "Furred hunters of the frozen north, at home in snow and cold that would kill other folk."
 zin_yeti_gear_equipment:0 "Yeti Gear"
 zin_yeti_gear_equipment_0:0 "Bone and Hide"
 zin_yeti_gear_equipment_0_desc:0 "Spears of bone and plates of cured hide."
 zin_yeti_gear_equipment_0_short:0 "Bone and Hide"
 zin_yeti_gear_equipment_1:0 "Ice-Hardened Gear"
 zin_yeti_gear_equipment_1_desc:0 "Gear hardened in the deepest frost."
 zin_yeti_gear_equipment_1_short:0 "Ice-Hardened Gear"
 zin_yeti_gear_equipment_2:0 "Glacier Plate"
 zin_yeti_gear_equipment_2_desc:0 "Heavy plates beaten from cold iron."
 zin_yeti_gear_equipment_2_short:0 "Glacier Plate"
 zin_yeti_gear_equipment_desc:0 "Spears, clubs and bone plates of the frozen north."
 zin_yeti_gear_equipment_short:0 "Yeti Gear"
 zin_zol_deathless:0 "The Deathless"
 zin_zol_deathless_crews:0 "Black Ship Crews"
 zin_zol_deathless_crews_desc:0 "The silent crews of Zol's black ships. They need no food, and no rest."
 zin_zol_deathless_desc:0 "Shapes of the dead held together by Zol's will. Ordinary iron breaks them, but cannot end them."
 zin_zol_manifestation:0 "Zol Made Flesh"
 zin_zol_manifestation_desc:0 "Zol shows himself to the field. No one who has seen it will describe what they saw."
 zin_zol_manifestation_equipment:0 "Zol Made Flesh"
 zin_zol_manifestation_equipment_0:0 "Zol Made Flesh"
 zin_zol_manifestation_equipment_0_desc:0 "Zol shown to the field."
 zin_zol_manifestation_equipment_0_short:0 "Zol Made Flesh"
 zin_zol_manifestation_equipment_desc:0 "Zol shown to the field. It cannot be made, traded or kept."
 zin_zol_manifestation_equipment_short:0 "Zol Made Flesh"
