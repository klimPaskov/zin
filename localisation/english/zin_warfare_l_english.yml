 zin_bows_equipment_0_desc:0 "Short bows of ash and horn."
 zin_bows_equipment_0_short:0 "Hunting Bows"
 zin_bows_equipment_1:0 "Composite Bows"
 zin_bows_equipment_1_desc:0 "Bows of horn, wood and sinew, glued in layers."
 zin_bows_equipment_1_short:0 "Composite Bows"
