 zin_bows_equipment_3:0 "Crossbows"
 zin_bows_equipment_3_desc:0 "Bows on stocks that throw a heavy bolt through mail."
 zin_bows_equipment_3_short:0 "Crossbows"
 zin_bows_equipment_4:0 "Windlass Crossbows"
 zin_bows_equipment_4_desc:0 "Crossbows spanned with a windlass, slow to load and very strong."
