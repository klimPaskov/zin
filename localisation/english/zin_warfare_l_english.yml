 zin_arms_equipment_3:0 "Pattern-Welded Blades"
 zin_arms_equipment_3_desc:0 "Twisted rods forged into one blade, strong and supple."
 zin_arms_equipment_3_short:0 "Pattern-Welded Blades"
 zin_arms_equipment_4:0 "Master-Forged Arms"
 zin_arms_equipment_4_desc:0 "Arms from the great forges, made to a master's pattern."
 zin_arms_equipment_4_short:0 "Master-Forged Arms"
 zin_arms_equipment_5:0 "Mountain-Iron Arms"
 zin_arms_equipment_5_desc:0 "Blades of the hard iron of the high mines."
 zin_arms_equipment_5_short:0 "Mountain-Iron Arms"
 zin_arms_equipment_desc:0 "Spears, swords, axes and shields, forged by the smiths of every realm."
 zin_arms_equipment_short:0 "Arms"
