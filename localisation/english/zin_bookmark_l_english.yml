l_english:
 ZIN_BOOKMARK_FOURTH_AGE_DESC:0 "Aoaz has known peace for more than seventeen centuries. In Parim the Golden King feasts while his offices are sold, the temples of the Deliverer are full, and trade crosses the wide central sea. In the north fishermen tell of black ships among the isles; in the south Mirolon's scouts watch the storms. Nobody who matters is at war. Not yet.\n\nEvery realm on the map can be played. Under the rule The Shape of the Age the start may differ a little from the chronicle: a ruler's temper, an old feud, a disputed valley."
 ZIN_BOOKMARK_FOURTH_AGE_NAME:0 "The Fourth Age"
 ZIN_FOURTH_AGE_DESC_ADEL:0 "About three hundred thousand people live on Adel island and its districts under the chart-house league. Whoever sits in the Chart Hall decides which crown gets the newest chart, and in a world at peace the Speaker sells to the highest bidder.\n\nFounded 4A 388. Banner: A long tapered sounding lead hanging on its line, in lead grey and chart white on deep ink blue."
 ZIN_FOURTH_AGE_DESC_AENOR:0 "Aenor in 4A 1748 is rich, crowded and badly ruled. The Golden King, in the nineteenth year of his reign, sells offices, spends the treasury on the Golden Court and leads the Lost Cause in parades, while the Royal Council under Merovan, Keeper of the Seals, and the institutions of seventeen centuries keep the granaries full and the roads open.\n\nFounded 1A 1. Banner: A spread cloak, black outside and red within, hanging open from a gold crown-shaped clasp at its throat, on a field of lake blue."
 ZIN_FOURTH_AGE_DESC_ALERHIA:0 "In the twelfth Rising of Alerh Kerseus, Alerhia rules the great river valley on the rift from Porrenva, a stair-city of 160,000 at the end of the Gold Road. It is an old crown in its own right, neutral between Noris and Stabilo, rich in grain and scribes, and it looks across the Rift Narrows at the elven shore its kings have traded with for three ages.\n\nBanner: A white stair of five steps climbing from the lower hoist toward the upper fly, with a narrow river-king's crown resting on the top step, on river blue."
 ZIN_FOURTH_AGE_DESC_ANDOS_ENDA:0 "Andos Enda in 4A 1748 is a federation of lake groves of some 50,000 elves under Speaker Andosiel, courted by Lerendor, whose Leren Compact it has so far declined, and bound to Herrodon by an old quarrel. Its boats carry the letters between Sonargur and the elven realms, and its Water-Court judges weirs, boats and the Boundary Groves.\n\nFounded 1A 480. Banner: A slender lake-boat with a tall curled prow, seen from the side and empty, in water silver on lake teal: the Court-Boat of Enliras."
 ZIN_FOURTH_AGE_DESC_BLACKTON:0 "About two hundred thousand people of mixed Dondric and Leren blood live in the five walled harbour towns of the eastern coast. Blackton sells Dondor's iron to the North, keeps out of the Accord's wars where it can, and argues about its charter.\n\nFounded 4A 1102. Banner: The Empty Seat: a tall-backed high seat, empty, in white on black, with a sea-green hem."
 ZIN_FOURTH_AGE_DESC_BLOODY_FOREST:0 "The Bloody Forest in 4A 1748 is a clan moot of some 90,000 Redbark under their cord-mothers, outside the Concord and against it. They hunt red deer and boar, dye leather, smuggle along the Organ Coast Road and raid the Selen edge when the moot's war-chief needs a name.\n\nFounded 1A 1. Banner: A red oak leaf, stem upward, letting fall one red drop, on black."
 ZIN_FOURTH_AGE_DESC_BORDON:0 "About fifty thousand orcs of the Iron Clans keep the Black Road and its caravan inns. Bordon is a separate hold that belongs to nobody, takes Volgan's gifts and Goldoroth's threats with the same grin, and knows exactly where the Troll Forest begins.\n\nFounded 3A 700. Banner: Kargesk's Horn: a great curved black war-horn bound with two red bands, on a dust-ochre field with a red hem."
 ZIN_FOURTH_AGE_DESC_BULDOR:0 "About six hundred and twenty thousand people live south of the Fog and Eye range, with Toples and the dye-town of Sarudon. Buldor's companies and powder-men hire out to the highest bidder, and Aenor's envoys know the price of every banner.\n\nFounded 2A 1100. Banner: A white swallow-tailed pennon on its staff, seamed down its length with a black stitch, on grey."
 ZIN_FOURTH_AGE_DESC_BURRIKKRIT:0 "Burrikkrit in 4A 1748 is a warren-kingdom of some 75,000 goblins and 10,000 hobgoblins under King Dwibrik, outside the Concord and inside the dwarves' range, held to the Lamp Truce. Its goblins mine, trap and trade salvage at the edges, ride wurghs on the southern roads and make crude powder for the fire-pots they throw in tunnels; its under-roads are the one way through the range that nobody else knows in full.\n\nFounded 3A 38. Banner: A shuttered iron lantern with one shutter open on a yellow light, on dark red-brown."
 ZIN_FOURTH_AGE_DESC_COLDOR:0 "Queen Vaestia rules some eight hundred thousand people from the Frost-Hall, the strongest crown of the north and the least warlike, whose real power is the bread in its granaries and the grain bought each summer over the Neck Road.\n\nFounded 4A 850. Banner: The Ember-Horn: a curved horn bound with bronze bands, mouth upward, with a single red coal glowing at its mouth, gold and red on a deep night-blue field, with a white hem of square hearth-stones."
 ZIN_FOURTH_AGE_DESC_COROGON:0 "About nine hundred and fifty thousand people live on the Corogon Peninsula, its highlands and the Papz Swamp under a consulate of merchant houses. Corogon fears the corsairs, trades with Aenor and resents its tariffs, and its highland towns have a story about Gwilid, the forgetful wizard, for every inn.\n\nFounded 1A 240. Banner: A rolled letter tied with red cord under an unbroken black seal, on blue over white."
 ZIN_FOURTH_AGE_DESC_CURSED_LANDS:0 "The Cursed Lands in 4A 1748 are a council of cord-mothers over some 40,000 Veiled on sour grey badlands, outside the Concord and against it. They speak Orran among themselves, count the years by the ties of the eldest cord, and trade roots and mushrooms at the downs' edge for iron and salt.\n\nFounded 1A 1. Banner: A grey cord hanging in a loop, tied in one black knot, on sour grey-green."
 ZIN_FOURTH_AGE_DESC_DOLON:0 "Queen Zhorith rules the salt coast of the island from Unzeky, perhaps 1,200 demons over some 36,000 thralls and labourers. Dolon is the forge of the Southern Dominion: its black powder arms Volgan's orc companies, its galleys carry tribute along the Veshir coast, and its demons write their laws in salt so that the sea can wash away any oath the queen regrets.\n\nBanner: A crown of jagged white salt crystals, in salt white on obsidian black."
 ZIN_FOURTH_AGE_DESC_DONDOR:0 "King Dunmar rules about a quarter of a million men of the Dondor plain, the Dondor Forest, the lower Giant River and the fens from the Brute-King's hall. Dondor leads the Dark Sea Accord, keeps its beacon towers manned and a few dear powder-pieces in them, and needs the free holds' iron more than it likes to admit.\n\nFounded 1A 352. Banner: The Garrison Helm: an old open-faced iron helm with a tall ridge-crest, iron-grey on blood-red, with a black hem."
 ZIN_FOURTH_AGE_DESC_DRAK:0 "In the 1108th year of the Ledger, Forge-Prince Telino Barzio rules the Drak Mountains from Castronuro, the place where the East learned black powder. Drak sells powder-engines and casks to the Stabilo Pact and to any caravan city that can pay, its forge-masters guard the recipe closely, and Noris's riders spit when its name is spoken.\n\nBanner: An open iron collar broken at its hinge, in red-hot orange on black."
 ZIN_FOURTH_AGE_DESC_DRESON:0 "About forty thousand orcs live in the fens on eels, peat and bog-iron under the reed-council. Dreson is a separate hold that belongs to nobody, and its fens swallow armies.\n\nFounded 3A 520. Banner: The Three Piles: three black piles standing upright, the middle one tallest, rising out of a wavy band of fen-green, on a pale reed-yellow field."
 ZIN_FOURTH_AGE_DESC_DULUNDUR:0 "About a hundred and fifty thousand orcs, with goblin quarters, live in the long valley's four holds under the Four Fires. Dulundur hosts the Free Moot against the Iron Yoke and is the free holds' strongest voice.\n\nFounded 3A 1150. Banner: The Four Fires: four red flames rising side by side from one black hearthstone, their tips leaning together, on charcoal with a yellow hem."
 ZIN_FOURTH_AGE_DESC_EEKEDOR:0 "About six hundred thousand people live in the Eekedor Vale with Oirt, Pertawn and Filit under the council of counting houses. Eekedor is the island's grain and money, keeps the Compact with the High Crown and holds its court open to any crown that pays.\n\nFounded 4A 620. Banner: A black steelyard balance with its hanging weight, on gold."
 ZIN_FOURTH_AGE_DESC_ELDAFAEN:0 "Eldafaen in 4A 1748 is the House of the Archive, some 8,000 elves on the southern rift shore and Endelond, keeping the records of the Kindred and refusing readers it does not trust. It lies on the rift and so in the path of any eastern landing, and its loremasters have begun copying the oldest books in case they must carry them away.\n\nFounded 2A 9. Banner: A spear broken in two, the halves laid apart with a gap between them, in quay silver on night sea: the Broken Spears of the Road's End."
 ZIN_FOURTH_AGE_DESC_ELVANA:0 "Speaker Elvae leads the Cape of Elvana and the Elvini shore from Googavis, some 44,000 Sunhot elves of the western sanctuaries among about 120,000 Sunfolk. Elvana is a small, gentle house of weavers and healers whose only quarrel in the world is with Igara, a quarrel it would not give up for anything.\n\nBanner: A white silk-moth with its broad wings spread, on deep loom violet."
 ZIN_FOURTH_AGE_DESC_ENHIS_IS_ROND:0 "Enhis Is Rond in 4A 1748 is a realm of some 250,000 islanders under the Priest-Elders of the shrine beneath the tide, holding the centre and lagoon of the Great Isle, the Wide Mountains, the Enhis Forest, the salt coast of Angsun and the volcano islet Lua. Its shrine still repeats the name of Aen without anyone on the island understanding it, and it counts its years by storms and its dead as waves on the reef.\n\nFounded 2A 40. Banner: A round grey diving stone with a hole through it, hung on a looped cord, on lagoon turquoise."
 ZIN_FOURTH_AGE_DESC_ERCO:0 "In the ninth Rising of King Keroth, Erco holds the southern mountains, the river and the dry Kalioth upland from Atonto, a city of 95,000. Its mines are rich, its seven forts are manned, and every spring it pays the fire-tithe to the mountain, which its people call a tax and its priests call an offering.\n\nBanner: A black iron diadem of seven points turned upside down, its points downward, on stone grey."
 ZIN_FOURTH_AGE_DESC_FEARNO:0 "Some two hundred and fifty thousand herders live in the largest free realm of the north, a third pole between Fandanar and Minnolomak whose hall argues for a month before it agrees on anything. The present first lord leans neither way and means to keep it so.\n\nFounded 4A 1304. Banner: The Bound Spears: seven upright spears bound together at the middle by a red cord, white on a dark moss-green field, with a brown hem of hide stitching."
 ZIN_FOURTH_AGE_DESC_GALA:0 "King Lorien reigns at Sodoli over the north-east shore, some 35,000 Gala elves and the Sunfolk villages that farm the shore below the dormant Good Volcanoes, about 135,000 in all. Gala is at peace, courteous to Aenor and distrustful of kings who turn victories into crowns, honoured by the Noon Council as a guest and owing the Sunhot nothing; its ships are the fastest in the south, and its king still speaks of Dardan as if it were last year.\n\nBanner: A white hind with her head lowered to drink, on deep harbour blue."
 ZIN_FOURTH_AGE_DESC_GIRDON:0 "About six hundred thousand people of the Girdon plain, the south bank and the Lothoro valley live under the wardens' river-court. Girdon answers raids with the blood-price more often than in kind, its riders are the best of the West, and its floods and fords make it the West's breadbasket as well as its oldest frontier.\n\nFounded 1A 640. Banner: A line of five grey stepping-stones across a single blue river band, on green."
 ZIN_FOURTH_AGE_DESC_GOLDOROTH:0 "Warking Gorduth rules some half a million orcs, with goblin quarters and a few trolls, from the forge-city below the Fire-Mountain. Goldoroth wants the whole Dark Lands and has not quite the strength to take them; its siege forges cast bombards with Burnikit's powder, its tribute holds pay in iron, and Volgan's envoys are received at court.\n\nFounded 4A 1452. Banner: The Crown of Broken Blades: a black iron crown of unequal jagged points, each one a broken sword-blade, on a fire-red field with a charcoal hem."
 ZIN_FOURTH_AGE_DESC_GOODIN:0 "Senan of Elgagen speaks for the elders of Goodin, some 300,000 Sunfolk of the western grasslands with Goodton and Guuden. Goodin is the only realm of the Lands of the Sun that raises levies freely, it keeps the Reckoning of the Twelve, and it is the strongest arm the Noon Council has, though it sits at the council only as a guest.\n\nBanner: A spear reversed, its point downward resting on a ground line, in ash brown and iron grey on harvest gold."
 ZIN_FOURTH_AGE_DESC_GUNWYN:0 "King Herlic rules some one and a half million people of the downs, the largest western kingdom, from the royal hall beside the Oath-Ring. The Lawspeaker Ilurda keeps the clans' law, the war-thanes grumble that the truce gave away the ford-share, and the guild ports' Aenoran trade makes the court rich and resentful at once.\n\nFounded 1A 880. Banner: A black rook carrying a gold barley-ear in its beak, on downs green."
 ZIN_FOURTH_AGE_DESC_HALENOR:0 "About eighty thousand people live on Halenor, Kilos, Tined, Lunnai and the Surla Islands under the wreck-lord. Each gale season brings wrecks ashore, and each lord chooses again whether to light the shore-fires.\n\nFounded 3A 280. Banner: An empty iron fire-basket on a tall pole, in iron black on storm grey."
 ZIN_FOURTH_AGE_DESC_HEREZ:0 "Herez in 4A 1748 is a march lordship of some 700,000 under Marcher-Lord Heziel, holding the charter-seats of Herez and Belurithon, with empty roads, old towers and a garrison that still drills. It is the realm that will feel the south first, and the only one that expects to.\n\nFounded 2A 12. Banner: A great iron key, bit downward, on march green above a red base."
 ZIN_FOURTH_AGE_DESC_HERRODON:0 "Herrodon in 4A 1748 is a hill queenship of some 55,000 elves under Queen Herrowyn, with the men of the Teste Vale under its protection. It keeps the Boundary Groves feud with Andos Enda alive by ceremony, remembers the lost kin of the west, and its queen has said she would set the Refusal aside if the dragons were ever threatened.\n\nFounded before 1A. Banner: A white owl with its wings raised, facing out, on night slate: the Hall-Owl of Verozo."
 ZIN_FOURTH_AGE_DESC_HIROLON:0 "Hirolon in 4A 1748 is a sovereign kingdom of some 8,000 giants under High Chief Oronas, with about 92,000 Hilofrim herders as its tenants on the eastern Grano and the small folk of Tirlan under its ward in the valleys. It treats with Aenor under the Cairn Treaty, sells cut stone and the strength of its giants to Parim's quays, and asks only to be left alone.\n\nFounded before 1A. Banner: A grey squared field-stone bearing one black notch cut in its face, on russet."
 ZIN_FOURTH_AGE_DESC_HORIDOR:0 "About two hundred and twenty thousand people live along the lower Fandan and in the Neridor Mountains under the cairn moot. Horidor keeps the Accord faithfully, collects its dues from every western cart and remembers the White Year, when Coldor's bread came up the valley before the snow did.\n\nFounded 2A 340. Banner: The Guide-Pole: a grey stepped cairn with a tall pole rising from its top, a red rag streaming from the pole, on a dark green field, with a white hem."
 ZIN_FOURTH_AGE_DESC_HOWAN:0 "Howan in 4A 1748 is a harbour moot of some 180,000 under Speaker Wikuana, holding the Great Isle's south with the River Tich, the Far Islands and the whale coast of Yowi-yoor. Its terraces feed the south, its divers sell pearls for iron, and its house for the shipwrecked takes in every stranger the storms bring.\n\nFounded 1A 290. Banner: A house on stilts with a saddle-backed roof whose two ends sweep up like canoe prows, in rice-straw gold on deep terrace green."
 ZIN_FOURTH_AGE_DESC_HUNHUN:0 "Hunhun in 4A 1748 is a riders' moot of some 560,000 under Horse-Lord Hunald, holding the charter-seats of Hunhun and Noloreh. Its breed carries the Concord's lancers, its Gathering is the largest horse fair in Aoaz, and its riders are loyal to Parim in the way they are loyal to the weather, because it is there.\n\nFounded 1A 9. Banner: A riderless dun mare at the gallop, saddled, her stirrups flying empty, on dark red."
 ZIN_FOURTH_AGE_DESC_KHORVRATH:0 "Lord Morvath rules the Nether foothills of the island from Khorvazel, perhaps 1,500 demons over some 35,000 thralls, orc and goblin labourers and men of the old coast. Khorvrath is the horned court of the Southern Dominion, it keeps its oath to Nafeher while Volgan's strength stands, and it still demands the return of the thralls who fled to Olen.\n\nBanner: A single great curved horn broken off at its tip, in ember gold on ash black."
 ZIN_FOURTH_AGE_DESC_KILINTI:0 "Kilinti in 4A 1748 is a chartered dominion of a few thousand ents and some 72,000 edge-folk, holding two charter-seats. The ents keep the forest, the men keep the accounts and the timber trade in fallen wood, and the Golden Court has never found anything in Kilinti it could sell.\n\nFounded before 1A. Banner: A fallen oak bough lying across the field, leaved and bearing acorns, brown and green on pale gold."
 ZIN_FOURTH_AGE_DESC_KINGSON:0 "Kingson in 4A 1748 is a pass lordship of some 420,000 vale-folk under Arcen, Lord of the Gate, holding two charter-seats and the only wheel road through the Great Wall of Aenor. Its forts are stocked with Kunhrim's black powder, its market lives on silver, herbs and dragon-scale coming west and iron, grain and glass going east, and the tolls it takes are the elves' oldest complaint against men.\n\nFounded 4A 3. Banner: A red-hot ember held in black iron tongs, on snowline white."
 ZIN_FOURTH_AGE_DESC_KONORI:0 "Konori in 4A 1748 is a steppe kingdom of some 530,000 riders under King Sventor, holding two charter-seats and one of the Concord's horse reserves. The Hundreds breed remounts, sell them at Arrovez and complain that the Golden Court pays for them in titles instead of silver.\n\nFounded 1A 288. Banner: A white felt with its four corners tasselled red, bearing at its heart a small black open hook-brand, on plateau ochre."
 ZIN_FOURTH_AGE_DESC_KRADLON:0 "About three quarters of a million people live on the peninsula's coast and the Ronbo shore under the guild league, whose workshops make powder-pieces and bombards for anyone who pays. Kradlon weighs tariffs against trade and memory, and its clansmen still send men to the Ronbo Watch.\n\nFounded 1A 260. Banner: A hazel tally-stick broken across, its two halves set apart, white on red."
 ZIN_FOURTH_AGE_DESC_LAMBIN:0 "About eight hundred and fifty thousand people live on the eastern downs, the West's granary and its neutral ground. The lord sells grain to Gunwyn, Girdon and the Neck Road alike, and every western court that wants to talk without losing face sends its envoys to Faennon.\n\nFounded 2A 380. Banner: A stone granary raised on four mushroom-shaped staddle-stones, gold on green."
 ZIN_FOURTH_AGE_DESC_LANDS_OF_LIGHT:0 "Radiant Speaker Salin of Eldoga leads the eastern lowland and the Sun Grasslands, some 130,000 Sunhot elves of the Light among about 420,000 Sunfolk farmers, and chairs the Noon Council of the Sunhot realms. The Lands of Light are the largest realm of the region, peaceful and prosperous, and they can raise no host without asking the Sunfolk villages first.\n\nBanner: A tall narrow doorway with the noon sun standing in it as a plain gold disc, on sanctuary white."
 ZIN_FOURTH_AGE_DESC_LCCIMIO:0 "Lccimio in 4A 1748 is a council of elder houses of some 60,000 rift-coast elves under Elder Lusmio, holding the northern rift shore from Mushroom Head to the Gorlab Sea with its orchards and quays. Its houses know the eastern courts better than any elves alive, would trade the Refusal for an eastern peace, and lie first in the path of anyone who crosses the rift from the East.\n\nFounded 2A 300. Banner: A round-headed fruit tree in white blossom, standing alone, in quay silver on rift teal: the Pledge-Tree of Hidirim."
 ZIN_FOURTH_AGE_DESC_LERENDOR:0 "King Ferlin III rules some one and a fifth million people of the Leren shore, the river valley, Lerendor's North, the Low-ness Islands and Ferlinon's pine hills. The strait dues make the crown rich, the fleets guard the strait, the dwarves' bombards ride on the royal ships, and the court has not forgiven Parim for the toll of 4A 1716.\n\nFounded 4A 411. Banner: The two flukes of a sounding whale rising from the sea, black on strait blue."
 ZIN_FOURTH_AGE_DESC_MAGICAL_FOREST:0 "The Magical Forest in 4A 1748 is an elected council of houses under First Speaker Lusiel Velakorin, some 180,000 elves with a few mycid families on the Elwen, the largest and oldest realm of the elves and the keeper of the Refusal. It is at peace with everyone, can call an Elder Moot of the Kindred, and with the other elven realms can ask the dragons of Dragon Mountain for help that no crown of men can command.\n\nFounded before 1A. Banner: A fallen bough laid level across the field, leafed at one end, in mist grey on deep wood green: the Speaking Bough of the council-hall."
 ZIN_FOURTH_AGE_DESC_MELKGARD:0 "Some three hundred thousand people live under Warlord Ezhan Isenmar and his oath-companies, in a march of forges and black forts whose men would rather go hungry than eat the queen's bread. The March Forts are manned, gifts flow to the border clans, the Storm Court's captains keep their tokens in the Black Gallery, and the warlord still bids for the Orewell iron.\n\nFounded 2A 1780. Banner: The Sworn Gauntlet: a black iron gauntlet raised with its fist closed, on a storm-grey field, with a black hem of jagged teeth."
 ZIN_FOURTH_AGE_DESC_MIAED:0 "In the 3952nd year of the Wells, Lord Tharian rules the Hardtmuth passes and the south coast road from Erdozan, a city of about 120,000 with perhaps 450,000 people under the lordship. Miaed lives on tolls, glass sand and the goods of the Sand Road, it sells passage to Noris and Stabilo alike, and the friends of the Deliverer's temple at Erdozan are as generous to its lords as they are everywhere in the East.\n\nBanner: A black ibex standing with its long horns swept back, on dust gold."
 ZIN_FOURTH_AGE_DESC_MINA:0 "About two hundred thousand people live in the Etonia ore hills with Mine Din, Fargur and Thowson under the mining crown. Mina's iron goes to the strait fleets and to the forges of the North, and its king has worked his season in the galleries.\n\nFounded 4A 640. Banner: A miner's iron pick standing upright with a gold circlet hung on its haft, on slate grey."
 ZIN_FOURTH_AGE_DESC_MIROLON:0 "High Warden Mirena of the Passes rules the peninsula north of the Nan Mountains, its forests, its lake and the Great Swamp from Miherta, some 800,000 wardens, farmers and reed-cutters. Mirolon is free, watchful and alone: its scouts take the signs from the south seriously, Parim laughed at its envoy twelve years ago, and the beacon towers are manned every night.\n\nBanner: A grey heron standing upright with its neck drawn back, watchful, in heron grey and white on night blue."
 ZIN_FOURTH_AGE_DESC_MOLOT:0 "About two hundred thousand people live in the northern march with the harbour of Knorvik under the margrave, whose forts are manned and whose envoys are in Parim. Molot leans to Aenor, which in the North is a way of not leaning to Sonargur.\n\nFounded 2A 1240. Banner: A single white path-stake standing crooked in black marsh water, on dark green."
 ZIN_FOURTH_AGE_DESC_MORA:0 "Speaker Lorvena governs the Hot Lake's east shore, the Mora coast and Eraver from Gonnois, a lake town of 60,000. Mora is the granary of the East and the most peaceful of its realms, it has no king and no wish for one, and every power that wants to feed a host in the East must buy its grain.\n\nBanner: A white steam-eel rising in an S-curve with its head raised, on deep lake teal."
 ZIN_FOURTH_AGE_DESC_NAAMIS:0 "In the 3952nd year of the Wells, Queen Shinah rules the north coast plain, Hacsen and Vigodor from Duum-Saah, a harbour of 45,000. The Noris Treaty is the pillar of her policy, her ships carry the Salt Road's goods to the rift, and her captains listen with unease to the island fishers who say there are strange ships among the black isles of the Kusmeel.\n\nBanner: A ship with a prow at both ends, both stems curling up alike, without mast or sail, in sea white on deep slate."
 ZIN_FOURTH_AGE_DESC_NAN:0 "Almon the Small rules the Nan Mountains and the southern isles from Larorun, a warlord's fort and some 59,000 hill-folk and islanders. Nan pays its toll to Nafeher, lends the Dominion its storm-pilots, and sells the same pilots to anyone who pays more, which makes it the one realm of the Ember Lands that both Mirolon and Nafeher need.\n\nBanner: A dark storm-petrel skimming low with its wings bent, in storm black on grey."
 ZIN_FOURTH_AGE_DESC_NARA:0 "Nara in 4A 1748 is an elders' moot of some 80,000 fishers on the long island Ancha, facing the Night Reef. Its villages fish only by day, take in shipwrecked strangers like every island, and will not cross the reef after dark for anyone.\n\nFounded 1A 800. Banner: A fishing torch turned head downward and unlit, in torch-wood brown on dusk violet."
 ZIN_FOURTH_AGE_DESC_NETHER:0 "The Nether lies below the rim of the Abyss, a realm of demon houses that keep their own counsel and their own old quarrels. Its lords swear to no crown of the surface, trade little and travel less, and the few envoys who come back from its halls speak of courts older than any above.\n\nBanner: The King's seal: a five-pointed figure drawn in one unbroken line within a ring of fire, in pact gold on hall black."
 ZIN_FOURTH_AGE_DESC_NEZER:0 "Queen Sathael and Lord Zeruath rule the Nezer hills and the coast of the Sea of Nazerch from Gelroze, perhaps 2,500 demons over some 70,000 thralls and labourers. Nezer is the largest of the sworn realms, it guards the broken ring of the Burning Gate on its coast, and its trade with the Nether crosses the Sea of Lava on galleys that only demons sail.\n\nBanner: A black galley with two steering oars at its stern, one at each quarter, in ember gold on nether red."
 ZIN_FOURTH_AGE_DESC_NIVAROS:0 "About three thousand giants hunt seal and caribou on the heights and keep their Frost-King and their cairns. They let the clans' herds pass for the toll and close their country to any crown that comes in arms.\n\nFounded 2A 1312. Banner: The Frost-King's Maul: a great stone maul standing upright, its head bound with iron bands, white and grey on a deep ice-blue field, with a white hem of stepped stones."
 ZIN_FOURTH_AGE_DESC_NOLEKSUN:0 "04 million people under Chief Speaker Noleka, holding three charter-seats and the fairs of Saelori. It pays the Golden Court's tax-farmers with a smile and keeps a treasury that would pay for a war.\n\nFounded 4A 774. Banner: A long-handled ditching spade, blade down, its blade cut in steps, silver on dark green."
 ZIN_FOURTH_AGE_DESC_NOLORIM:0 "Nolorim in 4A 1748 is a pass-wardenship of some 15,000 elves under Pass-Warden Nolwe, holding the Nolorim Heights and the eastern tower of the South Pass. Its families count every pilgrim, merchant and stranger who crosses, and its watch on the Lake of Mirolon is the only one in the Magical Lands that never stopped.\n\nFounded 1A 1150. Banner: A curved war-horn with a split bell, mouth to the left, in dawn silver on pass grey-green: the Cracked Horn of Ennaton."
 ZIN_FOURTH_AGE_DESC_NONDONDOR:0 "About ninety thousand corsairs and fishers live on the south of the western island and on Melkos under the sea-king. Nondondor presses its banks claim whenever its fleet is stronger than Raerby's, and grants writs or hangs corsairs as suits the season.\n\nFounded 2A 760. Banner: A crown twisted from a ship's anchor cable with its strands showing, in rope tan on deep sea black."
 ZIN_FOURTH_AGE_DESC_NORIS:0 "In the 3952nd year of the Wells, King Rasiq ben Tumek of the Khadi rules the northern desert, the Salt Road and the tribes of the Moco and Mylunur from Furvior, a city of 210,000. The salt and dye trade has made the riders rich, the Noris Treaty with Naamis holds, and the rivalry with Stabilo is fought in tolls, bribes and caravan prices.\n\nBanner: An upright rider's lance with a round water-gourd hung by its cord beneath the blade, in well white on deep indigo."
 ZIN_FOURTH_AGE_DESC_OLEN:0 "First Keeper Helia of the Lamps governs the isle of the Holy Breeze, the lamp-cliffs and Luminor from Gelbus, some 237,000 fishers and pilgrims. Olen pays its toll to Nafeher and shelters whoever reaches its cliffs, including the thralls Khorvrath still demands, and its lamps are the first lights a ship sees coming out of the storm belt.\n\nBanner: A sea-kestrel hanging still in the air with its wings spread and its tail fanned, in cliff white on storm blue."
 ZIN_FOURTH_AGE_DESC_OROHAF:0 "Orohaf in 4A 1748 is an island queenship of some 300,000 shipwrights, fishers and farmers under Queen Faberra, holding two charter-seats. It builds the Concord's best hulls from Verde's timber, and any fleet crossing from the West must pass its harbours or go far out of its way.\n\nFounded 1A 133. Banner: A white steering-oar standing upright, blade down, on a field of sea-blue over black."
 ZIN_FOURTH_AGE_DESC_OSTOROTH:0 "King Ernoian rules the north-east lakes, Ernois, Grova and Nethnu from Ohitus, a highland town of 70,000 on the Lake Road. Ostoroth keeps the Reckoning of the Twelve and trades cedar and lanterns with the west, both great powers claim the Lake Road it lives on, and the Lantern Peace with Mora has held for longer than any lake-reader expected.\n\nBanner: A closed cedar lantern with a peaked roof and four pale panes, hung from a ring, in lantern gold on deep pine green."
 ZIN_FOURTH_AGE_DESC_PERTOLOR:0 "About ninety thousand herders live in the sheep vale and on the Faaennar plain. The lord is cousin to the Winter Queen and godfather to a Melkgard captain, and he intends to stay both for as long as the crowns let him. The valley of Mp'E above the Ormolak Pass, with the town of Simoto and the castle above it, lies in the lordship's land; the headman keeps the loaf on the Silent Road every Long Dark.\n\nFounded 4A 760. Banner: The Black-Faced Ram: a white ram with a black face and black curled horns, standing, on a deep green field, with a red hem of woven wool."
 ZIN_FOURTH_AGE_DESC_PLUTONDO:0 "In the fourth Rising of Prince Blosian, Plutondo holds the southern valley and the Blozan Lands upland from Vobibiz, a river city of 110,000. It is rich in ash-grown grain and ore but deep in Stabilo's ledgers, and the princes resent the caravan houses that fed them in the Vent Year more than the vents that starved them.\n\nBanner: A black glass ploughshare, point downward, edged in ember red, on ash grey."
 ZIN_FOURTH_AGE_DESC_POLLOS:0 "About a hundred and twenty thousand people live in the north of the western island, with Hesos and Aatah, under the guild-masters. Pollos holds the chart-houses' treasury and sells everything to everyone.\n\nFounded 4A 140. Banner: Three keys hanging from one ring with their bits downward, in iron grey and market gold on deep harbour red."
 ZIN_FOURTH_AGE_DESC_PUVULAN:0 "In 4A 1748, in the Musters that the Dominion counts instead of months, Volgan rules the plateau, the Demonic Mountains, the Abyss's rim, Unlo and the isle of Exhoros from Nafeher, with some 300,000 living subjects among orcs, ogres, goblins and men of the plateau oases, and the dead uncounted. Behind the Veil of Storms the Dominion has spent a century filling its musters again, which only Mirolon's scouts believe.\n\nBanner: The Gate of Nafeher: a plain upright gateway in bone white standing within a plain ring of bone white, on grave black."
 ZIN_FOURTH_AGE_DESC_RAERBY:0 "About a quarter of a million people live on the eastern arc's north with Urbolon and Lemo under the broker-captains. Raerby mediates the banks, hires out ships and watches Nondondor's fleet more closely than any other.\n\nFounded 3A 610. Banner: A great banks-fish of the cod kind, with its fins, chin-barbel and square tail drawn plain, swimming, cut through its middle by a thin white line, in silver on deep bank green."
 ZIN_FOURTH_AGE_DESC_REN:0 "About three hundred thousand people live on the strait cape and around the Sea of R'en under a prince with two masters. R'en lives on Aenoran trade, leans to Parim, and knows that Lerendor's mastery of the strait would begin at its forts.\n\nFounded 1A 1240. Banner: A black cormorant perched on a grey rock with a silver fish in its beak, on white."
 ZIN_FOURTH_AGE_DESC_RHACHIA:0 "Tribune Kaiena of Pordoce governs the Red Lands and the vent-field of the Rhachia Fires from a kiln-city of 35,000, under the Count of the Floods as the old crown kept it. The commonwealth is poor, proud and watched: the deposed king's heir waits at Porrenva, the caravan houses still buy its pots, and the villages refire the clay figures of their first mothers every spring.\n\nBanner: A seated mother-figure of fired clay, wide-hipped and armless, in kiln red on ash white."
 ZIN_FOURTH_AGE_DESC_SEITE_ISLANDS:0 "About seventy thousand fishers live on the four Seite isles and Mondeluz. The moot keeps the reef-shrines, refuses the sea-king every year and knows that its fishers alone cannot hold the banks against his fleet.\n\nFounded 2A 1340. Banner: A grey seal rising from the water with its head raised, in seal grey on reef teal."
 ZIN_FOURTH_AGE_DESC_SELEN:0 "9 million rangers, woodsmen and scholars, holding the three charter-seats of Vothrim, Svenlor and Ulgus. First Warden Daeric Svenlor speaks for it in Parim, but in the glades the word that carries furthest is Alleria of Selen's, the ranger and archer whose companies watch the Bloody Forest edge and the north coast; the moots resent the Golden King's taxes more than any other dominion.\n\nFounded 1A 230. Banner: Three arrows bound together point-down with a green withy, white on forest green."
 ZIN_FOURTH_AGE_DESC_SOYANO:0 "Tide-Speaker Soyai speaks for the northern isles, some 67,000 isle Sunhot among about 150,000 Sunfolk shipwrights, pilots and fishers. Soyano builds the white ships of the south and the hulls of Gala's court, trades on the Bright Sea, and is the one realm of the region whose ships could carry a host north if the Noon Council ever asked.\n\nBanner: A bare curved white keel with its stem and stern posts rising at either end and no planks, on deep tide blue."
 ZIN_FOURTH_AGE_DESC_STABILO:0 "In the 1108th year of the Ledger the bench of houses governs the southern hills, the Gold Road and the old caravan towns of Arcon, Furro, Olor and Oreton from Postondoroth, at 240,000 the largest city of the East. Its powder-engines and hired companies make it the strongest military purse of the region, the Stabilo Pact with Drak holds, and several great houses owe the Deliverer's temple more than the bench has been told.\n\nBanner: A crouching bronze ox with a lifting ring on its back, in bronze gold on deep green."
 ZIN_FOURTH_AGE_DESC_TOLVAEL:0 "About four hundred thousand people live in the long vale with Goran's fjord and the iron hill Kerhil, the most populous of the small crowns. Tolvael is proud, rich in timber and tar, and a willing partner of the High Crown as long as it is asked rather than told.\n\nFounded 1A 1360. Banner: An unsplit black pine log lying across the field with a broken axe-head beside it, on dark green."
 ZIN_FOURTH_AGE_DESC_TOR_LUNI:0 "Keeper Tangin leads the high places by the Sea of Gods from Wefolen, some 45,000 Sunhot elves among about 100,000 Sunfolk quarrymen and fishers. Tor Luni quarries the white stone that builds half the realms of the region, keeps its standing stones uncut, and receives the pilgrims who come by sea to look out over the Sea of Gods.\n\nBanner: The two halves of a broken quarrier's chisel, the bladed half set point downward below the handle half with a gap between them, in quarry white on deep sea violet."
 ZIN_FOURTH_AGE_DESC_TROLL_FOREST:0 "About six hundred forest trolls live in the Troll Forest under Smash, king of these trolls and no others. The forest belongs to nobody; realms that pay the troll silver are left alone, and armies that camp there are smashed by night.\n\nFounded 4A 1390. Banner: The King-Stone: a hunched grey standing stone in the shape of a crouching troll, on deep forest-green, with a dark silver hem."
 ZIN_FOURTH_AGE_DESC_VARNONDOR:0 "About six hundred and fifty thousand people live on the western capes with Oslinod and Trilino under King Oslin, whose lanterns and sea watch guard the approaches. Varlibo's quays are the West's natural staging port for any crossing, which the king knows and Parim has not forgotten.\n\nFounded 2A 455. Banner: A black iron lantern with a white light, on cape red."
 ZIN_FOURTH_AGE_DESC_VERDE:0 "Verde in 4A 1748 is a clan hall of some 120,000 timber-folk and navigators under Chief Ruan, holding the Great Isle's west and the Verde Mangroves. It sells hull-timber to Aenor Isle and pilots to anyone, and its navigators are the best of the south.\n\nFounded 1A 650. Banner: A mangrove tree standing on its arched stilt-roots, in leaf green and root brown on sea blue."
 ZIN_FOURTH_AGE_DESC_VINDAEL:0 "About forty thousand whalers, sealers and harbour folk live on the ice arm, with a carrying fleet of perhaps sixty hulls. The council trades with the islands, keeps the coast watch and signs a compact with Coldor only when the crown's friendship is worth its price.\n\nFounded 4A 702. Banner: The Wind-Feather: one white skua feather slanting upward, with three red bands across its vane, on a storm-grey field, with a white hem of wave-crests."
 ZIN_FOURTH_AGE_DESC_WORSHIPDOM:0 "The Worshipdom in 4A 1748 is a gentle temple-state of some 150,000 pilgrim-folk in the three Zilin valleys under High Confessor Ilvane, holding little land and almost no army. Its hostels shelter pilgrims of the Deliverer from every land, its couriers carry letters for every court, and its confessors are welcome in Parim, the East and the North alike.\n\nFounded 4A 1520. Banner: A hand reaching up from the base and offering a round loaf, in bread brown on hostel white: the Hermit's Loaf."
 ZIN_FOURTH_AGE_DESC_YENI_ALANG:0 "Eldest Watcher Wenang leads the western terraces from Sudoni, some 45,000 Sunhot elves among about 100,000 Sunfolk terrace-farmers. Yeni Alang is a quiet house that farms, sings and watches; it adds a line to the Roll of Wings a few times in a good year, and the Sunfolk of the terraces count a sighting as a blessing on the harvest.\n\nBanner: A tall pole with one long ribbon hanging straight down from its head, in white on clear sky blue."
 ZIN_FOURTH_AGE_DESC_YETI_LANDS:0 "About twenty-five thousand yeti hunt the Yeti Shallows and come down to the snowline fair. They can be courted by a patient crown, and only a shelf Eldest can vouch for an envoy to their kin in the high snows.\n\nFounded 2A 1288. Banner: The Ice-Mark: one great white five-toed yeti footprint on a deep sea-blue field, with a white hem of zigzag ice-cuts."
 ZIN_FOURTH_AGE_DESC_ZOLS_MISTAKE:0 "Zol's Mistake in 4A 1748 is silent: the Northern Wastes, the isle of Šodolôro and every black island of the Kusmeel, sparsely peopled and roamed by the dead, with perhaps 20,000 living souls, most of them Leren-speaking fishers on the outer isles who sell their catch in the North Lands and never go near Furviatlon. Fishermen tell of black ships among the isles; nobody at court believes them.\n\nFounded 1A 470. Banner: Broken concentric rings in cold grey on a void-black field, each ring open on the same side: the sigil of the Will of Zol."
 ZIN_OTHER_FOURTH_AGE_DESC:0 "Choose any of the crowns, dominions, clans, temple-states and island lordships of Aoaz on the map. Every realm can be played."
