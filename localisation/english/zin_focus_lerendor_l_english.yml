l_english:
 zin_lerendor_a_treaty_among_equals:0 "A Treaty Among Equals"
 zin_lerendor_a_treaty_among_equals_desc:0 "The king of Lerendor offers a new treaty to the crown of Aenor, signed by two sovereigns who owe one another nothing and can therefore afford to be friends."
 zin_lerendor_a_treaty_among_equals_tip_1:0 "An outcome of this game, not history."
 zin_lerendor_across_the_dark_straits:0 "Across the Dark Straits"
 zin_lerendor_across_the_dark_straits_desc:0 "The narrow straits that separate Lerendor from the Dark Lands are crossed by traders every week and by armies never. The king orders the charts redrawn and the coast watched, and asks for a report on who lives there."
 zin_lerendor_admiralty_ascendant:0 "The Admiralty Ascendant"
 zin_lerendor_admiralty_ascendant_desc:0 "The sea lords press their advantage and the king, who needs their ships, allows it. Captains who once begged for harbour fees now draft the dues themselves."
 zin_lerendor_admiralty_ascendant_spirit:0 "The Admiralty Ascendant"
 zin_lerendor_admiralty_ascendant_spirit_desc:0 "The sea lords draft the strait's dues, and pay for their own ships out of them."
 zin_lerendor_answer_the_lost_cause:0 "Answer the Lost Cause"
 zin_lerendor_answer_the_lost_cause_desc:0 "The Lost Cause, Aenor's league of the loyal, asks the northern crowns to stand with it. Lerendor, which has watched the court from a distance, decides to answer."
 zin_lerendor_armed_neutrality:0 "Armed Neutrality"
 zin_lerendor_armed_neutrality_desc:0 "Lerendor declares that it takes no part in other men's wars, and will treat any army that crosses its border as an enemy. The declaration is backed by every man who can hold a spear."
 zin_lerendor_armed_neutrality_spirit:0 "Armed Neutrality"
 zin_lerendor_armed_neutrality_spirit_desc:0 "Lerendor takes no side in other men's wars, and treats every army that crosses its border as an enemy."
 zin_lerendor_bargain_with_goldoroth:0 "Bargain with Goldoroth"
 zin_lerendor_bargain_with_goldoroth_desc:0 "The warlord of Goldoroth has little love for the Leren crown, but he loves coin and good iron. Lerendor sends an envoy with both, and an offer that neither side can repeat to its friends."
 zin_lerendor_beyond_the_strait:0 "Beyond the Strait"
 zin_lerendor_beyond_the_strait_desc:0 "A fleet that only guards the narrows will never be more than a gatekeeper. The admiralty wishes to teach captains to sail out into the open sea, to stay there for months and to come back with something worth the voyage."
 zin_lerendor_blackton_free_towns:0 "The Free Towns of Blackton"
 zin_lerendor_blackton_free_towns_desc:0 "The free towns of Blackton are humans in an orc-ridden land, and live by sea-trade and stubbornness. Lerendor, which knows the value of both, opens its harbours to their boats."
 zin_lerendor_blue_water:0 "Beyond the Strait"
 zin_lerendor_blue_water_desc:0 "Captains who have learnt to sail for months at a time, far from any quay."
 zin_lerendor_chain_of_sonargur:0 "The Chain of Sonargur"
 zin_lerendor_chain_of_sonargur_desc:0 "The harbour chain of Sonargur is made heavier and its towers taller, with new engines to raise it and new forts to guard the engines. A ship that tries to rush the chain will find that it is not decorative."
 zin_lerendor_chancellor_of_lerendors_north:0 "The Warden of the Northern Seal"
 zin_lerendor_chancellor_of_lerendors_north_desc:0 "Maelis of Lerendor's North, a calm and careful lawyer, is named keeper of the western crown's seal. She speaks for the estates at court, and for the court to the estates."
 zin_lerendor_claim_both_shores:0 "Claim Both Shores"
 zin_lerendor_claim_both_shores_desc:0 "The lawyers of the crown draw up a long argument for why both shores of the strait have always belonged to Lerendor. It is not entirely false, and it is not made to be answered."
 zin_lerendor_claim_both_shores_tip_1:0 "Claims follow once the treaty is torn."
 zin_lerendor_close_the_dark_straits:0 "Close the Dark Straits"
 zin_lerendor_close_the_dark_straits_desc:0 "The straits to the south are fitted with chains, sea forts and signal towers. A ship that comes from the Dark Lands will be asked its business."
 zin_lerendor_close_the_northern_seas:0 "Close the Northern Seas"
 zin_lerendor_close_the_northern_seas_desc:0 "The great chain is raised and the strait is closed to the warships of any crown at war. The northern seas are quieter than they have been in years, and the merchants are furious."
 zin_lerendor_colleges_of_sonargur:0 "The Colleges of Sonargur"
 zin_lerendor_colleges_of_sonargur_desc:0 "The king endows a college by the harbour, where the sons of captains and merchants learn navigation, law and the arts of the counting-house. Masters of the craft-guilds come to lecture, and some remain to teach."
 zin_lerendor_common_law_of_leren:0 "The Common Law of Leren"
 zin_lerendor_common_law_of_leren_desc:0 "A single law is compiled from the customs of both crowns: where they agree, it stands; where they differ, a committee decides. Judges are bound by it, and are surprised to find they do not mind."
 zin_lerendor_compact_council:0 "Convene the Compact Council"
 zin_lerendor_compact_council_desc:0 "The envoys of the northern crowns meet in Sonargur for the first time in a long age. They quarrel pleasantly over precedence, and agree, by the end of the week, to meet again."
 zin_lerendor_compact_council_spirit:0 "Council of the Compact"
 zin_lerendor_compact_council_spirit_desc:0 "The northern crowns meet in Sonargur and agree, more often than not, to meet again."
 zin_lerendor_compact_fleet:0 "The Compact Fleet"
 zin_lerendor_compact_fleet_desc:0 "The Compact's members agree to send ships to a common fleet, led by a Leren admiral and flying a common flag. Their captains learn the signals together, and the smaller crowns learn what it feels like to have a navy."
 zin_lerendor_compact_levies:0 "The Compact Levies"
 zin_lerendor_compact_levies_desc:0 "Each member of the Compact pledges a levy, to be raised on the Compact's summons and led by its own captains. The larger the league grows, the larger the levy, and the more eagerly the smaller crowns sign."
 zin_lerendor_compact_levies_spirit:0 "The Compact Levies"
 zin_lerendor_compact_levies_spirit_desc:0 "Every member of the Compact has pledged a levy, and the pledges are on a roll."
 zin_lerendor_compact_tariff:0 "The Compact Tariff"
 zin_lerendor_compact_tariff_desc:0 "A single schedule of duties is agreed between the Compact's ports. It is lower than anyone expected and fairer than anyone hoped, and it is Lerendor's clerks who keep the book."
 zin_lerendor_convoy_lanes:0 "Guard the Merchant Lanes"
 zin_lerendor_convoy_lanes_desc:0 "Escort galleys are assigned to the merchant fleets, with signal-lamps, supply-boats and a captain for every ten ships. A raider will find the lanes less lonely than the charts suggest."
 zin_lerendor_count_the_grievances:0 "Count the Grievances"
 zin_lerendor_count_the_grievances_desc:0 "Clerks of the crown assemble a ledger of every wrong done to Lerendor by Parim since the treaty: tolls unpaid, envoys mocked, a century of condescension. It is a very long document."
 zin_lerendor_crown_ascendant:0 "The Crown Ascendant"
 zin_lerendor_crown_ascendant_desc:0 "The household of Sonargur takes the lead in all things: tax, law, war and peace. Parim finds the new tone abrupt, and Lerendor's North finds it worse."
 zin_lerendor_crown_ascendant_spirit:0 "The Crown Ascendant"
 zin_lerendor_crown_ascendant_spirit_desc:0 "The household of Sonargur leads in tax, law, war and peace."
 zin_lerendor_crown_marriage:0 "A Marriage for the Heir"
 zin_lerendor_crown_marriage_desc:0 "The heir must marry, and every court in the north has an opinion about whom. The match will bind the crown to someone, and what it binds it to will matter for a generation."
 zin_lerendor_crown_of_the_strait:0 "Crown of the Strait"
 zin_lerendor_crown_of_the_strait_desc:0 "The king is crowned on the harbour chain of Sonargur in the sight of the fleet, with the strait behind him. It is a coronation like no other in the north."
 zin_lerendor_crown_over_altar:0 "The Crown Over the Altar"
 zin_lerendor_crown_over_altar_desc:0 "The king declares that no priest may preach in Lerendor without the crown's leave, and that no temple shall hold land without paying the crown's due. The priests protest, and the lords look on with interest."
 zin_lerendor_dark_shore_protectorate:0 "The Dark Shore Shelter"
 zin_lerendor_dark_shore_protectorate_desc:0 "Lerendor extends the shelter of its fleet to any realm of the Dark Shore that asks. The offer is generous and conditional, and the Leren crown sees no reason to pretend otherwise."
 zin_lerendor_dead_walk:0 "The Dead Walk"
 zin_lerendor_dead_walk_desc:0 "The dead are on the beaches. Every man who can carry a spear is on the walls."
 zin_lerendor_eekedor_bankers:0 "The Eekedor Bankers"
 zin_lerendor_eekedor_bankers_desc:0 "The money-changers of Eekedor extend loans to the crown at a gentle rate and sit at the king's table when they come to Sonargur. They are not in a hurry to be repaid, and the king is not in a hurry to repay them."
 zin_lerendor_eekedor_partnership:0 "The Eekedor Partnership"
 zin_lerendor_eekedor_partnership_desc:0 "Eekedor is rich, shrewd and well placed, and its merchant princes have always preferred the friendship of the strong to the protection of the weak. The partnership is signed in a counting-house, over a ledger."
 zin_lerendor_endow_the_temples:0 "Endow the Temples of the Deliverer"
 zin_lerendor_endow_the_temples_desc:0 "The temples that preach the Deliverer's peace are given lands, tithes and royal protection. Their priests are grateful, and they preach that Lerendor and Parim are old friends, which is half true."
 zin_lerendor_envoys_to_parim:0 "A Standing Embassy in Parim"
 zin_lerendor_envoys_to_parim_desc:0 "A permanent embassy is set up in Parim, with its own house, its own scribes and a rank at court. It is the first time Lerendor has had a voice there that was not merely a letter."
 zin_lerendor_envoys_to_the_north:0 "Envoys to the Northern Crowns"
 zin_lerendor_envoys_to_the_north_desc:0 "Riders go out to every crown from the Hold to Tolhon with the king's greeting and a small gift. Each carries a letter that says nothing of substance and asks for a reply."
 zin_lerendor_estates_ascendant:0 "The Estates Ascendant"
 zin_lerendor_estates_ascendant_desc:0 "The lords and towns of Lerendor's North take the lead, and the court takes on a trading, law-abiding air. Friends of the old treaty are gratified, and the sea captains are not."
 zin_lerendor_estates_ascendant_spirit:0 "The Estates Ascendant"
 zin_lerendor_estates_ascendant_spirit_desc:0 "The lords and free towns of Lerendor's North have the king's ear, and keep a law-abiding court."
 zin_lerendor_estates_charters:0 "Charters for the Free Towns"
 zin_lerendor_estates_charters_desc:0 "The free towns of Lerendor's North are given charters of their own: courts, markets and the right to close their gates to the king's tax-gatherers on feast days. The towns celebrate, and trade follows."
 zin_lerendor_estates_council:0 "Seat the Estates in Council"
 zin_lerendor_estates_council_desc:0 "Delegates of Lerendor's North are seated beside the king's officers in the council chamber, with a vote and a right of reply. It slows decisions, and it makes them harder to challenge."
 zin_lerendor_estates_in_council:0 "The Estates in Council"
 zin_lerendor_estates_in_council_desc:0 "Delegates of Lerendor's North sit beside the king's officers. Business is slower, and harder to challenge."
 zin_lerendor_estates_purse:0 "The Estates' Purse"
 zin_lerendor_estates_purse_desc:0 "The estates agree to pay a yearly sum into a fund held by their own treasurer, to be spent on roads, bridges and harbours. The king may ask for it, and the estates may refuse."
 zin_lerendor_faithful_to_the_crown:0 "Faithful to the Crown of Parim"
 zin_lerendor_faithful_to_the_crown_desc:0 "The king vows to stand by whoever wears the crown of Aenor, as his fathers stood by theirs. It is an old fidelity, simple and stubborn, and the court in Parim is grateful for it."
 zin_lerendor_faithful_to_the_realm:0 "Faithful to the Realm"
 zin_lerendor_faithful_to_the_realm_desc:0 "Whoever wears the crown of Aenor, the realm of Aenor is its people, and it is to them that Lerendor swore. The king declares his loyalty to the realm, and invites its loyal sons to rally to him."
 zin_lerendor_fire_and_salt:0 "Fire and Salt"
 zin_lerendor_fire_and_salt_desc:0 "Scholars say that fire and salt will check the dead where iron will not. The northern towns burn and scatter by the barrelful, and the soldiers are issued bags of salt along with their bread."
 zin_lerendor_fire_and_salt_spirit:0 "Fire and Salt"
 zin_lerendor_fire_and_salt_spirit_desc:0 "Fire and salt check the dead where iron will not, and every soldier carries a bag of the latter."
 zin_lerendor_first_among_equals:0 "First Among Equals"
 zin_lerendor_first_among_equals_desc:0 "Lerendor takes the chair of the Compact by consent, and promises to be fair. The members look at one another, shrug, and agree that it is better than the alternatives."
 zin_lerendor_fleet_in_being:0 "The Fleet in Being"
 zin_lerendor_fleet_in_being_desc:0 "The fleet need not fight to be useful. As long as it stands in the strait, rested and ready, a hostile admiral must reckon with it before every move."
 zin_lerendor_fleet_in_being_spirit:0 "The Fleet in Being"
 zin_lerendor_fleet_in_being_spirit_desc:0 "A fleet that has not yet fought is a fleet that no one can plan against."
 zin_lerendor_fleet_of_dominion:0 "A Fleet of Dominion"
 zin_lerendor_fleet_of_dominion_desc:0 "The yards of Sonargur are put on a war footing, with a keel laid for every shipwright's hand. A fleet is planned that no other crown in the north could hope to match."
 zin_lerendor_fleet_of_dominion_spirit:0 "A Fleet of Dominion"
 zin_lerendor_fleet_of_dominion_spirit_desc:0 "A fleet is on the slips that no other northern crown could match."
 zin_lerendor_fleets_of_the_strait:0 "Fleets of the Strait"
 zin_lerendor_fleets_of_the_strait_desc:0 "The strait is Lerendor's road and Lerendor's wall, and the admiralty declares it will be held by ships. The great chain is oiled, the old galleys are refitted and the harbour master is told to expect a larger fleet."
 zin_lerendor_forges_of_sonargur:0 "The Forges of Sonargur"
 zin_lerendor_forges_of_sonargur_desc:0 "The anvils of the capital never stop. Smiths from the whole north have been drawn in by good wages, and the master of the forges is already asking where he may find more iron."
 zin_lerendor_free_companies:0 "Free Companies for the Coalition"
 zin_lerendor_free_companies_desc:0 "Volunteers from the northern towns take ship for the south, to stand beside the host that has risen to break the dead. They have no pay, no banner and no orders, only a purpose."
 zin_lerendor_free_north:0 "The Free North"
 zin_lerendor_free_north_desc:0 "No tribute to Parim, no dread of the dead, and no open door for any who have not been invited."
 zin_lerendor_friends_of_the_dark_sea_accord:0 "Friends of the Dark Sea Accord"
 zin_lerendor_friends_of_the_dark_sea_accord_desc:0 "The Dark Sea Accord binds a handful of the coastal realms in a loose pact of mutual defence. Lerendor is not a member, and sends its good wishes, its envoys and a shipment of salt."
 zin_lerendor_full_strait_dues:0 "Full Strait Dues"
 zin_lerendor_full_strait_dues_desc:0 "A new schedule of dues is posted on both shores, based on the size of the ship rather than the age of the treaty. Merchants pay, and mutter, and the Golden Court notes the figure."
 zin_lerendor_galley_squadrons:0 "The Galley Fleets"
 zin_lerendor_galley_squadrons_desc:0 "Long galleys of the old pattern are laid down in numbers, each with a ram, a hundred oarsmen and a captain who has never lost a race. They are not the largest ships on the water, but they are the quickest in the narrows."
 zin_lerendor_gateway_of_r_en:0 "The Gateway of R'en"
 zin_lerendor_gateway_of_r_en_desc:0 "R'en holds the far gateway of the strait and has never fully decided which side it is on. Lerendor makes it an offer: shelter under the Leren banner, or the banner will come to R'en."
 zin_lerendor_gateway_talks:0 "Talks at the Gateway"
 zin_lerendor_gateway_talks_desc:0 "R'en holds the far side of the strait and a gateway that Lerendor has long wished to control. Quiet talks begin at a country inn, with no heralds and no banners."
 zin_lerendor_great_ships:0 "Great Ships of the Line"
 zin_lerendor_great_ships_desc:0 "The shipwrights are asked to build something larger than a galley and heavier than a cog: a ship of three decks, with engines on every one and a keel as long as a hall. It will be a great ship, and a great expense."
 zin_lerendor_hall_of_two_crowns:0 "The Hall of Two Crowns"
 zin_lerendor_hall_of_two_crowns_desc:0 "A great new hall is built in Sonargur, with a throne at each end and a table between them. Its doors are open to both crowns, and its windows face the strait."
 zin_lerendor_hear_the_fishermen:0 "Hear the Fishermen"
 zin_lerendor_hear_the_fishermen_desc:0 "The fishermen of the northern coast speak of strange lights on the black water and of nets that come up with things in them. No official has ever cared enough to write it down, and the king has decided to start."
 zin_lerendor_hold_north:0 "Holding the North"
 zin_lerendor_hold_north_desc:0 "Nobody is coming to help; the north will hold itself."
 zin_lerendor_hold_the_capes:0 "Hold the Capes"
 zin_lerendor_hold_the_capes_desc:0 "The capes that command the strait are strengthened with every stone that can be spared. If the dead cannot pass the capes, they cannot pass the strait."
 zin_lerendor_hold_the_capes_tip_1:0 "Counts toward barring the strait."
 zin_lerendor_hold_the_north_alone:0 "Hold the North Alone"
 zin_lerendor_hold_the_north_alone_desc:0 "The dead are on the northern shore, and nobody will come to help. The king calls his lords and tells them what they already know: Lerendor will hold the north, or the north will be lost."
 zin_lerendor_honour_the_treaty:0 "Honour the Treaty"
 zin_lerendor_honour_the_treaty_desc:0 "The king renews his oath to Aenor, as his fathers swore it at the Narrow Strait in 512. If the Golden Court has grown proud and the temples grown strange, the oath was to the realm, and not to a king."
 zin_lerendor_joint_squadron:0 "The Joint Fleet"
 zin_lerendor_joint_squadron_desc:0 "A flotilla of Leren and Aenoran ships is formed under a joint flag, to sail the strait and the northern coast together. Their captains drink together and fight about the signals."
 zin_lerendor_keeps_on_the_northern_shore:0 "Keeps on the Northern Shore"
 zin_lerendor_keeps_on_the_northern_shore_desc:0 "Stone keeps with deep wells and thick walls go up along the northern shore, each in sight of the next. They are cold, drab places, and the men who garrison them are proud of it."
 zin_lerendor_kings_peace:0 "The King's Peace"
 zin_lerendor_kings_peace_desc:0 "The king takes the oath of the peace: the roads are the king's, the courts are the king's and so, in the end, are the quarrels. The people are reassured, and the lords less so."
 zin_lerendor_leren_marines:0 "Sea-Soldiers of the Leren Shore"
 zin_lerendor_leren_marines_desc:0 "Companies of picked spearmen are drilled to fight on a deck and to land from a boat, wearing leather instead of mail and carrying their shields on their backs. The Leren shore has a use for such men."
 zin_lerendor_leren_shieldwall:0 "The Leren Shieldwall"
 zin_lerendor_leren_shieldwall_desc:0 "The northern companies are drilled in the shieldwall: a locked line of overlapping shields, trained to hold against anything that comes. It is not a graceful formation, and it does not need to be."
 zin_lerendor_lerendors_north_estates:0 "Summon the Estates of Lerendor's North"
 zin_lerendor_lerendors_north_estates_desc:0 "The lords and free towns of Lerendor's North are called to Sonargur in full session, for the first time in a generation. They arrive with a long list of petitions and a longer one of old complaints."
 zin_lerendor_levy_of_the_north:0 "The Levy of the North"
 zin_lerendor_levy_of_the_north_desc:0 "Every village from the strait to the ice-line is called to arms, and the king opens his armouries to equip them. It is the biggest muster in the kingdom's history, and no one is sure it is enough."
 zin_lerendor_long_watch:0 "The Long Watch"
 zin_lerendor_long_watch_desc:0 "Stone keeps on the northern shore, each in sight of the next, manned in every season."
 zin_lerendor_lord_admiral:0 "A Lord Admiral of the Strait"
 zin_lerendor_lord_admiral_desc:0 "Ostvar Greysail, who has run blockades from the Leren Ocean to the Dark Lands and back, is named a second Lord Admiral beside the old one. The younger captains are delighted, and the older ones merely resigned."
 zin_lerendor_marriages_across_the_north:0 "Marriages Across the North"
 zin_lerendor_marriages_across_the_north_desc:0 "Cousins and younger children of the northern houses are betrothed in a long season of feasts. The blood-ties thus made will outlast any treaty."
 zin_lerendor_master_of_the_strait:0 "Mastery of the Strait"
 zin_lerendor_master_of_the_strait_desc:0 "The strait belongs to the one who holds both of its banks, and the Admiralty has long dreamed of doing so. The king takes the dream seriously, and the dream takes the king."
 zin_lerendor_masters_of_the_strait:0 "Masters of the Strait Waters"
 zin_lerendor_masters_of_the_strait_desc:0 "No other fleet on the Leren Ocean can match the crown's in these waters, and the captains know it."
 zin_lerendor_masters_of_the_strait_waters:0 "Masters of the Strait Waters"
 zin_lerendor_masters_of_the_strait_waters_desc:0 "Captains call it a boast, the Admiralty calls it a fact: no other fleet on the Leren Ocean can match Lerendor's in these waters. The sea lords raise a toast in Sonargur and look to the south."
 zin_lerendor_masters_of_the_strait_waters_tip_1:0 "Opens Mastery of the Strait without hegemony 40."
 zin_lerendor_merchant_guilds:0 "The Merchant Guilds of the Strait"
 zin_lerendor_merchant_guilds_desc:0 "The traders of both shores are given leave to form guilds with their own halls and their own judges. They pay their dues in good silver and complain only moderately."
 zin_lerendor_mina_and_the_hold:0 "Mina and The Hold"
 zin_lerendor_mina_and_the_hold_desc:0 "Mina and The Hold are small crowns with large neighbours, and both have been looking for a patron. The king receives their ambassadors with ceremony and sends them home with gifts."
 zin_lerendor_molot_marches:0 "The Molot Marches"
 zin_lerendor_molot_marches_desc:0 "Molot holds a march of rough country on the Compact's eastern edge, and has long been quarrelling with its neighbours over a river. Sonargur offers to settle the matter, on terms."
 zin_lerendor_muster_rolls:0 "Muster Rolls of the Two Crowns"
 zin_lerendor_muster_rolls_desc:0 "The two crowns count their fighting men together for the first time. The totals are larger than either expected, and the clerks have to check them twice."
 zin_lerendor_no_crown_above_ours:0 "No Crown Above Ours"
 zin_lerendor_no_crown_above_ours_desc:0 "The king takes the title of sovereign of both crowns by his own right, without leave from any court. The lords of both realms cheer, and a few older men glance at the empty chair where an Aenoran envoy used to sit."
 zin_lerendor_northern_companies:0 "The Northern Companies"
 zin_lerendor_northern_companies_desc:0 "Companies of the northern crowns sail south to join the host that has risen against the dark, without banner or pay, in the name of the realm. They have been told that they may go home when the work is done, and most of them believe it."
 zin_lerendor_northern_fairs:0 "The Northern Fairs"
 zin_lerendor_northern_fairs_desc:0 "Fairs are held in the northern ports each summer, open to the traders of every crown that sits on the Leren Ocean. A buyer who comes once for the wool will come again for the friendship."
 zin_lerendor_northern_industry:0 "A Northern Craft"
 zin_lerendor_northern_industry_desc:0 "The crown puts the strait's wealth to use in the northern towns: new workshops, new armouries, new roads between them. By the end of the year the north makes things that used to come from Parim."
 zin_lerendor_northern_industry_spirit:0 "A Northern Craft"
 zin_lerendor_northern_industry_spirit_desc:0 "The northern towns make goods that used to come from Parim, and make them well."
 zin_lerendor_old_alliance:0 "The Old Alliance"
 zin_lerendor_old_alliance_desc:0 "The oaths of 512 are sworn anew by sovereigns who have learned what each is worth."
 zin_lerendor_one_banner_for_the_north:0 "One Banner for the North"
 zin_lerendor_one_banner_for_the_north_desc:0 "The northern crowns, the king says, need one standard and one leader. Those who rally to it will have the king's protection, and those who do not may find their position less comfortable."
 zin_lerendor_one_throne:0 "One Throne, Two Laws"
 zin_lerendor_one_throne_desc:0 "A charter is drawn up that sets out what belongs to Lerendor, what belongs to Lerendor's North and what belongs to the king alone. Lawyers on both sides contribute, and each is sure the other gave too much."
 zin_lerendor_open_the_compact:0 "Open the Compact to the Small Crowns"
 zin_lerendor_open_the_compact_desc:0 "The doors of the Compact are opened to any northern crown that wishes to enter, whatever its size. Sonargur will speak for them in the councils of the strait, and expects to be remembered."
 zin_lerendor_opinion_equals:0 "A Treaty Among Equals"
 zin_lerendor_opinion_friendship:0 "Friendship with Sonargur"
 zin_lerendor_opinion_oaths:0 "Oaths of 512 Renewed"
 zin_lerendor_opinion_refused:0 "Treaty Refused"
 zin_lerendor_patrol_the_black_islands:0 "Patrol the Black Islands"
 zin_lerendor_patrol_the_black_islands_desc:0 "Galleys set out to the black islands, whose shores are bare and silent, and return with reports that make the senior captains uneasy. Whatever lives there, it does not wish to be seen."
 zin_lerendor_prize_courts:0 "The Prize Courts"
 zin_lerendor_prize_courts_desc:0 "The Admiralty sets up courts to decide what cargoes may lawfully be taken, and by whom. The judges are all captains, and the verdicts are quick."
 zin_lerendor_question_of_the_strait:0 "The Question of the Strait"
 zin_lerendor_question_of_the_strait_desc:0 "The council can put it off no longer: what is Lerendor to the strait, and what is the strait to Lerendor? Three answers lie on the table, and the king has been asked to choose."
 zin_lerendor_question_of_the_strait_tip_1:0 "Opens the three routes."
 zin_lerendor_relief_host:0 "The Relief Host"
 zin_lerendor_relief_host_desc:0 "A Leren host has crossed the sea to relieve Parim, and fights as men fight for a cause they chose."
 zin_lerendor_relief_of_parim:0 "The Relief of Parim"
 zin_lerendor_relief_of_parim_desc:0 "Parim has fallen into the wrong hands. A Leren host sails south to take it back, with a banner that has not been seen on the Great Lake for five hundred years."
 zin_lerendor_renew_the_oaths:0 "Renew the Oaths of 512"
 zin_lerendor_renew_the_oaths_desc:0 "A deputation of Leren lords goes to Parim with the old treaty in a casket, to swear it again on the Great Lake. The ceremony is old, the words are older, and the question is whether anyone remembers what they mean."
 zin_lerendor_reopen_toll_quarrel:0 "Reopen the Toll Quarrel"
 zin_lerendor_reopen_toll_quarrel_desc:0 "The toll of 1716 was set by an Aenoran envoy and never revised. Sonargur writes to Parim to say that the strait has grown, that the ships have grown and that the toll has not."
 zin_lerendor_reopen_toll_quarrel_tip_1:0 "Parim will answer within weeks."
 zin_lerendor_royal_dockyards:0 "The Royal Dockyards"
 zin_lerendor_royal_dockyards_desc:0 "The crown takes the yards of Sonargur under its own hand, with a master shipwright who answers to the Admiralty. A royal ship, it is said, is a ship that is built to last."
 zin_lerendor_royal_dockyards_spirit:0 "The Royal Dockyards"
 zin_lerendor_royal_dockyards_spirit_desc:0 "The crown's own yards build to last, and to a pattern."
 zin_lerendor_royal_household:0 "The Sonargur Household"
 zin_lerendor_royal_household_desc:0 "The king's household is the first court of the realm, and its stewards give orders in both crowns."
 zin_lerendor_royal_progress:0 "The Royal Progress"
 zin_lerendor_royal_progress_desc:0 "The king and his household travel the realm in state: a banner, a hundred riders and a herald who announces each town by its oldest name. Crowds line the roads, and clerks write down what they say."
 zin_lerendor_scholars_of_the_dead:0 "Scholars of the Dead"
 zin_lerendor_scholars_of_the_dead_desc:0 "The king pays a few scholars to read the oldest books in his library, the ones that no one has opened for years. They find a great deal of nonsense, and a few things that are not nonsense at all."
 zin_lerendor_sea_lords:0 "Bind the Sea Lords"
 zin_lerendor_sea_lords_desc:0 "The sea lords of the northern coast have always kept their own ships and their own laws. The king asks them to swear service to the crown, and offers a charter in return."
 zin_lerendor_sea_of_darkness_charts:0 "Charts of the Sea of Darkness"
 zin_lerendor_sea_of_darkness_charts_desc:0 "Steersmen who have sailed the Sea of Darkness are paid to draw what they remember: reefs, currents, harbours and the strange lights that sometimes show on the water. The charts are rough, and better than none."
 zin_lerendor_seek_the_old_wards:0 "Seek the Old Wards"
 zin_lerendor_seek_the_old_wards_desc:0 "The scholars report that the old wardens of the north knew wards that held the dead at the water's edge. The king orders every library, tomb and monastery searched for them."
 zin_lerendor_seek_the_old_wards_tip_1:0 "The wardens' old craft is sought. What it can still do is unknown."
 zin_lerendor_shelter_the_refugees:0 "Shelter the Refugees"
 zin_lerendor_shelter_the_refugees_desc:0 "Ships bring families fleeing the war in the south, with bundles on their backs and children in their arms. The king orders the gates opened, and the harbour masters find places for them to sleep."
 zin_lerendor_shield_of_dondor:0 "The Shield of Dondor"
 zin_lerendor_shield_of_dondor_desc:0 "Dondor is a stubborn human realm in the shadow of the orc-lords, and Lerendor promises it that the strait will be open if it ever calls. In Cocanoor, the promise is noted with interest."
 zin_lerendor_shield_the_northern_coast:0 "Shield Aenor's Northern Coast"
 zin_lerendor_shield_the_northern_coast_desc:0 "Leren warships patrol the coast of Aenor north of the strait, as no Aenoran fleet has done for a century. Fishermen on the Aenoran shore are now glad of a sail on the horizon."
 zin_lerendor_shield_the_northern_coast_tip_1:0 "Leren fleets patrol the strait for Aenor."
 zin_lerendor_shieldwall:0 "The Leren Shieldwall"
 zin_lerendor_shieldwall_desc:0 "A locked line of overlapping shields, trained to hold against anything that comes."
 zin_lerendor_sonargur_household:0 "The Sonargur Household"
 zin_lerendor_sonargur_household_desc:0 "The king's household in Sonargur is made the first court of the realm, with its own stewards, marshals and chamberlains. The lords of Lerendor's North are invited to send their sons to serve in it, and some do."
 zin_lerendor_sonargur_wharves:0 "The Wharves of Sonargur"
 zin_lerendor_sonargur_wharves_desc:0 "New wharves, cranes and bonded warehouses line the water below the palace. A strait that is crossed by a thousand ships a year is a field worth ploughing."
 zin_lerendor_sovereign:0 "Sovereign of the Narrow Sea"
 zin_lerendor_sovereign_desc:0 "Both banks are held and the king is crowned at the harbour chain. The north has never seen the like."
 zin_lerendor_sovereign_of_the_narrow_sea:0 "Sovereign of the Narrow Sea"
 zin_lerendor_sovereign_of_the_narrow_sea_desc:0 "Both banks of the strait are held, the fleet rides at the chain and the king is proclaimed Sovereign of the Narrow Sea. The north has never seen anything like it."
 zin_lerendor_stand_apart:0 "The North Stands Apart"
 zin_lerendor_stand_apart_desc:0 "The king decides that Lerendor will keep its own counsel. Whatever quarrels may come to Aenor, the north will look to its own coasts and answer only to its own crown."
 zin_lerendor_strait_ambition:0 "Ambition of the Strait"
 zin_lerendor_strait_ambition_desc:0 "The Admiralty has dreamed for a century of holding both banks. Now it plans for it."
 zin_lerendor_strait_merchants:0 "Merchants of the Strait"
 zin_lerendor_strait_merchants_desc:0 "Guilds of both shores trade freely under the king's seal and pay their dues without much argument."
 zin_lerendor_strait_pilots:0 "Steersmen of the Narrow Strait"
 zin_lerendor_strait_pilots_desc:0 "Every vessel that wishes to pass the narrows must take aboard a steersman of the strait, who knows the shoals, the tides and the moods of the weather. The steersmen are paid by the ship, and are proud of never having lost one."
 zin_lerendor_strait_pilots_spirit:0 "Steersmen of the Narrow Strait"
 zin_lerendor_strait_pilots_spirit_desc:0 "The steersmen know every shoal, tide and temper of the narrows, and charge for it."
 zin_lerendor_strait_treasury:0 "The Strait Treasury"
 zin_lerendor_strait_treasury_desc:0 "The dues of the narrow strait pass through a single counting-house in Sonargur, under the king's seal and a roomful of clerks. What the strait brings in, the crown can spend, and the clerks have a good idea of how much that is."
 zin_lerendor_strait_war_chest:0 "The Strait War Chest"
 zin_lerendor_strait_war_chest_desc:0 "A portion of every toll is sealed in a vault beneath the palace, along with weapons from the new forges and a standing order that none of it is to be touched without the king's hand. Few people know the size of the chest, and that is its purpose."
 zin_lerendor_strait_watch:0 "The Strait Watch"
 zin_lerendor_strait_watch_desc:0 "The fleet is drilled to hold the narrows and nothing else: signal-watches, picket galleys and a chain that can be raised in a quarter of an hour. Ships that wish to pass will pass on the king's terms."
 zin_lerendor_strait_watch_spirit:0 "The Strait Watch"
 zin_lerendor_strait_watch_spirit_desc:0 "Picket galleys, signal-watches and a chain that rises in a quarter-hour."
 zin_lerendor_strait_watch_tip_1:0 "Permits Close the Strait."
 zin_lerendor_tear_up_the_treaty:0 "Tear Up the Treaty"
 zin_lerendor_tear_up_the_treaty_desc:0 "The king tears the treaty in two before the council and burns the halves in a brazier of the Admiralty. The Sea Lords cheer; the lawyers look at their shoes."
 zin_lerendor_the_crowns_fleet:0 "The Crown's Fleet"
 zin_lerendor_the_crowns_fleet_desc:0 "Leren shipwrights are ordered to double their output, and the Aenoran admiralty is invited to help. The strait fills with half-built hulls and the smell of fresh pitch."
 zin_lerendor_the_dead_walk:0 "The Dead Walk"
 zin_lerendor_the_dead_walk_desc:0 "The black ships have come, and the dead are on the beaches. Every beacon on the Leren coast is lit, every bell is rung and every man who can carry a spear is called to the walls."
 zin_lerendor_the_far_shore:0 "The Far Shore"
 zin_lerendor_the_far_shore_desc:0 "The southern bank of the strait, long held by Aenor and its friends, is claimed in the name of the Leren crown. The claim is old and the court is thin on friends, so the king sees an opening."
 zin_lerendor_the_free_north:0 "The Free North"
 zin_lerendor_the_free_north_desc:0 "The north is free of every old bond: no tribute to Parim, no dread of the dead and no door open to anyone it has not invited. The king says so in the hall, and the hall believes him."
 zin_lerendor_the_iron_toll:0 "The Iron Toll"
 zin_lerendor_the_iron_toll_desc:0 "The toll is raised to a sum that no merchant can pay without cursing, and that no merchant can avoid. Those who refuse find that the chain has been raised."
 zin_lerendor_the_kings_army:0 "The King's Army"
 zin_lerendor_the_kings_army_desc:0 "The king's own companies are drilled in new formations and sent to winter on the northern shore. They grumble about the cold, and about the officers who made them go."
 zin_lerendor_the_leren_compact:0 "The Leren Compact"
 zin_lerendor_the_leren_compact_desc:0 "The Compact is a league of the northern crowns, loose in form and warm in intent. Lerendor is its oldest member and its natural head, and has been careful never to say so."
 zin_lerendor_the_leren_hegemony:0 "The Leren Hegemony"
 zin_lerendor_the_leren_hegemony_desc:0 "The crowns of the north look to Sonargur as they once looked to Parim, and ask nothing of their new master but protection. The king gives it, and notes the price."
 zin_lerendor_the_leren_hegemony_tip_1:0 "An outcome of this game, not history."
 zin_lerendor_the_long_watch:0 "The Long Watch"
 zin_lerendor_the_long_watch_desc:0 "North of the strait, the cold sea and the black islands are watched from towers older than the crown. The king revives the watch, names a marshal to command it and tells him to look further than he has been looking."
 zin_lerendor_the_neutral_north:0 "The Neutral North"
 zin_lerendor_the_neutral_north_desc:0 "The king announces that Lerendor, and any crown that wishes to stand with it, will take no side in the quarrels of the south. The announcement is welcomed in the northern ports and read carefully in Parim."
 zin_lerendor_the_north_apart:0 "The North Apart"
 zin_lerendor_the_north_apart_desc:0 "Lerendor keeps its own counsel, and its borders are the better guarded for it."
 zin_lerendor_the_old_alliance_restored:0 "The Old Alliance Restored"
 zin_lerendor_the_old_alliance_restored_desc:0 "The oaths of 512 are sworn anew on the Great Lake, by a king and a crown who have each learned what the other is worth. The northern lords go home confident that the strait has two friends."
 zin_lerendor_the_old_alliance_restored_tip_1:0 "An outcome of this game, not history."
 zin_lerendor_the_watch_holds:0 "The Watch Holds"
 zin_lerendor_the_watch_holds_desc:0 "Month after month the dead break against the northern keeps and fall back. The watchmen, who have been told they are doomed, discover that they are not."
 zin_lerendor_timber_of_lerendors_north:0 "Timber of Lerendor's North"
 zin_lerendor_timber_of_lerendors_north_desc:0 "The hills of Lerendor's North are thick with ship-timber, and the lords of the western crown have been asking for a reason to fell it. The king gives them one, in the form of a new yard and a standing order."
 zin_lerendor_toll_houses:0 "Toll Houses on Both Shores"
 zin_lerendor_toll_houses_desc:0 "Toll houses go up on both banks of the strait, each with a signal tower and a boat for the collectors. Brannoc the Toll-Master takes charge of the books and is said to know every sail on the water."
 zin_lerendor_toll_houses_spirit:0 "Toll Houses on Both Shores"
 zin_lerendor_toll_houses_spirit_desc:0 "Every ship that passes the narrows is counted, and every count is a coin."
 zin_lerendor_toll_rolls:0 "Read the Toll Rolls"
 zin_lerendor_toll_rolls_desc:0 "The old toll rolls are brought out and read aloud before the council: every ship, every cargo, every sum that Parim once promised and never paid. The treasurer reads without emphasis, and the silence afterwards is long."
 zin_lerendor_tolvael_question:0 "The Tolvael Question"
 zin_lerendor_tolvael_question_desc:0 "Tolvael is the closest rival to Lerendor among the northern crowns, proud, prickly and unwilling to be anyone's ally. Sonargur sends a letter that is carefully polite and asks a simple question."
 zin_lerendor_treaty_kept:0 "The Treaty Kept"
 zin_lerendor_treaty_kept_desc:0 "The oath of 512 was renewed, and its keeping is a point of honour in both courts."
 zin_lerendor_treaty_toll:0 "Keep the Treaty Toll"
 zin_lerendor_treaty_toll_desc:0 "The king swears that the toll of 512 will stand as the treaty set it, a modest sum paid by friends. The Golden Court is relieved, and the northern lords are not."
 zin_lerendor_tribute_of_the_dark_shore:0 "Tribute of the Dark Shore"
 zin_lerendor_tribute_of_the_dark_shore_desc:0 "Realms of the Dark Shore are given the choice between friendship and tribute. The friendly ones are offered the king's protection; the others, a list of claims."
 zin_lerendor_two_crowns:0 "The Two Crowns of Leren"
 zin_lerendor_two_crowns_desc:0 "Lerendor and Lerendor's North have shared one throne since 4A 411, and have never shared a mind. The king wears both crowns on the same day, and every lord in the hall watches to see which sits higher."
 zin_lerendor_union_reforms:0 "The Union Reforms"
 zin_lerendor_union_reforms_desc:0 "The union of the crowns is set down in a new charter after three hundred years. Every lord wants a say, and the king knows that the text is only as strong as the peace it is written in."
 zin_lerendor_wardens_of_the_dark_straits:0 "Wardens of the Dark Straits"
 zin_lerendor_wardens_of_the_dark_straits_desc:0 "The captains of the Dark Straits are given a charter: they are to keep the water free for honest ships and to make life difficult for the other kind. Their sea-fort at the narrows is already the best-armed place on the coast."
 zin_lerendor_watch_holds:0 "The Watch Holds"
 zin_lerendor_watch_holds_desc:0 "The keeps have broken the dead for a year. The watchmen no longer think themselves doomed."
 zin_lerendor_watch_on_goldoroth:0 "Watch on Goldoroth"
 zin_lerendor_watch_on_goldoroth_desc:0 "The orc-lords of Goldoroth keep their war-fleets in a harbour behind a volcano. Lerendor sends traders, spies and a few discreet sea captains to find out what goes in and out of it."
 zin_lerendor_watchfires_on_the_capes:0 "Watch-Fires on the Capes"
 zin_lerendor_watchfires_on_the_capes_desc:0 "Beacons are raised on the capes of the northern shore and a road is cut to each, so that a fire seen at midnight is answered before the dawn."
 zin_lerendor_when_aenor_calls:0 "When Aenor Calls"
 zin_lerendor_when_aenor_calls_desc:0 "The horns sound from Parim: the realm is attacked, and the old friends of the treaty are called. The northern fleet sets sail before the messenger has finished his message."
 zin_lerendor_whispers_in_the_dark_holds:0 "Whispers in the Dark Holds"
 zin_lerendor_whispers_in_the_dark_holds_desc:0 "Merchants report that the hold-lords of the Dark Lands are being courted by strangers from the south. The holds laugh at them, but the strangers are patient, and have a great deal of gold."
 zin_lerendor_withdraw_from_the_treaty:0 "Withdraw from the Treaty"
 zin_lerendor_withdraw_from_the_treaty_desc:0 "The seal of the treaty of 512 is broken before the council, and the pieces are returned to Parim in a plain box. The king does not declare war; he simply declares that the alliance is over."
 zin_lerendor.1.a:0 "Two crowns, one throne."
 zin_lerendor.1.b:0 "Sonargur leads."
 zin_lerendor.1.d:0 "The king wears the crown of Lerendor in the morning and the crown of Lerendor's North in the afternoon, as his fathers did. This year a herald asks, quietly, whose crown the king will wear when the two disagree."
 zin_lerendor.1.t:0 "The Two Crowns"
 zin_lerendor.10.a:0 "Note it and watch."
 zin_lerendor.10.b:0 "Tell Parim."
 zin_lerendor.10.d:0 "Leren traders report that agents from the Ember Lands are courting the orc holds, with gifts and promises. Most of the holds laugh at them, and a few do not. The captain of the watch asks whether to tell Parim."
 zin_lerendor.10.t:0 "Whispers in the Dark Holds"
 zin_lerendor.11.a:0 "Keep the books."
 zin_lerendor.11.b:0 "Old wives' tales."
 zin_lerendor.11.d:0 "The scholars of Sonargur have read the oldest books in the king's library. They say the dead of the north were never laid to rest by iron alone, and that the old wardens had a craft that could do it. The master of the college adds that this may be nothing but old wives' tales."
 zin_lerendor.11.t:0 "What the Scholars Found"
 zin_lerendor.12.a:0 "Renew them."
 zin_lerendor.12.b:0 "Parim has no time for northern oaths."
 zin_lerendor.12.d:0 "A Leren deputation has come to Parim with the old treaty in a casket. They ask the Golden Court to renew the oaths on the shore of the Great Lake, as the first signers did. The court is busy, and the ceremony is long."
 zin_lerendor.12.t:0 "The Oaths of 512"
 zin_lerendor.13.a:0 "Remember every one."
 zin_lerendor.13.b:0 "Remember, but trade."
 zin_lerendor.13.d:0 "The clerks of the crown read two centuries of slights to the council, from the toll of 1716 to the last mocking letter from Parim. The hall is silent. When the clerks finish, the king asks whether to remember everything or to remember only what matters."
 zin_lerendor.13.t:0 "The Grievance Roll"
 zin_lerendor.14.a:0 "Stand with Aenor's people."
 zin_lerendor.14.b:0 "Our oath was to Aenor's king."
 zin_lerendor.14.d:0 "News has come from the south: the king of Aenor has gone east, and his crown with him. The lords of Lerendor, who swore an oath to that king, ask what they swore to. Their king asks the same."
 zin_lerendor.14.t:0 "The Crown Has Fled"
 zin_lerendor.15.a:0 "Sign as equals."
 zin_lerendor.15.b:0 "Aenor signs no such thing."
 zin_lerendor.15.d:0 "A letter has arrived from Sonargur, sealed with both crowns. It proposes a new treaty between Lerendor and Aenor, as two sovereigns who owe each other nothing, and are therefore free to be friends."
 zin_lerendor.15.t:0 "A Treaty Among Equals"
 zin_lerendor.16.a:0 "Long live the Sovereign."
 zin_lerendor.16.d:0 "The king stands on the great chain of Sonargur, with the fleet in the strait below him and the crowds on the shore. A herald raises the crown. The coronation is brief, and the cheer that follows it is long."
 zin_lerendor.16.t:0 "The Crown of the Strait"
 zin_lerendor.17.a:0 "Open the gates."
 zin_lerendor.17.b:0 "Feed them and send them on."
 zin_lerendor.17.d:0 "Boats arrive daily with families fleeing the war in the south. They sleep on the quays and in the churches, and the harbour master asks the king what is to be done with them."
 zin_lerendor.17.t:0 "Refugees at Sonargur"
 zin_lerendor.18.a:0 "Go as free men."
 zin_lerendor.18.d:0 "Northern volunteers are sailing south in fishing boats and merchant cogs, to join the stranger who has come to break the dead. They have no orders, no pay and no banner. They go as free men."
 zin_lerendor.18.t:0 "The Free Companies Sail"
 zin_lerendor.19.a:0 "More seats for Lerendor's North."
 zin_lerendor.19.b:0 "One law from Sonargur."
 zin_lerendor.19.d:0 "The reforms of the union have come before the council at last, and the lords of both crowns have their say. The old men of Lerendor's North want more seats at court; the men of Sonargur want one law from the throne."
 zin_lerendor.19.t:0 "The Union Reforms"
 zin_lerendor.2.a:0 "To the towns of Lerendor's North."
 zin_lerendor.2.b:0 "To the strait ports."
 zin_lerendor.2.d:0 "The king's progress is planned, and the council cannot agree on the route. The towns of Lerendor's North would be honoured by a visit; the strait ports would be flattered. The king has a month, a household of two hundred and a choice."
 zin_lerendor.2.t:0 "The Royal Progress"
 zin_lerendor.20.a:0 "Let the king decide."
 zin_lerendor.20.d:0 "The council has met for three days to debate the strait: whether Lerendor is the treaty's friend, the treaty's master or no longer a party to it. The figures have been laid on the table: the standing of the crown, the strength of the Compact, the weight of the dues. Now the king must choose."
 zin_lerendor.20.t:0 "The Question of the Strait"
 zin_lerendor.21.a:0 "Tolvael is a friend."
 zin_lerendor.21.d:0 "The reply from Tolvael has come, in the hand of its own king: a warm letter and a gift of horses. It speaks of old friendship and of nothing that Sonargur might regret. The court is pleased."
 zin_lerendor.21.t:0 "Tolvael's Answer"
 zin_lerendor.22.a:0 "The march is settled."
 zin_lerendor.22.d:0 "The lords of Molot have accepted the king's offer. A treaty is drawn up along the river, with Leren judges to keep the peace, and the border farmers are said to be relieved."
 zin_lerendor.22.t:0 "Molot's Answer"
 zin_lerendor.23.a:0 "A bargain made."
 zin_lerendor.23.d:0 "The warlord of Goldoroth has taken the envoy's salt and silver, and signed a paper that says he will not raid Leren ships. Whether he will keep it is a question for the next harvest."
 zin_lerendor.23.t:0 "Goldoroth's Answer"
 zin_lerendor.24.a:0 "The oaths are renewed."
 zin_lerendor.24.d:0 "The Golden Court has accepted. The oaths of 512 have been sworn again on the shore of the Great Lake, and the Leren deputation brings home a casket with a new seal."
 zin_lerendor.24.t:0 "Parim Answers the Oaths"
 zin_lerendor.25.a:0 "Equals at last."
 zin_lerendor.25.d:0 "The reply from Parim has come: the treaty is signed, with two seals and a handshake. The old quarrels are written off in a single clause."
 zin_lerendor.25.t:0 "Parim's Reply"
 zin_lerendor.26.a:0 "Answer as friends."
 zin_lerendor.26.b:0 "The Refusal stands."
 zin_lerendor.26.d:0 "Letters have come from the king of Lerendor, in a careful and friendly hand. They offer friendship, and say nothing of membership or alliance. The elders read them, and note that the writer knows the Refusal and respects it."
 zin_lerendor.26.t:0 "Letters from Sonargur"
 zin_lerendor.27.a:0 "Tolvael has made its choice."
 zin_lerendor.27.d:0 "Tolvael's answer is brief and cold: the crown of Tolvael answers to nobody, and will take no part in a league headed by another. The gifts have been returned, unopened."
 zin_lerendor.27.t:0 "Tolvael Declines"
 zin_lerendor.28.a:0 "Molot keeps its river."
 zin_lerendor.28.d:0 "Molot thanks the king for his generous offer and declines it. The lords prefer to keep the river quarrel in their own hands, and to be grateful for it to no one."
 zin_lerendor.28.t:0 "Molot Keeps the Balance"
 zin_lerendor.29.a:0 "Goldoroth will not bargain."
 zin_lerendor.29.d:0 "The envoy comes home with his cask still full. The warlord of Goldoroth will bargain with nobody, he says; his axe is his bargain, and it is not for sale."
 zin_lerendor.29.t:0 "Goldoroth Refuses"
 zin_lerendor.3.a:0 "A daughter of a Lerendor's North house."
 zin_lerendor.3.b:0 "A daughter of Eekedor's merchant houses."
 zin_lerendor.3.c:0 "A cousin of the Aenoran court."
 zin_lerendor.3.d:0 "Three matches are proposed for the heir: a daughter of a Lerendor's North house, a daughter of Eekedor's merchant families, and a cousin of the Aenoran court. Each has its backers and its dowry."
 zin_lerendor.3.t:0 "A Marriage for the Heir"
 zin_lerendor.30.a:0 "Parim has no time."
 zin_lerendor.30.d:0 "The Leren deputation has come home from Parim without a seal. The court there, they report, was too busy for an old treaty, and the steward who dismissed them was hardly civil about it."
 zin_lerendor.30.t:0 "Parim Refuses the Oaths"
 zin_lerendor.31.a:0 "So be it."
 zin_lerendor.31.d:0 "The reply from Parim is courteous and quite clear: Aenor does not sign treaties with equals, because it has none. The king reads it twice and puts it in the fire."
 zin_lerendor.31.t:0 "Parim Refuses"
 zin_lerendor.4.a:0 "So be it."
 zin_lerendor.4.d:0 "The priests of the Deliverer come to Sonargur to bless the union of the crowns. They preach in the great hall of the old friendship between Lerendor and Parim, and the lords listen with the courteous attention of men who have heard it all before."
 zin_lerendor.4.t:0 "The Priests of the Deliverer"
 zin_lerendor.5.a:0 "Oaths to the crown."
 zin_lerendor.5.b:0 "Charters to the captains."
 zin_lerendor.5.d:0 "The sea lords stand before the throne, each in his own colours, and wait to hear the oath. They will swear to the crown for a price, and the question is what price the crown is willing to pay."
 zin_lerendor.5.t:0 "The Sea Lords Swear"
 zin_lerendor.6.a:0 "Sonargur presides."
 zin_lerendor.6.b:0 "Eekedor presides this year."
 zin_lerendor.6.d:0 "Envoys of the northern crowns have gathered in Sonargur for the Compact Council. The first matter is the oldest: who is to preside? The king of Lerendor says nothing, and waits for the room to settle."
 zin_lerendor.6.t:0 "The Compact Council Meets"
 zin_lerendor.7.a:0 "Friendship with Sonargur."
 zin_lerendor.7.b:0 "Tolvael answers to no crown."
 zin_lerendor.7.d:0 "A Leren envoy has arrived in Tolvael with a courteous letter and a heavy chest of gifts. The letter asks whether Tolvael would care to count itself a friend of Sonargur. The court of Tolvael is proud, and not accustomed to being asked."
 zin_lerendor.7.t:0 "Sonargur Asks Tolvael"
 zin_lerendor.8.a:0 "Settle the march."
 zin_lerendor.8.b:0 "Keep the balance."
 zin_lerendor.8.d:0 "A Leren envoy comes to the border lords of Molot with an offer to settle their long quarrel over the river. The lords have fought for the river for three generations, and are tired of it, and suspicious of anyone who offers to end it."
 zin_lerendor.8.t:0 "The Molot March"
 zin_lerendor.9.a:0 "Trade and no raids."
 zin_lerendor.9.b:0 "Orcs bargain with no one."
 zin_lerendor.9.d:0 "An envoy from the Leren crown has been admitted to the warlord's hall, with salt, wine and a cask of silver. He proposes that the ships of Goldoroth and the ships of Lerendor should pass each other without raiding. The warlord eats the salt and listens."
 zin_lerendor.9.t:0 "A Leren Envoy"
