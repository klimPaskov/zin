l_english:
 zin_regional_girdon_a_delegate_to_the_ford:0 "A Delegate to the Ford Council"
 zin_regional_girdon_a_delegate_to_the_ford_desc:0 "Girdon sends a warden to sit at the Ford Council. She is to listen, to speak when the river is mentioned, and to count how many seats are on each side."
 zin_regional_girdon_a_lasting_peace:0 "A Lasting Peace"
 zin_regional_girdon_a_lasting_peace_desc:0 "The commission walks the river, hears the claims and records the settlements. For a season, the ford is quiet, and nobody can say the peace is only a pause."
 zin_regional_girdon_a_league_of_councils:0 "A League of Councils"
 zin_regional_girdon_a_league_of_councils_desc:0 "Delegates from Girdon and Corogon sit side by side at a long table. The rivermen and the seamen drink each other's health."
 zin_regional_girdon_aenors_old_friend:0 "Parim's Old Friend"
 zin_regional_girdon_aenors_old_friend_desc:0 "The crown in Parim has deep pockets and long memories. Girdon sends a deputation to ask for its old friendship, and the king is said to be pleased."
 zin_regional_girdon_aldos_wardens:0 "Aldo's Wardens"
 zin_regional_girdon_aldos_wardens_desc:0 "Warden-Captain Aldo Ferrin learned the shield-wall from the old river-masters and now drills their sons. He puts the companies in a line along the river and tells them where to stand."
 zin_regional_girdon_arsenal_of_the_wardens:0 "The Wardens' Arsenal"
 zin_regional_girdon_arsenal_of_the_wardens_desc:0 "A great forge-hall is raised behind the river wall, where smiths make spear-heads, shield-bosses and mail. The wardens carry what they have forged."
 zin_regional_girdon_brothers:0 "Brothers Across the Ford"
 zin_regional_girdon_brothers_across_the_ford:0 "Brothers Across the Ford"
 zin_regional_girdon_brothers_across_the_ford_desc:0 "The Warden-Speaker proposes a brotherhood with Gunwaith, which was her enemy and may be her neighbour in peace. It is a hard thing to ask of those with a grave in every village."
 zin_regional_girdon_council_league:0 "A League of Councils"
 zin_regional_girdon_council_league_desc:0 "Girdon and Corogon have pledged to stand together, one at the fords and one at the quays. Their envoys travel freely in each other's land."
 zin_regional_girdon_defend_the_ford:0 "Defend the Ford"
 zin_regional_girdon_defend_the_ford_desc:0 "The truce is broken and Gunwaith's war-thanes are across the water. The wardens go to the ford with spears and shields, because that is what the ford is for."
 zin_regional_girdon_ford_defenders:0 "Defenders of the Ford"
 zin_regional_girdon_ford_defenders_desc:0 "When the truce broke, the wardens were at the water before the first banner crossed. They know every stone of the ford and every hollow of the bank."
 zin_regional_girdon_girdon_sends_ships:0 "Girdon Sends Ships"
 zin_regional_girdon_girdon_sends_ships_desc:0 "The yards at the river mouth send their first hulls to the fleet. They are small, and they are green, and they are Girdon's own."
 zin_regional_girdon_girdons_friends:0 "Girdon's Friends"
 zin_regional_girdon_girdons_friends_desc:0 "Girdon cannot stand alone for ever, and the wardens know it. The assembly sends envoys to every court that might offer a hand."
 zin_regional_girdon_home_from_the_sea:0 "Home from the Sea"
 zin_regional_girdon_home_from_the_sea_desc:0 "The ships come home, or they do not, and the wardens count who is missing. In this telling the river is quiet, and the ford has been mended."
 zin_regional_girdon_kings_guarantee:0 "The King's Guarantee"
 zin_regional_girdon_kings_guarantee_desc:0 "A letter under the royal seal declares that Girdon's borders will be defended by the crown in Parim. The wardens are not sure they want defending, but the letter sits on the council table."
 zin_regional_girdon_long_feuds_toll:0 "The Long Feud's Toll"
 zin_regional_girdon_long_feuds_toll_desc:0 "Half a century of war with Gunwaith left a grave in every village by the river. The wardens are tired of it and ready for it, and both feelings run in the same men."
 zin_regional_girdon_parims_coin:0 "Parim's Coin"
 zin_regional_girdon_parims_coin_desc:0 "Aenoran gold arrives at Girdon in small, regular purses. It pays for useful things, and everyone in the river towns knows what it buys."
 zin_regional_girdon_parims_regard:0 "Parim's Regard"
 zin_regional_girdon_peace_on_the_river:0 "Peace on the River"
 zin_regional_girdon_peace_on_the_river_desc:0 "The feud is over, and the river runs peacefully between its banks. Girdon has been through the worst of it, and means to build something better."
 zin_regional_girdon_pernias_seal:0 "Pernia's Seal"
 zin_regional_girdon_pernias_seal_desc:0 "Pernia Lothor presses her seal on a charter that gives the assembly one voice in the face of the other. It is not a perfect peace, but it is a working one."
 zin_regional_girdon_pike_and_shield:0 "Pike and Shield"
 zin_regional_girdon_pike_and_shield_desc:0 "The wardens carry a long pike for the front rank and a round shield for the rear. They are hard to break, and harder to outflank."
 zin_regional_girdon_propose_the_commission:0 "Propose a Commission"
 zin_regional_girdon_propose_the_commission_desc:0 "The assembly sends a proposal to Gunwaith: let three wardens and three thanes walk the river each spring. Perhaps it can keep the peace better than the truce can."
 zin_regional_girdon_river_barges:0 "River Barges"
 zin_regional_girdon_river_barges_desc:0 "Long flat barges ply the river from the hills to the sea. The wardens dredge the shallows and mend the locks, and the barge-masters pay a toll."
 zin_regional_girdon_river_bows:0 "River Bows"
 zin_regional_girdon_river_bows_desc:0 "Wardens learn to shoot from the bank at a boat in the current. The best archers are given a banner and a feast day."
 zin_regional_girdon_river_tolls:0 "River Tolls"
 zin_regional_girdon_river_tolls_desc:0 "Every barge that passes a lock pays a copper. The wardens collect it at the gate, and the assembly spends it on the fords."
 zin_regional_girdon_river_will_not_bend:0 "The River Will Not Bend"
 zin_regional_girdon_river_will_not_bend_desc:0 "The river has run in one bed since before the first town was built, and Girdon means to stand on its bank as long. Every ford is mined with stakes, and every bridge is ready to fall."
 zin_regional_girdon_stranded_wardens:0 "Wardens Beyond the Sea"
 zin_regional_girdon_stranded_wardens_desc:0 "Some wardens did not come home. Their captains hold a ruined town beyond the sea, and now they have a banner to rally to."
 zin_regional_girdon_the_assembly_united:0 "The Assembly United"
 zin_regional_girdon_the_assembly_united_desc:0 "The assembly votes as one, on the ford and on everything else. The old quarrel between the two parties is shelved, and the wardens find that they can govern after all."
 zin_regional_girdon_the_blood_price:0 "The Blood-Price"
 zin_regional_girdon_the_blood_price_desc:0 "Girdon offers a blood-price for each of the dead whose killers are known. It is an old custom, and it costs a great deal, and families on both banks come to the gate to collect."
 zin_regional_girdon_the_ford_wardens:0 "The Ford Wardens"
 zin_regional_girdon_the_ford_wardens_desc:0 "The Grey Ford is the one place where the river can be crossed on foot, and wardens have held it since the truce. They are brave, patient and very bored."
 zin_regional_girdon_the_kings_guarantee:0 "The King's Guarantee"
 zin_regional_girdon_the_kings_guarantee_desc:0 "A guarantee under the royal seal arrives at Girdon in a leather case. It says that the crown will answer any attack on the river, and the wardens read it more than once."
 zin_regional_girdon_the_mills_of_girdon:0 "The Mills of Girdon"
 zin_regional_girdon_the_mills_of_girdon_desc:0 "Water-wheels line the river like a necklace. They grind grain, saw timber and drive hammers, and Corla Wend counts every turn of them in her ledgers."
 zin_regional_girdon_the_old_feud_party:0 "The Old Feud Party"
 zin_regional_girdon_the_old_feud_party_desc:0 "Another wing remembers the dead, and wishes to keep their grievances sharp. Its speakers are loud, and the river towns listen to them with half an ear."
 zin_regional_girdon_the_river_league_answered:0 "The River League Answered"
 zin_regional_girdon_the_river_league_answered_desc:0 "Gunwaith has clasped hands, and a league of the two river-realms takes shape. Wardens and thanes share a table, and the old quarrel is spoken of in the past tense."
 zin_regional_girdon_the_river_levy:0 "The River Levy"
 zin_regional_girdon_the_river_levy_desc:0 "Every household within a day's march of the river is called on for a man. The levy is a hard thing, and it has never been a long one."
 zin_regional_girdon_the_river_mouth_yards:0 "The River-Mouth Yards"
 zin_regional_girdon_the_river_mouth_yards_desc:0 "Where the river meets the sea, shipwrights set up slips for sea-going hulls. Girdon has never built ships before, and builds them well."
 zin_regional_girdon_the_river_will_not_bend:0 "The River Will Not Bend"
 zin_regional_girdon_the_river_will_not_bend_desc:0 "Whatever friends Girdon has made, the river is Girdon's own, and its wardens will defend it. The stakes go in, the walls go up and the assembly votes again to hold."
 zin_regional_girdon_the_southern_councils:0 "The Southern Councils"
 zin_regional_girdon_the_southern_councils_desc:0 "Corogon is also a council realm, with harbours where Girdon has fords. The two assemblies exchange letters, and each finds the other's complaints familiar."
 zin_regional_girdon_the_truce_party:0 "The Truce Party"
 zin_regional_girdon_the_truce_party_desc:0 "A wing of the assembly believes the truce is the best thing that has happened to Girdon in fifty years, and wishes to protect it. Their speakers are heard, and their bread is baked."
 zin_regional_girdon_the_wardens_cross:0 "The Wardens Cross"
 zin_regional_girdon_the_wardens_cross_desc:0 "The council has chosen, and the wardens are called. They take ship at the river-mouth yards, with bows strung and shields on their backs."
 zin_regional_girdon_the_winter_ford_remembered:0 "The Winter Ford Remembered"
 zin_regional_girdon_the_winter_ford_remembered_desc:0 "In the dead of winter a stranger stood at the ford and held the crossing for the refugees. The wardens tell the story to children, and carve the date on a stone."
 zin_regional_girdon_walls_at_the_ford:0 "Walls at the Ford"
 zin_regional_girdon_walls_at_the_ford_desc:0 "A stone wall rises on the near bank, with a gate that can be shut in a quarter of an hour. Nobody in Girdon calls it an act of war, though nobody on the other bank believes them."
 zin_regional_girdon_warden_companies:0 "Warden Companies"
 zin_regional_girdon_warden_companies_desc:0 "Each river town raises a company of wardens, with its own banner and its own captain. They drill on the green and march to the ford at the drum."
 zin_regional_girdon_warden_drill:0 "Wardens' Drill"
 zin_regional_girdon_warden_drill_desc:0 "Aldo Ferrin has taught the wardens to hold a shield-wall in a river's current. They stand, they shove and they do not break."
 zin_regional_girdon_wardens_assembly:0 "The Wardens' Assembly"
 zin_regional_girdon_wardens_assembly_desc:0 "Girdon is governed by an assembly of river-wardens who elect a Warden-Speaker. Pernia Lothor signed the Truce of the Grey Ford, and the assembly has stood behind her ever since."
 zin_regional_girdon_wardens_for_the_relief:0 "Wardens for the Relief"
 zin_regional_girdon_wardens_for_the_relief_desc:0 "The west sails to relieve the Middle Lands, and Girdon sends its wardens to stand beside the Aenoran levy. They do not love the crown, but they love the dead less."
 zin_regional_girdon_wardens_of_the_river:0 "Wardens of the River"
 zin_regional_girdon_wardens_of_the_river_desc:0 "The assembly speaks with one voice, and the wardens obey it. Each ford has its captain, each captain has his orders, and nobody has to ask twice."
 zin_regional_girdon.1.a:0 "Sit with them"
 zin_regional_girdon.1.b:0 "Refuse"
 zin_regional_girdon.1.d:0 "Riders from Girdon have come to the court with a proposal: a Ford Commission, of three wardens and three thanes, to walk the river each spring and settle every dispute before it becomes a raid. They say the truce will not hold without one."
 zin_regional_girdon.1.t:0 "Girdon Proposes a Commission"
 zin_regional_girdon.2.a:0 "Not while the dead of the ford lie unburied"
 zin_regional_girdon.2.b:0 "Clasp hands"
 zin_regional_girdon.2.d:0 "A warden of Girdon stands at our end of the Grey Ford with his hands empty. His lady proposes that the two realms swear brotherhood, and that the river become a border for trade and not for war. Many of our thanes have buried kinsmen on the far bank."
 zin_regional_girdon.2.t:0 "Brothers Across the Ford?"
 zin_regional_girdon.3.a:0 "Decline"
 zin_regional_girdon.3.b:0 "Guarantee them"
 zin_regional_girdon.3.d:0 "A deputation from Girdon has arrived in Parim, humbly dressed and carrying a letter from the Warden-Speaker. She asks for the crown's protection against the long quarrel with Gunwaith, and for the favour of a king who has the gold to be generous."
 zin_regional_girdon.3.t:0 "The River Wardens Seek Parim's Friendship"
 zin_regional_girdon.4.a:0 "Decline"
 zin_regional_girdon.4.b:0 "Sign"
 zin_regional_girdon.4.d:0 "Girdon's wardens write that the two council realms have much in common: harbours and fords, merchants and wardens, a dislike of kings and a long list of quarrels with Aenor. They propose a pact, each to guarantee the other."
 zin_regional_girdon.4.t:0 "A Pact of Councils"
