l_english:
 zin_regional_raerby_a_southern_ship:0 "A Southern Ship"
 zin_regional_raerby_a_southern_ship_desc:0 "A fast ship has been seen running north, with elves among her crew. The Captain-Speaker orders the harbour lamps lit, whatever her business."
 zin_regional_raerby_a_word_for_parim:0 "A Word for Parim"
 zin_regional_raerby_a_word_for_parim_desc:0 "A captain with a good coat and a better tongue is sent to Parim. He is to say that the isles want the lanes quiet and have no quarrel with the king."
 zin_regional_raerby_arbiters:0 "Arbiters at Sea"
 zin_regional_raerby_arbiters_at_sea:0 "Arbiters at Sea"
 zin_regional_raerby_arbiters_at_sea_desc:0 "Osk Faran is the most respected arbiter in the isles, and the council gives him a ship of his own. Wherever he sails, quarrels grow quieter."
 zin_regional_raerby_arbiters_desc:0 "Raerby's arbiters ride on the largest ship of each sailing and sit in judgment on the deck. A dispute between two crews is settled before either reaches port."
 zin_regional_raerby_broker_captains:0 "Brokers Between the Islands"
 zin_regional_raerby_broker_captains_desc:0 "When two isles quarrel over a bank, a wreck or a debt, they send for a Raerby captain. His word is not law, but both sides have agreed in advance to hear it."
 zin_regional_raerby_brokers_of_charters:0 "Brokers of Charters"
 zin_regional_raerby_brokers_of_charters_desc:0 "Raerby carries the Pupor Charter to every chart house and brings back their seals. If the Charter has been founded, it takes its own place at the table."
 zin_regional_raerby_brokers_of_charters_spirit:0 "Brokers of Charters"
 zin_regional_raerby_brokers_of_charters_spirit_desc:0 "Raerby's captains carry other realms' charters to the Charter's table and bring back the replies. They are paid in goodwill and, now and then, in coin."
 zin_regional_raerby_brokers_of_peace:0 "Brokers of Peace"
 zin_regional_raerby_brokers_of_peace_desc:0 "Raerby offers its ships and its arbiters as go-betweens. Its captains carry truce flags between fleets, and ask for nothing but safe passage."
 zin_regional_raerby_brokers_of_peace_spirit:0 "Brokers of Peace"
 zin_regional_raerby_brokers_of_peace_spirit_desc:0 "Raerby stands between the fleets with an olive branch and no weapons. Its captains are heard on both sides, and its young men are asked why they do not fight."
 zin_regional_raerby_brokers_of_the_isles:0 "Brokers of the Isles"
 zin_regional_raerby_brokers_of_the_isles_desc:0 "Raerby's trade is small, but its standing is large. The council writes it into its law: a captain who is asked to judge must judge, and judge fairly."
 zin_regional_raerby_captains_council:0 "The Captains' Council"
 zin_regional_raerby_captains_council_desc:0 "Raerby is governed by a council of captains who elect a Captain-Speaker. Lemo Raer holds the wheel now, and the council meets whenever a ship is sighted in the offing."
 zin_regional_raerby_compass_of_raer:0 "Raer's Compass"
 zin_regional_raerby_compass_of_raer_desc:0 "The compass of old Captain Raer hangs in the council hall, its needle bent but faithful. The isles say that Raerby always knows which way is north, even when it pretends not to."
 zin_regional_raerby_corsair_hunters:0 "Corsair Hunters"
 zin_regional_raerby_corsair_hunters_desc:0 "Fast galleys are sent after the worst of the corsair captains. They are told to bring them back alive when they can, and to bring back their ships in any case."
 zin_regional_raerby_envoys_to_the_heir:0 "Envoys to the Heir"
 zin_regional_raerby_envoys_to_the_heir_desc:0 "The stranger from the south has been named and has returned. A Raerby captain is sent to ask what he needs from the isles, and to offer him the ear of every harbour."
 zin_regional_raerby_envoys_to_the_mainland:0 "Envoys to the Mainland"
 zin_regional_raerby_envoys_to_the_mainland_desc:0 "When the isles must speak to a court on the mainland, a Raerby captain usually carries the letter. The council makes it formal, with seals and robes."
 zin_regional_raerby_every_sail_welcome:0 "Every Sail Welcome"
 zin_regional_raerby_every_sail_welcome_desc:0 "Raerby has never turned a ship away at the harbour mouth. The council puts the custom into writing, and nails it to the pier."
 zin_regional_raerby_fast_hulls:0 "Fast Hulls"
 zin_regional_raerby_fast_hulls_desc:0 "The yard-master drafts a galley with a narrow beam and forty oars. She is meant to be fast enough to catch a corsair skiff and strong enough to hold it."
 zin_regional_raerby_fishing_rights_registry:0 "A Registry of Fishing Rights"
 zin_regional_raerby_fishing_rights_registry_desc:0 "Every pier, every bank and every net-right is written in a single book kept at Raerby. A fisher who has quarrelled with his neighbour may open it at the right page."
 zin_regional_raerby_friendship:0 "Friendship of the Isles"
 zin_regional_raerby_harbour_of_raerby:0 "The Harbour of Raerby"
 zin_regional_raerby_harbour_of_raerby_desc:0 "The harbour is dredged and a second mole is built to hold the sea. A ship that anchors in Raerby sleeps easy even in a gale."
 zin_regional_raerby_long_patrol:0 "The Long Patrol"
 zin_regional_raerby_long_patrol_desc:0 "A line of fast galleys keeps watch from the eastern reefs to the western banks, each hailing the next at dusk. No corsair can slip through without being seen."
 zin_regional_raerby_peace_of_the_pupor:0 "The Peace of the Pupor"
 zin_regional_raerby_peace_of_the_pupor_desc:0 "The moot makes a pledge: no ship shall be taken without a hearing, no captain hanged without a witness. The corsairs are not pleased, but they are listening."
 zin_regional_raerby_peace_of_the_pupor_spirit:0 "The Peace of the Pupor"
 zin_regional_raerby_peace_of_the_pupor_spirit_desc:0 "For a season the captains of the Pupor agree that no ship shall be seized without a hearing. The corsairs grumble, and the merchants sleep a little better."
 zin_regional_raerby_raerby_stores:0 "Raerby's Stores"
 zin_regional_raerby_raerby_stores_desc:0 "Barns on the hill hold grain, salt-meat and dried fruit against a bad season. The Captain-Speaker holds the keys and has promised to share them with any neighbour in need."
 zin_regional_raerby_raerby_yards:0 "The Raerby Yards"
 zin_regional_raerby_raerby_yards_desc:0 "The slips at Raerby have been quiet for a generation. The council hires shipwrights from Adel and lays down new keels, long and lean."
 zin_regional_raerby_raers_compass:0 "Raer's Compass"
 zin_regional_raerby_raers_compass_desc:0 "Founder Raer's bent compass is carried in procession and set in a niche in the council hall. The isles say it always points at the nearest quarrel."
 zin_regional_raerby_rope_and_sail:0 "Rope and Sail"
 zin_regional_raerby_rope_and_sail_desc:0 "Sailmakers and ropewalkers set up their sheds along the shore. Raerby buys less and sells more, and its captains stop paying strangers for canvas."
 zin_regional_raerby_ships_for_the_crossing:0 "Ships for the Crossing"
 zin_regional_raerby_ships_for_the_crossing_desc:0 "The western host needs hulls, and Raerby has them. The council sells a few of its galleys at a fair price and hopes they are not used to cross the sea twice."
 zin_regional_raerby_the_banks_court_remembered:0 "The Banks-Court Remembered"
 zin_regional_raerby_the_banks_court_remembered_desc:0 "Raerby's mediation of the banks began as the league's own banks-court, and the brokers have the rolls to prove it. If the Charter means to swear the old league again, Raerby expects its old seat at the table."
 zin_regional_raerby_the_banks_dispute:0 "The Banks Dispute"
 zin_regional_raerby_the_banks_dispute_desc:0 "Nondondor and the Seite Isles fish the same southern banks, and both say the banks are theirs. Raerby offers to judge, and sends a captain with the offer in both hands."
 zin_regional_raerby_the_broker_fleet:0 "The Broker Fleet"
 zin_regional_raerby_the_broker_fleet_desc:0 "Ilka Raer takes command of the new galleys, and teaches her crews to board as quickly as they row. She is the Captain-Speaker's daughter and the best sailor of her house."
 zin_regional_raerby_the_brokers_seal:0 "The Brokers' Seal"
 zin_regional_raerby_the_brokers_seal_desc:0 "The council cuts a new seal for its brokers: a compass over two clasped hands. A letter that bears it is read, in every harbour of the isles, without suspicion."
 zin_regional_raerby_the_council_elects:0 "The Council Elects"
 zin_regional_raerby_the_council_elects_desc:0 "Once in four years the captains vote on who holds the wheel. The election is held at sea, so that no captain can say he was not on board."
 zin_regional_raerby_the_exchange:0 "The Exchange"
 zin_regional_raerby_the_exchange_desc:0 "A small exchange hall opens on the quay, where factors trade bills drawn on every island. It is a brokers' kind of business, and Raerby is good at it."
 zin_regional_raerby_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_raerby_the_great_war_at_sea_desc:0 "The fleets of the great realms are moving. The council meets in the night, for a broker has no place in a war, and Raerby must find one."
 zin_regional_raerby_the_long_patrol:0 "The Long Patrol"
 zin_regional_raerby_the_long_patrol_desc:0 "The galleys sail in a long line from the eastern reefs to the western banks, each ship in sight of the next. They keep the line through gale and fog."
 zin_regional_raerby_the_moot_of_captains:0 "The Moot of Captains"
 zin_regional_raerby_the_moot_of_captains_desc:0 "Captains of every isle gather at Raerby for a moot on the mid-summer tide. They talk, drink and swear a few small oaths, and leave a little less likely to quarrel."
 zin_regional_raerby_the_old_captains:0 "The Old Captains"
 zin_regional_raerby_the_old_captains_desc:0 "The greybeards of Raerby have sailed every sea of the isles, and their word counts in the council. A seat is kept for each, with a cushion and a pipe."
 zin_regional_raerby_the_speakers_wheel:0 "The Speaker's Wheel"
 zin_regional_raerby_the_speakers_wheel_desc:0 "The Captain-Speaker's chair is a ship's wheel set on a plinth. He keeps one hand on it when he speaks, so that all remember he is a sailor first."
 zin_regional_raerby_the_western_courts:0 "The Western Courts"
 zin_regional_raerby_the_western_courts_desc:0 "Raerby's captains stop at every harbour of the western shore and carry the courts' letters to one another. They hear much, and say little of it."
 zin_regional_raerby_the_western_courts_tip_1:0 "Raerby's captains carry letters for every court of the western shore."
 zin_regional_raerby.1.a:0 "The old captains"
 zin_regional_raerby.1.b:0 "The young captains"
 zin_regional_raerby.1.d:0 "The council of captains meets on the deck of the oldest ship in harbour, as the custom is. The old captains want to keep the broker's trade as it is, and the young ones want a bigger fleet and a sharper edge."
 zin_regional_raerby.1.t:0 "The Captains Vote"
 zin_regional_raerby.2.a:0 "Receive them"
 zin_regional_raerby.2.b:0 "Ignore them"
 zin_regional_raerby.2.d:0 "A Raerby captain stands in the hall of Parim with a letter from the isles of the Pupor. He asks nothing for his own crown and wishes only that the king know the isles keep the sea-lanes quiet, and that they would be friends."
 zin_regional_raerby.2.t:0 "Envoys from the Isles"
