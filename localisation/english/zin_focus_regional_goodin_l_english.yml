l_english:
 zin_regional_goodin_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_goodin_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_goodin_a_guest_seat_at_noon:0 "A Guest's Seat at Noon"
 zin_regional_goodin_a_guest_seat_at_noon_desc:0 "The Noon Council is for the Sunhot realms, but the Sunfolk would like to listen. The Steward writes a respectful petition for a guest's seat."
 zin_regional_goodin_captains_of_the_sunfolk:0 "Captains of the Sunfolk"
 zin_regional_goodin_captains_of_the_sunfolk_desc:0 "The best company captains are gathered in the Steward's hall to teach their craft. The Sunfolk have a name for steadiness, and these are the men who earned it."
 zin_regional_goodin_caravans_of_the_sunfolk:0 "Caravans of the Sunfolk"
 zin_regional_goodin_caravans_of_the_sunfolk_desc:0 "Goodin's caravan-men cross the Lands of the Sun with grain, wool and the news. A Sunfolk wagon is known by its low wheels and its good brakes."
 zin_regional_goodin_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_goodin_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_goodin_gifts_to_the_lands_of_light:0 "Gifts to the Lands of Light"
 zin_regional_goodin_gifts_to_the_lands_of_light_desc:0 "The Steward sends the Radiant Speaker a gift of barley, honey and well-made tools. The Lands of Light accepts with a graceful letter."
 zin_regional_goodin_granaries_of_the_sun:0 "Granaries of the Sun"
 zin_regional_goodin_granaries_of_the_sun_desc:0 "White-roofed granaries stand on the high ground where the damp cannot reach them. The keepers of the stores count them every spring and tell the whole realm what they hold."
 zin_regional_goodin_healing_houses:0 "The Healing Houses"
 zin_regional_goodin_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_goodin_hired_spears_of_goodin:0 "Hired Spears of Goodin"
 zin_regional_goodin_hired_spears_of_goodin_desc:0 "The Sunfolk hire out their spears by the season, in companies of fifty with a captain and a banner. They are paid by the day and discharged by the month."
 zin_regional_goodin_markets_beyond_the_sun:0 "Markets Beyond the Sun"
 zin_regional_goodin_markets_beyond_the_sun_desc:0 "The caravan-men carry news of new markets beyond the borders, and the Steward sends agents to see them. Some return richer, and some do not return at all."
 zin_regional_goodin_men_among_the_tall:0 "Men Among the Tall"
 zin_regional_goodin_men_among_the_tall_desc:0 "The Sunfolk live beside neighbours who are a head taller and many centuries older. They have learned to be courteous, patient and very hard to move."
 zin_regional_goodin_neighbours_of_goodton_and_guuden:0 "Neighbours of Goodton and Guuden"
 zin_regional_goodin_neighbours_of_goodton_and_guuden_desc:0 "Goodton and Guuden are realms of men too, and their steadings border the Sunfolk's. The three hold a council of neighbours in a field between them."
 zin_regional_goodin_old_strength:0 "The Old Strength"
 zin_regional_goodin_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_goodin_orchards:0 "Orchards and Vines"
 zin_regional_goodin_orchards_and_vines:0 "Orchards and Vines"
 zin_regional_goodin_orchards_and_vines_desc:0 "Fruit trees and trained vines climb the terraces, and the autumn markets smell of them for a month. A fed folk is a calm folk, and [ROOT.GetName] grows slowly in numbers and in ease."
 zin_regional_goodin_orchards_desc:0 "Fruit from the high terraces feeds [ROOT.GetName] well and keeps its people content."
 zin_regional_goodin_priests_from_afar:0 "Priests From Afar"
 zin_regional_goodin_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_goodin_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_goodin_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_goodin_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_goodin_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_goodin_refused_a_seat:0 "Refused a Seat"
 zin_regional_goodin_spear_companies:0 "The Spear Companies"
 zin_regional_goodin_spear_companies_desc:0 "The Sunfolk hire out their spears by the season, in companies of fifty with a captain and a banner. Each company has its own song, and each song has a rude verse."
 zin_regional_goodin_steadings_endure:0 "The Steadings Endure"
 zin_regional_goodin_steadings_endure_desc:0 "Each steading keeps its fields, its fences and its feud, and all of them keep the common law. The steadings have survived neighbours twice their height and four times their age."
 zin_regional_goodin_steward_odun:0 "The Steward"
 zin_regional_goodin_steward_odun_desc:0 "Odun is the Steward of the steadings, chosen by the moot for his patience and his fair hand. He holds the common seal and the common key."
 zin_regional_goodin_steward_of_goodin:0 "The Steward of Goodin"
 zin_regional_goodin_steward_of_goodin_desc:0 "Odun keeps the steadings' common granary and the steadings' common law. He is a head shorter than any Speaker he meets, and does not seem to notice."
 zin_regional_goodin_stone_of_the_high_places:0 "Stone of the High Places"
 zin_regional_goodin_stone_of_the_high_places_desc:0 "Pale quarry stone is brought down from the heights, cut by tall hands and set without lime. A second Guild Workshop rises where the quarry road meets the valley."
 zin_regional_goodin_sun_markets:0 "The Sun Markets"
 zin_regional_goodin_sun_markets_desc:0 "The long square under its white awnings draws every trader on the coast, and each leaves with good will and light purses."
 zin_regional_goodin_sun_terraces:0 "Sun Terraces"
 zin_regional_goodin_sun_terraces_desc:0 "Stone steps cut into the hillsides catch the long light and hold the rain. The realm has few hands, so every terrace is laid once and laid to last, and the first of them feeds a new Guild Workshop in the capital."
 zin_regional_goodin_sunfolk_and_sunhot:0 "Sunfolk and Sunhot"
 zin_regional_goodin_sunfolk_and_sunhot_desc:0 "Sunfolk and Sunhot sit at the same table, though the benches are of different heights. The tall folk have learned that men can be reliable neighbours."
 zin_regional_goodin_sunfolk_bows:0 "Sunfolk Bows"
 zin_regional_goodin_sunfolk_bows_desc:0 "Sunfolk archers use short bows of ash and horn, built for a man who stands behind a hedge. They shoot very quickly and very straight."
 zin_regional_goodin_sunfolk_caravans:0 "Caravans of the Sunfolk"
 zin_regional_goodin_sunfolk_caravans_desc:0 "Goodin's caravans cross the Lands of the Sun with grain, wool and the news, and the caravan-men are welcome at every inn. A Sunfolk wagon is easy to know by its low wheels."
 zin_regional_goodin_sunfolk_customs:0 "Sunfolk Customs"
 zin_regional_goodin_sunfolk_customs_desc:0 "The Sunfolk have their own customs, written down by an old steader in a book of soft grey cloth. They are the customs of men who live among giants."
 zin_regional_goodin_tall_folks_trust:0 "The Tall Folk's Trust"
 zin_regional_goodin_tall_folks_trust_desc:0 "Sunhot merchants talk to Goodin's traders as to equals, and Sunhot families send their sons to the steadings to learn how men farm. The trust was earned slowly and is kept carefully."
 zin_regional_goodin_the_old_strength:0 "The Old Strength"
 zin_regional_goodin_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_goodin_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_goodin_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_goodin_the_spear_companies:0 "The Spear Companies"
 zin_regional_goodin_the_spear_companies_desc:0 "Each company has its own song, and each song has a rude verse. They muster at the Steward's call, in rows of six, and their captains know each man by name."
 zin_regional_goodin_the_steading_moot:0 "The Steading Moot"
 zin_regional_goodin_the_steading_moot_desc:0 "The heads of the steadings meet in a barn at harvest, each with a sack of his own grain. Whoever has the biggest sack speaks first and listens longest."
 zin_regional_goodin_the_steadings_endure:0 "The Steadings Endure"
 zin_regional_goodin_the_steadings_endure_desc:0 "A great granary is built at the heart of the steadings, and every steading adds a tithe each harvest. The Sunfolk will not starve while it stands."
 zin_regional_goodin_the_sun_markets:0 "The Sun Markets"
 zin_regional_goodin_the_sun_markets_desc:0 "On market days the terraces empty into one long square under awnings of white cloth. Traders from the coast and the hills come for wine, honey and cut stone, and carry [ROOT.GetAdjective] goodwill home with them."
 zin_regional_goodin_the_sunfolk_steadings:0 "The Sunfolk Steadings"
 zin_regional_goodin_the_sunfolk_steadings_desc:0 "Goodin is a realm of men among the Sunhot realms: the steadings of the Sunfolk, led by a Steward and a moot of steading-heads. Its neighbours are more than a head taller, and the Sunfolk are proud of it."
 zin_regional_goodin_the_sunfolk_way:0 "The Sunfolk Way"
 zin_regional_goodin_the_sunfolk_way_desc:0 "The way of the Sunfolk is to work, to keep faith and to ask for nothing that is not owed. Their banner is plain brown, and they carry it with pride."
 zin_regional_goodin_the_tall_folks_trust:0 "The Tall Folk's Trust"
 zin_regional_goodin_the_tall_folks_trust_desc:0 "The trust of the Sunhot realms is slow in coming and slow in going. The Sunfolk have earned it, and mean to keep it."
 zin_regional_goodin_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_goodin_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_goodin_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_goodin_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_goodin_welcomed_as_guests:0 "Welcomed as Guests"
 zin_regional_goodin_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_goodin_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_goodin.1.a:0 "The Council is for the Sunhot realms"
 zin_regional_goodin.1.b:0 "Let the Sunfolk sit as guests"
 zin_regional_goodin.1.d:0 "Steward Odun's envoys stand in the white hall, a head shorter than the Speakers, and ask that the Sunfolk be allowed to sit at the Noon Council as guests. They ask for no vote, no chair and no name on the roll."
 zin_regional_goodin.1.t:0 "The Sunfolk Ask for a Guest's Seat"
