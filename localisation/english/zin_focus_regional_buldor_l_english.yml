l_english:
 zin_regional_buldor_armourers_row:0 "Armourers' Row"
 zin_regional_buldor_armourers_row_desc:0 "A whole street of armourers is given a charter and a monopoly on the company trade. The hammering begins at dawn and does not stop until the last bell."
 zin_regional_buldor_articles_of_the_companies:0 "Articles of the Companies"
 zin_regional_buldor_articles_of_the_companies_desc:0 "The captains write down the rules of service: pay, rations, leave and the penalty for desertion. It is the first time anyone has put them on one page."
 zin_regional_buldor_captains_school:0 "The Captains' School"
 zin_regional_buldor_captains_school_desc:0 "Mara Holt runs a school at the hall where the sons of captains learn to read maps and write orders. The graduates are promoted ahead of their elders, and the elders complain."
 zin_regional_buldor_companies_for_the_crossing:0 "Companies for the Crossing"
 zin_regional_buldor_companies_for_the_crossing_desc:0 "The western host has pledged, and Buldor's companies have been asked to cross. Three thousand swords take ship in the first wave, with their ledgers and their drum-masters."
 zin_regional_buldor_company_books:0 "The Company Books"
 zin_regional_buldor_company_books_desc:0 "Every contract, pay-roll and widow's pension is written in the company ledgers, and the paymaster alone can read them. The companies are paid, and they obey whoever pays them."
 zin_regional_buldor_company_contract:0 "A Buldor Company"
 zin_regional_buldor_company_contract_desc:0 "A company of Buldor serves under the employer's banner for a year and a day. It fights well, it eats well and it does not argue about orders."
 zin_regional_buldor_company_drill:0 "Company Drill"
 zin_regional_buldor_company_drill_desc:0 "Every company drills three mornings a week. The drill-masters are cruel, the captains are patient and the paymaster takes note of the winners."
 zin_regional_buldor_contracts_in_every_court:0 "Contracts in Every Court"
 zin_regional_buldor_contracts_in_every_court_desc:0 "A Buldor clerk is posted to every court in the West and beyond. He sits in the antechamber with his ledger open and a pot of ink, and waits to be called."
 zin_regional_buldor_contracts_with_the_heir:0 "A Contract with the Heir"
 zin_regional_buldor_contracts_with_the_heir_desc:0 "The heir offers a contract, and for once it is not a price but a promise: fight for the living, and be paid in a free land. The paymaster reads it twice and writes it into the ledger."
 zin_regional_buldor_council_of_captains:0 "The Council of Captains"
 zin_regional_buldor_council_of_captains_desc:0 "Each company sends its captain to the hall, in rank order, to hear the Company-Lord and to bargain for the next season's pay."
 zin_regional_buldor_free_companies_sworn:0 "The Free Companies"
 zin_regional_buldor_free_companies_sworn_desc:0 "The companies swear a common oath at the hall: no contract against another company, no flag raised against Buldor. They are still for hire, but they are one people."
 zin_regional_buldor_highest_bidder:0 "The Highest Bidder"
 zin_regional_buldor_highest_bidder_desc:0 "The contract books are open to the highest bidder, and the clerks are quick. A court that wants a company must write its figure and sign."
 zin_regional_buldor_iron_discipline:0 "The Iron Discipline"
 zin_regional_buldor_iron_discipline_desc:0 "A company that breaks its line is not paid. A company that stands is paid double, and the paymaster keeps count."
 zin_regional_buldor_open_the_books:0 "Open the Books"
 zin_regional_buldor_open_the_books_desc:0 "The ledgers are opened to those who might hire the companies. A court may now send a herald to ask for a contract, and the paymaster will quote a price."
 zin_regional_buldor_paid_swords:0 "Whoever Pays"
 zin_regional_buldor_paid_swords_desc:0 "Buldor's companies have no cause but the contract, and they say so openly. Anyone with silver and no dishonour may hire them, and none has yet been refused for his politics."
 zin_regional_buldor_pike_and_crossbow:0 "Pike and Crossbow"
 zin_regional_buldor_pike_and_crossbow_desc:0 "The companies are divided into pikemen and crossbowmen, who learn to stand behind one another. The crossbows shoot over the pikes, and the pikes keep the horse away."
 zin_regional_buldor_plunder_markets:0 "The Plunder Markets"
 zin_regional_buldor_plunder_markets_desc:0 "What the companies bring home is sold at fixed stalls, with a tenth to the hall. Armour from a dozen realms hangs on the rails."
 zin_regional_buldor_recruiting_drums:0 "Recruiting Drums"
 zin_regional_buldor_recruiting_drums_desc:0 "Drummers go from town to town, beating the call. Boys in the crowd are measured, shown a pike and asked if they would like three meals a day."
 zin_regional_buldor_service:0 "In the Crown's Pay"
 zin_regional_buldor_shields_for_the_concord:0 "Shields for the Concord"
 zin_regional_buldor_shields_for_the_concord_desc:0 "When the war begins, Buldor sends its best companies east to hold the Concord's walls. They hold them for a season, and then they ask for their pay."
 zin_regional_buldor_sons_of_every_land:0 "Sons of Every Land"
 zin_regional_buldor_sons_of_every_land_desc:0 "The companies take recruits from all the lands the drums reach. A man from the hills stands beside a man from the coast, and neither has a quarrel with the other."
 zin_regional_buldor_sons_of_every_land_spirit:0 "Sons of Every Land"
 zin_regional_buldor_sons_of_every_land_spirit_desc:0 "Buldor takes recruits from anywhere, and asks only that they bring their own boots. The companies speak a dozen dialects, and all of them understand an order."
 zin_regional_buldor_stranded_companies:0 "Companies Beyond the Sea"
 zin_regional_buldor_stranded_companies_desc:0 "Some of the companies stayed behind when the fleet sailed, and the ledgers still list them. They hold a town beyond the sea, and the paymaster owes them their wages."
 zin_regional_buldor_swords_for_parim:0 "Swords for Parim"
 zin_regional_buldor_swords_for_parim_desc:0 "Buldor offers its companies to the king in Parim, and to those who stand with him against the dark. The oaths are sworn at the hall, and the standards go east."
 zin_regional_buldor_swords_for_the_west:0 "Swords for the West"
 zin_regional_buldor_swords_for_the_west_desc:0 "The companies serve the West, and nobody else. Contracts go to the courts of the western shore, and Aenor's agents are told to look elsewhere."
 zin_regional_buldor_the_arsenals:0 "The Arsenals"
 zin_regional_buldor_the_arsenals_desc:0 "Armouries are built at the hall to store pikes, shields and mail. Each company draws its kit at the start of a contract and returns it at the end."
 zin_regional_buldor_the_companies_come_home:0 "The Companies Come Home"
 zin_regional_buldor_the_companies_come_home_desc:0 "The war is done, and the companies march home, thin and tired. The paymaster pays what he owes. The books are closed and the ledger is put away."
 zin_regional_buldor_the_company_hall:0 "The Company Hall"
 zin_regional_buldor_the_company_hall_desc:0 "Buldor is six states of drill fields and company halls, and its soldiers hire out across the West and beyond. A council of captains elects the Company-Lord, and Datidon Rook holds the books today."
 zin_regional_buldor_the_company_roll:0 "The Company Roll"
 zin_regional_buldor_the_company_roll_desc:0 "Every man who has served is entered on the roll, with his pay and his wounds. When a war comes, the roll is read aloud and the veterans stand up."
 zin_regional_buldor_the_crowns_companies:0 "The Crown's Companies"
 zin_regional_buldor_the_crowns_companies_desc:0 "Buldor's companies take the Lost Cause's shilling and march under its flag. They are not in it for the cause, but they are not blind to what the dark is doing."
 zin_regional_buldor_the_free_companies:0 "The Free Companies"
 zin_regional_buldor_the_free_companies_desc:0 "The companies raise a common banner, a ledger over crossed pikes. They are still free to take any contract, but none will fight against Buldor."
 zin_regional_buldor_the_great_muster:0 "The Great Muster"
 zin_regional_buldor_the_great_muster_desc:0 "Every company in Buldor is called to the muster-field. They stand in ranks a mile long, and the Company-Lord rides along the line."
 zin_regional_buldor_the_great_war_pays:0 "The War Pays"
 zin_regional_buldor_the_great_war_pays_desc:0 "A war on this scale needs every spear in the West, and the paymaster has never seen so many contracts. Buldor's companies are in demand, and the price goes up every week."
 zin_regional_buldor_the_highest_bidder:0 "The Highest Bidder"
 zin_regional_buldor_the_highest_bidder_desc:0 "A public notice is posted in the market square: the companies will be hired to whoever offers the most. The paymaster stands on a barrel to read it out."
 zin_regional_buldor_the_iron_discipline:0 "The Iron Discipline"
 zin_regional_buldor_the_iron_discipline_desc:0 "The articles of war are enforced to the letter. A company that holds its line is paid in full, and one that breaks is paid nothing."
 zin_regional_buldor_the_pay_chests:0 "The Pay-Chests"
 zin_regional_buldor_the_pay_chests_desc:0 "Iron-bound chests hold the companies' pay, counted weekly and issued on the drum. A paymaster who loses a coin is paid in the same coin."
 zin_regional_buldor_the_paymasters_ledger:0 "The Paymaster's Ledger"
 zin_regional_buldor_the_paymasters_ledger_desc:0 "Ulric Penn keeps the paymaster's ledger in a locked room behind the hall. Every soldier in Buldor knows that he is the most important man in the realm."
 zin_regional_buldor_the_western_contracts:0 "The Western Contracts"
 zin_regional_buldor_the_western_contracts_desc:0 "Contracts with the western courts are drawn up in a standard form. Pay is the same, terms are the same and the Ford Council receives a copy."
 zin_regional_buldor_veterans:0 "Veterans of Many Wars"
 zin_regional_buldor_veterans_desc:0 "Drill-masters with scars from six different campaigns teach the young recruits what a pike is for. The companies have seen every kind of war, and they have notes."
 zin_regional_buldor_veterans_of_many_wars:0 "Veterans of Many Wars"
 zin_regional_buldor_veterans_of_many_wars_desc:0 "Buldor's oldest drill-masters have fought in every war of the West and some of the East. They give the recruits their stories, and the stories are quite good."
 zin_regional_buldor_whoever_pays:0 "Whoever Pays"
 zin_regional_buldor_whoever_pays_desc:0 "The companies are for hire, and the price is the same for everyone. The Company-Lord says so at the gate, and the clerks print it on every contract."
 zin_regional_buldor.1.a:0 "Parim needs no hired swords"
 zin_regional_buldor.1.b:0 "Take them into the king's pay"
 zin_regional_buldor.1.d:0 "A herald in the livery of the Buldor companies has been admitted to the royal hall. Company-Lord Rook offers the crown the exclusive service of his swords, for a fixed fee, a standing contract and the right to march in the king's colours."
 zin_regional_buldor.1.t:0 "The Buldor Companies Offer Their Swords"
 zin_regional_buldor.2.a:0 "No"
 zin_regional_buldor.2.b:0 "Sign the contract"
 zin_regional_buldor.2.d:0 "A herald with a ledger has asked for an audience. He represents the Buldor companies, who are free for a season and offer a contract: so many swords, so many months and a fixed price paid in advance. The terms are written in a fair hand."
 zin_regional_buldor.2.t:0 "A Contract from Buldor"
