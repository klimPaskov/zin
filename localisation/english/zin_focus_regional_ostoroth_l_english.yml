l_english:
 zin_regional_ostoroth_clan_moot:0 "The Clan Moot"
 zin_regional_ostoroth_clan_moot_desc:0 "The chiefs gather on the long green below the king's hall and speak in turn, the youngest first. A matter is settled when the last chief has nodded, which can take a week."
 zin_regional_ostoroth_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_ostoroth_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_ostoroth_close_the_houses:0 "Close the Houses"
 zin_regional_ostoroth_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_ostoroth_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_ostoroth_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_ostoroth_crag_forts:0 "Crag Forts"
 zin_regional_ostoroth_crag_forts_desc:0 "Hill-forts are raised on the crags above the passes, built of dry stone and mortared only at the corners. Each holds a hundred spears and a stock of boulders."
 zin_regional_ostoroth_crown_of_the_highlands:0 "Crown of the Highlands"
 zin_regional_ostoroth_crown_of_the_highlands_desc:0 "The crown is brought out of its chest and set on a stone above the lake, where every chief can see it. Ostoroth is one kingdom from the first pass to the last pasture."
 zin_regional_ostoroth_eastern_oath:0 "Oath to the King in the East"
 zin_regional_ostoroth_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_ostoroth_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_ostoroth_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_ostoroth_free_crown_court:0 "A Free Crown"
 zin_regional_ostoroth_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_ostoroth_friends_at_furvior:0 "Friends at Furvior"
 zin_regional_ostoroth_friends_at_furvior_desc:0 "Furvior's riders have been friends of the highland markets for generations, and their coin is welcome. A resident factor is sent to the capital with gifts and good wishes."
 zin_regional_ostoroth_generous_friends:0 "The Generous Friends"
 zin_regional_ostoroth_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_ostoroth_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_ostoroth_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_ostoroth_healing_houses:0 "Houses of Healing"
 zin_regional_ostoroth_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_ostoroth_herds_of_the_high_pastures:0 "Herds of the High Pastures"
 zin_regional_ostoroth_herds_of_the_high_pastures_desc:0 "Flocks and herds are counted in the king's book at the spring gathering, and the herd-wardens carry the tally from valley to valley. A kingdom of grass is rarely hungry."
 zin_regional_ostoroth_high_pastures:0 "The High Pastures"
 zin_regional_ostoroth_high_pastures_desc:0 "Sheep, goats and rough ponies graze the upland meadows from thaw to first frost, and the herd-books are kept in the king's hall. A kingdom of grass is rarely hungry."
 zin_regional_ostoroth_highland_archers:0 "Highland Archers"
 zin_regional_ostoroth_highland_archers_desc:0 "Archers shoot from the slopes at moving targets on the valley floor, and the best are given a bow of yew. The old men of the clans still prefer a sling."
 zin_regional_ostoroth_highland_companies:0 "Highland Companies"
 zin_regional_ostoroth_highland_companies_desc:0 "Each clan raises a company of long-spear men, drilled at the autumn gathering. They are lean, silent and hard to move from a ridge."
 zin_regional_ostoroth_hill_ponies:0 "Hill Ponies"
 zin_regional_ostoroth_hill_ponies_desc:0 "Small, shaggy and tireless, the hill ponies climb tracks no lowland horse would try. Ostoroth's riders go where wheels cannot."
 zin_regional_ostoroth_houses_of_healing:0 "Houses of Healing"
 zin_regional_ostoroth_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_ostoroth_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_ostoroth_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_ostoroth_kings_word:0 "The King's Word"
 zin_regional_ostoroth_kings_word_desc:0 "Ocellio's word is carried by horn from valley to valley and obeyed before the echo fades. The chiefs murmur, and then they comply."
 zin_regional_ostoroth_lake_fisheries:0 "Lake Fisheries"
 zin_regional_ostoroth_lake_fisheries_desc:0 "The upland lakes teem with fish, and the highland fishers sell salted catch to the towns below. Long nets and clinker boats replace the old spear and hide-boat."
 zin_regional_ostoroth_lake_tolls:0 "Tolls of the Lake Road"
 zin_regional_ostoroth_lake_tolls_desc:0 "Ostoroth keeps a toll-house at every ford of the Lake Road, and the price is carved on the lintel. Furvior's riders pay it with a smile and Postondoroth's wagons with a sigh."
 zin_regional_ostoroth_levies_for_the_host:0 "Levies for the Host"
 zin_regional_ostoroth_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_ostoroth_markets_of_ostoroth:0 "Markets of Ostoroth"
 zin_regional_ostoroth_markets_of_ostoroth_desc:0 "Wool, hides and mountain cheese are sold at the capital's covered market. Merchants from the lowlands come for the quality and stay for the brew."
 zin_regional_ostoroth_masters_of_the_heights:0 "Masters of the Heights"
 zin_regional_ostoroth_masters_of_the_heights_desc:0 "Captains drill on the high slopes in all weathers, and young chiefs learn to command ridge, ford and pass. The highlands have never lacked brave men; they now have trained ones."
 zin_regional_ostoroth_mines_of_the_crags:0 "Mines of the Crags"
 zin_regional_ostoroth_mines_of_the_crags_desc:0 "Iron and a little copper lie close to the surface in the crags, and the miners follow the seams by lamplight. The king's smiths are glad of it."
 zin_regional_ostoroth_mora_our_neighbour:0 "Mora, Our Neighbour"
 zin_regional_ostoroth_mora_our_neighbour_desc:0 "The lake towns of Mora lie at the foot of the Lake Road, and their boat-guilds are the highlands' only way to the water. A friendly letter costs a rider and a week."
 zin_regional_ostoroth_neighbours_pact:0 "A Pact of Neighbours"
 zin_regional_ostoroth_ocellios_court:0 "Ocellio's Court"
 zin_regional_ostoroth_ocellios_court_desc:0 "The king's hall stands on a hill above the capital, with a hearth the length of a ship. Hill-chiefs, drovers and envoys eat at the same long tables."
 zin_regional_ostoroth_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_ostoroth_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_ostoroth_own_counsel:0 "Our Own Counsel"
 zin_regional_ostoroth_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_ostoroth_passes_held:0 "The Passes Held"
 zin_regional_ostoroth_passes_held_desc:0 "Every pass of the high country has a hill-fort, a signal horn and a stock of boulders. If the Lake Road must be shut, it can be shut in a morning."
 zin_regional_ostoroth_question_of_the_east:0 "The Question of the East"
 zin_regional_ostoroth_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_ostoroth_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_ostoroth_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_ostoroth_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_ostoroth_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_ostoroth_the_clan_moot:0 "The Clan Moot"
 zin_regional_ostoroth_the_clan_moot_desc:0 "The chiefs meet in open air on the long green and agree the year's law. The king sits among them, and has one voice like any other."
 zin_regional_ostoroth_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_ostoroth_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_ostoroth_the_high_road_rich:0 "The High Road Grows Rich"
 zin_regional_ostoroth_the_high_road_rich_desc:0 "Wagons come and go from dawn to dusk, and the toll-books are thick. The king's treasurers build a second storehouse and then a third."
 zin_regional_ostoroth_the_highland_clans:0 "The Highland Clans"
 zin_regional_ostoroth_the_highland_clans_desc:0 "Each clan keeps its own banner and its own feud. The king calls them to his side with horn-calls and cattle, and most of them answer."
 zin_regional_ostoroth_the_highland_crown:0 "The Highland Crown"
 zin_regional_ostoroth_the_highland_crown_desc:0 "Nine highland states answer to King Ocellio, who keeps his crown in a stone chest and wears it twice a year. The rest of the time he rides among his clans."
 zin_regional_ostoroth_the_highland_granaries:0 "The Highland Granaries"
 zin_regional_ostoroth_the_highland_granaries_desc:0 "Oat, barley and dried fish are stored in stone barns in every valley, and the chiefs are told to keep a winter's worth in reserve. A hard winter no longer thins the clans."
 zin_regional_ostoroth_the_kings_word:0 "The King's Word"
 zin_regional_ostoroth_the_kings_word_desc:0 "Ocellio sends sealed commands down the valleys by horn and runner, and the chiefs find themselves answering to one man. The moot meets less often than it used to."
 zin_regional_ostoroth_the_lake_road:0 "The Lake Road"
 zin_regional_ostoroth_the_lake_road_desc:0 "The caravans from Furvior climb the Lake Road past Mora's wharves and into the high pastures. Ostoroth levels the ruts, builds the bridges and sets a toll-house at each crossing."
 zin_regional_ostoroth_the_passes_held:0 "The Passes Held"
 zin_regional_ostoroth_the_passes_held_desc:0 "The king orders the passes held against any host, with signal-horns on every ridge and a company at every gate. The Lake Road can be shut in a morning."
 zin_regional_ostoroth_the_road_is_ours:0 "The Road Is Ours"
 zin_regional_ostoroth_the_road_is_ours_desc:0 "The Lake Road is a highland road, and the king says so in every court. Toll-houses are manned by Ostoroth's own wardens, and the charter is free."
 zin_regional_ostoroth_wait_upon_events:0 "Wait Upon Events"
 zin_regional_ostoroth_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_ostoroth_watch_the_quays:0 "Watch the Quays"
 zin_regional_ostoroth_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_ostoroth_watchful_quays:0 "Watchful Quays"
 zin_regional_ostoroth_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_ostoroth_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_ostoroth_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_ostoroth_when_the_king_falls:0 "When the King Falls"
 zin_regional_ostoroth_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_ostoroth_wool_and_hides:0 "Wool and Hides"
 zin_regional_ostoroth_wool_and_hides_desc:0 "Fulling-mills beside the fast streams and tanning-yards downwind of the towns turn wool and hides into goods worth carrying. The smell is the price of prosperity."
 zin_regional_ostoroth.1.a:0 "Thank them politely"
 zin_regional_ostoroth.1.b:0 "Sign a pact of neighbours"
 zin_regional_ostoroth.1.d:0 "A rider from Ostoroth arrives at the lake wharves with a letter sealed in blue wax. King Ocellio proposes that the lake and the highlands keep the Lake Road free together, and that neither will raise a hand against the other."
 zin_regional_ostoroth.1.t:0 "A Letter From the Highlands"
