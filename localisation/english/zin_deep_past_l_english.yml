l_english:
 zin_ach_bridge_without_war_DESC:0 "As Alerhia, raise the Bridge Kingdom by the first day of 4A 1760 without ever joining the eastern coalition."
 zin_ach_bridge_without_war_NAME:0 "A Bridge Nobody Fought For"
 zin_ach_diadem_melted_DESC:0 "As Erco, melt the diadem in the wall and still stand after the eastern invasion, in 4A 1760 or later."
 zin_ach_diadem_melted_NAME:0 "The Oath of 2A 12 Kept"
 zin_ach_kalioth_restored_DESC:0 "As Erco, raise the Kalioth Crown, pay the Old Tribute, and keep the crown after Volgan's body is destroyed."
 zin_ach_kalioth_restored_NAME:0 "The Dark Crown That Outlived Its Master"
 zin_ach_mothers_moot_DESC:0 "As the Cursed Lands or the Bloody Forest, form the Moot of Mothers without ever speaking the river names or taking Parim."
 zin_ach_mothers_moot_NAME:0 "Mothers' Rule Again"
 zin_ach_sea_is_the_seal_DESC:0 "As a delving hold, see a Deep King chosen and the seal sworn, with all four holds standing in 4A 1760 or later."
 zin_ach_sea_is_the_seal_NAME:0 "Four Doors, One King, No Key"
 zin_ach_square_relit_DESC:0 "As Adel or Nondondor, relight the Cursed Square without any sickness coming out of the wrecks, and proclaim the Sea-Roads."
 zin_ach_square_relit_NAME:0 "A Harbour of the Living Again"
 zin_ach_sun_crown_DESC:0 "As Coldor, take the Sun Crown and hold the Neck Road through the Western Crossing, without Melkgard ever holding the hearth-stone."
 zin_ach_sun_crown_NAME:0 "Sun Over the Ice"
 zin_ach_two_counts_DESC:0 "As an heir of the drowned low country, bring the cords and the cairn's count together and raise the stone from the Mothers' Mound, with every keeping asked for and none taken by force."
 zin_ach_two_counts_NAME:0 "The Knots and the Stones Agree"
 zin_ach_what_knocks_DESC:0 "As the Deep King's hold, open a Sea-Door, wake what lies below, and shut the door again before it is too late."
 zin_ach_what_knocks_NAME:0 "The Door Shut Again"
 zin_cosmetic_gromatrak:0 "Gromatrak"
 zin_cosmetic_gromatrak_ADJ:0 "Gromatrak"
 zin_cosmetic_gromatrak_DEF:0 "Gromatrak"
 zin_cosmetic_heulfaenn:0 "Heulfaenn"
 zin_cosmetic_heulfaenn_ADJ:0 "Heulfaenn"
 zin_cosmetic_heulfaenn_DEF:0 "Heulfaenn"
 zin_cosmetic_margorodai:0 "Margorodai"
 zin_cosmetic_margorodai_ADJ:0 "Margorodan"
 zin_cosmetic_margorodai_DEF:0 "Margorodai"
 zin_cosmetic_muzerar:0 "Muzerar"
 zin_cosmetic_muzerar_ADJ:0 "Muzeran"
 zin_cosmetic_muzerar_DEF:0 "Muzerar"
 zin_cosmetic_rhabtarkia:0 "Rhabtarkia"
 zin_cosmetic_rhabtarkia_ADJ:0 "Rhabtarkian"
 zin_cosmetic_rhabtarkia_DEF:0 "Rhabtarkia"
 zin_cosmetic_tarkia:0 "Tarkia"
 zin_cosmetic_tarkia_ADJ:0 "Tarkian"
 zin_cosmetic_tarkia_DEF:0 "Tarkia"
 zin_deep_a_deep_king_again:0 "A Deep King Again"
 zin_deep_a_deep_king_again_desc:0 "The moot sits. It can choose a Deep King for the first time since the drowned hall: the hold that called it, or the greatest of the four."
 zin_deep_a_deep_king_again_tt:0 "Each hold votes by event."
 zin_deep_ask_cairn_keepers:0 "Ask the Cairn-Keepers"
 zin_deep_ask_cairn_keepers_desc:0 "The giants of the ring keep a cairn with one stone for every year since the sea came. They will speak of it only to those who swear to keep their armies out of the ring."
 zin_deep_ask_cairn_keepers_tt:0 "A levy of 2,000 carries cut stone to the cairn-fields, and five merchant fleets are lent for a season. If the giants agree, we swear the Cairn-Oath: no army of ours may enter the ring, on pain of the oath."
 zin_deep_ask_cord_mothers:0 "Ask the Cord-Mothers"
 zin_deep_ask_cord_mothers_desc:0 "The cord-mothers of the grey downs keep a count of years on knotted cords and the law of a land nobody else remembers. They answer few, and never twice."
 zin_deep_ask_cord_mothers_tt:0 "We send arms to the downs, as many as our realm can bear, with salt and iron for the cord-mothers. They answer by event."
 zin_deep_ask_fair_consent:0 "Ask the Horse-Traders"
 zin_deep_ask_fair_consent_desc:0 "The horse-fair of the Delbiz coast is held among pillars nobody in Delbiz raised. Digging among them closes the fair for a season, and the horse-traders must agree."
 zin_deep_ask_fair_consent_tt:0 "Delbiz answers by event."
 zin_deep_ask_ferry_leave:0 "Ask Leave of the Ferrymen"
 zin_deep_ask_ferry_leave_desc:0 "The ferrymen of the quays work the crossing over the drowned road, and nothing is dug among the caps of the shore without their leave."
 zin_deep_ask_ferry_leave_tt:0 "Luv-zhise answers by event."
 zin_deep_ask_for_guides:0 "Ask the Reindeer Clans for Guides"
 zin_deep_ask_for_guides_desc:0 "The reindeer clans of the far north-west know where the ice gives back, and where it takes."
 zin_deep_ask_for_guides_tt:0 "We buy grain for the clans for a year. Kvittumm answers by event; its guides improve our ice-walks for two years."
 zin_deep_ask_isle_houses:0 "Ask the Isle Houses"
 zin_deep_ask_isle_houses_aenor:0 "Confirm the Tide-Seats"
 zin_deep_ask_isle_houses_aenor_desc:0 "The isle houses sit in the crown's councils by old right. Confirming their seats is the courtesy that might open the tide-chambers to the crown's scholars."
 zin_deep_ask_isle_houses_aenor_tt:0 "We confirm the Tide-Seats of the isle houses. The queens answer by event."
 zin_deep_ask_isle_houses_desc:0 "The queens of the isle houses know which tides open the rock-cut halls under Borrak and when the reef off the isle breaks the water. They keep the knowledge for their own divers."
 zin_deep_ask_isle_houses_tt:0 "We give 25 Fleet Valour for the divers' training and guarantee Orohaf's independence. The queens answer by event."
 zin_deep_ask_the_archive:0 "Ask the Archive for the Treaty"
 zin_deep_ask_the_archive_desc:0 "At the end of the old roads the Archive of Eldafaen keeps a treaty of passage older than its first book. The loremasters make no promises, and they remember every crown that broke one."
 zin_deep_ask_the_archive_tt:0 "Eldafaen answers by event. If the treaty is opened to us, we swear the elves' peace of passage: no army of ours crosses the narrows into elven land while the oath holds."
 zin_deep_ask_the_lamp:0 "Ask for the Lamp of the Lens"
 zin_deep_ask_the_lamp_desc:0 "The Lamp-House of the Lens keeps the old lights of the sea-roads. A harbour cannot be relit without its lamp."
 zin_deep_ask_the_lamp_tt:0 "The Lens answers by event."
 zin_deep_benan_into_the_charter:0 "Bring Benan into the Charter"
 zin_deep_benan_into_the_charter_desc:0 "A corsair isle in the Charter would open the Square to the Charter's ships and close one harbour to raiders."
 zin_deep_benan_into_the_charter_tt:0 "Benan answers by event."
 zin_deep_bridge_kingdom:0 "The Bridge Kingdom"
 zin_deep_bridge_kingdom_desc:0 "The stair, the gates and the treaty are in the hands of one crown. The scribes have a name for what that crown would be, and they have waited a long time to write it out in full."
 zin_deep_bridge_kingdom_tt:0 "Alerhia takes the Bridge Kingdom's name. The Bridge Remembered grows stronger, and the elven realms of the rift think better of us. The name is lost if we break the elves' peace of passage."
 zin_deep_bridge_remembered_2:0 "The Bridge Remembered"
 zin_deep_bridge_remembered_2_desc:0 "The stair, the gates and the treaty answer to one crown, and the road runs from shore to shore."
 zin_deep_buy_the_square:0 "Buy the Square"
 zin_deep_buy_the_square_desc:0 "Benan holds the reefs of the Cursed Square in name and has never sailed into them. Its captains might sell what they will not use."
 zin_deep_buy_the_square_tt:0 "We send fifteen merchant fleets with the offer. Benan answers by event."
 zin_deep_call_the_road_moot:0 "Call the Road Moot"
 zin_deep_call_the_road_moot_desc:0 "The four holds have not sat in one moot since the sea was let in. A hold that calls one must pay for the hall, the roads and the elders' patience."
 zin_deep_call_the_road_moot_tt:0 "Each other hold answers by event. If all three come, the Road Moot sits."
 zin_deep_carry_a_find_to_the_isles:0 "Carry a Find to the Isles"
 zin_deep_carry_a_find_to_the_isles_desc:0 "The chart-islanders have sea-words older than any chart. A bronze prow from the ice might be older than their words."
 zin_deep_carry_a_find_to_the_isles_tt:0 "We give one find away. Adel answers by event."
 zin_deep_carry_a_find_west:0 "Carry a Find to the West"
 zin_deep_carry_a_find_west_desc:0 "The clans of the West Lands sing of a north they never saw. A find from the ice, carried over the neck, might mean something to their singers."
 zin_deep_carry_a_find_west_tt:0 "We give one find away. Gunwyn answers by event."
 zin_deep_cat_ice_named:0 "Heulfaenn, the Sunfields"
 zin_deep_cat_ice_plain:0 "What the Ice Gives Back"
 zin_deep_cat_kalioth_named:0 "Rhabtarkia, the Kalioth Crown"
 zin_deep_cat_kalioth_plain:0 "The Kalioth Halls"
 zin_deep_cat_low_country_named:0 "Muzerar, the Low Country"
 zin_deep_cat_low_country_plain:0 "The Drowned Fields"
 zin_deep_cat_low_country_stone:0 "The Count in Stone"
 zin_deep_cat_low_country_tide:0 "The Tide-Chambers"
 zin_deep_cat_sea_doors_named:0 "The Sea-Doors of Gromatrak"
 zin_deep_cat_sea_doors_plain:0 "The Sea-Doors"
 zin_deep_cat_sea_roads_named:0 "Margorodai, the Sea-Roads"
 zin_deep_cat_sea_roads_plain:0 "The Reefs of the Square"
 zin_deep_cat_two_shores_fair:0 "The Pillars of the Fair"
 zin_deep_cat_two_shores_named:0 "Tarkia, the Bridge Kingdom"
 zin_deep_cat_two_shores_plain:0 "The Drowned Road"
 zin_deep_cat_two_shores_treaty:0 "The Treaty of Passage"
 zin_deep_compliance_work:0 "The Old Lands Reminded"
 zin_deep_compliance_work_desc:0 "The valley and the passes are being taught to answer to the iron height again."
 zin_deep_cord_moved:0 "The Cord Moved"
 zin_deep_cord_moved_desc:0 "Only three cord-mothers know where the Last Cord lies now. The downs keep their silence, and their silence keeps them."
 zin_deep_crowns_route_to_the_isles:0 "Put the Crown's Route to the Isles"
 zin_deep_crowns_route_to_the_isles_desc:0 "The league never gave its sea-rule to a king. Raerby's banks-court and Seite's moot would both have to agree that it should have one now."
 zin_deep_crowns_route_to_the_isles_tt:0 "Raerby and Seite answer by event."
 zin_deep_demand_old_tribute:0 "Demand the Old Tribute"
 zin_deep_demand_old_tribute_desc:0 "The lands that once paid the Kalioth kings can be reminded of it."
 zin_deep_demand_old_tribute_tt:0 "The holder of the old Kalioth lands answers by event. A refusal gives us a cause for war against it."
 zin_deep_dive_mothers_mound:0 "Dive at the Mothers' Mound"
 zin_deep_dive_mothers_mound_desc:0 "At the lowest spring tides a reef of cut stone breaks the water west of the isle. Divers who know the tides could go down to what lies under it."
 zin_deep_dive_mothers_mound_hard:0 "Dive at the Mothers' Mound"
 zin_deep_dive_mothers_mound_hard_desc:0 "The queens' houses will not send their own divers while Orohaf answers to a master, so the dive must be made with strangers who do not know the tides."
 zin_deep_dive_mothers_mound_hard_tt:0 "Without the queens' divers the dive costs twice as much: 80 Fleet Valour, 6,000 levies and twenty merchant fleets, and takes a month."
 zin_deep_dive_mothers_mound_tt:0 "The dive costs 40 Fleet Valour, 3,000 levies and ten merchant fleets, and takes a month. The storm decides whether the divers bring something up, find a door, or do not come back."
 zin_deep_door_names:0 "The Names on the Door"
 zin_deep_door_names_desc:0 "The elders spend their days reading the names cut into the door, and little else is studied in the hold."
 zin_deep_fair_closed:0 "The Fair Closed"
 zin_deep_fair_closed_desc:0 "The horse-fair is closed while diggers clear the pillars, and the traders have taken their herds elsewhere."
 zin_deep_gates_cleared:0 "The Gates Cleared"
 zin_deep_grain_for_clans:0 "Grain for the Clans"
 zin_deep_grain_for_clans_desc:0 "We feed the reindeer clans through a winter, as the price of their help."
 zin_deep_grey_breath:0 "The Grey Breath"
 zin_deep_guides_to_the_old_halls:0 "Guides to the Old Halls"
 zin_deep_guides_to_the_old_halls_desc:0 "Our herders know the places where the ice gives back old timber and bronze. We can send them out with every walk."
 zin_deep_guides_to_the_old_halls_tt:0 "Our own ice-walks find more and lose fewer."
 zin_deep_ice:0 "[ROOT.GetDeepIceTitle]"
 zin_deep_ice_desc:0 "In the years the north allows it, the ice gives back beams of great halls, bronze prows and hearth-stones. The clans know where to look, and what the ice takes in return."
 zin_deep_ice_find:0 "A Find in the Ice"
 zin_deep_kalioth:0 "[ROOT.GetDeepKaliothTitle]"
 zin_deep_kalioth_crown:0 "The Kalioth Crown"
 zin_deep_kalioth_crown_desc:0 "The diadem is worn, the valley and the passes answer to the Kalioth again, and the iron height has a court that calls itself by its old name."
 zin_deep_kalioth_crown_spirit:0 "The Iron Height"
 zin_deep_kalioth_crown_spirit_desc:0 "The court on the Kalioth calls itself by its old name, and its hosts march under it."
 zin_deep_kalioth_crown_tt:0 "Costs 50 Army Valour. Erco takes its old court's name and its iron, and must win the obedience of the lands it claims."
 zin_deep_kalioth_desc:0 "Old shafts under the seven forts of the Kalioth, and a wall in an iron hall that no miner is allowed to strike."
 zin_deep_kalioth_halls_opened:0 "The Kalioth Halls Opened"
 zin_deep_kalioth_unrest:0 "A Crown the Miners Did Not Choose"
 zin_deep_low_country:0 "[ROOT.GetDeepLowCountryTitle]"
 zin_deep_low_country_desc:0 "Fields under the sea, a count kept on cords, a count kept in stone, and tides that open old halls. Each keeper holds a part of what was lost, and none of them trusts the others with the rest."
 zin_deep_low_fields_charted:0 "The Low Fields Charted"
 zin_deep_mine_lords_oath:0 "The Mine-Lords' Oath"
 zin_deep_mine_lords_oath_desc:0 "The diadem went into the furnace, as the mine-lords swore it would, and the forges of the Kalioth work as they have not worked in an age."
 zin_deep_mine_lords_rise:0 "The Mine-Lords Rise"
 zin_deep_mine_lords_rise_desc:0 "The mine-lords shut the shafts against the court, as their forefathers shut the passes against the last king."
 zin_deep_moot_gold:0 "Gold for the Moot"
 zin_deep_moot_gold_desc:0 "The hold pays the roads, the hall and the elders of the moot."
 zin_deep_moot_of_mothers_blo:0 "The Moot of Mothers"
 zin_deep_moot_of_mothers_blo_desc:0 "The cord-mothers of the forest and the downs meet under the Last Cord, as their mothers' mothers met before the sea came. The two peoples could be ruled as one again by the eldest cord-mother of every clan."
 zin_deep_moot_of_mothers_cur:0 "The Moot of Mothers"
 zin_deep_moot_of_mothers_cur_desc:0 "The cord-mothers of the downs and the forest meet under the Last Cord, as their mothers' mothers met before the sea came. The two peoples could be ruled as one again by the eldest cord-mother of every clan."
 zin_deep_moot_of_mothers_tt:0 "The two Orran realms are ruled as one under the cord-mothers; the other realm's mothers must consent, and their refusal costs Calm. The realm takes the Low Country's name and the Peace of the Cords, and claims (never cores) on the Konorar valley."
 zin_deep_old_ditches:0 "The Old Ditches"
 zin_deep_open_the_old_shafts:0 "Open the Old Shafts"
 zin_deep_open_the_old_shafts_desc:0 "The seven forts of the Kalioth stand on older halls. Crews could clear the shafts that the mine-lords walled up when the last king fell."
 zin_deep_open_the_old_shafts_tt:0 "The crews cost 3,000 levies and 300 arms, and the work takes 90 days."
 zin_deep_open_the_sea_door:0 "Open the Sea-Door"
 zin_deep_open_the_sea_door_desc:0 "One road under the sea could be pumped, shored and opened again between two holds. Nobody knows what waits in the dark of the drowned hall, and the moot has always said nobody should find out."
 zin_deep_open_the_sea_door_tt:0 "The work costs 3,000 Stored Essence, 50 Army Valour and 5,000 levies, and takes a year. While the door stands open, something below may wake."
 zin_deep_peace_of_cords:0 "The Peace of the Cords"
 zin_deep_peace_of_cords_desc:0 "The eldest cord-mother of every clan sits in the Moot, and no clan wars on another while the cord is kept."
 zin_deep_pillars_of_the_fair:0 "The Pillars of the Fair"
 zin_deep_pillars_of_the_fair_desc:0 "The fallen pillars of the horse-fair are the eastern half of a city that once stood on both shores. Clearing them means closing the fair."
 zin_deep_pillars_of_the_fair_tt:0 "The dig takes 90 days, and the horse-fair of Delbiz is closed for 180 days."
 zin_deep_raise_the_bridge_road:0 "Raise the Bridge Road"
 zin_deep_raise_the_bridge_road_desc:0 "Quays and causeway footings on both shores, a road to each gate, and harbours at both ends. The narrows would be crossed as they were before the sea came between them."
 zin_deep_raise_the_bridge_road_tt:0 "Ten merchant fleets and 200 camp gear raise a road and a harbour at both gates."
 zin_deep_relic_deep_lamp:0 "The Deep King's Lamp"
 zin_deep_relic_deep_lamp_desc:0 "The lamp of the drowned hall, carried by the hold of the Deep King. The four holds share their craft by its light."
 zin_deep_relic_diadem:0 "The Kalioth Diadem"
 zin_deep_relic_diadem_desc:0 "The iron diadem of the last king of the Kalioth. The court is proud of it, and the miners who uncovered it will not look at it."
 zin_deep_relic_dike_stones:0 "The Dike-Stones"
 zin_deep_relic_dike_stones_desc:0 "The giants have given us stones from the line of the old sea-dikes, and the craft of laying them."
 zin_deep_relic_gate_stones:0 "The Bridge Remembered"
 zin_deep_relic_gate_stones_desc:0 "Stones from both halves of the broken city stand on the first stair. The scribes study the old hand with new purpose."
 zin_deep_relic_hearth_stone:0 "The Hearth-Stone"
 zin_deep_relic_hearth_stone_desc:0 "The hearth-stone of the king's hall under the ice. Every house-fire of the realm is lit from it in the Long Dark."
 zin_deep_relic_last_cord:0 "The Last Cord"
 zin_deep_relic_last_cord_desc:0 "The cord of the Moot, with a black twist for every field the sea took. The cord-mothers carry it before the clans, and the downs are defended as if the dead were watching."
 zin_deep_relic_mothers_stone:0 "The Mothers' Stone"
 zin_deep_relic_mothers_stone_desc:0 "Knots are cut into every face of the stone from the drowned mound. Our scholars read it as an account of fields, years and debts, and learn to reckon from it."
 zin_deep_relic_mothers_stone_orohaf:0 "The Mothers' Stone"
 zin_deep_relic_mothers_stone_orohaf_desc:0 "The cut stone from the top of the drowned mound stands in the queens' hall at Borrak, and the isle houses build their harbours with a will."
 zin_deep_relic_square_lamp:0 "The Square's Lamp"
 zin_deep_relic_square_lamp_desc:0 "A light burns over the four moles again, and ships of every flag steer by it."
 zin_deep_relic_treaty:0 "The Treaty of Passage"
 zin_deep_relic_treaty_desc:0 "The elves' peace of passage, sworn before the Archive. No army of ours crosses the narrows into their land, and their loremasters speak well of us."
 zin_deep_relight_the_square:0 "Relight the Square"
 zin_deep_relight_the_square_desc:0 "Salvors could clear the moles, raise a light on the old harbour and make the Square a harbour of the living again, if nothing in the wrecks has been waiting for them."
 zin_deep_relight_the_square_tt:0 "The salvors cost 60 Fleet Valour, fifteen merchant fleets and 3,000 levies, and the work takes 180 days. Without the Healers' Case-Rolls a sickness may come out of the wrecks."
 zin_deep_road_moot_faction:0 "The Road Moot"
 zin_deep_road_reopened:0 "The Road Under the Sea"
 zin_deep_road_reopened_desc:0 "One road under the sea runs again between two holds, pumped and shored, and the dark at its far end is watched day and night."
 zin_deep_sea_doors:0 "[ROOT.GetDeepSeaDoorsTitle]"
 zin_deep_sea_doors_desc:0 "Four holds, four sealed doors, one tongue, and the sea lying on a drowned hall. Whether the holds can be one realm again without opening a door is the question the moot has never answered."
 zin_deep_sea_is_the_seal:0 "The Sea Is the Seal"
 zin_deep_sea_is_the_seal_desc:0 "The holds have sworn never to open a door. The sea lies on the drowned hall, and what is in it stays."
 zin_deep_sea_roads:0 "[ROOT.GetDeepSeaRoadsTitle]"
 zin_deep_sea_roads_charts:0 "The Square's Charts"
 zin_deep_sea_roads_desc:0 "Four broken moles under the reefs that wreck ships, a lamp on the Lens, and charts older than any harbour now inhabited."
 zin_deep_sea_roads_league:0 "The Sea-Roads"
 zin_deep_sea_roads_league_desc:0 "One league holds the sea-roads again, with one due paid by every flag at every harbour of the arcs."
 zin_deep_seal_the_deep:0 "Seal the Deep at Any Cost"
 zin_deep_seal_the_deep_desc:0 "The door was not shut in time and the deep is loose under the holds. Every hold and every realm it has reached can pay to shut it again."
 zin_deep_seal_the_deep_tt:0 "Sealing the deep costs 5,000 Stored Essence and 10,000 levies."
 zin_deep_seal_the_door:0 "Seal the Sea-Door"
 zin_deep_seal_the_door_desc:0 "Something knocks behind the open door, and the deep is spreading under the holds. The door must be shut before it is too late to shut it."
 zin_deep_seal_the_door_timeout_tt:0 "The door was not shut in time: the deep is loose under the holds, and every realm it reaches will hear of it."
 zin_deep_seal_the_door_tt:0 "We pay 2,000 Stored Essence and 5,000 levies. The door is shut, the deep's hold on the states it reached is broken, and the road under the sea is lost."
 zin_deep_send_an_ice_walk:0 "Send an Ice-Walk"
 zin_deep_send_an_ice_walk_desc:0 "In the Long Light after a mild winter the ice draws back a little, and the clans go out to see what it has given back."
 zin_deep_send_an_ice_walk_tt:0 "The walk costs 20 Army Valour, 100 camp gear for sleds and tents and 1,000 levies, and takes 60 days. It may bring back a find, nothing, or fewer walkers than went out."
 zin_deep_settle_the_old_blame:0 "Settle the Old Blame"
 zin_deep_settle_the_old_blame_desc:0 "The western holds say that Kunhrim's lords urged the Letting-In to save their own gate. Kunhrim can pay in iron for a grudge older than any charter."
 zin_deep_settle_the_old_blame_tt:0 "Kunhrim pays 400 arms. Each western hold that has read its door answers by event."
 zin_deep_silence:0 "The Silence of the Ring"
 zin_deep_silence_desc:0 "The keepers will not speak the count to anyone. The ring is closed, its stones are watched, and its giants are ready."
 zin_deep_square_relit:0 "The Square Relit"
 zin_deep_stair_scribes:0 "Scribes in the Stair"
 zin_deep_stair_scribes_desc:0 "The scribes have gone down into the vaults of the first stair, and the court's other studies wait for them."
 zin_deep_stones_under_the_caps:0 "Stones Under the Caps"
 zin_deep_stones_under_the_caps_desc:0 "Under the fungal belt of the shore lie fallen pillars, a quay and the footings of a causeway that once ran east. Clearing them means working among the caps through a Spore Summer."
 zin_deep_stones_under_the_caps_tt:0 "The dig costs 400 arms for tools and 4,000 levies, and takes 120 days. A Spore Summer may sicken the diggers, and then the dig must begin again."
 zin_deep_sun_crown_spirit:0 "The Sun Crown"
 zin_deep_sun_crown_spirit_desc:0 "A crown over the ice where the sun-fields were, and songs of a green north that are sung as a promise now."
 zin_deep_the_deep_awake:0 "The Deep Awake"
 zin_deep_the_sea_is_the_seal:0 "The Sea Is the Seal"
 zin_deep_the_sea_is_the_seal_desc:0 "While the sea lies on the drowned hall, what is in it stays. The four holds can swear never to open a door, and keep that oath as long as they stand."
 zin_deep_the_sea_is_the_seal_tt:0 "The four holds swear never to open a Sea-Door. Every hold gains a lasting spirit, and no door may be opened again."
 zin_deep_the_sea_roads_ade:0 "The Sea-Roads Rejoined"
 zin_deep_the_sea_roads_ade_desc:0 "The Square is relit and the Charter sails as one. The chart-houses have an old name for a league that held the sea-roads from the Cold Lands ports to the southern isles."
 zin_deep_the_sea_roads_nnd:0 "The Sea-Roads by the Crown"
 zin_deep_the_sea_roads_nnd_desc:0 "The Square is relit by the crown's ships and the isles have agreed. The crown can take the league's old name, and its old sea-rule with it."
 zin_deep_the_sea_roads_tt:0 "Costs 100 Fleet Valour. The leader takes the league's name; its ships escort and see better, and the corsair isles become a cause for war."
 zin_deep_the_sun_crown_cld:0 "The Sun Crown"
 zin_deep_the_sun_crown_cld_desc:0 "The hearth-stone of the king's hall is ours, the Neck Road is held, and three peoples know they kept one name for one land. The Winter Crown could take the name of the fields under the ice."
 zin_deep_the_sun_crown_mlk:0 "The Sun Crown"
 zin_deep_the_sun_crown_mlk_desc:0 "The hearth-stone of the king's hall is in our hands, not in Coldor's. A warlord's crown could take the name of the fields under the ice before the Winter Crown does."
 zin_deep_the_sun_crown_tt:0 "We buy a winter's grain for the clans. The crown takes the name of the fields under the ice, its armies suffer less from winter, and it claims (never cores) the free steadings, whose clans refuse to kneel."
 zin_deep_tide_chambers_opened:0 "The Tide-Chambers Opened"
 zin_deep_tt_benan_refused:0 "Benan has not refused us this season"
 zin_deep_tt_blame_settled:0 "The old blame between the holds is settled"
 zin_deep_tt_charter_league:0 "Every isle of the Charter sails in our league"
 zin_deep_tt_charter_member:0 "We sail in the Pupor Charter"
 zin_deep_tt_cord_refused:0 "The cord-mothers have not refused us this season"
 zin_deep_tt_cord_shown:0 "The Last Cord has been shown"
 zin_deep_tt_dig_ready:0 "Our scribes know where to dig"
 zin_deep_tt_dive_cooldown:0 "No divers have been lost at the Mound this year"
 zin_deep_tt_fair:0 "The horse-traders of Delbiz have agreed"
 zin_deep_tt_find_refused:0 "They have not refused a find of ours this season"
 zin_deep_tt_gates_held:0 "Both gates are held by us, our subjects or our league"
 zin_deep_tt_gates_owned:0 "Both gates are held by us or our subjects"
 zin_deep_tt_guides_refused:0 "The reindeer clans have not refused us this season"
 zin_deep_tt_isles_agreed:0 "Raerby and Seite have agreed to the crown's route"
 zin_deep_tt_leave:0 "The ferrymen of Luv-zhise have given us leave"
 zin_deep_tt_leave_refused:0 "We have not been refused this season"
 zin_deep_tt_long_light:0 "It is the Long Light after a mild winter"
 zin_deep_tt_moot_failed:0 "No moot we called has failed this year"
 zin_deep_tt_mound_base:0 "A harbour of level 2 or more at the shore facing the Mound"
 zin_deep_tt_mound_reach:0 "We hold Orohaf's shore, or the isle houses have shared the Tide with us"
 zin_deep_tt_mycid_passage:0 "The mycids of the shore let diggers pass"
 zin_deep_tt_neck_road:0 "Horidor and the Neck Road stand with us"
 zin_deep_tt_no_army_in_ring:0 "No army of ours may enter the ring of Hirolon: we have no passage through it and hold none of its states"
 zin_deep_tt_no_breath:0 "No sickness is loose in the harbours"
 zin_deep_tt_no_claim_on_veiled:0 "We hold no claim on the grey downs"
 zin_deep_tt_no_crossing:0 "We have not taken the road of the crossing by force"
 zin_deep_tt_not_coalition:0 "We are not in the eastern coalition"
 zin_deep_tt_not_dominion:0 "We do not rule as Dominion"
 zin_deep_tt_not_last_war:0 "We are not fighting in the War of the Last Crowns"
 zin_deep_tt_other_orran:0 "The other Orran realm answers to us, or no longer stands"
 zin_deep_tt_relit_by_us:0 "We relit the Square"
 zin_deep_tt_road_raised:0 "We have raised the Bridge Road"
 zin_deep_tt_square_base:0 "A harbour at the shore facing the Square"
 zin_deep_tt_stone_refused:0 "The giants have not refused us in recent years"
 zin_deep_tt_three_finds:0 "We have made three finds in the ice"
 zin_deep_tt_three_names:0 "We know that three peoples kept one name for one land"
 zin_deep_tt_tide_not_puppet:0 "Orohaf does not answer to us"
 zin_deep_tt_tide_refused:0 "The isle houses have not refused us this season"
 zin_deep_tt_tide_window:0 "It is the month of the great tides (the third or the ninth month)"
 zin_deep_tt_two_finds:0 "We hold two or more finds from the ice"
 zin_deep_tt_valley_held:0 "The Plutondo valley and the passes of Miaed are held by us or our subjects"
 zin_deep_tt_walked:0 "We have not walked the ice in this Long Light"
 zin_deep_tt_western_door_read:0 "A western hold has read its door and has not answered the blame"
 zin_deep_two_shores:0 "[ROOT.GetDeepTwoShoresTitle]"
 zin_deep_two_shores_desc:0 "A city broken in two across the narrows, a road that ran over land that is now sea, and a treaty the elves have kept longer than any crown has stood."
 zin_deep_yield_the_old_blame:0 "Yield the Old Blame"
 zin_deep_yield_the_old_blame_desc:0 "A hold can let the grudge go without being paid for it, if its elders can stomach it."
 zin_deep_yield_the_old_blame_tt:0 "Our elders yield the blame. Kunhrim hears of it."
 zin_deep.1.a:0 "Give them to the old women. They know what to do with them."
 zin_deep.1.b:0 "Throw them back. The sea wants them more than we do."
 zin_deep.1.desc:0 "The boats off the west of the isle came in heavy this morning, and not with fish. The nets brought up worked stones: a piece of a field-wall, a quern with a hole worn through it, a stone with a twisted cord cut into one face."
 zin_deep.1.t:0 "Nets of Field-Stone"
 zin_deep.10.a:0 "Then we know what we keep."
 zin_deep.10.desc:0 "The cord-mothers have laid the Old Tallies out in the eldest barrow and counted them aloud, for the first time in anyone's memory, to someone who is not a cord-mother. The count is of years, and of fields the sea took one by one, and the black ties run back to a land the mothers call Muzerar. They do not say more than that."
 zin_deep.10.t:0 "What the Cords Count"
 zin_deep.100.a:0 "Let the court decide."
 zin_deep.100.desc:0 "The crews have cleared the old shafts as far as an iron hall under the seven forts. One wall of it is newer than the rest, and the foremen will not let a pick touch it: behind it, the oldest miners say, the mine-lords walled up the diadem of the last king of Rhabtarkia. The court must decide what is done with it."
 zin_deep.100.t:0 "A Wall Nobody Strikes"
 zin_deep.101.a:0 "Wall it up again."
 zin_deep.101.b:0 "Melt it, as the mine-lords swore."
 zin_deep.101.c:0 "Wear it."
 zin_deep.101.desc:0 "Behind the newer wall of the iron hall the crews found a niche, and in it a dark iron diadem: the crown of the last king of Rhabtarkia, walled up by the mine-lords who would neither wear it nor melt it."
 zin_deep.101.t:0 "The Diadem in the Wall"
 zin_deep.102.a:0 "We remember the tribute."
 zin_deep.102.desc:0 "[FROM.GetName] has taken the iron diadem of the Kalioth kings out of the wall and put it on. Every land that once paid the Kalioth knows what that means."
 zin_deep.102.t:0 "The Diadem Is Worn"
 zin_deep.103.a:0 "Good riddance."
 zin_deep.103.desc:0 "[FROM.GetName] has melted the diadem of the Kalioth kings, as the mine-lords swore to in 2A 12. Our scribes say the refusal of 1A 1214 has been answered at last."
 zin_deep.103.t:0 "The Diadem Melted"
 zin_deep.105.a:0 "Pay the tribute."
 zin_deep.105.b:0 "Send him away."
 zin_deep.105.desc:0 "An envoy has come from the south with courtesy that frightens the court. Nafeher remembers the Black Tribute, he says, and the kings who paid it; it asks for ships and grain, and offers the old lands of the march in return."
 zin_deep.105.t:0 "An Envoy from Nafeher"
 zin_deep.106.a:0 "Noted."
 zin_deep.106.desc:0 "The court of the iron height has paid the tribute: ships and grain are on their way south."
 zin_deep.106.desc1:0 "The court of the iron height has sent the envoy away with nothing."
 zin_deep.106.t:0 "The Iron Height Answers"
 zin_deep.107.a:0 "Pay, and keep the peace."
 zin_deep.107.b:0 "Refuse."
 zin_deep.107.desc:0 "[FROM.GetName] reminds us that our lands once paid the Kalioth kings, and asks that they pay again."
 zin_deep.107.t:0 "The Old Tribute Demanded"
 zin_deep.108.a:0 "Hold the forts."
 zin_deep.108.desc:0 "Volgan's body is destroyed, and the mine-lords have risen against the court that paid him tribute, as their forefathers rose against the last king. The claims of the crown are lost."
 zin_deep.108.t:0 "The Kalioth Falls Again"
 zin_deep.109.a:0 "The Kalioth rises."
 zin_deep.109.desc:0 "The court on the iron height has taken its old name, Rhabtarkia, and claims the lands its kings once held."
 zin_deep.109.t:0 "Rhabtarkia"
 zin_deep.11.a:0 "The mothers will want to speak with each other."
 zin_deep.11.desc:0 "Word has come through the red-oak woods that the cord-mothers of the grey downs have counted their old cords aloud. Our own mothers say the cords count the same years as the cord-trees of the forest."
 zin_deep.11.t:0 "The Veiled Count Their Cords"
 zin_deep.110.a:0 "The road is open, for what it is worth."
 zin_deep.110.desc:0 "The scouts climbed the old road over the Melty Pass and came back with frostbite and nothing else: empty forts on the glacier, snow in the gatehouses, and no sign of anyone beyond."
 zin_deep.110.t:0 "The Glacier Road"
 zin_deep.12.a:0 "We will remember where it lies."
 zin_deep.12.desc:0 "The cord-mothers of the grey downs have brought a cord out of their eldest barrow and shown it to the clans: a long cord tied black and pale, older than any crown. They say it is the last cord of a moot of mothers, and that it lies in the eldest barrow for anyone with eyes to see."
 zin_deep.12.t:0 "The Last Cord Shown"
 zin_deep.14.a:0 "Share the count with our kin."
 zin_deep.14.b:0 "The cords stay in the barrow."
 zin_deep.14.c:0 "Give them the Last Cord itself."
 zin_deep.14.desc:0 "The cord-mothers of the Red Woods have come to the border stone and asked, in the old tongue, to share the count the cords keep. They say the forest and the downs were one people before the sea came."
 zin_deep.14.t:0 "The Forest Asks for the Cord"
 zin_deep.15.a:0 "It was only cord."
 zin_deep.15.desc:0 "Our soldiers broke into the eldest barrow of the grey downs and found the cord-mothers already gone. They had burned something before they left: a heap of knotted cord, still smoking, that their people will never forgive us for."
 zin_deep.15.t:0 "The Cord Burns"
 zin_deep.150.a:0 "Remember the names."
 zin_deep.150.desc:0 "The elders have read the names cut into our Sea-Door: the last delvers of Gromatrak, who sealed the road when the sea was let in. Every name is in the tongue we still speak."
 zin_deep.150.t:0 "The Names on the Door"
 zin_deep.151.a:0 "Noted by the moot."
 zin_deep.151.desc:0 "[FROM.GetName] has read the names on its Sea-Door. The elders of the holds say it has been a long time since anyone cared to."
 zin_deep.151.t:0 "Another Door Read"
 zin_deep.152.a:0 "Settle the blame."
 zin_deep.152.b:0 "Keep the iron and the grudge."
 zin_deep.152.desc:0 "Kunhrim has sent iron to our gate and asks that the old blame be settled: that we stop saying its lords urged the Letting-In to save their own gate."
 zin_deep.152.t:0 "Kunhrim Pays for the Blame"
 zin_deep.153.a:0 "Very well."
 zin_deep.153.desc:0 "[FROM.GetName] has settled the old blame. Its elders say no more of our lords and the Letting-In."
 zin_deep.153.desc1:0 "[FROM.GetName] kept our iron and its grudge."
 zin_deep.153.t:0 "An Answer from the West"
 zin_deep.154.a:0 "Good."
 zin_deep.154.desc:0 "[FROM.GetName] has let the old blame go without being paid for it. Its elders are not happy, but they have said it in moot."
 zin_deep.154.t:0 "The Blame Yielded"
 zin_deep.155.a:0 "Send our elders."
 zin_deep.155.b:0 "Stay away."
 zin_deep.155.desc:0 "[FROM.GetName] calls the four holds to a Road Moot, the first since the sea was let in, and has paid for the hall and the roads."
 zin_deep.155.t:0 "The Road Moot Called"
 zin_deep.156.a:0 "So it stands."
 zin_deep.156.desc:0 "The four holds sit in one moot, in the old tongue of Gromatrak, for the first time since the drowned hall."
 zin_deep.156.desc1:0 "Not every hold came, and the moot did not sit."
 zin_deep.156.t:0 "The Road Moot"
 zin_deep.157.a:0 "The hold that called the moot."
 zin_deep.157.b:0 "The greatest of the holds."
 zin_deep.157.desc:0 "The Road Moot must choose a Deep King: the hold that called the moot, or the greatest of the four. The quarrel has already gone on for three days."
 zin_deep.157.t:0 "A Deep King Again"
 zin_deep.158.a:0 "Long live the Deep King."
 zin_deep.158.desc:0 "The moot has chosen [FROM.GetName], and Gromatrak has a Deep King for the first time since the drowned hall. The lamp of the hall goes with the king's seat."
 zin_deep.158.t:0 "The Deep King"
 zin_deep.159.a:0 "The doors stay shut."
 zin_deep.159.desc:0 "The four holds have sworn on the lamp never to open a door. The sea lies on the drowned hall, and what is in it stays."
 zin_deep.159.t:0 "The Sea Is the Seal"
 zin_deep.16.a:0 "We will remember."
 zin_deep.16.desc:0 "Foreign soldiers took the eldest barrow of the grey downs, and the cord-mothers burned the Last Cord rather than let it be taken. Every Orran clan will remember whose soldiers they were."
 zin_deep.16.t:0 "The Last Cord Is Burned"
 zin_deep.160.a:0 "To Kunhrim."
 zin_deep.160.b:0 "To Hrakbrund."
 zin_deep.160.c:0 "To Brundahrim."
 zin_deep.160.d:0 "To Gromkerm."
 zin_deep.160.desc:0 "The pumps have worked for a year, the shoring is in, and the door stands open on a road that runs under the sea. Which hold does the road lead to?"
 zin_deep.160.t:0 "The Sea-Door Opened"
 zin_deep.161.a:0 "Watch the doors."
 zin_deep.161.desc:0 "[FROM.GetName] has opened a Sea-Door, against everything the moot ever said. A road runs under the sea again, and nobody knows what else does."
 zin_deep.161.t:0 "A Sea-Door Opened"
 zin_deep.17.a:0 "Stones on a hillside."
 zin_deep.17.desc:0 "When our soldiers reached the cairn-fields, the giants had already pulled down the top of the Eldest Cairn and scattered its stones across the hillside. Whatever the cairn counted, nobody will count it now."
 zin_deep.17.t:0 "The Count Is Scattered"
 zin_deep.170.a:0 "Shut the door!"
 zin_deep.170.desc:0 "The watchers at the open door heard knocking from the dark at the far end of the drowned hall. Then the lamps went out, and the deep came up the road."
 zin_deep.170.t:0 "Something Knocks"
 zin_deep.171.a:0 "Find out where it comes from."
 zin_deep.171.desc:0 "Mines have flooded with something that is not water, wells have gone sour, and herds will not graze near the hills. Something has come up out of the ground under our land."
 zin_deep.171.t:0 "The Deep Under Our Land"
 zin_deep.172.a:0 "Keep it shut."
 zin_deep.172.desc:0 "The door has been shut and sealed with essence and stone, and the deep has gone back down the road. The road under the sea is lost again."
 zin_deep.172.t:0 "The Door Shut Again"
 zin_deep.173.a:0 "Seal it at any cost."
 zin_deep.173.desc:0 "The door was not shut in time. The deep is loose under the holds and spreading from hill to hill, and every realm it reaches is paying for a door it never opened."
 zin_deep.173.t:0 "The Deep Unbound"
 zin_deep.18.a:0 "Let the scholars ask the keepers properly."
 zin_deep.18.desc:0 "The scholar who walked to the edge of the grey downs has come back to Parim with a question nobody can answer: why the Veiled count their years on cords, and what the black ties stand for. The masters of Parim and Selen have taken up the question."
 zin_deep.18.t:0 "A Scholar Comes Home"
 zin_deep.19.a:0 "Let them copy the cords, and take the bread."
 zin_deep.19.b:0 "The cords are not for copying."
 zin_deep.19.desc:0 "The almoners of the Deliverer have asked to copy the old cords, for safekeeping, they say. They have brought bread and medicine for the downs. We know now where such copies went: into the Hidden Council's archive, among the names it keeps for other uses."
 zin_deep.19.desc1:0 "The almoners of the Deliverer have asked to copy the old cords, for safekeeping, they say, in case the barrows are ever lost. They have brought bread and medicine for the downs, and they will leave it either way."
 zin_deep.19.t:0 "The Almoners and the Cords"
 zin_deep.2.a:0 "Send the knotted stone to the divers."
 zin_deep.2.b:0 "Leave the rows where they lie."
 zin_deep.2.desc:0 "The fishers have kept every stone the nets brought up, as the queens asked, and the old women have laid them out on the shore in rows that look very like fields. One of them, a quern-stone, has a twisted cord cut into its rim that nobody on the isle can read."
 zin_deep.2.t:0 "The Old Women's Stones"
 zin_deep.20.a:0 "Tie it."
 zin_deep.20.desc:0 "The almoners' copy of our cords was never kept for safekeeping. It went into the Hidden Council's archive, among the names and debts that Afrit kept for other uses, and the cord-mothers have tied a new black tie for it."
 zin_deep.20.t:0 "Where the Copy Went"
 zin_deep.200.a:0 "The Square was a harbour."
 zin_deep.200.desc:0 "Our oldest charts show a harbour with four moles on the reef shelf inside the arcs, exactly where the Cursed Square wrecks ships today. They name it Halgohavnai, the seat of Margorodai, the league of the sea-roads."
 zin_deep.200.t:0 "The League's Oldest Charts"
 zin_deep.201.a:0 "Keep the charts with the lamp."
 zin_deep.201.desc:0 "Adel has sent the Lamp-House a copy of its oldest charts, with a note that the Square was once a harbour, and that its lights were the Lens's own."
 zin_deep.201.t:0 "Charts for the Lens"
 zin_deep.202.a:0 "Sell them the reefs."
 zin_deep.202.b:0 "The Square is not for sale."
 zin_deep.202.desc:0 "[FROM.GetName] offers to buy the reefs of the Cursed Square, which we hold in name and have never sailed into."
 zin_deep.202.t:0 "An Offer for the Square"
 zin_deep.203.a:0 "Very well."
 zin_deep.203.desc:0 "Benan has opened the Square to us. Its captains laughed at the price, and took it."
 zin_deep.203.desc1:0 "Benan's captains laughed at the offer, and kept the Square."
 zin_deep.203.t:0 "Benan's Answer"
 zin_deep.204.a:0 "Join the Charter."
 zin_deep.204.b:0 "We sail for no charter."
 zin_deep.204.desc:0 "[FROM.GetName] invites us into the Pupor Charter, with the Square opened to the Charter's ships."
 zin_deep.204.t:0 "The Charter Asks Benan In"
 zin_deep.206.a:0 "Lend the lamp."
 zin_deep.206.b:0 "The lamp stays on the Lens."
 zin_deep.206.desc:0 "[FROM.GetName] asks the Lamp-House to lend the lamp of the old sea-roads, to relight the Square."
 zin_deep.206.t:0 "The Lamp Is Asked For"
 zin_deep.207.a:0 "Very well."
 zin_deep.207.desc:0 "The Lamp-House has lent the lamp, with keepers to tend it."
 zin_deep.207.desc1:0 "The Lamp-House will not lend its lamp."
 zin_deep.207.t:0 "The Lamp-House Answers"
 zin_deep.208.a:0 "A harbour of the living again."
 zin_deep.208.desc:0 "A light burns over the four moles of Halgohavnai for the first time since the harbour was left to its dead. Ships that once steered wide of the Square now steer by it."
 zin_deep.208.t:0 "The Square Relit"
 zin_deep.209.a:0 "Noted."
 zin_deep.209.desc:0 "There is a light over the Cursed Square, and ships at anchor inside the reefs. [FROM.GetName] has made a harbour of it."
 zin_deep.209.t:0 "A Light in the Square"
 zin_deep.21.a:0 "Let them hear the count."
 zin_deep.21.b:0 "Send them home."
 zin_deep.21.desc:0 "Envoys of [FROM.GetName] have come to the border stone with arms, salt and iron, and they ask to hear what the cords count. The cord-mothers have listened to them and said nothing yet."
 zin_deep.21.t:0 "The Cord-Mothers Are Asked"
 zin_deep.210.a:0 "Close the harbours."
 zin_deep.210.desc:0 "The salvors who cleared the wrecks have fallen sick with a grey cough that spreads from ship to ship. The oldest islanders know its name, and none of them will say it aloud."
 zin_deep.210.t:0 "The Grey Breath"
 zin_deep.211.a:0 "Burn the ships that brought it."
 zin_deep.211.desc:0 "A grey cough has come into our harbour with ships from the Square, and it spreads from house to house along the quays."
 zin_deep.211.t:0 "Sickness in the Harbour"
 zin_deep.212.a:0 "Count the dead."
 zin_deep.212.desc:0 "The grey cough has burned itself out in the harbours. The dead are counted, and the quays open again."
 zin_deep.212.t:0 "The Breath Passes"
 zin_deep.213.a:0 "Agree to the crown's route."
 zin_deep.213.b:0 "The league never gave its sea-rule to a king."
 zin_deep.213.desc:0 "Nondondor asks us to agree that the sea-roads should be held by a crown, its own, as the league never allowed."
 zin_deep.213.t:0 "The Crown's Route"
 zin_deep.214.a:0 "Very well."
 zin_deep.214.desc:0 "Raerby and Seite have agreed: the sea-roads may be held by the crown."
 zin_deep.214.desc1:0 "The isles refused the crown's route."
 zin_deep.214.t:0 "The Isles Answer"
 zin_deep.215.a:0 "One due for every flag."
 zin_deep.215.desc:0 "One league holds the sea-roads again, from the Cold Lands ports to the southern isles, under the name the chart-houses never forgot: Margorodai."
 zin_deep.215.t:0 "The Sea-Roads Rejoined"
 zin_deep.22.a:0 "Keep the count safe."
 zin_deep.22.desc:0 "The cord-mothers have read the cords aloud to our envoys, tie by tie. The count is of years and of fields, running back past every crown we know, and the envoys have written down every word."
 zin_deep.22.t:0 "The Cord-Mothers Answer"
 zin_deep.23.a:0 "Then another year."
 zin_deep.23.desc:0 "The cord-mothers took our gifts, listened to our envoys and sent them home with three words: not this year."
 zin_deep.23.t:0 "The Cord-Mothers Will Not Answer"
 zin_deep.24.a:0 "Let them swear, and hear the count."
 zin_deep.24.b:0 "The count is not theirs to hear."
 zin_deep.24.desc:0 "A levy of [FROM.GetName] has carried cut stone to the cairn-fields, and its envoys ask to hear the count of the Eldest Cairn. They offer to swear that no army of theirs will enter the ring."
 zin_deep.24.t:0 "The Cairn-Keepers Are Asked"
 zin_deep.25.a:0 "We will keep the oath."
 zin_deep.25.desc:0 "The keepers made our envoys swear the Cairn-Oath on the cairn itself. Then they counted the stones aloud, slowly, one keeper after another, until the count was done, and told us where the old dikes stood."
 zin_deep.25.t:0 "The Cairn-Keepers Answer"
 zin_deep.250.a:0 "Send the walkers out."
 zin_deep.250.desc:0 "After a mild winter the ice has drawn back from the old moraines, and the herders report timber in the ice that no tree in the north could have grown: great beams, squared and pegged."
 zin_deep.250.t:0 "The Ice Gives Something Back"
 zin_deep.251.a:0 "Bring it home."
 zin_deep.251.desc:0 "Our walkers have dug a great timber beam out of the ice, squared and pegged, from a hall bigger than any hall of ours."
 zin_deep.251.desc1:0 "Our walkers have brought back a bronze prow from the ice, green with age, from a ship bigger than any ship of ours."
 zin_deep.251.t:0 "A Find in the Ice"
 zin_deep.252.a:0 "Next Long Light."
 zin_deep.252.desc:0 "The walkers went as far as the light allowed and came back with nothing but frostbite and a few good stories."
 zin_deep.252.t:0 "Nothing but Ice"
 zin_deep.253.a:0 "The ice takes what it gives."
 zin_deep.253.desc:0 "The ice gave way under the walkers on the way back, and not all of them came home."
 zin_deep.253.t:0 "The Ice Takes Back"
 zin_deep.254.a:0 "Send the guides."
 zin_deep.254.b:0 "The places are ours."
 zin_deep.254.desc:0 "[FROM.GetName] asks our herders to guide its walkers to the places where the ice gives back, and will feed our clans through the winter for it."
 zin_deep.254.t:0 "Guides for the Ice"
 zin_deep.255.a:0 "Very well."
 zin_deep.255.desc:0 "The reindeer clans have sent guides who know the ice better than anyone."
 zin_deep.255.desc1:0 "The reindeer clans keep their places to themselves."
 zin_deep.255.t:0 "The Reindeer Clans Answer"
 zin_deep.256.a:0 "Sing it back to them."
 zin_deep.256.b:0 "Northern timber is no concern of ours."
 zin_deep.256.desc:0 "[FROM.GetName] has carried a find from the ice over the neck to our clans: a beam carved with a sun over a field. Our singers say it is the picture in the oldest songs."
 zin_deep.256.t:0 "A Find from the North"
 zin_deep.257.a:0 "Very well."
 zin_deep.257.desc:0 "The clans of the West have sung us their oldest song, of a land of sun and fields in the north that their people left long before Aen."
 zin_deep.257.desc1:0 "The clans of the West have sent the find back."
 zin_deep.257.t:0 "Gunwyn Answers"
 zin_deep.258.a:0 "Read them the words."
 zin_deep.258.b:0 "Old bronze is no concern of ours."
 zin_deep.258.desc:0 "[FROM.GetName] has carried a bronze prow from the ice to our chart-house. Our oldest sea-words are cut into its rim."
 zin_deep.258.t:0 "A Find for the Isles"
 zin_deep.259.a:0 "Very well."
 zin_deep.259.desc:0 "The chart-masters of Adel have read us the sea-words on the prow, and they are their own, older than any chart."
 zin_deep.259.desc1:0 "The chart-masters of Adel have sent the prow back."
 zin_deep.259.t:0 "Adel Answers"
 zin_deep.26.a:0 "We will not ask again soon."
 zin_deep.26.desc:0 "The keepers accepted the stone and did not speak. One of them said, slowly, that the land was asked for too much, and that nobody would hear more than that from them for a long time."
 zin_deep.26.t:0 "The Cairn-Keepers Will Not Answer"
 zin_deep.260.a:0 "Then we are kin."
 zin_deep.260.desc:0 "Our fire-keepers call the land under the ice Heulfaenn; the clans of the West sing of Faenn-Cheulu; the chart-islanders write Heulofaennos. The scholars have laid the three names side by side, and they are one name for one land: Heulufaenn, the Sunfields."
 zin_deep.260.t:0 "Three Names, One Land"
 zin_deep.261.a:0 "Kin, then."
 zin_deep.261.desc:0 "[FROM.GetName] says that our name for the land of the old songs, and its own, and a third people's, are one name: Heulfaenn, Faenn-Cheulu, Heulofaennos. We are kin, by the north we all came from."
 zin_deep.261.t:0 "Kin of the Old North"
 zin_deep.262.a:0 "Carry the hearth-stone home."
 zin_deep.262.desc:0 "Deep in the Frozen Lands our walkers have found the hall itself: a timber hall under the ice, a throne-step, and a hearth-stone worn hollow by fires lit from it for a thousand winters. The fire-keepers say every house-fire of the north was once lit from this stone."
 zin_deep.262.t:0 "The King's Hall"
 zin_deep.263.a:0 "Never."
 zin_deep.263.desc:0 "[FROM.GetName] has taken a crown over the old north and calls our steadings to kneel to it. Our steadings never knelt to any crown."
 zin_deep.263.t:0 "The Sun Crown Calls"
 zin_deep.264.a:0 "Sun over the ice."
 zin_deep.264.desc:0 "A crown over the ice has taken the name of the fields that lay under it: Heulfaenn, the Sunfields, lit from the hearth-stone of the king's hall."
 zin_deep.264.t:0 "The Sun Crown"
 zin_deep.265.a:0 "So it stands."
 zin_deep.265.desc:0 "The state where the hearth-stone is kept has changed hands, and the stone with it."
 zin_deep.265.t:0 "The Hearth-Stone Taken"
 zin_deep.27.a:0 "Share the Tide with them."
 zin_deep.27.b:0 "The Tide is for our own divers."
 zin_deep.27.desc:0 "Envoys of [FROM.GetName] ask the queens of the isle houses which tides open the chambers under Borrak, and when the reef off the isle breaks the water."
 zin_deep.27.t:0 "The Isle Houses Are Asked"
 zin_deep.28.a:0 "We will tell them."
 zin_deep.28.desc:0 "The queens of the isle houses have told us which tides open the chambers, and on which mornings of the great tides the reef breaks the water. They ask only that we do not dive without telling them."
 zin_deep.28.t:0 "The Queens Answer"
 zin_deep.29.a:0 "Courteous and immovable."
 zin_deep.29.desc:0 "The queens were courteous, as they always are, and told us nothing at all."
 zin_deep.29.t:0 "The Queens Will Not Answer"
 zin_deep.30.a:0 "Chart the low fields."
 zin_deep.30.desc:0 "Our scholars have laid the count of the cords beside the count of the cairn, and the two agree to the year. The low fields under the sea had a name, Muzerar, and a night when the last dikes broke: the Eldest Cairn has a stone for every year since, [?global.zin_deep_cairn_stones|0] of them. The scholars have marked where the dikes stood, and they do not much like what they have found."
 zin_deep.30.t:0 "The Two Counts"
 zin_deep.31.a:0 "What is counted is counted."
 zin_deep.31.desc:0 "[FROM.GetName] has laid our count beside another and found that the two agree. Our keepers say this was always going to happen one day, and that they would rather it had not been in their time."
 zin_deep.31.t:0 "The Counts Brought Together"
 zin_deep.32.a:0 "Give them the dike-stones."
 zin_deep.32.b:0 "Not yet."
 zin_deep.32.desc:0 "[FROM.GetName] has kept the Cairn-Oath for five years: no army of theirs has entered the ring. The keepers ask whether to give them stones from the line of the old dikes, and the craft of laying them."
 zin_deep.32.t:0 "The Oath Kept"
 zin_deep.33.a:0 "Build with them."
 zin_deep.33.desc:0 "The giants have carried stones from the line of the old sea-dikes to our shore and shown our masons how they were laid. The stones are older than any wall of ours."
 zin_deep.33.t:0 "The Dike-Stones"
 zin_deep.34.a:0 "So be it."
 zin_deep.34.desc:0 "Our armies have entered the ring, and the giants count the oath broken. Their keepers will not speak to us again."
 zin_deep.34.t:0 "The Cairn-Oath Broken"
 zin_deep.35.a:0 "Bring it ashore."
 zin_deep.35.desc:0 "The divers came up at the turn of the tide with ropes round a stone the size of a man, cut on every face with twisted cords. It came from the top of the drowned mound, and under it, the divers say, was a floor."
 zin_deep.35.t:0 "The Mothers' Stone"
 zin_deep.36.a:0 "At the next great tide."
 zin_deep.36.desc:0 "The divers found a door at the foot of the mound, half buried in the silt and too heavy to move before the tide turned. They will go down again at the next great tide."
 zin_deep.36.t:0 "The Hall-Door"
 zin_deep.37.a:0 "Remember their names."
 zin_deep.37.desc:0 "A storm came in over the Mound while the divers were down. Some boats came back; most of the divers did not."
 zin_deep.37.t:0 "The Divers Do Not Come Up"
 zin_deep.38.a:0 "Give them to the tide."
 zin_deep.38.desc:0 "The isle houses have gathered in the tide-chamber at Borrak to give the lost divers to the tide, as the dead of the isle are always given. The queens say nothing of who sent them down."
 zin_deep.38.t:0 "Mourning at Borrak"
 zin_deep.39.a:0 "Divers are not our business."
 zin_deep.39.desc:0 "Fishers report boats anchored over the reef west of Aenor Isle at the lowest tides, and divers going down where nobody has gone before."
 zin_deep.39.t:0 "Divers at the Mound"
 zin_deep.40.a:0 "The crown of Aenor."
 zin_deep.40.b:0 "The Orran houses."
 zin_deep.40.desc:0 "The queens have met in the tide-chamber at the turn of the tide, as they met to choose their first queen. They must decide who else will learn the Tide: the crown of Aenor, which has always confirmed their seats, or the Orran houses of the downs and the forest, whose customs are strangely like their own."
 zin_deep.40.t:0 "The Queens' Rite"
 zin_deep.41.a:0 "We will tell them."
 zin_deep.41.desc:0 "The queens of the isle houses have sent word: which tides open the chambers under Borrak, and on which mornings the reef breaks the water. They ask that we never dive without telling them."
 zin_deep.41.t:0 "The Tide Given"
 zin_deep.42.a:0 "Sit in the moot."
 zin_deep.42.b:0 "We keep our own mothers."
 zin_deep.42.desc:0 "[FROM.GetName] asks our cord-mothers to sit with theirs in one moot under the Last Cord, and to let the eldest cord-mother of every clan rule both peoples. The mothers say that is how it was in Muzerar, before the sea came."
 zin_deep.42.t:0 "The Moot of Mothers"
 zin_deep.43.a:0 "The cords are kept."
 zin_deep.43.desc:0 "The eldest cord-mother of every clan has taken her seat under the Last Cord, and the moot has a name again: Muzerar, the Low Country, though most of its land lies under the sea."
 zin_deep.43.t:0 "The Moot Sits"
 zin_deep.44.a:0 "The Vale is the crown's."
 zin_deep.44.desc:0 "The Redbark have begun to call the rivers and towns of the eastern Vale by their old Orran names, and their mothers say the names were theirs before they were ours. They mean it as a claim."
 zin_deep.44.t:0 "The River Names"
 zin_deep.45.a:0 "Get the rest ashore."
 zin_deep.45.desc:0 "The first sailing made for Aenor Isle over shoals our pilots did not know, and a share of the host ran aground on the banks. The defenders knew exactly where the old fields lay under the water."
 zin_deep.45.t:0 "Aground on the Low Fields"
 zin_deep.50.a:0 "Let the scribes keep digging."
 zin_deep.50.desc:0 "The scribes have read the oldest marks in the vaults of the first stair, and the stair is older than the crown. The marks name a kingdom on both shores, Tarkia, and a road that ran over land that is now sea."
 zin_deep.50.t:0 "The First Stair"
 zin_deep.51.a:0 "Give them leave, and take their gold."
 zin_deep.51.b:0 "No digging on our shore."
 zin_deep.51.desc:0 "[FROM.GetName] asks leave to dig among the caps of the shore, where the ferrymen say a drowned road comes up out of the water."
 zin_deep.51.t:0 "Diggers at the Quays"
 zin_deep.52.a:0 "Very well."
 zin_deep.52.desc:0 "They have given leave: our diggers may work among the pillars, at our own risk."
 zin_deep.52.desc1:0 "They have refused us, politely and with no reason given."
 zin_deep.52.t:0 "An Answer from the Shore"
 zin_deep.53.a:0 "Mark where the causeway runs."
 zin_deep.53.desc:0 "The diggers have cleared fallen pillars, a quay and the footings of a causeway that runs straight into the narrows. Half a city lies under the caps of the shore."
 zin_deep.53.t:0 "Stones Under the Caps"
 zin_deep.54.a:0 "Begin again."
 zin_deep.54.desc:0 "The caps of the shore bloomed in the heat, and the diggers sickened by the hundred. The work must begin again."
 zin_deep.54.t:0 "The Spore Summer"
 zin_deep.55.a:0 "Close the fair, for a price."
 zin_deep.55.b:0 "The fair stays open."
 zin_deep.55.desc:0 "[FROM.GetName] asks our horse-traders to close the fair for a season so that diggers can clear the pillars it is held among."
 zin_deep.55.t:0 "The Horse-Traders Are Asked"
 zin_deep.57.a:0 "The two halves match."
 zin_deep.57.desc:0 "Under the grass of the horse-fair the diggers have found the eastern half of a city: the same pillars, the same quays, and a causeway that runs west into the narrows."
 zin_deep.57.t:0 "The Pillars of the Fair"
 zin_deep.58.a:0 "Set them on the stair."
 zin_deep.58.desc:0 "Stones from both halves of the broken city have been carried to the first stair. The scribes say Tarkia had two gates and one road, and the court has begun to listen to them."
 zin_deep.58.t:0 "The Gate-Stones"
 zin_deep.59.a:0 "Open the road."
 zin_deep.59.desc:0 "Quays and causeway footings stand on both shores of the narrows, a road runs to each gate, and harbours wait at both ends. Ferries cross where the road once ran."
 zin_deep.59.t:0 "The Bridge Road"
 zin_deep.60.a:0 "Open the treaty to them."
 zin_deep.60.b:0 "The treaty stays in the Archive."
 zin_deep.60.desc:0 "[FROM.GetName] asks the Archive for the treaty of passage that the road once crossed our shore under. The loremasters have the treaty, and they remember why it was made."
 zin_deep.60.t:0 "The Archive Is Asked"
 zin_deep.61.a:0 "Very well."
 zin_deep.61.desc:0 "The loremasters have read the treaty to our envoys and made them swear its peace: no army of ours crosses the narrows into elven land while the oath holds."
 zin_deep.61.desc1:0 "The loremasters were courteous and promised nothing."
 zin_deep.61.t:0 "The Archive's Answer"
 zin_deep.62.a:0 "It was only an old roll."
 zin_deep.62.desc:0 "We went to war on the elven shore, and the Archive counts the treaty of passage broken. The elves of the rift will not forget it."
 zin_deep.62.t:0 "The Peace of Passage Broken"
 zin_deep.63.a:0 "So be it."
 zin_deep.63.desc:0 "The eastern coalition has crossed the narrows with Alerhia in its ranks. The Archive has closed the treaty of passage, and the loremasters say it will not be opened again in our time."
 zin_deep.63.t:0 "The Archive Closes"
 zin_deep.64.a:0 "Two shores, one crown."
 zin_deep.64.desc:0 "The stair, the gates, the road and the treaty answer to one crown, and the scribes have written out in full the name they have always kept: Tarkia, the Bridge Kingdom."
 zin_deep.64.t:0 "The Bridge Kingdom"
