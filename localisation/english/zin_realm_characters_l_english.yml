 zin_lorien:0 "King Lorien"
 zin_lorien_desc:0 "Lorien has held the crown of Gala for as long as he has willed it, and no other king of Gala is named in any record men have seen. He led the Gala in King Edran's Grand Alliance, remembers the War of Men, Dardan, the fall of Aenor and the Necromancer's reign, and speaks of Dardan as if it were last year. He advised Edran against the Ember Lands campaign, buried his dead in the Garden of the Dead at Sodoli when the advice was not taken, and has been courteous to Aenor and distrustful of kings who turn victories into crowns ever since."
