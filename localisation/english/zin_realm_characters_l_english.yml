 zin_volgan:0 "Volgan"
 zin_volgan_desc:0 "Volgan, the principal dark lord of Aoaz, rules the Ember Lands from Nafeher through his captains, the necromantic orders and the realms sworn to him. At Dardan the spirits stripped him of his strength and threw him into the Void, the Great Necromancer brought him back, and through the long Third Age he was too weak to leave his own lands. Mirolon's songs give him a crown, a purple cloak, eyes that burn green and a wizard's green fire, and Mirolon's scouts are the only people in the north who believe he is mustering again."
