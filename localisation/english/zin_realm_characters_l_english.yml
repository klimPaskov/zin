 zin_zol_will:0 "The Will of Zol"
 zin_zol_will_desc:0 "The charts and the courts name the master of the black north only as the Will of Zol, because Zol, the Old God of Death, has no body to sit on a throne, and nobody living has seen who keeps his seat at Furviatlon. The Northern Wastes and the black islands of the Kusmeel are silent and sparsely peopled, and the fishers who winter on the outer isles never go near the seat. Nobody knows why the land is called a Mistake, and the fishermen who might guess do not care to."
