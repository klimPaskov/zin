 zin_adv_tally_keeper:0 "Keeper of the Wave-Tally"
 zin_adv_warden_of_beacons:0 "Warden of the Beacons"
 zin_adv_weather_reader:0 "Reader of Weather"
 zin_aenor_corwen:0 "Marshal Corwen Hornan"
 zin_aenor_ederine:0 "Ederine Kordalis, Warden of the Lantern Roll"
 zin_aenor_edwen:0 "Captain Edwen Kormon of the Gilded Lances"
 zin_aenor_forest_durvom:0 "Durvom the Wall of Needles"
 zin_aenor_forest_edrisa:0 "Ranger Edrisa Vothsen"
 zin_aenor_forest_hulmev:0 "Hulmev of the Burnt Edge"
 zin_aenor_forest_morvar:0 "Morvar of the Deep Dark"
 zin_aenor_forest_nualma:0 "Nualma of the Fallen Stand"
 zin_aenor_gardec:0 "Gardec Hifar, Marshal of the Parades"
 zin_aenor_halmor:0 "Lord Treasurer Halmor Monaris"
 zin_aenor_isra:0 "Admiral Isra Leimon"
 zin_aenor_norael:0 "Norael of the Lamp"
 zin_aenor_sefan:0 "Sefan Daldar, Warden of the Rolls"
 zin_alleria:0 "Alleria of Selen"
 zin_aurevan:0 "Aurevan the Deliverer"
 zin_aurevan_desc:0 "The faithful of every land hold Aurevan the Deliverer to be the New God who ended the Great Necromancer's reign and has kept the peace of the Fourth Age ever since. He is seldom seen, and in the three Zilin valleys his High Confessor keeps the hostels, the couriers and the confessors in his name. The temples have never been fuller, and the abbots say that is only what a grateful age owes him."
 zin_austklev_essra:0 "Essra of the Harbour Fire"
 zin_austklev_grinvald:0 "Grinvald Kolair, Keeper of the Whale-Tithe"
 zin_austklev_sigra:0 "Sigra Ezhair, Heir of the Harbour Hall"
 zin_austklev_sigra_desc:0 "The jarl's daughter brought her own crew home through the Siroler ice last season, which settled the succession as far as the harbour is concerned."
 zin_austklev_ulvim:0 "Ulvim Brannair, Warden of the Harbour Boom"
 zin_austklev_vaesor:0 "Vaesor of the Pines"
 zin_austklev_zorvia:0 "Zorvia Ezhair, Captain of the Whaling Fleet"
 zin_azano_galleys:0 "Lavia of the Market Quay"
 zin_azano_guard:0 "Captain Arcanio Fulio of the House Guard"
 zin_azano_knives:0 "Crovio the Quiet"
 zin_azano_ledger:0 "Posano Prudia, Keeper of the Ledgers"
 zin_azano_myleo:0 "Myleo Azano"
 zin_azano_myleo_desc:0 "Mylana's younger brother, who keeps the house's second ledger and would head the house if she fell."
 zin_azano_silk:0 "Travia Azanon, Mistress of the Silk"
 zin_bastian:0 "Bastian"
 zin_belonton_accord:0 "Ruzha the Bar-Keeper"
 zin_belonton_fleet:0 "Ugruk Wave-Splitter, Captain of the Raiders"
 zin_belonton_gull:0 "Bolrak of the Gull Cliffs"
