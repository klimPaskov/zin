l_english:
 ADE_zin_ruler:0 "Speaker Tinaios Andaios"
 ADE_zin_ruler_desc:0 "The chart-houses of Adel elected Tinaios Speaker of the Chart Hall in 4A 1740, the latest of the many Speakers the Andaios house has given, and the house still reminds the island that Senra of the Grand Alliance's fleets was one of its own. He decides which crown gets the newest chart, and in a world at peace he sells to the highest bidder. He was a master-pilot before he was a Speaker, and he still corrects the copyists' soundings himself."
 AEN_zin_ruler:0 "The Golden King"
 AEN_zin_ruler_desc:0 "The ninth king of the House of Hornan was crowned in 4A 1729, and in nineteen years he has sold more offices than his eight forebears granted between them. He spends the treasury on the gilded halls of the Golden Court and leads the Lost Cause through Parim in parades, while the Royal Council and the Houses of the First Light keep the granaries full and the roads open. He has no son, and the Golden Court has already settled on Prince Eronel to follow him."
 ALR_zin_ruler:0 "King Kerseus Furanides"
 ALR_zin_ruler_desc:0 "Kerseus Furanides was crowned standing in the Rising twelve floods ago, as every Furanid king has been, and every proclamation calls him Alerh after the river. He rules the great river valley on the rift from the stair-city of Porrenva, an old crown rich in grain and scribes, neutral between Noris and Stabilo, and he looks across the Rift Narrows at the elven shore his kings have traded with for three ages. His scribe-council distrusts the caravan princes and borrows from them all the same."
 ANE_zin_ruler:0 "Speaker Nymeth of the Water-Court"
 ANE_zin_ruler_desc:0 "Nymeth was chosen by the groves to sit over the Water-Court and speak for the federation abroad, and for the length of her office she bears the name of the largest lake, as every Speaker has. Her boats carry the letters between Sonargur and the elven realms, and she granted the Leren ships harbour on the Andos Water while declining the Leren Compact itself, because the groves will not bind themselves to a crown of men. She keeps the quarrel over the Boundary Groves as her predecessors did, politely and without end."
 ANR_zin_ruler:0 "Goarvom, Eldest of Graulvoa"
 ANR_zin_ruler_desc:0 "Men call the present Eldest Goarvom, which is as near as a ranger's tongue can come to what the Baelim call it. It speaks for the oldest stand, Graulvoa, in a moot that nobody outside the forest has ever heard end. The rangers of Selen leave water at the forest's edge in dry summers, and the woodcutters the Order once sent in for timber never came out, so that nobody has asked for timber since."
 AUT_zin_ruler:0 "Jarl Stenvar Ezhair"
 AUT_zin_ruler_desc:0 "Stenvar captained a whaling crew in the Siroler ice before he was twenty and took the harbour hall in 4A 1730, when his father, who had walked home over the ice in the spring after the Ice-Lock, died in his bed. He sells whale-fat and spear-whale tusk south and west, keeps out of the Cold Rivalry and still fills the winter store his father set up. He watches the ice the way other lords watch their neighbours."
 AZA_zin_ruler:0 "Mylana Azano, Head of the House"
 AZA_zin_ruler_desc:0 "Mylana Azano has headed the house that owns Ceralon since her father's death in 4A 1739, and as head of the house she is the city's lord by charter. Her ledgers record loans to half the courts of the East, her bench-cousins in Postondoroth resent her freedom, and her bronze-roofed house over the market was built with the winnings of her father's silk wager. She keeps the city independent by charter rather than by arms, and she would rather lend to an army than raise one."
 BEN_zin_ruler:0 "Captain Urion the Quiet"
 BEN_zin_ruler_desc:0 "The corsairs who pay the haven's dues chose Urion as captain of Torni in 4A 1736, and he keeps the haven's peace and the Ransom Tide law as every captain since Urai the Lame. He takes the chart-houses' tribute to keep his corsairs off Charter ships and raids anyway whenever the tribute is late, and he keeps well away from the Cursed Square, as Benan's corsairs have done since the royal Aenoran ship was lost there. He is a soft-spoken man in a loud trade."
 BLD_zin_ruler:0 "Captain-General Tarnic of the Grey Banner"
 BLD_zin_ruler_desc:0 "The company-lords elected Tarnic Captain-General at Toples in 4A 1741, after his Grey Banner had taken contracts from Gunwyn and Girdon in the same war and met itself in the field twice without losing its banner. He governs by the contract-book and nothing else, hires out the companies and their powder-men to the highest bidder and knows the price of every banner in the West, as do Aenor's envoys. He is a cheerful, unsentimental man who says the only bad war is one nobody pays for."
 BLK_zin_ruler:0 "Moot-Speaker Bruna Gorvik"
 BLK_zin_ruler_desc:0 "The town moot at Dontadur chose Bruna as moot-speaker for the year of 4A 1748; she is a Dondric burgher's daughter married into a Leren shipping house, which is the five towns in one person. She sells Dondor's iron to the North, keeps the league out of the Accord's wars where she can and has to sit through the charter quarrel at every meeting, since the moot refused a lord's charter in 4A 1688 by a single voice and has argued about it ever since."
 BLN_zin_ruler:0 "Sea-Chief Rukhag of the Ghashak"
 BLN_zin_ruler_desc:0 "Rukhag of the Ghashak won the Sea-Chief's chair at Notle by bringing home a Leren ship whole, crew and cargo and all, which no sea orc had done in a generation. He keeps the Dark Sea Accord that his forebears swore with Dondor on an iron bar and a skull, takes the Salt Tithe and raids only those whom the Accord does not protect. He remembers that Lerendor's fleet burned Notle in 4A 1532 and that the sea orcs have respected Leren sails since, and he is happy to let the High Crown think it is respect."
 BLO_zin_ruler:0 "Tzorek, son of Amaz"
 BLO_zin_ruler_desc:0 "The cord-mothers chose Tzorek, son of Amaz, as the moot's war-chief for a feud with the Selen edge that has now run three summers, and they will unmake him when it ends. He is young, painted and impatient, and he raids the glade villages when he needs a name, since a war-chief without a name is soon a hunter again. The red oaks of the moot-clearing hold the names of the clans' dead in their cords, and he swears by them that he will be remembered."
 BOR_zin_ruler:0 "Chief Gruzash"
 BOR_zin_ruler_desc:0 "Gruzash holds the iron and the ring at Zubudor, the third of his line to hold the hold through three challenges running. Bordon lives by the Black Road and its caravan inns, and Gruzash takes Volgan's gifts and Goldoroth's threats with the same grin and gives neither an answer. He knows exactly where the Troll Forest begins and pays the troll silver on time."
 BRR_zin_ruler:0 "King Dwibrik of Glimzig"
 BRR_zin_ruler_desc:0 "Dwibrik was only a hobgoblin once, like any other, but he ate well and grew, and he has held the lamp in the throne-cave longer than any king the warrens can name. He keeps the Lamp Truce with the dwarves and the Klungori Guard because the dwarves are bad neighbours to annoy, and he sells the under-roads through the range more quietly since the smugglers' guild went missing. Goblins who say he is only big, and not wise, are welcome to say it to him."
 BRT_zin_ruler:0 "Iron-Chief Karguk of the Brakgul"
 BRT_zin_ruler_desc:0 "Karguk of the Brakgul holds the iron and the ring at Fontadon, and he mines the iron hills of the south-east coast and sells their iron by sea so that it need never pass through Goldoroth's lands. He sits at the Free Moot of Dulundur, as the Brakgul have done since 4A 1520, and watches Goldoroth's border in the knowledge that the warkingdom wants his coast under the Yoke more than any other."
 BRU_zin_ruler:0 "Lord Hrokorn Durnast"
 BRU_zin_ruler_desc:0 "Hrokorn of the Durnast line rules Brundahrim from the fire-hold of Hrennost, where his forebears' smiths first made the West's burning powder, and he receives no man below the Outer Gate. He sells iron, gold and powder-pieces to whoever wins his favour, keeps the small folk's high passes shut under the Ronbo Oath and is particularly unfriendly to elves. The western courts know that his favour is the price of fire in any war they fight, and he knows that they know it."
 BUN_zin_ruler:0 "Big Snik Skritix"
 BUN_zin_ruler_desc:0 "Skritix is the loudest and cleverest boss the warrens of Burnikzig will follow, and so he is Big Snik, and he owes nothing to any hobgoblin king. His goblins make the best burning powder in the Dark Lands from the volcano's yellow crusts and the saltpetre of their caves, and he sells it to whoever pays most, which in 4A 1748 is usually Goldoroth. He sold to Dondor once in the same year as to Cocanoor and charged Dondor more, and he still tells the story."
 CLD_zin_ruler:0 "Queen Lunvaera"
 CLD_zin_ruler_desc:0 "Lunvaera, eleventh of the Vording line, was crowned in the Frost-Hall in 4A 1729, and her reign is still measured by the White Year two winters later, when she opened the crown granaries to Pertolor, Omar and Xison as well as to her own clans. She reads a grain-roll better than a war-map and keeps the March Forts manned without ever sending a rider across the Fandan. The clans call her the Bread-Queen, and she lets them."
 CRG_zin_ruler:0 "Consul Sarieth of the House of Gwennow"
 CRG_zin_ruler_desc:0 "The great houses of Oslodon chose Sarieth as one of the year's two consuls in 4A 1748, the second time her house has given a consul in ten years, so that it must give no more for a decade. She fears the corsairs of Santon, trades with Aenor and resents its tariffs, and she has not forgotten that the consuls paid a son's weight in silver to Straton in 4A 1701 and swore to burn it again one day. She would rather sail to Aenor's relief than to its capture, and says so in council."
 CUR_zin_ruler:0 "Izkala, Mother of the Eldest Cord"
 CUR_zin_ruler_desc:0 "Izkala, daughter of Pelzen, keeps the eldest cord of the Veiled, on which the years are counted by their knots, and she speaks for the council of cord-mothers to anyone who comes to the edge of the grey downs. Her people grow roots and mushrooms in the sour ground the Black Roots left, refuse every crown as their mothers did, and turned back the last Concord host with poisoned wells and empty villages. She sends envoys home fed, lodged and with their letters unopened."
 DAK_zin_ruler:0 "Chief Zugmok"
 DAK_zin_ruler_desc:0 "Zugmok speaks for the four forest holds at the moot of Notdertu, where orc chiefs and ogre clan-heads sit together and nothing is decided until both agree. He keeps the hunting agreement with Dondor and the meat-peace with the ogres that Grimduth made in the hard winter of 4A 1222, and he gives the giants' cairn-line a wide berth since the holds learned in 4A 1483 what happens otherwise."
 DLB_zin_ruler:0 "King Esiuran Fosocides"
 DLB_zin_ruler_desc:0 "Esiuran Fosocides rules the Delbiz Grasslands and the Fosoco from the fair town of Furtonlin, of the line that married the heiress of the Fosoco lordship and took the river's name. The herds have recovered since the Great Murrain killed two in three of them, and the horse-fair is again the richest in the East. The old quarrel with Alerhia sleeps under a marriage treaty, and the caravan houses that lent after the Murrain expect to be repaid in horses, which he pays them slowly and in the poorer ones."
 DLN_zin_ruler:0 "Queen Zhorith of Dolon"
 DLN_zin_ruler_desc:0 "Zhorith keeps the forge of the Southern Dominion at Unzeky, where the forges compound black powder from the coast's salts and the Maw's sulphur and arm Volgan's orc companies with powder-engines and casks. Her tribute galleys carry salt, sulphur and ash-glass along the Veshir coast to Nafeher, and the orders pay her in thralls. Like every queen of her house she writes her laws in salt, so that the sea can wash away any oath she comes to regret."
 DND_zin_ruler:0 "King Dunmar"
 DND_zin_ruler_desc:0 "The clan-moot chose Dunmar of the Gulung as Brute-King in 4A 1735, because the Gulung were the strongest line of the moment and Dunmar was the strongest of the Gulung. He leads the Dark Sea Accord with the sea orcs of Belonton, keeps the beacon towers manned on every hill of the plain and a few dear powder-pieces in them, and needs the free holds' iron more than he likes to admit. The spears of the men who closed the Burning Gate hang in his hall, and he swears by them."
 DNL_zin_ruler:0 "Velaeth, Eldest of Thamiel"
 DNL_zin_ruler_desc:0 "Velaeth speaks for the one elven household that would not go home over the range when the queen of Herrodon called her kin east after the Ember Lands. Her people guide travellers on the road to the Kingson Pass for salt and silver, as they guided the fugitives of the resistance over the Lunhrim Notch under the Order. When Herrodon's envoys came to ask the household home a second time, she fed them, showed them the graves and sent them back with gifts and no answer."
 DOB_zin_ruler:0 "Warden Hemmia Stubbel"
 DOB_zin_ruler_desc:0 "The moot of householders at Luddum chose Hemmia as Warden of the Fields, the latest of the many Wardens the Stubbel household has given the basin, and she will keep the hall for as long as the harvest stays good. Her chief worry is the weather, her second the price of hearth-leaf at the dwarves' high passes, and she has never in her life been further from home than the Ronbo Watch's gate. She sends the Watch its grain and leaf on time and asks after every man in it by name."
 DOL_zin_ruler:0 "Judge Maelvi of the Hold"
 DOL_zin_ruler_desc:0 "The judges of the five lake towns chose Maelvi, the Hold's judge, to preside over the lake-court at Parur for the year of 4A 1748, as the Hold's judge is chosen more often than any other. She is proud of the Judgement of the Mills, which two hill crowns obeyed, and she would dearly like the toll quarrel between Sonargur and Parim to come to her court rather than to the counting houses of Eekedor."
 DRA_zin_ruler:0 "Forge-Prince Telino Barzio"
 DRA_zin_ruler_desc:0 "Telino Barzio, great-grandson of the Nelia Fundo who sealed the Stabilo Pact, rules the Drak Mountains from Castronuro with a council of forge-masters. His forges sell powder-engines and casks to the Stabilo Pact and to any caravan city that can pay, and they guard the recipe that the East learned in the Furnace Year more closely than his treasury. When the Drak Furnace buried the lower forge-town in ash he rebuilt Castronuro higher on the ridge, behind walls that face the mountain as well as the road."
 DRE_zin_ruler:0 "Chief Mudgash"
 DRE_zin_ruler_desc:0 "The reed-council of Dolido chose Mudgash to keep the iron and the ring in 4A 1733, and it can unmake him as easily as it made him, which he does not forget. His folk live on eels, peat and bog-iron in the fens that the Necromancer's garrisons could never cross, and the Goldoroth host that the reed-council's guides led into the deep fens in 4A 1561 is remembered in Dolido with quiet satisfaction. He belongs to nobody and means to keep it so."
 DRK_zin_ruler:0 "Gate-Chief Ghorlak"
 DRK_zin_ruler_desc:0 "Ghorlak broke the last gate-chief in the ring at Doldes in 4A 1742, and the Warking confirmed him as the Iron Yoke requires. He tolls every caravan that passes the gate-fort at the foot of the Goldoroth Mountains and pays Cocanoor its iron from the toll, and he tolled the Southern Dominion's envoys like any other caravan, which they found less amusing than he did."
 DUL_zin_ruler:0 "Chief Ghorzug"
 DUL_zin_ruler_desc:0 "Ghorzug keeps the first of the Four Fires of Lesderle, and the hall chose him in 4A 1740 to speak for the long valley at the Free Moot. Dulundur hosts the moot of the free holds against the Iron Yoke and is their strongest voice, and when Goldoroth offered a place under the Yoke to one valley in 4A 1612 the hall put out that valley's envoy instead of its fire. Ghorzug tells that story to every envoy from Cocanoor, smiling."
 DUN_zin_ruler:0 "Toll-Queen Zuraka of the Zhaggul"
 DUN_zin_ruler_desc:0 "Zuraka won the ring at Dobudo in 4A 1738, as the crown of the Zhaggul goes to the son or daughter who wins it, and she lives as her forebears did on the tolls of the Dun Sea. She sells her favour by the season and has married into two holds already, so that the least trusted crown of the Dark Lands now has cousins in most of them. Her grandmother took Goldoroth's gold to close the Dun Sea to Dondor and Dondor's to open it again inside one year, and Zuraka regards that as the family's finest hour."
 EEK_zin_ruler:0 "Speaker Pertav Perhkov"
 EEK_zin_ruler_desc:0 "The council of counting houses chose Pertav for five years in 4A 1745, the ninth Speaker the Perhkov house has given it. He keeps the Leren Compact with the High Crown because the High Crown owes the counting houses more than any other debtor, and he holds the Arbitration Court open to any crown that pays its fee. He would very much like to judge the toll quarrel between Sonargur and Parim, and has said so to both."
 ELD_zin_ruler:0 "Archivist Lyreth"
 ELD_zin_ruler_desc:0 "Lyreth was chosen Archivist by the loremasters of Lenkei and keeps the keys of the Archive, and with them the right to refuse any reader, king or elf. The first book of the Archive, the names of the elves who fell against Volgan, lies at the end of the old roads where every traveller must pass it. She keeps the unfinished book too, the one whose writer stopped in the middle of a sentence, and she will not say who stopped or why. Lately her loremasters have begun copying the oldest books, in case they must be carried away."
 ELV_zin_ruler:0 "Speaker Talayi of Googavis"
 ELV_zin_ruler_desc:0 "Talayi was chosen Speaker by the sanctuary of Googavis and has argued Elvana's cause at the Noon Council longer than anyone there can remember. She leads the Cape of Elvana and the Elvini shore, a small, gentle house of weavers and healers. Her only quarrel in the world is with Igara over the sun-cranes of the Sun Lake Shallows, fought with songs, weavings and petitions, and she would not give it up for anything."
 ENH_zin_ruler:0 "Priest-Elder Taoyan nau Suyowan"
 ENH_zin_ruler_desc:0 "The tally-keepers chose Taoyan nau Suyowan as Priest-Elder of the shrine beneath the tide, and he reads the tally at every Calling of Names, as the Priest-Elders have done since Nuoyo swam down to the drowned shrine after the Rising Tide. He holds the lagoon, the Wide Mountains, the Enhis Forest, the salt coast of Angsun and the smoking islet of Lua, and nobody on the Great Isle has doubted the Priest-Elders since the smoke of the Year of Ash stopped when they read the tally at its foot. The shrine still repeats a name the islanders read as Aen, and Taoyan reads it with the others without knowing why it is there."
 ERC_zin_ruler:0 "King Keroth Rhanides"
 ERC_zin_ruler_desc:0 "Keroth Rhanides swore at his crowning nine floods ago, as every Rhanid king has sworn, to pay what the mountain asks and to keep the seven forts. He holds the southern mountains, the river and the dry Kalioth upland from Atonto, and his mines are rich and his forts manned with miners who are also soldiers. Every spring he pays the fire-tithe to the mountain, which his people call a tax and his priests an offering, and he has never once been late."
 FEA_zin_ruler:0 "First Lord Ulvald Azening"
 FEA_zin_ruler_desc:0 "The steading lords chose Ulvald in 4A 1744 to speak for them for seven winters, the eleventh first lord the Azening steading has given the hall. He leans neither towards Fandanar nor towards Minnolomak and means to keep it that way, and he has learned that the surest way to stop the hall doing something foolish is to let it argue for a month. The banners of the Melkgard host lost in the whiteout of 4A 1112 hang over his chair, and he points to them whenever an envoy asks for an oath."
 FNG_zin_ruler:0 "Speaker Lemaios Finon"
 FNG_zin_ruler_desc:0 "The master-pilots chose Lemaios Speaker at Kapai in 4A 1738, the most recent of the many Speakers the Finon family has given, and like every Speaker he has piloted a ship through the Poolho ice. He sets one fee for every ship that enters the pilots' waters, keeps the old pilotage compact with Vindael, and remembers that Raerby carried grain north on credit in the kelp famine of 4A 1601, which the pilots worked off for ten years. Any fleet that crosses towards the Cold Lands from the north will need his pilots, and he knows it."
 FOT_zin_ruler:0 "Lord Ragnec Ostvar"
 FOT_zin_ruler_desc:0 "Ragnec Ostvar is Leren in his pride and Aenoran in his speech, like every lord of his house since the sea-captain Ostvar stretched the first toll-chain across the landing at Deoreh. He holds the shortest crossing between the North Lands and Aenor outside the Concord and takes his toll from both crowns. Since the Leren envoys were humiliated at Parim in the timber dispute he has leaned openly to Sonargur, and he has a Leren wife to prove it."
 FRE_zin_ruler:0 "First Spring-Master Lisovan Tarmon"
 FRE_zin_ruler_desc:0 "The lot fell to Lisovan Tarmon last spring, and he holds the leases on three spring-houses and two inns round the warm spring of Hordorton. He is proud of the Golden Charter the town bought in 4A 1731, which emptied three generations of savings, and he is loyal to the Golden Court, because the Golden Court holds his debts. His spring-houses are still the best hospitals of the southern Vale, which is more than can be said for his accounts."
 GHH_zin_ruler:0 "Eldest Nuhiya"
 GHH_zin_ruler_desc:0 "Nuhiya is the Eldest whom the song-cave of Huummal follows, and no man has been received there since the hunters of 4A 1650 followed a herd into the high snows without leave and did not come back. The height clans say their song is older than the shelf's, and Nuhiya sings it as if she means to prove it. She will hear an envoy only if a shelf Eldest vouches for him, and she has heard none in her time."
 GIR_zin_ruler:0 "Warden-Speaker Pernia Lothor"
 GIR_zin_ruler_desc:0 "The ford-wardens chose Pernia, warden of the Lothoro horse valley, as their Warden-Speaker in 4A 1738, and like every warden she bears the name of the water she guards. She led the river-court through the last years of the border war and swore the Truce of the Grey Ford with King Herlic at the stone in 4A 1745. She answers raids with the blood-price more often than in kind, keeps Lothoro's riders sworn and knows that half the wardens think the truce came a generation too late and the other half that it came too soon."
 GLI_zin_ruler:0 "Plickit the Broad"
 GLI_zin_ruler_desc:0 "Plickit is the biggest hobgoblin the warrens of Drikzig could agree on, and he rules this valley and no other, whatever the coast clans say about hobgoblin kings. The warrens obey their cleverest goblins, and Plickit obeys the warrens more often than he admits. He comes down to the snowline fair each Long Light with a string of sleds laden with traps and lamps and a bodyguard on bone-hounds, and goes home richer."
 GNW_zin_ruler:0 "King Herlic"
 GNW_zin_ruler_desc:0 "Herlic of the Rookwyn was acclaimed at the Oath-Ring of Bulligon in 4A 1726 and bound by the Lawspeaker with the oath every king of Gunwyn has sworn since Cadyn, that he rules by the clans' law and not above it. He fought the border wars with Girdon for twenty years and then, in 4A 1745, swore the Truce of the Grey Ford at the stone after a winter of talks at Faennon. The war-thanes say the truce gave away the ford-share, the guild ports make his court rich and resentful at once, and Herlic is tired of both."
 GOF_zin_ruler:0 "The Keepers of the God Forest"
 GOF_zin_ruler_desc:0 "A small household of secluded elves keeps the God Forest, and no ruler of it is named; the Keepers speak to outsiders only through whoever meets them at the wood's edge. They closed the wood to every outsider after Dardan, and when the Noon Council was founded they sent the Radiant Speaker's invitation back tied with a living vine. The Sunhot treat their silence as holy, and the Sunfolk avoid the forest edge after dark."
 GOL_zin_ruler:0 "Warking Gorduth"
 GOL_zin_ruler_desc:0 "The chiefs of the four clan blocs acclaimed Gorduth Warking at the Fire-Mountain in 4A 1739, after he broke the last Warking in the ring at Sungodor and let him live to serve, as the ring allows. He rules some half a million orcs from the forge-city of Cocanoor, takes the Iron Yoke's tribute from the Dark Gate and wants the whole of the Dark Lands, which he has not quite the strength to take. His siege forges cast bombards with powder bought from Burnikit, and the envoys of the Southern Dominion are received at his court and sent home with gifts."
 GOO_zin_ruler:0 "Senan of Elgagen"
 GOO_zin_ruler_desc:0 "Senan is a farmer's son who became spokesman of the guest-towns of Goodin by settling a water quarrel without a single steading leaving the moot. He speaks for the Sunfolk of the western grass, with Goodton and Guuden, and his is the only realm of the Lands of the Sun that raises levies freely, which makes it the strongest arm the Noon Council has. Goodin sits at the council only as a guest, and Senan means to ask for a full seat before he dies; he has not yet decided how."
 GRO_zin_ruler:0 "Lord Stulmar Kunerm"
 GRO_zin_ruler_desc:0 "Stulmar of the Kunerm line rules the old hold of Hrunost from behind the gate-forts above the Kulolo, and he keeps the hold's grudge against the guild towns as carefully as its gold. The looting of 2A 1712 is remembered in Hrunost by the names of the guild masters who paid for it, and Stulmar can recite them all. He sells iron, powder-pieces and siege bombards at the Outer Gate, and no company of armed men may come within a bowshot of it."
 HAL_zin_ruler:0 "Moot-Headman Delen of Bennen"
 HAL_zin_ruler_desc:0 "Delen of Bennen was chosen Moot-Headman by the headmen of the five freeholds at Halon, and he speaks for the salt coast for his three years. The league pays its salt and fish to Nafeher for silence, as the freeholders' grandfathers did, and trades with Mirolon, its cousin, on the other side. He buries the dead quickly and deep with salt, says nothing of the south at the graveside, and does not like the talk in the taverns about the traveller who came this way and did not grow older."
 HEO_zin_ruler:0 "King Ingmund of Nuatax"
 HEO_zin_ruler_desc:0 "The three hill kings chose Ingmund of Nuatax to speak for the hills in 4A 1748, as they choose one of themselves each year at Pand. His valley is the one the dwarves came down to in 3A 1022, and he keeps the Hill Pact with Hrakbrund as a matter of family pride as well as policy. Every crown of the North knows that a war on Heodwa is a war on the dwarves, and Ingmund makes sure that none of them forgets it."
 HER_zin_ruler:0 "Marcher-Lord Heziel"
 HER_zin_ruler_desc:0 "Heziel is of the cousin's line of the House of Hezar, restored at the Charters, and he keeps the old towers of the southern march manned and the garrison drilling on empty roads. When his scouts reported that the herders of the far southern road had left their summer villages a season early, he wrote to Parim, and Parim answered with a receipt. He has kept the receipt, and he is the only lord of the Concord who expects the south to come north again."
 HIR_zin_ruler:0 "High Chief Oronas"
 HIR_zin_ruler_desc:0 "Oronas was chosen High Chief by the cairn-keepers because his clan could name the older cairn, and he has kept the Cairn Treaty with Parim as one sovereign with another ever since. He sells cut stone and the strength of his giants to the quays of Parim, guards the small folk of Tirlan on every path in, and asks only to be left alone. Men who come up the hill to hurry him go down again having learned that the giants have more patience than men have time."
 HLD_zin_ruler:0 "King Torvar Grindair"
 HLD_zin_ruler_desc:0 "Torvar kept the snowline fair for a year as his father's deputy and was crowned at Fentene in 4A 1734, and like every Grindair king he is judged by whether the fair was good. Under him it has been good: the yeti come down each Long Light, the goblins bring their traps and lamp-fat, and the springs quarrel with Glimkit simmers without boiling over. He is a patient bargainer who laughs a great deal and remembers every price."
 HLN_zin_ruler:0 "Wreck-Lord Sonaios of the Mondon"
 HLN_zin_ruler_desc:0 "Sonaios of the Mondon inherited the storm isles in 4A 1736 and swore at the shore, as every wreck-lord must, whether he would light the shore-fires in the gale season or leave them dark; he swore to leave them dark, as his father had. Each gale season brings wrecks ashore, and each season the Lamp-House of the Lens asks him to light his shores and is refused. His grandfather was the wayfinder lord who lit the fires every season of his life, and Sonaios has a portrait of him in the hall, facing the wall."
 HNH_zin_ruler:0 "Horse-Lord Hunald"
 HNH_zin_ruler_desc:0 "The riders have chosen Hunald Horse-Lord by acclaim at eleven midsummer Gatherings running, which the downs consider a very long reign. He runs the largest horse fair in Aoaz, keeps both charter-seats of Hunhun and Noloreh, and is loyal to Parim in the way riders are loyal to the weather, because it is there. He has not forgiven Konori for the Remount Quarrel and never misses a chance to say so."
 HOO_zin_ruler:0 "Cairn-Keeper Dorunas"
 HOO_zin_ruler_desc:0 "The oldest giant of the Giant Forest keeps the line of cairns below the Dark Forests from the cairn-hall by the Giant River, and men call him Dorunas, although no man has ever heard him say his name. The giants never attack first, and whoever crosses the cairn-line or touches a cairn has them as an enemy, as the orcs of the Darks learned in 4A 1483. In the flood of 4A 1700 the giants were seen carrying the folk of the lower Dondor plain out of the water, and then they went back into the forest without a word."
 HOR_zin_ruler:0 "Cairn-Chief Kerald Azling"
 HOR_zin_ruler_desc:0 "The cairn moot of Ollondo chose Kerald in 4A 1736, the eighth of the Azling hearth-line to hold the chair since Bransdok swore the Northern Accord at the Gap. He walked the high cairn road beside the due-collectors as a boy and still knows each cairn by the stones the masons left out. He keeps the Accord faithfully, takes the cairn-due from every western cart and remembers that in the White Year Coldor's bread came up the valley before the snow did."
 HRA_zin_ruler:0 "Lord Hradin Ilmord"
 HRA_zin_ruler_desc:0 "Hradin of the Ilmord line rules the White Hall under the snows of the High Mountains and receives men only at the High Gate. He keeps the Hill Pact with the three hill crowns as his line has kept it since 3A 806, sells iron, gold and bombards to whoever pays and has sold Sonargur's fleets more bombards than it likes to remember owing for. He receives no elf at his gate, and an elven envoy at the court of Sonargur is enough to cool him for a year."
 HRR_zin_ruler:0 "Queen Ornwen of Herrodon"
 HRR_zin_ruler_desc:0 "Ornwen was acclaimed queen in the Hall of Verozo by the hall-keepers of the hill houses and will reign until she lays the hall-key down. She keeps the Boundary Groves feud with Andos Enda alive by ceremony, holds the men of the Teste Vale under her protection, and keeps a seat empty in her hall for the Eldest of the lost household in the west, as her mother did. She has said she would set the Refusal aside if the dragons were ever threatened, and the other houses believe her."
 HWN_zin_ruler:0 "Speaker Wikuana nau Tich"
 HWN_zin_ruler_desc:0 "The terrace-heads at Lamowan chose Wikuana nau Tich as Speaker, and she will hold the office for as long as the terraces of the River Tich stay well watered. She keeps the house for the shipwrecked that Maiyan nau Lamowan proposed after the Fever Years, where every stranger the sea throws ashore is fed, housed and kept apart for a month before he is made welcome. Her divers sell pearls for iron in the markets of Parim, and her terraces feed half the south."
 IGA_zin_ruler:0 "Speaker Ranin of Repgin"
 IGA_zin_ruler_desc:0 "Ranin was chosen Speaker by the sanctuary of Repgin, keeper of the shrine of the shallows, and he answers every petition of Elvana with two of his own. Igara is the smallest sanctuary realm, proud of its shrine and its sun-cranes, and it measures its standing at the Noon Council by how often it can outvote Elvana. The only time the two have ever agreed was when the council judged their weavings equal and both Speakers walked out together."
 IHU_zin_ruler:0 "Speaker Lovin of Hol"
 IHU_zin_ruler_desc:0 "Lovin of Hol was chosen by the island Speakers at Holang to speak for all the Ihuy isles, a council of pearl-farmers, sailors and fishers among the isle Sunhot and the Sunfolk. The council trades pearls, fish and salt with the Islands of the South and the mainland and uses the reef-words of the south for its pilots. Lovin keeps one eye on the smoke of Hol, which the isle folk say smokes harder whenever a ship is lost, and he has seen it smoke very hard this year."
 KAM_zin_ruler:0 "Elder Tikao nau Bukonyo"
 KAM_zin_ruler_desc:0 "The keepers of the tally-caves chose Tikao nau Bukonyo as elder, and he keeps the oldest tally of the south, where the islanders have counted their dead as waves on the cave walls since before any Aenoran sailor saw the arcs. Every island sends its tally-keepers to his caves to learn the oldest names, and he teaches them himself in the deepest cave, which the islanders say is cold because of the names of the Fever Years. He has never let a foreigner read the oldest tally, and has never been asked by one."
 KEA_zin_ruler:0 "Water-Keeper Luanga nau Kea"
 KEA_zin_ruler_desc:0 "The heads of the terrace families of Kea, Agla and the Rice Islands chose Luanga nau Kea as Water-Keeper for this dry season, as they choose one each year, and she shares the water of the cisterns of Tuwang by council rather than by war. The rice of the Rice Islands feeds every island that has a bad harvest, as the council has promised since the Fever Years, and Luanga keeps a store for that purpose that she will not let anyone touch. Her own island paid Agla in rice after the cistern quarrel of 4A 1480, and Agla has never let Kea forget it."
 KER_zin_ruler:0 "King Ormar"
 KER_zin_ruler_desc:0 "Ormar is the heir whose two coronations of 4A 1702 settled the quarrel of the old halls: he was crowned in Keredor at noon, rode through the night over the pass of Belg and was crowned again in Hellekton at dawn. He has held the double crown and the pass between them ever since, kept faith with the Leren Compact that the double crown joined after Nuadoso burned, and never once let either hall feel the lesser. He is old now, and the coast talks quietly of what will happen if his heir is crowned in one hall and not the other."
 KHO_zin_ruler:0 "Lord Morvath of Khorvazel"
 KHO_zin_ruler_desc:0 "Morvath took the horn-seat of Khorvazel when his predecessor fell at the Burning Gate of Nezer, and he keeps a name of two beats for the world and another for the court, which only the pact knows. He rules the Nether foothills of the island, a few demons over many thousands of thralls, orc and goblin labourers and men of the old coast. He keeps his oath to Nafeher while Volgan's strength stands, and every year he demands back the three hundred thralls who stole boats and fled to Olen."
 KIL_zin_ruler:0 "Gronnar, Eldest of Kilinti"
 KIL_zin_ruler_desc:0 "The edge-folk call the present Eldest Gronnar, because the ents' own name for it would take a morning to say. It is the Eldest because it said the fewest words in the year, and it speaks last at the Ent-Moot every seventh spring. When Parim asked for standing oaks to roof the halls of the lake ports, Gronnar's answer, carried by the Reeve, was a single word, and the King did not ask again."
 KIN_zin_ruler:0 "Arcen, Lord of the Gate"
 KIN_zin_ruler_desc:0 "Arcen is the thirty-first Pass-Lord since Deolof, chosen for life by the heads of the watch-families, and he reads the Accord of the Passes aloud at the gorge every year as every Pass-Lord has. He keeps the forts stocked with Kunhrim's powder and the toll-books in good order, and he knows the elves still call his tolls their oldest grievance against men. He would rather be remembered as the lord who settled that grievance than the one who doubled it."
 KLU_zin_ruler:0 "Captain Tavec Hungohar"
 KLU_zin_ruler_desc:0 "Tavec Hungohar is the forty-fourth Captain since Klungor, elected for life by the sworn and bound to swear again at the Reading of Names every year at the tower. He escorts the pilgrims over the South Pass for the Worshipdom's fee, watches the goblin warrens of Burrikkrit and keeps the warren-boss's old helmet polished on the tower wall as a reminder. The Guard has not lit a war-beacon since the Tunnel Fight, and Tavec intends to keep it that way by being ready to."
 KON_zin_ruler:0 "King Sventor of Konori"
 KON_zin_ruler_desc:0 "Sventor was raised on the white felt at the ford by the heads of the Hundreds, as every king of the house of Arrovar has been, and he knows they can set him down on it again. He rides the whole steppe each summer from the fords to the fair-grounds and sells the Hundreds' remounts at Arrovez, complaining loudly that the Golden Court pays for them in titles instead of silver. The Konori breed has never quite recovered from the Long Drought, and he means to be the king who restores its name."
 KRA_zin_ruler:0 "First Guildsman Brannic Tanuow"
 KRA_zin_ruler_desc:0 "The guild council of Bolbin elected Brannic First Guildsman in 4A 1742, the powder-masters' guild giving the league its leader as it has more often than any other since the powder secret was bought from the dwarves. His workshops make powder-pieces and bombards for anyone who pays, and he weighs Aenor's tariffs, which his port pays more heavily than any other, against Aenor's trade and the West's long memory. He says he would rather sell to Parim than fight it, and adds that he has not yet been asked."
 KRS_zin_ruler:0 "Lantern-Warden Rhaina Kersides"
 KRS_zin_ruler_desc:0 "Rhaina Kersides holds the lantern this year, chosen by the market council of guilds and lantern-wardens to speak for Osrale, a free city of the Lake Road that neither Noris nor Stabilo may garrison. Her city is rich, small and anxious, kept free by the rivalry of two powers and taxing both their caravans alike. When the caravanserai district burned, both powers sent money to rebuild it and the council spent each gift on a separate wall, which she thinks the wisest thing it has ever done."
 KUN_zin_ruler:0 "Stulmar of the Kramast, Lord of the Deep Hall"
 KUN_zin_ruler_desc:0 "Stulmar of the Kramast clan was chosen by the council of clan-elders to speak for the hold at the Western Gate, and outsiders deal with him and with nobody else. He sells iron, gold and gems west by the honest pound and black powder to Aenor's crown and to nobody else, as the Powder Compact requires. He keeps the Lamp Truce with the hobgoblin king because a truce is cheaper than a war, and he has told the Golden King, politely, that the clans could starve any ruler in Parim of iron if they chose."
 KVI_zin_ruler:0 "Moot-Chief Haldar Grinson"
 KVI_zin_ruler_desc:0 "The winter moot at Esrom chose Haldar in the Long Dark of 4A 1747 because he had saved more beasts than any other herder in the bad spring before, and the Grinson clan of Radeon has given the confederacy more moot-chiefs than any other. He keeps the toll-peace with the Frost-King, carries the confederacy's meat and iron up to Xitore himself and knows the old ice-roads of the far north-west as well as any man alive. He is slow to speak, quick to share and wary of southerners who ask where the oldest ice lies."
 LAB_zin_ruler:0 "Lord Cadric of the Granaries"
 LAB_zin_ruler_desc:0 "Cadric swore at the granary door in 4A 1727 to sell to every comer, as every lord of Branorn's line has sworn since the plague years, and he has kept the oath with both sides of a forty-three-year war. The envoys of Gunwyn and Girdon talked through a whole winter in his hall before the truce was sworn, and he fed them all and charged them for it. He is a quiet, round, patient man who believes that hunger has ended more wars than any battle."
 LCC_zin_ruler:0 "Elder Fenith of the Long Shore"
 LCC_zin_ruler_desc:0 "Fenith keeps the quay-book of the Long Shore, an office that passes between the houses of the orchards and the houses of the quays in turn, and this turn is the quays'. His houses know the eastern courts better than any elves alive and would trade the Refusal for an eastern peace, which the Magical Forest refused them in the Elder Moot and the shore has not forgotten. He knows his orchards and quays lie first in the path of anyone who crosses the rift, and he would rather make a treaty than a war."
 LEN_zin_ruler:0 "Keeper Ilonai"
 LEN_zin_ruler_desc:0 "The order of the Lamp-House chose Ilonai as Keeper in 4A 1737; she had kept the outermost tower through a whole gale season alone, as every Keeper must, and she swore never to take a side in any quarrel of the arcs. The order keeps the lamps of the northern passages for every ship whatever its flag, and since the sea-king tried to put out a lamp in 4A 1544 no realm of the arcs has touched one. She asks the wreck-lords of Halenor every gale season to light their shores, and expects to be refused."
 LER_zin_ruler:0 "King Ferlin III"
 LER_zin_ruler_desc:0 "Ferlin III of the Sonarvik was crowned in Sonargur in 4A 1731 and rules the strait as his fathers did, from the toll-house as much as from the throne. He was a boy at court when the envoys came home from Parim in 4A 1716 after the toll quarrel, and he has never let the Speakers' Hall forget how they were received there. He keeps the fleets strong and the dwarves' bombards on the royal ships, and he still keeps the Treaty of the Narrow Strait, though his court asks every year what it is worth."
 LIG_zin_ruler:0 "Radiant Speaker Salin of Eldoga"
 LIG_zin_ruler_desc:0 "Salin of Eldoga was chosen Radiant Speaker by the sanctuaries and will serve until he lays the office down, and he chairs the Noon Council of the Sunhot realms. He leads the eastern lowland and the Sun Grasslands, the largest realm of the region, peaceful and prosperous, where the elves of the Light are few among a great many Sunfolk farmers. Since the pirates of the Bright Sea raided the grassland coast, the Radiant Speaker must ask the villages for every levy, and the villages may refuse; Salin has never yet had to ask."
 LUV_zin_ruler:0 "Quay-Master Ocellan Furanides"
 LUV_zin_ruler_desc:0 "Ocellan Furanides is this year's Quay-Master, chosen by the heads of the quay-houses, and he is of the river families with names in -ides who have shared the office with the temple families for six centuries. He traces his line to Blosian Furanides, who rowed the elves' quay-book keepers across the rift in a storm and won the charter of the Narrows. The port lives on the crossing to the East, trades with mycids whose speech nobody has written down, and will side with whoever holds the rift crossing, which Ocellan considers simple good sense."
 MAG_zin_ruler:0 "First Speaker Lusiel Velakorin"
 MAG_zin_ruler_desc:0 "Lusiel of the house of Velakorin has been First Speaker for as long as the houses have trusted her, which by the reckoning of men is a very long time, and she is of the same house as Sirael, the war-speaker of the Grand Alliance. She keeps the book of precedents, can call an Elder Moot of the Kindred, and with the other elven realms can ask the dragons of Dragon Mountain for help that no crown of men can command. When the houses of the Long Shore proposed in the Elder Moot to set the Refusal aside for a peace with the eastern courts, it was her houses that refused, and she has not changed her mind."
 MIA_zin_ruler:0 "King Valdik Korn"
 MIA_zin_ruler_desc:0 "Valdik of the Korn worked his season in the galleries, as every king has done since the gallery fall of 4A 1567, and was crowned at Gilvian in 4A 1735. He sells the iron of the Delvings to the strait fleets and the forges of the North, holds the sister crown of Mine Din by the old marriage and keeps one eye on Aenor's buyers across the strait. He still goes down the galleries once a year, and his miners like him the better for it."
 MIE_zin_ruler:0 "Lord Tharian of Erdozan"
 MIE_zin_ruler_desc:0 "Tharian was adopted from the house of the Lower Gorge by his childless predecessor, and the lords of the pass-forts accepted him as Lord of the Passes at Erdozan, where the Sand Road reaches the coast. He is a shrewd, patient bargainer who has raised the Sand Road toll twice without losing a caravan, and since the Price War his lordship has sold passage through the Hardtmuth to whichever caravan power pays more. He listens to the Deliverer's temple at Erdozan more than his pass-lords would like, because its friends are as generous to him as they are everywhere in the East."
 MIR_zin_ruler:0 "High Warden Mirena of the Passes"
 MIR_zin_ruler_desc:0 "Mirena was a scout-master of the northern passes when the pass-lords and the lake towns elected her High Warden for life in 4A 1739, and she still reads every report from the south herself. She has doubled the beacon line along the Sound and fortified the passes of the land neck, because her scouts tell her the Ember Lands are arming. Parim laughed at her envoy twelve years ago, and she has stopped expecting help from it."
 MLK_zin_ruler:0 "Warlord Ezhan Isenmar"
 MLK_zin_ruler_desc:0 "The oath-companies chose Ezhan over his predecessor's pyre in 4A 1739, because he had held the Ninth Fort through two winters of raids and never once asked Fandanar for bread. He rules from the iron hall above the Black Gallery, sends gifts to the border clans in hard winters and oath-demands in good ones, and bids for the Orewell mines as every warlord before him has done. He has said in open hall that he will eat the march's boots before he eats the queen's grain, and his men believe him."
 MOA_zin_ruler:0 "Speaker Lorvena of Eraver"
 MOA_zin_ruler_desc:0 "Lorvena of Eraver was chosen Speaker by the council of the lake towns for three years, the first from Eraver since that coast town joined the council. She governs the Hot Lake's east shore, the Mora coast and Eraver from Gonnois, and her realm is the granary of the East and the most peaceful of its realms, with no king and no wish for one. Every power that wants to feed a host in the East must buy her grain, and she makes sure they pay for it."
 MOO_zin_ruler:0 "Margrave Valdur Ostvar"
 MOO_zin_ruler_desc:0 "Valdur commanded the fourth fort of the line for nine years before he inherited the margravate in 4A 1733, as every Ostvar margrave must. When the High Crown leaned away from Parim after the toll quarrel, his father sent an envoy south within the year, and Valdur has kept that envoy's chair warm in Parim ever since. He says that leaning to Aenor is only a way of not leaning to Sonargur, which in Molot passes for a family motto."
 MOS_zin_ruler:0 "First Weigher Milio Crovo"
 MOS_zin_ruler_desc:0 "Milio Crovo is First Weigher of Cereosa for this year, chosen by the weighers who keep the city's honest scale and govern it besides. The junction city lives on inns, storage and weighing, both great powers keep envoys there, and the war of Noris and Stabilo ended in its hall. He knows that Cereosa's freedom lasts exactly as long as Noris and Stabilo distrust each other, and he does what he can to keep them at it."
 MSH_zin_ruler:0 "The Rings at the Forest Edge"
 MSH_zin_ruler_desc:0 "The quay-books of Luv-zhise call the gatherings of mycids that meet traders at the forest's edge rings, because they stand in a circle. Whether a ring is a ruler, a family or only a market is not known to anyone outside the forest, and the mycids have never said. When the Black Roots reached the rift coast, the fungi of the belt grew over them and the dead roots rotted; the rift-coast elves say so, and the mycids have said nothing about it either."
 MUS_zin_ruler:0 "Snokust, Boss of Krakur"
 MUS_zin_ruler_desc:0 "Snokust took the iron seat of Krakur in 4A 1739 and with it the cave's name, which every boss of Krakur bears in office, and so he is first among the bosses of the southern hills. He gives the iron to the smiths, sends the packmen out on the long road and lives on what they bring back. Northern towns welcome his goods and lock their doors, and the court of Sonargur has listened to his pedlars since they brought word of a landing three days before the king's own riders."
 NAA_zin_ruler:0 "Queen Shinah bat Alodar"
 NAA_zin_ruler_desc:0 "Shinah bat Alodar rules the sea crown of the north coast plain from Duum-Saah with the council of ship-masters, who may refuse her ships but not her crown. The Noris Treaty is the pillar of her policy, and her ships carry the Salt Road's salt, dye and camel-hair cloth along the coast and into the North Mouth of the Rift. She listens with unease when the island fishers tell of strange ships among the black isles of the Kusmeel, and unlike the other courts she has not laughed."
 NAN_zin_ruler:0 "Almon the Small"
 NAN_zin_ruler_desc:0 "Almon the Small is a wayfinder from the southern isles whom the hill chieftains of the Nan Mountains have followed since 4A 1731, and a warlord of Larorun keeps his seat only for as long as he keeps winning. His pilots alone know the route through the storm belt of the Tempest Reach, which his wayfinders charted and keep secret. He pays his toll to Nafeher, lends the Dominion his storm-pilots and sells the same pilots to anyone who pays more, which makes him the one ruler of the Ember Lands that both Mirolon and Nafeher need."
 NAR_zin_ruler:0 "Elder Panui nau Ancha"
 NAR_zin_ruler_desc:0 "Panui nau Ancha is the eldest of the elders whom the villages of Ancha send to the moot at Riwang, and so he speaks for Nara. He keeps the Day Rule as every elder has kept it for four ages, so that nobody of Nara fishes the reef after dark or crosses the Night Reef for anyone. His grandmother's village took in the survivors of the Aenoran ship that wrecked on the reef in the Third Age, and he still greets northern captains with three words of their tongue."
 NET_zin_ruler:0 "The King of Demons"
 NET_zin_ruler_desc:0 "The King of Demons rules the Nether island and the Halls beneath it from Zarath-Nazur, and his own name is not spoken among men. The houses of the Halls compete for his favour and for the right to open portals, and the house of Agon is among the oldest and least obedient of them. He sells companies to Nafeher by a bargain he renews each reign and never swears, and he still answers those who know the old rites and pay his price, a pact that binds the living and ends with them, because the dead are Zol's."
 NEZ_zin_ruler:0 "Queen Sathael of Nezer"
 NEZ_zin_ruler_desc:0 "Sathael holds one of the two crowns of Gelroze, and Lord Zeruath of the same house holds the other, so that the two must agree before Nezer goes to war. They took the empty hills when the Great Necromancer's seat at Nazerun fell vacant, and they rule the largest of the sworn realms, its coast on the Sea of Nazerch and the broken ring of the Burning Gate. When they swore to Nafeher, the two crowns agreed for the first time in a century, which their court has not stopped talking about."
 NIV_zin_ruler:0 "Frost-King Huk"
 NIV_zin_ruler_desc:0 "Huk sits on the ice-throne at Xitore, chosen by the cairn-keepers, and the cairns that stand for his winters are taller than any herder has seen a cairn grow. He keeps the toll-peace with the reindeer clans as the Frost-Kings have kept it since the oath at the glacier's edge, lets their herds pass for meat and iron and closes the heights to any crown that comes in arms. He once received a Winter Queen's envoy, listened to her for a whole day and then said that he would think about it, and the clans say he is thinking still."
 NLR_zin_ruler:0 "Pass-Warden Tavion"
 NLR_zin_ruler_desc:0 "Tavion was elected Pass-Warden by the post-captains of the warden families and will hold the office until a vigil is broken on his watch, which has never happened to any Pass-Warden. His families count every pilgrim, merchant and stranger who crosses the South Pass, and they let the Deliverer's pilgrims through unarmed and in daylight, counting each one. His watch on the Lake of Mirolon is the only one in the Magical Lands that never stopped, and he reads its reports himself."
 NND_zin_ruler:0 "King Kusaros"
 NND_zin_ruler_desc:0 "Kusaros of the Kilai commanded a ship before he was twenty, as the crown demands, and took the sea-king's seat at the cliff harbour of Kudaini in 4A 1731. He makes his corsairs fishers in peacetime and his fishers corsairs in war, grants a sailing-writ to every corsair in his waters or hangs him, and presses his claim to the Southern Banks whenever his fleet is stronger than Raerby's. His grandfather hanged forty corsairs in one season to keep the western fleets from Kudaini, and Kusaros keeps the gallows in good repair."
 NOL_zin_ruler:0 "Chief Speaker Norene of Dalvis"
 NOL_zin_ruler_desc:0 "Norene of Dalvis was voted Chief Speaker by the households of the eight towns in 4A 1745, the first of her family to hold the office, and by Saelor's rule she will be the last for a while. She pays the Golden Court's tax-farmers with a smile and keeps every receipt, and she keeps a treasury at Saelori that would pay for a war if the towns ever agreed to have one. The fairs of Saelori are richer than they have ever been, and she means to hand them on that way."
 NRS_zin_ruler:0 "King Rasiq ben Tumek"
 NRS_zin_ruler_desc:0 "Rasiq ben Tumek is a Khadi chosen by the well-lords after his uncle's death, and he rules the northern desert, the Salt Road and the tribes of the Moco and Mylunur from Furvior. He is a careful king who keeps the Powder Refusal sworn at the Seven Wells, so that no rider of Noris carries black powder, and he fights the rivalry with Stabilo in tolls, bribes and caravan prices, playing its great houses against each other. The generous friends of the Deliverer's temple at Furvior have lent him more than his treasurers like to admit."
 OBM_zin_ruler:0 "Chief Factor Narino Shindo"
 OBM_zin_ruler_desc:0 "Narino Shindo was chosen Chief Factor for life by the council of timber and gum factors who govern Kerdoco, the jungle-edge city that bought its freedom from its houses. The town lives by the Stabilo Pact's need for hardwood and sealed casks, and its gum seals Drak's powder casks under the Gum Charter. He keeps the Ledger Count like the old houses and fears the jungle's fevers more than any army, since a fever once killed half the town and made it move to the higher ground."
 OLE_zin_ruler:0 "First Keeper Dolara of the Lamps"
 OLE_zin_ruler_desc:0 "Dolara was chosen First Keeper by the keepers of the cliff lamps, and she governs the isle of the Holy Breeze, the lamp-cliffs and Luminor from Gelbus. Her lamps are the first lights a ship sees coming out of the storm belt, and she shelters whoever reaches the cliffs. When three hundred thralls fled Khorvrath across Veleeda she took them in, and she has refused every demand to give them back, though Olen still pays its toll to Nafeher."
 OLO_zin_ruler:0 "Pebbo, Village-King of Tovodor"
 OLO_zin_ruler_desc:0 "Pebbo was crowned by the gold-crowned of Tovodor as the eldest of the village-kings, and the holts meet under him only when they are found, which has not happened in his reign. He keeps the tally of the pots, crowns the gnome whose pot is full and honours Naisa, who keeps the account of luck. Almost nobody in Parim knows that he lives within a day's walk of the bridges, and he would like to keep it so."
 OMR_zin_ruler:0 "Chief Grinor"
 OMR_zin_ruler_desc:0 "Grinor spent his winter alone on the border moor in 4A 1724, as every chief of Kerdok's line must, and the moot chose him in 4A 1741. His clan owes Coldor for the Hill-Fort Winter and Melkgard for the White Year, and he counts both debts carefully and pays neither. The reindeer skull his forebear sent back to Melkgard's warlord hangs above his door, and he keeps a second one ready."
 ORA_zin_ruler:0 "Barim ben Yaqud, Lord of the Boats"
 ORA_zin_ruler_desc:0 "Barim ben Yaqud rules Orato and Fladev from the stone harbour of Nodoqood, two small isles of fishers facing the Kusmeel, as his family has since the boats accepted the first lord. Four years ago his fishermen said they had seen black ships moving among the black islands of the north without lights or oars, and he sent word to Duum-Saah and Furvior, and no court believed them. The fishermen have stopped talking about it in the market, and some of them have stopped fishing the northern grounds, and Barim has not told them they are wrong."
 ORH_zin_ruler:0 "Queen Faberra of Orohaf"
 ORH_zin_ruler_desc:0 "Faberra was chosen queen by the eldest women of the five houses, and her house of Faber holds the harbour of Borrak for as long as she lives. She sits in the house-moot with the lords of Rish, Tinta, Holod and Faber, keeps the Queen's Peace that forbids one house to seize another's ship, and builds the Concord's best hulls from the timber of Verde. Any fleet crossing from the West must pass her harbours, and she has never let Parim forget it."
 ORW_zin_ruler:0 "Mine-Chief Kolvar Siulak"
 ORW_zin_ruler_desc:0 "The mining clan chose Kolvar in 4A 1738, and the dwarf factor at Guerlon let it be known that he was acceptable, which is the order in which the clan prefers to tell it. He keeps both crowns at arm's length and the dwarves close, sells the far north's iron west by the cartload and still owes the factor-house for the pumps that saved the deep shaft in 4A 1677. He is a hard, plain man who trusts nothing he cannot weigh."
 OST_zin_ruler:0 "King Ernoian Ostorides"
 OST_zin_ruler_desc:0 "Ernoian Ostorides, lake-king of Ohitus, rules the north-east lakes and the counties of Ernois, Grova and Nethnu, whose counts still carry his lantern at the Lantern Float. His highland kingdom keeps the Reckoning of the Twelve so that its merchants share one calendar with the west, and it lives on the cedar, fish and lanterns of the Lake Road, which both great powers claim. The Lantern Peace with Mora has held for longer than any lake-reader expected, and he means it to hold for his whole reign."
 PAZ_zin_ruler:0 "Warden of the Guilds Serette Bellaren"
 PAZ_zin_ruler_desc:0 "Serette Bellaren is the great-granddaughter of Tamric Bellaren, who rang every bell in Horlomon for three days in the Bell Riot, and this year the guild masters chose her Warden of the Guilds from the bell-founders' first seat. Her guild-city makes the Concord's bells, glass, paper and books and keeps the best library outside the universities. She has not forgiven Freshon for buying its Golden Charter three years before Pazoma, and at a lower price."
 PLL_zin_ruler:0 "Guild-Master Pamon Polai"
 PLL_zin_ruler_desc:0 "Pamon of the Polai keeps the strong-room where the chart-houses hold their coin and the Pupor Charter its dues, and the guild-masters of Havnai have made him first among them since 4A 1738. He sells everything to everyone, weighs every coin at the strong-room door as the market has done since the coiners were hanged on the quay, and humours the sea-king on the other half of the island because he must. He is a soft-spoken man who has never been known to lend the Charter's treasury, and is asked to every year."
 PLO_zin_ruler:0 "Prince Blosian Plutides"
 PLO_zin_ruler_desc:0 "Blosian Plutides is in the fourth Rising of his reign over the southern valley, and he keeps the upland of the Blozan Lands as his own estate. Plutondo is rich in ash-grown grain and ore and the Gold Road begins at its quays, but it lies deep in Stabilo's ledgers since the Vent Year, when the Plutondo Vents killed the harvest and the caravan houses bought the princedom's debts. He resents the houses that fed his people more than the vents that starved them, and says so at every banquet."
 PLT_zin_ruler:0 "Harbour-Master Torild Margak"
 PLT_zin_ruler_desc:0 "The pilots' guild chose Torild for life in 4A 1737, and like every Harbour-Master before her she read the red-ink entry of 3A 702 aloud on the day of her choosing. She sells to everyone and swears to nobody, and she has twice refused the Winter Crown's granaries with a courtesy that Fandanar found harder to bear than an insult."
 PON_zin_ruler:0 "First Warden Pelio Shindo"
 PON_zin_ruler_desc:0 "Pelio Shindo is First Warden of the council that the guilds of Nerhuus elect to collect the fire-tithe and carry it up the mountain. His city of the caravan princes lies in the shadow of Mount Ergo, where the people say a devil once took a whole caravan and left only its scales laid out on a scorched stone. The council of 4A 1502 decided the tithe was a superstition, and in the autumn the upper town burned; Nerhuus has paid every year since, and Pelio carries the first sack up himself."
 POT_zin_ruler:0 "Lord Kerdan Azlak"
 POT_zin_ruler_desc:0 "The sealing captains chose Kerdan from the Azlak family in 4A 1735, partly because he had worn his grandfather's bear-hunt mantle to every moot since boyhood and partly because nobody else wanted to argue with Melkgard. He sells hides, ivory and seal-fat along the Frozen Sea coast, is proud of his raider forebears and takes care never to mention them in Minnolomak."
 PRT_zin_ruler:0 "Lord Branald Hozening"
 PRT_zin_ruler_desc:0 "Branald is cousin to the Winter Queen through the vale marriage of 4A 1590 and godfather to a captain of Melkgard's oath-companies, and he intends to stay both for as long as the crowns allow it. In the White Year both crowns sent grain to the vale, and he took both and thanked both. He breeds the best rams in the north and talks about them at every feast, which his guests from Fandanar and Minnolomak alike find the safest subject."
 RAE_zin_ruler:0 "Captain-Speaker Daios Raeros"
 RAE_zin_ruler_desc:0 "The shipowners of Ese chose Daios as Captain-Speaker in 4A 1734, the fifth of the Raeros family to keep the freight-book, and they will keep him for as long as he keeps it honestly. He mediates the banks, hires out the isle's ships and watches Nondondor's fleet more closely than any other, because the sea-king's claim to the Southern Banks has never been settled. He holds the Charter's wreck-shares and has a reputation for sharing them fairly, which in the arcs is rarer than a calm."
 REN_zin_ruler:0 "Prince Agnek Farnur"
 REN_zin_ruler_desc:0 "Agnek of the Farnur became prince of the cape in 4A 1729 and lives as his forebears have done since Torik built the forts, on the Aenoran ships that pass under his walls. His grandmother was a daughter of an Aenoran house close to the crown, and he leans openly to Parim. He knows that Leren mastery of the strait would begin at his forts, and he keeps them in better repair than his treasury can afford."
 RHA_zin_ruler:0 "Tribune Kaiena of Pordoce"
 RHA_zin_ruler_desc:0 "Kaiena of Pordoce was elected tribune by the village heads for seven years, the third tribune since the kiln-towns rose against King Mirodeus and his doubled kiln-tax. She governs the Red Lands and the vent-field of the Rhachia Fires from a kiln-city that is poor, proud and watched. The deposed king's heir waits at Porrenva, the caravan houses still buy her potters' wares, and every spring she refires the clay figure of her first mother with the rest of Pordoce."
 SAO_zin_ruler:0 "First Guildsman Cadieth Pellkow"
 SAO_zin_ruler_desc:0 "The guild councils of the Kulolo towns elected Cadieth First Guildsman in 4A 1743, the boatmen's guild giving the league its leader as it most often does, and the guild book of 1A 930 was read aloud at her election as at every one before it. She weighs Aenoran gold against Aenoran tariffs every year and complains about both, keeps the canal to Canako dredged and pays the dwarves of Gromkerm their fixed price without forgiveness on either side."
 SDE_zin_ruler:0 "Elder Nuoan nau Pon"
 SDE_zin_ruler_desc:0 "The families of Sidea, Pon and Yumbo chose Nuoan nau Pon as their one elder, and he will hold the office until the drummers of Yumbo will no longer beat his summons. His drummers carry the first warning of every storm to the Great Isle faster than a canoe can sail, and his islets are the first land of the south that a ship blown down from the West will see. Sidea still sends its first catch of every year to the drowned shrine, in thanks for the canoes the Great Isle rebuilt in 4A 1550."
 SEI_zin_ruler:0 "Moot-Reader Tamsa of the Seite"
 SEI_zin_ruler_desc:0 "The moot of every household on the four Seite isles and Mondeluz chose Tamsa as moot-reader for 4A 1748, and she reads the moot's decisions standing under the reef-shrine as every reader has done. She refuses the sea-king of Nondondor his claim to the Southern Banks every year, as the moot has since 4A 1398, and she knows better than anyone that the isles' fishers alone cannot hold their fathers' banks against his fleet. She is a fisherwoman first and a reader second, and she would rather be at sea."
 SEL_zin_ruler:0 "First Warden Daeric Svenlor"
 SEL_zin_ruler_desc:0 "Daeric Svenlor is the eleventh First Warden his house has given the moots since the Moot of the Three Glades, and he speaks for the Weald in Parim with more patience than the Golden Court deserves. He grumbles at the King's taxes louder than any other dominion lord, and the moots like him for it. In the glades, though, everyone knows that Alleria's word carries further than his, and Daeric is wise enough not to mind."
 SFT_zin_ruler:0 "Harbour-Master Ronric Safarel"
 SFT_zin_ruler_desc:0 "Ronric Safarel was chosen Harbour-Master by the council of ship-houses at the turn of this year, as half the Harbour-Masters in the harbour's history have been chosen from his house or the Lotarens. His ships carry grain to every coast and pilgrims south over the Sea of Peace, and the harbour likes to say he has more ships than the crown. He sold grain to both sides in the western wars and built the new mole with the profit, and he would do it again."
 SKR_zin_ruler:0 "Chief Grumzag"
 SKR_zin_ruler_desc:0 "Grumzag felled a great tree of the Fonoor Forest with his own axe, as every chief must, and broke the last forest-chief in the ring in 4A 1737. Skragdurg sells timber and charcoal to every shipwright on the straits, whatever master they serve, and Grumzag sold the Accord its ship-timber and Goldoroth its own in the same season, as his forebears did in 4A 1604. He says a tree does not ask who will sail it."
 SNS_zin_ruler:0 "Queen Vigild Agtos"
 SNS_zin_ruler_desc:0 "Vigild of the Agtos was confirmed by the landholders' council in 4A 1736, the first queen of the long vale in four reigns. Tolvael's timber and pine tar have kept the strait fleets afloat since 4A 1290, and she sells them to the High Crown as a partner and not as a subject, which she reminds Sonargur of whenever its envoys forget. She is proud, careful with money and quicker to answer a request than an order."
 SNT_zin_ruler:0 "Captain Dairos the Red"
 SNT_zin_ruler_desc:0 "Dairos the Red holds Straton and the outer arc because he is the best captain in it, and he will hold it until a better one comes. He swore the Ransom Tide law like every captain, raids weak merchant fleets and pays tribute to strong ones, and he has not raided Corogon's grain since the burning of 4A 1622. The consuls swore to burn Straton again after paying for the son his corsairs ransomed in 4A 1701, and Dairos keeps a fast ship ready in case they mean it."
 SOY_zin_ruler:0 "Tide-Speaker Yunga of Ileslia"
 SOY_zin_ruler_desc:0 "Yunga was a pilot before the Archipelago Council chose him Tide-Speaker at the turn of the tide, as every Tide-Speaker has been chosen since the council was founded. The northern isles build the white ships of the south and the hulls of Gala's court, trade on the Bright Sea and grow rich on the fastest ships anywhere. His is the one realm of the region whose ships could carry a host north if the Noon Council ever asked, and he hopes it never will."
 STA_zin_ruler:0 "Prince Pleron Tablo"
 STA_zin_ruler_desc:0 "Pleron Tablo was a banker before he was a prince, and the bench of houses chose him for life because he knows every house's debts. He governs the Gold Road, the southern hills and the old caravan towns from Postondoroth, the largest city of the East, whose powder-engines and hired companies make it the strongest purse in the region. He believes the East can be ruled by ledgers without a single war, which is an easy thing to believe with ledgers as full as his, and several of his great houses owe the Deliverer's temple more than the bench has been told."
 TES_zin_ruler:0 "Reeve Edovan Selbar"
 TES_zin_ruler_desc:0 "Edovan Selbar was chosen Reeve at this year's harvest moot, his third year running, which is two short of the most any Reeve has been allowed since Halvar held it for twenty. The vale feeds Herrodon and Andos Enda with its grain and is the only land of men in the northern Magical Lands. He speaks the old ranger dialect of his grandmothers, keeps elven manners at Herrodon's hall and keeps both the hearth-shrine of the twelve and the chapel of the Deliverer in good repair, so that nobody in the vale has cause to complain."
 THN_zin_ruler:0 "King Cadlic"
 THN_zin_ruler_desc:0 "Cadlic of the Sarudwyn was acclaimed at the little hill of Tummin in 4A 1738, and like every king of Thenon he is judged by the olive harvest, which has been good. He keeps the Ronbo Oath with men sent to the Watch, stays out of the downs' feuds and sells his olives and wine to the guild ports. His mother was a daughter of Lambin's granary line, and he has her habit of feeding a quarrel until it falls asleep."
 TIR_zin_ruler:0 "Loddard Heggelum, Warden of the Fields"
 TIR_zin_ruler_desc:0 "Loddard Heggelum was chosen Warden of the Fields by the households of the three valleys in 4A 1744, mostly because his hedge is the tidiest in Tirlan and his beer the best. He keeps the harvest-share for Hirolon's halls, settles quarrels over field-names and has never once worn boots to the moot. He is the first Warden in a hundred years to have walked over the Saddle and seen Parim, and he came home saying it was very large and very noisy, and that he did not care for it."
 TOL_zin_ruler:0 "Princess Hilvi Ishor"
 TOL_zin_ruler_desc:0 "Hilvi of the Ishor inherited the coast and the isles from her father in 4A 1739 and keeps them as her line always has, by the tolls of the Sirtum bridge, the herring of the Onp and a careful distance from everyone else's quarrels. She keeps the summer-net ban that brought the herring back and says that a principality which can wait a generation for its fish can wait for anything."
 TOR_zin_ruler:0 "Keeper Tangin of Wefolen"
 TOR_zin_ruler_desc:0 "Tangin is Keeper of the Stones of Tor Luni and decides what may be cut, in a sanctuary that quarries the white stone of half the realms of the region and leaves its standing stones uncut. Since a Keeper once ordered a block cut from the foot of a standing stone and the chisels broke, no Keeper has given that order again, and Tangin has no intention of being the second. He receives the pilgrims who come by sea to look out over the Sea of Gods from the high places by Wefolen."
 TRO_zin_ruler:0 "King Smash"
 TRO_zin_ruler_desc:0 "Smash is the largest troll of Grootoom by far and king of this forest's trolls and no others, and he lives with them in the great cave of Holos. He walks at night, because sunlight slowly turns him to stone, and the caravan masters of Bordon have written down every night on which he came out and smashed a camp. Realms that leave the troll silver at the forest's edge are let through unharmed, and armies that camp inside it are not found until spring."
 VER_zin_ruler:0 "Chief Ruan nau Lua"
 VER_zin_ruler_desc:0 "The clans of the hills and the mangroves chose Ruan nau Lua as chief in the hall of Pelo Tamo after he had sailed to the edge of the islands' charts, as every chief must. He sells hull-timber to the shipwrights of Orohaf, as Verde has done since the Isle House ships came in a storm year, and pilots to any ship that needs to cross the southern seas. Since the mangrove fire no Verdean cuts a mangrove without his leave, and he gives it rarely."
 VES_zin_ruler:0 "Lord Thazael"
 VES_zin_ruler_desc:0 "Thazael is the name the lord of Ozmath-Vesh gives at the courts of others; his pact-name is known only to his pact. He rules the hall of ash on the Goldoroth Ash Fields, a few hundred demons and the men and orcs who came to the ashes because they had nowhere else to go, and he is sworn to neither Volgan nor Goldoroth. When the Southern Dominion's envoys came to ask his oath in 4A 1650 he sent them home with gifts and without it, and they have come back every few years since to ask again."
 VND_zin_ruler:0 "Speaker Furla Hozen"
 VND_zin_ruler_desc:0 "The captains of Porideon elected Furla to hold the harbour book for the gale season of 4A 1748, her third season in the chair. She has captained a whaler on the road south and a carrying ship to the Pupor Isles, and she will sign a compact with Coldor only when the crown's friendship is worth its price, which she says it has not yet been. She runs the council as she ran her ship: everyone speaks once, and then she decides."
 VRN_zin_ruler:0 "King Oslin IX"
 VRN_zin_ruler_desc:0 "Oslin IX took the founder's name with the crown at Varlibo in 4A 1729, as every king of the capes has done since Oslin of the Trilinwyn set the first lanterns. He keeps the lanterns and the sea watch on the approaches the old Aenoran fleets used, sailed with the ships that burned Straton as a young man and bought Worlond's tallest pines for his hulls. Varlibo's quays are the West's natural staging port for any crossing, which the king knows and Parim has not forgotten."
 WAH_zin_ruler:0 "Mai bat Nurud, Keeper of the Moot"
 WAH_zin_ruler_desc:0 "Mai bat Nurud of the Zahui well holds the keeping of the Well-Moot this year, chosen at Biir-Raab from a different clan, as every Keeper is. She keeps the oath the clan-mothers swore after the War of the Poisoned Wells, with water in their mouths so that no one could lie while swearing: no clan may close or poison a well, and every quarrel over water goes to the Moot. Her league never joins a war, always gives water to refugees before asking their names, and sells it by the skin to every caravan that is not fleeing."
 WEN_zin_ruler:0 "Warden-Speaker Nesiwen of the Datidon Ferry"
 WEN_zin_ruler_desc:0 "The ferry-wardens chose Nesiwen, warden of the great ferry at Datidon, as their Warden-Speaker in 4A 1740, and she keeps the law of the ferries as her predecessors have done since 2A 1250. Wennarith refused to carry either Gunwyn's or Girdon's hosts across its rivers in the border wars and lost forty years of trade for it, and Nesiwen is in no hurry to join anyone else's war. She keeps the warden-bond with Girdon and visits Arligon every spring by boat."
 WER_zin_ruler:0 "King Dyfric"
 WER_zin_ruler_desc:0 "Dyfric of the Werlwyn was acclaimed at the Erg stone in 4A 1734 and calls himself, as every king of his line has done, the true heir of Bulligon. His father took the coast-steadings of the Erg while Gunwyn was busy with Girdon, and now that the truce in the south has turned Bulligon's eyes back to the coast, Dyfric keeps his hill clans close to Caer-Erg. He is a proud, quick-tempered man who has never once spoken of the king at Bulligon without calling him his cousin."
 WIL_zin_ruler:0 "Winter-Holder Ghashnag"
 WIL_zin_ruler_desc:0 "Ghashnag was the strongest orc at the winter camp of Zudertu when the snow came in 4A 1747, and so he speaks for the Wild Lands moor until the thaw. The moor has no council and belongs to whoever stays through a winter; it is where broken clans go when no hold will have them, and Ghashnag came to it with his own clan's broken remnant. He hopes to hold Zudertu for a second winter, which nobody has done since the camp split in 4A 1690."
 WND_zin_ruler:0 "Cape-Lord Benaios of Sondor"
 WND_zin_ruler_desc:0 "The four cape-lords chose Benaios of Sondor to speak for the league for the gale season of 4A 1748, as the lords of Sondor have spoken most often. His kite-fishers work the windward banks no other islanders can reach, his wreckers take what the gales drive onto the capes, and the league pays tribute to strong fleets and raids weak ones. It never agrees on anything quickly, and Benaios has learned to announce the league's decisions before the other three lords have quite made them."
 WOQ_zin_ruler:0 "Harpoon-Speaker Yarun bat Nurek"
 WOQ_zin_ruler_desc:0 "Yarun bat Nurek of the Meli boat holds the harpoon this winter, chosen by the clan-moot of Pehami from the boat clans to speak for the snow coast, Cream and Lorvens. Her sealers, harpooners and sled-men trade furs, seal-fat and ivory with Naamis and the Lake Road and keep to themselves. The moot has kept peace with the sea crown since the Ice Winter, when the clans crossed the frozen sea and Naamis fed them, and she will stay out of any eastern war unless someone attacks her coast."
 WRL_zin_ruler:0 "Lord Yorvan Hozening"
 WRL_zin_ruler_desc:0 "Yorvan walked the whole Neck Road from the Gap to the West Lands at sixteen, as the lordship demands, and inherited the forest stages in 4A 1733. He keeps the waystations stocked for both crowns, sells pine to Varnondor's sea watch and hopes, aloud and often, that nobody will ever fight over the road. His foresters say he can name the owner of every wagon that has passed Tarvak in ten years."
 XIS_zin_ruler:0 "Speaker Ezhim Esroming"
 XIS_zin_ruler_desc:0 "The road-moot at Akahew chose Ezhim for three Long Lights in 4A 1747, the fourth speaker of the Esroming hearth in his own lifetime. He grumbles at every crown wagon that pays the lower toll and has leaned towards Coldor since the White Year, but he keeps the moot's gate and reminds Fandanar of it at every chance. The league's reindeer seal hangs at his belt, and he sets it on nothing he has not read twice."
 YAV_zin_ruler:0 "Aelion, Eldest of the Keepers"
 YAV_zin_ruler_desc:0 "The fellowship of Yavieth has no ruler, and Aelion leads it only because he is the eldest keeper, which means the dragons speak to him and the rest listen to him. The keepers say a dragon never forgets a name and never says one, so they keep no list of eldest keepers, and Aelion has no intention of being the first written on one. He trades shed dragon-scale at Kingson for salt and iron, and he lets the dragons take the goats."
 YEI_zin_ruler:0 "Grumhal the Eldest"
 YEI_zin_ruler_desc:0 "Grumhal is the singer whose song carries furthest at the winter gathering in Ghaumbhu, and so the clans of Haruhu follow him. He keeps the hunting truce that an Eldest sang with the coast chiefs at Fentene, comes down to the snowline fair each Long Light and will not hunt where he smells the smoke of the goblin valleys. A patient crown can court him, and an impatient one will find that he has gone back up the shelf."
 YEN_zin_ruler:0 "Eldest Watcher Wenang of Sudoni"
 YEN_zin_ruler_desc:0 "Wenang is Eldest Watcher of Sudoni and keeps the Roll of Wings, the record of every sighting of angels over the western terraces, with the hour, the weather and the watcher's name. Yeni Alang is a quiet house that farms, sings and watches, and it adds a line to the Roll a few times in a good year. When no watcher saw wings for a whole year the house fasted until the next spring, and the Sunfolk of the terraces still count a sighting as a blessing on the harvest."
 YON_zin_ruler:0 "Elder Suayan nau Yongwa"
 YON_zin_ruler_desc:0 "Suayan nau Yongwa calls the ring-council of the Yong elders, an office with no other power, since the council speaks with one voice only when every elder agrees. She keeps the oath sworn on the shrine stone of Yongrost after the Year of the Red Wind, so that the lagoon is never again divided by fire, and she fears the Yong villages' feuds more than any foreign fleet. Her island carves shell, makes the south's rope and nets and cuts its shrine stone, and its elders argue about all three."
