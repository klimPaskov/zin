l_english:
 zin_regional_molot_armouries_of_molot:0 "Armouries of Molot"
 zin_regional_molot_armouries_of_molot_desc:0 "A great armoury is raised beside the Margrave's keep. Smiths from the border towns forge spears, mail and shield-bosses, and the garrison carries what they make."
 zin_regional_molot_balance_of_the_north:0 "The Balance of the North"
 zin_regional_molot_balance_of_the_north_desc:0 "Molot plays Sonargur and Parim one against the other, with a smile and a fine sense of timing. Both courts compete for its friendship, and neither is quite sure of it."
 zin_regional_molot_chapels_of_the_march:0 "Chapels of the March"
 zin_regional_molot_chapels_of_the_march_desc:0 "The almoners ask for chapels in the towers of the march. The captains are suspicious, and the garrisons are interested."
 zin_regional_molot_courtship:0 "The March Courted"
 zin_regional_molot_envoys_to_parim:0 "Envoys to Parim"
 zin_regional_molot_envoys_to_parim_desc:0 "A second herald is sent south to the king in Parim, with the same gifts and the same request. The two heralds do not meet, by arrangement."
 zin_regional_molot_envoys_to_sonargur:0 "Envoys to Sonargur"
 zin_regional_molot_envoys_to_sonargur_desc:0 "A herald in the grey cloak of the march is sent to the crown at Sonargur. He carries a gift of drilled spearmen, and a plain request for friendship."
 zin_regional_molot_fire_the_beacons:0 "Fire the Beacons"
 zin_regional_molot_fire_the_beacons_desc:0 "Black hulls have been seen off the northern cliffs. The beacons are lit, the sea-forts are manned and the garrisons are woken."
 zin_regional_molot_games:0 "The March Plays Games"
 zin_regional_molot_garrison_drill:0 "Garrison Drill"
 zin_regional_molot_garrison_drill_2:0 "The Iron March"
 zin_regional_molot_garrison_drill_2_desc:0 "The garrisons of the march are the best drilled in the North after Lerendor's own. They hold a wall like a mountain and fall back like a tide."
 zin_regional_molot_garrison_drill_desc:0 "Each tower has a drill-yard and each drill-yard has a master. The garrisons practise the defence of a wall until they can do it blindfold."
 zin_regional_molot_garrison_drill_spirit:0 "Garrison Drill"
 zin_regional_molot_garrison_drill_spirit_desc:0 "Every tower has a drill-yard and every drill-yard has a master. The garrisons of Molot practise the defence of a wall until they can do it blindfold."
 zin_regional_molot_herds_of_the_march:0 "Herds of the March"
 zin_regional_molot_herds_of_the_march_desc:0 "Shaggy cattle and moor sheep graze behind the towers. They feed the garrisons in winter and clothe them in summer."
 zin_regional_molot_iron_discipline:0 "Iron Discipline"
 zin_regional_molot_iron_discipline_desc:0 "The garrisons of the march are drilled with an iron hand. A garrison that holds is fed, and one that breaks is flogged, and the rules are read aloud at every dawn."
 zin_regional_molot_iron_discipline_spirit:0 "Iron Discipline"
 zin_regional_molot_iron_discipline_spirit_desc:0 "A garrison that breaks its ranks is flogged, and a garrison that holds is fed. The march lords keep both rules strictly, and the men do not complain."
 zin_regional_molot_march_at_war:0 "The March at War"
 zin_regional_molot_march_at_war_desc:0 "The towers are manned, the beacons are laid and the garrisons are provisioned for a siege. The Margrave has let it be known that the march will not give way."
 zin_regional_molot_march_companies_with_the_heir:0 "March Companies with the Heir"
 zin_regional_molot_march_companies_with_the_heir_desc:0 "The Heir has returned, and the march sends a company of its best to join him. The Margrave stays behind with the rest, and holds the towers."
 zin_regional_molot_march_economy:0 "The March Economy"
 zin_regional_molot_march_economy_desc:0 "The march is poor, and the Margrave wants it less so. He builds workshops in the shelter of the towers, and sets the garrison to learn a trade."
 zin_regional_molot_march_engineers:0 "March Engineers"
 zin_regional_molot_march_engineers_desc:0 "Master builders and stone-cutters are brought into the Margrave's service. They build walls, siege-engines and covered ways, and teach the garrisons to use them."
 zin_regional_molot_march_faith:0 "The March Keeps Faith"
 zin_regional_molot_march_herds:0 "Herds of the March"
 zin_regional_molot_march_herds_desc:0 "The march is poor in grain and rich in herds. Shaggy cattle and sheep graze on the moor behind the towers, and feed the garrisons all winter."
 zin_regional_molot_march_mercenaries:0 "Swords for Hire"
 zin_regional_molot_march_mercenaries_desc:0 "Molot lets its spare swords to anyone who pays. The march lords take a tenth and ask no questions, and the veterans learn a great deal."
 zin_regional_molot_march_provisions:0 "March Provisions"
 zin_regional_molot_march_provisions_desc:0 "Grain is carted in from the south and stored in the stone cellars of the towers. A garrison with a year's bread can stand a year's siege."
 zin_regional_molot_march_roads:0 "March Roads"
 zin_regional_molot_march_roads_desc:0 "A paved road is run the length of the march, from tower to tower and from tower to coast. The garrisons can move in a day what used to take three."
 zin_regional_molot_margraves_house:0 "The Margrave's House"
 zin_regional_molot_margraves_house_2:0 "The Margrave's Word"
 zin_regional_molot_margraves_house_2_desc:0 "When the Margrave speaks, the march listens. His word is law in the towers and honoured in the villages, and nobody in Molot would think of breaking it."
 zin_regional_molot_margraves_house_desc:0 "The margraves of Molot have held the northern march for generations, and balanced Lerendor by courting Parim whenever Sonargur grew too strong. The house is old, and it is canny."
 zin_regional_molot_molot_stands_alone:0 "Molot Stands Alone"
 zin_regional_molot_molot_stands_alone_desc:0 "Molot is small, but it is not easily moved. The Margrave stands on his highest tower and proclaims that the march will stand alone, and will fall to nobody."
 zin_regional_molot_oath_to_sonargur:0 "An Oath to Sonargur"
 zin_regional_molot_oath_to_sonargur_desc:0 "The Margrave kneels to the crown at Sonargur, and swears an oath on a bare blade. It is a hard thing for a march lord to do, and he does it in silence."
 zin_regional_molot_play_one_against_the_other:0 "Play One Against the Other"
 zin_regional_molot_play_one_against_the_other_desc:0 "Molot makes its friendship available to each court in turn. Sonargur and Parim bid against one another, and the Margrave names the price."
 zin_regional_molot_sea_forts:0 "Sea Forts"
 zin_regional_molot_sea_forts_desc:0 "Forts are built on the cliffs above the northern water, with stone walls, sea-gates and a beacon on the highest tower. They guard the coast and warn the march."
 zin_regional_molot_swords_for_hire:0 "Swords for Hire"
 zin_regional_molot_swords_for_hire_desc:0 "Molot's spare swords are let out to whoever pays. The Margrave takes a tenth and the veterans take a lesson, and nobody in the march complains."
 zin_regional_molot_the_balance_holds:0 "The Balance Holds"
 zin_regional_molot_the_balance_holds_desc:0 "Molot has kept its balance for a generation, and the Margrave means to keep it for another. The two courts do not love him, but both are careful of him."
 zin_regional_molot_the_balance_of_the_north:0 "The Balance of the North"
 zin_regional_molot_the_balance_of_the_north_desc:0 "Molot sits between Sonargur and Parim, and has no wish to be anyone's subject. The Margrave writes down what he is prepared to give, and what he would like in return."
 zin_regional_molot_the_iron_march:0 "The Iron March"
 zin_regional_molot_the_iron_march_desc:0 "The march is a single chain of towers, forts and watch-fires, under a single command. Whoever comes against it comes against the whole of it."
 zin_regional_molot_the_long_garrison:0 "The Long Garrison"
 zin_regional_molot_the_long_garrison_desc:0 "A standing garrison is kept in each coastal fort, and relieved by the villages in turn. Molot has more men under arms than it can easily feed, and means to keep them there."
 zin_regional_molot_the_march_fortresses:0 "The March Fortresses"
 zin_regional_molot_the_march_fortresses_desc:0 "The great fortress at the heart of the march is rebuilt in grey stone, with a double wall and a deep ditch. It is the keep of Molot, and it will not fall."
 zin_regional_molot_the_march_holds:0 "The March Holds"
 zin_regional_molot_the_march_holds_desc:0 "The beacons are lit along the whole of the march, and the Margrave calls his lords to the keep. The march will not give way, and it says so aloud."
 zin_regional_molot_the_march_lords:0 "The March Lords"
 zin_regional_molot_the_march_lords_desc:0 "The lords of the march each hold a tower and its lands, in return for a garrison and a share of the watch. They meet at the Margrave's table each quarter, with their swords at their sides."
 zin_regional_molot_the_march_stands_apart:0 "The March Stands Apart"
 zin_regional_molot_the_march_stands_apart_desc:0 "Lerendor has left the old treaty, and Molot does not follow. The Margrave declares the march to be its own master, standing with the North, and with nobody else."
 zin_regional_molot_the_march_with_parim:0 "The March with Parim"
 zin_regional_molot_the_march_with_parim_desc:0 "Margrave Wokla remembers the old alliance, and sends word to Parim that Molot will keep it. His garrisons are offered, and his towers."
 zin_regional_molot_the_margravate:0 "The Margravate"
 zin_regional_molot_the_margravate_desc:0 "Molot is the northern march: two states of towers and garrisons whose watch-fires look over cold water. Margrave Wokla is a soldier at peace, and likes the peace because it lets him choose his friends."
 zin_regional_molot_the_margraves_court:0 "The Margrave's Court"
 zin_regional_molot_the_margraves_court_desc:0 "The Margrave holds court in the largest tower, with a clerk, a herald and a chaplain at his side. It is the only court in the North where the king sits closest to the door."
 zin_regional_molot_the_margraves_word:0 "The Margrave's Word"
 zin_regional_molot_the_margraves_word_desc:0 "Margrave Wokla's word is law from the sea to the moors. A lord who disputes it answers to the Margrave himself, in his own hall."
 zin_regional_molot_the_northern_towers:0 "The Northern Towers"
 zin_regional_molot_the_northern_towers_desc:0 "A string of towers is built along the northern ridge, each within a mile of the next. The garrisons are small, but the beacons are large."
 zin_regional_molot_the_watch_ends:0 "The Watch Ends"
 zin_regional_molot_the_watch_ends_desc:0 "The watch-fires burn low at last. The garrisons go home, and the Margrave takes off his helm for the first time in a year."
 zin_regional_molot_the_watch_fires:0 "The Watch-Fires"
 zin_regional_molot_the_watch_fires_desc:0 "A chain of watch-fires is laid along the whole of the march, each stack of wood tended by a family of the village. A light at one end of Molot is seen at the other within the hour."
 zin_regional_molot_watch_fires:0 "The Watch-Fires"
 zin_regional_molot_watch_fires_desc:0 "A line of watch-fires runs the length of the northern march, each tower within sight of the next. A warning at one end of Molot reaches the other before the horn has stopped."
 zin_regional_molot.1.a:0 "The march needs soldiers, not priests"
 zin_regional_molot.1.b:0 "The garrison may pray"
 zin_regional_molot.1.d:0 "The almoners of the Houses of the First Light have asked leave to build chapels in the towers of the march. They would tend the sick, keep a granary and bless the watch. The Margrave's captains say the march needs soldiers, not priests, but the garrisons are not so sure."
 zin_regional_molot.1.t:0 "Chapels of the March"
 zin_regional_molot.2.a:0 "Molot plays games"
 zin_regional_molot.2.b:0 "Send gifts to the margrave"
 zin_regional_molot.2.d:0 "A herald in the grey cloak of the northern march has presented himself at court. Margrave Wokla sends greetings and a gift of drilled spearmen's songs, and hopes that the court will remember Molot when it counts its friends. He has said the same to the other court."
 zin_regional_molot.2.t:0 "Envoys from the March"
 zin_regional_molot.3.a:0 "Parim needs no march lords"
 zin_regional_molot.3.b:0 "Accept"
 zin_regional_molot.3.d:0 "Margrave Wokla writes to Parim from the northern march. Molot's towers, its garrisons and its watch-fires are at the king's disposal, he says, as long as the king will guarantee the march. The offer is formal and the letter is short."
 zin_regional_molot.3.t:0 "Molot Offers the March"
