l_english:
 zin_regional_drak_borrow_for_the_army:0 "Borrow for the Army"
 zin_regional_drak_borrow_for_the_army_desc:0 "A larger loan is signed, and the silver is spent on spears, shields and drill-masters. Morod tells his marshals the debt is a weapon like any other."
 zin_regional_drak_caravan_war_drak:0 "Drak Rides for the Pact"
 zin_regional_drak_caravan_war_drak_desc:0 "The war-horn has sounded in Postondoroth, and Drak's riders are already on the road. They ride with their king's banner and the Pact's gold."
 zin_regional_drak_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_drak_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_drak_close_the_houses:0 "Close the Houses"
 zin_regional_drak_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_drak_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_drak_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_drak_drill_with_the_shield_companies:0 "Drill With the Shield-Companies"
 zin_regional_drak_drill_with_the_shield_companies_desc:0 "Drak's levies are sent to the Pact's drill-grounds, where old shield-company captains teach the wall-and-spear. Few come home unchanged."
 zin_regional_drak_eastern_oath:0 "Oath to the King in the East"
 zin_regional_drak_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_drak_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_drak_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_drak_forts_toward_furvior:0 "Forts Toward Furvior"
 zin_regional_drak_forts_toward_furvior_desc:0 "A line of forts rises along the northern border, facing the camel country of Noris. The garrisons are told that they are a deterrent, and are drilled as though they were not."
 zin_regional_drak_free_crown_court:0 "A Free Crown"
 zin_regional_drak_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_drak_free_of_the_ledger:0 "Free of the Ledger"
 zin_regional_drak_free_of_the_ledger_desc:0 "The last page of the ledger is turned, and Postondoroth's clerks fold it away. Morod holds a feast in the war-hall and drinks to a debt paid."
 zin_regional_drak_generous_friends:0 "The Generous Friends"
 zin_regional_drak_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_drak_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_drak_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_drak_healing_houses:0 "Houses of Healing"
 zin_regional_drak_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_drak_houses_of_healing:0 "Houses of Healing"
 zin_regional_drak_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_drak_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_drak_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_drak_keep_the_old_seat:0 "Keep the Old Seat"
 zin_regional_drak_keep_the_old_seat_desc:0 "The old halls are swept, relit and garrisoned by Drak's guards. Stabilo's heralds call it a theft, and Drak's heralds call it a homecoming."
 zin_regional_drak_levies_for_the_host:0 "Levies for the Host"
 zin_regional_drak_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_drak_morods_marshals:0 "Morod's Marshals"
 zin_regional_drak_morods_marshals_desc:0 "The king gathers his marshals in the war-hall and sets a map on the table. Each is told which road he will hold and which river he will not cross."
 zin_regional_drak_morods_marshals_spirit:0 "Morod's Marshals"
 zin_regional_drak_morods_marshals_spirit_desc:0 "The king's marshals sleep in the war-hall and eat at the king's table. They have fought each other for the post, and the survivors are not gentle."
 zin_regional_drak_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_drak_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_drak_own_counsel:0 "Our Own Counsel"
 zin_regional_drak_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_drak_pact_drill:0 "Drilled With the Shield-Companies"
 zin_regional_drak_pact_drill_desc:0 "Drak's spearmen learn the shield-wall drill of Stabilo's old companies, row on row, until a company moves as one man. The drill-masters say it is the only lesson that outlasts a king."
 zin_regional_drak_pact_riders_on_the_gold_road:0 "Pact Riders on the Gold Road"
 zin_regional_drak_pact_riders_on_the_gold_road_desc:0 "Mounted companies patrol the Gold Road from the border to the first well. Merchants say that robbers have grown scarce, and that the riders have grown proud."
 zin_regional_drak_pay_in_iron:0 "Pay in Iron"
 zin_regional_drak_pay_in_iron_desc:0 "The king's smiths forge bars for Postondoroth's counting-house in lieu of coin. The debt falls, and so does the king's pride."
 zin_regional_drak_question_of_the_east:0 "The Question of the East"
 zin_regional_drak_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_drak_ready_for_the_caravan_war:0 "Ready for the Caravan War"
 zin_regional_drak_ready_for_the_caravan_war_desc:0 "If the two great roads come to blows, Drak's riders will ride beside Stabilo's, and the king has told his marshals so in plain words. Drak will fight only as the Pact's sworn member."
 zin_regional_drak_shield_of_postondoroth:0 "The Shield of Postondoroth"
 zin_regional_drak_shield_of_postondoroth_desc:0 "Drak's levies guard the Pact's roads from the southern watch to the Gold Road gate. Postondoroth's merchants sleep soundly because Drak's spears do not."
 zin_regional_drak_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_drak_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_drak_sword_kingdom:0 "The Sword Kingdom"
 zin_regional_drak_sword_kingdom_desc:0 "Every child in Drak knows how to hold a spear before learning a letter, and every lord holds his land by the sword. Other crowns call Drak rude, and are careful not to say so near its border."
 zin_regional_drak_sword_of_the_pact:0 "Sword of the Pact"
 zin_regional_drak_sword_of_the_pact_desc:0 "Drak is the oldest partner of the Stabilo Pact, and its king has sworn to ride at the Pact's call. Postondoroth's treasurers speak of Drak as their sword and of Morod as its hilt."
 zin_regional_drak_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_drak_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_drak_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_drak_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_drak_the_debt_to_postondoroth:0 "The Debt to Postondoroth"
 zin_regional_drak_the_debt_to_postondoroth_desc:0 "Morod owes Postondoroth's houses a sum that has grown every year since his father borrowed it. His treasurers keep the figure in a locked drawer and read it only when they must."
 zin_regional_drak_the_debt_to_postondoroth_tip_1:0 "Drak's debt to the houses of Postondoroth is entered in the ledger."
 zin_regional_drak_the_iron_tithe:0 "The Iron Tithe"
 zin_regional_drak_the_iron_tithe_desc:0 "Every lord of Drak pays a tithe in iron bars, weighed in the king's hall and stacked behind the throne. A king with iron in the cellar can afford a long war."
 zin_regional_drak_the_kings_champions:0 "The King's Champions"
 zin_regional_drak_the_kings_champions_desc:0 "Twelve champions stand at the king's right hand, picked by combat and sworn by iron. Drak's riders say a champion is worth a company, and the champions say nothing."
 zin_regional_drak_the_kings_hunt:0 "The King's Hunt"
 zin_regional_drak_the_kings_hunt_desc:0 "Each spring the king rides out with every lord, a hundred horse and three hundred hounds. The boar they kill matters less than the order they ride in."
 zin_regional_drak_the_martial_crown:0 "The Martial Crown"
 zin_regional_drak_the_martial_crown_desc:0 "King Morod holds Drak by the sword, as his fathers did before the caravan roads were opened. His crown is plain iron, and he has never thought to gild it."
 zin_regional_drak_the_old_seat:0 "The Old Seat"
 zin_regional_drak_the_old_seat_desc:0 "Postondoroth's old halls stand in Drak's land, their windows dark and their stair worn. The king's heralds ask whether the seat should be kept, yielded or left to the dust."
 zin_regional_drak_the_old_seat_tip_1:0 "Postondoroth's old halls stand in our land."
 zin_regional_drak_the_pacts_cavalry:0 "The Pact's Cavalry"
 zin_regional_drak_the_pacts_cavalry_desc:0 "Drak's horse-farms supply every rider the Pact can mount, and its breeders are sent to Postondoroth to teach the stud-masters. The best colts always stay in Drak."
 zin_regional_drak_the_seat_of_drak:0 "The Seat of Drak"
 zin_regional_drak_the_seat_of_drak_desc:0 "The old halls become the seat of Drak's kings, and the throne is carried in from the war-hall. A mint and a counting-house follow within the year."
 zin_regional_drak_the_shield_of_postondoroth:0 "The Shield of Postondoroth"
 zin_regional_drak_the_shield_of_postondoroth_desc:0 "Drak's levies garrison the Pact's gates, and the standing guard at Postondoroth wears Drak's colours. The Pact's seat is safe in Drak's keeping."
 zin_regional_drak_the_sword_kingdom:0 "The Sword Kingdom"
 zin_regional_drak_the_sword_kingdom_desc:0 "Drak is known across the East as the realm that keeps its quarrels sharp. Its neighbours leave the border alone, and the Pact leans on its blade."
 zin_regional_drak_the_war_halls:0 "The War-Halls"
 zin_regional_drak_the_war_halls_desc:0 "Long halls stand in every fortress town, with drums on the walls and racks of spears below. Young men sleep there before their first campaign, and old men tell them how it ends."
 zin_regional_drak_wait_upon_events:0 "Wait Upon Events"
 zin_regional_drak_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_drak_war_chest_of_the_pact:0 "War Chest of the Pact"
 zin_regional_drak_war_chest_of_the_pact_desc:0 "Postondoroth lends a chest of silver against the Pact's service. Morod accepts it with a nod and signs with a heavy hand."
 zin_regional_drak_watch_the_quays:0 "Watch the Quays"
 zin_regional_drak_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_drak_watchful_quays:0 "Watchful Quays"
 zin_regional_drak_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_drak_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_drak_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_drak_when_the_king_falls:0 "When the King Falls"
 zin_regional_drak_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_drak_yield_the_old_seat:0 "Yield the Old Seat"
 zin_regional_drak_yield_the_old_seat_desc:0 "Morod gives the old halls to Stabilo and lays down the claim of his fathers. The debt is struck out, the Pact's bankers bow, and Drak's old lords grumble in their cups."
