 zin_faith_clan_stones:0 "The Standing Stones"
 zin_faith_clan_stones_desc:0 "An oath sworn at a standing stone binds the stone, the swearer and the clan. The Lawspeaker remembers every oath."
 zin_faith_company_banner:0 "The Banner-Oath"
 zin_faith_company_banner_desc:0 "A company's banner is its soul, and sworn men pray before it. A fallen banner ends the company."
 zin_faith_deliverer:0 "The Faith of the Deliverer"
 zin_faith_deliverer_desc:0 "Believers keep a lamp and a loaf for the stranger and give a tenth of the first harvest to the Houses of the First Light. The Houses are clinic, granary and school."
 zin_faith_ent_slow:0 "The Slow Rite"
 zin_faith_ent_slow_desc:0 "The ents answer to the grove and the grove to the season. Men see no rite, and a moot may take three years to say one sentence."
 zin_faith_giant_cairn:0 "The Cairn-Faith"
 zin_faith_giant_cairn_desc:0 "A giant leaves one stone for each year of life. The great cairns are the giants' memory."
 zin_faith_grave_cult:0 "The Children of Volgan's Dread"
 zin_faith_grave_cult_desc:0 "The hosts keep a rite of Names and Gates, and many worship Volgan as a god."
 zin_faith_green_lords:0 "The Green Lords"
 zin_faith_green_lords_desc:0 "Every old wood has a Lord of the Green who must be asked before an arrow is loosed. No bow is drawn in the Hallow Month."
 zin_faith_guild_hall:0 "The Guild Halls"
 zin_faith_guild_hall_desc:0 "Each guild honours one god under a craft-aspect and keeps a patron-day and a hall. Contracts are sworn on the guild book."
 zin_faith_hearth_iron:0 "Hearth-Iron"
 zin_faith_hearth_iron_desc:0 "A bar of iron is kept at every hearth and passed to the eldest son. Old feuds are settled over the bar."
 zin_faith_hold_luck:0 "The Luck of the Hold"
 zin_faith_hold_luck_desc:0 "The holds trust charms, bones and lucky stones, and honour the spirit of whatever place they live in. Every priest is suspect."
 zin_faith_horse_oath:0 "The Horse-Oath"
 zin_faith_horse_oath_desc:0 "A rider swears on a horse, and the horse carries the oath to the sky. An oath broken is a horse lost."
 zin_faith_isle_tide:0 "The Tide-Houses"
 zin_faith_isle_tide_desc:0 "The dead go out with the tide and return with it. Each house names its ancestors in the tide-chamber at the flood."
 zin_faith_kindred_song:0 "The Kindred Song"
 zin_faith_kindred_song_desc:0 "The elves hold that the world was sung and that to listen well is a duty. No elf claims to know the one true telling."
 zin_faith_lake_litany:0 "The Lake Litany"
 zin_faith_lake_litany_desc:0 "The lakes keep the memory of the caravans. Merchants and fishers pray together at the water."
 zin_faith_lamp_furrow:0 "The Lamp and the Furrow"
 zin_faith_lamp_furrow_desc:0 "Households honour the gods in two images, a lamp that never goes out and rain over a ploughed field. The mother keeps the lamp and the village keeps the rain-stone."
 zin_faith_mourning_dust:0 "The Mourning Customs of the Ember Lands"
 zin_faith_mourning_dust_desc:0 "The dead are buried quickly and deep, with salt, and nothing is said of Zol or Volgan at the grave. Their gods are the gods of safe harbours."
 zin_faith_noon_pilgrimage:0 "The Noon Pilgrimage"
 zin_faith_noon_pilgrimage_desc:0 "The Lands of the Sun are the nearest place to the divine realm that mortals call Heaven. The sanctuaries give rest to every pilgrim."
 zin_faith_old_knots:0 "The Old Knots"
 zin_faith_old_knots_desc:0 "Names are tied into a cord, and the dead are never untied. A stolen name is a cut cord."
 zin_faith_pact_rite:0 "The Pact-Rite of the Nether"
 zin_faith_pact_rite_desc:0 "Every lord keeps a pact and a pact-name known only to the pact. Oaths are sealed in blood and ash."
 zin_faith_rain_mirror:0 "The Mirror Vigil"
 zin_faith_rain_mirror_desc:0 "The Gala keep a spring where the past and the possible may be glimpsed. They do not trust a vision shown too plainly."
 zin_faith_ransom_tide:0 "The Ransom Tide"
 zin_faith_ransom_tide_desc:0 "The tide returns every ship. A captive who is ransomed is under the god of the harbour, and one who is not is under the sea."
 zin_faith_red_hearth:0 "The Red Hearth"
 zin_faith_red_hearth_desc:0 "The red clay is the bone of the first mothers. Each house re-fires its clay mother every spring."
 zin_faith_river_temples:0 "The River Temples"
 zin_faith_river_temples_desc:0 "The river is the oldest god we can see. Tall temples honour the gods above the flood-line, and the river below it."
 zin_faith_river_wardens:0 "The River Wardens' Rite"
 zin_faith_river_wardens_desc:0 "Each river has a keeper that mistakes the town for a guest. The wardens feed it a loaf at the flood and keep the ford clear."
 zin_faith_scale_creed:0 "The Creed of the Honest Scale"
 zin_faith_scale_creed_desc:0 "An honest weight pleases the gods. A false weight is the worst crime, and every temple keeps its scales."
 zin_faith_skull_fire:0 "The Skull and the Fire"
 zin_faith_skull_fire_desc:0 "The clan honours its dead on a cairn of skulls and its mountain with a fire that never goes out. Orcs do not say what lives in the mountain."
 zin_faith_stone_hunger:0 "The Hunger and the Stone"
 zin_faith_stone_hunger_desc:0 "The trolls honour the stone that feeds them and the hunger that drives them. Their dead are laid in bogs."
 zin_faith_stone_vigil:0 "The Stone Vigil"
 zin_faith_stone_vigil_desc:0 "The Wall is a promise to the dead of the Third Age, and every post is holy. Watch-chaplains keep the roll of the fallen."
 zin_faith_storm_court:0 "The Storm Court"
 zin_faith_storm_court_desc:0 "Storms are the court of the sea. Captains and warlords bargain with the spirits of wind and water."
 zin_faith_strait_litany:0 "The Strait Litany"
 zin_faith_strait_litany_desc:0 "A litany is sung at every tide, naming the ships lost that year. The Leren sing to the gods and to the storm that took them."
 zin_faith_tide_charts:0 "The Chart-Faith"
 zin_faith_tide_charts_desc:0 "To chart a reef is a gift to every sailor to come. A chart-house honours its first wayfinder and the reefs that spared him."
 zin_faith_tide_skull:0 "The Salt Tithe"
 zin_faith_tide_skull_desc:0 "Sea orcs sink a skull in the first catch of each season and pay the sea a tithe of salt."
 zin_faith_warden_vigil:0 "The Warden's Vigil"
 zin_faith_warden_vigil_desc:0 "Mirolon honours the gods as watchers. Every warden keeps a night vigil each month, and every tower keeps its lamp toward the south."
 zin_faith_warren_luck:0 "The Warren Luck"
 zin_faith_warren_luck_desc:0 "A warren trusts the luck of its lamp. A lamp gone out is a warren doomed."
 zin_faith_wave_tally:0 "The Wave-Tally"
 zin_faith_wave_tally_desc:0 "Each island counts its dead as waves on the reef. A shrine repeats a name long forgotten, and the islanders say the name is needed."
 zin_faith_well_oath:0 "The Well-Oath"
 zin_faith_well_oath_desc:0 "A well is a promise from the earth. Sharing water makes kin, and one who poisons a well is cast from every tribe."
 zin_faith_winter_hearth:0 "The Winter Hearth"
 zin_faith_winter_hearth_desc:0 "In the Long Dark each house lets its fire go out and relights it from the clan fire. No family is alone with its cold."
 zin_faith_yeti_hum:0 "The Hum"
 zin_faith_yeti_hum_desc:0 "The mountain hums, and the hum must be answered at dusk. A clan with no hum is lost."
