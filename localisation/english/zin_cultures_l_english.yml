 zin_ftext_clan_stones:0 "The law-faith of the western hills, spoken by lawspeakers who are judges and priests together."
 zin_ftext_company_banner:0 "The soldiers' faith of Buldor, led by banner-chaplains."
 zin_ftext_deliverer:0 "A New God of deliverance, protection and renewal, honoured in the Houses of the First Light. Its confessors teach and heal."
 zin_ftext_ent_slow:0 "The faith of Kilinti, which has no priests. The Eldest speaks last."
 zin_ftext_giant_cairn:0 "The cairn-faith of Hiloron and Titanos, kept by stone-keepers."
 zin_ftext_grave_cult:0 "The dark rite of the Dominion, kept by necromantic orders and the wardens of the Gates."
 zin_ftext_green_lords:0 "A faith of woods and rangers, led by tree-wardens whom the moot chooses."
 zin_ftext_guild_hall:0 "A faith of crafts, kept in the great halls of Kradlon and Corogon."
 zin_ftext_hearth_iron:0 "The iron-faith of Dondor, kept by smiths called iron-keepers."
 zin_ftext_hold_luck:0 "The luck-faith of the wild holds, kept by charm-wives."
 zin_ftext_horse_oath:0 "The faith of the steppe riders, witnessed by old riders called oath-riders."
 zin_ftext_isle_tide:0 "The ancestor-faith of Asgard, kept by the tide-mothers."
 zin_ftext_kindred_song:0 "The reverence of the elves, kept by loremasters and song-wardens."
 zin_ftext_lake_litany:0 "The lake-shrine faith of the Lake Road cities, read by lake-readers."
 zin_ftext_lamp_furrow:0 "The folk faith of most households in the Middle Lands and beyond. It has no priests."
 zin_ftext_mourning_dust:0 "The mourning customs of the Ember Lands coast, kept by grave-wives."
 zin_ftext_none:0 "No faith is recorded."
 zin_ftext_noon_pilgrimage:0 "The faith of the Sunhot sanctuaries, kept by sanctuary-wardens and Keepers of the Noon."
 zin_ftext_old_knots:0 "The oldest faith of the Orran folk, kept by cord-mothers."
 zin_ftext_pact_rite:0 "The dark rite of the Nether, kept by pact-heralds."
 zin_ftext_rain_mirror:0 "The vigil of Gala, kept by the keepers of the Mirror."
 zin_ftext_ransom_tide:0 "The law-faith of the corsair isles, kept by tide-judges."
 zin_ftext_red_hearth:0 "The clay-faith of the Red Lands, kept by kiln-mothers."
 zin_ftext_river_temples:0 "The faith of the river kings, served by temple scribes and flood-priests."
 zin_ftext_river_wardens:0 "A faith of ford-wardens, who are also magistrates."
 zin_ftext_scale_creed:0 "The trade-faith of Stabilo, kept by weighers who also judge contracts."
 zin_ftext_skull_fire:0 "The ancestor-faith of the orc clans, led by Fire-Speakers."
 zin_ftext_stone_hunger:0 "The faith of the troll tribes. It has no priests."
 zin_ftext_stone_vigil:0 "A faith of duty on the Great Wall and the marches."
 zin_ftext_storm_court:0 "A faith of wind-readers and storm-speakers."
 zin_ftext_strait_litany:0 "The sea-faith of the Narrow Strait, with a litany-singer in each fleet."
 zin_ftext_tide_charts:0 "The wayfinders' faith of Triton's Islands."
 zin_ftext_tide_skull:0 "The sea-faith of the orc skerries, kept by salt-priests."
 zin_ftext_unknown:0 "No faith is recorded."
 zin_ftext_warden_vigil:0 "The watch-faith of Mirolon, led by vigil-captains."
 zin_ftext_warren_luck:0 "The lamp-faith of the goblin warrens. The loudest goblin keeps the lamp."
 zin_ftext_wave_tally:0 "The ancestor-faith of the southern reefs, kept by tally-keepers."
 zin_ftext_well_oath:0 "The desert law-faith of Noris, kept by well-lords and well-wives."
 zin_ftext_winter_hearth:0 "The ancestor-faith of the cold north, kept by fire-keepers."
 zin_ftext_yeti_hum:0 "The faith of the yeti, kept by hum-keepers in the caves."
