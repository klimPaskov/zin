 zin_ctext_buldor_companies:0 "Hired companies of Buldor, who recruit from every clan. A fallen banner ends a company."
 zin_ctext_caravan_princes:0 "Merchant houses of Stabilo who rule the caravan roads. Their law is contract and their weights are honest."
 zin_ctext_chart_islanders:0 "Wayfinders and chart-houses of Triton's Islands. They sell their charts and keep their reefs."
 zin_ctext_corsair_lords:0 "Sword-lords of the cliff harbours. The isle's best captain wears its crown."
 zin_ctext_dondor_brutes:0 "Clan-moot kings and iron-halls of Dondor. They tax the iron road and leave magic to the Fire-speakers."
 zin_ctext_ember_lands_freeholds:0 "Salt-pan and fishing freeholds of the Ember Lands coast. They do not speak of what lies to the south."
 zin_ctext_forest_council_elves:0 "The great elven houses of the Magical Forest. They hold no crown and keep a book of precedents."
 zin_ctext_free_crowns_north:0 "Small kingdoms of the inland North, each ruled by a king with a council of landowners."
 zin_ctext_gala_court:0 "The ageless court of Gala under King Lorien. They keep their dead in memory and their counsel quiet."
 zin_ctext_girdon_wardens:0 "Ford-wardens and bridge-towns of the Girdon rivers."
 zin_ctext_goblin_warrens:0 "Tunnel-dwelling goblins under the orc holds. They sell lamps and traps to those above."
 zin_ctext_goodin_sunfolk:0 "Farmers of the sunlit guest-towns who live among the Sunhot elves."
 zin_ctext_grave_hosts:0 "The dead and the living of Volgan's Dominion, led by his chosen captains. Mass hosts follow the dirge-drum."
 zin_ctext_gunwaith_clans:0 "Hill clans of Gunwaith, whose kings are acclaimed at a standing stone. The chiefs hold the real power."
 zin_ctext_hill_giants:0 "Giants of Hiloron who count years by stones, led by a High Chief of the cairn-keepers."
 zin_ctext_hill_kingdom_elves:0 "Elves of the hill halls, ruled by queens and kings whom the hall-keepers accept. They know dragon-craft best."
 zin_ctext_ice_clans:0 "Reindeer clans and sled-bands of the Cold Lands, ruled by chieftains of the moot."
 zin_ctext_ice_giants:0 "Giants of Titanos who carve ice and ivory. They honour the cold as an elder spirit."
 zin_ctext_iron_clans:0 "Orc holds of the iron hills. A shared battle-horn calls their levies."
 zin_ctext_isengard_warlords:0 "Warlords of the iron forts, bound by oath-companies. They suspect every hedge-wise."
 zin_ctext_isle_houses:0 "Seafaring houses of Asgard, led by their eldest women. They know the central sea as a neighbour."
 zin_ctext_kilinti_ents:0 "The ents of Kilinti Forest. A few men live at its edge and keep its accounts."
 zin_ctext_lake_aenoran:0 "Farmers, bargemen and scribes of the Great Lake, the best-fed folk of Aoaz. They keep written law and ring a bell for every order."
 zin_ctext_lake_elves:0 "Boat-archers and healers of the elven lakes, led by the Speaker of the water-houses."
 zin_ctext_lake_road_cities:0 "Lake towns on the road from the East to the Great Wall. They have kings in Ostoroth and speakers in Mora."
 zin_ctext_leren_sea_kings:0 "Sea-lords of the Narrow Strait. One High Crown rules two realms, and a Speakers' Hall counts the ships."
 zin_ctext_march_folk:0 "Free farmers of the southern marches, led by elected speakers. They plough with a sling at the belt."
 zin_ctext_mirolon_wardens:0 "Wardens of the lake and the northern passes, chosen for life by their captains."
 zin_ctext_netherborn:0 "The demon realms of the Nether, each ruled by a Lord or Queen bound to a pact."
 zin_ctext_noris_riders:0 "Camel warriors of the Noris desert, led by the well-lords. They count their seasons by caravans."
 zin_ctext_pass_wardens:0 "Mountain archers and ropemen who have held the Nolorim passes for centuries."
 zin_ctext_red_lands_tribunes:0 "Clay-working villages of the Red Lands, led by tribunes chosen by the village heads."
 zin_ctext_redbark_tribes:0 "Clans of the Bloody Forest, led by cord-mothers. They paint themselves red and bow to no crown."
 zin_ctext_rift_coast_elves:0 "Sea-archers and lantern-keepers of the Rift coast, led by the wardens of each shore."
 zin_ctext_river_kings:0 "Kings of the river lands, named for their rivers and advised by temple scribes."
 zin_ctext_sea_orcs:0 "Orc boarders of the skerries and the cliff harbours."
 zin_ctext_selen_ranger:0 "Rangers of the Selen woods, ruled by moots. They ask the wood before they loose an arrow."
 zin_ctext_southern_islanders:0 "Reef and lagoon islanders of the south. They count their dead as waves on the reef."
 zin_ctext_steppe_rider:0 "Horse-lords of Konori and Hunhun. Their land belongs to the herds, and their word to the horse they swear on."
 zin_ctext_sunhot_isles:0 "Sunhot elves of the eastern isles, who sit at the Council of the Chain."
 zin_ctext_sunhot_light:0 "Sunhot elves of the Lands of Light, led by a Radiant Speaker whom the sanctuaries choose."
 zin_ctext_sunhot_western:0 "Sunhot realms of the western sanctuaries, each led by a Speaker its sanctuary chooses."
 zin_ctext_troll_tribes:0 "Bog-dwelling trolls of the Troll Forest, who heap stones at their borders."
 zin_ctext_unknown:0 "No culture is recorded."
 zin_ctext_veiled_folk:0 "A veiled people of the Cursed Lands. They trade little and forgive nothing."
 zin_ctext_volcano_clans:0 "Orc clans of the fire-mountain, led by a warking whom the chiefs acclaim."
 zin_ctext_wall_folk:0 "Watch-families of the Great Wall. They keep its gates in the king's name."
 zin_ctext_western_guilds:0 "Guild towns of the western coast. They trade across the central sea and hire others to fight."
 zin_ctext_wild_holds:0 "Orc holds of the wild hills, with no council and no priest."
 zin_ctext_windwaith_seafarers:0 "Captains of the Windwaith headlands. They read the wind the way others read letters."
 zin_ctext_winter_crown:0 "The Winter Crown of the Cold Lands and its clan-fire keepers. They count the year in dark and light."
 zin_ctext_yeti_clans:0 "Furred clans of the Yeti Lands. Their names are sung at the winter gathering."
 zin_ctext_zilin_pilgrims:0 "Keepers of the pilgrim hostels in the Zilin Hills. They copy books, make salves and welcome all."
 zin_ctext_zols_dead:0 "The numbered hosts of Zol's Mistake. No tongue is recorded for them, and no rite."
 zin_culture_buldor_companies:0 "The Company Contract"
 zin_culture_buldor_companies_desc:0 "A company is its banner and its contract. Veterans drill quickly and cost much to keep."
 zin_culture_caravan_princes:0 "The Bench of Houses"
 zin_culture_caravan_princes_desc:0 "A bench of merchant houses chooses the Prince and keeps the purse. Contracts are sealed, and hired companies fight them."
 zin_culture_chart_islanders:0 "The Chartmakers' Gift"
 zin_culture_chart_islanders_desc:0 "To chart a reef is a gift to every sailor to come. The chart-houses trade pearls and knowledge."
 zin_culture_corsair_lords:0 "The Ransom Law"
 zin_culture_corsair_lords_desc:0 "A captive is ransomed or lost to the sea. Corsair lords take what they can and sell it back."
 zin_culture_dondor_brutes:0 "The Blood-Price"
 zin_culture_dondor_brutes_desc:0 "A death is paid for in iron or in blood. Axe-men fight in mail behind shield walls and trust no spell."
 zin_culture_ember_lands_freeholds:0 "Salt and Silence"
 zin_culture_ember_lands_freeholds_desc:0 "Freeholders bury quickly, tax lightly and avoid war. The sun and the salt have made them hard."
 zin_culture_forest_council_elves:0 "The Council of Houses"
 zin_culture_forest_council_elves_desc:0 "The houses vote, the First Speaker serves for centuries, and the book of precedents is renewed each hundred years. The council is slow, learned and gentle."
 zin_culture_free_crowns_north:0 "The Crown-Sharing Marriages"
 zin_culture_free_crowns_north_desc:0 "Neighbouring kings marry across their borders and take their feuds to Eekedor. Wars start slowly, and levies stay small."
 zin_culture_gala_court:0 "The King's Memory"
 zin_culture_gala_court_desc:0 "The king reigns as long as he wills, and the keepers' rolls hold his law. Gala remembers Dardan and does not forget."
 zin_culture_girdon_wardens:0 "The River Court"
 zin_culture_girdon_wardens_desc:0 "Ford-wardens judge the river towns and keep every bridge in repair. A river militia digs in fast on its own bank."
 zin_culture_goblin_warrens:0 "The Loud and the Clever"
 zin_culture_goblin_warrens_desc:0 "The loudest, cleverest goblin leads until someone cleverer arrives. Traps, slings and tunnels do the fighting."
 zin_culture_goodin_sunfolk:0 "The Guest-Town Peace"
 zin_culture_goodin_sunfolk_desc:0 "Guest-towns shelter every pilgrim, and their elders settle disputes by agreement. The Sunfolk do not march to war."
 zin_culture_grave_hosts:0 "The Dirge-Drum"
 zin_culture_grave_hosts_desc:0 "The hosts march to the drum and answer to Volgan. They count their dead by name and do not leave the field."
 zin_culture_gunwaith_clans:0 "The Lawspeaker's Memory"
 zin_culture_gunwaith_clans_desc:0 "Oaths are sworn at the stone and remembered by the Lawspeaker. Clan bands ride and fight for kin and for wergild."
 zin_culture_hill_giants:0 "The Cairn-Count"
 zin_culture_hill_giants_desc:0 "A dispute is judged by which side can name the older cairn. Giants quarry stone and raise walls that outlast kings."
 zin_culture_hill_kingdom_elves:0 "The Hall of Judgments"
 zin_culture_hill_kingdom_elves_desc:0 "A hall's book of judgments is read aloud each spring. Hill rangers walk the ledges and read the signs of dragons."
 zin_culture_ice_clans:0 "The Winter Moot"
 zin_culture_ice_clans_desc:0 "Feuds are settled before the Long Dark begins. The clans move fast on ice and live hard on little."
 zin_culture_ice_giants:0 "The Frost-Throne"
 zin_culture_ice_giants_desc:0 "A Frost-King sits an ice throne chosen by the cairn-keepers. The cold itself is an old and patient ally."
 zin_culture_iron_clans:0 "The Free Moot of the Holds"
 zin_culture_iron_clans_desc:0 "Each hold keeps its iron and sends its chief to the moot to settle tolls and prices. Mail and chain go out by the bar."
 zin_culture_isengard_warlords:0 "The Oath-Companies"
 zin_culture_isengard_warlords_desc:0 "The best sworn man inherits the hall, not the eldest son. Mailed foot hold the mountain forts."
 zin_culture_isle_houses:0 "The Tide-Mother's Law"
 zin_culture_isle_houses_desc:0 "The eldest woman of each house speaks for it, and daughters inherit. The island houses learn the sea early and watch it long."
 zin_culture_kilinti_ents:0 "The Last-Speaking Moot"
 zin_culture_kilinti_ents_desc:0 "The Eldest speaks last, and a moot may take three years to say one sentence. The forest is slow to rouse and nearly impossible to break."
 zin_culture_lake_aenoran:0 "Peace of the One Crown"
 zin_culture_lake_aenoran_desc:0 "No lord may wage war for his own quarrel, and written law binds every house. Scribes, bells and barges keep the Lake's realms learned and slow to anger."
 zin_culture_lake_elves:0 "The Water-Court"
 zin_culture_lake_elves_desc:0 "A court of the water-houses judges disputes about weirs and boats. Dowsers and healers keep the lake-fevers away."
 zin_culture_lake_road_cities:0 "The Road of Lanterns"
 zin_culture_lake_road_cities_desc:0 "Fishers and merchants share the water and the law. The lake towns grow with every caravan."
 zin_culture_leren_sea_kings:0 "The Speakers' Tolls"
 zin_culture_leren_sea_kings_desc:0 "Shipowners vote the taxes, and the strait pays its tolls. The Leren read the sea as a ledger."
 zin_culture_march_folk:0 "Beacon and Plough"
 zin_culture_march_folk_desc:0 "Free farmers raise a levy at the beacon's call. Every farm is a post, and every beacon buys a day."
 zin_culture_mirolon_wardens:0 "The Beacon Roll"
 zin_culture_mirolon_wardens_desc:0 "Every tower keeps a lamp lit toward the south, and every warden keeps a night watch. Scouts and couriers see a host long before it comes."
 zin_culture_netherborn:0 "The Pact-Name"
 zin_culture_netherborn_desc:0 "Each lord keeps a pact and a pact-name, and oaths are sealed in blood and ash. The Netherborn are few and fearless."
 zin_culture_noris_riders:0 "The Well-Law"
 zin_culture_noris_riders_desc:0 "Water is never refused, and one who seals a well is cast out. Camel-riders cross the sand where armies thirst."
 zin_culture_pass_wardens:0 "The Watch-Roll"
 zin_culture_pass_wardens_desc:0 "Each fort keeps a roll of its watch-houses, and a pass stays closed until the warden's vigil breaks. Little passes, and little is sold."
 zin_culture_red_lands_tribunes:0 "The Tribune's Year"
 zin_culture_red_lands_tribunes_desc:0 "A tribune holds office for one year and swears his oath again. The kilns never cool."
 zin_culture_redbark_tribes:0 "The Red Raid"
 zin_culture_redbark_tribes_desc:0 "Clans choose a war-chief for each raid and fight light and fast. They take iron where they find it and refuse every charter."
 zin_culture_rift_coast_elves:0 "The Lantern Towers"
 zin_culture_rift_coast_elves_desc:0 "Light-singers on the towers signal any crossing of the rift. Lantern, dye and salt cross the water to the river kings."
 zin_culture_river_kings:0 "The Scribe-Council"
 zin_culture_river_kings_desc:0 "Temple scribes record the flood and the king's decrees. The river lends grain, and the temples lend their wizards."
 zin_culture_sea_orcs:0 "The Tide-Ring"
 zin_culture_sea_orcs_desc:0 "A sea-chief rules by voyages won, and captains meet in council on the Lestern Isles. Boarders with hooks take ships whole."
 zin_culture_selen_ranger:0 "The Quiet Law"
 zin_culture_selen_ranger_desc:0 "No bow is drawn in the Hallow Month, and no ranger shoots from rank. The woods are known, and the rangers wait in them."
 zin_culture_southern_islanders:0 "The Feast and the Elder"
 zin_culture_southern_islanders_desc:0 "Each harbour shares its catch at the feast, and its elder's word ends a dispute. War is rare and soon over."
 zin_culture_steppe_rider:0 "The Rider's Oath-Law"
 zin_culture_steppe_rider_desc:0 "A dispute is paid in mares, and a rider's herd feeds his host. Riders go far and build little."
 zin_culture_sunhot_isles:0 "The Council of the Chain"
 zin_culture_sunhot_isles_desc:0 "Quarrelling isles send their quarrel to the Lands of Light. Sea-law and sanctuary-law keep the harbours at peace."
 zin_culture_sunhot_light:0 "The Keepers of Noon"
 zin_culture_sunhot_light_desc:0 "The tall guards stand in doorways and do not march. Warmth heals, and light turns the stranger aside."
 zin_culture_sunhot_western:0 "The Open Door"
 zin_culture_sunhot_western_desc:0 "No weapon passes a sanctuary door, and every pilgrim road is kept open. The realms argue at the Council and seldom fight."
 zin_culture_troll_tribes:0 "The Eldest Unbeaten"
 zin_culture_troll_tribes_desc:0 "The oldest troll who has not been beaten leads, and the loser feeds the tribe. They throw stones and fear fire."
 zin_culture_veiled_folk:0 "The Cord-Mothers' Hush"
 zin_culture_veiled_folk_desc:0 "Debts and feuds are tied and untied on the cord, and strangers are not welcome. No charter has ever been read here."
 zin_culture_volcano_clans:0 "The Warking's Ring"
 zin_culture_volcano_clans_desc:0 "A warking holds the throne until a stronger orc breaks him in the ring. Hooked axes and war-beasts follow whoever wins."
 zin_culture_wall_folk:0 "The Watch-Family Posts"
 zin_culture_wall_folk_desc:0 "A post passes to the eldest of a watch-family, and a breach of watch is a hanging matter. The Wall is held with patience and drill."
 zin_culture_western_guilds:0 "The Guild Book"
 zin_culture_western_guilds_desc:0 "Contracts are sworn on the guild book and enforced by the guild council. The towns hire their wars and pay for their workshops."
 zin_culture_wild_holds:0 "The Hold's Own Way"
 zin_culture_wild_holds_desc:0 "A hold has a chief by strength and splits when it grows too big. Raiders trust charms and sell nothing."
 zin_culture_windwaith_seafarers:0 "The Ship-Share"
 zin_culture_windwaith_seafarers_desc:0 "Land is held by share in a ship, and a Council of Captains elects its Speaker. Windwaith ships range far for timber and whalebone."
 zin_culture_winter_crown:0 "The Hearth-Law"
 zin_culture_winter_crown_desc:0 "No feud may be carried past a shared fire. The Long Dark is met by clans bound together."
 zin_culture_yeti_clans:0 "The Far-Carrying Song"
 zin_culture_yeti_clans_desc:0 "The clan follows the Eldest whose song carries furthest. Yeti hold the mountain at dusk and raid in winter."
 zin_culture_zilin_pilgrims:0 "The Hostel Rule"
 zin_culture_zilin_pilgrims_desc:0 "No weapon passes the hostel gate, and every traveller finds a bed and a lamp. The pilgrim valleys heal what the roads break."
 zin_culture_zols_dead:0 "Hosts Without Number"
 zin_culture_zols_dead_desc:0 "Numbered hosts march where Zol wills, and ordinary weapons do not end them. They build nothing and learn nothing."
 zin_culture2_buldor_companies:0 "Kin: Buldor Companies"
 zin_culture2_buldor_companies_desc:0 "A lesser share of this realm keeps the ways of Buldor Companies. Their custom counts at half strength."
 zin_culture2_caravan_princes:0 "Kin: Caravan Princes"
 zin_culture2_caravan_princes_desc:0 "A lesser share of this realm keeps the ways of Caravan Princes. Their custom counts at half strength."
 zin_culture2_chart_islanders:0 "Kin: Chart-Islanders"
 zin_culture2_chart_islanders_desc:0 "A lesser share of this realm keeps the ways of Chart-Islanders. Their custom counts at half strength."
 zin_culture2_corsair_lords:0 "Kin: Corsair Lords"
 zin_culture2_corsair_lords_desc:0 "A lesser share of this realm keeps the ways of Corsair Lords. Their custom counts at half strength."
 zin_culture2_dondor_brutes:0 "Kin: Dondor Brutes"
 zin_culture2_dondor_brutes_desc:0 "A lesser share of this realm keeps the ways of Dondor Brutes. Their custom counts at half strength."
 zin_culture2_ember_lands_freeholds:0 "Kin: Ember Lands Freeholders"
