l_english:
 zin_leren_appeal_heard:0 "Our appeal to the treaty was heard"
 zin_leren_appeal_to_the_treaty:0 "Appeal to the Treaty"
 zin_leren_appeal_to_the_treaty_desc:0 "Send a clerk to Parim with the sealed text of 4A 512 and ask the court to keep what it swore."
 zin_leren_charter_trade:0 "Compact Trade Charters"
 zin_leren_charter_trade_desc:0 "Charters of easy passage bind the small crowns' merchants to the quays of Sonargur."
 zin_leren_close_the_strait:0 "Close the Strait"
 zin_leren_close_the_strait_desc:0 "Draw the chain of Sonargur across the water against one realm's ships. Its fleets will wait for the weather and for us."
 zin_leren_compact:0 "The Leren Compact"
 zin_leren_compact_desc:0 "Envoys, charters, marriages and banners: the courting of the smaller crowns of the North and of the Dark Shore."
 zin_leren_compact_kin:0 "Sworn to the Leren Compact"
 zin_leren_envoys_mocked:0 "Our envoys were laughed out of the court"
 zin_leren_grievance_1716:0 "The Grievance of 1716"
 zin_leren_grievance_1716_desc:0 "In 4A 1716 the envoys of Sonargur were laughed out of Parim. The court of Sonargur has not forgotten it."
 zin_leren_grievance_unanswered:0 "An Insult Unanswered"
 zin_leren_grievance_unanswered_desc:0 "Parim laughed again. The North remembers every laugh, and the shipmasters curse the Golden Court by name."
 zin_leren_hegemony_mod:0 "The Lead of Sonargur"
 zin_leren_invite_to_compact:0 "Invite to the Leren Compact"
 zin_leren_invite_to_compact_desc:0 "Offer a crown a seat among the Compact's members, with the shield of Sonargur over it in return for its oath."
 zin_leren_keepers_of_the_strait:0 "Keepers of the Strait"
 zin_leren_keepers_of_the_strait_desc:0 "Our galleys hold both shores of the water and know every reef of it. No raider crosses unseen."
 zin_leren_marriage_pact:0 "Seal a Marriage Pact"
 zin_leren_marriage_pact_desc:0 "Wed a daughter or a cousin of the royal house into a smaller crown. Such ties outlast many treaties."
 zin_leren_marriage_ties:0 "Joined by a marriage of the houses"
 zin_leren_offer_protection:0 "Offer the Protection of Sonargur"
 zin_leren_offer_protection_desc:0 "Offer a crown the king's protection. It will give up its own banner for it, as many have before."
 zin_leren_send_envoys:0 "Send Envoys"
 zin_leren_send_envoys_desc:0 "Send an envoy with gifts and a letter in the king's hand to the court of a smaller crown."
 zin_leren_strait:0 "The Narrow Strait"
 zin_leren_strait_closed:0 "The Strait Is Closed"
 zin_leren_strait_closed_desc:0 "The chain of Sonargur is across the water. Our ships find the sea shorter and the harbours dearer."
 zin_leren_strait_closed_on_us:0 "The strait was closed against us"
 zin_leren_strait_desc:0 "The dues of the strait, the old treaty with Aenor and the chain that can close the water."
 zin_leren_strait_dues:0 "The Strait Dues"
 zin_leren_toll_lower:0 "Lower the Strait Dues"
 zin_leren_toll_lower_desc:0 "Ease the dues at Sonargur by one step. The shipmasters bless the king, and the treaty breathes easier."
 zin_leren_toll_raise:0 "Raise the Strait Dues"
 zin_leren_toll_raise_desc:0 "Lift the dues at Sonargur by one step. The treasury fills, the merchants grumble, and Parim notices."
 zin_leren_trade_charter:0 "Grant a Compact Trade Charter"
 zin_leren_trade_charter_desc:0 "Open Sonargur's quays to the ships of a crown on easy terms. Our merchants pay a little, and the crown remembers it."
 zin_leren_treaty_broken:0 "The Treaty of the Narrow Strait torn"
 zin_leren_treaty_broken_faith:0 "Broken Faith"
 zin_leren_treaty_broken_faith_desc:0 "The North no longer trusts the treaty. It binds us to Parim and gives us nothing, the captains say."
 zin_leren_treaty_partner:0 "Partner in the Treaty of the Narrow Strait"
 zin_leren_treaty_torn:0 "The Treaty Torn"
 zin_leren_treaty_torn_desc:0 "The oath of 4A 512 lies in pieces. The court is angry, proud and hungry, and the year is not one for gentle counsel."
 zin_leren_treaty_trusted:0 "The Treaty Trusted"
 zin_leren_treaty_trusted_desc:0 "Both courts keep the Treaty of the Narrow Strait in good faith, and the North counts on its old friend."
 zin_leren_union:0 "The Union of the Two Crowns"
 zin_leren.10.a:0 "The debt is still owed"
 zin_leren.10.b:0 "Let old ledgers lie"
 zin_leren.10.d:0 "The clerks of Sonargur have carried the toll rolls up from the cellar and laid them before the king. In a hand grown brown with age, they show what Aenoran ships should have paid in 4A 1716, and what Parim's court said when the envoys asked for it."
 zin_leren.10.t:0 "The Toll Rolls of 1716"
 zin_leren.11.a:0 "Pay redress"
 zin_leren.11.b:0 "Send the case to Eekedor for judgement"
 zin_leren.11.c:0 "Laugh them out of the Golden Court"
 zin_leren.11.d:0 "Envoys from Sonargur stand in the Golden Court with the toll rolls under their arms. They ask for the dues that Aenoran ships have never paid in full at the strait, and for an apology for the laughter of 4A 1716. The courtiers are watching to see what the crown will do."
 zin_leren.11.t:0 "Leren Envoys Demand Redress"
 zin_leren.12.a:0 "Parim has paid the old debt"
 zin_leren.12.b:0 "Parim has laughed again"
 zin_leren.12.c:0 "Eekedor will judge between us"
 zin_leren.12.d:0 "The envoys have come home from Parim, and the king has asked them to say nothing until they stand before him. The court of Sonargur waits to hear what the Golden Court has replied."
 zin_leren.12.d_mocked:0 "The envoys have come home from Parim without silver and without an answer. They were laughed at in the great hall, as their grandfathers were, and they have told the whole story to the harbour taverns."
 zin_leren.12.d_redressed:0 "The envoys have come home from Parim with silver in their chests and an apology under the seal of the crown. The Grievance of 1716 is answered at last, and the court of Sonargur is quietly astonished."
 zin_leren.12.t:0 "Parim's Answer"
 zin_leren.13.a:0 "The bench rules for Sonargur"
 zin_leren.13.b:0 "The bench rules for Parim"
 zin_leren.13.d:0 "The bench of Eekedor has heard both courts and gives its ruling at last. It finds that Aenor's ships owe the strait no more than the treaty fixed, and the grievance of 4A 1716 is not a debt the bench can enforce."
 zin_leren.13.d_won:0 "The bench of Eekedor has heard both courts and gives its ruling at last. It finds for Sonargur: Aenor's ships have paid less than the treaty asks, and the laughter of 4A 1716 was an insult to the king's envoys."
 zin_leren.13.t:0 "The Arbitration of Eekedor"
 zin_leren.15.a:0 "Seize the cargo"
 zin_leren.15.b:0 "Waive the toll"
 zin_leren.15.c:0 "Refer it to Parim"
 zin_leren.15.d:0 "An Aenoran merchantman has sailed past the chain at Sonargur without paying. Her master says the dues are against the treaty, and the harbour watch is waiting for the king's word."
 zin_leren.15.t:0 "A Merchantman Refuses the Toll"
 zin_leren.20.a:0 "Ask for time"
 zin_leren.20.b:0 "Refuse"
 zin_leren.20.c:0 "Honour the oath"
 zin_leren.20.d:0 "A rider from Parim stands in the hall of Sonargur. Aenor is at war, and the crown asks the North to keep the oath of 4A 512 and come to its defence. The king looks at the rider, then at his captains, and asks them for counsel."
 zin_leren.20.t:0 "Aenor Calls on the Treaty"
 zin_leren.21.a:0 "So the North has spoken"
 zin_leren.21.d:0 "Sonargur has answered Aenor's call to the treaty. The riders who carried it are back at the gate of the Golden Court, and the council waits for them."
 zin_leren.21.t:0 "The North Answers"
 zin_leren.50.a:0 "The fishermen should be heard"
 zin_leren.50.d:0 "The fishermen of the northern coast tell the same tale in a dozen harbours. Black hulls with no lamp aboard, moving among the islands by night against the wind. The captains of Sonargur laugh at them, but they do not laugh as loudly as they did last year."
 zin_leren.50.t:0 "Black Ships Among the Islands"
 zin_leren.55.a:0 "The strait is barred"
 zin_leren.55.d:0 "The chain of Sonargur and the forts of the far shore are held by one hand, and no ship passes the Narrow Strait without the king's leave. The hall of Sonargur calls it the Barred Strait."
 zin_leren.55.t:0 "The Strait Barred"
 zin_leren.60.a:0 "Long live the Sovereign"
 zin_leren.60.d:0 "The king of Lerendor has been crowned on the harbour chain of Sonargur. He holds both shores of the strait, and he calls himself Sovereign of the Narrow Sea. The old treaty is a scrap in the archive."
 zin_leren.60.t:0 "Sovereign of the Narrow Sea"
 zin_leren.70.a:0 "Join the Compact"
 zin_leren.70.b:0 "Decline the invitation"
 zin_leren.70.d:0 "A herald of the king of Lerendor has come with a banner and a scroll. Sonargur offers a seat in the Leren Compact, with the shield of the North over us in return for our oath. The scroll says nothing of the price."
 zin_leren.70.t:0 "An Invitation from Sonargur"
 zin_leren.71.a:0 "Accept the protection of Sonargur"
 zin_leren.71.b:0 "Refuse the offer"
 zin_leren.71.d:0 "The king of Lerendor offers to take our crown under his shield. Our banner would stand beside his, and his captains would answer for our borders. He asks only that we do as his court advises."
 zin_leren.71.t:0 "Sonargur Offers Protection"
 zin_leren.72.a:0 "The answer is noted"
 zin_leren.72.d:0 "The envoys have returned to Sonargur from the court of the smaller crown. The king's council gathers to hear what they were told."
 zin_leren.72.t:0 "Answer from the North"
 zin_leren.80.a:0 "Grant the estates' petition"
 zin_leren.80.b:0 "Hold firm"
 zin_leren.80.d:0 "The inland lords of Lerenwaith have come to the hall of Sonargur. They pay for the strait captains' quarrels and are heard in no council, and they want the old charters read aloud and a seat for every river-town. The king has not seen them so angry in many years."
 zin_leren.80.t:0 "The Lerenwaith Question"
 zin_leren.81.a:0 "One throne, one table"
 zin_leren.81.d:0 "At the midsummer feast the lords of Lerenwaith and the captains of the strait drank from one cup. Old men say the two crowns have not sat so easily on one head since the wedding that joined them."
 zin_leren.81.t:0 "One Throne Again"
 zin_leren.90.a:0 "The chain holds"
 zin_leren.90.d:0 "The chain of Sonargur has been drawn across the water against our ships. Our captains will wait out the season in other harbours, and our merchants are already counting the cost."
 zin_leren.90.t:0 "The Strait Is Closed"
 ZIN_RULE_LEREN_ROUTE:0 "Lerendor's Course (AI)"
 ZIN_RULE_LEREN_ROUTE_DEFAULT:0 "Follow the Path"
 ZIN_RULE_LEREN_ROUTE_DEFAULT_DESC:0 "Follows the rule for the path of the story: the historical path breaks the treaty at the war; the others weigh the three roads."
 ZIN_RULE_LEREN_ROUTE_DESC:0 "Decides which road Lerendor's AI follows through the Treaty of the Narrow Strait. A player's Lerendor is never steered."
 ZIN_RULE_LEREN_ROUTE_FREE:0 "Free Course"
 ZIN_RULE_LEREN_ROUTE_FREE_DESC:0 "Lerendor's AI weighs its standing, its court and its lead over the North, and takes the road that suits it."
 ZIN_RULE_LEREN_ROUTE_HISTORICAL:0 "The North Stands Apart"
 ZIN_RULE_LEREN_ROUTE_HISTORICAL_DESC:0 "Lerendor's AI breaks the treaty when the war comes and keeps out of Aenor's wars."
 ZIN_RULE_LEREN_ROUTE_HONOUR:0 "Honour the Treaty"
 ZIN_RULE_LEREN_ROUTE_HONOUR_DESC:0 "Lerendor's AI keeps the old alliance and comes to Aenor's defence."
 ZIN_RULE_LEREN_ROUTE_SUPREMACY:0 "Mastery of the Strait"
 ZIN_RULE_LEREN_ROUTE_SUPREMACY_DESC:0 "Lerendor's AI tears up the treaty and uses the war to make the North master of the strait."
