l_english:
 autonomy_puppet_desc:0 "A realm that lost a war to its liege and now serves it. Its levies and coin flow to the liege, and it may not make war alone."
 faction_manpower_sharing1:0 "Common Muster"
 faction_manpower_sharing1_desc:0 "A twentieth of each member's levies serves the league's garrisons."
 faction_manpower_sharing2:0 "Shared Roads and Watchers"
 faction_manpower_sharing2_desc:0 "A tenth of each member's levies serves the league's garrisons."
 faction_manpower_sharing3:0 "Joint Watch"
 faction_manpower_sharing3_desc:0 "A seventh of each member's levies serves the league's garrisons."
 forced_labor_occupation_desc:0 "The conquered owe a tithe of every harvest and a levy of every village. The land gives much and loves its masters little."
 harsh_quotas_occupation_desc:0 "A garrison holds the roads and the tollgates. The conquered pay in grain and iron, and no more is asked of them."
 manpower_contribution_full_enable:0 "No Common Muster"
 manpower_contribution_full_enable_desc:0 "The members keep all their levies for their own lords."
 RULE_DESC_ZIN_SUBJECT:0 "$DESC$ (A subject of a liege)"
 zin_autonomy_chartered_dominion:0 "Chartered Dominion"
 zin_autonomy_chartered_dominion_desc:0 "A dominion bound to the crown by the Charters of Parim. It governs itself, trades with its liege first and answers the common muster."
 zin_autonomy_eastern_client:0 "Eastern Client"
 zin_autonomy_eastern_client_desc:0 "A court that knelt to the King of the East. It keeps its throne and its freedom to fight, and pays its liege in trade."
 zin_autonomy_protectorate:0 "Protectorate"
 zin_autonomy_protectorate_desc:0 "A small realm that a stronger neighbour guards by an old promise. It keeps its own moot and its own fields, and the guardian answers for its borders."
 zin_autonomy_sworn_realm:0 "Sworn Realm"
 zin_autonomy_sworn_realm_desc:0 "A realm that swore its oath to Volgan. Its host, its levies and its coin serve the Southern Dominion."
 zin_autonomy_tributary_hold:0 "Tributary Hold"
 zin_autonomy_tributary_hold_desc:0 "An orc hold that bent the knee to Goldoroth. It sends tribute and levies and keeps its own fires."
 zin_cb_against_the_dark:0 "Against the Dark"
 zin_cb_against_the_dark_desc:0 "While the Dark gathers, every honest crown has cause to take up arms against the dark powers and their servants."
 zin_cb_broken_truce:0 "The Truce Is Broken"
 zin_cb_broken_truce_desc:0 "The Truce of the Grey Ford is broken, and the old quarrel between Gunwaith and Girdon lies open again."
 zin_cb_caravan_roads:0 "Blood on the Caravan Roads"
 zin_cb_caravan_roads_desc:0 "Blood was shed on the caravan roads, and Noris and Stabilo each hold the other to blame."
 zin_cb_crown_defied:0 "The Crown Defied"
 zin_cb_crown_defied_desc:0 "The Golden Court will not suffer defiance. The Cursed Lands and the Bloody Forest have defied it, and the crown has cause."
 zin_cb_eastern_ambition:0 "Eastern Ambition"
 zin_cb_eastern_ambition_desc:0 "Eastern courts that hold footholds in the Magical Lands claim a right to take more."
 zin_cb_free_east:0 "Free of the King of the East"
 zin_cb_free_east_desc:0 "Courts that refuse the King of the East have cause to strike at him and at the clients that knelt."
 zin_cb_high_king:0 "The High Crown of the East"
 zin_cb_high_king_desc:0 "Noris and Stabilo, marching to unite the East, may call the unwilling courts to account."
 zin_cb_hold_defiance:0 "A Hold Defies the Yoke"
 zin_cb_hold_defiance_desc:0 "Goldoroth has cause against any hold that refuses its tribute."
 zin_cb_old_grudge:0 "Old Grudge Remembered"
 zin_cb_old_grudge_desc:0 "The West remembers every slight Parim ever offered it, and has cause to answer."
 zin_cb_orc_raids:0 "Raids on the Dark Sea"
 zin_cb_orc_raids_desc:0 "Orc raids on the shores of the Sea of Darkness give the injured a just cause against those who sent them."
