 zin_court_balance:0 "Balance of the Court"
 zin_court_balance_left:0 "The Crown"
 zin_court_balance_left_range:0 "The Crown Ascendant"
 zin_court_balance_mid:0 "Even Scales"
 zin_court_balance_right:0 "The Council"
 zin_court_balance_right_range:0 "The Council Ascendant"
 zin_court_power_balance_1:0 "Interim Balance"
 zin_court_power_balance_2:0 "Interim Balance"
 zin_court_power_balance_3:0 "Interim Balance"
 zin_faction_concord:0 "Middle Kingdom Concord"
 zin_faction_concord_desc:0 "A common army in war, free roads in peace."
 zin_faction_dark_sea_accord:0 "Dark Sea Accord"
 zin_faction_dark_sea_accord_desc:0 "Defence against Goldoroth around the Sea of Darkness."
 zin_faction_free_crowns:0 "The Free Crowns"
 zin_faction_free_crowns_desc:0 "Eastern courts that will not kneel to the King of the East."
 zin_faction_free_dominions:0 "The Free Dominions"
 zin_faction_free_dominions_desc:0 "Dominions that broke from Parim and keep their charters for themselves."
 zin_faction_free_north:0 "The Free Crowns of the North"
 zin_faction_free_north_desc:0 "North Lands crowns that follow neither Sonargur nor Parim."
 zin_faction_free_steadings:0 "The Free Steadings"
 zin_faction_free_steadings_desc:0 "Cold Lands clans that answer to no crown."
 zin_faction_generic:0 "The League"
 zin_faction_generic_desc:0 "A league of free realms, raised by a script that named no template."
 zin_faction_goal_against_the_dark_desc:0 "Be at war with a dark power while the league holds every core state of its members."
 zin_faction_goal_against_the_dark_name:0 "Stand Against the Dark"
 zin_faction_goal_dominion_of_the_south_desc:0 "Raise Volgan's banner over the capital of Mirolon."
 zin_faction_goal_dominion_of_the_south_name:0 "The Dominion of the South"
 zin_faction_goal_grow_the_league_desc:0 "Bring two more realms under the league's banner than it numbered when it was founded."
 zin_faction_goal_grow_the_league_name:0 "Widen the League"
 zin_faction_goal_hold_the_line_desc:0 "Let no member lose a core state for a full year of war."
 zin_faction_goal_hold_the_line_name:0 "Hold the Line"
 zin_faction_kindred:0 "The Kindred of the Woods"
 zin_faction_kindred_desc:0 "A defensive league of the elven woods of the Magical Lands."
 zin_faction_leren_compact:0 "Leren Compact"
 zin_faction_leren_compact_desc:0 "The North's fleets and its command of the strait."
 zin_faction_lost_cause:0 "The Lost Cause"
 zin_faction_lost_cause_desc:0 "The league that rallies to the Heir."
 zin_faction_manifest_common_defence_desc:0 "Every dominion keeps faith with the Charters of Parim, so that a blow against one is a blow against all."
 zin_faction_manifest_common_defence_name:0 "Common Defence"
 zin_faction_manifest_cross_the_sea_desc:0 "The coast of the Middle Lands is the western host's first and last aim."
 zin_faction_manifest_cross_the_sea_name:0 "Cross the Sea"
 zin_faction_manifest_dominion_of_the_south_desc:0 "The Ember Lands lie under one banner, and that banner is Volgan's."
 zin_faction_manifest_dominion_of_the_south_name:0 "Dominion of the South"
 zin_faction_manifest_frozen_crown_desc:0 "One crown over the frozen interior, held by those who can bear its winter."
 zin_faction_manifest_frozen_crown_name:0 "The Frozen Crown"
 zin_faction_manifest_hold_the_dark_sea_desc:0 "Keep the shores of the Dark Lands out of Goldoroth's hands."
 zin_faction_manifest_hold_the_dark_sea_name:0 "Hold the Dark Sea"
 zin_faction_manifest_kindred_desc:0 "Not one grove of the Magical Lands is lost while the Kindred lives."
 zin_faction_manifest_kindred_name:0 "Every Tree Stands"
 zin_faction_manifest_lords_of_the_strait_desc:0 "The league holds the shores of the North Lands and the way through the strait."
 zin_faction_manifest_lords_of_the_strait_name:0 "Lords of the Strait"
 zin_faction_manifest_northern_roads_desc:0 "The caravan roads of the north and the wells of the desert, kept open and kept ours."
 zin_faction_manifest_northern_roads_name:0 "The Northern Roads"
 zin_faction_manifest_southern_roads_desc:0 "The caravan roads of the south and the markets at their ends, kept open and kept ours."
 zin_faction_manifest_southern_roads_name:0 "The Southern Roads"
 zin_faction_muster_group:0 "Garrison Levy"
 zin_faction_muster_group_desc:0 "Each member sends part of its levies to a shared garrison pool for the league."
 zin_faction_muster_none_desc:0 "The members keep all their levies for their own lords."
 zin_faction_noon_league:0 "The Noon League"
 zin_faction_noon_league_desc:0 "The sunlit realms stand together under the Noon Council."
 zin_faction_noris_treaty:0 "Noris Treaty"
 zin_faction_noris_treaty_desc:0 "The northern caravan roads and the desert."
 zin_faction_northern_accord:0 "Northern Accord"
 zin_faction_northern_accord_desc:0 "One crown over the frozen interior, and a check on Isengard."
 zin_faction_pupor_charter:0 "The Pupor Charter"
 zin_faction_pupor_charter_desc:0 "The chart houses of the Triton's Islands keep the sea-roads free. The Charter never declares war."
 zin_faction_rule_join_cold_lands:0 "Crowns of the Cold Lands"
 zin_faction_rule_join_concord:0 "Crowns of the Middle Lands and Their Vassals"
 zin_faction_rule_join_crossing:0 "Crowns of the West and the Isles"
 zin_faction_rule_join_dark_lands:0 "Holds of the Dark Lands"
 zin_faction_rule_join_east_lands:0 "Courts of the East Lands"
 zin_faction_rule_join_elven_kin:0 "Elven Realms of the Magical Lands"
 zin_faction_rule_join_free_dominions:0 "Dominions That Broke from Parim"
 zin_faction_rule_join_free_north:0 "Free Crowns of the North Lands"
 zin_faction_rule_join_free_steadings:0 "Clan Realms of the Cold Lands"
 zin_faction_rule_join_leren:0 "Crowns of the North and the Dark Shore"
 zin_faction_rule_join_lost_cause:0 "Those Who Honour the Heir"
 zin_faction_rule_join_no_refusal:0 "Realms Not Bound by the Elven Refusal"
 zin_faction_rule_join_not_shadow:0 "Realms Not of the Shadow"
 zin_faction_rule_join_pupor_charter:0 "Chart Houses of the Triton's Islands"
 zin_faction_rule_join_sun_realms:0 "Realms of the Lands of the Sun"
 zin_faction_rule_join_sworn:0 "Realms Sworn to the Southern Dominion"
 zin_faction_rule_join_warden_league:0 "Friends of the Warden League"
 zin_faction_southern_dominion:0 "Southern Dominion"
 zin_faction_southern_dominion_desc:0 "Volgan's dominion of the Ember Lands."
 zin_faction_stabilo_pact:0 "Stabilo Pact"
 zin_faction_stabilo_pact_desc:0 "The southern caravan roads."
 zin_faction_warden_league:0 "The Warden League"
 zin_faction_warden_league_desc:0 "Mirolon and the friends who keep the marches against Volgan."
 zin_faction_western_crossing:0 "The Western Crossing"
 zin_faction_western_crossing_desc:0 "The West's coalition, raised to sail for the Middle Lands."
 zin_occupation_iron_hand:0 "The Iron Hand"
 zin_occupation_iron_hand_desc:0 "Captains rule the conquered land by the sword. Revolt is crushed before it grows, and the people learn only fear."
 zin_occupation_light_hand:0 "The Light Hand"
 zin_occupation_light_hand_desc:0 "Local lords keep their courts, and the people learn that the new banner is no worse than the old. Obedience grows quickly, but the conquered are watched only lightly."
 zin_occupation_missing_garrison:0 "Garrison Missing"
 zin_occupation_missing_garrison_desc:0 "Where the garrison is too thin, the law's strength fades and the land slips away from its holders."
 zin_occupation_no_garrison:0 "No Garrison"
 zin_occupation_no_garrison_desc:0 "No host is left to watch the land. Nothing is taken from it, and nothing is held."
 zin_research_concord_desc:0 "Members of the league study the same arts in common, and learn more quickly what another member has already learnt."
 zin_research_concord_name:0 "Study of the Middle Kingdom Concord"
