 zin_accord_border:0 "The border: §Y[?global.zin_dark_border_tension|0]§!, [ROOT.zin_dark_band_name]"
 zin_accord_border_tt:0 "The tension on the border between the Accord and Cocanoor."
 zin_accord_button:0 "Accord"
 zin_accord_button_tt:0 "Open or close the Dark Sea Accord: resolve, the border and the members."
 zin_accord_member_row_1_1:0 "§Y[ROOT.zin_ui_row_1.GetNameDef]§!"
 zin_accord_member_row_10_1:0 "§Y[ROOT.zin_ui_row_10.GetNameDef]§!"
 zin_accord_member_row_2_1:0 "§Y[ROOT.zin_ui_row_2.GetNameDef]§!"
 zin_accord_member_row_3_1:0 "§Y[ROOT.zin_ui_row_3.GetNameDef]§!"
 zin_accord_member_row_4_1:0 "§Y[ROOT.zin_ui_row_4.GetNameDef]§!"
 zin_accord_member_row_5_1:0 "§Y[ROOT.zin_ui_row_5.GetNameDef]§!"
 zin_accord_member_row_6_1:0 "§Y[ROOT.zin_ui_row_6.GetNameDef]§!"
 zin_accord_member_row_7_1:0 "§Y[ROOT.zin_ui_row_7.GetNameDef]§!"
 zin_accord_member_row_8_1:0 "§Y[ROOT.zin_ui_row_8.GetNameDef]§!"
 zin_accord_member_row_9_1:0 "§Y[ROOT.zin_ui_row_9.GetNameDef]§!"
 zin_accord_member_row_tt:0 "A realm of the Dark Sea Accord."
 zin_accord_members:0 "Members of the Accord: §Y[?global.zin_dark_member_count|0]§!"
 zin_accord_resolve:0 "Resolve: §Y[?global.zin_dark_accord_resolve|0]§! of 100"
 zin_accord_resolve_tt:0 "At 60 the Accord holds firm and Goldoroth thinks twice. Below 20 its members begin to leave."
 zin_accord_title:0 "The Dark Sea Accord"
 zin_accord_title_CLOSE_tt:0 "Close this window."
 zin_accord_title_NEXT:0 "Next"
 zin_accord_title_PAGE:0 "Page §Y[?ROOT.zin_ui_page_shown|0]§! of §Y[?ROOT.zin_ui_pages|0]§!"
 zin_accord_title_PAGE_tt:0 "The list is longer than one page. The buttons turn the pages."
 zin_accord_title_PREV:0 "Previous"
 zin_dark_accord:0 "The Dark Sea Accord"
 zin_dark_accord_desc:0 "Notbuton keeps the Accord alive with beacons, blood-prices and friends across the straits. Its resolve stands at §Y[?global.zin_dark_accord_resolve|0]§! of a hundred."
 zin_dark_accord_shield:0 "The Accord's Resolve"
 zin_dark_accord_shield_desc:0 "The firmer the Accord holds together, the harder its members are to break."
 zin_dark_against_the_dead:0 "Together Against the Dead"
 zin_dark_band_bloody:0 "Bloody"
 zin_dark_band_brink:0 "On the brink"
 zin_dark_band_quiet:0 "Quiet"
 zin_dark_band_uneasy:0 "Uneasy"
 zin_dark_bargain_struck:0 "A Bargain With the South"
 zin_dark_beacons_lit:0 "Lit the Beacons"
 zin_dark_bind_by_marriage:0 "Bind by Marriage of Chiefs"
 zin_dark_bind_by_marriage_desc:0 "The Warking's kin are offered to the chief of a hold, or the chief's to the Warking. Orc halls hold marriages as seriously as feuds, and the two are very alike. Sway with that hold rises sharply, once."
 zin_dark_blood_contest:0 "Blood Contest"
 zin_dark_blood_contest_cheap:0 "Blood Contest"
 zin_dark_blood_contest_cheap_desc:0 "Champions of the clans fight in the pit until one yields or does not. The watching warriors roar their temper out, and the war-clans think better of their Warking for it."
 zin_dark_blood_contest_desc:0 "Champions of the clans fight in the pit until one yields or does not. The watching warriors roar their temper out, and the war-clans think better of their Warking for it."
 zin_dark_blood_price_paid:0 "Paid the Blood-Price"
 zin_dark_boon_iron:0 "The Forges Roar"
 zin_dark_boon_iron_desc:0 "The Iron Clans work the forges day and night in the Warking's favour."
 zin_dark_boon_volcano:0 "The Fire-Speakers Bless the Warking"
 zin_dark_boon_volcano_desc:0 "The Volcano Clans read the smoke above the Fire-Mountain and find it kind to the king."
 zin_dark_boon_war:0 "The War-Clans Hunger"
 zin_dark_boon_war_desc:0 "The warriors are loyal and eager, and have been told they will not be disappointed."
 zin_dark_boon_warrens:0 "The Warrens Swarm"
 zin_dark_boon_warrens_desc:0 "From the Goblin Warrens come numbers that the moot had forgotten it could count."
 zin_dark_brutes_mustered:0 "The Brutes Mustered"
 zin_dark_brutes_mustered_desc:0 "Dondor's hill-farm Brutes stand in the line, as slow to move and as slow to break as a cliff."
 zin_dark_call_free_moot:0 "Call the Free Moot"
 zin_dark_call_free_moot_desc:0 "The holds that answer to no one meet at the moot stone and agree, for the first time in living memory, to answer together when one of them is attacked. It is an oath between neighbours, not a crown."
 zin_dark_call_on_the_north:0 "Call on the North"
 zin_dark_call_on_the_north_desc:0 "Ships are asked of Sonargur, across the dark water. Lerendor has its own quarrels, and its own reasons to dislike an orc kingdom on the strait."
 zin_dark_clash_on_the_march:0 "Clash on the March"
 zin_dark_clash_on_the_march_desc:0 "Not a raid and not a war: the host rides to the border forts and tries them, for as long as the forts hold. The Gathering Dark stirs when banners meet."
 zin_dark_close_strait:0 "Close a Dark Strait"
 zin_dark_close_strait_desc:0 "In a war, a held shore can bar the water to the enemy's ships altogether. The wardens chain the strait and the galleys stay in harbour."
 zin_dark_corsair_outrage:0 "Burned a Free Harbour"
 zin_dark_corsair_raid:0 "Corsair Raid"
 zin_dark_corsair_raid_desc:0 "Black-sailed galleys cross the Sea of Darkness to burn a harbour. Wealth comes home in the holds, and a tension of its own goes out over the water. If the harbour is Blackton's, Lerendor will remember."
 zin_dark_envoys_hunted:0 "Hunted Our Envoys"
 zin_dark_feast_the_clans:0 "Feast the Clans"
 zin_dark_feast_the_clans_desc:0 "Oxen on spits, casks of black mead and a share of the armoury's iron given out in handfuls. For a night every bloc remembers it is part of one host. The temper of the clans falls."
 zin_dark_forest_nobody_enters:0 "The Forest Nobody Enters"
 zin_dark_forest_nobody_enters_desc:0 "Armies that have gone into the Troll Forest came out thinner, or did not. The trees are not what hurts them."
 zin_dark_free_holds:0 "The Free Holds"
 zin_dark_free_holds_desc:0 "The halls of the Dark Lands answer to nobody, and a few of them have learned that being nobody's is easier in company. The Free Moot is a league that stays free; the troll-kin are a people that can be hired. [ROOT.zin_dark_sway_line]"
 zin_dark_free_moot:0 "The Free Moot"
 zin_dark_free_moot_desc:0 "The hall has sworn to ride when a neighbour of the Moot is attacked."
 zin_dark_gifts:0 "Gifts of Black Iron"
 zin_dark_great_moot:0 "Hold the Great Moot"
 zin_dark_great_moot_central:0 "Hold the Great Moot"
 zin_dark_great_moot_central_desc:0 "The chiefs of the four blocs gather around the fire at Cocanoor, and each says what the Warking has not given them. One of them will leave better pleased than the rest."
 zin_dark_great_moot_desc:0 "The chiefs of the four blocs gather around the fire at Cocanoor, and each says what the Warking has not given them. One of them will leave better pleased than the rest."
 zin_dark_hire_troll_kin:0 "Hire the Troll-Kin"
 zin_dark_hire_troll_kin_desc:0 "The Forest Nobody Enters sells strength by the season, to those who send iron and honest dealing first. Troy the Old does not take orders and does not give refunds."
 zin_dark_horde:0 "The Horde of Cocanoor"
 zin_dark_horde_desc:0 "Goldoroth is a kingdom of clans, and the Warking rules only as long as they are fed and heard. Four blocs bring their wants to the moot: the Volcano Clans, the Iron Clans, the War-Clans and the Goblin Warrens. Temper stands at §Y[?zin_goldoroth_temper|0]§! of a hundred."
 zin_dark_host_shown:0 "Showed Us the Host"
 zin_dark_hunt_envoys:0 "Hunt the Southern Envoys"
 zin_dark_hunt_envoys_desc:0 "Riders from Nafeher have been to the hold with gifts and promises. The Warking's wardens ride out to find them, and the hold remembers who sent the wardens. The south will learn that the hunt was noticed."
 zin_dark_invite_to_accord:0 "Invite a Hold into the Accord"
 zin_dark_invite_to_accord_desc:0 "An orc hold that has seen Cocanoor's fires from its wall is asked to take a seat in the Accord. It may find a seat in a human-led league humbling or sensible."
 zin_dark_leave_free_moot:0 "Leave the Free Moot"
 zin_dark_leave_free_moot_desc:0 "The hall withdraws its stone from the moot. It will be remembered, and it will be free of the call."
 zin_dark_levy_shore_tolls:0 "Levy Shore Tolls"
 zin_dark_levy_shore_tolls_desc:0 "A strait whose shore is Goldoroth's pays Goldoroth for the passage. The far shore will not like it, and will not forget."
 zin_dark_light_beacons:0 "Light the Sea Beacons"
 zin_dark_light_beacons_chain:0 "Light the Sea Beacons"
 zin_dark_light_beacons_chain_desc:0 "The beacon chain along the dark coast is lit from end to end. Every hall in the Accord sees it and remembers why it is an Accord. Resolve rises."
 zin_dark_light_beacons_desc:0 "The beacon chain along the dark coast is lit from end to end. Every hall in the Accord sees it and remembers why it is an Accord. Resolve rises."
 zin_dark_moot_kin:0 "Sworn to the Free Moot"
 zin_dark_muster_brutes:0 "Muster the Brutes"
 zin_dark_muster_brutes_desc:0 "Dondor's Brutes are called from the hill farms for half a year: big, slow men who hold a line the way a cliff holds a sea."
 zin_dark_muster_brutes_drill:0 "Muster the Brutes"
 zin_dark_muster_brutes_drill_desc:0 "Dondor's Brutes are called from the hill farms for half a year: big, slow men who hold a line the way a cliff holds a sea."
 zin_dark_offer_iron_yoke:0 "Offer the Iron Yoke"
 zin_dark_offer_iron_yoke_cheap:0 "Offer the Iron Yoke"
 zin_dark_offer_iron_yoke_cheap_desc:0 "A hold that leans toward Cocanoor is offered the Iron Yoke: to become Goldoroth's tributary, to pay and to host, and to be defended. It may bend the knee or refuse, and a refusal is not forgotten."
 zin_dark_offer_iron_yoke_desc:0 "A hold that leans toward Cocanoor is offered the Iron Yoke: to become Goldoroth's tributary, to pay and to host, and to be defended. It may bend the knee or refuse, and a refusal is not forgotten."
 zin_dark_one_fire:0 "One Fire Under Cocanoor"
 zin_dark_one_fire_desc:0 "A tributary that has served long and well is taken wholly into the kingdom. Its hearth fire is put out and relit from the Fire-Mountain, and its hall is Goldoroth's."
 zin_dark_one_fire_hard:0 "One Fire Under Cocanoor"
 zin_dark_one_fire_hard_desc:0 "A tributary that has served long and well is taken wholly into the kingdom. Its hearth fire is put out and relit from the Fire-Mountain, and its hall is Goldoroth's."
 zin_dark_pay_blood_price:0 "Pay the Blood-Price"
 zin_dark_pay_blood_price_desc:0 "Gold and cattle sent to Cocanoor for the dead of the last raid. It is humiliating and it works: the border cools, and the Warking's clans see silver where they wanted blood."
 zin_dark_petition_parim:0 "Petition Parim"
 zin_dark_petition_parim_desc:0 "Notbuton sends an envoy to the Golden King. Parim may bless, guarantee or invite, and which it chooses says much about Parim."
 zin_dark_raid_hold:0 "Raid a Free Hold"
 zin_dark_raid_hold_desc:0 "A hold on the border has been slow to see where its interest lies. Thirty days of fire and plunder will help it see. If Goldoroth's host is three times the hold's, the hold bends a little; if not, it hardens."
 zin_dark_raid_marches:0 "Raid the Dondor Marches"
 zin_dark_raid_marches_desc:0 "Send the war-clans over the border into Dondor's marches for thirty days. They come back with iron, cattle and stories, and the temper of the clans falls. Dondor is told, and border tension rises. No war is declared."
 zin_dark_raid_marches_swift:0 "Raid the Dondor Marches"
 zin_dark_raid_marches_swift_desc:0 "Send the war-clans over the border into Dondor's marches for thirty days. They come back with iron, cattle and stories, and the temper of the clans falls. Dondor is told, and border tension rises. No war is declared."
 zin_dark_raided:0 "Raided by Cocanoor"
 zin_dark_raids:0 "Raids and Clashes"
 zin_dark_raids_desc:0 "The war-clans are fed by what the warriors bring home. A raid is not a war, and the Warking knows the difference even when the clans do not: it is a fire lit on a neighbour's roof to warm his own hall. Border tension stands at §Y[?global.zin_dark_border_tension|0]§! of a hundred."
 zin_dark_refused_nafeher:0 "Bows to No Spirit"
 zin_dark_restless_clans:0 "Restless Clans"
 zin_dark_restless_clans_desc:0 "The war-clans have sat too long by their fires. They sharpen things."
 zin_dark_sea_master:0 "Master of the Sea of Darkness"
 zin_dark_sea_master_desc:0 "Nobody on this coast keeps more harbours, or watches more water."
 zin_dark_send_gifts:0 "Send Gifts of Black Iron"
 zin_dark_send_gifts_cheap:0 "Send Gifts of Black Iron"
 zin_dark_send_gifts_cheap_desc:0 "Blades, mail and a keg of the forge's best for the chief of a free hold. They are not payment. They are a reminder of where the good iron comes from."
 zin_dark_send_gifts_desc:0 "Blades, mail and a keg of the forge's best for the chief of a free hold. They are not payment. They are a reminder of where the good iron comes from."
 zin_dark_settled_hearths:0 "Settled Hearths"
 zin_dark_settled_hearths_desc:0 "The clans are full and drowsy, and the Warking's calm is worth more than his war."
 zin_dark_shore_tolls:0 "Levied Shore Tolls"
 zin_dark_show_the_host:0 "Show the Host"
 zin_dark_show_the_host_desc:0 "The host is marched in column past a hold's gates, banners up. Nobody is hurt, and everybody remembers. This needs a host at least three times the hold's."
 zin_dark_stood_with_accord:0 "Stood With the Accord"
 zin_dark_strait_closed:0 "The Dark Strait Is Closed"
 zin_dark_strait_closed_desc:0 "The chain is across the water, and the galleys wait in harbour."
 zin_dark_straits:0 "The Dark Straits"
 zin_dark_straits_desc:0 "Two narrow waters join the Dark Lands to the North Lands and the Middle Lands. Whoever holds a shore may levy a toll, and whoever holds both may close the water altogether."
 zin_dark_sulk_iron:0 "Cold Forges"
 zin_dark_sulk_iron_desc:0 "The Iron Clans bank their fires and keep the best iron for themselves."
 zin_dark_sulk_volcano:0 "The Fire-Speakers Sulk"
 zin_dark_sulk_volcano_desc:0 "The Volcano Clans say the smoke has turned its face from the king."
 zin_dark_sulk_war:0 "The War-Clans Mutter"
 zin_dark_sulk_war_desc:0 "The warriors have been promised raids and have been handed feasts."
 zin_dark_sulk_warrens:0 "The Warrens Hide"
 zin_dark_sulk_warrens_desc:0 "The Goblin Warrens have gone deeper into the rock and sent no messages."
 zin_dark_sway:0 "Sway and the Iron Yoke"
 zin_dark_sway_courted:0 "Courted"
 zin_dark_sway_desc:0 "The free holds answer to no king, but a hall that has taken black iron, married a chief's daughter and watched the host ride past is a hall that listens. Sway stands high in some, low in others, and Cocanoor counts every hand."
 zin_dark_sway_free:0 "Free"
 zin_dark_sway_line_cocanoor:0 "Every hall of the Dark Lands is counted at Cocanoor."
 zin_dark_sway_line_courted:0 "Cocanoor courts this hall."
 zin_dark_sway_line_free:0 "This hall is free of Cocanoor."
 zin_dark_sway_line_pressed:0 "Cocanoor presses this hall hard."
 zin_dark_sway_line_yoked:0 "This hall bears the Iron Yoke."
 zin_dark_sway_pressed:0 "Pressed"
 zin_dark_sway_yoked:0 "Under the Yoke"
 zin_dark_tributary_hold:0 "Under the Iron Yoke"
 zin_dark_tributary_hold_desc:0 "The hold pays and hosts for Cocanoor, and Cocanoor defends it."
 zin_dark_troll_hirelings:0 "Troll Hirelings"
 zin_dark_troll_hirelings_desc:0 "Troll-kin walk with the host for a year. They break whatever stands in their way, and they break their rations too."
 zin_dark_troll_woods:0 "The Troll Woods"
 zin_dark_troll_woods_desc:0 "A supply train that enters these trees does not come out the same size."
 zin_dark_tt_blood:0 "Border tension falls by 15. Goldoroth is paid in Authority."
 zin_dark_tt_challenge:0 "The Warking fights the challenger in the pit. The more the War-Clans favour him, the likelier he is to win. If he falls, the chief of the heir's bloc, or else the challenger, is the new Warking."
 zin_dark_tt_close:0 "Goldoroth holds the whole Dark shore of a strait."
 zin_dark_tt_cooldown:0 "The last such order was given too recently."
 zin_dark_tt_hunt:0 "The target's pact with the south falls by one, and the south is told."
 zin_dark_tt_moot_cause:0 "Goldoroth holds a third of the Dark Lands, holds a cause of war against a hold, or makes war on one."
 zin_dark_tt_moot_free:0 "This hall is free, owes Cocanoor nothing, and is not bound to the south."
 zin_dark_tt_moot_none:0 "No Free Moot meets at the stone."
 zin_dark_tt_muster:0 "Border tension is at least 60, or Dondor is at war with Goldoroth."
 zin_dark_tt_no_clash:0 "No clash is being fought on the march."
 zin_dark_tt_one_fire:0 "The hold has borne the Iron Yoke for a year, and Cocanoor's sway over it is at least 80."
 zin_dark_tt_one_fire_hard:0 "The hold has borne the Iron Yoke for half a year, and Cocanoor's sway over it is at least 70."
 zin_dark_tt_outnumber:0 "Goldoroth's host is at least three times the target's."
 zin_dark_tt_sway_up:0 "Cocanoor's sway over the target rises."
 zin_dark_tt_tension_blood:0 "Border tension is at least 40."
 zin_dark_tt_tension_clash:0 "Border tension is at least 60."
 zin_dark_tt_tolls:0 "Goldoroth holds the whole Dark shore of a strait and is at peace with the far shore."
 zin_dark_tt_tolls_paid:0 "The far shore will resent the toll."
 zin_dark_tt_trolls:0 "The troll-kin think well enough of this hall, or already sell to it."
 zin_dark_tt_war_floor:0 "The armed peace has lasted long enough to be tested."
 zin_dark_tt_yoke_date:0 "Cocanoor is ready to offer the Iron Yoke."
 zin_dark_tt_yoke_sway:0 "Cocanoor's sway over the hold is at least 50."
 zin_dark_tt_yoke_sway_cheap:0 "Cocanoor's sway over the hold is at least 40."
 zin_dark_watch_the_shore:0 "Watch on the Shore"
 zin_dark_watch_the_shore_desc:0 "Beacons are lit on every headland, and the sea forts are manned day and night."
 zin_dark_yoke_refused:0 "Refused the Iron Yoke"
 zin_dark.10.a:0 "Share the spoils."
 zin_dark.10.d:0 "The raiding parties are back at Cocanoor with carts, cattle and a good deal of iron that was not theirs a month ago. The war-clans are loud and the fires are high. The Warking watches from the hall steps and says nothing, which the clans take for approval."
 zin_dark.10.t:0 "The Raiders Return"
 zin_dark.11.a:0 "Light the beacons."
 zin_dark.11.b:0 "Pay the blood-price."
 zin_dark.11.c:0 "Answer in kind."
 zin_dark.11.d:0 "Riders from Cocanoor have crossed Dondor's border, burned two steadings and driven off the cattle. The Brutes of the hill farms ask what Notbuton means to do about it."
 zin_dark.11.t:0 "Raiders on the Marches"
 zin_dark.12.a:0 "Light the beacons."
 zin_dark.12.b:0 "Pay the blood-price."
 zin_dark.12.c:0 "Answer in kind."
 zin_dark.12.d:0 "Black-iron riders have crossed our border at night and left a burned barn and a message that was not written down. The elders ask how long a hold can pretend it was not meant."
 zin_dark.12.t:0 "Raiders from Cocanoor"
 zin_dark.13.a:0 "Light the beacons."
 zin_dark.13.b:0 "Pay the blood-price."
 zin_dark.13.c:0 "Answer in kind."
 zin_dark.13.d:0 "Galleys with black sails came out of the morning haze, burned the harbour and were gone before the beacons could be lit. The harbour master counts what is left of his quays."
 zin_dark.13.t:0 "Black Sails"
 zin_dark.15.a:0 "The orcs test the line again."
 zin_dark.15.d:0 "The orcs of Cocanoor have tested the forts on Dondor's border again. It is not war. Traders on the southern road have started to take other roads, and nobody in a hall near the Dark Lands has slept easily since."
 zin_dark.15.t:0 "Fire on the March"
 zin_dark.16.a:0 "The march is Cocanoor's today."
 zin_dark.16.d_gol:0 "The host has taken the forts on the march and held them. The clans bring back plunder, the Warking's name is shouted in the camps, and Dondor's riders are seen far down the road."
 zin_dark.16.d_other:0 "The forts on the march have fallen to Cocanoor's host. It was not a war, the heralds say, and the border has moved a day's ride south in every mind that matters."
 zin_dark.16.t:0 "The Clash Won"
 zin_dark.17.a:0 "The forts held."
 zin_dark.17.d_gol:0 "The host broke on the forts and came home without its plunder. The clans mutter, the War-Clans most of all, and the Accord is delighted."
 zin_dark.17.d_other:0 "The forts on the march held. Cocanoor's host went back across the border carrying its dead, and the beacons burned all night for the living."
 zin_dark.17.t:0 "The Clash Lost"
 zin_dark.18.a:0 "Nothing is decided."
 zin_dark.18.d:0 "The fighting on the march ended with nothing decided. Both sides claim they let the other go, and both sides are certain they did."
 zin_dark.18.t:0 "The Clash Ends"
 zin_dark.20.a:0 "Take the seat."
 zin_dark.20.b:0 "Decline."
 zin_dark.20.d:0 "Riders from Notbuton bring an offer: a seat in the Dark Sea Accord, with its beacons, its blood-prices and its human friends across the straits. Cocanoor's fires have been seen from our wall. Whether we are safer with Dondor or with ourselves is what the elders are shouting about."
 zin_dark.20.t:0 "An Invitation to the Accord"
 zin_dark.21.a:0 "So it is."
 zin_dark.21.d_declined:0 "The hold has thanked Notbuton, sent a gift of smoked fish and declined. It will watch the Accord from outside, as it watches everything."
 zin_dark.21.d_joined:0 "The hold has taken its seat in the Accord. The Brutes find it strange to stand with orcs, and the orcs find it strange to stand with Brutes, and the beacons are lit all the same."
 zin_dark.21.t:0 "The Hold Answers"
 zin_dark.22.a:0 "Stay."
 zin_dark.22.b:0 "Leave the Accord."
 zin_dark.22.d:0 "The danger seems far, the beacons cost money, and the Accord's allies are tiring of Dondor's speeches. The elders of our hall ask whether the Accord still deserves them."
 zin_dark.22.t:0 "The Accord Frays"
 zin_dark.30.a:0 "The Golden King sends his blessing."
 zin_dark.30.b:0 "Aenor guarantees Dondor."
 zin_dark.30.c:0 "Invite Dondor into the Lost Cause."
 zin_dark.30.d:0 "An envoy of Dondor stands in the Golden Court. The orcs of Cocanoor, he says, have started to count their neighbours' cattle. King Dunmar asks nothing of Parim but to be remembered as a friend, and Parim may decide what that is worth."
 zin_dark.30.t:0 "Notbuton Asks Parim"
 zin_dark.31.a:0 "Ships for Notbuton."
 zin_dark.31.b:0 "Words, not ships."
 zin_dark.31.d:0 "Dondor's envoys have crossed the dark water to Sonargur with a request for ships. They remind the Leren court of the old Grand Alliance, in which parts of the Dark Lands stood against Volgan, and they remind it that an orc kingdom on the strait is no friend to the North either."
 zin_dark.31.t:0 "Notbuton Calls on the North"
 zin_dark.40.d:0 "The chiefs of the four blocs sit round the fire at Cocanoor. Sungor of the Volcano Clans wants rites, Ulgra of the Iron Clans wants forges and tithes, Britag of the War-Clans wants war, and Snikkit Many-Knives wants a seat. The Warking can hear one of them clearly."
 zin_dark.40.iron:0 "Feed the forges."
 zin_dark.40.t:0 "The Great Moot"
 zin_dark.40.volcano:0 "Honour the Fire-Mountain."
 zin_dark.40.war:0 "Promise war."
 zin_dark.40.warrens:0 "Give the Warrens a voice."
 zin_dark.42.a:0 "Then let them raid."
 zin_dark.42.b:0 "Blood at Cocanoor."
 zin_dark.42.c:0 "The Warking says no."
 zin_dark.42.d:0 "The war-clans stand in the hall in their mail, and nobody has asked them to. They do not shout. That is worse. A king who keeps an army by its fires is a king who knows exactly how long fires last."
 zin_dark.42.t:0 "The Clans Demand Blood"
 zin_dark.43.a:0 "Their blood is up."
 zin_dark.43.d:0 "The war-clans have been sharpening things in the evenings, and a thoughtful orc will tell you that this is a sound of its own. The Warking has seen it before, and knows what comes after the sharpening."
 zin_dark.43.t:0 "The Clans Grow Restless"
 zin_dark.44.a:0 "Meet the challenge."
 zin_dark.44.b:0 "Buy their peace."
 zin_dark.44.d:0 "The chief of an unheeded bloc has risen in the moot and named the Warking's right to rule. An orc crown is held by the arm that holds it, and the chief has brought his own arm to show. The hall waits."
 zin_dark.44.t:0 "A Challenge at the Moot"
 zin_dark.45.a:0 "Long may the new one last."
 zin_dark.45.d:0 "The old Warking lies in the pit and the hall shouts a new name. The chief has the black iron crown and half the clans, and the half that did not choose him are weighing what it costs to be wrong."
 zin_dark.45.t:0 "A New Warking"
 zin_dark.46.a:0 "Who else?"
 zin_dark.46.d:0 "The challenger lies in the pit and the Warking stands over him, breathing hard. The hall is quiet for a moment, then loud. The bloc he beat will hold its peace, for now."
 zin_dark.46.t:0 "The Warking Stands"
 zin_dark.50.a:0 "Bend the knee to Cocanoor."
 zin_dark.50.b:0 "Our hall answers to no one."
 zin_dark.50.d:0 "Riders from Cocanoor stand in our hall with a Warking's offer: the Iron Yoke. We would pay, we would host, and Goldoroth would defend us against all comers, the Warking's own host included. The elders look at one another. Black iron has been very generous to us."
 zin_dark.50.t:0 "The Iron Yoke"
 zin_dark.51.a:0 "As the hall wills."
 zin_dark.51.d_bowed:0 "The hold has bent the knee. Its chief has laid his axe on the steps of Cocanoor and received it back. It is Goldoroth's now, and Goldoroth is a little larger."
 zin_dark.51.d_refused:0 "The hold has refused. The chief threw the Warking's gift into the yard, and the Warking's riders were sent away with their horses and their dignity. Cocanoor will remember it."
 zin_dark.51.t:0 "The Hold's Answer"
 zin_dark.52.a:0 "Another hall goes dark."
 zin_dark.52.d:0 "A hold that was Goldoroth's tributary has put out its hearth fire and taken a brand from the Fire-Mountain. Its hall is Cocanoor's now, whole."
 zin_dark.52.t:0 "One Fire"
 zin_dark.60.a:0 "Watch the inner Dark."
 zin_dark.60.d:0 "A third of the Dark Lands fly Goldoroth's banner, or pay its tribute. The halls of the south look north, and the halls of the north look south. Lerendor and Parim have started to ask what lies behind Cocanoor's hall steps."
 zin_dark.60.t:0 "Cocanoor Rises"
 zin_dark.61.a:0 "One king for the Dark."
 zin_dark.61.d:0 "The Warking has taken the title of Great Goldoroth. The whole of the Dark Lands, from the straits to the Sea of Darkness, answers to one hall. The orcs say it has not happened before, and the old ones say it has."
 zin_dark.61.t:0 "The Dark Lands Are One"
 zin_dark.62.a:0 "The orcs have found a master."
 zin_dark.62.d:0 "Goldoroth has bent the knee to Nafeher. The Warking's black iron crown was laid on a southern step, and the host that rode out of Cocanoor will not ride out of it for anyone else. The Dark Lands wait to see what the orcs will make of having a master."
 zin_dark.62.t:0 "Cocanoor Kneels"
 zin_dark.70.a:0 "Swear at the stone."
 zin_dark.70.b:0 "Decline."
 zin_dark.70.d:0 "A hold has called the free holds to the moot stone, to agree that an attack on one will be answered by all. It is an oath between neighbours, not a crown, and it can be left as easily as it is sworn."
 zin_dark.70.t:0 "The Free Moot Is Called"
 zin_dark.71.a:0 "The Moot rides."
 zin_dark.71.b:0 "Not this time."
 zin_dark.71.d:0 "A hold of the Moot has been attacked, and the stone calls its sisters. The riders are at the gate. They do not demand anything. They only stand there, as men stand who know what is owed."
 zin_dark.71.t:0 "The Moot Rides"
 zin_dark.72.a:0 "Every hall for itself."
 zin_dark.72.d:0 "The moot stone stands alone. Too few halls are left to keep an oath that needed many, and the last of them has gone home to bar its gates."
 zin_dark.72.t:0 "The Moot Breaks"
 zin_dark.75.a:0 "Trolls fight for pay."
 zin_dark.75.d:0 "A caravan of iron and honest dealing has come to the edge of the Forest Nobody Enters. Troy the Old counts it twice and sends his troll-kin south for the season. Trolls fight for pay, and are surprisingly punctual about it."
 zin_dark.75.t:0 "Troll Silver"
 zin_dark.85.a:0 "Cocanoor has chosen."
 zin_dark.85.d:0 "Riders from Nafeher have been found by wardens of Cocanoor in a hold's hall and sent away on foot. Goldoroth's Warking has made it known that his halls do not entertain strangers' masters. The south has taken note."
 zin_dark.85.t:0 "Envoys Hunted"
