l_english:
 zin_regional_kingson_a_gate_not_a_toll:0 "A Gate, Not a Toll"
 zin_regional_kingson_a_gate_not_a_toll_desc:0 "Kingson petitions Parim to be allowed to keep a gate and not a toll, with lower duties and kinder dealings. The Golden Court will not like the idea, and the elves will like it very much."
 zin_regional_kingson_beacons_along_the_wall:0 "Beacons Along the Wall"
 zin_regional_kingson_beacons_along_the_wall_desc:0 "Beacons are raised on every tower, so that a flame at one end of the Wall is seen at the other within the hour. The wardens practise lighting them on moonless nights."
 zin_regional_kingson_caravan_inns:0 "Caravan Inns"
 zin_regional_kingson_caravan_inns_desc:0 "Inns, stables and wagon-yards line the road to the gate. A caravan that has crossed the Giant Mountains finds Kingson a very welcome sight."
 zin_regional_kingson_companies_beyond_the_wall:0 "Companies Beyond the Wall"
 zin_regional_kingson_companies_beyond_the_wall_desc:0 "Aenoran companies march through the gate to the aid of the elves, the first men to cross the Wall in arms since the Accord. The elves give them bread and tell them to go home."
 zin_regional_kingson_companies_welcomed:0 "Companies Beyond the Wall"
 zin_regional_kingson_customs_for_parim:0 "Customs for Parim"
 zin_regional_kingson_customs_for_parim_desc:0 "Kingson sends the season's customs to Parim in full, and the Golden Court is grateful. The elves are less so."
 zin_regional_kingson_customs_house:0 "The Customs House"
 zin_regional_kingson_customs_house_desc:0 "The crown's customs, collected in a long grey house by the gate."
 zin_regional_kingson_elven_traders:0 "Elven Traders"
 zin_regional_kingson_elven_traders_desc:0 "Elven traders arrive at the gate with silver, herbs and fine cloth. The Golden Court wants higher tolls and the elves want lower ones, and Kingson stands in the middle."
 zin_regional_kingson_fair_dealing:0 "Fair Dealing"
 zin_regional_kingson_fair_dealing_desc:0 "A caravan of elven traders was dealt with fairly, and the word travels."
 zin_regional_kingson_full_toll_house:0 "The Full Toll"
 zin_regional_kingson_full_toll_house_desc:0 "The crown's tolls are levied in full, and the elves remember."
 zin_regional_kingson_gate_envoys:0 "Envoys at the Gate"
 zin_regional_kingson_gate_market:0 "The Gate Market"
 zin_regional_kingson_gate_market_desc:0 "Men and elves trade across the line of the Wall, and argue about prices."
 zin_regional_kingson_gate_wardens:0 "The Gate Wardens"
 zin_regional_kingson_gate_wardens_2:0 "The Gatehouse Keep"
 zin_regional_kingson_gate_wardens_2_desc:0 "A great keep behind the gate: well, granary and armoury."
 zin_regional_kingson_gate_wardens_desc:0 "Grey-clad wardens who open nothing without a seal."
 zin_regional_kingson_gates_tested:0 "The Gates Are Tested"
 zin_regional_kingson_gates_tested_desc:0 "The beacons are lit and the gate is barred."
 zin_regional_kingson_hill_folk:0 "The Hill Folk"
 zin_regional_kingson_hill_folk_desc:0 "The hill folk live above the snow-line, in stone houses with turf roofs. They are short, strong and stubborn, and they hold the high passes against anyone."
 zin_regional_kingson_honest_tolls:0 "Honest Tolls"
 zin_regional_kingson_honest_tolls_desc:0 "Kingson posts its tolls on the gate in plain figures, and charges no more than the board says. The elves approve, the Golden Court grumbles and the traders return."
 zin_regional_kingson_honest_tolls_house:0 "Honest Tolls"
 zin_regional_kingson_honest_tolls_house_desc:0 "Posted tolls and fair dealing: the traders return."
 zin_regional_kingson_iron_of_the_mountains:0 "Iron of the Mountains"
 zin_regional_kingson_iron_of_the_mountains_desc:0 "Iron ore is dug from the mountain roots, and smelters rise along the foothills. The wardens are armed from their own mountains."
 zin_regional_kingson_keepers_of_the_accord:0 "Keepers of the Accord"
 zin_regional_kingson_keepers_of_the_accord_desc:0 "Kingson names itself keeper of the Wall Accord, the old agreement of 4A 96 that holds men and elves to either side of the stone. It is a title of some weight, and some peril."
 zin_regional_kingson_keepers_of_the_accord_spirit:0 "Keepers of the Accord"
 zin_regional_kingson_keepers_of_the_accord_spirit_desc:0 "Kingson names itself keeper of the old agreement between men and elves."
 zin_regional_kingson_mountain_passes:0 "Mountain Passes"
 zin_regional_kingson_mountain_passes_desc:0 "The passes of the Giant Mountains are mapped, marked and guarded. A host that wishes to cross them will have to ask permission, and will not get it."
 zin_regional_kingson_mountain_paths:0 "Mountain Passes"
 zin_regional_kingson_mountain_paths_desc:0 "Passes mapped, marked and guarded; a host must ask leave to cross."
 zin_regional_kingson_mountain_quarries:0 "Mountain Quarries"
 zin_regional_kingson_mountain_quarries_desc:0 "Quarrymen cut grey stone from the mountain flanks and send it down on sledges to the gate. The best of it goes into the Wall."
 zin_regional_kingson_open_the_gates:0 "Open the Gates"
 zin_regional_kingson_open_the_gates_desc:0 "Kingson opens the gate to the elves in their hour of need and offers them the companies of the Wall. The Golden Court may call it treason; the wardens call it keeping the Accord."
 zin_regional_kingson_pilgrim_road_to_the_hills:0 "The Pilgrim Road"
 zin_regional_kingson_pilgrim_road_to_the_hills_desc:0 "Pilgrims of the Deliverer pass through the gate on the long road to the Zilin Hills. They are polite, they are patient and they are not, as a rule, very rich."
 zin_regional_kingson_refugees_through_the_gate:0 "Refugees Through the Gate"
 zin_regional_kingson_refugees_through_the_gate_desc:0 "Frightened people crowd the road below the gate, with children and bundles and no one to tell them what to do. The wardens look to Lord Arcen, and Lord Arcen looks at the Wall."
 zin_regional_kingson_shut_the_gates:0 "Shut the Gates"
 zin_regional_kingson_shut_the_gates_desc:0 "The gate is barred and the portcullis dropped. Nothing passes, not caravans, not envoys, not pilgrims, until the wardens say otherwise."
 zin_regional_kingson_stone_for_the_wall:0 "Stone for the Wall"
 zin_regional_kingson_stone_for_the_wall_desc:0 "Every block that goes into the Wall is cut, numbered and set by a mason who knows its place. The Wall of Aenor grows a finger's breadth a year."
 zin_regional_kingson_the_customs_house:0 "The Customs House"
 zin_regional_kingson_the_customs_house_desc:0 "Kingson collects the crown's customs from elven traders and eastern caravans, in a long grey house beside the gate. The toll-reeve keeps the ledgers, and the ledgers keep the toll-reeve."
 zin_regional_kingson_the_full_toll:0 "The Full Toll"
 zin_regional_kingson_the_full_toll_desc:0 "The crown's tolls are levied in full, and Parim's treasury is richer for it. The elves pay, and the elves remember."
 zin_regional_kingson_the_gate_holds:0 "The Gate Holds"
 zin_regional_kingson_the_gate_holds_desc:0 "The gate, the keep and the beacons are joined into a single system, and the wardens drill it until the youngest recruit can run it blind."
 zin_regional_kingson_the_gate_market:0 "The Gate Market"
 zin_regional_kingson_the_gate_market_desc:0 "A great market opens beneath the gatehouse, where men and elves trade across the line of the Wall. It is the only place in Aoaz where the two peoples are seen shouting at each other about prices."
 zin_regional_kingson_the_gate_of_kingson:0 "The Gate of Kingson"
 zin_regional_kingson_the_gate_of_kingson_desc:0 "Kingson keeps the gate in the Great Wall of Aenor, east of the Giant Mountains, where the Wall turns around its lands. Its lords have held the gate since the Wall Accord, and have never lost the key."
 zin_regional_kingson_the_gatehouse_keep:0 "The Gatehouse Keep"
 zin_regional_kingson_the_gatehouse_keep_desc:0 "A great keep is built behind the gate itself, with a well, a granary and an armoury. If the Wall falls elsewhere, the gate of Kingson will not."
 zin_regional_kingson_the_gates_are_tested:0 "The Gates Are Tested"
 zin_regional_kingson_the_gates_are_tested_desc:0 "The beacons are lit along the whole of the Wall, and the gate of Kingson is closed for the first time in living memory. Whatever comes now will come to a barred door."
 zin_regional_kingson_the_giant_mountains:0 "The Giant Mountains"
 zin_regional_kingson_the_giant_mountains_desc:0 "The Giant Mountains stand west of the gate, grey and enormous. Their passes are narrow, their weather is worse and their quarries are among the richest in the Concord."
 zin_regional_kingson_the_heirs_gate:0 "The Heir's Gate"
 zin_regional_kingson_the_heirs_gate_desc:0 "The Heir has returned, and Kingson opens its gate to him. The keys hang in Parim, but the lock is in Kingson."
 zin_regional_kingson_the_kings_gate:0 "The King's Gate"
 zin_regional_kingson_the_kings_gate_desc:0 "The gate is the king's, in name and in law, and Kingson holds it in his stead. Its keys hang in Parim, and its lock is in Kingson."
 zin_regional_kingson_the_wall_charter_kept:0 "The Wall Charter Kept"
 zin_regional_kingson_the_wall_charter_kept_desc:0 "Kingson holds a Wall Charter, a grant of the gate in return for its keeping. The lords of Kingson read it every midsummer, and find no reason to quarrel with it."
 zin_regional_kingson_the_wall_garrison:0 "The Wall Garrison"
 zin_regional_kingson_the_wall_garrison_desc:0 "The garrison of the Wall is made permanent, and its barracks are rebuilt in stone. The men are paid late, but they are paid, and they stay."
 zin_regional_kingson_the_wall_holds:0 "The Wall Holds"
 zin_regional_kingson_the_wall_holds_desc:0 "Every tower is manned, every beacon is lit and every wardens' company is on the stone. The Wall of Aenor holds, as it was built to hold."
 zin_regional_kingson_the_wall_moot:0 "Call the Wall Moot"
 zin_regional_kingson_the_wall_moot_desc:0 "Kingson invites the elves of the nearest groves to a moot at the gate, to settle what can be settled and to write down what cannot. It is the first such meeting in forty years."
 zin_regional_kingson_towers_on_the_wall:0 "Towers on the Wall"
 zin_regional_kingson_towers_on_the_wall_desc:0 "New towers rise along the stretch of the Wall that Kingson keeps, each a bow-shot from the last. The masons say the old stone is better than the new, and quarry the old."
 zin_regional_kingson_wall_beacons:0 "Beacons Along the Wall"
 zin_regional_kingson_wall_beacons_desc:0 "A flame at one end of the Wall is seen at the other within the hour."
 zin_regional_kingson_wardens_of_the_gate:0 "Wardens of the Gate"
 zin_regional_kingson_wardens_of_the_gate_desc:0 "The wardens of the gate are chosen from the families that have held it longest. They wear grey, keep their own counsel and open nothing without a seal."
 zin_regional_kingson.1.a:0 "Fair dealing."
 zin_regional_kingson.1.b:0 "The crown's full toll."
 zin_regional_kingson.1.d:0 "An elven caravan has reached the gate with silver, herbs and fine cloth, and the toll-reeve has to decide what to charge. The Golden Court has asked for the full toll; the elves have asked, politely, for something less."
 zin_regional_kingson.1.t:0 "An Elven Caravan"
 zin_regional_kingson.2.a:0 "Pilgrims pay the toll."
 zin_regional_kingson.2.b:0 "Let them pass freely."
 zin_regional_kingson.2.d:0 "A long line of pilgrims in grey stands at the gate, bound for the Zilin Hills. They are polite and footsore, and the toll-reeve has to decide whether they are to pay as other travellers do."
 zin_regional_kingson.2.t:0 "Pilgrims at the Gate"
 zin_regional_kingson.3.a:0 "Words are cheap."
 zin_regional_kingson.3.b:0 "Hear them."
 zin_regional_kingson.3.d:0 "Envoys from the Wall-gate at Kingson have come to the elders of the great forest with a plain message: the customs may be eased, if the elves will meet to talk. The elders have heard fine words before."
 zin_regional_kingson.3.t:0 "Envoys from the Gate"
 zin_regional_kingson.4.a:0 "We defend our own."
 zin_regional_kingson.4.b:0 "Accept the companies."
 zin_regional_kingson.4.d:0 "The gate of Kingson stands open, and beyond it companies of Aenoran men wait, in good order, to cross the Wall to the aid of the elves. The elders know the Accord, and the Refusal, and the price of both."
 zin_regional_kingson.4.t:0 "The Gates of Kingson Open"
 zin_regional_kingson.5.a:0 "The gate stays shut."
 zin_regional_kingson.5.b:0 "Shelter them."
 zin_regional_kingson.5.d:0 "Frightened folk crowd the road below the gate, with children, bundles and no one to tell them where to go. The wardens look to Lord Arcen, and Lord Arcen looks at the Wall."
 zin_regional_kingson.5.t:0 "Refugees at the Gate"
