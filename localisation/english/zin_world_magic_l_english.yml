l_english:
 zin_world_bastian_counsel:0 "Bastian's Counsel"
 zin_world_bastian_counsel_desc:0 "The famous wizard has come at our call and stays for a while, as he does: he sits with our scholars in the evenings, settles quarrels in the wardens' hall with a few dry words, and refuses every office we offer him."
 zin_world_corrupt_dragon:0 "Bound by Corruption"
 zin_world_corrupt_dragon_desc:0 "Our friends among the keepers' households can open a gate at night, and a dragon that has been sick in the roosts does not always know whose voice it is obeying."
 zin_world_deep_heat:0 "The Deep Heat"
 zin_world_dragon_pact:0 "The Dragon Pact"
 zin_world_dragon_pact_cost_tt:0 "150 Authority (100 for a keeper the roosts trust)"
 zin_world_dragon_pact_desc:0 "The roosts of Dragon Mountain answer only elves they know. If the keepers and the dragons will hear us, one of them may fly with our host for as long as the war lasts."
 zin_world_ember_lands_heat:0 "The Heat of the South"
 zin_world_magic:0 "The Old Powers"
 zin_world_magic_desc:0 "Dragons, walls and wizards: the few great powers of the world that a crown can still bargain with, and the price each one asks."
 zin_world_new_gods_gift:0 "The Gods' Gift"
 zin_world_new_gods_gift_desc:0 "The heir rose from the field that should have been his grave, and the host that saw it will follow him anywhere; the peoples who only heard of it are coming to the banners anyway. Against the master of the Ember Lands every captain fights as if the twelve were watching."
 zin_world_send_for_bastian:0 "A Letter to Bastian"
 zin_world_send_for_bastian_desc:0 "Bastian keeps no tower and answers only the calls he chooses. A letter left at the right inn on the lake road usually finds him within the season, and he has never yet come for nothing."
 zin_world_storm_coasts:0 "Storm-Girt Coasts"
 zin_world_storm_coasts_desc:0 "Every captain who has tried our shore has learnt why the old charts mark it in red: the storms that guard it break fleets before they sight land, and what reaches the beach comes ashore half drowned."
 zin_world_tt_bastian_free:0 "Bastian has answered no other realm's call"
 zin_world_tt_corrupt_limit:0 "We have bound fewer than 2 dragons"
 zin_world_tt_corrupt_open:0 "Our friends hold 3 footholds in the keeper's realm (2 while the roosts are restless), and the roosts are unguarded"
 zin_world_tt_pact_limit:0 "We have made fewer than 3 Dragon Pacts"
 zin_world_tt_pact_need:0 "We fight a dark power or the eastern threat, or the Gathering Dark is at 50 or more"
 zin_world_tt_pact_trusted:0 "We hold the roosts, or their keeper likes us (opinion 50 or more) and the roosts trust the elves (bond 40 or more)"
 zin_world_tt_pool:0 "Dragon Mountain still has a dragon to give"
 zin_world_tt_roosts_free:0 "An elven realm holds Dragon Mountain"
 zin_world_varners_shelter:0 "The Wizard's Shelter"
 zin_world_varners_shelter_desc:0 "Paths open where the dead had shut them, and companies that should have been cut off walk home with their wounded. Our men call it the old man's road and do not ask him for more."
 zin_world_varners_wards:0 "Varner's Wards"
 zin_world_varners_wards_desc:0 "The old wizard spent the last of his strength on our host, and for a season the dead's cold slides off our men like rain off a good cloak. Nobody knows how long a thing like that can last, and the captains are not wasting the days asking."
 zin_world_wall_fallen:0 "The Wall Has Fallen"
 zin_world_wall_fallen_desc:0 "Enemy banners fly over the passes of the Great Wall, and every market town in the marches knows it. People who never thought about the mountains in their lives are asking the crown's officers what else they were told was safe."
 zin_world_wall_repairs:0 "Repairs on the Wall"
 zin_world_wall_repairs_desc:0 "Masons and quarrymen are up on the passes, resetting stones the frost has loosened and clearing the old watch-posts, and every carter in the marches is hauling for them at the crown's rate."
 zin_world_wall_watch:0 "The Wall Watch"
 zin_world_wall_watch_desc:0 "Send masons and the march levies up to the passes, so the old watch-posts are manned and mended before somebody else tests them."
 zin_world.30.a:0 "The week turns."
 zin_world.31.a:0 "The week turns."
 zin_world.35.a:0 "Pay the wardens' hall and make him welcome."
 zin_world.35.b:0 "We cannot spare it this year."
 zin_world.35.desc:0 "The answer comes back in a plain hand on cheap paper. Bastian will come, he writes, and stay a year if our scholars are worth the trouble; he wants no office, no title and no house, only a sum of money paid to the wardens' hall of his choosing and the promise that nobody will ask him to stand behind the throne at feasts."
 zin_world.35.t:0 "A Letter From Bastian"
 zin_world.40.a:0 "Then we march while it holds."
 zin_world.40.desc:0 "Our captains on the northern front send the same report from every camp: the dead came on as before, and this time the cold that goes before them broke on something nobody could see. The old wizard who rides with the heir is said to be spending himself on it, and our men are using every day of it."
 zin_world.40.t:0 "The Wards Hold"
 zin_world.45.a:0 "Then the host rides with him."
 zin_world.45.desc:0 "The heir's eyes shine with lightning, and the sword of Horos burns brighter in his hand than it ever did in the guardian's. The men who carried him off the field say that he got up as a man gets up from a night's sleep and asked for his horse, and nobody in the host has yet found the courage to ask him where he has been."
 zin_world.45.t:0 "The Gods' Gift"
 zin_world.50.a:0 "A bad bargain for everyone but him."
 zin_world.50.desc:0 "A dragon of Dragon Mountain has left the roosts by night and gone east to the false god's banners. The keepers say it was sick and that strangers were seen at the gates; the elves of the woods say less, and have begun to watch their own households."
 zin_world.50.t:0 "A Dragon Bound"
 zin_world.56.a:0 "Hold the mountain all the same."
 zin_world.56.desc:0 "Our garrison on the mountain sends word that the roosts are restless. Nothing has attacked, but the companies posted below the peaks have lost men to falling rock and to fires that start in dry grass with nobody near them, and the men want to be posted somewhere else."
 zin_world.56.t:0 "The Mountain Wakes"
 zin_world.59.a:0 "See that the passes are held."
 zin_world.59.desc:0 "The wardens of the passes write that the watch-posts on the Great Wall are standing empty while our enemies camp within a day's march of them. A pass that nobody holds is a road, they remind us, and they would like to know whether the crown means to send anyone."
 zin_world.59.t:0 "The Wall Unmanned"
 zin_world.60.a:0 "Retake the passes."
 zin_world.60.desc:0 "Enemy banners fly over the passes of the Great Wall. For as long as anybody can remember the mountains kept the marches safe whatever else went wrong, and the news has gone through the market towns faster than any herald could carry it."
 zin_world.60.t:0 "The Wall Is Breached"
 zin_world.65.a:0 "Keep the fleet out of those waters."
 zin_world.65.desc:0 "Our captains have learnt what the old charts mean by the red line off the Ember Lands: the weather beyond it turns without warning, and a fleet that stays in those waters loses masts and men every week it is there. The southern sailing-masters say there is no season when it is safe, only seasons when it is worse."
 zin_world.65.t:0 "Storms in the South"
