l_english:
 zin_regional_verde_a_navigator_sails_north:0 "A Navigator Sails North"
 zin_regional_verde_a_navigator_sails_north_desc:0 "One of Verde's navigators signs on with a ship bound for Gala, and the island lights a lamp for him on the quay. Verde's name is carried north with the stars."
 zin_regional_verde_a_navigator_sails_north_tip_1:0 "One of our navigators signs on with the King of Gala's ship."
 zin_regional_verde_a_welcome_on_every_shore:0 "A Welcome on Every Shore"
 zin_regional_verde_a_welcome_on_every_shore_desc:0 "From the largest island to the smallest skerry, every beach in [ROOT.GetName] has a fire, a boat-shed and someone to keep the door open. Sailors say they would rather be wrecked here than anywhere else."
 zin_regional_verde_carry_it_to_gala:0 "Carry It to Gala"
 zin_regional_verde_carry_it_to_gala_desc:0 "The islanders have a saying: when the tales of men grow too old for any man to explain, carry them to Gala. A boat is fitted out with a scribe, a drum and a bundle of the island's oldest songs."
 zin_regional_verde_carry_it_to_gala_tip_1:0 "When the tales of men grow too old for any man to explain, carry them to Gala."
 zin_regional_verde_chief_of_all_verde:0 "Chief of All Verde"
 zin_regional_verde_chief_of_all_verde_desc:0 "The families name one chief over all, and the hall's great horn is hers to sound. Verde has never had a king and does not mean to start now."
 zin_regional_verde_close_the_houses_of_the_isle:0 "Close the Houses of the Isle"
 zin_regional_verde_close_the_houses_of_the_isle_desc:0 "The house on the quay is shuttered, the well sealed and the healers' ledgers surrendered to the elders. The island's kindness has limits, and the elders have chosen where they lie."
 zin_regional_verde_far_from_the_kings_wars:0 "Far From the Kings' Wars"
 zin_regional_verde_far_from_the_kings_wars_desc:0 "The island declares that the wars of the great are not its wars. The harbour is closed to warships, the boats stay in their sheds, and the elders send word to every side that [ROOT.GetName] wants only to be left alone."
 zin_regional_verde_far_from_the_war:0 "Far From the Kings' Wars"
 zin_regional_verde_far_from_the_war_desc:0 "The harbour is closed to warships and the boats stay in their sheds. The island wants only to be left alone."
 zin_regional_verde_forest_law:0 "The Forest Law"
 zin_regional_verde_forest_law_desc:0 "Every tree felled is marked, and two are planted in its place. The woodwards walk the hills with branding-irons and hand-saws, and the forest is the island's bank."
 zin_regional_verde_guest_right:0 "The Guest-Right"
 zin_regional_verde_guest_right_desc:0 "No guest is turned from a door. He is fed, warmed and housed for three days before anyone asks his name."
 zin_regional_verde_hall_of_verde:0 "The Hall of Verde"
 zin_regional_verde_hall_of_verde_desc:0 "The clan hall is built of green timber and roofed with bark, and a hundred families sit under it at the midwinter feast. Chief Lua Verd sits at the middle bench, not the head."
 zin_regional_verde_healers_at_the_quays:0 "Healers at the Quays"
 zin_regional_verde_healers_at_the_quays_desc:0 "Healers in grey robes tend the sick on the quay and feed the hungry."
 zin_regional_verde_island_feasts:0 "Island Feasts"
 zin_regional_verde_island_feasts_desc:0 "Visitors arrive in ones and twos, then in boatloads. The islanders of [ROOT.GetName] roast what they have, pour what they have and sing until the moon has set."
 zin_regional_verde_lamps_on_the_reefs:0 "Lamps on the Reefs"
 zin_regional_verde_lamps_on_the_reefs_desc:0 "Tallow lamps are hung on poles above the dangerous reefs, lit at dusk by children who are paid in sweet cakes. Ships that once smashed on the rocks now pass them in the dark."
 zin_regional_verde_navigators_guild:0 "The Navigators' Guild"
 zin_regional_verde_navigators_guild_desc:0 "The guild keeps a hall of star-tables and sea-cords, and a navigator is not called master until he has taught three apprentices. Ships hire them by the season."
 zin_regional_verde_navigators_of_verde:0 "Navigators of Verde"
 zin_regional_verde_navigators_of_verde_desc:0 "Verde's navigators read the southern stars better than any, and the children of the coast learn the star-paths as others learn songs. A good navigator is better paid than a chief."
 zin_regional_verde_oaths_of_the_families:0 "Oaths of the Families"
 zin_regional_verde_oaths_of_the_families_desc:0 "Each family renews its oath to the hall at the first frost, with a handful of earth and a drop of blood. The oath-takers' sons are enrolled in the island's boats."
 zin_regional_verde_one_chief_of_verde:0 "Chief of All Verde"
 zin_regional_verde_one_chief_of_verde_desc:0 "The families have named one chief over all, and the hall's great horn is hers to sound. Oaths are renewed at the first frost, and nobody has yet broken one."
 zin_regional_verde_pilots_for_passing_ships:0 "Guides for Passing Ships"
 zin_regional_verde_pilots_for_passing_ships_desc:0 "Ships that call at Verde may hire a navigator to guide them through the shoals. The fee is small, the guides are proud, and the captains remember the courtesy."
 zin_regional_verde_priests_at_the_quays:0 "Priests at the Quays"
 zin_regional_verde_priests_at_the_quays_desc:0 "Grey-robed priests from the north have begun to meet the ships, offering blessings, bread and news. The islanders of [ROOT.GetName] are polite to them, and a little curious."
 zin_regional_verde_reef_lamps:0 "Lamps on the Reefs"
 zin_regional_verde_reef_lamps_desc:0 "Tallow lamps on poles mark the dangerous reefs, and ships that once smashed on the rocks now pass them in the dark."
 zin_regional_verde_send_them_on_their_way:0 "Send Them on Their Way"
 zin_regional_verde_send_them_on_their_way_desc:0 "The elders of [ROOT.GetName] thank the priests for their kindness, give them a good meal and put them on the next boat out. There is no insult in it, only the island's way of keeping what is its own."
 zin_regional_verde_shelter_for_the_wrecked:0 "Shelter for the Wrecked"
 zin_regional_verde_shelter_for_the_wrecked_desc:0 "A reef-wardens' hut is raised on every headland, stocked with dry blankets, salt fish and a signal horn. When a ship goes down, the islanders pull the survivors ashore before the tide has turned."
 zin_regional_verde_ships_for_the_strangers_host:0 "Ships for the Gathering Host"
 zin_regional_verde_ships_for_the_strangers_host_desc:0 "When a host gathers against the dead, the isles can send it boats and men."
 zin_regional_verde_star_paths:0 "The Star Paths"
 zin_regional_verde_star_paths_desc:0 "The navigators write their star-paths on knotted cords and plaited palm-leaf, passed from master to apprentice. The paths run to coasts no chart yet shows."
 zin_regional_verde_the_chiefs_gifts:0 "The Chief's Gifts"
 zin_regional_verde_the_chiefs_gifts_desc:0 "The chief distributes gifts at midwinter: cloth, tools, a boat for a young family. The families repay her in loyalty and in timber."
 zin_regional_verde_the_forest_law:0 "The Forest Law"
 zin_regional_verde_the_forest_law_desc:0 "The woodwards draw up a law of the forest: no tree felled unmarked, none sold unbranded, and two planted for every one cut. The hall signs it with a bark seal."
 zin_regional_verde_the_great_trees:0 "The Great Trees"
 zin_regional_verde_the_great_trees_desc:0 "Verde's greatest trees become keels, masts and ribs for the finest hulls of the south. A shipwright from the isles will pay a month's wages for a single plank."
 zin_regional_verde_the_green_isle:0 "The Green Isle"
 zin_regional_verde_the_green_isle_desc:0 "Verde is the green island of the south, forested to the water's edge and ringed with deep bays. Chief Lua Verd rules among the heads of its families, and sells timber to all who come."
 zin_regional_verde_the_green_woods:0 "The Green Woods"
 zin_regional_verde_the_green_woods_desc:0 "Verde's great trees grow tall and straight on the windward slopes, and some are older than the first charts. The woodwards mark each one they spare."
 zin_regional_verde_the_guest_right:0 "The Guest-Right"
 zin_regional_verde_the_guest_right_desc:0 "No wrecked sailor, no stray fisherman and no weary traveller has ever been turned from a door in [ROOT.GetName]. A guest is fed, warmed and housed for three days before anyone asks his name."
 zin_regional_verde_the_hall_of_verde:0 "The Hall of Verde"
 zin_regional_verde_the_hall_of_verde_desc:0 "The families of Verde meet in a long hall of green timber, each beneath its own banner. The hall's roof-beams are carved with the sea-birds of every clan."
 zin_regional_verde_the_isles_stand_together:0 "The Isles Stand Together"
 zin_regional_verde_the_isles_stand_together_desc:0 "Boats go out to every neighbouring island carrying a knotted cord, the island way of saying that peace is promised. [ROOT.GetName] and its neighbours agree to keep the peace between them for as long as the war lasts."
 zin_regional_verde_the_long_canoes:0 "The Long Canoes"
 zin_regional_verde_the_long_canoes_desc:0 "A long canoe of Verde holds forty paddlers and sails like a gull. The island's boatyards turn out a dozen each season."
 zin_regional_verde_the_navigators_guild:0 "The Navigators' Guild"
 zin_regional_verde_the_navigators_guild_desc:0 "The navigators form a guild with a hall, a seal and an oath. Ships from every isle hire its masters by the season."
 zin_regional_verde_the_storm_years:0 "The Storm Years"
 zin_regional_verde_the_storm_years_desc:0 "Word arrives by every boat that the kings of the north and west are at war. The islanders of [ROOT.GetName] look out across the empty sea, count their stores and decide to keep the war on the far side of the horizon."
 zin_regional_verde_timber_for_gala:0 "Timber for Gala"
 zin_regional_verde_timber_for_gala_desc:0 "Gala's shipwrights send letters asking for straight-grained Verde oak, and a first cargo goes south on a good wind. The elves pay in silver and in courtesy."
 zin_regional_verde_timber_for_the_west:0 "Timber for the West"
 zin_regional_verde_timber_for_the_west_desc:0 "The West is building a fleet to cross the central sea and has asked the isles for planks. Verde's yards offer five hulls' worth, cut, seasoned and shipped."
 zin_regional_verde_timber_for_the_yards:0 "Timber for the Yards"
 zin_regional_verde_timber_for_the_yards_desc:0 "Sawyers cut the planks, and oxen drag them to the shore. The yards of the southern isles buy Verde's timber because it does not rot."
 zin_regional_verde_verde_navigators:0 "Navigators of Verde"
 zin_regional_verde_verde_navigators_desc:0 "Verde's navigators learn the southern stars on their fathers' knees, and carry knotted cords to count the nights. They have sailed further than any chart."
 zin_regional_verde_watch_the_southern_waves:0 "Watch the Southern Waves"
 zin_regional_verde_watch_the_southern_waves_desc:0 "Whatever else the war brings, it may bring ships. Lookouts take their places on the headlands of [ROOT.GetName], and the boats are kept ready on their rollers."
 zin_regional_verde_welcome_the_healers:0 "Welcome the Healers"
 zin_regional_verde_welcome_the_healers_desc:0 "The healers of the Deliverer ask for a house on the quay, where the sick can be tended and the hungry fed. [ROOT.GetName] gives them a building, a well and a cautious welcome."
