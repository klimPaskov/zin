l_english:
 zin_shared_cold_lands_a_harbour_for_strangers:0 "A Harbour for Wayfarers"
 zin_shared_cold_lands_a_harbour_for_strangers_desc:0 "A quay is set aside for ships that come in off the grey sea with weather-beaten crews and no cargo to speak of. [ROOT.GetName] gives them bread, a dry bed and a steersman to see them out in the morning."
 zin_shared_cold_lands_a_house_of_healing:0 "A House of Healing"
 zin_shared_cold_lands_a_house_of_healing_desc:0 "Grey-robed healers ask leave to raise a house in [ROOT.GetName]: a hospital for the sick and a grain store for the hungry. Few turn away bread in a hard year, and the folk are glad of them."
 zin_shared_cold_lands_a_house_of_healing_tip_1:0 "The Houses of the First Light offer a hospital and a grain store."
 zin_shared_cold_lands_a_place_in_the_accord:0 "A Place in the Accord"
 zin_shared_cold_lands_a_place_in_the_accord_desc:0 "The elders ask for a seat at the table of the Northern Accord. If Fandanar agrees, the spears of [ROOT.GetName] will stand beside Coldor's and its envoys will sit at the Winter Crown's side."
 zin_shared_cold_lands_a_voice_at_court:0 "A Voice at Court"
 zin_shared_cold_lands_a_voice_at_court_desc:0 "An envoy of [ROOT.GetName] is given a stool in the liege's hall, near enough to hear and near enough to speak. A subject that is heard is not easily forgotten."
 zin_shared_cold_lands_against_the_black_water:0 "Against the Black Water"
 zin_shared_cold_lands_against_the_black_water_desc:0 "The black ships are real, and the dead come off them onto the beaches. [ROOT.GetName] raises forts on every strand and keeps its fires lit from dusk to dawn."
 zin_shared_cold_lands_answer_the_free_steadings:0 "Answer the Free Steadings"
 zin_shared_cold_lands_answer_the_free_steadings_desc:0 "Fearno gathers the steadings that want neither crown. [ROOT.GetName] sends riders with a request to join them, and waits at the border for the reply."
 zin_shared_cold_lands_beside_the_heir:0 "Beside the Gathering Host"
 zin_shared_cold_lands_beside_the_heir_desc:0 "A host is gathering against the dead, and the spears of [ROOT.GetName] come to stand in its ranks. Packhorses carry arms and grain south behind them, and the elders name a captain to speak for the steading in the host's councils."
 zin_shared_cold_lands_black_water:0 "Against the Black Water"
 zin_shared_cold_lands_black_water_desc:0 "Forts and signal-fires line every strand, for the dead come in off the black water."
 zin_shared_cold_lands_bowmen_of_the_snow:0 "Bowmen of the Snow"
 zin_shared_cold_lands_bowmen_of_the_snow_desc:0 "Short horn bows, strung with sinew that does not freeze, are put into the hands of every hunter. Their arrows fly flat and true even in a driving wind."
 zin_shared_cold_lands_bread_from_any_hand:0 "Bread from Any Hand"
 zin_shared_cold_lands_bread_from_any_hand_desc:0 "In a killing winter pride is a luxury. The moot of [ROOT.GetName] accepts grain from any caravan, friend or rival, and remembers the debt without resentment."
 zin_shared_cold_lands_charters_of_the_coast_towns:0 "Charters of the Towns"
 zin_shared_cold_lands_charters_of_the_coast_towns_desc:0 "Each town of [ROOT.GetName] receives a written charter: its own court, its own weights, its own watch. Disputes are settled by the town and not by the steading chief."
 zin_shared_cold_lands_count_the_stores:0 "Count the Stores"
 zin_shared_cold_lands_count_the_stores_desc:0 "Before the first frost, every hearth reports what it holds: grain, dried meat, firewood and tallow. The tally is carved on the moot-post, and no steading goes into the dark unwarned."
 zin_shared_cold_lands_envoys_to_fandanar:0 "Envoys to Fandanar"
 zin_shared_cold_lands_envoys_to_fandanar_desc:0 "Riders carry the moot's greetings to the Winter Crown, with furs and smoked meat for its table. Fandanar answers with a seat at its feasts and a promise to hear [ROOT.GetName] first."
 zin_shared_cold_lands_envoys_to_the_iron_hall:0 "Envoys to the Iron Hall"
 zin_shared_cold_lands_envoys_to_the_iron_hall_desc:0 "Riders carry gifts to Isengard and bring back iron and silence. The Iron Hall does not flatter, but it does not forget a friend."
 zin_shared_cold_lands_fires_through_the_long_night:0 "Fires Through the Long Night"
 zin_shared_cold_lands_fires_through_the_long_night_desc:0 "Forge-fires are kept burning through the dark months, and the smiths work by their glow. What is made in the long night is worth twice what is made in summer."
 zin_shared_cold_lands_fishermens_tales:0 "Fishermen's Tales"
 zin_shared_cold_lands_fishermens_tales_desc:0 "Old men on the quays mutter of black ships seen far out beyond the ice. At court, nobody believes them, and the fishermen stop telling the tale to anyone who does not mend nets."
 zin_shared_cold_lands_fishermens_tales_tip_1:0 "Black ships, the old men say. Nobody at court believes them."
 zin_shared_cold_lands_fishing_fleets:0 "Fishing Fleets"
 zin_shared_cold_lands_fishing_fleets_desc:0 "Dozens of small boats put out at dawn and return at dusk heavy with cod and herring. Salting-sheds line the shore, and the whole coast smells of brine and smoke."
 zin_shared_cold_lands_fishing_fleets_spirit:0 "[ROOT.GetAdjective] Fishing Fleets"
 zin_shared_cold_lands_fishing_fleets_spirit_desc:0 "Small boats go out at dawn and come back heavy. The salting-sheds never stand empty."
 zin_shared_cold_lands_friends_of_fandanar:0 "Friends of Fandanar"
 zin_shared_cold_lands_friends_of_fandanar_desc:0 "The hall of [ROOT.GetName] drinks to the Winter Crown and sends it a pledge of friendship. Coldor's riders are welcome at the fire, and its envoys are given the high seat."
 zin_shared_cold_lands_furs_and_iron:0 "Furs and Iron"
 zin_shared_cold_lands_furs_and_iron_desc:0 "Pelts go south and iron comes north, and the road between is the only wealth that [ROOT.GetName] has ever counted. The first forge is raised beside the great hall, where a smith may work out of the wind."
 zin_shared_cold_lands_furs_for_every_hearth:0 "Furs for Every Hearth"
 zin_shared_cold_lands_furs_for_every_hearth_desc:0 "The hunters of [ROOT.GetName] deliver a share of every kill to the hall, to be cut and sewn for the poorest. No child sleeps in the cold while a pelt hangs unused in a storehouse."
 zin_shared_cold_lands_guests_of_the_iron_hall:0 "Guests of the Iron Hall"
 zin_shared_cold_lands_guests_of_the_iron_hall_desc:0 "A delegation of [ROOT.GetAdjective] elders rides to Isengard and is feasted for a month. They return with iron gifts and a quiet promise that the Iron Hall remembers its friends."
 zin_shared_cold_lands_hearth_law:0 "Hearth Law"
 zin_shared_cold_lands_hearth_law_desc:0 "Whoever shares a fire shares its law: no blood spilt at a hearth, no guest turned out into the snow. [ROOT.GetAdjective] clans carve the old rules into the lintel stones so that no child can plead ignorance."
 zin_shared_cold_lands_hearth_law_spirit:0 "Hearth Law"
 zin_shared_cold_lands_hearth_law_spirit_desc:0 "No blood is shed at a hearth, and no guest is turned into the snow. The old law keeps the steadings quiet and hard to turn."
 zin_shared_cold_lands_hill_wardens:0 "Hill Wardens"
 zin_shared_cold_lands_hill_wardens_desc:0 "The steep paths above every hall are given to sworn wardens who live in stone huts through the year. Their drills teach the levies to hold a slope against a charge."
 zin_shared_cold_lands_hunters_of_the_old_ice:0 "Hunters of the Old Ice"
 zin_shared_cold_lands_hunters_of_the_old_ice_desc:0 "The hunting bands of the far north know every crevasse and every wind. They teach their sons to read the ice the way a scribe reads a page."
 zin_shared_cold_lands_hunting_bands:0 "Hunting Bands of the Kin"
 zin_shared_cold_lands_hunting_bands_desc:0 "Bands of the kin range the mountain ledges in search of game, silent and unseen. Their hunting-craft is taught at last to the clans below."
 zin_shared_cold_lands_keep_to_the_snows:0 "Keep to the Snows"
 zin_shared_cold_lands_keep_to_the_snows_desc:0 "Let the south burn, say the elders; the clans of [ROOT.GetName] have enough to do keeping their own hearths warm. The gates are barred, the passes watched and the herds brought down from the hills."
 zin_shared_cold_lands_keep_to_the_snows_spirit:0 "Keep to the Snows"
 zin_shared_cold_lands_keep_to_the_snows_spirit_desc:0 "Let the south settle its own quarrels. The gates are barred and the herds are close."
 zin_shared_cold_lands_kin_of_the_high_snows:0 "Kin of the High Snows"
 zin_shared_cold_lands_kin_of_the_high_snows_desc:0 "High above the steadings live the kin of the high snows, who answer to no hall and rarely come down. [ROOT.GetName] holds out a hand and finds it not refused."
 zin_shared_cold_lands_leave_the_castle_be:0 "Leave the Castle Be"
 zin_shared_cold_lands_leave_the_castle_be_desc:0 "Riders carry a gift of furs to the castle gate and leave it unopened on the step. The elders of [ROOT.GetName] swear an oath of peace, and the castle does not answer, which they take as acceptance."
 zin_shared_cold_lands_levies_for_the_overlord:0 "Levies for the Overlord"
 zin_shared_cold_lands_levies_for_the_overlord_desc:0 "Young spearmen of [ROOT.GetName] march south to serve a season in their liege's host. They return with new tricks and old scars, and the elders say they have grown."
 zin_shared_cold_lands_long_night:0 "Fires Through the Long Night"
 zin_shared_cold_lands_long_night_desc:0 "The forges burn through the dark months, and the smiths are paid in firewood and ale."
 zin_shared_cold_lands_markets_for_all_comers:0 "Markets for All Comers"
 zin_shared_cold_lands_markets_for_all_comers_desc:0 "The gates of [ROOT.GetName] are opened to every trader, whatever banner he rides under. A free market is the best answer to a land that two crowns would like to claim."
 zin_shared_cold_lands_muster_horn:0 "The Muster Horn"
 zin_shared_cold_lands_muster_horn_desc:0 "One great horn, one note, and every spear comes down from the wall."
 zin_shared_cold_lands_neck_tolls:0 "Toll-Posts on the Neck"
 zin_shared_cold_lands_neck_tolls_desc:0 "Every cart that crosses the Neck leaves a penny at the bar."
 zin_shared_cold_lands_old_ice_hunters:0 "Hunters of the Old Ice"
 zin_shared_cold_lands_old_ice_hunters_desc:0 "Bands of far-edge hunters read the ice like a scribe reads a page."
 zin_shared_cold_lands_one_hearth:0 "One Hearth for the [ROOT.GetAdjective] Clans"
 zin_shared_cold_lands_one_hearth_desc:0 "The moot ends in a feast that fills every hall of [ROOT.GetName] at once. For a season the clans eat as one household, and no chief remembers the feuds of last year."
 zin_shared_cold_lands_open_markets:0 "Markets for All Comers"
 zin_shared_cold_lands_open_markets_desc:0 "The gates stand open to every trader, and every trader leaves with a good word."
 zin_shared_cold_lands_our_own_snow:0 "Our Own Snow"
 zin_shared_cold_lands_our_own_snow_desc:0 "The moot decides that the snow of [ROOT.GetName] belongs to its own people and to no crown. Envoys of both halls are fed and sent home with polite refusals."
 zin_shared_cold_lands_own_snow:0 "Our Own Snow"
 zin_shared_cold_lands_own_snow_desc:0 "The snow belongs to those who live on it. The clans stand together when a crown sends envoys."
 zin_shared_cold_lands_send_spears_south:0 "Send Spears South"
 zin_shared_cold_lands_send_spears_south_desc:0 "The young chiefs argue that the snows will not stay safe if the south falls. A war-band of [ROOT.GetName] sets out to cross the long road under the old banner of the Lost Cause."
 zin_shared_cold_lands_ships_for_the_western_yards:0 "Ships for the Western Yards"
 zin_shared_cold_lands_ships_for_the_western_yards_desc:0 "The kings of the West need hulls for their crossing, and the shipwrights of [ROOT.GetName] know how to build for northern seas. A fleet is promised from the cold slipways, and the western yards send timber and coin in return."
 zin_shared_cold_lands_sledge_tracks:0 "Sledge Tracks"
 zin_shared_cold_lands_sledge_tracks_desc:0 "The packed snow-roads are marked with poles and posts, and every steading keeps its stretch clear. A loaded sledge can now cross [ROOT.GetName] before the next storm."
 zin_shared_cold_lands_smithies:0 "The Smithies"
 zin_shared_cold_lands_smithies_desc:0 "Axe-heads, spear-points and iron nails come off the anvils faster than the clans can use them. A row of smithies grows along the stream where the water is swift enough to turn a hammer."
 zin_shared_cold_lands_snow_runners:0 "Snow-Runners"
 zin_shared_cold_lands_snow_runners_desc:0 "Hunters on broad wooden shoes cross drifts that stop a mounted man. They carry the host's word between steadings and scout every pass before the clans march."
 zin_shared_cold_lands_snow_runners_trained:0 "Snow-Runners"
 zin_shared_cold_lands_snow_runners_trained_desc:0 "Hunters on broad shoes carry word between steadings and lead the host across drifts."
 zin_shared_cold_lands_snow_watch:0 "Watchers on the Snow"
 zin_shared_cold_lands_snow_watch_desc:0 "Shepherds on the high ridges report anything that moves on the castle road."
 zin_shared_cold_lands_songs_of_the_houseless_king:0 "Songs of the King Without a House"
 zin_shared_cold_lands_songs_of_the_houseless_king_desc:0 "Skalds of the far edge compose long songs of a wanderer who owns no hall and has no roof but the stars. In every steading they are sung at the third cup, and the young listen with shining eyes."
 zin_shared_cold_lands_speak_at_the_winter_moot:0 "Speak at the Winter Moot"
 zin_shared_cold_lands_speak_at_the_winter_moot_desc:0 "When the roads are closed, the chiefs gather in the biggest hall and tell each other how the year has gone. A good speaker at the Winter Moot may change the course of a whole season."
 zin_shared_cold_lands_steading_charter:0 "The Charter of the Steading"
 zin_shared_cold_lands_steading_charter_desc:0 "The liege and the steading each hold half of a sealed oak charter. Both know what is owed."
 zin_shared_cold_lands_thaw_markets:0 "When the Thaw Comes"
 zin_shared_cold_lands_thaw_markets_desc:0 "Meltwater fills the ditches, the roads open, and the first market of spring is the merriest of the year."
 zin_shared_cold_lands_the_carrying_boats:0 "The Carrying Boats"
 zin_shared_cold_lands_the_carrying_boats_desc:0 "Broad, shallow-bottomed boats carry furs, iron and salt fish from one cold harbour to the next. The shipwrights learn to build for ice as well as for waves."
 zin_shared_cold_lands_the_charter_of_the_steading:0 "The Charter of the Steading"
 zin_shared_cold_lands_the_charter_of_the_steading_desc:0 "A charter is cut in good oak and sealed in two places: the steading keeps one half, and the liege the other. The rights of [ROOT.GetName] are written in a hand that cannot be argued with."
 zin_shared_cold_lands_the_clan_host:0 "The Clan Host"
 zin_shared_cold_lands_the_clan_host_desc:0 "Each steading names its spearmen, each chief his captains, and the muster-stones are set along the roads. The host of [ROOT.GetName] is a gathering of households, and it fights like one."
 zin_shared_cold_lands_the_clan_moot_sits:0 "The Clan Moot Sits"
 zin_shared_cold_lands_the_clan_moot_sits_desc:0 "When the snow-roads close, the chiefs ride in and the moot sits for nine nights. Each steading brings its grievance and its gift."
 zin_shared_cold_lands_the_coast_league:0 "A League of Free Towns"
 zin_shared_cold_lands_the_coast_league_desc:0 "The council of [ROOT.GetName] writes to a sister council across the border, proposing that the free towns of the Cold Lands keep the peace between them and trade without tolls."
 zin_shared_cold_lands_the_cold_coast:0 "The Cold Coast"
 zin_shared_cold_lands_the_cold_coast_desc:0 "Where the ice breaks in summer, [ROOT.GetName] keeps a few harbours. A stone quay and a boat-shed make the first of them, and a lamp on the headland guides the boats home."
 zin_shared_cold_lands_the_elders_speak:0 "The Elders Speak"
 zin_shared_cold_lands_the_elders_speak_desc:0 "The old men and women of [ROOT.GetName] remember the hard winters and the broken oaths. Their word is heard first, and the steadings take it as the weather of the year to come."
 zin_shared_cold_lands_the_far_edge:0 "The Far Edge of the World"
 zin_shared_cold_lands_the_far_edge_desc:0 "Beyond the last steading of [ROOT.GetName] the ice runs on to the edge of all maps. Hunters go out in autumn and come back in spring, if the old paths hold."
 zin_shared_cold_lands_the_free_towns:0 "The Free Towns of [ROOT.GetName]"
 zin_shared_cold_lands_the_free_towns_desc:0 "Guild-halls and market squares have grown up where the roads cross, and their burghers want a say in the rule of [ROOT.GetName]. The towns are given a charter and a bell."
 zin_shared_cold_lands_the_harbour_wall:0 "The Harbour Wall"
 zin_shared_cold_lands_the_harbour_wall_desc:0 "A wall of fitted stone rises above the quays, with a watch-tower at each end. Sea-raiders find the harbours of [ROOT.GetName] harder to enter than they remember."
 zin_shared_cold_lands_the_ice_paths:0 "The Ice Paths"
 zin_shared_cold_lands_the_ice_paths_desc:0 "Marked trails are cut across the glaciers, with ropes at the steep places and stone huts at each day's end. A sledge can now cross ground that no beast would cross a year ago."
 zin_shared_cold_lands_the_iron_halls_shield:0 "The Iron Hall's Shield"
 zin_shared_cold_lands_the_iron_halls_shield_desc:0 "The elders of [ROOT.GetName] ask the Iron Hall to stand behind them. Isengard's shield is heavy, and few who take it ever put it down again."
 zin_shared_cold_lands_the_light_is_gone:0 "The Light Is Gone"
 zin_shared_cold_lands_the_light_is_gone_desc:0 "The green light in the north is gone, and the herders can walk the high pastures without feeling watched. Nobody knows what the castle keeps now."
 zin_shared_cold_lands_the_light_is_gone_tip_1:0 "The green light in the north is gone. Nobody knows what the castle keeps now."
 zin_shared_cold_lands_the_long_winters:0 "The Long Winters"
 zin_shared_cold_lands_the_long_winters_desc:0 "Every winter here is long, and some are deadly. The elders of [ROOT.GetName] have buried enough children to know that the cold is an enemy to be planned against."
 zin_shared_cold_lands_the_long_winters_tip_1:0 "Every winter here is long. Some winters kill."
 zin_shared_cold_lands_the_man_from_the_ice:0 "The Man from the Ice"
 zin_shared_cold_lands_the_man_from_the_ice_desc:0 "The old clans tell of a man found alive where no man could live, and the far steadings keep his story. [ROOT.GetName] sends its hunters to guard the ice paths he walked."
 zin_shared_cold_lands_the_muster_horn:0 "The Muster Horn"
 zin_shared_cold_lands_the_muster_horn_desc:0 "A great horn of ox-bone is hung in the hall of [ROOT.GetName], and its note carries to the farthest steading. When it sounds, every spear in the land comes down from the wall."
 zin_shared_cold_lands_the_neck_steadings:0 "Steadings on the Neck"
 zin_shared_cold_lands_the_neck_steadings_desc:0 "The neck of land between the seas is crossed by one road, and the steadings along it have grown rich on travellers. [ROOT.GetName] lays new stone along the road and builds rest-halls at every ford."
 zin_shared_cold_lands_the_old_kin_muster:0 "The Old Kin Muster"
 zin_shared_cold_lands_the_old_kin_muster_desc:0 "At a call older than any hall, the kin come down from the peaks with stones and clubs the size of a man. [ROOT.GetName] has not seen such a host in living memory."
 zin_shared_cold_lands_the_silent_castle:0 "The Silent Castle"
 zin_shared_cold_lands_the_silent_castle_desc:0 "A castle stands in the frozen north, and the herders of [ROOT.GetName] have learned not to speak of it after dark. Its lord does not ride out, and its light does not fail."
 zin_shared_cold_lands_the_silent_castle_tip_1:0 "A castle stands in the frozen north. Its lord does not ride out, and its light does not fail."
 zin_shared_cold_lands_the_steading_endures:0 "The Steading Endures"
 zin_shared_cold_lands_the_steading_endures_desc:0 "Years of balanced dealing teach the neighbours to leave [ROOT.GetName] alone. The moot sets about cooling every old friendship and every old grudge."
 zin_shared_cold_lands_the_steading_hall:0 "The Steading Hall of [ROOT.GetName]"
 zin_shared_cold_lands_the_steading_hall_desc:0 "Every clan of [ROOT.GetName] has a long timber hall where the fire never goes out, and every quarrel ends there in the end. The elders open the hall to all hearths and let the year be planned beneath one roof."
 zin_shared_cold_lands_the_towns_council:0 "The Towns' Council"
 zin_shared_cold_lands_the_towns_council_desc:0 "Delegates of every town meet in the guild-hall of the largest, and their votes are counted in pebbles. For the first time the voice of the burghers rings as loud as the chiefs'."
 zin_shared_cold_lands_the_trading_post:0 "The Trading Post"
 zin_shared_cold_lands_the_trading_post_desc:0 "A palisade by the ford, a scale and a ledger, and a factor who keeps the peace of the market. Southern traders learn that the clans of [ROOT.GetName] weigh honestly and remember cheats."
 zin_shared_cold_lands_the_two_halls:0 "Between the Two Halls"
 zin_shared_cold_lands_the_two_halls_desc:0 "Fandanar sends envoys. Isengard sends gifts. [ROOT.GetName] sits between the Winter Crown and the Iron Hall, and neither will wait for an answer forever."
 zin_shared_cold_lands_the_two_halls_tip_1:0 "Fandanar sends envoys. The Iron Hall sends gifts. [ROOT.GetName] must answer one day."
 zin_shared_cold_lands_toll_posts_on_the_neck:0 "Toll-Posts on the Neck"
 zin_shared_cold_lands_toll_posts_on_the_neck_desc:0 "A bar across the road, a toll-keeper with a ledger and a hut with a stove: every cart that passes pays its penny. The coin is small, but the carts are many."
 zin_shared_cold_lands_town_charters:0 "Charters of the Towns"
 zin_shared_cold_lands_town_charters_desc:0 "Each town has its own court, its own weights and its own watch."
 zin_shared_cold_lands_town_league:0 "League of Free Towns"
 zin_shared_cold_lands_traders_to_the_west:0 "Traders to the West"
 zin_shared_cold_lands_traders_to_the_west_desc:0 "Caravans of furs and iron set out for the western kingdoms, guarded by hired spears. Their return, laden with wine and cloth, makes the steadings of the Neck the envy of the north."
 zin_shared_cold_lands_trading_post:0 "The Trading Post"
 zin_shared_cold_lands_trading_post_desc:0 "A palisade, a scale and a keeper who weighs honestly. Wares sell for a fair price here."
 zin_shared_cold_lands_tribute_of_furs:0 "Tribute of Furs"
 zin_shared_cold_lands_tribute_of_furs_desc:0 "Bales of the best pelts leave [ROOT.GetName] each autumn under a sealed line of carts. The liege is pleased, and the steading is left in peace for another year."
 zin_shared_cold_lands_under_a_greater_crown:0 "Under a Greater Crown"
 zin_shared_cold_lands_under_a_greater_crown_desc:0 "The liege of [ROOT.GetName] sits in a hall far away, and its seal is on every writ. The steading learns what it owes and what it may expect in return."
 zin_shared_cold_lands_watchers_on_the_snow:0 "Watchers on the Snow"
 zin_shared_cold_lands_watchers_on_the_snow_desc:0 "Shepherds and hunters take turns on the high ridges, watching the castle road day and night. Anything that moves on the snow is reported to the hall before nightfall."
 zin_shared_cold_lands_west_traders:0 "Traders to the West"
 zin_shared_cold_lands_west_traders_desc:0 "Caravans go west laden with furs and return with wine and cloth."
 zin_shared_cold_lands_when_the_thaw_comes:0 "When the Thaw Comes"
 zin_shared_cold_lands_when_the_thaw_comes_desc:0 "The first meltwater runs in the ditches, and the hall of [ROOT.GetName] throws open its doors. Seed is carried out to the fields and the herds are driven up to the new grass."
 zin_shared_cold_lands_winter_furs:0 "Furs for Every Hearth"
 zin_shared_cold_lands_winter_furs_desc:0 "A share of every kill goes to the hall, so that no child sleeps cold."
 zin_shared_cold_lands_winter_stores:0 "Winter Stores"
 zin_shared_cold_lands_winter_stores_desc:0 "Smoked fish, dried berries and barrels of grain are counted in autumn and locked in the long cellars. [ROOT.GetName] will meet the dark months with full larders."
 zin_shared_cold_lands_word_from_the_south:0 "Word from the South"
 zin_shared_cold_lands_word_from_the_south_desc:0 "Riders come north with grim tidings: crowns are falling, the sea has been crossed and the dead walk. The moot of [ROOT.GetName] must decide what the cold lands owe the warm."
 zin_shared_cold_lands.1.a:0 "The elders' way"
 zin_shared_cold_lands.1.b:0 "The young chiefs' way"
 zin_shared_cold_lands.1.d:0 "The chiefs have gathered in the steading hall. The old want the winter stores counted twice before anything else is decided; the young want their spears sharpened and a banner raised before the thaw. The hall waits for the first man to rise."
 zin_shared_cold_lands.1.t:0 "The Clan Moot of [ROOT.GetName]"
 zin_shared_cold_lands.2.a:0 "Welcome them"
 zin_shared_cold_lands.2.b:0 "Not yet"
 zin_shared_cold_lands.2.d:0 "Envoys of [FROM.GetName] stand at the door of the hall in Fandanar, snow still on their cloaks. They ask for a seat at the table of the Northern Accord, and promise their spears when the horn sounds."
 zin_shared_cold_lands.2.t:0 "A Steading Asks for a Place in the Accord"
 zin_shared_cold_lands.3.a:0 "Stand behind them"
 zin_shared_cold_lands.3.b:0 "Not our quarrel"
 zin_shared_cold_lands.3.d:0 "A rider from [FROM.GetName] stands in the Iron Hall of Isengard and asks that its lord stand behind the steading, should another crown reach for its snows. The hall is silent while it weighs the price."
 zin_shared_cold_lands.3.t:0 "A Steading Seeks the Iron Hall's Shield"
 zin_shared_cold_lands.4.a:0 "Welcome them"
 zin_shared_cold_lands.4.b:0 "Not now"
 zin_shared_cold_lands.4.d:0 "[FROM.GetName] wants neither crown and asks to stand with the Free Steadings. Its riders wait outside in the cold, and the elders of Fearno must decide whether another mouth at the table is a strength or a burden."
 zin_shared_cold_lands.4.t:0 "A Steading Asks to Join the Free Steadings"
 zin_shared_cold_lands.5.a:0 "Sign the league"
 zin_shared_cold_lands.5.b:0 "Decline"
 zin_shared_cold_lands.5.d:0 "The council of [FROM.GetName] offers a league of free towns: no war between us, open markets and the freedom of each town to rule itself. The letter is signed by every guildmaster and sealed with the town bell."
 zin_shared_cold_lands.5.t:0 "A League of Free Towns"
