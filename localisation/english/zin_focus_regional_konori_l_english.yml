l_english:
 zin_regional_konori_a_crown_of_grass_and_iron:0 "A Crown of Grass and Iron"
 zin_regional_konori_a_crown_of_grass_and_iron_desc:0 "The king's crown is remade in iron from the border mines, bound with the same plaited grass as before. It is a small ceremony, and the Hundreds attend it all."
 zin_regional_konori_burn_the_grass:0 "Burn the Grass"
 zin_regional_konori_burn_the_grass_desc:0 "The steppe is fired before the invader. An army that cannot feed its horses will not go far, and Konori's own can ride back through the ashes."
 zin_regional_konori_cavalry_drill:0 "Cavalry Drill"
 zin_regional_konori_cavalry_drill_desc:0 "The Hundreds are taught to wheel as one, to the beat of a single drum. The first muster is chaos; the third is a thing of beauty."
 zin_regional_konori_customs_of_the_road:0 "Customs of the Road"
 zin_regional_konori_customs_of_the_road_desc:0 "Toll-houses are raised at the fords along the eastern road. A caravan pays once, receives a seal, and is waved through the rest."
 zin_regional_konori_eastern_road_trade:0 "Customs of the Road"
 zin_regional_konori_eastern_road_trade_desc:0 "Toll-houses at the fords bring goodwill, though they cost the steppe its cheap goods."
 zin_regional_konori_eastern_watch:0 "Watch on the East"
 zin_regional_konori_eastern_watch_desc:0 "Riders watching the eastern grass for dust, smoke and strangers."
 zin_regional_konori_envoys_beyond_the_wall:0 "Envoys Beyond the Wall"
 zin_regional_konori_envoys_beyond_the_wall_desc:0 "Konori sends traders to the gates of the Wall, with horses, leather and a letter for the elders of the great forest. The elves are slow to answer and quick to remember."
 zin_regional_konori_friends_at_the_gate:0 "Friends at the Gate"
 zin_regional_konori_friends_at_the_gate_desc:0 "Konori sends riders to the lords of the Wall-gate at Kingson with gifts of horses and a message of good will. The riders are told to keep their lances sheathed."
 zin_regional_konori_horse_archers:0 "Horse Archers"
 zin_regional_konori_horse_archers_desc:0 "Light riders loose from the saddle at full gallop, wheeling and turning with the speed of birds. A host of them can darken the sky and be gone before the dust has settled."
 zin_regional_konori_horse_fairs:0 "The Horse Fairs"
 zin_regional_konori_horse_fairs_2:0 "Wealth of the Herds"
 zin_regional_konori_horse_fairs_2_desc:0 "The steppe counts its wealth in hooves, and the count has never been higher."
 zin_regional_konori_horse_fairs_desc:0 "For nine days a year the whole steppe converges on the river meadows to bargain."
 zin_regional_konori_law_of_the_fords:0 "The Law of the Fords"
 zin_regional_konori_law_of_the_fords_desc:0 "Disputes at river crossings are judged by a single code: first come, first over, and the weaker party chooses the hour. The rule is old, and nobody has ever improved on it."
 zin_regional_konori_oaths_of_the_hundreds:0 "Oaths of the Hundreds"
 zin_regional_konori_oaths_of_the_hundreds_desc:0 "Each horse-lord swears anew to the king, with a hand on the saddle and a word to the horse. The oath binds them more surely than a seal, for a horse remembers."
 zin_regional_konori_outriders:0 "Outriders"
 zin_regional_konori_outriders_desc:0 "Riders go out ahead of every host, in pairs, to a day's ride in each direction. They do not fight; they look, and they report."
 zin_regional_konori_outriders_spirit:0 "Outriders"
 zin_regional_konori_outriders_spirit_desc:0 "Pairs of riders ahead of every host, a day's ride in each direction."
 zin_regional_konori_remounts_for_parim:0 "Remounts for Parim"
 zin_regional_konori_remounts_for_parim_desc:0 "Konori's horses mount Aenor's knights. Parim buys remounts by the thousand and asks no questions, and the steppe is very fond of such customers."
 zin_regional_konori_ride_with_the_heir:0 "Ride with the Heir"
 zin_regional_konori_ride_with_the_heir_desc:0 "The Heir has returned, and Konori's riders carry the news from fair to fair. The Hundreds do not wait for the king's order."
 zin_regional_konori_riders_for_the_concord:0 "Riders for the Concord"
 zin_regional_konori_riders_for_the_concord_desc:0 "Konori offers its riders to the Concord, to serve as its eastern cavalry reserve. Parim accepts gladly and thanks the steppe for its loyalty."
 zin_regional_konori_riders_of_konori:0 "Riders of Konori"
 zin_regional_konori_riders_of_konori_desc:0 "The riders of Konori are born in the saddle and buried with the bridle. They need no training save the kind that comes of a lifetime."
 zin_regional_konori_riders_welcome:0 "Riders at the Gate"
 zin_regional_konori_river_markets:0 "River Markets"
 zin_regional_konori_river_markets_desc:0 "The fair-grounds become a permanent market, with stalls of timber and canvas along the river-bank. Merchants arrive each week instead of each year."
 zin_regional_konori_saddlers_and_smiths:0 "Saddlers and Smiths"
 zin_regional_konori_saddlers_and_smiths_desc:0 "Saddlers, bit-makers and smiths work in long sheds beside the fair-grounds. They are the quiet half of Konori's fortune."
 zin_regional_konori_steppe_archers:0 "Horse Archers"
 zin_regional_konori_steppe_archers_2:0 "Cavalry Drill"
 zin_regional_konori_steppe_archers_2_desc:0 "The Hundreds wheel as one, to the beat of a single drum."
 zin_regional_konori_steppe_archers_desc:0 "Light riders who loose from the saddle at full gallop."
 zin_regional_konori_steppe_crown:0 "The Steppe Crown"
 zin_regional_konori_steppe_crown_2:0 "Oaths of the Hundreds"
 zin_regional_konori_steppe_crown_2_desc:0 "Every horse-lord has sworn anew, with a hand on the saddle and a word to the horse."
 zin_regional_konori_steppe_crown_desc:0 "A crown of iron and plaited grass, older than any dynasty that wore it."
 zin_regional_konori_steppe_traders:0 "Traders of the Steppe"
 zin_regional_konori_stud_farms_of_konori:0 "The Stud Farms of Konori"
 zin_regional_konori_stud_farms_of_konori_desc:0 "The best stallions of the steppe are gathered on a few well-watered farms and bred for size, wind and temper. A Konori colt is worth three Aenoran ones."
 zin_regional_konori_temples_at_the_fairs:0 "Temples at the Fairs"
 zin_regional_konori_temples_at_the_fairs_desc:0 "Almoners of the Deliverer have raised tents at the great fairs, offering bread, linen and a place to sleep. Konori's horse-lords find them useful, and not very interesting."
 zin_regional_konori_the_eastern_road:0 "The Eastern Road"
 zin_regional_konori_the_eastern_road_desc:0 "The eastern road runs from the fair-grounds to the Wall, a straight line across rolling grass. A king's outrider can ride it in four days."
 zin_regional_konori_the_great_horse_fair:0 "The Great Horse Fair"
 zin_regional_konori_the_great_horse_fair_desc:0 "Once a year the whole steppe converges on the river meadows, with horses by the thousand and buyers from as far as the Wall. For nine days there is no law but the bargain."
 zin_regional_konori_the_hundreds:0 "The Hundreds"
 zin_regional_konori_the_hundreds_desc:0 "Each of the Hundreds is a clan, a hundred hearths with a horse-lord at their head. They come to the king's banner on the first day of the grass and go home on the last."
 zin_regional_konori_the_hundreds_muster:0 "The Hundreds Muster"
 zin_regional_konori_the_hundreds_muster_desc:0 "Every Hundred sends its riders to the muster-ground, with bows, lances and spare horses. The king reviews them from a hill and says nothing for a long time."
 zin_regional_konori_the_kings_progress:0 "The King's Progress"
 zin_regional_konori_the_kings_progress_desc:0 "King Sventor rides the whole of the steppe in a single summer, from the fords of the west to the fair-grounds of the east. At every tent he is offered a bowl of mare's milk and a grievance."
 zin_regional_konori_the_royal_lances:0 "The Royal Lances"
 zin_regional_konori_the_royal_lances_desc:0 "The king's own riders wear mail and carry long lances of ash. They are few, but when they charge the grass shakes for a mile."
 zin_regional_konori_the_steppe_crown:0 "The Steppe Crown"
 zin_regional_konori_the_steppe_crown_desc:0 "The kings of Konori rule through the Hundreds, the riding clans that muster to the royal banner. The crown is an iron circlet bound with plaited grass, and it has outlasted every dynasty that wore it."
 zin_regional_konori_the_steppe_endures:0 "The Steppe Endures"
 zin_regional_konori_the_steppe_endures_desc:0 "The grass grows back, as it always does. The Hundreds ride home, the fairs reopen and the king rides his progress in a quieter summer."
 zin_regional_konori_the_steppe_host:0 "The Steppe Host"
 zin_regional_konori_the_steppe_host_desc:0 "On the king's horn the Hundreds muster as a single host, ten thousand riders under a hundred banners. It is a sight no steppe-dweller will forget."
 zin_regional_konori_the_steppe_rides_to_war:0 "The Steppe Rides to War"
 zin_regional_konori_the_steppe_rides_to_war_desc:0 "The king's horn sounds across the grass, and every Hundred answers. Konori's horses were bred for this, and its riders have been waiting for it all their lives."
 zin_regional_konori_the_steppe_roads:0 "The Steppe Roads"
 zin_regional_konori_the_steppe_roads_desc:0 "Packed-earth roads cross the grass from fair to fair, marked with white stones for the use of strangers. For the first time the steppe is made easy to cross."
 zin_regional_konori_war_on_the_steppe:0 "War on the Steppe"
 zin_regional_konori_war_on_the_steppe_desc:0 "The horn has sounded and every Hundred has answered."
 zin_regional_konori_watch_on_the_east:0 "Watch on the East"
 zin_regional_konori_watch_on_the_east_desc:0 "Riders watch the eastern grass for dust, smoke and strangers. The steppe has long been the road of any eastern army that turns west."
 zin_regional_konori_wealth_of_the_herds:0 "Wealth of the Herds"
 zin_regional_konori_wealth_of_the_herds_desc:0 "The steppe counts its wealth in hooves, and the count has never been higher. The king's treasurer is seen smiling."
 zin_regional_konori.1.a:0 "Judge their quarrels."
 zin_regional_konori.1.b:0 "Feast with the clans."
 zin_regional_konori.1.d:0 "King Sventor rides the steppe in a single summer, from the fords to the fair-grounds. At every tent he is offered mare's milk and a quarrel, and he must decide whether to be generous with his table or with his judgement."
 zin_regional_konori.1.t:0 "The King Among the Hundreds"
 zin_regional_konori.2.a:0 "Let it be."
 zin_regional_konori.2.b:0 "Bless it."
 zin_regional_konori.2.d:0 "The Deliverer's almoners have raised a tent of healing at the great fair, and a queue of the sick has formed before they have finished tying the ropes. The horse-lords are asked to bless it and let it stay."
 zin_regional_konori.2.t:0 "The Deliverer's Tent"
 zin_regional_konori.3.a:0 "Tolls are tolls."
 zin_regional_konori.3.b:0 "Open the road to them."
 zin_regional_konori.3.d:0 "A company of riders from Konori has come to the Wall-gate at Kingson, with horses, gifts and a letter of friendship. Their lances are sheathed, their manners are impeccable and the lords of the gate are suspicious of both."
 zin_regional_konori.3.t:0 "Riders at the Gate"
 zin_regional_konori.4.a:0 "The Wall is the Wall."
 zin_regional_konori.4.b:0 "Welcome their traders."
 zin_regional_konori.4.d:0 "Traders from Konori have reached the gate of the Great Wall, bearing horses, leather and a letter for the elders of the great forest. They ask only that the elves let them cross to trade."
 zin_regional_konori.4.t:0 "Envoys from the Steppe"
