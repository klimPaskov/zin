l_english:
 zin_regional_r_en_a_price_for_passage:0 "A Price for Passage"
 zin_regional_r_en_a_price_for_passage_desc:0 "Lerendor has left the old treaty, and the strait is closed to belligerents. R'en sells passage at a price, and the harbour houses sell it dearly."
 zin_regional_r_en_a_shield_from_parim:0 "A Shield from Parim"
 zin_regional_r_en_a_shield_from_parim_desc:0 "R'en asks the king in Parim to guarantee its capes. The king has a long reach, and the Prince hopes it is a kind one."
 zin_regional_r_en_aenoran_trade:0 "The Aenoran Trade"
 zin_regional_r_en_aenoran_trade_desc:0 "The harbour houses live on Aenoran cargoes, and the warehouses show it. Spice, silk and pitch pass through on the same quay, and R'en takes a tenth."
 zin_regional_r_en_against_the_black_hulls:0 "Against the Black Hulls"
 zin_regional_r_en_against_the_black_hulls_desc:0 "Black hulls have been seen in the northern waters, and the capes are alert. The Prince sends the galley watch to meet them, and prays the chains will hold."
 zin_regional_r_en_between_the_two_masters:0 "Between the Two Masters"
 zin_regional_r_en_between_the_two_masters_desc:0 "R'en pays Sonargur's strait dues like everyone else, and remembers being squeezed between the strait's two masters. The Prince writes down what he would like, and what he would accept."
 zin_regional_r_en_chains_across_the_gateway:0 "Chains Across the Gateway"
 zin_regional_r_en_chains_across_the_gateway_desc:0 "Great chains are forged and laid across the narrows. If they are drawn tight, no hull will pass between the seas without the Prince's leave."
 zin_regional_r_en_charts_of_the_two_seas:0 "Charts of the Two Seas"
 zin_regional_r_en_charts_of_the_two_seas_desc:0 "The wayfinders' guild draws a chart of the gateway from the northern shoals to the southern capes. It is kept in a locked chest, and shown only to the guild."
 zin_regional_r_en_free_gateway:0 "The Free Gateway"
 zin_regional_r_en_free_gateway_2:0 "Open to Every Flag"
 zin_regional_r_en_free_gateway_2_desc:0 "R'en welcomes all flags without question, and its quays sound like a market. Its trade is the richest in the North, and no master can say it owns the gateway."
 zin_regional_r_en_free_gateway_desc:0 "The gateway is free to every flag, and R'en says so loudly. Its harbours are open, its dues are low and its harbour houses are glad to have the business."
 zin_regional_r_en_friendship:0 "Friendship of R'en"
 zin_regional_r_en_gateway_at_war:0 "The Strait Closes"
 zin_regional_r_en_gateway_at_war_desc:0 "The strait is closed to every fleet at war, and R'en's towers and chains guard it. The harbours are quiet, the capes are manned and the wayfinders keep their own counsel."
 zin_regional_r_en_gateway_chains:0 "Chains Across the Gateway"
 zin_regional_r_en_gateway_chains_desc:0 "Great iron chains lie ready at the capes, slung between towers on either side. If they are drawn tight, no hull will pass between the seas."
 zin_regional_r_en_gateway_companies:0 "Gateway Companies for the Heir"
 zin_regional_r_en_gateway_companies_desc:0 "The Heir has returned, and R'en sends a company of sea soldiers to the coalition. The Prince asks only that its capes are guarded until they return."
 zin_regional_r_en_gateway_court:0 "The Gateway Court"
 zin_regional_r_en_gateway_court_2:0 "Seats for the Harbour Houses"
 zin_regional_r_en_gateway_court_2_desc:0 "The harbour houses now have seats in the Prince's council, and the court is a place where the price of a cargo is argued like the price of a crown."
 zin_regional_r_en_gateway_court_desc:0 "Prince Renan's court is a trading house with a crown on the door. Harbour factors sit at the long table, and their words weigh as much as his."
 zin_regional_r_en_gateway_pilots:0 "Wayfinders of the Gateway"
 zin_regional_r_en_gateway_pilots_2:0 "Masters of the Gateway Waters"
 zin_regional_r_en_gateway_pilots_2_desc:0 "The wayfinders have mapped every channel and every sandbar from the capes to the open sea. A fleet led by one of them moves in the dark as if by day."
 zin_regional_r_en_gateway_pilots_desc:0 "The wayfinders of R'en know the shoals, the currents and the tides of the gateway between the two seas. Ships that carry one are safe, and ships that do not are advised to."
 zin_regional_r_en_harbour_dues:0 "Harbour Dues"
 zin_regional_r_en_harbour_dues_desc:0 "Every hull that passes the gateway pays a due, and R'en gives a receipt. The Prince halves the old rate, and the receipts double."
 zin_regional_r_en_harbour_dues_spirit:0 "Harbour Dues"
 zin_regional_r_en_harbour_dues_spirit_desc:0 "Every ship that passes the gateway pays a small due, and no one has complained since the Prince halved it. The money is spent on the harbours, and they show it."
 zin_regional_r_en_harbour_houses:0 "The Harbour Houses"
 zin_regional_r_en_harbour_houses_desc:0 "The great harbour houses of R'en keep the ledgers of the gateway: who passed, with what and under which flag. They sit at the long table in the Prince's hall."
 zin_regional_r_en_hold_the_gateway:0 "Hold the Gateway"
 zin_regional_r_en_hold_the_gateway_desc:0 "The forts on the capes are manned and re-provisioned, and the harbour levy marches to its posts. The gateway is held, and will be held."
 zin_regional_r_en_masters_of_the_gateway_waters:0 "Masters of the Gateway Waters"
 zin_regional_r_en_masters_of_the_gateway_waters_desc:0 "The wayfinders' guild takes on apprentices from every harbour house, and teaches them the whole of the gateway. In ten years, no ship will pass without one."
 zin_regional_r_en_neutral_waters:0 "Neutral Waters"
 zin_regional_r_en_neutral_waters_desc:0 "R'en declares its waters neutral and inscribes the declaration on a stone at each cape. The capes face two seas, and the Prince intends that neither master shall claim them."
 zin_regional_r_en_neutral_waters_spirit:0 "Neutral Waters"
 zin_regional_r_en_neutral_waters_spirit_desc:0 "R'en has declared its waters neutral, and says so on a stone at every cape. No flag may loose an arrow in them, and any who do will answer to the Prince."
 zin_regional_r_en_open_to_every_flag:0 "Open to Every Flag"
 zin_regional_r_en_open_to_every_flag_desc:0 "R'en opens its harbours to every ship that carries goods. The quay is crowded with flags, and the harbour houses count their coin with delight."
 zin_regional_r_en_parims_friend:0 "Parim's Friend"
 zin_regional_r_en_parims_friend_desc:0 "R'en lives on Aenoran trade, and the Prince sends a delegation to Parim. The king receives it warmly, and the harbour houses are pleased."
 zin_regional_r_en_pilots_of_the_gateway:0 "Wayfinders of the Gateway"
 zin_regional_r_en_pilots_of_the_gateway_desc:0 "The wayfinders of R'en take ships through waters that only they know. The guild is given a charter, and its young men are given the oars."
 zin_regional_r_en_quays_and_cranes:0 "Quays and Cranes"
 zin_regional_r_en_quays_and_cranes_desc:0 "New quays, stone and deep, are built beside the old. Wooden cranes, worked by treadmills, lift cargo from the holds in a tenth of the time."
 zin_regional_r_en_ropewalks:0 "Ropewalks"
 zin_regional_r_en_ropewalks_desc:0 "Long sheds run along the shore at R'en, where hemp is spun into rope by gangs of boys. A ship that sails the gateway needs a great deal of cable."
 zin_regional_r_en_sea_soldiers_of_r_en:0 "Sea Soldiers of R'en"
 zin_regional_r_en_sea_soldiers_of_r_en_desc:0 "The Prince raises companies of sea soldiers from the harbour towns. They fight on deck or on shore, and they carry a short sword and a round shield."
 zin_regional_r_en_seats_for_the_harbour_houses:0 "Seats for the Harbour Houses"
 zin_regional_r_en_seats_for_the_harbour_houses_desc:0 "The harbour houses are given seats in the Prince's council. In return they swear to pay their dues and to hold the quays against all comers."
 zin_regional_r_en_sonargurs_pilots:0 "Sonargur's Wayfinders"
 zin_regional_r_en_sonargurs_pilots_desc:0 "R'en lends its wayfinders to the crown at Sonargur, and receives a seat at the strait's table. The Prince is not sure it is a good bargain, but it is a plain one."
 zin_regional_r_en_temples_on_the_quay:0 "Temples on the Quay"
 zin_regional_r_en_temples_on_the_quay_desc:0 "The almoners of the Houses of the First Light ask for a hall on the quay. The wayfinders' guild has doubts, and the Prince listens to them."
 zin_regional_r_en_the_aenoran_trade:0 "The Aenoran Trade"
 zin_regional_r_en_the_aenoran_trade_desc:0 "The harbour houses of R'en live on Aenoran cargoes. Spice, silk and pitch pass through the gateway, and the Prince's clerks note every bale."
 zin_regional_r_en_the_free_gateway:0 "The Free Gateway"
 zin_regional_r_en_the_free_gateway_desc:0 "The Prince proclaims that the gateway is free to every flag. He keeps his dues low and his harbours open, and the two masters of the strait have both been told."
 zin_regional_r_en_the_galley_watch:0 "The Galley Watch"
 zin_regional_r_en_the_galley_watch_desc:0 "A watch of galleys patrols the gateway day and night. They carry no cargo and no passengers, only archers and the Prince's warrant."
 zin_regional_r_en_the_gateway_bastion:0 "The Gateway Bastion"
 zin_regional_r_en_the_gateway_bastion_desc:0 "The strongest fort on the gateway is raised at the capital, to be the last redoubt of R'en. It faces seaward and landward, and the Prince sleeps beneath it."
 zin_regional_r_en_the_gateway_court:0 "The Gateway Court"
 zin_regional_r_en_the_gateway_court_desc:0 "R'en holds the southern gateway between the Leren sea and the Aenoran sea. Prince Renan rules three states of capes, harbours and wayfinders' towns, and wants one thing: that neither master ever needs his harbours badly enough to take them."
 zin_regional_r_en_the_gateway_endures:0 "The Gateway Endures"
 zin_regional_r_en_the_gateway_endures_desc:0 "R'en has weathered the quarrels of its masters for a hundred years, and the Prince means that it will weather a hundred more. The harbour houses sign the new charter in one sitting."
 zin_regional_r_en_the_gateway_forts:0 "The Gateway Forts"
 zin_regional_r_en_the_gateway_forts_desc:0 "A pair of forts is raised at the narrows, one on each cape. They are built of grey stone, with sea-gates and watch-towers, and each can see the other across the water."
 zin_regional_r_en_the_gateway_question:0 "The Gateway Question"
 zin_regional_r_en_the_gateway_question_desc:0 "The question of the gateway is put to every court that sails through it. R'en is ready to answer, and has a seat at every table."
 zin_regional_r_en_the_gateway_reopens:0 "The Gateway Reopens"
 zin_regional_r_en_the_gateway_reopens_desc:0 "The chains are lowered at last, and the first ships pass through the narrows in a year. R'en's harbours are busy again, and the Prince is relieved."
 zin_regional_r_en_the_harbour_levy:0 "The Harbour Levy"
 zin_regional_r_en_the_harbour_levy_desc:0 "The harbour towns are called on for a man in ten. They come to the capes with spears and rope, and are drilled in the use of both."
 zin_regional_r_en_the_princes_peace:0 "The Prince's Peace"
 zin_regional_r_en_the_princes_peace_desc:0 "Prince Renan proclaims a peace over all of R'en's waters. Quarrels are settled in the harbour court, not on the deck."
 zin_regional_r_en_the_strait_closes:0 "The Strait Closes"
 zin_regional_r_en_the_strait_closes_desc:0 "The chains are drawn across the gateway, and the strait is closed to every fleet at war. The Prince stands on the cape and watches the ships turn back."
 zin_regional_r_en_the_warehouse_quarter:0 "The Warehouse Quarter"
 zin_regional_r_en_the_warehouse_quarter_desc:0 "Whole streets of stone warehouses rise on the south shore. They are filled with the cargoes of two seas, and the Prince holds the keys."
 zin_regional_r_en_towers_on_the_capes:0 "Towers on the Capes"
 zin_regional_r_en_towers_on_the_capes_desc:0 "Tall towers go up on the capes with beacons and signal-flags. They can be seen from the open sea, and from the next tower down the coast."
 zin_regional_r_en_under_the_leren_banner:0 "Under the Leren Banner"
 zin_regional_r_en_under_the_leren_banner_desc:0 "R'en asks to be taken under the banner of Lerendor. It is a bold request, and the Prince hopes that Sonargur will think it a generous one."
 zin_regional_r_en_wartime_pilots:0 "A Price for Passage"
 zin_regional_r_en_wartime_pilots_desc:0 "R'en's wayfinders sell passage at a price: a belligerent pays in coin, and keeps his hull off the rocks. The harbour houses are rich, and the Prince is richer."
 zin_regional_r_en.1.a:0 "The sea keeps its own"
 zin_regional_r_en.1.b:0 "Bless the wayfinders' boats"
 zin_regional_r_en.1.d:0 "The almoners of the Houses of the First Light ask leave to build a hall of healing on the quay at R'en. They would tend sailors with the fever, and keep a granary and a register of births. The wayfinders' guild says the sea keeps its own, and the Prince has not decided."
 zin_regional_r_en.1.t:0 "Temples on the Quay"
 zin_regional_r_en.2.a:0 "The North is Sonargur's affair"
 zin_regional_r_en.2.b:0 "Welcome it"
 zin_regional_r_en.2.d:0 "A harbour-factor of R'en has come to Parim with a chest of spice and a letter from Prince Renan. The Prince reminds the king that R'en lives on Aenoran trade, and asks for his friendship in the matter of the strait."
 zin_regional_r_en.2.t:0 "The Gateway Looks to Parim"
 zin_regional_r_en.3.a:0 "R'en should ask for protection"
 zin_regional_r_en.3.b:0 "Accept"
 zin_regional_r_en.3.d:0 "Prince Renan's envoy stands before the crown at Sonargur with a modest request. The wayfinders of R'en know the gateway better than any, and offer them to the crown's ships for the strait's sake, at a fair rate."
 zin_regional_r_en.3.t:0 "R'en's Wayfinders Offer Service"
 zin_regional_r_en.4.a:0 "Not now"
 zin_regional_r_en.4.b:0 "Take R'en under the banner"
 zin_regional_r_en.4.d:0 "A letter from Prince Renan has arrived at Sonargur under a heavy seal. R'en asks to be taken under the banner of the crown, so that its capes may be guarded and its harbours kept open. The crown will have a gateway in return."
 zin_regional_r_en.4.t:0 "R'en Asks for Protection"
