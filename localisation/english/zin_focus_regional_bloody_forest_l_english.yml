l_english:
 zin_regional_bloody_forest_a_truce_with_parim:0 "A Truce with Parim"
 zin_regional_bloody_forest_a_truce_with_parim_desc:0 "The moot sends a chief to Parim with a white branch and a plain request: leave the forest alone, and the forest will leave Parim alone. The Golden Court is not famous for its sense of humour."
 zin_regional_bloody_forest_between_the_crowns:0 "Between the Crowns"
 zin_regional_bloody_forest_between_the_crowns_desc:0 "The Bloody Forest lies between the crown of Parim and the doubtful peace of the north. The chiefs know it, and they know that every kingdom wants something from a forest."
 zin_regional_bloody_forest_blades_accepted:0 "Blades of the Red Woods"
 zin_regional_bloody_forest_blood_feuds_settled:0 "Blood-Feuds Settled"
 zin_regional_bloody_forest_blood_feuds_settled_desc:0 "The chiefs sit down together and settle, by blood-price, the oldest of the feuds. Hands are cut and clasped, and the tribes agree to look elsewhere for their enemies."
 zin_regional_bloody_forest_blood_for_the_living:0 "Blood for the Living"
 zin_regional_bloody_forest_blood_for_the_living_desc:0 "The chiefs put aside their feud with the crown, for a season, and send word that the red woods will bleed with the living. It is not forgiveness. It is arithmetic."
 zin_regional_bloody_forest_bowmen_of_the_hollows:0 "Bowmen of the Hollows"
 zin_regional_bloody_forest_bowmen_of_the_hollows_desc:0 "The bowmen of the hollows shoot from the ground, from the trees and from the thorn. They fight as hunters do, patiently and without mercy."
 zin_regional_bloody_forest_cart_taken:0 "A Tax-Cart Taken"
 zin_regional_bloody_forest_chieftains_of_the_hollows:0 "Chieftains of the Hollows"
 zin_regional_bloody_forest_chieftains_of_the_hollows_desc:0 "The chieftains of the hollows are given a seat in the moot beside the great chiefs. They bring few warriors, and a great deal of hard-earned knowledge."
 zin_regional_bloody_forest_closed_border:0 "The Closed Border"
 zin_regional_bloody_forest_closed_border_desc:0 "The forest roads are blocked and no stranger is welcome."
 zin_regional_bloody_forest_deadfalls_and_snares:0 "Deadfalls and Snares"
 zin_regional_bloody_forest_deadfalls_and_snares_desc:0 "Pits, deadfalls and snare-lines are laid across every path into the deep woods. The tribes know where each one is, and the invader does not."
 zin_regional_bloody_forest_forest_ambush:0 "Forest Ambush"
 zin_regional_bloody_forest_forest_ambush_2:0 "The Red Ambush"
 zin_regional_bloody_forest_forest_ambush_2_desc:0 "A great trap sprung by a signal horn."
 zin_regional_bloody_forest_forest_ambush_desc:0 "The tribes teach their young to wait in silence for hours, to loose together, and to be gone before the enemy has found the range."
 zin_regional_bloody_forest_forest_ambush_spirit:0 "Forest Ambush"
 zin_regional_bloody_forest_forest_ambush_spirit_desc:0 "Hunters who wait for hours and are gone before the range is found."
 zin_regional_bloody_forest_forest_peace:0 "Leave Each Other Be"
 zin_regional_bloody_forest_forest_truce:0 "The Forest Truce"
 zin_regional_bloody_forest_forest_truce_desc:0 "A quiet understanding with the crown, scrawled on a scrap of bark."
 zin_regional_bloody_forest_furs_and_amber:0 "Furs and Amber"
 zin_regional_bloody_forest_furs_and_amber_desc:0 "Red fox, black marten and amber from the northern streams are sold at the edge of the forest, to buyers who come with cash and leave with their eyes open."
 zin_regional_bloody_forest_gifts_from_the_south:0 "Gifts from the South"
 zin_regional_bloody_forest_gifts_from_the_south_desc:0 "A stranger from the south comes to the moot with iron and promises. He asks nothing at once, and the chiefs, who like iron, do not ask him what he will ask later."
 zin_regional_bloody_forest_hired_axes:0 "Hired Axes"
 zin_regional_bloody_forest_hired_axes_desc:0 "The forest's fighting men hire out as guards, escorts and axe-bearers to anyone who pays. They stay loyal to the forest, and are sometimes loyal to the employer."
 zin_regional_bloody_forest_hired_axes_spirit:0 "Hired Axes"
 zin_regional_bloody_forest_hired_axes_spirit_desc:0 "The forest's fighting men hire out to anyone who pays."
 zin_regional_bloody_forest_masters_of_our_woods:0 "Masters of Our Woods"
 zin_regional_bloody_forest_masters_of_our_woods_desc:0 "Whatever the crowns of the Middle Lands may say, the red woods belong to the tribes. They have held them for longer than any king has had a name."
 zin_regional_bloody_forest_no_road_through:0 "No Road Through"
 zin_regional_bloody_forest_no_road_through_desc:0 "The forest roads are closed to all comers, with abatis, palisade and a chief at every crossing. It is a poor welcome, and an effective one."
 zin_regional_bloody_forest_old_defiance:0 "The Old Defiance"
 zin_regional_bloody_forest_old_defiance_desc:0 "No tax, no charter, no crown and no truce."
 zin_regional_bloody_forest_one_forest:0 "One Forest"
 zin_regional_bloody_forest_one_forest_desc:0 "The crown calls them bandits, and they call themselves free. For the first time they agree on one thing: the red woods are one forest, and will be defended as one."
 zin_regional_bloody_forest_outlaws_welcome:0 "Outlaws Welcome"
 zin_regional_bloody_forest_outlaws_welcome_desc:0 "The forest opens its glades to every outlaw, runaway and landless man who can hold a bow. Some of them are good men, and some are not."
 zin_regional_bloody_forest_red_woods:0 "The Red Woods"
 zin_regional_bloody_forest_red_woods_2:0 "The Redbark Oath"
 zin_regional_bloody_forest_red_woods_2_desc:0 "All the tribes have sworn on the red oak to stand together."
 zin_regional_bloody_forest_red_woods_desc:0 "A hostile woodland that never accepted the Charters."
 zin_regional_bloody_forest_smugglers:0 "Smugglers' Paths"
 zin_regional_bloody_forest_smugglers_desc:0 "Secret paths bring forbidden goods through the forest, at a price."
 zin_regional_bloody_forest_smugglers_paths:0 "Smugglers' Paths"
 zin_regional_bloody_forest_smugglers_paths_desc:0 "Smugglers' paths run through the forest to the lake and the border, known only to the tribes. A man who wants something from the other side of the Wall will find a guide here, for a price."
 zin_regional_bloody_forest_the_blood_price:0 "The Blood-Price"
 zin_regional_bloody_forest_the_blood_price_desc:0 "A tax-cart has strayed onto the forest roads. The moot must decide what it owes the crown, if anything, for the tolls the crown has never had the courage to claim."
 zin_regional_bloody_forest_the_closed_border:0 "The Closed Border"
 zin_regional_bloody_forest_the_closed_border_desc:0 "The roads into the forest are blocked with felled oak and thorn-brake. Tax-carts that stray onto them come back empty, if they come back."
 zin_regional_bloody_forest_the_forest_endures:0 "The Forest Endures"
 zin_regional_bloody_forest_the_forest_endures_desc:0 "The war is over and the forest opens its roads, a little. The moot meets under the great red oak, and the chiefs count their dead aloud."
 zin_regional_bloody_forest_the_forest_follows_the_heir:0 "The Forest Follows the Heir"
 zin_regional_bloody_forest_the_forest_follows_the_heir_desc:0 "The Heir has returned, and some of the forest chiefs, who have never followed a king, decide to follow him. It is the first time in seven centuries that the red woods have marched under another's banner."
 zin_regional_bloody_forest_the_forest_market:0 "The Forest Market"
 zin_regional_bloody_forest_the_forest_market_desc:0 "A market grows at the forest's heart, with stalls of canvas and rope. No crown's inspectors have ever seen it, and none are expected."
 zin_regional_bloody_forest_the_hunters_war:0 "The Hunters' War"
 zin_regional_bloody_forest_the_hunters_war_desc:0 "The warbands go out from the forest in small packs, striking at columns, wagons and camps. The enemy cannot find the hunters, and the hunters cannot be made to stop."
 zin_regional_bloody_forest_the_old_defiance:0 "The Old Defiance"
 zin_regional_bloody_forest_the_old_defiance_desc:0 "The chiefs renew the old defiance: no tax, no charter, no crown, and no truce. They have said it for seven centuries and have not yet been disproved."
 zin_regional_bloody_forest_the_red_ambush:0 "The Red Ambush"
 zin_regional_bloody_forest_the_red_ambush_desc:0 "The tribes combine their ambushes into one great trap, sprung by a signal horn. An army that enters the red woods in column will not leave it that way."
 zin_regional_bloody_forest_the_red_woods:0 "The Red Woods"
 zin_regional_bloody_forest_the_red_woods_desc:0 "The Bloody Forest never accepted the Charters. Its tribes take their name from the red-barked trees of the deep woods and from old feuds, and Chieftain Rasvan Redbark leads their moot."
 zin_regional_bloody_forest_the_redbark_oath:0 "The Redbark Oath"
 zin_regional_bloody_forest_the_redbark_oath_desc:0 "All the tribes swear on the red oak to stand together against any who come in arms. The oath is in the old tongue, and anyone who breaks it is cast out into the thorns."
 zin_regional_bloody_forest_the_thorn_defence:0 "The Thorn Defence"
 zin_regional_bloody_forest_the_thorn_defence_desc:0 "The forest's edge is planted with thorn-hedge, barbed and tangled, a bow-shot deep. Behind it the warbands wait with their bows, unseen."
 zin_regional_bloody_forest_the_tribal_moot:0 "The Tribal Moot"
 zin_regional_bloody_forest_the_tribal_moot_desc:0 "Every tribe sends its chief to the moot under the great red oak. Decisions are taken by shouting, and recorded by whoever shouts last."
 zin_regional_bloody_forest_the_woods_close:0 "The Woods Close"
 zin_regional_bloody_forest_the_woods_close_desc:0 "The horns sound in the red woods, and the thorn-hedges are drawn closed. The forest was always a closed place, and now it is closed in earnest."
 zin_regional_bloody_forest_war_bands:0 "War-Bands"
 zin_regional_bloody_forest_war_bands_desc:0 "Warbands of a few hundred muster at the war-oak, each under a chief of its own. They are not disciplined, but they are very fierce."
 zin_regional_bloody_forest_wealth_of_the_woods:0 "Wealth of the Woods"
 zin_regional_bloody_forest_wealth_of_the_woods_desc:0 "Furs, amber, hired axes and smugglers' fees add up to a surprising fortune. The chiefs spend it on forges, and on the sort of things forges make."
 zin_regional_bloody_forest_woods_closed:0 "The Woods Close"
 zin_regional_bloody_forest_woods_closed_desc:0 "The thorn-hedges are drawn closed and the warbands wait inside."
 zin_regional_bloody_forest_words_with_the_veiled:0 "Words with the Veiled"
 zin_regional_bloody_forest_words_with_the_veiled_desc:0 "Envoys of the Red Woods go quietly to their neighbours in the barrows, those who keep their faces covered and their reasons to themselves. They bring gifts, and they ask for nothing but peace."
 zin_regional_bloody_forest.1.a:0 "Let it pass."
 zin_regional_bloody_forest.1.b:0 "Ask a toll."
 zin_regional_bloody_forest.1.c:0 "Take the cart."
 zin_regional_bloody_forest.1.d:0 "A tax-cart of the crown has strayed onto the forest roads with two guards and a driver who is very sorry. The moot may take it, let it pass or demand a toll for the privilege of crossing the forest."
 zin_regional_bloody_forest.1.t:0 "A Tax-Cart on the Forest Road"
 zin_regional_bloody_forest.2.a:0 "Bandits get no treaties."
 zin_regional_bloody_forest.2.b:0 "Grant it."
 zin_regional_bloody_forest.2.d:0 "A chief of the Bloody Forest stands in the antechamber of the Golden Court, hat in hand, asking for a truce. He has brought no gifts, only a promise that the forest will not trouble the roads if the roads do not trouble the forest."
 zin_regional_bloody_forest.2.t:0 "The Forest Asks for a Truce"
 zin_regional_bloody_forest.3.a:0 "The veil stays closed."
 zin_regional_bloody_forest.3.b:0 "Agree to leave each other be."
 zin_regional_bloody_forest.3.d:0 "Envoys of the Red Woods have come to the barrows with gifts of fur and amber and a request: that the two peoples leave each other be. The veiled ones listen in silence, and the envoys wait."
 zin_regional_bloody_forest.3.t:0 "Envoys from the Red Woods"
 zin_regional_bloody_forest.4.a:0 "We need no bandits."
 zin_regional_bloody_forest.4.b:0 "Accept."
 zin_regional_bloody_forest.4.d:0 "The chiefs of the Bloody Forest offer the crown their blades for the duration of the war. They ask for nothing but the freedom of the woods afterwards, and the court is suspicious of anything so cheap."
 zin_regional_bloody_forest.4.t:0 "The Forest Offers Its Blades"
