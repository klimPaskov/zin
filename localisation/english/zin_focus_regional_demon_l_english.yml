l_english:
 zin_regional_demon_a_court_of_our_own:0 "A Court of Our Own"
 zin_regional_demon_a_court_of_our_own_desc:0 "Hazarel declares that the court of Demon is a court of its own, and need answer to none. The Dominion takes the declaration in silence, and the silence is the answer."
 zin_regional_demon_cinder_forges:0 "Cinder Forges"
 zin_regional_demon_cinder_forges_desc:0 "Forges are raised on the cinder plain, drawing heat from the vents themselves. They glow through the long nights, and the sky above them is the colour of a hearth."
 zin_regional_demon_cinder_trade:0 "Trade with the Free"
 zin_regional_demon_cinder_trade_desc:0 "Cinder-iron and vent-glass go south through the free ports and come back as grain and silver. Hazarel pretends not to know, and the houses profit."
 zin_regional_demon_cinders_cool:0 "The Cinders Cool"
 zin_regional_demon_cinders_cool_desc:0 "The war is over, and the fires of Demon burn lower. The court gathers in the great hall for the first time in a year and eats from a single table."
 zin_regional_demon_counsel_of_cinders:0 "Counsel of Cinders"
 zin_regional_demon_counsel_of_cinders_desc:0 "A council of the eldest houses meets in a hall of ash and discusses what a free Demon might look like. They end their meetings before dawn and burn their notes."
 zin_regional_demon_court_of_cinders:0 "The Court of Cinders"
 zin_regional_demon_court_of_cinders_desc:0 "The court moves to a new hall at the edge of the cinder plain, with black glass for windows and a floor of fused ash. Its fires burn from dusk until dawn."
 zin_regional_demon_envoys_below:0 "Envoys Below"
 zin_regional_demon_envoys_below_desc:0 "Azuth Cinder-Voice leads a party of envoys into the heat with gifts of black glass and a long list of requests. They return wiser, and thinner, and they keep their answers to themselves."
 zin_regional_demon_fire_at_the_gate:0 "Fire at the Gate"
 zin_regional_demon_fire_at_the_gate_desc:0 "At the old gate, the court of Demon lights great fires and calls across the heat. What answers is not described, but the levies that follow it are very large."
 zin_regional_demon_first_into_the_storm:0 "First into the Storm"
 zin_regional_demon_first_into_the_storm_desc:0 "Demon's levies drill in the worst weather the Dominion can find: black rain, ash-fall and thunder. They march out of it hardened, and ready for anything."
 zin_regional_demon_first_into_the_storm_spirit:0 "First into the Storm"
 zin_regional_demon_first_into_the_storm_spirit_desc:0 "Demon's levies march into the worst weather the Dominion can find, and they march in step. The court says that the storm was made for them, and the levies believe it."
 zin_regional_demon_first_of_the_sworn:0 "First of the Sworn"
 zin_regional_demon_first_of_the_sworn_desc:0 "Demon was the first realm to kneel to Nafeher, and its lords take pride in having been first. Hazarel repeats the oath in the great hall, and the horns answer."
 zin_regional_demon_furnaces_of_demon:0 "Furnaces of Demon"
 zin_regional_demon_furnaces_of_demon_desc:0 "A great furnace is raised at the heart of the plain, fed from a vent. It has not gone cold since the day it was lit, and the smiths who tend it say that it listens."
 zin_regional_demon_furnaces_of_demon_spirit:0 "Furnaces of Demon"
 zin_regional_demon_furnaces_of_demon_spirit_desc:0 "The great furnaces on the cinder plain are fed from the vents and never let cool. The smiths work at them in shifts, and the ring of their hammers is never silent."
 zin_regional_demon_hazarels_word:0 "Hazarel's Word"
 zin_regional_demon_hazarels_word_desc:0 "Hazarel's word is law in Demon, spoken in a low voice and carried out without question. His seal is a horn pressed in black wax."
 zin_regional_demon_horned_throne:0 "The Horned Throne"
 zin_regional_demon_horned_throne_desc:0 "Hazarel the Horned sits on a seat of black horn, and no one has ever sat in it but a Hazarel. The court has long since stopped asking whether the throne could be shared."
 zin_regional_demon_house_council:0 "The House Council"
 zin_regional_demon_house_council_desc:0 "The Netherborn houses sit in a ring around the Horned Throne, and each speaks in turn. Hazarel listens to all of them, and mostly decides what he meant to decide in the first place."
 zin_regional_demon_netherborn_levies_for_nafeher:0 "Netherborn Levies for Nafeher"
 zin_regional_demon_netherborn_levies_for_nafeher_desc:0 "The Netherborn houses send their levies north in long black columns, and Nafeher counts them at the border. Demon sends more than it is asked, and is thanked for it."
 zin_regional_demon_netherborn_vanguard:0 "The Netherborn Vanguard"
 zin_regional_demon_netherborn_vanguard_desc:0 "The Netherborn go north in the vanguard of Nafeher's host, tall in the saddle and impatient. The towns on the road shut their gates as the black columns pass."
 zin_regional_demon_old_portal_sites:0 "Old Portal Sites"
 zin_regional_demon_old_portal_sites_desc:0 "Scholars of Demon walk the burnt ground where the old gates once stood and copy what the fused stone remembers. What they find they study in silence."
 zin_regional_demon_own_crown:0 "The Horned Crown Free"
 zin_regional_demon_own_crown_desc:0 "The horned crown is raised in the great hall of Demon and set on Hazarel's head by his own hands. Demon answers to itself, and it has never felt so heavy or so light."
 zin_regional_demon_silence_from_nafeher:0 "Silence from Nafeher"
 zin_regional_demon_silence_from_nafeher_desc:0 "The summons have stopped, and the black seals no longer arrive. The Steward speaks in a name that does not answer, and the court of Demon sits in a silence it has not known."
 zin_regional_demon_stand_with_the_steward:0 "Stand with the Steward"
 zin_regional_demon_stand_with_the_steward_desc:0 "Hazarel decides that Demon's oath was sworn to Nafeher and that Nafeher still stands. The Steward speaks for it, and the Horned Court will follow the Steward's banner."
 zin_regional_demon_the_bargain_of_this_reign:0 "The Bargain of This Reign"
 zin_regional_demon_the_bargain_of_this_reign_desc:0 "Nafeher has chosen its approach to the court below, and Demon is asked to carry the bargain across the heat. The terms are written on a plate of black glass and the plate is not shown to anyone."
 zin_regional_demon_the_burning_roads:0 "The Burning Roads"
 zin_regional_demon_the_burning_roads_desc:0 "Roads of fused glass are laid across the cinder plain, hot enough to dry the rain as it falls. Wagons roll over them in silence."
 zin_regional_demon_the_dominions_due:0 "The Dominion's Due"
 zin_regional_demon_the_dominions_due_desc:0 "Every year Demon sends its due to Nafeher in sealed chests of black iron. The tally is read aloud in the great hall, and the court is pleased."
 zin_regional_demon_the_horned_court:0 "The Horned Court"
 zin_regional_demon_the_horned_court_desc:0 "Hazarel the Horned sits at the head of a long hall of black basalt, lit by braziers and hung with the horns of old kings. The court of Demon is the oldest in the Dominion, and the proudest."
 zin_regional_demon_the_horned_crown_alone:0 "The Horned Crown Alone"
 zin_regional_demon_the_horned_crown_alone_desc:0 "A few of the old houses say that the horned crown has been worn too long beneath another's banner. Hazarel hears them, and does not silence them."
 zin_regional_demon_the_horned_crown_free:0 "The Horned Crown Free"
 zin_regional_demon_the_horned_crown_free_desc:0 "Hazarel raises the horned crown with his own hands and sets it on his own head. Demon answers to itself now, and the court kneels to the only throne that speaks."
 zin_regional_demon_the_horned_host:0 "The Horned Host"
 zin_regional_demon_the_horned_host_desc:0 "The horns are blown from the black hall, and the Netherborn houses answer as one. Within a night the cinder plain is full of banners."
 zin_regional_demon_the_horned_throne:0 "The Horned Throne"
 zin_regional_demon_the_horned_throne_desc:0 "The throne of horn is polished and raised on a dais, and the court agrees that Hazarel alone shall sit on it. The houses that disagree are given the chance to say so, once."
 zin_regional_demon_the_host_returns:0 "The Host Returns"
 zin_regional_demon_the_host_returns_desc:0 "The host comes home in black columns, thinner than it left. Hazarel receives it on the steps of the great hall and counts every banner as it passes."
 zin_regional_demon_the_house_council:0 "The House Council"
 zin_regional_demon_the_house_council_desc:0 "The houses persuade Hazarel to share the court with a council of their eldest. He agrees, and sits on the council's right hand."
 zin_regional_demon_the_netherborn_houses:0 "The Netherborn Houses"
 zin_regional_demon_the_netherborn_houses_desc:0 "The Netherborn houses keep their own halls, their own levies and their own ancient grudges. Hazarel gives each a seat at the court and a say in the council."
 zin_regional_demon_the_nethers_edge:0 "The Nether's Edge"
 zin_regional_demon_the_nethers_edge_desc:0 "To the south the cinder plain ends in a heat that no one walks into lightly, and beyond it lies the court of the Nether. Demon's envoys go there on Nafeher's business, and are not always glad to be asked."
 zin_regional_demon_trade_with_the_free:0 "Trade with the Free"
 zin_regional_demon_trade_with_the_free_desc:0 "Merchants of the free realms are admitted to the cinder markets and sold iron and glass at fair prices. The Dominion's tax is quietly forgotten."
 zin_regional_demon_vent_mines:0 "Vent Mines"
 zin_regional_demon_vent_mines_desc:0 "Shafts are sunk beside the vents to reach the cinder-iron below. The miners work in leather aprons and wet cloths, and are paid in double rations."
 zin_regional_demon.1.a:0 "Hazarel speaks."
 zin_regional_demon.1.b:0 "The houses speak."
 zin_regional_demon.1.d:0 "The Horned Court sits in the hall of black basalt, with the horns of old kings above it and a fire in every brazier. Hazarel lifts a hand, and the court waits to hear which of its voices he will hear first."
 zin_regional_demon.1.t:0 "The Horned Court Sits"
 zin_regional_demon.2.a:0 "Let them rest."
 zin_regional_demon.2.d:0 "Demon's envoys walk south into the heat toward the court of the Nether, carrying gifts of black glass and a long list of questions. They come back with answers they keep to themselves."
 zin_regional_demon.2.t:0 "Into the Southern Heat"
 zin_regional_demon.3.a:0 "Wait and watch."
 zin_regional_demon.3.d:0 "The summons have stopped. The Steward speaks in a name that does not answer, and what remains of the master of Nafeher, no one living can say."
 zin_regional_demon.3.t:0 "Silence from Nafeher"
