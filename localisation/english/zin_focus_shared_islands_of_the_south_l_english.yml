l_english:
 zin_shared_islands_of_the_south_a_sea_king:0 "A Sea-King"
 zin_shared_islands_of_the_south_a_sea_king_desc:0 "One captain has led the island's boats to victory so often that the folk have begun to call him king. He wears a crown of shells and a cloak of dyed bark, and nobody laughs."
 zin_shared_islands_of_the_south_a_welcome_on_every_shore:0 "A Welcome on Every Shore"
 zin_shared_islands_of_the_south_a_welcome_on_every_shore_desc:0 "From the largest island to the smallest skerry, every beach in [ROOT.GetName] has a fire, a boat-shed and someone to keep the door open. Sailors say they would rather be wrecked here than anywhere else."
 zin_shared_islands_of_the_south_boatwrights_of_the_isles:0 "Boatwrights of the Isles"
 zin_shared_islands_of_the_south_boatwrights_of_the_isles_desc:0 "The boatwrights of [ROOT.GetName] build low, broad hulls with outriggers that no storm has ever turned over. Visitors from richer lands copy them and call them their own."
 zin_shared_islands_of_the_south_carry_it_to_gala:0 "Carry It to Gala"
 zin_shared_islands_of_the_south_carry_it_to_gala_desc:0 "The islanders have a saying: when the tales of men grow too old for any man to explain, carry them to Gala. A boat is fitted out with a scribe, a drum and a bundle of the island's oldest songs."
 zin_shared_islands_of_the_south_carry_it_to_gala_tip_1:0 "When the tales of men grow too old for any man to explain, carry them to Gala."
 zin_shared_islands_of_the_south_charts_of_the_southern_seas:0 "Charts of the Southern Seas"
 zin_shared_islands_of_the_south_charts_of_the_southern_seas_desc:0 "Charts woven from palm-ribs and shells record the currents, reefs and island-chains of the southern seas. A navigator can read the whole weave at a glance."
 zin_shared_islands_of_the_south_chiefs_moot:0 "The Chiefs' Moot"
 zin_shared_islands_of_the_south_chiefs_moot_desc:0 "Every chief speaks in turn beneath the great tree, and the strongest voice sets the course."
 zin_shared_islands_of_the_south_close_the_houses_of_the_isle:0 "Close the Houses of the Isle"
 zin_shared_islands_of_the_south_close_the_houses_of_the_isle_desc:0 "The house on the quay is shuttered, the well sealed and the healers' ledgers surrendered to the elders. The island's kindness has limits, and the elders have chosen where they lie."
 zin_shared_islands_of_the_south_council_of_the_isle:0 "Council of the Isle"
 zin_shared_islands_of_the_south_council_of_the_isle_desc:0 "The speakers settle the island's quarrels in public, and their rulings are carved on the council stones. No one remembers a ruling that was not obeyed."
 zin_shared_islands_of_the_south_far_from_the_kings_wars:0 "Far From the Kings' Wars"
 zin_shared_islands_of_the_south_far_from_the_kings_wars_desc:0 "The island declares that the wars of the great are not its wars. The harbour is closed to warships, the boats stay in their sheds, and the elders send word to every side that [ROOT.GetName] wants only to be left alone."
 zin_shared_islands_of_the_south_far_from_the_war:0 "Far From the Kings' Wars"
 zin_shared_islands_of_the_south_far_from_the_war_desc:0 "The harbour is closed to warships and the boats stay in their sheds. The island wants only to be left alone."
 zin_shared_islands_of_the_south_fishing_fleets:0 "The Fishing Fleets"
 zin_shared_islands_of_the_south_fishing_fleets_desc:0 "A hundred sails leave the beaches at dawn and spread across the water like gulls."
 zin_shared_islands_of_the_south_galleys_of_the_isles:0 "Galleys of the Isles"
 zin_shared_islands_of_the_south_galleys_of_the_isles_desc:0 "Long galleys with a hundred paddles and a high stern take shape in the boat-sheds of [ROOT.GetName]. They are built for speed, for the open sea and for crews that sing while they row."
 zin_shared_islands_of_the_south_guest_right:0 "The Guest-Right"
 zin_shared_islands_of_the_south_guest_right_desc:0 "No guest is turned from a door. He is fed, warmed and housed for three days before anyone asks his name."
 zin_shared_islands_of_the_south_healers_at_the_quays:0 "Healers at the Quays"
 zin_shared_islands_of_the_south_healers_at_the_quays_desc:0 "Healers in grey robes tend the sick on the quay and feed the hungry."
 zin_shared_islands_of_the_south_hulls_for_hire:0 "Hulls for Hire"
 zin_shared_islands_of_the_south_hulls_for_hire_desc:0 "The kings of the West are looking for hulls to cross the sea, and the boatwrights of [ROOT.GetName] have a dozen to hire. Western agents arrive with silver and leave with promises."
 zin_shared_islands_of_the_south_island_feasts:0 "Island Feasts"
 zin_shared_islands_of_the_south_island_feasts_desc:0 "Visitors arrive in ones and twos, then in boatloads. The islanders of [ROOT.GetName] roast what they have, pour what they have and sing until the moon has set."
 zin_shared_islands_of_the_south_island_markets:0 "Island Markets"
 zin_shared_islands_of_the_south_island_markets_desc:0 "Each full moon, boats from three isles meet in the lee of a reef and trade. Salt, pearls, dried fish and woven mats change hands, and the haggling goes on until the tide turns."
 zin_shared_islands_of_the_south_island_markets_spirit:0 "Island Markets"
 zin_shared_islands_of_the_south_island_markets_spirit_desc:0 "Boats from three isles meet in the lee of a reef each full moon, and the haggling goes on until the tide turns."
 zin_shared_islands_of_the_south_island_navigators:0 "Island Navigators"
 zin_shared_islands_of_the_south_island_navigators_desc:0 "The navigators of [ROOT.GetName] read the sea by the swell, the stars and the flight of birds. They cross open water without chart or compass, and they have never been known to miss a landfall."
 zin_shared_islands_of_the_south_island_navigators_spirit:0 "Island Navigators"
 zin_shared_islands_of_the_south_island_navigators_spirit_desc:0 "The navigators read the sea by the swell, the stars and the flight of birds."
 zin_shared_islands_of_the_south_keepers_of_old_names:0 "Keepers of Old Names"
 zin_shared_islands_of_the_south_keepers_of_old_names_desc:0 "The names of stars, currents, winds and reefs are taught to the children as soon as they can speak. Learned visitors take notes and are astonished at how much has been remembered."
 zin_shared_islands_of_the_south_keepers_of_the_shore:0 "[ROOT.GetName] Keeps Its Shores"
 zin_shared_islands_of_the_south_keepers_of_the_shore_desc:0 "The islanders of [ROOT.GetName] have always lived by the shore: fishing it, salting it, mending its boats and watching its weather. Today the elders gather on the beach, count the nets and decide what the island will do with another year."
 zin_shared_islands_of_the_south_lamps_on_the_reefs:0 "Lamps on the Reefs"
 zin_shared_islands_of_the_south_lamps_on_the_reefs_desc:0 "Tallow lamps are hung on poles above the dangerous reefs, lit at dusk by children who are paid in sweet cakes. Ships that once smashed on the rocks now pass them in the dark."
 zin_shared_islands_of_the_south_loyal_isle:0 "A Loyal Isle"
 zin_shared_islands_of_the_south_loyal_isle_desc:0 "The island makes itself useful to its protector: its boats carry the protector's goods, its fishers feed the protector's ports and its elders give the protector good counsel. The protector notices."
 zin_shared_islands_of_the_south_masters_of_the_southern_seas:0 "Masters of the Southern Seas"
 zin_shared_islands_of_the_south_masters_of_the_southern_seas_desc:0 "The navigators of [ROOT.GetName] are called the best in the south, and no one argues. Their boats have been to every shore and their charts hang in every harbour-house."
 zin_shared_islands_of_the_south_navigators_for_gala:0 "Navigators for Gala"
 zin_shared_islands_of_the_south_navigators_for_gala_desc:0 "Gala sends word that it needs navigators who know the southern seas, and the best of [ROOT.GetName] sign on. They sail with a king's blessing and come home with strange stories."
 zin_shared_islands_of_the_south_nets_and_boats:0 "Nets and Boats"
 zin_shared_islands_of_the_south_nets_and_boats_desc:0 "New nets are knotted in the long evenings, and the boat-sheds ring with the sound of adzes. The fishers of [ROOT.GetName] ask for a proper slip and a shipwright who has seen more than one kind of hull."
 zin_shared_islands_of_the_south_oath_to_the_protector:0 "The Oath to the Protector"
 zin_shared_islands_of_the_south_oath_to_the_protector_desc:0 "The elders of [ROOT.GetName] sail to the protector's court, bearing shells, salt and a bundle of tally-sticks. They swear to keep the protector's peace, and are given a cloak of feathers in return."
 zin_shared_islands_of_the_south_old_tales:0 "Old Tales of the Isles"
 zin_shared_islands_of_the_south_old_tales_desc:0 "A choir sings the island's oldest songs to every ship, and sailors carry them away to ports the islanders will never see."
 zin_shared_islands_of_the_south_old_tales_of_the_isles:0 "Old Tales of the Isles"
 zin_shared_islands_of_the_south_old_tales_of_the_isles_desc:0 "The old women of [ROOT.GetName] sit in the lee of the boat-sheds and tell the tales their grandmothers told them. Nobody has ever written them down, and nobody who has heard them forgets them."
 zin_shared_islands_of_the_south_one_isle_one_law:0 "One Isle, One Law"
 zin_shared_islands_of_the_south_one_isle_one_law_desc:0 "Shore and hill, fisher and farmer, come under one law at last. The elders of [ROOT.GetName] declare the island one realm, and the people feast for three days to celebrate."
 zin_shared_islands_of_the_south_our_own_shores:0 "Our Own Shores"
 zin_shared_islands_of_the_south_our_own_shores_desc:0 "Every beach of [ROOT.GetName] has belonged to the island since before the protector was born. The elders remind him of it, politely, in their best feathers."
 zin_shared_islands_of_the_south_pearl_divers:0 "The Pearl Divers"
 zin_shared_islands_of_the_south_pearl_divers_desc:0 "Divers go down on a single breath with a stone in their hands and come up with their pockets full of grey and silver. A good pearl is worth more than a boat, and the divers know it."
 zin_shared_islands_of_the_south_priests_at_the_quays:0 "Priests at the Quays"
 zin_shared_islands_of_the_south_priests_at_the_quays_desc:0 "Grey-robed priests from the north have begun to meet the ships, offering blessings, bread and news. The islanders of [ROOT.GetName] are polite to them, and a little curious."
 zin_shared_islands_of_the_south_protectors_favour:0 "The Protector's Favour"
 zin_shared_islands_of_the_south_protectors_favour_desc:0 "The protector has noticed that the island is useful, and is pleased."
 zin_shared_islands_of_the_south_reef_lamps:0 "Lamps on the Reefs"
 zin_shared_islands_of_the_south_reef_lamps_desc:0 "Tallow lamps on poles mark the dangerous reefs, and ships that once smashed on the rocks now pass them in the dark."
 zin_shared_islands_of_the_south_roads_across_the_isle:0 "Roads Across the Isle"
 zin_shared_islands_of_the_south_roads_across_the_isle_desc:0 "A track of packed coral and sand is laid across the island, from the near shore to the far. Porters, mules and carts can now cross in a day what once took three."
 zin_shared_islands_of_the_south_salt_pans:0 "The Salt Pans"
 zin_shared_islands_of_the_south_salt_pans_desc:0 "Shallow pans are scraped out behind the dunes, and the sun does the rest. Salt is the island's oldest wealth, and every trader who has ever called at [ROOT.GetName] has bought some."
 zin_shared_islands_of_the_south_sea_kings_law:0 "The Sea-King's Law"
 zin_shared_islands_of_the_south_sea_kings_law_desc:0 "Keep the peace on shore, share the catch and follow the king's boat."
 zin_shared_islands_of_the_south_send_them_on_their_way:0 "Send Them on Their Way"
 zin_shared_islands_of_the_south_send_them_on_their_way_desc:0 "The elders of [ROOT.GetName] thank the priests for their kindness, give them a good meal and put them on the next boat out. There is no insult in it, only the island's way of keeping what is its own."
 zin_shared_islands_of_the_south_shelter_for_the_wrecked:0 "Shelter for the Wrecked"
 zin_shared_islands_of_the_south_shelter_for_the_wrecked_desc:0 "A reef-wardens' hut is raised on every headland, stocked with dry blankets, salt fish and a signal horn. When a ship goes down, the islanders pull the survivors ashore before the tide has turned."
 zin_shared_islands_of_the_south_ships_for_the_strangers_host:0 "Ships for the Gathering Host"
 zin_shared_islands_of_the_south_ships_for_the_strangers_host_desc:0 "When a host gathers against the dead, the isles can send it boats and men."
 zin_shared_islands_of_the_south_songs_for_strangers:0 "Songs for Visitors"
 zin_shared_islands_of_the_south_songs_for_strangers_desc:0 "A choir is formed to sing the island's songs to every ship that calls. The tunes are simple, the words are old, and sailors carry them away to ports the islanders will never see."
 zin_shared_islands_of_the_south_southern_seas:0 "Masters of the Southern Seas"
 zin_shared_islands_of_the_south_southern_seas_desc:0 "The best navigators in the south, and no one argues."
 zin_shared_islands_of_the_south_speakers_council:0 "Council of the Isle"
 zin_shared_islands_of_the_south_speakers_council_desc:0 "The speakers settle quarrels in public, and their rulings are carved on the council stones."
 zin_shared_islands_of_the_south_the_chiefs_hall:0 "The Chief's Hall"
 zin_shared_islands_of_the_south_the_chiefs_hall_desc:0 "A great thatched hall rises above the beach, with carved posts and a hearth that has not gone out in living memory. The chief of [ROOT.GetName] sits at its head and hears every dispute."
 zin_shared_islands_of_the_south_the_chiefs_moot:0 "The Chiefs' Moot"
 zin_shared_islands_of_the_south_the_chiefs_moot_desc:0 "Every chief of every village sits in a ring beneath the great tree and speaks his mind in turn. When they have all spoken, the strongest voice sets the course, and the rest fall in."
 zin_shared_islands_of_the_south_the_fishing_fleets:0 "The Fishing Fleets"
 zin_shared_islands_of_the_south_the_fishing_fleets_desc:0 "Every dawn, a hundred sails leave the beaches of [ROOT.GetName] and spread across the water like gulls. They return at dusk with enough for the whole island and enough over to sell."
 zin_shared_islands_of_the_south_the_guest_right:0 "The Guest-Right"
 zin_shared_islands_of_the_south_the_guest_right_desc:0 "No wrecked sailor, no stray fisherman and no weary traveller has ever been turned from a door in [ROOT.GetName]. A guest is fed, warmed and housed for three days before anyone asks his name."
 zin_shared_islands_of_the_south_the_inland_fields:0 "The Inland Fields"
 zin_shared_islands_of_the_south_the_inland_fields_desc:0 "Terraced fields climb the interior slopes, watered by channels cut from the highland streams. Taro, yams and breadfruit fill the stores, and for the first time the island feeds itself from the middle."
 zin_shared_islands_of_the_south_the_islands_rule:0 "The Rule of [ROOT.GetName]"
 zin_shared_islands_of_the_south_the_islands_rule_desc:0 "Who rules an island? The people of [ROOT.GetName] have answered that question in different ways at different times, and each answer has its supporters. The elders call a gathering on the beach to settle it once more."
 zin_shared_islands_of_the_south_the_isles_stand_together:0 "The Isles Stand Together"
 zin_shared_islands_of_the_south_the_isles_stand_together_desc:0 "Boats go out to every neighbouring island carrying a knotted cord, the island way of saying that peace is promised. [ROOT.GetName] and its neighbours agree to keep the peace between them for as long as the war lasts."
 zin_shared_islands_of_the_south_the_reef_singers:0 "The Reef Singers"
 zin_shared_islands_of_the_south_the_reef_singers_desc:0 "Old fishers sing a song about a reef where drowned voices call ships onto the rocks. Everyone knows the tune, and no one will say on which reef it began."
 zin_shared_islands_of_the_south_the_sea_kings_law:0 "The Sea-King's Law"
 zin_shared_islands_of_the_south_the_sea_kings_law_desc:0 "The sea-king's law is short: keep the peace on shore, share the catch and follow the king's boat. It is enforced by his captains, and most of the time they do not need to raise their voices."
 zin_shared_islands_of_the_south_the_speakers_council:0 "The Speakers' Council"
 zin_shared_islands_of_the_south_the_speakers_council_desc:0 "A circle of speakers is chosen from the island's villages, one for every ten hearths. They sit on a ring of flat stones, and whoever holds the talking-shell speaks."
 zin_shared_islands_of_the_south_the_storm_years:0 "The Storm Years"
 zin_shared_islands_of_the_south_the_storm_years_desc:0 "Word arrives by every boat that the kings of the north and west are at war. The islanders of [ROOT.GetName] look out across the empty sea, count their stores and decide to keep the war on the far side of the horizon."
 zin_shared_islands_of_the_south_two_shores:0 "Two Shores"
 zin_shared_islands_of_the_south_two_shores_desc:0 "The bigger islands have a far shore as well as a near one, and a heart of hills between them. [ROOT.GetName] sends surveyors inland with rope and stakes, and learns how much of its own land it has never seen."
 zin_shared_islands_of_the_south_watch_the_southern_waves:0 "Watch the Southern Waves"
 zin_shared_islands_of_the_south_watch_the_southern_waves_desc:0 "Whatever else the war brings, it may bring ships. Lookouts take their places on the headlands of [ROOT.GetName], and the boats are kept ready on their rollers."
 zin_shared_islands_of_the_south_welcome_the_healers:0 "Welcome the Healers"
 zin_shared_islands_of_the_south_welcome_the_healers_desc:0 "The healers of the Deliverer ask for a house on the quay, where the sick can be tended and the hungry fed. [ROOT.GetName] gives them a building, a well and a cautious welcome."
 zin_shared_islands_of_the_south.1.a:0 "Feed them all"
 zin_shared_islands_of_the_south.1.b:0 "A modest feast"
 zin_shared_islands_of_the_south.1.d:0 "Boats from three islands have drawn up on the beach, and the visitors are hungry. The elders of [ROOT.GetName] look at their stores, look at each other and decide how much of the island's wealth should go into a pot."
 zin_shared_islands_of_the_south.1.t:0 "An Island Feast"
 zin_shared_islands_of_the_south.2.a:0 "Honour the old custom: no boat at night"
 zin_shared_islands_of_the_south.2.b:0 "Tales for children"
 zin_shared_islands_of_the_south.2.d:0 "Old fishers sing of a reef where drowned voices call ships onto the rocks. The song is known on every island of the south, and the islanders of [ROOT.GetName] argue over whether the custom it teaches should be kept."
 zin_shared_islands_of_the_south.2.t:0 "The Reef Singers"
