l_english:
 zin_regional_pollos_buyers_from_every_crown:0 "Buyers from Every Crown"
 zin_regional_pollos_buyers_from_every_crown_desc:0 "Aenoran, western and southern factors keep houses on the quay. The guild-masters let all of them in and let none of them tell the others what to pay."
 zin_regional_pollos_call_the_charter_houses:0 "Call the Charter Houses"
 zin_regional_pollos_call_the_charter_houses_desc:0 "Pollos suffers most when corsairs harry the lanes, and it talks more than anyone of a remedy. The Guild-Master sends word to every chart house of the isles."
 zin_regional_pollos_charter_fleet:0 "The Charter Fleet"
 zin_regional_pollos_charter_fleet_desc:0 "A fleet of armed hulls is paid for out of the market dues and manned by the guild's own crews. Its masters know every cove in the Pupor and every ruse of a corsair skipper."
 zin_regional_pollos_courts_of_the_charter:0 "Courts of the Charter"
 zin_regional_pollos_courts_of_the_charter_desc:0 "Captured corsairs are tried before judges of the Charter, not by whichever lord caught them. The courts are strict and fair, and a skipper who yields quickly may keep his neck."
 zin_regional_pollos_every_crown:0 "Buyers from Every Crown"
 zin_regional_pollos_every_crown_desc:0 "Factors of the Aenoran, western and southern courts keep houses on the quay of Pollos. They bid against one another for every cargo, and the guild-masters smile."
 zin_regional_pollos_every_sail_welcome:0 "Every Sail Welcome"
 zin_regional_pollos_every_sail_welcome_desc:0 "The quay of Pollos has always taken whatever ship came to it. The Guild-Master has the rule painted in tall letters above the harbour gate."
 zin_regional_pollos_fish_fairs:0 "Fish Fairs"
 zin_regional_pollos_fish_fairs_desc:0 "Twice a year the fishers of every isle bring their catch to Pollos at once. The fair is loud and smells terrible, and it feeds the league for a season."
 zin_regional_pollos_found_the_pupor_charter:0 "Found the Pupor Charter"
 zin_regional_pollos_found_the_pupor_charter_desc:0 "The chart houses meet in the great hall of Pollos and put their seals to the Charter. From this day the sea-lanes of the Pupor are kept by those who use them."
 zin_regional_pollos_hesos_ledger:0 "Hesos's Ledger"
 zin_regional_pollos_hesos_ledger_desc:0 "Hesos Pol keeps every account of the guild in one ledger, written in his own hand. Anyone may ask to see it, and few have found an error."
 zin_regional_pollos_invite_adel:0 "Invite Adel"
 zin_regional_pollos_invite_adel_desc:0 "Adel keeps the great charts and has no quarrel with anyone. The Guild-Master writes the Speaker a long letter, and a boat carries it north."
 zin_regional_pollos_invite_raerby:0 "Invite Raerby"
 zin_regional_pollos_invite_raerby_desc:0 "Raerby's captains judge the quarrels of the islands, and their word is respected in every harbour. A Charter without them would be only a promise."
 zin_regional_pollos_league_captains:0 "League Captains"
 zin_regional_pollos_league_captains_desc:0 "Captain Teo Saltash and his like are given league commissions. They are paid to chase corsairs, and each is allowed to keep a share of the prize."
 zin_regional_pollos_league_of_the_isles:0 "League of the Isles"
 zin_regional_pollos_league_of_the_isles_desc:0 "The guild-masters of Pollos have bound the market houses of the isles into a single league. Weights, measures and dues are the same at every pier."
 zin_regional_pollos_mainland_factors:0 "Factors on the Mainland"
 zin_regional_pollos_mainland_factors_desc:0 "Pollos sends clerks and agents to the great ports of the mainland. They sit in rented rooms, send home price-lists and wait for the best bargains."
 zin_regional_pollos_market_galleys:0 "Market Galleys"
 zin_regional_pollos_market_galleys_desc:0 "The market owns a few fast galleys to chase thieves and to carry urgent letters. The shipwrights are told that speed is worth more than cargo room."
 zin_regional_pollos_market_of_the_isles:0 "The Market of the Isles"
 zin_regional_pollos_market_of_the_isles_desc:0 "New stalls and covered halls are raised along the quay. A trader from the far end of the Pupor can set up in the morning and sell out by noon."
 zin_regional_pollos_neutral_market:0 "The Neutral Market"
 zin_regional_pollos_neutral_market_desc:0 "At Pollos the buyer from Parim sits beside the buyer from the West, and neither is asked his business. The market keeps its peace because both would rather trade."
 zin_regional_pollos_news_from_the_south:0 "News from the South"
 zin_regional_pollos_news_from_the_south_desc:0 "The market hears first of any strange ship in the southern waters. Tonight the talk is of a fast hull with elves among her crew, running north before the wind."
 zin_regional_pollos_open_market_in_war:0 "The Market Stays Open"
 zin_regional_pollos_open_market_in_war_desc:0 "The quays are crowded in war as in peace. Pollos sells grain to both banks, hides to both armies and keeps its own account of whom it favours."
 zin_regional_pollos_pearl_divers:0 "Pearl Divers"
 zin_regional_pollos_pearl_divers_desc:0 "Divers from the reef villages bring up pearls in a leather bag tied to the waist. Pollos takes a tenth, and the best go to the sellers of rings in Parim."
 zin_regional_pollos_profit_from_the_crossing:0 "Profit from the Crossing"
 zin_regional_pollos_profit_from_the_crossing_desc:0 "A western host needs ships, rope, salt-meat and pitch in more quantities than any one island can supply. Pollos has a price for each, and it is not a small one."
 zin_regional_pollos_quay_guard:0 "The Quay Guard"
 zin_regional_pollos_quay_guard_desc:0 "A few hundred guild-hired watchmen patrol the quay by night. They carry staves and lanterns, and they can be called out in force if a ship is robbed."
 zin_regional_pollos_ships_for_sale:0 "Ships for Sale"
 zin_regional_pollos_ships_for_sale_desc:0 "The yards of Pollos build to order, and the Ford Council in the West wants hulls. The guild-masters quote a price they are confident will not be refused."
 zin_regional_pollos_ships_for_the_evacuation:0 "Ships for the Evacuation"
 zin_regional_pollos_ships_for_the_evacuation_desc:0 "When the westerners must be brought home across the sea, the market gives every hull it has. It asks for no payment, and does not forget who owed what."
 zin_regional_pollos_the_charter_fleet:0 "The Charter Fleet"
 zin_regional_pollos_the_charter_fleet_desc:0 "The Charter buys, builds and arms a fleet of galleys under its own flag. It sweeps the lanes and tows in the wrecks."
 zin_regional_pollos_the_corogon_route:0 "The Corogon Route"
 zin_regional_pollos_the_corogon_route_desc:0 "A regular boat now runs between Pollos and the harbours of Corogon. It carries salt-fish south and wool and iron-ware back."
 zin_regional_pollos_the_corogon_route_tip_1:0 "Corogon's ships take our fish south."
 zin_regional_pollos_the_counting_quay:0 "The Counting Quay"
 zin_regional_pollos_the_counting_quay_desc:0 "A whole quay is given over to tellers, scales and strongrooms. Marra of the Quay, who has counted coins since she was nine, takes charge of it."
 zin_regional_pollos_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_pollos_the_great_war_at_sea_desc:0 "Great fleets are gathering in the western seas. The Guild-Master calls the league to a meeting, because the market must now decide how to profit and how to keep its neck."
 zin_regional_pollos_the_guild_masters:0 "The Guild-Masters"
 zin_regional_pollos_the_guild_masters_desc:0 "Pollos is ruled by the heads of its market guilds, and the Guild-Master is first among equals. Hesos Pol holds the ledger now, and the guilds have agreed to follow it for the next four years."
 zin_regional_pollos_the_harbour_chain:0 "The Harbour Chain"
 zin_regional_pollos_the_harbour_chain_desc:0 "A great iron chain can be drawn across the harbour mouth at night or in alarm. It has stopped nothing yet, and the guild means to keep it that way."
 zin_regional_pollos_the_league_charter:0 "The League Charter"
 zin_regional_pollos_the_league_charter_desc:0 "The guilds sign a charter that makes them a league. Dues, measures and arbitration follow one law, and the Guild-Master may speak for them all."
 zin_regional_pollos_the_market_court:0 "The Market Court"
 zin_regional_pollos_the_market_court_desc:0 "A court of three guild-masters sits each morning on the quay to settle disputes over weights, prices and cargoes. Its verdicts are brief and final."
 zin_regional_pollos_the_market_isle:0 "The Market Isle"
 zin_regional_pollos_the_market_isle_desc:0 "Every boat in the Pupor Ocean ends its voyage at the quays of Pollos sooner or later. The market is so busy that no one remembers when it last closed."
 zin_regional_pollos_the_market_stays_open:0 "The Market Stays Open"
 zin_regional_pollos_the_market_stays_open_desc:0 "The market will not close for the war. Pollos buys from whoever sells and sells to whoever pays, and its quays stay as noisy as ever."
 zin_regional_pollos_the_neutral_market:0 "The Neutral Market"
 zin_regional_pollos_the_neutral_market_desc:0 "The market takes no side in the quarrels of the mainland. A seller from Parim and a buyer from the West may meet at one stall and part with no blood spilled."
 zin_regional_pollos_the_salt_pans_of_pollos:0 "The Salt Pans"
 zin_regional_pollos_the_salt_pans_of_pollos_desc:0 "Shallow pans on the south shore are flooded at spring tide and dried by the summer sun. Their white salt cures the fish that Pollos sells."
 zin_regional_pollos_the_sunward_route:0 "The Sunward Route"
 zin_regional_pollos_the_sunward_route_desc:0 "From Corogon the boats go on south, hugging the coast, to where the sun is higher and the fruit comes ripe. Pollos buys it in bulk."
 zin_regional_pollos.1.a:0 "Accept"
 zin_regional_pollos.1.b:0 "Decline"
 zin_regional_pollos.1.d:0 "A boat from Pollos has anchored in the harbour with a message from the Guild-Master. The chart houses of the isles are to meet and bind themselves to keep the sea-lanes. They are asking whether we will sign."
 zin_regional_pollos.1.t:0 "An Invitation to the Pupor Charter"
 zin_regional_pollos.2.a:0 "Hang the corsairs"
 zin_regional_pollos.2.b:0 "Fine them"
 zin_regional_pollos.2.d:0 "The first corsair captains taken under the Charter are brought before the court on the quay. The guild-masters have heard the charges and the pleas. The mob outside wants a hanging, and the merchants who lost cargoes want a fine."
 zin_regional_pollos.2.t:0 "The Charter Court Sits"
