l_english:
 zin_regional_tolvael_a_seat_in_the_compact:0 "A Seat in the Compact"
 zin_regional_tolvael_a_seat_in_the_compact_desc:0 "Tolvael asks Lerendor for a seat at the Compact's table. The Lady does not like to ask, but she likes to be on the right side of the strait."
 zin_regional_tolvael_a_third_way:0 "A Third Way"
 zin_regional_tolvael_a_third_way_desc:0 "The Lady declares that Tolvael will take neither Sonargur's road nor Parim's, but its own. Her envoys carry the news to both courts, and both pretend to be pleased."
 zin_regional_tolvael_answers_to_no_crown:0 "Tolvael Answers to No Crown"
 zin_regional_tolvael_answers_to_no_crown_desc:0 "Lady Agniya proclaims that Tolvael answers to no crown, in Sonargur or Parim or anywhere else. The great houses cheer, and the envoys make careful notes."
 zin_regional_tolvael_axes_and_shields:0 "Axes and Shields"
 zin_regional_tolvael_axes_and_shields_desc:0 "The smiths of Tolvael make a broad axe and a round shield, the weapons of a people who fight in forests. Every warrior in the host carries both."
 zin_regional_tolvael_between_two_masters:0 "Between Two Masters"
 zin_regional_tolvael_between_two_masters_desc:0 "Sonargur courts Tolvael and taxes its timber at the strait; Parim buys its tar and flatters its Lady. Agniya listens to both, and tells neither what she thinks."
 zin_regional_tolvael_call_the_small_crowns:0 "Call the Small Crowns"
 zin_regional_tolvael_call_the_small_crowns_desc:0 "Riders go out to every small crown of the North, bearing a copy of the league's charter and a seat at its table. Some will come, some will not, and all will remember."
 zin_regional_tolvael_fire_on_the_beaches:0 "Fire on the Beaches"
 zin_regional_tolvael_fire_on_the_beaches_desc:0 "Black hulls have been seen off the northern shore. The villagers pile driftwood on the beaches and set a watch on every dune."
 zin_regional_tolvael_friendship:0 "Friendship of Tolvael"
 zin_regional_tolvael_friendship_with_sonargur:0 "Friendship with Sonargur"
 zin_regional_tolvael_friendship_with_sonargur_desc:0 "Tolvael sends a delegation to the crown at Sonargur, with gifts of timber and a promise of friendship. It is not a treaty, and nobody calls it one."
 zin_regional_tolvael_great_houses:0 "The Great Houses"
 zin_regional_tolvael_great_houses_desc:0 "The proud houses of Tolvael are many, and each holds a forest, a tar-pit or a stretch of shore. They quarrel in the hall and close ranks outside it."
 zin_regional_tolvael_hearth_muster:0 "The Many Hearths Muster"
 zin_regional_tolvael_hearth_muster_2:0 "The Host of Many"
 zin_regional_tolvael_hearth_muster_2_desc:0 "The muster is an army now, with a standard, a rank and a drum. Fewer men go home between campaigns, and more learn to stay."
 zin_regional_tolvael_hearth_muster_desc:0 "Each hearth of Tolvael sends a man to the muster. They bring their own axe, their own spear and their own opinions."
 zin_regional_tolvael_houses_of_tolvael:0 "The Great Houses"
 zin_regional_tolvael_houses_of_tolvael_desc:0 "The great houses are listed in a roll with their lands, their tar-pits and their grievances. Each is promised a seat at the Lady's table, and a place in the line when the horns sound."
 zin_regional_tolvael_iron_of_the_north:0 "Iron of the North"
 zin_regional_tolvael_iron_of_the_north_desc:0 "Bog-iron from the marshes and hill-iron from the border are smelted in new furnaces. Tolvael's axes and spearheads are as good as any in the North."
 zin_regional_tolvael_keep_faith_with_parim:0 "Keep Faith with Parim"
 zin_regional_tolvael_keep_faith_with_parim_desc:0 "Tolvael has no quarrel with the old alliance, whatever Sonargur says. The Lady writes to Parim that her companies will stand beside the king."
 zin_regional_tolvael_kept_faith:0 "Faith Kept"
 zin_regional_tolvael_law_of_the_north_shore:0 "Law of the North Shore"
 zin_regional_tolvael_law_of_the_north_shore_desc:0 "The old laws of the shore are written down and given to the sheriffs: how a wreck is shared, how a ship is owed and how a quarrel between two houses is judged."
 zin_regional_tolvael_many_hearths_muster:0 "The Many Hearths Muster"
 zin_regional_tolvael_many_hearths_muster_desc:0 "Every hearth owes a man to the muster, and the muster owes every hearth a fair return. The rolls are read aloud at the feast of the first frost."
 zin_regional_tolvael_no_crown_above:0 "No Crown Above Ours"
 zin_regional_tolvael_no_crown_above_desc:0 "Tolvael answers to no crown, and its hall says so in carved letters over the door. The saying has been repeated so often that people have started to believe it."
 zin_regional_tolvael_northern_companies:0 "Northern Companies"
 zin_regional_tolvael_northern_companies_desc:0 "The Heir has come back to Aoaz, and the northern companies are asked to join him. Tolvael sends its best, and the Lady sends her blessing."
 zin_regional_tolvael_one_hall_many_hearths:0 "One Hall, Many Hearths"
 zin_regional_tolvael_one_hall_many_hearths_desc:0 "A great feast is held for every house, in one hall, with one fire. The Lady carves the first joint herself and serves the oldest house last, and nobody leaves angry."
 zin_regional_tolvael_parims_guarantee:0 "Parim's Guarantee"
 zin_regional_tolvael_parims_guarantee_desc:0 "Tolvael asks the king in Parim to guarantee its borders. The king has a long reach and a generous hand, and the Lady knows both are worth having."
 zin_regional_tolvael_parims_old_friend:0 "Parim's Old Friend"
 zin_regional_tolvael_parims_old_friend_desc:0 "Parim buys Tolvael's tar and has done for a hundred years. The Lady sends a letter to the king, and remembers to mention the old friendship."
 zin_regional_tolvael_pride_of_tolvael:0 "The Pride of Tolvael"
 zin_regional_tolvael_pride_of_tolvael_2:0 "One Hall, Many Hearths"
 zin_regional_tolvael_pride_of_tolvael_2_desc:0 "The great houses keep their own hearths, but they feast in one hall. The Lady sits at the head of the table, and no house sits above another."
 zin_regional_tolvael_pride_of_tolvael_desc:0 "Tolvael is the most populous crown of the North, and it knows it. Its great houses bow to Lady Agniya, and to no one else."
 zin_regional_tolvael_shipwrights_of_tolvael:0 "Shipwrights of Tolvael"
 zin_regional_tolvael_shipwrights_of_tolvael_desc:0 "Tolvael builds half the North's ships, Lerendor's included. The shipwrights are given new slips and a long drying-shed, and a promise that no one will rush the planks."
 zin_regional_tolvael_shore_burns:0 "The Shore Burns"
 zin_regional_tolvael_shore_burns_desc:0 "Beacon-fires run the length of Tolvael's coast, and every village has a spear and a bell. The shore is ready, and it is not alone."
 zin_regional_tolvael_shore_wardens:0 "Shore Wardens"
 zin_regional_tolvael_shore_wardens_desc:0 "Fishing villages along the shore are given stone watch-towers and a standing garrison. If any hull comes in unannounced, a bell will ring."
 zin_regional_tolvael_stand_with_sonargur:0 "Stand with Sonargur"
 zin_regional_tolvael_stand_with_sonargur_desc:0 "The old alliance is over, and Lerendor has left it. Tolvael stands with the crown at Sonargur, because the shore is long and the dead are many."
 zin_regional_tolvael_tar_and_rope:0 "Tar and Rope"
 zin_regional_tolvael_tar_and_rope_desc:0 "The tar-pits are cleaned and the ropewalks lengthened. A ship rigged in Tolvael needs no pitching for a decade."
 zin_regional_tolvael_tar_and_rope_spirit:0 "Tar and Rope"
 zin_regional_tolvael_tar_and_rope_spirit_desc:0 "Pine tar from the pits and hemp rope from the ropewalks make a good ship great. Tolvael sells both, and uses the best for itself."
 zin_regional_tolvael_temples_in_the_halls:0 "Temples in the Halls"
 zin_regional_tolvael_temples_in_the_halls_desc:0 "The almoners of the Houses of the First Light ask leave to raise a hall of healing. The great houses are divided, and the Lady listens to both sides."
 zin_regional_tolvael_the_fleet_of_tolvael:0 "The Fleet of Tolvael"
 zin_regional_tolvael_the_fleet_of_tolvael_desc:0 "The shipwrights of Tolvael build a fleet for the Lady, long and low and fast. It sails under the sign of the green pine, and patrols the northern coast."
 zin_regional_tolvael_the_free_crowns_of_the_north:0 "The Free Crowns of the North"
 zin_regional_tolvael_the_free_crowns_of_the_north_desc:0 "Tolvael proposes a league of the free crowns of the North, to keep the peace among themselves and to answer to no one else. Its banner is a green pine on a white field."
 zin_regional_tolvael_the_great_forests:0 "The Great Forests"
 zin_regional_tolvael_the_great_forests_desc:0 "Foresters mark the oldest trees for the keel-yards and the youngest for the next generation. A mark in red means a king's mast."
 zin_regional_tolvael_the_host_of_many:0 "The Host of Many"
 zin_regional_tolvael_the_host_of_many_desc:0 "The muster of Tolvael is made an army, with a banner, a drum and a rank. Fewer men go home between campaigns, and more men learn to stay."
 zin_regional_tolvael_the_lady_rides_out:0 "The Lady Rides Out"
 zin_regional_tolvael_the_lady_rides_out_desc:0 "Lady Agniya leaves the capital with a small escort and a long list of houses to visit. She comes home with a hundred promises and a cold."
 zin_regional_tolvael_the_pride_of_tolvael:0 "The Pride of Tolvael"
 zin_regional_tolvael_the_pride_of_tolvael_desc:0 "Lady Agniya rules from the timber halls of her capital, over seven states of forest, tar-pit and shipyard. The North is at peace, and Tolvael means to stay rich in it."
 zin_regional_tolvael_the_shore_burns:0 "The Shore Burns"
 zin_regional_tolvael_the_shore_burns_desc:0 "The beacon-fires are lit along the whole of Tolvael's coast. The Lady calls the great houses to her hall, and tells them that the shore is the first line."
 zin_regional_tolvael_the_shore_holds:0 "The Shore Holds"
 zin_regional_tolvael_the_shore_holds_desc:0 "The fires on the northern shore burn low at last, and the black hulls have gone. Tolvael's coast stands, with its beacon-towers and its watchers."
 zin_regional_tolvael_the_timber_halls:0 "The Timber Halls"
 zin_regional_tolvael_the_timber_halls_desc:0 "The great halls of Tolvael are built of whole trunks, black with age and pitch. The Lady holds council in the largest, with the doors thrown open to the forest."
 zin_regional_tolvael_the_tolvael_host:0 "The Tolvael Host"
 zin_regional_tolvael_the_tolvael_host_desc:0 "The houses keep their own men, and the Lady keeps a muster-roll of them all. When the horns sound, they come in order, with provisions for a week."
 zin_regional_tolvael_the_voivodes:0 "The Voivodes"
 zin_regional_tolvael_the_voivodes_desc:0 "The Lady names voivodes to lead the host, and gives each a staff and a banner. They are drawn from every great house, so that none may say it was slighted."
 zin_regional_tolvael_the_wealth_of_tolvael:0 "The Wealth of Tolvael"
 zin_regional_tolvael_the_wealth_of_tolvael_desc:0 "The great houses have grown rich on timber, tar and rope, and they are not shy about showing it. Fine halls rise beside the old ones, and the market is twice the size."
 zin_regional_tolvael_third_way:0 "A Third Way"
 zin_regional_tolvael_third_way_desc:0 "Tolvael is neither Sonargur's man nor Parim's, and says so to both. The envoys of each court find the Lady unusually well informed about the other."
 zin_regional_tolvael_timber_and_tar:0 "Timber and Tar"
 zin_regional_tolvael_timber_and_tar_desc:0 "Tolvael's forests are old and deep, and its tar-pits are older. The Lady puts both into one trade: timber for the world and tar for its keels."
 zin_regional_tolvael_timber_for_the_world:0 "Timber for the World"
 zin_regional_tolvael_timber_for_the_world_desc:0 "Timber is shipped to every yard on the northern sea and some beyond. The Lady's agents are in the markets of Parim and Sonargur, and they buy rather less than they sell."
 zin_regional_tolvael_timber_trade:0 "Timber for the World"
 zin_regional_tolvael_timber_trade_desc:0 "Every yard on the northern coast builds with Tolvael's timber, and every harbour in the Middle Lands knows the grade-mark. The Lady is a friend of all of them."
 zin_regional_tolvael_voivodes:0 "The Voivodes"
 zin_regional_tolvael_voivodes_desc:0 "The Lady names voivodes to lead the host, each from a different house. They quarrel, but they stand together when the line is thin."
 zin_regional_tolvael.1.a:0 "Feast the great houses"
 zin_regional_tolvael.1.b:0 "Hear the hearths"
 zin_regional_tolvael.1.d:0 "Lady Agniya has ridden out from the timber halls to see her lands. In each great house she is feasted, flattered and presented with a list of grievances, and she must decide whether to take the cups or the complaints first."
 zin_regional_tolvael.1.t:0 "The Lady Rides Out"
 zin_regional_tolvael.2.a:0 "The halls have their own priests"
 zin_regional_tolvael.2.b:0 "Endow the almoners"
 zin_regional_tolvael.2.d:0 "The almoners of the Houses of the First Light have asked leave to raise a hall of healing beside the great hall at Tolvael. They will tend the sick, keep a granary and register every birth. The halls of Tolvael have their own priests, and some of the great houses are sure they want no others."
 zin_regional_tolvael.2.t:0 "Temples in the Halls"
 zin_regional_tolvael.3.a:0 "Tolvael should ask for the Compact"
 zin_regional_tolvael.3.b:0 "Welcome it"
 zin_regional_tolvael.3.d:0 "A boat from Tolvael has come into the strait under a green sail. Lady Agniya sends gifts of timber, tar and rope to the crown at Sonargur, and her wishes for a long friendship. Her envoy does not mention the Compact, and plainly knows it exists."
 zin_regional_tolvael.3.t:0 "Tolvael Offers Friendship"
 zin_regional_tolvael.4.a:0 "The North is far"
 zin_regional_tolvael.4.b:0 "Send gifts"
 zin_regional_tolvael.4.d:0 "A deputation from the timber halls of Tolvael has reached Parim. The envoys bring a gift of tar and a message from Lady Agniya, who has not forgotten the king's long friendship and hopes to see it renewed."
 zin_regional_tolvael.4.t:0 "Tolvael Remembers Parim"
 zin_regional_tolvael.5.a:0 "We stand alone"
 zin_regional_tolvael.5.b:0 "Join the Free Crowns"
 zin_regional_tolvael.5.d:0 "An envoy from Tolvael has crossed the border with a proposal. The small crowns of the North, he says, should not have to choose between Sonargur and Parim; they should stand together in a league of their own, and keep each other's borders safe."
 zin_regional_tolvael.5.t:0 "The Free Crowns of the North"
 zin_regional_tolvael.6.a:0 "Parim needs no northern swords"
 zin_regional_tolvael.6.b:0 "Accept the companies"
 zin_regional_tolvael.6.d:0 "The Leren crown has left the old alliance, and Lady Agniya has not. She writes to Parim that the companies of Tolvael will stand with the king, if the king will have them. Her ships are good, and her axes are better."
 zin_regional_tolvael.6.t:0 "Tolvael Keeps Faith"
