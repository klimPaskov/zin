l_english:
 zin_regional_yeldenne_await_the_worthy:0 "Await the Worthy"
 zin_regional_yeldenne_await_the_worthy_desc:0 "The castle has been waiting for one who comes in need and asks for nothing. The wardens prepare the hall for him: clean bedding, a full hearth and an open gate."
 zin_regional_yeldenne_await_the_worthy_tip_1:0 "Horos tests the heir in thirty days, not sixty."
 zin_regional_yeldenne_banners_of_mpe:0 "Banners of Mp'E"
 zin_regional_yeldenne_banners_of_mpe_desc:0 "Each household sews a banner of blue wool with the sign of the castle. Under them the wardens will march as one people, not as many."
 zin_regional_yeldenne_courteous_refusal:0 "A Courteous Refusal"
 zin_regional_yeldenne_deny_the_dark:0 "Deny the Dark"
 zin_regional_yeldenne_deny_the_dark_desc:0 "The wardens renew every ward on the sealed hall, and walk its circuit on the longest nights. A thief would have to hold the castle for a very long time before the seal gave way."
 zin_regional_yeldenne_deny_the_dark_tip_1:0 "Defiling the seal takes 545 days instead of 365."
 zin_regional_yeldenne_envoys_to_fandanar:0 "Envoys to Fandanar"
 zin_regional_yeldenne_envoys_to_fandanar_desc:0 "A rider in a frost-grey cloak is sent south to the lord of Fandanar with a short message: the castle wants quiet, and offers it in return."
 zin_regional_yeldenne_eyes_in_the_south:0 "Eyes in the South"
 zin_regional_yeldenne_eyes_in_the_south_desc:0 "Peddlers, pilgrims and honest drovers all carry gossip north. The wardens pay them in salt and listen to what they say about the southern courts."
 zin_regional_yeldenne_eyes_in_the_south_spirit:0 "Eyes in the South"
 zin_regional_yeldenne_eyes_in_the_south_spirit_desc:0 "Traders and pilgrims carry word north from the southern roads, and the Judgment Seat hears it all before the first rider reaches the gate."
 zin_regional_yeldenne_frozen_fortress:0 "The Frozen Fortress"
 zin_regional_yeldenne_frozen_fortress_desc:0 "With the guardian gone, the wardens turned the whole state into one great bulwark. Passes are walled, roads are watched and the ice itself is their ally."
 zin_regional_yeldenne_glernaens_old_protections:0 "Glernaen's Old Protections"
 zin_regional_yeldenne_glernaens_old_protections_desc:0 "Gate, wall and hall are bound together at last, ring within ring. The wardens say the air itself leans against any stranger who comes with theft in his heart."
 zin_regional_yeldenne_glernaens_wards:0 "Glernaen's Wards"
 zin_regional_yeldenne_glernaens_wards_2:0 "Glernaen's Old Protections"
 zin_regional_yeldenne_glernaens_wards_2_desc:0 "The whole ring of protections is awake, from the gate to the pillared hall. Whoever strikes at the castle strikes at more than its walls."
 zin_regional_yeldenne_glernaens_wards_desc:0 "Old wards of the New God Glernaen, cut into the doorposts and woken one by one. Spears stand firmer under them, and wardens keep their ranks."
 zin_regional_yeldenne_herds_of_the_frozen_north:0 "Herds of the Frozen North"
 zin_regional_yeldenne_herds_of_the_frozen_north_desc:0 "Shaggy herds winter on the moss-flats beyond the castle road. The wardens count them each spring and mark the strays with blue paint."
 zin_regional_yeldenne_keep_the_empty_hall:0 "Keep the Empty Hall"
 zin_regional_yeldenne_keep_the_empty_hall_desc:0 "The wardens decide to stay. They sweep the hall each morning, light the lamps each evening and keep the gate, as if the guardian might return."
 zin_regional_yeldenne_light_the_shore_beacon:0 "Light the Shore Beacon"
 zin_regional_yeldenne_light_the_shore_beacon_desc:0 "A tall beacon is raised on the headland where a southern ship might land. If it is lit, a tired crew will know where the shore is friendly."
 zin_regional_yeldenne_light_the_shore_beacon_tip_1:0 "Any ambush at the landing is weaker by one."
 zin_regional_yeldenne_open_for_the_heir:0 "Open for the Heir"
 zin_regional_yeldenne_open_for_the_heir_desc:0 "If the heir comes, the bars will come down and the gate will open before he knocks. The wardens clear the road and stand at the posts to welcome him."
 zin_regional_yeldenne_open_for_the_heir_tip_1:0 "The seal opens the day the heir arrives, and his renown grows by ten."
 zin_regional_yeldenne_petition_the_lost_cause:0 "Petition the Lost Cause"
 zin_regional_yeldenne_petition_the_lost_cause_desc:0 "The Lost Cause says it guards what must not fall to the dark. The wardens do not trust easily, but a letter costs nothing, and the north is cold and wide."
 zin_regional_yeldenne_pilgrims_turned_back:0 "Pilgrims Turned Back"
 zin_regional_yeldenne_ride_after_the_bearer:0 "Ride After the Bearer"
 zin_regional_yeldenne_ride_after_the_bearer_desc:0 "Glo has left the hall in the breast of the one who came for it. The wardens saddle their long-haired horses and ride south after him."
 zin_regional_yeldenne_roll_of_the_rejected:0 "The Roll of the Rejected"
 zin_regional_yeldenne_roll_of_the_rejected_desc:0 "Every claimant who came for Glo is written down with his errand and his answer. The roll warns each new envoy what he will hear."
 zin_regional_yeldenne_rumours_of_the_ice:0 "Rumours of the Ice"
 zin_regional_yeldenne_rumours_of_the_ice_desc:0 "There is a tale in the herd-camps of footprints that run out onto the ice and do not come back. The wardens collect it with the others and say nothing."
 zin_regional_yeldenne_seal_keepers:0 "Keepers of the Seal"
 zin_regional_yeldenne_seal_keepers_desc:0 "The crystal sleeps behind the sealed gate, and the wardens who keep it will not be moved. Their oath binds them harder than any levy."
 zin_regional_yeldenne_seal_the_hall:0 "Seal the Hall"
 zin_regional_yeldenne_seal_the_hall_desc:0 "Horos fell before the heir came, and Glo sleeps in its crystal behind the sealed gate. The wardens draw the bars across and swear that none shall pass them."
 zin_regional_yeldenne_secrets_refused:0 "Secrets Refused"
 zin_regional_yeldenne_seek_a_second_bearer:0 "Seek a Second Bearer"
 zin_regional_yeldenne_seek_a_second_bearer_desc:0 "The heir is lost. The wardens will not leave Glo to sleep forever while the dark gathers, and they send a call to every court that might have a worthy hand."
 zin_regional_yeldenne_seek_a_second_bearer_tip_1:0 "Worthy claimants seek Glo as its bearer without the usual cost."
 zin_regional_yeldenne_send_guides_to_the_landing:0 "Send Guides to the Landing"
 zin_regional_yeldenne_send_guides_to_the_landing_desc:0 "The best trackers of Mp'E go down to the landing with sleds and dogs. They know the ice and the weather, and they will lead any friend safely to the castle road."
 zin_regional_yeldenne_send_guides_to_the_landing_tip_1:0 "Any ambush at the landing is weaker by one."
 zin_regional_yeldenne_signs_among_the_pilgrims:0 "Signs Among the Pilgrims"
 zin_regional_yeldenne_signs_among_the_pilgrims_desc:0 "More pilgrims come north each year, singing of a deliverer and asking the way to shrines that do not exist. The wardens note the roads they take and the questions they ask."
 zin_regional_yeldenne_the_blue_sword:0 "The Blue Sword's Drill"
 zin_regional_yeldenne_the_blue_sword_desc:0 "Horos gave his blade to no one yet, but the wardens drill with the pattern of it: the low guard, the turn on the heel, the cut that ends a fight in one stroke."
 zin_regional_yeldenne_the_frozen_fortress:0 "The Frozen Fortress"
 zin_regional_yeldenne_the_frozen_fortress_desc:0 "With no lord to wait on, the wardens turn their strength outward. Every pass is walled and every ford is watched, and the whole of Mp'E becomes a single stronghold."
 zin_regional_yeldenne_the_frozen_gate:0 "The Frozen Gate"
 zin_regional_yeldenne_the_frozen_gate_desc:0 "The outer gate is raised with ice poured between its timbers until it is harder than stone. No ram has ever moved it."
 zin_regional_yeldenne_the_guardian_endures:0 "The Guardian Endures"
 zin_regional_yeldenne_the_guardian_endures_desc:0 "The light in the hall burned through the worst of the winter, and the guardian did not fall. The wardens say he is waiting, and that he will go on waiting."
 zin_regional_yeldenne_the_hall_falls_silent:0 "The Hall Falls Silent"
 zin_regional_yeldenne_the_hall_falls_silent_desc:0 "The guardian is gone and the hall is quiet. The wardens stand in the doorway with their caps in their hands, and no one yet dares to speak."
 zin_regional_yeldenne_the_hall_of_pillars:0 "The Hall of Pillars"
 zin_regional_yeldenne_the_hall_of_pillars_desc:0 "The pillars of the great hall are cleaned and braced, and the lamps are trimmed. Here the guardian hears every petitioner, and here any claimant stands at his mercy."
 zin_regional_yeldenne_the_judgment_seat:0 "The Judgment Seat"
 zin_regional_yeldenne_the_judgment_seat_desc:0 "Horos hears every claimant in the great hall and answers each in few words. The wardens have built a seat for the judge who is not a man and a rail for the petitioners who are."
 zin_regional_yeldenne_the_last_record:0 "The Last Record"
 zin_regional_yeldenne_the_last_record_desc:0 "The clerks of the castle copy the Roll of Yeldenne one last time. It will go south to those who are fighting, so that the host knows what the castle kept and what it gave."
 zin_regional_yeldenne_the_long_watch:0 "The Long Watch"
 zin_regional_yeldenne_the_long_watch_desc:0 "The Castle of Yeldenne has stood in the snow of Mp'E longer than any roll can say. Its lord sleeps little, and his wardens keep the watch with him, night after night."
 zin_regional_yeldenne_the_roll_of_the_rejected:0 "The Roll of the Rejected"
 zin_regional_yeldenne_the_roll_of_the_rejected_desc:0 "A clerk of the wardens writes each claimant's name, his errand and the answer he took away. In time the roll becomes a book that lords fear to see their names in."
 zin_regional_yeldenne_the_swords_oath:0 "The Sword's Oath"
 zin_regional_yeldenne_the_swords_oath_desc:0 "The wardens kneel before the heir with their hands on the pommels of their swords. They give him the oath they gave their lord, and ask only that he keep the sword that was given him."
 zin_regional_yeldenne_the_tithe_roads:0 "The Tithe Roads"
 zin_regional_yeldenne_the_tithe_roads_desc:0 "Sledge-tracks run from every herd-camp to the castle. What the camps give is little, but it arrives every winter without fail."
 zin_regional_yeldenne_the_tribes_of_the_ice:0 "The Tribes of the Ice"
 zin_regional_yeldenne_the_tribes_of_the_ice_desc:0 "Past the last herd-camps live people who follow the seals and the white foxes across the ice. They do not kneel to anyone, but they will trade, and they hear everything."
 zin_regional_yeldenne_the_unyielding_hall:0 "The Unyielding Hall"
 zin_regional_yeldenne_the_unyielding_hall_desc:0 "Within these walls, borrowed power falters, and the wardens mean to keep it so. Arts that serve a thief in the open field find the hall deaf to them."
 zin_regional_yeldenne_the_unyielding_hall_tip_1:0 "Within these walls, borrowed power falters."
 zin_regional_yeldenne_the_wardens_of_mpe:0 "The Wardens of Mp'E"
 zin_regional_yeldenne_the_wardens_of_mpe_desc:0 "The households of Mp'E hold their land from the castle and pay in watches, not in coin. Their sons learn the cold before they learn their letters."
 zin_regional_yeldenne_the_wardens_ride_south:0 "The Wardens Ride South"
 zin_regional_yeldenne_the_wardens_ride_south_desc:0 "The households of Mp'E empty their sledges of grain and fill them with spears. The heir's host is raised, and they mean to be in it."
 zin_regional_yeldenne_the_yeti_compact:0 "The Yeti Compact"
 zin_regional_yeldenne_the_yeti_compact_desc:0 "The yeti of the high snows are shy, strong and slow to anger. The wardens leave salt at the cairns, and in time the cairns leave something in return: a promise of peace."
 zin_regional_yeldenne_wake_the_wards:0 "Wake the Wards"
 zin_regional_yeldenne_wake_the_wards_desc:0 "The protections of Glernaen were cut into the doorposts in an age no one remembers. The wardens clear the frost from the runes and say the old words over each."
 zin_regional_yeldenne_wardens:0 "The Wardens of Mp'E"
 zin_regional_yeldenne_wardens_desc:0 "Households of the frozen state have kept the roads and the herds for the lord of the castle since before any roll was kept. They know the cold, and the cold knows them."
 zin_regional_yeldenne_wardens_host:0 "Banners of Mp'E"
 zin_regional_yeldenne_wardens_host_desc:0 "The wardens ride under their own banners with the heir's host. They are hardened in snow, steady on the march and quick to learn."
 zin_regional_yeldenne_watchers_on_the_coast:0 "Watchers on the Coast"
 zin_regional_yeldenne_watchers_on_the_coast_desc:0 "Beacon-huts rise along the shore, each with a ward-keeper and a stack of dry driftwood. If a strange keel comes into the fjords, the whole coast will know by dusk."
 zin_regional_yeldenne_watchers_on_the_coast_tip_1:0 "Raises the watch on the coast: any ambush at the landing is weaker by one."
 zin_regional_yeldenne.1.a:0 "Take a light tithe"
 zin_regional_yeldenne.1.b:0 "Take the full tithe"
 zin_regional_yeldenne.1.d:0 "The first sledge-caravans have come in from the herd-camps along the tithe roads, hides, smoked fish and salt-meat piled high. The reeve of Mp'E asks how much the castle should take from people who have little to spare."
 zin_regional_yeldenne.1.t:0 "Caravans of the Tithe Road"
 zin_regional_yeldenne.2.a:0 "Swear peace with the hall"
 zin_regional_yeldenne.2.b:0 "Ask for a share of its secrets"
 zin_regional_yeldenne.2.c:0 "Ignore them"
 zin_regional_yeldenne.2.d:0 "Riders in frost-grey cloaks have come to Fandanar from the Castle of Yeldenne. They bring a sealed letter: Horos wants no quarrel with the south, only that his gate is left alone. They ask what Coldor will answer."
 zin_regional_yeldenne.2.t:0 "Envoys from the Hall"
 zin_regional_yeldenne.3.a:0 "Trade fairly and hear them out"
 zin_regional_yeldenne.3.d:0 "The tribes of the ice have lit their fires along the shore again, and they come to the castle road to trade. Furs go south for salt, and news comes with them: who has passed the pass, who has lost a herd, who asks after the castle."
 zin_regional_yeldenne.3.t:0 "Fires on the Ice"
 zin_regional_yeldenne.4.a:0 "Send them away courteously"
 zin_regional_yeldenne.4.b:0 "Send them away with a warning"
 zin_regional_yeldenne.4.d:0 "An envoy has crossed the snow to the Castle of Yeldenne with a crown's seal and a fair speech. His lord, he says, would keep Glo safe from lesser hands. The wardens have heard that speech before, and so has the Roll of the Rejected."
 zin_regional_yeldenne.4.t:0 "A Petitioner at the Gate"
 zin_regional_yeldenne.5.a:0 "Let them pass and watch them"
 zin_regional_yeldenne.5.b:0 "Turn them back at the gate"
 zin_regional_yeldenne.5.d:0 "A column of pilgrims in white has reached the last village on the northern road. They follow the Deliverer, they say, and they would walk to the frozen shrines to pray for the king in Parim. The wardens watch them from the ridge."
 zin_regional_yeldenne.5.t:0 "Pilgrims on the Northern Road"
 zin_regional_yeldenne.6.a:0 "Mourn the guardian"
 zin_regional_yeldenne.6.b:0 "Swear the wardens anew"
 zin_regional_yeldenne.6.d:0 "The green light in the great hall has gone out, and the guardian does not answer the wardens. His body is dust on the dais. Whatever he was, the castle belongs now to those who stayed, and they must say what they are."
 zin_regional_yeldenne.6.t:0 "The Hall Falls Silent"
 zin_regional_yeldenne.7.a:0 "Read it aloud in the camps"
 zin_regional_yeldenne.7.d:0 "A rider from the wardens of Mp'E has come to the camp with a scroll case sealed in blue wax. It is the Roll of Yeldenne: every claimant the castle turned away, every herd-lord who held the road, and the name of the one Horos gave his sword and his heart. It is meant to be read to the host."
 zin_regional_yeldenne.7.t:0 "The Roll of Yeldenne"
 zin_regional_yeldenne.8.a:0 "We will seek it"
 zin_regional_yeldenne.8.a_tip_1:0 "Seeking Glo as its bearer costs the court nothing while the wardens' call stands."
 zin_regional_yeldenne.8.b:0 "Not us"
 zin_regional_yeldenne.8.d:0 "The wardens of Mp'E have sent word to every court that might answer. The heir who bore Glo is lost, the crystal waits in its sealed hall, and a second bearer may take it if he is worthy and comes in need, not in greed."
 zin_regional_yeldenne.8.t:0 "A Call for a Bearer"
 zin_regional_yeldenne.9.a:0 "Listen, and tell them nothing"
 zin_regional_yeldenne.9.d:0 "The tribes of the ice came to trade, and they would speak of nothing but one man. He walked out of the old ice with no shoes and no name, they say, and the snow did not mark where he stepped. They ask the castle whether it knows him."
 zin_regional_yeldenne.9.t:0 "The Tribes Tell of the Ice"
