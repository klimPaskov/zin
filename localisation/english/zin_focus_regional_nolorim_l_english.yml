l_english:
 zin_regional_nolorim_a_guest_in_the_passes:0 "A Guest in the Passes"
 zin_regional_nolorim_a_guest_in_the_passes_desc:0 "A weary traveller has come over the high pass, asking for nothing but a roof, and [zin_loc_eindil] is shown to the warden's own hearth. The pass-wardens do not ask whom they shelter."
 zin_regional_nolorim_ask_the_kin:0 "Ask the Kin"
 zin_regional_nolorim_ask_the_kin_desc:0 "Nolorim sends heralds to the three realms that think best of it, asking for wardens to stand a season in the towers. A few fathers have already answered."
 zin_regional_nolorim_beacons_to_the_kin:0 "Beacons to the Kin"
 zin_regional_nolorim_beacons_to_the_kin_desc:0 "A chain of beacons is raised from the high passes to the great groves, so that the kin may see the flame and know the passes are being held."
 zin_regional_nolorim_eastern_approaches:0 "The Eastern Approaches"
 zin_regional_nolorim_eastern_approaches_desc:0 "The herders speak of strangers on the high road who measured the ground with cords and paid for goat's milk in coin from across the water. Nolwe orders the report copied and sent west."
 zin_regional_nolorim_eyes_on_the_south:0 "Eyes on the South"
 zin_regional_nolorim_eyes_on_the_south_desc:0 "Scouts are set on the southern ridges to watch the roads below. They have seen merchants, pilgrims and, once, a very lost bear."
 zin_regional_nolorim_heights_watch:0 "Watchtowers on the Heights"
 zin_regional_nolorim_heights_watch_desc:0 "Towers above towers: no road below is hidden for long."
 zin_regional_nolorim_herders:0 "Herders of the Heights"
 zin_regional_nolorim_herders_desc:0 "Goatherds know every path of the mountain and every man who walks it."
 zin_regional_nolorim_herders_of_the_heights:0 "Herders of the Heights"
 zin_regional_nolorim_herders_of_the_heights_desc:0 "The goatherds of the heights are organised in bands, each with a horn and a beacon. They see everything on the mountain and have always said so to anyone who would listen."
 zin_regional_nolorim_hide_the_guest:0 "Hide the Guest"
 zin_regional_nolorim_hide_the_guest_desc:0 "The guest is lodged in a cave behind the oldest tower, where no stranger's eye can find him. The towers know every path, and the paths keep silent."
 zin_regional_nolorim_hold_every_pass:0 "Hold Every Pass"
 zin_regional_nolorim_hold_every_pass_desc:0 "Every pass has its company, every company its tower and every tower its beacon. Nolorim, which has never seemed formidable, becomes a hard place to enter."
 zin_regional_nolorim_hold_every_pass_spirit:0 "Hold Every Pass"
 zin_regional_nolorim_hold_every_pass_spirit_desc:0 "Every pass has its company, every company its tower."
 zin_regional_nolorim_kin_beacons:0 "Kin Beacons"
 zin_regional_nolorim_kin_beacons_desc:0 "Beacon-keepers from the kin's groves come to teach the pass-wardens their fire-signals, and take back the signals Nolorim has learned for itself."
 zin_regional_nolorim_mountain_bows:0 "Mountain Bows"
 zin_regional_nolorim_mountain_bows_desc:0 "Short, stiff bows are cut for shooting down steep slopes, strung with goat-gut and tipped with chipped flint. They are poor weapons on a plain and deadly on a ridge."
 zin_regional_nolorim_no_road:0 "No Road Through Nolorim"
 zin_regional_nolorim_no_road_desc:0 "The gates are shut, the stones are ready, and the wardens are in their places."
 zin_regional_nolorim_no_road_through_nolorim:0 "No Road Through Nolorim"
 zin_regional_nolorim_no_road_through_nolorim_desc:0 "The pass-wardens swear that no road shall run through Nolorim for as long as there is a stone to roll and a warden to roll it."
 zin_regional_nolorim_nolorim_endures:0 "Nolorim Endures"
 zin_regional_nolorim_nolorim_endures_desc:0 "The smallest of the Magical Lands' realms has held its passes since before the Wall was built. It sees no reason to stop now."
 zin_regional_nolorim_nolwes_watch:0 "Nolwe's Watch"
 zin_regional_nolorim_nolwes_watch_desc:0 "Pass-Warden Nolwe walks the whole length of the border each spring and counts every tower, every beacon and every man. He has not yet been pleased by the count."
 zin_regional_nolorim_pass_companies:0 "Pass Companies"
 zin_regional_nolorim_pass_companies_desc:0 "The wardens of the towers are drawn into companies, each posted to a pass and drilled to hold it. They know every rock and every drift."
 zin_regional_nolorim_pass_wardens_of_nolorim:0 "The Pass-Wardens of Nolorim"
 zin_regional_nolorim_pass_wardens_of_nolorim_desc:0 "Two high valleys, a handful of watch-towers and a federation of pass-wardens under Nolwe. The towers are old and half-manned, and nobody has come through them in arms for a very long time."
 zin_regional_nolorim_southern_eyes:0 "Eyes on the South"
 zin_regional_nolorim_southern_eyes_desc:0 "Scouts on the southern ridges see far and report quickly."
 zin_regional_nolorim_southern_road_watch:0 "The Southern Road Watch"
 zin_regional_nolorim_southern_road_watch_desc:0 "A small fort is raised where the southern road enters the valley, with a gate, a well and barracks for forty. It is the first new stonework in Nolorim in two centuries."
 zin_regional_nolorim_stone_in_the_passes:0 "Stone in the Passes"
 zin_regional_nolorim_stone_in_the_passes_desc:0 "Quarrymen cut stone from the foot of the Magic Mountains and haul it by goat-track to the high towers. Every block laid in the passes is a year of safety bought."
 zin_regional_nolorim_stone_throwers:0 "Stone-Throwers"
 zin_regional_nolorim_stone_throwers_desc:0 "Counterweight throwers are built on the gate-towers, to roll stone down on any host that comes up the narrow road in column."
 zin_regional_nolorim_the_federated_valleys:0 "The Federated Valleys"
 zin_regional_nolorim_the_federated_valleys_desc:0 "The two valleys keep one moot and two hearths. Their herders quarrel over water, their wardens over precedence, and both agree that the passes matter more than either."
 zin_regional_nolorim_the_high_roads:0 "The High Roads"
 zin_regional_nolorim_the_high_roads_desc:0 "The goat-tracks between the towers are widened and paved, so that a warden may reach the next post in an hour rather than a day."
 zin_regional_nolorim_the_kin_send_more:0 "The Kin Send More"
 zin_regional_nolorim_the_kin_send_more_desc:0 "Wardens from the kin's groves march up the long road to the passes, their packs heavy with arrows and their hearts lighter than they were."
 zin_regional_nolorim_the_kindred_at_the_passes:0 "The Kindred at the Passes"
 zin_regional_nolorim_the_kindred_at_the_passes_desc:0 "The Kindred of the Woods has been raised, and Nolorim takes its place at last among the kin, with the high passes as its share of the common defence."
 zin_regional_nolorim_the_magic_mountains_road:0 "The Magic Mountains Road"
 zin_regional_nolorim_the_magic_mountains_road_desc:0 "A road is cut along the flank of the Magic Mountains, joining Nolorim's valleys to the lands of the kin. It is steep and cold, and kinder than the old way."
 zin_regional_nolorim_the_mountain_paths:0 "The Mountain Paths"
 zin_regional_nolorim_the_mountain_paths_desc:0 "Pass-wardens guide the guest over goat-tracks that save weeks of travel. Nobody on those heights has ever been late to a place they meant to reach."
 zin_regional_nolorim_the_passes_hold:0 "The Passes Hold"
 zin_regional_nolorim_the_passes_hold_desc:0 "The beacons burn from tower to tower. An armed host is on the road, and Nolorim's old gates are closed for the first time in living memory."
 zin_regional_nolorim_the_passes_quiet:0 "The Passes Are Quiet"
 zin_regional_nolorim_the_passes_quiet_desc:0 "The road below is empty and the beacons are dark. The wardens climb back to their towers and begin, as always, to count the stones."
 zin_regional_nolorim_the_wardens_oath:0 "The Wardens' Oath"
 zin_regional_nolorim_the_wardens_oath_desc:0 "Every warden of the high passes swears the same short oath on a stone from the first tower: to keep the watch, to light the flame and to leave the post only when relieved."
 zin_regional_nolorim_valleys_first:0 "Valleys First"
 zin_regional_nolorim_valleys_first_desc:0 "The valleys come first: the herds are fattened, the terraces mended and the quarries worked. A well-fed warden is a long-lived one."
 zin_regional_nolorim_valleys_first_spirit:0 "Valleys First"
 zin_regional_nolorim_valleys_first_spirit_desc:0 "Well-fed valleys, mended terraces and busy quarries."
 zin_regional_nolorim_walls_across_the_passes:0 "Walls Across the Passes"
 zin_regional_nolorim_walls_across_the_passes_desc:0 "Where the passes are narrowest the pass-wardens raise walls of dry stone, four paces thick and five high, with a single gate that can be barred from within."
 zin_regional_nolorim_wardens_first:0 "Wardens First"
 zin_regional_nolorim_wardens_first_desc:0 "The best of the valleys' young are drawn to the towers, and the herds and quarries get what is left. The passes will be held, whatever the valleys must give up."
 zin_regional_nolorim_wardens_first_spirit:0 "Wardens First"
 zin_regional_nolorim_wardens_first_spirit_desc:0 "The towers take the best of the valleys' young, and they dig in as if they meant to stay."
 zin_regional_nolorim_wardens_from_the_forest:0 "Wardens from the Forest"
 zin_regional_nolorim_wardens_from_the_forest_desc:0 "A message goes to the elders of the Magical Forest: the passes are old, the towers few, and a company of the forest's wardens would be gladly housed."
 zin_regional_nolorim_wardens_oath:0 "The Wardens' Oath"
 zin_regional_nolorim_wardens_oath_desc:0 "A short oath, sworn on a stone from the first tower, binds every warden to his post."
 zin_regional_nolorim_watchtowers_on_the_heights:0 "Watchtowers on the Heights"
 zin_regional_nolorim_watchtowers_on_the_heights_desc:0 "New towers are raised on the heights above the old ones, and the watchers in them see farther down the roads than their fathers ever did."
 zin_regional_nolorim.1.a:0 "Rebuild the near towers first."
 zin_regional_nolorim.1.b:0 "Light every tower."
 zin_regional_nolorim.1.d:0 "At the spring muster Nolwe counts the wardens in each tower, and the count is short in every one. The old men ask whether to light every tower with what there is, or to rebuild the near ones properly and leave the far ones to the wind."
 zin_regional_nolorim.1.t:0 "The Towers Count Their Wardens"
 zin_regional_nolorim.2.a:0 "We have our own shore."
 zin_regional_nolorim.2.b:0 "Send wardens."
 zin_regional_nolorim.2.d:0 "A rider from the high valleys of Nolorim reaches the council with a plain request: wardens for the towers on the passes, for a season, as a kindness between kin. The council weighs it against the needs of its own borders."
 zin_regional_nolorim.2.t:0 "Nolorim Asks for Wardens"
 zin_regional_nolorim.3.a:0 "Not this year."
 zin_regional_nolorim.3.b:0 "Send wardens."
 zin_regional_nolorim.3.d:0 "A herald of Nolorim stands in the great forest's hall and asks the elders for a company of wardens to stand a year in the high passes. The elders know the towers are old, and the herald's boots are worn."
 zin_regional_nolorim.3.t:0 "Nolorim Asks the Forest"
 zin_regional_nolorim.4.a:0 "Send the report west."
 zin_regional_nolorim.4.d:0 "The herders of the heights come down with a story. Strangers with good boots measured the high road with knotted cords, and they paid for goat's milk in coin from across the eastern water. Nolwe has the report copied twice, and the second copy sent west."
 zin_regional_nolorim.4.t:0 "Herders Report"
