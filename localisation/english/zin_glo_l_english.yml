l_english:
 zin_glo_cat_bearer:0 "The Bearer's Light"
 zin_glo_cat_bearer_desc:0 "The power the bearer of the green light can spend, and what the light asks for it."
 zin_glo_defile_seal:0 "Defile the Seal"
 zin_glo_defile_seal_desc:0 "The hall is sealed over the crystal, and the hall is yours. A year of black rites on the flagstones may close the seal for good, and the green light beneath with it."
 zin_glo_enter_the_hall:0 "Enter the Hall"
 zin_glo_enter_the_hall_desc:0 "The party waits above the road to the castle. The hall is not far, and the guardian is one old knight. Strike now, or wait for the heir to come to you."
 zin_glo_friend_of_the_hall:0 "Friend of the Hall"
 zin_glo_glernaens_light:0 "Glernaen's Light"
 zin_glo_glernaens_light_desc:0 "A green light burns at the breast of the host's champion. Soldiers who march beside it say the cold bites less and the fear sits further off."
 zin_glo_grave_hunt:0 "Hunt the Crystal in the North"
 zin_glo_grave_hunt_desc:0 "Volgan's hunters have heard of a green light in the frozen north. Send them to find it, and to bring it south if it can be brought."
 zin_glo_guard_the_hall:0 "Guard the Northern Hall"
 zin_glo_guard_the_hall_desc:0 "The Lost Cause may offer the guardian a company of its captains to stand at his gate, outside the hall and never within. He may accept, or he may not."
 zin_glo_northern_watch:0 "The Northern Watch"
 zin_glo_northern_watch_desc:0 "A company of the Lost Cause stands at the gate of Mp'E, outside the hall and never within. The long road north costs the court dear."
 zin_glo_petition_horos:0 "Petition the Guardian"
 zin_glo_petition_horos_desc:0 "Send envoys to the hall of Mp'E to ask the guardian for the green crystal he keeps. Every crown that has asked has been refused. Some were refused with courtesy."
 zin_glo_rebuked:0 "Rebuked at the Hall"
 zin_glo_second_bearer:0 "Second Bearer of Glo"
 zin_glo_second_bearer_desc:0 "The green light did not choose a king. It chose a marshal who would carry it and ask for nothing."
 zin_glo_seek_as_bearer:0 "Seek Glo as Its Bearer"
 zin_glo_seek_as_bearer_called:0 "Seek Glo as Its Bearer"
 zin_glo_seek_as_bearer_called_desc:0 "The heir is lost, and the green light waits in the north for another hand. Yeldenne has called for a bearer, and the hall asks no fee. Send your best marshal to Mp'E and let the crystal judge."
 zin_glo_seek_as_bearer_desc:0 "The heir is lost, and the green light waits in the north for another hand. Send your best marshal to the hall of Mp'E and let the crystal judge."
 zin_glo_seekers:0 "The Green Crystal"
 zin_glo_seekers_desc:0 "Crowns and dark powers seek the keeper of the green crystal in the frozen north, and the keeper answers them one by one."
 zin_glo_tt_bearer_near:0 "A state near the bearer's army holds the dead of the Mistake"
 zin_glo_tt_cost_power:0 "Costs 30 of the bearer's power"
 zin_glo_tt_glo_free:0 "The crystal is in the hall, or sealed under it"
 zin_glo_tt_hall_unspoiled:0 "The guardian of Mp'E still keeps the hall"
 zin_glo_tt_heir_lost:0 "The heir of Aen is out of the story"
 zin_glo_tt_lost_cause_leader:0 "Your realm leads the Lost Cause"
 zin_glo_tt_not_petitioned:0 "Your envoys have not yet been to the hall"
 zin_glo_tt_party_waits:0 "The party waits above the road to the castle"
 zin_glo_tt_peace:0 "The realm is not fighting a war it began"
 zin_glo_tt_power:0 "The bearer holds enough of Glernaen's power"
 zin_glo_tt_sealed:0 "The crystal lies sealed under the hall and the hall is yours"
 zin_glo_tt_volgan_seeks:0 "Volgan has turned toward the green crystal"
 zin_glo_tt_worthy:0 "Your realm passes the green light's test of worth"
 zin_glo_wave_decision:0 "Glo's Wave"
 zin_glo_wave_decision_desc:0 "The bearer drives the sword into the earth and the green light runs outward through the ground. The dead do not rise where it passes."
 zin_glo_wound_of_yeldenne:0 "The Wound of Yeldenne"
 zin_glo_wound_of_yeldenne_desc:0 "The southern lord reached for the green crystal and the north answered. His hunters came back broken, and his court has not forgotten how they were carried."
 zin_glo.11.a:0 "Lie in wait on the approach."
 zin_glo.11.b:0 "Climb to the hall now."
 zin_glo.11.d:0 "Your party stands in the snow above the one road that climbs from the shore to the Castle of Yeldenne. Nothing moves on the white slope but the wind. A foreign ship lies in the bay below, and the road would take any stranger beneath your men."
 zin_glo.11.t:0 "The Approach to Yeldenne"
 zin_glo.20.a:0 "The hall answers."
 zin_glo.20.d_a:0 "A king in a gold mantle walked into the hall of Mp'E and named himself lord of Aenor and a god. The guardian rose from his throne. 'Son of Ein,' he said. 'I know why your father denied you. Go.' The man did not go. The wardens in the lower passages heard iron ring on stone, then a cry, then a second step on the stair."
 zin_glo.20.d_b1:0 "A stranger from the south and a stranger from the sea met on the stair of the hall in the same hour, and the guardian stood between them. The wardens say the two never spoke to one another: the one in the king's mantle struck, the one in sea-worn armour struck back, and the guardian's blue sword swept the hall."
 zin_glo.20.d_b2:0 "A tall man in a salt-stained cloak climbed alone from the shore. He did not demand the hall, and he did not name himself king of anything. The guardian looked at him for a long time and bade the wardens open the inner door."
 zin_glo.20.d_c:0 "A king's party climbed to Mp'E in the third week of the thaw and asked for the green crystal in the name of a god. The guardian refused, as he has refused every claimant. The wardens bolted the lower doors and lit every lamp."
 zin_glo.20.d_hub_a:0 "'Afrit, son of Ein,' said the guardian. 'I know why your father denied you. Go.' You did not go. You had come for the green stone, and with the artifacts at your throat and wrist you were stronger than any thing that has stood in this hall. You seized the guardian and passed behind him, and the blade you carried went into the back of his neck."
 zin_glo.20.d_hub_b1:0 "The heir was already inside. You came up the stair with the artifacts at your throat and wrist and found two men in the hall instead of one: the guardian, and the stranger from the sea who has your father's jaw."
 zin_glo.20.d_hub_c:0 "'Afrit, son of Ein,' said the guardian. 'Go back down the road.' You did not go back. The artifacts at your throat and wrist hummed against the hall's old wards, and the wards hummed back."
 zin_glo.20.t:0 "Who Walks Here?"
 zin_glo.21.a:0 "The hall is empty."
 zin_glo.21.d:0 "It is told in Mp'E, and nowhere else with certainty. The guardian took the intruder in both hands, and the intruder was behind him, and a blade went into the back of the guardian's neck. [zin_loc_eindil] came up the stair and struck the intruder, and the intruder was gone, as through a door that is not in the wall. The guardian knelt. He spoke to the stranger for a long while, quietly. Then he opened his own breast and laid in the stranger's hands a green stone that beat like a heart, and a blue sword beside it, and was dust."
 zin_glo.21.t:0 "The Heart of Horos"
 zin_glo.22.a:0 "The hall is empty."
 zin_glo.22.d:0 "For many days [zin_loc_eindil] kept the wardens' hours. He carried water, mended the lamp-stairs and sat by night with the herders' children. On the last evening the guardian called him to the throne. 'You came for no crown,' he said. 'That is why it may be yours.' He opened his own breast and laid in the stranger's hands a green stone that beat like a heart, and a blue sword beside it, and turned to dust."
 zin_glo.22.t:0 "The Willing Gift"
 zin_glo.23.a:0 "The hall is empty."
 zin_glo.23.d:0 "The guardian had the intruder pinned against the great pillar when [zin_loc_eindil] reached the door. For a heartbeat the hall held three. Then the intruder tore free and was gone, bleeding gold on the stair. The guardian was wounded as well. 'This is the one,' he said, and gave away what he had been given to keep: a green stone that beat like a heart, and a blue sword. He was dust before the wardens reached the throne."
 zin_glo.23.d_hub:0 "The guardian had you against the great pillar when the heir reached the door. You tore free with your blood on the stair and the artifacts at your throat screaming. Behind you, the old knight gave the heir the green stone and fell to dust. You had been a breath from taking it yourself."
 zin_glo.23.t:0 "Two Against One"
 zin_glo.24.a:0 "The north keeps its keeper."
 zin_glo.24.d:0 "The hall of Mp'E was never taken by a host, and it was not taken now. The intruders came up the road in good order and went down it carried. The wardens say the walls themselves leaned in. The guardian sits his throne with the green stone beating at his breast, and the wards burn the brighter for the trial."
 zin_glo.24.d_hub:0 "You came up the road strong, with every artifact you have gathered, and the hall broke you. The old knight did not rise from his throne until the last moment. When he did, the light from his breast drove the artifacts dark. You fell back to the bay with fewer men than you brought and a wound that will not close."
 zin_glo.24.d_volgan:0 "Your hunters came down from Mp'E on their shields. The guardian let the living go, to say what they had seen: a hall that leaned in, a green light that did not fade, and a knight who did not seem to tire."
 zin_glo.24.t:0 "The Hall Holds"
 zin_glo.25.a:0 "The seal holds."
 zin_glo.25.d:0 "The guardian fell at the foot of his throne. Where the stone should have lain on the dais there was only light, and the light folded into the stone and the stone into the floor, and the hall went dark. The wardens say the crystal still beats beneath the flagstones, and that it will wake for no one who comes with a blade."
 zin_glo.25.d_hub:0 "The guardian is dead, and the stone is not in your hands. It went down into the floor of the hall as you reached for it, and it will not come up for you. You hold a dark room with a very old knight's armour in it."
 zin_glo.25.d_volgan:0 "The guardian is dead, but the stone sank into the hall's floor before your hunters could lift it. They stand in a dark room with an old knight's armour and a green glimmer beneath their feet that no blade can pry loose."
 zin_glo.25.t:0 "The Sealed Heart"
 zin_glo.30.a:0 "A hard winter for the north."
 zin_glo.30.d:0 "No one has come down from Mp'E for twenty days, and the herders will not go up. Travellers on the north road say the beacon at the castle gate is out. The tithe-folk say the guardian of Yeldenne is dead."
 zin_glo.30.t:0 "Silence in the North"
 zin_glo.40.a:0 "Let them ride."
 zin_glo.40.d:0 "Volgan has named his hunters: riders of the Grave-Warden and two of the Ember Herald's best scouts. They go north in grey cloaks by the western roads, with orders to bring back a green light or a reason."
 zin_glo.40.t:0 "The Grave Hunt Sets Out"
 zin_glo.41.a:0 "Bar the doors."
 zin_glo.41.d:0 "A column of riders in southern black came up the road to Mp'E under a banner the wardens did not know. They asked the guardian for the green crystal. He said no, and the hall answered with him."
 zin_glo.41.t:0 "The Grave Hunt"
 zin_glo.5.a:0 "It is a drowned man's dream. Let it lie."
 zin_glo.5.b:0 "Send hunters south."
 zin_glo.5.d:0 "A priest of the southern isles writes that a man was cast up on the reef after a western ship broke there. He walks like a lord. In his fever he speaks the oldest tongue of men, and the fishermen heard him call a name out of the surf: Aen. The whisperers wait for your word."
 zin_glo.5.t:0 "A Castaway Who Speaks of Aen"
 zin_glo.50.a:0 "Press on."
 zin_glo.50.b:0 "Break off the work."
 zin_glo.50.d:0 "The sealed hall will not be defiled by simple force. Your scholars have broken three of the floor's seven bindings, and each time the green light beneath the flagstones brightens, as if to remind them what it is. They ask whether to press on."
 zin_glo.50.t:0 "The Seal Resists"
 zin_glo.51.a:0 "Let the north mourn."
 zin_glo.51.d:0 "The green light under the hall of Mp'E has gone out. The wardens who survive say it did not flee. It was closed, as a door is closed by hands that wanted it shut."
 zin_glo.51.t:0 "Glo Dims"
 zin_glo.60.a:0 "Let the captains stand at the gate."
 zin_glo.60.b:0 "The hall keeps its own doors."
 zin_glo.60.d:0 "The Lost Cause offers a company of its captains to stand at the gate of the castle, outside the hall and never within. The Warden's steward asks whether the guardian will have them."
 zin_glo.60.t:0 "Guard the Northern Hall"
 zin_glo.61.a:0 "We take our leave."
 zin_glo.61.d:0 "The guardian heard the envoys in the cold hall and said only what he has said to every crown: the green stone is not a prize. He did not send them away angry. The wardens poured them wine, and the envoys remembered it."
 zin_glo.61.d_rebuked:0 "The guardian heard the envoys in the cold hall and said only what he has said to every crown: the green stone is not a prize. Then he looked at the one who had sent them, across a thousand miles, and the envoys left with the feeling of having been weighed."
 zin_glo.61.t:0 "The Guardian Refuses"
 zin_glo.62.a:0 "Withdraw."
 zin_glo.62.d:0 "For four weeks your host held the pale stone of Mp'E, and for four weeks the cold, the dark and the wind took their toll. On the twenty-ninth day the sentries found themselves outside the walls with no memory of leaving, and the gates barred behind them."
 zin_glo.62.t:0 "The Hall Expels the Intruders"
 zin_glo.63.a:0 "So the north keeps its own king."
 zin_glo.63.d:0 "You hold the state of Mp'E, and the paper that says so is correct. But the guardian still sits his hall, the green stone is still his, and the wardens still pay their tithes to him. No annexation reached him."
 zin_glo.63.t:0 "The Hall Remains"
 zin_glo.64.a:0 "Send the guard."
 zin_glo.64.b:0 "We cannot spare them."
 zin_glo.64.d:0 "A rider from Mp'E brings the Warden's word: the guardian will let a company of the Lost Cause stand at the gate, if the Lost Cause will send it. The long road north is cold, and the court of Parim would rather spend its captains elsewhere."
 zin_glo.64.t:0 "The Hall Asks for Guards"
 zin_glo.70.a:0 "The light is carried."
 zin_glo.70.d:0 "The green stone has chosen again. A marshal of [zin_glo_claimant.GetNameDef] walked into the hall of Mp'E, and what the stone found there was not a crown. It rose to the marshal's hand. In the north they say it burns a little dimmer than it burned for the heir, and no one is sure whether that is the stone or the age."
 zin_glo.70.t:0 "A Second Bearer"
 zin_glo.80.a:0 "The stone is his."
 zin_glo.80.d:0 "The wardens have waited at the sealed door longer than any of them can reckon. The man in the salt-stained cloak laid his palm on the flagstone, and the floor of the hall went green. The stone rose to his hand as if it had never left it. He stood a long time with his eyes shut. When he opened them he knew who wears the crown in Parim, and whose son he is."
 zin_glo.80.t:0 "The Seal Opens for the Heir"
 zin_horos_guardian:0 "Guardian of the Hall"
 zin_horos_guardian_desc:0 "He has kept one crystal and one oath through more ages than the chronicles number."
 zin_yeldenne_empty_hall:0 "The Empty Hall"
 zin_yeldenne_guardian_of_glo:0 "Guardian of Glo"
 zin_yeldenne_guardian_of_glo_desc:0 "A green crystal beats in the hall of Mp'E, and the guardian who keeps it has never yielded it. Wardens, herders and tithe-folk hold the passes in his name."
 zin_yeldenne_hall_wards:0 "The Hall Wards"
 zin_yeldenne_sealed_hall:0 "The Sealed Hall"
 zin_yeldenne_the_empty_throne:0 "The Empty Throne"
 zin_yeldenne_the_empty_throne_desc:0 "The hall is silent. The wardens keep the doors and the lamps, and wait to learn what the silence asks of them."
 zin_yeldenne_warden:0 "The Warden of Mp'E"
 zin_yeldenne_warden_trait:0 "Warden of Mp'E"
 zin_yeldenne_warden_trait_desc:0 "Chosen from the household that keeps the doors, the Warden rules as the hall's steward and never as its master."
