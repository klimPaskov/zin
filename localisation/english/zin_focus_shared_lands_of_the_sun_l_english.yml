l_english:
 zin_shared_lands_of_the_sun_a_courteous_distance:0 "A Courteous Distance"
 zin_shared_lands_of_the_sun_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_shared_lands_of_the_sun_a_guest_at_noon:0 "A Guest at Noon"
 zin_shared_lands_of_the_sun_a_guest_at_noon_desc:0 "Men may not sit in the Noon Council, but a guest may stand at the edge of the court and be heard. [ROOT.GetName] asks that courtesy and sends gifts to the Chair's court to ask it with."
 zin_shared_lands_of_the_sun_a_loyal_realm:0 "A Loyal Realm"
 zin_shared_lands_of_the_sun_a_loyal_realm_desc:0 "A realm that keeps its oath is trusted with more than one that merely signs it. [ROOT.GetName] pays its tribute early and in full, and its protector answers with favour and a lighter hand."
 zin_shared_lands_of_the_sun_a_seat_at_noon:0 "A Seat at Noon"
 zin_shared_lands_of_the_sun_a_seat_at_noon_desc:0 "The Sunhot realms meet at midday in an open court with no roof, where nothing is decided before the sun is overhead. [ROOT.GetName] takes its seat among them and speaks in its turn."
 zin_shared_lands_of_the_sun_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_shared_lands_of_the_sun_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_shared_lands_of_the_sun_envoys_to_gala:0 "Envoys to Gala"
 zin_shared_lands_of_the_sun_envoys_to_gala_desc:0 "The court at Gala is old, and its king has seen what nobody else alive remembers. [ROOT.GetName] sends envoys with gifts and a plain wish to hear his counsel."
 zin_shared_lands_of_the_sun_free_steadings:0 "The Free Steadings"
 zin_shared_lands_of_the_sun_free_steadings_desc:0 "Every family of [ROOT.GetName] builds where it chooses and answers to nobody for the way it does it. Barns and workshops rise accordingly."
 zin_shared_lands_of_the_sun_free_steadings_of_the_sun:0 "Free Steadings"
 zin_shared_lands_of_the_sun_free_steadings_of_the_sun_desc:0 "The steadings of [ROOT.GetName] are held by their own families and answer to no lord but the harvest. Their elders meet under the open sky, and what they agree they keep."
 zin_shared_lands_of_the_sun_free_steadings_of_the_sun_tip_1:0 "Popular feeling in [ROOT.GetName] drifts toward free steadings."
 zin_shared_lands_of_the_sun_granaries_of_the_sun:0 "Granaries of the Sun"
 zin_shared_lands_of_the_sun_granaries_of_the_sun_desc:0 "White-roofed granaries stand on the high ground where the damp cannot reach them. The keepers of the stores count them every spring and tell the whole realm what they hold."
 zin_shared_lands_of_the_sun_harbours_on_the_sea_of_gods:0 "Harbours on the Sea of Gods"
 zin_shared_lands_of_the_sun_harbours_on_the_sea_of_gods_desc:0 "The Sea of Gods lies warm and green off the coast of [ROOT.GetName], and its harbours are kept swept and whitewashed. Pilgrims and merchants both come in fair weather, and every one is given a berth."
 zin_shared_lands_of_the_sun_healing_houses:0 "The Healing Houses"
 zin_shared_lands_of_the_sun_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_shared_lands_of_the_sun_heed_the_old_king:0 "Heed the Old King"
 zin_shared_lands_of_the_sun_heed_the_old_king_desc:0 "When the old king of Gala sends a word of warning, [ROOT.GetName] will hear it in full council and act on it before the next moon. A court that listens early loses the least."
 zin_shared_lands_of_the_sun_heeding_court:0 "A Court That Heeds"
 zin_shared_lands_of_the_sun_heeding_court_desc:0 "Warnings from Gala are read aloud in full council, and [ROOT.GetName] acts on them while the ink is wet."
 zin_shared_lands_of_the_sun_hired_spears:0 "Hired Spears"
 zin_shared_lands_of_the_sun_hired_spears_desc:0 "The Sunhot realms keep few soldiers and pay well for more. Companies from [ROOT.GetName] guard their roads and wells for a season's wage and come home with new skill and a little silver."
 zin_shared_lands_of_the_sun_honour_the_president:0 "Honour the Chair"
 zin_shared_lands_of_the_sun_honour_the_president_desc:0 "The realm that keeps the Council's chair holds it for all and answers to all. [ROOT.GetName] sends gifts and an envoy to its court, and is thanked in the old words."
 zin_shared_lands_of_the_sun_join_league_tip_1:0 "The Noon League is not open to this realm."
 zin_shared_lands_of_the_sun_keepers_of_the_sanctuary:0 "Keepers of the Sanctuary"
 zin_shared_lands_of_the_sun_keepers_of_the_sanctuary_desc:0 "Rings of white stone around the oldest shrines are renewed each spring by those who keep them. Wardens of the sanctuary walk the rings at dusk and answer any stranger with courtesy and a closed gate."
 zin_shared_lands_of_the_sun_loyal_realm_tip_1:0 "A loyal realm is trusted with a lighter hand."
 zin_shared_lands_of_the_sun_men_under_the_sun:0 "Men Under the Sun"
 zin_shared_lands_of_the_sun_men_under_the_sun_desc:0 "Among the tall Sunhot realms, [ROOT.GetName] is a realm of men: short-lived and quick, and wise enough to be useful rather than grand. Its folk are welcome in the great markets and are expected to mind their manners there."
 zin_shared_lands_of_the_sun_mourning_for_lorien:0 "Mourning for Lorien"
 zin_shared_lands_of_the_sun_mourning_for_lorien_desc:0 "A season of mourning waits in the customs of the realms for the day their king at Gala is lost. When that day comes, [ROOT.GetName] will light its lamps, close its feasting halls and walk in the long procession."
 zin_shared_lands_of_the_sun_mourning_for_lorien_tip_1:0 "The realms under the sun keep a season of mourning."
 zin_shared_lands_of_the_sun_oath_to_the_protector:0 "The Oath to the Protector"
 zin_shared_lands_of_the_sun_oath_to_the_protector_desc:0 "[ROOT.GetName] stands under the shield of a stronger realm and has sworn to it before witnesses. The oath is read again at noon, so that both sides remember what was promised and by whom."
 zin_shared_lands_of_the_sun_old_songs_of_the_woods:0 "Old Songs of the Woods"
 zin_shared_lands_of_the_sun_old_songs_of_the_woods_desc:0 "The singers of the groves keep songs that run longer than a winter night, each verse a lesson in some craft nobody now practises. [ROOT.GetName] writes them down and lets its young put them to use."
 zin_shared_lands_of_the_sun_old_strength:0 "The Old Strength"
 zin_shared_lands_of_the_sun_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_shared_lands_of_the_sun_orchards:0 "Orchards and Vines"
 zin_shared_lands_of_the_sun_orchards_and_vines:0 "Orchards and Vines"
 zin_shared_lands_of_the_sun_orchards_and_vines_desc:0 "Fruit trees and trained vines climb the terraces, and the autumn markets smell of them for a month. A fed folk is a calm folk, and [ROOT.GetName] grows slowly in numbers and in ease."
 zin_shared_lands_of_the_sun_orchards_desc:0 "Fruit from the high terraces feeds [ROOT.GetName] well and keeps its people content."
 zin_shared_lands_of_the_sun_our_own_sun:0 "Our Own Sun"
 zin_shared_lands_of_the_sun_our_own_sun_desc:0 "The same sun shines on the protector's terraces and on ours, say the elders of [ROOT.GetName], and it does not shine on one more kindly than on the other. The realm begins to speak for itself."
 zin_shared_lands_of_the_sun_our_share_of_the_sun_guard:0 "Our Share of the Sun Guard"
 zin_shared_lands_of_the_sun_our_share_of_the_sun_guard_desc:0 "A guard of tall spearmen from every realm keeps the open court and the roads that lead to it. [ROOT.GetName] sends its share, drilled in the slow, heavy step that Sunhot spears have always kept."
 zin_shared_lands_of_the_sun_own_sun_tip_1:0 "The realm begins to speak for itself."
 zin_shared_lands_of_the_sun_peace_among_the_realms:0 "Peace Among the Realms"
 zin_shared_lands_of_the_sun_peace_among_the_realms_desc:0 "The Council's oldest custom is that no realm raises a hand against another, and that a quarrel over a boundary stone is settled by an elder from a third realm. [ROOT.GetName] swears it again, and means it."
 zin_shared_lands_of_the_sun_peace_of_noon:0 "The Peace of Noon"
 zin_shared_lands_of_the_sun_peace_of_noon_desc:0 "No realm of the Council raises a hand to another, and [ROOT.GetName] guards that peace as closely as its own gates."
 zin_shared_lands_of_the_sun_pilgrims_of_the_sea_of_gods:0 "Pilgrims of the Sea of Gods"
 zin_shared_lands_of_the_sun_pilgrims_of_the_sea_of_gods_desc:0 "White sails come along the coast each summer carrying pilgrims to the shrines of the Sea of Gods. [ROOT.GetName] gives them water, shade and a safe road, and is spoken of kindly all along the shore."
 zin_shared_lands_of_the_sun_priests_from_afar:0 "Priests From Afar"
 zin_shared_lands_of_the_sun_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_shared_lands_of_the_sun_protectors_favour:0 "The Protector's Favour"
 zin_shared_lands_of_the_sun_protectors_favour_desc:0 "The protecting realm has noticed how faithfully [ROOT.GetName] keeps its oath, and shows it with a lighter hand and an open ear."
 zin_shared_lands_of_the_sun_rangers_of_the_groves:0 "Rangers of the Groves"
 zin_shared_lands_of_the_sun_rangers_of_the_groves_desc:0 "Archers who can strike a falling leaf walk the edges of [ROOT.GetName] in pairs, seen by no one. Their craft is taught from a bow of the old pattern, and they are proud of it."
 zin_shared_lands_of_the_sun_ready_for_the_noon_league:0 "Ready for the Noon League"
 zin_shared_lands_of_the_sun_ready_for_the_noon_league_desc:0 "When danger passes the borders, the Council can bind its realms into one league with one banner and one watch-fire. [ROOT.GetName] gives its word beforehand, so that nobody need ask it twice."
 zin_shared_lands_of_the_sun_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_shared_lands_of_the_sun_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_shared_lands_of_the_sun_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_shared_lands_of_the_sun_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_shared_lands_of_the_sun_sanctuary_keepers:0 "Keepers of the Sanctuary"
 zin_shared_lands_of_the_sun_sanctuary_keepers_desc:0 "Wardens walk the white rings at dusk. The realm sleeps well in the knowledge that someone is awake."
 zin_shared_lands_of_the_sun_ships_for_the_isles:0 "Ships for the Isles"
 zin_shared_lands_of_the_sun_ships_for_the_isles_desc:0 "South of the Sea of Gods lie islands that trade with the Sunhot coasts and remember them in song. [ROOT.GetName] sends ships and gifts to their harbours, and the isles send back fruit and fair words."
 zin_shared_lands_of_the_sun_stone_of_the_high_places:0 "Stone of the High Places"
 zin_shared_lands_of_the_sun_stone_of_the_high_places_desc:0 "Pale quarry stone is brought down from the heights, cut by tall hands and set without lime. A second Guild Workshop rises where the quarry road meets the valley."
 zin_shared_lands_of_the_sun_sun_guard_share:0 "Our Share of the Sun Guard"
 zin_shared_lands_of_the_sun_sun_guard_share_desc:0 "A company of tall spearmen from [ROOT.GetName] stands in the Council's guard, and its drill is the finest in the south."
 zin_shared_lands_of_the_sun_sun_markets:0 "The Sun Markets"
 zin_shared_lands_of_the_sun_sun_markets_desc:0 "The long square under its white awnings draws every trader on the coast, and each leaves with good will and light purses."
 zin_shared_lands_of_the_sun_sun_terraces:0 "Sun Terraces"
 zin_shared_lands_of_the_sun_sun_terraces_desc:0 "Stone steps cut into the hillsides catch the long light and hold the rain. The realm has few hands, so every terrace is laid once and laid to last, and the first of them feeds a new Guild Workshop in the capital."
 zin_shared_lands_of_the_sun_sunfolk_trade:0 "Traders Among the Tall"
 zin_shared_lands_of_the_sun_sunfolk_trade_desc:0 "The quick traders of [ROOT.GetName] move small goods fast through the great Sunhot markets and are known and trusted in all of them."
 zin_shared_lands_of_the_sun_the_council_endures:0 "The Council Endures"
 zin_shared_lands_of_the_sun_the_council_endures_desc:0 "Generations of Sunhot elves have sat in that court without once drawing a blade in it. [ROOT.GetName] adds its name to the long roll of those who kept it so."
 zin_shared_lands_of_the_sun_the_free_steadings:0 "The Free Steadings"
 zin_shared_lands_of_the_sun_the_free_steadings_desc:0 "A steading with its own roof, its own well and its own word is hard to bargain with and harder to hurry. [ROOT.GetName] lets every family build as it sees fit, and the whole realm rises a little faster for it."
 zin_shared_lands_of_the_sun_the_old_strength:0 "The Old Strength"
 zin_shared_lands_of_the_sun_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_shared_lands_of_the_sun_the_quiet_woods:0 "The Quiet Woods"
 zin_shared_lands_of_the_sun_the_quiet_woods_desc:0 "The woods of [ROOT.GetName] are older than its roads and keep their own hours. Its people go among the trees without a sound, and the realm asks little of the world beyond them."
 zin_shared_lands_of_the_sun_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_shared_lands_of_the_sun_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_shared_lands_of_the_sun_the_sanctuary_endures:0 "The Sanctuary Endures"
 zin_shared_lands_of_the_sun_the_sanctuary_endures_desc:0 "The old order of the sanctuary has held [ROOT.GetName] steady since before its oldest roll. Its customs are read out again in public, and the tall elders agree, as they always have, that nothing ought to change."
 zin_shared_lands_of_the_sun_the_sanctuary_endures_tip_1:0 "Popular feeling in [ROOT.GetName] drifts toward the sanctuary."
 zin_shared_lands_of_the_sun_the_sanctuarys_way:0 "The Way of [ROOT.GetName]"
 zin_shared_lands_of_the_sun_the_sanctuarys_way_desc:0 "Every realm under the sun keeps itself in its own way, and none will tell another that it is wrong. [ROOT.GetName] sets down in plain words how it means to be kept."
 zin_shared_lands_of_the_sun_the_sun_markets:0 "The Sun Markets"
 zin_shared_lands_of_the_sun_the_sun_markets_desc:0 "On market days the terraces empty into one long square under awnings of white cloth. Traders from the coast and the hills come for wine, honey and cut stone, and carry [ROOT.GetAdjective] goodwill home with them."
 zin_shared_lands_of_the_sun_the_woods_keep_apart:0 "The Woods Keep Apart"
 zin_shared_lands_of_the_sun_the_woods_keep_apart_desc:0 "The woods have never asked for allies and rarely for guests. Paths bend away from strangers, and the rangers walk them out again without unkindness."
 zin_shared_lands_of_the_sun_traders_among_the_tall:0 "Traders Among the Tall"
 zin_shared_lands_of_the_sun_traders_among_the_tall_desc:0 "A man's caravan crosses a Sunhot courtyard in a quarter of the time a Sunhot elf takes to cross it, and the traders of [ROOT.GetName] have made a living of that difference. They deal in small goods, fast, and are paid in good coin."
 zin_shared_lands_of_the_sun_under_the_sun:0 "[ROOT.GetName] Under the Sun"
 zin_shared_lands_of_the_sun_under_the_sun_desc:0 "The sun stands over [ROOT.GetName] and has stood there longer than any roll remembers. Fields ripen, doors stay open, and the strong keep the peace by being strong. The realm sets its first year in order before the age asks anything of it."
 zin_shared_lands_of_the_sun_walls_of_white_stone:0 "Walls of White Stone"
 zin_shared_lands_of_the_sun_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_shared_lands_of_the_sun_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_shared_lands_of_the_sun_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_shared_lands_of_the_sun_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_shared_lands_of_the_sun_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_shared_lands_of_the_sun_white_sails:0 "White Sails"
 zin_shared_lands_of_the_sun_white_sails_desc:0 "The ships of this coast carry sails of undyed cloth, so that a fleet in the distance looks like a flock of gulls. [ROOT.GetName] builds and rigs them in its own yards and teaches its captains every wind of the Sea of Gods."
 zin_shared_lands_of_the_sun_woods_apart:0 "The Woods Keep Apart"
 zin_shared_lands_of_the_sun_woods_apart_desc:0 "Strangers are walked to the edge of the trees with courtesy. Few come again, and nobody takes a quarrel into the woods."
 zin_shared_lands_of_the_sun.1.a:0 "Open our harbours to them"
 zin_shared_lands_of_the_sun.1.b:0 "Let them pass by"
 zin_shared_lands_of_the_sun.1.d:0 "White sails carry pilgrims along the coast for the summer feasts. The harbour keeper of [ROOT.GetName] asks whether they are to be given moorings and a feast-day, or left to sail on."
 zin_shared_lands_of_the_sun.1.t:0 "Pilgrims on the Sea of Gods"
