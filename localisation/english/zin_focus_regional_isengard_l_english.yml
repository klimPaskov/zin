l_english:
 zin_regional_isengard_a_daughter_of_the_hall:0 "A Daughter of the Hall"
 zin_regional_isengard_a_daughter_of_the_hall_desc:0 "A marriage may cost less than a war. The warlord offers one of his daughters to the house of Fandanar, and Fandanar must weigh whether to take iron into its blood."
 zin_regional_isengard_a_seat_at_fandanar:0 "A Seat at Fandanar"
 zin_regional_isengard_a_seat_at_fandanar_desc:0 "Not every voice in the hall is for refusal. Some chiefs would trade a little pride for a seat at the Accord's table and a border that costs them fewer winters of watching."
 zin_regional_isengard_beyond_the_march:0 "Beyond the March"
 zin_regional_isengard_beyond_the_march_desc:0 "News comes up the passes of a war far to the south, in lands the warlord has never seen. The hall must decide whether the world beyond the march is its business."
 zin_regional_isengard_counsel_of_the_forges:0 "Counsel of the Forges"
 zin_regional_isengard_counsel_of_the_forges_desc:0 "The smiths of the iron hills sit nearest the warlord's bench, for they make the blades that give the hall its voice. Their counsel is short: more iron, more forts, less talk of kings."
 zin_regional_isengard_count_the_stones:0 "Count the Stones"
 zin_regional_isengard_count_the_stones_desc:0 "Masons walk the walls with knotted cords and chalk what each tower needs on its doorframe. What the forts lack is quarried before the thaw."
 zin_regional_isengard_deep_shafts:0 "Deep Shafts"
 zin_regional_isengard_deep_shafts_desc:0 "Where the old drifts ran dry, new shafts go down past the water line on timber props. The miners sing as they climb, to keep count of the ones below."
 zin_regional_isengard_envoys_from_fandanar:0 "The Envoys from Fandanar"
 zin_regional_isengard_envoys_from_fandanar_desc:0 "Fandanar sends cloaked envoys with soft words and sealed scrolls. They speak of the Accord, of safety in numbers, of a seat at a table of equals."
 zin_regional_isengard_forge_halls:0 "Forge-Halls"
 zin_regional_isengard_forge_halls_desc:0 "Long halls with a dozen hearths apiece are raised beside the pits, so that ore need never travel far to meet a hammer. The ring of the anvils carries to the border."
 zin_regional_isengard_forts_hold:0 "The Forts Hold"
 zin_regional_isengard_forts_hold_desc:0 "The horns have sounded and the walls are manned. Every stone of the march has been counted, and every stone answers."
 zin_regional_isengard_granaries_of_the_hall:0 "Granaries of the Hall"
 zin_regional_isengard_granaries_of_the_hall_desc:0 "Stone granaries rise beside the forts, filled each autumn from the hall's own fields. When the hard winters come, no steading that kept faith with Isengard goes hungry."
 zin_regional_isengard_heavy_hosts:0 "Heavy Hosts"
 zin_regional_isengard_heavy_hosts_desc:0 "The drums beat the slow pace of the march, and the whole host steps to it. An Isengard host does not hurry, and it does not stop."
 zin_regional_isengard_heavy_hosts_drilled:0 "The Heavy Hosts"
 zin_regional_isengard_heavy_hosts_drilled_desc:0 "Shield-walls drilled until the rows move as one wall of iron and linden. Isengard's hosts are slow to start and slower to break."
 zin_regional_isengard_heirs_of_isenmar:0 "Heirs of Isenmar"
 zin_regional_isengard_heirs_of_isenmar_desc:0 "The warlord's sons and nephews are sent to the border forts at twelve winters. They come back hard, loyal, and deaf to the word crown."
 zin_regional_isengard_hold_the_north:0 "Hold the North"
 zin_regional_isengard_hold_the_north_desc:0 "The south may burn; the north will be held. The warlord calls every fort to full strength and tells his chiefs that a hall which keeps its own is no small thing in a dark year."
 zin_regional_isengard_hosts_at_the_winter_moot:0 "Hosts at the Winter Moot"
 zin_regional_isengard_hosts_at_the_winter_moot_desc:0 "At the Winter Moot the warlord's table is longer than Fandanar's and the ale is better. Chiefs who have eaten at it do not forget whose roof was warm."
 zin_regional_isengard_iron_against_the_crown:0 "Iron Against the Crown"
 zin_regional_isengard_iron_against_the_crown_desc:0 "When the forts have been proved and the wider world stands near the edge of a larger war, the hall may stop answering and begin asking. Isengard's chiefs name the lands on the march that they mean to take back."
 zin_regional_isengard_iron_crown:0 "The Iron Crown of Isengard"
 zin_regional_isengard_iron_crown_desc:0 "No one wears it, and every fort swears by it. The hall has learned to rule without a crown by making each fort answerable to the bench."
 zin_regional_isengard_iron_for_the_forts:0 "Iron for the Forts"
 zin_regional_isengard_iron_for_the_forts_desc:0 "Every fort has its own forge now, and every forge its quota of blades and spear-heads. When the horns sound, the garrisons will not wait on a cart from the hall."
 zin_regional_isengard_iron_for_the_living:0 "Iron for the Living"
 zin_regional_isengard_iron_for_the_living_desc:0 "A few of the warband chiefs say that Isengard's iron was never meant to rust behind a wall. If the living of the south are to stand against the dark, they will need blades, and Isengard has blades."
 zin_regional_isengard_iron_hills:0 "The Iron Hills"
 zin_regional_isengard_iron_hills_desc:0 "Isengard sits on iron, and iron is its argument in every council. The warlord sends new gangs into the hills with orders to dig for the hall."
 zin_regional_isengard_kin_across_the_march:0 "Kin Across the March"
 zin_regional_isengard_kin_across_the_march_desc:0 "Families split by the old border visit one another again, and trade crosses it without a toll. The cold between the two halls thaws a little, though it does not vanish."
 zin_regional_isengard_law_of_the_hall:0 "Law of the Hall"
 zin_regional_isengard_law_of_the_hall_desc:0 "The old customs are cut into the hall's pillars and read aloud at midwinter, so that no chief may say he did not know them. Fewer quarrels now end with a drawn blade."
 zin_regional_isengard_levy_of_the_valleys:0 "Levy of the Valleys"
 zin_regional_isengard_levy_of_the_valleys_desc:0 "Each valley sends one man in five when the hall calls, with his bread and his blade. The roll is read in the fort yards, and none is struck from it but the dead."
 zin_regional_isengard_man_the_march:0 "Man the March"
 zin_regional_isengard_man_the_march_desc:0 "Coldor's border runs along old ridges and drovers' tracks, and the forts that watch it have been manned every winter since 850. The warlord orders them filled before the snow and stocked for a siege longer than anyone expects."
 zin_regional_isengard_march_watch:0 "Watch on the March"
 zin_regional_isengard_march_watch_desc:0 "A beacon on every tower and a rider in every pass. Not a patrol crosses the ridge unseen."
 zin_regional_isengard_marriage:0 "The Hall and the Crown Wed"
 zin_regional_isengard_meet_them_at_the_forts:0 "Meet Them at the Forts"
 zin_regional_isengard_meet_them_at_the_forts_desc:0 "The horns blow along the whole ridge and every fort answers. Isengard fights where it is strongest: behind stone, with the hall's iron at its back."
 zin_regional_isengard_never_kneel:0 "Never Kneel"
 zin_regional_isengard_never_kneel_desc:0 "The warlord receives the envoys standing and answers them standing. Isengard bends to iron, he says, and to nothing that was not forged in its own hills."
 zin_regional_isengard_never_kneel_oath:0 "Never Kneel"
 zin_regional_isengard_never_kneel_oath_desc:0 "The warlord has sworn on the black bench that Isengard bends to no crown. The oath steadies the hall and costs it friends."
 zin_regional_isengard_oath_brothers:0 "Oath-Brothers of the March"
 zin_regional_isengard_oath_brothers_desc:0 "The warlord's envoys offer the border clans what no crown gives: a spear at their gate, sworn on iron before witnesses. Clans that are weary of paying Fandanar's price listen closely."
 zin_regional_isengard_one_hall_many_forts:0 "One Hall, Many Forts"
 zin_regional_isengard_one_hall_many_forts_desc:0 "Every fort on the march now swears to the hall by name, and the hall answers for every fort. A warlord's bench has grown into something near a crown, though nobody in Isengard will say so aloud."
 zin_regional_isengard_refusal_of_850:0 "The Refusal of 850"
 zin_regional_isengard_refusal_of_850_desc:0 "When the kings of Coldor united the frozen interior, the hall of Isengard said no, and has said it at every midwinter since. The refusal is a pride, a burden and a wall."
 zin_regional_isengard_ride_to_the_forts:0 "Ride to the Forts"
 zin_regional_isengard_ride_to_the_forts_desc:0 "Riders carry the warlord's word to every fort: the border will not wait on Coldor's pleasure. If a quarrel must be fought, Isengard will choose the ground."
 zin_regional_isengard_salt_and_iron_for_the_clans:0 "Salt and Iron for the Clans"
 zin_regional_isengard_salt_and_iron_for_the_clans_desc:0 "Salt cures the winter meat and iron tips the winter spear. Isengard has plenty of the second and trades for the first, and the clans learn which hall sells fair."
 zin_regional_isengard_shield_wall_drill:0 "Shield-Wall Drill"
 zin_regional_isengard_shield_wall_drill_desc:0 "Linden shields rimmed with iron lock edge to edge, and the ranks learn to take a charge on the boss and answer with the spear. The drill-masters count the steps aloud until the men no longer need counting."
 zin_regional_isengard_sledge_ways:0 "Sledge-Ways"
 zin_regional_isengard_sledge_ways_desc:0 "Plank roads, iced each night, carry the hall's iron from the hills to the forts on broad sledges. What took a month by pack-beast now takes a week."
 zin_regional_isengard_stone_upon_stone:0 "Stone upon Stone"
 zin_regional_isengard_stone_upon_stone_desc:0 "More masons are sent to the forts, and the hall itself is walled. An Isengard that has been wounded once means not to be wounded twice."
 zin_regional_isengard_the_free_north:0 "The Free North"
 zin_regional_isengard_the_free_north_desc:0 "Isengard's envoys carry a different word to the northern clans: that the Winter Crown is no crown of theirs, and that the north has room for more than one hall."
 zin_regional_isengard_the_gift_giver:0 "The Gift-Giver"
 zin_regional_isengard_the_gift_giver_desc:0 "Veska has carried the warlord's gifts for twenty winters and knows every chief by his mother's name. She turns a sack of barley into a debt of honour without once naming it."
 zin_regional_isengard_the_hall_unbowed:0 "The Hall Unbowed"
 zin_regional_isengard_the_hall_unbowed_desc:0 "Whatever comes, the hall stands, and its door still bears the word its founders cut in it. The chiefs renew their oaths on the black bench, and the oaths are heavier than before."
 zin_regional_isengard_the_iron_companies_march:0 "The Iron Companies March South"
 zin_regional_isengard_the_iron_companies_march_desc:0 "The iron companies leave the forts in the first snow and take the long road south. Behind them the beacons burn on, tended by the old and the very young."
 zin_regional_isengard_the_iron_hall:0 "The Iron Hall"
 zin_regional_isengard_the_iron_hall_desc:0 "Ezhan Isenmar sits where the warlords of Isengard have always sat, on a bench of black iron older than the border forts. Every chief who brings a gift to the hall leaves with a seat and a debt."
 zin_regional_isengard_the_iron_halls_bread:0 "The Iron Hall's Bread"
 zin_regional_isengard_the_iron_halls_bread_desc:0 "Loaves from the hall's ovens are carried to the farthest steadings, and where they go, men speak of the warlord kindly. It is a small gift, and it wins more than a fort."
 zin_regional_isengard_the_iron_host:0 "The Iron Host"
 zin_regional_isengard_the_iron_host_desc:0 "The hall's spearmen drill in the fort yards from thaw to first frost, under chiefs who have fought the same ridges for a lifetime. They know the march better than they know their own hearths."
 zin_regional_isengard_the_march_remembers:0 "The March Remembers"
 zin_regional_isengard_the_march_remembers_desc:0 "When the horns fall silent, the dead of the border are named at the hall's door, fort by fort. Whatever the forts cost, the hall still stands."
 zin_regional_isengard_the_march_remembers_tip_1:0 "Whatever the forts cost, the hall still stands."
 zin_regional_isengard_the_ninth_fort:0 "The Ninth Fort"
 zin_regional_isengard_the_ninth_fort_desc:0 "At the narrowest of the passes stands the Ninth Fort, where Brana has held the gate for eleven winters. She asks the hall for walls and gets them; she asks for nothing else."
 zin_regional_isengard_the_north_held:0 "The North Held"
 zin_regional_isengard_the_north_held_desc:0 "When the south burned, the hall kept its forts and its fields, and the north did not break. Winter itself was on Isengard's side."
 zin_regional_isengard_the_old_refusal:0 "The Old Refusal"
 zin_regional_isengard_the_old_refusal_desc:0 "The kings of Coldor offered Isengard a crown to share and a seat to kneel in, and the hall said no. The word is carved above its door, and every new chief touches it before he speaks."
 zin_regional_isengard_the_old_refusal_tip_1:0 "In 850 the hall said no. It still says no."
 zin_regional_isengard_under_the_accords_banner:0 "Under the Accord's Banner"
 zin_regional_isengard_under_the_accords_banner_desc:0 "Isengard has sworn to the Accord, and the warlord stands beneath a banner he once spat upon. His chiefs grumble, but they are the better fed for it."
 zin_regional_isengard_valley_spears:0 "Valley Spears"
 zin_regional_isengard_valley_spears_desc:0 "Long ash spears with leaf-blades come from the valley smithies in their thousands. A man with a spear and a shield behind him is worth three without."
 zin_regional_isengard_warband_chiefs:0 "The Warband Chiefs"
 zin_regional_isengard_warband_chiefs_desc:0 "The chiefs of the warbands boast of the refusal at every feast, and the warlord lets them. A boast heard in the hall is a boast that will be paid for in the field."
 zin_regional_isengard_warlords_hall:0 "The Warlord's Hall"
 zin_regional_isengard_warlords_hall_desc:0 "A black iron bench, a long table and a dozen chiefs who will each speak first. The warlord rules by being the loudest voice that nobody dares to answer."
 zin_regional_isengard_watchtowers_of_the_march:0 "Watchtowers of the March"
 zin_regional_isengard_watchtowers_of_the_march_desc:0 "A beacon is laid on every tower, each within sight of the next. No patrol of Coldor crosses the ridge without a hundred eyes noting its banners."
 zin_regional_isengard_winter_gifts:0 "Winter Gifts"
 zin_regional_isengard_winter_gifts_desc:0 "The long winters hurt the steadings along the march worst of all. The warlord sends sledges of salt and barley before the passes close, and asks only that the gift be remembered."
 zin_regional_isengard.1.a:0 "Decline politely"
 zin_regional_isengard.1.b:0 "Accept the match"
 zin_regional_isengard.1.d:0 "Envoys of Isengard stand in the great hall of Fandanar with a gift of black iron and a request in the warlord's own words. He offers one of his daughters to the Winter Crown's house, so that two halls that have glared across a border for three centuries might share a hearth."
 zin_regional_isengard.1.t:0 "A Daughter of the Iron Hall"
 zin_regional_isengard.2.a:0 "We are not alone"
 zin_regional_isengard.2.d:0 "A rider in black mail reaches the steading at dusk with the warlord's word: no crown will take this hearth while Isengard holds iron. He swears it on the steading's own fire, before witnesses, and leaves before the meal is poured."
 zin_regional_isengard.2.t:0 "The Iron Hall Stands Behind Us"
