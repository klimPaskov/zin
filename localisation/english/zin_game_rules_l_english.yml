l_english:
 ZIN_RULE_AFRIT:0 "The Deliverer's Path"
 ZIN_RULE_AFRIT_ASHEN:0 "Ambitious"
 ZIN_RULE_AFRIT_ASHEN_DESC:0 "The Worshipdom reaches as far as it can."
 ZIN_RULE_AFRIT_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_AFRIT_DEFAULT_DESC:0 "The court chooses as the Course of the Age rule leads."
 ZIN_RULE_AFRIT_DESC:0 "How the court of the Worshipdom acts when no player leads it."
 ZIN_RULE_AFRIT_DORMANT:0 "Patient"
 ZIN_RULE_AFRIT_DORMANT_DESC:0 "The Worshipdom never reaches beyond its own temples."
 ZIN_RULE_AFRIT_FREE:0 "As Its Court Wills"
 ZIN_RULE_AFRIT_FREE_DESC:0 "The Worshipdom weighs every choice by its own interest."
 ZIN_RULE_AFRIT_HISTORICAL:0 "As the Chronicle Tells"
 ZIN_RULE_AFRIT_HISTORICAL_DESC:0 "The Worshipdom keeps its remembered course."
 ZIN_RULE_AI_AENOR_SUCCESSION:0 "The Middle Kingdom's Succession"
 ZIN_RULE_AI_AENOR_SUCCESSION_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_AI_AENOR_SUCCESSION_DEFAULT_DESC:0 "The court chooses as the Course of the Age rule leads."
 ZIN_RULE_AI_AENOR_SUCCESSION_DESC:0 "Which camp the Middle Kingdom follows after the Golden King, when no player leads it."
 ZIN_RULE_AI_AENOR_SUCCESSION_FREE_DOMINIONS:0 "The Free Dominions"
 ZIN_RULE_AI_AENOR_SUCCESSION_FREE_DOMINIONS_DESC:0 "The chartered dominions take the crown's place."
 ZIN_RULE_AI_AENOR_SUCCESSION_GOLDEN_COURT:0 "The Golden Court"
 ZIN_RULE_AI_AENOR_SUCCESSION_GOLDEN_COURT_DESC:0 "The court of offices keeps the throne."
 ZIN_RULE_AI_AENOR_SUCCESSION_RANDOM:0 "Chance"
 ZIN_RULE_AI_AENOR_SUCCESSION_RANDOM_DESC:0 "The camp is drawn once, when the campaign begins."
 ZIN_RULE_AI_EAST:0 "The Eastern Kings"
 ZIN_RULE_AI_EAST_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_AI_EAST_DEFAULT_DESC:0 "Each court chooses as the Course of the Age rule leads."
 ZIN_RULE_AI_EAST_DESC:0 "How the courts of the east answer a claimant to the crown of the east, when no player leads them."
 ZIN_RULE_AI_EAST_RANDOM:0 "Chance"
 ZIN_RULE_AI_EAST_RANDOM_DESC:0 "The east's course is drawn once, when the campaign begins."
 ZIN_RULE_AI_EAST_REFUSE_AFRIT:0 "Refuse the Deliverer"
 ZIN_RULE_AI_EAST_REFUSE_AFRIT_DESC:0 "No eastern court kneels, and the courts stand together."
 ZIN_RULE_AI_EAST_UNITE_WITHOUT_AFRIT:0 "Unite without the Deliverer"
 ZIN_RULE_AI_EAST_UNITE_WITHOUT_AFRIT_DESC:0 "The strongest eastern power unites the east under its own crown."
 ZIN_RULE_AI_ELVES:0 "The Elven Refusal"
 ZIN_RULE_AI_ELVES_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_AI_ELVES_DEFAULT_DESC:0 "The elves stay apart and send only wanderers, as the Course of the Age rule leads."
 ZIN_RULE_AI_ELVES_DESC:0 "Whether the elves keep their old refusal to march in the wars of men, when no player leads them."
 ZIN_RULE_AI_ELVES_MARCH:0 "The Kindred March"
 ZIN_RULE_AI_ELVES_MARCH_DESC:0 "When the dark grows great and an elven realm is at war with it, the elves set the refusal aside and march."
 ZIN_RULE_AI_ELVES_RANDOM:0 "Chance"
 ZIN_RULE_AI_ELVES_RANDOM_DESC:0 "Each elven realm decides once, when the campaign begins."
 ZIN_RULE_AI_GOLDOROTH:0 "The Black Iron Crown"
 ZIN_RULE_AI_GOLDOROTH_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_AI_GOLDOROTH_DEFAULT_DESC:0 "Goldoroth chooses as the Course of the Age rule leads."
 ZIN_RULE_AI_GOLDOROTH_DESC:0 "Whether the orc kingdom of Goldoroth stays its own master or swears to the south, when no player leads it."
 ZIN_RULE_AI_GOLDOROTH_INDEPENDENT:0 "Bows to No One"
 ZIN_RULE_AI_GOLDOROTH_INDEPENDENT_DESC:0 "Goldoroth keeps its own crown."
 ZIN_RULE_AI_GOLDOROTH_RANDOM:0 "Chance"
 ZIN_RULE_AI_GOLDOROTH_RANDOM_DESC:0 "Goldoroth's course is drawn once, when the campaign begins."
 ZIN_RULE_AI_GOLDOROTH_SWORN_TO_VOLGAN:0 "Sworn to the South"
 ZIN_RULE_AI_GOLDOROTH_SWORN_TO_VOLGAN_DESC:0 "Goldoroth takes the southern bargain and swears to Volgan."
 ZIN_RULE_COLD_ISENGARD:0 "Isengard and the Accord"
 ZIN_RULE_COLD_ISENGARD_CONQUEST:0 "Conquest"
 ZIN_RULE_COLD_ISENGARD_CONQUEST_DESC:0 "Coldor brings Isengard to heel by war."
 ZIN_RULE_COLD_ISENGARD_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_COLD_ISENGARD_DEFAULT_DESC:0 "Coldor chooses as the Course of the Age rule leads."
 ZIN_RULE_COLD_ISENGARD_DESC:0 "How Coldor answers Isengard's defiance of the Northern Accord, when no player leads it."
 ZIN_RULE_COLD_ISENGARD_FREE:0 "As Coldor Wills"
 ZIN_RULE_COLD_ISENGARD_FREE_DESC:0 "Coldor weighs its course by Isengard's defiance."
 ZIN_RULE_COLD_ISENGARD_HISTORICAL:0 "The Iron Hand"
 ZIN_RULE_COLD_ISENGARD_HISTORICAL_DESC:0 "Coldor raises the March Forts against Isengard, and no full war follows."
 ZIN_RULE_COLD_ISENGARD_OPEN_HAND:0 "The Open Hand"
 ZIN_RULE_COLD_ISENGARD_OPEN_HAND_DESC:0 "Coldor courts Isengard back into the Accord."
 ZIN_RULE_DARK_POWERS:0 "The Powers of the Dark"
 ZIN_RULE_DARK_POWERS_AGGRESSIVE:0 "Bold"
 ZIN_RULE_DARK_POWERS_AGGRESSIVE_DESC:0 "They move a year early, with stronger hosts."
 ZIN_RULE_DARK_POWERS_DESC:0 "How boldly the dead of the south and the Mistake of the north move when no player leads them."
 ZIN_RULE_DARK_POWERS_HISTORICAL:0 "As the Chronicle Tells"
 ZIN_RULE_DARK_POWERS_HISTORICAL_DESC:0 "They keep their remembered seasons."
 ZIN_RULE_DARK_POWERS_RESTRAINED:0 "Restrained"
 ZIN_RULE_DARK_POWERS_RESTRAINED_DESC:0 "They never strike first, and fight only when attacked."
 ZIN_RULE_DEBUG_CHECKS:0 "Start Checks"
 ZIN_RULE_DEBUG_CHECKS_DESC:0 "Checks the opening world when a campaign begins and writes what it finds to the game log. For testing."
 ZIN_RULE_DEBUG_CHECKS_OFF:0 "Off"
 ZIN_RULE_DEBUG_CHECKS_OFF_DESC:0 "No start checks run."
 ZIN_RULE_DEBUG_CHECKS_ON:0 "On"
 ZIN_RULE_DEBUG_CHECKS_ON_DESC:0 "The start checks run and write to the game log."
 ZIN_RULE_EINDIL_WAKING:0 "The Man from the Ice"
 ZIN_RULE_EINDIL_WAKING_DESC:0 "When the man asleep in the northern ice wakes. He never wakes at the start of a campaign."
 ZIN_RULE_EINDIL_WAKING_EARLY:0 "Wakes Early"
 ZIN_RULE_EINDIL_WAKING_EARLY_DESC:0 "He wakes in Rasthel of 4A 1748."
 ZIN_RULE_EINDIL_WAKING_HISTORICAL:0 "Wakes as the Chronicle Says"
 ZIN_RULE_EINDIL_WAKING_HISTORICAL_DESC:0 "He wakes in Sulethe of 4A 1749."
 ZIN_RULE_EINDIL_WAKING_LATE:0 "Wakes Late"
 ZIN_RULE_EINDIL_WAKING_LATE_DESC:0 "He wakes only in Sulethe of 4A 1751."
 ZIN_RULE_GATHERING_DARK:0 "The Gathering Dark"
 ZIN_RULE_GATHERING_DARK_DESC:0 "How quickly the dread of the age deepens as its dangers grow. Its falls are never slowed."
 ZIN_RULE_GATHERING_DARK_FAST:0 "A Swift Dread"
 ZIN_RULE_GATHERING_DARK_FAST_DESC:0 "Every new danger deepens the dark by half as much again."
 ZIN_RULE_GATHERING_DARK_NORMAL:0 "As the Age Unfolds"
 ZIN_RULE_GATHERING_DARK_NORMAL_DESC:0 "The dark gathers at its remembered pace."
 ZIN_RULE_GATHERING_DARK_SLOW:0 "A Slow Dread"
 ZIN_RULE_GATHERING_DARK_SLOW_DESC:0 "Every new danger deepens the dark by half as much."
 ZIN_RULE_GOLDEN_KING_DEATH:0 "The Golden King's Years"
 ZIN_RULE_GOLDEN_KING_DEATH_DELAYED:0 "A Long Reign"
 ZIN_RULE_GOLDEN_KING_DEATH_DELAYED_DESC:0 "His reign lasts some years longer."
 ZIN_RULE_GOLDEN_KING_DEATH_DESC:0 "How long the Golden King reigns over the Middle Kingdom."
 ZIN_RULE_GOLDEN_KING_DEATH_DYNAMIC:0 "As Events Decide"
 ZIN_RULE_GOLDEN_KING_DEATH_DYNAMIC_DESC:0 "His years rise and fall with the health of his court."
 ZIN_RULE_GOLDEN_KING_DEATH_HISTORICAL:0 "As the Chronicle Tells"
 ZIN_RULE_GOLDEN_KING_DEATH_HISTORICAL_DESC:0 "His reign ends in its remembered season, whatever the court does."
 ZIN_RULE_GOLDEN_KING_DEATH_NO_AI_PLOT:0 "Players Only"
 ZIN_RULE_GOLDEN_KING_DEATH_NO_AI_PLOT_DESC:0 "Among the realms no player leads, none acts to end his reign early."
 ZIN_RULE_HISTORICAL_PATH:0 "The Course of the Age"
 ZIN_RULE_HISTORICAL_PATH_DESC:0 "How closely the realms that no player leads keep to the road the chronicle remembers. A player's realm always chooses for itself."
 ZIN_RULE_HISTORICAL_PATH_FREE:0 "As Each Court Wills"
 ZIN_RULE_HISTORICAL_PATH_FREE_DESC:0 "Every realm weighs its own interests and chooses for itself."
 ZIN_RULE_HISTORICAL_PATH_HISTORICAL:0 "As the Chronicle Tells"
 ZIN_RULE_HISTORICAL_PATH_HISTORICAL_DESC:0 "Each realm makes the choice the chronicle remembers, in its season."
 ZIN_RULE_HISTORICAL_PATH_PLAUSIBLE:0 "As It Might Have Been"
 ZIN_RULE_HISTORICAL_PATH_PLAUSIBLE_DESC:0 "The realms lean toward the remembered choices, but a court may still take another road."
 ZIN_RULE_START_VARIETY:0 "The Shape of the Age"
 ZIN_RULE_START_VARIETY_DEFAULT:0 "Follow the Course of the Age"
 ZIN_RULE_START_VARIETY_DEFAULT_DESC:0 "Off under As the Chronicle Tells, light under As It Might Have Been, full under As Each Court Wills."
 ZIN_RULE_START_VARIETY_DESC:0 "How far the realms may differ from the chronicle when the campaign begins."
 ZIN_RULE_START_VARIETY_FULL:0 "Another Spring"
 ZIN_RULE_START_VARIETY_FULL_DESC:0 "Disputed lands, small feuds and loose bonds between crowns may also differ."
 ZIN_RULE_START_VARIETY_LIGHT:0 "Small Differences"
 ZIN_RULE_START_VARIETY_LIGHT_DESC:0 "Rulers' tempers, the readiness of old plots and the strength of hosts differ a little."
 ZIN_RULE_START_VARIETY_OFF:0 "As the Chronicle Tells"
 ZIN_RULE_START_VARIETY_OFF_DESC:0 "Every realm begins exactly as the chronicle remembers it."
 ZIN_RULE_STORY_PACE:0 "The Pace of the Age"
 ZIN_RULE_STORY_PACE_DESC:0 "How quickly the great events of the age arrive. Every remembered date moves with this rule."
 ZIN_RULE_STORY_PACE_FAST:0 "Swift"
 ZIN_RULE_STORY_PACE_FAST_DESC:0 "The great events come sooner: every remembered date lies a quarter nearer the start."
 ZIN_RULE_STORY_PACE_SLOW:0 "Slow"
 ZIN_RULE_STORY_PACE_SLOW_DESC:0 "The great events come later: every remembered date lies half as far again from the start."
 ZIN_RULE_STORY_PACE_STANDARD:0 "Steady"
 ZIN_RULE_STORY_PACE_STANDARD_DESC:0 "The great events come in their remembered seasons."
