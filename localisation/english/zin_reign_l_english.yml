l_english:
 zin_loc_camp_faithful_public:0 "The Deliverer's Faithful"
 zin_loc_camp_faithful_revealed:0 "Afrit's Supporters"
 zin_loc_camp_host_public:0 "The Stranger's Host"
 zin_loc_camp_host_revealed:0 "Eindil's Host"
 zin_reign_anniversary:0 "The Nineteenth Year"
 zin_reign_anniversary_desc:0 "Parim keeps the King's anniversary with gilt and bells, and for a season every merchant in the lake cities has a reason to be glad of it."
 zin_reign_gifts_to_god_king:0 "Gifts to the God-King"
 zin_reign_honour_withheld:0 "Honour Withheld"
 zin_reign_mourned_king:0 "Mourned Our King"
 zin_reign_mourning_snub:0 "Silent at the Bier"
 zin_reign_selen_slight:0 "Slighted at Selen"
 zin_reign.10.d:0 "Nineteen years ago the Golden King took the crown, and Parim means to say so. The Hall of Kings is hung with new gilt, the heralds are rehearsing, and the court asks how the anniversary should be kept."
 zin_reign.10.opt1:0 "A day of gold for Parim."
 zin_reign.10.opt2:0 "A day of prayer at the temples."
 zin_reign.10.t:0 "The King's Nineteenth Year"
 zin_reign.11.d:0 "The King will tour his dominions in a procession of gilded carriages, and his treasurers ask which road the progress takes. Every lord along it will be asked to feed a thousand courtiers."
 zin_reign.11.opt1:0 "Through the rich lake cities."
 zin_reign.11.opt2:0 "To Selen first, as the Restorer did."
 zin_reign.11.opt3:0 "Send his portrait instead."
 zin_reign.11.t:0 "The Gilded Progress"
 zin_reign.12.d:0 "The King's gilded carriages are on the road to Selen, and the rangers' hall has not been swept for company in a generation. The First Warden must decide what welcome the progress deserves."
 zin_reign.12.opt1:0 "Honour the King, as the Charters ask."
 zin_reign.12.opt2:0 "Honour the Restorer's memory, not this king."
 zin_reign.12.t:0 "The Progress Comes to Selen"
 zin_reign.13.d:0 "The court painter has finished the King's face and asks one thing only: how much gold leaf the portrait may carry. The King, he is careful to add, has opinions."
 zin_reign.13.opt1:0 "All of it."
 zin_reign.13.opt2:0 "Paint him as he is."
 zin_reign.13.t:0 "A Portrait for the Hall of Kings"
 zin_reign.14.d:0 "The league against the powers of the dark musters on the Field of Banners. Its frontier captains ask for pay, and the court asks for a parade. The league's strength stands at [?ROOT.zin_aenor_lost_cause|0] of a hundred."
 zin_reign.14.opt1:0 "A parade for the King's league."
 zin_reign.14.opt2:0 "Pay the frontier companies."
 zin_reign.14.t:0 "Muster Day of the Lost Cause"
 zin_reign.15.d:0 "Lord-Commander Tarec Belurith thanks the crown. His companies on the frontier had not been paid in a year, and some had begun to sell their own arrows."
 zin_reign.15.opt1:0 "See that it does not happen again."
 zin_reign.15.t:0 "Lord-Commander Tarec's Thanks"
 zin_reign.16.d:0 "Chancellor Merovan presents the year's accounts to the council. They balance, as they always do, in a hand so even that no auditor has ever found a blot."
 zin_reign.16.opt1:0 "Thank the Chancellor."
 zin_reign.16.opt2:0 "Ask for the ledgers of the temple houses."
 zin_reign.16.opt2_tip1:0 "While the King lives, the inquiry into the temple ledgers is likelier to find what it seeks."
 zin_reign.16.t:0 "The Chancellor's Accounts"
 zin_reign.17.d:0 "Envoys of the dominions bring a petition about the King's new taxes. The lake cities pay in gold, the marches in grain, and the marches have begun to count what they pay."
 zin_reign.17.opt1:0 "The crown's needs come first."
 zin_reign.17.opt2:0 "Remit a year's tax."
 zin_reign.17.t:0 "The Dominions Count Their Taxes"
 zin_reign.19.d:0 "The Mistfall feast runs past midnight. The King laughs louder than anyone and leaves the hall last, and the candles of the Golden Court burn until dawn."
 zin_reign.19.d_dominion:0 "In Parim the Mistfall feast runs past midnight, and the couriers who carry its toasts to the dominions will ride all night. The King, they say, laughed louder than anyone."
 zin_reign.19.opt1:0 "Another feast, another year."
 zin_reign.19.opt2:0 "The King feasts; we pay."
 zin_reign.19.t:0 "The Mistfall Feast"
 zin_reign.20.d:0 "Every bell in Parim tolls for a day. Chancellor Merovan seals the palace and sends riders to every dominion, and the four voices of the realm have already begun to count one another."
 zin_reign.20.opt1:0 "Let the court mourn."
 zin_reign.20.opt1_tip1:0 "Starting support: the Golden Court [?ROOT.zin_aenor_camp_court|0], the Free Dominions [?ROOT.zin_aenor_camp_dominions|0], [zin_loc_camp_faithful] [?ROOT.zin_aenor_camp_faithful|0], [zin_loc_camp_host] [?ROOT.zin_aenor_camp_host|0]."
 zin_reign.20.t:0 "The Bells of Parim"
 zin_reign.21.d:0 "Parim's envoys bring word that the Golden King is dead. Our court must decide how to mourn a king it did not love."
 zin_reign.21.opt1:0 "A letter of condolence."
 zin_reign.21.opt2:0 "Send a great embassy."
 zin_reign.21.opt3:0 "Say nothing."
 zin_reign.21.t:0 "Mourners to Parim"
 zin_reign.22.d:0 "In the lake quarters people say the King was strong at supper and cold by dawn. Some say the gods took him for his greed. Some say worse, and lower their voices."
 zin_reign.22.opt1:0 "Hang the loudest tongues."
 zin_reign.22.opt2:0 "Let them talk; they always do."
 zin_reign.22.opt3:0 "Ask the royal physicians what they saw."
 zin_reign.22.t:0 "Talk in the Taverns"
 zin_reign.23.d:0 "The Golden King goes to the vault of kings in a coffin of gilded oak. The court asks how great a funeral the treasury can bear, and the temples ask who will lead the rites."
 zin_reign.23.opt1:0 "The temples will lead the rites."
 zin_reign.23.opt2:0 "Gold, as he would have wished."
 zin_reign.23.opt3:0 "A soldier's burial; the Lost Cause carries him."
 zin_reign.23.t:0 "The King's Funeral"
 zin_reign.24.d:0 "Riders from Parim: the King is dead. Our lord must choose words for the Concord Council and words for our own hall."
 zin_reign.24.opt1:0 "Grief for the crown."
 zin_reign.24.opt2:0 "The Charters of Parim bind us to the crown, not to the court."
 zin_reign.24.t:0 "Word Reaches the Dominions"
 zin_reign.25.d:0 "The First Warden of Selen asks the council a plain question: who holds the seals, and by what right? The envoys of the dominions wait in the gallery for the answer."
 zin_reign.25.d_dominion:0 "The First Warden of Selen has put a plain question to the council in Parim: who holds the seals, and by what right? The lords of the other dominions wait to hear the answer."
 zin_reign.25.opt1:0 "The council holds them until the crown is given."
 zin_reign.25.opt2:0 "The Concord shall be heard."
 zin_reign.25.opt3:0 "We wait on Parim's answer."
 zin_reign.25.t:0 "Selen Asks Who Rules"
 zin_reign.26.d:0 "Prince Eronel of Arcedor, of an old collateral line of the house of Aen, is seen everywhere in the Golden Court. Office-buyers fill his rooms and sit at his table."
 zin_reign.26.opt1:0 "Watch the prince."
 zin_reign.26.opt2:0 "Invite him to the council."
 zin_reign.26.t:0 "A Rival in the Gilded Halls"
 zin_reign.30.d:0 "The office-buyers will not lose what they paid for. Gold flows to every captain in Parim, and every captain knows the price of a seal."
 zin_reign.30.opt1:0 "Refuse it."
 zin_reign.30.opt2:0 "Take their gold."
 zin_reign.30.t:0 "The Golden Court Opens Its Purses"
 zin_reign.31.d:0 "From every temple of Parim the priests preach the same sermon: the Deliverer has guarded Aenor since Elzon's fall, and let him guard it now. The sermons are well made, and there are a great many of them."
 zin_reign.31.d_hub:0 "The sermons of Parim are the Council's own, written by the High Confessor and carried to every pulpit by the Couriers' Chapter. In a week the whole city will be asking for the same thing in the same words."
 zin_reign.31.opt1:0 "Let the people hear them."
 zin_reign.31.opt2:0 "Order the sermons cut short."
 zin_reign.31.opt3:0 "The temples are loud this season."
 zin_reign.31.opt4:0 "Let the pulpits carry the word."
 zin_reign.31.t:0 "The Temples Speak"
 zin_reign.32.d:0 "Lords of the dominions read the Charters of Parim aloud in their halls. The crown, they say, is a partner and not a master."
 zin_reign.32.d_dominion:0 "In our hall the Charters of Parim were read aloud this week, and nobody asked the crown's leave. The crown, our lords say, is a partner and not a master."
 zin_reign.32.opt1:0 "The Charters are paper."
 zin_reign.32.opt2:0 "The Charters are honoured."
 zin_reign.32.opt3:0 "Stand with the other lords."
 zin_reign.32.opt4:0 "Wait for the crown."
 zin_reign.32.t:0 "The Charters Remembered"
 zin_reign.33.d:0 "Frontier men and scholars talk of [zin_loc_eindil], a man of the First Men who warned of the dark. They want him crowned, and they say so in the squares."
 zin_reign.33.opt1:0 "Let the Host be heard."
 zin_reign.33.opt2:0 "Disperse the gatherings."
 zin_reign.33.t:0 "The Stranger's Name in the Streets"
 zin_reign.34.d:0 "Liveried servants of the office-buyers and pilgrims from the temples fight at the Gilded Gate. Three are dead, and each side swears the other struck first."
 zin_reign.34.opt1:0 "Call out the guard."
 zin_reign.34.opt2:0 "Let the camps settle it."
 zin_reign.34.t:0 "Riot at the Gilded Gate"
 zin_reign.35.d:0 "The captains of the Parim garrison ask the council a question no captain should ask: whose orders will they follow next month?"
 zin_reign.35.opt1:0 "The crown's, whoever wears it."
 zin_reign.35.opt2:0 "The Lost Cause's."
 zin_reign.35.t:0 "Captains Choose a Side"
 zin_reign.36.d:0 "Five days remain. The council counts who stands where, and a camp with thirty or more will not take the seals quietly."
 zin_reign.36.opt1:0 "Let the thirtieth day come."
 zin_reign.36.opt1_tip1:0 "Support now: the Golden Court [?ROOT.zin_aenor_camp_court|0], the Free Dominions [?ROOT.zin_aenor_camp_dominions|0], [zin_loc_camp_faithful] [?ROOT.zin_aenor_camp_faithful|0], [zin_loc_camp_host] [?ROOT.zin_aenor_camp_host|0]. A camp at thirty or more rises when the seals pass."
 zin_reign.36.t:0 "The Seals Are Counted"
 zin_reign.37.d:0 "Our lord has torn up the charter. The Concord's banner comes down in our hall, and the hall is quieter than anyone expected."
 zin_reign.37.opt1:0 "Free, and afraid."
 zin_reign.37.t:0 "A Dominion Chooses Freedom"
 zin_reign.40.d:0 "In the great temple of Parim the High Confessor lifts the crown. The people outside sing. Some commanders swear because they believe, some because they fear another war, and some say nothing at all."
 zin_reign.40.opt1:0 "Let all Parim celebrate."
 zin_reign.40.opt2:0 "A solemn rite, no feast."
 zin_reign.40.t:0 "The Crown Laid Before the Deliverer"
 zin_reign.41.d:0 "Parim invites every crown to honour King [zin_loc_deliverer], the god who guards Aenor. Our envoys can come to the temple with empty hands or with full ones, and Parim will count which."
 zin_reign.41.opt1:0 "Send an envoy, no more."
 zin_reign.41.opt2:0 "Send gifts to the god-king."
 zin_reign.41.opt3:0 "Our temples honour him; our court does not."
 zin_reign.41.t:0 "Envoys to the Coronation"
 zin_reign.42.d:0 "The new king asks every dominion to swear to him as it swore to the crown. The temples of our land are full of people who already have."
 zin_reign.42.opt1:0 "Swear gladly."
 zin_reign.42.opt2:0 "Swear by the Charters, not by the god."
 zin_reign.42.opt3:0 "Refuse the oath."
 zin_reign.42.t:0 "The Oath to the New King"
 zin_reign.43.d:0 "King [zin_loc_deliverer]'s first edict will set the tone of the reign. The chancery has drafted three, and the god-king's seal waits beside each."
 zin_reign.43.opt1:0 "An Edict of Mercy: the debts of the poor quarters are remitted."
 zin_reign.43.opt2:0 "An Edict of the Temples: the Houses of the First Light take the birth rolls of every dominion."
 zin_reign.43.opt3:0 "An Edict of Accounts: the offices sold by the late King are audited."
 zin_reign.43.t:0 "The First Edict"
 zin_reign.44.d:0 "Masters at the University of Parim ask an old question aloud: which line of Aen does the new king descend from? The rolls are silent."
 zin_reign.44.opt1:0 "Buy their silence with chairs and pensions."
 zin_reign.44.opt2:0 "Close the university for a season."
 zin_reign.44.opt3:0 "Let them debate; the god does not fear rolls."
 zin_reign.44.opt3_tip1:0 "The scholars keep their rolls, and Master Ilsabet may yet put them to use."
 zin_reign.44.t:0 "Scholars Question the Genealogy"
 zin_reign.45.d:0 "The league the Golden King founded has lost its founder. Its frontier captains ask whom they serve, and its court branch asks for new banners."
 zin_reign.45.opt1:0 "Keep it as the crown's ornament."
 zin_reign.45.opt1_tip1:0 "The league stays an ornament."
 zin_reign.45.opt2:0 "Fold it into the temple guard."
 zin_reign.45.opt3:0 "Let the frontier keep it."
 zin_reign.45.opt3_tip1:0 "The Shield of the Concord grows likelier to be raised."
 zin_reign.45.t:0 "What Is the Lost Cause For?"
 zin_reign.46.d:0 "The office-buyers who backed the late King now buy candles for the temples. Some keep their seats, and some do not."
 zin_reign.46.opt1:0 "Strip the worst of them."
 zin_reign.46.opt2:0 "Let them keep what they bought."
 zin_reign.46.t:0 "The Golden Court Changes Its Robes"
 zin_reign.50.d:0 "No king is named. The Regency rules in the crown's name, and the crown's name has never been better for trade."
 zin_reign.50.opt1:0 "Gold keeps the peace."
 zin_reign.50.opt2:0 "The Regency will be honest."
 zin_reign.50.t:0 "The Regency of the Golden Court"
 zin_reign.51.d:0 "The High Confessor preaches that a crown without a king offends the god, and the temples of Parim are full of people who agree with him."
 zin_reign.51.opt1:0 "Endow the temples."
 zin_reign.51.opt2:0 "The Regency answers to the Concord, not the temples."
 zin_reign.51.t:0 "The Temples Are Displeased"
 zin_reign.52.d:0 "Prince Eronel of Arcedor asks the Regency to crown him. He has the rooms, the friends and the gold leaf, and lacks only the anointing."
 zin_reign.52.opt1:0 "Crown the prince."
 zin_reign.52.opt2:0 "The Regency is enough."
 zin_reign.52.t:0 "Prince Eronel Asks for the Crown"
 zin_reign.53.d:0 "Three years on, the Regency still rules for a crown nobody wears. The feasts are as long as the late King's, and the toasts are shorter."
 zin_reign.53.opt1:0 "So be it."
 zin_reign.53.t:0 "A Regency Without End"
 zin_reign.55.d:0 "The dominion lords elect a Speaker to hold the seals, and every charter is rewritten as a Free Charter. The Speaker's first act is to read the Charters of Parim aloud from the first word."
 zin_reign.55.d_dominion:0 "The lords of the Concord have chosen a Speaker, and our charter is rewritten as a Free Charter. The seals of Parim now rest with the Concord and not with a crown."
 zin_reign.55.opt1:0 "The crown is first among equals."
 zin_reign.55.opt2:0 "A charter that is ours."
 zin_reign.55.t:0 "The Speaker of the Concord"
 zin_reign.56.d:0 "The High Confessor asks what the Concord wants of the god's temples. The Speaker has twenty-six charters on the table and not one of them mentions a pulpit."
 zin_reign.56.opt1:0 "Keep the temples as they are."
 zin_reign.56.opt2:0 "The temples answer to each dominion."
 zin_reign.56.t:0 "The Temples Ask Their Place"
 zin_reign.57.d:0 "The Concord Council meets again, as it did in 4A 212, and the Speaker means to see that it meets every year after."
 zin_reign.57.opt1:0 "Let the lords meet."
 zin_reign.57.t:0 "A Concord Council Every Year"
 zin_reign.60.d:0 "[zin_loc_eindil] is hailed, not crowned, by the captains and scholars of the realm. He asks for the Lost Cause and not for a throne."
 zin_reign.60.opt1:0 "Hail him."
 zin_reign.60.t:0 "The People's King"
 zin_reign.61.d:0 "The temples will not bless a king without a house. Their doors stand open to the people and shut to the stranger who would lead them."
 zin_reign.61.opt1:0 "Let them pray as they like."
 zin_reign.61.opt2:0 "The temples serve the realm."
 zin_reign.61.t:0 "The Temples Do Not Kneel"
 zin_reign.65.d:0 "Prince Eronel is crowned with the temples' blessing. The Chancellor stands at his right hand, and the crowd cheers a face it hardly knows."
 zin_reign.65.opt1:0 "Long live the King."
 zin_reign.65.t:0 "King Eronel"
 zin_reign.66.d:0 "The new king signs everything the Chancellor brings him. The court calls it a gift for the work of the seals, and the Chancellor does not correct it."
 zin_reign.66.opt1:0 "The realm runs smoothly."
 zin_reign.66.t:0 "A King Who Signs"
 zin_reign.70.d:0 "The Golden King has not slept since the proof was laid before him. He eats nothing his own tasters have not touched, and for the first time in twenty years he asks the Lost Cause for guards."
 zin_reign.70.opt1:0 "Give him the frontier companies."
 zin_reign.70.t:0 "The King Afraid"
 zin_reign.71.d:0 "Half the temples of Parim bar their doors to the King's men. The other half open them to the frightened."
 zin_reign.71.opt1:0 "The King is still the King."
 zin_reign.71.t:0 "The Temples Close Their Doors"
 zin_reign.72.d:0 "In this telling of the age, the Golden King rides at the head of his league for the first time in his life. Behind him the gilt on the banners is new, and the men beneath them are not."
 zin_reign.72.opt1:0 "Let him ride."
 zin_reign.72.t:0 "The Golden King Rides Out"
 zin_reign.73.d:0 "The King lives. In this telling of the age, the Golden Court goes on, and so does its gold."
 zin_reign.73.opt1:0 "Long live the Golden King."
 zin_reign.73.t:0 "A King Who Lived"
 zin_reign.80.d:0 "Parim has never been cleaner or quieter. The granaries are full, the beggars are fed, and fewer people ask questions in the taverns."
 zin_reign.80.d_hub:0 "Parim is quiet because the Couriers' Chapter has made it so. The granaries are full, the taverns are listened to, and the Council reads the week's whispers every dawn."
 zin_reign.80.opt1:0 "Peace and order."
 zin_reign.80.t:0 "The God-King's City"
 zin_reign.81.d:0 "King [zin_loc_deliverer] has withdrawn into retreat to pray for the realm. Chancellor Merovan holds the seals until he returns."
 zin_reign.81.d_dominion:0 "Riders from Parim: King [zin_loc_deliverer] has withdrawn into retreat to pray for the realm, and Chancellor Merovan holds the seals until he returns. Our lord is asked to pray as well."
 zin_reign.81.opt1:0 "The Chancellor governs."
 zin_reign.81.opt2:0 "We pray for the realm."
 zin_reign.81.t:0 "The King Withdraws to Pray"
 zin_reign.82.d:0 "The King is back in Parim. He walks slowly and receives no one for a month. The temples say the god bears the realm's sorrows."
 zin_reign.82.opt1:0 "Pray for the King."
 zin_reign.82.t:0 "The King Returns Pale"
 zin_reign.83.d:0 "The chancery warns every dominion: a foreign impostor claims the blood of Aen and speaks against the King."
 zin_reign.83.opt1:0 "Spread the warning."
 zin_reign.83.t:0 "Talk of an Impostor"
 zin_reign.84.d:0 "Parim says the stranger is a liar. Our own captains, who have heard him, say he talks sense."
 zin_reign.84.opt1:0 "Parim knows best."
 zin_reign.84.opt2:0 "Let him speak in our halls."
 zin_reign.84.t:0 "The Dominions and the Impostor"
 zin_reign.85.d:0 "A name has been spoken in Parim, and the court is deciding what it owes."
 zin_reign.85.d_revealed_ruled:0 "The court knows what its king is. Some lords leave Parim by night. Most stay, from faith or from fear."
 zin_reign.85.d_revealed_temples:0 "The temples of Aenor stand accused. The Houses of the First Light served the false god, and those who work in them are asking whether they served a lie."
 zin_reign.85.opt1:0 "The King is the King."
 zin_reign.85.opt2:0 "Let the lords who flee go."
 zin_reign.85.opt3:0 "Close the Houses."
 zin_reign.85.opt4:0 "Watch them."
 zin_reign.85.t:0 "What Is Owed to a False God?"
 zin_reign.86.d:0 "Lord-Commander Tarec and the frontier captains have taken the seals until a king returns. Nobody asks which king."
 zin_reign.86.opt1:0 "Hold the walls."
 zin_reign.86.t:0 "The Captains' Regency"
 zin_reign.87.d:0 "Half the priests have gone east with their god. The other half pray for forgiveness. The poor still come for bread."
 zin_reign.87.opt1:0 "Feed them from the crown's stores."
 zin_reign.87.opt2:0 "Close the temples."
 zin_reign.87.t:0 "Empty Temples in Parim"
