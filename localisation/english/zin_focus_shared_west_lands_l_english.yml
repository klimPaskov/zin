l_english:
 zin_shared_west_lands_a_delegate_to_the_ford:0 "A Delegate to the Ford Council"
 zin_shared_west_lands_a_delegate_to_the_ford_desc:0 "The Grey Ford has called the courts of the West to council, and [ROOT.GetName] sends a delegate. He is given a good horse, a full purse and strict instructions to listen more than he speaks."
 zin_shared_west_lands_a_house_of_healing:0 "A House of Healing"
 zin_shared_west_lands_a_house_of_healing_desc:0 "Grey-robed healers have come to the market town with a chest of herbs and a letter of introduction. They ask for a room, a garden and the freehold's trust, and promise a hospital and a grain store in return."
 zin_shared_west_lands_a_house_of_healing_tip_1:0 "The Houses of the First Light offer a hospital and a grain store."
 zin_shared_west_lands_a_league_of_councils:0 "A League of Councils"
 zin_shared_west_lands_a_league_of_councils_desc:0 "The towns of the West have more in common than their lords knew. [ROOT.GetName] proposes a league of councils: no war between them, open roads and a shared table at the Ford."
 zin_shared_west_lands_a_voice_in_the_hall:0 "A Voice in the Hall"
 zin_shared_west_lands_a_voice_in_the_hall_desc:0 "A freeholder is chosen by lot and sent to the overlord's hall to speak for the freehold. He is a good listener, a poor bargainer and a very honest man, and the overlord's court is baffled by him."
 zin_shared_west_lands_a_western_factor:0 "Parim's Factor in Our Market"
 zin_shared_west_lands_a_western_factor_desc:0 "A merchant with Parim's seal sets up a counting-house in the market town and pays in good coin for everything he buys. The freeholders note that the coin is good, and say nothing of the seal."
 zin_shared_west_lands_a_western_factor_tip_1:0 "Parim's factor keeps an office in our market town."
 zin_shared_west_lands_answer_the_lost_cause:0 "Answer the Lost Cause"
 zin_shared_west_lands_answer_the_lost_cause_desc:0 "The Lost Cause is Aenor's last company: old soldiers, old oaths and an unfashionable loyalty. [ROOT.GetName] answers its call with a pledge and a few of its best, and is made an honorary member of the company."
 zin_shared_west_lands_ashore:0 "Ashore Beyond the Sea"
 zin_shared_west_lands_ashore_beyond_the_sea:0 "Ashore Beyond the Sea"
 zin_shared_west_lands_ashore_beyond_the_sea_desc:0 "The fleet of the West has crossed the sea, and the companies of [ROOT.GetName] stand on a far beach in unfamiliar mud. They have never fought in a country so strange, and they fight the better for it."
 zin_shared_west_lands_ashore_desc:0 "Far from home, in strange mud, the companies of [ROOT.GetName] fight with an edge their officers did not expect."
 zin_shared_west_lands_beside_old_foes:0 "Beside Old Foes"
 zin_shared_west_lands_beside_old_foes_desc:0 "A banner has been raised in the south that does not care whose soldiers stand under it. The stranded companies of [ROOT.GetName] march to it side by side with men who were their enemies a season ago."
 zin_shared_west_lands_between_the_banks:0 "Between the Banks"
 zin_shared_west_lands_between_the_banks_desc:0 "The Grey Ford lies between two great houses, and [ROOT.GetName] lives within sound of its water. The truce made there is as much its own as its neighbours', and it watches the banks with that in mind."
 zin_shared_west_lands_between_the_banks_tip_1:0 "The Grey Ford is a day's ride away. Its truce is our peace too."
 zin_shared_west_lands_bowmen_of_the_hedges:0 "Bowmen of the Hedges"
 zin_shared_west_lands_bowmen_of_the_hedges_desc:0 "Every hedge in the West is a possible ambush, and every boy who has hunted from one is a possible archer. [ROOT.GetName] writes down their names, gives them yew bows and holds a contest every Midsummer."
 zin_shared_west_lands_council_charters:0 "Council Charters"
 zin_shared_west_lands_council_charters_desc:0 "Each town receives a charter, written on good parchment and sealed with the council's own seal. It grants the right to hold a market, to keep a watch and to write its own law."
 zin_shared_west_lands_council_charters_spirit:0 "Council Charters"
 zin_shared_west_lands_council_charters_spirit_desc:0 "Every town of [ROOT.GetName] holds a sealed charter to keep a market, to keep a watch and to write its own law."
 zin_shared_west_lands_council_league:0 "League of Councils"
 zin_shared_west_lands_fishing_villages:0 "Fishing Villages"
 zin_shared_west_lands_fishing_villages_desc:0 "Villages of tarred huts and drying racks line the shore of [ROOT.GetName], and their boats go out before dawn. The catch pays for the harbour, and the harbour pays for the boats."
 zin_shared_west_lands_fishing_villages_spirit:0 "[ROOT.GetAdjective] Fishing Villages"
 zin_shared_west_lands_fishing_villages_spirit_desc:0 "Tarred huts and drying racks line the shore, and the boats go out before dawn."
 zin_shared_west_lands_freedom_charter:0 "The Charter of Freedom"
 zin_shared_west_lands_freedom_charter_desc:0 "The overlord has signed the old freeholders' rights, and [ROOT.GetName] has framed them."
 zin_shared_west_lands_freehold_law:0 "Freehold Law"
 zin_shared_west_lands_freehold_law_desc:0 "A freeholder's land is his by right of fire and plough, and the law of [ROOT.GetName] has never been written down. It is now, in plain words on a roll of hide, so that no lord may remember it differently from his neighbour."
 zin_shared_west_lands_freehold_law_spirit:0 "Freehold Law"
 zin_shared_west_lands_freehold_law_spirit_desc:0 "The law of [ROOT.GetName] is written down at last, and no lord can remember it differently from his neighbour."
 zin_shared_west_lands_freehold_stores:0 "The Freehold Stores"
 zin_shared_west_lands_freehold_stores_desc:0 "Every store in [ROOT.GetName] is written into one ledger, and nobody starves while the keeper's key still turns."
 zin_shared_west_lands_grain_for_the_feud:0 "Grain for the Feud"
 zin_shared_west_lands_grain_for_the_feud_desc:0 "War has come to the Ford, and both banks are hungry. The granaries of [ROOT.GetName] sell to both at honest prices, with the proviso that the grain is not to be eaten on the field."
 zin_shared_west_lands_grain_for_the_feud_tip_1:0 "Both banks pay well for grain."
 zin_shared_west_lands_heed_the_warning_from_the_east:0 "Heed the Warning"
 zin_shared_west_lands_heed_the_warning_from_the_east_desc:0 "The stranger has sent a warning to every court in the West, and it is a short one: the king in Parim is not what the temples say. [ROOT.GetName] weighs the words, the sender and the old grudge, and decides how much of each to believe."
 zin_shared_west_lands_hill_spears:0 "Hill Spears"
 zin_shared_west_lands_hill_spears_desc:0 "A long ash spear in the hands of a freeholder who knows the hills is a surprising weapon. The smiths of [ROOT.GetName] refine its head, lengthen its shaft and teach its bearers to stand in rank."
 zin_shared_west_lands_horse_fair:0 "The Horse Fair"
 zin_shared_west_lands_horse_fair_desc:0 "Young horses are ridden round the common until they are sold or the rider falls off, and the host gets the best of them."
 zin_shared_west_lands_horses_and_grain:0 "Horses and Grain"
 zin_shared_west_lands_horses_and_grain_desc:0 "The West grows horses and barley, and does both well. [ROOT.GetName] sets a Guild Workshop beside the stud to turn hides, grain and horn into goods worth carrying to market."
 zin_shared_west_lands_letters_of_the_relief:0 "Letters of the Relief"
 zin_shared_west_lands_letters_of_the_relief_desc:0 "Letters arrive from the courts of the Concord, courteous, specific and unusually brief. The Relief is the name of what they propose, and [ROOT.GetName] reads them aloud in the hall."
 zin_shared_west_lands_look_to_our_own:0 "Look to Our Own"
 zin_shared_west_lands_look_to_our_own_desc:0 "The West's grudge is the West's affair, and [ROOT.GetName] has crops to bring in. Its elders decide that the freehold will mind its own roofs and let the great quarrels find other shoulders."
 zin_shared_west_lands_market_roads:0 "Market Roads"
 zin_shared_west_lands_market_roads_desc:0 "Cart-tracks that flood in spring and rut in summer are slowly turned into proper roads, with ditches, culverts and a man at each ford to take the toll. The markets of [ROOT.GetName] come closer together."
 zin_shared_west_lands_muster_field:0 "The Muster Field"
 zin_shared_west_lands_muster_field_desc:0 "Companies from every district drill together on the green field each year, and march home steadier than they came."
 zin_shared_west_lands_neighbours_first:0 "Neighbours First"
 zin_shared_west_lands_neighbours_first_desc:0 "The freeholds of the West are neighbours before they are anything else, and neighbours settle their quarrels at the fence. [ROOT.GetName] sends envoys to the two smallest of its neighbours with a gift and an offer of peace."
 zin_shared_west_lands_neither_bank:0 "Neither Bank"
 zin_shared_west_lands_neither_bank_desc:0 "The freeholders will not take sides on the Ford. They sell grain to both banks, shelter the weary from both and let it be known that [ROOT.GetName] is neither bank's friend nor enemy."
 zin_shared_west_lands_neither_bank_spirit:0 "Neither Bank"
 zin_shared_west_lands_neither_bank_spirit_desc:0 "Grain goes to both banks of the Ford, the weary are sheltered from both, and [ROOT.GetName] is neither bank's friend nor enemy."
 zin_shared_west_lands_nurse_the_grudge:0 "Nurse the Grudge"
 zin_shared_west_lands_nurse_the_grudge_desc:0 "[ROOT.GetName] will not forget, and it will not let Parim forget either. The old claims are read aloud at every feast, the old maps hang in every hall, and the young are taught who owes what to whom."
 zin_shared_west_lands_old_banners:0 "Old Banners"
 zin_shared_west_lands_old_banners_desc:0 "Long before the kings of Aenor, the freeholds of the West marched under their own banners, and they have kept the cloth in chests ever since. [ROOT.GetName] hangs its oldest in the hall and tells the story to anyone who stays to supper."
 zin_shared_west_lands_old_banners_tip_1:0 "[ROOT.GetAdjective] banners flew under their own commanders in the First Age."
 zin_shared_west_lands_one_freehold:0 "One Freehold"
 zin_shared_west_lands_one_freehold_desc:0 "The great houses of [ROOT.GetName] have quarrelled for generations over boundaries, brides and the use of a ford. At last they agree that it is one freehold with one hall, and cut the agreement into the hall's main beam."
 zin_shared_west_lands_our_own_affairs:0 "Our Own Affairs"
 zin_shared_west_lands_our_own_affairs_desc:0 "The freehold minds its own roofs and lets the great quarrels find other shoulders."
 zin_shared_west_lands_our_own_shore_kept:0 "Our Own Shore"
 zin_shared_west_lands_our_own_shore_kept_desc:0 "The West has chosen to keep its own shore, and the great houses look at the small ones with interest. [ROOT.GetName] pulls its fences in, mends its walls and counts its neighbours."
 zin_shared_west_lands_pay_tribute_tip_1:0 "The overlord is paid its tribute."
 zin_shared_west_lands_pledge_the_freehold:0 "Pledge the Freehold"
 zin_shared_west_lands_pledge_the_freehold_desc:0 "The freehold of [ROOT.GetName] has pledged its spears to the crossing, and the pledge is written in the hall's own book. Companies gather on the common, tents go up in rows, and every smith in the district works through the night."
 zin_shared_west_lands_riders_of_the_freehold:0 "Riders of the Freehold"
 zin_shared_west_lands_riders_of_the_freehold_desc:0 "The riders of the freehold are farmers first and horsemen second, but they have spent their lives in the saddle and it shows. [ROOT.GetName] gives them lances, banners and a practice ground."
 zin_shared_west_lands_sail_as_friends:0 "Sail as Friends"
 zin_shared_west_lands_sail_as_friends_desc:0 "The western fleets sail across the sea not as conquerors but as friends of a failing court. [ROOT.GetName] sends ships, supplies and a few companies, and asks for nothing but the right to sail home."
 zin_shared_west_lands_seek_a_guarantee:0 "Seek a Guarantee"
 zin_shared_west_lands_seek_a_guarantee_desc:0 "[ROOT.GetName] writes to the strongest of its neighbours with a gift and a plain request: stand behind us, and we will stand beside you. It is a modest bargain and an old one."
 zin_shared_west_lands_seek_voice_tip_1:0 "A voice in the overlord's hall: the freehold gains a little freedom."
 zin_shared_west_lands_shields_beside_the_concord:0 "Shields Beside the Concord"
 zin_shared_west_lands_shields_beside_the_concord_desc:0 "The shields of the West and the shields of the Concord have never stood side by side. Now they do, and each is surprised to find the other's weight on its arm."
 zin_shared_west_lands_shields_beside_the_concord_spirit:0 "Shields Beside the Concord"
 zin_shared_west_lands_shields_beside_the_concord_spirit_desc:0 "The shields of the West and of the Concord stand side by side, and each carries a little of the other's weight."
 zin_shared_west_lands_ships_for_the_council:0 "Ships for the Council"
 zin_shared_west_lands_ships_for_the_council_desc:0 "The Ford Council has asked each shore for hulls and crews to carry its envoys and its stores. [ROOT.GetName] sends what it can spare and a little more than it can."
 zin_shared_west_lands_ships_not_men:0 "Ships, Not Men"
 zin_shared_west_lands_ships_not_men_desc:0 "The freehold will not send spears across the sea, but it will send hulls. [ROOT.GetName] lends its boats, its crews and its ropes, and keeps its men at home to guard the shore."
 zin_shared_west_lands_songs_of_the_conquest:0 "Songs of the Conquest"
 zin_shared_west_lands_songs_of_the_conquest_desc:0 "The singers of [ROOT.GetName] learn the long songs of the First Age: the burning of the fords, the taking of the horses, the night of the broken oaths. Young men leave the hall with hard faces and clenched fists."
 zin_shared_west_lands_songs_on_the_road:0 "Songs on the Road"
 zin_shared_west_lands_songs_on_the_road_desc:0 "The singers of [ROOT.GetName] make up a song about the Man from the Ice: of his silence, his long stride and the blade he does not draw. It is a good song, and it travels faster than he does."
 zin_shared_west_lands_take_parims_coin:0 "Take Parim's Coin"
 zin_shared_west_lands_take_parims_coin_desc:0 "Parim has silver, and silver speaks louder than songs. [ROOT.GetName] sends an envoy south to ask what the old wrongs might fetch, and is surprised by how little shame the question brings."
 zin_shared_west_lands_the_bridge_watch:0 "The Bridge Watch"
 zin_shared_west_lands_the_bridge_watch_desc:0 "The Bridge of the Three Oaths is old, narrow and much quarrelled over. [ROOT.GetName] posts a watch at the foot of it, to take the toll in grain and hear the complaints in turn."
 zin_shared_west_lands_the_bridge_watch_tip_1:0 "Two lordships quarrel at the bridge every bad harvest."
 zin_shared_west_lands_the_call_to_cross_heard:0 "The Call to Cross"
 zin_shared_west_lands_the_call_to_cross_heard_desc:0 "A call has gone out from the Ford Council to every court of the West: the time has come to cross the sea. [ROOT.GetName] hears it in full hall, with the old banners on the walls and the old grudges on its tongue."
 zin_shared_west_lands_the_charter_of_freedom:0 "The Charter of Freedom"
 zin_shared_west_lands_the_charter_of_freedom_desc:0 "The old freeholders' rights are written out on a clean roll and sent to the overlord with a plain request: sign here. It is signed, to everyone's surprise, and framed."
 zin_shared_west_lands_the_coin_and_the_grudge:0 "The Coin and the Grudge"
 zin_shared_west_lands_the_coin_and_the_grudge_desc:0 "The coin comes in, the grudge goes quiet and the two do not quite sit together. [ROOT.GetName] writes the arrangement down as an honest bargain, and hopes nobody will read it too closely."
 zin_shared_west_lands_the_freehold_first:0 "The Freehold First"
 zin_shared_west_lands_the_freehold_first_desc:0 "Before the quarrels of the great and the coin of Parim, the freehold comes first. [ROOT.GetName] sets down in the hall's own book that no promise may be made on its behalf without the moot's word."
 zin_shared_west_lands_the_freehold_hall:0 "The Freehold Hall of [ROOT.GetName]"
 zin_shared_west_lands_the_freehold_hall_desc:0 "The freehold hall of [ROOT.GetName] is a long timber house with a turf roof, a hearth at each end and a table that has never been long enough. Its owners hold their land from nobody, and they gather here each Thaw to say so."
 zin_shared_west_lands_the_freehold_levy:0 "The Freehold Levy"
 zin_shared_west_lands_the_freehold_levy_desc:0 "A freeholder owes his lord a spear and a season. [ROOT.GetName] calls the levy to the common, counts every spear, looks over every shield and sends the unready home with a lesson."
 zin_shared_west_lands_the_freehold_stores:0 "The Freehold Stores"
 zin_shared_west_lands_the_freehold_stores_desc:0 "Every freehold keeps a store against the lean year, and the stores of [ROOT.GetName] are at last counted and written into one ledger. Nobody starves while the keeper's key still turns."
 zin_shared_west_lands_the_grudge_spoken:0 "The Grudge Spoken Aloud"
 zin_shared_west_lands_the_grudge_spoken_desc:0 "At the next full moon the elders of [ROOT.GetName] stand before the people and name the wrongs one by one, from the first to the last. When they sit down, the hall is silent for a long time."
 zin_shared_west_lands_the_harbour:0 "The Harbour of [ROOT.GetName]"
 zin_shared_west_lands_the_harbour_desc:0 "A deep cove, a stone quay and a slip for building hulls: the harbour of [ROOT.GetName] grows from a fishing beach into a place where ships are made."
 zin_shared_west_lands_the_horse_fair:0 "The Horse Fair"
 zin_shared_west_lands_the_horse_fair_desc:0 "Every autumn the freeholders bring their young horses to the fair and ride them round the common until someone buys them or falls off. The best go to the host, and the rest go to the plough."
 zin_shared_west_lands_the_long_voyage:0 "Ready for the Long Voyage"
 zin_shared_west_lands_the_long_voyage_desc:0 "Beyond the western sea lies a shore that few have seen, and the courts of the West mean to cross to it. [ROOT.GetName] fills its holds, tars its hulls and drills its crews for a voyage longer than any of them has made."
 zin_shared_west_lands_the_lords_moot:0 "The Lords' Moot"
 zin_shared_west_lands_the_lords_moot_desc:0 "The lords of the freehold meet at the full moon, each in his turn, with his grievance cut on a stick. The moot hears them all, and the quarrels that survive the night are the ones worth settling."
 zin_shared_west_lands_the_man_on_the_road_south:0 "The Man on the Road South"
 zin_shared_west_lands_the_man_on_the_road_south_desc:0 "Travellers from the north speak of a man found alive in the ice, who walks south along the old trade road and is asked questions by everyone he meets. [ROOT.GetName] sits up late to hear the tales."
 zin_shared_west_lands_the_mill:0 "The Mill on the River"
 zin_shared_west_lands_the_mill_desc:0 "A mill on the river grinds the grain of three valleys, and the miller is the most listened-to man in the district. [ROOT.GetName] builds a second wheel and a second store, and the miller grows insufferable."
 zin_shared_west_lands_the_muster_field:0 "The Muster Field"
 zin_shared_west_lands_the_muster_field_desc:0 "A flat green field by the river is set aside for the yearly muster and kept free of everything but grass. Companies from every district drill there for a fortnight, and the whole West hears of it."
 zin_shared_west_lands_the_old_grudge:0 "The Old Grudge"
 zin_shared_west_lands_the_old_grudge_desc:0 "The kings of Aenor took what they wished from the West in the First Age, and every hall in [ROOT.GetName] still has a verse about it. The grudge is old, and nobody has quite decided whether it is a wound or an asset."
 zin_shared_west_lands_the_open_assembly:0 "The Open Assembly"
 zin_shared_west_lands_the_open_assembly_desc:0 "Once a year the whole council meets in the open before every townsman and answers for what it has done. The assembly is loud, but nobody leaves it ignorant."
 zin_shared_west_lands_the_road_home:0 "The Road Home"
 zin_shared_west_lands_the_road_home_desc:0 "The long war is over, and the roads of the West lead home again. [ROOT.GetName] meets its returning companies at the Ford with food, fire and no questions."
 zin_shared_west_lands_the_road_home_tip_1:0 "In this telling, some came home and some did not."
 zin_shared_west_lands_the_shore_watch:0 "The Shore Watch"
 zin_shared_west_lands_the_shore_watch_desc:0 "Stone towers on the headlands of [ROOT.GetName] keep watch over the western sea. A beacon on the highest can be seen from the Ford on a clear night."
 zin_shared_west_lands_the_small_crowns_stand_together:0 "The Small Crowns Stand Together"
 zin_shared_west_lands_the_small_crowns_stand_together_desc:0 "A small court is a nuisance to a great one, but five small courts in a row are a wall. [ROOT.GetName] writes to its neighbours, offers them peace and asks only that they offer the same."
 zin_shared_west_lands_the_town_council:0 "The Town Council of [ROOT.GetName]"
 zin_shared_west_lands_the_town_council_desc:0 "The towns of [ROOT.GetName] have grown tired of the lords' moot and elected a council of their own. Its members are merchants, masons and one remarkable baker."
 zin_shared_west_lands_the_war_kings_peace_kept:0 "The War-King's Peace Kept"
 zin_shared_west_lands_the_war_kings_peace_kept_desc:0 "The courts of the West have named the stranger war-king, and he has asked for a peace in return: no blood between them until the dead are dealt with. [ROOT.GetName] swears to keep it, and finds the oath harder than expected."
 zin_shared_west_lands_the_western_peace_kept:0 "The Western Peace Kept"
 zin_shared_west_lands_the_western_peace_kept_desc:0 "The great houses have looked at the small ones and, for the moment, looked away. [ROOT.GetName] counts that a victory, and keeps its gates oiled."
 zin_shared_west_lands_the_western_shore:0 "The Western Shore"
 zin_shared_west_lands_the_western_shore_desc:0 "The western shore faces the Pupor Ocean, and [ROOT.GetName] has always known it. It builds a proper harbour wall, a net-loft and a fishers' shrine, and calls it a start."
 zin_shared_west_lands_those_who_stayed:0 "Those Who Stayed"
 zin_shared_west_lands_those_who_stayed_desc:0 "Not every ship came home. Some companies of [ROOT.GetName] were left on the far shore with no hulls and no orders, and made what lives they could. Their families light a lamp for them every evening."
 zin_shared_west_lands_timber_and_tar:0 "Timber and Tar"
 zin_shared_west_lands_timber_and_tar_desc:0 "Pine, tar and plank for ships and houses: the woods of the West are a larder that never closes. [ROOT.GetName] cuts new tracks through them, so that the timber can come out in carts instead of on shoulders."
 zin_shared_west_lands_tribute_and_levies:0 "Tribute and Levies"
 zin_shared_west_lands_tribute_and_levies_desc:0 "Grain, silver and a company of spears go to the overlord each year, and the freeholders tell themselves they would have spent it on the same."
 zin_shared_west_lands_under_a_greater_banner:0 "Under a Greater Banner"
 zin_shared_west_lands_under_a_greater_banner_desc:0 "A greater banner flies over [ROOT.GetName]. The hall still stands, the hearth still burns and the moot still meets, but the last word is no longer its own."
 zin_shared_west_lands.1.a:0 "Pay."
 zin_shared_west_lands.1.b:0 "Refuse."
 zin_shared_west_lands.1.d:0 "[FROM.GetName] would forget old wrongs for a share of Parim's silver. Its envoy stands in the hall in a good cloak, with his cap in his hand and no apparent shame."
 zin_shared_west_lands.1.t:0 "A Western Freehold Asks for Parim's Coin"
 zin_shared_west_lands.2.a:0 "Stand behind them."
 zin_shared_west_lands.2.b:0 "Not our quarrel."
 zin_shared_west_lands.2.d:0 "[FROM.GetName] fears the bigger crowns and asks for a shield. Its envoy waits in the yard, and does not say what he is willing to offer in return."
 zin_shared_west_lands.2.t:0 "A Small Crown Asks for Protection"
 zin_shared_west_lands.3.a:0 "Sign."
 zin_shared_west_lands.3.b:0 "Decline."
 zin_shared_west_lands.3.d:0 "The council of [FROM.GetName] offers a league: no war between us, open markets and a shared table at the Ford. The offer is signed, sealed and refreshingly brief."
 zin_shared_west_lands.3.t:0 "A League of Councils"
