l_english:
 zin_shared_north_lands_a_crown_among_crowns:0 "A Crown Among Crowns"
 zin_shared_north_lands_a_crown_among_crowns_desc:0 "After years of careful courtesy, [ROOT.GetName] is known in every northern court and owed something by most of them. Its envoys are seated, its seals honoured and its voice, for a small crown, carries far."
 zin_shared_north_lands_a_lords_hand:0 "A Lord's Hand"
 zin_shared_north_lands_a_lords_hand_desc:0 "One hand holds the crown now, and its grip is firm. The lord of [ROOT.GetName] sets aside the old moot's quarrels and tells the realm what it will do."
 zin_shared_north_lands_a_prosperous_crown:0 "A Prosperous [ROOT.GetAdjective] Crown"
 zin_shared_north_lands_a_prosperous_crown_desc:0 "Granaries full, roads open and a treasury a little heavier than last year: the North has few finer things to boast of. [ROOT.GetName] builds one more workshop with the proceeds, and nobody grumbles at the tax."
 zin_shared_north_lands_a_watchful_crown:0 "A Watchful Crown"
 zin_shared_north_lands_a_watchful_crown_desc:0 "The almoners have friends in places where friends should not be, and the crown has noticed. [ROOT.GetName] keeps a quiet eye on the Houses and a quieter one on their ledgers, and asks no one to say why."
 zin_shared_north_lands_across_the_dark_straits:0 "Across the Dark Straits"
 zin_shared_north_lands_across_the_dark_straits_desc:0 "South-west across the narrow water lie the holds of the Dark Lands, and their orc captains look north often. [ROOT.GetName] keeps a sharp watch on the straits and a sharper eye on whoever crosses them."
 zin_shared_north_lands_against_the_deathless:0 "Against the Deathless"
 zin_shared_north_lands_against_the_deathless_desc:0 "The dead that come out of the sea are slow, patient and not easily killed. [ROOT.GetName] drills its companies to cut them down, to burn what is left and to keep out of reach of the rest."
 zin_shared_north_lands_against_the_deathless_tip_1:0 "Ordinary arms break Zol's dead; they do not end them."
 zin_shared_north_lands_ask_for_a_compact_seat:0 "Ask for a Seat in the Compact"
 zin_shared_north_lands_ask_for_a_compact_seat_desc:0 "The Leren Compact is a hall of two seats and a great many requests. [ROOT.GetName] sends a letter to Sonargur asking for a place in it, and offers its harbours and its good opinion in exchange."
 zin_shared_north_lands_beacons_on_the_capes:0 "Beacons on the Capes"
 zin_shared_north_lands_beacons_on_the_capes_desc:0 "A line of fires on every cape lets the coast speak to itself faster than a rider can. [ROOT.GetName] doubles its watches and sends nobody to bed without a lit brand beside him."
 zin_shared_north_lands_boats_and_nets:0 "Boats and Nets"
 zin_shared_north_lands_boats_and_nets_desc:0 "The sea gives the northern coast its bread and takes its sons in return. [ROOT.GetName] gives its fishers new nets and tarred hulls, and a place by the harbour wall where the widows may sell the catch."
 zin_shared_north_lands_compact_fleet_duty:0 "Compact Fleet Duty"
 zin_shared_north_lands_compact_fleet_duty_desc:0 "In summer the Compact's ships gather at Sonargur, and the member crowns send hulls and crews to take their turn at the strait. The duty is dull and the pay is small, but it teaches a crew to keep station in a gale."
 zin_shared_north_lands_compact_levies:0 "Compact Levies"
 zin_shared_north_lands_compact_levies_desc:0 "The Compact calls for companies, and [ROOT.GetName] sends its share by the autumn road. They come home in spring with new drill and a few stories nobody believes."
 zin_shared_north_lands_compact_member:0 "The Compact Member"
 zin_shared_north_lands_compact_member_desc:0 "A seat in the Leren Compact opens the harbours of Sonargur and the purses of its friends."
 zin_shared_north_lands_crown_of_the_north:0 "The Crown of [ROOT.GetName]"
 zin_shared_north_lands_crown_of_the_north_desc:0 "[ROOT.GetName] is a small crown between two great ones. Sonargur holds the northern shore of the strait and Parim the southern, and a lordship that means to outlast them both must learn which to heed, and when."
 zin_shared_north_lands_dark_shore_trade:0 "Traders of the Dark Shore"
 zin_shared_north_lands_dark_shore_trade_desc:0 "Furs, salt fish and iron go south, and silver of doubtful pedigree comes north."
 zin_shared_north_lands_dark_strait_watch:0 "Across the Dark Straits"
 zin_shared_north_lands_dark_strait_watch_desc:0 "Watchers on the south-western headlands note every sail from the Dark Lands."
 zin_shared_north_lands_elected_wardens:0 "Elected Wardens"
 zin_shared_north_lands_elected_wardens_desc:0 "The council elects wardens for the roads, the walls and the weights, and takes them from office when they fail. Honest dealing is not universal, but it is expected."
 zin_shared_north_lands_envoys_to_parim:0 "Envoys to Parim"
 zin_shared_north_lands_envoys_to_parim_desc:0 "An envoy of [ROOT.GetName] rides south with a letter and a modest gift to ask for the shield of Aenor. Whether a shield is offered, and what it costs, is a matter for the court at Parim."
 zin_shared_north_lands_fisherfolk:0 "Boats and Nets"
 zin_shared_north_lands_fisherfolk_desc:0 "Tarred hulls and strong nets feed the coast of [ROOT.GetName] and put new hands to work."
 zin_shared_north_lands_forest_trails:0 "Forest Trails"
 zin_shared_north_lands_forest_trails_desc:0 "Hunters and charcoal burners know every trail of the northern forests, and the crown pays them to teach the rest. A lantern at a trailhead means safe lodging for anyone who knows the sign."
 zin_shared_north_lands_forest_trails_spirit:0 "Forest Trails"
 zin_shared_north_lands_forest_trails_spirit_desc:0 "Lanterns at the trailheads and hunters for guides: the forests of [ROOT.GetName] are friends to its own and foes to strangers."
 zin_shared_north_lands_free_towns:0 "The Free Towns' Council"
 zin_shared_north_lands_free_towns_desc:0 "The burghers of [ROOT.GetName] tax themselves, build their own walls and listen to one another."
 zin_shared_north_lands_freeholders_moot:0 "The Freeholders' Moot"
 zin_shared_north_lands_freeholders_moot_2:0 "Old Rights Kept"
 zin_shared_north_lands_freeholders_moot_2_desc:0 "The old rights are read aloud each Deepwinter, and every freeholder of [ROOT.GetName] knows exactly what he is owed."
 zin_shared_north_lands_freeholders_moot_desc:0 "Every free farmer has a voice at the open-air moot, and what he hears there he keeps."
 zin_shared_north_lands_galleys_of_the_crown:0 "Galleys of the Crown"
 zin_shared_north_lands_galleys_of_the_crown_desc:0 "Long, narrow galleys are built for the winter coast, where sails fail and oars do not. Their crews drill in the bay until the oars rise and fall as one."
 zin_shared_north_lands_grain_and_fish:0 "Grain and Fish"
 zin_shared_north_lands_grain_and_fish_desc:0 "Barley in the valleys and herring in the cold bays keep the North fed. [ROOT.GetName] salts and stores both against the long winter, and the winter finds it ready."
 zin_shared_north_lands_grain_and_fish_spirit:0 "Grain and Fish"
 zin_shared_north_lands_grain_and_fish_spirit_desc:0 "Barley and salt herring keep the larders of [ROOT.GetName] full through the longest winter."
 zin_shared_north_lands_harbour_works:0 "Harbour Works"
 zin_shared_north_lands_harbour_works_desc:0 "Breakwaters of stacked stone, quays of oak and a slip for building hulls: the harbour of [ROOT.GetName] grows into a port that other crowns can find on a chart."
 zin_shared_north_lands_hearth_and_harbour:0 "Hearth and Harbour"
 zin_shared_north_lands_hearth_and_harbour_desc:0 "The hearth is the heart of every northern hall, and the road to market is its lifeline. [ROOT.GetName] raises a new Guild Workshop in its capital and straightens the road that leads from it."
 zin_shared_north_lands_hill_holds:0 "Hill Holds"
 zin_shared_north_lands_hill_holds_desc:0 "With no coast to guard, the crown guards its hills. Stone holds are raised or mended on the high ground above the capital, each with a well, a granary and a gate that one man can shut."
 zin_shared_north_lands_houses_watched:0 "A Watchful Crown"
 zin_shared_north_lands_houses_watched_desc:0 "The crown reads the ledgers of the Houses and the faces of their almoners, and has decided to trust neither."
 zin_shared_north_lands_island_crown:0 "An Island Crown"
 zin_shared_north_lands_island_crown_desc:0 "The sea is this crown's only road, its only wall and sometimes its only neighbour. [ROOT.GetName] takes the isle's long solitude for its own and builds its habits around it."
 zin_shared_north_lands_island_crown_spirit:0 "An Island Crown"
 zin_shared_north_lands_island_crown_spirit_desc:0 "The sea is the only road to [ROOT.GetName], and its people know every yard of it."
 zin_shared_north_lands_island_pilots:0 "Island Steersmen"
 zin_shared_north_lands_island_pilots_desc:0 "The steersmen of the isles know every shoal and tide-race between here and the mainland, and carry the knowledge in rhymes rather than charts. [ROOT.GetName] pays them to teach it to its young captains."
 zin_shared_north_lands_join_the_free_crowns:0 "Join the Free Crowns"
 zin_shared_north_lands_join_the_free_crowns_desc:0 "The Free Crowns of the North are a promise rather than an alliance: every crown keeps its own hall and its own banner. [ROOT.GetName] adds its name to the roll and agrees to answer when another crown calls."
 zin_shared_north_lands_keep_faith_with_parim:0 "Keep Faith with Parim"
 zin_shared_north_lands_keep_faith_with_parim_desc:0 "Oaths sworn at the Narrow Strait are not dropped because a greater crown drops them. [ROOT.GetName] sends word to Parim that it holds to the old alliance, and asks what its companies might do."
 zin_shared_north_lands_kin_of_the_north:0 "Kin of the North"
 zin_shared_north_lands_kin_of_the_north_desc:0 "The men of the North are one people in many halls, and they trade marriages and quarrels in about equal measure. [ROOT.GetName] strengthens the old ties with a feast and a sworn year of peace with its neighbours."
 zin_shared_north_lands_leren_banner:0 "Under the Leren Banner"
 zin_shared_north_lands_leren_banner_desc:0 "A Leren garrison and a Leren drillmaster have made the crown's host steadier, if not any freer."
 zin_shared_north_lands_leren_garrisons:0 "Leren Garrisons"
 zin_shared_north_lands_leren_garrisons_desc:0 "Sonargur sends engineers and masons to strengthen the crown's walls, and promises that the stones it lays will stand for the crown's sake as well as its own."
 zin_shared_north_lands_look_to_parim:0 "Look to Parim"
 zin_shared_north_lands_look_to_parim_desc:0 "Parim is the greater market, and its silver is older and cleaner than the Leren kind. [ROOT.GetName] writes to the court by the Great Lake, and does not mention that it reads Sonargur's letters too."
 zin_shared_north_lands_look_to_sonargur:0 "Look to Sonargur"
 zin_shared_north_lands_look_to_sonargur_desc:0 "The ships of Lerendor pass this shore all summer, and their captains dip a pennant to anyone who dips one back. [ROOT.GetName] lowers its banner to Sonargur first, and trusts the Leren court to remember who bowed early."
 zin_shared_north_lands_lords_men:0 "The Lord's Men"
 zin_shared_north_lands_lords_men_desc:0 "Stewards and sworn knights run the realm to the lord's measure, and the council is glad of the quiet."
 zin_shared_north_lands_market_fairs:0 "Market Fairs"
 zin_shared_north_lands_market_fairs_desc:0 "At midsummer the crown holds a fair on the common, and traders arrive from three coasts with wagons, mules and quarrels to settle. By week's end the quarrels are settled and the wagons are empty."
 zin_shared_north_lands_market_fairs_spirit:0 "Market Fairs"
 zin_shared_north_lands_market_fairs_spirit_desc:0 "Traders from three coasts come to the midsummer fair of [ROOT.GetName], and the whole realm profits from the noise."
 zin_shared_north_lands_mines_in_the_hills:0 "Mines in the Hills"
 zin_shared_north_lands_mines_in_the_hills_desc:0 "Iron and tin lie in veins under the hills, and the crown sinks new shafts where the old ones failed. The ore goes down the valley by cart in spring and by sledge in winter."
 zin_shared_north_lands_north_at_war:0 "The North at War"
 zin_shared_north_lands_north_at_war_desc:0 "The beacons are lit and the muster rolls are open. The crown of [ROOT.GetName] is ready, and knows it is not alone."
 zin_shared_north_lands_northern_companies:0 "Northern Companies"
 zin_shared_north_lands_northern_companies_desc:0 "A banner has been raised in the south to which the lords of the North may bring their companies without bowing to anyone. [ROOT.GetName] sends its own under its own colours, and keeps the right to bring them home."
 zin_shared_north_lands_northern_faith:0 "Northern Faith Kept"
 zin_shared_north_lands_northern_levies:0 "Northern Levies"
 zin_shared_north_lands_northern_levies_desc:0 "Northern boys can swing an axe before they can read, and the crown puts the knack to use. A yearly muster teaches them to do it in line, in step and under orders."
 zin_shared_north_lands_northern_smithies:0 "Northern Smithies"
 zin_shared_north_lands_northern_smithies_desc:0 "Iron comes down from the hills and goes out again as blades, helms and nails. The smiths of [ROOT.GetName] are given a hall of their own in the capital, with a new Armoury at its heart and a rule that no apprentice leaves before he can forge a true edge."
 zin_shared_north_lands_old_rights_kept:0 "Old Rights Kept"
 zin_shared_north_lands_old_rights_kept_desc:0 "The moot copies the old rights onto a long roll and reads them aloud each Deepwinter. Every freeholder hears what he is owed, and what the crown is owed in return."
 zin_shared_north_lands_our_own_counsel:0 "Our Own Counsel"
 zin_shared_north_lands_our_own_counsel_desc:0 "The crown has no wish to be anyone's lesser. [ROOT.GetName] takes its counsel at home before it takes it abroad, and tells both great courts, politely, that the answer will come when it is ready."
 zin_shared_north_lands_own_counsel:0 "Our Own Counsel"
 zin_shared_north_lands_own_counsel_desc:0 "The crown of [ROOT.GetName] takes its advice at home and answers to nobody for the habit."
 zin_shared_north_lands_parims_shield:0 "Parim's Shield"
 zin_shared_north_lands_shore_towers:0 "Shore Towers"
 zin_shared_north_lands_shore_towers_desc:0 "Square towers of grey stone rise along the cape road, each with a brazier on its roof and a gallery for a watch of six. They are as much a comfort as a defence."
 zin_shared_north_lands_shore_watch:0 "The Shore Watch"
 zin_shared_north_lands_shore_watch_desc:0 "Every beacon from cape to river mouth answers the next, and nothing comes ashore unannounced."
 zin_shared_north_lands_sonargurs_trust:0 "Sonargur's Trust"
 zin_shared_north_lands_sonargurs_trust_desc:0 "Years of faithful service have earned the crown a seat at Sonargur's table. Its lord is asked before the great decisions are made, and told afterward about the small ones."
 zin_shared_north_lands_stand_apart_with_sonargur:0 "Stand Apart with Sonargur"
 zin_shared_north_lands_stand_apart_with_sonargur_desc:0 "The old alliance with the south is over, and the North stands apart from it. [ROOT.GetName] stays beside Sonargur, believing a lone crown easier to break than a hall of crowns."
 zin_shared_north_lands_temples_and_almshouses:0 "Temples and Almshouses"
 zin_shared_north_lands_temples_and_almshouses_desc:0 "The Houses of the First Light have opened almshouses in the northern towns, where grey-robed almoners sent by [zin_loc_deliverer] feed the hungry and tend the sick for nothing. [ROOT.GetName] grants them land for a hospital and a kitchen and takes their help gladly."
 zin_shared_north_lands_the_compact_member:0 "The Compact Member"
 zin_shared_north_lands_the_compact_member_desc:0 "A seat in the Leren Compact brings a tall chair, a short oath and a long list of duties. [ROOT.GetName] takes the seat with some pride and the duties with some doubt."
 zin_shared_north_lands_the_free_towns_council:0 "The Free Towns' Council"
 zin_shared_north_lands_the_free_towns_council_desc:0 "The towns of [ROOT.GetName] have won their charters one by one and now sit together in a council of burghers. They tax themselves, build their own walls and write their own law."
 zin_shared_north_lands_the_freeholders_moot:0 "The Freeholders' Moot"
 zin_shared_north_lands_the_freeholders_moot_desc:0 "Every free farmer of [ROOT.GetName] has a voice at the moot, and the moot meets in the open air so that none may say he did not hear. Decisions are slow, but they are kept."
 zin_shared_north_lands_the_isle_keeps:0 "The Isle Keeps"
 zin_shared_north_lands_the_isle_keeps_desc:0 "Where a harbour is the only gate, a pair of stout keeps makes it a good one. Both sides of the harbour mouth now carry a stone tower, and a chain can be drawn between them."
 zin_shared_north_lands_the_lords_men:0 "The Lord's Men"
 zin_shared_north_lands_the_lords_men_desc:0 "Stewards, bailiffs and sworn knights hold the lord's land, and the lord's coin holds them. They are loyal while it lasts, and they make the realm run to the lord's measure."
 zin_shared_north_lands_the_north_at_war:0 "The North at War"
 zin_shared_north_lands_the_north_at_war_desc:0 "The beacons are lit, the horns are blown and the muster rolls are taken down from their pegs. For the first time in living memory the North must decide what it owes, and to whom."
 zin_shared_north_lands_the_shore_quiet:0 "The Shore Is Quiet"
 zin_shared_north_lands_the_shore_quiet_desc:0 "The beacons are out, the companies are home and the harbours slowly fill with ordinary ships again. [ROOT.GetName] counts its dead, mends its roofs and lets the shore be quiet."
 zin_shared_north_lands_the_shore_watch:0 "The Shore Watch"
 zin_shared_north_lands_the_shore_watch_desc:0 "From the cape to the river mouth every beacon answers the next. [ROOT.GetName] keeps its shore in sight by day and night, and expects to be told before anyone else."
 zin_shared_north_lands_the_upland_levy:0 "The Upland Levy"
 zin_shared_north_lands_the_upland_levy_desc:0 "Each hill farm sends one son to the muster in autumn, as each has done since the oldest roll. [ROOT.GetName] drills them through the winter, and they walk home in spring somewhat taller."
 zin_shared_north_lands_timber_rights:0 "Timber Rights"
 zin_shared_north_lands_timber_rights_desc:0 "The forests belong to the crown, and the crown grants the right to cut them in careful measure. A timber yard now turns each winter's felling into beams and planks for half the North."
 zin_shared_north_lands_trade_with_both_shores:0 "Trade with Both Shores"
 zin_shared_north_lands_trade_with_both_shores_desc:0 "Sonargur buys fish and furs and Parim buys timber and wool. [ROOT.GetName] sells to both, quarrels with neither, and finds that a merchant is welcome in any harbour that profits by him."
 zin_shared_north_lands_traders_of_the_dark_shore:0 "Traders of the Dark Shore"
 zin_shared_north_lands_traders_of_the_dark_shore_desc:0 "The orcs buy northern furs, salt fish and iron, and pay in silver that no one inquires about. The traders of [ROOT.GetName] go carefully, keep to the harbours and come home with full purses."
 zin_shared_north_lands_two_shore_trade:0 "Trade with Both Shores"
 zin_shared_north_lands_two_shore_trade_desc:0 "Merchants of [ROOT.GetName] sell to Sonargur and to Parim and are welcome in both."
 zin_shared_north_lands_under_the_leren_banner:0 "Under the Leren Banner"
 zin_shared_north_lands_under_the_leren_banner_desc:0 "The banner of Lerendor flies over the capital beside the crown's own, and its garrison eats at the crown's table. [ROOT.GetName] learns the Leren drill, the Leren law and the Leren manner of waiting."
 zin_shared_north_lands_village_roads:0 "Village Roads"
 zin_shared_north_lands_village_roads_desc:0 "Mud swallows carts in the thaw, and the northern roads have always been poor. [ROOT.GetName] sets gangs to lay gravel and split logs in the worst places, and carts come through in a day instead of a week."
 zin_shared_north_lands_watch_the_waters:0 "Watch the Waters"
 zin_shared_north_lands_watch_the_waters_desc:0 "Island fishers have begun to tell a tale of black sails in the far north. [ROOT.GetName] sends a few men to the headland to watch the horizon and report what they see."
 zin_shared_north_lands_whispers_from_the_holds:0 "Whispers from the Holds"
 zin_shared_north_lands_whispers_from_the_holds_desc:0 "Traders return from the Dark Lands with news that is not quite rumour and not quite truth. [ROOT.GetName] listens to all of it and decides later what to believe."
 zin_shared_north_lands.1.a:0 "Welcome them to the Compact."
 zin_shared_north_lands.1.b:0 "Not yet."
 zin_shared_north_lands.1.d:0 "Envoys of [FROM.GetName] have come to Sonargur with gifts and a letter asking for a seat in the Leren Compact. They have waited three days in the antechamber, and say they are willing to wait longer."
 zin_shared_north_lands.1.t:0 "[FROM.GetName] Asks for a Seat"
 zin_shared_north_lands.2.a:0 "Guarantee them."
 zin_shared_north_lands.2.b:0 "The North is Sonargur's affair."
 zin_shared_north_lands.2.d:0 "[FROM.GetName] fears the stronger crowns of the North and asks the court at Parim to stretch a shield over it. Its envoy stands in the hall and does not say what the crown will give in return."
 zin_shared_north_lands.2.t:0 "[FROM.GetName] Asks for Parim's Shield"
 zin_shared_north_lands.3.a:0 "Old wives' tales."
 zin_shared_north_lands.3.b:0 "Send a boat to look."
 zin_shared_north_lands.3.d:0 "Fishermen tell of black sails among the far islands. They were seen at dusk, low on the water and moving against the wind, and by morning they were gone."
 zin_shared_north_lands.3.t:0 "Black Sails Seen"
 zin_shared_north_lands.4.a:0 "Welcome them."
 zin_shared_north_lands.4.d:0 "Grey-robed almoners have opened their doors in the market town, with a ladle of broth for every beggar and a bandage for every wound. The townsfolk are wary of strangers, but they cannot fault their manners."
 zin_shared_north_lands.4.t:0 "The Almoners in the North"
 zin_shared_north_lands.5.a:0 "Note it."
 zin_shared_north_lands.5.b:0 "Tell Sonargur."
 zin_shared_north_lands.5.d:0 "Traders returning from the Dark Lands say that gifts are arriving in the orc holds from the south: silver, good iron and strange embassies. They cannot say who sends them, only that he has patience."
 zin_shared_north_lands.5.t:0 "Whispers from the Holds"
 zin_shared_north_lands.6.a:0 "Accept their companies."
 zin_shared_north_lands.6.b:0 "Parim needs no northern swords."
 zin_shared_north_lands.6.d:0 "While the greater crowns of the North turn away, [FROM.GetName] writes to Parim that it holds to the old alliance, and that its companies will come south if Parim wishes them."
 zin_shared_north_lands.6.t:0 "[FROM.GetName] Keeps Faith"
