l_english:
 zin_regional_bordon_a_hold_of_our_own:0 "A Hold of Our Own"
 zin_regional_bordon_a_hold_of_our_own_desc:0 "Bordag declares that the Black Road is Bordon's and will be held by Bordon. The declaration is nailed to the bar for every wagoner to read."
 zin_regional_bordon_a_voice_at_cocanoor:0 "A Voice at Cocanoor"
 zin_regional_bordon_a_voice_at_cocanoor_desc:0 "A speaker of Bordon is given a place in the Warking's council, at the far end of the table. His voice is small, but it is heard."
 zin_regional_bordon_accord_road:0 "Brutes on the Road"
 zin_regional_bordon_accord_road_desc:0 "Brute companies from Dondor are posted at the tollhouses and share the watch. A road guarded by strangers is guarded twice."
 zin_regional_bordon_ask_notbuton:0 "Ask Notbuton"
 zin_regional_bordon_ask_notbuton_desc:0 "A rider goes north-west to Notbuton, with a gift of road-salt and a question. Would the Accord take a toll-hold under its shield?"
 zin_regional_bordon_bordags_feast:0 "Bordag's Feast"
 zin_regional_bordon_bordags_feast_desc:0 "Once a year Bordag feeds every wagoner on the road in his long hall, and the tolls of that day are returned. It costs a great deal, and the road remembers it for the rest of the year."
 zin_regional_bordon_bordags_tollmen:0 "Bordag's Tollmen"
 zin_regional_bordon_bordags_tollmen_desc:0 "Tollmen in tarred cloaks work the bars, with Krugg the Tollmaster at the first of them. They are fair, thorough and impossible to bribe, which the caravan-masters resent and respect."
 zin_regional_bordon_bordon_at_war:0 "Bordon at War"
 zin_regional_bordon_bordon_at_war_desc:0 "The bar is closed, the horns are blown and every wagon-guard is put under arms. Bordon will keep the road, or it will keep nothing."
 zin_regional_bordon_brutes_on_the_road:0 "Brutes on the Road"
 zin_regional_bordon_brutes_on_the_road_desc:0 "Brute companies from Notbuton are posted at the tollhouses, broad men in salt-stiff cloaks who say little and see everything. The wagoners behave better in their company."
 zin_regional_bordon_caravan_inns:0 "Caravan Inns"
 zin_regional_bordon_caravan_inns_desc:0 "A string of inns is built along the road, a day's drive apart, each with a stable, a well and a barred gate. The caravan-masters pay to sleep behind walls."
 zin_regional_bordon_envoys_on_the_road:0 "Envoys on the Road"
 zin_regional_bordon_envoys_on_the_road_desc:0 "Riders from the south pay the toll in a coin nobody on the road has seen before. Grimsh the Envoy watches them go by and says only that they paid too much."
 zin_regional_bordon_let_them_pass:0 "Let Them Pass"
 zin_regional_bordon_let_them_pass_desc:0 "A road is only as honest as its tolls, and the southerners pay in coin that spends. Bordon lets them through, and notes that the bar has never been so busy."
 zin_regional_bordon_markets_of_cocanoor:0 "The Markets of Cocanoor"
 zin_regional_bordon_markets_of_cocanoor_desc:0 "Bordon opens its bar to Cocanoor's traders on easy terms and sells them the best of what passes. The roads bring silver, and Cocanoor learns to rely on them."
 zin_regional_bordon_milestones:0 "Milestones of Iron"
 zin_regional_bordon_milestones_desc:0 "Every thousand paces a stone of black iron is set at the roadside, cut with the road-hold's mark. A wagoner always knows how far he has come, and how far he is from Bordon's bar."
 zin_regional_bordon_own_hold:0 "A Hold of Our Own"
 zin_regional_bordon_own_hold_desc:0 "Bordon has resolved to be a hold in its own name, answerable to no hall, however great. The resolve is easy to state and hard to keep, which is what makes it worth keeping."
 zin_regional_bordon_road_ambush:0 "Road Ambushes"
 zin_regional_bordon_road_ambush_desc:0 "Goblin scouts and archers lie in the ditches along the Black Road, with a tally of every wagon that passes. A raider who leaves the road does not leave the ditch."
 zin_regional_bordon_road_ambushes:0 "Road Ambushes"
 zin_regional_bordon_road_ambushes_desc:0 "Goblin scouts take up their stations in the ditches along the road, each with a horn and a bag of caltrops. A raider who leaves the pavement does not usually leave the ditch."
 zin_regional_bordon_road_forges:0 "Road Forges"
 zin_regional_bordon_road_forges_desc:0 "Forges are set up at the inns to mend tyres and shoe horses, and in time they begin to make blades. Iron on the road is cheaper than iron in a mine."
 zin_regional_bordon_road_friends:0 "Friends of the Road"
 zin_regional_bordon_road_hold_council:0 "The Road-Hold Council"
 zin_regional_bordon_road_hold_council_desc:0 "Bordag calls the tollmen, the road-wardens and the inn-keepers to a common table. What they decide is the law of the road, and the law is read to every driver at the bar."
 zin_regional_bordon_road_pays:0 "The Road Pays"
 zin_regional_bordon_road_pays_desc:0 "Salt caravans, iron wagons and the odd silent rider pay their toll and move on. The ledger is the best fortress Bordon has."
 zin_regional_bordon_road_wardens_for_cocanoor:0 "Road-Wardens for Cocanoor"
 zin_regional_bordon_road_wardens_for_cocanoor_desc:0 "Bordon's road-wardens are lent to the Warking for his caravans of black iron, and ride beside them to the last milestone. They come home with good boots and a bad taste in the mouth."
 zin_regional_bordon_slip_the_yoke:0 "Slip the Yoke"
 zin_regional_bordon_slip_the_yoke_desc:0 "While the Warking is busy elsewhere, Bordon quietly stops sending the tithe and gains a little more freedom with every month that passes. By the time Cocanoor looks round, the bar may be Bordon's again."
 zin_regional_bordon_the_bordon_question:0 "The Bordon Question"
 zin_regional_bordon_the_bordon_question_desc:0 "Cocanoor's tallymen count the wagons on the Black Road and ask, quite politely, whose road it is. Bordon must give an answer, and the answer will say what sort of hold it is."
 zin_regional_bordon_the_iron_tithe_paid:0 "The Iron Tithe Paid"
 zin_regional_bordon_the_iron_tithe_paid_desc:0 "The first tithe of iron goes north to Cocanoor in sealed carts, and a Cocanoor tallyman signs for it with a flourish. Bordon is now beneath the yoke, and the sky has not fallen."
 zin_regional_bordon_the_old_road:0 "The Old Road"
 zin_regional_bordon_the_old_road_desc:0 "The Black Road is older than Goldoroth, and its paving shows it. Nadra Roadwife leads the road-wardens who patch it by night, and the road holds."
 zin_regional_bordon_the_road_after_the_war:0 "The Road After the War"
 zin_regional_bordon_the_road_after_the_war_desc:0 "The war is done, and the wagons come again. Bordag opens the bar, lights the lamps along the road and sends the first loaded cart north."
 zin_regional_bordon_the_road_hold:0 "The Road-Hold"
 zin_regional_bordon_the_road_hold_desc:0 "Bordag's inn-hall is also his fortress, with a toll-bar across the road and a watch on the roof. Every wagon of iron and every salt caravan stops here, and pays."
 zin_regional_bordon_the_road_pays:0 "The Road Pays"
 zin_regional_bordon_the_road_pays_desc:0 "The tolls are reckoned, the inns are filled and the ledgers balance at the turn of the year. The elders of Bordon agree that the road is a better holding than any hill."
 zin_regional_bordon_the_road_serves:0 "The Road Serves"
 zin_regional_bordon_the_road_serves_desc:0 "Whoever holds the yoke, the road is Bordon's work, and Bordon keeps it in repair. Fresh stones are laid at the tollhouses and milestones renewed."
 zin_regional_bordon_the_road_to_cocanoor:0 "The Road to Cocanoor"
 zin_regional_bordon_the_road_to_cocanoor_desc:0 "The Black Road is paved to the last milestone before Cocanoor's gates, and a banner of Bordon's colour is raised at its end. The way is open for all traffic, and every cart pays."
 zin_regional_bordon_tollmen:0 "Bordag's Tollmen"
 zin_regional_bordon_tollmen_desc:0 "Every wagon on the Black Road stops at a tollhouse, and every tollhouse has a tallyman who can write. Bordag collects his share and lets nobody forget where the road ends."
 zin_regional_bordon_tolls_of_the_black_road:0 "Tolls of the Black Road"
 zin_regional_bordon_tolls_of_the_black_road_desc:0 "Each load pays by weight, by value and by destination, and the tallymen keep three copies of every reckoning. The tolls are the hold's wealth and its pride."
 zin_regional_bordon_turn_them_back:0 "Turn Them Back"
 zin_regional_bordon_turn_them_back_desc:0 "The bar is shut against the southern riders, and the tollmen send them back the way they came. Bordon asks nothing of Nafeher, and means to be asked for less."
 zin_regional_bordon_turned_back:0 "Envoys Turned Back"
 zin_regional_bordon_voice_at_cocanoor:0 "A Voice at Cocanoor"
 zin_regional_bordon_voice_at_cocanoor_desc:0 "A speaker of Bordon sits at the Warking's table and is listened to, within reason. A small voice that is heard is better than a large one that is not."
 zin_regional_bordon_walls_on_the_road:0 "Walls on the Road"
 zin_regional_bordon_walls_on_the_road_desc:0 "Stone walls rise on either side of the bar, with towers at the corners and a gate that can be dropped in a moment. The road-hold now looks like what it has always been: a fort."
 zin_regional_bordon_warband_of_the_road:0 "Warband of the Road"
 zin_regional_bordon_warband_of_the_road_desc:0 "The road-hold raises a warband from the wagon-guards and tollmen's sons. They are tough and used to long marches, and good with the short axe."
 zin_regional_bordon_wear_the_light_yoke:0 "Wear the Light Yoke"
 zin_regional_bordon_wear_the_light_yoke_desc:0 "Bordag accepts the light yoke: a tithe in iron, a seat at the Warking's table and a promise that Cocanoor will leave the bar alone. It is not freedom, but it is not a chain either."
 zin_regional_bordon_word_from_the_moot:0 "Word from the Moot"
 zin_regional_bordon_word_from_the_moot_desc:0 "A messenger from the Free Moot reaches the bar with an invitation: the free holds are gathering, and the Black Road is welcome at their fire."
 zin_regional_bordon.1.a:0 "Raise the toll."
 zin_regional_bordon.1.b:0 "Keep the wagons coming."
 zin_regional_bordon.1.d:0 "A line of wagons waits at the toll-bar from dawn to dusk, and Bordag walks the line with a tally-stick. Prices on the road have risen, the drivers say, and so have the tolls."
 zin_regional_bordon.1.t:0 "Wagons on the Black Road"
 zin_regional_bordon.2.a:0 "Say nothing yet."
 zin_regional_bordon.2.d:0 "Tallymen from Cocanoor stand at the bar with slate and chalk and count every wagon that passes. When the count is done they ask, politely and without any emphasis, who the road belongs to."
 zin_regional_bordon.2.t:0 "Cocanoor Asks"
 zin_regional_bordon.3.a:0 "Bordon is too close to Cocanoor."
 zin_regional_bordon.3.b:0 "Bordon stands with us."
 zin_regional_bordon.3.d:0 "A rider from the Black Road stands in the great hall of Notbuton with a gift of road-salt. Bordon asks whether the Accord will have a toll-hold at its side, and does not say what it fears."
 zin_regional_bordon.3.t:0 "Bordon Asks for the Accord"
 zin_regional_bordon.4.a:0 "Take note."
 zin_regional_bordon.4.d:0 "Southern riders pay the toll in a coin nobody on the road has seen before. They ask no questions and speak little, and they are very careful to be remembered kindly."
 zin_regional_bordon.4.t:0 "Envoys on the Road"
