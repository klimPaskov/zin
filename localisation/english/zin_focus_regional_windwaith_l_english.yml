l_english:
 zin_regional_windwaith_a_harbour_compact:0 "A Harbour Compact"
 zin_regional_windwaith_a_harbour_compact_desc:0 "A compact would open Windwaith's quays to Coldor's hulls and Coldor's roads to Windwaith's cargo. It would also bind the Speaker to a table in Fandanar."
 zin_regional_windwaith_against_the_black_water:0 "Against the Black Water"
 zin_regional_windwaith_against_the_black_water_desc:0 "The dead are abroad on the northern waters, and the old men were right. Bunkers, beacons and watch-fires go up on every beach that the black hulls might choose."
 zin_regional_windwaith_arm_lights:0 "Lighthouses of the Arm"
 zin_regional_windwaith_arm_lights_desc:0 "A chain of lamps burns from the first fjord to the last, tended by families who have done nothing else for three generations. A ship that sees one sees the next."
 zin_regional_windwaith_black_water_watch:0 "Against the Black Water"
 zin_regional_windwaith_black_water_watch_desc:0 "Watch-towers, bunkers and signal-fires cover every beach where a black hull might come ashore. The coast has been made hard to land on, and hard to forget."
 zin_regional_windwaith_charts_and_soundings:0 "Charts and Soundings"
 zin_regional_windwaith_charts_and_soundings_desc:0 "Wayfinders' notebooks are copied into one great chart-book, with soundings, tide-tables and the shape of every hidden rock. The Council keeps three copies in three different halls."
 zin_regional_windwaith_coast_bows:0 "Bows of the Coast"
 zin_regional_windwaith_coast_bows_desc:0 "Fishermen's sons are taught the long bow on the dunes, shooting at floating barrels in a crosswind. Their arrows fly flat and far across open water."
 zin_regional_windwaith_convoys_to_the_heir:0 "Ships to the Heir's Host"
 zin_regional_windwaith_convoys_to_the_heir_desc:0 "Windwaith hulls leave the arm in a long line, heavy with grain, timber and iron for the host of the returned heir. They sail under the Council's pennant, and every captain knows the road might not be safe."
 zin_regional_windwaith_council_of_sails:0 "The Council of Sails"
 zin_regional_windwaith_council_of_sails_desc:0 "Speaker Furla Hozen calls the Council of Sails to order in a long hall built from the ribs of old ships. Fishermen, shipwrights and freeholders sit together on benches of pegged oak."
 zin_regional_windwaith_fish_and_seal:0 "Fish and Seal"
 zin_regional_windwaith_fish_and_seal_desc:0 "Salt fish and sealskin are the first cargo of every Windwaith ship, and the Council lays down grades and weights so that a barrel from the arm is trusted at every market."
 zin_regional_windwaith_fish_and_seal_trade:0 "Fish and Seal"
 zin_regional_windwaith_fish_and_seal_trade_desc:0 "Salt fish, rendered seal fat and sealskin fill the holds of every Windwaith ship that clears harbour. The trade is steady, smelly and dependable."
 zin_regional_windwaith_free_harbours:0 "Free Harbours"
 zin_regional_windwaith_free_harbours_desc:0 "The Council declares every harbour of the arm free to all hulls at one fee. Fandanar will call it a snub, and the hauliers will call it good sense."
 zin_regional_windwaith_harbour_for_strangers:0 "A Harbour for Strangers"
 zin_regional_windwaith_harbour_for_strangers_desc:0 "The Council quietly agrees that any honest sailor in need may take shelter and water in Windwaith harbours, no questions asked. Word of it travels along the coast faster than any ship."
 zin_regional_windwaith_harbour_guilds:0 "The Harbour Guilds"
 zin_regional_windwaith_harbour_guilds_desc:0 "The wayfinders, rope-makers, sail-makers and caulkers each keep a hall on the quay, and each sends a voice to the Council. A guild that is heard seldom strikes."
 zin_regional_windwaith_harbour_militia:0 "The Harbour Militia"
 zin_regional_windwaith_harbour_militia_desc:0 "Every quay keeps a muster-roll of men who can handle a rope and a spear. At the horn they gather by the harbour-master's hall and wait for the ships."
 zin_regional_windwaith_harbours_free:0 "Free Harbours"
 zin_regional_windwaith_harbours_free_desc:0 "Any hull may moor in a Windwaith harbour for the same fee, whatever flag it flies. The coast is richer for it and the harbour-masters are the busiest folk in the realm."
 zin_regional_windwaith_hear_the_fishermen:0 "Hear the Fishermen"
 zin_regional_windwaith_hear_the_fishermen_desc:0 "Old fishermen sit in the Council's anteroom and tell of black ships in the far north, hulls without lanterns that move against the wind. The Council listens with courtesy, and writes it all down."
 zin_regional_windwaith_hear_the_fishermen_tip_1:0 "Black ships in the north, the old men say. Nobody else believes them."
 zin_regional_windwaith_hulls_for_the_west:0 "Hulls for the West"
 zin_regional_windwaith_hulls_for_the_west_desc:0 "The Ford Council across the water wants ships, and Windwaith has the yards and the timber. The Council sells hulls on good terms and watches what flag they fly."
 zin_regional_windwaith_inland_freeholders:0 "The Inland Freeholders"
 zin_regional_windwaith_inland_freeholders_desc:0 "Behind the fjords lie the terraced farms and timber slopes of the freeholders, who remind the harbours that ships need bread and masts. They are given seats on the Council and they take them."
 zin_regional_windwaith_lighthouses_of_the_arm:0 "Lighthouses of the Arm"
 zin_regional_windwaith_lighthouses_of_the_arm_desc:0 "Every headland gets a lamp, and every lamp a keeper's family. The coast from fjord to fjord shines at night like a string of beads."
 zin_regional_windwaith_neutral_sails:0 "Neutral Sails"
 zin_regional_windwaith_neutral_sails_desc:0 "The Council declares every Windwaith hull neutral and has the proclamation read in every harbour. A neutral ship carries grain to hungry folk on either side, and the captains grow rich and careful."
 zin_regional_windwaith_open_council_rolls:0 "Open Council Rolls"
 zin_regional_windwaith_open_council_rolls_desc:0 "The rolls of the Council are opened to every freeholder with a boat or a plough. The harbours grumble at the crowd, and the steadings are pleased to be counted."
 zin_regional_windwaith_pilots_of_the_cold_coast:0 "Wayfinders of the Cold Coast"
 zin_regional_windwaith_pilots_of_the_cold_coast_desc:0 "The Council founds a school for wayfinders in the old fish-market, where boys learn the coast by lamplight. Its pupils are in demand from the West Lands to the Pupor Ocean."
 zin_regional_windwaith_sails_council:0 "The Council of Sails"
 zin_regional_windwaith_sails_council_desc:0 "The harbour guilds and the inland freeholders sit together under a roof of ship-timbers and argue about the price of everything. They almost always agree on the price of fish."
 zin_regional_windwaith_sails_for_the_living:0 "Sails for the Living"
 zin_regional_windwaith_sails_for_the_living_desc:0 "A few Council voices say that neutrality is a poor answer to a dying world. If the living of the south are to be fed and armed, Windwaith has the hulls to carry the grain and the blades."
 zin_regional_windwaith_sails_neutral:0 "Neutral Sails"
 zin_regional_windwaith_sails_neutral_desc:0 "Windwaith ships carry grain to every harbour that pays and war-goods to none. The Council has put it in writing, and the captains have signed."
 zin_regional_windwaith_sea_soldiers:0 "Sea Soldiers"
 zin_regional_windwaith_sea_soldiers_desc:0 "The militia is drilled to land from small boats in the surf and fight at the water's edge. They learn to hold a wet beach for an hour, which is long enough."
 zin_regional_windwaith_sea_soldiers_drilled:0 "Sea Soldiers"
 zin_regional_windwaith_sea_soldiers_drilled_desc:0 "Fishermen and sealers taught to fight from a deck and to land from a boat. They come ashore wet, cold and very angry."
 zin_regional_windwaith_sea_wardens:0 "Sea-Wardens"
 zin_regional_windwaith_sea_wardens_desc:0 "Captain Tamsin Gale commands the Sea-Wardens, a standing watch of fast hulls that police the lanes and hunt sea-raiders. Her crews can read a sail on the horizon as other folk read a face."
 zin_regional_windwaith_shared_lighthouses:0 "Shared Lighthouses"
 zin_regional_windwaith_shared_lighthouses_desc:0 "Under the compact, Coldor's lamp-keepers and Windwaith's tend the same beacons, and a ship may follow the light from the first fjord to the last. The two coasts become one road."
 zin_regional_windwaith_shipwrights_of_the_arm:0 "Shipwrights of the Arm"
 zin_regional_windwaith_shipwrights_of_the_arm_desc:0 "Timber slopes come down to the water all along the arm, and every fjord has its yard. The shipwrights' guild decides who may build, and what they may call the result."
 zin_regional_windwaith_terms_from_fandanar:0 "Terms from Fandanar"
 zin_regional_windwaith_terms_from_fandanar_desc:0 "Fandanar's harbour-masters write to the Council with terms for sharing the western trade. They are polite, precise and plainly hungry for a share."
 zin_regional_windwaith_terms_from_fandanar_tip_1:0 "Fandanar's harbour-masters want a share of our trade."
 zin_regional_windwaith_the_carrying_trade:0 "The Carrying Trade"
 zin_regional_windwaith_the_carrying_trade_desc:0 "Windwaith ships carry timber to the West Lands, wool to Triton's Islands and wine back again. Harbour-Warden Odo Fenn keeps the ledger and knows what every captain owes."
 zin_regional_windwaith_the_cold_sea_watch:0 "The Cold Sea Watch"
 zin_regional_windwaith_the_cold_sea_watch_desc:0 "A stone watch-tower is raised at each headland where black water meets the open sea. Its fire is lit at dusk and tended until the dawn."
 zin_regional_windwaith_the_free_harbours_endure:0 "The Free Harbours Endure"
 zin_regional_windwaith_the_free_harbours_endure_desc:0 "The war is over and the harbours are still free. The Council raises a new lamp at the head of the arm and names it for every hull that was lost."
 zin_regional_windwaith_the_long_hulls:0 "The Long Hulls"
 zin_regional_windwaith_the_long_hulls_desc:0 "The yards turn to heavier keels, with broad beams and high castles for archers. The Long Hulls are slower than galleys, and a great deal harder to board."
 zin_regional_windwaith_the_speakers_seat:0 "The Speaker's Seat"
 zin_regional_windwaith_the_speakers_seat_desc:0 "Every fourth winter the Council chooses its Speaker by a count of hands, and the whole coast waits on the result. Furla Hozen has held the seat twice already."
 zin_regional_windwaith_the_windward_host:0 "The Windward Host"
 zin_regional_windwaith_the_windward_host_desc:0 "Militia, sea soldiers and bowmen are brought together under the Council's banner and marched along the coast road. It is a small host, but it knows every beach it may have to defend."
 zin_regional_windwaith_the_windward_squadron:0 "The Windward Fleet"
 zin_regional_windwaith_the_windward_squadron_desc:0 "The first Long Hulls are joined into a fleet under the Council's own pennant. It sails the length of the arm each season and returns with a tally of every ship it met."
 zin_regional_windwaith_war_galleys:0 "War Galleys"
 zin_regional_windwaith_war_galleys_desc:0 "Long, narrow hulls with two banks of oars and a ram of bronze are laid down alongside the traders. Windwaith builds ships for pursuit and for defence, and the trade is the same in either case."
 zin_regional_windwaith_when_the_south_burns:0 "When the South Burns"
 zin_regional_windwaith_when_the_south_burns_desc:0 "Ships bring news of fire in the south, and the quays are crowded with listeners. The Council meets by lamplight to decide what Windwaith owes to the war and what it owes to its own coast."
 zin_regional_windwaith_windward_council:0 "The Council of the Windward Coast"
 zin_regional_windwaith_windward_council_desc:0 "The rolls are open to any freeholder with a boat or a plough, and the Speaker is chosen by all. A council that includes the whole coast is slow to anger and slower to be bought."
 zin_regional_windwaith_windward_harbours:0 "The Windward Harbours"
 zin_regional_windwaith_windward_harbours_desc:0 "The long arm of Windwaith holds a hundred harbours, and the Council names twelve to be made fit for the great hulls. Quays are lengthened and the dredgers set to work."
 zin_regional_windwaith_windward_squadron:0 "The Windward Fleet"
 zin_regional_windwaith_windward_squadron_desc:0 "A line of long hulls keeps the lanes between the fjords and the open sea. The captains know every skerry and every sandbar by the sound of the water."
 zin_regional_windwaith.1.a:0 "The harbours carry the vote."
 zin_regional_windwaith.1.b:0 "The steadings carry the vote."
 zin_regional_windwaith.1.d:0 "The hands are counted twice in the long hall, once by the harbours and once by the steadings. This year the count is close, and both sides wait for the Speaker to say what the Council has decided."
 zin_regional_windwaith.1.t:0 "The Council of Sails Votes"
 zin_regional_windwaith.2.a:0 "Refuse the compact"
 zin_regional_windwaith.2.b:0 "Agree the compact"
 zin_regional_windwaith.2.d:0 "The Speaker of Windwaith writes to Fandanar in her own hand. The carrying trade of the western seas could be shared, she says, if the Winter Crown will meet the Council as a friend and not as a landlord."
 zin_regional_windwaith.2.t:0 "Windwaith Asks for Terms"
