l_english:
 zin_chr_1001_p1:0 "Nearly three hundred crowns, dominions, clans and island lordships divide Aoaz, and a handful of them are great powers. Each great power leads a league of lesser crowns, and most have a rival whom they watch more closely than any other neighbour.\n\nAenor, the Middle Kingdom, rules from Parim and leads the Middle Kingdom Concord, and its rivals are Lerendor and Zol. Lerendor rules from Sonargur and leads the Leren Compact with Eekedor. Coldor rules the frozen interior and western ports of the Cold Lands from Fandanar and leads the Northern Accord with Horidor, and Isengard is its rival."
 zin_chr_1001_p2:0 "In the East Lands, Noris rules from Furvior and holds the Noris Treaty with Gondolin, and Stabilo rules from Postondoroth and holds the Stabilo Pact with Drak; each is the other's rival on the southern trade roads. In the Dark Lands, Goldoroth rules from Cocanoor and is rival to Dondor, which rules from Notbuton and leads the Dark Sea Accord with Belonton."
 zin_chr_1001_p3:0 "In the south the ancient Great Spirit Volgan rules the Ember Lands from Nafeher and leads the Southern Dominion of Demon, Dolon and Nezer, and Mirolon is his rival. The black north and the islands of the Kusmeel belong to Zol, the Old God of Death, whose seat is Furviatlon. Zol has no bodily form and no crown of men among his allies, but he does not lack servants, and the most loyal of them is the Great Spirit Kusven."
 zin_chr_1001_p4:0 "The terms on which these leagues were first sworn are not written in the histories of Parim and Selen. Some realms stand in no league at all: Bordon, Dreson, Dulundur and the Troll Forest keep their own counsel, and Hirolon of the giants treats with Aenor as a sovereign kingdom."
 zin_chr_1001_plate:0 "GFX_zin_chr_plate_cat_orders"
 zin_chr_1001_short:0 "The Crowns of Aoaz"
 zin_chr_1001_sub:0 "Fourth Age · Powers"
 zin_chr_1001_title:0 "The Crowns of Aoaz"
 zin_chr_1002_p1:0 "Aenor, the Middle Kingdom, is the central great power of Aoaz. From Parim it rules the plains, forests, mountains and Great Lake of the Middle Lands, and Aenor Isle with Asgard lies off its west coast. Aen founded it by uniting the kingdoms of men after the War of Men, and his victory began Year 1 of the First Age. The scholars do not agree whether the kingdom takes its name from Aen."
 zin_chr_1002_p2:0 "Aenor leads the Middle Kingdom Concord of twenty-six chartered dominions, among them Selen, Kilinti, Kingson, Konori, Hunhun, Asgard and Herez. Under the Charters of Parim each keeps its own lords and laws. Selen has its rangers, Kilinti its ents and forest peoples and Hunhun its riders, while Kingson lies behind the Great Wall and Herez on the southern marches. In war they owe a common army, and in peace they share free roads."
 zin_chr_1002_p3:0 "The Cursed Lands and the Bloody Forest resist the crown, and Hirolon, the sovereign kingdom of the giants, treats with Aenor from outside the Charters. Whether each dominion is a member of the kingdom or a realm allied to it, the lawyers of Parim have argued for centuries without agreeing.\n\nAenor fell to Elzon at the end of the Second Age and was ruled by him through the Third. Restored at his death, it grew through the Fourth Age until it was as formidable as it had ever been, and in 4A 1748 it is rich, crowded and sure of its blessings."
 zin_chr_1002_plate:0 "GFX_zin_chr_plate_aenor_concord"
 zin_chr_1002_short:0 "Aenor and the Concord"
 zin_chr_1002_sub:0 "Fourth Age · Kingdom"
 zin_chr_1002_title:0 "Aenor and the Concord"
 zin_chr_1003_p1:0 "In Parim the Golden Court means two things. It is the palace district of gilded halls that the Golden King completed in 4A 1733, where offices, titles and charters are bought, and it is the King's party: the office-buyers, courtiers and merchant houses who profit from his extravagance.\n\nIts members are loyal to the King because the King is profitable. They pay for their offices and recover the price from the offices, they flatter him and are favoured, and the dominions whose taxes pay for the gilding grumble at them more loudly than at the King himself."
 zin_chr_1003_p2:0 "The old families of Parim who did not buy their places look on the Golden Court with contempt and do business with it every day."
 zin_chr_1003_plate:0 "GFX_zin_chr_plate_cat_orders"
 zin_chr_1003_short:0 "The Golden Court"
 zin_chr_1003_sub:0 "Fourth Age · Court"
 zin_chr_1003_title:0 "The Golden Court"
 zin_chr_1004_p1:0 "In 4A 1741 the Golden King founded the Lost Cause, a league of the Concord and willing foreign crowns against “the powers of the dark”. He named himself its first lord and spent its first treasury on a triumph. It was formed to guard the kingdom against the return of dark powers such as Volgan, and it was formed just as much for the King's prestige."
 zin_chr_1004_p2:0 "Its councils and alliances are real enough, but its founder uses it for his own glory, and his corruption has weakened trust in it. Most of Aoaz treats it as royal vanity against old legends. Its court branch is ceremonial, while its frontier companies, rangers and scholars are real and take it seriously, and some of its officers are genuine defenders of Aenor.\n\nIts scholars hold that the old holy things of Aoaz must be kept from the dark, and above all the crystal that Horos guards in the Castle of Yeldenne, which they would see protected."
 zin_chr_1004_plate:0 "GFX_zin_chr_plate_lost_cause"
 zin_chr_1004_short:0 "The Lost Cause"
 zin_chr_1004_sub:0 "Fourth Age · League"
 zin_chr_1004_title:0 "The Lost Cause"
 zin_chr_1004_x1_p1:0 "The Lost Cause outgrew its founder. Its companies and allied crowns became the shield of the Concord, and the dominions that had laughed at the King's league stood behind it when the danger came."
 zin_chr_1004_x2_p1:0 "The Lost Cause went over to the Man from the Ice. Its frontier companies and scholars, who had gathered proof of his ancestry, became his army, and the league that the Golden King founded for his own glory fought for another man's cause."
 zin_chr_1005_p1:0 "The Houses of the First Light began as refuges, hospitals and grain stores in the ruined towns of the Third Age, where their healers and scribes built on the medicine and farming of the Second Age. They are the relief houses of the Deliverer, and many of their people are sincere workers of charity.\n\nIn 4A 11 the Houses received royal charters to keep the grain stores, hospitals and birth rolls of the kingdom. Their physicians have taught at the universities of Parim and Selen since 4A 340."
 zin_chr_1005_p2:0 "Over the centuries the Houses became among the most trusted bodies of the restored kingdom. Their hand is in charity, schooling and the public records of every province, and there are few families in Aenor that they have not fed, nursed or written down."
 zin_chr_1005_plate:0 "GFX_zin_chr_plate_houses_first_light"
 zin_chr_1005_short:0 "Houses of the First Light"
 zin_chr_1005_sub:0 "Fourth Age · Order"
 zin_chr_1005_title:0 "The Houses of the First Light"
 zin_chr_1005_x1_p1:0 "The Houses were Afrit's from the beginning. They grew from the Houses of Refuge of the Second Age, where his hidden followers made each gift of grain, medicine or shelter into a small obligation that could pass from a family to a guild, a temple or a lord. Every sincere House that honoured the Deliverer was one more channel for his influence.\n\nBy the Fourth Age the Houses could sway appointments, royal marriages, charity, records, schooling and taxes. Their rolls told the Hidden Council who lived where and who moved, and their grain stores told it who could be made grateful. Few of the healers ever knew whom they served."
 zin_chr_1006_p1:0 "About 4A 1520 a temple-state grew in the Zilin Hills of the Magical Lands around a hermitage of the Deliverer. The Worshipdom holds three valleys and almost no army. Its worth lies in the pilgrims, couriers and confessors who pass through it on their way to every court in Aoaz.\n\nIt is the one land of the Deliverer that answers to his priests alone. Kings send gifts to its hermitage, pilgrims climb to it from every region, and its couriers carry letters faster than most royal posts."
 zin_chr_1006_plate:0 "GFX_zin_chr_plate_worshipdom"
 zin_chr_1006_short:0 "The Worshipdom"
 zin_chr_1006_sub:0 "Fourth Age · Temple-State"
 zin_chr_1006_title:0 "The Worshipdom"
 zin_chr_1006_x1_p1:0 "The Worshipdom is the visible hub of Afrit's network. Afrit holds no clear dominion of his own, and his strength lies in the networks he keeps everywhere. The agents who pass through the Zilin Hills as pilgrims and couriers carry his orders out and bring the secrets of every court back."
 zin_chr_1007_p1:0 "Through the Fourth Age Afrit kept a council and many servants, agents, spies and networks. It influenced the kings of Aenor and in the end ruled much of their administration from behind the throne. Ordinary worshippers know him by the human name Aurevan, and only his inner council knows him as Afrit.\n\nThe Council took its lasting form about 4A 1100, with four seats for royal administration, worship, foreign agents and the recovery of artifacts. It works through the temples, the relief houses, foreign envoys, gatherers of secrets and merchant connections. Its members, their titles and their quarrels are not known outside it."
 zin_chr_1007_p2:0 "Merovan, Keeper of the Seals, holds the seals of administration and is the member whom Afrit trusts to hold Aenor in his absence. The Golden King is one of the least capable kings the Council has ever managed.\n\nBeyond Aenor the Council has worked for centuries to strengthen its hold in the East Lands and South Lands. Its eastern branch has courted their courts since about 4A 1300, so that Afrit has a reserve seat of power if Aenor is ever threatened."
 zin_chr_1007_plate:0 "GFX_zin_chr_plate_cat_orders"
 zin_chr_1007_short:0 "The Hidden Council"
 zin_chr_1007_sub:0 "Fourth Age · Council"
 zin_chr_1007_title:0 "The Hidden Council"
 zin_chr_1007_x1_p1:0 "No chronicle tells what became of the Hidden Council after Afrit's death, nor of Merovan of the Seals, nor of the men in many courts who had served it."
 zin_chr_1008_p1:0 "Volgan, the ancient Great Spirit and principal dark lord of Aoaz, rules the Ember Lands south of the Middle Lands from Nafeher. His Southern Dominion takes in the demon realms of Demon, Dolon and Nezer, whose old name is Nazerun. His realm holds grave hosts, Netherborn demons, orcs, ogres, monster clans and necromantic orders.\n\nAbout 4A 1650 Volgan's strength returned. Demon, Dolon and Nezer swore to him and formed the Southern Dominion, and Mirolon fortified its passes. Mirolon, the human kingdom that Volgan conquered in the First Age, is free again and stands in his way."
 zin_chr_1008_p2:0 "Volgan's authority does not reach every monster of the Dark Lands or of the north, and he is no Old God, so his necromancy is not an authority over Death itself. In the far south of the Ember Lands lie the Nether, the seat of the King of Demons, and the Abyss, which are places of their own.\n\nFor a century Volgan has rebuilt his strength behind the storms and heat of the Ember Lands, and few outside Mirolon watch him."
 zin_chr_1008_plate:0 "GFX_zin_chr_plate_southern_dominion"
 zin_chr_1008_short:0 "The Southern Dominion"
 zin_chr_1008_sub:0 "Fourth Age · Dominion"
 zin_chr_1008_title:0 "The Southern Dominion"
 zin_chr_1008_x1_p1:0 "Volgan's manifested body was destroyed, and with it broke many of the bonds that held his hosts together. Whether his spirit survives is not known."
 zin_chr_1009_p1:0 "In 4A 512 the North Lands and Aenor signed the Treaty of the Narrow Strait and promised each other defence across the strait. It is the “old alliance” of the North, and under it the North Lands must defend Aenor in war.\n\nLerendor's fleets guard the strait, and its kings are proud. Since the toll quarrel of 4A 1716 the Leren court has doubted the Treaty, and in Sonargur men argue whether to honour it, to break it, or to make it the means of Leren mastery over the strait."
 zin_chr_1009_plate:0 "GFX_zin_chr_plate_cat_orders"
 zin_chr_1009_short:0 "The Treaty of the Narrow Strait"
 zin_chr_1009_sub:0 "Fourth Age · Treaty"
 zin_chr_1009_title:0 "The Treaty of the Narrow Strait"
 zin_chr_1009_x1_p1:0 "Lerendor withdrew from the Treaty of the Narrow Strait. The old alliance of the North was ended, and Aenor faced its enemies without the Leren fleets at its side."
 zin_chr_1009_x2_p1:0 "Lerendor honoured the Treaty of the Narrow Strait. When Aenor was attacked, the Leren crown went to its defence as its forefathers had sworn in 4A 512, and the old alliance of the North held."
 zin_chr_101_p1:0 "He Who Was, Is and Will Be is the supreme Creator, the God of all gods and of the universe. He is known by that title alone. He stands beyond the Holy Seven, beyond the Old Gods and the New Gods, and beyond every other being in the order of being.\n\nNo chronicle tells of any rival or peer to Him, of any shape in which He has shown Himself, or of any priesthood or worship kept in His name. He is too remote to take any part in the wars and crowns of Aoaz. How He made the Seven, and how He made all that exists, no chronicle tells."
 zin_chr_101_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_101_short:0 "He Who Was, Is and Will Be"
 zin_chr_101_sub:0 "Before the Ages · The Creator"
 zin_chr_101_title:0 "He Who Was, Is and Will Be"
 zin_chr_1010_p1:0 "The Golden King's sudden death left Aenor with a succession that no ordinary claimant could settle. Four camps contended for the crown: the Golden Court, the Free Dominions, the Deliverer's Faithful and the Stranger's Host.\n\nThe Golden Court was the late King's party of office-buyers, courtiers and merchant houses, who wanted the gilded order to go on under a new head. The Free Dominions were the chartered dominions that wanted their liberties under the Charters of Parim and no master in Parim stronger than themselves."
 zin_chr_1010_p2:0 "The Deliverer's Faithful held that the god who had kept the kingdom for centuries should keep it now, and the temples and much of the royal council stood with them. The Stranger's Host was the people's own camp of common folk, frontier soldiers and the poor of the dominions, who wanted a king that owed nothing to the court and whose hopes gathered around the stranger called the Man from the Ice.\n\nThe King's death decided nothing between them. Which camp would prevail was not settled when he was buried, and the histories of Parim and Selen record the struggle as it went."
 zin_chr_1010_plate:0 "GFX_zin_chr_plate_four_camps"
 zin_chr_1010_short:0 "The Four Camps"
 zin_chr_1010_sub:0 "Fourth Age · Succession"
 zin_chr_1010_title:0 "The Four Camps"
 zin_chr_1010_x1_p1:0 "The Deliverer's Faithful were Afrit's supporters. Many of the priests and councillors who called for the god's protection did so sincerely, but they were following the design of the Hidden Council, which had arranged the King's death and the crisis that followed it."
 zin_chr_1010_x2_p1:0 "The Stranger's Host was Eindil's Host. The man whom the common folk followed as the Man from the Ice was Eindil, son of Ein, son of Aen, and the people's camp was the camp of the old royal line."
 zin_chr_102_p1:0 "Below He Who Was, Is and Will Be, and above every ordinary order of being, stand the Holy Seven. They are the seven overwhelmingly powerful creators of the cosmos, and they made both the Old Gods and the New Gods.\n\nThe Seven are too vast and too far removed to take any part in the daily history of Aoaz. Most people of Aoaz do not believe that they ever existed. Ordinary folk know the Old Gods and the New Gods, but the Seven survive only as faint traces in the most distant myths."
 zin_chr_102_p2:0 "The oldest writings call them the Seven Before Names, as if they came before naming, speech and history. Among sceptics they are the Seven Who Never Were, a dismissal of the oldest tales of creation. Later scholars mostly treat such manuscripts as fable.\n\nTheir own names, the powers each of them held, how often they acted and in what shape, no chronicle tells. Nor is it known whether He Who Was, Is and Will Be made them directly, or how such a making came to pass."
 zin_chr_102_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_102_short:0 "The Holy Seven"
 zin_chr_102_sub:0 "Before the Ages · The Makers"
 zin_chr_102_title:0 "The Holy Seven"
 zin_chr_103_p1:0 "The scholars of Parim and Selen set out the order of being in two levels. Far above all stand He Who Was, Is and Will Be, the supreme Creator, and below Him the Holy Seven, the makers of the gods, all but absent from history. Beneath them lie the five ordinary orders, the beings the folk of Aoaz may meet."
 zin_chr_103_p2:0 "First are the Gods, immortal, two generations within one order: the Old Gods and the New Gods. Next come the Great Spirits, the first rank of spirits, among them Volgan. Then come the Lesser Spirits, some strong enough to be taken for gods. Fourth are the Great Folk, elves, angels, demons and other immortals who are not spirits. Last are the Common Folk, men, dwarves and other mortal beings."
 zin_chr_103_p3:0 "Only the Common Folk are mortal. Yet immortal does not mean unkillable. Golbran does not age, and still he can die; devils are bound to their bodies and can be slain. Whether immortal means only that a being does not age, in every order, is not known. Nor do the scholars agree to which order, if any, the ghosts, revenants and roaming dead belong."
 zin_chr_103_p4:0 "The order records the kind of a being, not who wins when two of them meet. The Old Gods hold more fundamental power than the New Gods, yet the Fading binds them. Volgan, a Great Spirit, wields enormous power over realms and armies, and he once overcame a New God, though he is of a lower order. Rank is no measure of victory.\n\nIt is not known how many Old Gods and New Gods exist beyond Aoaz, how many lesser New Gods there are or what they are called, or how the immortal Great Folk first came into being."
 zin_chr_103_plate:0 "GFX_zin_chr_plate_order_of_being"
 zin_chr_103_short:0 "The Order of Being"
 zin_chr_103_sub:0 "All Ages · Order of Being"
 zin_chr_103_title:0 "The Order of Being"
 zin_chr_104_p1:0 "The Old Gods are the first generation of gods, almost unimaginably ancient. The Holy Seven made them before the New Gods, and in the beginning they held far more power than the New Gods.\n\nAcross immense spans of time their strength, and their ability to wield it, have faded. This is called the Fading. The Old Gods are generally unable to take an active bodily form, and they rarely touch the world openly. Even so, an Old God in decline remains enormously powerful."
 zin_chr_104_p2:0 "Zol, the God of Death, is an Old God and the only Old God in Aoaz. That does not prove that no Old Gods exist elsewhere, beyond Aoaz. Zol is also the exception to any simple tale of decline: his power grows slowly, every day, though the magic of Aoaz makes it hard for him to channel that power or take shape."
 zin_chr_104_p3:0 "The Old Gods are known to the people of Aoaz from myth and old religion, though most think of them as lost or idle. The tales do not agree. One faith holds that the Old Gods are dead, another that they sleep, a third that they are hostile, and others say that they went away or hid themselves. What causes the Fading, no chronicle tells."
 zin_chr_104_plate:0 "GFX_zin_chr_plate_old_gods"
 zin_chr_104_short:0 "The Old Gods"
 zin_chr_104_sub:0 "Before the Ages · Gods"
 zin_chr_104_title:0 "The Old Gods"
 zin_chr_105_p1:0 "The New Gods are a later generation of gods, made by the Holy Seven. They are younger than the Old Gods and less powerful at root, but widely known throughout Aoaz, and many are worshipped openly. Twelve main New Gods answer the twelve needs of mortals, and each of the twelve months honours one of them.\n\nIn the order of the year the first six are Glernaen, of strength and counsel; Sulethe, of healing; Lumae, of shelter and the hearth; Maelwen, of fair weather and safe waters; Vaelei, of kin and birth; and Rasthel, of safe roads and fair exchange."
 zin_chr_105_p2:0 "After them come Kerun, of protection; Aurlan, of daily bread; Ailtal, of justice and kept promises; Irumas, of skill and work; Gaelor, of a good death and remembrance; and Naisa, of hope and fortune. Glernaen, the God of Power and Wisdom, is the mightiest of the twelve.\n\nThe gods are never shown in the shape of men. Temple art shows them as presences of the heavens: light, stars, celestial forms and their signs made of the sky. No halo, no saintly face and no human body stands for a god."
 zin_chr_105_p3:0 "Beside the twelve stand the lesser New Gods, whom no month honours, yet they are stronger than most Great Spirits. Their number and names are not known.\n\nThe Deliverer, whom Aoaz hailed as a New God for saving the world from Elzon at the end of the Third Age, is not one of the twelve. His worshippers keep a feast in his honour, not a month."
 zin_chr_105_plate:0 "GFX_zin_chr_plate_new_gods"
 zin_chr_105_short:0 "The New Gods"
 zin_chr_105_sub:0 "All Ages · Gods"
 zin_chr_105_title:0 "The New Gods"
 zin_chr_105_x1_p1:0 "The Deliverer was Afrit. His worship was real, and so were his powers. Whether he ever belonged to the order of New Gods that the Holy Seven made is not known, and the faith of his priests proves nothing either way."
 zin_chr_106_p1:0 "The Fading is the power that binds the ancient Old Gods. Across extremely long ages their ability to wield their power, and to keep an active bodily form, has dwindled, though they still hold vast power within them.\n\nThe Fading is one reason why Zol cannot simply take a body, conquer Aoaz or use his enormous power freely. The other is the unusual magic of Aoaz itself, which resists his kind of divine power or fails to support it."
 zin_chr_106_p2:0 "The Fading does not mean that Zol grows weaker. He gains power every day, very slowly, and still the Fading holds him. How much power he has, and how much of it he can show or direct in Aoaz, are separate matters.\n\nNo chronicle says that such a lapse would destroy him throughout the cosmos."
 zin_chr_106_p3:0 "What causes the Fading, no chronicle tells. Some scholars tie it to the great age of the Old Gods, some to the history of the cosmos or to a law beneath it, and some hold that the essence of the Old Gods has grown into the foundations of the world itself. The scholars do not agree whether any of these is true."
 zin_chr_106_plate:0 "GFX_zin_chr_plate_the_fading"
 zin_chr_106_short:0 "The Fading"
 zin_chr_106_sub:0 "All Ages · Order of Being"
 zin_chr_106_title:0 "The Fading"
 zin_chr_107_p1:0 "Aoaz holds a magic of its own, or a condition of magic, that Zol finds unusually hard to draw upon or to work through. Together with the Fading, it sharply limits how freely he can act, immensely powerful though he remains.\n\nMagic runs in the folk of Aoaz as well. The earliest generations of men were naturally better at magic than later men, and some of them held powers like those of gods without being gods. Aen himself was born from magic and power."
 zin_chr_107_p2:0 "Some powers draw strength from particular lands. Elzon's necromancy was sustained by the magic of the Ember Lands, and he lost power when he stayed in Aenor. He could not fully conquer the Magical Lands, where Varner, a Lesser Spirit, could lift the curse of the dead.\n\nWhether the magic that resists Zol differs from land to land or from realm to realm, the scholars do not agree. Nor is it known whether Zol finds a more fitting magic outside Aoaz."
 zin_chr_107_p3:0 "Many traditions of magic are practised in Aoaz, and Varner is one practitioner among many. Bastian, a living human wizard and Varner's contemporary, is famous throughout the Middle Lands.\n\nThe scholars distinguish four things in any great power: the power it holds, its ability to channel that power, its presence in a land, and its bodily shape. A being may have much of the first and little of the others, as Zol does."
 zin_chr_107_plate:0 "GFX_zin_chr_plate_magic_of_aoaz"
 zin_chr_107_short:0 "The Magic of Aoaz"
 zin_chr_107_sub:0 "All Ages · Magic"
 zin_chr_107_title:0 "The Magic of Aoaz"
 zin_chr_108_p1:0 "The people of Aoaz generally know the New Gods and the Old Gods, at least from their stories. Almost nobody holds the Holy Seven to be real beings of history, and He Who Was, Is and Will Be lies further still beyond common belief.\n\nMortals often take powerful Lesser Spirits for gods, and Great Spirits too can be worshipped. What people believe about a being's rank is no sure proof of its true order. A town may raise a temple to a local Lesser Spirit in the belief that it is a New God."
 zin_chr_108_p2:0 "The scholars hold that a being's place in the order of being comes from its origin, not from the number of its worshippers. The much-feared Volgan is called a god by many, yet he remains a Great Spirit. Worship alone, they teach, cannot make a god.\n\nWhether any being can ever rise into the order of the gods, the scholars do not agree, and no teaching has settled the question."
 zin_chr_108_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_108_short:0 "Worship and Rank"
 zin_chr_108_sub:0 "All Ages · Belief"
 zin_chr_108_title:0 "Worship and Rank"
 zin_chr_108_x1_p1:0 "The great example is the Deliverer. At the end of the Third Age many hailed him as the New God who saved Aoaz, and some saw miracles that none could deny. He was Afrit, and the true order of his being is not known. A great cult's belief can be sincere and weighty in history without proving where a being came from."
 zin_chr_109_p1:0 "Zol is the God of Death, an Old God, and the only Old God present in Aoaz. He came to Aoaz long before Aen and long before Volgan. His domain is the black north, Zol's Mistake: a barren waste and all the black islands of the Kusmeel.\n\nThe Fading and the magic of Aoaz keep him from wielding his cosmic power freely, and he cannot keep an ordinary bodily form. Yet his power is immense, and servants of his are said to walk in the black north."
 zin_chr_109_p2:0 "In the early ages Zol lay mostly dormant. When the Grand Alliance gathered in the First Age, his northern lands were already desolate, and they gave no armies and no aid to any side. Zol had no part in the Battle of Dardan. This was not weakness: under the Fading he could not cast his power freely abroad.\n\nIn the Second Age Elzon, the Great Necromancer, borrowed ancient magic linked to Zol to raise and bind the dead. It is the first stirring of Zol that the chronicles record. How Elzon came by that magic is not known, and no chronicle shows that Zol granted it or that the two were ever allied."
 zin_chr_109_p3:0 "At the end of the Third Age Elzon drew too deeply on that old magic, and he died. Many scholars hold that Zol consumed him without ever stirring. Zol grew stronger, but he did not take the field, and he did not openly rule the war.\n\nThe Mistake is almost empty of the living and is roamed by the dead. Its seat is Furviatlon, and who keeps it for Zol is not known. No chronicle tells what mistake gave the land its name, or what the dead that wander it truly are."
 zin_chr_109_plate:0 "GFX_zin_chr_plate_zol"
 zin_chr_109_short:0 "Zol, Old God of Death"
 zin_chr_109_sub:0 "All Ages · Old God"
 zin_chr_109_title:0 "Zol, Old God of Death"
 zin_chr_109_x1_p1:0 "Zol's dead have risen beyond the Mistake. They are stronger than the corpses Elzon once raised, for the Old God's own death-magic sustains them directly. Ordinary weapons cannot end them for good; only magic of great power can."
 zin_chr_109_x2_p1:0 "In the war of the north Zol took no body and did not come onto the field himself. His power went to war in other hands. Why Zol himself stayed away, no chronicle tells."
 zin_chr_109_x3_p1:0 "When the war of the north ended, Zol had not been slain. He had taken no body, and no blade of that war reached him. The black north remains his."
 zin_chr_110_p1:0 "Zol has servants in Aoaz. He has no bodily form there and cannot take the continent by his own hand, and the scholars hold that what he does in Aoaz, he does through others.\n\nHis servants are not of one order. Spirits great and lesser are among them, so the oldest tales say.\n\nWhat his servants do for Zol is not known. The scholars do not agree whether they bring him worship, souls, death, ritual, magic, sacrifice, relics or something else, or nothing at all."
 zin_chr_110_p2:0 "It is not known whether his servants obey him willingly, under compulsion or for ends of their own. Who they are, no chronicle tells.\n\nNor is it known whether anything they do could ever give Zol a body in Aoaz."
 zin_chr_110_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_110_short:0 "Those Who Serve Zol"
 zin_chr_110_sub:0 "All Ages · Order of Being"
 zin_chr_110_title:0 "Those Who Serve Zol"
 zin_chr_1101_p1:0 "In the far north of the Cold Lands, in the Castle of Yeldenne by the small town of that name, the Great Spirit Horos keeps Glo, a crystal of old and holy power. He has guarded it through the ages, and it is said to hold part of the power of Glernaen, the New God of Power and Wisdom and the mightiest of the twelve main New Gods.\n\nThe green crystal shines before the throne of Horos in his cold hall. Horos is an enormous knight in yellow-green armour, with branching points on his helm, blue eyes that glow in the shadow and a great blue sword. Beneath the castle lie old halls whose name the chronicles of men do not record."
 zin_chr_1101_p2:0 "The tales say that Glo is entrusted only to the worthy and cannot be taken merely by holding the castle, and that Horos has turned away every claimant who sought it for conquest. It is wanted all the same: Volgan desires it, and the Lost Cause holds that it must be kept safe. No chronicle tells where Glo came from or how far its power reaches."
 zin_chr_1101_plate:0 "GFX_zin_chr_plate_glo"
 zin_chr_1101_short:0 "Glo"
 zin_chr_1101_sub:0 "Fourth Age · Relic"
 zin_chr_1101_title:0 "Glo"
 zin_chr_1101_x1_p1:0 "Glo was never an ornament of the throne. It was the heart of Horos himself, the living crystal at the core of the guardian's existence, and the power of Glernaen that it carried was a power entrusted to him. When Horos died, his form crumbled to dust."
 zin_chr_1101_x2_p1:0 "Glo passed to Eindil, the first claimant whom the guardian's power would willingly trust with it. Freed from its old bond to the castle, the crystal goes where its bearer goes, and part of Glernaen's power goes with him."
 zin_chr_1101_x3_p1:0 "When Eindil fell before Volgan in the last war, Glo became the bridge of the gods. Through the heart of Horos, which already carried Glernaen's power, the New Gods each offered a measured part of their own, and they restored Eindil to life. The chronicles hold that this was a gift the gods could not simply repeat."
 zin_chr_1101_x4_p1:0 "When the Great Spirit Kusven, Zol's most loyal servant, crushed the blue sword of Horos, Glo's power did not leave the shards, and one fragment that still carried it wounded the servant. How much of Glo's power remains after the breaking of the sword is not known."
 zin_chr_1101_x5_p1:0 "Horos was slain in his hall before a worthy bearer came. Dying, he bound Glo to the empty hall, and the crystal stays there under his last seal, which no unworthy hand can open."
 zin_chr_1101_x6_p1:0 "A dark power that held the sealed hall defiled the seal, and the light of Glo went out. The crystal still lies in the Castle of Yeldenne, but nobody can use it now, and no one who sought it for conquest ever held it."
 zin_chr_1102_p1:0 "Horos, the Great Spirit who keeps the Castle of Yeldenne in the Cold Lands, carries a large blue magical sword. Those who have seen him describe an enormous knight in yellow-green armour holding a blade too great for any man to wield.\n\nNo chronicle records how the sword was made. The tales of the Cold Lands hold that Glernaen's power runs in the blade as it runs in the crystal that Horos keeps."
 zin_chr_1102_plate:0 "GFX_zin_chr_plate_blue_sword"
 zin_chr_1102_short:0 "The Blue Sword"
 zin_chr_1102_sub:0 "Fourth Age · Relic"
 zin_chr_1102_title:0 "The Blue Sword of Horos"
 zin_chr_1102_x1_p1:0 "The sword of Horos passed to Eindil with Glo. In the last war Eindil came down from a dragon's back and drove it into the earth, and a wave of Glernaen's power broke the magic that sustained a whole front of Zol's dead. Unlike ordinary weapons, the blade could end them for good."
 zin_chr_1102_x2_p1:0 "After the New Gods restored Eindil, he drove the blue sword through Volgan, and the manifested body of the Great Spirit broke apart."
 zin_chr_1102_x3_p1:0 "Kusven, the Great Spirit who is Zol's most loyal servant, stopped Eindil, took the sword and crushed it into shards. Eindil drove one shard into the servant, and the divine magic still in it wounded the servant. No whole blade of Horos remains."
 zin_chr_1103_p1:0 "The Necklace of the Abyss is a powerful artifact of the Abyss in the far south of the Ember Lands. The old tales tie it to Roka, a huge being of the rhinoceros-headed people of the Abyss, whose name, history and ways are not known.\n\nNo chronicle tells how the necklace was made, what its true powers are, or why it holds such strength. The scholars of Parim and Selen know it as the greatest relic of the Abyss, and they know the Abyss as a place where few go and fewer come back."
 zin_chr_1103_plate:0 "GFX_zin_chr_plate_necklace"
 zin_chr_1103_short:0 "The Necklace of the Abyss"
 zin_chr_1103_sub:0 "Fourth Age · Relic"
 zin_chr_1103_title:0 "The Necklace of the Abyss"
 zin_chr_1103_x1_p1:0 "The Necklace of the Abyss is Afrit's greatest relic. His master thief took it from Roka's domain, and Afrit used its power to grant the thief the eternal life he had promised. It greatly amplifies Afrit's abilities and helps to sustain his supernatural power and his demonic form, most of all in the prepared centre of Aenor.\n\nWith his other artifacts it lets him wield strength like that which ordinary people expect of a god. Whether it grants him true divine order is not known."
 zin_chr_1103_x2_p1:0 "In the palace the necklace was torn from Afrit's neck. Without it his gathered power and supernatural protection collapsed, and the once-human Afrit stood exposed as a mortal man who could die."
 zin_chr_1103_x3_p1:0 "Eindil took the Necklace of the Abyss and put it around his own neck, and he wore it when he returned to the royal palace. That he took it does not mean that it is harmless, or that he accepted the ways of the one who wore it before him. What price it carries is not known."
 zin_chr_1104_p1:0 "The Ring of Doors is one of the lesser artifacts that Afrit gathered after the theft of the Necklace of the Abyss, between 4A 1611 and 4A 1700, through trade, theft, excavation and bargains with servants across Aoaz. The temples call such things the Graces of the Deliverer.\n\nThe ring helps him cross between places and reach his private refuge, a realm of his own beyond the world, so that he can pass behind an enemy in a moment or slip out of a closing trap. The full number of his artifacts and all their powers are not known."
 zin_chr_1104_plate:0 "GFX_zin_chr_plate_cat_relics"
 zin_chr_1104_short:0 "The Ring of Doors"
 zin_chr_1104_sub:0 "Fourth Age · Relic"
 zin_chr_1104_title:0 "The Ring of Doors"
 zin_chr_1104_x1_p1:0 "In the palace the ring was taken from Afrit together with the finger that wore it, and the easiest of his escapes was closed to him."
 zin_chr_1105_p1:0 "The Crown of Witnesses is one of the lesser artifacts that Afrit gathered between 4A 1611 and 4A 1700. It magnifies his public authority by drawing power from oaths and courts that have been prepared for it, so that every royal oath sworn in its presence and every office sworn to his service adds to his strength.\n\nIts strength is greatest in chambers prepared with seals for it. How it was made, and where Afrit found it, is not known."
 zin_chr_1105_plate:0 "GFX_zin_chr_plate_cat_relics"
 zin_chr_1105_short:0 "The Crown of Witnesses"
 zin_chr_1105_sub:0 "Fourth Age · Relic"
 zin_chr_1105_title:0 "The Crown of Witnesses"
 zin_chr_1105_x1_p1:0 "In the palace the seals that let the Crown of Witnesses draw strength from the chamber were destroyed and the crown was broken, and the oaths it had fed on no longer fed Afrit."
 zin_chr_1106_p1:0 "The Bracelet of the First Seal is one of the lesser artifacts that Afrit gathered between 4A 1611 and 4A 1700. It keeps part of his personal shield, the magical defence that turns aside blows and spells that would wound a mortal man.\n\nAfrit was once a man, and stripped of his sustaining magic and enchanted objects he can still bleed, suffer and die. The bracelet is one of the things that stand between him and that weakness."
 zin_chr_1106_plate:0 "GFX_zin_chr_plate_cat_relics"
 zin_chr_1106_short:0 "Bracelet of the First Seal"
 zin_chr_1106_sub:0 "Fourth Age · Relic"
 zin_chr_1106_title:0 "The Bracelet of the First Seal"
 zin_chr_1106_x1_p1:0 "In the palace the bracelet was turned: Afrit's own spell was forced back against it, and the part of his shield that it kept failed him."
 zin_chr_1107_p1:0 "The Mirror of First Rain is a spring enclosed in an old elven courtyard in the realm of the Gala elves, under the guardianship of King Lorien. Its water does not show a sure future. It shows true traces of the past and a series of possible futures to those who have the courage to look without demanding certainty.\n\nThe Mirror need not show every secret plainly. It may show bloodlines and images that Lorien reads through his long memory, and Lorien warns that prophecies can be used to frighten people into committing the very deeds they foretell."
 zin_chr_1107_plate:0 "GFX_zin_chr_plate_mirror"
 zin_chr_1107_short:0 "The Mirror of First Rain"
 zin_chr_1107_sub:0 "Fourth Age · Wonder"
 zin_chr_1107_title:0 "The Mirror of First Rain"
 zin_chr_1107_x1_p1:0 "When the stranger came to Gala, Lorien led him to the Mirror. In the vision Lorien saw the old royal line and knew him as Eindil, son of Ein, son of Aen. Eindil saw a burning capital, armies from west and east, death moving from the north and Volgan's renewed strength, and the vision sent him north to Horos in the Castle of Yeldenne."
 zin_chr_1107_x2_p1:0 "The Mirror of First Rain is still. Since Gala passed into the hands of a realm that is neither of the elves nor of the Sunhot folk, the spring has given no visions, and its water shows nothing but the sky."
 zin_chr_111_p1:0 "Glernaen is the New God of Power and Wisdom, the mightiest of the twelve main New Gods of Aoaz. He answers the mortal need for strength and counsel, and the year begins with his month.\n\nGlo, a crystal of old and holy power kept by Horos in the Castle of Yeldenne, is said to hold part of Glernaen's power."
 zin_chr_111_p2:0 "Like every god, Glernaen is never shown in the shape of a man. Of his own character and signs, his bonds with the other gods beyond his place as the mightiest of the twelve, how far he acts by his own will, and whether any cult of his own is kept in Aoaz, no chronicle tells. Nor is it known where Glo came from."
 zin_chr_111_plate:0 "GFX_zin_chr_plate_glernaen"
 zin_chr_111_short:0 "Glernaen"
 zin_chr_111_sub:0 "All Ages · New God"
 zin_chr_111_title:0 "Glernaen"
 zin_chr_111_x1_p1:0 "When the Man from the Ice lay beaten in the war, Glernaen and the New Gods restored him. Their joined power reached him through the crystal Glo."
 zin_chr_112_p1:0 "Spirits have two ranks. The Great Spirits are the higher, immortal and capable of exceptional power; Volgan, Elzon and Horos are Great Spirits, and Elzon is also the Great Necromancer. The Lesser Spirits are the lower rank, also immortal, and some are still strong enough for mortals to take them for gods. Varner is a Lesser Spirit.\n\nGreat Spirits very rarely take the shape of men, and they are always beings of magic. Lesser spirits can be caught and used: the sorcerer-chief Gektor traps lesser spirits and bleeds them, though his claim to kill Great Spirits is only a boast."
 zin_chr_112_p2:0 "Both ranks stand below the gods, yet rank is no chart of strength. Volgan, a Great Spirit, overcame a New God, and whether that god was one of the lesser New Gods is not known. The lesser New Gods are still stronger than most Great Spirits.\n\nGreat Spirits may rule domains, command followers or serve higher powers, but rule is no rank of its own. Volgan is a Great Spirit who became a sovereign and rules a realm; that names his place among the realms, not his kind."
 zin_chr_112_p3:0 "Devils are corrupted Lesser Spirits, ancient and terrible; where they first came from, no chronicle of men tells. Devils are bound to their bodies and can be killed. A slain devil returns only through the lava rite, performed with its skull. Demons are another kind; the scholars of Selen hold them to be corrupted angels.\n\nWhat divides a Great Spirit from a Lesser, how spirits came to be, how they stand toward angels and demons, and whether a spirit can change its rank, no chronicle tells."
 zin_chr_112_plate:0 "GFX_zin_chr_plate_spirits"
 zin_chr_112_short:0 "Great and Lesser Spirits"
 zin_chr_112_sub:0 "All Ages · Spirits"
 zin_chr_112_title:0 "Great and Lesser Spirits"
 zin_chr_113_p1:0 "Rank is not the only way to speak of a spirit. The scholars of Parim and Selen describe each spirit in three further ways: by its nature, by its origin and by its condition. These words overlap, and none of them adds a new order between the gods and the Great Folk.\n\nBy nature, the scholars speak of wild spirits of forest, mountain, beast and wilderness; veiled spirits of dreams, memory, hidden things and visions; elemental spirits of fire, wind, water, stone, ice and lightning; and the damned spirits of the very deep places under the earth."
 zin_chr_113_p2:0 "By origin, they speak of elder spirits, whose beginnings come before many peoples and realms; worldborn spirits, formed from the nature of places and forces such as forests, mountains, seas or storms; and godwrought spirits, made by an Old God or a New God for some purpose.\n\nOne spirit may bear several such names. Volgan is ancient beyond doubt, and the scholars call him an elder Great Spirit; whether he was worldborn or godwrought, and where he came from, no chronicle tells."
 zin_chr_113_p3:0 "By condition, a spirit may be embodied, holding a stable body; unbound, without a lasting body and free to move; bound to a place, an object or a person; dormant, existing but rarely able to act; or shattered, scattered in fragments after losing its unity.\n\nThese conditions belong to spirits and say nothing of the gods. An Old God without a body is not weak or idle for that, for the Old Gods are held by limits of their own."
 zin_chr_113_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_113_short:0 "The Natures of Spirits"
 zin_chr_113_sub:0 "All Ages · Spirits"
 zin_chr_113_title:0 "The Natures of Spirits"
 zin_chr_114_p1:0 "The damned spirits dwell in very deep places under the earth, far below the lands where folk live. They are also called blighted spirits, and the two names mean the same beings. The name blighted speaks of beings changed by curses, corruption or disaster, but it is not known whether every damned spirit was made so.\n\nIn the First Age, in his great war, Volgan released damned spirits from very deep underground, and they marched in his army. Aoaz fell into disorder after that war, and some of these old threats may still linger in the deep places."
 zin_chr_114_p2:0 "Much about them is not known: whether all of them are spirits in the strict sense, whether there are great and lesser among them, whether they were born in the deep world, driven there, imprisoned there or changed there, and whether they keep societies, ranks or lands of their own.\n\nNor is it known whether they have any bond with Volgan beyond that war, or with the dead of Zol's Mistake, or how many of them have served him since."
 zin_chr_114_plate:0 "GFX_zin_chr_plate_damned_spirits"
 zin_chr_114_short:0 "The Damned Spirits"
 zin_chr_114_sub:0 "All Ages · Spirits"
 zin_chr_114_title:0 "The Damned Spirits"
 zin_chr_115_p1:0 "The Void is the place beyond the world to which Volgan was banished after his defeat at the Battle of Dardan. He was banished, not destroyed.\n\nIn the Second Age the Great Necromancer Elzon, a Great Spirit and Volgan's servant, freed his master from the Void after centuries of hard work. Volgan's soul, or his spiritual presence, returned to Aoaz. The return was real, but the power stripped from him at Dardan did not come back with it, and he needed long years to recover."
 zin_chr_115_p2:0 "The Void is not the Nether, the domain of the King of Demons in the south of the Ember Lands, and it is not the Abyss of the Ember Lands. No chronicle shows that the three are one place or that ordinary gates join them, and Elzon's breach of the Void did not need to pass through either.\n\nHow Elzon reached into the Void, what it cost him, where his rite was done, and why the Great Spirits who had fought beside the Grand Alliance could not seal the prison again, no chronicle tells."
 zin_chr_115_plate:0 "GFX_zin_chr_plate_cat_order"
 zin_chr_115_short:0 "The Void"
 zin_chr_115_sub:0 "First Age · Place Beyond the World"
 zin_chr_115_title:0 "The Void"
 zin_chr_1201_p1:0 "Men lived in Aoaz long before Aen. The men of those early days were stronger in magic and longer-lived than their descendants, and they raised great realms. Yet none of those realms had one crown over all men. That was Aen's work: when he ended the War of Men he made the first united kingdom of men, and with his victory the First Age began."
 zin_chr_1201_p2:0 "The scholars of Parim and Selen give no years to those realms. They say only that they stood long before Aen, and they know them less from writing than from what they left behind: fields under the sea, a city broken across a narrow sea, halls beneath forts, doors sealed against the sea, a square of reefs and timbers that the ice gives back."
 zin_chr_1201_p3:0 "Not all of them were realms of men, and not all of them fell before Aen. The dwarves of every great range were once one realm beneath the seas, and the chart-islanders of the western arcs once kept a league of the sea; both lasted into the First Age. The mountain kings of the Kalioth upland ruled in the East through that same age and fell at its end."
 zin_chr_1201_p4:0 "The peoples of Aoaz are old, but its realms are young under their old names. The heirs of the fallen realms keep their names, and each heir keeps only a part of what was lost: a tongue, a law, a count, a door, a chart, a fire. They do not readily share what they keep, and most strangers know the old realms only by their traces.\n\nNo chronicle tells how Aen was born, what the old name of the First Men means, or where the dwarves first came from, and none of the fallen realms answers those questions."
 zin_chr_1201_plate:0 "GFX_zin_chr_plate_cat_deep_past"
 zin_chr_1201_short:0 "The Realms Before Aen"
 zin_chr_1201_sub:0 "Before Aen · History"
 zin_chr_1201_title:0 "The Realms Before Aen"
 zin_chr_1202_p1:0 "West of Aenor Isle the sea lies shallow over wide banks, and the fishers' nets bring up field-walls, quern-stones and stones cut with twisted cords. At the lowest spring tides a reef breaks the water there like the top of a mound. The common speech calls the drowned land the Low Country, and the isle folk say the sea took it in one night, the Night of the Sea, long before Aen."
 zin_chr_1202_p2:0 "Its heirs keep its law without its name. In the grey downs and the red-oak forest the Orran tongue is still spoken, descent runs through mothers, and law is kept on cords. The Isle Houses of Aenor Isle are ruled by their eldest women, choose their queen in a tide-chamber at the turn of the tide, and give their dead to the tide; they keep that law without knowing why."
 zin_chr_1202_p3:0 "When the sea came, the Orran kingdoms of the river valleys rose from what was left, and their wars over a shrinking land ran on into the War of Men. The Orran houses that would not kneel to Aen took their cords into the grey downs and the red-oak forest. Under the Aenoran names of the Vale's rivers and towns lie older Orran ones."
 zin_chr_1202_p4:0 "The giants of Hirolon keep the Eldest Cairn, to which a keeper adds one stone in every year since the sea came. Their cairn-keepers will say of the drowned land only that it was asked for too much. The Veiled of the downs say the same, and count the souring of their downs by the Black Roots as the second land to die of asking. The scholars of Parim do not agree whether the land was lost to its own nature or to what was asked of it."
 zin_chr_1202_plate:0 "GFX_zin_chr_plate_low_country"
 zin_chr_1202_short:0 "The Drowned Fields"
 zin_chr_1202_sub:0 "Before Aen · Fallen Realm"
 zin_chr_1202_title:0 "The Drowned Fields"
 zin_chr_1202_title_after:0 "Muzerar, the Low Country"
 zin_chr_1202_x1_p1:0 "Its own people called it Muzerar, and the cord-mothers named the city of their moot Ozelkak, the Many Halls. Its folk were Orran-speaking men of six beast-clans: Wolf, Bear, Eagle, Horse, Raven and Water. The Moot of Mothers at Ozelkak, a seat for the eldest cord-mother of every clan, ruled more land than Aenor ever held with no king and no crown. The hill giants raised its sea-dikes as partners, and the low fields gave three harvests a year."
 zin_chr_1202_x1_p2:0 "The mothers drew on the magic of the place for the third harvest and for their long rule, and over the centuries the ground sank below the sea behind ever higher dikes. The giants warned the Moot, the mothers divided, and those who would draw harder won. Then a storm-tide broke the last dikes, and the sea took Ozelkak and the low fields in one night. In 4A 1748 the Eldest Cairn holds 7,436 stones."
 zin_chr_1203_p1:0 "Long before Aen the east coast of the Magical Lands and the East Lands were one land, joined by a broad neck where the Rift Sea now runs. One Eastern people held both shores, and the first great road of Aoaz ran over the neck. The common speech calls their realm the Bridge Kingdom."
 zin_chr_1203_p2:0 "The neck broke, and the sea came in from north and south until the two shores stood apart across a long rift. A city that stood on the neck broke in two. Its western half lies under the fungal belt of the Mushroom Forest beside Luv-zhise, whose ferries cross the drowned road. Its eastern half lies under the grass of the Delbiz coast, where the horse-fair is held among fallen pillars."
 zin_chr_1203_p3:0 "Its one tongue parted into the Eastern tongues. The valley people of Alerhia raised their first stair above the flood-line “so that the river and the gods would each have a place”, and the River Temples faith holds the river to be the oldest god anyone can see. The old roads end at Lenkei, where the elves of Eldafaen keep a treaty of passage longer than any crown has stood."
 zin_chr_1203_p4:0 "Before the neck broke the horse came west over it, and the riders of the Middle Lands and the horse-lords of Delbiz share the memory. The cedar came west too, and so did the ogres, which is why one people lives on both sides of a sea without being sailors. The ditches under Noleksun's fields still drink from the canals of the old western march."
 zin_chr_1203_p5:0 "No chronicle tells what broke the land. The temple chronicles of Alerhia say that the gods divided it to end a war between two brothers. The oldest rolls of the rift-coast elves say that the western heir's sorcerers woke something that sleeps beneath the East. The salt-boilers say it still breathes under the Hot Lake, and they count the year 4A 1655, when the Hot Lake breathed out over Mora, as its latest sign."
 zin_chr_1203_plate:0 "GFX_zin_chr_plate_bridge_kingdom"
 zin_chr_1203_short:0 "The Drowned Road"
 zin_chr_1203_sub:0 "Before Aen · Fallen Realm"
 zin_chr_1203_title:0 "The Drowned Road"
 zin_chr_1203_title_after:0 "Tarkia, the Bridge Kingdom"
 zin_chr_1203_x1_p1:0 "Its own name was Tarkia, from the Alerhic word for a bridge; the desert tellers call it Tarqis and the Stabilic ledgers Pontoseno, the old bridge. The city on the neck was Qadurum. Tarkia was a realm of stair-temples above the flood-line, of scribes who wrote the reed letters from which the Alerhic script descends, and of kings anointed at the river who bore the title Sara rabu, great king."
 zin_chr_1203_x1_p2:0 "At its height Tarkia held more land than Aenor ever did: the western East Lands, the neck with Qadurum astride it, and the road west through the Zilin Hills and over the South Pass into the downs of Herez and Noleksun. A great king left two heirs, the realm split along its road, and in their war the neck broke. The western house faded among the hills of the Middle Lands, and the eastern half broke into river crowns."
 zin_chr_1204_p1:0 "Erco's seven forts stand on an old fortress line on the Kalioth, the dry upland of the southern East, and beneath them lie the halls of the mountain kings who once ruled there. The chroniclers of every other realm call their empire the Kalioth Crown, after the upland where its kings sat.\n\nThe Kalioth kings were Alerhic-speaking lords of mines and iron, who ruled mine-folk, desert tribes and the pass-houses of the Hardtmuth. Theirs was a fortress empire of heavy horse, iron, slave-worked mines and walled upland cities, and in the First Age it was the greatest power of the East. It never held Alerhia's river crown, which defied it."
 zin_chr_1204_p2:0 "Its kings took Volgan's side and paid him the Black Tribute of ships, grain and men, which Alerhia refused in 1A 1214. As Volgan's ally the Crown held Herez, Noleksun and the South Pass for about a century, the only eastern realm that ever ruled land in the Middle Lands after the neck broke. At Dardan its host stood with Volgan's and died there."
 zin_chr_1204_p3:0 "Afterwards its western garrisons starved. In 2A 12 the mine-lords of the southern mountains shut the passes against the beaten host and besieged the last king in his hall, and Erco was founded on the ruin. They walled up the last king's iron diadem and would neither wear it nor melt it. The miners of Erco say that no miner may strike that wall."
 zin_chr_1204_p4:0 "In Herez and Noleksun the folk keep a word for eastern raiders and the stone forts the occupiers built on the downs. Miaed's pass-houses remember the water and guides they sold to Volgan's eastern clients. The provinces beyond the Melty Pass fell silent when the Crown fell, and it is not known what became of them."
 zin_chr_1204_plate:0 "GFX_zin_chr_plate_kalioth_crown"
 zin_chr_1204_short:0 "The Kalioth Halls"
 zin_chr_1204_sub:0 "First Age · Fallen Realm"
 zin_chr_1204_title:0 "The Kalioth Halls"
 zin_chr_1204_title_after:0 "Rhabtarkia, the Kalioth Crown"
 zin_chr_1204_x1_p1:0 "The kings' own court name for their empire was Rhabtarkia, the Greater Bridge Kingdom. They called themselves the restorers of the kingdom of the bridge and swore to rejoin the shores. They rose about 1A 500 and proclaimed Rhabtarkia about 1A 1000, and their height lay between 1A 900 and 1500, while Aenor declined under its bad kings."
 zin_chr_1204_x1_p2:0 "Their seat on the Kalioth was Barzoth, the iron height, where the diadem lies walled in the hall. Beyond the Melty Pass they kept a road over a glacier that nobody has kept since, and eastern provinces sent tribute over the ice. While their garrisons held the old western march of the kingdom of the bridge, their claim to have restored it looked like the truth."
 zin_chr_1205_p1:0 "Four dwarf holds keep one tongue across the seas: Kunhrim in the Great Wall range, Hrakbrund under the High Mountains of the North Lands, and Brundahrim and Gromkerm in the western ranges. The names of a western hold and of a northern one are built from the same words. Each hold keeps a sealed Sea-Door at the head of an old road that once ran on under the sea."
 zin_chr_1205_p2:0 "The common speech remembers those roads as the Stone Roads, and Brunek of the Stone Roads, a dwarf engineer of the First Age, bears their name. They joined the western ranges, the Great Wall range and the High Mountains of the North beneath the floor of the Crown Sea and the Narrow Strait.\n\nIn Volgan's war the Damned Spirits rose from deep beneath the mountains and came into the roads. The roads under the sea were broken and the sea was let in, and the holds were cut off from one another. They have had no Deep King since."
 zin_chr_1205_p3:0 "Who gave the order is disputed. Kunhrim says that the Deep King ordered the Letting-In of the Sea. The western holds say that Kunhrim's lords urged it to save their own gate, and that grudge is older than any charter. The holds believe that the sea is the seal, and that while the sea lies on what was drowned, what is in it stays. What remains below the sea, no chronicle tells.\n\nWhen the western door was sealed, the fire-hold of Brundahrim carried one fire out of the drowning road in an iron fire-pot, and keeps it still as the Road-Fire. No chronicle tells where the dwarves first came from."
 zin_chr_1205_plate:0 "GFX_zin_chr_plate_stone_road"
 zin_chr_1205_short:0 "The Sea-Doors"
 zin_chr_1205_sub:0 "First Age · Fallen Realm"
 zin_chr_1205_title:0 "The Sea-Doors"
 zin_chr_1205_title_after:0 "The Sea-Doors of Gromatrak"
 zin_chr_1205_x1_p1:0 "The holds' own name for their realm is Gromatrak, the stone road in their tongue. It was the only realm that ever spanned three landmasses, and a dwarf could walk from the West Lands to the North Lands without seeing the sky. Its first roads were cut long before Aen, beneath the low country while it was still dry land, and they outlived its drowning because they ran in deep rock."
 zin_chr_1205_x1_p2:0 "Its seat was Tromahrim, the Great Hall of the Deep King, deep beneath the low country's northern hills, which are now the floor of the Sea of Monsters. Through the Western Gate, opened about 1A 300, Gromatrak sold its iron to Aenor. It sent its engineers to Dardan. When the spirits came into the roads, the Deep King let the sea in, and Tromahrim drowned with the spirits inside it."
 zin_chr_1206_p1:0 "In the Pupor Sea lies the Cursed Square, a square of reefs that wrecks ships. The islanders hold that it is cursed, and the corsairs of Benan, who hold it in name, will not sail into it whatever the prize. After the Wreck of the Square, about 2A 1507, the glass-blowers of the Lens swore to keep the passages lit.\n\nThe isles of the three arcs keep the pieces of a league of the chart-islanders, which the common speech calls the Sea-Roads. In Volgan's war it carried the supply fleets of the Grand Alliance, under its admiral Senra. It kept the first lit passages and drew the first great charts, and it leased harbours on the coasts of the West Lands and the Cold Lands but never conquered land."
 zin_chr_1206_p2:0 "A sickness, the Grey Breath, came on the ships that served the league, and its own fleets carried it to every isle. The outer isles emptied and corsairs took their harbours; Straton fell to them in 2A 130. The league broke into chart-houses, brokers and corsair captaincies. Whether the Grey Breath still waits in the wrecks of the Square, the islanders do not agree."
 zin_chr_1206_p3:0 "Adel's Chart Hall descends from the league's chart-office, Raerby's banks-court was its court for the banks, Pollos's strong-room was its treasury, and the Lamp-House of the Lens keeps its lights. At the close of every gale season the islanders read the Drowned Names, and the oldest of them belong to no isle where anyone lives."
 zin_chr_1206_plate:0 "GFX_zin_chr_plate_sea_roads"
 zin_chr_1206_short:0 "The Reefs of the Square"
 zin_chr_1206_sub:0 "First Age · Fallen Realm"
 zin_chr_1206_title:0 "The Reefs of the Square"
 zin_chr_1206_title_after:0 "Margorodai, the Sea-Roads"
 zin_chr_1206_x1_p1:0 "The league's own name was Margorodai, the sea-road in the Tritonic tongue. It was sworn about 1A 820, when Aenor's decline left the western sea-roads unguarded, and its height lay between 1A 1100 and 1675. It held the three arcs, the Pupor and the sea-roads from the Cold Lands ports to the Islands of the South, and at sea it was greater than Aenor ever was."
 zin_chr_1206_x1_p2:0 "Its seat was Halgohavnai, the Holy Harbour, whose four moles on the reef shelf made a harbour where any ship under any banner paid one due. The Grey Breath came into Halgohavnai on the league's own ships, and the harbour was left to its dead and never relit. In the gale season of 2A 904 its moles broke, and its walls became the Cursed Square. Adel's oldest charts still show the harbour."
 zin_chr_1207_p1:0 "In mild summers the ice of the Frozen Lands gives back great timber halls and bronze ship-prows. The north remembers the land they came from as the Sunfields. Long before Aen, when the ice lay far to the north, the first men of the north-west held the Fandan meadows, the interior that is now frozen, and the west coast below the Icy Mountains.\n\nThey had bronze, great timber halls and horse-herds in the Fandan meadows, and theirs was the first sea-craft of Aoaz. Then the winters lengthened over many lifetimes, and the ice came a little farther south in every age. The fields failed, the halls emptied, and the realm broke into clans."
 zin_chr_1207_p2:0 "Coldor's fire-keepers say the land was punished. The ice giants of Nivaros say that the snow breathes in and out over the ages. The Winter Hearth, which relights every house-fire from the clan fire, is said to be the custom of the last hall, and the fire-keepers of the Frost-Hall call the hearth older than any crown.\n\nThe Neck Road over the Neridor Gap was already known to the clans when they showed it to Aenor's surveyors about 1A 400. The snowline fair at Fentene is held on an old market-ground under the moss. The people of Mp'E believe that the Watcher in the Hall is a sleeping king of the old north."
 zin_chr_1207_plate:0 "GFX_zin_chr_plate_sunfields"
 zin_chr_1207_short:0 "What the Ice Gives Back"
 zin_chr_1207_sub:0 "Before Aen · Fallen Realm"
 zin_chr_1207_title:0 "What the Ice Gives Back"
 zin_chr_1207_title_after:0 "Heulfaenn, the Sunfields"
 zin_chr_1207_x1_p1:0 "The scholars who compare the northern tongues call the land Heulufaenn, the sun-fields. The ice clans and Coldor's fire-keepers call it Heulfaenn, the clans of the West Lands sing of Faenn-Cheulu, and the chart-islanders name it Heulofaennos: three peoples keep three names for one lost land without knowing it. Its king's hall was Tawrhalwe, and tawr, king, is a word all three tongues still share."
 zin_chr_1207_x1_p2:0 "No one worked its fall. When the fields failed its people went three ways: south over the neck, where they became the Gunwyn clans of the West Lands; west by sea to the arcs, where they became the Tritonic islanders; and into the Long Dark, where the clans who stayed became the Coldic ice clans. The islanders' words for reef, strait, cape and tide are the words of the Sunfields' sailors."
 zin_chr_20001_p1:0 "Before Aen there were kingdoms of men in the Vale and round the Great Lake, and the eldest of them were the Orran houses that had come up the rivers out of the drowning Low Country with their cords and their mothers' law; others were older peoples of men whose names survive only in the Vale's hill-forts. For hundreds of years these kingdoms fought the War of Men over inheritance, fields and the question whether one crown should exist at all."
 zin_chr_20001_p2:0 "The chroniclers of Parim tell that the last kings knelt together in the Vale and that Aen spread his cloak, black outside and red within, over all of them at once, so that no king knelt before another, only beneath the same cloth; that is the Mantling, and the Peace of the One Crown is the law spoken beneath it."
 zin_chr_20001_p3:0 "From it came the realm's whole character: a crown that rules by keeping houses at peace rather than by ruling them; a nobility in which every great house counts its blood from one of Aen's hundreds of sons, and so argues not over whether it is royal but over which branch is first; a law in which a lord's war without the crown's judgement is the first meaning of rebellion; and a grudge it has never paid, for the Orran houses that would not come under the cloak withdrew into the downs and the forest, and their heirs still say the Vale's rivers have Orran names because the Vale was theirs."
 zin_chr_20001_p4:0 "The cloak itself was lost with the archives and the sacred objects when Volgan took the capital, and every king since has been crowned under a copy.\n\nA spread cloak, black outside and red within, hanging open from a gold crown-shaped clasp at its throat, on a field of lake blue. The Mantle of Aen is the cloak under which the last kings of the War of Men knelt at the Mantling, so that no king knelt to another. It hung above the throne of the old capital as the realm's first relic until Volgan's armies carried it off with the archives in 1A 1612, and no chronicle says where it went."
 zin_chr_20001_p5:0 "Edran, crowned beneath the Moot Tree, was wrapped in a ranger's cloak dyed black and red for want of the true one; the dyed cloak became the banner of the Grand Alliance's Aenoran host and then of the restored crown, and Harion's heralds set the gold clasp at its throat in 4A 3 to say that the crown held it together again."
 zin_chr_20001_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20001_short:0 "Aenor"
 zin_chr_20001_sub:0 "Middle Lands · Realm"
 zin_chr_20001_title:0 "Aenor"
 zin_chr_20002_p1:0 "Before the War of Men ended, the Selen Weald was a wood where hunted men went to disappear. The moots' own telling begins with three bands of men broken in that war, the Vothrim, the Svenlor and the Ulgus, who fled into the great oak wood from three sides in one winter and found each other at the ford of the Selenar under the oak that is now the Moot Tree."
 zin_chr_20002_p2:0 "The rangers say the wood had a lord, a Wild Spirit of the green whom they still call the Lord of the Weald, and that it let the three bands stay on terms: no arrow loosed in it without asking, no standing tree felled, and every stranger sheltered, because the wood itself had sheltered them. Each band laid one arrow point-down at the oak's root to swear it, and the Quiet Law of 1A 230 is that bargain made law at the first moot of the three bands as one."
 zin_chr_20002_p3:0 "Everything Selen is grew from that winter: the rangers' craft of moving unseen; the tree-wardens who ask before the hunt and keep the bow unstrung through the Hallow Month; the habit of taking in the hunted, from the Vale's plague families to Edran himself and the survivors of the capital's fall; and a stubborn pride that the Weald answers to its moot before any crown, which the Roll Quarrel and the Golden King's taxes have sharpened.\n\nWhether the Lord of the Weald is a Lesser Spirit, something older or only the wood's own silence, the moots do not say, and they take the question as an insult."
 zin_chr_20002_p4:0 "Three arrows bound together point-down with a green withy, white on forest green. The arrows are the three the broken bands laid at the root of the Moot Tree when they swore the Quiet Law; the moot-books say they lay there until the root grew over them, and the tree-wardens cut a withy from the oak to bind three new arrows at every First Warden's choosing.\n\nWhen Edran was hidden in the Weald in 1A 1614 his ranger guards carried the bound arrows as their only standard, so the sign went to war beside the crown long before Selen held a charter."
 zin_chr_20002_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20002_short:0 "Selen"
 zin_chr_20002_sub:0 "Middle Lands · Realm"
 zin_chr_20002_title:0 "Selen"
 zin_chr_20003_p1:0 "The ringed vale inside the Great Wall of Aenor was a herders' summer ground long before Aen, and its people tell a story the chroniclers of Parim neither confirm nor deny: that in the first years of the One Crown Aen set one of his hundreds of sons to keep a fire at the mouth of the pass, so that the kingdom would see by night whatever came over the range, and that the vale's name, Kingson, is that son's.\n\nWhoever he was, the watch-families count their descent from the men who fed his fire, and the Pass Vigil is their oldest law: the fire at the pass is never let out."
 zin_chr_20003_p2:0 "When Elzon's Order raised its forts on the pass in 3A 61 it forbade every fire on the heights, and the families kept the vigil anyway, carrying one live ember in iron tongs from hearth to hearth in secret, one family to each night, for nearly twelve centuries; a family that let the ember die was not spoken to for a generation.\n\nOn a night in Kerun of 3A 1244 the ember was carried up to the forts, the watch-families opened the gates from the inside, and the old fire burned on the pass again."
 zin_chr_20003_p3:0 "From those centuries come the vale's habits: patience under any master; a gift for keeping a secret in plain sight; the Reading of Names, in which every child is presented in the year of its birth; and the conviction that the pass is not a toll-road but a trust the families keep for the whole of the Middle Lands, which is why a doubled toll on elven silver shamed the vale more than it shamed the elves."
 zin_chr_20003_p4:0 "A red-hot ember held in black iron tongs, on snowline white. The tongs are those in which the watch-families carried the vigil ember from hearth to hearth under the Order's ban on fire, and the pair that carried it up to the forts on the night the vale rose in 3A 1244 hangs in the hall at Deolofson. Every Pass-Lord takes them from the wall at his choosing and lights the vigil fire with the ember they hold.\n\nDeolof had the tongs painted on the first banner flown over the gorge forts in 4A 3, in place of the Order's marks, so that every fort would fly the sign of the families who had kept the fire."
 zin_chr_20003_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20003_short:0 "Kingson"
 zin_chr_20003_sub:0 "Middle Lands · Realm"
 zin_chr_20003_title:0 "Kingson"
 zin_chr_20004_p1:0 "Before the sea came, the giants of the ring were the hill giants of the Low Country, partners of its Moot of Mothers. They lived on the low hills of the plain, kept their cairn-fields on the high ground and raised the long sea-dikes from field-stone, and the Orran clans paid for every mile of dike in grain.\n\nThrough the centuries of the Long Settling the cairn-keepers watched the ground sink below the sea and warned the Moot that the land was being asked for more than it had, and the mothers who would draw harder won the quarrel."
 zin_chr_20004_p2:0 "On the Night of the Sea the giants left the plain for the ring of hills that had always been their own, and the keepers laid the first stone of the Eldest Cairn; the giants of the low hills who would not come to the ring went north-east behind a cairn-line of their own, and the two have not spoken since."
 zin_chr_20004_p3:0 "Everything the ring holds sacred comes from that night: the count in stone that one keeper after another lays and that no giant is ever asked about for himself; the dike-craft they still sell to Parim's quays as cut stone; the Old Promise they made to the small folk, because a promise kept is a dike that holds; and a refusal to take more from the land than it offers, so that the ring is grazed lightly, never worked with any art and left fallow every seventh year.\n\nWhat else the giants know of the drowned land they do not tell; they say only that the land was asked for too much."
 zin_chr_20004_p4:0 "A grey squared field-stone bearing one black notch cut in its face, on russet. The first stone of the Eldest Cairn was not a hill stone. The keepers carried it out of the last broken dike on the Night of the Sea, a squared field-stone with the Moot's tally-notch for that length of dike cut in its face, and set it at the foot of the cairn, where every later stone rests on it.\n\nThe ring's envoys first showed it painted on a hide when they swore the Cairn Treaty with Harion in 4A 3, so that the restored crown would know whose word it was taking."
 zin_chr_20004_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20004_short:0 "Hirolon"
 zin_chr_20004_sub:0 "Middle Lands · Realm"
 zin_chr_20004_title:0 "Hirolon"
 zin_chr_20005_p1:0 "The small folk of Tirlan are an old people in a young country.\n\nTheir kin in the Ronbo basin of the West Lands have farmed below the Herlitz range for longer than any western song remembers, and the households of Tirlan brought the basin's whole way of life with them in one ship's hold: the place laid at every table for Lumae, Aurlan and Vaelei; the habit of naming each field like a child; going barefoot on tilled ground; and the conviction that a household which shares its harvest is never robbed of it."
 zin_chr_20005_p2:0 "In the wars of the Aenoran settlements their valley burned, and a party of households paid their last barley for passage on an Aenoran grain ship. A gale blew the ship south of its course, and the crew put the households ashore at the Hilorn mouth inside the giants' ring with nothing but what they could carry, throwing the ship's great wicker grain-pannier down after them as a last kindness. The giants found them on the shore.\n\nAt the stone of the Hilorn Gap the High Chief swore the Old Promise, that no evil would enter the valleys while the harvest-share was paid, and the households carried the first share up to the halls in the sailors' pannier."
 zin_chr_20005_p3:0 "That bargain made Tirlan: a people who keep their word by the basket; who regard the giants as neither masters nor guests but as the hedge round the field; who rarely leave the valleys, because the last time they left a valley it burned; and who keep, in the eldest household of Tirbur, the names of kin across the sea they have not seen since."
 zin_chr_20005_p4:0 "An upright wicker grain-pannier with two shoulder-straps, gold on green. The pannier is the one the grain ship's crew threw ashore at the Hilorn mouth in 1A 612. The first harvest-share went up to the giants' halls in it, and it has carried the first basket of every harvest since, mended so often that no strand of the first weaving is left.\n\nIn the Wet Year of 4A 1544, when the share could not be paid, the giants carried it back over the Saddle full of Parim grain and refused to count it a debt, and the Wardens of the Fields have shown it on their moot-cloth ever since."
 zin_chr_20005_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20005_short:0 "Tirlan"
 zin_chr_20005_sub:0 "Middle Lands · Realm"
 zin_chr_20005_title:0 "Tirlan"
 zin_chr_20006_p1:0 "The horse came to the Middle Lands from the east, long before Aen, over the road of an Eastern people whose name the Konori do not know; the road-people reached the south-east, faded there and left their herds behind them. The riders of the dry Konori plateau say their first mothers were the ones who caught those herds, and every Hundred keeps a song of the mare it was founded on."
 zin_chr_20006_p2:0 "A Hundred is a clan of one horse-mark, the brand burnt into its herd, and for longer than anyone counted the Hundreds were each other's only enemy: they rode on both sides of the War of Men because each would ride against whichever side its rival chose. The felt ended that.\n\nWhen the Hundreds met at the ford of the Aenar in 1A 288, every Hundred brought hair from its founding herd, and the oath-riders pressed it into one white felt, so that a king lifted on it sits on every Hundred at once and belongs to none; at its heart they burnt a brand that is no Hundred's, an open hook that closes on nothing."
 zin_chr_20006_p3:0 "From the felt come the plateau's laws: a king is lifted, never born, and is lifted again by every Hundred's hand when his son succeeds; no Hundred may brand a horse with the open hook; an oath sworn on the felt is sworn on every horse alive. Under the Order the felt was hidden for twelve centuries, rolled inside a saddle-blanket and passed from Hundred to Hundred, and the plateau says that is why the Hundreds never forgot they were one."
 zin_chr_20006_p4:0 "A white felt with its four corners tasselled red, bearing at its heart a small black open hook-brand, on plateau ochre. The felt of Arrovez is pressed from the hair of every Hundred's founding herd, and the open hook at its heart was burnt there at the first lifting in 1A 288 as a brand no Hundred may use, the mark of a king who belongs to none of them. The four red tassels are the lifters' hand-holds.\n\nWhile the felt was hidden under the Order, riders who could not show it painted it on their saddle-cloths instead, and the Order's tax-riders learned to fear a horse that bore the open hook."
 zin_chr_20006_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20006_short:0 "Konori"
 zin_chr_20006_sub:0 "Middle Lands · Realm"
 zin_chr_20006_title:0 "Konori"
 zin_chr_20007_p1:0 "Before they had a Gathering, the riders of the Hunhun Downs were the horse-thanes of the eastern Vale kingdoms, sworn to whichever king fed their herds, and they fought on every side of the War of Men for pay. The downs' own story turns on one mare.\n\nIn the last years of the war a Hunhun rider carried Aen's banner, the first rider of the downs to carry it for nothing, and in the last battle his mare was killed under the banner; he held it up standing over her until the field was won."
 zin_chr_20007_p2:0 "The riders buried her where she fell in the first of the horse-barrows, her head to the east, her saddle on her back and its stirrups empty, and on that barrow at midsummer of 1A 9 they swore the Horse-Oath: one Gathering a year, one Horse-Lord chosen at it, and the downs' horses for the One Crown before any other."
 zin_chr_20007_p3:0 "From the empty saddle come the downs' customs: every Gathering leads one saddled, riderless mare round the horse-lines for the crown; a rider who breaks an oath gives up his horse, because the horse carried the oath to the sky; the dead are buried with their horses, facing east; and the downs' loyalty is to the crown itself rather than to any king, which is why under the Order they rode as raiders for a thousand years rather than kneel, and why the Konori riders, who swore later, have never forgiven them for saying so."
 zin_chr_20007_p4:0 "A riderless dun mare at the gallop, saddled, her stirrups flying empty, on dark red. The mare is the banner-mare of the War of Men's last battle, buried in the first horse-barrow under her empty saddle. The Horse-Lords lead a riderless mare at every Gathering in her memory, and the downs' banner shows her running because the riders say the saddle is kept for the lawful king and the mare runs on until he sits in it.\n\nThe sign was carried before the Concord's lancers at the first Concord Council in 4A 212."
 zin_chr_20007_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20007_short:0 "Hunhun"
 zin_chr_20007_sub:0 "Middle Lands · Realm"
 zin_chr_20007_title:0 "Hunhun"
 zin_chr_20008_p1:0 "The western foot of the South Pass is the oldest frontier of the Middle Lands, and every master who held it left something there. Long before Aen the road of the Eastern road-people came over the pass into the downs; in the First Age the mountain kings of the Kalioth held it for Volgan for a century and starved in their forts after Dardan; in the Third Age Elzon's Order sent goblin warbands into the warm caves above it and paid them to watch the range."
 zin_chr_20008_p2:0 "The Guard holds what all of them left. Klungor's grandfather was a captain of the last company of the Unbinding, which swore not to disband until the last of the Order's creatures had left the range; when the war ended and the goblins stayed, the company's survivors would not lay down an oath they had not kept, and Klungor's two hundred took the western foot for land instead of pay so that their children could keep it."
 zin_chr_20008_p3:0 "The Guard's ways come from that unfinished oath: every child of the Guard is sworn at twelve; the company never musters fewer than two hundred on the tower; nobody sleeps in the pass alone; and the Lamp Truce is kept to the letter, because a truce is the only peace with the warrens that an oath of that kind allows.\n\nIn the Tunnel Fight of 4A 887 the Guard took the helmet of the warren-boss who broke the truce, and the hobgoblin king, to have the lamp relit, let them hang it upside down on the tower wall, where it has hung since."
 zin_chr_20008_p4:0 "An iron goblin war-helm hung upside down from a nail, black on pass grey. The helmet is the warren-boss's, taken underground in the Tunnel Fight and hung inverted on the Accord tower at Hungohon when the lamp was relit in 4A 888, by terms the hobgoblin king accepted.\n\nThe captains painted it on the Guard's banner the same spring, in place of the plain grey of a sworn company, so that every goblin on the southern road would know what became of the last one who broke the truce."
 zin_chr_20008_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20008_short:0 "Klungori Guard"
 zin_chr_20008_sub:0 "Middle Lands · Realm"
 zin_chr_20008_title:0 "Klungori Guard"
 zin_chr_20009_p1:0 "The grey hills of Herez have never been quiet. Long before Aen the road of an Eastern people ran over the South Pass into these downs, and the hill-folk keep a word older than any charter for riders who come from the east and do not leave.\n\nIn the First Age the word came true: from about 1A 1500 the mountain kings of the Kalioth, Volgan's allies, held the downs and the South Pass for a century and raised stone forts on the hills, until their garrisons starved after Dardan. The march Edran raised in 1A 1687 was built on their ruins."
 zin_chr_20009_p2:0 "Its first lord, Hezar of the lake houses, was the captain who brought his company home alive from the failed campaign in the Ember Lands, and at Hugomon the last Kalioth fort, its garrison long dead of hunger, still had its iron gate-key hanging inside the door; Edran gave Hezar the key and the march with it."
 zin_chr_20009_p3:0 "From that gift come the march's laws: the Marcher-Lord is Keeper of the Key and locks the southern road himself in war; every heir spends a year in the old forts on the hills; a stranger from the south is held until his business is known; and Herez keeps a long memory, because the forts it lives in were built by the enemy it watches for, and its scouts know that what came north once can come again.\n\nUnder the Order the hill-chiefs buried the key under a hearth and swore on it in secret, and the march's title survived the tribute centuries that way."
 zin_chr_20009_p4:0 "A great iron key, bit downward, on march green above a red base. The key hung inside the gate of the Kalioth fort at Hugomon when Edran's men found its garrison dead of hunger after Dardan; Edran gave it to Hezar when he raised the march in 1A 1687 and bade him lock the road. It is carried before every Marcher-Lord at his taking of the march and turned once in the old gate.\n\nUnder the Order the hill-chiefs kept it buried under a hearth and swore on it in secret, so that the title outlived the tribute years."
 zin_chr_20009_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20009_short:0 "Herez"
 zin_chr_20009_sub:0 "Middle Lands · Realm"
 zin_chr_20009_title:0 "Herez"
 zin_chr_20010_p1:0 "Noleksun's eight towns are young, but the ground under them is the oldest farmed earth of the south-east.\n\nLong before Aen the western march of a kingdom of the Eastern people ran along the road through these downs, and its farmers cut the stone-lined ditches that still drain the fields; when that kingdom broke far to the east, the western branch of its royal house faded among these hills, and the farmers of the march were left with ditches no one else knew how to cut."
 zin_chr_20010_p2:0 "Later masters added their own layers: the Kalioth forts of the First Age, the tribute farms of the Order. The founders of the eight towns came after the Order fell, landless families of the march who took up the fields and found, every time they deepened a drain, an older drain beneath it.\n\nTheir law is the law of the ditch: a field's water belongs to the field below it, so no town may close its drains on another; the tolls of a crossing road are shared, because the road like the water runs through them all; and a quarrel ends in digging, for the eight towns swore the Oath of Eight Hearths over the ditches at Saelori by each driving a spade into the common ground."
 zin_chr_20010_p3:0 "The diggers of 4A 832 showed the farmers a second ditch under the first; the scholars who have seen the stonework say no mason of the march cut it, and the Chief Speakers have so far declined to let anyone dig further.\n\nA long-handled ditching spade, blade down, its blade cut in steps, silver on dark green. At the Oath of Eight Hearths in 4A 774 each town's founder-family drove its own ditching spade into the common ground at Saelori and left it standing, and the first Chief Speaker took up the eldest of them as the confederacy's staff of office."
 zin_chr_20010_p4:0 "The stepped blade copies the old stone lining the farmers find under their drains, which the spade-smiths of Saelori took for the proper shape of a spade without knowing why."
 zin_chr_20010_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20010_short:0 "Noleksun"
 zin_chr_20010_sub:0 "Middle Lands · Realm"
 zin_chr_20010_title:0 "Noleksun"
 zin_chr_20011_p1:0 "The ents of Kilinti stood on the upper Aenar before men named it, and what they were before that they do not say. The forest's history as men know it begins with the edge-folk, families of the Age of Kingdoms who came to the forest edge for fallen wood and were let stay on one condition: that they speak for the forest to any lord who asked it a question, since the ents answer so slowly that a lord would die before he heard."
 zin_chr_20011_p2:0 "The bargain was tested when Aen's young kingdom asked the forest for its oaks in 1A 77. The Ent-Moot took three springs over it, and its answer came without a word: on the last day the eldest oak of the moot-grove let fall a single great bough before the envoy. The Reeve who carried the answer to Parim explained it, and the Timber Bargain has held for four ages since: the kingdom may have every tree that falls of itself and none that stands."
 zin_chr_20011_p3:0 "From the fallen bough come the forest's ways: the edge-folk trade only in deadwood; a Reeve speaks for the ents and is punished if he speaks for himself; the timber that Kilinti's charter owes the crown is paid in what the wind brings down; and the ents remember the one time they acted quickly, when the Black Roots of the Necromancer crept up the valley in 3A 780 and they walked to the eastern edge and pulled the dead roots out of the ground with their hands, after which the forest was silent for a year."
 zin_chr_20011_p4:0 "A fallen oak bough lying across the field, leaved and bearing acorns, brown and green on pale gold. The bough is the one the eldest oak let fall before Aen's envoy in 1A 77, the ents' whole answer to the kingdom's request for timber.\n\nThe Reeves keep a piece of its wood in the moot-grove at Ollolor and carry a painted bough before them when they speak for the forest in Parim, and every timber-bill the edge-folk sell is sealed with a fallen branch, never a standing tree."
 zin_chr_20011_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20011_short:0 "Kilinti"
 zin_chr_20011_sub:0 "Middle Lands · Realm"
 zin_chr_20011_title:0 "Kilinti"
 zin_chr_20012_p1:0 "Safeton's people are bargemen before they are anything else. The Safen is the Great Lake's only outflow, and long before Aen the barge-folk who poled the lake's grain down it to the sea were their own small people of boats, with a custom the ship-houses still keep: at the river mouth, where the lake's sweet water meets the salt, every barge pours one bucket of lake water into the sea at the spring sailing, so that the lake will know where its children have gone."
 zin_chr_20012_p2:0 "The ship-houses that owned the warehouses at the mouth grew from barge-families, and the harbour has had no lord since the Grey Breath of 2A 410 killed the crown's governor and the ship-houses ran the town through the plague and would not give it back. Their whole craft is the craft of surviving masters.\n\nWhen Elzon's Order took the Vale, the ship-houses sank their best hulls in the Safen mud, raised them on moonless nights to smuggle for the Isle Houses and sank them again before dawn, and for nine centuries and more the Order taxed a harbour of rotten fishing boats."
 zin_chr_20012_p3:0 "From that comes the harbour's character: no lord, because a lord can be made to give up his ships; council votes taken by hull, not by house; a contempt for anything that cannot float; and the knowledge, taught to every ship-house child, of where in the mud the hulls once lay."
 zin_chr_20012_p4:0 "A black ship's hull, keel upward, rising out of a mud-brown base, on pale sea-green. The keel-up hull is a sunken ship rising from the Safen mud, the sign the smugglers of the Order's centuries chalked on the doors of houses that had a hull in the river. When the Order fell in 3A 1260 the ship-houses raised every hidden hull on one tide and sailed them into Lotrenri under the chalked sign, and the Council of Ship-Houses has flown it over the harbour since."
 zin_chr_20012_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20012_short:0 "Safeton"
 zin_chr_20012_sub:0 "Middle Lands · Realm"
 zin_chr_20012_title:0 "Safeton"
 zin_chr_20013_p1:0 "The warm spring of Hordorton is older than any name the drovers gave it, and the drovers of the south road tell how it was found: long before Aen, in a summer of drought, a drover's ox, dying of thirst at the crossing of the roads, went down on its knees and struck the ground with its horn, and warm water came up where it knelt.\n\nThe drovers buried the ox beside the water and set its horns over the spring, and the first spring-house of Sulethe was raised over the grave before there was a town."
 zin_chr_20013_p2:0 "The spring-masters' customs come from that kneeling: whoever comes to the spring is given water before he is asked his business, ox or king; no beast is slaughtered within sight of the spring-house; a drover's ox is watered free; and the masters bow when they draw water, because the spring was given to a creature on its knees."
 zin_chr_20013_p3:0 "The water's healing was proved in the fever years of 2A 640, when the sick who drank only from the spring died less often than the rest, and the spring-houses became the hospitals of the southern Vale. That gift has its other side. Freshon has always served whoever came, and in 4A 1731 the spring-masters knelt to the Golden King for a Golden Charter at a price that emptied three generations of savings, which Pazoma's guild-masters never tire of mentioning."
 zin_chr_20013_p4:0 "A white ox kneeling, on a field of warm red-brown. The kneeling ox is the drovers' ox that found the spring, whose horns hung over the first spring-house until demon raiders burned the house in 2A 1240 and the horns were lost. The spring-masters had the kneeling ox carved over the new door and painted on the carts that carried the sick to the spring-houses, and in fever years a cart bearing the kneeling ox was let through every closed road of the southern Vale."
 zin_chr_20013_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20013_short:0 "Freshon"
 zin_chr_20013_sub:0 "Middle Lands · Realm"
 zin_chr_20013_title:0 "Freshon"
 zin_chr_20014_p1:0 "Pazoma began as a mercy. In the last years of the War of Men the craftsmen of the beaten kings, smiths, glass-blowers, dyers and the rest, were gathered at the deep bay of Horlomon by victors who had no use for craftsmen bound to dead crowns, and the guilds' own chronicle says they were spared on one condition: that they make things for the peace and none for war."
 zin_chr_20014_p2:0 "When Aen's Peace of the One Crown forbade the lords to make war on one another, the crown took up the lords' surplus swords, and in 1A 410 the seven guilds of the bay bought the whole hoard by weight and melted it into the guild-hall bell, the largest ever cast in the Middle Lands, with one blade kept whole for its clapper."
 zin_chr_20014_p3:0 "From the bell come Horlomon's laws and pride: no guild of the bay forges a weapon, though its glass, paper and cloth go to every army of the Concord; the bell rings for every guild election, every charter and every wrong the town will not bear, as it rang for three days in the Bell Riot of 4A 1610; the town has never had a lord, because its craftsmen were the beaten kings' and swore never to serve one again; and the paper-makers' conviction, proved under the Order when they hid the kingdom's books in the guild cellars, that a city of craft outlives a city of soldiers."
 zin_chr_20014_p4:0 "A bronze bell whose clapper is a sword-blade, gold on deep blue. The bell is the guild-hall bell of Horlomon, cast in 1A 410 from the swords the Peace of the One Crown took from the lords, with one blade left whole to strike it. The paper-makers printed it inside every book they hid under the Order, so that the books could be found again, and the guild council flies it over the hall whenever the bell is rung."
 zin_chr_20014_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20014_short:0 "Pazoma"
 zin_chr_20014_sub:0 "Middle Lands · Realm"
 zin_chr_20014_title:0 "Pazoma"
 zin_chr_20015_p1:0 "The Isle Houses are what is left of the Water clan of the Low Country. When the plain still lay where the Crown Sea is now, Aenor Isle and the Tinta Hills were its eastern heights, and the Water clan's cord-mothers kept the harbours and sluices of the plain's eastern edge.\n\nOn the Night of the Sea the eldest woman of the clan steered the last boat out of the drowning streets, standing at the steering-oar through the whole night until the tide turned at dawn, and brought it to the heights with the clan's mothers aboard; the five daughters' lines of that boat became the houses of Orohaf, Rish, Tinta, Holod and Faber."
 zin_chr_20015_p2:0 "They lost the Orran tongue in the centuries after and kept everything else of the Low Country's last law: the eldest women rule; the dead are given to the tide that took the land; and the queen of the isle is chosen in the tide-chamber at the turn of the tide, the hour the steerswoman's boat touched the heights, when the queen-to-be takes the steering-oar of her house and holds it until the water stands still."
 zin_chr_20015_p3:0 "Every isle child learns to dive before it learns its letters, and the old divers of Borrak say that at the lowest spring tides a mound breaks the water west of the isle, and that the houses have always known what lies under it and have never dived for it. Whether that is true, the tide-mothers will not say.\n\nA white steering-oar standing upright, blade down, on a field of sea-blue over black. The oar is the steering-oar the Water clan's eldest woman held through the Night of the Sea, and every queen since has been chosen by taking her house's oar in the tide-chamber at the turn of the tide and holding it until the water stands still."
 zin_chr_20015_p4:0 "When the five eldest women swore the Tide-Oath at Borrak in 1A 133, they set five oars upright in the harbour mud with the queen's in the middle, and the isle's ships have flown the white oar since."
 zin_chr_20015_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20015_short:0 "Orohaf"
 zin_chr_20015_sub:0 "Middle Lands · Realm"
 zin_chr_20015_title:0 "Orohaf"
 zin_chr_20016_p1:0 "Fotan's chain is young, but the crossing it closes is the oldest road between the Middle Lands and the North. Before the Ship-Bond of 1A 207 the narrowest crossing of the strait was worked by ferry-families on both shores who had no king and paid no one, and the strait-folk's eldest saying is that a crossing belongs to whoever keeps the boats in repair."
 zin_chr_20016_p2:0 "The ferry-folk of Deoreh also tell, and nobody has disproved it, that in the deep winters of their grandmothers' grandmothers they heard knocking under the landing, slow and regular, as of picks far below the strait, and that one winter the knocking stopped and never came back. The house of Ostvar grew out of the Order's centuries."
 zin_chr_20016_p3:0 "In 3A 1104 a Leren sea-captain of that name married the daughter of the Aenoran ferry-house at Deoreh, and when the Order's tribute ships came to cross he cut his ship's anchor-chain from the anchor and stretched it across the landing, and the two families charged the Order to pass. The Order burned their tower twice and never kept them out."
 zin_chr_20016_p4:0 "From the chain come the lordship's habits: the strait-folk pay their toll to a house, not a crown; Fotan refuses any charter that would make its toll a crown's; it belongs half to the North and half to the Vale and marries into both; and its lords count their descent from a Leren house whose name the margraves of Molot also bear.\n\nA black chain drawn taut straight across the field, on a field of red over white. The chain is the anchor-chain of Ostvar's Leren ship, which he cut from its anchor and stretched across the landing at Deoreh when the Order's tribute ships came to cross in 3A 1104."
 zin_chr_20016_p5:0 "A link of it is hammered into the toll-post at the landing and the lord of Fotan wears another at his throat; the red over white are the colours of the two families, the Leren captain's and the Aenoran ferry-house's, who held the chain between them."
 zin_chr_20016_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20016_short:0 "Fotan"
 zin_chr_20016_sub:0 "Middle Lands · Realm"
 zin_chr_20016_title:0 "Fotan"
 zin_chr_20017_p1:0 "The delving-clans of the Lunhrim massif were one hold of a realm older than any crown of men: the Stone Road, the dwarves' kingdom of deep roads, which joined the western ranges, the Great Wall range and the High Mountains of the North under the floor of the sea, so that a dwarf could walk from the West Lands to the North without seeing the sky."
 zin_chr_20017_p2:0 "Its seat was the Great Hall of the Deep King, under hills that are now the floor of the Sea of Monsters, and Kunhrim was its eastern gate. In Volgan's war the Damned Spirits rose from beneath the mountains into the roads; the roads under the sea were broken, the sea was let in, and the Great Hall drowned with the spirits inside it."
 zin_chr_20017_p3:0 "Kunhrim says the Deep King gave the order with his own mouth and that the clans of the massif only carried it out; the western holds say Kunhrim's lords urged it to save their own gate, and the four holds have had no Deep King since. Kunhrim's delvers then fought beside the Grand Alliance and brought down the tunnels the spirits came through."
 zin_chr_20017_p4:0 "From the drowning comes the hold's character: the sealed Sea-Door at the head of its old road, cut with the names of the last delvers, which no dwarf of the massif may touch; the claim, kept in every lord's oath, that Kunhrim holds the Deep King's last command in trust; the readiness to call the holds to a moot that the western holds always refuse; and a coldness to elves older than the Iron Charter, for the clans say the elves of the Magical Lands watched the Stone Road drown and sent no one down."
 zin_chr_20017_p5:0 "The Deep King's crown, an iron circlet of square points, above a wavy band of dark blue, on black. No dwarf has worn the Deep King's crown since the Great Hall drowned, and the crown is shown above a band of sea because it lies under the sea with the hall.\n\nKunhrim's lords have borne it on their banners since the Sea-Door was sealed in 1A 1660, as the hold that says it carried out the last king's command, and they carried it beside Edran's dyed cloak at the crossings in the last war of the First Age."
 zin_chr_20017_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20017_short:0 "Kunhrim"
 zin_chr_20017_sub:0 "Middle Lands · Realm"
 zin_chr_20017_title:0 "Kunhrim"
 zin_chr_20018_p1:0 "The goblins of Burrikkrit came to the Cursed Mountains as the Order's hirelings, and they are not ashamed of it. In 3A 38 Elzon's Order sent goblin warbands from the southern ranges into the warm caves under the mountains to watch the South Pass and the unconquered elves, paid them in plunder and promised them, the warrens say, the whole range for ever."
 zin_chr_20018_p2:0 "The first warband carried a single shuttered lantern, and its boss set it in the throne-cave of Glimzig and said that while it burned the warren would stand; it has been relit from its own flame at every king's death since, and the hobgoblin kings hold the throne by holding the lantern. When the Necromancer fell, the goblins learned the thing on which their realm stands: that a promise outlives the one who made it, if you are stubborn enough.\n\nNobody could dig them out."
 zin_chr_20018_p3:0 "From the lantern and the promise come the warrens' customs: the king is the one who keeps the lamp and the biggest who can; a warren whose lamp goes out is finished and its goblins are taken in by others; every bargain, from the Lamp Truce with the dwarves to the smugglers' rate on the under-roads, is sworn with a lit lamp between the parties; and the goblins measure their right to the range not by any charter but by how long nobody has managed to remove them.\n\nThe dwarves call that theft and the Guard calls it a siege; the warrens call it the promise kept."
 zin_chr_20018_p4:0 "A shuttered iron lantern with one shutter open on a yellow light, on dark red-brown. The lantern is the first warband's, set in the throne-cave of Glimzig in 3A 38 and relit from its own flame at every king's death.\n\nThe Lamp Truce of 4A 96 was sworn over it, carried up to the Accord tower by the hobgoblin king himself, and the warren-bosses paint it on their shields with as many shutters open as they dare, since a shutter open too wide is a boast the king may answer."
 zin_chr_20018_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20018_short:0 "Burrikkrit"
 zin_chr_20018_sub:0 "Middle Lands · Realm"
 zin_chr_20018_title:0 "Burrikkrit"
 zin_chr_20019_p1:0 "The gnomes of the Deodolor Hills say their first holt was dug under an old tree north of the Stone Forest before the War of Men reached the hills, and that the war taught them the only law they keep. In those years a beaten king of the Vale hid his treasury in the hills, and the gnomes found it and took it; the warlord who came after it took it from them by force, and every man who carried a coin of it away died badly within the year, the warlord first."
 zin_chr_20019_p2:0 "The gnomes concluded that gold has a memory: given freely it brings fortune back with it, taken it brings ruin. They have kept the account since, and Naisa of the twelve, whom they honour as the keeper of fortune's ledger, is the only god they ask into a holt.\n\nThe first village-king was the gnome whose pot was fullest of gold freely given, and he was crowned with the rim of his own pot, struck off and beaten round into a circlet, so that his crown was the measure of his luck; every village-king since has been crowned the same way whenever a pot is full."
 zin_chr_20019_p3:0 "From the account come the holts' customs: a pot of gold left freely on a quarry ledge buys a mason's good fortune; a stolen coin is never kept; a holt that grows too rich gives its gold away before the luck turns; and the gnomes' great fear is not being found but being robbed, which is why they hide so well within a day's walk of Parim."
 zin_chr_20019_p4:0 "A crown beaten from the gold rim of a cooking-pot, its two handles standing as side-points, on dark green. The first village-king of Tovodor was crowned with the rim of his own pot, struck off when it was full of gold freely given and beaten round into a circlet, and every crowning since has made a new one the same way.\n\nThe kings' old rims hang in the king's holt in order, the eldest at the top, and the gnomes cut the pot-rim crown into the doors of their holts where only another gnome knows to look."
 zin_chr_20019_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20019_short:0 "Olodor"
 zin_chr_20019_sub:0 "Middle Lands · Realm"
 zin_chr_20019_title:0 "Olodor"
 zin_chr_20020_p1:0 "The elves who lived on both sides of the Great Wall before the First Age ended were hill elves of the western woods, kin of Herrodon, and they buried their dead in the Kingdom Forests at the foot of Lunhrim with a beech planted on each grave, so that the grave would have a voice when the wind came through it. The household of Thamiel is the one that would not leave them."
 zin_chr_20020_p2:0 "After Edran's campaign in the Ember Lands, in which many elves died for a war they had opposed, the elves of the western woods were called home east of the range, and the household's dead from that campaign were too newly buried to leave. The Eldest answered Herrodon that a beech planted on a grave cannot be carried over the mountains, and the household stayed; Herrodon wrote its name as lost, and the household wrote the queen's as mistaken."
 zin_chr_20020_p3:0 "From the graves comes everything that makes Dunelaeth what it is: it lives on the wrong side of the mountains because of its dead; it sings the Kindred Song in its old western form because its dead learned it so; it guided the resistance over the Lunhrim Notch under the Order because the grave-beeches showed the way in snow; and it gives the pass road its guides, because a household that keeps graves must keep the roads to them.\n\nEach Eldest is buried among the beeches, and the household's quarrel with Herrodon is not about who left whom but about whether the dead can be left at all."
 zin_chr_20020_p4:0 "A silver beech leaf laid on a green grave-mound, on twilight blue. At the Staying of 1A 1678 the Eldest sent Herrodon's envoy home with a single leaf from the grave-beeches instead of an answer, and the queen of Herrodon kept it in the book where she wrote the household's name as lost.\n\nThe household has borne the leaf on the mound since; its guides wore it painted on their cloaks over the Lunhrim Notch on winter nights, so that a fugitive of the resistance would know whom to follow."
 zin_chr_20020_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20020_short:0 "Dunelaeth"
 zin_chr_20020_sub:0 "Middle Lands · Realm"
 zin_chr_20020_title:0 "Dunelaeth"
 zin_chr_20021_p1:0 "The Baelim say that their oldest stand, Graulvoa, was already standing when the sea first reached the north coast, and the Selen rangers who live round the forest have no story older than the Baelim's low voices. What the rangers have learned in four ages of watching is a pattern rather than a history.\n\nThe great wet forest has never been cut and never burned twice: when the Redbark fired its eastern edge in 2A 1120 the Baelim came out and pulled down the raiders' camp trees, and when the Order's woodcutters went in for its giant conifers in 3A 860 not one came back."
 zin_chr_20021_p2:0 "After each of these the forest kept a silence, a whole year in which no Baelim voice was heard, and where trees had fallen the rangers found the cones of the dead trees gathered and laid closed in rows at the forest's edge, never opened, as if kept for something."
 zin_chr_20021_p3:0 "The Standing Silence is the rangers' name for those years, and the Baelim's way of life seems to grow from it: they do not grieve aloud; they keep what the dead trees leave; they never share a forest with the ents; and they listen, the rangers think, to something under the roots that is older than the stand. What it is, the Baelim will not say, and the moots have learned not to send anyone in to ask.\n\nSelen leaves water at the edge in dry summers, and nobody knows whether the Baelim drink it."
 zin_chr_20021_p4:0 "A closed black pine-cone, upright, on deep forest green. The closed cones are those the rangers found laid in rows at the forest's edge after the Burnt Edge and after the cutters who did not return, the cones of the dead trees kept unopened.\n\nSelen's rangers have marked the forest's boundary with a painted closed cone since 2A 1121, as a sign to their own people and to the Redbark, and the moots call the forest by it in their books, since the Baelim have never shown a sign of their own."
 zin_chr_20021_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20021_short:0 "Aenor Forest"
 zin_chr_20021_sub:0 "Middle Lands · Realm"
 zin_chr_20021_title:0 "Aenor Forest"
 zin_chr_20022_p1:0 "The Veiled are the eldest heirs of the Low Country, the drowned plain whose Moot of Mothers governed more land than Aenor ever held, and without a crown. Its law was kept on knotted cords, one knot for every field, debt, marriage and death, and when the mothers overdrew the land's magic and the ground sank below the sea, every field the sea took was tied on the Moot's cord as a black knot; the last black knot was tied for the Night of the Sea."
 zin_chr_20022_p2:0 "The Orran kingdoms that survived on the river valleys kept the cords through the War of Men, and when Aen's victory ended it the houses that would not kneel carried the Moot's cord, the Last Cord, into the eldest barrow of the grey downs."
 zin_chr_20022_p3:0 "Since then the cord-mothers have kept its count on the Old Tallies, and the Veiled have built their life on the lesson of the black knots: a land must never be asked for more than it gives; a name tied into the mother's cord is never untied, and a name stolen is a knot cut; and the hood their women wear, from which the Vale took its name for them, is the mourning hood for the drowned. The second death of land they suffered taught it again."
 zin_chr_20022_p4:0 "In 3A 744 the Black Roots of the Necromancer reached the downs, and his attempt to turn the land's magic soured the ground for ever; the Veiled count the sour downs as the second land to die of being asked too much. They stayed, learned to grow roots and mushrooms in it, and refuse every crown, because every crown asks.\n\nA grey cord hanging in a loop, tied in one black knot, on sour grey-green. The black knot is the last tie of the Last Cord, the knot the Moot tied for the Night of the Sea, which lies with the cord in the eldest barrow of the grey downs."
 zin_chr_20022_p5:0 "The cord-mothers tie a black knot into the cord of every Veiled child at its naming, so that each carries the drowning with her, and the Concord host of the Grey March in 4A 1310 found a black knot tied to the rope of every poisoned well."
 zin_chr_20022_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20022_short:0 "Cursed Lands"
 zin_chr_20022_sub:0 "Middle Lands · Realm"
 zin_chr_20022_title:0 "Cursed Lands"
 zin_chr_20023_p1:0 "The Redbark are the warlike heirs of the Low Country, and their forest is a cord-hall made of trees. When the sea drove the Orran houses east off the drowning plain, those of the Wolf, Bear and Raven clans who would not settle under the valley kings went north into the great red-oak forest above the Konorar and hung their mothers' cords in the oaks.\n\nThe Redbark tell that the oaks bled when the cords were tied to them and have bled since whenever their bark is cut, because the forest took the drowned into it with their names; the oaks of the forest do run red when cut, and no other red-oak wood in Aoaz does the same."
 zin_chr_20023_p2:0 "From the cord-trees comes the Redbark's double life: in peace the cord-mothers rule and read the names on the trees; for a raid the moot chooses a war-chief and takes the office back at the peace, as the Low Country did in its wars; a blood-price is paid by tying a knot for the dead into the killer's clan cord; and a feud is ended by the mothers, never by the chiefs."
 zin_chr_20023_p3:0 "They kept the old tongue and the beast-clans long after the Vale forgot them, and they keep a hunter's grievance: the rivers of the Vale have Orran names, the Redbark say, because those rivers were theirs, and they would take the names back. Under the Order the Necromancer's dead came into the forest and did not come out, and the Redbark say it was because the trees hold the names, and what is already counted cannot be raised.\n\nA red oak leaf, stem upward, letting fall one red drop, on black. The bleeding leaf is the cord-tree's, the oak the Redbark say took the drowned into it with their names."
 zin_chr_20023_p4:0 "The cord-mothers cut a leaf and a drop into every cord-tree when a new name is tied there, and the war-chiefs carry it painted on a hide on a raid so that the clan's dead go with them; the Selen rangers who burned the cord-trees at the forest's rim in the Red Winter of 4A 1608 learned what the sign meant the next spring."
 zin_chr_20023_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20023_short:0 "Bloody Forest"
 zin_chr_20023_sub:0 "Middle Lands · Realm"
 zin_chr_20023_title:0 "Bloody Forest"
 zin_chr_20024_p1:0 "When the winters of the Sunfields lengthened and the ice came south over the Fandan meadows, the clans that would not leave the north gathered at the last of the old king's halls, and when that hall too was given to the snow its fire-keepers did not let the fire die.\n\nThey carried an ember of the hall's hearth in an aurochs horn lined with clay and bound with bronze, feeding it through the first Long Dark that men of the north ever lived through, and from that ember every clan that stayed relit its fire."
 zin_chr_20024_p2:0 "Out of that winter came the hearth-law that still rules the Cold Lands: no feud may be carried past a shared fire, a house that lets its fire die in the Long Dark relights it only from the clan fire, and whoever keeps the fire must feed whoever reaches it.\n\nThe horn passed from keeper to keeper among the Fandan clans for longer than any song can count; it was at the horn's fire that Kolar fed every clan in the Hunger Winters, and around it that the first Frost-Hall was raised in 2A 600."
 zin_chr_20024_p3:0 "The Winter Crown is therefore a crown of keepers rather than conquerors: its queens are crowned with a hand on the horn, its fire-keepers teach that the land was punished and the fire is what was spared, and its whole authority in 4A 1748 still rests on the promise the old keepers made, that whoever reaches the fire will eat."
 zin_chr_20024_p4:0 "The Ember-Horn: a curved horn bound with bronze bands, mouth upward, with a single red ember glowing at its mouth, gold and red on a deep night-blue field, with a white hem of square hearth-stones. The Ember-Horn is the clay-lined aurochs horn in which the last fire-keepers of the Sunfields carried an ember of the old king's hearth into the first Long Dark."
 zin_chr_20024_p5:0 "It hangs in the Frost-Hall above the fire that the keepers say has never gone out, and Queen Ilvra I was crowned with her hand on it in 4A 850. The clans had sewn the horn on their moot-cloths long before there was a crown, as the mark of a fire that feeds all comers, and when the Winter Crown raised its first banner it took the clans' mark instead of inventing one, so that no clan could say the crown had come from outside the hearth."
 zin_chr_20024_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20024_short:0 "Coldor"
 zin_chr_20024_sub:0 "Cold Lands · Realm"
 zin_chr_20024_title:0 "Coldor"
 zin_chr_20025_p1:0 "The Ormolak valley was never a land of the hearth-keepers. The clans who came up its sheltered floor after the Sunfields fell were hunters and bog-smiths, and for longer than the songs can count they were raided from the Frozen Ocean coast by sea-wolves whose home no southern chart has fixed.\n\nThe march's own tale says that in 2A 1779 Zorak, a bog-smith's son, went down into the cliff below Minnolomak where the north wind howls through the rock and bargained there with the storm that had sunk more raiders than any warrior had killed."
 zin_chr_20025_p2:0 "Zorak forged a gauntlet of black iron from the keel-bolts of the first raider ship the wind broke, swore his men into it hand by hand, and set them to cut the Black Gallery, where the wind's token still hangs.\n\nFrom that bargain come the laws of the march: no warlord wears a crown, because Zorak promised the wind that no man of the valley would rule by birth; every oath is sworn with the hand inside the gauntlet; a token is kept for every wind that sinks an enemy; and the oath-companies would rather go hungry than eat bread they did not take or earn."
 zin_chr_20025_p3:0 "The Iron Crown that hangs unworn in the Black Gallery is the crown Zorak refused, and Melkgard's refusal of the Winter Crown in 4A 850 was, to the march, only the same refusal said again.\n\nThe Sworn Gauntlet: a black iron gauntlet raised with its fist closed, on a storm-grey field, with a black hem of jagged teeth. Zorak forged the gauntlet from the keel-bolts of the first raider ship that the Black Wind drove onto the rocks of the Gulf of Minnolomak, and every oath-man of the first companies swore by putting his hand inside it while Zorak closed his own hand over the iron."
 zin_chr_20025_p4:0 "The gauntlet was burned with him on his pyre and taken out of the ashes whole, which the march counts as the wind's answer, and since then each new warlord is chosen over his predecessor's pyre with the gauntlet on his hand and never a crown on his head. The oath-companies painted the closed fist on their shields before the march had any banner, and the black-stone forts fly it on grey."
 zin_chr_20025_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20025_short:0 "Melkgard"
 zin_chr_20025_sub:0 "Cold Lands · Realm"
 zin_chr_20025_title:0 "Melkgard"
 zin_chr_20026_p1:0 "Horidor's clans say that the Neck Road was walked before it was cut. When the Sunfields' fields failed, a great part of its people went south over the neck toward the West Lands, and the road-wardens of the old king raised cairns along the Neridor Gap so that those who followed in the whiteout would not lose the way."
 zin_chr_20026_p2:0 "The wardens' last order, as the clans tell it, was to keep the cairns standing until the walkers came home; nobody came home, and the wardens' children kept the cairns anyway, adding a stone each time they passed and setting a guide-pole bound with a red rag on the high cairns so that the road showed through the snow.\n\nThe custom became law: a traveller who adds no stone pays the cairn-due instead, no clan may pull down a cairn even in war, and the moot of Ollondo exists to keep the road and not to rule the people beside it."
 zin_chr_20026_p3:0 "When Aenor's surveyors came in 1A 400 the clans who guided them had never heard of a king, but they knew every cairn by name, and they keep the cairn-names still as their history: the high cairns are named for the wardens and the low ones for the travellers who died between them.\n\nIn 4A 1748 Horidor counts its strength in passable miles rather than in men, greets the Gunwyn clans of the West Lands as the walkers who never came back, and knows that whoever closes the Gap closes the north."
 zin_chr_20026_p4:0 "The Guide-Pole: a grey stepped cairn with a tall pole rising from its top, a red rag streaming from the pole, on a dark green field, with a white hem. The red-ragged guide-pole is the mark the old road-wardens set on the high cairns of the Neridor Gap so that walkers could see the road through a whiteout, and every Horidor chief still sets one with his own hands on the highest cairn when he is chosen."
 zin_chr_20026_p5:0 "The moot's first banner, raised at Ollondo in 2A 340, was a red rag tied to a pole and carried up the Gap ahead of the chiefs who swore to keep the road; it was sewn onto green cloth with the cairn beneath it when Chief Bransdok Azling carried it to the Gap to swear the Northern Accord in 4A 850."
 zin_chr_20026_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20026_short:0 "Horidor"
 zin_chr_20026_sub:0 "Cold Lands · Realm"
 zin_chr_20026_title:0 "Horidor"
 zin_chr_20027_p1:0 "The steading lords of Fearno tell the end of the Sunfields differently from the fire-keepers of Fandanar. In their telling, when the fields failed the last king of the old hall called every clan to bring its herds to him so that the hall might live, and the moor clans of the Naepu, who saw that the herds would be eaten and the hall would empty all the same, bound their spears together on the river ice and refused him."
 zin_chr_20027_p2:0 "The king's hall died that winter, the moor clans lived, and from that refusal the moor folk took the conviction that a crown eats first and feeds last. Their law came out of it: no lord above the lords, a first lord chosen only to speak and only for a term, every steading's stores open to a hungry neighbour, and a spear laid in the bundle by each lord at the moot to show that he is bound to the others and to nobody else."
 zin_chr_20027_p3:0 "The Naepu clans kept the Spear-Binding through the Second Age while they learned to sow moor oats in the river bends, and when Fandanar and Minnolomak both sent for their oath in 4A 1304 the steading lords did at Azenoalion what their forebears had done on the river.\n\nIn 4A 1748 the hall still argues for a month before it agrees, because agreement must be every lord's, and the Free Steadings are the one people of the north who would refuse a crown of the Sunfields even if it were offered to them as their own."
 zin_chr_20027_p4:0 "The Bound Spears: seven upright spears bound together at the middle by a red cord, white on a dark moss-green field, with a brown hem of hide stitching. Each steading lord brings his own spear to the hall at Azenoalion and lays it in the bundle when the moot opens; the red cord is tied round the bundle by the eldest lord present and cut by the first lord when the moot closes."
 zin_chr_20027_p5:0 "The clans say the first bundle was tied on the Naepu ice when their forebears refused the last king of the old hall, and the banner of seven spears was first sewn for the Free Steadings in 4A 1304, one spear for each steading that swore the refusal; the banners of the Melkgard raiders lost on the open snow in 4A 1112 hang beneath it in the hall."
 zin_chr_20027_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20027_short:0 "Fearno"
 zin_chr_20027_sub:0 "Cold Lands · Realm"
 zin_chr_20027_title:0 "Fearno"
 zin_chr_20028_p1:0 "The east coast was not peopled from the Sunfields' meadows but from the sea. The jarls' tale is that a crew of seal-hunters, driven north-east by a gale out of the Siroler ice in a year no one counts, lost every landmark and followed a white spear-whale that surfaced ahead of them each morning until it led them through the pack into the sheltered water below the eastern cliffs, where it beached and died."
 zin_chr_20028_p2:0 "The crew ate of it, built their first hall from its ribs and swore over its tusk never to hunt a white whale, to give the sea back the first catch of every season, and to land every whale at one harbour so that no crew could starve while another feasted."
 zin_chr_20028_p3:0 "That oath is the root of the whale-tithe that Jarl Kolim Ezhair claimed when he built the harbour hall and its boom at Vaestia in 4A 612, and of the custom that a jarl must have captained a whaling crew, because the jarl is the one who has followed the whale. The Tusk of Vaestia still stands beside the jarl's seat, and every crew touches it before the first voyage of the Long Light."
 zin_chr_20028_p4:0 "The east coast takes its law from that harbour rather than from any crown because, as the whalers say, the whale chose the harbour and no queen did, and in 4A 1748 the jarl still answers every envoy from Fandanar by pointing at the tusk.\n\nThe Tusk of Vaestia: one long spiral whale-tusk standing upright, white on a deep sea-red field, with a black hem of curling waves. The device is the tusk of the white spear-whale that led the first crew through the Siroler pack and beached itself below the cliffs, which the Ezhair jarls keep upright beside their seat in the harbour hall."
 zin_chr_20028_p5:0 "Crews cut its shape into their prows long before the jarldom, and when Jarl Kolim Ezhair hung the harbour boom in 4A 612 he flew the tusk on red sailcloth from the winch-post, the red standing for the first catch of the season given back to the sea; it has flown there every Long Light since."
 zin_chr_20028_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20028_short:0 "Austklev"
 zin_chr_20028_sub:0 "Cold Lands · Realm"
 zin_chr_20028_title:0 "Austklev"
 zin_chr_20029_p1:0 "The Worlond Forest is where the Sunfields' people parted. The clans who walked south over the neck came down from the Neridor Gap into the forest, and at the great clearing that is now Tarvak, half-way between the Gap and the West Lands, those who meant to go on and those who could walk no further made their farewells.\n\nThe forest clans' tale says that each party planted a young fir at the clearing's edge, the walkers' fir on the south side and the stayers' fir on the north, and that in time the two trees grew together into one trunk, so that the forest belongs to both lands and neither may cut it."
 zin_chr_20029_p2:0 "The stayers became the forest clans, who learned to live by charcoal, timber and the passing trade, and whose oldest law is the Stage Law: a traveller from either side who reaches a forest fire must be given dry wood and fodder for the night, and no forest man may take sides between the north and the south."
 zin_chr_20029_p3:0 "The Neck Road Compact of 4A 1214 only gave a lord to what the clans had always done, and the Hozening lords still swear their office under the Twin Firs with one hand on the north side of the trunk and one on the south. In 4A 1748 Worlond sells timber to both, keeps the stages for both, and fears above everything a war that would make it choose between the two halves of one tree."
 zin_chr_20029_p4:0 "The Twin Firs: two black fir trees grown together from one trunk, on a field of gold, with a green hem of fir-needles. The Twin Firs stand at the edge of the clearing of Tarvak, and the forest clans hold that they are the two firs planted when the walkers and the stayers of the Sunfields parted."
 zin_chr_20029_p5:0 "The clans sewed the joined trees on the cloths hung by their forest fires long before there was a lord, and Yorak Hozening took them as the sign of the Lordship of the Stages in 4A 1214, because the compact asked one man to answer to both crowns and the tree already did; the Burning of Hozoson in 4A 1390 stopped short of the clearing, which the forest folk count as the trees' own luck."
 zin_chr_20029_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20029_short:0 "Worlond"
 zin_chr_20029_sub:0 "Cold Lands · Realm"
 zin_chr_20029_title:0 "Worlond"
 zin_chr_20030_p1:0 "Fandhavn's guild counts its history from two ships. The older pilots say that the Fandan mouth was where the last sea-craft of the Sunfields put out west for the isles, and that the river ice has always been read by those who stayed behind; the first ship the guild remembers by name, though, is the Aenoran post's ship that came to the Fandan mouth around 1A 310, whose pilot was a man of the Coldic coast hired at Alorio because no southerner could read the river ice."
 zin_chr_20030_p2:0 "The post's pilots were his apprentices, and the guild that chose the first Harbour-Master in 1A 905 was theirs. The second ship is the one they burned.\n\nIn 3A 702 servants of the Necromancer's Order moored at Fandhavn to load the dead they had bought from a starving coast clan, and Harbour-Master Zenka Grindair, with the Fandan chiefs' riders on the quay, set the ship alight and pushed it off with the first pilot's steering oar, whose blade was charred red in the burning."
 zin_chr_20030_p3:0 "From that night come the harbour's laws: no ship may load the dead at Fandhavn, a ship that refuses a guild pilot is not protected, the harbour book records every ship and every refusal, and the free port sells to every flag but bows to none. The charred oar hangs over the guild's book still, and the free port of 4A 1748 is proud above all of being the harbour that the Necromancer's ship never left."
 zin_chr_20030_p4:0 "The Burned Oar: a white steering oar standing upright with its blade red, on a deep blue field, with a white hem of river-ice blocks. The first pilot's steering oar was kept by the guild as its master's staff long before 3A 702, but on the night of the March of Bones Harbour-Master Zenka Grindair used it to push the burning ship of the Necromancer's buyers away from the quay, and its blade came back charred red.\n\nThe guild has carried the oar with its red blade at the head of every harbour procession since, sewn it on the flag that flies over the book-house, and had every Harbour-Master swear his office with his hand on the burned wood."
 zin_chr_20030_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20030_short:0 "Poloto"
 zin_chr_20030_sub:0 "Cold Lands · Realm"
 zin_chr_20030_title:0 "Poloto"
 zin_chr_20031_p1:0 "Before there was a truce on the south coast there was the Red Ice. The coast clans, who came down to the Cold Ocean after the Sunfields broke and lived by the seal, and the shelf yeti, who had hunted the Yeti Shallows long before men came, fought for the seal-grounds over so many winters that the coast songs give that time no other name."
 zin_chr_20031_p2:0 "Holdon's tale is that in 2A 1288 the Eldest of the shelf came down alone to the snowline at Fentene, where an old market-ground of the Sunfields lay under the moss, laid a seal-hide on the ice, pressed its open hand into seal-blood on it and waited, until the coast chiefs understood and the eldest of them pressed his own small hand into the middle of the yeti's. The truce was sung, the seal-grounds were divided and the first snowline fair was held to seal it."
 zin_chr_20031_p3:0 "From the Hand-Hide come Holdon's customs: the fair-peace that no blade may break, the rule that a yeti and a man who meet on a seal-ground withdraw each to their own side, the goblins' welcome at the fair since 2A 1290, and above all the judging of every king by one thing, whether the fair was good.\n\nIn 4A 1120 the clans crowned Bran Grindair, the fair's keeper, so that one hand would hold the peace, and every Grindair king since has renewed the Hand-Hide at his first fair by pressing his own hand into the old print."
 zin_chr_20031_p4:0 "The Hand-Hide: a great white open yeti hand, palm outward, with a small black human hand pressed into its palm, on a sea-green field, with a white hem of cut seal-hide.\n\nThe Hand-Hide is the seal-hide on which the Eldest of the shelf and the eldest coast chief pressed their hands in seal-blood to sing the Hunting Truce of 2A 1288; it hangs in the fair-hall at Fentene, and the dark of the human hand, dried seal-blood, is renewed by each Grindair king at his first fair."
 zin_chr_20031_p5:0 "The coast clans sewed the two hands on the pennant that flies over Fentene while the fair-peace holds, and when Bran Grindair was crowned in 4A 1120 the pennant became the kingdom's banner, so that Holdon's flag is the sign that the fair is open."
 zin_chr_20031_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20031_short:0 "Holdon"
 zin_chr_20031_sub:0 "Cold Lands · Realm"
 zin_chr_20031_title:0 "Holdon"
 zin_chr_20032_p1:0 "The goblins of Glimkit remember the south only as the country of the burning roads.\n\nWhen the wars of the Long Grief drove their warrens north around 2A 1000, a column of warren-folk with a few hobgoblins and their bone-hounds reached the coast facing the Coldor Channel in the Long Dark, where goblins should never be, and the warrens tell that they would have died on the shore if a lamp-keeper called Drik had not seen, across the frozen channel, a pale plume rising from the mountains under the stars."
 zin_chr_20032_p2:0 "Drik closed his lamp against the wind with panes of horn and led the column over the ice toward the plume, and his lantern was the only light they had; those who lost sight of it froze. The plume was the breath of the great spring of Agoron, and the warrens dug in around it and built Drikzig, the hall of the warm water."
 zin_chr_20032_p3:0 "From the crossing come the Warren Luck and its laws: every warren keeps a closed lantern burning that was lit from Drik's, a warren whose lantern goes out is doomed until it is lit again from the hall, the hot springs are the mountain's breath and bathing in them is the one solemn rite, and no goblin goes out on open snow without a lantern-bearer.\n\nThe hobgoblin chief is made big enough to frighten the coast clans, but the warrens obey the lantern-keepers, and Plickit the Broad, the chief of 4A 1748, knows that the lantern in the hall matters more than he does."
 zin_chr_20032_p4:0 "The Crossing Lantern: a closed copper lantern with green horn panes hanging from a short black chain, on a black field, with a white hem of steam-curls. The lantern is Drik's, which led the warrens over the winter ice of the Coldor Channel; it hangs in the hall of the great spring at Drikzig, and every warren's own lantern was lit from it.\n\nThe goblins hammered its shape into the copper badges their trappers wore to the first snowline fair in 2A 1290, so that the coast clans would know that a goblin with a lantern came to trade and not to steal, and the same shape, sewn in green and copper on black, has flown over Drikzig ever since."
 zin_chr_20032_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20032_short:0 "Glimkit"
 zin_chr_20032_sub:0 "Cold Lands · Realm"
 zin_chr_20032_title:0 "Glimkit"
 zin_chr_20033_p1:0 "The uplands between Fandanar and the west coast were the amber road of the Sunfields, by which the amber of the western shore went inland to the old halls, and the upland clans descend from the carriers who kept its waystations and stayed on the high moors when the halls emptied. For two ages they were nobody's: there were no crowns to be anybody's, and the road carried reindeer hides, amber and the occasional Aenoran trader. The Forty Winters' Quarrel changed that."
 zin_chr_20033_p2:0 "Both crowns' riders used the high road to raid each other, and in one Long Dark late in the quarrel the clans of Xison, Rion and Yeneldmore saw their waystations burned by both sides.\n\nAt Akahew in 4A 902 the three chiefs did what the carriers' songs said the old road-keepers had done against bandits: they had their smiths forge a chain from the broken stirrups and bridle-iron of the riders who had died on their road, three great links for the three clans, and stretched it across the road on two posts, and no army may pass it without the road-moot's leave."
 zin_chr_20033_p3:0 "From the chain come the league's laws: each clan keeps its own stretch of the road, the tolls are shared, the chain is lifted only by the moot's speaker, and a crown's wagon pays like any carter's. The lower toll that the crown won in 4A 1360 is still resented, and in 4A 1748 the league leans to Coldor since the White Year but keeps its chain on the posts."
 zin_chr_20033_p4:0 "The Akahew Chain: three great black chain-links joined in a row across the field, on red, with a gold hem of amber beads. The device is the chain the three upland clans forged at Akahew in 4A 902 from the stirrup-iron and bridle-iron of the riders of both crowns who had died raiding on the high road, one link each for Xison, Rion and Yeneldmore.\n\nIt still hangs across the road on its two posts at Akahew and is lifted only by the speaker of the road-moot; the league sewed it on its toll-pennants the year it was forged, so that every carter on the high road would know where the moot's law began, while the speakers' seal keeps the Esroming reindeer."
 zin_chr_20033_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20033_short:0 "Xison"
 zin_chr_20033_sub:0 "Cold Lands · Realm"
 zin_chr_20033_title:0 "Xison"
 zin_chr_20034_p1:0 "The sheep vale east of the Ormolak country is the only valley of the north where sheep do better than reindeer, and its people say they know why. In their tale, long before the vale had a hall, a shepherd clan of the Sunfields lost its flock in a whiteout on the high ground and gave it up for dead, and in the thaw the flock came down out of the valley of Mp'E behind a black-faced ram, fat and whole, with no one to say where it had wintered."
 zin_chr_20034_p2:0 "The clan settled where the ram stopped and has bred from his line ever since, and the vale has paid what it calls the ram's due: each Long Light the shepherds carry a loaf and a fleece to the start of the Silent Road beyond the town of Yeldenne and leave them for the hall, and nobody walks on.\n\nThe vale's customs come from that debt: a shepherd who loses a beast in the snow does not curse the high ground, nobody of the vale goes up the Silent Road, the black-faced rams are never sold out of the vale, and the town of Yeldenne below the silent castle, which lies in the vale's land, has always been treated as kin and never taxed as a subject."
 zin_chr_20034_p3:0 "The Hozening lords, who were given the wool-market in 4A 760, keep the ram's due along with the market, and the vale's careful friendship with both crowns in 4A 1748 is the same habit seen from below: the vale keeps faith with whatever feeds it and asks no questions of the high ground.\n\nThe Black-Faced Ram: a white ram with a black face and black curled horns, standing, on a deep green field, with a red hem of woven wool. The ram is the leader of the flock that came down out of the valley of Mp'E in the thaw, from whose line every black-faced ram of the vale is bred."
 zin_chr_20034_p4:0 "The shepherds stitched him on the cloth in which the ram's due is carried to the Silent Road long before the vale had a lord, and Hildra Hozening hung that cloth over the wool-market at Minsentia when she built the hall in 4A 760; the lords have flown it since and have refused every offer to quarter it with the arms of either crown, even after the Vale Marriage of 4A 1590."
 zin_chr_20034_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20034_short:0 "Pertolor"
 zin_chr_20034_sub:0 "Cold Lands · Realm"
 zin_chr_20034_title:0 "Pertolor"
 zin_chr_20035_p1:0 "The Omar clan carries the oldest refusal in the north. Its songs say that in the last winters of the Sunfields, when the old king's stewards rode the moors demanding the clans' herds for the hall, the Omar forebears slaughtered one reindeer bull, ate it at their own fire and sent the stewards back with its skull and antlers bound to a sledge, which meant, then as now, that the clan had eaten its own and owed nothing."
 zin_chr_20035_p2:0 "The clan wandered the moors for ages afterwards with that refusal as its only law, owing no oath, giving no hostage and paying debts only in kind, until Kerdok drove its herds onto the border moor between the Ormolak country and the valley of Mp'E ahead of the hard winter of 2A 1520 and built Vaesdeon on the moor's one rise.\n\nKerdok's line keeps the clan's two laws: a chief must have spent a winter alone on the moor, as the forebears did when the king's hall fell, and every debt is counted on the antler-tally that hangs in the hill-fort, a notch cut for each gift taken and a notch filled for each repaid."
 zin_chr_20035_p3:0 "The skull went to Melkgard's warlord in 4A 1150 for the same reason it went to the old king's stewards, and in 4A 1748 the tally shows a debt to Coldor for the Hill-Fort Winter and one to Melkgard for the White Year, which the chief counts with great care and pays to neither.\n\nThe Refusal Skull: a white reindeer skull with full antlers, facing outward, on a black field, with a white hem of notches like a tally. The skull is the clan's old sign of refusal, first sent bound to a sledge to the stewards of the old king of the Sunfields and sent again to Melkgard's warlord in 4A 1150 when he demanded the clan's oath."
 zin_chr_20035_p4:0 "A skull with its antlers hangs over the gate of Vaesdeon, and the clan painted it on the shields of the men who held the hill-fort through the siege of 4A 1412; after that siege the white skull on black became the clan's banner, and the notched hem copies the antler-tally of its debts."
 zin_chr_20035_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20035_short:0 "Omar"
 zin_chr_20035_sub:0 "Cold Lands · Realm"
 zin_chr_20035_title:0 "Omar"
 zin_chr_20036_p1:0 "The sealers of Fellodor are proud of being descended from the enemy. Their forebears were the sea-raiders of the Frozen Ocean coast who burned the Ormolak valley for ages, a people whose songs begin at sea and say nothing of where the first ships were launched, only that something behind them in the far north was worse than any wind; a belief of Fandanar's fire-keepers holds that they fled the country of the dead, and the sealers neither confirm nor deny it."
 zin_chr_20036_p2:0 "When the last great fleet broke on the forts of the Gulf of Minnolomak in 3A 410, its captain Ulvar Azlak took the survivors along the bare coast below the Olsuaon Massif, dragged the last whole hulls up the beach and turned them keel-up to make halls, so that no man of the fleet could put to sea and go back to whatever they had fled.\n\nFrom the upturned hulls come the customs of the north coast: a lord's hall is always roofed with a ship's keel, the sealers bury a worn-out hull and never burn one, a new captain spends his first night under the keel of the first hall, and raiding is remembered with pride and forbidden by law."
 zin_chr_20036_p3:0 "In 4A 1748 Fellodor sells hides, ivory and seal-fat along the Frozen Sea, its captains wear the bear-mantles of the Bear Winter, and its lords are careful not to remind Melkgard whose sons they are.\n\nThe Keel-Hall: a black ship's hull turned keel-up, with a row of red oar-ports along its side, on a white field, with a grey hem of sea-ice. Ulvar Azlak's men dragged the last whole hulls of the broken fleet up the beach at Fellodor in 3A 410 and turned them keel-up as halls so that nobody could sail back, and the first of them still roofs the lord's hall."
 zin_chr_20036_p4:0 "The survivors painted it in pitch on the sealskin they raised over the beach to tell Melkgard's watchers that the raiders had come to stay, and the sealers have flown the black keel on white ever since; the red oar-ports are the oars they burned that first night for warmth, the only wood of the fleet they ever burned."
 zin_chr_20036_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20036_short:0 "Portogalor"
 zin_chr_20036_sub:0 "Cold Lands · Realm"
 zin_chr_20036_title:0 "Portogalor"
 zin_chr_20037_p1:0 "The reindeer clans of the far north-west say that when the Sunfields' fields failed their forebears did not follow the walkers south or the sailors west but followed the herds, which went north-west into the ice country where no field had ever been, and learned from the reindeer how to live in it.\n\nThe clans' first law is the herd's: the herd moves and the people move with it, no clan fences grazing, and a clan that loses its herd is taken in by the others until it has calves again. Their second law is the moot's, and it is younger."
 zin_chr_20037_p2:0 "For ages the clans spoke to strangers each with its own voice, until in 2A 1312 the Frost-King of the heights refused to treat with more than one, and the clans met at Esrom in the Long Dark, brought one reindeer each to the moot-fire and swore to speak as one."
 zin_chr_20037_p3:0 "From the oldest roads comes the clans' knowledge of where the ice gives back what it took: timbers of the old halls, bronze prows and tools that come out after a mild winter, which the herders bring to the fire-keepers and never sell. The clans keep the toll-peace with the giants, judge a chief by his herd and by the beasts he saved in a bad year, and hold that whatever a moot decides, the herds decide first.\n\nIn 4A 1748 the confederacy follows the reindeer roads that are older than any crown and meets each Long Dark at Esrom, where the fire and the herds are the whole of its law."
 zin_chr_20037_p4:0 "The Moot-Fire Herd: two white reindeer bulls facing each other across a small red fire, on a dark blue-grey field, with a brown hem of hoof-tracks. At the first winter moot of Esrom in 2A 1312 every clan brought one reindeer to the moot-fire as a pledge that it would speak with the others' voice before the Frost-King, and the bulls of the two largest herds stood facing each other across the fire while the oath was sworn.\n\nThe clans stitched the two bulls and the fire on the hide that is spread before the moot-chief each Long Dark, and the envoys of the toll-peace carried that hide up to Xitore, so that the giants still know the clans by it."
 zin_chr_20037_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20037_short:0 "Kvittumm"
 zin_chr_20037_sub:0 "Cold Lands · Realm"
 zin_chr_20037_title:0 "Kvittumm"
 zin_chr_20038_p1:0 "The Orewell lowland has iron because, in the clans' telling, the sky gave it. In a Long Dark that the songs call the Night of the Falling Fire, a burning stone came down over the far north-west, lit the snow from the giants' heights to the coast and struck the lowland, where the bog round the Orewell Water has run red ever since."
 zin_chr_20038_p2:0 "The clan's founders were reindeer herders who followed the light to its fall and found black iron in the bog that took an edge no bronze could match, and they settled to dig it when every other clan kept moving. The giants of the heights call the lowland the place where the sky broke, and the Frost-Kings take their toll there in iron and never in meat.\n\nFrom the Falling Fire come Orewele's customs: the bog-iron is the sky's and is dug only with thanks spoken at the shaft-head, the first bloom of every smelting is laid back in the bog, and no Orewele smith forges a weapon for a crown that has not first paid for the ore."
 zin_chr_20038_p3:0 "The dwarves of Brundahrim, who know iron better than any man, chartered their factor-house at Guerlon in 4A 1302 because Orewell ore smelts truer than anything else they could buy in the north, and the dwarves' refusal to say how their pumps worked in 4A 1677 is matched in 4A 1748 by the clan's refusal to say where the deepest red water rises."
 zin_chr_20038_p4:0 "The Falling Fire: a black iron star-stone falling slantwise with a long red flame-tail behind it, on a pale grey field, with a red hem of wavy bog-water. The Falling Fire is the burning stone that the clans say came down over the far north-west in the Long Dark long before Aen and left its iron in the Orewell bog."
 zin_chr_20038_p5:0 "The miners scratched its shape over every shaft-head as the mark of the sky's iron, and when Ezhdok Siulak signed the factor-house charter at the dwarves' gate in 4A 1302 the dwarves stamped the same mark on every ingot of Orewell ore they bought; the clan sewed it in black and red on grey cloth for the lordship's banner that year."
 zin_chr_20038_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20038_short:0 "Orewele"
 zin_chr_20038_sub:0 "Cold Lands · Realm"
 zin_chr_20038_title:0 "Orewele"
 zin_chr_20039_p1:0 "The ice giants of Nivaros were on the heights before men came north and were still there when the Sunfields fell, and their own tale of that fall is not one of punishment but of breath: the snow, they say, breathes in and out over the ages, and when it breathed out over the Fandan meadows the giants did not go down before it as men did, because the first Frost-King had taught them to stay where the ice is."
 zin_chr_20039_p2:0 "That first Frost-King, in the song of the cairn-keepers, broke the glacier of the heights with a stone maul to make the seat at Xitore, so that the giants would sit in the ice rather than flee it, and the maul is laid across the knees of every Frost-King at his enthronement.\n\nFrom that seat come the giants' laws: the Frost-King is chosen by the cairn-keepers and never born to the seat, a stone is laid on the cairns for every winter a giant lives and no giant tells a man how high any cairn has grown, the heights are closed to any crown that comes in arms, and passage is never free, because what the snow gives must be paid for."
 zin_chr_20039_p3:0 "The giants of Hirolon in the Middle Lands share their speech and their custom of stones, and the cairn-keepers of Xitore say only that the two peoples knew each other once, which is all they will say. In 4A 1748 the giants keep the toll-peace with the reindeer clans and the hunting pact with the Winter Crown, take their toll in iron at the Orewell lowland, and meet every army on the heights with the doors of ice shut.\n\nThe Frost-King's Maul: a great stone maul standing upright, its head bound with iron bands, white and grey on a deep ice-blue field, with a white hem of stepped stones."
 zin_chr_20039_p4:0 "The maul is the stone hammer with which, in the cairn-keepers' song, the first Frost-King broke the glacier to make the seat of Xitore; it lies across the knees of each Frost-King at his enthronement, and an iron band is added to its head for every Frost-King who keeps the toll-peace through his reign.\n\nThe giants carve its shape on the toll-halls of the herd roads, where a clan that pays may pass, and the envoys of the reindeer clans in 2A 1312 were the first men to see it raised over the ice-throne."
 zin_chr_20039_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20039_short:0 "Nivaros"
 zin_chr_20039_sub:0 "Cold Lands · Realm"
 zin_chr_20039_title:0 "Nivaros"
 zin_chr_20040_p1:0 "The shelf yeti do not tell men where they came from, and the clans who have traded with them for five centuries have learned not to ask; what the yeti do tell is how they learned to live beside men. In the songs of Haruhu the first thing on the shelf was the Hum, the sound the mountain makes at dusk, which every clan answers in its own song so that the mountain knows the clan is still there, and the first law is that a clan without a song is lost.\n\nThe second law came out of the Red Ice, the long seal-wars with the coast clans after men came down to the Cold Ocean, when the shelf clans learned that men could be killed but not driven away."
 zin_chr_20040_p2:0 "The Eldest who ended it in 2A 1288 came down to the snowline at Fentene, pressed its hand in blood on a seal-hide and sang the hunting truce, and the clans have kept the song ever since: they cut a great footprint in the ice at the edge of every seal-ground that is theirs, men hunt only where there is none, and a footprint is never cut where one has stood before."
 zin_chr_20040_p3:0 "From the truce also come the Eldest's Fire, where the clans' names are sung each winter and the clans follow the singer whose song carries furthest, and the rule that only a shelf Eldest may vouch for a stranger to the kin in the high snows. In 4A 1748 the shelf clans still come down to the fair, still move their gathering away from the smell of goblin smoke, and still hold a man's word good only once it has been sung."
 zin_chr_20040_p4:0 "The Ice-Mark: one great white five-toed yeti footprint on a deep sea-blue field, with a white hem of zigzag ice-cuts. Since the Hunting Truce of 2A 1288 the shelf clans have cut a great footprint into the ice at the edge of every seal-ground that is theirs, and the first was cut beside the snowline at Fentene by the Eldest who sang the truce.\n\nThe yeti brought hides painted with the footprint to the fair so that the coast clans could learn the mark, and the Eldest's Fire at Ghaumbhu hangs the oldest of those hides at its back; men call it the yeti banner, though the yeti call it only the mark that says this ice is sung for."
 zin_chr_20040_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20040_short:0 "Yeti Lands"
 zin_chr_20040_sub:0 "Cold Lands · Realm"
 zin_chr_20040_title:0 "Yeti Lands"
 zin_chr_20041_p1:0 "The height clans of Ghaahu say their song is the older, and the shelf clans, who will argue about almost anything, do not dispute it. In the height clans' telling every clan's song is one turn of a single song that began before the clans, so that a clan singing at dusk sings its own turn and, beneath it, every turn that came before it back to the first; a song that is broken off is not ended but waits to be taken up."
 zin_chr_20041_p2:0 "This is why the height clans answered the avalanche of 4A 1515 by singing every dusk for a year for the buried clan, so that its turn would not be lost, and why the shelf heard the singing across the mountains. The heights follow wild herds through the Cold Mountains rather than the seal, live in song-caves rather than at a fire, and keep no truce with men because they have never needed one: in their song men are a turn that has not yet been sung."
 zin_chr_20041_p3:0 "The one envoy they received, a Coldic man vouched for by a shelf Eldest in 4A 1270, came back with a carved horn wound with the spiral of the song, which hangs in the Frost-Hall; after the hunters of the east coast followed a herd into the high snows without leave in 4A 1650 and did not return, no man has been received at Huummal. In 4A 1748 the heights are almost never seen, and a crown that wants them must first be sung to them by the shelf."
 zin_chr_20041_p4:0 "The Song-Whorl: one broad white spiral winding inward, with notched edges as if carved, on a dark slate field, with a white hem of notches. The spiral is the mark that the height clans carve on horn, bone and the walls of the song-caves for the one song that every clan's song continues, winding back to its first turn.\n\nThe only one men have seen close is on the carved horn given to the Coldic envoy at Huummal in 4A 1270, which hangs in the Frost-Hall; the height clans paint the same spiral beside the mouth of Huummal, and the shelf yeti say that a height clan going to war paints it on its own breast."
 zin_chr_20041_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20041_short:0 "Ghaahu"
 zin_chr_20041_sub:0 "Cold Lands · Realm"
 zin_chr_20041_title:0 "Ghaahu"
 zin_chr_20042_p1:0 "The sealers of the wind-isle descend from the Sunfields' seafarers who did not sail on to the isles when their kin went west, but stayed on the long ice arm where the winter sea-ice still joined them to the land, and they keep the oldest of the north's sea-words. Their history turns on a harbour they lent and a harbour they shut.\n\nIn the First Age the island league of the chart-islanders leased Porideon as a watering-place for its northern sea-road, paying in sailcloth, and the arm's people learned the league's ship-shares and harbour book from it."
 zin_chr_20042_p2:0 "Early in the Second Age the league's own ships brought the Grey Breath north, and the sealers of Porideon did what their songs still praise and mourn: they cut the league's ships from the moorings, set them adrift on a gale and shut the harbour to every sail for nine years, and the arm was the one harbour of the league's northern road that did not empty."
 zin_chr_20042_p3:0 "From that shutting come the arm's customs: every crew keeps a token of the wind that last spared it and gives it to the wind-towers when the crew is paid off, a ship from a sick harbour waits a season off the headland, land and catch are held by ship-share as the league held them, and the Speaker's harbour book records every ship that is let in and every one that is turned away."
 zin_chr_20042_p4:0 "The council that chose a Speaker in 4A 702 to send the first whaling fleet south only gave an office to what the harbour had kept for ages, and in 4A 1748 the arm is the friend of every island pilot and the open harbour of nobody's war."
 zin_chr_20042_p5:0 "The Wind-Feather: one white skua feather slanting upward, with three red bands across its vane, on a storm-grey field, with a white hem of wave-crests. Every Vindael crew keeps a token of the wind that last spared it, and the oldest tokens are skua feathers, because the skuas rode the gale on which the arm's people set the league's ships adrift in the year of the Grey Breath; a red band is tied on a crew's feather for each great gale it has come through."
 zin_chr_20042_p6:0 "The captains hung the first council's feather, with three bands for three gales, over the harbour book when they chose the first Speaker in 4A 702, and it has flown on grey cloth from the wind-towers since the towers were raised in 4A 1580."
 zin_chr_20042_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20042_short:0 "Vindael"
 zin_chr_20042_sub:0 "Cold Lands · Realm"
 zin_chr_20042_title:0 "Vindael"
 zin_chr_20043_p1:0 "The clans of the downs remember a country they have never seen. They came south over the neck into the green downs, and the song says the rooks went before them, following the clans' last barley-carts and leading them to where barley would grow again; the clan that walked behind the rooks took the name of the Rookwyn and was the first to sow the downs."
 zin_chr_20043_p2:0 "From that long walk the clans built their law: a country is held by the people who sow it, which is why the downs never accepted that Aenor's ships could own the West by finding it; land belongs to the clan, and the king rules by the clans' law and never above it, because the old kings of the north could not stop the ice; and the Lawspeaker remembers every oath, as the singers remember the lost country."
 zin_chr_20043_p3:0 "When the Aenoran settlers came, the clans fought them for four centuries under war-chiefs chosen for one war at a time, and when the settlers' grip failed in 1A 880 the chiefs at the Oath-Ring acclaimed Cadyn of the Rookwyn king for life, heir of the clan that had walked behind the rooks. Gunwyn has fought every war since as a people who were once driven out of a country and have sworn not to be driven out of another."
 zin_chr_20043_p4:0 "A black rook carrying a gold barley-ear in its beak, on downs green. The rook is the bird of the clan song, which went before the clans over the neck carrying ears from their last barley-carts and led them to the downs where barley grew. The Rookwyn took their name from it, and Cadyn was acclaimed at the Oath-Ring in 1A 880 under a hide painted with the rook and the ear; Taryn's western host carried the same hide at the head of its banners in the war against Volgan."
 zin_chr_20043_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20043_short:0 "Gunwyn"
 zin_chr_20043_sub:0 "West Lands · Realm"
 zin_chr_20043_title:0 "Gunwyn"
 zin_chr_20043_x1_p1:0 "Their singers keep the song of Faenn-Cheulu, a land of sun and fields in the north where their people lived before the winters lengthened, and tell how over many lifetimes the ice came a little farther south, the fields failed and the halls emptied, until the clans left."
 zin_chr_20044_p1:0 "Long before Aenor's ships came, the clans of the Girdon plain lived by the fords of the Grey River, and their oldest custom was the ford-share: whoever kept a crossing clear of drowned trees and silt took a share of what crossed it, and the river, they said, mistook the ford-keeper's town for a guest and spared it in flood as long as the keeper fed it a loaf at every high water.\n\nWhen the settlers came up the river the fords became the frontier, and in 1A 640 the clansmen who held them met at Arligon and swore at the ford-stone to keep every crossing against the settlers and to judge every quarrel on the river by one law."
 zin_chr_20044_p2:0 "Each sworn man carried a flat stone from his own ford to Arligon and laid it in the river there, so that the wardens' stones made one line of stepping-stones across the main ford and any warden could cross dry on his brothers' stones; each took the name of the ford his stone came from, and the wardens chose a Warden-Speaker among themselves."
 zin_chr_20044_p3:0 "From the stepping-stones comes the commonwealth: no king, because no stone in a line stands higher than another; the blood-price before revenge, because a warden who breaks the line with a feud drowns the crossing; the river-court, where every quarrel on the water is judged at the stones; and a grievance that has run into every war since, for when a Gunwyn war-thane killed the ford-warden at the Grey Ford in 4A 1702 and the blood-price was refused, the wardens said a stone had been pulled from the line."
 zin_chr_20044_p4:0 "A line of five grey stepping-stones across a single blue river band, on green. The stones are those the first wardens carried from their own fords and laid across the main ford at Arligon in 1A 640, so that a warden could cross dry on his brothers' stones.\n\nThe commonwealth's banner has shown them since the Settler Wars, and a warden who dies is mourned by lifting his ford's stone and laying it again; the fifth stone of the banner is the Grey Ford's, which the wardens painted black for the forty-three years of the border war."
 zin_chr_20044_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20044_short:0 "Girdon"
 zin_chr_20044_sub:0 "West Lands · Realm"
 zin_chr_20044_title:0 "Girdon"
 zin_chr_20045_p1:0 "The hill clans of the Erg finger are not of the downs clans, and they have never forgotten it. Their song says they came to the Erg not over the neck but by sea, in the long winters when the northern country was emptying, in boats that followed the coast south while the downs clans walked; they kept the hills of the finger and the coast-steadings below them, cut their own oath-stone on the Erg spur and took no king of the downs through the whole of the Settler Wars."
 zin_chr_20045_p2:0 "When the Rookwyn kings rose the Erg clans married into them rather than bowed, and their price for loyalty to Bulligon was that the Erg would always be held by a son of the royal hall. So when King Dyfan of Gunwyn died in 4A 1188 and the moot chose his elder son, the hill clans held that the younger, Emric, who had been fostered among them and given the Erg, had the better right."
 zin_chr_20045_p3:0 "Dyfan, they say, broke his king-torc in two on his deathbed and pressed one half into each son's hand, meaning the realm to be shared, and the moot refused it. Emric carried his half to Caer-Erg and was acclaimed at the Erg stone.\n\nFrom that half-torc comes Werlendor's stance: a crown that calls itself the heir of Bulligon and the keeper of a dead king's wish; a hill people who hold that the moot of the downs never had the right to choose for the Erg; and a habit of taking what Bulligon leaves unguarded, as it took the coast-steadings in 4A 1724 while Gunwyn was fighting Girdon."
 zin_chr_20045_p4:0 "Half of a broken gold torc, its broken end jagged, on black. The half-torc is the one Emric carried from Dyfan's deathbed to Caer-Erg in 4A 1188, the half of the Rookwyn king-torc that the hill clans say Dyfan meant him to have.\n\nIt is kept in the hall at Caer-Erg and worn at every acclamation at the Erg stone; the other half, the Werlwyn kings say, is still at Bulligon, where the kings of Gunwyn wear a whole torc forged after the split and pretend the old one was never broken."
 zin_chr_20045_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20045_short:0 "Werlendor"
 zin_chr_20045_sub:0 "West Lands · Realm"
 zin_chr_20045_title:0 "Werlendor"
 zin_chr_20046_p1:0 "Lambin's lords are young, but the ground they keep neutral is the oldest meeting-place of the downs. Above Faennon a ring of low banks encloses a field that the clans have ploughed in common since long before Aen, and the clans' old law said that no blood may be shed on sown ground; the name Faennon, the field-place, is said to echo the song-name of the lost northern country of fields, and the clans held their peace-moots there before they had kings."
 zin_chr_20046_p2:0 "When the plagues of the Long Grief left the eastern downs half empty in 2A 380, Branorn of Faennon took up the common field's old staddle-stones, the mushroom-shaped stones on which the clans had raised their shared grain-stack, and set his great stone granaries on them; in the famine years every clan came to buy from him, and he sold to all because the stones under his granaries came from the field where no blood is shed."
 zin_chr_20046_p3:0 "From that comes everything the lordship is: neutral ground where enemies talk because they cannot afford to quarrel with the granary; a lord who takes no side and sells to every comer; the custom that the lord's own heir ploughs the common field each spring with the clans watching; and the lasting suspicion of the larger courts, which say a lord who feeds everyone is loyal to no one.\n\nThe winter of talks at Faennon before the Truce of the Grey Ford is the latest proof that the old field still works."
 zin_chr_20046_p4:0 "A stone granary raised on four mushroom-shaped staddle-stones, gold on green. The staddle-stones under Branorn's granaries came from the common field of the peace-moots above Faennon, where no blood may be shed on sown ground, and the lords of Lambin have shown the raised granary since the famine years of the Second Age as the sign that their grain stands on the old peace.\n\nThe envoys of Gunwyn and Girdon met beneath a banner of it through the whole winter before the Truce of the Grey Ford."
 zin_chr_20046_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20046_short:0 "Lambin"
 zin_chr_20046_sub:0 "West Lands · Realm"
 zin_chr_20046_title:0 "Lambin"
 zin_chr_20047_p1:0 "The warm lowland of Thenon was farmed before the clans came over the neck.\n\nThe lowland clans say their mothers' mothers were the first folk of the warm corner, who grew olives and vines on the little hills and knew the trick of grafting a good bough onto a wild trunk, and that when the neck-clans came south hungry the lowlanders gave them olives and married them rather than fight, so that the clans who came to Thenon were grafted onto the lowland rather than planted over it."
 zin_chr_20047_p2:0 "The eldest tree of that grafting, the Mother Olive on the little hill of Tummin, is the reason the kings are acclaimed there."
 zin_chr_20047_p3:0 "The lowland's history has run the same way since: in the Settler Wars it paid the Aenoran settlers in cattle and olives and kept its fields while the downs burned; in 1A 1100 it acclaimed Saric of the Sarudwyn when no one was left with the strength to demand anything; it kept faith with the small folk who fed its clansmen in the famine of 3A 899 by sending men to the Ronbo Watch; and when the Olive Blight of 4A 1540 killed half its groves and the Mother Olive with them, the groves were grafted again from cuttings of the small folk's orchards."
 zin_chr_20047_p4:0 "From the grafting come Thenon's customs: kings judged by the harvest; a debt paid in olives rather than blood; strangers taken in by marriage; and a quiet conviction, which the downs clans call cowardice, that a people lives longest by bending its boughs to whatever is grafted onto it.\n\nAn olive tree with one grafted bough of a lighter green, on warm gold. The tree is the Mother Olive of Tummin, the eldest grafted tree of the lowland, under which the Sarudwyn kings have been acclaimed since 1A 1100."
 zin_chr_20047_p5:0 "When it died in the blight of 4A 1540, a cutting from the small folk's orchards beyond the Ronbo passes was grafted onto its living root, and the king added the lighter bough to the banner in the year it first bore fruit, in thanks to the Warden of the Fields."
 zin_chr_20047_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20047_short:0 "Thenon"
 zin_chr_20047_sub:0 "West Lands · Realm"
 zin_chr_20047_title:0 "Thenon"
 zin_chr_20048_p1:0 "The small folk of the Ronbo basin have farmed below the Herlitz range for longer than any western song remembers, and they think of their history as a list of harvests. They trust the ground, the weather and their own hedges; set a place at every table for Lumae of the hearth, Aurlan of the harvest and Vaelei of births and ask no other god into the house; and believe that a household which shares its harvest is never robbed of it."
 zin_chr_20048_p2:0 "The dwarves of Brundahrim knew them first, trading for leaf and cheese at the high passes, and the basin's warmth and seclusion behind its passes kept it out of most of the West's wars. The wars of the Aenoran settlements reached it once: in 1A 612 households fled a burning valley on an Aenoran grain ship and never came back, and the basin learned long after that they had found a home inside the giants' ring of the Middle Lands."
 zin_chr_20048_p3:0 "Its defining deed came in the western famine of 3A 899. The householders baked their seed-grain into round loaves, stamped each with the thumb of the house that baked it so that the clansmen would know who had given, and carried them over the Ronbo passes to the starving clans of Thenon and Kradlon, asking nothing; the clansmen they fed swore the Ronbo Oath in 3A 904 to guard the basin's passes for ever, and the dwarves closed the high passes above it."
 zin_chr_20048_p4:0 "From the Famine Bread come the basin's customs: bread is never sold to the hungry; a guard is paid in grain and leaf, never coin; a household's thumb on a loaf is its oath; and the small folk's settled belief that what is given freely buys more safety than any wall.\n\nA round brown loaf stamped with a small thumb-print, on harvest green. The Famine Bread was baked from the basin's seed-grain in 3A 899 and stamped with the thumb of the household that baked it, so that the clans of Thenon and Kradlon would know who had given."
 zin_chr_20048_p5:0 "The Ronbo Oath was sworn in 3A 904 over the last of those loaves, every Warden of the Fields since has been chosen with a thumb pressed into a loaf at the moot-hall of Luddum, and the Watch carries the loaf painted on its pass-standards."
 zin_chr_20048_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20048_short:0 "Dobbum"
 zin_chr_20048_sub:0 "West Lands · Realm"
 zin_chr_20048_title:0 "Dobbum"
 zin_chr_20049_p1:0 "The dwarves of the Herlitz and Dusty Mountains were the western end of the Stone Road, the dwarves' realm of deep roads under the sea, and Hrennost, the fire-hold, was its western forge.\n\nWhen the Damned Spirits came into the roads in Volgan's war and the roads under the sea were broken and the sea let in, Brundahrim sealed its western Sea-Door with the names of its last delvers and lost at once its trade, its kin and its light, for the deep roads had been lit from the Great Hall's lamps and the western holds were left in the dark."
 zin_chr_20049_p2:0 "The fire-hold's delvers say they carried one live fire out of the road before the door was shut, in an iron fire-pot on a chain, and that the forge of Hrennost has been lit from it ever since; they call it the Road-Fire, and it is the hold's soul. From the drowning come the hold's grudges and its pride."
 zin_chr_20049_p3:0 "It blames Kunhrim's lords for urging the Letting-In of the Sea and will not sit in any moot Kunhrim calls; it trusts no court and opens its doors only to those who earn it, and shut them to men for three generations after the looting of Gromkerm's gate; it keeps the small folk's high passes shut, as much to keep the basin's secret as its own; and in 4A 1561 its smiths learned to make a burning powder from the saltpetre of the Dusty Mountains, which they say only the Road-Fire could have kindled, and which the West now buys from them at any price they name."
 zin_chr_20049_p4:0 "A black iron fire-pot hung on a chain, a red fire rising from it, on dusty ochre. The fire-pot is the one in which the delvers of Hrennost say they carried the Road-Fire out of the western road before the Sea-Door was sealed in 1A 1660.\n\nIt hangs over the forge of the fire-hold, the powder-smiths of 4A 1561 lit the West's first burning powder from it, and the gate-wardens hang a painted fire-pot over the Outer Gate while the hold is trading and take it down when the doors are shut."
 zin_chr_20049_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20049_short:0 "Brundahrim"
 zin_chr_20049_sub:0 "West Lands · Realm"
 zin_chr_20049_title:0 "Brundahrim"
 zin_chr_20050_p1:0 "Gromkerm keeps the oldest of the western doors of the Stone Road, the dwarves' realm of deep roads under the sea, and its elders keep the grudge of the drowning longest of all the holds. Its people say their hold was the first cut in the west, and that when the roads were broken and the sea let in at the end of the First Age they sealed their door last, after holding it open for the delvers of the other western roads to come home through."
 zin_chr_20050_p2:0 "Ever since, they have measured their honour by doors. Men know the hold only as an Outer Gate above the Kulolo, opened in 1A 210, which bore a great iron knocker in the shape of a dwarf's clenched fist, because a dwarf of Gromkerm opens to a knock and to nothing else."
 zin_chr_20050_p3:0 "In 2A 1712 companies hired by Saopon's guilds broke into the gate-hall instead of knocking and tore the fist from the door; the hold closed its doors for three generations, cut the names of the guild masters who paid the companies into its wall of grudges, and reopened in 2A 1795 with a new fist on the door and a rule still kept, that no company of men comes within a bowshot of the gate under arms."
 zin_chr_20050_p4:0 "From the fist come the hold's customs: every bargain begins with a knock; a debt is struck off with a fist on the table; a grudge is cut into stone rather than forgotten; and the gate-wardens of the Kunerm line answer for the door with their lives. Gromkerm sells bombards to anyone who knocks, and has never let anyone forget the day someone did not."
 zin_chr_20050_p5:0 "A black iron door-knocker in the shape of a dwarf's clenched fist, on rust red. The fist hung on Gromkerm's Outer Gate from 1A 210 until Saopon's hired companies tore it down in 2A 1712; the hold kept its doors shut for three generations and cast the fist that has hung there since 2A 1795 from the iron of the broken locks.\n\nThe gate-wardens paint it on the gate-forts and on every iron contract, and a Saopon factor must still knock on the empty staple of the old fist before the gate is opened to him."
 zin_chr_20050_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20050_short:0 "Gromkerm"
 zin_chr_20050_sub:0 "West Lands · Realm"
 zin_chr_20050_title:0 "Gromkerm"
 zin_chr_20051_p1:0 "Saopon was made by iron that came down a river. Before the settlers, the boatmen of the Kulolo poled the dwarves' iron from Gromkerm's gate down to the Ilurdor lagoon, and their landing at Lochon was where the river's iron met the sea's traders; the boatmen's law, older than any guild, was that a load is sworn on its weight, so a bargain was struck with an iron bar laid on the scales between the parties."
 zin_chr_20051_p2:0 "When the guilds of Lochon and the fen towns swore their league in 1A 930 they swore it on the guild book with a dwarf ingot laid on its cover as the weight of the oath, and contracts in Saopon are still sworn with iron on the book. That gives the league its character and its shame. Its character is law by contract and by weight, a First Guildsman who is only the keeper of the book, and a city whose whole life is what the dwarves send down the river."
 zin_chr_20051_p3:0 "Its shame is the year 2A 1712, when its guilds hired companies who looted Gromkerm's gate and the league disowned them too late; the dwarves shut their doors for three generations, the iron stopped, and Lochon nearly died. The league has sworn every contract since with the ingot on the book, as the boatmen did, in sight of the dwarves' factors, and its guild-masters know that the names of their forebears are cut into Gromkerm's wall of grudges.\n\nThe Canako Cut and the fen boundary are newer quarrels; the iron is the old one."
 zin_chr_20051_p4:0 "A closed book weighted with a black iron ingot, on fen green. The league was sworn on the guild book in 1A 930 with a dwarf ingot laid on its cover as the oath's weight, by the boatmen's old custom of swearing a load on its weight. The ingot still sits on the book in Lochon's guild-hall, and when Gromkerm reopened its trade with the league in 4A 1530 its factors asked to see it there before they would sign; the league has flown the weighted book since its founding."
 zin_chr_20051_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20051_short:0 "Saopon"
 zin_chr_20051_sub:0 "West Lands · Realm"
 zin_chr_20051_title:0 "Saopon"
 zin_chr_20052_p1:0 "Buldor was born in a list of the dead. When the plagues of the Long Grief emptied the valleys south of the Fog and Eye range in the Second Age, the clerks of the toll-town of Toples kept the rolls of the plague dead on long sheets for the lords who would inherit, and soon there were no lords left to inherit."
 zin_chr_20052_p2:0 "The landless men who survived gathered at the crossroads and swore themselves into companies, each under a banner of its own, and the women of Toples sewed the first banners from the shrouds of the plague dead, because there was no other cloth. In 2A 1100 the company-lords wrote the first contract-book on the backs of the plague-rolls, so that every company was sworn on the names of the dead, and elected a Captain-General."
 zin_chr_20052_p3:0 "From the shroud-banners come the company state's faith and law: a company's banner is its soul and its dead are sewn into it; a fallen banner ends the company, because a shroud that falls cannot be raised; a company is bound by its contract and nothing else, and may meet another Buldor company in the field, since the dead on both banners are the same dead; and the men of Buldor hold that a land which lost everyone owes no one anything except what is written."
 zin_chr_20052_p4:0 "Buldor lives by selling the one thing the plague left it, which is men who are not afraid of dying, and it sells them to anyone, Gunwyn and Girdon alike, and Aenor's envoys too when they pay.\n\nA white swallow-tailed pennon on its staff, seamed down its length with a black stitch, on grey. The first banners of the companies were sewn by the women of Toples from the shrouds of the plague dead, and the black seam is the stitch that closed the shroud."
 zin_chr_20052_p5:0 "The Captain-General's pennon at Toples is said to be the first shroud-banner itself, sewn in 2A 1100 and never carried into battle so that it can never fall; every company sews a black seam into its own banner at its founding."
 zin_chr_20052_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20052_short:0 "Buldor"
 zin_chr_20052_sub:0 "West Lands · Realm"
 zin_chr_20052_title:0 "Buldor"
 zin_chr_20053_p1:0 "Kradlon is the oldest settler harbour that still stands, and it has spent most of its history arguing with its origin. Aenoran settlers built Bolbin at the root of the peninsula about 1A 260 and fought the clans of the Ronbo shore from behind its walls for two centuries, recording the crown's dues on every bale as notches on a hazel tally split down its length, one half for Parim and one for the town."
 zin_chr_20053_p2:0 "As the wars wore out the settlers married into the shore clans, and by the time Aenor's ships stopped coming the town was half clan and owed nothing to the crown it still paid. In the Unpaid Year of 1A 912 the guilds broke that year's tally across instead of splitting it, sent Parim nothing and swore their league on the guild book, and the settler town became the first guild port of the West."
 zin_chr_20053_p3:0 "From the broken tally come Kradlon's customs: a debt is recorded and paid to the notch, but a tally broken across can never be presented again; the guild-masters are elected on the day the tally was broken; the shore-clan half of the town sends its sons to the Ronbo Watch in memory of the clans its founders fought and married; and the workshops' quarrel with Parim's tariffs since 4A 1402 is felt in Bolbin as the crown trying to present a tally the town broke long ago."
 zin_chr_20053_p4:0 "The powder secret bought from Brundahrim at a price the guilds will not name has made the quarrel dangerous, because Kradlon now sells the means to settle it.\n\nA hazel tally-stick broken across, its two halves set apart, white on red. The broken tally is the one the guilds of Bolbin broke across in the Unpaid Year of 1A 912 instead of splitting it for Parim, and its two halves lie in the guild-hall in a chest opened only at the election of a First Guildsman."
 zin_chr_20053_p5:0 "The guilds have flown it since that year, and Kradlon's workshops stamp it on every powder-piece and bombard they sell, so that the buyer knows the piece owes nothing to any crown."
 zin_chr_20053_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20053_short:0 "Kradlon"
 zin_chr_20053_sub:0 "West Lands · Realm"
 zin_chr_20053_title:0 "Kradlon"
 zin_chr_20054_p1:0 "Oslodon was the first Aenoran settlement on the western coast, and the first thing its settlers landed was a letter. The settlers of about 1A 240 carried the crown's letter of claim, sealed in black wax, which named the whole West as Aenor's by right of finding it, and the settlement's governors kept it in an iron chest on the bay as the warrant for everything they did."
 zin_chr_20054_p2:0 "The merchant houses that grew rich in Oslodon learned what that letter cost: every war with the clans was fought in its name, and every governor who used it made himself a prince. When Aenor's grip failed the great houses governed the town, and in 1A 940, to make sure that no house could ever claim the crown's warrant for itself, they swore never to break the seal, chose two consuls to rule for a year at a time and gave the chest two locks, one key to each consul."
 zin_chr_20054_p3:0 "From the sealed letter come Corogon's customs: two consuls, because one man with a warrant becomes a prince; a year's office, because a warrant held too long becomes a crown; an old refusal to read any letter of claim, as the consuls refused the letters of the first Aenoran ship to return in 4A 188; and a merchant people who trade with Aenor gladly and treat its claims as a cargo they will not unload.\n\nThe letter is still in the chest with its seal unbroken; what it says exactly, no consul has read, and the highland inns have a dozen stories of what the forgetful wizard Gwilid thought it said."
 zin_chr_20054_p4:0 "A rolled letter tied with red cord under an unbroken black seal, on blue over white. The letter is Aenor's letter of claim to the West, landed with Oslodon's first settlers about 1A 240, which the merchant houses swore in 1A 940 never to open; it lies in its iron chest on the bay under two locks, one key in each consul's keeping.\n\nThe consulate has flown it since the first pair of consuls, the blue and white the colours of the two keys, and the consuls showed the Aenoran captain of 4A 188 the unopened chest instead of reading his letters."
 zin_chr_20054_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20054_short:0 "Corogon"
 zin_chr_20054_sub:0 "West Lands · Realm"
 zin_chr_20054_title:0 "Corogon"
 zin_chr_20055_p1:0 "The western capes face the open approaches that the Aenoran fleets used in the First Age, and the cape clans have watched them for longer than they have had kings. In the Settler Wars they kept fires on the headlands to warn the coast when settler sails came, and the clans say the habit is older still: the capes kept watch on the sea before Aenor had ships, the clan barrows stand on the headlands, and a cape that lets a ship pass unseen has failed its dead."
 zin_chr_20055_p2:0 "When the plagues of the Long Grief left the capes without lords, Oslin of the Trilinwyn gathered the cape clans and the tanners' quays under his banner and was acclaimed king at Varlibo in 2A 455, and his first act was to put the old headland fires behind glass: he set iron lanterns on the capes that a gale could not put out, founded Oslinod to keep them and swore that the capes would never be surprised again."
 zin_chr_20055_p3:0 "From the lanterns comes the kingdom: the sea watch that hunts the corsairs; the duty of every cape family to keep its headland lantern lit; the king's title of Keeper of the Lanterns; and the knowledge, sharp in 4A 1748, that the capes are the West's natural staging port for any crossing east, so that a lantern on Varnondor could as easily light a fleet out as watch one in. Parim has not forgotten that the capes' first watchers were watching for Aenor."
 zin_chr_20055_p4:0 "A black iron lantern with a white light, on cape red. The lantern is the first of the iron lanterns Oslin I set on the capes in 2A 455 to replace the clans' headland fires, which a gale could put out. It still stands on the headland above Oslinod and is relit by every king at his acclamation, and the sea watch has flown it since its first patrol; when Varnondor's ships burned Straton beside Corogon's in 4A 1622, the corsairs named them the lantern-ships."
 zin_chr_20055_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20055_short:0 "Varnondor"
 zin_chr_20055_sub:0 "West Lands · Realm"
 zin_chr_20055_title:0 "Varnondor"
 zin_chr_20056_p1:0 "The rivers of the Varnondor Peninsula's eastern bend are wide, slow and treacherous, and the people of the bend have always lived by crossing them. Long before any warden swore an oath, the ferry-families of the bend kept a custom they say the rivers themselves taught them: a ferry crosses on a rope drawn from bank to bank, and the rope is never cut, in war or in feud, because a cut rope drowns whoever is in the middle of the river, friend or enemy alike."
 zin_chr_20056_p2:0 "The ferrymen of Datidon and Pernogon swore themselves ferry-wardens in 2A 1250 on the model of Girdon's ford-wardens, and every warden since has sworn on a length of the first ferry-rope, which is kept coiled in the warden-hall at Datidon.\n\nFrom the uncut rope comes Wennarith's law: every crossing is kept for every traveller; quarrels on the water are judged by the warden of the ferry; no host is carried across to make war, because a ferry that carries an army has chosen a bank; and the warden-bond with Girdon, sworn after Girdon's wardens rowed into the Bend Flood of 4A 1275 to save the ferry-folk."
 zin_chr_20056_p3:0 "That law cost the commonwealth forty years of trade in the border wars of Gunwyn and Girdon, when it refused to ferry either host, and the ferry-wardens count it the best bargain they ever made.\n\nA white flat-bottomed ferry-barge, empty, on a band of river blue, on pale green. The empty barge is the ferry that carries every traveller and no army."
 zin_chr_20056_p4:0 "It was painted on the warden-hall of Datidon when the ferrymen swore themselves wardens in 2A 1250 on a length of the first uncut ferry-rope, and the commonwealth has flown it empty ever since; in the border wars of Gunwyn and Girdon both hosts reached the bend and found the barges drawn up under that banner on the far bank."
 zin_chr_20056_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20056_short:0 "Wennarith"
 zin_chr_20056_sub:0 "West Lands · Realm"
 zin_chr_20056_title:0 "Wennarith"
 zin_chr_20057_p1:0 "The chart-houses of Adel descend from the oldest craft of the Boreal peoples. Long before Aen, when the Sunfields still stood in the Cold Lands, the proto-Boreal sailors who went west by sea to the arcs carried words for reef, strait, cape and tide that are older than any chart, and they kept a rule that the chart-houses still swear by: no reef is named until it has been proved by the lead.\n\nA pilot who found a reef dropped the sounding lead on it, read the depth and only then gave it a name, and the first namer of a reef was honoured by every sailor who passed it afterwards."
 zin_chr_20057_p2:0 "When the Grey Breath ended the league, the chart-office became one chart-house among many, and for four centuries after Aenor's restoration the chart-houses quarrelled over who had first named which reef, until in 4A 388 the houses of Adel agreed to copy every chart at Sanderz and to record there the first namer of every reef.\n\nFrom the lead come Adel's customs: a chart is sworn true by the pilot who sounded it; the Drowned Names are read together with the reefs that took them; and the Chart Hall sells its newest chart to whichever crown it chooses, because the lead belongs to the house that dropped it."
 zin_chr_20057_p3:0 "A long tapered sounding lead hanging on its line, in lead grey and chart white on deep ink blue. The sounding lead is the pilot's proof of a reef, dropped before any reef may be named, and the lead the Andaios chart-house calls Senra's hangs in the Chart Hall at Sanderz. The league's chart-office flew a lead on its line over Adel's harbour from 1A 900, and the Chart Hall took it back as its banner when it became the copy-house of record in 4A 388."
 zin_chr_20057_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20057_short:0 "Adel"
 zin_chr_20057_sub:0 "Triton's Islands · Realm"
 zin_chr_20057_title:0 "Adel"
 zin_chr_20057_x1_p1:0 "When the chart-islanders were sworn into Margorodai, the Sea-Roads, at Halgohavnai in about 1A 820, the league set its chart-office at Adel in 1A 900, and the fleet captain Senra of the Pupor Isles, who brought the Grand Alliance's supply fleets through, is claimed by the Andaios chart-house as its forebear; its strong-room at Sanderz keeps a sounding lead it calls hers."
 zin_chr_20058_p1:0 "Raerby is the court of the banks. The proto-Boreal sailors who settled the eastern arc long before Aen lived by the great fishing banks of the inner sea, and their first law was the law of the shared catch: when two boats claimed the same shoal, the first great banks-fish taken from it was cut in two before both crews and each took a half, and both fished the shoal for the season."
 zin_chr_20058_p2:0 "After the Grey Breath the court had no league behind it, but the captains of Ese went on settling quarrels on the banks for a fee, and in the centuries when the islands lived by carrying the West's and the Cold Lands' goods they grew rich enough to lend ships to others. In 3A 610 they chose a Captain-Speaker to keep the freight-book and the peace of the banks."
 zin_chr_20058_p3:0 "From the banks-court come Raerby's customs: a quarrel is settled where it arose, on the water; the freight-book records every hull lent and every share owed; and a broker-captain who keeps the book dishonestly loses the right to judge. The gale season of 2A 904, which sank a third of Raerby's and Adel's fleets, began the reading of the Drowned Names, and the Southern Banks quarrel with Nondondor, open since 4A 1398, is the one case the court has never closed."
 zin_chr_20058_p4:0 "A great banks-fish of the cod kind, with its fins, chin-barbel and square tail drawn plain, swimming, cut through its middle by a thin white line, in silver on deep bank green. The cut fish is the first fish of a disputed shoal, cut in two before both crews under the oldest law of the banks, and the league's banks-court cut one at the opening of every case from 1A 950.\n\nThe broker-captains of Ese kept the cut fish as their banner when they chose their first Captain-Speaker in 3A 610, and the court-ship still flies it when it anchors over a disputed bank."
 zin_chr_20058_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20058_short:0 "Raerby"
 zin_chr_20058_sub:0 "Triton's Islands · Realm"
 zin_chr_20058_title:0 "Raerby"
 zin_chr_20058_x1_p1:0 "When Margorodai was sworn, the league set its court for the fishing banks at Raerby in 1A 950, and the banks-court judged every quarrel over the shoals of the arcs on the deck of a court-ship anchored over the disputed bank, beginning each case by cutting a fish."
 zin_chr_20059_p1:0 "Havnai has always been where island goods change hands, and the guild-masters of Pollos trace their right to keep the islands' money to the plague that ended the league. The key-holder from Pollos was the last of them alive; he carried all three keys home on a ship of the dying, and Pollos has claimed the league's strong-room by survival ever since.\n\nIn 4A 140 the guild-masters of Havnai wrote the market law that every buyer and seller in the harbour swears to and opened the strong-room where the chart-houses keep their coin, and its three locks are still held by three guild-masters who must turn their keys together."
 zin_chr_20059_p2:0 "From the three keys come Pollos's customs: no purse of the market is opened by one hand; every coin has been weighed at the strong-room door since 4A 1288, when the guild-masters hanged a ring of corsair coiners on the quay; and the Polai family, who keep the strong-room, are first among the guild-masters because they keep the keys and not because they own them."
 zin_chr_20059_p3:0 "Three keys hanging from one ring with their bits downward, in iron grey and market gold on deep harbour red. They hang on one ring in the strong-room at Havnai, and the guild-masters have flown them over the market since the market law was written in 4A 140; a Pollos merchant's seal still shows three keys, and a bargain sealed with it is good in every harbour of the Charter."
 zin_chr_20059_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20059_short:0 "Pollos"
 zin_chr_20059_sub:0 "Triton's Islands · Realm"
 zin_chr_20059_title:0 "Pollos"
 zin_chr_20059_x1_p1:0 "When the chart-islanders were sworn into Margorodai at Halgohavnai in about 1A 820, the league's dues, one due from every ship of every flag, were counted into a strong-room at the Holy Harbour that had three locks, and its three keys were held by three captains so that no one of them could open it alone; from 1A 1000 a second strong-room at Pollos held the dues of the western arc.\n\nWhen the Grey Breath came into Halgohavnai, the three key-holders were among the first to fall ill."
 zin_chr_20059_x1_p2:0 "The three keys are the keys of the league's strong-room that the last key-holder carried home from Halgohavnai in the Grey Breath."
 zin_chr_20060_p1:0 "Nondondor is the only crown of the arcs, and its crown was made of rope. The southern half of the western island was a nest of corsair captains after the Grey Breath emptied the harbours of the Sea-Roads, and for six centuries the captains fought one another for its coves.\n\nIn 2A 760 a captain of the Kilai named Kusion beat the others one by one at sea, hanged on their own yards those who would not swear, and called the survivors to the cliff harbour of Kudaini; there being no gold among them for a crown, he had a length of his ship's anchor cable twisted into a ring, set it on his own head and called himself sea-king."
 zin_chr_20060_p2:0 "He made his corsairs fishers in peacetime and his fishers corsairs in war, and his line has held the cliff harbour since. The Kilai claim more than their island. They say that the league that died in the Grey Breath had one due and one law for every flag, and that a crown is needed to keep both; the claim to the Southern Banks, pressed since 4A 1398, is their first step toward that, and Seite and Raerby refuse it every year."
 zin_chr_20060_p3:0 "From the rope crown come the sea-kings' customs: the crown passes to the eldest son or daughter who has commanded a ship; every Kilai king is crowned with a cable twisted from his own ship's anchor rope; and a corsair in the king's waters sails by the king's writ or hangs. In 4A 1630, after the burning of Straton, the sea-king hanged forty corsairs who had sailed without his writ, so that the western fleets would not come for Kudaini next."
 zin_chr_20060_p4:0 "A crown twisted from a ship's anchor cable with its strands showing, in rope tan on deep sea black. The cable crown is the crown Kusion of the Kilai twisted from his ship's anchor rope at Kudaini in 2A 760, when there was no gold for a crown among the corsairs he had beaten.\n\nEvery sea-king since has been crowned with a new one twisted from his own ship's cable, and the old crowns hang in the hall of Kudaini; the royal galleys fly the cable crown, and the king's sailing-writ is sealed with a twist of tarred rope."
 zin_chr_20060_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20060_short:0 "Nondondor"
 zin_chr_20060_sub:0 "Triton's Islands · Realm"
 zin_chr_20060_title:0 "Nondondor"
 zin_chr_20061_p1:0 "The cold northern isles of the arcs are the nearest to the Cold Lands, and their folk are the island kin who kept the most of the old north. Their pilots' words for ice and reef are the proto-Boreal words of the Sunfields, and the pilots say their forefathers came down from the north over the ice when the long winters drove the Sunfield clans out of their halls long before Aen, driving their sheep before them."
 zin_chr_20061_p2:0 "Their oldest tale is of the first crossing to the Kile Islands: the channel had frozen and nobody knew whether the ice would bear them, until a white ram walked out onto it ahead of the flock and crossed, and the families followed where its hooves had held. The ram that leads the flock over the ice has been the pilots' sign since, and the pilots of the northern isles still say that a pilot is the ram of his ship."
 zin_chr_20061_p3:0 "They lived by kelp, sheep and piloting other men's ships through waters only they knew, and in 4A 520 the pilots of the Fineger Islands, Ziza and the Kile Islands met at Kapai and chose a Speaker to set one fee for every ship that enters their waters."
 zin_chr_20061_p4:0 "From the ram's crossing come the isles' customs: a Speaker must have piloted a ship through the Poolho ice; a pilot goes first and is paid first; and a debt is worked off, as the pilots worked off for ten years the grain that Raerby's brokers carried north in the Kelp Famine of 4A 1601. The Norrai Pilotage with the harbour council of Vindael, made in 4A 1466, is the oldest standing compact between the isles and the Cold Lands."
 zin_chr_20061_p5:0 "A white ram's head with heavy curled horns, in fleece white on ice grey. The ram is the white ram of the first crossing to the Kile Islands, which walked out onto the frozen channel ahead of the flock. The pilots' isles carved its head on the prow of every pilot boat long before there was a Speaker, and the Speakers of Kapai have flown it over the pilots' harbour since 4A 520; a Fineger pilot boarding a foreign ship hangs a small ram's head of horn at its bow."
 zin_chr_20061_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20061_short:0 "Fineger"
 zin_chr_20061_sub:0 "Triton's Islands · Realm"
 zin_chr_20061_title:0 "Fineger"
 zin_chr_20062_p1:0 "The storm isles of the outer south take more wrecks than anywhere else in the arcs, and their people have always lived by the gales. Long before Aen, their tales say, the first islanders on Halenor lit fires on the headlands in the gale season to guide the boats of their kin home, and found that the same fires could guide strangers' ships onto the rocks; the shore-fire has meant both things ever since.\n\nWhen the Sea-Roads kept the first lit passages of the arcs, Halenor's shores were lit for the league; when the league died in the Grey Breath, the fires went dark, the wrecks came ashore, and the islanders lived on them."
 zin_chr_20062_p2:0 "In 3A 280 the island chiefs swore that whatever the storm brings to a shore belongs to the lord of that shore, and Lusai of the Mondon, the first to hold the wreck-right, built the harbour of Sonrale behind a reef that breaks every wave and set an iron fire-basket on a pole at the harbour mouth, empty. Every wreck-lord since has sworn at the shore either to light the shore-fires or to leave them dark."
 zin_chr_20062_p3:0 "From the wreck-right come Halenor's customs and its quarrels: the storm's gifts belong to the shore; the Lamp-House of the Lens asked Halenor to light its shores in 4A 1068 and was refused, and has never forgiven it; and the wayfinder lord of 4A 1690, who lit the shore-fires every gale season of his life and saved more ships than his forebears had wrecked, is honoured in songs his heirs do not sing."
 zin_chr_20062_p4:0 "An empty iron fire-basket on a tall pole, in iron black on storm grey. The fire-basket is the one Lusai of the Mondon set at the mouth of Sonrale in 3A 280, empty, the sign that every wreck-lord chooses whether to light it. The Mondon lords have flown the empty basket since; a lord who swears to be a wayfinder flies it with the basket filled with red cloth for the length of his life, and his heir takes the cloth down again."
 zin_chr_20062_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20062_short:0 "Halenor"
 zin_chr_20062_sub:0 "Triton's Islands · Realm"
 zin_chr_20062_title:0 "Halenor"
 zin_chr_20063_p1:0 "The windward capes of the eastern arc's south take the full force of the gales, and their folk learned long ago to use the wind that tries to kill them.\n\nTheir tales say that long before Aen their forefathers, Boreal sailors of the first crossings thrown onto the capes by a gale, lived through the first winter by flying kites of sail-cloth from the rocks to catch the seabirds that rode the wind; the kite became their oldest tool and their first prayer, and the cape-folk say the wind is a master that serves whoever holds the line."
 zin_chr_20063_p2:0 "For ages each cape fought the others and took whatever the storm drove onto its rocks, and outsiders played one cape against another, until in 4A 1010 the cape-lords of Arpos, Sondor, Cheko and Amarelo met at Audailon and swore a league. In 4A 1355 the fishers of the capes learned to fish from great kites flown from small boats, which let them work the windward banks that no other islanders could reach, and the kites went onto the league's banner."
 zin_chr_20063_p3:0 "From the kite come the capes' customs: a cape-lord holds his seat as a kite-flier holds a line, by never letting go in a gale; the league speaks through one of the four lords each gale season; and whatever the wind brings to the capes is the capes', as the Raerby freight fleet driven ashore in 4A 1590 learned when the cape-lords paid back only a third of its cargo.\n\nA diamond-shaped fishing kite with a long rag tail streaming in the wind, in sail white and gale red on sky grey. The kite is the cape-folk's oldest tool, the sail-cloth kite of the first winter on the capes and the great fishing kite of the windward banks."
 zin_chr_20063_p4:0 "The kites went onto the league's banner in 4A 1355, when the kite fleet first fished the banks no other islanders could reach; the four cape-lords fly it from Audailon in every gale season, with its tail streaming to show the wind."
 zin_chr_20063_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20063_short:0 "Windy Lands"
 zin_chr_20063_sub:0 "Triton's Islands · Realm"
 zin_chr_20063_title:0 "Windy Lands"
 zin_chr_20064_p1:0 "The households of the four Seite isles and Mondeluz have fished the same banks for as long as their songs go back, and their songs go back to the reefs. Long before Aen the first pilots who came to the Seite isles in the first crossings were wrecked on the reefs, and the households say that the grey seals of the reefs bore the survivors ashore on their backs: the reef-spirits came as seals, and the seals are their messengers."
 zin_chr_20064_p2:0 "No household of Seite has killed a grey seal since, and when the moot raised shrines on the reefs where the first pilots were spared, in 2A 1600, it set a carved seal on each; island pilots of every arc still leave a token there as they pass. The banks the first pilots fished became the fathers' banks, and in 2A 1340 every household met on the moot isle of Vesko and swore that the banks their fathers fished belong to their children.\n\nNo lord has ruled Seite since: the moot of every household chooses a moot-reader each year to keep its decisions, and the moot-reader stands under the reef-shrine when he reads them."
 zin_chr_20064_p3:0 "From the seals and the fathers' banks come Seite's customs: every household speaks at the moot; a bank fished by the fathers is never sold, leased or shared without the moot; and since 4A 1398, when Nondondor's sea-king claimed the Southern Banks, the moot has sent his envoys home every year, knowing that its fishers alone cannot hold the banks against his fleet."
 zin_chr_20064_p4:0 "A grey seal rising from the water with its head raised, in seal grey on reef teal. The seal is the reef-spirits' messenger of the first wreck, which bore the first pilots ashore. A carved seal stands on every reef-shrine the moot raised in 2A 1600, and the households sewed it on the moot's banner at Vesko; the moot-reader reads the year's decisions under the shrine with the banner behind him."
 zin_chr_20064_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20064_short:0 "Seite Islands"
 zin_chr_20064_sub:0 "Triton's Islands · Realm"
 zin_chr_20064_title:0 "Seite Islands"
 zin_chr_20065_p1:0 "The corsair captaincy of Santon was built in dead harbours. The outer western arc emptied; Santon, Dani and Kusu were left to their dead, and the captains who took the emptied harbours were men nobody would fight, because they came in under black sails."
 zin_chr_20065_p2:0 "In 2A 130 the strongest of them, Hanei of the Black Sail, who had taken a plague-ship's black sail for his own and sailed it into the strait-place harbour of Straton, made the other captains swear the Ransom Tide law: a captive ransomed by the next tide-feast goes home under the god of the harbour, and one not ransomed belongs to the sea. The outer arc has been a corsair captaincy since, held by whichever captain is best until a better one comes."
 zin_chr_20065_p3:0 "From the black sail come Santon's customs: a captain holds Straton by the sword; every captain swears to the Ransom Tide; and a Santon ship raises its black sail only when it means to take a prize, because the sail still means that whoever it comes for may not live.\n\nCorogon's fleet and Varnondor's sea watch burned Straton in 4A 1622 after Santon's corsairs took three Corogon grain ships, and the captains rebuilt it within ten years; since the ransom of the consul's son in 4A 1701, Corogon has sworn to burn it again."
 zin_chr_20065_p4:0 "A black sail, full-bellied in the wind, without ship or mast, on blood red. The black sail was the Sea-Roads' sign for a ship of the dead in the Grey Breath, flown so that healthy ships would keep away.\n\nHanei of the Black Sail took one from a plague-ship and sailed it into Straton in 2A 130, and the captains of the outer arc have flown it since; a captain of Straton is made by raising the black sail on his own ship in the harbour, and it comes down when a better captain raises his."
 zin_chr_20065_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20065_short:0 "Santon"
 zin_chr_20065_sub:0 "Triton's Islands · Realm"
 zin_chr_20065_title:0 "Santon"
 zin_chr_20065_x1_p1:0 "When the Grey Breath came into Halgohavnai and the Sea-Roads' own fleets carried it to every isle, ships that carried the sick flew black sails, the old sea-sign of the league for a ship of the dead, so that no healthy ship would come near."
 zin_chr_20066_p1:0 "Benan holds the reefs where the Sea-Roads died and will not go near them. The corsairs of the Benan Mountains, whose coves no fleet can find without a Benan pilot, claimed the Square in 2A 925 because nobody else wanted it, and none of them has ever sailed into it. In 2A 980 a captain named Urai the Lame made the cove of Torni a haven for every corsair who would pay its dues and keep its peace."
 zin_chr_20066_p2:0 "The haven's captains say Urai taught that a corsair is a crab in a borrowed shell, living in harbours other men built and leaving when a bigger crab comes, and that the one shell a crab must never crawl into is the one its owner died in. When a royal Aenoran ship was lost with all hands on the Square in 2A 1507, Benan's corsairs took nothing from the wreck, and they have refused to sail into the Square since."
 zin_chr_20066_p3:0 "From the borrowed shell come Torni's customs: the haven chooses its captain from those who pay its dues; the haven's peace and the Ransom Tide are kept inside the cove; nothing is taken from the Square; and the chart-houses' tribute, paid since 4A 1480, buys peace only as long as it is paid on time."
 zin_chr_20066_p4:0 "A hermit crab in a spiral shell with its claws raised, in shell white and crab red on cove black. The crab in the borrowed shell is Urai the Lame's saying, made into a banner when he opened the haven at Torni in 2A 980: corsairs live in shells other men built. The haven's captains have flown it over the hidden cove since, and a corsair who pays the haven's dues is given a small shell to hang at his masthead, which every Benan pilot respects."
 zin_chr_20066_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20066_short:0 "Benan"
 zin_chr_20066_sub:0 "Triton's Islands · Realm"
 zin_chr_20066_title:0 "Benan"
 zin_chr_20066_x1_p1:0 "Halgohavnai, the Holy Harbour of Margorodai, stood on the reef shelf inside the arcs, a harbour where any ship of any flag paid one due; the Grey Breath came into it first and it was left to its dead and never relit, and the gale season of 2A 904 broke its four moles into the square of reefs that wrecks ships, the Cursed Square."
 zin_chr_20067_p1:0 "The round isle of the Lens keeps the league's light. The proto-Boreal sailors who first came to the arcs long before Aen kept fires on the capes to guide one another through the passages, and the Sea-Roads made of them the first lit passages of Aoaz: towers on the capes of the northern passages whose lamps any ship of any flag might steer by for one due."
 zin_chr_20067_p2:0 "When the Grey Breath ended the league, the lamps went dark one by one, and for more than a thousand years the northern passages were unlit. In 2A 1507 a royal Aenoran ship was lost with all hands on the Cursed Square, and the glass-blowers of the round isle, who had made the lamp-glass of the old towers, swore themselves an order to keep the northern passages lit for every ship whatever its flag.\n\nTheir first Keeper, Saneros of the glass-house, blew the great lamp-glass of Lighon in one breath, the order says, and built the great lamp-tower there, and the Keepers say the lamp they relit was the league's own."
 zin_chr_20067_p3:0 "From the oath come the order's customs: a Keeper is chosen from those who have kept a tower alone through a whole gale season; the Keeper swears never to take a side in any quarrel of the arcs; every Keeper blows one lamp-glass at his oath; and every chart-house of the arcs pays lamp-dues to the order.\n\nSince 4A 1544, when Nondondor's ships tried to put out a lamp to wreck a Raerby fleet and every chart-house refused the sea-king's charts for a year, no realm of the arcs has touched a lamp."
 zin_chr_20067_p4:0 "A long glass-blower's pipe with a round glowing gather of glass at its tip, in pale lamp gold and pipe black on deep night blue. The blowpipe and its gather are the moment the first Keeper, Saneros, blew the great lamp-glass of Lighon in one breath in 2A 1507.\n\nThe order took it for its sign when it swore to keep the passages lit, and every Keeper since has blown a lamp-glass at his oath; the order's banner flies on every tower it keeps, and a ship that flies it is the order's and is touched by no one."
 zin_chr_20067_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20067_short:0 "The Lens"
 zin_chr_20067_sub:0 "Triton's Islands · Realm"
 zin_chr_20067_title:0 "The Lens"
 zin_chr_20068_p1:0 "The Leren speak a daughter of the old Ainic tongue and descend from the northern kingdoms of men that stood beside Aen's realm, and they have always been proud that they came to Aen as partners and never as subjects. Their history as sailors begins with a whale.\n\nThe Narrow Strait is shallow and full of shoals, and the Leren tell that before any chart was drawn the strait-whale that winters in the Leren water was the only creature that knew the deep channel, and that the first Leren captains learned the strait by following it."
 zin_chr_20068_p2:0 "When Leren and Aenoran ships charted the strait together under the Ship-Bond of 1A 207, a Sonarvik captain led the Aenoran hulls through the shoals behind a sounding whale, and the Sonarvik founded Sonargur at the river mouth where the whale turned."
 zin_chr_20068_p3:0 "From the whale come the strait's law and the Leren temper: the Strait Litany forbids killing a whale inside the strait; the Ship-Blessing opens when the whale comes in Lumae; every Leren pilot must sail the channel once behind it; the strait belongs to those who know its water, which is why Sonargur takes its dues from every hull that passes; and the High Crown's two halves, the strait kingdom and the western ice-crown of Lerendor's North, joined by the wedding of 4A 411, are said to be the two flukes of one tail."
 zin_chr_20068_p4:0 "A Leren court takes it badly when anyone, Parim least of all, forgets which partner showed the other the way, and the Toll of Parim was remembered at Sonargur as exactly that forgetting.\n\nThe two flukes of a sounding whale rising from the sea, black on strait blue. The flukes are the strait-whale's, sounding in the deep channel as the Sonarvik captain followed it through the shoals with the Aenoran hulls behind him under the Ship-Bond of 1A 207."
 zin_chr_20068_p5:0 "Sonargur's first harbour-lord had the flukes carved on the Singing Quay, and when the two crowns were united in 4A 411 the heralds made the two flukes stand for the strait kingdom and Lerendor's North, one tail of one beast."
 zin_chr_20068_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20068_short:0 "Lerendor"
 zin_chr_20068_sub:0 "North Lands · Realm"
 zin_chr_20068_title:0 "Lerendor"
 zin_chr_20069_p1:0 "The Eekedor Vale has always been the North's granary, and its people have always preferred to weigh a danger rather than fight it. In the Raiding Years, when orc and goblin bands crossed from the Dark Lands and the crowns of the interior raised hill-forts, a raider host came down the vale to Viktara in 2A 1205, and the grain-families met its chief at the harbour with the great steelyard on which they weighed the barges' grain."
 zin_chr_20069_p2:0 "They hung his own sword from the hook and weighed it against grain, then against silver, then against what a siege would cost him in his men's lives, and told him the price of each; the host took the silver and left, and three of its captains stayed behind to guard the vale for wages. The vale has lived by the steelyard since."
 zin_chr_20069_p3:0 "From it come the council's laws and its court: everything has a weight, and a quarrel is settled when both sides agree what it weighs; the counting houses lend to every crown, because a debtor weighs more than an enemy; the Arbitration Court founded in 4A 906 is the steelyard made into a bench, and the North's crowns pay to have their feuds weighed there; and the vale has never raised a great host of its own, because it has always found it cheaper to buy one.\n\nThe old steelyard still hangs above the council's table at Viktara, and the Speakers say no grain has ever been weighed on it short."
 zin_chr_20069_p4:0 "A black steelyard balance with its hanging weight, on gold. The steelyard is the grain-weigher of Viktara's harbour, on which the grain-families weighed the raider chief's sword against grain, silver and blood in 2A 1205, and which has hung above the council's table since the counting houses formed their council in 4A 620.\n\nThe Arbitration Court opens every judgement by hanging a weight on it, and the vale's bills of exchange bear its mark, so that a Viktara bill is honoured from Sonargur to Parim."
 zin_chr_20069_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20069_short:0 "Eekedor"
 zin_chr_20069_sub:0 "North Lands · Realm"
 zin_chr_20069_title:0 "Eekedor"
 zin_chr_20070_p1:0 "The strait cape at the Narrow Strait's narrowest point has always belonged to whoever could sit on it, and its people have always taken a share of whatever passed.\n\nBefore the strait kings built forts there, fisher-clans lived on the cape's rocks and took toll of every boat that crossed in the old way of the cape: a boat that passed under the rocks gave up one fish, and the clans called themselves cormorants, after the birds that sit on the same rocks between the two seas."
 zin_chr_20070_p2:0 "When the cape became a watch-post of the strait kings its keepers kept the custom, and in 1A 1240 its keeper, Torik of the Farnur, whom the strait called the Cormorant, refused to pay the Sonarvik for the forts he had built and declared himself prince of the cape, living on the Aenoran ships that passed under his walls."
 zin_chr_20070_p3:0 "From the cormorant come the principality's habits: a prince who serves two masters and is owned by neither; a toll on everything that passes, light enough to be paid rather than fought; a court that faces both seas, marrying into Parim and trading with Sonargur; and a stubbornness proved under the Order, when the princes held Farnardur as the North's southern gate for twelve centuries and twice beat off its hosts at the forts.\n\nThe strait says a cormorant always keeps one eye on each sea, and the princes of R'en have never taken it as an insult."
 zin_chr_20070_p4:0 "A black cormorant perched on a grey rock with a silver fish in its beak, on white. The cormorant was Torik's own byname, from the cape-clans' custom of taking one fish from every boat that passed under the rocks, and he flew a painted cormorant over the forts of Farnardur when he refused the strait kings their payment in 1A 1240.\n\nThe princes have kept it since, and every ship that pays the cape's toll is given a wooden token cut with the cormorant, so that it will not be asked again before the next tide."
 zin_chr_20070_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20070_short:0 "R'en"
 zin_chr_20070_sub:0 "North Lands · Realm"
 zin_chr_20070_title:0 "R'en"
 zin_chr_20071_p1:0 "The northern march of the island is a country of marsh and hill facing the Dark Shore, and the margraves were made by the Raiding Years. When orc and goblin bands began crossing from the Dark Lands in the Second Age they came through the marsh, which only its own folk could cross, along paths marked with stakes."
 zin_chr_20071_p2:0 "In 2A 1240 the strait kings gave the march's defence to Helmund of the Ostvar, and the march tells his story as a single night: when a raider host came into the marsh, Helmund's men waded out in the dark and moved the path-stakes, and by dawn the host had walked into the deep water and drowned. The fortress line he built behind the marsh made him margrave."
 zin_chr_20071_p3:0 "From the moved stakes come the march's customs and its politics: every marsh-path is staked anew each spring by the margrave's men alone, and a stranger who moves a stake is drowned; the margraves show the true path only to friends and change it when friends change; and they learned to stake the march's way between the High Crown and Parim in the same manner, leaning towards Aenor whenever Sonargur leans away, so that neither would ever think it needed to take the march for itself.\n\nThe house of Ostvar also claims kin in the lords of Fotan across the strait, who bear the same name and neither confirm nor deny it."
 zin_chr_20071_p4:0 "A single white path-stake standing crooked in black marsh water, on dark green. The stake is one of those Helmund's men moved on the night the raider host drowned in the marsh in 2A 1240. The margraves keep it in the hall of Altovian, and the march's banner has shown it crooked ever since, because a stake that stands straight shows the true path; every spring the margrave drives the first new stake of the marsh-paths himself."
 zin_chr_20071_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20071_short:0 "Molot"
 zin_chr_20071_sub:0 "North Lands · Realm"
 zin_chr_20071_title:0 "Molot"
 zin_chr_20072_p1:0 "The coast crowns of Keredor and Hellekton are two halves of an old quarrel over one pass.\n\nThe pass of Belg is the only road from the north coast's two harbours into the interior, and the two crowns, both grown in the Raiding Years from Leren coast-holds that had walled their harbours against the sea-orcs of the Dark Shore, fought over it for three generations, each crowning its kings in its own old hall and each refusing to let the other's king ride through the pass."
 zin_chr_20072_p2:0 "The custom of the Leren North that neighbouring crowns may join by a marriage that sets both crowns on the heirs gave the Arbitration Court of Eekedor its most famous case, and in 4A 1344 it ruled that Queen Vigda of Keredor should marry King Helmund of Hellekton and that their children should hold both crowns and the pass between them."
 zin_chr_20072_p3:0 "The smiths of the new shared seat at Nuadoso melted part of each old crown and forged one double crown of two circlets, Keredor's silver and Hellekton's gold, and because neither crown could be set above the other, the heir is crowned twice, once with each circlet uppermost, riding by night between the two old halls."
 zin_chr_20072_p4:0 "From the double crown come the realm's habits: two of everything, two halls, two councils, two coronations; an inherited fear of being shared out again; and a debt to Sonargur, whose fleet burned the sea-orc harbour of Notle the year after the sea-orcs burned Nuadoso in 4A 1531, which brought the double crown into the Leren Compact.\n\nA double crown of two stacked circlets, the lower silver and the upper gold, on sea grey. The double crown was forged at Nuadoso after the Marriage of the Coast Crowns in 4A 1344 from the metal of both old crowns, Keredor's silver and Hellekton's gold."
 zin_chr_20072_p5:0 "Because neither crown may stand above the other, the heir is crowned with it twice, once with each circlet uppermost, and the banner is turned the same way: Keredor's hall flies it with the silver above, Hellekton's with the gold above, and the shared seat flies both side by side."
 zin_chr_20072_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20072_short:0 "Keredor-Hellekton"
 zin_chr_20072_sub:0 "North Lands · Realm"
 zin_chr_20072_title:0 "Keredor-Hellekton"
 zin_chr_20073_p1:0 "The long vale of Tolvael is the richest valley of the island's interior, and for most of its history the coast crowns have wanted to split it like a log. Its people are timber-folk, felling the great pines of the vale's slopes and boiling their tar, and their oldest craft secret is the heartwood of the old pines of the iron hill Kerhil, which grows so hard that a common axe breaks on it."
 zin_chr_20073_p2:0 "In 1A 1360, when the coast crowns of the island proposed to share the vale out among themselves, the vale's landholders met at Agtosai, and the vale's story is that each envoy of the coast crowns was handed an axe and asked to split a Kerhil pine log that lay before the hall; every axe broke, and the landholders crowned Brann of the Agtos king seated on the unsplit log and sent the envoys home without their axe-heads."
 zin_chr_20073_p3:0 "From the log come Tolvael's customs: every king is crowned seated on a Kerhil log; the vale is never divided between heirs, so a king's younger sons get timber rights and no land; the free crowns of the North owe Tolvael their pride, as the first crown that refused to be shared; and the vale cooperates gladly with the High Crown when it is asked and not at all when it is told, for the axe-heads of the coast crowns are still nailed above the hall door at Agtosai."
 zin_chr_20073_p4:0 "An unsplit black pine log lying across the field with a broken axe-head beside it, on dark green. The log is the Kerhil pine on which the landholders crowned Brann of the Agtos in 1A 1360, after every axe the coast crowns' envoys brought had broken on it. The axe-heads are nailed above the hall door at Agtosai, and a new king's first act is to strike the log of his crowning with one of them, so that the vale can hear it fail to split."
 zin_chr_20073_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20073_short:0 "Tolvael"
 zin_chr_20073_sub:0 "North Lands · Realm"
 zin_chr_20073_title:0 "Tolvael"
 zin_chr_20074_p1:0 "The west coast of the island faces the small sea of the Onp, and its people have lived by herring for as long as there have been boats on it. Long before the princes, the Onp fishers kept the Herring Peace: no feud was carried on, no boat burned and no toll taken while the herring were running, because the fishers believed that the herring would leave a sea where men fought over them."
 zin_chr_20074_p2:0 "The dozen lords who held the coast's isles and the toll-bridge of Sirtum kept the peace badly, and when Ulvek of the Ishor took the harbour of Migur and the bridge in 4A 260 and made himself prince of the coast, he did it in the season after the run, and swore at the bridge to keep the Herring Peace as the coast's first law. The princes' authority has rested on the herring since.\n\nWhen the herring left the Onp for a whole generation, it was the prince who forbade the summer nets until they came back in 4A 1610, and the fishers have kept the ban ever since."
 zin_chr_20074_p3:0 "From the herring come the principality's customs: no war is begun in the run; the toll-bridge of Sirtum, rebuilt in stone by dwarf masons of the High Mountains, pays the prince so that the fishers need not; the prince stays out of the strait's quarrels, because a sea at war is a sea without herring; and the coast measures its prince by the size of the catch.\n\nThe packmen of Mustnom, barred from the bridge after the Sirtum Brawl, say Tolhon's princes care more for fish than for men, and the coast agrees."
 zin_chr_20074_p4:0 "A silver herring leaping above a single grey stone bridge-arch, on Onp blue. The herring and the arch are the Herring Peace and the bridge of Sirtum, where Ulvek of the Ishor swore in 4A 260 to keep the peace of the run as the coast's first law. When the herring came back in 4A 1610 after a generation away, the prince's ban on summer nets was proclaimed at the bridge under a banner showing the silver herring over the arch, and Tolhon has flown it since."
 zin_chr_20074_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20074_short:0 "Tolhon"
 zin_chr_20074_sub:0 "North Lands · Realm"
 zin_chr_20074_title:0 "Tolhon"
 zin_chr_20075_p1:0 "The three hill crowns of the island's centre, Heodwa, Nuatax and Agniy, fought each other for so long that each claims to have raised the first hill-fort, and the hills are covered with the forts of their wars. Their kings had one custom in common, older than their quarrels: a great horn blown from a hill-top called every hill-clan to arms, and a crown that answered no horn but its own was a crown alone.\n\nWhen the Necromancer's raiders came up the valleys in the Third Age the three kings learned that they were alone in exactly that sense, and in 3A 806 they met the dwarves of the High Mountains at Pand."
 zin_chr_20075_p2:0 "The dwarves would not swear on a crown, and the kings would not swear on a dwarf-forge; they swore instead on one great horn, which the dwarves bound with three rings of gold, one for each crown, so that whoever blew it at Pand would call down the dwarves and all three hill crowns at once. That is the Hill Pact, and it was first tested in 3A 1022, when the horn was blown from Pand and the dwarves came down the valley of Nuatax and broke the Order's raiders."
 zin_chr_20075_p3:0 "From the horn comes the hill council: one horn, so one council; three rings, so three voices; a war on one crown is a war on all and on the White Hall; and no hill crown may blow the horn for its own quarrel, the oldest rule of the council and the one most often argued. When the Mulchy Lands came under the council's protection in 4A 1460, their voice was given a cord on the horn, not a ring."
 zin_chr_20075_p4:0 "A great black horn banded with three gold rings, on hill green. The horn of Pand is the one on which the three hill kings and the dwarves of the High Mountains swore the Hill Pact in 3A 806, bound by the dwarves with three gold rings for the three crowns. It was blown from Pand in 3A 1022 to call the dwarves down the valley of Nuatax, it hangs in the council hall at Pand, and the hill council has flown it since the pact."
 zin_chr_20075_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20075_short:0 "Heodwa Lands"
 zin_chr_20075_sub:0 "North Lands · Realm"
 zin_chr_20075_title:0 "Heodwa Lands"
 zin_chr_20076_p1:0 "The dwarves of the High Mountains were the northern arm of the Stone Road, the dwarves' realm of deep roads under the sea, and their road ran under the Narrow Strait to the holds of the south. When the Damned Spirits came into the roads in Volgan's war, Hrakbrund sealed the road under the strait with the names of its last delvers cut into the door, and it has had no Deep King since."
 zin_chr_20076_p2:0 "Its lords learned something the other holds did not: cut off from their kin, they could live only by the men of the island, and the White Hall became the hold that trades the most with men. It learned too that a hold can wait in its mountain while the world burns, and that it should not."
 zin_chr_20076_p3:0 "When the Necromancer's raiders came up the hill valleys in the Third Age, the hill kings of Heodwa came to Pand to ask for help, and in the winter after the Hill Pact of 3A 806 the lord of the White Hall had a stair cut from the High Gate down the mountain to the valley floor, wide enough for a column, so that the dwarves could come down in a day; it was used in 3A 1022, when the dwarves came down the valley of Nuatax and broke the Order's raiders."
 zin_chr_20076_p4:0 "From the Coming-Down Stair come the hold's ways: the dwarves of the White Hall hold that a hold which never comes down is only a tomb; every young dwarf of the hold walks down the stair once to see the hill crowns; the bombards sold to Sonargur since 4A 1612 go down the stair; and the hold's old grudge against elves cools any court that seats an elven envoy."
 zin_chr_20076_p5:0 "A white stair descending from the upper right to the lower left, on black. The stair is the Coming-Down Stair, cut from the High Gate down the mountain in the winter after the Hill Pact of 3A 806 so that the dwarves could reach the hill crowns in a day. The Ilmord lords have borne it since the dwarves first came down it in 3A 1022 to break the Order's raiders in the valley of Nuatax, and its lowest step is the boundary stone of the Hill Pact."
 zin_chr_20076_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20076_short:0 "Hrakbrund"
 zin_chr_20076_sub:0 "North Lands · Realm"
 zin_chr_20076_title:0 "Hrakbrund"
 zin_chr_20077_p1:0 "The ore hills of Etonia were dug for iron by Leren miners from the Second Age, who owed their lord a share of every cartload and lived in fear of the hills, because the deep galleries kept breaking into older workings that no man had cut, smooth and square, which the miners walled up and did not enter.\n\nIn 4A 640 the miners' lord, Stenolf of the Korn, opened the great galleries the North calls the Delvings and was crowned king of the ore hills at Gilvian, and the crown has been bound to the galleries since."
 zin_chr_20077_p2:0 "Its defining night came in 4A 1567, when the deepest gallery fell in on two hundred miners: the king went down to the rescue himself with a pick and did not come up, and when the gallery was cleared the miners found his body under the fall and his crown hung on the haft of his pick, where he had hung it to work."
 zin_chr_20077_p3:0 "From the crown on the pick come Mina's laws: every king works a season in the galleries before he is crowned and one every year after; a king's crown hangs on a pick at his coronation before it is set on his head; no gallery is opened into the old square workings, which the miners still wall up; and the mining crown takes pride that its kings dig.\n\nWhether the square workings were cut by dwarves, and where they lead, the miners do not ask, and the dwarves of the High Mountains, when they are asked, say nothing at all."
 zin_chr_20077_p4:0 "A miner's iron pick standing upright with a gold circlet hung on its haft, on slate grey. The pick is the one the king of Mina took down into the fallen gallery in 4A 1567 and was found under the fall with his crown hung on its haft.\n\nIt hangs in the hall at Gilvian with that crown still on it, every king since has been crowned by lifting his circlet off its haft, and the miners paint the crowned pick on the gallery doors so that each crew knows its king has worked there."
 zin_chr_20077_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20077_short:0 "Mina"
 zin_chr_20077_sub:0 "North Lands · Realm"
 zin_chr_20077_title:0 "Mina"
 zin_chr_20078_p1:0 "The lake Dolpar is deep, cold and ringed by hills, and its people say it has no bottom, only darker water. In the Raiding Years, when the walled towns of the lake ring, the Hold, Stork, Cinargo and Solenkovi, built the walls that still stand, raiders could take a town by land but none by water, and the towns learned to meet on the lake."
 zin_chr_20078_p2:0 "When a quarrel arose between them, each town sent one boat to the middle of the lake, where no shore was nearer to one town than another; the four boats were lashed together and the quarrel was judged there by the four steersmen, and the lake people said that a judgement made on the deep water would sink anyone who broke it.\n\nThis Mid-Lake Moot was the lake ring's only rule for centuries, and when the towns' merchants grew tired of riding to Eekedor's Arbitration Court to settle every quarrel, they made it a court again in 4A 1580: the lake-court of Parur, whose judges still sit afloat on the first day of every session."
 zin_chr_20078_p3:0 "From the four boats come the league's customs: every town has one voice, as every boat had one oar; a judgement is sworn on the water; no town may build a harbour to rival Parur's, the market all four can reach in a day; and the rivalry with Eekedor, which the lake-court regards as a shop that sells judgements by weight. The Judgement of the Mills in 4A 1694, the first the lake-court gave beyond the lake, was given afloat."
 zin_chr_20078_p4:0 "A white boat with four oars seen from above, on deep lake blue. The four-oared boat is the four boats of the Mid-Lake Moot, lashed together in the middle of the lake so that no shore was nearer to one town than another. When the lake-court was founded at Parur in 4A 1580 its judges took their seats afloat on its first day under a banner showing one boat with four oars, one for each walled town, and the league has flown it since."
 zin_chr_20078_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20078_short:0 "Dolpar"
 zin_chr_20078_sub:0 "North Lands · Realm"
 zin_chr_20078_title:0 "Dolpar"
 zin_chr_20079_p1:0 "The dwarf goblins of the southern hills are a people of their own, neither dwarves nor goblins, and they do not say where they came from; asked, a Mustnom packman says only that his people came out of the hill when the road called them. They have lived in the caves below the Solondor ridge for longer than the Leren remember, trading and stealing on the island's roads, and their history as they tell it begins with salt."
 zin_chr_20079_p2:0 "In 4A 1497 the boss of Krakur sent his packmen out on the long road across the whole island, and the first band came back before winter with a single sack of white salt from the far end of the road, a thing the caves had never had; the boss poured a pinch of it at the cave-mouth to thank the road and took the rest for himself, and the Boss's Due was born."
 zin_chr_20079_p3:0 "From the salt come Mustnom's customs: what a traveller brings home is owed to the cave; the spirits of the road are thanked with a pinch of salt at every crossroads, and the Leren find it on their milestones; half the people are always away on the roads, each carrying a pack-frame that is the packman's whole fortune; the Homecoming before winter is the year's one feast; and the packmen's habit, which has made them valuable to the High Crown since they brought word of a Belonton raid three days ahead of its own riders in 4A 1702, of noticing everything and selling what they notice."
 zin_chr_20079_p4:0 "A laden pedlar's pack-frame with a white salt-bag tied on top, brown on saffron. The pack-frame is the one the first band of packmen carried home from the far end of the long road in 4A 1497 with a sack of salt tied on top; it hangs above the boss's seat at Krakur, its salt-bag long empty.\n\nEvery packman burns the sign of the pack and the salt-bag into his own frame, and northern innkeepers have learned that a frame with the sign belongs to a pedlar of Mustnom, who will pay the boss's due on everything he sells them."
 zin_chr_20079_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20079_short:0 "Mustnom"
 zin_chr_20079_sub:0 "North Lands · Realm"
 zin_chr_20079_title:0 "Mustnom"
 zin_chr_20080_p1:0 "The Volcano Clans did not begin at the Fire-Mountain. Their songs start in the iron hills, where the oldest orc holds were dug long before Aen, and they turn on one grief: the march to Dardan. In the second millennium of the First Age Volgan's envoys came into the hills with gifts and promises, and the four great clan-lines of the hills, the forebears of the four clan blocs, sent their young to his host."
 zin_chr_20080_p2:0 "Orcs held the forward lines at Dardan and died there in heaps, and when the battle was lost the masters who had promised them the Middle Lands left them on the field. The few who came home walked the whole way north through hostile country, and the Fire-Speakers still chant the Long Walk from Dardan at the Ember-Night, naming the hills where the walkers fell. From that walk came the two laws Goldoroth is built on."
 zin_chr_20080_p3:0 "The first is the ring: a chief who cannot win his place with his own hands has no right to send others to die, so every chief, and since 4A 1452 every Warking, holds his seat only until a stronger challenger breaks him in the ring. The second is the moot's saying that no spirit rules the Dark, which the clans swore after Dardan and which many of them broke when they kept fighting in Volgan's name through the Second Age."
 zin_chr_20080_p4:0 "The Fire-Mountain became holy later, when the clans moved into the volcano country and found that its heat kept off the cold and its smoke the glare of the sun; the Fire-Speakers say the mountain is the one master that never left them. In 4A 1748 the old grief divides the court: one party says Goldoroth must never march for a southern master again, and the other that this time the orcs should take the Middle Lands for themselves."
 zin_chr_20080_p5:0 "The Crown of Broken Blades: a black iron crown of unequal jagged points, each one a broken sword-blade, on a fire-red field with a charcoal hem. When Skarag of the Krumgul broke the last rival chief in the ring at Sungodor in 4A 1452, the chiefs of the four blocs brought him the blades of every chief he had beaten on his way to the ring, snapped at the hilt as the custom of the ring demands of the beaten."
 zin_chr_20080_p6:0 "The chain-smiths of Sungodor hammered the broken blades into a ring for his head, and every Warking since has added the blade of the challenger he broke. The banner shows the crown as it first was, all jagged points and no gold, because the Volcano Clans hold that a crown of broken blades is the only crown an orc should trust."
 zin_chr_20080_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20080_short:0 "Goldoroth"
 zin_chr_20080_sub:0 "Dark Lands · Realm"
 zin_chr_20080_title:0 "Goldoroth"
 zin_chr_20081_p1:0 "Dondor's men are the garrison that was never relieved. In the first half of the First Age Aen's heirs kept soldiers on the Dondor plain to hold the chart-harbours and watch the strait, men of the old Ainic crown who were paid in iron bars from Aenor's forges."
 zin_chr_20081_p2:0 "When the ships stopped coming around 1A 352 the last pay-chest was opened on the stockade's ground and its bars divided among the hearths, one bar to each family, and the captains swore at the stockade to hold the plain as if the relief were still on its way. That chest is the root of the Hearth-Iron: every hearth of Dondor keeps a bar of iron and passes it to its eldest, and a house that loses its bar loses its place at the clan-moot.\n\nThe captains chose the strongest of them, Dromand of the Barand, to lead, and the orcs called him Brute-King in scorn; his men kept the name as a boast and set the garrison's old helm on his head instead of a crown."
 zin_chr_20081_p3:0 "Living beside the orc holds wore their speech into Dondric and their law into the blood-price, but it also taught them that orcs are neighbours and not one enemy, which is why Rovek of Dondor could lead Dark Lands soldiers into Edran's Grand Alliance, and why in 2A 1388 Brunmar of the Urdung took Dondor's spears south to close the Burning Gate of Nezer beside southern men and elves.\n\nIn 4A 1748 Dondor still thinks of itself as the line that holds, and its beacon towers are the stockade's answer to Goldoroth's bombards."
 zin_chr_20081_p4:0 "The Garrison Helm: an old open-faced iron helm with a tall ridge-crest, iron-grey on blood-red, with a black hem. The Brute-Kings were never crowned. Dromand of the Barand was given the helm of the garrison's last captain, and every king since has been made by having that helm set on his head before the clan-moot."
 zin_chr_20081_p5:0 "At Dardan the Charter of Free Banners let every people fight under its own sign, and Rovek of Dondor had none, so he lifted the king's helm on a spear above his veterans on the flank they held, and the helm on red cloth was sewn for the first time from that day's account. The spears of the Burning Gate hang around the same helm in the king's hall at Notbuton."
 zin_chr_20081_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20081_short:0 "Dondor"
 zin_chr_20081_sub:0 "Dark Lands · Realm"
 zin_chr_20081_title:0 "Dondor"
 zin_chr_20082_p1:0 "The pass at the foot of the Goldoroth Mountains has always been the throat of the Goldoroth arm, and the orcs who hold it remember every host that has gone through it. In the First Age Volgan's envoys came north by it and the orcs of the arm went south by it to the Southern Burning; after Dardan the broken bands came back through it, and those who kept the pass let them through for food and weapons, the first toll the pass ever took."
 zin_chr_20082_p2:0 "In the Buried Wars the Necromancer's columns used the same road, and a band of free orcs held the narrows against them by stretching a smith's chain across the path at night, so that horses and carts broke on it in the dark. Zugash, who built the gate-fort at Doldes in 3A 880, was of that band, and he forged a great chain of three links to hang across the narrows and lowered it for any traveller who paid."
 zin_chr_20082_p3:0 "From that chain comes the gate-hold's one law, that nothing and nobody passes unpaid and uncounted, not friends, not kin and not the envoys of a Great Spirit, and its tally-keepers still cut a notch for every caravan. When the first Warking made the gate-hold his tributary in 4A 1470 he did not take the chain down: he made the gate-chief pay Cocanoor out of it, so the chain that made Doldes free became the yoke it pays.\n\nIn 4A 1748 the gate-chief tolls Volgan's envoys like any caravan, and remembers that the pass has been sold to the south before."
 zin_chr_20082_p4:0 "The Gate-Chain: a heavy black chain of three great links hanging in an arc, on a dull gold field with a black hem. The chain Zugash hung across the narrows at Doldes in 3A 880 still hangs there; each of its three links is the height of an orc, and it is lowered for every traveller who pays and for nobody who does not."
 zin_chr_20082_p5:0 "Before it there was the smith's chain of the Buried Wars that broke the Necromancer's carts in the dark, and the gate-chiefs say the middle link was forged from it. The chain on gold was the toll-sign that caravans looked for on the road south, meaning that the gate was open to those who paid; since 4A 1470 the gate-chief has flown it under Cocanoor's banner."
 zin_chr_20082_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20082_short:0 "Dark Gate"
 zin_chr_20082_sub:0 "Dark Lands · Realm"
 zin_chr_20082_title:0 "Dark Gate"
 zin_chr_20083_p1:0 "The goblins of the warm caves under the Goldoroth Mountains were there before any orc warking, living in the deepest and warmest rock because they hate the cold and the sun weakens them. They have one great grief and one great trick, and both made Burnikit what it is.\n\nThe grief is the Unpaid: in 2A 2110 the warrens opened their deep ways to the Necromancer's hosts for a promised price, his recruiters took goblins with them as guides and levies, and neither the price nor the goblins came back. The warrens cut a notch on the Unpaid Stick for every goblin lost, and it hangs in the hall of fire still."
 zin_chr_20083_p2:0 "The trick is the Fire at the Door: when the recruiters came again in 3A 1004, the warrens chose their loudest and cleverest boss, Snikkit, to speak for all of them, and Snikkit had a fire of the yellow crusts lit in the mouth of every deep way and told the recruiters that the warrens were burning with a sickness; the stinking smoke made the lie true enough to send them away. The fire in the hall's mouth was never let out, and it is the great lamp of Burnikzig."
 zin_chr_20083_p3:0 "From the grief comes the warrens' law that payment comes first and nobody is trusted on credit; from the trick come the Big Sniks, one voice that lies for everyone, and the craft of the yellow crusts, which in 4A 1566 became the first powder of the Dark Lands. Burnikit sells to whoever pays and charges its enemies more, because it learned from the Necromancer what a promise is worth."
 zin_chr_20083_p4:0 "The Fire at the Door: a black tunnel-arch with a yellow fire burning in its mouth, on a rust-red field with a yellow hem. The sign is Snikkit's lie of 3A 1004: the mouth of a deep way with the sulphur fire burning in it, the sight that sent the Necromancer's recruiters back up the mountain.\n\nThe goblins painted it at the mouth of every warren afterwards as a warning to strangers, and when Burnikit began to sell its powder in 4A 1566 the same sign was burned into every keg, so that the orcs of Cocanoor and the men of Notbuton learned to read it before they could read anything else of the warrens."
 zin_chr_20083_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20083_short:0 "Burnikit"
 zin_chr_20083_sub:0 "Dark Lands · Realm"
 zin_chr_20083_title:0 "Burnikit"
 zin_chr_20084_p1:0 "The demons of the hall of ash are not Volgan's, and they are no longer the King of Demons'. The elves call demons corrupted angels; the thralls of Ozmath-Vesh know only that their masters came up out of the south.\n\nThe hall's own telling, which it gives its thralls in pieces, is that its lord was once of a house of the Nether's court, one of the houses that compete for the king's favour and the right to open portals, and that in the Third Age, when the portals were closing one by one as the houses quarrelled with Elzon's order, his house lost that right and its standing."
 zin_chr_20084_p2:0 "Rather than serve a rival house, the lord took the house's pact-name out of the court with him, which the court counts as theft, and walked north with the few demons who held to him, by vents and black shores that nobody has charted, until in 4A 1180 he came to the Goldoroth Ash Fields, where only devils roosted. He raked the black rock with his claws to mark the bounds of his lordship and raised a hall of pressed ash inside them."
 zin_chr_20084_p3:0 "Everything the hall does comes from that break. It swears to no master, because a house that serves loses its name; it binds its thralls by the pact-rite of blood and ash and marks them with the lord's three scores, because a lordship of a few hundred demons must hold its mortals fast; and it fears the court it left as much as the court resents it.\n\nThe thralls, broken orcs and debtor men who came after 4A 1390, keep a custom of their own: a thrall who has served seven winters may ask the lord for a name. In 4A 1748 the lordship is courted by the Southern Dominion, which it refused in 4A 1650, and watched from the Nether."
 zin_chr_20084_p4:0 "The Three Scores: three red claw-scores raked slantwise across an ash-grey field, with a black hem. When the lord came to the Ash Fields in 4A 1180 he marked the bounds of his lordship by raking the black rock with his claws, three scores at every corner, and the scores are still there, glowing faintly in the dark of the year."
 zin_chr_20084_p5:0 "Every thrall who swears to the hall is marked on the arm with the same three scores, and every pact the hall makes is sealed with them in ash. The thralls sewed the scores on grey cloth when they first marched in the hall's service, having no other sign, and the lord let it stand because it names what the hall is: a bound marked out of nothing by one who would not kneel."
 zin_chr_20084_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20084_short:0 "Veshazel"
 zin_chr_20084_sub:0 "Dark Lands · Realm"
 zin_chr_20084_title:0 "Veshazel"
 zin_chr_20085_p1:0 "The five walled harbours of the eastern coast grew on a shore where two old enemies met. In the Raiding Years of the Second Age the beaches below the Iron Road were the launching places of the iron holds' raids across the Northern Dark Strait, and Leren fleets came back to burn them so often that the Dondric fishers who lived there learned to build in stone and to keep no lord who could be blamed.\n\nWhen Leren merchants came to Dontadur in 4A 1071 to buy Dondor's iron, they came as the grandchildren of those who had burned the beaches, and they married the grandchildren of those who had raided the North."
 zin_chr_20085_p2:0 "The league sworn in 4A 1102 was made to keep that peace: the five towns gave their harbour-keys to one moot, and the founders set up a high seat in the moot-hall at Dontadur and swore that nobody would ever sit in it, so that no Dondric house and no Leren house could rule the other."
 zin_chr_20085_p3:0 "The empty seat is why Blackton chooses a moot-speaker each year who sits below it, why its burghers hold that a town is free when it has walls and no master, and why the charter quarrel of 4A 1688 was so bitter: a Leren-born burgher asked to sit in the seat, and the moot refused him by a single voice. In 4A 1748 every generation argues about the seat again, and the towns trade with everyone while keeping out of the Accord's wars where they can."
 zin_chr_20085_p4:0 "The Empty Seat: a tall-backed high seat, empty, in white on black, with a sea-green hem. The seat stands in the moot-hall at Dontadur where the founders set it in 4A 1102: a high seat of black-stained timber with a tall back, built for a lord and sworn to stay empty. At every moot the speaker turns to it before the vote and says that the seat is still empty, and the burghers answer that it will stay so."
 zin_chr_20085_p5:0 "The towns sewed the empty seat on their banners when they first manned their walls together, white on black because the seat is black and the cloth was the burghers' mourning colour, and the Leren quarter keeps an old copy of that banner from the charter quarrel."
 zin_chr_20085_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20085_short:0 "Blackton"
 zin_chr_20085_sub:0 "Dark Lands · Realm"
 zin_chr_20085_title:0 "Blackton"
 zin_chr_20086_p1:0 "The sea orcs say they were rowers before they were raiders. In the second millennium of the First Age Volgan's eastern and southern clients crossed the waters toward the Middle Lands in great galleys, and the oars of many were pulled by orcs chained to the benches, bought or taken from the holds of the Dark Lands."
 zin_chr_20086_p2:0 "When Dardan was lost the masters fled south and left a fleet of galleys stranded in the Belonton waters with their rowers still chained; the rowers broke their shackles, threw the last overseers into the sea and took the Lestern Isles and the borderland coast with the masters' own ships. They have been a seafaring people ever since, as no other orcs are. From the benches they kept three things."
 zin_chr_20086_p3:0 "The Salt Tithe: every voyage gives the sea a measure of salt, the share the masters used to take from them, now paid to the sea alone. The Sea-Chief chosen by voyages won, because on the benches only the stroke counted and nobody's birth. And the oath that no sea orc rows for a master again, which is why Belonton raided every strait through the Third Age and swore its confederacy at Notle in 3A 940 only so that its ships would raid others rather than each other."
 zin_chr_20086_p4:0 "It is also why the Dark Sea Accord of 4A 1604 holds: the sea orcs and the men of Dondor are both peoples left behind by masters who never came back for them, and the Accord's iron bar and skull were sunk together as the bench-chains had been. In 4A 1748 Goldoroth offers Belonton harbours and plunder, and the Sea-Chiefs hear in the offer the sound of a bench."
 zin_chr_20086_p5:0 "The Broken Shackle: an open iron shackle snapped through at one side, salt-white on deep sea-green, with a black hem. The shackle is the rowers' own. When the bench-chains were broken in the Belonton waters after Dardan, each rower kept the shackle from his own ankle, and the oldest holds of the confederacy still keep a few of them, eaten thin by salt, in their halls."
 zin_chr_20086_p6:0 "When the holds swore at Notle in 3A 940 each captain threw one shackle into the harbour and the Sea-Chief nailed the last to his mast, and Belonton's ships have flown a broken shackle on green ever since; Leren sailors call it the bench-mark and know it before they see the hull."
 zin_chr_20086_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20086_short:0 "Belonton"
 zin_chr_20086_sub:0 "Dark Lands · Realm"
 zin_chr_20086_title:0 "Belonton"
 zin_chr_20087_p1:0 "The Black Road through the gorge by Soun Lake is the oldest road of the iron hills, worn by orc carriers long before Aen and blackened by the slag they spread to keep it firm in the wet. In the Buried Wars it was the free holds' only road between the hills, and the Necromancer's garrison sat in the gorge to close it."
 zin_chr_20087_p2:0 "In 3A 700 Kargesk of the road-clans brought the free runners through the gorge at night by blowing a great horn from the cliff-top at the moment the garrison changed its watch, so that every runner on the road moved at once and the garrison fought shadows; by dawn the runners held the gorge and the garrison was dead or gone. Kargesk built the hold at Zubudor where his horn had sounded, and the horn hangs in its gate."
 zin_chr_20087_p3:0 "When the wars ended his heirs turned the barracks into caravan inns, and the horn became the sign of the Road-Peace: when a caravan enters the gorge the horn is blown, and from that note until the caravan leaves no blade may be drawn on it, by the hold or by anyone else, on pain of the ring. Bordon lives by that peace."
 zin_chr_20087_p4:0 "It is why caravans pay its tolls gladly, why its chiefs take Volgan's gifts and Goldoroth's threats with the same grin, and why the Night of the Trolls of 4A 1390 became Bordon's own grief: the caravan the troll king smashed had camped in the forest beyond the horn's reach and was under no peace, because it had left the road. In 4A 1748 the hold keeps the road open to everyone, and every master who wants the Black Road must first want the Road-Peace broken."
 zin_chr_20087_p5:0 "Kargesk's Horn: a great curved black war-horn bound with two red bands, on a dust-ochre field with a red hem. The horn Kargesk blew from the gorge's cliff in 3A 700 hangs in Zubudor's gate, a great curved horn of black bone bound with red-painted iron bands, too heavy for one orc to lift to his mouth. It is blown for every caravan that enters the Road-Peace and for every challenge of the ring.\n\nBordon's road-wardens carry the horn sewn on ochre cloth, the colour of the gorge's dust, so that a caravan master can tell from a distance that the riders coming toward him are the road's keepers and not raiders."
 zin_chr_20087_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20087_short:0 "Bordon"
 zin_chr_20087_sub:0 "Dark Lands · Realm"
 zin_chr_20087_title:0 "Bordon"
 zin_chr_20088_p1:0 "The fen orcs of Dreson are the levies who would not go. In the Buried Wars the Necromancer's recruiters took the young orcs of the iron holds in chains for his garrisons in Aenor, and in 3A 520 a column of them broke their chains on the march and fled into the fens, where the garrisons' horses sank and their carts could not follow."
 zin_chr_20088_p2:0 "Three of them, who had grown up as eel-fishers on the fen's edge, knew the paths, and they drove the first three piles into the reeds at Dolido so that the others had somewhere to stand. Those three were the first path-elders, and the reed-council of Dreson is their heirs: elders who know the fen paths and teach them only by walking them, never by drawing them, so that no map of the fens exists outside the council's memory."
 zin_chr_20088_p3:0 "From the flight comes the fen-law that no chains enter the fens: no slave, no thrall and no prisoner is held at Dolido, and an escaped captive who reaches the reeds is free. From the paths comes Dreson's way of war, the guide who walks ahead of a host and then is no longer there, which drowned the Necromancer's patrols in the Third Age and a Goldoroth host in the Reed Drowning of 4A 1561."
 zin_chr_20088_p4:0 "The hall on black piles still stands on the first three piles, and every path-elder is buried standing in the reeds beside them. In 4A 1748 Dreson belongs to nobody, and the reed-council weighs every envoy against the fen-law."
 zin_chr_20088_p5:0 "The Three Piles: three black piles standing upright, the middle one tallest, rising out of a wavy band of fen-green, on a pale reed-yellow field. The three piles are the first ones driven at Dolido in 3A 520 by the three eel-fishers who led the escaped levies into the fens, and the hall on black piles still stands on them. The reed-council keeps three path-elders in their memory, and when a council is called its elders touch the three piles before they sit."
 zin_chr_20088_p6:0 "The fen orcs embroidered the piles on reed-coloured cloth when the Free Moot first asked them to send a band to the hills, so that the other holds would know the fen-folk by their own sign and never mistake them for anybody's levies."
 zin_chr_20088_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20088_short:0 "Dreson"
 zin_chr_20088_sub:0 "Dark Lands · Realm"
 zin_chr_20088_title:0 "Dreson"
 zin_chr_20089_p1:0 "The four valleys of the long valley were four holds of the Iron Clans long before Aen, each with its own fire-rite: the north valley kept its fire in an iron basket, the river valley on a flat stone, the high valley in a pit and the south valley on an open hearth, and each held the others' rites in contempt. What made one realm of them was the Necromancer's last levy."
 zin_chr_20089_p2:0 "In the late Third Age his recruiters came for the young orcs of all four valleys in the same season, and each valley found that it could not hide its young alone. In 3A 1150 the four chiefs carried their fires to the hall at Lesderle, the only hall all four could reach in a day, lit them side by side on one hearthstone and swore that the four fires would burn together or not at all; the recruiters found four valleys under arms and went back without a single orc."
 zin_chr_20089_p3:0 "From that oath come Dulundur's laws: each valley keeps its own chief and its own fire, the hall speaks only when all four agree, and an envoy who asks one valley to break from the others is put out of the hall, as Goldoroth's envoy was in 4A 1612. The goblins of the valleys, who ran messages between the fires on the night of the oath, keep a lamp beside them in the hall to this day."
 zin_chr_20089_p4:0 "From the same oath came the Free Moot of 4A 1488, when the Four Fires called the free holds to Lesderle against the Iron Yoke and offered them the same bargain: keep your own fire, and keep it beside ours. In 4A 1748 Dulundur is the free holds' strongest voice, and its people say that a hall with one fire is a hall waiting for a master.\n\nThe Four Fires: four red flames rising side by side from one black hearthstone, their tips leaning together, on charcoal with a yellow hem. The four fires lit on one hearthstone at Lesderle in 3A 1150 have burned there ever since, each tended by its own valley's keepers."
 zin_chr_20089_p5:0 "When the four valleys first marched together under the oath their chiefs had no common sign, and the hall's weavers stitched the four fires on one stone so that every valley could see its own fire in the banner and none of them stood above the others. The holds of the Free Moot carry small copies of it to Lesderle when they come to speak."
 zin_chr_20089_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20089_short:0 "Dulundur"
 zin_chr_20089_sub:0 "Dark Lands · Realm"
 zin_chr_20089_title:0 "Dulundur"
 zin_chr_20090_p1:0 "The trolls of Grootoom remember nothing written and forget nothing told. They have lived in the forest beside the Black Road for as long as any orc remembers, and their oldest telling is the King-Stones.\n\nA troll who is caught by the sun turns slowly to stone, and the trolls hold that a troll king who has grown too great and too old does not die in the cave: he walks out of Holos at the end of a night and stands at the forest's edge facing the dawn, and the sun makes him a stone that keeps watch for ever."
 zin_chr_20090_p2:0 "The forest's edge is ringed with these hunched grey stones, and the trolls name each one and bring it silver and bones; this is the Hunger and the Stone that men have heard of, and the reason no troll lets anyone cut the forest's edge."
 zin_chr_20090_p3:0 "From the King-Stones come the forest's laws: the oldest unbeaten troll leads each group, because one day he will be a stone and must have earned it; the forest's bounds are where the kings stand, and nobody enters them; and silver, which the trolls say is cold like stone, belongs to the kings, which is why realms that pay the troll silver are let through and why the king smashes a camp that crosses the stones without paying."
 zin_chr_20090_p4:0 "The present king, Smash, is by far the largest troll and walks only at night, because the sun has already begun to turn him; his trolls say his stone will be the greatest on the edge. In 4A 1748 the forest belongs to nobody, and every power that wants the Black Road must reckon with kings who have watched it for longer than its road-chiefs have kept it."
 zin_chr_20090_p5:0 "The King-Stone: a hunched grey standing stone in the shape of a crouching troll, on deep forest-green, with a dark silver hem. The King-Stones stand at the forest's edge, each in the shape of a troll crouched to face the dawn, and the trolls bring them silver. When the trolls march, they carry before them a great slab of hide daubed in ash and silver with the shape of a King-Stone, the only standard trolls have ever made, so that the kings go with them.\n\nBordon's caravan masters drew the same shape in their record of the Night of the Trolls in 4A 1390, and the Dondor envoy who left the first troll silver in 4A 1515 laid it at the foot of a King-Stone."
 zin_chr_20090_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20090_short:0 "Troll Forest"
 zin_chr_20090_sub:0 "Dark Lands · Realm"
 zin_chr_20090_title:0 "Troll Forest"
 zin_chr_20091_p1:0 "The giants of Hoorunoron are the Forgotten Giants, the giants of the low hills of the drowned Low Country, and they carried their line with them. Long before Aen they lived on the low hills of the Low Country as partners of the cord-mothers' moot, raising the long sea-dikes from field-stone and keeping their cairn-fields on the high ground."
 zin_chr_20091_p2:0 "Their cairn-keepers warned the Moot that the land was being asked for too much, and when the mothers drew harder and the Night of the Sea broke the last dikes, the giants did not go down with the land. They withdrew north-east, taking with them the stones of the broken dikes, carried one under each arm, and raised them again as the line of cairns below the Dark Forests that men call the Borderline of Giants."
 zin_chr_20091_p3:0 "The line is a dike rebuilt on dry land, and that is why it may not be crossed: a breached dike lets in what drowns everything, and the giants will not see a line of theirs broken twice. From the same night they keep their own count, and the oldest stones of the count, laid in the first years after the sea came, lie at the head of the line by the Giant River, where a succession of keepers has added to them."
 zin_chr_20091_p4:0 "They say of the Low Country only that the land was asked for too much, and nothing of what lies under the sea. The forest beside their hills holds giants of another people, of whom the Forgotten Giants say nothing at all. Men and orcs date Hoorunoron from 4A 1210, when Dondor woodcutters who crossed the line were carried back over it; the giants date it from the night the sea came."
 zin_chr_20091_p5:0 "The Dike-Cairn: a tall cairn of stacked grey stones standing on a wavy blue-black band, on moss-green, with a stone-grey hem. Every cairn of the Borderline is built of stones from the broken sea-dikes of the drowned Low Country, carried north-east by the giants of the low hills after the Night of the Sea, long before Aen."
 zin_chr_20091_p6:0 "The cairn at the head of the line, at Maruunos by the Giant River, holds the oldest stones of the count, and the giants paint its shape standing on water in ochre and blue on the great hide that hangs in the cairn-hall, because the line, they say, still holds back a sea. Dondor's chroniclers copied the shape from that hide after the woodcutters were carried back in 4A 1210."
 zin_chr_20091_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20091_short:0 "Hoorunoron"
 zin_chr_20091_sub:0 "Dark Lands · Realm"
 zin_chr_20091_title:0 "Hoorunoron"
 zin_chr_20092_p1:0 "The orcs of the Dark Forests and the ogres of the caves under the Hills of Dark tell two different stories of where they came from, and the moot at Notdertu keeps both. The forest holds say their forebears were among the bands that came home from Dardan and found the iron hills full, and went into the Dark Forests' shade because nobody else wanted it."
 zin_chr_20092_p2:0 "The ogres say their clans walked from the sunrise long before Aen, from lands where their kin still live on the far side of a sea, and came into the caves of the Darkness because the caves were dark and full of meat; nobody can test it, and the scholars of other lands note only that ogres live on both sides of the eastern seas.\n\nFor centuries the two raided each other, until the hard winter of 4A 1222 left both starving and the orc chief Grimduth walked into the ogres' caves with meat on his spear and its point turned to the ground. The ogre clan-heads ate with him, and the Meat Moot was made."
 zin_chr_20092_p3:0 "Everything the Darks are comes from that meal: at Notdertu every spear is grounded point-down before the moot sits, meat is shared before words, and nothing is decided until the orcs and the ogres both agree. The moot also carries one shame, the Broken Cairn of 4A 1483, when orcs of the holds broke a cairn of the giants' Borderline for its stone and the giants broke their hold, and it has forbidden its people to touch a cairn since.\n\nIn 4A 1748 the orcs need the ogres' strength and the ogres need the orcs' hunting, and every envoy who would buy one without the other finds the spear still point-down."
 zin_chr_20092_p4:0 "The Grounded Spear: a black spear turned point-down, its shaft wound with a white thong, on blood-red, with a black hem. Grimduth carried meat into the ogres' caves on a spear turned point-down in the hard winter of 4A 1222, so that the ogres would see food before they saw a weapon, and the ogre clan-heads took the meat off the point.\n\nThe spear is kept at Notdertu with its shaft still wound in the thong that tied the meat, and the moot sits only after every spear in the hall has been grounded the same way. The Darks' war-bands carry the grounded spear on red so that both peoples march under a sign both of them made."
 zin_chr_20092_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20092_short:0 "The Darks"
 zin_chr_20092_sub:0 "Dark Lands · Realm"
 zin_chr_20092_title:0 "The Darks"
 zin_chr_20093_p1:0 "Skragdurg's chiefs say the forest-hold began with a tree nobody dared to cut.\n\nThe Fonoor Forest has given timber to the straits since the Raiding Years of the Second Age, when the iron holds' raiders built their boats from it to cross the Northern Dark Strait; but at the forest's edge where Gollonlon now stands grew the Old Black, a tree so wide that its shade kept the sun off the felling camps all summer, and the camps held that the forest would take its revenge on whoever felled it."
 zin_chr_20093_p2:0 "In 4A 1120 a chief called Grashdug cut it down with his own axe in a single season, and when no revenge came the camps followed him and built the forest-hold around the stump. The axe is still bitten into the stump at Gollonlon, and every chief must fell a great tree with his own hands before he may swear on it."
 zin_chr_20093_p3:0 "From that felling comes the hold's character: the forest-hold cuts what others fear to, sells to anyone who pays and takes no side, because its people say the timber does not care which hull it becomes, and the charcoal-burners of Colost swore the same oath on the stump when they joined the hold in 4A 1350."
 zin_chr_20093_p4:0 "It also comes with a fear the orcs do not say aloud, that the forest has not yet taken its revenge, which is why the hold plants a sapling for every great tree it fells and never cuts within sight of the giants' cairns. In 4A 1748 Skragdurg sells the timber for the Accord's ships and for Goldoroth's in the same season, and both sides suspect it of laughing at them."
 zin_chr_20093_p5:0 "Grashdug's Axe: a broad felling axe bitten into a black tree-stump, iron-grey and black on charcoal-red, with a black hem. The stump of the Old Black still stands at the forest's edge at Gollonlon with Grashdug's axe bitten into it, where he left it in 4A 1120 when the tree came down. Every forest-chief swears on the stump with his hand on the haft, and the axe is never drawn out, because the hold believes that the day it comes out the forest will take its revenge."
 zin_chr_20093_p6:0 "The felling camps branded the axe in the stump on Skragdurg's timber long before anyone sewed it, and shipwrights on both sides of the straits know it as the mark of good timber."
 zin_chr_20093_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20093_short:0 "Skragdurg"
 zin_chr_20093_sub:0 "Dark Lands · Realm"
 zin_chr_20093_title:0 "Skragdurg"
 zin_chr_20094_p1:0 "The toll-kings of Dun claim a crooked ancestor and are proud of him. The Zhaggul say their forefather was an orc ship-captain of the First Age who sold the Grand Alliance the hour of Volgan's crossing and sold Volgan the hour of the Alliance's, took gold from both, and was paid by neither when they found out; whether it is true nobody can say, and the chroniclers of other lands have never found his name, but every Zhaggul child learns it."
 zin_chr_20094_p2:0 "The peninsula at the mouth of the Dun Sea suited that lesson. Every ship into or out of the inner channel passes under Dobudo's walls, and when Rukhesk of the Zhaggul took the toll-town in 4A 1300 he set up the custom his house has kept since: the toll-king's ship flies a sail of two halves, each dyed in the colour of a neighbour who pays, and the halves are turned on the yard whenever the payment changes, so that the paymaster's colour faces the channel."
 zin_chr_20094_p3:0 "The toll-kings marry into every hold that will have them, the crown goes to the son or daughter who wins the ring, and the house's law is that a promise lasts as long as its price, which made the Swing of 4A 1596 a matter of pride at Dobudo and of disgust everywhere else. From the ancestor's tale also comes the Zhaggul fear that a buyer who learns he has been sold will one day come back, which is why Dobudo's walls are the strongest on the Dun Sea.\n\nIn 4A 1748 Dun is the least trusted crown of the Dark Lands and perhaps the best informed."
 zin_chr_20094_p4:0 "The Turned Sail: a black ship with one square sail split down the middle, red on one half and white on the other, on a sea-grey field with a black hem. The turned sail has been the toll-king's ship-sign since Rukhesk took Dobudo in 4A 1300: a sail of two halves, each dyed in the colour of a paying neighbour, turned on the yard whenever the payment changes. Ships entering the Dun Sea look at the toll-king's mast to know which side the channel favours that season."
 zin_chr_20094_p5:0 "The red and white sewn on Dun's banner are the colours of the first two neighbours the Zhaggul sold the channel to, and the toll-kings like to say they have never needed a third."
 zin_chr_20094_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20094_short:0 "Dun"
 zin_chr_20094_sub:0 "Dark Lands · Realm"
 zin_chr_20094_title:0 "Dun"
 zin_chr_20095_p1:0 "The iron hills of the south-east coast were dug by small orc holds long before Aen, and their deepest pit is the reason Britadon digs wide and never deep. In the First Age the holds of these hills sank a shaft deeper than any other, the pit the orcs now call the Hollow, and in Volgan's war, when the Damned Spirits rose from beneath the mountains, something breathed out of the Hollow that the hill-orcs will not describe."
 zin_chr_20095_p2:0 "The black boars of the hills fled first, out of the hills and down to the headlands, and the orcs who followed the boars lived; those who stayed by the pits did not. The survivors sealed the Hollow with slag and stone, and from that night come the hills' laws: no shaft may go deeper than the Brakgul measure, the iron is won from wide pits and shallow galleries, and nobody hunts the black boar, which the Brakgul clan holds saved it."
 zin_chr_20095_p3:0 "Bredesk of the Brakgul, who brought the headland hold of Beriath under Fontadon's iron in 4A 1380, did it partly to own the headlands the boars had led the clans to, and the same caution made his heirs sell their iron by sea from 4A 1500 rather than send it through Goldoroth's lands. They took a seat at the Free Moot in 4A 1520 because they wanted friends in the hills if Goldoroth came.\n\nIn 4A 1748 the Hollow is still sealed, Goldoroth's smiths would like to know how deep the coast's iron goes, and Britadon's chiefs answer that it goes exactly as deep as the measure."
 zin_chr_20095_p4:0 "The Running Boar: a black boar running with white tusks bared, on iron-red, with a black hem. When something breathed out of the Hollow in Volgan's war, the black boars of the hills ran first, down from the pits to the headlands, and the orcs who followed them lived.\n\nThe Brakgul took the running boar as their clan's sign that night and painted it on the slag that sealed the Hollow, and since Bredesk joined the headland to Fontadon in 4A 1380 it has been sewn on the hold's banner and branded on its iron bars. No Brakgul hunts the black boar, and a boar seen running down from the hills is still reason enough to empty the pits."
 zin_chr_20095_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20095_short:0 "Britadon"
 zin_chr_20095_sub:0 "Dark Lands · Realm"
 zin_chr_20095_title:0 "Britadon"
 zin_chr_20096_p1:0 "The Wild Lands moor was a battlefield before it was a refuge. In the last years of the Buried Wars, about 3A 690, the free holds' last host was broken on the moor by the Necromancer's garrisons, and the survivors scattered into the Doltu marsh; for centuries afterwards no hold would settle a field that held so many dead, and the moor became the place where those whom no hold would have went to live."
 zin_chr_20096_p2:0 "Exiles, clanless orcs, beaten chiefs and runaways made camps there, and the camps fought each other until 4A 1500, when the clans of the moor agreed on the one rule they keep: the land belongs to whoever stays through a winter. The rule shaped everything on the moor."
 zin_chr_20096_p3:0 "Nobody is asked his clan at Zudertu; whoever holds the largest winter camp when the snow comes speaks for the moor until the thaw; and on the first snow the winter-holder plants a bare pole at Zudertu, and every band that means to stay the winter ties a strip of its old clan-cloth to it. A camp that grows too large splits, as Zudertu did in 4A 1690, because no band on the moor will live under one that has become a hold.\n\nIn 4A 1748 the Wild Lands are the one place in the Dark Lands where anyone can start over, and every hold that pushes its outcasts onto the moor knows that one winter they may come back as a host."
 zin_chr_20096_p4:0 "The Rag-Pole: a bare black pole hung with three streaming strips of red, white and yellow cloth, on moor-brown, with a black hem. On the first snow of every winter the winter-holder of Zudertu plants a bare pole in the camp, and every band that means to stay ties a strip of its old clan-cloth to it, so that by midwinter the pole is a mass of torn colours from every hold in the Dark Lands."
 zin_chr_20096_p5:0 "The custom began with the winter rule of 4A 1500, and when the moor's bands first went raiding together they carried a pole with a few strips on it, which is the sign sewn on the moor's banner. The three strips stand for all the clans that are no longer anyone's, and any band may tie on another."
 zin_chr_20096_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20096_short:0 "Wild Lands"
 zin_chr_20096_sub:0 "Dark Lands · Realm"
 zin_chr_20096_title:0 "Wild Lands"
 zin_chr_20097_p1:0 "Long before Aen the houses that became the council came into the Living Forest from many directions, and their own songs disagree about whence; what every song agrees on is the quarrel. Each house claimed the glades it had found first, and for a long season the forest knew feuds over hunting runs and springs. The houses met under the oldest Singing Grove meaning to fight, and by their own telling they stayed to listen, because the grove was singing."
 zin_chr_20097_p2:0 "The first precedent was made there: a house that wished to speak had first to pick up a bough the grove had let fall, hold it while it spoke and lay it down for the next, and nobody might break a bough from a living tree to get a turn."
 zin_chr_20097_p3:0 "From that night come the customs that still shape the realm: the council's vote and its book of precedents; the rule that the houses take fallen wood only and never cut a living tree, which they wrote even into the Worshipdom's grant of the Zilin valleys; and the Speaking Bough itself, a fallen bough kept in the council-hall at Lyrion and passed from hand to hand at every Elder Moot."
 zin_chr_20097_p4:0 "The rule was broken once, in 3A 802, when the houses felled the northern wood themselves to cut the Black Roots' anchors; each house carried one bough of the trees it had felled to Lyrion, and the heap lies behind the council-hall as the hardest page of the book, written in wood.\n\nIn 4A 1748 a First Speaker still takes office by picking the bough up from the floor rather than being handed it, and a house that interrupts a speaker who holds it loses its voice for the session."
 zin_chr_20097_p5:0 "A fallen bough laid level across the field, leafed at one end, in mist grey on deep wood green: the Speaking Bough of the council-hall. The bough on the council's banners is the Speaking Bough, the fallen branch the first houses picked up under the oldest Singing Grove so that only one of them would speak at a time."
 zin_chr_20097_p6:0 "The war-speaker Sirael carried a bough of the same grove at Dardan instead of a standard, and the companies of the Grand Alliance learned to look for it in the smoke; after the Ember Lands the houses sewed it on grey-green cloth so that every company of the forest would carry the precedent with it. It is always shown lying level, never upright and never held, because no house owns it."
 zin_chr_20097_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20097_short:0 "Magical Forest"
 zin_chr_20097_sub:0 "Magical Lands · Realm"
 zin_chr_20097_title:0 "Magical Forest"
 zin_chr_20098_p1:0 "Long before Aen the hill elves lived on both faces of the range that men later called the Great Wall of Aenor, moving with the snowline as the years turned, and they had houses but no hall. Their realm was made by a winter they still call the White Winter, when the snow came down off the Herrodon rim in one night and buried the summer camps of the south slope."
 zin_chr_20098_p2:0 "A keeper of the herds, whom the hall's book names only as the First Queen, was lost on the rim in the storm and followed a white owl down to a hollow under the crags where the wind could not reach; she kept a fire alive there, went back into the snow again and again, and by spring she had brought most of the houses into the hollow."
 zin_chr_20098_p3:0 "The houses acclaimed her in the hollow that became the hall of Verozo, gave her its key, and swore that no house of the hills would ever again be left out in the snow. From that oath come the queenship by acclamation rather than by blood, the queen's duty to bring home anyone who is lost, the summons home of 2A 3, the seat kept empty for the lost household of the Kingdom Forests, and Herrodon's protection of the refugee families of Teste.\n\nThe hall still keeps owls in its roof-beams, no hill elf will harm one, and a queen lays the hall-key down only when she can no longer go out into the snow herself."
 zin_chr_20098_p4:0 "A white owl with its wings raised, facing out, on night slate: the Hall-Owl of Verozo. The owl is the bird that led the First Queen down from the rim to the hollow that became the hall, and an owl has roosted in the hall's roof-beam for as long as the hall's book runs.\n\nThe queens' wardens first carried it into the snow as a banner of search, sewn white on dark cloth so that the lost could see it against the slope at dusk, and the hill houses who answered the summons home of 2A 3 walked back over the range behind it. It goes out whenever the queen sends for someone, and it hangs over the empty seat of the lost household."
 zin_chr_20098_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20098_short:0 "Herrodon"
 zin_chr_20098_sub:0 "Magical Lands · Realm"
 zin_chr_20098_title:0 "Herrodon"
 zin_chr_20099_p1:0 "Long before Aen the lake elves were boat-folk with no land of their own: groves that lived on the waters of the Andos, took the water's name and moved the name with them when the water changed. Their oldest custom is the guest-night, in which a lake house shelters any stranger for one night and sends him on at dawn, because a boat can carry a guest but cannot keep one. The federation was forced on them by a drought."
 zin_chr_20099_p2:0 "In the Year of the Broken Weirs, a few years before the Weir Compact, the lakes fell so low that the groves broke one another's weirs to keep their own water, and a boat carrying the children of the grove of Ilawen was overturned in the race loosed by a broken dam.\n\nThe elder of that grove, Enlire, called the groves to the largest lake and would not let them ashore; she held the first Water-Court in her own boat, moored on open water, so that no grove could claim the ground the court stood on. The Weir Compact of 1A 480 was sworn there, and the court has sat afloat ever since."
 zin_chr_20099_p3:0 "From that drought come the Water-Court's law of weirs and boats, the rule that the Speaker owns no land and takes the name of the largest lake, the federation's habit of judging by water rather than by blood, and its old fear of every dry summer. Its boats still carry Lerendor's letters and the guests of every realm, and they still put them ashore at dawn."
 zin_chr_20099_p4:0 "A slender lake-boat with a tall curled prow, seen from the side and empty, in water silver on lake teal: the Court-Boat of Enliras. The boat is the Court-Boat, in which Enlire held the first Water-Court on open water so that no grove could own the ground the court sat on. It is the same boat, rebuilt plank by plank whenever a plank fails, that is moored on the largest lake at Enliras today, and the Speaker sits in it to judge.\n\nThe groves sewed it on their sails when the Weir Compact was sworn in 1A 480, and they show it empty because the court belongs to no grove and any grove may come aboard."
 zin_chr_20099_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20099_short:0 "Andos Enda"
 zin_chr_20099_sub:0 "Magical Lands · Realm"
 zin_chr_20099_title:0 "Andos Enda"
 zin_chr_201_p1:0 "The First Age lasted 1,675 years. It began with Aen's victory in the War of Men, when the first kingdom of men, Aenor, was founded in the Middle Lands; that victory is Year 1 of the age, and the centuries of fighting before it are not counted. It ended with the close of the first war against Volgan, after the Battle of Dardan and the failed invasion of the Ember Lands. The age that followed is called the Age of Rebuilding."
 zin_chr_201_p2:0 "Men had lived for many generations long before Aen. They had kingdoms, fought one another and kept their own customs, and great realms of men rose and fell in that deep past, but none of them held one crown over all men. Some of the earliest men were stronger, longer-lived and more open to magic than the men of later ages. There was something godlike in their power, although they were still men and not gods."
 zin_chr_201_p3:0 "The first half of the age is remembered as prosperous. Farming, trade, roads, shipbuilding and exploration spread beyond the Middle Lands. Aenoran ships reached the West Lands, the North Lands, the East Lands, the Cold Lands and the southern islands. Then came successive bad kings, struggles over the succession, wars and revolts, and the great kingdom slowly weakened."
 zin_chr_201_p4:0 "In the second millennium of the age the Great Spirit Volgan invaded Mirolon. His armies took Aenor's royal city and brought the kingdom to the edge of collapse. King Edran, the greatest king of men after Aen, gathered the Grand Alliance against him and broke him at Dardan, where millions died. Edran's invasion of the Ember Lands then failed against Elzon, and the armies of the alliance went home. Year 1675 closed the age."
 zin_chr_201_p5:0 "The age left a long inheritance. Aenor survived, but its capital, its institutions, its people and its friendships abroad were badly damaged. Volgan lived on in exile in the Void. Elzon and the last armies of the Ember Lands survived. Dardan lay waste. The elves trusted Aenor's kings less than before, and the old quarrel of the West Lands with Aenor over its settlements and claims was not settled."
 zin_chr_201_p6:0 "The chronicles agree on the length of the age and the order of its great events, and on little else in their dates. No chronicle tells the names and reigns of most of the kings who ruled between Aen and Edran, and it is not known in which year of the last years of the age Dardan was fought."
 zin_chr_201_plate:0 "GFX_zin_chr_plate_first_age"
 zin_chr_201_short:0 "The First Age"
 zin_chr_201_sub:0 "First Age · Age"
 zin_chr_201_title:0 "The First Age"
 zin_chr_20100_p1:0 "Before they were wardens the families of the southern crags were herders of the heights, few and proud, who drove their goats over the passes above the Lake of Mirolon and traded milk and wool with the men of Mirolon's shore, whom they counted as neighbours. When Volgan fell on Mirolon in 1A 1150, the herders saw his fires come round the lake by night and could not reach the shore in time.\n\nTheir eldest herder, Nolanwe, blew the great horn of the heights to warn the lake towns and blew it until its bell split, and the warning still came too late; at dawn the families saw what was left of the shore."
 zin_chr_20100_p2:0 "They swore that same morning, each family to one post, that nothing of Volgan's would come up through the heights and that the warning would never again come late, and the cracked horn was hung in the first warden-hall, where every Pass-Warden since has sworn on it.\n\nFrom that night comes the whole law of the wardenship: one family to one post, a vigil that never stops, a count of everyone who crosses, a Pass-Warden unmade if a vigil breaks on his watch, the watch on the Lake of Mirolon that has never once ceased, and an old shame that keeps the wardens closer to Mirolon's people than most elves are to any men."
 zin_chr_20100_p3:0 "In 4A 1748 the post-captains still learn the horn-calls before they learn the bow, and a warden who sends word late is not forgiven.\n\nA curved war-horn with a split bell, mouth to the left, in dawn silver on pass grey-green: the Cracked Horn of Ennaton. The horn is the herders' great horn that Nolanwe blew over the Lake of Mirolon on the night Volgan's fires came round the shore, until its bell split. The families who swore the Oath of the Posts at dawn sewed it on the cloth of the first watch-post, and the horn itself has hung over the warden-hall at Ennaton since the hall was built."
 zin_chr_20100_p4:0 "The wardens show it cracked on purpose, so that every post-captain who looks up at it remembers that a warning once came too late."
 zin_chr_20100_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20100_short:0 "Nolorim"
 zin_chr_20100_sub:0 "Magical Lands · Realm"
 zin_chr_20100_title:0 "Nolorim"
 zin_chr_20101_p1:0 "Long before Aen the rift-coast elves of the northern shore lived beside a people of men they could reach on foot, for the East was not yet cut off from the Magical Lands, and their oldest rolls name eastern families who were their friends over many lifetimes of men."
 zin_chr_20101_p2:0 "Among those friends a custom grew up: an elven house that kept a friendship with an eastern family took one of that family's names as a guest-name, and the eastern family gave the house seed of its orchards in return. When the neck of land broke and the sea came in between the shores, the friends were left on the far side; the shore-houses kept their guest-names and kept the seed in sealed jars as a pledge that the friendship would be taken up again."
 zin_chr_20101_p3:0 "The foreign sounds in Lccimio's names come from those guest-names, the shore's patient dealing with the East comes from that pledge, and the quay-book of 2A 300, sworn when eastern ships brought fever as well as silver, comes from the same reckoning that a friendship is kept by rules and not by trust alone."
 zin_chr_20101_p4:0 "The jars were opened at last in 4A 610, when the houses planted the orchards of the northern shore in the fields the Necromancer's age had left empty, and the oldest trees of Hidirim are said to grow from that seed. In 4A 1748 the houses would trade the Refusal for an eastern peace because they have waited for one longer than any realm of men has stood, and every new Elder plants a tree of the old seed-line in the quay-garden of Hidirim."
 zin_chr_20101_p5:0 "A round-headed fruit tree in white blossom, standing alone, in quay silver on rift teal: the Pledge-Tree of Hidirim. The tree is the Pledge-Tree, grown from the seed the eastern friends of the shore-houses gave them across the neck before the land broke, kept in sealed jars through the ages and planted at Hidirim in 4A 610.\n\nThe shore's banner of the plague centuries showed the sealed jar, and when the jar was opened the houses sewed the tree in its place; the elder houses carried it into the Elder Moot at the Shore Debate of 4A 1702. It is always shown in blossom and never in fruit, because the pledge is not yet kept."
 zin_chr_20101_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20101_short:0 "Lccimio"
 zin_chr_20101_sub:0 "Magical Lands · Realm"
 zin_chr_20101_title:0 "Lccimio"
 zin_chr_20102_p1:0 "The loremasters keep a treaty older than their house: long before Aen the elders of the shore let the road of an eastern kingdom cross the southern rift shore on condition that no army of that kingdom came with it, and the house that kept the treaty kept the road's end at Lenkei, where the old roads still stop. It was a house of witnesses, whose duty was to see who came along the road and to remember it. Its great change came after the Ember Lands."
 zin_chr_20102_p2:0 "When the companies of the Grand Alliance came home along the old roads, those who carried the spears of the fallen laid them down at the road's end, and the witnesses would not let the companies pass until every spear had been named. They broke each spear across the treaty-stone so that it could never be carried to war again, buried the heads, and wrote the names in the first book of the Archive in 2A 9."
 zin_chr_20102_p3:0 "From that day come the Archive's rule that no elf should march until the names of the last war have been read, its keeping of every vote of the Refusal, its right to refuse any reader, king or elf, and its custom of reading the names of the fallen aloud at the road's end every spring. The unfinished book of 3A 1180 lies in the same hall as the broken spears, and the loremasters say only that both are records of something that stopped.\n\nIn 4A 1748 they are copying the oldest books, and some of them have begun to ask whether a second heap of spears is coming."
 zin_chr_20102_p4:0 "A spear broken in two, the halves laid apart with a gap between them, in quay silver on night sea: the Broken Spears of the Road's End. The broken spear is the first deed of the Archive: in 2A 9 the witnesses of Lenkei broke the spears of the elves who fell in the Ember Lands across the treaty-stone at the road's end and wrote each name before they let the companies pass.\n\nThe loremasters sewed one broken spear on the cloth that covers the Book of the Fallen, and they carry that cloth as a banner whenever the Archive's books leave Lenkei. The halves are always shown apart and never mended."
 zin_chr_20102_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20102_short:0 "Eldafaen"
 zin_chr_20102_sub:0 "Magical Lands · Realm"
 zin_chr_20102_title:0 "Eldafaen"
 zin_chr_20103_p1:0 "The roost-keepers say the dragons roosted on the three spurs of Dragon Mountain before any elf lived in the green strip beneath them, and that the first keepers came not to tame them but to listen.\n\nLong before Aen, by their telling, a band of elves fleeing a hard winter on the Magic Mountains sheltered under the spurs, and a dragon came down among them in the night and did not harm them; in the morning it had gone and had left one shed scale, still warm, beside their fire. The eldest of the band took the scale for a word given and climbed to the roost to give it back, and the dragon would not take it; the bond began with that refused gift."
 zin_chr_20103_p2:0 "From it come all the customs of Yavieth: the keepers have no ruler, only an eldest who climbs to speak; a dragon never forgets a name and never says one, so the keepers keep no lists; they take only shed scale and never draw a dragon's blood; the dragon-shy goats on the slopes are the dragons' whenever the dragons want them; and no realm of the Kindred asks a dragon for help without the keepers' word."
 zin_chr_20103_p3:0 "The bond was wounded in 1A 1600, when dragons corrupted to Volgan's service took two roosts of the western spur, and the keepers still will not say how the spur was made clean. In 4A 1748 the First Scale is kept at Thoriveniel wrapped in green cloth, and to the keepers the scale trade at Kingson is the sale of what the dragons have given up, never of anything taken from them."
 zin_chr_20103_p4:0 "A single shed dragon scale, point down, above the three spurs of Dragon Mountain, in keeper silver on slope green: the First Scale. The scale is the First Scale, the one a dragon left beside the fire of the first keepers and would not take back, and the three spurs beneath it are the roosts where the bond is kept.\n\nThe keepers carried it on a cloth to Kingson when the scale trade began in 4A 120, so that the market would know whose goods these were, and they hang it at the roost-mouth whenever the eldest keeper goes up to speak. The keepers never show the dragon itself, because a dragon is no one's sign."
 zin_chr_20103_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20103_short:0 "Yavieth"
 zin_chr_20103_sub:0 "Magical Lands · Realm"
 zin_chr_20103_title:0 "Yavieth"
 zin_chr_20104_p1:0 "The men of Teste descend from the rangers and field-folk of the Vale who fled the Necromancer's Order over the Kingson Pass in the early Third Age, carrying seed-grain sewn into their hoods because it was the one thing the Order's collectors had not found. The lake elves of Andos Enda sheltered them for a night and sent them on at dawn, as they send every guest, and the families walked north all day without knowing where they were going."
 zin_chr_20104_p2:0 "At dusk Halvar, who led them, saw swallows dropping into a valley under the Herrodon rim, and he said that swallows come down only where there is water, mud for a nest and fields to hunt over; they followed the birds and found the empty Teste Vale. The grandmothers' saying that they were sent away at dawn and came home at dusk is the story of that day, and the commune keeps it by shutting its gate at dawn on the founding day and opening it at dusk."
 zin_chr_20104_p3:0 "From the hood-seed come the vale's first fields and its bargain to feed Herrodon's hall; from the Vale they left come their old ranger speech, a Reeve chosen every year instead of a lord, and the limit on a Reeve's years that followed Halvar's twenty; and from the swallows comes the rule that no one in the vale pulls down a nest under an eave.\n\nIn 4A 1748 the commune still sows a handful of grain of the hood-seed line first in every field, and it has not forgotten that the Vale it fled lies just over the pass."
 zin_chr_20104_p4:0 "A swallow diving with its wings swept back, in straw on vale green: the Dusk Swallow of Testebur. The swallow is the bird Halvar's families followed at dusk on the day the lake elves sent them on, down into the empty vale that became their home. The families sewed it on the cloth that covered the first seed-sack opened in the vale, that cloth hung over the first harvest moot, and every Reeve since has been chosen under a swallow banner.\n\nIt is shown diving, as the birds came down to the vale, and never rising."
 zin_chr_20104_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20104_short:0 "Teste"
 zin_chr_20104_sub:0 "Magical Lands · Realm"
 zin_chr_20104_title:0 "Teste"
 zin_chr_20105_p1:0 "The quay-folk of Luv-zhise are Alerhic boat-families whose oldest songs say they were the people of the city that stood astride the neck of land before it broke. When the sea came in long before Aen, the city broke with the land; its western half lies under the fungal belt of the shore beside the port, and its eastern half under the grass of the Delbiz coast.\n\nThe boat-families stayed on the water between the halves and began ferrying travellers over the place where the road had run, steering by the tops of drowned pillars and causeway footings that still show at low water, and the ferries have run ever since without a break that anyone remembers."
 zin_chr_20105_p2:0 "From that loss comes the port's whole character: the river families and the temple families who share the office of Quay-Master, the Lake Litany of the River Temples kept beside the twelve, the pillar-marks every pilot must learn before he may take a ferry across, a habit of siding with whoever holds the crossing, and an old hope among the temple families that the two halves of the city will one day stand on one shore again."
 zin_chr_20105_p3:0 "Blosian Furanides won the charter of 4A 140 from the elves by ferrying the quay-book's keepers across in a storm without charging a fare, and every Quay-Master since crosses once a year without a fare in his memory. In 4A 1748 the quay-houses still swear in each new Quay-Master under the half arch of the Western Gate, the last standing piece of the old city, which rises out of the water at the port's edge."
 zin_chr_20105_p4:0 "A half arch broken at its crown, rising from a single pier, in quay ochre on narrows teal: the Western Gate. The half arch is the Western Gate, the last standing piece of the city that crossed the neck before the land broke; it rises from the water at the port's edge and can be seen from the Delbiz shore on a clear day.\n\nThe ferrymen steered by it before there was a port, painted it on their prows as the mark of the crossing, and sewed it on the quay-houses' banner when the elves granted the charter of 4A 140. It is shown broken at the crown because the other half stands on the far shore."
 zin_chr_20105_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20105_short:0 "Luv-zhise"
 zin_chr_20105_sub:0 "Magical Lands · Realm"
 zin_chr_20105_title:0 "Luv-zhise"
 zin_chr_20106_p1:0 "What is known of the mycids' past is only what other peoples have seen of them, and the rift-coast elves, who have watched the belt longest, insist that it is very little.\n\nTheir oldest rolls say the belt of giant fungi already stood on the rift shore when the neck of land broke long before Aen, and that it grew over the western half of the drowned city on that shore, so that pillars and causeway footings now stand among the stems; the quay-folk of Luv-zhise steer by the ones that reach the water. The elves have never ruled the belt and say they have never been asked in."
 zin_chr_20106_p2:0 "The one great deed anyone can tell of the belt came in the Third Age: when the Black Roots crept through the land's magic toward the rift coast in 3A 820, the fungi grew over them and the dead roots rotted away there, while the elves of the north had to fell their own wood to stop them. Whether the mycids did this, allowed it or only lived through it, nobody outside the forest knows, and the mycids have never said."
 zin_chr_20106_p3:0 "Since 4A 388 they have come to the market of Luv-zhise in rings, standing in a circle, with fungi, dyes and spore-cloth, and every bale they bring bears the same stamped mark: a pale cap rising from a black severed root. The traders read the mark as the belt's own memory of the Black Roots; the mycids have never explained it, and the quay-books record it as the only sign of the mycids that anyone has."
 zin_chr_20106_p4:0 "A pale cap rising from a black severed root, in cap cream and loam dark on spore purple: the Bale-Mark of the rings. The cap on the severed root is the mark stamped on every bale the mycids have brought to the market of Luv-zhise since 4A 388, and it is the only sign of theirs that any other people has seen.\n\nThe quay-houses copied it onto the cloth that marks the mycids' place at the market, and the rift-coast elves read it as the belt remembering the Black Roots it rotted away in 3A 820. What the mycids themselves mean by it has never been said."
 zin_chr_20106_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20106_short:0 "Mushroom Forest"
 zin_chr_20106_sub:0 "Magical Lands · Realm"
 zin_chr_20106_title:0 "Mushroom Forest"
 zin_chr_20107_p1:0 "Long before Aen an old road of the East came through the Zilin Hills on its way west to the South Pass, and its travellers rested in the three valleys at stone wells and hostels whose foundations still lie under the herb-meadows. The road died when the land to the east broke, the hostels fell in, and for ages the valleys belonged only to the healing herbs, which the elves of the Magical Forest would not cut and would let no one else cut."
 zin_chr_20107_p2:0 "A hermit of the Deliverer came there in 4A 1520 because, the pilgrims say, the old wells still ran, and in the famine winter of the hermitage's third year he baked bread for every traveller who came over the South Pass from the hermitage's one oven, giving away the loaf before he asked the stranger's name."
 zin_chr_20107_p3:0 "From that winter comes the valleys' first rule, that a pilgrim house feeds and doctors a guest before it asks who he is, and the Worshipdom's whole public character grew from it: the hostels on the old road, the herb-physicians, the famine stores, the couriers who carry any court's letters for a small fee, and the elves' condition of 4A 1524 that no pilgrim cuts a living tree, which the houses keep strictly."
 zin_chr_20107_p4:0 "The hermit's oven still stands in Lenlakron and is lit on feast days to bake the loaves given to the first pilgrims of the season, and the valleys have never raised more than their hill wardens. In 4A 1748 the Worshipdom's houses stand on the caravan roads, in Parim and across the sea, and every one of them keeps a bread-shelf by its door."
 zin_chr_20107_p5:0 "A hand reaching up from the base and offering a round loaf, in bread brown on hostel white: the Hermit's Loaf. The hand and loaf are the Hermit's Loaf, the bread the first hermit of the valleys gave to every traveller over the South Pass in the famine winter of the hermitage's third year, before he asked the stranger's name."
 zin_chr_20107_p6:0 "The pilgrims who carried word of it back to the lake towns sewed a hand and a loaf on the pennons of their staves, and the first High Confessor took it as the valleys' arms when the houses of the Magical Forest granted the three valleys in 4A 1524. Every pilgrim house of the Worshipdom shows it over its door."
 zin_chr_20107_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20107_short:0 "Worshipdom"
 zin_chr_20107_sub:0 "Magical Lands · Realm"
 zin_chr_20107_title:0 "Worshipdom"
 zin_chr_20108_p1:0 "What built the black north is the oldest silence in Aoaz, and every people who tells of it tells only what it saw from the sea. Zol, the Old God of Death, came there long before Aen and Volgan, and the land was already black rock, ash and black frost when the first sailors of the north-west came near it; their oldest sea-words, older than any chart, have a word for that coast that means only the shore from which nothing comes back."
 zin_chr_20108_p2:0 "No people of men ever lived on the mainland in any memory, so the Mistake has no founder, no first king, no oath and no tongue of its own, and nobody knows why it is called a Mistake. What the living of the north keep instead is a custom.\n\nOn the outer isles, before any Leren fisher wintered there, someone laid the dead inside rings of black stones and left every ring open on its northern side, and the fishers who came in 4A 230 found those rings older than any record and took up the custom as their own: the dead belong to the Old God of Death, they say, and a closed ring would be a theft from him."
 zin_chr_20108_p3:0 "From that one belief come all the rest: the first fish of every season left on the black shore, the silence and the low lamps on still nights, the name never spoken at sea, and the winter tale of Kusven, the grave-wind who serves the Old God of Death, which the shore folk tell as a warning and no court takes for more than a tale.\n\nIn 4A 1748 the open rings are still laid on Peledor, Drolkot and Erinlor, and the sailors who chart the Rim still draw them beside the still sea, because nothing the world has learned about the black north in four ages is more than that."
 zin_chr_20108_p4:0 "The sign first appears on an Aenoran chart of 1A 470, where a pilot of the northern voyages drew rings on flat water beside the name Zol's Mistake, broken where his pen lifted, as the mark of a sea that lay still and a coast where no bird followed the ships."
 zin_chr_20108_p5:0 "When the Leren fishers came to the outer isles in 4A 230 they found the same figure laid on the black shore in stones, the burial rings of a people nobody remembers, each ring left open toward the north. Whose hand laid the first rings is not known, and the sign has no maker anyone can name: it belongs to the black north the way its silence does, and it is the sigil the charts and the courts give the Will of Zol, the emblem in whose name the realm is held."
 zin_chr_20108_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20108_short:0 "Zol's Mistake"
 zin_chr_20108_sub:0 "Zol's Mistake · Realm"
 zin_chr_20108_title:0 "Zol's Mistake"
 zin_chr_20109_p1:0 "Long before Aen the forefathers of the desert tribes were the drovers of the Bridge Kingdom, which they call Tarqis: they walked its caravans of horses and cedar along the eastern march and knew every water-hole between the Melty Pass and the neck. When the bridge broke, the road ended under the sea, and the drovers became a people of wells without a road, wandering from water to water."
 zin_chr_20109_p2:0 "In the First Age the Kalioth kings brought the desert tribes under their iron and set water-masters over the wells, who sealed them with iron lids and opened them only for tribes that sent riders and camels to the Crown's hosts. When the Kalioth host died with Volgan's at Dardan, the tribes broke the lids from every well between the wadi and the north coast in a single season, and the riders swore that water would never again belong to one man.\n\nThat oath is the root of the Well-Oath: whoever has drunk from a household's water is kin of that household, a tribe that shares a well may not raid it, and no king of Noris owns a well."
 zin_chr_20109_p3:0 "The Seven Wells were dug by seven tribes together on one hill so that no tribe could own them; the War of the Eighth Well was fought when one tribe dug a well of its own below the hill; and the Khadi king is chosen by the well-lords because a king who held the water would be a water-master again.\n\nThe riders' scorn of black powder comes from the same memory: the iron hosts that held them down were hosts of engines and forges, and the tribes say that men who need forges need masters."
 zin_chr_20109_p4:0 "An upright rider's lance with a round water-gourd hung by its cord beneath the blade, in well white on deep indigo. Qasud ben Melar of the Khadi ended the War of the Eighth Well in 2A 1214 without a battle at its close."
 zin_chr_20109_p5:0 "He rode into the camp of each warring tribe with a gourd of water from the Seven Wells hung under his lance-head and offered it, and every tribe that drank became kin to the others under the Well-Oath and could no longer fight them; the tribes that would not drink he fought. The well-lords chose him king at the wells, and the gourd-lance became the standard of the Khadi: it is carried before the king at every muster and filled at the Seven Wells before every war.\n\nA king the well-lords no longer trust is not deposed; the gourd is simply not filled for him, and no rider follows an empty gourd."
 zin_chr_20109_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20109_short:0 "Noris"
 zin_chr_20109_sub:0 "East Lands · Realm"
 zin_chr_20109_title:0 "Noris"
 zin_chr_20110_p1:0 "The bronze towns of the southern hills say they are older than the Gold Road by three ages and older than the river crowns by one. When the bridge broke, a weigher of the eastern gate carried the Ox south into the hills, and the towns that grew round the copper seams kept it in a mine.\n\nIn the First Age the Kalioth kings, who called themselves the restorers of the Bridge Kingdom, demanded the Measure as proof of their claim; the hill towns sent them a false ox of lead and hid the true one in a flooded gallery, and the Crown's tribute was weighed for the rest of its days against a lie that nobody discovered."
 zin_chr_20110_p2:0 "From that deception come both laws of the caravan princes: the honest weight between partners is holy, because the Ox is the weight of the old road; and a weight given to a lord who takes by force may be false, because the hills once saved themselves by it. When the houses opened the Gold Road in 4A 641 they drew the Ox out of the gallery for the first weighing at the road's gate, and the Ledger Count begins on that day.\n\nEvery Prince of the Scales takes his oath with one hand on its back, and the bench keeps it in the Hall of Scales at Postondoroth, where it is shown once a year and weighed against the city's standard."
 zin_chr_20110_p3:0 "A crouching bronze ox with a lifting ring on its back, in bronze gold on deep green. The ox is the King's Measure itself, the bronze weight of the Bridge Road that the hill towns hid from the Kalioth kings and drew out of its flooded gallery for the first weighing of the Gold Road in 4A 641.\n\nThe bench of houses sewed it on the road's first banner that year, and every caravan of the Gold Road has marched under it since; a weigh-house that flies the ox swears that its weights are true to the Measure, and a weigher caught cheating under it is struck from every bench of the road."
 zin_chr_20110_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20110_short:0 "Stabilo"
 zin_chr_20110_sub:0 "East Lands · Realm"
 zin_chr_20110_title:0 "Stabilo"
 zin_chr_20110_x1_p1:0 "Their weighers descend, by their own telling, from the keepers of the King's Measure of the Bridge Kingdom, which the Stabilic ledgers call Pontoseno, the old bridge: a bronze ox cast at Qadurum against which every toll on the Bridge Road was weighed, so that a load of cedar paid the same at the Melty Pass as at the neck."
 zin_chr_20111_p1:0 "The histories of Alerhia are kept by its own chroniclers."
 zin_chr_20111_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20111_short:0 "Alerhia"
 zin_chr_20111_sub:0 "East Lands · Realm"
 zin_chr_20111_title:0 "Alerhia"
 zin_chr_20111_x1_p1:0 "Alerhia is the primary shadow of Tarkia, the Bridge Kingdom, whose one Eastern people held both shores before the rift."
 zin_chr_20111_x2_p1:0 "Its scribes still write the reed letters of the stair-temples, and its kings are still crowned standing in the river, as the bridge-kings were anointed at it.\n\nWhen the neck broke in the war of the two heirs and the sea came in, the flood of the Breaking drowned the low valley; the temple chronicles say the survivors raised a stair of stone above the flood-line so that the river and the gods would each have a place, and crowned the man who carried the first stone to its top."
 zin_chr_20111_x2_p2:0 "Alerhia's law comes from that stair: the king stands below the gods and above the river, the scribe-council keeps what the king must not forget, and a king who abandons the valley in a flood forfeits the crown. The scribes also keep a claim they never write out in full, the old title of the bridge-kings, the great king of both shores, which appears in the king-lists only as an empty line at the head of every list. The Black Tribute shaped the rest."
 zin_chr_20111_x2_p3:0 "When Volgan's envoys came in 1A 1214, the Kalioth kings, who called themselves the restorers of the Bridge Kingdom, had already paid; the scribe-council answered that the Bridge Kingdom had left a stair and not a master, and the king burned the black-sailed hulls at the river mouth.\n\nFrom that refusal come Alerhia's pride, its distrust of every crown that claims the bridge, and its habit of trading with the elven shore while kneeling to nobody on either side of the water."
 zin_chr_20111_x2_p4:0 "A white stair of five steps climbing from the lower hoist toward the upper fly, with a narrow river-king's crown resting on the top step, on river blue. The stair is the first stair of the temple chronicles, raised above the flood of the Breaking, and the crown on its top step is the crown of the man who carried the first stone."
 zin_chr_20111_x2_p5:0 "The river crowns painted it above the flood-line on their temples before Aen won his war, and the Alerhides flew it from the river galleys that burned the black hulls at the river mouth in 1A 1214. The Furanides, who won the crown in the War of the Two Floods, added nothing to it, because a Furanid king reigns under the river's name and not his own; the steps are always five, because the oldest stair at Porrenva has five steps above the flood-mark."
 zin_chr_20112_p1:0 "Naamis is young as a crown and old as a coast. The harbour-folk of the north coast plain sailed the Kusmeel shore and the North Mouth of the Rift long before Aen, and in the First Age the harbours of Hacsen and Vigodor were among the eastern ports that gave Volgan ships when he opened his war. Their fleets sailed south with his eastern clients and none came back; the coast's chronicles say only that the black hulls went into the Rift Sea and the sea kept them."
 zin_chr_20112_p2:0 "The harbours were left to the women, the harbour-mothers, who rebuilt the boats, fished the coast and swore at the harbour mouths that no fleet of the coast would ever again sail for a foreign lord on a man's word alone.\n\nFrom that oath come the laws that make Naamis what it is: the crown passes most often to a queen, because the first keepers of the harbours were women; the council of ship-masters may refuse the queen's ships but not her crown, because the mothers kept the ships and the masters kept the sea; and every year the queen's ship rows out to the North Mouth, where the old fleets were last seen, and back."
 zin_chr_20112_p3:0 "The boat clans who refused to give Volgan their boats fled north onto the ice and became the sealers of Woqood, and the two peoples kept a cold distance for three ages, until the Ice Winter of 4A 1604, when Naamis fed the clans and the old shame was paid. The Wedding of the Two Harbours in 3A 1102 joined two harbour-mothers' lines, and the sea crown of Duum-Saah still counts its queens from them."
 zin_chr_20112_p4:0 "A ship with a prow at both ends, both stems curling up alike, without mast or sail, in sea white on deep slate. When the fleets did not come back, the harbour-mothers of Hacsen and Vigodor each built one ship with a stem at either end, so that it could row out to the North Mouth and come home without turning, and they rowed it out every year to call the names of the lost."
 zin_chr_20112_p5:0 "The two harbours quarrelled over everything else for two ages, but each kept its double-prowed ship. At the Wedding of the Two Harbours in 3A 1102 the heiress of Hacsen stepped from her harbour's ship to Vigodor's at sea and the two were lashed together; since then the sea crown has kept one such ship, the Returning Ship, which is the queen's own and carries no mast."
 zin_chr_20112_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20112_short:0 "Naamis"
 zin_chr_20112_sub:0 "East Lands · Realm"
 zin_chr_20112_title:0 "Naamis"
 zin_chr_20113_p1:0 "The forge-houses of the Drak Mountains descend, by their own oath-songs, from the slave-smiths of the Kalioth Crown. The mountain kings of the First Age worked their mines with chained mine-folk and bound their best smiths to the forges with iron collars, so that the siege-craft for which the Kalioth were feared was made by men who could not leave the furnace."
 zin_chr_20113_p2:0 "When the Kalioth host died at Dardan and the garrisons starved, the smiths of the southern forges broke their collars, carried their tools north over the Drak ridge to the smoking cone the Kalioth had feared to mine, and swore to one another under the Furnace that no smith of theirs would ever again wear a master's iron.\n\nThe houses of the mountain kept that oath for three ages as small, suspicious forge-clans, each guarding its craft in a locked chest, until the Furnace Oath of 4A 802 joined them under one Forge-Prince of House Barzio, whose name means iron."
 zin_chr_20113_p3:0 "Their customs come from the collar: an apprentice is made a master when his master strikes a ring of iron from his neck at the forge; a Forge-Prince is chosen and never born; and the houses sell their iron but never their smiths.\n\nThe irony every house of Drak knows is that the Furnace Oath bound them to sell only through Stabilo's weigh-houses, and that the black powder their forge-master Arcan Dolgio compounded in 4A 1532 from the Furnace's sulphur has made the descendants of slave-smiths the master-smiths of other men's wars."
 zin_chr_20113_p4:0 "An open iron collar broken at its hinge, in red-hot orange on black. The collar is the one a smith of the southern forges wore at the Kalioth's last furnace and broke on the night the garrisons fled; the forge-songs say he carried it over the ridge and hung it on the first forge under the Drak Furnace."
 zin_chr_20113_p5:0 "The forge-houses struck the broken collar into their iron as their mark for three ages, and at the Furnace Oath of 4A 802 they chose it over a crown for the Forge-Prince's banner, because a prince of Drak is first among free smiths and nothing more. Every master's ring struck from an apprentice's neck is hung beside the first collar in the forge-hall of Castronuro."
 zin_chr_20113_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20113_short:0 "Drak"
 zin_chr_20113_sub:0 "East Lands · Realm"
 zin_chr_20113_title:0 "Drak"
 zin_chr_20114_p1:0 "The Red Lands were a burned land long before Aen. The temple chronicles of Alerhia record that the vents of the Rhachia Fires covered the country in red ash in the years after the Breaking and that nothing grew there for a lifetime. The clay-folk's own telling is that a band of mothers lived through the ash in the caves under the vent-field with their children and no men, and that when they came out they found the ash turned to red clay in the rain.\n\nThey shaped the clay into figures of their dead husbands and sons and fired them in the cave mouths, so that the dead would have bodies to stand in, and they founded the first kilns of the Red Lands."
 zin_chr_20114_p2:0 "From the first mothers come the Red Hearth, which holds that the red clay is the bone of the mothers, and every custom of the commonwealth: the clay figures of the first mothers are refired every spring; a village is governed by its kiln-mothers and its elected head; and land belongs to the village that fires the clay dug from it. A king was always a stranger in the Red Lands."
 zin_chr_20114_p3:0 "The Kalioth kings took the kilns' clay for their siege-moulds and were hated for it; the cadet line of Alerhia that ruled the kilns from 4A 1288 never understood that it taxed the mothers' bones; and when King Mirodeus doubled the kiln-tax and seized the clay pits of villages that could not pay, the kiln-mothers opened the gates of Pordoce to the villagers. The tribunes elected since 4A 1719 swear their office in front of the first mothers' figures."
 zin_chr_20114_p4:0 "A seated mother-figure of fired clay, wide-hipped and armless, in kiln red on ash white. The figure is the eldest of the clay mothers kept in the kiln-shrine of Pordoce, which the villages say was shaped by the first mothers in the caves of the vent-field. Every spring each village refires its own figures, and the kiln-mothers carry the eldest through the villages before the refiring.\n\nWhen the towns rose in 4A 1719, Moiria of the Kilns walked at the head of the villagers with the eldest figure in her arms and the king's guards would not strike at it; the tribunes took it for the banner of the commonwealth the next spring, and the village militias sew it on ash-white cloth."
 zin_chr_20114_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20114_short:0 "Rhachia"
 zin_chr_20114_sub:0 "East Lands · Realm"
 zin_chr_20114_title:0 "Rhachia"
 zin_chr_20115_p1:0 "Erco is the shadow tempted to become what it overthrew. The mine-folk of the southern mountains were the Crown's miners and fort-builders, ruled but never trusted. When the Kalioth host died at Dardan and the beaten garrisons came home starving, the mine-lord Rhanoth, who had held the river ford through the whole war, shut the passes against them, besieged the last king in his hall and was crowned in the southern river in 2A 12."
 zin_chr_20115_p2:0 "Erco's customs are those of people who live over a buried crown. The forts are manned by miners who are also soldiers, because the Kalioth's walled cities taught the mine-folk that a mountain is held by those who dig it. And the fire-tithe the realm has paid to the Smoking Teeth since 4A 1206 is called a tax by the people and an offering by the priests, because nobody in Atonto wants to say aloud that the old kings paid the mountain too."
 zin_chr_20115_p3:0 "A black iron diadem of seven points turned upside down, its points downward, on stone grey. When Rhanoth's mine-lords took the last Kalioth king's diadem in 2A 12, they set it on the floor of his hall with its points down before they walled it up, so that it would crown no one, and the first banner of the mine-lords showed the diadem as they left it. Its seven points became the seven forts of the Kalioth upland when Erco raised them in 4A 1120.\n\nA Rhanid king is shown the walled place once, at his crowning, and told that the crown under the mountain is turned downward and must stay so."
 zin_chr_20115_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20115_short:0 "Erco"
 zin_chr_20115_sub:0 "East Lands · Realm"
 zin_chr_20115_title:0 "Erco"
 zin_chr_20115_x1_p1:0 "Its mountains were the iron height of the Kalioth Crown, the empire the mountain kings proclaimed in about 1A 1000 as Rhabtarkia, the Greater Bridge Kingdom, swearing to rejoin the shores; its kings ruled mine-folk, desert tribes and the pass-houses from walled upland cities, paid Volgan the Black Tribute and held the downs of Herez and Noleksun for him for about a century."
 zin_chr_20115_x1_p2:0 "The mine-lords would neither wear the king's iron diadem nor melt it; they walled it up in the hall of Barzoth, and every Rhanid king swears at his crowning to keep the seven forts and to pay what the mountain asks. No miner may strike the wall in Barzoth's hall."
 zin_chr_20116_p1:0 "Long before Aen the southern valley under the Plutondo Vents was a field of grey ash where nothing was planted, and the valley people say their forefathers were the first who dared to plough it.\n\nThey tell that the vents are the breath of whatever sleeps beneath the East, the same breath the salt-boilers feel under the Hot Lake, and that the ash it breathes out is a gift that must not be refused; the temples deny that anything sleeps there, and the valley has never cared which telling is true as long as the grain grows. In the First Age the valley became the granary of the Kalioth Crown."
 zin_chr_20116_p2:0 "The mountain kings took its harvests in their barges for the iron height and rented the valley their iron ploughshares, which they took back every autumn so that the valley could never forge itself weapons. The valley people learned to chip ploughshares from the black glass of the vents, which no king could count or take back."
 zin_chr_20116_p3:0 "When the Kalioth host died at Dardan, the valley lords sent their grain to the mine-lords besieging the last king and not to the king, and the iron height starved: the barges that had fed the Crown fed its fall. From that comes the princedom's character, proud of its ash and obliged to no lord for its iron, and at its worst in debt, because the princes have always paid in grain while others kept the ledgers.\n\nThe Vent Year of 4A 1590 put the valley in Stabilo's books, and the princes resent the caravan houses that fed them more than the vents that starved them."
 zin_chr_20116_p4:0 "A black glass ploughshare, point downward, edged in ember red, on ash grey. The glass share is the one the valley folk chipped from the vents when the Kalioth kings took back their iron every autumn; the oldest of them hangs in the princes' hall at Vobibiz, too brittle to plough with, beside the barge-hook of the first valley lord.\n\nThe valley lords bore it when they chose their first prince in 2A 377 to treat with Erco for the water, and the princes fly it at the head of the Gold Road, where every caravan takes on its first loads of ore and grain."
 zin_chr_20116_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20116_short:0 "Plutondo"
 zin_chr_20116_sub:0 "East Lands · Realm"
 zin_chr_20116_title:0 "Plutondo"
 zin_chr_20117_p1:0 "The highland clans of the north-east lakes call themselves the cedar-folk, and their songs say that long before Aen their forefathers cut the cedar that the Bridge Kingdom carried west over the neck, so that the halls of the far western march were roofed with highland wood."
 zin_chr_20117_p2:0 "When the bridge broke the cedar had nowhere to go, and the clans turned their axes on each other: for ages the lords of Ernois, Grova and Nethnu fought for the lakes, the cedar and the hot springs between them. What held the highlands together was the shrine on the water at Ohitus, where the lake-readers read the steam that rises from the lakes on cold mornings and say what the lakes want."
 zin_chr_20117_p3:0 "The lake-readers keep three laws that every clan obeys: no blood is shed within sight of the shrine; no cedar is cut that the lake-readers have not marked; and whoever brings a light onto the water in the dark is under the lake's protection until morning.\n\nIn 3A 515 the lake-readers shamed the warring lords by floating a closed lantern on the water at night and declaring that the lord on whose shore it came to rest would be king, so that the shrine would always be in a king's keeping. It drifted to Ohitus."
 zin_chr_20117_p4:0 "The counts of the three old lordships still carry the king's lantern at the Lantern Float in memory of that night, and Ostoroth took the Reckoning of the Twelve from the western charts in 3A 990 so that its cedar merchants could keep one calendar with the halls their forefathers once roofed.\n\nA closed cedar lantern with a peaked roof and four pale panes, hung from a ring, in lantern gold on deep pine green. The lantern is the one the lake-readers floated at Ohitus in 3A 515, which the Ostorides keep in the shrine; it is closed on every side, because an open flame on the lake breaks the lake-readers' law."
 zin_chr_20117_p5:0 "The counts of Ernois, Grova and Nethnu carry it at the Lantern Float every year, and the kingdom's companies have marched under it since the Lakeshore Quarrel of 4A 1477, when the lake-readers forbade the king to fight under any sign that could be mistaken for a single lord's."
 zin_chr_20117_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20117_short:0 "Ostoroth"
 zin_chr_20117_sub:0 "East Lands · Realm"
 zin_chr_20117_title:0 "Ostoroth"
 zin_chr_20118_p1:0 "The lake towns of the Hot Lake's east shore are the people who stayed. Their Lake Litany remembers that long before Aen the lake was cool and full of fish, and that in the years of the Breaking it grew hot and steamed and everything in it died but the steam-eels, which live where nothing else can. The shore-folk who did not flee lived on the eels and on the salt the hot water left in the pans, and they learned two things that still govern them."
 zin_chr_20118_p2:0 "The lake must not be woken, so nobody beats a drum, rings a bell or shouts on the water, and the Litany is sung low. And merchants and fishers must pray together at the water, because in the starving years the fishers fed the shore and the merchants carried its salt away to buy grain. The salt-boilers say that something under the lake breathes; the shore-folk have never asked what it is."
 zin_chr_20118_p3:0 "The towns lived under highland lords until 3A 802, when the fishers and grain-farmers of Gonnois bought their lord's rights with three years of harvests rather than fight him, and Mora has been the only realm of the East that was bought rather than won.\n\nIts council has met in the fish-hall of Gonnois ever since, its grain feeds every host that has ever crossed the East, and the Year of Steam of 4A 1655, when the lake boiled over the eastern pans and killed the eels and the pan-workers alike, is remembered in the Litany as the year the lake turned over in its sleep."
 zin_chr_20118_p4:0 "A white steam-eel rising in an S-curve with its head raised, on deep lake teal. The eel is the lake-steam eel, the only fish that lives in the hottest water, which kept the shore-folk alive in the years when the lake turned hot. The lake towns carved it over the door of the fish-hall of Gonnois when the council first met there after the Purchase of 3A 802, and the Speaker wears an eel-skin girdle as the sign of office.\n\nWhen the eels died in the Year of Steam, the council flew its banner reversed for a season and raised it the right way only when the first eels were netted again."
 zin_chr_20118_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20118_short:0 "Mora"
 zin_chr_20118_sub:0 "East Lands · Realm"
 zin_chr_20118_title:0 "Mora"
 zin_chr_20119_p1:0 "The horse-lords of the grasslands are the keepers of the eastern gate. The horse-lords say the herds of the fair descend from the last horses that came back over the bridge before the sea came in, the Gate-Horses, whose line is kept apart and never sold beyond the rift.\n\nFor two ages the horse-lords kept Alerhia's war-horses and fought under the river crown, until the War of the Two Floods left the Furanides unable to pay them, and in 2A 1488 they swore at the fair among the pillars to keep their horses and their grass for themselves."
 zin_chr_20119_p2:0 "Their law is the fair's law: a horse is sold only among the pillars and under the eyes of the fair; a Gate-Horse is never sold at all; and a king of Delbiz is the master of the fair before he is anything else. The Great Murrain of 4A 1622 killed two in three of the herds and spared the Gate-Horses, which the horse-lords took as proof that the old line is watched over, and the caravan houses that lent after the Murrain still expect to be repaid in horses."
 zin_chr_20119_p3:0 "A broken column whose capital is a horse's head, in pillar white on grass green. Among the fallen pillars of the fair one column stands to half its height, and its fallen capital, a horse's head carved in a manner no mason of Delbiz knows, lies in the grass at its foot. The first fair-king took his oath on that capital at the Horse-Fair Oath of 2A 1488, and the horse-lords sewed the broken column with its horse-head on the oath's banner."
 zin_chr_20119_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20119_short:0 "Delbiz"
 zin_chr_20119_sub:0 "East Lands · Realm"
 zin_chr_20119_title:0 "Delbiz"
 zin_chr_20119_x1_p1:0 "Long before Aen the coast where Furtonlin stands was the eastern end of Qadurum, the city on the bridge, and the grass round it was where the Bridge Kingdom bred the horses it carried west; the riders of the Middle Lands and the horse-lords of Delbiz share a memory of horses that crossed the neck. When the bridge broke, Qadurum broke in two and its eastern half fell among the grass, and its pillars still stand where the horse-fair is held.\n\nThe Fosocides keep it on a green field; it is the one sign of the East that was cut from Qadurum itself."
 zin_chr_20120_p1:0 "Osrale was founded by people who were carrying their home with them. When Aenor fell to the Necromancer in 2A 2133, a column of Aenoran families who would not live under him came east by the Lake Road with what they could carry, and among what they carried were jars of water drawn from the rivers of the Vale on the day they left."
 zin_chr_20120_p2:0 "In 3A 31 they and the Alerhic lake traders who sheltered them built a walled market where the Lake Road would later cross the Gold Road; before they built the walls they dug the cistern and poured the Vale's water into it, swearing that the city would stand on Aenor's water until Aenor was free and its children could carry the water home. The Necromancer ruled Aenor for twelve centuries and the water was never carried back, but the oath shaped the city."
 zin_chr_20120_p3:0 "Osrale keeps the Reckoning of the Twelve the exiles brought; its families keep Aenoran given names beside Alerhic surnames; every Lantern-Warden takes office by drinking from the cistern; and a stranger who comes from the west in need may drink there before he is asked his name."
 zin_chr_20120_p4:0 "After Aenor's restoration the city stayed, because by then it was home, but the market council still sends one jar of cistern water west with every caravan that goes to Parim, and the families follow the news from Parim more closely than any other house in the East. Kersian's freedom under the Peace of Cereosa is the work of two powers that distrust each other, and the city knows its heart lies west of both."
 zin_chr_20120_p5:0 "A tall two-handled water jar with its mouth sealed, in Vale blue on cistern white. The jar is the shape of the clay jars the exiles carried out of the Vale; one of them, cracked and mended with bronze, stands in the cistern-house of Osrale beside the steps the first families cut down to the water. The market council has borne the jar since the Exiles' Market of 3A 31, and at the Lantern Peace of 4A 1480 the treaty lantern was floated from the jar's own steps.\n\nThe jar is always shown sealed, because the water inside it belongs to the Vale until it is carried home."
 zin_chr_20120_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20120_short:0 "Kersian"
 zin_chr_20120_sub:0 "East Lands · Realm"
 zin_chr_20120_title:0 "Kersian"
 zin_chr_20121_p1:0 "Cereosa stands where the old roads of the East cross, and the junction is older than the city by three ages. In the First Age the Kalioth Crown's tax-masters met the desert tribes and the lake traders at the crossing to take the empire's tolls, and the place was so feared that the tribes called it the Knife-Ground: every quarrel over a weight ended in blood, and the Kalioth took the dead men's goods as well."
 zin_chr_20121_p2:0 "After the Crown fell, the crossing was a place where nobody would camp for ages, and caravans that met there fought. When Stabilic weighers built an inn and weigh-house at the junction in 4A 688, they made one rule before any other: every man who came in at the gate had his blade tied into its sheath with a white cord by the gate-weigher, and anyone who cut the cord inside the walls was weighed against his goods and lost them.\n\nThe caravans of every road began to settle their weights there, because it was the one place in the East where nobody could draw."
 zin_chr_20121_p3:0 "The weighers' council that governs the city is still the council of the gate: the First Weigher is chosen each year from among the weighers who have tied the most cords without a single cut; a contract signed in Cereosa is honoured on every road; and when the Peace of Cereosa made the city free in 4A 1394, it was signed in the weighers' hall by envoys of Noris and Stabilo who both wore tied blades.\n\nA sheathed sword with its hilt upward, the hilt bound to the sheath with a white cord, on caravan red. The tied blade is the gate-weighers' rule made into a banner."
 zin_chr_20121_p4:0 "The first weighers of Cereosa hung a tied sword over the inn gate in 4A 688 so that every caravan could see the rule before it came in, and when the city became free in 4A 1394 the weighers' council took the same sword for its banner and swore that the cord on it would be cut only if Cereosa itself were attacked. The cord has never been cut."
 zin_chr_20121_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20121_short:0 "Mostok"
 zin_chr_20121_sub:0 "East Lands · Realm"
 zin_chr_20121_title:0 "Mostok"
 zin_chr_20122_p1:0 "House Azano's ancestry goes back further than its charter by three ages, and the house tells it to every new debtor. The Azani were paymasters of the Kalioth Crown, tally-lords who kept the empire's debts with its mine-lords, its pass-houses and its suppliers, and they were the only servants of the Crown spared when the mine-lords overthrew the last king in 2A 12, because they held the tallies of what everyone owed and nobody wished them burned."
 zin_chr_20122_p2:0 "The last king owed the Azani the price of a whole season's grain for his besieged hall; he died without paying, and the house kept its half of the tally as proof that even a crown can owe. From that half-tally comes the house's creed: every debt is real until it is paid, a debt outlives the debtor, and a family that holds the right ledgers outlives kings.\n\nFor three ages the house lent quietly to the river crowns and the bronze towns, and in 4A 1033 it bought the charter of Ceralon outright from the bench of houses, which let the town go because the house paid in gold and because half the bench owed it money."
 zin_chr_20122_p3:0 "The Ledger Feud with House Prudo and the Silk Wager of 4A 1688 are told in the house as lessons in the same creed: the feud ended in a marriage because a dead rival cannot repay, and the wager was won because the house knew which silk merchants of the South Lands owed it most. Mylana Azano's ledgers record loans to half the courts of the East."
 zin_chr_20122_p4:0 "Two halves of a split tally-stick side by side, notched along their edges, in bronze gold on dark wine red. The split tally is the stick of the last Kalioth king's debt, a notched rod of black wood split lengthwise so that the creditor and the debtor each kept one half. The king's half was lost when his hall was walled up; the house's half lies in the counting-room of the bronze-roofed house over Ceralon's market.\n\nSince the charter of 4A 1033 the house has flown both halves together, the paid and the unpaid, and an Azano loan is still sealed by splitting a stick."
 zin_chr_20122_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20122_short:0 "Azano"
 zin_chr_20122_sub:0 "East Lands · Realm"
 zin_chr_20122_title:0 "Azano"
 zin_chr_20123_p1:0 "Kerdoco is a city of the caravan princes that the jungle has taught. The jungle edge was the end of the Kalioth Crown's fever road: the mountain kings sent condemned men south to cut hardwood for their siege engines, and those who lived through three wet seasons were set free, because the Crown reckoned that a man the fever had not killed would not soon die of anything else."
 zin_chr_20123_p2:0 "The freed men stayed at the jungle edge and learned from it; their descendants were the timber-cutters the Stabilic factors hired when they set up their camp in 4A 912, and it was they who showed the factors how to tap the gum that seals casks and seams. The jungle's oldest lesson came in 4A 1319, when a fever out of the wet season killed half of Kerdoco."
 zin_chr_20123_p3:0 "The old cutters noticed that the hornbills had left the low trees and were nesting on the ridge, and the families who followed them upslope lived. The factors moved the whole town to the higher ground where it now stands, and the rule has been law since: build where the hornbill nests, cut no tree where a hornbill nests, and never stay in the low ground through the wet.\n\nThe factors' council keeps the Ledger Count like its old houses, but the town's oldest families still count their years by the wet seasons they have survived, as the freed men of the fever road did, and the gum Kerdoco sells to Drak for its powder casks has made it rich on the Stabilo Pact's war-trade."
 zin_chr_20123_p4:0 "A black hornbill with a great curved casque, wings closed, on gum amber. The hornbill is the bird the old cutters followed upslope in the fever of 4A 1319, and the factors took it for the town's banner when they rebuilt Kerdoco on the ridge. Its casque is carved on the lintel of every house built since, and a hornbill's nest found in a felling ground closes the ground for a season.\n\nThe town's companies of cutters and gum-tappers carry it on amber cloth, the colour of the jungle gum that made Kerdoco rich."
 zin_chr_20123_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20123_short:0 "Obmi"
 zin_chr_20123_sub:0 "East Lands · Realm"
 zin_chr_20123_title:0 "Obmi"
 zin_chr_20124_p1:0 "Nerhuus was built on an old road by people who did not know whose road it was. The mountain road below Mount Ergo was the southern road of the Kalioth Crown, which ran from the iron height through the Smoking Teeth to the Crown's south-eastern provinces, and the Alerhic chronicles say that the Kalioth kings, allies of Volgan, paid the devils of the mountain to let their merchant fleets pass and to fall on those who did not pay.\n\nThe caravan factors who built a waystation by the mountain's springs in 4A 713 knew the mountain smoked and did not know what lived on it."
 zin_chr_20124_p2:0 "In 4A 744 a whole caravan vanished on the mountain road and the searchers found only its scales, laid out in a row on a scorched stone; the next year the wardens carried a tithe of gold and goods up to the stone, and no caravan was taken. Without knowing it, Nerhuus had taken up the Kalioth payment where the Kalioth left it."
 zin_chr_20124_p3:0 "The life of the city follows from the stone: the tithe-wardens are its government; it trades with everyone because it cannot afford an enemy; and since the Unpaid Year of 4A 1502, when the council kept the tithe back and the upper town burned, nobody has again proposed that the tithe is a superstition. Whether the tithe does more than keep a custom the devils remember, nobody in Nerhuus can say."
 zin_chr_20124_p4:0 "A balance-scale with its beam snapped and one pan hanging, in ash black on ember orange. The broken scale is the caravan of 4A 744: of all its people, camels and goods the mountain left only the scales, set out in a row on the scorched stone, and the first wardens brought the largest of them down with its beam snapped. It hangs in the wardens' hall of Nerhuus, and every tithe is weighed on a sound scale beside it before it is carried up the mountain.\n\nThe wardens took the broken scale for the city's sign in 4A 745, the year they first paid, so that no warden would forget what an unpaid road weighs."
 zin_chr_20124_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20124_short:0 "Pornivior"
 zin_chr_20124_sub:0 "East Lands · Realm"
 zin_chr_20124_title:0 "Pornivior"
 zin_chr_20125_p1:0 "The sealers of the snow coast are the boat clans who would not sail for Volgan. When the north coast harbours gave him ships in the First Age, the clans of the small boats refused, and rather than see their boats taken they sailed north along the coast into the ice, where the harbour lords could not follow and Volgan's envoys did not care to."
 zin_chr_20125_p2:0 "They wintered on the snow coast with nothing but their boats and harpoons, and their songs say they would have died in the first winter if a great white seal had not shown them the breathing-holes in the ice where the seals come up; they call her the Grandmother Under the Ice, and they believe she still lives under the floe and keeps the seals for those who share.\n\nFrom that winter come the clans' laws: a white seal with dark eyes is never taken; the first seal of every winter is shared among all the boats; and nobody hunts north of the last floe, where the water of the Kusmeel goes black, because the Grandmother does not go there."
 zin_chr_20125_p3:0 "For an age the boat clans fought each other for the seal grounds, until they swore the moot at Pehami in 2A 1720 to share the grounds and settle their quarrels without blood, and chose a Harpoon-Speaker. The clans kept a cold distance from the harbours that had once given Volgan their fleets until the Ice Winter of 4A 1604, when Naamis fed them, and the moot has kept peace with the sea crown since."
 zin_chr_20125_p4:0 "A single harpoon standing upright with a barbed toggle head, in bone white on sea-ice blue. At the moot of Pehami in 2A 1720 each boat clan laid its harpoon on the ice, and the clans agreed that one harpoon, the moot's own, would speak for all of them; the Harpoon-Speaker holds it through the winter and lays it down at the next moot.\n\nIts toggle head of walrus ivory is said to have been cut from the first harpoon thrown on the snow coast, the one that took the seal the Grandmother showed the clans. The moot carries it at the head of the sled columns and lowers it to the ice when it treats with strangers."
 zin_chr_20125_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20125_short:0 "Woqood"
 zin_chr_20125_sub:0 "East Lands · Realm"
 zin_chr_20125_title:0 "Woqood"
 zin_chr_20126_p1:0 "The fishing families of Orato and Fladev are the people of the heights. Their oldest tale is of the Breaking: when the sea came in from the north and the south and the neck broke, the flood ran along the north coast, and the families of the low shore fled onto the heights of the two isles and watched the sea take everything below."
 zin_chr_20126_p2:0 "The watchers on the heights blew horns to call the boats in through the flood, and every boat that heard a horn came home; the families swore on the heights that a horn would always be kept on every headland of the isles and blown whenever the sea brought something new. That oath is the watch of Orato."
 zin_chr_20126_p3:0 "Every night a watcher of each fishing family sits on a headland with a horn and counts the lights on the Kusmeel; the black isles to the north are never fished; and a horn blown on Orato brings every boat of the isle home without a question. The Lords of the Boats are the keepers of the headland horns as much as of the stone harbour of Nodoqood, and an heir is accepted only after the boats have heard him blow the great horn on the northern height."
 zin_chr_20126_p4:0 "In 4A 1744 the watchers blew the horns for ships without lights or oars moving among the black isles, and every boat of Orato came home. The courts of Duum-Saah and Furvior laughed, and the families say this is the first time in their memory that a horn of Orato was blown and nobody beyond the isles came."
 zin_chr_20126_p5:0 "A curved signal horn with its mouth upward and a cord at its waist, in horn white on night blue. The horn is the great horn of the northern height, which the families say was blown in the flood of the Breaking to call the boats home. It is kept in the lord's house at Nodoqood and carried up to the height at the opening of every fishing season.\n\nThe families sewed it on their boat-flags long before there was a lord, and the Lords of the Boats took it for their own when the first of them built the stone harbour in 4A 1150."
 zin_chr_20126_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20126_short:0 "Orato"
 zin_chr_20126_sub:0 "East Lands · Realm"
 zin_chr_20126_title:0 "Orato"
 zin_chr_20127_p1:0 "The pass-houses of the Hardtmuth are older than the Sand Road and remember the price of every water they have sold.\n\nLong before Aen the gorges of the volcanic chain were the only way from the desert to the coast, and the families who lived in them found their paths by following the black ibex of the high rocks, which they never hunt; their oldest tale is that the first path through the Hardtmuth was shown to a gorge-mother by an ibex that came down to drink at her spring, and that whoever follows an ibex does not die of thirst."
 zin_chr_20127_p2:0 "In the First Age the pass-houses sold water and guides to the Kalioth Crown, which claimed their passes, and to the eastern hosts that marched north through them to Volgan's war. After Dardan, when the beaten Kalioth garrisons came back south starving, the pass-houses sold them water too, at a price they could not pay, and many died in the gorges.\n\nThe pass-lords remember both sales and are ashamed of neither: water sold to the going and to the coming alike is the law of the passes, and it is why Miaed sells passage to the higher bidder without asking which way a host is marching."
 zin_chr_20127_p3:0 "The pass-lords keep a dry temple stair at Erdozan though they have no river, because the River Temples faith came south with the Kalioth's subject peoples, and they say their first Lord of the Passes bargained with the mountain and paid it in the first caravan's bells. The pass fires they have lit every dry season since 4A 1240 are a guide for caravans and an offering to the mountain, and the gorge-houses say a fire is lit for the ibex as much as for men."
 zin_chr_20127_p4:0 "A black ibex standing with its long horns swept back, on dust gold. The ibex is the one of the gorge-mother's tale, which showed the first path through the Hardtmuth when it came down to drink, and the pass-houses carved it on the rock at the head of every gorge they guide through.\n\nWhen the pass-houses elected Rhanios of the Upper Gorge the first Lord of the Passes at Erdozan in 4A 664, each pass-fort brought its own rock-cut ibex to the election, and the lords agreed on one banner for the whole chain: the black ibex that knows the way and drinks at nobody's leave."
 zin_chr_20127_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20127_short:0 "Miaed"
 zin_chr_20127_sub:0 "South Lands · Realm"
 zin_chr_20127_title:0 "Miaed"
 zin_chr_20128_p1:0 "The well-clans of the Sun Desert are the people of the dune sea, dark-skinned folk of the desert speech who have lived in the deep south of the mainland since long before Aen, digging where the sand golems allow and moving on when the water fails.\n\nTheir oldest compact is with the golems: the clans say the golems sleep under the dunes guarding the buried wells, that a golem gives a well back to whoever brings it gold and leaves it in peace, and that a golem disturbed closes the dune roads. Their oldest holy tale is of the white dune."
 zin_chr_20128_p2:0 "Long before Aen a clan-mother dying of thirst on the white dune left her last water on the sand for a stranger she had seen at dusk and who never came, and in the morning her clan found a spring at the foot of the dune and a white feather longer than her arm lying beside the water."
 zin_chr_20128_p3:0 "The clans hold that the stranger was one of the angels that are seen only by those who do not ask for them, and from the white dune come their laws: a refugee is given water before he is asked his name; water is left on the white dune every month for nobody; and a clan that poisons a well has poisoned the angels' gift. The War of the Poisoned Wells of 4A 1631 broke that law, killed half the oases and woke the golems.\n\nWhen the surviving clan-mothers met at Biir-Raab in 4A 1637, they swore the Well-Moot over the white feather, with water in their mouths so that nobody could lie, and named their league Wahatud, the people of the oases."
 zin_chr_20128_p4:0 "A single long white feather standing upright, in white on oasis green. The feather is the one the clan-mother's people found beside the spring on the white dune, kept by the clans in turn through the ages and laid in the moot-house at Biir-Raab when the Well-Moot was sworn in 4A 1637.\n\nYarah bat Kersud made every clan swear the moot's oath over it with water in its mouth, and the oasis-folk have sewn it on their water-skins and on their guides' cloaks since; a guide who wears the feather may not refuse a refugee water."
 zin_chr_20128_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20128_short:0 "Wahatud"
 zin_chr_20128_sub:0 "South Lands · Realm"
 zin_chr_20128_title:0 "Wahatud"
 zin_chr_20129_p1:0 "Puvulan is the realm of a power, and its roots are the power's own. Long before Aen, Volgan was the servant of a New God, overcame that god and founded his own dominion; which god, and when, nobody in Aoaz knows.\n\nThe necromantic orders that serve him on the grey plateau teach that Nafeher's gate was the first thing raised on the dust fields, before the orders, before the grave-fields and before any living thing that now serves there; their rolls begin with his name and admit no earlier one, and how the Great Spirit came to hold the plateau is not written in them. The orders' customs grow from the gate."
 zin_chr_20129_p2:0 "The First Age made the gate known beyond the plateau.\n\nThe Kalioth kings paid it the Black Tribute and marched with Volgan to Dardan, his fleets crossed the Sound to take Mirolon in 1A 1150, and demons, devils, orcs, goblins and dragons marched under it. After Dardan Volgan was cast into the Void and Elzon governed in his name; the Necromancer brought his presence back in 2A 1544 and served him until his own death in 3A 1260."
 zin_chr_20129_p3:0 "Since then the Dominion has been rebuilt behind the Veil of Storms, the demon realms have sworn to the gate, and the ring of names has begun to fill again.\n\nThe Gate of Nafeher: a plain upright gateway in bone white standing within a plain ring of bone white, on grave black. The gate is Volgan's own sign, as old as his dominion on the plateau, and it appears on no other banner of Aoaz. The ring round it is the ring of names cut round the gateway, in which every servant of the Dominion is written; on the banners it is shown plain, because the names are spoken in the Rite-Tongue and never sewn."
 zin_chr_20129_p4:0 "The grave hosts carried the gate at the taking of Miherta in 1A 1150 and at Dardan, Elzon's orders carried it through the Second and Third Ages in Volgan's name, and the sworn realms of the Southern Dominion fly their own banners beneath it."
 zin_chr_20129_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20129_short:0 "Puvulan"
 zin_chr_20129_sub:0 "Ember Lands · Realm"
 zin_chr_20129_title:0 "Puvulan"
 zin_chr_20130_p1:0 "Mirolon was a lake-kingdom before it was a watch. Ainic lake-folk founded it on its lake and the peninsula's north shore in 1A 377, their speech became the southern daughter of Old Ainic, and the lake-kings built Miherta's beacon tower to guide boats home across the lake, not to watch the south. In 1A 1150 Volgan crossed the Sound with fleets the storms did not hinder, took Miherta and killed the last lake-king, and Mirolon became the opening of his war on Aenor."
 zin_chr_20130_p2:0 "The survivors went into the Great Swamp and the hills and stayed there for more than five centuries. The swamp years made the wardens: the hidden villages learned to read Volgan's patrols by the herons of the swamp, which rose when strangers came and stood still when the reeds were empty, and the watchers who stood night after night as still as the herons became the first scouts."
 zin_chr_20130_p3:0 "When Volgan's host broke at Dardan and his garrisons starved, the survivors came back out of the swamp, and in 2A 3 the pass-lords and the lake towns chose Hadric of Miherta to watch the south for life. He refused to wear the lake-kings' crown and hung it in the beacon tower instead, and Mirolon has never again trusted a single royal line.\n\nFrom the swamp years and from Hadric come the wardens' laws: every tower keeps a lamp lit toward the south each night; a warden who lets his lamp go out is struck from the rolls; the High Warden is elected for life and may not pass the office to a child; and the crown stays in the beacon tower."
 zin_chr_20130_p4:0 "A grey heron standing upright with its neck drawn back, watchful, in heron grey and white on night blue. The heron is the watcher of the swamp years, the bird whose rising warned the hidden villages of Volgan's patrols and whose stillness told them the reeds were empty.\n\nHadric's scouts sewed it on the reed-cloth they carried out of the Great Swamp after Dardan, and the High Wardens have flown it since 2A 3 over Miherta's beacon tower, where the lake-kings' crown hangs unworn."
 zin_chr_20130_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20130_short:0 "Mirolon"
 zin_chr_20130_sub:0 "Ember Lands · Realm"
 zin_chr_20130_title:0 "Mirolon"
 zin_chr_20131_p1:0 "Khorvrath's lords are older than their realm by more than anyone among men can count. Demons are corrupted angels, immortal Great Folk, and the house that became Khorvrath was one of the houses of the Nether's Halls under the King of Demons, a house of beast-breeders whose great horned beasts drew the lava-sledges of the Halls and carried its lords to war."
 zin_chr_20131_p2:0 "The houses compete for the king's favour and the right to open portals, and Khorvrath's house lost that contest: in the years when portals opened across Aoaz it was refused a portal of its own, and in 2A 977 it came up out of the Nether Maw onto the island's foothills with its thralls and its beasts and would not go back down.\n\nThe first lord rode out of the Maw on the greatest of the house's beasts and broke one of its horns on the rim of the vent, and the house took the broken horn as proof that the way back was closed behind it."
 zin_chr_20131_p3:0 "From the Maw come the horned court's customs: its lords keep a name of two beats for the world and a pact-name for the court; the hall of Khorvazel, cut into the foothills by thralls in 2A 1002, is crowned with the horns of the house's beasts, one for every lord and every great servant who has fallen; and no lord of the house goes back down into the Maw.\n\nThe house fought at the Burning Gate of Nezer and lost its lord when men, elves and Dark Lands soldiers closed it in 2A 1388, and in 4A 1650 it swore to Volgan, trading its freedom from the Nether's houses for a place in his hosts."
 zin_chr_20131_p4:0 "A single great curved horn broken off at its tip, in ember gold on ash black. The broken horn is the horn the first lord broke on the rim of the Nether Maw when the house rode out in 2A 977, and it is set above the horn-seat of Khorvazel."
 zin_chr_20131_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20131_short:0 "Khorvrath"
 zin_chr_20131_sub:0 "Ember Lands · Realm"
 zin_chr_20131_title:0 "Khorvrath"
 zin_chr_20132_p1:0 "The queens of Dolon rule by pact and write their laws in salt, and both customs come from the first of them. The house that became Dolon was a house of the Nether's Halls whose demons dealt in pacts with the living, the bargains that bind a mortal in service, obedience or tribute for life and end with him, because the dead are Zol's."
 zin_chr_20132_p2:0 "In 2A 1120 its queen, whom the old accounts call Khirara, came up out of the Maw with her house onto the salt coast of the island and took the salt pans from the men who worked them; the coast tells that she drowned their headman in his own brine-pan and set on her head a ring of the salt crystals that grew on the pan's rim, which the heat of her body never melted."
 zin_chr_20132_p3:0 "She raised the pact-hall of Unzeky over the brine pans, where the salt and the sulphur of the Maw could both be had, and her house has kept the coast since. From the salt crown come Dolon's laws: an oath of Dolon is written in salt, so that the sea can wash away any oath the queen regrets; the queen wears a crown of salt and is crowned in brine; and a thrall of the salt coast may buy his freedom only with a pact. The forge followed the pans."
 zin_chr_20132_p4:0 "Since 4A 1651 Dolon's galleys have carried salt, sulphur and ash-glass to Nafeher as tribute, and since 4A 1693 the forges of Unzeky have compounded black powder from the coast's salts and the Maw's sulphur and armed Volgan's orc companies with powder-engines and casks. Queen Zhorith keeps the Dominion's forge."
 zin_chr_20132_p5:0 "A crown of jagged white salt crystals, in salt white on obsidian black. The salt crown is the crown of the first queen, the ring of brine crystals she took from the rim of the headman's pan, and the queens of Dolon have been crowned in brine and worn a crown of salt since 2A 1120. The house's banners have shown it since the pact-hall of Unzeky was raised, and the tribute galleys have flown it beneath the Gate of Nafeher along the Veshir coast since 4A 1651."
 zin_chr_20132_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20132_short:0 "Dolon"
 zin_chr_20132_sub:0 "Ember Lands · Realm"
 zin_chr_20132_title:0 "Dolon"
 zin_chr_20133_p1:0 "The two crowns of Nezer are a family of the Nether's ferrymen. In the Halls under Mount Nether their house kept the galleys that cross the Sea of Lava, the only ships that can, and its lords and queens were the steersmen of the Halls' trade with the surface. A galley of the lava sea has two steering oars, one at each quarter, and it holds its course only when both steersmen pull together, so the house has always been ruled by two of one blood."
 zin_chr_20133_p2:0 "In the Second Age the Nezer hills were Nazerun, the seat of the Great Necromancer, and the coast of the Sea of Nazerch was his; the house ferried demons to the Burning Gate on the Nezer coast in the years of the portals and lost many when men, elves and Dark Lands soldiers closed the gate in 2A 1388."
 zin_chr_20133_p3:0 "When the Necromancer died in Aenor his seat stood empty and his necromancers scattered, and in 4A 3 a queen and a lord of the ferrymen's house crossed the lava sea with their galleys, took the empty hills and the Nazerch coast, renamed them Nezer in their own speech and began to rule them together from Gelroze."
 zin_chr_20133_p4:0 "From the galley come the crowns' customs: two crowns of one house rule and must agree on war; each crown keeps its own lands so that neither need cross the other's; and the trade with the Nether crosses the Sea of Lava on galleys that only demons sail. The crowns keep the Necromancer's hills and nothing of him, and they guard the broken ring of the Burning Gate on their coast.\n\nNezer swore to Nafeher in 4A 1650, its two crowns agreeing for the first time in a century."
 zin_chr_20133_p5:0 "A black galley with two steering oars at its stern, one at each quarter, in ember gold on nether red. The two-oared galley is the lava galley of the ferrymen's house, the ship that holds its course only when both steersmen pull together. The queen and the lord who took the empty hills in 4A 3 crossed the Sea of Lava under it, and the twin crowns of Gelroze have flown it since; when the crowns disagree, the galley is flown with one oar shipped."
 zin_chr_20133_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20133_short:0 "Nezer"
 zin_chr_20133_sub:0 "Ember Lands · Realm"
 zin_chr_20133_title:0 "Nezer"
 zin_chr_20134_p1:0 "The Nether is the oldest court of the demons in Aoaz and the seat of their king. Demons are corrupted angels, immortal Great Folk, and the houses of the Halls tell that when the first of them came down corrupted they went into the heat beneath the volcanic island ringed by the Sea of Lava, where nothing living could follow, and cut the Halls beneath Mount Nether.\n\nThere they took one of themselves for king, the King of Demons, whose own name is not spoken among men, and they count only the years of their pacts. The court's order comes from the king's seal."
 zin_chr_20134_p2:0 "A pact of the Nether is sealed when the king's seal, a five-pointed figure drawn in one unbroken line within a ring of fire, is burned into the bargain; the pact binds the living who make it, in service, obedience or tribute, and grants them real power in life, and when they die they are Zol's and not the king's, so the Halls take their price in life and nothing after.\n\nThe houses compete for the king's favour and the right to open portals, and the house of the demon Agon is one of the oldest and least obedient."
 zin_chr_20134_p3:0 "In the Second Age portals opened across Aoaz and demons raided Aenor, not all of them at Elzon's bidding; when the Burning Gate on the Nezer coast was closed in 2A 1388 and the houses quarrelled among themselves and with the Necromancer's order, the portals closed one by one, and by 3A 700 the Nether had withdrawn behind the Sea of Lava.\n\nSince 4A 1650 the king has sold companies of demons to Nafeher by bargain, renewed each reign and never sworn, and the Nether Maw is disputed with Volgan's servants."
 zin_chr_20134_p4:0 "The King's seal: a five-pointed figure drawn in one unbroken line within a ring of fire, in pact gold on hall black. The seal is the King of Demons' own sign, burned into every pact the Halls make with the living, and it is the only such figure on any banner of Aoaz.\n\nThe houses of the Halls carry it above their own signs in every company the king sells to Nafeher, and a mortal who bears it burned into his skin is under a pact and may be touched by no house but the king's."
 zin_chr_20134_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20134_short:0 "Nether"
 zin_chr_20134_sub:0 "Ember Lands · Realm"
 zin_chr_20134_title:0 "Nether"
 zin_chr_20135_p1:0 "The salt freeholds of the Veleeda coast are the coast cousins of Mirolon, salt-boilers of the old Ainic tongue who worked the shore while the lake-folk built their kingdom, and their oldest custom is older than their shame. They boiled salt on the shore of Veleeda, the water their own speech calls the Dead's Sea, and they buried their dead in salt so that the sea air would not rot them."
 zin_chr_20135_p2:0 "When Volgan came in 1A 1150 and his necromancers raised the dead of the lake-kingdom into his grave hosts, the freeholders believed they learned what their custom was for, because the dead they had buried quickly, deep and with salt did not rise. In 1A 1180, thirty years into Volgan's war, the coast cousins agreed to pay his tolls in salt and say nothing, and they were left to boil salt while the lake-kingdom burned."
 zin_chr_20135_p3:0 "From that bargain come the freeholds' laws, which every child learns before it can work the pans: the dead are buried quickly and deep, with salt, and the dead man's oar or rake stands over the grave; nobody speaks of Volgan or of Zol at a grave; and a toll is paid to whoever holds the island and nothing more is said."
 zin_chr_20135_p4:0 "For ages the five freeholds of Mirodor, Mencnon, Bennen, Gelon and Dra paid alone and were squeezed alone, until in 4A 1655, when the storms changed and Nafeher's galleys came again, their headmen met at Halon and swore to pay one toll as one league. The freeholds remember the thief who came along their coast going south and came back going north without growing older, but only in their taverns."
 zin_chr_20135_p5:0 "An oar standing upright in a white cairn of salt, in oar brown and salt white on Veleeda grey. The oar in the salt is the freeholds' grave: a fisher of the coast is buried deep and salted with his oar standing over him, and the freeholders believe the necromancers never raised a grave marked so.\n\nWhen the five freeholds swore their league at Halon in 4A 1655, each headman set his family's grave-oar in one heap of salt in the middle of the pans, and the league's banner has shown that oar since. It is the only sign on the peninsula that speaks of the dead, and it speaks of them without a word."
 zin_chr_20135_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20135_short:0 "Halia"
 zin_chr_20135_sub:0 "Ember Lands · Realm"
 zin_chr_20135_title:0 "Halia"
 zin_chr_20136_p1:0 "The hill-folk of the dark Nan Mountains are the men who ran from the gate. When Volgan's power first reached the old coast of the island in the First Age, the men of that coast who would not serve the Dominion took their boats across the storm belt to the southern tip of the peninsula and the isles beyond it, and hid in the mountains where the storms of the Tempest Reach break on the peaks."
 zin_chr_20136_p2:0 "The storms that had nearly drowned them became their wall, and the families who learned to read the weather became the chieftains of the mountains. Their oldest wayfinders found that the storm-petrels, the small dark birds that fly low through the worst weather and seem to walk on the water, always know the gaps in a storm, and the wayfinders of Nan learned the storm-pilots' route through the Tempest Reach by following them."
 zin_chr_20136_p3:0 "For ages the hill chieftains fought each other for every cove, until in 4A 1188 Feron the Grey, a chieftain who had learned the petrels' route, took the fort of Larorun and made the others swear to him as warlord; his chieftains named him for the grey of the storm, not of his hair."
 zin_chr_20136_p4:0 "From the petrels' route come Nan's customs: the warlord is the captain the chieftains will follow and keeps the office only by success; the wayfinders' charts are secret, so that only Nan's pilots can bring a ship to the island and back; and a Nan pilot is sold to whoever pays most, Nafeher included. Almon the Small, a wayfinder from the southern isles, has held Larorun since 4A 1731.\n\nA dark storm-petrel skimming low with its wings bent, in storm black on grey. The petrel is the bird the wayfinders of Nan followed through the Tempest Reach, the bird that knows the gaps in the storm."
 zin_chr_20136_p5:0 "Feron the Grey flew a petrel banner from the mast of the ship that brought him through the storm to take Larorun in 4A 1188, and every warlord since has flown it over the fort; Nan's pilots wear a petrel feather in their caps, and a ship that carries one is under the warlord's protection, whoever has paid for it."
 zin_chr_20136_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20136_short:0 "Nan"
 zin_chr_20136_sub:0 "Ember Lands · Realm"
 zin_chr_20136_title:0 "Nan"
 zin_chr_20137_p1:0 "The isle of Olen was a fishing isle under the storm belt, poor and dark, whose cliff lamps went out every winter when the storms came off the Tempest Reach. In 2A 412 a breeze blew out of the storm belt for a whole winter and kept the lamps lit on the cliffs of the isle while every other light on the coast went out, and the fishers saw sea-kestrels hanging still above the cliffs in that breeze, as if it held them up."
 zin_chr_20137_p2:0 "They built a shrine where the kestrels hung, at Gelbus, and named the isle for the Holy Breeze, and the lamp-keepers of the shrine became the isle's rulers. The fishers believe the breeze came from beyond the storms as a sign that the isle is watched over, and the lamp-keepers do not say who watches."
 zin_chr_20137_p3:0 "From the Holy Breeze come Olen's customs: the cliff lamps are kept lit through every storm; whoever reaches the cliffs out of the storm belt is sheltered and not asked where he came from; and the shrine is never moved from the place the breeze chose. The isle pays its toll to Nafeher like every coast of the peninsula and says nothing, but it has kept its shelter law even against the Dominion's sworn realms."
 zin_chr_20137_p4:0 "In 4A 1712 three hundred thralls of Khorvrath stole boats and crossed Veleeda to Olen, and the lamp-keepers sheltered them and have refused every demand to give them back. The freehold of Luminor on the lamp-cliffs joined the shrine-realm in 4A 1590, and Olen holds the whole line of cliffs on the peninsula's south coast; its lamps are the first lights a ship sees coming out of the storm belt."
 zin_chr_20137_p5:0 "A sea-kestrel hanging still in the air with its wings spread and its tail fanned, in cliff white on storm blue. The hovering kestrel is the bird the fishers saw hanging in the Holy Breeze above the cliffs in the winter of 2A 412, where the shrine of Gelbus was built.\n\nThe lamp-keepers carved it over the shrine door and have flown it from the lamp-cliffs since, and a refugee who reaches the cliffs is given a small cloth kestrel to wear, which every boat of Olen respects."
 zin_chr_20137_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20137_short:0 "Olen"
 zin_chr_20137_sub:0 "Ember Lands · Realm"
 zin_chr_20137_title:0 "Olen"
 zin_chr_20138_p1:0 "The Yonic-speaking seafarers who settled the two arcs long before Aen came from somewhere their oldest songs do not name, and the first thing every canoe did on reaching a new island was to count its dead: each lost crewman was carved as one wave on the reef rock, so that the sea would know whom it had taken."
 zin_chr_20138_p2:0 "The lagoon villages of the Great Isle kept the largest of these tallies, and when a stone shrine on the Great Isle's southern shore came to bear a carved name over its door in the First Age, the tally-keepers read the name as Aen and took it into the tally of the dead without knowing why. In the Year of the Grey Sea, 2A 40, a storm tide drowned the southern shore and the shrine with it."
 zin_chr_20138_p3:0 "The lagoon villages thought the name lost, until the tally-keeper Nuoyo nau Enhis swam down to the drowned shrine with a holed stone tied at his waist to sink him, found the door and the carved name still there, and came up alive; the villages made him the first Priest-Elder, and he founded the Calling of Names beneath the water."
 zin_chr_20138_p4:0 "From the Rising Tide come the realm's customs: the Priest-Elders are chosen from tally-keepers who have made the dive with the stone; every islander may walk the Reef Road to the shrine to bring a name for the tally; and the names are called beneath the tide because, the islanders say, the names are needed, though who needs them they do not say.\n\nThe guest-right of the whole south was sworn again at the drowned shrine after the Fever Years, and since the Year of Ash of 4A 1622 nobody on the Great Isle doubts the Priest-Elders."
 zin_chr_20138_p5:0 "A round grey diving stone with a hole through it, hung on a looped cord, on lagoon turquoise. The diving stone is the holed stone Nuoyo nau Enhis tied at his waist to sink to the drowned shrine after the Rising Tide of 2A 40. It hangs in the shrine-house at Suyowan, every Priest-Elder makes the dive with it before taking office, and its cord is renewed by each new Priest-Elder with his own hands.\n\nThe lagoon villages carry the stone's banner at the head of every pilgrimage on the Reef Road."
 zin_chr_20138_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20138_short:0 "Enhis Is Rond"
 zin_chr_20138_sub:0 "Islands of the South · Realm"
 zin_chr_20138_title:0 "Enhis Is Rond"
 zin_chr_20139_p1:0 "Howan is the house that takes in strangers, and it has paid the price for it. The families who first terraced the banks of the River Tich were canoe-folk of the first Yonic settlement, and they built their moot-house at the river mouth with a saddle roof whose two ends sweep up like canoe prows, so that, they said, the ancestors who came by canoe would know the house from the sea; every terrace family still builds its house that way."
 zin_chr_20139_p2:0 "In 1A 290 the rice families swore to share the Tich's water through one moot of terrace-heads, and the terraces of Howan became the richest fields of the islands. The guest-right of the south was Howan's custom first: the sea at Lamowan throws more ships ashore than anywhere else on the Great Isle, and the terrace families fed and housed every stranger who came out of the surf."
 zin_chr_20139_p3:0 "In the Year of the Black Rain, 2A 1210, a wrecked ship brought plague to Howan, and for two years the islands turned strangers back into the sea. Maiyan nau Lamowan, a terrace-head who had lost her family to the plague, argued in the moot against it, and in 2A 1214 the moot built the house for the shipwrecked at Lamowan, where every stranger is fed, housed and kept apart for a month before he is made welcome.\n\nFrom the Fever Years come Howan's customs: the house for the shipwrecked is never closed; the month apart is never shortened; and a stranger who has finished his month is a guest of every terrace on the island."
 zin_chr_20139_p4:0 "A house on stilts with a saddle-backed roof whose two ends sweep up like canoe prows, in rice-straw gold on deep terrace green. The upswept house is the house for the shipwrecked at Lamowan, built in 2A 1214 in the old manner of the terrace families, its roof-ends raised so that the ancestors who came by canoe would know it from the sea.\n\nThe moot has flown it over the river mouth since the house was built, and its outline is carved on the prow of every Howan canoe, so that a wrecked stranger who sees one knows where he will be taken."
 zin_chr_20139_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20139_short:0 "Howan"
 zin_chr_20139_sub:0 "Islands of the South · Realm"
 zin_chr_20139_title:0 "Howan"
 zin_chr_20140_p1:0 "The timber clans of the Great Isle's west say the first Yonic canoes came ashore in the mangroves, and that the canoe-builders who stayed in the west learned there the two crafts that made them who they are. The first was the trees: the clans hold that every hull carries the spirit of the tree it was cut from, so a tree is asked before it is felled, and a hull is only as true as its tree was willing."
 zin_chr_20140_p2:0 "The second was the stars: the men who knew which tree would make a hull learned which star would bring it home, and Verde's navigators became the wayfinders of the south. The mangroves on their arched roots, which stand in the sea and hold the land together against the storms, were the first trees the clans asked, and the clans say the mangroves taught them to stand in two worlds."
 zin_chr_20140_p3:0 "In 1A 650 the timber clans built their clan hall at Pelo Tamo and chose a chief to deal with the lagoon villages for them, and the hall's oldest law is that a chief must have sailed to the edge of the islands' charts before he may be chosen."
 zin_chr_20140_p4:0 "The Isle Houses of Aenor Isle came for hull-timber in 3A 1187 and have never stopped; the navigators sailed the Ihuy Seas to the Sunhot isles and back in one season in 4A 1410; and when a dry year set the Verde Mangroves alight for a month in 4A 1690, the clans replanted them under the hall's law, and no Verdean has cut a mangrove without the chief's leave since.\n\nA mangrove tree standing on its arched stilt-roots, in leaf green and root brown on sea blue. The mangrove is the first tree the clans asked, the tree that stands in the sea and holds the land."
 zin_chr_20140_p5:0 "The clan hall at Pelo Tamo was raised on mangrove stilts and its banner showed a mangrove when the first chief was chosen in 1A 650; since the Mangrove Fire of 4A 1690 the clans sew it on the sail of every canoe that goes out to replant, and a Verdean navigator in a foreign crew wears it on his sleeve."
 zin_chr_20140_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20140_short:0 "Verde"
 zin_chr_20140_sub:0 "Islands of the South · Realm"
 zin_chr_20140_title:0 "Verde"
 zin_chr_20141_p1:0 "The fishers of the long island Ancha have one law older than their moot, and they obey it more strictly than any other people of the south. Their tales say that the first canoes that came to Ancha fished the great reef off its north-east coast by night, by torchlight, as the Yonic folk fished everywhere, and that the reef took them."
 zin_chr_20141_p2:0 "In 1A 800 a storm year drowned half the island's boats on the reef in one night, and the survivors met at Riwang, swore to fish the reef only by day and to bring every boat home before dark, and became a moot of elders; the eldest speaks for the island and counts the boats back each evening. The elders call the boats in at dusk with a conch blown from the moot-house, and a boat that has not answered the conch by the time the sun touches the water is mourned."
 zin_chr_20141_p3:0 "In 2A 1420 fishers caught on the reef at night came home saying that drowned voices had called them onto the rocks, and the moot added the voices to the Day Rule; nobody of Nara has crossed the reef after dark for any reason since.\n\nThe island's customs come from the reef: the conch is the elders' voice; a fisher's first catch of the year is given to the families of the drowned; and a shipwrecked stranger is taken in as everywhere in the islands, as the survivors of the Aenoran refugee ship wrecked on the Night Reef in 3A 1040 were taken in. Their grandchildren still speak a few Aenoran words in Riwang."
 zin_chr_20141_p4:0 "A fishing torch turned head downward and unlit, in torch-wood brown on dusk violet. The quenched torch is the oath of the Day Rule. When the survivors of the storm year of 1A 800 met at Riwang, each drove his night-fishing torch head down into the wet sand of the beach and left it there unlit, and swore to fish the reef only by day; the torches stood on the beach until they rotted, and the moot cut the first of them into the post of its moot-house."
 zin_chr_20141_p5:0 "Since then a Naran fisher's first boat is given a torch that is never lit, and the moot's banner, raised at dusk when the elders blow the conch to call the boats in, shows the torch turned down."
 zin_chr_20141_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20141_short:0 "Nara"
 zin_chr_20141_sub:0 "Islands of the South · Realm"
 zin_chr_20141_title:0 "Nara"
 zin_chr_20142_p1:0 "All the villages round the Yong lagoon carry the same name because, their elders say, they are all the children of one weaver. In their telling, long before Aen a canoe-builder named Yong came to the lagoon with his household and wove the first cane fish-trap in its shallows; his children each set their traps in a different reach of the lagoon and founded a village there, every village since has been Yong, and every trap is woven to his pattern."
 zin_chr_20142_p2:0 "Villages of one name quarrel as only kin can, and for most of their history the Yong villages fought each other over the reaches where the traps were set. In 4A 899, the Year of the Red Wind, a quarrel over fish-traps burned three of the villages and the lagoon went unfished for a season.\n\nIn 4A 902 the survivors swore a ring-council of the Yong elders on the shrine stone of Yongrost, so that the lagoon would never again be divided by fire, and the isles of Jingar and Torsor joined it in the same year."
 zin_chr_20142_p3:0 "From Yong's trap and the burning come the ring's customs: every village keeps one trap that belongs to the ring and not to itself; the council speaks only when every elder agrees; and a quarrel over a reach is settled by weaving, not fighting, because the village whose trap catches more in a set season wins the reach. The ring carves shell, makes the islands' rope and nets and cuts shrine stone on Yongrost, and it fears its own feuds more than any foreign fleet."
 zin_chr_20142_p4:0 "A woven cane fish-trap, long and conical, with its mouth upward, in cane gold on lagoon green. The trap is Yong's trap, the first fish-trap of the lagoon, woven to the pattern every Yong village still uses.\n\nAt the swearing of the ring-council in 4A 902 each village brought one trap to the shrine stone of Yongrost and the elders wove them together into one, which hangs in the council house at Yongwa; the ring's banner shows the single trap that all the villages share."
 zin_chr_20142_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20142_short:0 "Yongyong"
 zin_chr_20142_sub:0 "Islands of the South · Realm"
 zin_chr_20142_title:0 "Yongyong"
 zin_chr_20143_p1:0 "The deep isle has the oldest tally-caves of the south, and its elders say the caves were marked before the first wave was counted. In their telling, the first Yonic canoe-folk to reach the arcs long before Aen came ashore on the deep isle, and before they counted any of their dead they went into the caves above the shore, laid each a hand on the rock and blew red ochre over it, so that the cave would know who had come.\n\nThe hand-marks of the first comers are still on the walls of the deepest cave, older than any wave of the tally, and every wave carved since is carved below them."
 zin_chr_20143_p2:0 "From the hand-marks come the island's customs: a tally-keeper is made by laying a hand on the cave wall beside the first hands and blowing ochre over it; the caves are entered only at evening, so the elders live at Bukonyo above them and walk down every night; and the names of the dead are counted as waves on the walls and called at the Calling of Names."
 zin_chr_20143_p3:0 "In the Fever Years of 2A 1211 the elders cut the names of the plague dead into the deepest cave, which the islanders say is cold because of how many names it holds. Since 4A 640 the caves have been the school of the Wave-Tally, where the tally-keepers of every island learn the oldest names, and the other islands send their keepers to Kamu Lamo to lay their hands beside the first."
 zin_chr_20143_p4:0 "A left hand with its fingers spread, left the dark colour of the rock inside a ragged cloud of blown red ochre, on cave black. The hand is the hand-mark of the first comers, blown in ochre on the wall of the deepest tally-cave before the first wave of the tally was carved.\n\nEvery tally-keeper of the south adds a hand beside the first hands at the school of the Wave-Tally, and since the school opened in 4A 640 the elders of Kamu Lamo have flown the ochre-blown hand at the mouth of the caves, so that keepers coming by sea know where to land."
 zin_chr_20143_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20143_short:0 "Kamu Lamo"
 zin_chr_20143_sub:0 "Islands of the South · Realm"
 zin_chr_20143_title:0 "Kamu Lamo"
 zin_chr_20144_p1:0 "The terraced isles of the south-western chain have little water and the oldest water law of the south. Their tales say that long before Aen the first terrace families of Kea, Agla and the Rice Islands carried with them from the first canoes a block of hard wood cut with two channels, a divider that splits one stream into two equal streams, and set it at the head of the first terrace so that the water would fall equally to every field below."
 zin_chr_20144_p2:0 "Every terrace of the chain has had a divider since, and the families hold that a field that takes more than its share from the divider steals from the dead who cut the terraces. In the Year of the Dry Wind, 1A 960, the terrace families of all three isles swore to share their water by council rather than by war and dug the cisterns of Tuwang, and the council chooses a Water-Keeper each dry season to hold the great divider of the cisterns."
 zin_chr_20144_p3:0 "From the divider come the council's customs and its fame. After the Fever Years left the Great Isle's terraces untended, the council sent its rice to every island, and since 2A 1213 no island of the south lets another go hungry. When Agla accused Kea of taking more than its share of the cisterns in 4A 1480, the council sent the quarrel to the elders of the tally-caves, who ruled for Agla, and Kea paid in rice, as the divider's law demands."
 zin_chr_20144_p4:0 "A forked water-channel splitting one stream into two equal streams, in water silver on terrace brown. The forked channel is the divider of the first terrace, the block that splits one stream into two equal streams. The great divider of the Tuwang cisterns, held by the Water-Keeper, was cut to its pattern when the Water Oath was sworn in 1A 960, and the council's banner, raised over the cisterns in every dry season, shows the water dividing."
 zin_chr_20144_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20144_short:0 "Kea"
 zin_chr_20144_sub:0 "Islands of the South · Realm"
 zin_chr_20144_title:0 "Kea"
 zin_chr_20145_p1:0 "The islets at the end of the western arc are the first land of the south that the storms reach and the last that help reaches. Long before Aen, the drummers of Yumbo say, the families of the islets learned to hollow a log into a slit-drum whose voice carries further over water than a man can shout, and used it to call each other across the channels when the storms closed the sea."
 zin_chr_20145_p2:0 "In the Year of the Long Wind, 2A 300, a storm cut the islets off from the Great Isle for a whole season, and the families chose one elder to speak for all of them; the drummers of Yumbo beat his first summons from islet to islet, and every elder of Sidea since has held office only as long as the drummers will beat his summons.\n\nIn 3A 700 the drummers learned to beat messages faster than a canoe can sail, and the drum road was born: a storm seen first from the western islets is beaten from drum to drum to the Great Isle before it arrives."
 zin_chr_20145_p3:0 "From the drums come Sidea's customs: the drummers' consent is the elder's authority; every islet keeps a drum that is never beaten except for the islands; and since the storm year of 4A 1550, when the islets' canoes sank in one night and the three realms of the Great Isle rebuilt them under the guest-right, Sidea has sent its first catch of every year to the drowned shrine. It is the first land of the islands that a ship blown south from the West sees."
 zin_chr_20145_p4:0 "An upright slit-drum hollowed from a log, its long slit facing outward, in drum-wood brown on storm grey. The slit-drum is the drum of Yumbo that beat the first elder's summons in 2A 300 and the first warning of the drum road in 3A 700. It stands under its own roof at Yumbo and is carried to the harbour of Ponwan when the elder calls the islets together, and the islets' banner has shown it since the drummers made the first elder."
 zin_chr_20145_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20145_short:0 "Sidea"
 zin_chr_20145_sub:0 "Islands of the South · Realm"
 zin_chr_20145_title:0 "Sidea"
 zin_chr_20146_p1:0 "The Gala keep the oldest court of Aoaz and will not say where it began. What they do tell, and tell every guest, is the First Rain: the court's memory begins on a dry shore under the dormant volcanoes, where a rain fell such as that shore had never had, and where it soaked into the rock a spring rose in a courtyard of stone."
 zin_chr_20146_p2:0 "A white hind came down to drink from it first and did not flee from the people who found her there, and the court has kept the spring ever since as the Mirror of First Rain, whose still water shows true traces of the past and possible futures. Whether the Gala came to that shore from elsewhere, and whether they are kin to the Sunhot, are questions the court answers with silence."
 zin_chr_20146_p3:0 "From the Mirror come the Gala's customs: lineages are remembered by the keepers of the Mirror and not by dates; no Gala hunts a deer; and a vision shown too plainly is not spoken aloud, because the keepers hold that a prophecy said plainly makes people do what it shows. The Gala are the most powerful of the elves, and their long memory has made them slow to anger and slower to forgive."
 zin_chr_20146_p4:0 "Lorien led their host to Dardan at the call of Edran's Grand Alliance and saved a collapsing flank, then watched Edran spend his elves in the Ember Lands against his advice. The Garden of the Dead at Sodoli and the Refusal of 2A 2121 grew from that grief, and the court still distrusts every king who turns a victory into a crown."
 zin_chr_20146_p5:0 "A white hind with her head lowered to drink, on deep harbour blue. The hind is the white hind of the First Rain, which drank first from the spring at Sodoli and did not flee; the keepers say the spring is hers and the court only keeps it. Lorien's host carried her to Dardan on blue silk, and the captains of the Alliance who saw the late banner come over the ridge called the Gala the hind's host.\n\nSince the Garden of the Dead was planted in 2A 9, the banner has gone beyond the Lands of the Sun only once, to the Refusal, where Gala's envoy laid it on the table folded."
 zin_chr_20146_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20146_short:0 "Gala"
 zin_chr_20146_sub:0 "Lands of the Sun · Realm"
 zin_chr_20146_title:0 "Gala"
 zin_chr_20147_p1:0 "The Sunhot of the eastern lowland tell that their tallness is the sun's gift and their sanctuaries the sun's houses. Long before Aen, by their telling, the first Sunhot built their sanctuaries with one tall door facing noon, so that on the longest day the sun would stand in the doorway and light the floor of the sun court to its back wall."
 zin_chr_20147_p2:0 "The door of the oldest sanctuary, at Eldoga, is called the noon-door, and the Sunhot hold that the Lands of the Sun are the nearest earthly place to the realm of the gods because the noon light falls straight through them. From the noon-door come the customs of the Light: a sanctuary's door is never closed in daylight; a guest who comes through it at noon may not be refused; and a quarrel is judged at noon in the sun court, where nothing can hide in shadow."
 zin_chr_20147_p3:0 "The Sunhot were many then and are fewer now, and their sanctuaries have emptied slowly over the ages while their fields filled with Sunfolk guests. In 1A 840 a drought shrank Sun Lake to its shallows and threatened every sanctuary at once; the Speakers met at Eldoga and chose one of themselves as Radiant Speaker to share the water out at noon in the sun court, so that every sanctuary could watch the shares measured.\n\nThey found they preferred to keep her, and the Radiant Speaker has chaired the sanctuaries ever since, and the Noon Council since 4A 88, from the hall behind the noon-door."
 zin_chr_20147_p4:0 "A tall narrow doorway with the noon sun standing in it as a plain gold disc, on sanctuary white. The noon-door of Eldoga, in which the sun stands on the longest day, is the oldest sign of the Sunhot and the one sun among the banners of the Lands of the Sun. The Speakers carried it to the drought council of 1A 840, the Radiant Speaker has sat beneath it since, and the Noon Council has met on the longest day in the sun court it lights since 4A 88.\n\nThe Lands of Light sew the door tall and narrow, because Sunhot doors are made for a people over three metres tall."
 zin_chr_20147_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20147_short:0 "The Lands of Light"
 zin_chr_20147_sub:0 "Lands of the Sun · Realm"
 zin_chr_20147_title:0 "The Lands of Light"
 zin_chr_20148_p1:0 "The sanctuary on the Cape of Elvana was a house of healers long before it was a realm, and its elves say their craft came from the silk-moth. In their telling, long before Aen the healers of the cape found that the thread a white moth of the cape spins about itself would close a wound and leave no fever behind, and they learned to keep the moths, unwind the thread and weave with it."
 zin_chr_20148_p2:0 "From that they became both the weavers and the healers of the Sunhot: the same hands that stitch a wound weave the bright silks the Sunhot wear, and the healers of the cape say a wound is a torn cloth and must be mended with the same patience."
 zin_chr_20148_p3:0 "The moths are kept in the sanctuary of Googavis, which looks over both the cape shore and the Elvini shore so that its healers could serve the shrines of both; a moth is never killed for its thread before it has flown, and no Elvanan weaver sells a cloth she has not first offered to the sick. In 2A 640 the sanctuary chose its own Speaker rather than answer to Eldoga, and Igara followed sixty-two years later, which the Elvanans have called envy ever since."
 zin_chr_20148_p4:0 "The Quarrel of the Shallows over the sun-cranes, the Weavers' Judgement of 4A 1517 and every song and petition between the two realms make a rivalry without blood, and the Elvanans would not give it up for anything, because it is the one quarrel in the world they enjoy.\n\nA white silk-moth with its broad wings spread, on deep loom violet. The moth is the silk-moth of the cape, whose thread closes wounds and makes the Sunhot's silks, and on every banner of Elvana it is woven, not painted, in the moth's own thread."
 zin_chr_20148_p5:0 "When the sanctuary chose its own Speaker in 2A 640, the healers hung a moth banner over the door of Googavis, and the Weavers' Judgement of 4A 1517 was a contest of two banners, Elvana's moth against Igara's crane, which the Noon Council could not tell apart in worth."
 zin_chr_20148_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20148_short:0 "Elvana"
 zin_chr_20148_sub:0 "Lands of the Sun · Realm"
 zin_chr_20148_title:0 "Elvana"
 zin_chr_20149_p1:0 "Igara began as the shrine of the shallows on the southern shore of Sun Lake, where the sun-cranes winter. The Sunhot of the south shore tell that long before Aen the cranes came down onto the shallows in a drought year when the lake had shrunk to mud, and danced there until the rain came; the first keepers of the shrine learned the crane-dance from them and have danced it on the shallows in every dry season since, to ask the lake to fill."
 zin_chr_20149_p2:0 "They hold that the cranes carry the lake's prayers to the Sea of Gods when they fly north in spring, that the shrine's keepers are the cranes' keepers, and that a crane killed on the shallows brings a dry year. From the shrine come Igara's customs: the shrine is never left unattended; a keeper of the shrine must have danced the crane-dance; and the cranes of the shallows belong to the shrine and to no realm."
 zin_chr_20149_p3:0 "The south-shore sanctuary chose its own Speaker at Repgin in 2A 702, partly to keep the shrine and partly, the Elvanans say, out of envy, and when Elvana claimed the right to keep the cranes as well in 3A 400, the Quarrel of the Shallows began. It has been fought with songs, weavings and petitions ever since and has never shed a drop of blood.\n\nIgara is the smallest sanctuary realm and the proudest: it measures its standing at the Noon Council by how often it can outvote Elvana, and its keepers still dance on the shallows in every drought."
 zin_chr_20149_p4:0 "A sun-crane dancing with its wings raised and one leg lifted, in crane white on shallows gold. The dancing crane is the crane of the shrine's tale, which danced on the dry shallows until the rain came, and the keepers' crane-dance copies its every step. The shrine's banner is raised on the shallows when the dance begins, and when Repgin chose its own Speaker in 2A 702 the shrine's banner became the realm's.\n\nIgara sews the crane dancing so that no one can mistake whose birds the cranes are, a point Elvana disputes every year."
 zin_chr_20149_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20149_short:0 "Igara"
 zin_chr_20149_sub:0 "Lands of the Sun · Realm"
 zin_chr_20149_title:0 "Igara"
 zin_chr_20150_p1:0 "The house of Yeni Alang is the youngest kind of Sunhot sanctuary and the most patient. Long before Aen, the terrace-folk of the west say, the Sunhot who first cut terraces into the western slopes hung long ribbons on poles at the field edges to read the wind for the harvest, and they learned that on the rare days when every ribbon hung dead still, the sky over the terraces was clearer than anywhere else in the world."
 zin_chr_20150_p2:0 "In 1A 1201 a household of sky-watchers went up to the highest terraces after one of them saw wings over the terraces on such a still day and could not make anyone believe it. They founded a house at Sudoni where the first watcher had stood, and began the Roll of Wings, a record of every sighting of angels with the hour, the weather and the watcher's name. Angels exist and their purpose is unwritten; the watchers write down what they see and never call it a prophecy."
 zin_chr_20150_p3:0 "From the still days come the house's customs: the watchers keep a ribbon-pole on every terrace and watch whenever all the ribbons hang still; a sighting is written only if two watchers saw it; and the house fasts in a year without wings, as it did in 4A 1689.\n\nThe Sunfolk of the terraces count a sighting as a blessing on the harvest and send their children up to Sudoni to learn to sit still, and the watchers write to the keepers of Gala's Mirror whenever the Roll records something it has never recorded before."
 zin_chr_20150_p4:0 "A tall pole with one long ribbon hanging straight down from its head, in white on clear sky blue. The still ribbon is the ribbon-pole of the terraces on a still day, the sign that the sky can be watched. The first watcher's own pole still stands at Sudoni where the wings were first seen in 1A 1201, and its ribbon is renewed each spring by the Eldest Watcher.\n\nThe house sews the pole with its ribbon hanging dead straight on its banners and on the cover of every volume of the Roll of Wings."
 zin_chr_20150_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20150_short:0 "Yeni Alang"
 zin_chr_20150_sub:0 "Lands of the Sun · Realm"
 zin_chr_20150_title:0 "Yeni Alang"
 zin_chr_20151_p1:0 "The high places above the Sea of Gods are full of standing stones that no Sunhot raised and that no Sunhot record explains. The quarrying elves who came to the white stone of the high places long before Aen found them already standing, and their first law was made then: the stones are not to be cut, moved or dug beneath, because what was raised by nobody remembered belongs to nobody living."
 zin_chr_20151_p2:0 "The quarriers swore it by breaking their first chisels at the foot of the stones, and every quarrier of Tor Luni has broken a first chisel there since; the broken halves lie in a heap now taller than a Sunhot. In 2A 300 the quarrying sanctuaries raised Wefolen below the quarries and chose a Keeper of the Stones to govern the quarries and decide what may be cut.\n\nFrom the quarries come Tor Luni's pride and its trade: its white stone built the Gala's Garden of the Dead in 2A 311 and half the sanctuaries of the region, and the pilgrims who come by sea to look out over the Sea of Gods stay in its hostels. From the stones comes its fear."
 zin_chr_20151_p3:0 "In 4A 1588 a Keeper ordered a block cut from the foot of a standing stone to mend the sanctuary; every chisel set to the stone broke, the Keeper laid down the office, and the order has never been given again.\n\nThe two halves of a broken quarrier's chisel, the bladed half set point downward below the handle half with a gap between them, in quarry white on deep sea violet. Every quarrier of Tor Luni breaks a first chisel at the foot of the standing stones, and the broken chisel was the sign of the quarrying sanctuaries long before there was a Keeper."
 zin_chr_20151_p4:0 "The first Keeper bore it when Wefolen was raised in 2A 300, and when every chisel broke against the stone in 4A 1588, the sanctuary took the omen as the oath renewed and sewed the broken chisel larger on the Keeper's banner."
 zin_chr_20151_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20151_short:0 "Tor Luni"
 zin_chr_20151_sub:0 "Lands of the Sun · Realm"
 zin_chr_20151_title:0 "Tor Luni"
 zin_chr_20152_p1:0 "The isle Sunhot of the Ihuy group came to their islands by canoe from the mainland long before Aen, the last of the Sunhot to cross the water, and they kept the long outrigger canoes of that crossing after every other Sunhot realm had forgotten them. Each island kept its own shrine and its own Speaker, and each believed it owed the others nothing, until the Great Volcano on Hol threw ash over every island at once in 3A 66."
 zin_chr_20152_p2:0 "The islands' boats were buried, their lagoons clouded and their stores spoiled; the Speakers of Hol, Hel, Tei, Armic, Ofos, Sus and Rana met at Holang and shared out what was left, and seven canoes that had survived the ash, one from each island, carried food between them all through the dark year. The council of Ihuy was born of that sharing."
 zin_chr_20152_p3:0 "From the Ash of Hol come the council's customs: each island keeps one canoe that belongs to all seven; the Speakers meet where the mountain can be watched; and a lost ship is mourned by throwing a pearl into the sea at the foot of Hol, because the isle-folk say the mountain smokes harder whenever a ship is lost and must be told that it was mourned.\n\nThe council took up the reef-words of the Islands of the South in 4A 1460 so that its canoes could trade on the southern reefs, and its pearl-farmers trade with the islands and the mainland alike."
 zin_chr_20152_p4:0 "A long outrigger canoe seen from the side with seven paddles held upright, in pearl white on ash grey. The canoe is the shared canoe of the Ash of Hol, the seven canoes of the seven islands that carried food through the dark year of 3A 66, drawn as one canoe with a paddle for each island.\n\nThe council sewed it on its first banner at Holang, and every island Speaker's canoe flies it; the paddles are always held upright, as the paddlers raised them in salute when the ash cleared and each island saw the others again."
 zin_chr_20152_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20152_short:0 "Ihuy"
 zin_chr_20152_sub:0 "Lands of the Sun · Realm"
 zin_chr_20152_title:0 "Ihuy"
 zin_chr_20153_p1:0 "The shipwrights of the northern isles keep a keel older than their council. The isle Sunhot say that long before Aen the first white ship of the isles was built at Ossi Luni by a shipwright who laid its keel along the noon shadow of a standing tree, and that when the ship was worn out its keel was drawn up and kept, because every keel since has been measured from it."
 zin_chr_20153_p2:0 "The Mother-Keel lies in the council house at Ileslia, dark with age, and every white ship's keel is laid beside it and marked to its proportions before the first plank is cut. From the Mother-Keel come the isles' customs: no keel is laid without it; a shipwright who lays a keel out of its proportion may not launch; and a ship is named for the tide on which its keel was laid."
 zin_chr_20153_p3:0 "The northern isles were small sanctuaries of shipwrights and pilots, each too small to keep a harbour alone, until 3A 512, when they formed the Archipelago Council at Ileslia and chose their first Tide-Speaker at the turn of the tide, so that no isle could say the office had been decided on its own water.\n\nSince 4A 1366 the council has built the white ships of Gala's court, the fastest hulls of the south, and the strait quarrel with Ihuy over the fishing grounds was settled by the Noon Council in 4A 1603 along the line of the reef."
 zin_chr_20153_p4:0 "A bare curved white keel with its stem and stern posts rising at either end and no planks, on deep tide blue. The bare keel is the Mother-Keel of Ileslia, the keel of the first white ship of the isles, from which every keel of the council is measured.\n\nThe Archipelago Council took it for its banner in 3A 512, because the one thing every isle shared was the keel all their ships came from, and since 4A 1366 the white ships of Gala's court have carried a small Soyano keel stitched under their own colours as the builders' mark."
 zin_chr_20153_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20153_short:0 "Soyano"
 zin_chr_20153_sub:0 "Lands of the Sun · Realm"
 zin_chr_20153_title:0 "Soyano"
 zin_chr_20154_p1:0 "The Sunfolk of Goodin came over the sea as guests and have never forgotten it. Their songs say their forefathers were boat-folk from coasts across the water, which the songs do not name, who were driven out by the plagues and storms of the Long Grief and landed on the western shore of the Lands of the Sun with nothing but their boats and their spears.\n\nTheir elders walked up to the first sanctuary with their spears reversed, the points in the earth and the butts in their hands, which among the boat-folk meant that they came as guests and would fight for whoever took them in, and the tall Sunhot let them stay."
 zin_chr_20154_p2:0 "In 2A 1100 the western sanctuaries granted them the guest-right, land to farm and a share of the harvest in return for working the sanctuary fields, and the Sunfolk became the farmers, sailors and spear-carriers of every realm of the region.\n\nFrom the reversed spear come Goodin's customs: a man of Goodin enters a house with his spear point down; a host may ask a guest to fight for him and the guest may not refuse; and the levies of Goodin, unlike those of the Sunfolk villages under the sanctuaries, are raised freely, because a guest who fights for his host fights by his own choice."
 zin_chr_20154_p3:0 "By 3A 905 the elves of the western grass were too few to keep a sanctuary there, and the steadings met at Elgagen and chose elders to govern themselves. Talae the Guest, the first man to speak at the Noon Council, asked it for a well for every steading, and Goodin has been the council's strongest arm and its only realm of men ever since.\n\nA spear reversed, its point downward resting on a ground line, in ash brown and iron grey on harvest gold. The reversed spear is the guests' spear of the first landing, carried point down by the elders who walked up to the first sanctuary."
 zin_chr_20154_p4:0 "The steadings of Goodin carried it to the Steadings' Moot at Elgagen in 3A 905, and Talae the Guest stood before the Noon Council with a reversed spear in 4A 412, the first man to speak there; the levies of Goodin carry their spears reversed until the moment they are asked to fight."
 zin_chr_20154_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20154_short:0 "Goodin"
 zin_chr_20154_sub:0 "Lands of the Sun · Realm"
 zin_chr_20154_title:0 "Goodin"
 zin_chr_20155_p1:0 "The God Forest is older than every Sunhot record, and its Keepers say nothing about it. What the Sunhot tell is that when the first sanctuary was built on Sun Lake long before Aen, the wood south of the lake was already closed and already kept, and that its Keepers were seen only at its edge, where they took what was left for them and gave back nothing that could be named."
 zin_chr_20155_p2:0 "The Sunfolk call them elves; the Sunhot, who have seen them closer, say they are never quite shaped like anyone else and move through the trees as if the trees moved with them. The Sunhot believe the forest grew from one seed planted by the Keepers before there was any other wood on that shore, and they call it the God Forest because they hold it nearer to the gods than any sanctuary; no Sunhot cuts a tree within sight of it."
 zin_chr_20155_p3:0 "The Keepers' only recorded deeds are refusals and returns. After Dardan they closed the forest to every outsider and its paths grew over; three Sunfolk pilgrims who walked in without leave in 3A 811 came out a year later unharmed and with nothing to say; and when the Radiant Speaker invited them to the Noon Council in 4A 88, they sent the invitation back tied with a living vine."
 zin_chr_20155_p4:0 "From them comes the law of the closed wood: nobody enters without the Keepers' leave; a pilgrim who walks in is not stopped and is not expected back; and the forest's silence is treated as holy by everyone who lives near it. Whose kin the Keepers are, nobody outside the wood knows.\n\nA great winged seed, a single seed with one long curved wing, in pale leaf green on deep forest green. The Sunhot say the God Forest grew from one seed the Keepers planted, and the winged seed is the sign the sanctuaries drew for the forest long before anyone asked the Keepers for one."
 zin_chr_20155_p5:0 "When the Noon Council's invitation came back in 4A 88 tied with a living vine, a winged seed was found inside the binding; the Sunhot took it as the Keepers' answer and their only word, and whoever speaks for the wood at its edge has carried a banner of that seed since."
 zin_chr_20155_plate:0 "GFX_zin_chr_plate_cat_realms"
 zin_chr_20155_short:0 "God Forest"
 zin_chr_20155_sub:0 "Lands of the Sun · Realm"
 zin_chr_20155_title:0 "God Forest"
 zin_chr_202_p1:0 "Before the First Age the kingdoms of men fought one another for hundreds of years. In that long struggle Aen, the fatherless First Man born of magic and power, defeated or united the rival rulers. The war killed many thousands. It ended in his victory and the founding of Aenor, the first united kingdom of men, in the Middle Lands. That victory is Year 1 of the First Age, and the new unity brought centuries of peace."
 zin_chr_202_p2:0 "The early kingdoms fought over rights of inheritance, over fertile land, and over whether any single crown of men should exist at all. Several kings refused the idea of one crown. Others allied with Aen, submitted to him for protection, or resisted until their own cities lay in ruins. Some opposed him because they saw his claimed destiny as a threat to their peoples, even while they knew his nature was beyond the common measure of men."
 zin_chr_202_p3:0 "Aen joined victories, oaths, negotiated submission and royal law into one realm. Its first law was the Peace of the One Crown. The lords kept their own inheritance and custom, but none might make war on another without the judgement of the crown. Breaking that peace was the first meaning of rebellion in the law of Aenor."
 zin_chr_202_p4:0 "For the people of Aenor, the victory ended the wars of rival kings. For the conquered houses, the same victory was the loss of their freedom, and some kept the memory of occupation alive in their own genealogies and chronicles. Many later dynasties descended from Aen's many sons, and their rival claims troubled Aenor in the years of its decline.\n\nNo chronicle tells how the war began, which battles decided it, which kings stood on each side, how many died in all, or by what means Aen at last prevailed."
 zin_chr_202_plate:0 "GFX_zin_chr_plate_war_of_men"
 zin_chr_202_short:0 "The War of Men"
 zin_chr_202_sub:0 "Before the Ages · War"
 zin_chr_202_title:0 "The War of Men"
 zin_chr_203_p1:0 "Aen was exceptional even in the ancient world. He is called the First Man and First of His Name because he was born of magic and power without a direct father, not because he was the first of human kind. He is held to be the greatest man who ever lived, and his blood is counted the most royal of all the lines of men. He is remembered dark-haired and bearded, crowned, in a cloak of black and red, with a very powerful presence."
 zin_chr_203_p2:0 "His victory in the War of Men founded Aenor, the first kingdom of men, in the Middle Lands, and began Year 1 of the First Age. It brought centuries of peace to the central realm, even while settlement on its distant frontiers remained violent. Aen himself had fought in that war for hundreds of years.\n\nAen lived for more than four hundred years and had hundreds of sons, and one of them was Ein. Many noble houses of later ages descend from him, but not every man of the early world was of his blood. The old name Ainu is linked with him and with the First Men, but it is not known whether it means Aen's own line, all the First Men, or some other ancient people."
 zin_chr_203_p3:0 "The lords who knelt to Aen kept their local inheritance and their customs, but the crown alone could judge a war between them. So the kingdom held together, while the houses he had conquered kept their own memory of the day they lost their freedom.\n\nNo chronicle tells where Aen first appeared or what power caused his birth, nor when he died or who reigned after him. The likeness of the names Aen and Aenor is plain, but no chronicle says that the kingdom was named for him."
 zin_chr_203_plate:0 "GFX_zin_chr_plate_founding_of_aenor"
 zin_chr_203_short:0 "The Founding of Aenor"
 zin_chr_203_sub:0 "First Age · Founding"
 zin_chr_203_title:0 "The Founding of Aenor"
 zin_chr_204_p1:0 "Aenor's victory brought centuries of peace to the central realm, and the first half of the First Age is remembered as prosperous. Farming, trade, roads, shipbuilding and exploration spread beyond the Middle Lands. That prosperity was real inside much of Aenor, but settlement on the frontiers was often violent."
 zin_chr_204_p2:0 "Aenoran explorers and settlers reached the West Lands, which already had peoples and kingdoms of their own. Aenoran settlements, trading posts and claims led to repeated wars with them, and that hostility survives in the Fourth Age. A wide sea parts the West Lands from the Middle Lands, so rule over them always depended on ships, ports, local friends and contact that came and went."
 zin_chr_204_p3:0 "The kingdom made an alliance with the North Lands. Its traders reached the peoples of the East Lands, sometimes called Easterlings, and roads to more distant peoples. Voyages reached the Cold Lands, the southern islands and other eastern and southern shores. Much of what the charts of Aoaz show today was first found in this period."
 zin_chr_204_p4:0 "The Ember Lands were exceptionally hard to reach. Their southern heat and the dangerous seas around them turned back ordinary expeditions, and men could chart distant coasts without knowing the lands beyond them. In the north, Zol's Mistake was already a desolate and nearly unusable waste. Zol had come there long before Aen, and his power there lay comparatively dormant through the First Age."
 zin_chr_204_p5:0 "The Roads of Aen, and the sea charts drawn after them, became a source of royal prestige. The kings of Aenor held that early discovery gave them sovereignty over the far shores. The peoples of the West Lands rejected the claim, for they had lived on those shores long before Aenoran ships arrived. Both histories are still told, and both are still used.\n\nNo chronicle tells how far Aenor's early rule in the West Lands truly reached."
 zin_chr_204_plate:0 "GFX_zin_chr_plate_roads_of_aen"
 zin_chr_204_short:0 "The Roads of Aen"
 zin_chr_204_sub:0 "First Age · Era"
 zin_chr_204_title:0 "The Roads of Aen"
 zin_chr_205_p1:0 "After the long prosperous centuries, successive bad kings, struggles over the succession, wars and revolts weakened Aenor. The great distances between the crownlands, the frontier settlements and the allied lands made the kingdom ever harder to govern. Rival descendants of Aen competed for the right to rule. Parts of the West Lands resisted Aenor's authority, and old enemies used every quarrel inside the kingdom."
 zin_chr_205_p2:0 "Aen's hundreds of sons left a lasting problem. Many noble lines truly descended from him, so a disputed succession was rarely about whether a claimant carried Aen's blood. It was about which branch had the lawful right to rule, which oaths still held, and whose account of Aen's wishes the realm would accept. Later kings used his name to justify deeds he had never approved."
 zin_chr_205_p3:0 "The core of the kingdom stayed strong enough to put down each revolt, but its victories emptied its treasury and spent its veterans. Provincial governors gathered taxes for themselves, the old roads decayed, and distant garrisons began to act on their own. The look of order in the capital hid a kingdom less and less able to meet a great invasion.\n\nNo chronicle tells the names, reigns and histories of the kings of Aenor between Aen and Edran."
 zin_chr_205_plate:0 "GFX_zin_chr_plate_cat_first_age"
 zin_chr_205_short:0 "The Long Weakening"
 zin_chr_205_sub:0 "First Age · Era"
 zin_chr_205_title:0 "The Long Weakening"
 zin_chr_206_p1:0 "Volgan is a Great Spirit of extraordinary antiquity. Before he founded his own realm he served a New God, somehow overpowered that god, and made himself an independent dominion in the Ember Lands, south of the Middle Lands. No chronicle tells the name of that New God or how their bond was broken."
 zin_chr_206_p2:0 "In the second millennium of the First Age Volgan invaded Mirolon and made it the opening of a vast conquest. With Aenor weakened and scattered, his victories were swift and terrible. He gathered his forces in the Ember Lands, made alliances with rulers of the eastern and southern lands, and opened dealings with powers of the Dark Lands. Not every Easterling, southerner, Dark Lands people or monster joined him."
 zin_chr_206_p3:0 "His armies held corrupted elves, orcs, goblins, eastern and southern men, demons, devils of realms unknown to men, dragons and many Great Spirits. He also released the Damned Spirits from deep beneath the mountains and the world below, and they brought dangers that most men had never met."
 zin_chr_206_p4:0 "Volgan used his stronghold in the Ember Lands and the fleets of his allies to cross the waters that had turned back earlier explorers. Eastern client rulers gave him ships, landing places, food and roads through the Dark Lands. He struck at distant Aenoran holdings to keep the defenders scattered before he drove at the crownlands, and his captains seized food stores and ports wherever they could."
 zin_chr_206_p5:0 "Aenor's defences failed. The reigning king died, and Volgan's armies took the capital, and the kingdom stood on the edge of collapse. With the royal city were lost its archives, its records of succession, its sacred objects and the authority that had held much of the kingdom together. The scholars do not agree whether the royal city of that age stood where Parim stands now."
 zin_chr_206_plate:0 "GFX_zin_chr_plate_volgan_comes"
 zin_chr_206_short:0 "Volgan Comes North"
 zin_chr_206_sub:0 "First Age · War"
 zin_chr_206_title:0 "Volgan Comes North"
 zin_chr_207_p1:0 "In the catastrophe a new king rose in Aenor: Edran, who is remembered as the greatest king of men after Aen. His defining work was the Grand Alliance against Volgan. He rallied men, elves, dwarves, giants, spirits and many other peoples from across Aoaz against the dark armies.\n\nThe alliance drew its strength from the West Lands, the North Lands, the islands, the Magical Lands and even parts of the Dark Lands. Elves came from several regions. Lorien, the great king of the Gala elves of the Lands of the Sun, led a formidable army in person. Edran knew little of the Gala before they met; it was one of the first great meetings of their courts."
 zin_chr_207_p2:0 "Edran the Gatherer came of a branch of Aen's line that no one had expected to inherit. His right was disputed, but a surviving council of nobles, soldiers and refugees crowned him outside the occupied capital. He had to win allies before he could hope to retake anything."
 zin_chr_207_p3:0 "His gift was to lead peoples who trusted neither Aenor nor one another. Under the Charter of Free Banners every member kept its own crown and banner and a seat in the alliance council, and all served under one wartime command that Edran held by agreement, not by right. The North Lands stayed allies, not subjects. The western realms held that fighting Volgan beside Aenor did not mean accepting Aenor's old claims."
 zin_chr_207_p4:0 "Those concessions cost Edran the support of hard-line Aenoran nobles, and they made the Grand Alliance possible. The western commanders fought because an unchecked Volgan would be worse for their peoples, and they remembered his promises. The elves of the Magical Forest, who know no hereditary crown, came as free peoples. Lorien came as an ally, not as a servant of Aenor."
 zin_chr_207_p5:0 "The alliance broke Volgan at Dardan, where many died and allied spirits stripped his power and cast him into the Void. It then tried to conquer his Ember Lands, where Elzon's defence cost it dearly. The elves had opposed that invasion, and its failure broke the unity of the alliance."
 zin_chr_207_plate:0 "GFX_zin_chr_plate_grand_alliance"
 zin_chr_207_short:0 "The Grand Alliance"
 zin_chr_207_sub:0 "First Age · Alliance"
 zin_chr_207_title:0 "The Grand Alliance"
 zin_chr_208_p1:0 "Dardan was the decisive battle of the First Age war against Volgan. It claimed millions of lives and left a wasteland behind. The Grand Alliance defeated Volgan there, and other spirits stripped his power and banished him to the Void. No map of this age marks the field, and the scholars do not agree where it lay."
 zin_chr_208_p2:0 "The scholars tell it as the Thirteen Days of Dardan. In the first three days the lines closed. Orc and goblin legions struck the forward positions, eastern and southern horsemen sought the open flanks, and corrupted elves broke the defensive spells, while Edran held the mixed centre. In the next three, dark dragons burned the supply stores, and dwarven engineers and giants of Hirolon held the crossings and built new ones under attack."
 zin_chr_208_p3:0 "Ships of the islands brought food, weapons and the wounded where the inland roads could not cope, and thousands died only to keep the alliance in its place. On the seventh day the earth opened: Volgan loosed the Damned Spirits from beneath the hills. Great Spirits held the breaches while the dwarves collapsed the tunnels, and some of those spirits remain sealed beneath the waste of Dardan still."
 zin_chr_208_p4:0 "On the tenth day, after the alliance had taken its worst losses, Lorien sent in the host of the Gala elves. They met the corrupted elves and held back the dragons, and the elves of the Magical Lands fought beside them, though their customs differed. A failing flank was restored, and Edran could strike back."
 zin_chr_208_p5:0 "Then allied Great Spirits began a rite beneath the field. Volgan had spent much of his strength holding his armies together and calling up the deep beings, and they turned that against him. On the last day Edran led the final attack to hold the way open, and Volgan's guard was cut off from him. Several Great Spirits together stripped him of the strength he could use in Aoaz and cast him into the Void. He was not destroyed, and the spirits who did it paid a heavy price."
 zin_chr_208_p6:0 "Volgan's army broke as one host; some fled, surrendered or fought to the end, and others held together under surviving captains. The cities and fields around Dardan were ruined. No god won that day: the Holy Seven, the Creator and Zol did not intervene, and the victory belonged to men, elves, dwarves, giants, island fleets, the free peoples of the West and the Dark Lands, and the allied spirits together."
 zin_chr_208_plate:0 "GFX_zin_chr_plate_dardan"
 zin_chr_208_short:0 "The Battle of Dardan"
 zin_chr_208_sub:0 "First Age · Battle"
 zin_chr_208_title:0 "The Battle of Dardan"
 zin_chr_209_p1:0 "Volgan's banishment was an immense victory, but the Ember Lands were neither destroyed nor conquered. King Edran wanted to enter and hold them, so that Volgan's dominion could never threaten Aoaz again. The elven leaders opposed it. The alliance pressed on anyway."
 zin_chr_209_p2:0 "Elzon had gathered and prepared what was left of Volgan's forces. The invasion met fierce resistance and was driven back with heavy losses. The land itself and the exhaustion of the alliance made further conquest too costly, and the attack was given up. Many elves died in that invasion, after all they had already given at Dardan, and the king's decision badly damaged the trust between men and elves."
 zin_chr_209_p3:0 "Elzon had foreseen that Volgan might fall. He had readied strongholds and fallback positions on the approaches, and he drew his troops back to coasts, passes and fortresses that could be held. He burned the stores near the frontier and used the weather, the heat and the hard ground. The alliance marched into land it could neither feed nor hold, and the defenders, fewer than before, had only to hold their own ground."
 zin_chr_209_p4:0 "Edran held the invasion necessary to prevent a return. Lorien judged it a mistake once the great threat was gone, and Sirael and other elven leaders warned that the troops could not endure another great struggle. When Elzon's counterattack struck the overstretched host, their warnings were proved right. Lorien's people paid for a decision they had opposed."
 zin_chr_209_p5:0 "The war ended when the last members of the alliance abandoned the invasion and went home, and Year 1675 closed the First Age. The invasion is the central stain on Edran's great reign. The records of Aenor praise the saviour of the crown; the chronicles of the Gala and the Magical Lands remember his needless pursuit; those of the West and the Dark Lands remember the price he promised for their loyalty.\n\nThat mistake destroyed the confidence another Grand Alliance would have needed. When Elzon invaded Aenor at the end of the Second Age, the elven kingdoms sent no armies to help men."
 zin_chr_209_plate:0 "GFX_zin_chr_plate_edrans_folly"
 zin_chr_209_short:0 "Edran's Folly"
 zin_chr_209_sub:0 "First Age · War"
 zin_chr_209_title:0 "Edran's Folly"
 zin_chr_210_p1:0 "Afrit played a great part in Volgan's defeat in the First Age, and no one knew it. In secret he gathered demons, spirits, men and elves against Volgan and set them on the dark lord's path, and their part in the Grand Alliance's victory went unrecognised.\n\nHe did not act from loyalty to Aenor, nor as a true ally of the alliance. He used the war to destroy a rival far stronger than himself, and to weaken both Volgan and the survivors, so that he could rise in the age that followed. He expected an exhausted kingdom to be easier to take later."
 zin_chr_210_p2:0 "His hidden hand does not undo what the alliance won. The armies of men, elves, dwarves and giants, and the spirits who bound Volgan, still fought and died at Dardan. No chronicle tells how Afrit hid his alliances, or how much Edran, Lorien and the other commanders suspected."
 zin_chr_210_plate:0 "GFX_zin_chr_plate_cat_first_age"
 zin_chr_210_short:0 "The Hidden Hand at Dardan"
 zin_chr_210_sub:0 "First Age · Secret"
 zin_chr_210_title:0 "The Hidden Hand at Dardan"
 zin_chr_301_p1:0 "The Second Age lasted 2,133 years, the longest of the ages of Aoaz. It began after Volgan's defeat at Dardan and Elzon's repulse of the Grand Alliance from the Ember Lands. It ended in 2A 2133, when Elzon took Aenor and set up his order, and the Third Age began.\n\nIt has three names. The Age of Rebuilding is what the survivors meant to do. The Age of Long Grief and the Dark Age are what later generations remember, for wars, plagues, raids, corruption and disasters of the spirit world went on for generation after generation. All three are used in different chronicles."
 zin_chr_301_p2:0 "Yet it was not one long collapse. Men learned better farming, ways to prevent famine, the treatment of plagues, the order of armies and the building of strong walls. These things carried later generations through the Third Age and into the long peace of the Fourth."
 zin_chr_301_p3:0 "King Edran ruled the first years of rebuilding and died of disease. Orcs and goblins fought on for Volgan, and the Dark Lands fell back into turmoil. Demons came through opened gates to raid Aenor. Elzon, patient and immortal, worked against every recovery, freed Volgan's spirit from the Void, and drew on old magic of Zol, the first sign of that Old God's stirring. In the end Elzon and Volgan won."
 zin_chr_301_p4:0 "The scholars of Parim divide the age into seven periods: the Long Mourning (2A 1 to 240), the Wars of the Remnants (241 to 660), the Hard Centuries (661 to 1150), the Open Gates (1151 to 1550), and, in the last six centuries of the age, the Return, the War from Within and the Fallen Crown. The years of Edran's death and of Volgan's return are not known."
 zin_chr_301_p5:0 "The lesson the scholars draw is that the world lost over many generations. Good kings and brave people could not undo the weight of destruction, mistrust between peoples, disease, the hunger of powers beyond men, and Elzon's patience. That is why the restoration of the Fourth Age is remembered as it is."
 zin_chr_301_plate:0 "GFX_zin_chr_plate_second_age"
 zin_chr_301_short:0 "The Second Age"
 zin_chr_301_sub:0 "Second Age · Age"
 zin_chr_301_title:0 "The Second Age"
 zin_chr_302_p1:0 "The last armies came back from the Ember Lands with little to celebrate. They had broken Volgan at Dardan but had not destroyed his kingdom. Villages across Aenor had lost whole generations, fields lay untended, roads had become burial grounds, and refugees crowded into cities that could barely feed them. The dead could not all be named or buried."
 zin_chr_302_p2:0 "King Edran inherited a kingdom still worth saving. He restored granaries, bridges, mills and walls, and the old roads from the Middle Lands to the coast. His first laws sent soldiers back to the land and stopped the great nobles from taking abandoned farms for themselves. His scribes went into the ruined provinces to keep the Registers of the Lost, recording the dead, finding the missing and settling inheritances, so that grieving families had proof their own had lived."
 zin_chr_302_p3:0 "The Grand Alliance did not vanish at once, but the failed invasion had soured it. The Gala elves mourned their dead, and the elves of the Magical Lands no longer trusted every Aenoran call for soldiers. The West Lands remembered Aenor's old conquests, and the rulers of the east and north had their own frontiers to guard. No king could summon a single army by decree any more. That loss of unity was the first gift the victory left to Elzon."
 zin_chr_302_p4:0 "The former allies met once more in the Council of the Empty Chairs, named for the seats left vacant for commanders who died at Dardan or in the failed invasion. The king wanted a common army on the border of the Ember Lands. Some elven envoys offered scouts and healers but refused another invasion. The western rulers asked that Aenor first give up its disputed claims. No settlement came of it, though aid, trade and friendships went on."
 zin_chr_302_p5:0 "Edran, the great king of the Grand Alliance, guided the rebuilding of the early Second Age and at last died of disease. It is not known in what year he died, at what age, or of what illness. His death was one episode in a long line of successions and renewals, and Aenor did not fall with him.\n\nCenturies later the Registers of the Lost carried a darker meaning. The necromancers of Elzon learned to use the names and places of the dead to find their graves. The registers did not make necromancy; they only became knowledge in the hands of those who already had it."
 zin_chr_302_plate:0 "GFX_zin_chr_plate_long_mourning"
 zin_chr_302_short:0 "The Long Mourning"
 zin_chr_302_sub:0 "Second Age · Era"
 zin_chr_302_title:0 "The Long Mourning"
 zin_chr_303_p1:0 "Many orcs and goblins went on fighting for Volgan long after his banishment, and the independent Dark Lands fell back into turmoil. Elzon, an immortal Great Spirit, Volgan's servant and the Great Necromancer, had survived the First Age. He set himself to hinder Aenor's recovery with raids, alliances and ever wider networks of servants."
 zin_chr_303_p2:0 "A Great Spirit can think in centuries and rebuild after defeats that would end a mortal captain. At first Elzon did not march on Aenor; his forces were too scattered to repeat Volgan's invasion. He built instead a second kingdom without borders. Its roads were smugglers' paths, its forts were hidden shrines and cavern strongholds, and its servants worked inside foreign courts."
 zin_chr_303_p3:0 "The scholars call that kingdom the Ash Networks: a loose band of orc warbands, goblin clans, surviving dark captains, spies, thieves, necromancers, men who served him in secret and scattered agents of the demons. Their loyalty varied. Some worshipped Volgan, some feared Elzon, some wanted land or wealth, and some had lost any place in a world at peace."
 zin_chr_303_p4:0 "Elzon seldom struck the same way twice. One year frontier bridges burned; in another a port governor vanished and the grain ships went astray; elsewhere a failed rising drove refugees into lands that could not feed them. His worst work was the death of trust. Aenoran armies treated suspected traitors as enemies, their reprisals filled his ranks, and provincial nobles raised their own garrisons and claimed the powers of the crown."
 zin_chr_303_p5:0 "The Dark Lands were never one realm. Independent rulers, monster peoples, corrupted courts and rival warlords fought for power there; some served Elzon, and others fought him because they remembered Volgan's grip. Orcs and goblins serve no single master by nature. In the War of the Black Roads his followers tried to seize the roads through the Dark Lands, and a free confederation stood against them.\n\nAenor helped that confederation for a time, until its leaders asked for more than the king could give. So the Dark Lands stayed divided between hostile, watchful and independent powers."
 zin_chr_303_plate:0 "GFX_zin_chr_plate_cat_second_age"
 zin_chr_303_short:0 "The Wars of the Remnants"
 zin_chr_303_sub:0 "Second Age · War"
 zin_chr_303_title:0 "The Wars of the Remnants"
 zin_chr_304_p1:0 "Wars, famine, disease, raids and corruption kept the Second Age from any long, unbroken recovery after Dardan, and so it is remembered as the Dark Age and the Age of Long Grief. Yet it was not all suffering. Aenor and other lands made great progress in the arts of war, in the treatment and cure of disease, in farming and in the prevention of famine. These gains kept later generations alive and helped Aenor recover in the Fourth Age."
 zin_chr_304_p2:0 "Sickness spread again and again through crowded cities, refugee camps, ruined farmland and trade roads. Some plagues rose from ordinary hardship and poor living. Others came of sorcery, corrupted places, or creatures from broken realms. Even the scholars of the time could seldom tell which was which."
 zin_chr_304_p3:0 "The Grey Breath swept the crowded winter settlements after failed harvests; some rulers blamed demons, but no proof of it survives. The Lantern Blight haunted the lands near unstable gates, where sleep was broken, fires burned strangely and the dead seemed to stand among their families. Grave Fever was the name people gave to the outbreaks around mass graves and old battlefields, which Elzon's agents sometimes used."
 zin_chr_304_p4:0 "Farmers learned to rotate their crops, to grow plants that endured drought, to dig irrigation canals, to keep seed in reserve and to build better stores, and villages agreed common rules for the harvest. Healers became specialists. They sought cleaner water, kept the sick of certain fevers apart, made remedies from the plants of each region and shared their records of the sick. Not every plague was magic, and not every cure a miracle."
 zin_chr_304_p5:0 "Soldiers learned to build walls in layers and to defend against siege, to move supply in ordered columns, to keep messengers, roads and reserves, and to make weapons that could stop fast raids or stand against the dead. Rulers who distrusted each other still agreed to open roads and trade grain, and set up neutral hospitals in time of war. These were the work of generations of engineers, farmers, healers and soldiers.\n\nSuffering also bred new faiths, desperate bargains and false prophets. The king's servants tried to keep the old laws, while local governors more and more made bargains with powers they barely understood."
 zin_chr_304_plate:0 "GFX_zin_chr_plate_hard_centuries"
 zin_chr_304_short:0 "The Hard Centuries"
 zin_chr_304_sub:0 "Second Age · Era"
 zin_chr_304_title:0 "The Hard Centuries"
 zin_chr_305_p1:0 "The Nether lies in the south of the Ember Lands. It is the seat of the King of Demons, whose name no chronicle of men gives. His pacts bind the living; the souls of the dead remain Zol's. The Nether is not the Void, where Volgan was banished, nor the Abyss, where Roka and his necklace are found.\n\nAgon was a demon active in the Second Age, and he belonged to the Nether. It is not known what rank he held, whom he served, or how he stood to the King of Demons, and no chronicle shows that he was that king."
 zin_chr_305_p2:0 "In the Second Age gates opened across parts of Aoaz, and demons came through them to raid Aenor and other peoples. Some gates were opened on purpose by cults or by powerful demons; others may have been wounds in the old boundaries left by earlier wars. The demons struck settlements, carried off goods and captives, bargained with frightened rulers and fought one another for influence."
 zin_chr_305_p3:0 "Not all of these raids were Elzon's doing. The demons of the Nether had their own purposes. Some worked with him, some fought him, and others simply took Aenor's weakness as their chance. Demons were never one realm, and not all of them served Volgan."
 zin_chr_305_p4:0 "At the Burning Gate of Nezer a portal opened inside a contested border stronghold. The human garrison, an elven relief company and a band of independent soldiers of the dark country fought side by side and closed it. The royal historians forgot their victory, because the three peoples took up their quarrels again within a generation. The scholars keep it as proof that men and other peoples could still stand together."
 zin_chr_305_plate:0 "GFX_zin_chr_plate_open_gates"
 zin_chr_305_short:0 "The Open Gates"
 zin_chr_305_sub:0 "Second Age · Event"
 zin_chr_305_title:0 "The Open Gates"
 zin_chr_306_p1:0 "Rumours that Volgan still lived spread long before most men knew that Elzon meant to bring him back. Priests disagreed about the Void. Veterans swore they had felt his presence after Dardan. Prophets spoke of a darkness that had not finished its work.\n\nSome warnings rose from true disturbances in the world of spirits. Others were fear, invention, or lies spread on purpose by Elzon's agents. That Volgan did return does not make every prophecy true."
 zin_chr_306_p2:0 "One prophecy survives in many copies: “The king cast out shall return without a crown. His servant shall open what the victors closed, and the graves of men shall become his gates.” Its words may have been set down long before the return, changed in translation, or made after the event by chroniclers. The temples still dispute it."
 zin_chr_306_p3:0 "A small order of mortals and spirits, the Watchers of Dardan, kept guard over the ruined field where the Great Spirits had banished Volgan. They found that the signs of the old binding had begun to fail. A few surviving spirits of the alliance knew the danger, but the kingdoms agreed too little to raise a new alliance."
 zin_chr_306_plate:0 "GFX_zin_chr_plate_cat_second_age"
 zin_chr_306_short:0 "Prophecies of the Return"
 zin_chr_306_sub:0 "Second Age · Prophecy"
 zin_chr_306_title:0 "Prophecies of the Return"
 zin_chr_307_p1:0 "In the Second Age the Great Necromancer Elzon freed his master from the Void. Volgan's soul, or his spiritual presence, came back to Aoaz. The return was real, not a false prophecy. But Volgan needed time to win back the power stripped from him at Dardan, and he gave Elzon far greater freedom to act."
 zin_chr_307_p2:0 "Volgan had been banished at Dardan, not destroyed, and Elzon broke through only after centuries of work. Elzon could not force the Void open by strength. He studied the scar the banishment had left, sought out those who had witnessed it, gathered relics touched by the binding and searched the dormant passages beneath the Ember Lands. He destroyed several failed attempts before he found a way."
 zin_chr_307_p3:0 "The scholars say the rite needed three things: a trace of Volgan's spirit kept in the Ember Lands, a threshold weakened through flaws in the old binding, and ancient death-magic of Zol, strong enough to reach across a boundary no ordinary sorcery can cross. The breach led to the Void. It was no gate of the Nether, and it did not touch the Abyss.\n\nThe cost was immense. Several of Elzon's oldest strongholds were consumed, captains loyal to him were sacrificed or destroyed, and he could not easily work the rite again. He did it in secret, because every rival power, some demons among them, would have sought to seize its result."
 zin_chr_307_p4:0 "What returned was presence, not strength. Volgan's mind and will could act in Aoaz again and slowly regain influence, but the host he had lost did not come back to him. The war against Aenor was now Elzon's to make. He was no longer only the keeper of the Ember Lands; he raised his own networks, led his own wars, dealt with spirits and held conquered lands under his own order, while he stayed loyal to Volgan."
 zin_chr_307_p5:0 "It is not known how Elzon reached Zol's magic or what it cost him, where the rite was done, in what form Volgan first showed himself again, or why the spirits who had bound him could not seal the way once more. No chronicle shows that Zol allowed it, or that he and Elzon were allies."
 zin_chr_307_plate:0 "GFX_zin_chr_plate_return_of_volgan"
 zin_chr_307_short:0 "The Return of Volgan"
 zin_chr_307_sub:0 "Second Age · Event"
 zin_chr_307_title:0 "The Return of Volgan"
 zin_chr_308_p1:0 "Zol came to Aoaz long before Aen or Volgan. He is the only Old God in Aoaz, and the God of Death, and his domain is Zol's Mistake in the north. His power is immense, but the Fading and the nature of Aoaz's magic hold him back. He cannot take a body and conquer a kingdom.\n\nThrough the early ages Zol lay mostly dormant. The Second Age is when his presence first became plain to others, when Elzon drew on his old magic. That does not mean Zol had woken from sleep or had lost his power before. It means that the peoples of Aoaz met a sign of his influence on a scale they had never known."
 zin_chr_308_p2:0 "In the far north there were nights when every sound stopped around the ancient graves, and the sea about Zol's Mistake lay unnaturally still. In distant lands necromancers felt a presence behind their common rites, and a few dreamers spoke of an absence like a face, watching from beyond the living world. No army ever saw Zol on a battlefield.\n\nNo chronicle tells whether Elzon stole Zol's ancient workings, bargained for them, copied them or was given them. None shows that Elzon served Zol, that Zol favoured Volgan, or that the Old God sought the conquest of Aenor."
 zin_chr_308_p3:0 "The scholars keep one distinction above all. Elzon controls and raises the dead by sorcery. Zol is the Old God of Death itself. However great Elzon's necromancy, it never raised him to Zol's height."
 zin_chr_308_plate:0 "GFX_zin_chr_plate_stirring_of_zol"
 zin_chr_308_short:0 "The First Stirring of Zol"
 zin_chr_308_sub:0 "Second Age · Event"
 zin_chr_308_title:0 "The First Stirring of Zol"
 zin_chr_309_p1:0 "In the late First Age the elves, Lorien and his Gala host among them, helped the Grand Alliance defeat Volgan at Dardan. Afterwards King Edran insisted on an attempt to conquer the Ember Lands, against the elves' opposition. Elzon's defenders drove the expedition back and inflicted enormous losses, the elves' among them.\n\nThat mistake destroyed the trust that another Grand Alliance would have needed. In the Second Age, when Elzon invaded Aenor, the elven kingdoms did not send armies to help men. The refusal was a lasting fruit of Edran's decision, and no new alliance was made in the last invasion."
 zin_chr_309_p2:0 "Independent elven communities defended their own Magical Lands. That was not the same as renewing an alliance to save the human crown. Single travellers, healers and others cooperated across the races, but no elven host ever marched to free the crown of men.\n\nIn the Third Age the elves of the Magical Lands fought Elzon to defend their own unconquered lands. That fits their earlier refusal."
 zin_chr_309_plate:0 "GFX_zin_chr_plate_elven_refusal"
 zin_chr_309_short:0 "The Elven Refusal"
 zin_chr_309_sub:0 "Second Age · Event"
 zin_chr_309_title:0 "The Elven Refusal"
 zin_chr_310_p1:0 "When Elzon at last opened his final wars, Aenor had already been fighting for generations. Exhausted hereditary houses ruled several provinces, some regions obeyed the crown in name but sent nothing to its army, and the West Lands would not accept a new Aenoran supremacy. Elzon's war came from within and from every side at once, and many who fought in it never saw that their struggles were one."
 zin_chr_310_p2:0 "First came the Thousand Small Wars: his agents armed rival noble houses, monster lords and rebel governors, and raids drew the royal armies off the great roads. Then the Broken Oaths: corrupted leaders and forged letters set men, elves and dwarves against one another, some over true grievances of the First Age, some by sorcery or fraud, until alliances fell apart with neither side sure why."
 zin_chr_310_p3:0 "Then the Opening of the Passes: orc and goblin armies came through lands thought safe, some down from the Dark Lands and some up from deep below. Last came the March of the Unburied. Elzon took the field in full power and raised the dead from battlefields, graveyards, abandoned forts and roadsides, and Aenor's soldiers saw their own dead kin and comrades among his ranks."
 zin_chr_310_p4:0 "The last war is called the War of the Hollow Crown. Raids and revolt cut off two great grain provinces, and the king had to choose between the frontier and feeding the capital, while Elzon struck at the supply columns, not the strongest walls. Then his necromancers took the burial roads from the old battlefields to the cities, and an army the crown thought destroyed rose again farther inland."
 zin_chr_310_p5:0 "The North Lands sent help, too late and too few. The elven kingdoms sent no army, remembering Edran's folly, and guarded their own lands. The western kingdoms refused the summons or fought their own wars at sea; they had their own enemies. Near the approaches to the capital the last royal host met Elzon's dead, and its own fallen rose against it. Companies that would not leave their wounded were surrounded."
 zin_chr_310_p6:0 "Aenor did not fall in one great battle. Every defeat cost it soldiers and veterans, and part of those same losses passed to Elzon. The scholars hold that his dead needed remains within reach, a binding of name, mark or place, and power enough to hold them, and men learned to guard their graves, carry off their fallen and break the shrines that sustained his hosts. No defence was ever sure."
 zin_chr_310_plate:0 "GFX_zin_chr_plate_hollow_crown"
 zin_chr_310_short:0 "The War of the Hollow Crown"
 zin_chr_310_sub:0 "Second Age · War"
 zin_chr_310_title:0 "The War of the Hollow Crown"
 zin_chr_311_p1:0 "At the close of the Second Age, in 2A 2133, Elzon won his war against Aenor, seized the kingdom and set up his order. Volgan had returned from the Void, and the two prevailed together. The conquest began the Third Age.\n\nElzon entered the royal city after its defence had collapsed. No chronicle tells the name of the last free king or what became of the royal line, and the scholars do not agree whether the royal city of that age was Parim, the seat of the Fourth Age. They record the conquest simply as the Fall of Aenor."
 zin_chr_311_p2:0 "Not every subject was killed. Elzon gained more from farms, roads, craftsmen and frightened but living officials. His order held the land with garrisons of the dead, necromantic officers, mortal administrators who submitted, and client rulers bound to give labour, food, news and bodies. Pockets of human resistance, free elves, dwarves and other peoples remained."
 zin_chr_311_p3:0 "Men called the new rule Elzon's Order. Later historians call it the Pale Regency, for Elzon ruled in the name of a master who had returned but had not recovered his old greatness. He ruled with the freedom that Volgan had given him.\n\nA royal archivist, Arelon, the Keeper of the Last Seal, carried fragments of Aenor's oldest genealogies and laws out of the fallen city. He did not save the royal treasures. He saved the records that named the descendants of Aen and the rights of the crown."
 zin_chr_311_p4:0 "So the age ended. The old capital was lost, Elzon's Order stood in the crown's place, and Volgan's spirit was back in Aoaz. The Nether still sent its raids and its rival demonic interests, and men knew that Zol's presence had been felt, though not what part he had played."
 zin_chr_311_plate:0 "GFX_zin_chr_plate_fall_of_aenor"
 zin_chr_311_short:0 "The Fall of Aenor"
 zin_chr_311_sub:0 "Second Age · Event"
 zin_chr_311_title:0 "The Fall of Aenor"
 zin_chr_312_p1:0 "Afrit grew ever more powerful through the Second Age, and his ascension near its end was one of the age's defining events. He had used the First Age war to destroy a rival, and he used the ruin that followed to gain worship, influence and power by cults, contracts, bargains, favours and corruption. He stayed independent of Elzon and of Volgan."
 zin_chr_312_p2:0 "The age gave him all he needed: men feared the Nether, noble houses quarrelled, priests could not halt disease, and the bereaved would bargain with any power that promised safety. In ruined towns his hidden followers ran the Houses of Refuge, giving grain, medicine, shelter and protection, and most who took them never learned whose gifts they were. Each small debt could be passed from a family to a guild, a temple or a lord."
 zin_chr_312_p3:0 "On the Night of a Thousand Oaths, priests and rulers bound by separate compacts found that their obligations had become one web. Worshippers in many lands bound themselves under the same name without knowing whom they served, and through that web Afrit could cast his influence at a scale never seen. No chronicle fixes the night's date in the last years of the age.\n\nThe ascension did not make Afrit a New God, and what order of being it raised him to is not known. It gave him neither Roka's Necklace of the Abyss, which he took only in the Fourth Age, nor Aenor's crown. Elzon took the kingdom he had hoped to inherit, and so the two became rivals."
 zin_chr_312_p4:0 "His public godhood came later. Near the end of the Third Age he was acclaimed a New God for saving the world from Elzon, and the people worshipped him as their Deliverer. Whether he truly belongs to the divine order the Holy Seven made is not known."
 zin_chr_312_plate:0 "GFX_zin_chr_plate_cat_second_age"
 zin_chr_312_short:0 "Thousand Oaths"
 zin_chr_312_sub:0 "Second Age · Secret"
 zin_chr_312_title:0 "The Night of a Thousand Oaths"
 zin_chr_401_p1:0 "The Third Age began when Elzon conquered Aenor in 2A 2133 and ended with his permanent death, which let a human monarchy return. It lasted at least 1,200 years and many generations of men. By the reckoning of the scholars it lasted 1,260 years, and Elzon died in 3A 1260."
 zin_chr_401_p2:0 "Volgan stayed in the Ember Lands, too weak to travel beyond them, and gave his orders to his servant Elzon, the Great Spirit and Great Necromancer. Elzon ruled Aenor in fact, but he had to use living servants, and he could never conquer the Magical Lands. Varner, a Lesser Spirit and wizard, and his small purple servant Golbran resisted the curses of the dead, and men all through Aenor refused to surrender entirely."
 zin_chr_401_p3:0 "Elzon's dead grew harder to keep as his reserves dwindled. The magic of Aenor would not renew him as the Ember Lands could, so he tried to change the land itself and make Aenor another Ember Lands. The elves, Varner and the stubborn resistance of men stood in his way. His decline was long, not sudden, and he held his dominion for centuries with changing armies and governors."
 zin_chr_401_p4:0 "No host of fading corpses could stand at full strength for twelve centuries. Elzon moved his hosts between the regions near his sources of power, raised new dead from each war, set living rulers over the provinces and leaned on orc and goblin garrisons. Some lands even kept an ordinary trade under heavy taxes. Rebels could be beaten without being wiped out, and so the wars came back in every generation, while both sides learned new ways to fight."
 zin_chr_401_p5:0 "At the end of the age Elzon died, and a catastrophe came with his death. The Deliverer saved the people from it and was proclaimed and worshipped as a New God. He did not take the throne. A good king of men restored Aenor, and the Fourth Age began. Varner and Golbran outlived the age."
 zin_chr_401_plate:0 "GFX_zin_chr_plate_third_age"
 zin_chr_401_short:0 "The Third Age"
 zin_chr_401_sub:0 "Third Age · Age"
 zin_chr_401_title:0 "The Third Age"
 zin_chr_402_p1:0 "Elzon, the Great Spirit and Great Necromancer who served Volgan, seized Aenor in 2A 2133 and founded his own order, and the Third Age began. Volgan was too weak to leave the Ember Lands and sent his commands from there. Within Aenor, Elzon held the real power."
 zin_chr_402_p2:0 "The occupation lasted many generations, and no single generation of risen corpses could hold it. The dead fade, and raising them again uses magic that is hard to renew in Aenor. Elzon therefore ruled through living administrators, orc and goblin forces, fresh raisings of the dead, raids, lesser lords sworn to him, and arrangements that changed from province to province."
 zin_chr_402_p3:0 "The Magical Lands were never conquered, and men rose against him again and again. Elzon tried to make Aenor able to sustain him as the Ember Lands did, but he never finished the work. He ruled until his literal and permanent death.\n\nGarrison towns, tribute roads and client rulers held the order together through the long centuries. Later historians call his rule the Pale Regency; what it called itself is not known."
 zin_chr_402_plate:0 "GFX_zin_chr_plate_elzons_order"
 zin_chr_402_short:0 "Elzon's Order"
 zin_chr_402_sub:0 "Third Age · Realm"
 zin_chr_402_title:0 "Elzon's Order"
 zin_chr_403_p1:0 "The scholars divide the twelve centuries and more of the occupation into eight periods. In the first, the Order Takes Root (3A 1 to 180), Elzon's living governors and his hosts of the dead secured the heart of Aenor, while the early revolts held out in forest and mountain strongholds."
 zin_chr_403_p2:0 "In the Long Occupation proper (181 to 430) an uneasy order took hold. Garrison towns, tribute roads and client rulers made the conquest last for centuries, and resistance passed from father to son. In the Buried Wars (431 to 690), wars in the provinces and the Dark Lands wore down Elzon's soldiers, and his necromancers refilled his hosts by robbing graves and renewing old bindings."
 zin_chr_403_p3:0 "In the time of the Black Roots (691 to 910) Elzon hastened his work to corrupt the magic beneath Aenor, and his advance on the Magical Lands broke against the elves and Varner. In the Weakening Crown (911 to 1110) several regions won freedom for a time. Elzon could take them back, but each war cost him power he could not replace without Zol's old magic.\n\nIn the Hidden Preparations (1111 to 1235) the counterspells of Varner and Golbran spread, charities grew among the poor, and rival groups made ready to break Elzon's hold. The War of Unbinding (1236 to 1259) followed, and the age ended with the Last Tithe in 3A 1260."
 zin_chr_403_plate:0 "GFX_zin_chr_plate_cat_third_age"
 zin_chr_403_short:0 "The Long Occupation"
 zin_chr_403_sub:0 "Third Age · Era"
 zin_chr_403_title:0 "The Long Occupation"
 zin_chr_404_p1:0 "The Magical Lands were never conquered. Through all the Third Age the elves, Varner the Lesser Spirit and Golbran resisted Elzon's magic, and men went on fighting him in Aenor.\n\nVarner is a wise wizard and a Lesser Spirit of the Magical Lands, in the form of an old man. He helped the elves and the resistance of men withstand Elzon's necromancy through the long Third Age, for he can undo the curse that binds the risen dead. He has a small purple servant of unknown origin, Golbran. His wisdom stayed influential for centuries, yet his order remains that of a Lesser Spirit."
 zin_chr_404_p2:0 "The elves of the Magical Lands fought to defend their own unconquered lands. That fitted their old refusal: no elven host marched to free the crown of men, though single travellers, healers and others worked across the races.\n\nVarner is one wizard among many traditions of magic. He and Golbran outlived the Third Age."
 zin_chr_404_plate:0 "GFX_zin_chr_plate_unconquered_forest"
 zin_chr_404_short:0 "The Unconquered Forest"
 zin_chr_404_sub:0 "Third Age · Event"
 zin_chr_404_title:0 "The Unconquered Forest"
 zin_chr_405_p1:0 "The Black Roots were Elzon's unfinished attempt to turn Aenor into a land that would sustain his necromancy as the Ember Lands did. They were a network of buried anchors, corrupted burial fields and places where the magic of life was turned inside out. Only in some places were they roots of any kind.\n\nThe work quickened between 3A 691 and 910. Elzon needed the Magical Lands, because their free and living magic kept his work from ever being complete, and his advance on them failed against the elves and Varner."
 zin_chr_405_p2:0 "Varner and Golbran helped undo the links or cut them. The breaking of the network was one of the causes of Elzon's final collapse.\n\nThe scholars do not agree where the first anchors were sunk."
 zin_chr_405_plate:0 "GFX_zin_chr_plate_black_roots"
 zin_chr_405_short:0 "The Black Roots"
 zin_chr_405_sub:0 "Third Age · Sorcery"
 zin_chr_405_title:0 "The Black Roots"
 zin_chr_406_p1:0 "The Lantern Chain was a network of resistance couriers, hidden refuges and keepers of wards, raised in the Third Age with the help of Varner and Golbran. Its purpose was to spread the ways of lifting the curse of the dead and to shield common folk from Elzon.\n\nIt worked beside the rebel bands of men. It never made the elven armies of the Magical Lands the official rescuers of Aenor. Its members carried the healing and farming learned in the Second Age, as well as rare magical wards."
 zin_chr_406_p2:0 "Through its couriers the counterspells of Varner and Golbran reached far beyond the Magical Lands in the last centuries of the age."
 zin_chr_406_plate:0 "GFX_zin_chr_plate_cat_third_age"
 zin_chr_406_short:0 "The Lantern Chain"
 zin_chr_406_sub:0 "Third Age · Order"
 zin_chr_406_title:0 "The Lantern Chain"
 zin_chr_407_p1:0 "The War of Unbinding was the last war of the resistance in the Third Age, fought to break the works that sustained Elzon's army of the dead. It lasted from 3A 1236 to 1259 and ended in the Last Tithe.\n\nFree armies of men, local rebels, friendly lesser rulers and defenders who stood with Varner and Golbran destroyed or unbound the necromantic anchors, above all those that let Elzon keep the dead near the capital. Varner freed many of those who were bound. Elzon's power to keep his armies and to corrupt the magic of Aenor began to fail."
 zin_chr_407_p2:0 "The elves of the Magical Lands held their own defences and sacred places, but the old kingdoms did not raise King Edran's Grand Alliance again. The memory of the failed attack on the Ember Lands still shaped their choices.\n\nElzon's hold depended more and more on Zol's ancient magic, and that dependence prepared his destruction. Exactly how Zol consumed the Great Spirit is not known."
 zin_chr_407_plate:0 "GFX_zin_chr_plate_war_of_unbinding"
 zin_chr_407_short:0 "The War of Unbinding"
 zin_chr_407_sub:0 "Third Age · War"
 zin_chr_407_title:0 "The War of Unbinding"
 zin_chr_408_p1:0 "After more than twelve centuries of rule the Great Necromancer was exhausted. To steady his failing dominion and his army of the dead, Elzon drew on far more of Zol's old magic than ever before. The resistance of men and the counterspells of Varner had already broken much of what held his power up.\n\nThe bond turned against him. It did not merely banish his manifestation; it destroyed his spirit, and Elzon died, literally and for ever. Zol took his essence without stirring, and his strength grows in the far north still. The Old God did not take the field."
 zin_chr_408_p2:0 "It happened in 3A 1260 and ended the Third Age. A magical catastrophe broke over the land; the Deliverer shielded the people from it and was acclaimed the New God who had saved the world. He did not take the throne of Aenor, and a human monarchy returned. Volgan still lived in the Ember Lands.\n\nHowever great Elzon's necromancy had been, it never gave him Zol's rank or the right to rule death. It is not known whether the dead he raised were ever bound in soul, or only in body and memory."
 zin_chr_408_plate:0 "GFX_zin_chr_plate_last_tithe"
 zin_chr_408_short:0 "The Last Tithe"
 zin_chr_408_sub:0 "Third Age · Event"
 zin_chr_408_title:0 "The Last Tithe"
 zin_chr_409_p1:0 "When Elzon fell in 3A 1260, his ruin brought a magical catastrophe on the lands he had ruled. The temples tell that in that hour the Deliverer stood between the people and the disaster and shielded them from it.\n\nFor that rescue he was hailed as a New God, the God of Deliverance, Protection and Renewal, and the people worship him still as the Deliverer. The rescue is the heart of his worship in every temple that bears his name."
 zin_chr_409_p2:0 "He did not take the throne. A good king of men restored Aenor, and the Fourth Age began in peace. His cult keeps a feast in his honour, but no month, for the twelve months of the year honour the twelve main New Gods."
 zin_chr_409_plate:0 "GFX_zin_chr_plate_deliverers_rescue"
 zin_chr_409_short:0 "The Deliverer's Rescue"
 zin_chr_409_sub:0 "Third Age · Event"
 zin_chr_409_title:0 "The Deliverer's Rescue"
 zin_chr_409_x1_p1:0 "The Deliverer was Afrit, whose father was Ein, son of Aen. His help at the Last Tithe was real, and he truly shielded people from the catastrophe. It also won him what he had long prepared for: the gratitude of the people, their dependence on his temples and charities, and a place beside the restored crown from which his hidden influence grew through the long peace.\n\nThe name Afrit was known chiefly to his secret council, to his enemies and to certain beings of the spirit world. Whether he was ever a true New God, of the order the Holy Seven made, is not known."
 zin_chr_501_p1:0 "Elzon's death ended the Third Age. The Great Necromancer had ruled Aenor for many generations, although the elves of the Magical Lands never submitted to him and men never ceased to resist. The good king who took the restored throne inherited ruined roads, cursed fields, divided provinces and a people who could scarcely remember independence.\n\nThe scholars reckon the years of this age from the death of Elzon and the crowning of the first restored king, and they write them 4A. The first year of the restored monarchy is 4A 1, and in 4A 1748 the age is more than seventeen centuries old."
 zin_chr_501_p2:0 "Aoaz keeps twelve months, and each honours and is named after one of the twelve main New Gods, who answer the twelve needs of mortals. The year opens with the month of Glernaen, the mightiest of the twelve, and the third month, Lumae, opens the spring. The lesser New Gods have no month, and the cult of the Deliverer keeps a feast of its own rather than a month."
 zin_chr_501_p3:0 "For more than a thousand years the Middle Kingdom grew. Cities spread around the Great Lake and its ports expanded. Teachers, physicians and builders found patrons, and schools and libraries stood in places that plague had once ravaged. Trade grew with the North Lands, the West Lands, the islands, the Magical Lands and the eastern states. Dangerous borders remained, but the great invasions of orcs and goblins had ceased, and Aenor became as formidable as it had ever been."
 zin_chr_501_p4:0 "The histories agree that the peace was real. Aoaz knew more than a thousand years of genuine peace, plenty, learning and medicine under strong laws and courts, and the kingdoms that lived through it remember it as the longest good time the world has known.\n\nThe scholars divide the age into the Restoration, which lasted until the First Concord Council of 4A 212; the Long Peace, which ended with the Thousand-Year Jubilee of 4A 1000; the Blessed Centuries that followed; and the reign of the Golden King, who was crowned in 4A 1729."
 zin_chr_501_plate:0 "GFX_zin_chr_plate_fourth_age"
 zin_chr_501_short:0 "The Fourth Age"
 zin_chr_501_sub:0 "Fourth Age · Age"
 zin_chr_501_title:0 "The Fourth Age"
 zin_chr_502_p1:0 "In 4A 1, after Elzon's death, Harion of Selen was crowned at Parim. He came of a lesser branch of Aen's royal line and had earned his place through many years of resistance and organising against the occupation, so that his right rested on both descent and service. He was a good king, and he brought peace through rebuilding, law, fair grain stores, sensible defence and patient dealing with his neighbours."
 zin_chr_502_p2:0 "Harion did not make the Fourth Age's prosperity alone. The cures, irrigation works, crop rotations, craft of fortification, clean wells and drains, and stores against famine worked out in the Second Age gave the new kingdom practical ways to rebuild, and Varner's work against the curses of the dead made the old grave-fields fit to live in again.\n\nIn the same first year the people acclaimed the Deliverer, who was honoured for saving Aenor at Elzon's fall, under the name Aurevan. Harion welcomed the relief houses of the Deliverer's followers because they plainly helped the people, and he gave them a place in the new kingdom."
 zin_chr_502_p3:0 "Between 4A 40 and 4A 120 the roads, canals and Great Lake ports were rebuilt, and the medicine and farming of the Second Age returned to every province. From 4A 150 Aenoran merchants went back to the West Lands for the first time since the wars of the First Age. The western lords took the trade gladly, but they did not accept the old Aenoran claims.\n\nHarion did not reign for the whole age. Successive kings and royal generations followed him on the throne of Parim, and the histories count the Restoration as the work of his house as much as his own. By the scholars' reckoning it ended with the First Concord Council of 4A 212."
 zin_chr_502_plate:0 "GFX_zin_chr_plate_restoration"
 zin_chr_502_short:0 "The Restoration"
 zin_chr_502_sub:0 "Fourth Age · Event"
 zin_chr_502_title:0 "The Restoration"
 zin_chr_503_p1:0 "In 4A 3 the Charters of Parim bound the surviving dominions of the Middle Lands to the crown as self-governing members of a common defence. Each dominion kept its own lords and laws. The Charters are the root of the Middle Kingdom Concord, and Selen, Kilinti, Kingson, Konori, Hunhun and the rest still hold their lands under them.\n\nHirolon, the sovereign kingdom of the giants, stayed outside the Charters. It treats with the crown of Parim as one realm with another and has never been a dominion of Aenor."
 zin_chr_503_p2:0 "Not every land of the Middle Lands came under them. The Cursed Lands and the Bloody Forest rejected the crown and reject it still. Within the Charters the lawyers of Parim do not agree whether a chartered dominion is a part of the kingdom or a realm allied to it, and they have argued the point for centuries."
 zin_chr_503_plate:0 "GFX_zin_chr_plate_cat_fourth_age"
 zin_chr_503_short:0 "The Charters of Parim"
 zin_chr_503_sub:0 "Fourth Age · Charter"
 zin_chr_503_title:0 "The Charters of Parim"
 zin_chr_504_p1:0 "Varner is a wise wizard of the Magical Lands, a Lesser Spirit in the form of an old man. Through the long Third Age he helped the elves and the human resistance withstand Elzon's necromancy, and he knew how to undo the curse that bound Elzon's risen dead. A small purple servant of unknown origin, Golbran, goes with him.\n\nBetween 4A 4 and 4A 60 Varner's Unbinding lifted the curse from the old grave-fields. Ploughmen went back to land that had been left to the dead for generations, and the restored kingdom could feed itself from fields that had been lost since the occupation."
 zin_chr_504_p2:0 "When the work was done, the Lantern Chain, the network of couriers, hidden refuges and ward-keepers that Varner and Golbran had built in the Third Age, had no more need of secrecy. It dissolved into the village healers and wardens of the Middle Lands, who carried its remedies and its wards into the new kingdom.\n\nVarner's wisdom has been heeded for centuries since, although his order is still that of a Lesser Spirit. He is one practitioner among many traditions of magic, and Bastian, a living human wizard famous in the Middle Lands, is his contemporary."
 zin_chr_504_plate:0 "GFX_zin_chr_plate_varners_unbinding"
 zin_chr_504_short:0 "Varner's Unbinding"
 zin_chr_504_sub:0 "Fourth Age · Event"
 zin_chr_504_title:0 "Varner's Unbinding"
 zin_chr_505_p1:0 "The Great Wall of Aenor is no work of masons. It is an enormous natural range of mountains between the Middle Lands and the Magical Lands, held by dwarves, and its passes, valleys and snowlines decide every road between the two lands. Elzon's Order kept watch-posts in its passes against the Magical Lands, which it never conquered."
 zin_chr_505_p2:0 "In 4A 96 Harion's grandson and the elven realms made the Accord of the Passes, which the pass folk call the Wall Accord. They agreed to keep a few passes guarded rather than open every road. The elves wanted their old separation, and the kings wanted customs posts on the pass roads and a watch against the dragons of the east. A few passes still carry the Accord's watchtowers and customs posts."
 zin_chr_505_plate:0 "GFX_zin_chr_plate_cat_fourth_age"
 zin_chr_505_short:0 "The Wall Accord"
 zin_chr_505_sub:0 "Fourth Age · Treaty"
 zin_chr_505_title:0 "The Wall Accord"
 zin_chr_505_x1_p1:0 "The Wall Accord is broken. A pass of the Great Wall changed hands by force of arms in war, and with it fell the old promise that the passes would be kept and not fought over."
 zin_chr_506_p1:0 "In 4A 212 the dominions and the crown met in Parim at the First Concord Council. They agreed on a common army in war and free roads in peace, and from that day the members of the Charters spoke of themselves as one Concord. The scholars end the Restoration with this council and begin the Long Peace.\n\nIn 4A 340 the universities of Parim and Selen were founded, and physicians of the Houses of the First Light taught in both. Their scholars keep the histories from which this Chronicle is drawn."
 zin_chr_506_p2:0 "In 4A 1748 the Concord counts twenty-six chartered dominions under the crown of Parim, and it still answers to the bargain of 4A 212: one army when the kingdom is at war, and open roads when it is not."
 zin_chr_506_plate:0 "GFX_zin_chr_plate_concord_council"
 zin_chr_506_short:0 "The First Concord Council"
 zin_chr_506_sub:0 "Fourth Age · Council"
 zin_chr_506_title:0 "The First Concord Council"
 zin_chr_507_p1:0 "In 4A 411 the Leren crowns united. Lerendor and Lerendor's North married their royal houses and became one kingdom, which has been the strongest power of the North Lands ever since.\n\nThe united crown rules from Sonargur and leads the Leren Compact with Eekedor. Its kings are proud, its fleets guard the strait, and Lerendor and Aenor have been rivals for as long as both have been strong. The smaller crowns of the North Lands, among them Tolvael, Molot, R'en and Mina, look to Lerendor or to Parim as it suits them."
 zin_chr_507_plate:0 "GFX_zin_chr_plate_cat_fourth_age"
 zin_chr_507_short:0 "The Leren Union"
 zin_chr_507_sub:0 "Fourth Age · Union"
 zin_chr_507_title:0 "The Union of the Leren Crowns"
 zin_chr_508_p1:0 "Between 4A 600 and 4A 780 the great caravan roads of the East Lands opened. Noris and Stabilo grew rich on them and began a rivalry that never fully ended. The East Lands became the richest region of Aoaz and remain the most divided, for Alerhia, Miaed, Erco and Plutondo are great kingdoms in their own right.\n\nNoris rules from Furvior and holds the Noris Treaty with Gondolin, and Stabilo rules from Postondoroth and holds the Stabilo Pact with Drak. The two compete for the southern trade roads, and each watches the other more closely than any enemy."
 zin_chr_508_p2:0 "In 4A 702 the Triton islanders charted the sea that their island arcs enclose and sold their charts to every crown. Captains still say that the best soundings in Aoaz are the Pupor charts. Adel, Pollos, Raerby, Nondondor and thirty island lordships live by fishing, by charting and, when the charts do not sell, by piracy.\n\nIn 4A 850 Coldor's kings brought the frozen interior of the Cold Lands under one crown. Isengard refused and has been Coldor's enduring rival ever since. Coldor rules from Fandanar over the interior and the western ports and leads the Northern Accord with Horidor."
 zin_chr_508_plate:0 "GFX_zin_chr_plate_far_crowns"
 zin_chr_508_short:0 "The Far Crowns Grow Rich"
 zin_chr_508_sub:0 "Fourth Age · Era"
 zin_chr_508_title:0 "The Far Crowns Grow Rich"
 zin_chr_509_p1:0 "In 4A 1000 Parim celebrated a thousand years of peace. Envoys came from every region of Aoaz to see it, and Aurevan's temples blessed the crown in front of them while the city feasted in its streets and on the shores of the Great Lake.\n\nLater historians date the end of the high peace to the year of the Jubilee, although the peace itself went on for seven centuries more. The scholars of Parim and Selen still argue about what changed after it, and the Jubilee is where most of them begin the Blessed Centuries."
 zin_chr_509_plate:0 "GFX_zin_chr_plate_jubilee"
 zin_chr_509_short:0 "The Thousand-Year Jubilee"
 zin_chr_509_sub:0 "Fourth Age · Feast"
 zin_chr_509_title:0 "The Thousand-Year Jubilee"
 zin_chr_510_p1:0 "The centuries after the Jubilee are remembered as the Blessed Centuries. Kings reigned in Parim in peace, one after another, and few of them are remembered for anything else. Priests of Aurevan taught the princes, the Houses of the First Light kept the kingdom's grain, hospitals and rolls, and a royal councillor who stood well with the temples was thought the mark of a wise court."
 zin_chr_510_p2:0 "Aurevan was praised as a New God of Deliverance, Protection and Renewal, and his blessings could be real. He could heal, shield, grant wealth and turn aside disaster. Most of the men who advised the kings counted service to the Deliverer an honourable service to their country.\n\nBeyond the Great Lake the centuries were less quiet. Orc warlords united the inner Dark Lands as Goldoroth, a temple-state of the Deliverer grew in the Zilin Hills, Volgan's strength returned in the south, and the West Lands fell into the Gunwaith–Girdon wars. None of it reached Parim, where the kings went on reigning in peace."
 zin_chr_510_plate:0 "GFX_zin_chr_plate_cat_fourth_age"
 zin_chr_510_short:0 "The Blessed Centuries"
 zin_chr_510_sub:0 "Fourth Age · Era"
 zin_chr_510_title:0 "The Blessed Centuries"
 zin_chr_510_title_after:0 "The Kingdom Behind the Throne"
 zin_chr_510_x1_p1:0 "The Blessed Centuries were the age of the Kingdom Behind the Throne. About 4A 1100 Afrit's Hidden Council took its lasting form, with seats for royal administration, worship, foreign agents and the recovery of artifacts, and from 4A 1140 successive kings reigned while the Council governed. About 4A 1300 its eastern branch began to court the East Lands and South Lands as a reserve seat of power."
 zin_chr_510_x1_p2:0 "The change was hard to see from one reign to the next. By the middle centuries Afrit's people could help appoint councillors, decide which noble houses prospered, direct spies and govern without signing a single royal decree. Aenor's kings wore the crown, but its true ruler was often elsewhere, which is why the kingdom stayed rich while its independence was slowly lost."
 zin_chr_511_p1:0 "About 4A 1450 orc warlords united the inner Dark Lands as Goldoroth, and its wars with the human kingdom of Dondor began. Goldoroth rules from Cocanoor and wants the whole region. Dondor rules from Notbuton and leads the Dark Sea Accord with Belonton against it, and neither has ever beaten the other for good."
 zin_chr_511_p2:0 "The Dark Lands lie between the North Lands and the Middle Lands, and much of them belongs to nobody. Bordon, Dreson, Dulundur, the Troll Forest and a dozen orc and goblin holds answer only to themselves. Smash, a troll king, and the hobgoblin king rule their own realms, not every troll or goblin, and not every monster of the Dark Lands serves Volgan, although his envoys court them all."
 zin_chr_511_plate:0 "GFX_zin_chr_plate_goldoroth_rises"
 zin_chr_511_short:0 "The Rise of Goldoroth"
 zin_chr_511_sub:0 "Fourth Age · Event"
 zin_chr_511_title:0 "The Rise of Goldoroth"
 zin_chr_512_p1:0 "In the Fourth Age Afrit sought the greatest surviving artifacts of Aoaz, and above all he coveted the Necklace of the Abyss. It was held in the depths of the Ember Lands by Roka, a huge being of the rhinoceros-headed people of the Abyss. No chronicle tells the true history of that people or how the necklace was made."
 zin_chr_512_p2:0 "Rather than enter the Abyss himself, Afrit sent a master thief, Sevrin the Unending, and promised him eternal life if he brought the necklace back. Sevrin crossed hostile lands, reached Roka's domain and took the artifact by means that are not known. He returned in 4A 1611, and Afrit kept the bargain, using the necklace's magic to grant him unending life.\n\nThe gift had a price. Sevrin ceased to age, but he can still suffer pain, capture and injury, and because his life hangs on Afrit's hold over the necklace, the thief who was promised freedom from death became a servant who cannot leave."
 zin_chr_512_p3:0 "The necklace greatly increased the power that Afrit could draw and direct, and it was at its strongest in Aenor, where centuries of worship had prepared his principal seat. Between 4A 1611 and 4A 1700 he gathered lesser artifacts through trade, theft, excavation and bargains with servants across Aoaz: the Ring of Doors, the Crown of Witnesses and the Bracelet of the First Seal.\n\nIt is not known what became of Roka, or whether he guarded the necklace himself."
 zin_chr_512_plate:0 "GFX_zin_chr_plate_theft_of_necklace"
 zin_chr_512_short:0 "The Theft of the Necklace"
 zin_chr_512_sub:0 "Fourth Age · Secret"
 zin_chr_512_title:0 "The Theft of the Necklace"
 zin_chr_513_p1:0 "In 4A 1702 the Gunwaith–Girdon wars divided the West Lands. Each side courted Aenoran gold, and both resented it. The fighting went on along their border for half a century, and the crowns between the two kingdoms could not stop it alone.\n\nIn 4A 1745 Gunwaith and Girdon signed the Truce of the Grey Ford, and the West Lands were quiet for the first time in a generation. In 4A 1748 the truce holds, though uneasily."
 zin_chr_513_p2:0 "Two dozen kingdoms crowd the West Lands. Kradlon, Corogon, Varnondor, Lambin and the Buldor companies trade with Aenor across the wide central sea and resent its tariffs, and every western court remembers that Aenor once tried to rule them. For now the West Lands are divided and at peace."
 zin_chr_513_plate:0 "GFX_zin_chr_plate_western_wars"
 zin_chr_513_short:0 "The Gunwaith–Girdon Wars"
 zin_chr_513_sub:0 "Fourth Age · War"
 zin_chr_513_title:0 "The Gunwaith–Girdon Wars"
 zin_chr_513_x1_p1:0 "The Truce of the Grey Ford is broken. Gunwaith and Girdon took up their old quarrel at the ford, and the West Lands were at war with themselves again."
 zin_chr_514_p1:0 "In 4A 1716 Lerendor's envoys came to Parim over a disputed toll and were humiliated before the court. The toll was a small matter and the insult was not, so the Leren court began to doubt the Treaty of the Narrow Strait, under which the North Lands must defend Aenor in war.\n\nThe Leren court has resented Aenor ever since. In Sonargur men ask what an old alliance is worth when its partner in Parim treats Leren envoys like toll-clerks, and the question is put over wine more often than the Treaty is toasted."
 zin_chr_514_plate:0 "GFX_zin_chr_plate_toll_quarrel"
 zin_chr_514_short:0 "The Toll Quarrel"
 zin_chr_514_sub:0 "Fourth Age · Quarrel"
 zin_chr_514_title:0 "The Toll Quarrel"
 zin_chr_514_x1_p1:0 "The quarrel became a breach. Lerendor withdrew from the Treaty of the Narrow Strait, and the old alliance of the North no longer bound the Leren crown to Aenor's defence."
 zin_chr_515_p1:0 "The Golden King was crowned in 4A 1729 and sold offices within the year. He is greedy, extravagant and deeply concerned with his own grandeur: he hoards treasure, sells offices and favours those who flatter him. No chronicle gives his own name, and Aenor knows him only as the Golden King.\n\nIn 4A 1733 the Golden Court was completed in Parim, a palace district of gilded halls where offices, titles and charters are bought. The dominions whose taxes pay for the gilding grumble at it."
 zin_chr_515_p2:0 "Aenor still works, because the courts, temples and offices that earlier generations built are strong, and the kingdom the Golden King inherited was flourishing. In 4A 1748 he is in the nineteenth year of his reign, and the wits of Parim say that his worst crime is his taste in gold leaf.\n\nIn 4A 1741 he founded the Lost Cause, a league against the powers of the dark, named himself its first lord and spent its first treasury on a triumph."
 zin_chr_515_plate:0 "GFX_zin_chr_plate_gilded_years"
 zin_chr_515_short:0 "The Gilded Years"
 zin_chr_515_sub:0 "Fourth Age · Reign"
 zin_chr_515_title:0 "The Gilded Years"
 zin_chr_516_p1:0 "In 4A 1736 a Mirolonese envoy warned Parim that the Ember Lands were arming. The court laughed, because Volgan had been quiet for longer than Aenor had had kings.\n\nMirolon, the human kingdom that Volgan conquered in the First Age, is free again and stands in his way, and its scouts still watch the passes and count the dust on the southern roads. Nobody outside Mirolon takes their reports seriously, and the courts of the north think Volgan a spent legend."
 zin_chr_516_p2:0 "In 4A 1744 island fishermen told of black ships among the islands of the Kusmeel, the grave-sea north of Zol's Mistake. Nobody in a royal court believed them. The fishermen tell it still, and some of them will not put in at a black island for any price."
 zin_chr_516_plate:0 "GFX_zin_chr_plate_voices_at_edges"
 zin_chr_516_short:0 "Voices at the Edges"
 zin_chr_516_sub:0 "Fourth Age · Rumour"
 zin_chr_516_title:0 "Voices at the Edges"
 zin_chr_517_p1:0 "In 4A 1746 Afrit's Hidden Council met in secret and concluded that the Golden King had become a liability. The dominions grumbled at his taxes, and the Lost Cause he had founded could become a rival centre of power in the hands of anyone who took it seriously.\n\nAfrit decided that the time had come to stop ruling through human kings. Preparations for the King's death began, known only to the Council, and its design was to make the succession a crisis that no ordinary claimant could settle, so that the temples could proclaim Aurevan the one protector whose blessing had preserved the kingdom for centuries."
 zin_chr_517_p2:0 "Outside the Council nobody knows. In 4A 1748 the Golden King still feasts in his gilded halls, the temples still bless him, and the Council's servants still carry out his orders as faithfully as they ever did."
 zin_chr_517_plate:0 "GFX_zin_chr_plate_cat_fourth_age"
 zin_chr_517_short:0 "The Council's Decision"
 zin_chr_517_sub:0 "Fourth Age · Secret"
 zin_chr_517_title:0 "The Council's Decision"
 zin_chr_518_p1:0 "On 1 Lumae 4A 1748 Aoaz has known peace for more than seventeen centuries, and almost nobody alive remembers a war that threatened everyone at once. Nobody is at war with anybody who matters. The borders are quiet, trade flows and the temples are full, and the Golden King, in the nineteenth year of his reign, is thought to have no worse fault than his taste in gold leaf."
 zin_chr_518_p2:0 "Some three hundred crowns, dominions, clans and island lordships divide the continent. The great powers are Aenor and its Concord in the Middle Lands, Lerendor in the North Lands, Coldor in the Cold Lands, Noris and Stabilo in the East Lands, Goldoroth and Dondor in the Dark Lands, Volgan in the Ember Lands, and Zol's Mistake in the black north."
 zin_chr_518_p3:0 "In the Magical Lands the elves keep their old separation behind the Great Wall, and pilgrims climb to the Worshipdom in the Zilin Hills. In the Cold Lands, the largest and least known land of Aoaz, tribes, yeti, giants and free towns live by trade, herding and hunting. In the far south-west the Sunhot elves keep their many small realms in peace, and among them the Gala elves keep their ancient court under King Lorien."
 zin_chr_518_p4:0 "The West Lands are divided and at peace under the Truce of the Grey Ford. The island lordships fish and chart and now and then rob one another, the East Lands count their caravan money, and the Islands of the South are small, poor and hospitable. In Parim the scholars who keep these histories have little to write beyond the ordinary quarrels of courts."
 zin_chr_518_plate:0 "GFX_zin_chr_plate_aoaz_1748"
 zin_chr_518_short:0 "Aoaz in 4A 1748"
 zin_chr_518_sub:0 "Fourth Age · The Present Year"
 zin_chr_518_title:0 "Aoaz in 4A 1748"
 zin_chr_601_p1:0 "Far to the north-west of the Cold Lands, beyond most of Aenor's knowledge, ancient ice released a man who had slept through kingdoms and ages. Cold Lands tribes found him alive where no unprotected traveller could have survived. They fed him and sheltered him.\n\nHe remembered almost nothing of his former life, and his name was not clear even to himself. He had extraordinary strength, quickness and endurance. What set him apart was his unwillingness to misuse them."
 zin_chr_601_p2:0 "People began to give him names, and among them was the Man from the Ice. No chronicle tells where he came from, how he came to lie in the ice, or for how long he lay there."
 zin_chr_601_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_601_short:0 "The Man from the Ice"
 zin_chr_601_sub:0 "Fourth Age · Event"
 zin_chr_601_title:0 "The Man from the Ice"
 zin_chr_601_x1_p1:0 "In time the tribes entrusted him to western travellers on the traders' road south. In the West Lands villagers remembered him carrying survivors out of floodwaters, restraining raiders without slaughtering their captives, and settling disputes that their lords had allowed to grow into blood feuds."
 zin_chr_602_p1:0 "The stranger's road through the West Lands ran by the Bridge of the Three Oaths, Girdon's Winter Ford and the courts of Gunwaith, and at each the tale of him grew. Western courts heard that he did not ask to stand above the law of the lands he crossed.\n\nEvery western court remembered that Aenor had once tried to rule them, and the old quarrel of the Grey Ford between Gunwaith and Girdon was never far from war. When it threatened the peace again, several western rulers who could not keep the peace alone chose the stranger as their temporary war-king."
 zin_chr_602_p2:0 "He accepted only to end the conflict, and laid the title down when his work was done. So the West remembers him as a king without leaving any lasting kingdom behind him, and people began to call him the King Without a House."
 zin_chr_602_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_602_short:0 "The King Without a House"
 zin_chr_602_sub:0 "Fourth Age · Event"
 zin_chr_602_title:0 "The King Without a House"
 zin_chr_603_p1:0 "The Golden King ascended the throne of Aenor late in the age. He was greedy, extravagant and deeply concerned with his own grandeur. He hoarded treasure, sold offices and favoured those who flattered him. Aenor went on working because the institutions of earlier generations were strong.\n\nHe founded the Lost Cause, a league meant to guard the kingdom against the return of dark powers. Its councils and alliances were real, but its founder used it for prestige, and his corruption weakened trust in it. Some of its officers became true defenders of Aenor."
 zin_chr_603_p2:0 "Then the Golden King died. His death left the throne of Parim empty and opened a contest for the crown. No chronicle gives his own name."
 zin_chr_603_plate:0 "GFX_zin_chr_plate_golden_king_dies"
 zin_chr_603_short:0 "The Death of the Golden King"
 zin_chr_603_sub:0 "Fourth Age · Event"
 zin_chr_603_title:0 "The Death of the Golden King"
 zin_chr_603_x1_p1:0 "The King did not die by chance. Afrit had decided that the time had come to stop ruling through human kings. He arranged the Golden King's death and hid his own part in it, and his agents presented the succession as a crisis that no ordinary claimant could resolve."
 zin_chr_604_p1:0 "The Golden King did not die when his enemies meant him to. A plot against his life was found out before it could strike. Those who uncovered it pointed to a circle at the heart of the King's own court and to men in temple robes.\n\nThe court of Parim was shaken. The King, who had left the work of ruling to those around his throne, learned that some of them had wanted him dead. From that day the quarrel over Aenor was no longer about who would succeed him, but about who had tried to hasten his end."
 zin_chr_604_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_604_short:0 "The Plot Against the King"
 zin_chr_604_sub:0 "Fourth Age · Event"
 zin_chr_604_title:0 "The Plot Against the King"
 zin_chr_604_x1_p1:0 "The King lived. Those who had plotted against him rose in arms or scattered, and when it was over the Golden King still held his throne. The war of succession that might have torn Aenor apart never came."
 zin_chr_604_x2_p1:0 "The plot had been Afrit's. Through his Hidden Council, which governed much of Aenor behind the throne, he had prepared the King's death so that he could take the crown for himself. Its exposure struck at the Council's work before that work was done."
 zin_chr_605_p1:0 "After the Golden King's death, temple authorities proclaimed the Deliverer, Aurevan, the one protector whose blessing had preserved the kingdom for centuries. Members of the royal council gave him the seals of the realm. Military commanders swore obedience, many sincerely believing that they were preventing another civil war.\n\nAurevan accepted the crown and declared himself King of Aenor, First of His Name, and New God of Men, adding other titles gathered through his worship. Most of the capital celebrated. Much of the kingdom obeyed."
 zin_chr_605_p2:0 "There were dissenters, rival claimants and scholars who questioned his descent, and those judged dangerous were quickly silenced. It was possible to praise him freely, to serve him from fear, and still to remember the freedom of earlier kings. These answers lived side by side."
 zin_chr_605_plate:0 "GFX_zin_chr_plate_deliverer_crowned"
 zin_chr_605_short:0 "The Deliverer Crowned"
 zin_chr_605_sub:0 "Fourth Age · Event"
 zin_chr_605_title:0 "The Deliverer Crowned"
 zin_chr_605_x1_p1:0 "The god-king of Parim was Afrit. In private the new king let his demonic form show more and more often, while the people still saw the familiar figure of the Deliverer. Only his inner council called him by his true name.\n\nFor centuries his people had governed Aenor through kings who wore the crown while its true ruler was elsewhere. With the Golden King's death Afrit stopped ruling through human kings and took the throne openly, and many people worshipped him on it."
 zin_chr_606_p1:0 "The stranger wanted to learn who he was. Stories and broken genealogies pointed him toward the First Men and the old kingdom across the great central sea. He set sail for Aenor, but a violent run of storms and unfamiliar currents carried his ship far to the south.\n\nAfter wreck and hardship he reached the Islands of the South and lived among their people. He helped them settle disputes and survive dangers of their own, and he heard tales of the long-lived elves who dwelt farther to the south-west."
 zin_chr_606_p2:0 "On one island the fisherfolk would not cross a reef at night, for drowned voices were said to call ships onto the rocks. The stranger brought back children stranded there in a storm. The islanders said afterwards that the sea had gone silent when he carried them ashore.\n\nFarther south a ruined shrine stood beneath the tide. In it he found an inscription naming Aen, which the island priests had repeated for generations without understanding it. Neither wonder told him who he was, but each made his search harder to abandon."
 zin_chr_606_p3:0 "Among the islanders went a saying that when the tales of men grew too old for any man to explain, they should be carried to Gala. So the stranger travelled on to the Lands of the Sun."
 zin_chr_606_plate:0 "GFX_zin_chr_plate_storm_voyage"
 zin_chr_606_short:0 "The Storm and the Islands"
 zin_chr_606_sub:0 "Fourth Age · Event"
 zin_chr_606_title:0 "The Storm and the Islands"
 zin_chr_607_p1:0 "The Gala elves were among the few peoples whose rulers still remembered the time of Dardan. Their king, Lorien, received the stranger from the Islands of the South and spoke with him for weeks. He told him of the War of Men, Aen's unnatural birth, the founding of Aenor, the long peace, Dardan and the death of Elzon.\n\nThe stranger learned how small his own memories were against the age of the world. Lorien recognised in him the signs of the First Men, but would not name him on strength alone."
 zin_chr_607_p2:0 "Lorien led him to the Mirror of First Rain, a spring enclosed in an old elven courtyard. Its water shows no certain future. It shows true traces of the past, and possible futures to those brave enough to look without demanding certainty. In it Lorien saw the old royal line and knew the stranger: Eindil, son of Ein, son of Aen.\n\nEindil saw a burning capital, armies from west and east, death moving from the north, Volgan's strength renewed, and himself carrying a shard of broken blue metal against a darkness almost beyond understanding. Lorien warned him that prophecies can frighten people into the very deeds they foretell."
 zin_chr_607_p3:0 "Lorien sent him north to the Castle of Yeldenne in the Cold Lands, where the guardian Horos kept Glo, a crystal of old and holy power said to hold a portion of the power of Glernaen, the New God of Power and Wisdom. Aenor could not be saved by strength alone. Lorien gave him a ship and a fine sword for the voyage."
 zin_chr_607_plate:0 "GFX_zin_chr_plate_naming_at_gala"
 zin_chr_607_short:0 "The Naming at Gala"
 zin_chr_607_sub:0 "Fourth Age · Event"
 zin_chr_607_title:0 "The Naming at Gala"
 zin_chr_608_p1:0 "The Castle of Yeldenne stood cold and almost silent in the Cold Lands. In its hall the Great Spirit Horos sat between stone pillars: an immense knight in yellow-green armour, with a blue blade, dark branching edges to his helm, and blue eyes that showed in its shadow. Through the ages he had guarded Glo and refused every claimant who sought it for conquest.\n\nGlo was no ornament of the throne. It was the living crystal at the heart of Horos's own being, and it held part of the power of Glernaen, a true New God of Power and Wisdom."
 zin_chr_608_p2:0 "Horos is dead. The guardian who had outlasted the ages died in his own hall, and the throne of Yeldenne stands empty. The Man from the Ice came to that hall in the north, and from there he went south again."
 zin_chr_608_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_608_short:0 "The Hall of Horos"
 zin_chr_608_sub:0 "Fourth Age · Event"
 zin_chr_608_title:0 "The Ambush and the Hall of Horos"
 zin_chr_608_x1_p1:0 "An ambush met the company of the Man from the Ice after it came ashore, and he went on alone across the snow. A crowned stranger from the south who came for Glo had reached the hall before him. When he gave himself grand titles, Horos answered: “Those are the names you have taken. I asked who walks here.” He bade the intruder depart, and the intruder attacked."
 zin_chr_608_x1_p2:0 "Horos seized him by the throat and raised him from the ground. At that moment the Man from the Ice entered the hall. The intruder passed behind the guardian and drove a blade beneath his helm into his neck. The Man from the Ice ran him through, and he fled bleeding. Dying, Horos took Glo from his breast, placed it in the stranger's hands with his blue sword, and turned to dust."
 zin_chr_608_x2_p1:0 "The intruder was Afrit, wearing the outward form of the Deliverer and carrying the Necklace of the Abyss and his gathered artifacts. Horos knew him at once: “Afrit, son of Ein. I know why your father denied you.” Struck by Eindil, Afrit bled openly for the first time in many years, his divine show broken by the castle's protections, and escaped through a last opening into his private refuge."
 zin_chr_608_x2_p2:0 "Before he died, Horos told Eindil the hidden history of the two sons of Ein: Afrit had once betrayed his brother over the inheritance their father denied him. Eindil left the empty castle with Glo, the blue sword, and the knowledge that the Deliverer whom Aenor adored was his own brother."
 zin_chr_609_p1:0 "The stranger came ashore in the Middle Lands and tried to warn their people. He spoke of dangers he could now read in reports from across the world: Volgan rebuilding his armies, death stirring in Zol's Mistake, western kingdoms planning a great crossing, northern rulers drawing back from their treaties, and eastern coalitions preparing to invade the Middle Lands and the Magical Lands.\n\nThe North Lands were not one enemy, and the eastern states were not all united. Each region held rulers with motives of their own, but enough forces were moving at once to threaten Aenor's survival."
 zin_chr_609_p2:0 "Some men believed him, above all frontier troops, scholars of the First Men and branches of the Lost Cause. Alleria of Selen, a ranger famed as an archer, looked into his story. Most of the court would not hear him. He did not try to seize a crown by force. He wanted men to unite before the invasion began."
 zin_chr_609_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_609_short:0 "The Unheeded Warnings"
 zin_chr_609_sub:0 "Fourth Age · Event"
 zin_chr_609_title:0 "The Unheeded Warnings"
 zin_chr_609_x1_p1:0 "In the squares and halls where he spoke he gave his name: Eindil, son of Ein, son of Aen. So the courts of Aoaz first heard it, from the man himself."
 zin_chr_609_x2_p1:0 "Word went out that the stranger was a foreign impostor, a traitor and a threat to the peace. The people knew the Deliverer as their divine guardian, and very few wished to hear a wanderer speak against the order of the realm. Men were sent to hunt him."
 zin_chr_610_p1:0 "The War of the Last Crowns is the name the scholars give to the great war that closed the Fourth Age. It was not a single attack on one day. It was many wars that overlapped, as crowns armed on every shore.\n\nAfter more than a thousand years of peace, almost nobody alive remembered a war that threatened everyone at once. The living kingdoms found their old alliances weak and their old grudges strong. Each front had its own causes and its own masters, and none of the powers could see them all."
 zin_chr_610_p2:0 "At the centre stood Aenor, rich and strong after its long peace, whose crown every power coveted or feared."
 zin_chr_610_plate:0 "GFX_zin_chr_plate_last_crowns"
 zin_chr_610_short:0 "The Last Crowns"
 zin_chr_610_sub:0 "Fourth Age · War"
 zin_chr_610_title:0 "The War of the Last Crowns"
 zin_chr_611_p1:0 "From the west, fleets crossed the wide central sea. Some western kings sought revenge for Aenor's ancient conquests. Others wanted to take the capital before a weakened kingdom could threaten them again. The western army landed and seized ports on the shores of the Middle Lands.\n\nThe West Lands had been divided, and in the years before the war their kingdoms were at peace with one another. Every western court remembered that Aenor had once tried to rule them, and against Aenor they sailed together."
 zin_chr_611_plate:0 "GFX_zin_chr_plate_western_crossing"
 zin_chr_611_short:0 "The Western Crossing"
 zin_chr_611_sub:0 "Fourth Age · War"
 zin_chr_611_title:0 "The Western Crossing"
 zin_chr_611_x1_p1:0 "The western army occupied Aenor's capital and claimed the human throne. Western commanders accepted surrenders and expected to keep their conquest."
 zin_chr_611_x2_p1:0 "The conquest could not be held. The western fleet made ready to carry its armies home. Some soldiers escaped. Others were left stranded on the far shore, among the people they had come to conquer."
 zin_chr_612_p1:0 "From the north, rulers of the North Lands withdrew from their alliances with Aenor. Lerendor left the Treaty of the Narrow Strait, the old alliance under which the North Lands were bound to defend Aenor in war.\n\nThe North Lands were not one unanimous enemy. Lerendor's kings were proud, its fleets guarded the strait, and its court had resented Aenor since the toll quarrel of 4A 1716. The smaller northern crowns looked to Lerendor or to Parim as it suited them."
 zin_chr_612_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_612_short:0 "The North Stands Apart"
 zin_chr_612_sub:0 "Fourth Age · War"
 zin_chr_612_title:0 "The North Stands Apart"
 zin_chr_613_p1:0 "From the south, Volgan came out of the Ember Lands and marched north with an army greater than any seen since the First Age. He had rebuilt his strength for a century behind the storms and heat of the Ember Lands, while the courts of the north thought him a spent legend.\n\nHe commanded creatures, Great Spirits, demons and vast war hosts. These forces had gathered for centuries while he recovered from his exile after Dardan. The independent Dark Lands were not all his, but his agents courted every one of them."
 zin_chr_613_plate:0 "GFX_zin_chr_plate_volgan_marches"
 zin_chr_613_short:0 "Volgan Marches North"
 zin_chr_613_sub:0 "Fourth Age · War"
 zin_chr_613_title:0 "Volgan Marches North"
 zin_chr_613_x1_p1:0 "Mirolon stood first in his way: the human kingdom that Volgan had conquered in the First Age, long since free again. It fell, and Volgan held Mirolon once more."
 zin_chr_614_p1:0 "From the east, a coalition of eastern crowns crossed seas and mountain approaches to threaten the Magical Lands and the Middle Kingdom. Their commanders expected wealth, land, revenge, or deliverance from the troubles of their own rulers.\n\nThe East Lands are the richest region of Aoaz and the most divided. Not every eastern crown joined the host, and some went on fighting one another for the caravan roads."
 zin_chr_614_p2:0 "In its path lay the elves of the Magical Lands, whom not even Elzon had conquered."
 zin_chr_614_plate:0 "GFX_zin_chr_plate_host_from_east"
 zin_chr_614_short:0 "The Host from the East"
 zin_chr_614_sub:0 "Fourth Age · War"
 zin_chr_614_title:0 "The Host from the East"
 zin_chr_615_p1:0 "From the black north, the dead of Zol's Mistake moved out through the islands and straits of the Kusmeel toward the settled kingdoms. Before the war, only fishermen had seen them stir, and nobody believed them.\n\nZol's dead were unlike the raised corpses of Elzon, which needed his continuing magic to stand. They were death-bound beings sustained by the Old God's own magic. Ordinary weapons could break their shapes but could not end their existence. Only potent magic could truly destroy them."
 zin_chr_615_p2:0 "Zol is the only Old God present in Aoaz, the God of Death. He takes no ordinary body, and he did not walk among his dead."
 zin_chr_615_plate:0 "GFX_zin_chr_plate_dead_of_mistake"
 zin_chr_615_short:0 "The Dead of the Mistake"
 zin_chr_615_sub:0 "Fourth Age · War"
 zin_chr_615_title:0 "The Dead of the Mistake"
 zin_chr_615_x1_p1:0 "As the living armies turned on one another, the dead of Zol collided with the hosts of Volgan. The two ancient powers had settled on no common command. For a time each destroyed the other's servants, while the mortal kingdoms were crushed between them."
 zin_chr_616_p1:0 "The Deliverer, the god whom Aenor had loved for ages, was Afrit. Most of his worshippers had known him as Aurevan the Deliverer. The name Afrit had belonged to his inner council, his enemies and certain beings of the spirit world.\n\nAfrit had been a man of the old blood of the First Men. He sought dominion through corruption, demonic magic, bargains, worship and artifacts, and his demonic form grew over time. It was an acquired state, not proof that he was made a demon. Beneath his protections he was still a mortal man who could bleed, suffer and die."
 zin_chr_616_p2:0 "His works ran through the ages. In the First Age he secretly gathered demons and other beings who helped oppose Volgan at Dardan. In the Second Age he gained worship, networks and power. When Elzon fell he helped protect the people, and they began to call him a New God who had saved them.\n\nFor most of the Fourth Age he governed Aenor indirectly, through priests, schools, houses of relief, councillors and kings who served his wishes. The kingdom prospered while its freedom was slowly lost."
 zin_chr_616_p3:0 "Whether he was ever a true New God is not known. Public worship does not by itself make him one of the New Gods made by the Holy Seven. His worship keeps a feast in his honour, not a month, for the twelve months honour the twelve main New Gods."
 zin_chr_616_plate:0 "GFX_zin_chr_plate_name_of_afrit"
 zin_chr_616_short:0 "The Name of Afrit"
 zin_chr_616_sub:0 "Fourth Age · Revelation"
 zin_chr_616_title:0 "The Name of Afrit"
 zin_chr_616_x1_p1:0 "Afrit was a son of Ein and a grandson of Aen, and the brother of Eindil; the two were born at about the same time. Their father denied Afrit the throne of men, and Afrit betrayed his brother. Why Ein refused him, and how the betrayal was done, no chronicle tells."
 zin_chr_617_p1:0 "Afrit looked at the attacks converging on Aenor and decided that the kingdom could no longer serve his ambitions. He abandoned the realm he had claimed to protect. His council and prepared agents helped him move east.\n\nThrough his council he had courted the eastern courts for four centuries, as a reserve against the loss of Aenor. Now he used that influence over several rulers and took command of an eastern dominion. He meant to rule there if the Middle Kingdom fell."
 zin_chr_617_p2:0 "Afrit and his allies proclaimed him King of the East. The title was larger than the truth: many states of the East Lands still resisted him."
 zin_chr_617_plate:0 "GFX_zin_chr_plate_king_of_east"
 zin_chr_617_short:0 "The King of the East"
 zin_chr_617_sub:0 "Fourth Age · Event"
 zin_chr_617_title:0 "The King of the East"
 zin_chr_618_p1:0 "Eindil returned to the main battlefield of the Middle Lands riding a dragon. With him came Varner, the Lesser Spirit wizard who had helped end Elzon's reign, and Golbran, Varner's small purple servant of unknown origin.\n\nThe dragon had been entrusted to him by the elves of the Magical Lands, whose ancient bond with the dragons made such a pact possible. It was a free ally, not a beast brought under the rule of men."
 zin_chr_618_p2:0 "The witnesses knew him from rumour, from his warnings and from the stories of the West. Those who would fight beside him joined in one coalition for one purpose: to save what remained of the free lands. He took command without demanding that any kingdom give up its independence."
 zin_chr_618_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_618_short:0 "The Return on the Dragon"
 zin_chr_618_sub:0 "Fourth Age · War"
 zin_chr_618_title:0 "The Return on the Dragon"
 zin_chr_618_x1_p1:0 "Eindil leapt from the dragon's back and struck the earth with Horos's blue sword. Glo released a wave of Glernaen's power across the ground and broke the magic that sustained a whole front of Zol's dead. Thousands fell in moments. Where ordinary soldiers had struck again and again for nothing, the sword ended these beings for good."
 zin_chr_619_p1:0 "Varner stood against the darkness rolling down from Zol's armies. He lifted curses, opened ways of escape and preserved as many living souls as he could. The effort cost him his life.\n\nGolbran spent almost all of his own magic holding up Varner's last wards, and collapsed. Those who saw him fall thought him dead."
 zin_chr_619_p2:0 "Varner was a wise wizard of the Magical Lands and a Lesser Spirit in the form of an old man. Through the long Third Age he had helped elves and men withstand Elzon's necromancy. His last defence won the time on which the living depended."
 zin_chr_619_plate:0 "GFX_zin_chr_plate_varners_ward"
 zin_chr_619_short:0 "Varner's Last Ward"
 zin_chr_619_sub:0 "Fourth Age · War"
 zin_chr_619_title:0 "Varner's Last Ward"
 zin_chr_619_x1_p1:0 "Volgan himself appeared at the southern front, and a blast of his magic struck Eindil to the ground. The Great Spirit looked across the ranks of men who stood together against him and asked why this time should be different. “Because these men have chosen to stand together while there is still something left to save,” Eindil answered. “Then I will bury them together,” said Volgan."
 zin_chr_619_x1_p2:0 "Eindil shattered Volgan's advance guard and cut through enchantments that had ruined whole companies. But the Great Spirit turned the earth itself against him and struck through his protections. Eindil learned how much of the power at Dardan had needed a whole alliance of spirits. Volgan cast him down, gravely wounded."
 zin_chr_620_p1:0 "Struck down by Volgan, Eindil's spirit reached a realm of the gods, which he understood as Heaven. The New Gods gathered around him. Glo, the crystal of Glernaen, was the bridge that made the meeting possible. The gods knew that a descendant of Aen had tried to unite the divided peoples of Aoaz without claiming dominion over them."
 zin_chr_620_p2:0 "Eindil could not see every god clearly. One came as a lamp that had never gone out, and spoke of the common people he had protected on his travels. Another came as rain over ploughed fields, and remembered Aenor's long centuries of hunger. Others spoke of promises kept, wars prevented, and those whom kings had forgotten. Their names and domains are not written.\n\nLast came Glernaen, the New God of Power and Wisdom, whose voice Eindil knew from the living crystal. Glernaen recalled that he had made peace in the West and left its crown behind, and asked: “Tell us now, son of Ein, what will you do if you rise?” “I will return to them,” Eindil said."
 zin_chr_620_p3:0 "The New Gods could not stay in Aoaz to fight the war themselves; its magic and the limits between the realms of the gods held them back. Instead each offered a measured part of their power through Glo. They restored Eindil to life and renewed his armour. His eyes shone with lightning, and the sword of Horos blazed as it never had in the old guardian's hand.\n\nIt was a single gift, given because Glo already carried Glernaen's power and because Eindil freely took up the burden. It made him mighty, but not beyond harm, and not equal to an Old God. Glernaen had warned him that he might yet fall, and that the gods could not promise to raise him again."
 zin_chr_620_plate:0 "GFX_zin_chr_plate_new_gods_gather"
 zin_chr_620_short:0 "Gathering of the Gods"
 zin_chr_620_sub:0 "Fourth Age · Wonder"
 zin_chr_620_title:0 "The Gathering of the New Gods"
 zin_chr_621_p1:0 "Eindil returned to the battlefield and broke the southern host. He destroyed the commanders and the works of sorcery on which Volgan's army depended, then faced the Great Spirit again.\n\nThis time Volgan could not withstand him. Eindil drove the blue sword through him, and the Great Spirit's visible body broke apart. A violent burst of magic shattered much of the command of his host. His servants screamed and fled, and some of the bonds that held the southern army together gave way."
 zin_chr_621_p2:0 "Volgan's manifested body is destroyed. What remains of Volgan, no one living can say. Whether his spirit survives is not known."
 zin_chr_621_plate:0 "GFX_zin_chr_plate_breaking_volgan"
 zin_chr_621_short:0 "The Breaking of Volgan"
 zin_chr_621_sub:0 "Fourth Age · War"
 zin_chr_621_title:0 "The Breaking of Volgan"
 zin_chr_621_x1_p1:0 "Before the end, Volgan had joined his surviving forces to those of Zol in a brief compact against Eindil and the remaining kingdoms, which the scholars call the Black Compact. The two dark powers never settled on a common command, and the compact did not outlast the breaking of Volgan's body."
 zin_chr_622_p1:0 "Zol's most loyal servant came forth: Kusven, whose name in Leren means the grave-wind. He is a Great Spirit whom Zol made, and a being of his own. He is feared by all. He feeds on souls, covets all of Aoaz, and dwells in Šodolôro in Zol's Mistake.\n\nZol himself did not take the field. He took no body in the war, and his servant carried his power onto the battlefield. Why the Old God stayed away, no chronicle tells."
 zin_chr_622_plate:0 "GFX_zin_chr_plate_black_sky"
 zin_chr_622_short:0 "Beneath the Black Sky"
 zin_chr_622_sub:0 "Fourth Age · War"
 zin_chr_622_title:0 "The Servant Beneath the Black Sky"
 zin_chr_622_x1_p1:0 "Eindil charged. The servant stopped him with one finger, took Horos's sword and crushed it into glittering shards. He seized Eindil by the throat and began to draw the power out of him, and the light in Eindil's armour dimmed.\n\nWith his remaining strength Eindil caught a shard of the broken blade and drove it into the servant. The shard still carried Glernaen's power through Glo. It did not kill him, but loosened his hold on the power he carried. A storm swept across Aoaz and the sky darkened. The servant struck back, and Eindil fell, gravely wounded."
 zin_chr_622_x2_p1:0 "At last Lorien came with Gala elves and some of the great lords and spirits who had lived through the long history since Dardan. They had not come to restore an Aenoran empire. They came because a victory for the servant of the Old God would destroy the freedom of the living, elves and men alike.\n\nThe oldest warriors spent the last of their own power holding the black presence back. Several great spirits were destroyed or broken. Lorien challenged the servant directly and died in the struggle."
 zin_chr_622_x3_p1:0 "Kusven withdrew into the darkness of Zol's domain, leaving a vast wasteland behind him. He was not destroyed. Zol's remaining hosts lost their hold on the field or drew back with him. What the war cost him is not known."
 zin_chr_623_p1:0 "Afrit returned from the East with a new eastern host. He believed that the wounds of the war had at last left Eindil weak enough, and he demanded that the exhausted kingdoms recognise him as ruler of both the East and the Middle Lands.\n\nThe two brothers met in the fighting near a high cliff. Afrit severed Eindil's arm and drove a blade through his body. He told him that he had hated him since their father's refusal. Then he cast him over the edge and believed him dead."
 zin_chr_623_plate:0 "GFX_zin_chr_plate_second_betrayal"
 zin_chr_623_short:0 "The Second Betrayal"
 zin_chr_623_sub:0 "Fourth Age · War"
 zin_chr_623_title:0 "The Second Betrayal"
 zin_chr_623_x1_p1:0 "With Eindil gone, Afrit seized the capital once more. He proclaimed himself king over Aenor, the East Lands and at last every people of Aoaz. The claim was larger than the land he held, but his army and his court treated it as a claim to all. His old council took up its work again, and those who opposed him were punished."
 zin_chr_623_x2_p1:0 "Eindil had not died. How he lived is not known. Alleria of Selen and her scouts found him and carried him into hiding, and he recovered slowly through care and time and what strength remained to him. Afrit had not searched below the cliff, for he had seen a mortal body fall from a height no man could survive."
 zin_chr_624_p1:0 "Afrit is dead. The man who had been worshipped as the god of men, and who had ruled Aenor from behind its throne and then from upon it, died without his miracles. His death was a true death. No divine incarnation of him survived it.\n\nStripped of the magic and the enchanted objects that sustained him, Afrit was what he had always been beneath them: a mortal man of the line of the First Men, who could bleed and die."
 zin_chr_624_plate:0 "GFX_zin_chr_plate_palace_battle"
 zin_chr_624_short:0 "The Battle in the Palace"
 zin_chr_624_sub:0 "Fourth Age · War"
 zin_chr_624_title:0 "The Battle in the Palace"
 zin_chr_624_x1_p1:0 "Eindil entered the royal palace in battered armour, missing an arm, with a simpler sword in his hand. He fought for openings rather than power. Alleria of Selen shot an arrow into Afrit's eye, and Eindil cut off a finger and tore away the Ring of Doors. The palace rebels destroyed the seals that fed the Crown of Witnesses, and Eindil broke the Bracelet of the First Seal with Afrit's own turned spell."
 zin_chr_624_x1_p2:0 "When only the Necklace of the Abyss remained, Afrit fled through a hidden passage, and Eindil, gripping its chain, was carried with him. There Afrit beat him to the floor. But Golbran, who had lived through Varner's last stand, had followed through the same opening. He tore the Necklace from Afrit's neck, and Eindil cut his brother's throat."
 zin_chr_624_x2_p1:0 "Eindil himself was dying. Golbran gave the last of his life and magic to close his most dangerous wounds, and the small one died beside the two brothers. His origin was never learned.\n\nAlone, Eindil put the Necklace of the Abyss around his own neck and through it returned from Afrit's realm to the palace, carrying the proof of the false king's fall and an artifact of unresolved danger."
 zin_chr_625_p1:0 "Eindil was crowned King of Aenor. His claim came from his descent as son of Ein and grandson of Aen, but his people also knew what he had done to reach that day.\n\nSurvivors whose banners had lately faced one another across battle lines attended the coronation. Among the witnesses were envoys, wounded soldiers and families still searching for those who would never come home. The ceremony did not erase their grievances."
 zin_chr_625_p2:0 "With his coronation the Fourth Age ended. A rightful king had returned, but peace could not be taken for granted because of it."
 zin_chr_625_plate:0 "GFX_zin_chr_plate_king_of_men"
 zin_chr_625_short:0 "The King of Men"
 zin_chr_625_sub:0 "Fourth Age · Event"
 zin_chr_625_title:0 "The King of Men"
 zin_chr_625_x1_p1:0 "Among the deeds his people remembered was the last: he had destroyed Afrit, the brother who had stolen his future."
 zin_chr_626_p1:0 "Eindil inherited a kingdom worn by war, a capital that needed rebuilding and an exhausted army. The victory did not by itself restore the prosperity or the alliances of the thousand years before it.\n\nThe West Lands, the North Lands, the East Lands and the other free regions kept their own claims and grievances, whatever help they had given in the war. The kingdoms that remained would need treaties, not forced submission.\n\nZol remains an Old God. The Fading constrains him, but he was not slain."
 zin_chr_626_p2:0 "The form, the name and the promises of the age that followed are not yet written."
 zin_chr_626_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_626_short:0 "After the Coronation"
 zin_chr_626_sub:0 "Fourth Age · Event"
 zin_chr_626_title:0 "After the Coronation"
 zin_chr_626_x1_p1:0 "The victories had been costly. Varner, Horos, Golbran and Lorien were dead."
 zin_chr_626_x2_p1:0 "Volgan's visible form had been destroyed, but what remained of his spirit no one living could say."
 zin_chr_626_x3_p1:0 "Roka's Necklace of the Abyss remained in human hands, around the king's own neck. What wearing it would mean for him, no one could yet say."
 zin_chr_627_p1:0 "The Lost Cause prevailed. Under Eindil it became a settlement that sought peace and refused imperial domination.\n\nIt was no longer the Golden King's league, raised for his prestige. Its frontier companies, rangers and scholars had become the shield of the living, and the crowns that stood with it kept their freedom."
 zin_chr_627_plate:0 "GFX_zin_chr_plate_ending_lost_cause"
 zin_chr_627_short:0 "The Lost Cause Prevails"
 zin_chr_627_sub:0 "Fourth Age · Ending"
 zin_chr_627_title:0 "The Lost Cause Prevails"
 zin_chr_627_x1_p1:0 "So ends this chronicle of the Fourth Age. The scholars of Parim and Selen set down that the last crowns of the age did not fall into one hand, and that the king who might have ruled them all chose to stand among them."
 zin_chr_628_p1:0 "Volgan prevailed. From the Ember Lands he came to dominate a ruined world through armies of monsters, grave hosts and client crowns.\n\nHe rose as a Great Spirit, not as a god of the New or of the Old. Parim itself answered to Nafeher, and the crowns that remained knelt to him or waited for their turn."
 zin_chr_628_plate:0 "GFX_zin_chr_plate_ending_children"
 zin_chr_628_short:0 "The Children of Volgan"
 zin_chr_628_sub:0 "Fourth Age · Ending"
 zin_chr_628_title:0 "The Children of Volgan"
 zin_chr_628_x1_p1:0 "So ends this chronicle of the Fourth Age. Its last pages were written in hiding, by scholars who set down that the children of Volgan held the lands where the kingdoms of men had stood."
 zin_chr_629_p1:0 "The Ashen Throne was raised in Parim. The god-king who held it ruled through worship, bargains, corruption and the captured institutions of the world, and the crowns of Aoaz bent to him."
 zin_chr_629_plate:0 "GFX_zin_chr_plate_ending_ashen"
 zin_chr_629_short:0 "The Ashen Throne"
 zin_chr_629_sub:0 "Fourth Age · Ending"
 zin_chr_629_title:0 "The Ashen Throne"
 zin_chr_629_x1_p1:0 "The throne was Afrit's. With the Necklace of the Abyss, and with the houses, temples and councils he had gathered over the ages, he held by power the dominion that he had sought for so long."
 zin_chr_629_x2_p1:0 "So ends this chronicle of the Fourth Age. Its last pages were kept far from Parim, by scholars who still remembered the freedom of earlier kings."
 zin_chr_630_p1:0 "The Fourth Age did not end in the triumph of the Lost Cause, of Volgan or of the Ashen Throne. It closed in another way, which no single power had planned."
 zin_chr_630_plate:0 "GFX_zin_chr_plate_cat_last_crowns"
 zin_chr_630_short:0 "How the Age Ended"
 zin_chr_630_sub:0 "Fourth Age · Ending"
 zin_chr_630_title:0 "How the Age Ended"
 zin_chr_630_x1_p1:0 "The Golden Court endured. The court of the Golden King held Parim to the end of the age, under the King himself or under the regency that ruled in his name, and its gilded halls outlasted the war."
 zin_chr_630_x2_p1:0 "A western crown held Parim. The kingdoms of the West, which Aenor had once tried to rule, ended the age with a western banner over the old capital of the Middle Lands."
 zin_chr_630_x3_p1:0 "Lerendor became master of the strait. The Leren crown held the waters between the North Lands and the Middle Lands, and the old treaty that had bound the North to Aenor became Leren supremacy over the strait."
 zin_chr_630_x4_p1:0 "The East was united under one king of its own. The rich and divided East Lands, whose courts had long competed for the caravan roads, ended the age under a single crown."
 zin_chr_630_x5_p1:0 "The age ended unfinished. No crown, league or dark power prevailed, and the wars of the last crowns wore down into a long and uncertain quiet that no chronicle could call a peace."
 zin_chr_630_x6_p1:0 "So ends this chronicle of the Fourth Age. The scholars of Parim and Selen set it down as it happened, and leave to those who come after them the judgement of what it meant."
 zin_chr_701_p1:0 "Aen is the legendary founder of Aenor, and he is widely held to be the greatest man who ever lived. He is called the First Man and First of His Name, yet men had lived in great numbers, over many generations, for thousands of years before him. He was born through magic and power, without a direct father. The title speaks of that unique birth and of his place as founder of the united realm of men. It does not mean that he was the first man to live."
 zin_chr_701_p2:0 "The men of that far older world were stronger, more gifted in magic and far longer-lived than the men of later ages. Some of them held a power like that of gods without being gods. Aen himself lived an extraordinarily long life and fathered hundreds of sons. His blood is held to be the most royal of all mankind."
 zin_chr_701_p3:0 "Aen fought in the War of Men for hundreds of years and united the rival kingdoms of men into a single kingdom. The War of Men was fought before the First Age; his victory and the founding of Aenor mark Year 1 of the First Age, which lasted 1,675 years. His victory brought centuries of peace to the central realm of men, although the later spread of that realm to distant frontiers stayed violent.\n\nAen is remembered dark-haired and bearded, with a very powerful presence. He is shown crowned, in a black and red cloak."
 zin_chr_701_p4:0 "No chronicle tells where Aen first appeared, or what power brought about his birth. It is not known when he died, or who ruled after him. The scholars do not agree whether the name Ainu means all the mighty men of the early world, Aen's house alone, or a people older than both, nor whether Aenor was named in his honour."
 zin_chr_701_plate:0 "GFX_zin_chr_plate_aen"
 zin_chr_701_short:0 "Aen, First of His Name"
 zin_chr_701_sub:0 "First Age · King of Men"
 zin_chr_701_title:0 "Aen, First of His Name"
 zin_chr_702_p1:0 "Ein is a son of Aen, the first king and unifier of men. Aen fathered hundreds of sons and left many descendants, whose lines became rival branches of the royal house. Ein's line is counted the most direct of them all.\n\nLittle of Ein himself is written. No chronicle tells of his reign, of his death, of the mother of his children, or of his place among the early kings of Aenor. In later ages his line was held to be lost, and why, no chronicle tells."
 zin_chr_702_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_702_short:0 "Ein, Son of Aen"
 zin_chr_702_sub:0 "First Age · Royal Line of Aen"
 zin_chr_702_title:0 "Ein, Son of Aen"
 zin_chr_702_x1_p1:0 "Ein is the father of Eindil, the Man from the Ice. Eindil is son of Ein, son of Aen, and of the royal blood that stands closest to the founder's own."
 zin_chr_702_x2_p1:0 "Ein had another son, Afrit, born in about the same years as Eindil. Ein refused Afrit the royal succession. After Afrit betrayed his brother, the disappointed prince turned slowly toward corruption and demonic power. Why Ein refused him, how Afrit betrayed Eindil, and which of the two brothers is the elder, no chronicle tells."
 zin_chr_703_p1:0 "In the late Fourth Age a man was found alive in the ice of the Cold Lands, and the local tribes who found him took him in. He did not remember his name, his people or where he came from. His strength was extraordinary, beyond that of any man they knew, and he was unwilling to misuse it. He has black hair and blue eyes that glow faintly. No chronicle tells how he came to lie in the ice, or for how long."
 zin_chr_703_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_703_short:0 "The Man from the Ice"
 zin_chr_703_sub:0 "Fourth Age · Wanderer"
 zin_chr_703_title:0 "The Man from the Ice"
 zin_chr_703_title_after:0 "Eindil, Son of Ein"
 zin_chr_703_x1_p1:0 "Travellers of the West Lands took the stranger south. He aided their communities, made peace between rivals and for a short time served as a western king. Sailing for Aenor, he was driven by storm to the Islands of the South, and from there he went on to the Lands of the Sun, where Lorien, King of the Gala, spoke with him and sent him north.\n\nHe sailed north toward the Castle of Yeldenne. Every companion of that voyage died in an ambush, and the stranger went on alone through the snow to the castle. There Horos, dying, gave him Glo, a crystal of old and holy power, and his blue sword."
 zin_chr_703_x2_p1:0 "At Gala, Lorien named him: Eindil, son of Ein, son of Aen. He comes of the First Men, whose gifts of magic, long life and strength were greater than those of later men. He is the strongest man remembered in the Fourth Age, and of the royal blood closest to the founder's line. He had been held in a sleep of many ages, by means no chronicle tells."
 zin_chr_703_x3_p1:0 "Eindil is the brother of Afrit, the Deliverer worshipped in Aenor; both are sons of Ein, born in about the same years. At Yeldenne Eindil learned that the god-king of Aenor was his brother. Which of the two is the elder, no chronicle tells."
 zin_chr_703_x4_p1:0 "In the War of the Last Crowns Volgan struck Eindil down. The New Gods revived him and gave him extraordinary power through Glo. Whether the powers the gods gave him are his for ever is not known."
 zin_chr_703_x5_p1:0 "Afrit returned, struck Eindil, cut off one of his arms and cast him from a cliff. Eindil survived the fall."
 zin_chr_703_x6_p1:0 "In the royal palace Eindil took on his brother, with Alleria of Selen and Golbran at his side. They stripped away the artifacts that sustained Afrit, and Eindil killed him. Golbran gave his life to preserve Eindil."
 zin_chr_703_x7_p1:0 "Eindil took the Necklace of the Abyss and wears it. What it will do to him, no chronicle tells."
 zin_chr_703_x8_p1:0 "Eindil returned to the royal palace and was crowned King of Aenor, and with his crowning the Fourth Age ended."
 zin_chr_704_p1:0 "The Deliverer is worshipped across Aoaz as a New God. The temples tell that when Elzon fell at the end of the Third Age, the Deliverer shielded the people from the ruin of his fall and saved them. The people hailed him their Deliverer, the New God of Deliverance, Protection and Renewal, and his worship has grown through the long peace of the Fourth Age.\n\nMen know him by the name Aurevan. His sacred houses keep granaries, hospitals and the rolls of births, and his priests teach in the schools and counsel the courts and the crown."
 zin_chr_704_p2:0 "He is not one of the twelve main New Gods whom the twelve months honour. His worship keeps a feast in his honour instead of a month."
 zin_chr_704_plate:0 "GFX_zin_chr_plate_the_deliverer"
 zin_chr_704_short:0 "The Deliverer"
 zin_chr_704_sub:0 "Third and Fourth Ages · The Faith"
 zin_chr_704_title:0 "The Deliverer"
 zin_chr_704_x1_p1:0 "After the death of the Golden King the Deliverer took Aenor's crown openly under his public name, Aurevan. He proclaimed himself King of Aenor, First of His Name, and New God of Men, and many worship him as their king."
 zin_chr_704_x2_p1:0 "The Deliverer was Afrit, Ein's son and a grandson of Aen. The name Afrit was known chiefly to his secret council, to his enemies and to certain beings of power. His worship and his powers were real.\n\nWhether he was ever a true New God, of the order the Holy Seven made, is not known. The worship of men cannot by itself prove it."
 zin_chr_705_p1:0 "Afrit is Ein's son and a grandson of Aen, born a man of the mighty First Men. His father denied him the throne, and Afrit betrayed his brother. Then he sought dominion through corruption, demonic magic, bargains, worship and artifacts. His demonic form has grown over the ages, but beneath his protections he is still mortal and can be killed."
 zin_chr_705_p2:0 "In the First Age he secretly gathered demons, spirits, men and elves against Volgan, and they helped bring about the dark lord's defeat at Dardan. He did it to remove a rival and to set himself toward the crown, and nobody saw his hand. In the Second Age he gained worship, networks and supernatural power, and his ascension near its end was one of that age's defining events. He stayed independent of Elzon and Volgan."
 zin_chr_705_p3:0 "In the Third Age his followers supported the resistance against Elzon, and at Elzon's fall he helped protect the people's lives. They hailed him a New God, their Deliverer, and his cult keeps a feast in his honour, not a month. Whether he truly belongs to the order of gods the Holy Seven made is not known. The adoration of men cannot by itself prove it."
 zin_chr_705_p4:0 "Through most of the Fourth Age Afrit has governed Aenor from behind the throne, through priests, schools, houses of relief, councillors and kings who are his creatures, and the kingdom has prospered all the while. Ordinary people know him as the Deliverer, by the name Aurevan; his inner council knows him as Afrit. The Golden King is one of the least able kings his hidden rule has steered."
 zin_chr_705_p5:0 "He has gathered servants and enchanted artifacts, among them the Ring of Doors. He sent a master thief, Sevrin, into the Abyss for Roka's Necklace of the Abyss, and he kept his promise of eternal life to him. The necklace greatly increases his strength. Through his council he has built alliances across the East and South Lands, a reserve dominion should Aenor be threatened."
 zin_chr_705_plate:0 "GFX_zin_chr_plate_afrit"
 zin_chr_705_short:0 "Afrit"
 zin_chr_705_sub:0 "All Ages · Prince of the First Men"
 zin_chr_705_title:0 "Afrit"
 zin_chr_705_x1_p1:0 "Afrit's brother is Eindil, the Man from the Ice, who slept through the ages and woke in the Cold Lands. At Yeldenne Horos named Afrit as Eindil's brother."
 zin_chr_705_x2_p1:0 "Afrit murdered the Golden King and took Aenor's throne openly under his public name, proclaiming himself King of Men and New God."
 zin_chr_705_x3_p1:0 "In the last war Afrit abandoned Aenor and took a kingship in the east, the King of the East, as the reserve he had long prepared."
 zin_chr_705_x4_p1:0 "Afrit is dead. He died a mortal death, and no chronicle tells of any form of him that survived it."
 zin_chr_705_x5_p1:0 "In the royal palace his brother, helped by Alleria and Golbran, stripped away Afrit's rings, wards and other artifacts. Golbran tore the Necklace of the Abyss from him, and his brother killed him."
 zin_chr_706_p1:0 "The Golden King reigns over Aenor in the late Fourth Age. He inherited strong institutions and a flourishing kingdom, and he governs them badly. He is preoccupied with wealth, sells offices and rewards favourites.\n\nHe founded the Lost Cause, an order of politics and arms meant to stand against the growing dark powers. He also uses it to raise himself up.\n\nNo chronicle gives his personal name, his years or his kin; to all of Aoaz he is the Golden King."
 zin_chr_706_plate:0 "GFX_zin_chr_plate_golden_king"
 zin_chr_706_short:0 "The Golden King"
 zin_chr_706_sub:0 "Fourth Age · King of Aenor"
 zin_chr_706_title:0 "The Golden King"
 zin_chr_706_x1_p1:0 "The Golden King died, and with him his reign of gold and favour. His death left Aenor's crown in dispute."
 zin_chr_706_x2_p1:0 "By his reign the Deliverer, who was Afrit, had spent centuries strengthening his hold on Aenor's council, clergy and great institutions, and the Golden King had been one of his creatures. Afrit secretly arranged the King's death and used the crisis that followed to have himself proclaimed king. Few of his worshippers understood it."
 zin_chr_706_x3_p1:0 "A plot against the Golden King's life was uncovered, and the rising that followed was crushed. The Golden King lives and keeps his crown."
 zin_chr_707_p1:0 "Edran was the great king of Aenor who gathered the Grand Alliance and helped defeat Volgan in the late First Age. He is remembered as the greatest king since Aen.\n\nEdran held Aenor together after Dardan and went on guiding its recovery into the early Second Age. He died of disease during the long years of grief and rebuilding. No chronicle names the illness or the year."
 zin_chr_707_p2:0 "His greatest mistake came after Volgan's banishment. Against strong elven objections he ordered the Grand Alliance to conquer the Ember Lands. Elzon's defenders inflicted enormous losses and forced the invaders to retreat. The distrust that followed endured for generations: when Elzon later invaded, the elves refused to send armies to help the men of Aenor.\n\nEdran came of a fairly distant line of Aen. His Charter of the Free Banners secured the independence of his allies, among them free realms of the West and of the elves. Men called him the Gatherer."
 zin_chr_707_plate:0 "GFX_zin_chr_plate_edran"
 zin_chr_707_short:0 "King Edran"
 zin_chr_707_sub:0 "First Age · King of Aenor"
 zin_chr_707_title:0 "King Edran"
 zin_chr_708_p1:0 "Lorien is king of the Gala elves of the Lands of the Sun, a being of extraordinary age and power. In the First Age he led the Gala elves in King Edran's Grand Alliance. He has lived through every age since, and he remembers the War of Men, the defeat of Volgan at Dardan, the fall of Aenor and the reign of Elzon.\n\nEdran's ruinous attack on the Ember Lands after Dardan brought needless elven deaths and a long estrangement between elves and men. In the Second Age the elves refused to join another war on Aenor's behalf against Elzon. Yet Lorien still cares for the fate of all Aoaz."
 zin_chr_708_p2:0 "The Gala are the most powerful of the elves, and Lorien looks a figure of myth. His eyes glow an extremely bright yellow, and he wears a robe of white and deep gold."
 zin_chr_708_plate:0 "GFX_zin_chr_plate_lorien"
 zin_chr_708_short:0 "Lorien, King of the Gala"
 zin_chr_708_sub:0 "All Ages · King of the Gala Elves"
 zin_chr_708_title:0 "Lorien, King of the Gala"
 zin_chr_708_x1_p1:0 "Late in the Fourth Age Lorien welcomed a stranger from the Islands of the South and spoke with him over many weeks. He named him Eindil, son of Ein, grandson of Aen, and told him of Aoaz long before Aen. Through a vision in the Mirror of First Rain he warned of a catastrophe drawing near.\n\nLorien sent Eindil to Horos at Yeldenne to obtain Glo. He gave him a remarkable ship, armour, a sword and companions from many peoples: western friends, southern islanders and Gala elves."
 zin_chr_708_x2_p1:0 "When Kusven came forth out of the black north at the end of the Fourth Age, Lorien returned with ancient lords and spirits to defend all the living peoples of Aoaz. He died in battle with the servant and helped force it to withdraw. He lived long after Dardan, but he did not outlive the Fourth Age."
 zin_chr_709_p1:0 "Horos is a Great Spirit, lord of the Castle of Yeldenne in the Cold Lands and guardian of Glo. He is an enormous knight in yellow-green armour, with strange branching spikes upon his helm, glowing blue eyes and a blue sword of magic. He keeps his throne in a dark hall, and deep halls lie beneath his castle.\n\nGlo shows as a green jewel before his throne: a crystal of old and holy power, said to hold part of the power of Glernaen, the New God of Power and Wisdom. Within his castle Horos is far stronger than anywhere else."
 zin_chr_709_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_709_short:0 "Horos of Yeldenne"
 zin_chr_709_sub:0 "Fourth Age · Great Spirit"
 zin_chr_709_title:0 "Horos of Yeldenne"
 zin_chr_709_x1_p1:0 "Horos died when an intruder came to his castle for Glo. Then the truth of the crystal was known: Glo was Horos's own heart, and he had carried his own strength as a Great Spirit together with the power entrusted to him by a god. His body turned to dust. What became of his spirit is not known."
 zin_chr_709_x2_p1:0 "A crowned intruder from the south came to Yeldenne for Glo. Horos challenged him and warned him to leave, and he refused. In their struggle Horos seized him, but the intruder vanished from his grasp, appeared behind him and stabbed him in the back of the neck.\n\nThen the Man from the Ice arrived, wounded the intruder and forced him to flee. Dying, Horos gave Glo and his blue sword to the Man from the Ice. He drew out his own crystal heart with his hands, and he crumbled to dust."
 zin_chr_709_x3_p1:0 "The intruder was Afrit. Before they fought, Horos named him for what he was, the brother of Eindil."
 zin_chr_709_x4_p1:0 "When an intruder came to the castle for Glo, Horos held his hall and drove him out. Glo still lies before his throne."
 zin_chr_710_p1:0 "Varner is a wise wizard of the Magical Lands, a Lesser Spirit in the form of an old man. Through the long Third Age he helped the elves and the resistance of men withstand Elzon's necromancy, for he can undo the curse that binds the risen dead. His wisdom has stayed influential for centuries since.\n\nA small purple servant of unknown origin, Golbran, goes with him. For all his fame Varner is a Lesser Spirit, and one practitioner among many traditions of magic. Bastian, a living human wizard famous in the Middle Lands, is of his time."
 zin_chr_710_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_710_short:0 "Varner"
 zin_chr_710_sub:0 "Third Age · Lesser Spirit"
 zin_chr_710_title:0 "Varner"
 zin_chr_710_x1_p1:0 "In the War of the Last Crowns Varner came to Aenor on a dragon with the Man from the Ice and Golbran. He shielded the living armies from the death-magic of Zol and spent his last strength to open a way for them to survive. He died when Zol's forces threatened to overwhelm the defenders, and the time he won them was essential to all that followed."
 zin_chr_711_p1:0 "Golbran is the small, purple, humanoid servant and companion of the wizard Varner. His kind and his origin are unknown. He stood with Varner against Elzon in the Third Age and has lived on into the Fourth.\n\nSmall as he is, Golbran is a creature of magic. He does not age, though he can be slain."
 zin_chr_711_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_711_short:0 "Golbran"
 zin_chr_711_sub:0 "Third Age · Companion of Varner"
 zin_chr_711_title:0 "Golbran"
 zin_chr_711_x1_p1:0 "Golbran died at the end of the Fourth Age. He gave the last of his life and magic to save the one he fought beside, at the price of his own."
 zin_chr_711_x2_p1:0 "In the royal palace Golbran used his magic to remove the Necklace of the Abyss from Afrit, leaving the god-king mortal and vulnerable. After Eindil killed Afrit, Golbran gave Eindil his last remaining life and magic and so saved him."
 zin_chr_712_p1:0 "Alleria is a celebrated ranger and archer of Selen, in the Middle Lands. No chronicle tells where she learned her craft, nor of her family or her age."
 zin_chr_712_plate:0 "GFX_zin_chr_plate_alleria"
 zin_chr_712_short:0 "Alleria of Selen"
 zin_chr_712_sub:0 "Fourth Age · Ranger of Selen"
 zin_chr_712_title:0 "Alleria of Selen"
 zin_chr_712_x1_p1:0 "When the stranger's warnings came to the Middle Lands and most of Aenor denounced him, Alleria looked into the rumours about him. She led a hidden band loyal to the old royal line, and it sheltered the stranger."
 zin_chr_712_x2_p1:0 "After Afrit threw the stranger from the cliff, Alleria and her band brought him up out of the ravine alive."
 zin_chr_712_x3_p1:0 "In the royal palace Alleria shot Afrit in the eye. In that moment Eindil cut off one of Afrit's fingers and took a ring, and Alleria went on helping him disable the enchanted artifacts that kept Afrit's overwhelming strength."
 zin_chr_713_p1:0 "Volgan is a Great Spirit and the principal dark lord of Aoaz. He has existed for immense ages, and his domain is the Ember Lands. His armies include demons, orcs, goblins, monsters, necromantic hosts and other spirits. The independent Dark Lands are not his subjects by right.\n\nThe oldest elves say that Volgan was once the servant of a New God, and that he overcame that god and founded his own dominion by means no chronicle tells. The chronicles of men do not. Which god it was, and what became of it, is not known."
 zin_chr_713_p2:0 "In the First Age Volgan invaded Mirolon and advanced to Aenor's capital. King Edran's Grand Alliance defeated him at Dardan, where other spirits stripped his active power and banished him to the Void. In the Second Age Elzon restored his soul or presence from the Void. Through the long Third Age Volgan was too weak to leave the Ember Lands, and he gave his orders to Elzon, who ruled Aenor in his name.\n\nVolgan is a wizard of green magic and not human in form. He is a purple cloak filled with darkness, in which only his glowing green eyes can be seen, and his crown floats above the dark."
 zin_chr_713_plate:0 "GFX_zin_chr_plate_volgan"
 zin_chr_713_short:0 "Volgan"
 zin_chr_713_sub:0 "All Ages · Great Spirit"
 zin_chr_713_title:0 "Volgan"
 zin_chr_713_x1_p1:0 "Recovered at last, Volgan marched north from the Ember Lands with an army greater than any Aoaz had seen."
 zin_chr_713_x2_p1:0 "The Man from the Ice pierced Volgan with the divine sword of Horos, and Volgan's manifested body burst apart. His army lost much of its unnatural order. Whether his spirit survives is not known."
 zin_chr_714_p1:0 "Elzon was a Great Spirit, the Great Necromancer, and the devoted servant of Volgan. His home was Nazerun, the old name of Nezer, in the Ember Lands. No chronicle tells where he learned necromancy, or what he was before he served Volgan.\n\nAfter Volgan was defeated at Dardan and banished to the Void, Elzon gathered his remaining forces in the Ember Lands. He had prepared the defence, and he threw back the Grand Alliance when it tried to invade. Many of the attackers died, elves among them, and the invasion failed. The victorious king of that alliance was Edran."
 zin_chr_714_p2:0 "Through the Second Age Elzon directed raids and built networks to keep Aenor from rising again. He made alliances with orcs, goblins, corrupt rulers, monsters and other dark powers, without ruling them all. At last he freed Volgan from the Void and returned his soul to Aoaz. Volgan came back weak and granted Elzon greater freedom."
 zin_chr_714_p3:0 "Elzon also borrowed old magic tied to Zol, the first stirring of that Old God in the known history of men; how he obtained it, and whether Zol willed it, is not known. Then he took the field openly and raised the dead, turning men slain while resisting him into his own soldiers. Aenor's allies were divided or corrupted, and in the Second Age year 2133 Elzon conquered Aenor and set up his Order. So began the Third Age."
 zin_chr_714_p4:0 "In the Third Age Elzon ruled Aenor in fact, still obeying Volgan. His risen host faded with time, and his own power ran down in Aenor, whose magic did not renew him as the Ember Lands did. He sought the power to make Aenor a land that would sustain him. Men went on resisting, and the Magical Lands held free with the help of Varner, a Lesser Spirit able to lift the curse of the dead, and his purple servant Golbran."
 zin_chr_714_p5:0 "Elzon's rule ended in his literal and permanent death. In the Last Tithe the resistance of men and Varner broke the spells that upheld him, and Elzon overdrew the death-magic he had borrowed from Zol, so that his spirit was consumed entirely. In that ruin the Deliverer shielded the people."
 zin_chr_714_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_714_short:0 "Elzon"
 zin_chr_714_sub:0 "Second and Third Ages · Great Spirit"
 zin_chr_714_title:0 "Elzon, the Great Necromancer"
 zin_chr_715_p1:0 "Roka belongs to the Abyss in the Ember Lands, and the powerful Necklace of the Abyss is bound up with his name. He is one of a people of large, rhinoceros-headed humanoids who come from the Abyss. Their name, their history and the order of their society are not known.\n\nWhy the necklace holds such extreme power, and whether Roka himself guarded it, no chronicle tells. Nor is Roka's own fate known."
 zin_chr_715_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_715_short:0 "Roka of the Abyss"
 zin_chr_715_sub:0 "Ember Lands · Folk of the Abyss"
 zin_chr_715_title:0 "Roka of the Abyss"
 zin_chr_716_p1:0 "Agon was a demon active in the Second Age, linked with the Nether in the south of the Ember Lands. In his time other demons grew ever more active, and portals and raids threatened Aenor and other peoples.\n\nAgon's order among folk and spirits, his rank in war, his allegiance and his history are not known. Nor is it known how he stood with the King of Demons. That king holds his seat in the Nether, but no chronicle says that Agon was he."
 zin_chr_716_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_716_short:0 "Agon"
 zin_chr_716_sub:0 "Second Age · Demon"
 zin_chr_716_title:0 "Agon"
 zin_chr_717_p1:0 "A King of Demons holds his seat in the southern Nether of the Ember Lands. No chronicle gives his name. His pacts bind the living; the souls of the dead remain Zol's.\n\nHis powers and his kind of demon are not known, nor how he stands with Volgan, with Elzon or with Agon. His title makes him a ruler within the society of demons. It does not make every demon his subject, nor all who are born in the Nether, nor the demons who serve other powers."
 zin_chr_717_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_717_short:0 "The King of Demons"
 zin_chr_717_sub:0 "All Ages · Lord of the Nether"
 zin_chr_717_title:0 "The King of Demons"
 zin_chr_718_p1:0 "Harion of Selen was the first king of the restored Aenor, crowned after the permanent death of Elzon at the end of the Third Age. He came of a side branch of Aen's royal line and earned his place through many years of resistance and organising. His right to rule rested on both his descent and his service.\n\nHarion brought peace through rebuilding, law, the fair storage of grain, sensible defence and diplomacy. He welcomed the Deliverer's houses of relief, because they plainly helped the people."
 zin_chr_718_p2:0 "The Fourth Age that followed has lasted more than a thousand years, ruled by successive kings and royal generations. Harion himself did not live or reign through all of it."
 zin_chr_718_plate:0 "GFX_zin_chr_plate_harion"
 zin_chr_718_short:0 "Harion the Restorer"
 zin_chr_718_sub:0 "Fourth Age · King of Aenor"
 zin_chr_718_title:0 "Harion the Restorer"
 zin_chr_719_p1:0 "Merovan is Keeper of the Seals of Aenor, a long-serving courtier of the royal government. He holds the ordinary authority of a high councillor and has long advised the Golden King."
 zin_chr_719_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_719_short:0 "Merovan of the Seals"
 zin_chr_719_sub:0 "Fourth Age · Keeper of the Seals of Aenor"
 zin_chr_719_title:0 "Merovan of the Seals"
 zin_chr_719_x1_p1:0 "Merovan sits on Afrit's Hidden Council. Beside his office he commands hidden agents who report to Afrit. In him the long decades of a compromised government, which led toward the open seizure of the crown, took a human face."
 zin_chr_719_x2_p1:0 "When the Deliverer left Parim for the Cold Lands, Merovan was left to hold the seals and to administer Aenor in his place."
 zin_chr_720_p1:0 "Sevrin is the master thief whom Afrit sent into the Abyss of the Ember Lands to obtain Roka's Necklace of the Abyss. In 4A 1611 he succeeded. Afrit had promised him eternal life, and he kept the promise through the power of the necklace.\n\nSevrin does not age, but he can be wounded and he can be trapped. His long life is bound to Afrit's power. He understands the necklace better than any sorcerer of a court."
 zin_chr_720_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_720_short:0 "Sevrin the Unending"
 zin_chr_720_sub:0 "Fourth Age · Master Thief"
 zin_chr_720_title:0 "Sevrin the Unending"
 zin_chr_720_x1_p1:0 "Whether Sevrin's life outlasted Afrit's death, no chronicle tells."
 zin_chr_721_p1:0 "Many captains came to King Edran's Grand Alliance from free peoples who owed Aenor nothing, and the Charter of the Free Banners kept their freedom. Five of them stand out in the histories of Dardan.\n\nSirael was the elected war-speaker of the elves of the Magical Forest. Those elves choose their own leaders, and Sirael spoke for a free people, never as a crowned ruler beside the hereditary kings of the other elves."
 zin_chr_721_p2:0 "Taryn, a commander of the West Lands, demanded guarantees for the West before aiding the kingdom that had taken the western lands as its own. Senra of the Pupor Isles, a captain of the island fleets, carried the alliance's supplies by sea and moved its troops across far waters.\n\nBrunek of the Stone Roads, a dwarven engineer of war, held the crossings at Dardan beside the giants. Rovek of Dondor, a free lord of the Dark Lands, marched against Volgan and showed that the Dark Lands had never stood united behind him. Not all of Dondor followed Rovek."
 zin_chr_721_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_721_short:0 "The Free Banners of Dardan"
 zin_chr_721_sub:0 "First Age · Captains of the Alliance"
 zin_chr_721_title:0 "The Free Banners of Dardan"
 zin_chr_722_p1:0 "Two Great Spirits stood with the Grand Alliance against Volgan. Ithren of the Threshold, a spirit of boundaries, helped work Volgan's banishment at Dardan and was bound into the ward that held him. It was a working of spirits, not of the gods.\n\nMaerul of the Deep Stone fought the Damned Spirits and helped seal the ruptures that opened beneath the earth."
 zin_chr_722_p2:0 "Great Spirits are immortal, yet they can be bound or shattered. In the Second Age Ithren's ward failed, and through its failing Elzon recovered the banished Volgan."
 zin_chr_722_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_722_short:0 "Ithren and Maerul"
 zin_chr_722_sub:0 "First Age · Great Spirits"
 zin_chr_722_title:0 "Ithren and Maerul"
 zin_chr_723_p1:0 "Vareth the Pale commanded the corrupted elves who marched in Volgan's host in the First Age.\n\nNot every elf stood with the Grand Alliance. Vareth's banners showed how far corruption had reached among the elf peoples, and how divided their loyalties had become."
 zin_chr_723_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_723_short:0 "Vareth the Pale"
 zin_chr_723_sub:0 "First Age · Commander of Elves"
 zin_chr_723_title:0 "Vareth the Pale"
 zin_chr_724_p1:0 "While Elzon's war spread through the Second Age, captains of several peoples kept faith with Aenor. The histories remember three.\n\nAvarin of Lerendor's North served the North Lands as envoy and later as commander. She tried to bring aid to Aenor while defending her own kingdom, and her impossible place showed why the Grand Alliance could not simply be raised again."
 zin_chr_724_p2:0 "Seron of Selen, a commander of men, guarded the rebuilding of the provinces and their roads of supply. His campaigns steadied whole districts for a time, but he lost men faster than they could be replaced. He and Avarin never agreed whether force of arms could save the kingdom. No chronicle tells how Seron's war ended.\n\nTavriel of the Magical Forest, an elven healer and keeper of wards, went on helping men despite the resentment many elves bore Aenor. Her opponents among the elves argued for closing the borders, and she sheltered the very refugees her own people feared."
 zin_chr_724_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_724_short:0 "Defenders of the Second Age"
 zin_chr_724_sub:0 "Second Age · Captains"
 zin_chr_724_title:0 "Defenders of the Second Age"
 zin_chr_725_p1:0 "Arelon was a royal archivist of Aenor. When Elzon conquered the kingdom at the close of the Second Age, Arelon escaped with fragments of the lineages of Aen and with the ancient law of succession.\n\nAenor's fall began the Third Age under Elzon's Order. No chronicle names the royal capital of that day or its last free king, nor tells what became of the royal line.\n\nArelon believed that saving the memory of Aenor might matter even if its walls could not be saved. What became of his archive, no chronicle tells."
 zin_chr_725_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_725_short:0 "Arelon"
 zin_chr_725_sub:0 "Second Age · Royal Archivist"
 zin_chr_725_title:0 "Arelon, Keeper of the Last Seal"
 zin_chr_726_p1:0 "The winter tales of the north tell of Kusven, the servant of Zol, the Old God of Death. His name is a Leren word meaning “the grave-wind”, and the sea north of Zol's Mistake is called Kusmeel, “the grave-sea”. The Leren fishers who winter on the black isles keep the tale among the oldest customs owed to the Old God.\n\nThe shore folk and the sailors say that Kusven is Zol's most loyal servant, and that he is not Zol himself but a being of his own. They say that he dwells on Šodolôro in Zol's Mistake, that he feeds on souls, and that he covets all of Aoaz. All who tell of him fear him."
 zin_chr_726_p2:0 "What Kusven truly is, no chronicle tells. It is not known whether he rules the Mistake or its seat Furviatlon, nor how his hunger for souls stands beside Zol's claim on the souls of the dead."
 zin_chr_726_plate:0 "GFX_zin_chr_plate_cat_figures"
 zin_chr_726_short:0 "Kusven"
 zin_chr_726_sub:0 "Fourth Age · Legend of the North"
 zin_chr_726_title:0 "Kusven"
 zin_chr_726_x1_p1:0 "In the War of the Last Crowns Kusven came forth out of the black north and took the field. Zol himself did not appear; his servant carried the Old God's power onto the field."
 zin_chr_726_x2_p1:0 "Kusven broke the blue sword of Horos, but the Man from the Ice wounded him with a shard of the blade, which still bore divine magic."
 zin_chr_726_x3_p1:0 "Kusven withdrew into the north. He was not destroyed. What the war cost him, no chronicle tells."
 zin_chr_726_x4_p1:0 "Lorien of the Gala and ancient spirits died opposing him, and their stand forced him back."
 zin_chr_801_p1:0 "Men are Common Folk, mortal like the dwarves. They lived in Aoaz in great numbers, generation after generation, for thousands of years before the First Age. The earliest of them were stronger, longer-lived and more gifted in magic than the men of later ages.\n\nMany peoples of men live in Aoaz: the peoples of the Middle Kingdom, the Dondor Brutes, the camel warriors of Noris, the clans of Gunwaith, the wardens of Girdon, the Buldor companies, the houses of Aenor Isle and the Goodin Sunfolk. The ancient Ainu, the First Men, stand at the head of their story."
 zin_chr_801_p2:0 "From Aen, who was born of magic and had no ordinary father, came the highest royal line of men. His victory in the War of Men and the founding of Aenor began the First Age.\n\nMen have fought on both sides of the great wars. In the First Age men of the eastern and southern lands marched with Volgan, while the western kingdoms and the island peoples joined the Grand Alliance against him. No people of men served him whole."
 zin_chr_801_p3:0 "Beside men live the small folk, a people of their own. Their own name for themselves and the place of their homeland are not set down in the chronicles of men."
 zin_chr_801_plate:0 "GFX_zin_chr_plate_men"
 zin_chr_801_short:0 "The Peoples of Men"
 zin_chr_801_sub:0 "All Ages · People"
 zin_chr_801_title:0 "The Peoples of Men"
 zin_chr_802_p1:0 "Men had built civilizations for thousands of years before the First Age began. The earliest generations were stronger than later men, lived far longer, and were naturally better at magic. Some of them held powers like those of gods, without being true gods.\n\nAen was born from magic and power, without an ordinary father. He is called the First Man and First of His Name, though he was not the first man to live. The title speaks of his unique birth and of his place as founder of the one realm of men."
 zin_chr_802_p2:0 "Aen lived an extraordinarily long life and fathered hundreds of sons. He fought in the War of Men for centuries, united the rival kingdoms of men into one kingdom, and founded Aenor. His victory marks the first year of the First Age. His blood is held the most royal of all mankind, and he is widely held to be the greatest man who ever lived.\n\nThe old peoples of that early world are called the Ainu. The scholars do not agree whether the name means all the mighty men of the early world, only the dynasty of Aen, or a people older still. No chronicle tells where Aen first appeared, or what power brought about his birth."
 zin_chr_802_plate:0 "GFX_zin_chr_plate_first_men"
 zin_chr_802_short:0 "The First Men"
 zin_chr_802_sub:0 "Before the First Age · People"
 zin_chr_802_title:0 "The First Men"
 zin_chr_803_p1:0 "Aen, the magically born founder of Aenor and First of His Name, fathered hundreds of sons. His blood is held the most royal of all mankind.\n\nHis many sons and their descendants made many royal lines, and those lines have long competed with one another. How the Golden King and the kings of the Restoration descend from Aen is not set down in any chronicle.\n\nAmong the sons of Aen was Ein. The chronicles count the direct line of Aen through Ein as the first royal line of men, and they have long held it lost. Why it was held lost, no chronicle tells."
 zin_chr_803_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_803_short:0 "The Line of Aen"
 zin_chr_803_sub:0 "All Ages · Royal Line"
 zin_chr_803_title:0 "The Line of Aen"
 zin_chr_803_x1_p1:0 "Ein's line has returned. The stranger from the ice is Eindil, son of Ein, grandson of Aen. His descent from the founder of Aenor is direct, an unusually strong claim of blood, though it gives him no lawful rule over the crowns of the West and the North that stand apart from Aenor.\n\nEindil lived through the ages in a long sleep beyond nature. Where and how he was put to sleep, no chronicle tells."
 zin_chr_803_x2_p1:0 "Ein had two sons, born at about the same time: Eindil and Afrit. Ein denied Afrit the throne. Why he refused him, which of the brothers was the elder, and who their mother was, no chronicle tells.\n\nAfrit survived the ages through magic and corruption. Under another name he was hailed as a New God and worshipped throughout Aenor."
 zin_chr_804_p1:0 "The elves of the Magical Forest are Great Folk, immortal beings who are not spirits. They are peaceful and very old, and their forest is the oldest and most peaceful of the elven realms of the Magical Lands, beyond the Great Wall of Aenor. An elected council of its houses rules it.\n\nAround the Magical Forest lie some twenty smaller elven realms. Herrodon and Andos Enda are old rivals, and Nolorim guards the high passes. The elves of the Magical Lands were never conquered, not even by Elzon. The elven powers can command the dragons of Dragon Mountain."
 zin_chr_804_p2:0 "In the First Age the elves of the Magical Lands fought in the Grand Alliance against Volgan. Not every elf stood with them: corrupted elves marched in Volgan's army.\n\nKing Edran's attack on the Ember Lands after Dardan cost many elven lives and left elves and men long estranged. When Elzon invaded Aenor in the Second Age, the elven kingdoms would not help. That refusal still stands."
 zin_chr_804_plate:0 "GFX_zin_chr_plate_forest_elves"
 zin_chr_804_short:0 "Elves of the Magical Forest"
 zin_chr_804_sub:0 "All Ages · People"
 zin_chr_804_title:0 "Elves of the Magical Forest"
 zin_chr_805_p1:0 "The Sunhot elves live in the Lands of the Sun, in the far south-west of Aoaz. They stand more than three metres tall, and they are among the strongest and the most peaceful peoples of Aoaz. Like all elves they are Great Folk, immortal beings who are not spirits.\n\nTheir land is divided among many small realms, which the Lands of Light lead.\n\nIn the same lands the Gala elves keep their ancient court. Whether the Gala are kin to the Sunhot elves, no chronicle of men can say."
 zin_chr_805_plate:0 "GFX_zin_chr_plate_sunhot_elves"
 zin_chr_805_short:0 "The Sunhot Elves"
 zin_chr_805_sub:0 "All Ages · People"
 zin_chr_805_title:0 "The Sunhot Elves"
 zin_chr_806_p1:0 "The Gala elves are the people of King Lorien. They keep their ancient court in the Lands of the Sun, and they are the most powerful of all elves.\n\nLorien is a figure of extraordinary age and power, with eyes that glow a bright yellow and robes of gold and white. In the First Age he led the Gala elves in King Edran's Grand Alliance, and they fought against Volgan at Dardan. Lorien has lived through every age since. He remembers the War of Men, the defeat of Volgan at Dardan, the collapse of Aenor and the reign of Elzon."
 zin_chr_806_p2:0 "The Gala elves remember Edran's Folly, the attack on the Ember Lands after Dardan that brought needless elven deaths and a long estrangement between elves and men. They would not go to war again for Aenor against Elzon. Even so, Lorien's care is for the fate of all Aoaz.\n\nWhether the Gala are kin to the Sunhot elves, no chronicle of men can say."
 zin_chr_806_plate:0 "GFX_zin_chr_plate_gala_elves"
 zin_chr_806_short:0 "The Gala Elves"
 zin_chr_806_sub:0 "All Ages · People"
 zin_chr_806_title:0 "The Gala Elves"
 zin_chr_806_x1_p1:0 "Lorien is dead. He fell in the war at the end of the Fourth Age, fighting for all the living peoples of Aoaz, and the Gala elves lost the king who had led them since the First Age."
 zin_chr_807_p1:0 "The God Forest Keepers are elves, and like all elves they are Great Folk, immortal beings who are not spirits. The chronicles of men name them beside the elves of the Magical Forest, the Sunhot elves and the Gala elves.\n\nLittle more is written of them. No chronicle of men tells where the forest they keep lies, what their keeping means, or how they stand toward the other elven peoples."
 zin_chr_807_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_807_short:0 "The God Forest Keepers"
 zin_chr_807_sub:0 "All Ages · People"
 zin_chr_807_title:0 "The God Forest Keepers"
 zin_chr_808_p1:0 "Angels are Great Folk, immortal beings who are not spirits. Their history is not written in any chronicle of men.\n\nDemons are corrupted angels. Among them are the Shachihata, huge, powerful and rare, and the Netherborn, who serve Volgan. Whether all the demonic peoples share one corruption is not known.\n\nThe King of Demons has his seat in the Nether, in the south of the Ember Lands, and no chronicle gives his name. His pacts bind the living, but the souls of the dead remain Zol's."
 zin_chr_808_p2:0 "In the Second Age portals opened, demons came forth, and they raided Aenor and other peoples. Agon and other demons were active in the Nether. What place Agon holds among the demons of the Nether is not known.\n\nDevils are not demons. They are corrupted Lesser Spirits, ancient and terrible, and they are bound to their bodies; the elves say they fled a service older than Aoaz, and the chronicles of men do not. A slain devil returns only through the lava rite, performed with its skull; who performs it, and where, is not known. Demonic signs include the five-pointed star."
 zin_chr_808_p3:0 "South of the South Lands, beyond the lands that anyone has charted, lie the homes of devils, demons and other evil beings that live in fire and endless suffering. They are known by name only."
 zin_chr_808_plate:0 "GFX_zin_chr_plate_angels_demons"
 zin_chr_808_short:0 "Angels and Demons"
 zin_chr_808_sub:0 "All Ages · People"
 zin_chr_808_title:0 "Angels and Demons"
 zin_chr_808_x1_p1:0 "Afrit has demons of his own. Whether they share one corruption with the Netherborn and the Shachihata is not known."
 zin_chr_809_p1:0 "The dwarves are Common Folk and mortal, like men. They hold the great mountain ranges of the West Lands and the North Lands, and the range of the Great Wall of Aenor between the Middle Lands and the Magical Lands.\n\nIn the First Age dwarves joined the Grand Alliance against Volgan. Where the dwarves first dwelt, no chronicle tells.\n\nThe dwarf goblins of the hills of the North Lands, near Lerendor, are another people altogether. They are neither dwarves nor goblins, but a people of their own."
 zin_chr_809_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_809_short:0 "The Dwarves"
 zin_chr_809_sub:0 "All Ages · People"
 zin_chr_809_title:0 "The Dwarves"
 zin_chr_810_p1:0 "Several peoples of giants live in Aoaz. In the Middle Lands lies Hirolon, a sovereign kingdom of giants. It is not one of Aenor's chartered dominions, and it treats with Aenor from outside the Charters.\n\nIn the Cold Lands live the ice giants of Titanos. Others are called the Forgotten Giants. In the First Age giants joined the Grand Alliance against Volgan.\n\nTo which order of being the giants belong, whether they are mortal, and where they first came from, is not known."
 zin_chr_810_plate:0 "GFX_zin_chr_plate_giants"
 zin_chr_810_short:0 "The Giants"
 zin_chr_810_sub:0 "All Ages · People"
 zin_chr_810_title:0 "The Giants"
 zin_chr_811_p1:0 "The ents are the people of Kilinti Forest in the Middle Lands. Kilinti is one of the dominions of the Middle Kingdom Concord, and its ents keep their own lords under the Charters of Parim.\n\nThe ents are not the only walking tree folk. Aenor Forest, the largest forest of the Middle Lands, is home to a walking tree people separate from the ents, whose own name the chronicles of men have not recorded. Ents and the walking tree people never share a forest."
 zin_chr_811_p2:0 "To which order of being the ents belong, and whether they are mortal, is not known."
 zin_chr_811_plate:0 "GFX_zin_chr_plate_ents"
 zin_chr_811_short:0 "The Ents of Kilinti"
 zin_chr_811_sub:0 "All Ages · People"
 zin_chr_811_title:0 "The Ents of Kilinti"
 zin_chr_812_p1:0 "The yeti live in the Yeti Lands of the Cold Lands, in the north-west of Aoaz. The Cold Lands are the largest landmass of Aoaz and the least known, and they reach west and north beyond the known lands.\n\nLike the tribes, the ice giants of Titanos and the free towns of the coast, the yeti of the Cold Lands live by trade, herding and hunting. To which order of being they belong, and whether they are mortal, is not known."
 zin_chr_812_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_812_short:0 "The Yeti"
 zin_chr_812_sub:0 "All Ages · People"
 zin_chr_812_title:0 "The Yeti"
 zin_chr_813_p1:0 "The mycids are the people of the Mushroom Forest in the Magical Lands, east of the Great Wall of Aenor. The arcanists are the people of the Zhen Hills.\n\nLittle more of either people is written in the chronicles of men. To which order of being the mycids and the arcanists belong, whether they are mortal, and where they first came from, is not known."
 zin_chr_813_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_813_short:0 "Mycids and Arcanists"
 zin_chr_813_sub:0 "All Ages · People"
 zin_chr_813_title:0 "Mycids and Arcanists"
 zin_chr_814_p1:0 "Orcs and goblins live in many lands of Aoaz, in many realms and under many rulers. They are not one obedient people. Like the other monster peoples of Aoaz, they are independent and diverse, and no single master commands them all.\n\nIn the Dark Lands, Goldoroth, an orc kingdom, seeks to rule the whole region, and a dozen orc and goblin holds belong to nobody. Volgan's agents court them all, but most still answer only to themselves."
 zin_chr_814_p2:0 "Goblins avoid the deep cold, yet they hold sheltered valleys in the south of the Cold Lands. The hobgoblin king rules his own realm only, not every goblin.\n\nAfter Dardan, orcs and goblins loyal to Volgan and Elzon went on raiding through the early Second Age, while the Dark Lands fell back into chaos."
 zin_chr_814_plate:0 "GFX_zin_chr_plate_orcs_goblins"
 zin_chr_814_short:0 "Orcs and Goblins"
 zin_chr_814_sub:0 "All Ages · People"
 zin_chr_814_title:0 "Orcs and Goblins"
 zin_chr_815_p1:0 "Trolls and ogres live in the Dark Lands under rulers of their own, beside independent men, orcs, goblins, giants and demons. The Troll Forest of the Dark Lands belongs to nobody.\n\nSmash, a troll king, rules his own realm only, not every troll. Like the other monster peoples, trolls and ogres are not one obedient people, and not all of them serve Volgan.\n\nTo which order of being trolls and ogres belong, and whether they are mortal, is not known."
 zin_chr_815_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_815_short:0 "Trolls and Ogres"
 zin_chr_815_sub:0 "All Ages · People"
 zin_chr_815_title:0 "Trolls and Ogres"
 zin_chr_816_p1:0 "Grave hosts and undead walk in more than one land of Aoaz. To which order of being, if any, the ghosts, revenants and roaming dead belong, the scholars do not agree.\n\nIn the Second Age Elzon, the Great Necromancer, raised the dead on a huge scale, among them the fallen fighters of Aenor, so that his armies grew as his enemies lost men. He borrowed ancient magic linked to Zol to do it, and how he came by that magic is not known."
 zin_chr_816_p2:0 "The dead that Elzon raised faded with time and needed his magic to go on. His power waned when he stayed in Aenor, far from the Ember Lands that sustained it, and in the Magical Lands Varner, a Lesser Spirit, could lift the curse of the dead.\n\nThe dead also roam the black wastes of Zol's Mistake. They have no known kind or allegiance, and no chronicle tells whether they all belong to Zol, to Volgan or to any one master."
 zin_chr_816_p3:0 "The scholars do not agree whether raising a body commands its true soul, whether souls are held at all, or whether only bodies and memories are used."
 zin_chr_816_plate:0 "GFX_zin_chr_plate_the_dead"
 zin_chr_816_short:0 "The Restless Dead"
 zin_chr_816_sub:0 "All Ages · People"
 zin_chr_816_title:0 "The Restless Dead"
 zin_chr_816_x1_p1:0 "Zol's dead have risen beyond the Mistake. They are stronger than any corpse Elzon raised, for the Old God's own death-magic sustains them. Mortal arms cannot end them for good without magic."
 zin_chr_817_p1:0 "Dragons come chiefly from Dragon Mountain. They do not form a realm of their own, and the elven powers can command them.\n\nIn the First Age dragons fought in Volgan's army, beside demons, devils, monsters, Great Spirits and damned spirits. That does not mean that every dragon served him."
 zin_chr_817_plate:0 "GFX_zin_chr_plate_dragons"
 zin_chr_817_short:0 "The Dragons"
 zin_chr_817_sub:0 "All Ages · People"
 zin_chr_817_title:0 "The Dragons"
 zin_chr_817_x1_p1:0 "The elves of the Magical Lands have entrusted a dragon to the Man from the Ice, as an ally in the war."
 zin_chr_818_p1:0 "In the Abyss of the Ember Lands dwells a people of large humanoids with the heads of rhinoceroses. Roka, whose name is bound to the Abyss, is one of them.\n\nRoka is linked with the Necklace of the Abyss, a relic of great power. Whether he guarded it himself, why it holds such power, and how it stands toward his people, no chronicle tells."
 zin_chr_818_p2:0 "The name of his people, their history and their way of life are not known. The Abyss is not the Void that held Volgan, nor the Nether of the King of Demons, and how such places may join is not known."
 zin_chr_818_plate:0 "GFX_zin_chr_plate_cat_peoples"
 zin_chr_818_short:0 "The People of the Abyss"
 zin_chr_818_sub:0 "All Ages · People"
 zin_chr_818_title:0 "The People of the Abyss"
 zin_chr_901_p1:0 "Aoaz is a continent of thirteen regions, with the Middle Lands at its heart. The regions are the Cold Lands, the West Lands, Triton's Islands, the North Lands, the Dark Lands, the Middle Lands with Aenor Isle off their west coast, the Magical Lands, Zol's Mistake, the East Lands, the South Lands, the Ember Lands, the Islands of the South and the Lands of the Sun."
 zin_chr_901_p2:0 "The far west and north of the Cold Lands, and the far east and south beyond the East Lands and the desert of the South Lands, run off the edge of every chart. No chronicle tells what lies beyond them. The lands south of the South Lands, home of devils, demons and other evil beings that live in fire and endless suffering, are known by name only, and no traveller's chart shows them."
 zin_chr_901_p3:0 "A wide sea parts the West Lands from the Middle Lands, wider than the old charts draw it. It made the first voyages of exploration slow and the supply of the first settlements hard, and it keeps the West Lands' quarrels with Aenor alive. The charts of this age show the Fourth Age only: the settlements, frontiers and war-roads of the First Age were not the same."
 zin_chr_901_p4:0 "Close on three hundred crowns, dominions, clans and island lordships divide the continent. The greatest are Aenor and its Concord in the Middle Lands, Lerendor in the North Lands, Coldor in the Cold Lands, Noris and Stabilo in the East Lands, Goldoroth and Dondor in the Dark Lands, Volgan in the Ember Lands and Zol's Mistake in the black north. Aoaz has known peace for more than seventeen centuries."
 zin_chr_901_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_901_short:0 "Aoaz"
 zin_chr_901_sub:0 "Fourth Age · Continent"
 zin_chr_901_title:0 "Aoaz"
 zin_chr_902_p1:0 "The Middle Lands lie at the centre of Aoaz: plains, forests and mountains around the Great Lake. Here stands Aenor, the Middle Kingdom, the central great power of Aoaz, with its seat at Parim. Selen, Kilinti, Kingson, Konori, Hunhun, Herez and the rest of the Concord's twenty-six dominions keep their own lords around it. The Cursed Lands and the Bloody Forest resist its rule."
 zin_chr_902_p2:0 "The giants' kingdom of Hirolon is sovereign and treats with Aenor from outside the Concord. Aenor Forest, the largest forest of the Middle Lands, is the home of the Baelim, a walking tree people who are not ents; the ents live in Kilinti, and the two never share a forest. To the east the mountains of the Great Wall of Aenor part the Middle Lands from the Magical Lands, and off the west coast lies Aenor Isle."
 zin_chr_902_p3:0 "Aen ended the War of Men and made the first united kingdom of men, and the realms of the Middle Lands grew from three threads. The first is that war and the peace that Aen spoke over the kneeling kings, which made Aenor. It also left the Orran houses of the downs and the red-oak forest a grudge over the old names of the Vale's rivers."
 zin_chr_902_p4:0 "The second thread is the centuries of the Necromancer's Order, which the vale-folk, the ship-houses, the guilds and the Klungori Guard each survived in their own way. The third is the older peoples of the land, the giants, the ents, the Baelim, the gnomes, the dwarves and one elven household, whose roots lie beyond the chronicles of men."
 zin_chr_902_p5:0 "In the First Age Aenor knew centuries of prosperity and settled lands beyond the Middle Lands, until misrule and revolt left it open to Volgan, who took its capital in his war. It rebuilt in the Second Age, and at that age's end, in 2A 2133, Elzon took it. Men resisted his Order through the Third Age. When he died at last, a good king restored the monarchy, and a long peace followed under the kings of the Fourth Age."
 zin_chr_902_plate:0 "GFX_zin_chr_plate_middle_lands"
 zin_chr_902_short:0 "The Middle Lands"
 zin_chr_902_sub:0 "Fourth Age · Region"
 zin_chr_902_title:0 "The Middle Lands"
 zin_chr_903_p1:0 "Aenor Isle lies off the west coast of the Middle Lands and is counted a part of them. Its realm is Orohaf, the realm of the Isle Houses, which are ruled by their eldest women. Their queen is chosen holding her house's steering-oar at the turn of the tide, and the Houses give their dead to the tide."
 zin_chr_903_p2:0 "The Isle Houses are the Water clan of the Low Country, the land the sea took long before Aen, and they say their eldest woman steered the last boat through the Night of the Sea. On the isle's high ground stand the tide-chambers, rock-cut halls that flood at every high water, and the queen is chosen in one of them. The Houses keep this law without knowing why they keep it.\n\nOrohaf counts among the dominions of the Concord and keeps its own law under the Charters of Parim. West of the isle the sea lies shallow, and the fishers' nets bring up field-walls and quern-stones from the banks."
 zin_chr_903_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_903_short:0 "Aenor Isle"
 zin_chr_903_sub:0 "Fourth Age · Region"
 zin_chr_903_title:0 "Aenor Isle"
 zin_chr_904_p1:0 "The Cold Lands are the north-west of Aoaz, its largest landmass and the least known. They run beyond the western and northern edges of every chart, and a broad neck joins them to the West Lands in the south. Their tribes, the yeti of the Yeti Lands, the ice giants of Nivaros and the free towns of the coast live by trade, herding and hunting."
 zin_chr_904_p2:0 "Coldor rules the frozen interior and the western ports and leads the Northern Accord with Horidor. In 4A 850 Coldor's kings brought the frozen interior under one crown; Melkgard refused, and it has been Coldor's rival ever since. Goblins shun the deep cold but hold sheltered valleys in the south of the Cold Lands."
 zin_chr_904_p3:0 "Most of the north shares one root: the fall of the Sunfields, the land of the first men of the north-west, when the winters lengthened and the ice came south. Each heir remembers it differently. Coldor's fire-keepers say the land was punished, and that the fire their forebears carried into the first Long Dark, a red ember in an aurochs horn, is what was spared."
 zin_chr_904_p4:0 "The road-wardens of Horidor still keep the cairns and red-ragged guide-poles their forebears raised over the Neridor Gap for those who walked south. The moor clans of Fearno say that a crown eats first and feeds last. The reindeer clans of Kvittumm say their forebears followed the herds north-west into the ice country and learned from the reindeer how to live there."
 zin_chr_904_p5:0 "Other peoples of the north have other roots: storm-driven crews who swore on a whale's tusk, goblins who crossed a frozen channel behind a lantern, yeti who answer the Hum, giants who say the snow breathes over the ages. Far in the north, above the small town of Yeldenne, stands the Castle of Yeldenne, the hall of Horos."
 zin_chr_904_plate:0 "GFX_zin_chr_plate_cold_lands"
 zin_chr_904_short:0 "The Cold Lands"
 zin_chr_904_sub:0 "Fourth Age · Region"
 zin_chr_904_title:0 "The Cold Lands"
 zin_chr_905_p1:0 "The West Lands lie south of the Cold Lands, joined to them by a broad neck, and snow falls only near the neck. Two dozen kingdoms crowd them, among them Gunwyn, Girdon, Kradlon, Corogon, Varnondor and Lambin, with the hired companies of Buldor. They trade with Aenor across the wide central sea and resent its tariffs."
 zin_chr_905_p2:0 "The West Lands had peoples and kingdoms before Aenor's ships came. Aenor's first settlements there provoked wars with those peoples, and the West remembers the settler wars as theft. Every western court remembers that Aenor once tried to rule it. Aenor reached the West only by ship, and the wide sea made its rule hard to hold."
 zin_chr_905_p3:0 "Aenoran merchants returned to the West between 4A 150 and 212, and the western lords accepted the trade but not the old claims. From 4A 1702 the wars of Gunwyn and Girdon divided the West for half a century, until the two signed the Truce of the Grey Ford in 4A 1745. The truce holds, uneasily, and the West is divided and at peace."
 zin_chr_905_p4:0 "The West shares one grievance and differs in everything else. The downs clans came over the neck on foot, and the Erg clans came down the coast by boat. The settler towns broke with Aenor each in its own way. The dwarf holds of the western ranges lost their deep roads, a great plague made the companies of Buldor, and the small folk fed their neighbours through famine."
 zin_chr_905_plate:0 "GFX_zin_chr_plate_west_lands"
 zin_chr_905_short:0 "The West Lands"
 zin_chr_905_sub:0 "Fourth Age · Region"
 zin_chr_905_title:0 "The West Lands"
 zin_chr_906_p1:0 "Triton's Islands lie west of the West Lands and arc around the Pupor Sea. Adel, Pollos, Raerby, Nondondor and some thirty island lordships live by fishing, piracy and charting. In 4A 702 the islanders charted the Pupor and sold their charts to every crown.\n\nThe chart-islanders are lean, weathered sailors of their own kind, and their words for reef, strait, cape and tide are older than any chart. Every realm of the arcs keeps one piece of a dead league of the sea or of the first crossings. Adel keeps the lead that proves a reef, Raerby the cut fish of its banks-court, Pollos the three keys of a strong-room, and the Lens the league's light."
 zin_chr_906_p2:0 "Halenor keeps the shore-fire that guides kin home and strangers onto the rocks, Santon the black sail of the plague ships, and Nondondor a crown twisted from rope. From the first crossings came Fineger's white ram on the ice, the kites of the Windy Lands and the grey seals of Seite, which no household kills."
 zin_chr_906_p3:0 "Benan's corsairs hold the Cursed Square, a square of reefs that wrecks ships, and never enter it. The islanders hold that the Square is cursed, and they do not agree whether the sickness called the Grey Breath still waits in its wrecks. What the reef-spirits are is the islanders' own belief, and no chronicle tells what lies beneath the Square."
 zin_chr_906_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_906_short:0 "Triton's Islands"
 zin_chr_906_sub:0 "Fourth Age · Region"
 zin_chr_906_title:0 "Triton's Islands"
 zin_chr_907_p1:0 "The North Lands lie north of the Middle Lands across a narrow strait. Lerendor, one crown since Lerendor and Lerendor's North joined their royal houses in 4A 411, is the strongest power of the North and leads the Leren Compact with Eekedor. Its kings are proud and its fleets guard the strait. The smaller crowns, among them Tolvael, Molot, R'en and Mina, look to Lerendor or to Parim as it suits them."
 zin_chr_907_p2:0 "The North Lands were allies of Aenor and never its subjects. In 4A 512 the Treaty of the Narrow Strait bound the North Lands and Aenor to defend each other across the strait. Since the toll quarrel of 4A 1716, when Lerendor's envoys were humiliated in Parim, the Leren court has doubted the treaty."
 zin_chr_907_p3:0 "The crowns of the North are almost all Leren, and each keeps one deed or custom no other crown shares: a whale that led the first captains through the shoals, a steelyard that weighed a raider's sword against grain, marsh stakes moved by night. Dwarves hold the great ranges of the North, and the dwarf goblins, a people of their own, live in the hills near Lerendor.\n\nThe dwarf hold of Hrakbrund, under the High Mountains, keeps a sealed door at the head of an old road under the strait. No chronicle tells where the dwarves or the dwarf goblins first came from, who cut the smooth square workings in Mina's ore hills, or what lies beyond Hrakbrund's door."
 zin_chr_907_plate:0 "GFX_zin_chr_plate_north_lands"
 zin_chr_907_short:0 "The North Lands"
 zin_chr_907_sub:0 "Fourth Age · Region"
 zin_chr_907_title:0 "The North Lands"
 zin_chr_908_p1:0 "The Dark Lands lie between the North Lands and the Middle Lands, across narrow straits, on the Sea of Darkness. Goldoroth, an orc kingdom, wants the whole region; Dondor, a kingdom of men, leads the Dark Sea Accord against it. Bordon, Dreson, Dulundur, the Troll Forest and a dozen orc and goblin holds belong to nobody."
 zin_chr_908_p2:0 "The Dark Lands were never one realm. Men, orcs, goblins, trolls, ogres, giants and demons live there under separate rulers, and none of them is Volgan's by nature. Smash, the troll king, rules the trolls of his own forest only. Volgan's envoys court the holds, and most still answer only to themselves."
 zin_chr_908_p3:0 "Volgan opened dealings with Dark Lands powers in the First Age, and orcs and goblins marched in his armies, while other parts of the Dark Lands joined the Grand Alliance. Dark Lands soldiers fought on both sides in his war. In the Third Age the Necromancer relied on orc and goblin hosts, and the Buried Wars of 3A 431 to 690 wore down his strength."
 zin_chr_908_p4:0 "The roots of these realms are the stories of peoples who were used by masters, left behind by them, or refused them, and each realm's law grew from the way it met a master. The orcs of the iron hills chant the Long Walk of the clans left on a lost field, and the sea orcs of the isles broke the shackles of the galleys they rowed. In about 4A 1450 orc warlords united the inner Dark Lands as Goldoroth, and its wars with Dondor began."
 zin_chr_908_plate:0 "GFX_zin_chr_plate_dark_lands"
 zin_chr_908_short:0 "The Dark Lands"
 zin_chr_908_sub:0 "Fourth Age · Region"
 zin_chr_908_title:0 "The Dark Lands"
 zin_chr_909_p1:0 "The Magical Lands lie east of the Middle Lands on the same landmass, parted from them by the mountains of the Great Wall of Aenor, and a long rift sea parts them from the East Lands. They hold the Magical Forest, the Mushroom Forest of the mycids, the Magic Mountains, Herrodon, Andos Enda and Nolorim, which guards the high passes."
 zin_chr_909_p2:0 "The elves of the Magical Lands were never conquered, not by Volgan's corrupted kin and not by Elzon. They helped the Grand Alliance in Volgan's war and afterwards kept the Elven Refusal. The Magical Forest is the oldest and most peaceful of their realms, ruled by an elected council of houses. Around it lie twenty smaller elven realms, and Herrodon and Andos Enda are old rivals."
 zin_chr_909_p3:0 "The roots of these realms are not stories of empire. Each is one deed, gift, loss or oath from which a small community's law grew. The council of the Magical Forest speaks only while a house holds a bough that the grove has let fall, and nobody breaks a bough from a living tree. The rule was broken once, when the houses felled the northern wood against the Black Roots in 3A 802."
 zin_chr_909_p4:0 "The elven powers can command the dragons of Dragon Mountain. The rift-coast elves were neighbours of the Bridge Kingdom of the deep past and never its subjects, and the ferry of Luv-zhise still crosses its drowned road. In the Zilin Hills stands the Worshipdom, a temple-state of the Deliverer that holds three valleys and almost no army. Its pilgrim houses feed and doctor a guest before they ask who he is."
 zin_chr_909_plate:0 "GFX_zin_chr_plate_magical_lands"
 zin_chr_909_short:0 "The Magical Lands"
 zin_chr_909_sub:0 "Fourth Age · Region"
 zin_chr_909_title:0 "The Magical Lands"
 zin_chr_910_p1:0 "Zol's Mistake is a vast black region of the north: a barren wasteland and all the black islands of the Kusmeel. It is almost empty of the living and roamed by the dead. It takes its name from Zol, the Old God of Death and the only Old God in Aoaz. No chronicle tells what made the land a Mistake.\n\nZol came to the black north long before Aen and Volgan, and the land was already desolate. In the First Age his power there lay dormant: its lands gave no armies and no help to anyone, and he took no part in the battle of Dardan. Zol has no body in Aoaz."
 zin_chr_910_p2:0 "The realm is held in the name of Zol, and its seat is Furviatlon. It is not known who keeps Furviatlon. The dead who wander the land have no known allegiance, and the scholars do not agree what they are.\n\nThe Mistake has no founder, no first king and no tongue of its own, so the living of the north tell its roots from the sea. The oldest sea-words of the north-west have a word for the black coast that means only the shore from which nothing comes back. On the outer isles someone laid the dead inside rings of black stones, each ring left open on its northern side, and nobody knows whose hand that was."
 zin_chr_910_p3:0 "The Leren fishers who began to winter on the isles in 4A 230 took up the custom, because the dead belong to the Old God of Death and a closed ring would be a theft from him. They leave the first fish on the black shore, keep silence on still nights and never speak a certain name at sea. The winter tales of the north tell of Kusven, the grave-wind.\n\nIn 4A 1744 fishermen of the isles told of black ships among the islands of the Kusmeel. Nobody in a royal court believed them."
 zin_chr_910_plate:0 "GFX_zin_chr_plate_zols_mistake"
 zin_chr_910_short:0 "Zol's Mistake"
 zin_chr_910_sub:0 "Fourth Age · Region"
 zin_chr_910_title:0 "Zol's Mistake"
 zin_chr_910_x1_p1:0 "The dead of the Mistake rose and went out beyond it, and the fishermen's tales of black ships proved true. These dead were held together by Zol's own magic, and ordinary weapons could not end them."
 zin_chr_911_p1:0 "The East Lands lie across the rift sea in the east and run off the eastern edge of every chart. They are the richest region of Aoaz and the most divided. Noris, with Naamis in the Noris Treaty, and Stabilo, with Drak in the Stabilo Pact, compete for the caravan roads, and Alerhia, Erco, Plutondo and many others are great kingdoms in their own right.\n\nThe great caravan roads of the East opened between 4A 600 and 780. Noris and Stabilo grew rich on them, and the rivalry they began then has never fully ended."
 zin_chr_911_p2:0 "The realms of the East are built on two memories. The older is the Bridge Kingdom, from the days when one Eastern people held both shores before the rift opened. Alerhia's stair, the pillars of the Delbiz horse-fair, Stabilo's bronze Measure, Ostoroth's cedar, Mora's hot lake and the flood that sent Orato's families onto their heights all keep it."
 zin_chr_911_p3:0 "The younger memory is the Kalioth Crown of the First Age, which almost every realm of the south and the desert remembers from underneath: Noris's locked wells, Drak's broken collars, Plutondo's glass ploughshares and Erco's buried diadem. The north coast remembers Volgan's ship-tax, which made Naamis a crown of harbour-mothers and Woqood a people of refusers."
 zin_chr_911_p4:0 "No chronicle tells what broke the land between the shores, or what became of the Kalioth Crown's provinces beyond the Melty Pass. The salt-boilers say that something breathes under the Hot Lake, and the scholars do not agree whether they are right."
 zin_chr_911_plate:0 "GFX_zin_chr_plate_east_lands"
 zin_chr_911_short:0 "The East Lands"
 zin_chr_911_sub:0 "Fourth Age · Region"
 zin_chr_911_title:0 "The East Lands"
 zin_chr_912_p1:0 "The South Lands are the great desert of the East Lands, which stretches south beyond the edge of every chart. Its two realms are Miaed of the gorge-houses and Wahatud of the well-clans of the dune sea, and they are built on two kinds of water.\n\nMiaed sells water, to the going and the coming alike. Its gorge-houses found the paths of the Hardtmuth by following the black ibex, which they never hunt. Its pass-lords sold water and guides on the passes to Volgan's eastern clients and to the host of the Kalioth Crown going north, and sold water again to that host's starving remnant when it came back."
 zin_chr_912_p2:0 "Wahatud gives water before it asks a name. Its dark-skinned well-clans keep a compact with the sand golems that the oasis-folk believe sleep in the dunes. They keep the tale of the white dune, where a dying clan-mother left her last water for a stranger, and her clan found a spring and a white feather.\n\nBeyond the last well lie the burning lands, home of devils, demons and other evil beings that live in fire and endless suffering. They are known by name only, a name of dread, and no traveller's chart shows them. Angels too are known in the South, but no chronicle tells their history or their purpose."
 zin_chr_912_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_912_short:0 "The South Lands"
 zin_chr_912_sub:0 "Fourth Age · Region"
 zin_chr_912_title:0 "The South Lands"
 zin_chr_913_p1:0 "The Ember Lands lie south of the Middle Lands and are the chief dominion of Volgan, the Great Spirit and the first of the dark lords. They hold Mirolon, Nan, Khorvrath, Dolon, Nezer and the Nether. Volgan's seat is Nafeher; the demon realms of Khorvrath, Dolon and Nezer are bound to him in the Southern Dominion, and Mirolon stands against him. Nazerun is the old name of Nezer."
 zin_chr_913_p2:0 "Volgan's realm holds grave hosts, demons of the Netherborn, orcs, ogres, monster clans and necromantic orders, but his rule does not reach every power of the Dark Lands or every monster of the north. Fierce storms at sea and the heavy heat farther south long kept the explorers of men out of the Ember Lands."
 zin_chr_913_p3:0 "In the latter First Age Volgan invaded Mirolon and made it the opening of his war against Aenor. After his defeat the spirits banished him to the Void, and when the Grand Alliance tried to conquer the Ember Lands, Elzon led the remaining defenders and drove it back. In the Third Age Volgan could not leave the Ember Lands while Elzon ruled Aenor in his name, and the native magic of the Ember Lands sustained the Necromancer."
 zin_chr_913_p4:0 "The Nether, seat of the demon king, lies in the south, and the Abyss of Roka lies in the Ember Lands as well; neither is the Void that once held Volgan. The realms here are Puvulan, Volgan's own realm about the Gate of Nafeher, three demon houses who each carried one craft up out of the Halls beneath the Nether, the court that seals every pact, and the men of the peninsula.\n\nThe men of the peninsula take their signs from how they lived beside the Dominion: watching it from the swamps, as Mirolon did, salting their dead against it, fleeing it through the storm belt, or sheltering what escapes from it."
 zin_chr_913_plate:0 "GFX_zin_chr_plate_ember_lands"
 zin_chr_913_short:0 "The Ember Lands"
 zin_chr_913_sub:0 "Fourth Age · Region"
 zin_chr_913_title:0 "The Ember Lands"
 zin_chr_914_p1:0 "The Islands of the South lie in two arcs south of the West Lands. Howan, Nara, Verde, Enhis Is Rond and the other island realms are small, poor and hospitable. Aenoran voyages reached them in the First Age, and the island peoples supplied the Grand Alliance in Volgan's war.\n\nThe islands share the guest-right and the Wave-Tally, which began when the first canoes counted their dead as waves on the reef. Each realm keeps one object of its own way of life that its oldest tale made sacred: a diving stone, an upswept roof, a mangrove, a quenched torch, a cane fish-trap, a hand blown in ochre, a water divider and a slit-drum."
 zin_chr_914_p2:0 "One shrine of the islands, drowned beneath the tide by the Rising Tide of 2A 40, repeats Aen's name, and the islanders do not know why. No chronicle tells who carved the name there, or when. Nor does any tell what calls from the Night Reef, or where the first canoes of the Yong villages came from."
 zin_chr_914_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_914_short:0 "The Islands of the South"
 zin_chr_914_sub:0 "Fourth Age · Region"
 zin_chr_914_title:0 "The Islands of the South"
 zin_chr_915_p1:0 "The Lands of the Sun lie in the far south-west and run beyond the southern edge of every chart. Elvana, Igara, Soyano, Yeni Alang and Tor Luni lie here, by the Sea of Gods. The Sunhot elves, a people far taller than men and among the strongest and most peaceful of Aoaz, live in many small realms led by the Lands of Light."
 zin_chr_915_p2:0 "Among them the Gala elves keep their ancient court under King Lorien, and they are the most powerful of the elves. Lorien led the Gala host in Volgan's war, and lost many of his people in King Edran's invasion of the Ember Lands, which he had opposed. Whether the two peoples are kin, no chronicle of men can say."
 zin_chr_915_p3:0 "Each realm of the South-West keeps one deed or custom no other shares. Gala keeps a spring and a white hind. The Lands of Light keep the noon-door and the only sun among the banners of the region. The cape keeps a silk-moth, the shallows a crane, the terraces a still ribbon and the quarries a broken chisel."
 zin_chr_915_p4:0 "The isles keep a shared canoe and a mother-keel. The Sunfolk of Goodin, men who came as boat-folk, keep the spear reversed as guests do. The forest of the Keepers holds one winged seed and its silence, and the Keepers are forest spirits never fully shaped like men. No chronicle tells who raised the standing stones of Tor Luni, or what lies beyond the south-western sea."
 zin_chr_915_plate:0 "GFX_zin_chr_plate_lands_of_sun"
 zin_chr_915_short:0 "The Lands of the Sun"
 zin_chr_915_sub:0 "Fourth Age · Region"
 zin_chr_915_title:0 "The Lands of the Sun"
 zin_chr_916_p1:0 "Parim is the seat of Aenor, the Middle Kingdom, on the Great Lake of the Middle Lands. The Golden King has reigned here since 4A 1729. He sells offices, rewards flatterers and spends the treasury on the Golden Court, yet the institutions of seventeen centuries keep the kingdom running.\n\nIn 4A 1, after Elzon's death, Harion of Selen was crowned at Parim and the monarchy was restored. In 4A 3 the Charters of Parim bound the surviving dominions to the crown as self-governing members of a common defence. Between 4A 40 and 120 the roads, the canals and the ports of the Great Lake were rebuilt."
 zin_chr_916_p2:0 "In 4A 212 the First Concord Council met in Parim, and the dominions and the crown agreed on a common army in war and free roads in peace. The universities of Parim and Selen were founded in 4A 340, and their scholars keep this chronicle. In 4A 1000 Parim celebrated a thousand years of peace before envoys from every region.\n\nIn 4A 1733 the Golden Court was completed in Parim: a palace district of gilded halls where offices, titles and charters are bought."
 zin_chr_916_plate:0 "GFX_zin_chr_plate_parim"
 zin_chr_916_short:0 "Parim and the Great Lake"
 zin_chr_916_sub:0 "Fourth Age · City"
 zin_chr_916_title:0 "Parim and the Great Lake"
 zin_chr_916_x1_p1:0 "A western army crossed the wide sea and held Parim. The kingdoms of the West Lands, which Aenor had once tried to rule, stood in the crown city of Aen's kingdom."
 zin_chr_916_x2_p1:0 "Afrit came back to Parim and took the crown city again. From the seat of Aen's kingdom he claimed kingship over all Aoaz."
 zin_chr_917_p1:0 "Selen is a region and a realm of the Middle Lands within the sphere of Aenor, and one of the dominions of the Concord. It has long been known for its rangers. Its arrangements with the crown at Parim have changed across the ages.\n\nSelen's roots lie in the War of Men. Three bands broken in that war fled into the Weald in one winter and swore the Quiet Law to the Lord of the Weald, a Wild Spirit whose rank the moots will not discuss. They laid three arrows point-down at the oak that is now the Moot Tree. The Host of Selen bears the three arrows still, and turns their points up when it musters."
 zin_chr_917_p2:0 "Harion of Selen was crowned at Parim in 4A 1, the first king of the restored monarchy. In 4A 340 the university of Selen was founded beside that of Parim, and physicians of the Houses of the First Light teach in both."
 zin_chr_917_plate:0 "GFX_zin_chr_plate_selen"
 zin_chr_917_short:0 "Selen"
 zin_chr_917_sub:0 "Fourth Age · Realm"
 zin_chr_917_title:0 "Selen"
 zin_chr_918_p1:0 "The Great Wall of Aenor is no wall built by hands but an enormous natural range of mountains. It runs from the Organ Mountains past Lunhrim and around Kingson, and parts the Middle Lands from the Magical Lands. Its passes, valleys and snowlines decide the roads between the two lands, and dwarves hold the range."
 zin_chr_918_p2:0 "Elzon's Order held watch-posts in the passes against the Magical Lands, which it never conquered. In 4A 96, by the Accord of the Passes, Harion's grandson and the elven realms agreed to keep a few passes guarded rather than open every road. The elves wanted their old separation; the kings wanted customs posts on the pass roads and a watch against the dragons of the east."
 zin_chr_918_p3:0 "The vale of Kingson says that Aen set one of his sons to keep a fire at the pass. Under the Order's ban on fire the watch-families carried the vigil ember from hearth to hearth in iron tongs for nearly twelve centuries, and in 3A 1244 they carried it up to open the forts again.\n\nThe Klungori Guard, heirs of the last company of the Unbinding, keep their tower in the range and have sworn not to disband until the last of the Order's creatures leaves it. Kunhrim, the dwarf hold of the range, keeps a sealed door at the head of an old road."
 zin_chr_918_plate:0 "GFX_zin_chr_plate_great_wall"
 zin_chr_918_short:0 "The Great Wall of Aenor"
 zin_chr_918_sub:0 "Fourth Age · Mountains"
 zin_chr_918_title:0 "The Great Wall of Aenor"
 zin_chr_918_x1_p1:0 "War came into the range, and a pass of the Great Wall changed hands. The Accord of the Passes, kept since 4A 96, was broken."
 zin_chr_919_p1:0 "Two lands of the Middle Lands reject the crown of Aenor: the Cursed Lands of the grey downs and the Bloody Forest of the red oaks. Neither belongs to the Concord. Both keep the Orran tongue and a law of mothers older than Aenor.\n\nThe Veiled of the Cursed Lands keep their law on cords. Every field the sea took from the Low Country was tied in black on the Moot's cord, and the Last Cord lies in the eldest barrow of the downs. When the Black Roots soured the downs, the Veiled counted them the second land to die of asking."
 zin_chr_919_p2:0 "In the Bloody Forest the Wolf, Bear and Raven clans hung their mothers' cords in the red oaks, which bleed when they are cut. A war-chief there serves for one war only, and it is the mothers who end the feuds.\n\nThe Veiled tell of the drowned land as “the land that was asked for too much”. The giants of Hirolon will say no more of it than that."
 zin_chr_919_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_919_short:0 "Lands That Refuse the Crown"
 zin_chr_919_sub:0 "Fourth Age · Lands"
 zin_chr_919_title:0 "Lands That Refuse the Crown"
 zin_chr_920_p1:0 "Mirolon is a kingdom of men in the Ember Lands, and the one realm of the Ember Lands that stands against Volgan. In the latter First Age Volgan invaded Mirolon and made it the opening of his vast war against Aenor and its allies. After his defeat Mirolon was lost to him.\n\nThe lake-kingdom's survivors hid for five centuries in the Great Swamp and read Volgan's patrols by the herons. Hadric hung the crown in the beacon tower, and Mirolon's sign is a grey heron standing watchful."
 zin_chr_920_p2:0 "In about 4A 1650 Mirolon fortified its northern passes. In 4A 1736 a Mirolonese envoy warned Parim that the Ember Lands were arming. The court laughed: Volgan had been quiet for longer than Aenor had had kings.\n\nThe elves of Nolorim, the herders of the heights who traded with Mirolon's shore, remember the night of Volgan's invasion. Their eldest herder blew the great horn of the heights until its bell split, and the warning came too late. At dawn the families swore that the warning would never come late again."
 zin_chr_920_plate:0 "GFX_zin_chr_plate_mirolon"
 zin_chr_920_plate_after:0 "GFX_zin_chr_plate_mirolon_fallen"
 zin_chr_920_short:0 "Mirolon"
 zin_chr_920_sub:0 "Fourth Age · Realm"
 zin_chr_920_title:0 "Mirolon"
 zin_chr_920_x1_p1:0 "Volgan retook Mirolon, the kingdom he had first conquered in the First Age and lost after his defeat."
 zin_chr_921_p1:0 "The Nether lies in the south of the Ember Lands and is the seat of the demon king, whom men call the King of Demons. In the Second Age the demon Agon and many other demons were active here, and demons came out through portals to raid Aenor and other lands. How far the demon king's rule reaches is not known, and no chronicle gives his name.\n\nHis pacts bind the living; the souls of the dead remain Zol's. The Nether is not the Void where Volgan was banished, nor the Abyss of Roka, nor the burning lands south of the South Lands, which are known by name only."
 zin_chr_921_p2:0 "The houses of the Nether cut the Halls beneath Mount Nether and took a king whose seal is burned into every pact. That seal, the one five-pointed figure of Aoaz, stands inside a ring of fire. Whether the demon king commands all the Netherborn, and what he owes to Volgan, the scholars do not agree."
 zin_chr_921_plate:0 "GFX_zin_chr_plate_nether"
 zin_chr_921_short:0 "The Nether"
 zin_chr_921_sub:0 "Fourth Age · Realm of Demons"
 zin_chr_921_title:0 "The Nether"
 zin_chr_922_p1:0 "The Abyss lies within the Ember Lands. Roka and the Necklace of the Abyss are bound up with its name. No chronicle tells exactly where it lies, what Roka is, or what powers the necklace holds.\n\nThe Abyss is not the Void that imprisoned Volgan, and it is not the Nether in the south, where the demon king has his seat. Whether these places touch one another in any way, the scholars do not agree."
 zin_chr_922_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_922_short:0 "The Abyss"
 zin_chr_922_sub:0 "Fourth Age · Place"
 zin_chr_922_title:0 "The Abyss"
 zin_chr_923_p1:0 "Furviatlon is the seat of Zol's Mistake, the black realm held in the name of Zol, the Old God of Death. It is not known who keeps Furviatlon, or what kind of being keeps it. Aenor counts the black north its rival.\n\nŠodolôro lies within the Mistake. The winter tales of the north say it is the dwelling of Kusven, the grave-wind, who serves the Old God of Death. What Kusven truly is, no chronicle tells."
 zin_chr_923_p2:0 "The realm is held under the broken concentric rings of the Will of Zol. The rings first appear on an Aenoran chart of 1A 470, where a pilot of the northern voyages drew them on flat water beside the name, broken where his pen lifted. To the living the sign means that what dies is owed."
 zin_chr_923_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_923_short:0 "Furviatlon and Šodolôro"
 zin_chr_923_sub:0 "Fourth Age · Places"
 zin_chr_923_title:0 "Furviatlon and Šodolôro"
 zin_chr_924_p1:0 "Dragon Mountain is where the dragons of Aoaz chiefly come from. The dragons form no country, and the elven powers can command them.\n\nThe keepers of Yavieth live under its three spurs. Long before Aen, their tale says, elves fleeing a hard winter sheltered there, and a dragon came among them, spared them and left a shed scale by their fire. Their eldest climbed to give it back, and the dragon would not take it; the bond began with that refused gift."
 zin_chr_924_p2:0 "The keepers take only shed scale, never a dragon's blood, and keep no lists of names. Without their word no realm of the elven kindred asks a dragon for help. Since the Accord of 4A 96 the kings of Aenor have kept a watch in the passes of the Great Wall against the dragons of the east."
 zin_chr_924_plate:0 "GFX_zin_chr_plate_dragon_mountain"
 zin_chr_924_short:0 "Dragon Mountain"
 zin_chr_924_sub:0 "Fourth Age · Mountain"
 zin_chr_924_title:0 "Dragon Mountain"
 zin_chr_925_p1:0 "Dardan was the decisive battle of the First Age war against Volgan. It claimed millions of lives and left a wasteland behind. There the Grand Alliance defeated Volgan, and other spirits stripped his power and banished him. No map of this age marks it, and the scholars do not agree where it lay.\n\nNo chronicle tells how long the battle lasted, or by what rite the spirits bound him."
 zin_chr_925_p2:0 "Every people of Aoaz had its dead on that field. Volgan's host held corrupted elves, allied men of the east and south, orcs, goblins, demons, devils, monsters, dragons, Great Spirits and Damned Spirits. Against them stood the Grand Alliance: the men of Aenor and the western kingdoms, the elves, the dwarves, the giants, spirits, island peoples and some free forces of the Dark Lands."
 zin_chr_925_p3:0 "The peoples remember their dead. The orc Fire-Speakers chant the Long Walk of the clans who were left on the field when the battle was lost and walked home through hostile country. The chroniclers of the East record that the host of the Kalioth Crown stood with Volgan's and died there.\n\nAfter the battle the Alliance's host broke, and the Ember Lands stayed unconquered. Elzon organised the last defence and threw back the Alliance's invasion, and the elves' losses in that failure left a long resentment of Aenor's king."
 zin_chr_925_plate:0 "GFX_zin_chr_plate_cat_lands"
 zin_chr_925_short:0 "The Field of Dardan"
 zin_chr_925_sub:0 "First Age · Battlefield"
 zin_chr_925_title:0 "The Field of Dardan"
 zin_chr_926_p1:0 "The Castle of Yeldenne stands in the far north of the Cold Lands, in Mp'E, above Yeldenne, an ordinary small town. Its lord is Horos, a Great Spirit and an enormous armoured knight, who has kept his hall through the ages. Beneath the castle lie his halls under the earth.\n\nHoros guards a green crystal of old and holy power, which the chronicles call Glo. It is said to hold part of the power of Glernaen, a true New God of Power and Wisdom. In his throne-hall the crystal shines below the seat of the knight, and he keeps it against every claimant."
 zin_chr_926_p2:0 "The shepherds of Pertolor leave a loaf and a fleece at the start of the Silent Road beyond the town of Yeldenne, as the due of the black-faced ram that once led their lost flock down out of the valley of Mp'E. Nobody of the vale walks on. The people of Mp'E believe that the Watcher in the Hall is a sleeping king of the old north.\n\nNo chronicle tells who built the castle, how the crystal came into the keeping of Horos, or why it may pass only to one worthy of it."
 zin_chr_926_plate:0 "GFX_zin_chr_plate_castle_yeldenne"
 zin_chr_926_plate_after:0 "GFX_zin_chr_plate_castle_yeldenne_empty"
 zin_chr_926_short:0 "The Castle of Yeldenne"
 zin_chr_926_sub:0 "Fourth Age · Castle"
 zin_chr_926_title:0 "The Castle of Yeldenne"
 zin_chr_926_x1_p1:0 "Horos died in his hall. A crowned stranger from the south came for the crystal and wounded the knight from behind, and fled bleeding when the Man from the Ice struck him. Dying, Horos took the crystal from his chest, for it was his own heart, and placed it in the hands of the Man from the Ice, with his blue sword. Then his form crumbled to dust.\n\nThe throne-hall of Yeldenne stands empty, and no knight keeps it."
 ZIN_CHR_AGE_TT:0 "§HThe Fourth Age of Aoaz§!\nYears are counted from the first restored king.\n\nOpen the Chronicle of Aoaz.[ROOT.zin_chr_unread_line]"
