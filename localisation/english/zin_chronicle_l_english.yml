 zin_chr_foreword_p1:0 "These are the histories of Aoaz as the scholars of Parim and Selen keep them: the order of being, the ages of the world and their wars, the figures, peoples and lands of Aoaz, the realms and their signs, the orders of the living and the relics of the past."
 zin_chr_foreword_p2:0 "The scholars write down what is known. Where they do not know, they say so. When the age writes new pages, the Chronicle keeps them too."
 zin_chr_foreword_page:0 "These are the histories of Aoaz as the scholars of Parim and Selen keep them: the order of being, the ages of the world and their wars, the figures, peoples and lands of Aoaz, the realms and their signs, the orders of the living and the relics of the past.\n\nThe scholars write down what is known. Where they do not know, they say so. When the age writes new pages, the Chronicle keeps them too."
