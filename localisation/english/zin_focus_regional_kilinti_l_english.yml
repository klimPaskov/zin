l_english:
 zin_regional_kilinti_a_moot_of_seasons:0 "A Moot of Seasons"
 zin_regional_kilinti_a_moot_of_seasons_desc:0 "The Moot is held four times a year, at the turning of the seasons, and each time it takes up exactly what it set down the time before. Nothing is ever left unfinished and nothing is ever hurried."
 zin_regional_kilinti_against_the_deathless:0 "Against the Deathless"
 zin_regional_kilinti_against_the_deathless_desc:0 "The ents stand against the host that does not die. Roots crush and branches strike, and when the dead rise again, the ents are still there."
 zin_regional_kilinti_against_the_deathless_tip_1:0 "Root and branch break the dead; they do not end them."
 zin_regional_kilinti_bows_of_the_clearings:0 "Bows of the Clearings"
 zin_regional_kilinti_bows_of_the_clearings_desc:0 "The hunters of the clearings are taught to draw together, loose together and fall back together. They fight best from the trees, and so they do."
 zin_regional_kilinti_clearings_and_villages:0 "Clearings and Villages"
 zin_regional_kilinti_clearings_and_villages_desc:0 "The clearings are sown, the villages are walled and the paths between them are cleared of brush. The ents stand at the edge of each, and nobody has ever asked them to go."
 zin_regional_kilinti_forest_heals:0 "The Forest Heals"
 zin_regional_kilinti_forest_heals_desc:0 "Saplings spring up where the burning was, and the ents walk slowly home."
 zin_regional_kilinti_forest_rangers:0 "Rangers of the Deep Woods"
 zin_regional_kilinti_forest_rangers_desc:0 "Rangers who walk where the ents walk, and leave no track."
 zin_regional_kilinti_forest_villages:0 "Clearings and Villages"
 zin_regional_kilinti_forest_villages_2:0 "The People of the Eaves"
 zin_regional_kilinti_forest_villages_2_desc:0 "The forest peoples grow in number beneath the eaves, nearly the ents' kin."
 zin_regional_kilinti_forest_villages_desc:0 "Walled villages in the clearings, sown fields beneath the trees."
 zin_regional_kilinti_grove_hosts:0 "Grove Hosts"
 zin_regional_kilinti_grove_hosts_desc:0 "The groves are organised into hosts of their own, led by an ent and followed by a company of forest peoples. They do not march far, but they do not move back either."
 zin_regional_kilinti_grove_wardings:0 "Grove Wardings"
 zin_regional_kilinti_grove_wardings_desc:0 "The ents sing the old wardings, low and slow, and the trees answer. Few men can hear it, and none who have heard it forget."
 zin_regional_kilinti_groves_march:0 "The Groves March"
 zin_regional_kilinti_groves_march_desc:0 "Root from soil, the groves walk to the border."
 zin_regional_kilinti_no_axe_in_the_old_wood:0 "No Axe in the Old Wood"
 zin_regional_kilinti_no_axe_in_the_old_wood_desc:0 "Kilinti petitions the crown to remove the oldest groves from the timber contracts for good. The Golden Court, which wants the oldest trees, will not be pleased."
 zin_regional_kilinti_oaths_older_than_crowns:0 "Oaths Older Than Crowns"
 zin_regional_kilinti_oaths_older_than_crowns_desc:0 "The ents swore to guard the forest long before there was a crown to guard it for. Their oath to the Concord is a younger and lesser thing, kept faithfully, in its place."
 zin_regional_kilinti_paths_only_we_know:0 "Paths Only We Know"
 zin_regional_kilinti_paths_only_we_know_desc:0 "The forest peoples share with the ents the paths no stranger has ever found. A host that enters Kilinti without a guide will not come out."
 zin_regional_kilinti_people_of_the_eaves:0 "The People of the Eaves"
 zin_regional_kilinti_people_of_the_eaves_desc:0 "The forest peoples grow in number under the eaves, and no one now speaks of leaving. They are the ents' neighbours, and nearly their kin."
 zin_regional_kilinti_rangers_of_the_deep_woods:0 "Rangers of the Deep Woods"
 zin_regional_kilinti_rangers_of_the_deep_woods_desc:0 "The rangers of the deep woods walk where the ents walk. They sleep in the roots of the oldest trees and travel without leaving a track."
 zin_regional_kilinti_refuge_in_the_trees:0 "Refuge in the Trees"
 zin_regional_kilinti_refuge_in_the_trees_desc:0 "Villagers from the burning lands flee into the forest, and the ents let them pass. The woods have always been a refuge, and are one again."
 zin_regional_kilinti_rooted_defence:0 "Rooted Defence"
 zin_regional_kilinti_rooted_defence_desc:0 "The forest peoples build their forts in the roots of the oldest trees, and the ents lean in to help. The result is a wall no ram can take."
 zin_regional_kilinti_scholars_among_the_trees:0 "Scholars Among the Trees"
 zin_regional_kilinti_scholars_among_the_trees_desc:0 "Scholars from Selen and Parim visit Kilinti, to sit at the roots and listen. The ents teach them one thing a year, and that only when asked."
 zin_regional_kilinti_scholars_in_the_woods:0 "Scholars Among the Trees"
 zin_regional_kilinti_scholars_in_the_woods_desc:0 "Scholars sit at the roots and listen; the ents teach them one thing a year."
 zin_regional_kilinti_secret_paths:0 "Paths Only We Know"
 zin_regional_kilinti_secret_paths_desc:0 "A host that enters Kilinti without a guide does not come out."
 zin_regional_kilinti_slow_counsel:0 "Slow Counsel"
 zin_regional_kilinti_slow_counsel_2:0 "A Moot of Seasons"
 zin_regional_kilinti_slow_counsel_2_desc:0 "The Moot meets at each turning of the year, and no matter is ever left half-finished."
 zin_regional_kilinti_slow_counsel_desc:0 "A question raised at Thaw is answered at Harvest, and the answer holds."
 zin_regional_kilinti_slow_march:0 "The Slow March"
 zin_regional_kilinti_slow_march_2:0 "The Forest Stands"
 zin_regional_kilinti_slow_march_2_desc:0 "The forest stands as one, trunk by trunk and root by root."
 zin_regional_kilinti_slow_march_desc:0 "The groves march at the pace of a seedling, and arrive when they mean to."
 zin_regional_kilinti_the_burning_remembered:0 "The Burning Remembered"
 zin_regional_kilinti_the_burning_remembered_desc:0 "The ents remember the forests of the Third Age burning and growing back. The memory is not bitter; it is patient, and it shapes every decision they make."
 zin_regional_kilinti_the_forest_heals:0 "The Forest Heals"
 zin_regional_kilinti_the_forest_heals_desc:0 "The war is over, and the forest begins to close its wounds. Saplings spring up where the burning was, and the ents walk slowly home."
 zin_regional_kilinti_the_forest_peoples:0 "The Forest Peoples"
 zin_regional_kilinti_the_forest_peoples_desc:0 "Beneath the old trees live the forest peoples, woodcutters, hunters and herders of the clearings. They speak for Kilinti where the ents cannot be hurried."
 zin_regional_kilinti_the_forest_stands:0 "The Forest Stands"
 zin_regional_kilinti_the_forest_stands_desc:0 "The forest of Kilinti stands as one, trunk by trunk and root by root. It will not advance, and it will not yield."
 zin_regional_kilinti_the_great_moot:0 "The Great Moot"
 zin_regional_kilinti_the_great_moot_desc:0 "The ents of the old woods speak slowly. A question raised at Thaw is answered at Harvest, if at all, and the answer is generally that it was a good question."
 zin_regional_kilinti_the_groves_march:0 "The Groves March"
 zin_regional_kilinti_the_groves_march_desc:0 "The groves rise in the night, root from soil, and walk to the border. The sound is like a long slow wind, and the enemy hears it before they see it."
 zin_regional_kilinti_the_heirs_woodsmen:0 "The Heir's Woodsmen"
 zin_regional_kilinti_the_heirs_woodsmen_desc:0 "The forest peoples go to the Heir with their bows and their axes. The ents do not go, but they make it known that the roads through Kilinti are open to him."
 zin_regional_kilinti_the_hush_of_the_forest:0 "The Hush of the Forest"
 zin_regional_kilinti_the_hush_of_the_forest_desc:0 "Pilgrims walk at the forest's edge, speaking quietly, as one does in a place older than speech. The ents watch them go by and say nothing for a season."
 zin_regional_kilinti_the_moot_decides:0 "The Moot Decides"
 zin_regional_kilinti_the_moot_decides_desc:0 "After a year and a day, the Great Moot gives its answer. The answer is short, and everyone present has already known it for months."
 zin_regional_kilinti_the_old_charter:0 "The Old Charter"
 zin_regional_kilinti_the_old_charter_desc:0 "The Charters of Parim ask very little of Kilinti: timber and the occasional courtesy. The ents have kept the bargain for centuries, and see no reason to stop."
 zin_regional_kilinti_the_slow_march:0 "The Slow March"
 zin_regional_kilinti_the_slow_march_desc:0 "The groves can march, if they are asked, and if the ask is courteous. They go at the pace of a seedling and arrive when they mean to."
 zin_regional_kilinti_the_timber_buyers:0 "The Timber-Buyers"
 zin_regional_kilinti_the_timber_buyers_desc:0 "The Golden Court's timber-buyers want the oldest trees, and have the contracts to prove it. The Moot has not agreed to sell, and is in no hurry to disagree."
 zin_regional_kilinti_the_woods_awake:0 "The Woods Awake"
 zin_regional_kilinti_the_woods_awake_desc:0 "The Great Moot has met, and the answer is short. The groves are awake, and everything that threatens them will find the forest less patient than it was."
 zin_regional_kilinti_timber_for_the_crown:0 "Timber for the Crown"
 zin_regional_kilinti_timber_for_the_crown_desc:0 "The forest peoples fell young timber for the crown, and the sawmills of Kilinti hum in the autumn. The Moot has marked the groves that may not be touched."
 zin_regional_kilinti_voices_of_the_old_trees:0 "Voices of the Old Trees"
 zin_regional_kilinti_voices_of_the_old_trees_desc:0 "The eldest trees are heard before the youngest, and the youngest are heard before the saplings. The Moot begins with a silence that may last a day."
 zin_regional_kilinti_wake_the_groves:0 "Wake the Groves"
 zin_regional_kilinti_wake_the_groves_desc:0 "The groves of Kilinti are older than the Concord, older than the Wall and older than any living memory. When the Moot decides, they wake, and not before."
 zin_regional_kilinti_wardens_of_the_concord:0 "Wardens of the Concord"
 zin_regional_kilinti_wardens_of_the_concord_desc:0 "Kilinti offers the Concord a company of forest-wardens, to serve on its frontier. The Golden King accepts, and the ents do not say what they think of it."
 zin_regional_kilinti_woods_awake:0 "The Woods Awake"
 zin_regional_kilinti_woods_awake_desc:0 "The Great Moot has answered, and the groves are awake."
 zin_regional_kilinti_woodsmen_and_charcoal:0 "Woodsmen and Charcoal"
 zin_regional_kilinti_woodsmen_and_charcoal_desc:0 "Charcoal-burners and woodsmen set up their camps in the fallen timber. Nothing that stands is cut, and nothing that has fallen is wasted."
 zin_regional_kilinti.1.a:0 "The ents remember."
 zin_regional_kilinti.1.d:0 "The eldest ents speak, slowly, of forests that burned in an age of the dead, and of how the burning ended and the woods grew back. It is not a lament. It is a reminder that what is cut may be grown, in time."
 zin_regional_kilinti.1.t:0 "The Burning Remembered"
 zin_regional_kilinti.2.a:0 "The trees need no temple."
 zin_regional_kilinti.2.b:0 "Let the almoners tend the villages."
 zin_regional_kilinti.2.d:0 "Almoners of the Deliverer have come to the villages beneath the eaves, with bread, linen and a plan for a hospital. The ents watch from the trees. The forest peoples ask the Moot whether to let them stay."
 zin_regional_kilinti.2.t:0 "Pilgrims at the Forest Edge"
 zin_regional_kilinti.3.a:0 "Sell young wood."
 zin_regional_kilinti.3.b:0 "Refuse the old trees."
 zin_regional_kilinti.3.d:0 "The Golden Court's timber-buyers have arrived with a contract for the oldest groves and a purse of silver heavy enough to be noticed. The Moot may sell the young wood, or refuse the old trees entirely."
 zin_regional_kilinti.3.t:0 "The Timber-Buyers"
 zin_regional_kilinti.4.a:0 "Guide them onward."
 zin_regional_kilinti.4.b:0 "Take them in."
 zin_regional_kilinti.4.d:0 "Villagers from the burning lands have fled into the forest, thin and silent. The ents let them pass beneath the boughs, and the forest peoples ask whether to take them in or guide them out the other side."
 zin_regional_kilinti.4.t:0 "Refugees Under the Eaves"
