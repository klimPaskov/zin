l_english:
 zin_regional_hiloron_a_rich_shore:0 "A Rich Ring"
 zin_regional_hiloron_a_rich_shore_desc:0 "Stone, strength for hire and the trade of the Saddle make Hirolon the richest hill country of the south-west. The giants spend their wealth on better boats and heavier hammers, which is what giants do."
 zin_regional_hiloron_an_old_debt_repaid:0 "An Old Debt Repaid"
 zin_regional_hiloron_an_old_debt_repaid_desc:0 "The giants carried the First Men once, across the river that could not be crossed. They will carry the Heir now, and the debt is paid in the only coin they trust."
 zin_regional_hiloron_charter_and_shield:0 "Treaty and Shield"
 zin_regional_hiloron_charter_and_shield_desc:0 "Hirolon reaffirms the Cairn Treaty and offers the Lost Cause a company of its great kin. The giants do not forget a bargain, and the Golden King is held to his half."
 zin_regional_hiloron_chiefs_of_the_shore:0 "Chiefs of the Clan Halls"
 zin_regional_hiloron_chiefs_of_the_shore_desc:0 "Each clan hall on the upper slopes sends its chief to Torunalos, and each chief brings a retinue of a dozen giants. The hall is crowded, and the debates are short."
 zin_regional_hiloron_council_of_stone:0 "Council of Stone"
 zin_regional_hiloron_council_of_stone_desc:0 "The council's decisions are cut into a great stone beside the cairn-fields, so that any giant may read them by passing. Few care to argue with a stone."
 zin_regional_hiloron_giants_stride:0 "The Stride"
 zin_regional_hiloron_giants_stride_2:0 "The Host of Hirolon"
 zin_regional_hiloron_giants_stride_2_desc:0 "The giants muster as a single host, and cross a country before the news of their marching."
 zin_regional_hiloron_giants_stride_desc:0 "A league in a quarter-hour, without tiring."
 zin_regional_hiloron_giants_wake:0 "The Giants Wake"
 zin_regional_hiloron_giants_wake_desc:0 "The great kin are awake, and are not in a patient mood."
 zin_regional_hiloron_great_mauls:0 "Great Mauls"
 zin_regional_hiloron_great_mauls_desc:0 "The giants carry mauls of oak shod in iron, taller than a man and heavier than a horse. A strike from one is a thing felt in the next valley."
 zin_regional_hiloron_hear_the_stranger:0 "Hear the Stranger"
 zin_regional_hiloron_hear_the_stranger_desc:0 "A stranger stands before the council and warns them of a darkness in the south. The giants hear him out in silence, as they hear everything, and then begin to count their stones."
 zin_regional_hiloron_hiloron_endures:0 "Hirolon Endures"
 zin_regional_hiloron_hiloron_endures_desc:0 "The war is over, the ring is quiet and the great kin go back to their quarries. The council sits again in the old hall, and the Keepers sing the crossings once more."
 zin_regional_hiloron_hurlers_of_stone:0 "Hurlers of Stone"
 zin_regional_hiloron_hurlers_of_stone_desc:0 "A giant can throw a boulder a hundred paces with the casual flick of one arm. A company of them behind a wall is a siege-engine that does not need winding."
 zin_regional_hiloron_keep_the_silence:0 "Keep the Silence"
 zin_regional_hiloron_keep_the_silence_desc:0 "The keepers will say only what they have always said, that the land was asked for too much. The count stays in the stones, and the ring keeps its own counsel as it has done since before Aen."
 zin_regional_hiloron_keepers_of_the_old_ways:0 "Keepers of the Old Ways"
 zin_regional_hiloron_keepers_of_the_old_ways_desc:0 "The Keepers of the Crossings guard the lore of the giants: the names of fords, the words of oaths and the shape of the old war. They write it on stone and recite it from memory."
 zin_regional_hiloron_lake_and_quarry:0 "Cairn and Quarry"
 zin_regional_hiloron_lake_and_quarry_desc:0 "The Grano gives stone and the valleys of Tirlan give bread, and the giants have learned to turn the one into silver to pay for the other. The council takes care that nobody forgets it."
 zin_regional_hiloron_lake_boats:0 "Boats of Maruunos"
 zin_regional_hiloron_lake_boats_desc:0 "Great boats of oak ply from Maruunos at the Hilorn mouth, built to carry giants as easily as stone. A passing merchant would mistake one for a barn on the water."
 zin_regional_hiloron_lake_boats_spirit:0 "Boats of Maruunos"
 zin_regional_hiloron_lake_boats_spirit_desc:0 "Great boats of oak carry giants and stone alike."
 zin_regional_hiloron_lake_council:0 "The Council of Chiefs"
 zin_regional_hiloron_lake_council_2:0 "Council of Stone"
 zin_regional_hiloron_lake_council_2_desc:0 "Decisions cut into a great stone: few care to argue with it."
 zin_regional_hiloron_lake_council_desc:0 "A High Chief and his council of clan chiefs, who govern slowly and honestly."
 zin_regional_hiloron_law_of_the_lake:0 "Law of the Ring"
 zin_regional_hiloron_law_of_the_lake_desc:0 "The clan halls agree a single law of the ring: free passage on the giants' paths, fair weights at the Grano Saddle and a quarrel judged by three chiefs, never by one."
 zin_regional_hiloron_levies_of_giants:0 "Giants for Hire"
 zin_regional_hiloron_levies_of_giants_desc:0 "Under the treaty Hirolon lends a few of its giants to the crown's works and hosts, in places where one giant is worth a company. The Royal Army finds them hard to feed and very hard to replace."
 zin_regional_hiloron_memory_of_the_crossings:0 "Memory of the Crossings"
 zin_regional_hiloron_memory_of_the_crossings_desc:0 "The giants carried the allied hosts across the rivers of the First Age, and the memory has become a point of honour. A giant of Hirolon will carry any stranger across any stream, and expect no thanks."
 zin_regional_hiloron_memory_of_the_crossings_spirit:0 "Memory of the Crossings"
 zin_regional_hiloron_memory_of_the_crossings_spirit_desc:0 "The giants carried the allied hosts in the First Age, and still carry strangers over streams."
 zin_regional_hiloron_shield_of_giants:0 "Shield of Giants"
 zin_regional_hiloron_shield_of_giants_desc:0 "Shields of oak from the Hiloron Woods, three times a man's height and bound in iron, are carried in a line by giants side by side. Little passes them, and nothing passes through."
 zin_regional_hiloron_shield_of_giants_spirit:0 "Shield of Giants"
 zin_regional_hiloron_shield_of_giants_spirit_desc:0 "Shields three times a man's height in a line: little passes, nothing passes through."
 zin_regional_hiloron_songs_of_the_alliance:0 "Songs of the Alliance"
 zin_regional_hiloron_songs_of_the_alliance_desc:0 "Giants sing the old songs of the alliance in the long evenings, in voices that rattle the rafters. The songs are about friendship, crossing rivers and the quality of bread."
 zin_regional_hiloron_speak_the_count:0 "Speak the Count"
 zin_regional_hiloron_speak_the_count_desc:0 "The keepers agree to say aloud how many stones the Eldest Cairn holds, and where the long dikes stood before the sea came over them, to any seeker who has kept the bargain. It is more than the giants have told men in all the years since."
 zin_regional_hiloron_stone_for_stone:0 "Stone for Stone"
 zin_regional_hiloron_stone_for_stone_desc:0 "The keepers set out their terms for anyone who comes to ask about the count: a levy to haul cut stone to the cairn-fields, ships lent for a season, and no army of the asker inside the ring for as long as the bargain holds."
 zin_regional_hiloron_stone_roads:0 "Stone Roads"
 zin_regional_hiloron_stone_roads_desc:0 "The giants lay roads of great flat stones, each a cartload by itself. Such a road will outlast every empire that crosses it."
 zin_regional_hiloron_stone_trade:0 "Stone from Hiloron"
 zin_regional_hiloron_stones_against_the_dead:0 "Stones Against the Dead"
 zin_regional_hiloron_stones_against_the_dead_desc:0 "Boulders thrown by giants break the dead as they break anything: into smaller pieces. The giants fight the hosts of the grave with the same stolid method they bring to quarrying."
 zin_regional_hiloron_the_council_endures:0 "The Council Endures"
 zin_regional_hiloron_the_council_endures_desc:0 "The council has sat in the same hall at Torunalos for a thousand years. It does not expect to move, and it does not intend to be hurried."
 zin_regional_hiloron_the_eldest_cairn:0 "The Eldest Cairn"
 zin_regional_hiloron_the_eldest_cairn_desc:0 "The Eldest Cairn stands highest of all the cairn-fields, and a keeper adds one stone to it each year, as the keepers before him did. The High Chief asks the keepers, for the first time anyone can recall, what it is that they are counting."
 zin_regional_hiloron_the_first_men_remembered:0 "The First Men Remembered"
 zin_regional_hiloron_the_first_men_remembered_desc:0 "The giants recall the First Men, who fought beside them in the old war and whose line was said to have ended. The Keepers are no longer quite so sure that it did."
 zin_regional_hiloron_the_giant_host:0 "The Giant Host"
 zin_regional_hiloron_the_giant_host_desc:0 "The giants of Hirolon are few, and each of them is worth a company of men. When the council calls them they come down from the clan halls in their stone-nailed boots, and the earth shakes."
 zin_regional_hiloron_the_giants_wake:0 "The Giants Wake"
 zin_regional_hiloron_the_giants_wake_desc:0 "The council has called the great kin from the quarries and the clan halls. The giants have woken, and they are not in a patient mood."
 zin_regional_hiloron_the_host_of_hiloron:0 "The Host of Hirolon"
 zin_regional_hiloron_the_host_of_hiloron_desc:0 "On the council's word the giants muster as a single host, stone against iron as in the old songs. It is small, and nothing stands before it for long."
 zin_regional_hiloron_the_lake_council:0 "The Council of Chiefs"
 zin_regional_hiloron_the_lake_council_desc:0 "The High Chief of Hirolon rules with a council of clan chiefs, chosen by the cairn-keepers and answerable to nobody beyond the ring. They govern slowly and honestly, in a hall built for those who stoop under no door."
 zin_regional_hiloron_the_lake_holds:0 "The Ring Holds"
 zin_regional_hiloron_the_lake_holds_desc:0 "Walls of giant-cut stone rise across the Hilorn Gap and the Grano Saddle, each block the size of a cottage. If Hirolon is to fall, it will take a great while."
 zin_regional_hiloron_the_long_memory:0 "The Long Memory"
 zin_regional_hiloron_the_long_memory_desc:0 "The giants remember the crossings of the First Age war, when their forebears carried the allied hosts across rivers on their shoulders. The Keepers of the Crossings sing it every year."
 zin_regional_hiloron_the_old_charter_of_hiloron:0 "The Cairn Treaty"
 zin_regional_hiloron_the_old_charter_of_hiloron_desc:0 "The Cairn Treaty, sworn on the day the dominions took their charters, binds Hirolon to the crown as a friend and not as a subject. The giants have honoured it for centuries, and expect the same of Parim."
 zin_regional_hiloron_the_quarries:0 "The Quarries"
 zin_regional_hiloron_the_quarries_desc:0 "New galleries are driven into the Grano quarry faces, and the giants haul out blocks that no cart could carry. The Golden Court wants the stone for Parim's quays, and has begun to haggle over the price."
 zin_regional_hiloron_the_stride:0 "The Stride"
 zin_regional_hiloron_the_stride_desc:0 "A giant covers a league in a quarter-hour, and does not tire. The host of Hirolon can cross a country before the news of its marching."
 zin_regional_hiloron_trade_with_novez:0 "Trade with Novez"
 zin_regional_hiloron_trade_with_novez_desc:0 "Hirolon's neighbour Novez has long bought its stone from the giants at a price that both find irritating. The council offers a better arrangement."
 zin_regional_hiloron_war_chiefs:0 "War-Chiefs"
 zin_regional_hiloron_war_chiefs_desc:0 "War-Chief Gorrum the Tall schools a company of chiefs in the art of commanding a host that cannot be told to hurry. They learn that a giant moves when he agrees to, and not before."
 zin_regional_hiloron_war_chiefs_spirit:0 "War-Chiefs"
 zin_regional_hiloron_war_chiefs_spirit_desc:0 "Chiefs trained to command a host that cannot be told to hurry."
 zin_regional_hiloron.1.a:0 "Sing it again."
 zin_regional_hiloron.1.d:0 "The Keepers of the Crossings sing of the old crossings, when the giants of Hirolon bore the allied hosts over rivers in flood. The song is long and slow, and the council hears it out in a silence that fills the hall."
 zin_regional_hiloron.1.t:0 "The Crossings Remembered"
 zin_regional_hiloron.2.a:0 "Novez has its own quarries."
 zin_regional_hiloron.2.b:0 "Trade with the giants."
 zin_regional_hiloron.2.d:0 "Hirolon offers Novez a better price for its stone, on the condition that Novez sends its wool and its grain in the same boats. The counsellors weigh the offer against their own quarries."
 zin_regional_hiloron.2.t:0 "Stone from Hirolon"
