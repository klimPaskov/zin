l_english:
 zin_regional_halenor_a_crown_over_the_isles:0 "A Crown Over the Isles"
 zin_regional_halenor_a_crown_over_the_isles_desc:0 "With three realms under its flag, Halenor claims the old title of sea-king. The crown is made from the copper of three wrecked flagships."
 zin_regional_halenor_corsair_harbours:0 "The Corsair Harbours"
 zin_regional_halenor_corsair_harbours_desc:0 "Every cove of the four isles has a quay, a warehouse and no questions. Raiders sell their prizes here and keep their boats in the dry sheds over winter."
 zin_regional_halenor_envoys_to_the_lesser_isles:0 "Envoys to the Lesser Isles"
 zin_regional_halenor_envoys_to_the_lesser_isles_desc:0 "Sea-lords in long cloaks travel to the smaller isles with an offer of protection. They are courteous, they are armed, and they do not ask twice."
 zin_regional_halenor_false_lights:0 "False Lights"
 zin_regional_halenor_false_lights_desc:0 "Lamps on the cliffs are swung to show a safe passage that is not there. Every captain in the Pupor knows the trick, and some still sail in."
 zin_regional_halenor_first_of_the_isles:0 "First of the Isles"
 zin_regional_halenor_first_of_the_isles_desc:0 "Halenor has more men than any other island realm, and its sea-lords have begun to speak as if the other isles were their cousins. Not all of the cousins agree."
 zin_regional_halenor_harbours_of_halenor:0 "Harbours of Halenor"
 zin_regional_halenor_harbours_of_halenor_desc:0 "Piers and breakwaters are built in the best of the four isles' coves. A ship that comes to Halenor in a gale may now find a berth."
 zin_regional_halenor_island_raiders:0 "Island Raiders"
 zin_regional_halenor_island_raiders_desc:0 "The biggest galleys of the storm fleet are fitted for boarding, with grapnels, rams and covered decks. They fight best where the sea is roughest."
 zin_regional_halenor_isle_bows:0 "Bows of the Isles"
 zin_regional_halenor_isle_bows_desc:0 "The islanders string their bows with sealskin and wax them against the wet. They shoot from a pitching deck better than most men shoot on land."
 zin_regional_halenor_isles_protector:0 "The Isles' Protector"
 zin_regional_halenor_isles_protector_desc:0 "Halenor guards the smaller isles with its fleet and expects them to remember it. The lesser harbours fly the sea-lord's flag beside their own."
 zin_regional_halenor_orvaks_oath:0 "Orvak's Oath"
 zin_regional_halenor_orvaks_oath_desc:0 "Orvak Halen swears the oldest of oaths to his sea-lords: that no lord shall take what is another's, and no wreck shall be shared out unfairly. Old Gull, keeper of the wreck-right, stands witness."
 zin_regional_halenor_pilots_for_hire:0 "Wayfinders for Hire"
 zin_regional_halenor_pilots_for_hire_desc:0 "Halenor's wayfinders sail aboard merchant ships for a fixed fee. They take a tenth of the cargo's value, and they are worth every coin."
 zin_regional_halenor_pilots_for_the_crossing:0 "Wayfinders for the Crossing"
 zin_regional_halenor_pilots_for_the_crossing_desc:0 "The western host will cross a sea that Halenor knows too well. The sea-lords sell their wayfinders to the Crossing, and wish them luck."
 zin_regional_halenor_pilots_for_the_west:0 "Wayfinders for the West"
 zin_regional_halenor_pilots_for_the_west_desc:0 "The western fleets must cross the central sea, and Halenor knows its storms. The sea-lords offer their best wayfinders to the Ford Council for a price."
 zin_regional_halenor_pilots_of_the_storms:0 "Wayfinders of the Storms"
 zin_regional_halenor_pilots_of_the_storms_desc:0 "The sea-lords turn their storm-lore to better use. Their best captains learn to guide ships through the gales that have wrecked so many, and to charge a fair price for it."
 zin_regional_halenor_rope_tar_and_timber:0 "Rope, Tar and Timber"
 zin_regional_halenor_rope_tar_and_timber_desc:0 "Driftwood is sawn into planks and hemp is spun into rope. The isles buy less from abroad, and their ships are better for it."
 zin_regional_halenor_salvage_yards:0 "Salvage Yards"
 zin_regional_halenor_salvage_yards_desc:0 "The wreck-right is made into a trade. Wrecks are surveyed, stripped and sold at fixed prices by the salvage-masters, and not a plank is wasted."
 zin_regional_halenor_sea_lords_hall:0 "The Sea-Lords' Hall"
 zin_regional_halenor_sea_lords_hall_desc:0 "Halenor is four isles under the rule of its sea-lords, who meet under Orvak Halen in a hall roofed with the keels of old wrecks. Each lord brings a ship and a grievance."
 zin_regional_halenor_sea_soldiers_of_the_storm:0 "Sea Soldiers of the Storm"
 zin_regional_halenor_sea_soldiers_of_the_storm_desc:0 "The levy is drilled to fight from boats, wade ashore and form a shield-wall in the surf. They are not elegant, and they do not need to be."
 zin_regional_halenor_ships_that_ride_the_storm:0 "Ships That Ride the Storm"
 zin_regional_halenor_ships_that_ride_the_storm_desc:0 "The fleet sails out in the worst weather of the year and returns with every ship afloat. The crews have learned what the sea can do, and have stopped being afraid of it."
 zin_regional_halenor_storm_crown:0 "The Storm Crown"
 zin_regional_halenor_storm_crown_desc:0 "The four isles of Halenor have one crown at last, a ring of black driftwood set with a single grey pearl. It is worn by the first among equals, and it is passed on at sea."
 zin_regional_halenor_storm_galleys:0 "Storm Galleys"
 zin_regional_halenor_storm_galleys_desc:0 "The yard-masters learn to build a galley with a high bow and a deep keel. It rows heavily, but it does not roll."
 zin_regional_halenor_storm_isles_apart:0 "The Storm Isles Keep Apart"
 zin_regional_halenor_storm_isles_apart_desc:0 "Whatever the great crowns do, the four isles stay in their harbours with the gales at their backs. The sea-lords have told their captains so."
 zin_regional_halenor_storm_pilots:0 "Wayfinders of the Storms"
 zin_regional_halenor_storm_pilots_desc:0 "The old wreckers who turned to piloting know where every rock lies and which gale is real. A ship with a Halenor wayfinder aboard sails in weather others will not face."
 zin_regional_halenor_storm_pilots_for_the_living:0 "Storm Wayfinders for the Living"
 zin_regional_halenor_storm_pilots_for_the_living_desc:0 "The stranger who sailed north once begged a wayfinder from the storm isles, and the sea-lords have not forgotten. They send their best to join the coalition."
 zin_regional_halenor_storm_riders:0 "Ships That Ride the Storm"
 zin_regional_halenor_storm_riders_desc:0 "The storm fleet puts to sea in weather that sends other fleets to harbour. Its hulls are heavy, its crews are tough and its captains do not read the omens."
 zin_regional_halenor_storm_sea_soldiers:0 "Sea Soldiers of the Storm"
 zin_regional_halenor_storm_sea_soldiers_desc:0 "Islanders who have clung to oars in a gale find a hard march no great trial. They are strong, wet, and happy to hit something."
 zin_regional_halenor_storm_yards:0 "The Storm Yards"
 zin_regional_halenor_storm_yards_desc:0 "Slips are cut into the lee of the main isle, where the cliffs break the worst of the gales. The hulls built here are thick-planked and slow to sink."
 zin_regional_halenor_the_corsair_harbours:0 "The Corsair Harbours"
 zin_regional_halenor_the_corsair_harbours_desc:0 "Halenor opens its coves to any raider with silver. The sea-lords take a share of every prize and ask no questions about the flag."
 zin_regional_halenor_the_four_isles:0 "The Four Isles"
 zin_regional_halenor_the_four_isles_desc:0 "The sea-lords walk the bounds of their four isles, and draw them on a single map. Every cove, rock and wrecking-shore is named, and every name has an owner."
 zin_regional_halenor_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_halenor_the_great_war_at_sea_desc:0 "The great fleets of the mainland have taken to the water, and the storm isles lie in their path. The sea-lords meet in the dark, with the wind shouting at the shutters."
 zin_regional_halenor_the_isle_levy:0 "The Isle Levy"
 zin_regional_halenor_the_isle_levy_desc:0 "Every sea-lord musters the men of his isle once a year. They are fishers and wreckers, and they fight with oar and hatchet."
 zin_regional_halenor_the_isles_by_the_sword:0 "The Isles by the Sword"
 zin_regional_halenor_the_isles_by_the_sword_desc:0 "The sea-lords have asked politely, and politely again. If the lesser isles will not take the shield, they will be given it with the sword."
 zin_regional_halenor_the_isles_protection:0 "The Isles' Protector"
 zin_regional_halenor_the_isles_protection_desc:0 "Halenor's fleet takes the lesser harbours under its wing and keeps the corsairs off them. The lesser harbours fly its flag beside their own, and some of them mean it."
 zin_regional_halenor_the_storm_crown:0 "The Storm Crown"
 zin_regional_halenor_the_storm_crown_desc:0 "The first among the sea-lords is crowned in a gale, on a rock that the surf covers twice a day. The crown is black driftwood, and he must keep it dry."
 zin_regional_halenor_the_storm_fleet:0 "The Storm Fleet"
 zin_regional_halenor_the_storm_fleet_desc:0 "Rhea Stormwake has sailed through more gales than any captain in the isles. The sea-lords give her the first fleet to be raised under the Storm Crown."
 zin_regional_halenor_the_storm_host:0 "The Storm Host"
 zin_regional_halenor_the_storm_host_desc:0 "The levy of the four isles is drawn up in one host. The sea-lords review it on the beach, in the rain, and none of the men complain."
 zin_regional_halenor_the_storm_isles_apart:0 "The Storm Isles Keep Apart"
 zin_regional_halenor_the_storm_isles_apart_desc:0 "The sea-lords vote to keep their galleys in harbour and their hands off the quarrel. Halenor has its own storms to weather, and wants no others."
 zin_regional_halenor_the_storm_markets:0 "The Storm Markets"
 zin_regional_halenor_the_storm_markets_desc:0 "Traders from the lesser isles bring their wares to a market held between storms. Whatever the weather has left unbroken is for sale."
 zin_regional_halenor_the_wreck_right:0 "The Wreck-Right"
 zin_regional_halenor_the_wreck_right_desc:0 "The sea-lords have claimed the wreck-right since their grandfathers' time. The question now is whether to keep it as a trade, or to turn it into something safer."
 zin_regional_halenor_wreck_right:0 "The Wreck-Right"
 zin_regional_halenor_wreck_right_desc:0 "What the storm throws on the shore belongs to the sea-lords. It is an old right, and a profitable one, and no honest man in Halenor will say how often the storm has been helped."
 zin_regional_halenor_wreckers:0 "Wreckers of the Storm Isles"
 zin_regional_halenor_wreckers_desc:0 "Lamps are lit on the cliffs on the nights the gales blow in. By morning the shore is littered with cargo, and no one saw a thing."
 zin_regional_halenor_wreckers_of_the_storm_isles:0 "Wreckers of the Storm Isles"
 zin_regional_halenor_wreckers_of_the_storm_isles_desc:0 "The old wreckers' trade is revived: false lights on the headlands, boats waiting in the lee, and no survivors who will talk. It pays well, and it ends badly."
 zin_regional_halenor.1.a:0 "We keep our own freedom"
 zin_regional_halenor.1.b:0 "Accept the Storm Lords' shield"
 zin_regional_halenor.1.d:0 "A black-sailed galley has come into our harbour with a sea-lord in the bow. Halenor will guard our waters against corsairs, he says, and our fishers will be safe under the Storm Lords' shield. His men are courteous, and his galleys are many."
 zin_regional_halenor.1.t:0 "Halenor Offers Its Protection"
