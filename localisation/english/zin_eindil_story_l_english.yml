l_english:
 zin_eindil.10.a:0 "Nurse the stranger."
 zin_eindil.10.a_tip:0 "He will stay among us as a guest, and remember it."
 zin_eindil.10.b:0 "Leave him to the elders."
 zin_eindil.10.c:0 "Bind him to our service."
 zin_eindil.10.c_tip:0 "He stays a year, and does not forget how."
 zin_eindil.10.d:0 "Hunters cutting a path across the old ice found a man inside it, laid out like a drowned log and warm as a sleeper. When the clan broke him free, he breathed. He does not know his name, or ours, and he has no tongue that any of us can answer."
 zin_eindil.10.d_giants:0 "Our herders, crossing the old ice with their sleds, found a man set in it as a stone is set in a wall. He was small, for one of ours to carry, and warm. When they cut him out, he breathed. He does not know his name, or ours, and he has no tongue that any of us can answer."
 zin_eindil.10.d_yeti:0 "The hunting bands of the white valleys were cutting a path across the old ice when they found a man inside it, laid out like a drowned log and warm as a sleeper. When they broke him free, he breathed. He does not know his name, or ours, and he has no tongue that any of us can answer."
 zin_eindil.10.t:0 "The Man in the Ice"
 zin_eindil.100.a:0 "His body is broken."
 zin_eindil.100.a_tip:0 "Volgan's manifested body is destroyed."
 zin_eindil.100.b:0 "What remains, no one can say."
 zin_eindil.100.d:0 "The restored heir broke the southern host's engines and its captains, and then met the Great Spirit again. This time the blue sword went through him. Volgan's body broke apart, and a storm of magic tore through the southern host from end to end."
 zin_eindil.100.d_volgan:0 "The restored champion broke the southern host's engines and its captains, and then met the Great Spirit again. This time the blue sword went through him. The body that Volgan had made for himself broke apart, and a storm of magic tore through the southern host from end to end."
 zin_eindil.100.t:0 "The Blue Sword Through Volgan"
 zin_eindil.101.a:0 "Hold the field for him."
 zin_eindil.101.a_tip:0 "The heir will lie wounded for a long season."
 zin_eindil.101.d:0 "The heir is down, badly wounded. The dead are overrunning the field, and the sword that cut them is in pieces on the ground. Those who carried him out say that his eyes were open and that he was counting something. Nobody asked what."
 zin_eindil.101.t:0 "The Old God Comes Forth"
 zin_eindil.102.a:0 "Hail the king."
 zin_eindil.102.d:0 "When the soldiers helped the heir upright, nobody on that field doubted that he had earned the crown of Aenor. They did not say it. They stood, in the mud, in the ranks of a dozen peoples who had been enemies a year before, and one of them began to clap his spear against his shield."
 zin_eindil.102.t:0 "Hailed as King"
 zin_eindil.11.a:0 "Ignore northern tales."
 zin_eindil.11.b:0 "Summon him to court."
 zin_eindil.11.b_tip:0 "He may come, and he will stay a season."
 zin_eindil.11.c:0 "Send the wardens to watch over him."
 zin_eindil.11.c_tip:0 "Coldor's wardens will watch over him."
 zin_eindil.11.d:0 "Hunters from the north-west tell of a man cut alive from old ice, stronger than three men and gentler than one. At the Winter Court some laugh. Some listen."
 zin_eindil.11.d_left:0 "The northern guest has sat at our table for a season. He has asked to go south with the traders before the snows close the Neck Road. He does not say why. We think he does not know."
 zin_eindil.11.e:0 "Let him go with our thanks."
 zin_eindil.11.t:0 "Talk of a Man from the Ice"
 zin_eindil.110.a:0 "Hold the line without him."
 zin_eindil.110.a_tip:0 "The heir is gone from the field, and his Host fights on without him."
 zin_eindil.110.b:0 "It is done."
 zin_eindil.110.d:0 "The brothers met on a cliff road above a gorge. The king in Parim took one of the heir's arms with a single stroke, drove a blade through him and threw him over the edge. He watched him fall and did not look for a body."
 zin_eindil.110.d_hub:0 "You took one of your brother's arms with a single stroke, on the cliff road above the gorge. You drove your blade through him and threw him over the edge. You did not look for a body. You told yourself that there would be no need, and you were careful not to ask yourself why you needed to say it."
 zin_eindil.110.d_revealed:0 "The brothers met on a cliff road above a gorge. [zin_loc_deliverer] took one of the heir's arms with a single stroke, drove a blade through him and threw him over the edge. He watched him fall and did not look for a body."
 zin_eindil.110.t:0 "The Cliff"
 zin_eindil.111.a:0 "Search the ravine."
 zin_eindil.111.a_tip:0 "He will be found, and he will take a long time to mend."
 zin_eindil.111.b:0 "Mourn him."
 zin_eindil.111.d:0 "Alleria will not believe what the soldiers say. She takes her scouts down the gorge by night, with lanterns shaded and no one told where they are going. The river below the cliff has a bend where it slows, and she says that things that fall are sometimes given back at the bend."
 zin_eindil.111.t:0 "Below the Cliff"
 zin_eindil.112.a:0 "The age is darker for it."
 zin_eindil.112.d:0 "They say the heir of Aen fell from a cliff in the Middle Lands. They say that no man could live through such a fall, and that the brother who threw him has not troubled to deny it. In the taverns of three realms the same sentence is being said, quietly, over the same cups."
 zin_eindil.112.t:0 "Word of the King's Death"
 zin_eindil.113.a:0 "The king lives."
 zin_eindil.113.a_tip:0 "The heir takes the field again."
 zin_eindil.113.b:0 "The king lives."
 zin_eindil.113.d:0 "The heir is alive. He has one arm, and a simpler sword, and wounds that would have killed any other man. The green light at his breast is dim but burning. Alleria's scouts carried him out of the gorge on a door, and he has asked, in his first lucid hour, for the date."
 zin_eindil.113.t:0 "The King Returns from the Dead"
 zin_eindil.12.a:0 "Give him furs and provisions."
 zin_eindil.12.a_tip:0 "He will leave with our goodwill."
 zin_eindil.12.b:0 "Let him go as he came."
 zin_eindil.12.d:0 "Western traders are going south before the snows. The stranger asks to go with them. He wants to know who he is, and every story of men that he has heard begins in the south."
 zin_eindil.12.t:0 "The Traders' Road South"
 zin_eindil.120.a:0 "Take the ring."
 zin_eindil.120.d:0 "[zin_loc_deliverer] showed himself to direct the palace's defences. Alleria's arrow took him in the eye. While his protections healed it, Eindil seized his hand, cut off a finger and tore away a ring. The ring was warm, and it did not wish to leave him."
 zin_eindil.120.t:0 "An Arrow in the Eye"
 zin_eindil.121.a:0 "Press on."
 zin_eindil.121.d:0 "Alleria and the palace rebels broke the seals that fed the crown he wore. Eindil turned one of [zin_loc_deliverer]'s own spells against the band on his wrist. Each loss made the false god bleed more easily, and he had not bled in an age."
 zin_eindil.121.t:0 "The Seals Broken"
 zin_eindil.122.a:0 "Hold on."
 zin_eindil.122.d:0 "[zin_loc_deliverer] opened a passage out of the world with the necklace. Eindil caught its chain and was carried through with him, into a place that was the false god's alone: a hall without a ceiling, lit by a light that came from nowhere, where nothing had ever been allowed to change."
 zin_eindil.122.t:0 "Into His Own Realm"
 zin_eindil.123.a:0 "Now."
 zin_eindil.123.d:0 "[zin_loc_deliverer] had the heir on the floor and his blade at his throat. Then a small purple figure, who had followed them through the same passage, climbed onto his back and tore the necklace from his neck. He did it with both hands, and with everything he had left."
 zin_eindil.123.t:0 "Golbran's Last Working"
 zin_eindil.124.a:0 "It is finished."
 zin_eindil.124.d:0 "Without his artifacts [zin_loc_deliverer] was a mortal man of Aen's line. Eindil cut his throat. He died without a miracle, in the hall that he had made so that nothing could happen to him in it."
 zin_eindil.124.t:0 "The Death of a False God"
 zin_eindil.125.a:0 "Remember him."
 zin_eindil.125.d:0 "Eindil was dying too. Golbran gave the last of his life and his magic to close his worst wounds, and died beside the two brothers. Where he came from, nobody ever learned, and where he went, nobody in the hall could say."
 zin_eindil.125.t:0 "Golbran's Gift"
 zin_eindil.126.a:0 "Carry it out."
 zin_eindil.126.d:0 "To find the way back from that place, Eindil put the necklace around his own neck. He came back into the palace carrying the proof of the false king's fall, and an artifact whose price nobody knows."
 zin_eindil.126.t:0 "The Necklace"
 zin_eindil.127.a:0 "Bind the wounds."
 zin_eindil.127.a_tip:0 "The Host will not stand again for half a year."
 zin_eindil.127.d:0 "The attempt failed. Eindil escaped wounded through the passages, with the rebels carrying what they could, and the doors of the service stairs closed behind them one after another. In the morning the palace wards were quiet, and the rebels who stayed behind had stopped speaking."
 zin_eindil.127.t:0 "The Palace Holds"
 zin_eindil.130.a:0 "For them, not for myself."
 zin_eindil.130.a_tip:0 "The crown will be set on his head in a week."
 zin_eindil.130.b:0 "Let the crown be offered."
 zin_eindil.130.d:0 "The captains, the lords of the dominions and the stranded soldiers of half of Aoaz ask the heir to take the crown of Aenor. They stood in the ruined hall of Parim to ask it, under the broken windows of the Golden Court, and they asked it of a man with one arm and a dull sword who had not been sure he would be asked."
 zin_eindil.130.t:0 "The Crown Is Offered"
 zin_eindil.131.a:0 "Take the oath."
 zin_eindil.131.d:0 "The Host of Eindil has a kingdom now. Its banners go into Aenor's, and the captains of the Host, who were Aenorans all along, take the oath in the great hall of Parim. The company-captains hang the heir's rough banner above the door, beside the old gold one, and nobody objects."
 zin_eindil.131.t:0 "The Host Comes Home"
 zin_eindil.132.a:0 "Take it back."
 zin_eindil.132.a_tip:0 "The Host claims Parim from the one who holds it."
 zin_eindil.132.d:0 "The crown waits in Parim, and Parim is not ours. The captains are ready to swear, and the lords of the dominions are ready to kneel, and between them and the throne lie the walls of a city held by someone who will not open the gate."
 zin_eindil.132.t:0 "The Crown Withheld"
 zin_eindil.140.a:0 "The age goes on."
 zin_eindil.140.d:0 "The heir is gone. The league he gathered is still in the field, and the dark has not gone home. In the camps there are men who say that he will come again, and men who say that the age has no more kings in it, and the quarrel is the only thing that is moving."
 zin_eindil.140.t:0 "The Heir Is Lost"
 zin_eindil.150.a:0 "Let the tale travel."
 zin_eindil.150.b:0 "Keep it among the clans."
 zin_eindil.150.d:0 "Old Siula, who found him, tells it at every fire: the ice was older than her grandmother's grandmother, and the man in it was warm as new bread. The children ask what he dreamed. She says that is the one thing he cannot tell, and that she has stopped asking."
 zin_eindil.150.t:0 "Old Siula's Tale"
 zin_eindil.151.a:0 "He is one of us now."
 zin_eindil.151.b:0 "He is a guest, not a son."
 zin_eindil.151.d:0 "In two months he speaks our tongue as if he had always known it, and a few words he should not know. He hunts better than our best. He shares the meat, and eats last."
 zin_eindil.151.t:0 "The Man from the Ice Learns Our Words"
 zin_eindil.152.a:0 "Let him pass."
 zin_eindil.152.d:0 "A trading caravan has come over the Neck Road with a tall man from the north who works for his bread and asks questions about Aen. The drivers say he has not told them his own name, and that they have stopped asking him to."
 zin_eindil.152.t:0 "Traders Bring a Stranger"
 zin_eindil.153.a:0 "Remember the stranger."
 zin_eindil.153.d:0 "Our lord kept his granary, and the neighbour who came with a torch went home with a loaf. The tale of the bridge is told in both halls now, and each tells it so that its own lord looks wiser."
 zin_eindil.153.t:0 "The Bread Counted"
 zin_eindil.154.a:0 "Let the name stand."
 zin_eindil.154.d:0 "The refugees from the ford have built a village on our bank. They have named its well after the stranger, whose name they do not know, and so it is called the Well of the Man Who Stood in the Water."
 zin_eindil.154.t:0 "The Refugees Settle"
 zin_eindil.155.a:0 "The law holds."
 zin_eindil.155.d:0 "The lawspeaker rules: the stranger owes the thane a season's labour and nothing more. He pays it in a month, rebuilding the bridge that the champions broke, and the thane is seen to nod at the work."
 zin_eindil.155.d_named:0 "Lawspeaker Ilurda rules: the stranger owes the thane a season's labour and nothing more. He pays it in a month, rebuilding the bridge that the champions broke, and the thane is seen to nod at the work."
 zin_eindil.155.t:0 "The Lawspeaker's Ruling"
 zin_eindil.156.a:0 "Send our captains."
 zin_eindil.156.b:0 "Watch from our own shore."
 zin_eindil.156.b_tip:0 "We leave the confederation."
 zin_eindil.156.d:0 "Our banners will march under the stranger's for one season. Our captains want to know if he can lead, and they have asked whether he can be made to explain where he learned to hold a line."
 zin_eindil.156.t:0 "The Confederation Gathers"
 zin_eindil.157.a:0 "To the stranger."
 zin_eindil.157.d:0 "Gunwaith's thanes and Girdon's wardens eat at one table at the ford for the first time in fifty years. The war-king sits at the foot of it, not the head, and carves the meat for others before he eats."
 zin_eindil.157.t:0 "A Feast at the Ford"
 zin_eindil.158.a:0 "Tell him the story of the reef."
 zin_eindil.158.b:0 "Tell him the story of the shrine."
 zin_eindil.158.d:0 "The island holds a feast for the drowned and the saved. The stranger sits with the fishermen and listens to their oldest stories, and asks to hear one of them twice. The old women argue about which story a man with no past should be given first."
 zin_eindil.158.t:0 "The Islanders' Feast"
 zin_eindil.159.a:0 "Lend him the guide."
 zin_eindil.159.b:0 "Our guides stay home."
 zin_eindil.159.d:0 "An old sea-guide offers to take him south-west, to where the tallest elves live, “when the tales of men grow too old for any man to explain”. The old man says it as one recites a thing his grandmother told him and he never believed."
 zin_eindil.159.t:0 "A Guide for the South-West"
 zin_eindil.160.a:0 "Then we will ask the water."
 zin_eindil.160.d:0 "Lorien sees the marks of the First Men in the way the stranger stands, and in all he has never needed to be taught. But he will not name a man on the strength of a likeness. There is water in the old courtyard that remembers more than any king does."
 zin_eindil.160.t:0 "What Lorien Will Not Say"
 zin_eindil.161.a:0 "Fair winds, son of Ein."
 zin_eindil.161.d:0 "Before the ship sails, Lorien stands on the quay and speaks plainly: a prophecy can frighten people into the very deeds it foretells. The water showed what may be, not what must be. “Do not sail to meet the vision, son of Ein. Sail to answer a question.”"
 zin_eindil.161.t:0 "Lorien's Warning"
 zin_eindil.162.a:0 "Pray for fair winds."
 zin_eindil.162.d:0 "Word comes back by a whaler: the elven ship was seen beyond the last port, iced to the masts, sailing north with her crew singing. The whaler says he did not follow. His captain would not let him, and his captain is not a man who is afraid of weather."
 zin_eindil.162.t:0 "Ice in the Rigging"
 zin_eindil.163.a:0 "Then the voyage was not in vain."
 zin_eindil.163.d:0 "Whalers say the son of Ein lives, and carries a light out of the north. Of his crew they say nothing, and they look at the water when they are asked. Lorien hears it in silence, and then asks for the names of the crew to be read out in the hall, one at a time, from the ship's roll."
 zin_eindil.163.t:0 "Word From the North"
 zin_eindil.164.a:0 "The crystal is proof enough."
 zin_eindil.164.b:0 "Send to Parim's archives for the old rolls."
 zin_eindil.164.d:0 "Alleria asks him for a proof that only a son of Ein could give. He has none but the crystal at his breast, the sword at his hip and what the guardian of the castle told him. She says that is more than most kings have, and less than a court will want."
 zin_eindil.164.t:0 "Alleria's Questions"
 zin_eindil.165.a:0 "Send the rolls to Selen."
 zin_eindil.165.a_tip:0 "Master Ilsabet goes with the rolls."
 zin_eindil.165.b:0 "Lock the rolls away."
 zin_eindil.165.c:0 "Burn them."
 zin_eindil.165.c_tip:0 "The ink goes up in a single clean flame."
 zin_eindil.165.d:0 "Master Ilsabet Vothrim of the University of Parim has found, in the oldest rolls of the First Men, a line that ends with no burial: a son of Ein, entered in the year of his birth and in no year after. The rolls prove nothing about any other son, and Master Ilsabet has been careful to say so, twice, in writing."
 zin_eindil.165.t:0 "Master Ilsabet's Rolls"
 zin_eindil.166.a:0 "Hang the guards."
 zin_eindil.166.b:0 "Say nothing."
 zin_eindil.166.d:0 "The cell is empty. The door is locked from the outside, the guards swear that they never slept, and the bars of the one window are bent outward as if by a slow hand. The prisoner has gone into the hills toward the elves, and no dog will follow the trail."
 zin_eindil.166.t:0 "An Empty Cell"
 zin_eindil.167.a:0 "Recall them to Parim."
 zin_eindil.167.b:0 "Let them listen."
 zin_eindil.167.d:0 "Captains of the Lost Cause's frontier companies have been seen at the stranger's fires, with their cloaks turned inside out so that nobody can say to which company they belong. Parim has noticed that the cloaks are a sign, and has not yet decided what it is a sign of."
 zin_eindil.167.t:0 "Frontier Companies Listen"
 zin_eindil.168.a:0 "Let them talk."
 zin_eindil.168.a_tip:0 "The wizard's counsel will quicken our study of wards."
 zin_eindil.168.d:0 "Varner looks at Glo for a long time and says only that it is lighter than it should be, and heavier. Golbran says a single word in a tongue nobody in the forest knows. The word is not translated, and the elves who heard it agree afterwards that it was kindly meant."
 zin_eindil.168.t:0 "The Wizard and the Bearer"
 zin_eindil.169.a:0 "Let it choose."
 zin_eindil.169.d:0 "A dragon from the high roosts lands in the clearing and bows its head to the man with the green light. Then it waits, as one waits for a friend who has not yet decided to leave. Nobody ordered it to come. The roost wardens agree that if they had, it would not have."
 zin_eindil.169.t:0 "The Dragon Chooses"
 zin_eindil.20.a:0 "Accept his mediation."
 zin_eindil.20.a_tip:0 "Both lordships keep their grain."
 zin_eindil.20.b:0 "Burn the grain anyway."
 zin_eindil.20.b_tip:0 "Burned granaries will weigh on us for half a year."
 zin_eindil.20.d:0 "Two lordships meet on the old bridge with torches, each come to burn the other's granary after a bad harvest. The stranger from the north, walking south with the traders, stands in the middle of the planks and asks them to count the bread first."
 zin_eindil.20.t:0 "The Bridge of the Three Oaths"
 zin_eindil.21.a:0 "Hold the ford open for them."
 zin_eindil.21.a_tip:0 "The refugees will settle on our side of the river."
 zin_eindil.21.b:0 "Close the ford."
 zin_eindil.21.d:0 "The ford is breaking up under the ice, and a column of refugees is still on it. The stranger stands in the freezing water to his chest and holds the last cart until the children are across."
 zin_eindil.21.t:0 "Girdon's Winter Ford"
 zin_eindil.22.a:0 "Try him fairly."
 zin_eindil.22.a_tip:0 "The judgment will be remembered for a year."
 zin_eindil.22.b:0 "Make an example of him."
 zin_eindil.22.b_tip:0 "He is held half a year, and Gunwaith is not thanked for it."
 zin_eindil.22.c:0 "Pardon him."
 zin_eindil.22.c_tip:0 "He refuses to be spared a trial that others would face."
 zin_eindil.22.d:0 "The stranger beat three champions hired by a Gunwaith thane to settle a quarrel with a neighbour. Now the thane demands that he be tried for the champions' broken bones. The stranger agrees, and asks only that the law be the same for him as for any man in the hall."
 zin_eindil.22.t:0 "Judgment in Gunwaith"
 zin_eindil.23.a:0 "A good man, wherever he is from."
 zin_eindil.23.d:0 "From the Bridge of the Three Oaths to the courts of Gunwaith, people speak of [zin_loc_eindil], who makes peace and asks for nothing. Some call him the King Without a House. He has been seen at the fords of three rivers and has never slept under a roof that was offered twice."
 zin_eindil.23.t:0 "The King Without a House"
 zin_eindil.30.a:0 "Ask him."
 zin_eindil.30.d:0 "Gunwaith and Girdon are fighting at the Grey Ford again, and the crowns between them cannot stop it alone. Someone at our council table says what everyone has been thinking since the autumn: ask the stranger."
 zin_eindil.30.t:0 "The Grey Ford Breaks"
 zin_eindil.31.a:0 "Ask him."
 zin_eindil.31.d:0 "A border feud at the Grey Ford threatens the truce that Gunwaith and Girdon signed five years ago. No banners have moved, but the quarrel has drawn blood. The crowns between ask the stranger to stand between the two."
 zin_eindil.31.t:0 "Feud on the Grey Ford"
 zin_eindil.32.a:0 "Refuse the stranger."
 zin_eindil.32.a_tip:0 "The offer passes to the next court."
 zin_eindil.32.b:0 "Name him war-king."
 zin_eindil.32.b_tip:0 "The confederation marches under his banner for one season."
 zin_eindil.32.d:0 "The confederation offers the stranger a war-king's crown for as long as it takes to make the peace, and not one day longer. He has said that he will carry it only so. The council wants to know whether we will lay it before him."
 zin_eindil.32.t:0 "A Crown Offered"
 zin_eindil.33.a:0 "Accept his peace."
 zin_eindil.33.a_tip:0 "When both sides accept, the war at the ford ends."
 zin_eindil.33.b:0 "Fight on."
 zin_eindil.33.b_tip:0 "The war goes on, and the stranger will remember who refused him."
 zin_eindil.33.d:0 "The war-king's host stands between the two armies at the Grey Ford. He offers terms: the old border, the dead buried, the prisoners sent home. He asks both sides to sign, and he asks it of each in the same words."
 zin_eindil.33.t:0 "The War-King's Terms"
 zin_eindil.34.a:0 "Release him with honour."
 zin_eindil.34.a_tip:0 "The West will remember the war-king."
 zin_eindil.34.b:0 "Try to keep the war-king."
 zin_eindil.34.b_tip:0 "He leaves by night, and the confederation dissolves."
 zin_eindil.34.d:0 "The war-king sets the crown on the council table and asks for a horse and a road to the sea. He wants to cross to the old kingdom of Aen, he says, and see whether anything of it remains."
 zin_eindil.34.t:0 "The Crown Laid Down"
 zin_eindil.35.a:0 "A peace in the West."
 zin_eindil.35.d:0 "In the West a stranger made a peace that no king could make, and then gave the crown back. Taverns from the Grey Ford to the western shore argue about where he came from. Nobody knows his name."
 zin_eindil.35.t:0 "The War-King Lays Down His Crown"
 zin_eindil.40.a:0 "Give him a ship."
 zin_eindil.40.a_tip:0 "He sails with our goodwill."
 zin_eindil.40.b:0 "Let him find passage."
 zin_eindil.40.b_tip:0 "He will lose a month looking for a captain."
 zin_eindil.40.d:0 "The stranger asks for passage across the wide sea to Aenor. He has heard that the oldest rolls of Aen's line are kept in Parim, and he means to read them. He has no money, no name and no ship. He has the peace of the Grey Ford, and that is thought to be worth a hull."
 zin_eindil.40.t:0 "West Over the Sea"
 zin_eindil.41.a:0 "Shelter the castaways."
 zin_eindil.41.a_tip:0 "They will stay with us until the sea is safe again."
 zin_eindil.41.b:0 "Sell word of him to the Deliverer's priests."
 zin_eindil.41.b_tip:0 "The priests will pay, and will ask for more."
 zin_eindil.41.d:0 "Storms took a western ship far off its course and broke her on our reef in the night. By morning the beach was strewn with timber and rope. One passenger walked out of the surf carrying two sailors, one on each shoulder, and asked whether anyone was still in the water."
 zin_eindil.41.t:0 "Wreck on the Southern Isles"
 zin_eindil.42.a:0 "The sea went silent."
 zin_eindil.42.a_tip:0 "The island will keep the memory for a year."
 zin_eindil.42.d:0 "Children had been stranded on the reef where drowned voices call at night, and no boat would go to them. The stranger swam out and brought them back one by one, with his hands over their ears. The islanders say the sea went silent while he did it, and has not been quite the same since."
 zin_eindil.42.t:0 "The Reef of Drowned Voices"
 zin_eindil.43.a:0 "What else does it say?"
 zin_eindil.43.d:0 "At low tide the old shrine shows an inscription that the priests have chanted for generations without knowing its meaning. The stranger reads one word aloud, and the priests fall silent. The word is Aen. Nobody on the island has ever heard it said as if it were a name."
 zin_eindil.43.t:0 "The Shrine Beneath the Tide"
 zin_eindil.44.a:0 "Honour his choice."
 zin_eindil.44.b:0 "Hold him to the offer."
 zin_eindil.44.b_tip:0 "He will not forgive being held."
 zin_eindil.44.d:0 "The island elders ask the stranger to stay and be their lord. They offer him the best boat, the fishing rights of the north shore and a house with a view of the reef. He thanks them and says no, gently, as to a child who has offered him a toy."
 zin_eindil.44.t:0 "Stay and Rule Us"
 zin_eindil.45.a:0 "Fair winds."
 zin_eindil.45.d:0 "When the tales of men grow too old for any man to explain, carry them to Gala. The islanders give him a boat, a chart drawn in sea-green ink, and the tale of the name in the shrine. He sets out with the dawn tide, and the children run down the beach after him until the water takes their knees."
 zin_eindil.45.t:0 "Carry the Old Tales to Gala"
 zin_eindil.46.a:0 "Mourn the dead."
 zin_eindil.46.a_tip:0 "He will remember who came for him."
 zin_eindil.46.d:0 "Armed men from a foreign ship came looking for the castaway. He drove them off without killing one of them, which the islanders found stranger than any fighting. We buried the dead at the edge of the reef, those the sea had not already taken."
 zin_eindil.46.t:0 "Hunters in the Isles"
 zin_eindil.50.a:0 "Turn him away for a season."
 zin_eindil.50.a_tip:0 "Lorien will relent in half a year."
 zin_eindil.50.b:0 "Receive him."
 zin_eindil.50.b_tip:0 "He will sit among Lorien's guests."
 zin_eindil.50.d:0 "A tall man from the Islands of the South asks to speak with the King. He carries a tale too old for men to explain, and a word from a drowned shrine. The gate-warden says he waited three days at the outer stair and asked for nothing, not even a roof."
 zin_eindil.50.d_again:0 "The tall man from the Islands of the South has waited out the season on the outer stair, in the rain and then in the snow, without a word of complaint. The gate-warden says he has been asked six times to leave, and has answered six times that he has a tale too old to carry home."
 zin_eindil.50.t:0 "A Stranger at Gala"
 zin_eindil.51.a:0 "Memory is a duty."
 zin_eindil.51.d:0 "For weeks Lorien tells him of the War of Men, of Aen, of Dardan, and of what came after. The stranger learns how small his own memory is against the age of the world, and does not seem to mind. At the end of each evening he asks the same question: who was I?"
 zin_eindil.51.t:0 "Weeks of Memory"
 zin_eindil.52.a:0 "Eindil."
 zin_eindil.52.a_tip:0 "He has a name, and the court of Gala keeps it for now."
 zin_eindil.52.d:0 "In the old courtyard Lorien looks into the spring and sees an old royal line, and says the name he finds in it: “Eindil, son of Ein, son of Aen.” The stranger looks too. He sees a burning capital, armies coming from the west and from the east, death moving down from the north, a great darkness in the south, and his own hand holding a shard of broken blue metal."
 zin_eindil.52.d_records:0 "The spring in the old courtyard gives back only the sky. Lorien reads the oldest records of the First Men for sixty days, and at the end of them he says the name: “Eindil, son of Ein, son of Aen.” He has known many men who stood as this one stands. He has known one family that did."
 zin_eindil.52.t:0 "The Mirror of First Rain"
 zin_eindil.54.a:0 "Equip him generously."
 zin_eindil.54.a_tip:0 "Gala gives what it can spare."
 zin_eindil.54.b:0 "A ship and a sword, no more."
 zin_eindil.54.d:0 "Lorien gives Eindil a ship like no other, her hull of sea-pine bound with silver, and armour made for a man of Aen's line, and a sword that he says was forged when the First Men were young. He gives him a crew: western friends, navigators of the Islands of the South, and elves of Gala who chose to go. He tells him to go north to Horos, who keeps Glo."
 zin_eindil.54.t:0 "Lorien's Gift"
 zin_eindil.60.a:0 "Let her go."
 zin_eindil.60.d:0 "The King's ship leaves Gala with the son of Ein aboard. Lorien watches it from the harbour wall until it is only a sail, and then until it is only a thought of one. “It is a long way north,” he says to nobody, “and the cold there is not kind to ships.”"
 zin_eindil.60.t:0 "Lorien's Ship Sails North"
 zin_eindil.61.a:0 "Resupply the ship."
 zin_eindil.61.a_tip:0 "The ship sails with full casks."
 zin_eindil.61.b:0 "Say nothing."
 zin_eindil.61.c:0 "Report the ship to the Deliverer's priests."
 zin_eindil.61.c_tip:0 "The priests will pay for the news."
 zin_eindil.61.d:0 "An elven ship with a mixed crew asks for water and timber at our quay. Its captain is a tall man who pays in Gala silver and does not haggle, and the crew sing in three tongues when they think no one is listening. A priest of the Houses has been at the harbour master's elbow since the tide turned."
 zin_eindil.61.t:0 "A Ship at Our Harbour"
 zin_eindil.70.a:0 "Stay out of strangers' quarrels."
 zin_eindil.70.b:0 "Send guides inland."
 zin_eindil.70.b_tip:0 "The crew will not walk blind into the snow."
 zin_eindil.70.d:0 "An elven ship has anchored in our bay. Her sails are white and gold and her hull is iced to the waterline. Her crew are going inland toward the silent castle, in a long line with their packs, and nobody has asked our leave. A tall man walks at their head and carries a sword wrapped in sealskin."
 zin_eindil.70.t:0 "Landfall in the Frozen North"
 zin_eindil.71.a:0 "Bury the dead."
 zin_eindil.71.b:0 "It is done."
 zin_eindil.71.d:0 "Armed men waited in the snow above the path from the bay, and the travellers from the elven ship fought them. The snow here is deep and keeps what it is given. Of the ship's company, the stranger at their head is the only one still walking."
 zin_eindil.71.d_fail:0 "Armed men waited in the snow above the path from the bay, and the travellers from the elven ship saw them first. The fight was short. The ones who fell were the ones who waited."
 zin_eindil.71.d_few:0 "Armed men waited in the snow above the path from the bay. The travellers from the elven ship fought them among the rocks, and not all of the travellers came out. Two of them went on up the road."
 zin_eindil.71.d_hub:0 "The order was given, and the snow kept the secret. Every one of the ship's company lies in it. The man they called a son of Ein has gone on alone toward the castle, leaving footprints where you can read them. He walks as though he were not tired."
 zin_eindil.71.d_hub_fail:0 "The order was given, and the order was not enough. The men in the snow above the path were seen from the water, the crew came ashore in the shape of a shield wall, and our men are the ones who lie in the snow. Eindil goes on toward the castle with every companion he sailed with."
 zin_eindil.71.d_hub_few:0 "Your men held the path, but not all of it. Two of the ship's company slipped through the rocks above the bay, bleeding and cursing in the tongue of the Islands, and they are making for the castle behind him."
 zin_eindil.71.t:0 "The Ambush"
 zin_eindil.72.a:0 "Bury them."
 zin_eindil.72.a_tip:0 "The one who walked on is shaken to the bone."
 zin_eindil.72.d:0 "Herders found a field of dead men in the snow below the castle road: elves in white and gold, islanders, western friends, a ship's company lying where it fell. One set of footprints went on up the road toward the castle. The herders followed it as far as the gate, and no farther."
 zin_eindil.72.t:0 "Alone in the Snow"
 zin_eindil.73.a:0 "South, to warn them."
 zin_eindil.73.a_tip:0 "He carries Glo out of the north."
 zin_eindil.73.d:0 "The castle is empty. The guardian is dust. The man who walked out carries a green light at his breast and a blue sword at his hip, and he knows now that the king in Parim, worshipped as the Deliverer, is his own brother, a son of Ein."
 zin_eindil.73.d_revealed:0 "The castle is empty. The guardian is dust. The man who walked out carries a green light at his breast and a blue sword at his hip, and he knows now that [zin_loc_deliverer], who sits in Parim as a god, is his own brother, a son of Ein."
 zin_eindil.73.t:0 "The Bearer Leaves Yeldenne"
 zin_eindil.80.a:0 "Send for Alleria."
 zin_eindil.80.d:0 "A man with a green light at his breast came ashore at night, in the cove below the old signal tower, and walked up to the first watch-fire as if he had been expected. He asked for the rangers, not the governor. The watch-captain has locked him in the tower, and does not know whether the lock is to keep him in or to keep something out."
 zin_eindil.80.t:0 "A Stranger on Selen's Shore"
 zin_eindil.81.a:0 "Shelter him in secret."
 zin_eindil.81.a_tip:0 "The rangers of Selen will keep him, and the court will hear of it."
 zin_eindil.81.b:0 "Hand him to the court."
 zin_eindil.81.b_tip:0 "He will be chained in Parim, and will not stay there."
 zin_eindil.81.d:0 "Alleria of Selen has heard him out for three nights by the signal fire. She believes enough to hide him, and not enough to stop asking questions. The governor is away at Parim, and the tower is quiet; the watch has been told that the prisoner is a smuggler."
 zin_eindil.81.t:0 "Alleria's Watch"
 zin_eindil.82.a:0 "Leave it to the chancery."
 zin_eindil.82.b:0 "Denounce and hunt the impostor."
 zin_eindil.82.b_tip:0 "Parim's men will ask questions in every town where he might be."
 zin_eindil.82.c:0 "Let him speak."
 zin_eindil.82.c_tip:0 "The dominions will hear the warning at once."
 zin_eindil.82.d:0 "A foreign stranger in the dominions claims the blood of Aen and speaks against those who hold the seals. The chancery has the report in three hands, and nobody who could answer it wants to be the one who does."
 zin_eindil.82.d_deliverer:0 "A foreign stranger in the dominions claims the blood of Aen, and says that the king in Parim is not what the temples say. The chancery has the report in three hands. It asks what the crown wishes to do."
 zin_eindil.82.d_king:0 "A foreign stranger in the dominions claims the blood of Aen and speaks against the King's counsellors. The Golden Court finds it amusing for an afternoon. The chancery asks what the crown wishes to do."
 zin_eindil.82.e:0 "Seize him."
 zin_eindil.82.e_tip:0 "If the host is warned in time, the attempt will cost us."
 zin_eindil.82.f:0 "Shelter him."
 zin_eindil.82.f_tip:0 "No hunt will be run while this crown shelters him."
 zin_eindil.82.t:0 "The Impostor"
 zin_eindil.83.a:0 "Heed the warning."
 zin_eindil.83.a_tip:0 "The warning will be remembered, and the crown in Parim will not forgive it."
 zin_eindil.83.b:0 "Dismiss it."
 zin_eindil.83.c:0 "Denounce him."
 zin_eindil.83.c_tip:0 "The crown in Parim will not forget who stood with it."
 zin_eindil.83.d:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say."
 zin_eindil.83.d_cold:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. The man from the ice is a man of Aen's line, he says, and we should hear it from our own hunters before we hear it from a stranger."
 zin_eindil.83.d_concord:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. He asks the dominions to keep their companies ready, not to rise against the crown."
 zin_eindil.83.d_east:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. He says eastern banners will cross the rift sea, and he says it as one who has seen them."
 zin_eindil.83.d_elves:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. He asks nothing of the elves but that they guard their own woods."
 zin_eindil.83.d_mirolon:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. He says what Mirolon has said for twenty years, and he says it with a sword at his hip."
 zin_eindil.83.d_north:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. He says the dead will come through the islands and the straits."
 zin_eindil.83.d_west:0 "A man who calls himself Eindil, son of Ein, warns every court: armies will come from the west and from the east, the North will abandon its oaths, Volgan is rebuilding his hosts, and the dead are stirring in the north. He says the king in Parim is not what the temples say. The war-king of the Grey Ford has a name now, and the name is a warning."
 zin_eindil.83.t:0 "Warnings of the Heir"
 zin_eindil.84.a:0 "Hide him in the hills."
 zin_eindil.84.a_tip:0 "It will cost us dear to buy the silence of three villages."
 zin_eindil.84.b:0 "Send him to the elves."
 zin_eindil.84.b_tip:0 "He will go to the woods of the Magical Lands."
 zin_eindil.84.c:0 "Keep him hidden."
 zin_eindil.84.d:0 "Parim's men are asking questions in our towns, with a priest of the Houses at their shoulder and silver in their purses. Someone will talk. The rangers have moved the stranger twice this month, and each time a day before the questions arrived."
 zin_eindil.84.d_found:0 "Someone talked. Parim's men are at the end of the lane that leads to the house where the stranger sleeps, and they have brought a priest of the Houses to read the warrant. The ranger on watch can have him over the back wall in the time it takes to read it."
 zin_eindil.84.t:0 "The Hunt for the Impostor"
 zin_eindil.85.a:0 "Guard him well."
 zin_eindil.85.d:0 "The impostor is in the cells under the palace, in a room with one window and no light. He has not asked for food, or a priest, or an advocate. He has asked the jailer whether he can read, and when the jailer said he could not, the prisoner offered to teach him."
 zin_eindil.85.t:0 "The Impostor in Chains"
 zin_eindil.86.a:0 "Shelter the bearer."
 zin_eindil.86.a_tip:0 "The wizard of the Unbinding will hear of it."
 zin_eindil.86.b:0 "Send him on."
 zin_eindil.86.b_tip:0 "Nolorim, at the high passes, will be asked instead."
 zin_eindil.86.d:0 "The rangers of Selen bring a man with a green light into our woods. They ask nothing, and they leave before the houses can ask them anything. The houses must now decide whether the woods shelter him, and whether the Refusal has a clause for a guest who carries a piece of a New God."
 zin_eindil.86.t:0 "The Bearer in the Forest"
 zin_eindil.87.a:0 "The wizard is welcome."
 zin_eindil.87.a_tip:0 "Varner and Golbran will ride with the bearer."
 zin_eindil.87.d:0 "The wizard of the Unbinding walks out of the trees with a small purple companion at his heel. He has heard of a green light in the woods, and has not come to be introduced. The companion looks at the bearer for a long time and says nothing, which Varner says is a compliment."
 zin_eindil.87.t:0 "Varner and Golbran"
 zin_eindil.88.a:0 "The dragons are not ours to lend."
 zin_eindil.88.b:0 "Entrust a dragon to the bearer."
 zin_eindil.88.b_tip:0 "A dragon of the high roosts will fly with him as a free ally."
 zin_eindil.88.d:0 "The bearer asks the Keeper of the Roosts for a dragon, not as a servant, but as an ally who chooses to fly with him. Dragons are not lent. The elders say so, and then look at each other, and then look at the green light."
 zin_eindil.88.t:0 "A Dragon's Pact"
 zin_eindil.90.a:0 "The heir has come back."
 zin_eindil.90.b:0 "Who is this?"
 zin_eindil.90.d:0 "A dragon came down over the northern front with three riders: a man with a green light at his breast, an old wizard, and a small purple companion. The man leapt down and struck the earth with a blue sword. The dead around him fell and did not rise."
 zin_eindil.90.d_quiet:0 "The heir came home on a dragon. There was no battle to win, only a crown in the wrong hands and a kingdom that has not yet decided to notice. Farmers on the northern roads stood in the fields and watched him pass, and went on ploughing."
 zin_eindil.90.t:0 "On Dragon's Wings"
 zin_eindil.91.a:0 "Let the wave run."
 zin_eindil.91.a_tip:0 "Glo's first wave will be loosed on the battlefield."
 zin_eindil.91.b:0 "The dead are unmade."
 zin_eindil.91.d:0 "A wave of green light ran across the ground from the point of the blue sword. A whole front of the dead was unmade, and the ground where they had stood is clean. Wherever the green light touched, the grass stands up again."
 zin_eindil.91.d_zol:0 "A wave of green light ran across the ground from the point of a blue sword. A whole front of the dead was unmade in a breath, and the ground where it had stood is clean. The Will of Zol marks the place."
 zin_eindil.91.t:0 "The Wave of Glo"
 zin_eindil.92.a:0 "Raise the Host."
 zin_eindil.92.a_tip:0 "Selen takes the name of the Host of Eindil, and its claims on Aenor's lost lands."
 zin_eindil.92.b:0 "Stand beside him, remain ourselves."
 zin_eindil.92.b_tip:0 "Selen keeps its own name and its own claims, and Eindil leads its armies."
 zin_eindil.92.d:0 "Selen swore to raise the heir's host. He is here, and he has brought a wizard, a dragon and a sword that cuts the dead. Alleria stands beside him in the square and says that an oath is not a thing that can be taken back, and that the square has heard it said."
 zin_eindil.92.t:0 "Raise the Host of Eindil"
 zin_eindil.93.a:0 "Keep our country."
 zin_eindil.93.b:0 "Switch to the Host."
 zin_eindil.93.b_tip:0 "You will take up the cause of the Host of Eindil."
 zin_eindil.93.d:0 "Will you ride with the heir? The Host of Eindil has no capital but his camp, and no treasury but the loyalty of those who have fed him in his wanderings. He has not asked for your crown. He has said that those who remember what you did for him are welcome at his fire."
 zin_eindil.93.t:0 "Ride with the Heir"
 zin_eindil.94.a:0 "Stand together."
 zin_eindil.94.a_tip:0 "We will fight under his fire, and not under his crown."
 zin_eindil.94.b:0 "We fight our own war."
 zin_eindil.94.d:0 "The heir asks every crown that fights the dead and the south to stand together. He asks no crown to kneel, and no kingdom to give up its own. Those who have armies stranded among Aenorans have been told that their men will be fed at his fire, and sent home when the dark is beaten."
 zin_eindil.94.t:0 "The Coalition of the Living"
 zin_eindil.95.a:0 "Give it to him."
 zin_eindil.95.a_tip:0 "The league will follow the heir."
 zin_eindil.95.b:0 "The league is the crown's."
 zin_eindil.95.d:0 "The league the Golden King founded for his own glory asks to serve the heir. Its frontier captains were already at his fires, and its treasury was spent long ago on a triumph. What is left is a banner, a charter and a habit of marching."
 zin_eindil.95.t:0 "Give the Lost Cause to the Heir"
 zin_eindil.96.a:0 "Carry him from the field."
 zin_eindil.96.a_tip:0 "The heir is down, and the Host will remember how long the field was held."
 zin_eindil.96.b:0 "Press the attack."
 zin_eindil.96.c:0 "Hold the line."
 zin_eindil.96.d:0 "Word has come from the southern front: Volgan himself stood against the heir's host, and spoke, and the heir answered, and Volgan struck. The heir lies on the field. His friends are carrying him back through the line."
 zin_eindil.96.d_host:0 "Volgan himself stood on the southern front. “You swear that men are united,” he said, “and in a hundred years their sons come to me asking help against their brothers.” “Because these men have chosen to stand together,” said Eindil. “Then I will bury them together.” His blast threw the heir to the ground."
 zin_eindil.96.d_volgan:0 "The Great Spirit stood on the southern front, and the host of men before him did not break. “You swear that men are united,” he said to their champion, “and in a hundred years their sons come to me asking help against their brothers.” The champion said that these men had chosen to stand together. Then the Great Spirit answered him, and the champion lay on the ground."
 zin_eindil.96.t:0 "Volgan at the Southern Front"
 zin_eindil.97.a:0 "The wizard is gone."
 zin_eindil.97.d:0 "The dead rolled down from the north while the heir lay on the field, and Varner stood in their way. He lifted curses, opened roads for the living, and held until there was nothing left of him to hold with. His small companion poured his own magic into the wards and fell beside him. Those who saw it thought that both were dead."
 zin_eindil.97.t:0 "Varner's Last Wards"
 zin_eindil.98.a:0 "He rises."
 zin_eindil.98.a_tip:0 "The New Gods give what they can, once."
 zin_eindil.98.d:0 "The heir did not wake. His friends say that his spirit went somewhere else. Through the green light at his breast the New Gods gathered about him, and he could not see them all clearly. Last came one whose voice he knew from the crystal: Glernaen, the New God of Power and Wisdom. “What will you do if you rise?” “I will return to them.” “Then carry what we can give. You may yet fall, and we cannot promise to raise you again.”"
 zin_eindil.98.t:0 "The Gathering of the New Gods"
 zin_eindil.99.a:0 "The age turns without him."
 zin_eindil.99.d:0 "The heir did not wake. In this telling of the age the war goes on without him. His friends keep the blue sword by his bed and the green light burns on his breast, but it does not answer, and there are few left who believe that it will."
 zin_eindil.99.t:0 "The Heir Does Not Rise"
