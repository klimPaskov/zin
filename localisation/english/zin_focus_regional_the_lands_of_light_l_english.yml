l_english:
 zin_regional_the_lands_of_light_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_the_lands_of_light_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_the_lands_of_light_a_guest_from_gala:0 "A Guest From Gala"
 zin_regional_the_lands_of_light_a_guest_from_gala_desc:0 "The King of Gala attends the Council as an honoured guest, with no vote and no chair. When he speaks, the hall falls silent to hear him."
 zin_regional_the_lands_of_light_ballistae_of_the_sun:0 "Ballistae of the Sun"
 zin_regional_the_lands_of_light_ballistae_of_the_sun_desc:0 "Great bows on wheeled frames are built to stand on the white walls. Their bolts are as long as a man, and their crews are as patient as stones."
 zin_regional_the_lands_of_light_border_forts_of_light:0 "Border Forts of Light"
 zin_regional_the_lands_of_light_border_forts_of_light_desc:0 "The ridge is crowned with white forts that look inward toward the valleys and outward toward the passes. Their garrisons are drawn from the Guard."
 zin_regional_the_lands_of_light_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_the_lands_of_light_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_the_lands_of_light_eastern_watch:0 "Watch on the East"
 zin_regional_the_lands_of_light_eastern_watch_desc:0 "Signal-posts and spear-companies line the eastern ridge, and a rider sleeps beside every beacon. The Lands of Light has no quarrel with its neighbours, and will not be surprised by them."
 zin_regional_the_lands_of_light_first_among_sun_realms:0 "First Among the Sun Realms"
 zin_regional_the_lands_of_light_first_among_sun_realms_desc:0 "Speakers of the other realms begin their letters with the name of the Lands of Light and end them by asking its view. It leads by being asked, and has never once had to command."
 zin_regional_the_lands_of_light_first_among_the_sun_realms:0 "First Among the Sun Realms"
 zin_regional_the_lands_of_light_first_among_the_sun_realms_desc:0 "The Lands of Light does not command its neighbours and does not need to. Their Speakers begin each letter with its name."
 zin_regional_the_lands_of_light_granaries_of_the_sun:0 "Granaries of the Sun"
 zin_regional_the_lands_of_light_granaries_of_the_sun_desc:0 "White-roofed granaries stand on the high ground where the damp cannot reach them. The keepers of the stores count them every spring and tell the whole realm what they hold."
 zin_regional_the_lands_of_light_halls_of_light:0 "Halls of Light"
 zin_regional_the_lands_of_light_halls_of_light_desc:0 "Tall halls of glass and white stone rise in the largest towns, each with a lamp that is never put out. The Speaker's seal is cut into every lintel."
 zin_regional_the_lands_of_light_healing_houses:0 "The Healing Houses"
 zin_regional_the_lands_of_light_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_the_lands_of_light_judges_of_quarrels:0 "Judges of Quarrels"
 zin_regional_the_lands_of_light_judges_of_quarrels_desc:0 "The chair hears the old quarrels of the Sunhot realms, one at a time, and judges them without anger. Merchants who have feuded for a century find themselves shaking hands."
 zin_regional_the_lands_of_light_light_over_every_valley:0 "Light Over Every Valley"
 zin_regional_the_lands_of_light_light_over_every_valley_desc:0 "A chain of beacons carries the Speaker's morning greeting from hill to hill. Every town replies in its turn, and the whole realm hears itself speak."
 zin_regional_the_lands_of_light_light_over_valleys:0 "Light Over Every Valley"
 zin_regional_the_lands_of_light_light_over_valleys_desc:0 "Beacons on the hills carry the Speaker's greeting from one valley to the next at dawn. No settlement in the Lands of Light is further than a day from a lamp-keeper."
 zin_regional_the_lands_of_light_no_eastern_banner_here:0 "No Eastern Banner Here"
 zin_regional_the_lands_of_light_no_eastern_banner_here_desc:0 "A white banner is raised on every eastern ridge, and the Speaker's word goes to the courts beyond: no host will cross unquestioned. The Council's realms take heart."
 zin_regional_the_lands_of_light_old_strength:0 "The Old Strength"
 zin_regional_the_lands_of_light_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_the_lands_of_light_one_voice:0 "One Voice at Noon"
 zin_regional_the_lands_of_light_one_voice_at_noon:0 "One Voice at Noon"
 zin_regional_the_lands_of_light_one_voice_at_noon_desc:0 "When the Council agrees, its Speakers speak the verdict together, one sentence from fifteen mouths. Nobody who hears it has doubted that it was meant."
 zin_regional_the_lands_of_light_one_voice_desc:0 "A verdict of the Council is spoken in one voice, and the realms act on it as on a single command. Envoys of other courts say they have never heard so large a hall sound so certain."
 zin_regional_the_lands_of_light_orchards:0 "Orchards and Vines"
 zin_regional_the_lands_of_light_orchards_and_vines:0 "Orchards and Vines"
 zin_regional_the_lands_of_light_orchards_and_vines_desc:0 "Fruit trees and trained vines climb the terraces, and the autumn markets smell of them for a month. A fed folk is a calm folk, and [ROOT.GetName] grows slowly in numbers and in ease."
 zin_regional_the_lands_of_light_orchards_desc:0 "Fruit from the high terraces feeds [ROOT.GetName] well and keeps its people content."
 zin_regional_the_lands_of_light_presidency_of_noon:0 "The Chair of Noon"
 zin_regional_the_lands_of_light_presidency_of_noon_desc:0 "When the Noon Council meets, the Radiant Speaker takes the chair. She calls the hours, hears the quarrels and sums the verdict in one sentence."
 zin_regional_the_lands_of_light_priests_from_afar:0 "Priests From Afar"
 zin_regional_the_lands_of_light_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_the_lands_of_light_radiant_speaker:0 "The Radiant Speaker"
 zin_regional_the_lands_of_light_radiant_speaker_desc:0 "Soyan wears a robe the colour of morning and chairs the Council from a seat of pale stone. The Speakers of the other realms address her as the Radiant, and she answers each by name."
 zin_regional_the_lands_of_light_raise_the_noon_league:0 "Raise the Noon League"
 zin_regional_the_lands_of_light_raise_the_noon_league_desc:0 "If danger comes, the Council will bind its realms into a league of mutual defence. The chair must judge whether the Speakers are of one mind, and whether the danger is near enough."
 zin_regional_the_lands_of_light_raise_the_noon_league_tip_1:0 "The realms are not yet of one mind."
 zin_regional_the_lands_of_light_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_the_lands_of_light_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_the_lands_of_light_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_the_lands_of_light_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_the_lands_of_light_stone_of_the_high_places:0 "Stone of the High Places"
 zin_regional_the_lands_of_light_stone_of_the_high_places_desc:0 "Pale quarry stone is brought down from the heights, cut by tall hands and set without lime. A second Guild Workshop rises where the quarry road meets the valley."
 zin_regional_the_lands_of_light_sun_guard:0 "The Sun Guard"
 zin_regional_the_lands_of_light_sun_guard_desc:0 "A few hundred very tall spearmen stand in white and gold at the Council's gates, and they have not fought in living memory. For Sunhot elves, that is a long time."
 zin_regional_the_lands_of_light_sun_guard_rides:0 "The Sun Guard Rides"
 zin_regional_the_lands_of_light_sun_guard_rides_desc:0 "The Guard has left its gates for the roads. White banners go out with the spearmen, and the valleys they pass turn out to watch in silence."
 zin_regional_the_lands_of_light_sun_markets:0 "The Sun Markets"
 zin_regional_the_lands_of_light_sun_markets_desc:0 "The long square under its white awnings draws every trader on the coast, and each leaves with good will and light purses."
 zin_regional_the_lands_of_light_sun_terraces:0 "Sun Terraces"
 zin_regional_the_lands_of_light_sun_terraces_desc:0 "Stone steps cut into the hillsides catch the long light and hold the rain. The realm has few hands, so every terrace is laid once and laid to last, and the first of them feeds a new Guild Workshop in the capital."
 zin_regional_the_lands_of_light_the_bright_roads:0 "The Bright Roads"
 zin_regional_the_lands_of_light_the_bright_roads_desc:0 "Wide roads of pale stone link every valley, with milestones carved in the old tongue and benches at every bend. A rider can cross the realm in a week and meet no one he does not know."
 zin_regional_the_lands_of_light_the_council_meets:0 "The Council Meets"
 zin_regional_the_lands_of_light_the_council_meets_desc:0 "The Speakers gather in the white hall at noon, and the chair opens the day with a silence. What they decide will be heard in every Sunhot court by nightfall."
 zin_regional_the_lands_of_light_the_eastern_border:0 "The Eastern Border"
 zin_regional_the_lands_of_light_the_eastern_border_desc:0 "The valleys of the Lands of Light end where the eastern courts begin, at a ridge of red stone and thorn. The Speaker sends a surveyor to mark the line."
 zin_regional_the_lands_of_light_the_eastern_border_tip_1:0 "Our valleys end where the eastern courts begin."
 zin_regional_the_lands_of_light_the_guard_drills:0 "The Guard Drills"
 zin_regional_the_lands_of_light_the_guard_drills_desc:0 "The spearmen drill on the great green below the hall, and the sound of their shields carries across three valleys. Young captains learn in a season what once took a lifetime."
 zin_regional_the_lands_of_light_the_long_noon:0 "The Long Noon"
 zin_regional_the_lands_of_light_the_long_noon_desc:0 "The noon hour is kept as a rest in every town, with the shutters closed and the markets silent. Quarrels are said to be harder to start after a quiet hour."
 zin_regional_the_lands_of_light_the_noon_charter:0 "The Noon Charter"
 zin_regional_the_lands_of_light_the_noon_charter_desc:0 "The customs of the Council are written down at last, in a tall book bound in white leather. It is read at the opening of every session and has never been disputed."
 zin_regional_the_lands_of_light_the_old_strength:0 "The Old Strength"
 zin_regional_the_lands_of_light_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_the_lands_of_light_the_passes_of_miaed:0 "The Passes of Miaed"
 zin_regional_the_lands_of_light_the_passes_of_miaed_desc:0 "Miaed's wardens keep the high gates to the south-east, and their lord is courteous and watchful. A pact of quiet is exchanged across the ridge."
 zin_regional_the_lands_of_light_the_radiant_seat:0 "The Radiant Seat"
 zin_regional_the_lands_of_light_the_radiant_seat_desc:0 "Fifteen states of bright valleys, white-stone towns and long roads reach from the Sea of Gods to the edge of the East. The Radiant Speaker presides over all of them, and over the Noon Council besides."
 zin_regional_the_lands_of_light_the_radiant_speaker:0 "The Radiant Speaker"
 zin_regional_the_lands_of_light_the_radiant_speaker_desc:0 "Soyan holds the Radiant Seat by the custom of the Council, not by the right of birth. She is old for a human and young for an elf, and she is listened to by both."
 zin_regional_the_lands_of_light_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_the_lands_of_light_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_the_lands_of_light_the_sun_guard:0 "The Sun Guard"
 zin_regional_the_lands_of_light_the_sun_guard_desc:0 "The Guard is a few hundred very tall spearmen in white and gold, who stand at the Council's gates and have not fought in living memory. For Sunhot elves, that is a long time."
 zin_regional_the_lands_of_light_the_sun_guard_rides:0 "The Sun Guard Rides"
 zin_regional_the_lands_of_light_the_sun_guard_rides_desc:0 "At the Council's word the Guard leaves its gates for the roads, banners flying and spears raised. The valleys it passes turn out in silence to watch."
 zin_regional_the_lands_of_light_the_sun_markets:0 "The Sun Markets"
 zin_regional_the_lands_of_light_the_sun_markets_desc:0 "On market days the terraces empty into one long square under awnings of white cloth. Traders from the coast and the hills come for wine, honey and cut stone, and carry [ROOT.GetAdjective] goodwill home with them."
 zin_regional_the_lands_of_light_the_tall_spears:0 "The Tall Spears"
 zin_regional_the_lands_of_light_the_tall_spears_desc:0 "The Guard's spears are cut from ash and are longer than any in the East. Their points are leaf-shaped and their shafts are carved with the names of those who carried them."
 zin_regional_the_lands_of_light_traders_from_alerhia:0 "Traders From Alerhia"
 zin_regional_the_lands_of_light_traders_from_alerhia_desc:0 "Alerhia's caravans come over the red ridge each spring, with dyed cloth, salt and tales. The Lands of Light buys cloth and sells fruit, and nobody argues about the price."
 zin_regional_the_lands_of_light_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_the_lands_of_light_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_the_lands_of_light_watch_over_gala:0 "Watch Over Gala"
 zin_regional_the_lands_of_light_watch_over_gala_desc:0 "If Gala is threatened, the Guard's captains want to be ready. A company is posted on the road to the north-west, and a lamp is kept burning in their watch-tower."
 zin_regional_the_lands_of_light_watch_the_rift_war:0 "Watch the Rift War"
 zin_regional_the_lands_of_light_watch_the_rift_war_desc:0 "Riders are sent to the eastern courts to learn what the host is doing, and what it intends. The Lands of Light is at peace, and wishes to remain so."
 zin_regional_the_lands_of_light_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_the_lands_of_light_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_the_lands_of_light_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_the_lands_of_light_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_the_lands_of_light.1.a:0 "Speak of peace among us"
 zin_regional_the_lands_of_light.1.b:0 "Speak of the markets"
 zin_regional_the_lands_of_light.1.c:0 "Ask the King of Gala's counsel"
 zin_regional_the_lands_of_light.1.d:0 "The Speakers of the Sunhot realms gather at noon in the white hall, under a roof open to the sky. The Radiant Speaker asks what the Council should speak of first, and the other Speakers wait with folded hands."
 zin_regional_the_lands_of_light.1.t:0 "The Council Meets"
