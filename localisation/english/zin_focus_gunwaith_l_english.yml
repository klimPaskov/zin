l_english:
 zin_gunwaith_a_crown_across_the_sea:0 "A Crown Across the Sea"
 zin_gunwaith_a_crown_across_the_sea_desc:0 "The western claimant is crowned in Parim with the old crown of men, and the West suddenly has a king on the far shore. How long he can keep the crown is a question that nobody dares to ask aloud."
 zin_gunwaith_a_god_on_aenors_throne:0 "A God on Aenor's Throne"
 zin_gunwaith_a_god_on_aenors_throne_desc:0 "Parim's new king is worshipped as a deliverer, and the western courts are not sure whether that is a promise or a warning. The council agrees only that a god who is crowned as king answers to no one in the West."
 zin_gunwaith_accept_the_surrenders:0 "Accept the Surrenders"
 zin_gunwaith_accept_the_surrenders_desc:0 "Aenor's garrisons are offered terms: keep your lives, your lands and your honour, and yield your swords. Many accept, and the conquest becomes easier and quieter than anyone had planned."
 zin_gunwaith_accord_on_the_neck:0 "An Accord on the Neck"
 zin_gunwaith_accord_on_the_neck_desc:0 "A treaty is signed with the lords of Coldor over the neck of rock and ice that joins their lands to Gunwaith's. Neither side will cross it with an army, and both will use it for trade."
 zin_gunwaith_against_the_deathless:0 "Against the Deathless"
 zin_gunwaith_against_the_deathless_desc:0 "The dead do not tire and cannot be killed by common weapons; the westerners learn this by losing men. The remedies they find are expensive, strange and, so far, effective."
 zin_gunwaith_against_the_deathless_spirit:0 "Against the Deathless"
 zin_gunwaith_against_the_deathless_spirit_desc:0 "The companies have learned what stops the dead, and what does not."
 zin_gunwaith_answer_the_ford_raids:0 "Answer the Ford Raids"
 zin_gunwaith_answer_the_ford_raids_desc:0 "The clans on the border pay each raid back in kind: a herd for a herd and a burned barn for a burned barn. It is exactly the kind of thing that wears a truce to threads."
 zin_gunwaith_answer_the_lost_cause:0 "Answer the Lost Cause"
 zin_gunwaith_answer_the_lost_cause_desc:0 "The Lost Cause, Aenor's league of the loyal, asks the West what its banners are for. Gunwaith answers by sending its own, and takes the oath of a companion."
 zin_gunwaith_beachheads:0 "The Beachheads"
 zin_gunwaith_beachheads_desc:0 "Harbours taken and stores landed; the western army has a foothold and means to use it."
 zin_gunwaith_beside_former_foes:0 "Beside Former Foes"
 zin_gunwaith_beside_former_foes_desc:0 "The king the West once crowned has returned, and he asks the western companies to stand beside the men they were sent to conquer. They are not subjects and he does not ask them to be; he asks them to fight."
 zin_gunwaith_blood_at_the_ford:0 "Blood at the Grey Ford"
 zin_gunwaith_blood_at_the_ford_desc:0 "The truce is broken, and the first dead are already carried north across the stones. The thanes call it their due; the Lawspeaker calls it the beginning of a very long list."
 zin_gunwaith_bridge_of_stone:0 "A Bridge of Stone at the Ford"
 zin_gunwaith_bridge_of_stone_desc:0 "Masons from both banks build a bridge where the Ford was, with an oath carved on either parapet. Nobody who walks across it can claim not to know what the two kingdoms swore."
 zin_gunwaith_brothers_of_the_ford:0 "Brothers of the Ford"
 zin_gunwaith_brothers_of_the_ford_desc:0 "Gunwaith and Girdon clasp hands on the Bridge and call each other brothers, which is more than either expected. A pact of non-aggression is signed, and the old grudges are put down at last."
 zin_gunwaith_buldor_contracts:0 "The Buldor Contracts"
 zin_gunwaith_buldor_contracts_desc:0 "The sell-sword companies of Buldor take pay from any court that offers it, and Aenor has been one of their best customers. Gunwaith offers a different contract and a better purse."
 zin_gunwaith_call_the_clan_moot:0 "Call the Clan Moot"
 zin_gunwaith_call_the_clan_moot_desc:0 "Once in a generation the clans gather on the open moor, each under its own plaid, and say aloud what they want. The king must listen, whether or not he likes the answer."
 zin_gunwaith_call_to_cross:0 "The Call to Cross"
 zin_gunwaith_call_to_cross_desc:0 "Heralds ride to every court of the West with the king's summons: the old claims will be pressed, and every banner is asked to say how many men, how many ships and how soon. The answers will decide how large the West's ambition can be."
 zin_gunwaith_charts_of_the_pupor_ocean:0 "Charts of the Pupor Ocean"
 zin_gunwaith_charts_of_the_pupor_ocean_desc:0 "The island kingdoms of the Pupor Ocean know the currents and the stars as the clans know their glens. Gunwaith offers a fair price for their charts, and a better one for their steersmen."
 zin_gunwaith_claim_the_throne_of_men:0 "Claim the Throne of Men"
 zin_gunwaith_claim_the_throne_of_men_desc:0 "The western claimant takes the old throne of men in the name of the West, and the councillors are summoned to kneel. The throne is high, and the crown, which the western claimant had thought lighter, is heavier than it looked."
 zin_gunwaith_clan_halls:0 "The Clan Halls of Gunwaith"
 zin_gunwaith_clan_halls_desc:0 "Gunwaith is a crown of clans, and the king rules only so far as the halls consent. King Herlic calls the great chiefs to his table to settle who sits where, who pays what and who may speak first."
 zin_gunwaith_clan_halls_spirit:0 "The Clan Halls"
 zin_gunwaith_clan_halls_spirit_desc:0 "The chiefs sit at the king's table and the king sits at theirs."
 zin_gunwaith_clan_levies:0 "The Clan Levies"
 zin_gunwaith_clan_levies_charter:0 "The Clan Levies Charter"
 zin_gunwaith_clan_levies_charter_desc:0 "Each clan promises a fixed levy, to be mustered on the king's summons and sent home at the first frost. For the first time the number is written on a roll, and not left to the chief's mood."
 zin_gunwaith_clan_levies_desc:0 "Each clan owes a levy and has written the number on a roll."
 zin_gunwaith_clan_war_bands:0 "The Clan War-Bands"
 zin_gunwaith_clan_war_bands_desc:0 "The war-bands of the clans, once rivals, now have a common standard and a common word of command. They still sing their own songs on the march, but they sing them in the same key."
 zin_gunwaith_clan_war_bands_spirit:0 "The Clan War-Bands"
 zin_gunwaith_clan_war_bands_spirit_desc:0 "Rival war-bands now march under one standard, and still sing their own songs."
 zin_gunwaith_clans_as_one:0 "The Clans as One"
 zin_gunwaith_clans_as_one_desc:0 "At the end of the year of feasts, the chiefs join hands over the king's cup and drink. It is a gesture, and the hall has been waiting a hundred years to see it made."
 zin_gunwaith_clans_as_one_spirit:0 "The Clans as One"
 zin_gunwaith_clans_as_one_spirit_desc:0 "Hands joined across the king's cup: the clans have made one kingdom."
 zin_gunwaith_clans_in_arms:0 "The Clans in Arms"
 zin_gunwaith_clans_in_arms_desc:0 "The clans have always fought, but never together. The king calls the war-bands to the moor and puts them through a month of drill under officers who are neither their uncles nor their rivals."
 zin_gunwaith_convene_the_ford_council:0 "Convene the Ford Council"
 zin_gunwaith_convene_the_ford_council_desc:0 "The kings and captains of the West are summoned to the Ford, where the truce was signed, to sit at one table. For once, the table has been laid for something other than the dead."
 zin_gunwaith_cross_for_the_old_claims:0 "Cross for the Old Claims"
 zin_gunwaith_cross_for_the_old_claims_desc:0 "The western kings agree that the old claims will be pressed on the far shore, with fleets and hosts. It is the greatest decision in a thousand years, and it was taken in an afternoon."
 zin_gunwaith_crossing_fleet:0 "The Crossing Fleet"
 zin_gunwaith_crossing_fleet_desc:0 "Hundreds of hulls under every western plaid, drilled to land a host in a day."
 zin_gunwaith_crown_across_the_sea:0 "A Crown Across the Sea"
 zin_gunwaith_crown_across_the_sea_desc:0 "A western king sits in Parim, and the western court has gained an empire and a very long supply line."
 zin_gunwaith_datids_grievance:0 "Thane Datid's Grievance"
 zin_gunwaith_datids_grievance_desc:0 "Thane Datid Werlen brings the names of the herds lifted at the Ford and demands that the king read them before the moot. The king can hear him or hush him, and either way the whole hall will watch."
 zin_gunwaith_dead_and_the_south:0 "Death from the North, Fire from the South"
 zin_gunwaith_dead_and_the_south_desc:0 "Reports come in from two directions at once: the dead are marching out of the north, and a darker host is moving up from the south. The West has crossed the sea to take a throne and found itself standing in the way of both."
 zin_gunwaith_drill_on_the_moors:0 "Drill on the Moors"
 zin_gunwaith_drill_on_the_moors_desc:0 "Captains who served abroad teach the clans to march in step, to keep a line and to hold it when the man beside them falls. The moors echo with horns, and the sheep complain."
 zin_gunwaith_envoys_to_the_courts:0 "Envoys to the Western Courts"
 zin_gunwaith_envoys_to_the_courts_desc:0 "Resident envoys are sent to the larger courts, with letters of credit and orders to listen at table. A man who dines with a king hears what the king would not say in council."
 zin_gunwaith_equals_across_the_sea:0 "Equals Across the Sea"
 zin_gunwaith_equals_across_the_sea_desc:0 "The crown of Aenor and the crown of Gunwaith are asked to sign a charter as equals, with neither bowing to the other. The West has waited a thousand years for the offer, and finds that it is still hard to accept."
 zin_gunwaith_escorts_for_the_host:0 "Escorts for the Host"
 zin_gunwaith_escorts_for_the_host_desc:0 "War galleys and great warships are drilled to sail in line around the transports, answering to one flag. The rule is simple and the captains learn it quickly: no ship is left behind."
 zin_gunwaith_first_crown_of_the_west:0 "First Crown of the West"
 zin_gunwaith_first_crown_of_the_west_desc:0 "Gunwaith, the strongest of the western crowns, takes the title of first among its neighbours and proclaims claims on the lands of the smallest. It is a gentle conquest, as conquests go, but a conquest all the same."
 zin_gunwaith_fleet_at_the_shore:0 "The Fleet at the Shore"
 zin_gunwaith_fleet_at_the_shore_desc:0 "Every ship that can float is sent back across the sea, empty, to carry the host. The sailors work without sleep, because the dead are coming, and the shore will not wait."
 zin_gunwaith_ford_brothers:0 "Brothers of the Ford"
 zin_gunwaith_ford_commission:0 "The Ford Commission"
 zin_gunwaith_ford_commission_desc:0 "A joint commission of Gunwaith clan-lords and Girdon wardens is proposed, to settle every herd, every boundary stone and every complaint before it becomes a feud. It is less romantic than a battle, and a good deal cheaper."
 zin_gunwaith_ford_feud:0 "The Grey Ford Feud"
 zin_gunwaith_ford_feud_desc:0 "Blood has been spilt on the Ford again, and the border clans have taken up spears with grim contentment."
 zin_gunwaith_ford_riders:0 "Riders at the Ford"
 zin_gunwaith_ford_riders_desc:0 "The horsemen of the high glens ride down to the river like a hailstorm."
 zin_gunwaith_garrisons_on_the_ford:0 "Garrisons on the Ford"
 zin_gunwaith_garrisons_on_the_ford_desc:0 "The thanes demand stout walls on the north bank, and the king agrees that a wall is not a war. Girdon may disagree, and the truce will be quieter without the new stone to look at."
 zin_gunwaith_girdon_must_bend:0 "Girdon Must Bend"
 zin_gunwaith_girdon_must_bend_desc:0 "The thanes insist that a rival who has been beaten once must be beaten into a lesson. The king puts his seal on a list of claims on Girdon's lands, and the western courts read it with interest."
 zin_gunwaith_governors_of_parim:0 "Governors of Parim"
 zin_gunwaith_governors_of_parim_desc:0 "Governors are named for the captured districts, and garrisons are posted at every bridge and gate. The people of the city look at them with polite hatred, and wait."
 zin_gunwaith_grievances_of_the_west:0 "The Grievances of the West"
 zin_gunwaith_grievances_of_the_west_desc:0 "The council puts on parchment every wrong that Aenor has done the West: the conquests, the tariffs, the banners at Dardan that Parim forgot to praise. It is a very long list, and it is read aloud."
 zin_gunwaith_hailed_by_the_living:0 "Hailed by the Living"
 zin_gunwaith_hailed_by_the_living_desc:0 "The roads are lined with the grateful, and the westerners are hailed as the first friends from across the sea. They had come to take, and are being thanked for having stayed."
 zin_gunwaith_harbours_of_gunwaith:0 "Harbours of Gunwaith"
 zin_gunwaith_harbours_of_gunwaith_desc:0 "Stone quays, deep moorings and warehouse halls are built along the northern coast. A harbour that can shelter a hundred ships can shelter a hundred and one."
 zin_gunwaith_heed_the_war_thanes:0 "Heed the War-Thanes"
 zin_gunwaith_heed_the_war_thanes_desc:0 "The king gives the thanes what they ask: the right to answer insult with iron and a seat nearest the throne. The clans are tired, but they are also proud, and pride is cheaper to raise than patience."
 zin_gunwaith_highland_studs:0 "The Highland Studs"
 zin_gunwaith_highland_studs_desc:0 "Stud-masters of the high glens breed a hardy, sure-footed pony that thrives on heather and poor grass. They are not fast, but they cross a moor in the rain and still come home."
 zin_gunwaith_highland_studs_spirit:0 "The Highland Studs"
 zin_gunwaith_highland_studs_spirit_desc:0 "Hardy ponies bred on heather need little fodder, and carry their burdens over any moor."
 zin_gunwaith_hill_fighters:0 "Hill-Warriors of the North"
 zin_gunwaith_hill_fighters_desc:0 "The men of the high glens fight with hill-spears and rounded shields, climbing faster than the lowlanders can follow. They learn the new drill the way they learn everything: by doing it a hundred times."
 zin_gunwaith_hill_forts:0 "The Hill Forts"
 zin_gunwaith_hill_forts_desc:0 "Old hill-forts are repaired and linked by signal fires, so that a raid on one clan brings help from three. The thanes say the forts are to keep out Girdon, and the king chooses not to ask."
 zin_gunwaith_hold_what_we_took:0 "Hold What We Took"
 zin_gunwaith_hold_what_we_took_desc:0 "The captains refuse to sail. They have bled for these stones, they say, and the dead of the West will not have died for a sea-passage home."
 zin_gunwaith_horse_clans:0 "The Horse Clans"
 zin_gunwaith_horse_clans_desc:0 "The clans of the western plain are born in the saddle, and their hosts are the swiftest in the West. They ride in loose companies, and the king agrees to leave them that way."
 zin_gunwaith_horse_clans_spirit:0 "The Horse Clans"
 zin_gunwaith_horse_clans_spirit_desc:0 "The plain-clans ride in loose companies that are everywhere, and never where the enemy expects."
 zin_gunwaith_horse_fairs:0 "The Horse Fairs"
 zin_gunwaith_horse_fairs_desc:0 "Twice a year the whole of the West comes to the moorland fairs to buy Gunwaith's horses. The tolls fill the king's chests, and a new hall of stalls and smithies rises beside the market ground."
 zin_gunwaith_ice_kin_opinion:0 "Kin in the Ice"
 zin_gunwaith_isle_landings:0 "Landings on the Isle"
 zin_gunwaith_isle_landings_desc:0 "The first landing parties are on the green isle, and the sea behind them is white with sails."
 zin_gunwaith_judges_on_circuit:0 "Judges on Circuit"
 zin_gunwaith_judges_on_circuit_desc:0 "Judges ride from glen to glen with the law in their heads and a pony apiece, settling feuds before they begin. The clans fear them more than they fear the king, and are the better for it."
 zin_gunwaith_judgment_remembered:0 "A Judgment Remembered"
 zin_gunwaith_judgment_remembered_desc:0 "A stranger once stood before the Rock and asked to be judged as any man of the clans, and was. The Lawspeaker remembers what he said, and the clans remember that he did not ask to be spared."
 zin_gunwaith_keys_of_parim:0 "The Keys of Parim"
 zin_gunwaith_keys_of_parim_desc:0 "The gates of the Golden Court open, and a delegation brings the great keys on a cushion. The captains of the West look at the keys and at one another, and nobody is sure what comes next."
 zin_gunwaith_kin_in_the_ice:0 "Kin in the Ice"
 zin_gunwaith_kin_in_the_ice_desc:0 "The clan songs tell of Faenn-Cheulu, a green north that no singer ever saw, and now men of the ice-clans have come over the Neck with bronze out of the ice and songs that sound very like ours. The thanes are moved, and a little suspicious."
 zin_gunwaith_kings_peace:0 "The King's Peace"
 zin_gunwaith_kings_peace_desc:0 "No raid, no reprisal, no blood-price in the king's name. The truce grows firmer each month it is kept."
 zin_gunwaith_lancers_of_gunwaith:0 "Lancers of Gunwaith"
 zin_gunwaith_lancers_of_gunwaith_desc:0 "A company of heavy horsemen is raised from the sons of the great houses, with lance, mail and a war-horse bred for the charge. They are costly, and they know it."
 zin_gunwaith_land_as_friends:0 "Land as Friends"
 zin_gunwaith_land_as_friends_desc:0 "The fleet comes to the friendly quays under a white flag and the plaids of the West. Aenor's people line the harbour, unsure whether to cheer or to be afraid."
 zin_gunwaith_launch_the_crossing:0 "Launch the Crossing"
 zin_gunwaith_launch_the_crossing_desc:0 "The signal fires run down the coast and the fleets weigh anchor together, a forest of masts on the morning tide. The West has not sailed like this since the old kings went north."
 zin_gunwaith_law_above_all:0 "No Man Above the Law"
 zin_gunwaith_law_above_all_desc:0 "The Lawspeaker's rule is known in every glen: king and cattle-thief answer alike."
 zin_gunwaith_lawspeakers_rock:0 "The Lawspeaker's Rock"
 zin_gunwaith_lawspeakers_rock_desc:0 "On a grey rock at the centre of Gunwaith the Lawspeaker recites the law at every new moon, from memory, without a book. Kings have stood before it to be corrected, and been corrected."
 zin_gunwaith_lesser_crowns_bend:0 "The Lesser Crowns Bend"
 zin_gunwaith_lesser_crowns_bend_desc:0 "The smallest of the western kings are offered a choice between submission and the sword. Most bow, and the first neighbour who does not will find the claims already drawn."
 zin_gunwaith_letters_to_parim:0 "Letters to Parim"
 zin_gunwaith_letters_to_parim_desc:0 "The king writes to the Aenor realm that holds Parim: the West wishes to land as a friend, with its ships and its host, and begs a harbour on the western shore. Whether the letter is believed is a matter for Parim."
 zin_gunwaith_march_on_parim:0 "The March on Parim"
 zin_gunwaith_march_on_parim_desc:0 "The host leaves the coast and turns toward the Great Lake, with the king's banner at its head. Whatever the road costs, every man on it believes the road ends in Parim."
 zin_gunwaith_march_on_parim_spirit:0 "The March on Parim"
 zin_gunwaith_march_on_parim_spirit_desc:0 "Every man on the road believes the road ends in the Golden City."
 zin_gunwaith_market_towns:0 "The Market Towns"
 zin_gunwaith_market_towns_desc:0 "Where the drove roads cross, the clans grant charters for walled markets. A town is a new thing in the glens, but a trader's coin does not care for custom."
 zin_gunwaith_merchant_fleets:0 "Merchant Fleets of the West"
 zin_gunwaith_merchant_fleets_desc:0 "A hundred merchant cogs sail under Gunwaith's plaid, carrying wool, horses and timber to the ports of three coasts. The ships are slow and broad, and they pay for themselves in two seasons."
 zin_gunwaith_merchant_republics:0 "The Merchant Free Towns"
 zin_gunwaith_merchant_republics_desc:0 "The trading towns of the south-west have no kings, only counting-houses, and they are the angriest of all about Aenor's tariffs. Gunwaith offers them its horses, its timber and its ear."
 zin_gunwaith_muster_of_the_thanes:0 "Muster of the Thanes"
 zin_gunwaith_muster_of_the_thanes_desc:0 "Every thane who holds land of the king answers the call with his full strength: housecarls, tenants, cousins and the dogs. It is the largest host Gunwaith has put together since the First Age."
 zin_gunwaith_no_man_above_the_law:0 "No Man Above the Law"
 zin_gunwaith_no_man_above_the_law_desc:0 "The Lawspeaker declares it at the Rock for all to hear: no chief, no thane and no king is above the law of Gunwaith, and any traveller who enters the kingdom is bound by it. The words are carved on the stone."
 zin_gunwaith_oaths_on_the_shore:0 "Oaths on the Shore"
 zin_gunwaith_oaths_on_the_shore_desc:0 "On the northern strand each king and chief takes the oath of the crossing, with a handful of salt water at his lips. The oath binds them to sail together and to land together, and it forgives no one who breaks it."
 zin_gunwaith_old_banner:0 "Under the War-King's Banner"
 zin_gunwaith_old_banner_desc:0 "The old banner is flown again, and the men who knew it ride a little taller."
 zin_gunwaith_old_crowns_of_the_west:0 "The Old Crowns of the West"
 zin_gunwaith_old_crowns_of_the_west_desc:0 "The ancient crowns of the West hold that they were kings before Aenor was an army. They remember being ruled from Parim, and are quick to say so over wine."
 zin_gunwaith_old_law_rolls:0 "The Old Law Rolls"
 zin_gunwaith_old_law_rolls_desc:0 "Lawspeaker Ilurda has the old customs written down at last, so that a young judge need not be an old woman to know them. The rolls are kept in a stone chest, and she keeps the key."
 zin_gunwaith_one_law_one_crown:0 "One Law, One Crown"
 zin_gunwaith_one_law_one_crown_desc:0 "Whichever voice has won the hall, the king now binds the clans to a single code under a single crown. The oldest chiefs grumble that it was not so in their grandfathers' days, and sign."
 zin_gunwaith_opinion_equals:0 "Equals Across the Sea"
 zin_gunwaith_our_own_shore:0 "Our Own Shore"
 zin_gunwaith_our_own_shore_desc:0 "The kings of the West agree to keep what they have and to build on it. The harbours are filled with merchant ships, the fields are tilled to the border and no fleet leaves the shore."
 zin_gunwaith_parim_as_pledge:0 "Hold Parim as a Pledge"
 zin_gunwaith_parim_as_pledge_desc:0 "The captains agree that the city is held as a pledge for the redress of the West's grievances, and that the throne is left empty until terms are signed. It is a cautious choice and a very expensive one."
 zin_gunwaith_peace_at_the_ford:0 "Peace at the Ford"
 zin_gunwaith_peace_at_the_ford_desc:0 "The feud is over. Both sides have buried their dead and burned the blood-price rolls, and the wardens of the Ford are told again that they keep a crossing and not a battlefield."
 zin_gunwaith_price_of_aenoran_gold:0 "The Price of Aenoran Gold"
 zin_gunwaith_price_of_aenoran_gold_desc:0 "Parim's gold has found its way into the pockets of western lords, with its usual gentle conditions. The king must decide whether to take his share or tell the court in Parim what he thinks of its generosity."
 zin_gunwaith_question_of_the_sea:0 "The Question of the Sea"
 zin_gunwaith_question_of_the_sea_desc:0 "The council unrolls the western charts and puts a finger on the central sea. Across it lies the Middle Lands, and the oldest claims of the West; nobody at the table can say for sure what the sea will cost."
 zin_gunwaith_relief_fleet:0 "The Relief Fleet"
 zin_gunwaith_relief_fleet_desc:0 "Hulls that were laid down for a war are fitted for a rescue: hospital ships, grain-boats and extra cargo-lighters. The captains do not complain."
 zin_gunwaith_ride_to_the_ford:0 "Ride to the Ford"
 zin_gunwaith_ride_to_the_ford_desc:0 "The riders of the high glens answer the king's horn, a hundred horsemen to a clan and none of them quiet. The Ford has been fought over before, and they know the ground better than they know their own beds."
 zin_gunwaith_sail_home:0 "Sail Home"
 zin_gunwaith_sail_home_desc:0 "The order is given at dawn: the army will go home. The garrisons are called in, the horses are led down to the quays and the banners are folded one by one."
 zin_gunwaith_sawmills_of_the_west:0 "Sawmills of the West"
 zin_gunwaith_sawmills_of_the_west_desc:0 "Water-driven saws are set on the northern rivers, turning whole forests into planks. The great beams that once had to be hauled by hand now arrive sawn and stacked."
 zin_gunwaith_sea_captains:0 "The Sea-Captains' Guild"
 zin_gunwaith_sea_captains_desc:0 "A ladder of ranks, a book of signals and a fund for widows: the sea-captains have become a brotherhood."
 zin_gunwaith_sea_captains_guild:0 "The Sea-Captains' Guild"
 zin_gunwaith_sea_captains_guild_desc:0 "Masters of the great ships are chartered into a guild with a ladder of ranks, a common book of signals and a fund for widows. The best of them have crossed the wide ocean; most, until now, never had a reason."
 zin_gunwaith_sea_lords_plan:0 "The Sea-Lords' Plan"
 zin_gunwaith_sea_lords_plan_desc:0 "Admiral Ostra Velk unrolls her chart before the kings and explains, without a trace of drama, what will be needed to land a host of this size on a hostile shore. Most of the kings leave the tent thoughtful."
 zin_gunwaith_seize_the_western_ports:0 "Seize the Western Ports"
 zin_gunwaith_seize_the_western_ports_desc:0 "The harbours on the western shore of the Middle Lands fall one by one, their garrisons surprised by the size of the fleet. Behind the quays the host unloads, and for the first time in a thousand years a western banner flies in the east."
 zin_gunwaith_shared_tolls:0 "Shared Tolls at the Ford"
 zin_gunwaith_shared_tolls_desc:0 "The tolls on the crossing are split by agreement, half to the king and half to the wardens of Girdon. Each side now earns by the other's traffic, and neither wishes to see it stop."
 zin_gunwaith_shields_on_the_shore:0 "Shields on the Shore"
 zin_gunwaith_shields_on_the_shore_desc:0 "The western host takes post along the coast, where the dead and the dark are expected to come, and digs in. There are no heroics, only shields, spears and men who know how to hold."
 zin_gunwaith_shields_on_the_shore_spirit:0 "Shields on the Shore"
 zin_gunwaith_shields_on_the_shore_spirit_desc:0 "Western shield-walls hold the far coast, and every watch knows the one beside it."
 zin_gunwaith_ships_for_a_long_voyage:0 "Ships for a Long Voyage"
 zin_gunwaith_ships_for_a_long_voyage_desc:0 "The council agrees that if the West is to sail, it must sail in strength. Every yard gets its quota of hulls and every captain his assigned station; the shipwrights are told there will be no excuses."
 zin_gunwaith_songs_of_the_houseless_king:0 "Songs of the King Without a House"
 zin_gunwaith_songs_of_the_houseless_king_desc:0 "Bards compose songs about the king without a house, who rode the moors and made peace between rivals and then rode away. The songs grow longer with each telling, and the king in them grows less like the man."
 zin_gunwaith_tariff_protest:0 "No Tariff Without Answer"
 zin_gunwaith_tariff_protest_desc:0 "Aenor's customs-men take their toll at every western port, and Parim calls it a courtesy. The king writes a letter that is polite in every line and says in the last that the West has counted what it has paid."
 zin_gunwaith_taryns_banner:0 "Taryn's Banner"
 zin_gunwaith_taryns_banner_desc:0 "Bards sing of Taryn of Gunwaith, who would not draw her sword for the Grand Alliance until its captains named her clan with honour. The banner she carried is carried again at every moot."
 zin_gunwaith_taryns_banner_tip_1:0 "Gunwaith's banner flew in the First Age under its own commanders."
 zin_gunwaith_thanes_speak:0 "The Thanes Speak"
 zin_gunwaith_thanes_speak_desc:0 "The war-thanes have been silent for three winters, and have not enjoyed it. Now they rise in the hall one after another to say what the truce has cost: stolen herds, cold hearths and a southern border that nobody trusts."
 zin_gunwaith_the_crossing_fleet:0 "The Crossing Fleet"
 zin_gunwaith_the_crossing_fleet_desc:0 "Hundreds of hulls are gathered in the northern harbours under the plaids of every western court. When they weigh anchor, it is said, the whole coast hears the horns."
 zin_gunwaith_the_ford_holds:0 "The Ford Holds"
 zin_gunwaith_the_ford_holds_desc:0 "After years of quiet the king and the Warden-Speaker meet on the Ford and cut the truce-stone in two, leaving each half in the water. What was a pause in the war has become a peace."
 zin_gunwaith_the_great_yards:0 "The Great Yards"
 zin_gunwaith_the_great_yards_desc:0 "Where there were three slips there are now twelve, under a roof a hundred paces long. The noise of caulking can be heard from the hills."
 zin_gunwaith_the_grey_ford:0 "The Grey Ford"
 zin_gunwaith_the_grey_ford_desc:0 "The Grey Ford is a shallow crossing of a cold river, and a place where both sides once left their dead. The truce was signed on its north bank, on a table made from two doors."
 zin_gunwaith_the_isle_first:0 "The Isle First"
 zin_gunwaith_the_isle_first_desc:0 "The first sails sight the long green isle off the coast of the Middle Lands. The landing parties go ashore at dawn, and the sea behind them is white with sails."
 zin_gunwaith_the_kings_peace:0 "The King's Peace"
 zin_gunwaith_the_kings_peace_desc:0 "The king declares a peace that will outlast him: no raid, no reprisal and no blood-price to be taken in his name. Warriors who break it answer to the Lawspeaker, however high their house."
 zin_gunwaith_the_long_way_home:0 "The Long Way Home"
 zin_gunwaith_the_long_way_home_desc:0 "The war is over and the ships are brought back to the quays. The companies that stayed to the end sail with the tide, bearing honours they did not expect and scars they did not choose."
 zin_gunwaith_the_neck_road:0 "The Neck Road"
 zin_gunwaith_the_neck_road_desc:0 "North of Gunwaith the land narrows to a neck of rock and ice, and beyond it lie the Cold Lands. A road is staked out over it, and a letter goes to Fandanar to ask whether the lords of Coldor would meet it halfway."
 zin_gunwaith_the_river_league:0 "The River League"
 zin_gunwaith_the_river_league_desc:0 "The two kingdoms bind themselves to defend the rivers and the sea beyond them: shared yards, shared steersmen, shared enemies. In ten years the Ford will be a thing their children read about."
 zin_gunwaith_the_river_mouths:0 "The River Mouths"
 zin_gunwaith_the_river_mouths_desc:0 "Girdon's rivers run out to the sea through the mouths that Gunwaith has always wanted. With the claims drawn and the dark gathering, the king decides that now is the time to take them."
 zin_gunwaith_the_western_host:0 "The Western Host"
 zin_gunwaith_the_western_host_desc:0 "The clans, the horse-lords and the hill-men are formed into one army with one banner, and the Lawspeaker blesses it on the Rock. It is the host that the West will send, if the West sends anyone."
 zin_gunwaith_the_western_peace:0 "The Western Peace"
 zin_gunwaith_the_western_peace_desc:0 "At last the West has made a peace that it governs itself, with no governor from Parim and no army from abroad. It will be remembered as the quietest settlement of an age."
 zin_gunwaith_the_western_regency:0 "The Western Regency of Parim"
 zin_gunwaith_the_western_regency_desc:0 "The new king is advised by a regency council of westerners and the better sort of Aenorans, who disagree on most things. The regency keeps the peace, and little else."
 zin_gunwaith_the_western_relief:0 "The Western Relief"
 zin_gunwaith_the_western_relief_desc:0 "Word has reached the Ford that the dark is stirring in the Middle Lands. The West will not cross to conquer; it will cross to stand beside the people whose claims it once pressed."
 zin_gunwaith_the_wide_sea_crossed:0 "The Wide Sea Crossed"
 zin_gunwaith_the_wide_sea_crossed_desc:0 "The central sea was wider than any chart had shown, and the fleet crossed it in storm and calm alike. Sailors who thought they had known the ocean write that they had not."
 zin_gunwaith_those_left_behind:0 "Those Left Behind"
 zin_gunwaith_those_left_behind_desc:0 "Not every soldier made it to the ships. Companies that were cut off, wounded men and a few who simply could not leave are still on the far shore, and their families at home are asking the king what he will do for them."
 zin_gunwaith_timber_from_the_north:0 "Timber from the North"
 zin_gunwaith_timber_from_the_north_desc:0 "The great oaks of the northern forests are felled in winter, floated down the rivers in spring and seasoned in the yards for years. A keel laid today will be sound for a generation."
 zin_gunwaith_timber_rights:0 "Timber Rights of the Clans"
 zin_gunwaith_timber_rights_desc:0 "The clans have long quarrelled over who may cut the northern forests. The king declares a rule of shares, and a shipwright's yard rises at the river mouth to take the first of the logs."
 zin_gunwaith_transports:0 "Transports of the West"
 zin_gunwaith_transports_desc:0 "Broad cogs, fitted with horse-stalls and extra stores, wait at every quay."
 zin_gunwaith_transports_of_the_west:0 "Transports of the West"
 zin_gunwaith_transports_of_the_west_desc:0 "Broad-bellied cogs are fitted with horse-stalls and extra stores, crews are trained to load a host in a day and a half, and a steersman is assigned to every hull. Every one of them is meant to be filled."
 zin_gunwaith_truce_makers_court:0 "The Truce-Maker's Court"
 zin_gunwaith_truce_makers_court_desc:0 "The king who signed the Truce of the Grey Ford keeps a court for those who want it to hold: reeves, ford-wardens and mothers who have lost sons. They are not loud, but there are many of them."
 zin_gunwaith_under_the_old_banner:0 "Under the War-King's Banner"
 zin_gunwaith_under_the_old_banner_desc:0 "The old war-king's banner is unfurled, and the western companies who served under it in the Ford campaigns raise a cheer. They remember that he laid down his crown without being asked."
 zin_gunwaith_voices_of_the_west:0 "Voices of the West"
 zin_gunwaith_voices_of_the_west_desc:0 "Envoys ride to every court of the West, carrying the king's greeting and a pointed question: how much has Aenor taken from you this year? The answers are longer than anyone expected."
 zin_gunwaith_war_chest:0 "The War Chest of the West"
 zin_gunwaith_war_chest_desc:0 "The king's vaults are full, and the goods that might have gone to market have gone to the armouries."
 zin_gunwaith_war_chest_of_the_west:0 "The War Chest of the West"
 zin_gunwaith_war_chest_of_the_west_desc:0 "Tolls, tributes and the sale of a thousand horses are gathered in the king's vaults, with a clerk to count them and a chief to keep the keys. Whatever the West decides to do, Gunwaith will be able to pay for its share."
 zin_gunwaith_war_galleys:0 "War Galleys"
 zin_gunwaith_war_galleys_desc:0 "Long, low galleys with a ram at the prow and a hundred oars to the side are laid down in the northern yards. They are not made for the open ocean, but they will carry a host across a strait."
 zin_gunwaith_war_king_remembered:0 "The War-King Remembered"
 zin_gunwaith_war_king_remembered_desc:0 "For one season the confederation of the West made that stranger its war-king, and he laid the title down when the work was done. The thanes tell it as a boast, and the Lawspeaker as a lesson."
 zin_gunwaith_war_thanes:0 "The War-Thanes"
 zin_gunwaith_war_thanes_desc:0 "The thanes ride where they please and the king has promised to understand. Every month wears the truce thinner."
 zin_gunwaith_wardens_beyond_the_sea:0 "Wardens Beyond the Sea"
 zin_gunwaith_wardens_beyond_the_sea_desc:0 "The West takes up a long watch on the far shore as friends of the realm, with its own banners and its own captains. Nobody is under any illusion that it is a small thing to ask of a distant crown."
 zin_gunwaith_wardens_beyond_the_sea_spirit:0 "Wardens Beyond the Sea"
 zin_gunwaith_wardens_beyond_the_sea_spirit_desc:0 "The West keeps a watch on a foreign coast as a friend, and is proud of it."
 zin_gunwaith_weary_clans:0 "Fifty Years of War"
 zin_gunwaith_weary_clans_desc:0 "Half a century of raid and reprisal has left every clan with a dead son and a grudge. The clans want to fight less, and cannot quite say why."
 zin_gunwaith_weigh_the_warning:0 "Weigh the Warning from the East"
 zin_gunwaith_weigh_the_warning_desc:0 "A warning has reached the Rock from the man the West once crowned and then forgot. The Lawspeaker asks the clans to weigh it as they would weigh any testimony, and not to dismiss it because of who is speaking."
 zin_gunwaith_west_keeps_its_own_shore:0 "The West Keeps Its Own Shore"
 zin_gunwaith_west_keeps_its_own_shore_desc:0 "The courts decide that no sea is worth crossing for an old grudge, and the West will be the master of its own coast and its own market. A quiet decision, and the harder for it."
 zin_gunwaith_west_remembers_dardan:0 "The West Remembers Dardan"
 zin_gunwaith_west_remembers_dardan_desc:0 "Western bards sing again of the Grand Alliance, in which the clans of the West marched with the men of Aenor against the Dark King. Those who have heard the song as children are the first to volunteer."
 zin_gunwaith_west_remembers_dardan_tip_1:0 "Western banners stood with the Grand Alliance in the First Age."
 zin_gunwaith_western_forges:0 "Western Forges"
 zin_gunwaith_western_forges_desc:0 "Smiths who once worked for a single clan now share a street of forges and a master of the guild. Their spearheads are marked with the king's boar so that every buyer knows what he is getting."
 zin_gunwaith_western_garrison:0 "Governors of Parim"
 zin_gunwaith_western_garrison_desc:0 "Garrisons at every gate and bridge keep the city quiet, and make the hosts that hold it fewer than the city requires."
 zin_gunwaith_western_host:0 "The Western Host"
 zin_gunwaith_western_host_desc:0 "Hill-men, horse-lords and house-carls in one army, blessed on the Rock."
 zin_gunwaith_western_peace:0 "The Western Peace"
 zin_gunwaith_western_peace_desc:0 "A peace the West made for itself, with no governor from abroad."
 zin_gunwaith_western_purse:0 "The Western Purse"
 zin_gunwaith_western_purse_desc:0 "The courts of the West pool a purse for common works: harbour chains, ships for the common good and pay for the Buldor captains. Whoever holds the purse will be asked what it is for."
 zin_gunwaith_western_shipwrights:0 "Western Shipwrights"
 zin_gunwaith_western_shipwrights_desc:0 "Shipwrights from the river towns are given royal charters and the best of the northern oak. They have built coasting boats for centuries; the king asks them what it would take to build something bigger."
 zin_gunwaith_western_trade_league:0 "The Western Trade League"
 zin_gunwaith_western_trade_league_desc:0 "The courts of the West agree on a single tariff, a single standard of weight and one court for disputed cargoes. Merchants who once paid six tolls on a road now pay one."
 zin_gunwaith_western_trade_league_spirit:0 "The Western Trade League"
 zin_gunwaith_western_trade_league_spirit_desc:0 "One tariff, one weight and one court for disputed cargoes across the West."
 zin_gunwaith.1.a:0 "The clans ask for peace."
 zin_gunwaith.1.b:0 "The clans ask for their due."
 zin_gunwaith.1.d:0 "Every clan has come to the moor under its own plaid. The old chiefs say they are tired of burying sons; the young ones say that what is owed to the dead must be paid. The king waits for the noise to settle and asks what the clans will have."
 zin_gunwaith.1.t:0 "The Clan Moot"
 zin_gunwaith.2.a:0 "Hear him."
 zin_gunwaith.2.b:0 "Silence him."
 zin_gunwaith.2.d:0 "Thane Datid Werlen stands in the hall with a roll of names in his hand: the men killed at the Ford, the herds taken, the houses burned. His voice does not rise, and the room has gone very quiet. The king may hear him out, or tell his guards to remove him."
 zin_gunwaith.2.t:0 "Thane Datid's Grievance"
 zin_gunwaith.3.a:0 "Take the gold."
 zin_gunwaith.3.b:0 "Gunwaith is not for sale."
 zin_gunwaith.3.d:0 "A chest of coin has come from Parim, with a letter hoping that Gunwaith will find the court's friendship useful. The thanes look at the gold and the Lawspeaker looks at the thanes. The king knows that a gift from the Golden Court is rarely a gift."
 zin_gunwaith.3.t:0 "The Price of Aenoran Gold"
 zin_gunwaith.4.a:0 "Our swords go west."
 zin_gunwaith.4.b:0 "Our swords go to whoever pays most."
 zin_gunwaith.4.d:0 "Envoys from Gunwaith have come to the captains of Buldor with a new offer: steady pay, a share in the spoils and the king's protection if the swords go west. The captains are practical men, and the offer is practical, though a good deal less lucrative than Aenor's."
 zin_gunwaith.4.t:0 "Contracts from Gunwaith"
 zin_gunwaith.5.a:0 "Sell the charts and the ships."
 zin_gunwaith.5.b:0 "The islands keep out of it."
 zin_gunwaith.5.d:0 "Gunwaith asks the island kingdoms to sell their charts, their steersmen and the use of their yards. The islanders have kept their knowledge for generations and are used to being asked for it; they are less used to being paid."
 zin_gunwaith.5.t:0 "A Charter for the Western Fleet"
 zin_gunwaith.6.a:0 "Hold the line while we can."
 zin_gunwaith.6.b:0 "Ready the ships."
 zin_gunwaith.6.d:0 "The scouts return grey-faced. The dead are on the northern roads and something worse is moving from the south, and the western army is between them with its back to the sea. The captains have two plans, and neither is comfortable."
 zin_gunwaith.6.t:0 "Death from the North, Fire from the South"
 zin_gunwaith.7.a:0 "Sign as equals."
 zin_gunwaith.7.b:0 "Not yet."
 zin_gunwaith.7.d:0 "A letter has arrived from Gunwaith, sealed with the boar and the plaid. It proposes a charter between the crown of Aenor and the crown of Gunwaith, as equals, ending the long ledger of conquest and tribute. The letter is courteous and quite firm."
 zin_gunwaith.7.t:0 "Equals Across the Sea"
