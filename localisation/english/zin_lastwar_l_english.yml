l_english:
 zin_lastwar_beside_former_foes:0 "Shared a Fire"
 zin_lastwar_coronation_envoy:0 "Sent an Envoy to the Coronation"
 zin_lastwar_coronation_snub:0 "Stayed Away from the Coronation"
 zin_lastwar_marches_hold:0 "The Marches Hold"
 zin_lastwar_marches_hold_desc:0 "Every ford has a watch and every watch has orders: nothing crosses the marches that the wardens have not seen first."
 zin_lastwar_recognised_the_claim:0 "Recognised the Claim"
 zin_lastwar_refused_the_claim:0 "Refused the Claim"
 zin_lastwar.10.a:0 "Then we are ready."
 zin_lastwar.10.d:0 "A year ago [zin_loc_eindil] stood in a hall like ours and told our court what is happening now. We listened, and were laughed at in the markets for it. Nobody is laughing now. The walls are manned and the granaries are full, and the captains have stopped asking whether the stranger was right."
 zin_lastwar.10.d_sun:0 "The King of Gala's envoys told us what the water showed. We listened, and the elders who counselled patience have asked, quietly, to be forgiven. The walls are manned, the granaries are full, and the beacons have fresh tallow in their bowls."
 zin_lastwar.10.t:0 "The Warnings Remembered"
 zin_lastwar.11.a:0 "Hold the west shore."
 zin_lastwar.11.a_tip:0 "The AI will weigh the western shore and Aenor Isle for half a year."
 zin_lastwar.11.b:0 "Hold the north against the dead."
 zin_lastwar.11.b_tip:0 "The AI will weigh the strait and the northern coast for half a year."
 zin_lastwar.11.c:0 "Hold the south against the Dominion."
 zin_lastwar.11.c_tip:0 "The AI will weigh the southern marches for half a year."
 zin_lastwar.11.d:0 "Sails in the west, oaths torn in the north, the dead on the northern coast, the south on the march, eastern banners over the rift. The council must choose where Aenor fights first, and it knows that whatever it chooses, the other quarters will notice."
 zin_lastwar.11.d_four:0 "Sails in the west, oaths torn in the north, the dead on the northern coast, the south on the march and eastern banners over the rift: the horizon has no quarter left that is quiet. The council knows that whatever it chooses to hold, the other quarters will notice, and will come the sooner for it."
 zin_lastwar.11.e:0 "Hold Parim and nothing else."
 zin_lastwar.11.e_tip:0 "The AI will weigh Parim and its neighbours for half a year."
 zin_lastwar.11.t:0 "Aenor Beset"
 zin_lastwar.110.a:0 "Let the people mourn what they believed."
 zin_lastwar.110.b:0 "Tear down his images."
 zin_lastwar.110.d:0 "[zin_loc_deliverer] is dead. His temples are full of people who loved a god that was never what they thought, and who do not yet know what to do with their hands. The bread is still being given out at the doors."
 zin_lastwar.110.t:0 "The False God Is Dead"
 zin_lastwar.111.a:0 "Keep the doors open."
 zin_lastwar.111.d:0 "The hermitage is quiet. Ilvane keeps the doors open for the pilgrims who still come, and answers what questions can be answered. In the Zilin Hills the bells are rung at the old hours, and nobody has decided what they are ringing for."
 zin_lastwar.111.t:0 "The Worshipdom Without Its God"
 zin_lastwar.112.a:0 "Enough."
 zin_lastwar.112.a_tip:0 "We make white peace with every enemy."
 zin_lastwar.112.d:0 "The war that brought us here has no master now. The heralds on both sides have been told to ask whether anyone remembers what it was for, and the heralds on our side have found nobody who can say."
 zin_lastwar.112.t:0 "Peace With the Living"
 zin_lastwar.113.a:0 "Send our envoy."
 zin_lastwar.113.a_tip:0 "Aenor will think well of us."
 zin_lastwar.113.b:0 "Send a letter."
 zin_lastwar.113.c:0 "Stay away."
 zin_lastwar.113.c_tip:0 "The slight will be noted."
 zin_lastwar.113.d:0 "Parim invites every crown to the coronation of Eindil, son of Ein. Banners that faced each other a year ago will stand in one hall, and the heralds have been told to seat the guests by the date of their last war, oldest enmity nearest the door."
 zin_lastwar.113.t:0 "Envoys to the Coronation"
 zin_lastwar.12.a:0 "Send the levy."
 zin_lastwar.12.a_tip:0 "Our levy marches to Parim."
 zin_lastwar.12.b:0 "Guard our own borders."
 zin_lastwar.12.b_tip:0 "The crown will remember who stayed home."
 zin_lastwar.12.d:0 "Parim calls every dominion's levy. The charters say that the crown may ask; they do not say that the dominions must come. The keeper of our muster-roll has brought the roll to the hall, and asks whether it is to be read out in the yard or put back in its chest."
 zin_lastwar.12.t:0 "The Concord Calls Its Levies"
 zin_lastwar.13.a:0 "Open the granaries."
 zin_lastwar.13.b:0 "Close the roads."
 zin_lastwar.13.d:0 "The roads to the Great Lake are full of carts. Nobody knows which way is safe, and every ferryman has doubled his fee. In the villages near the Wall they say that the Great Lake will hold, and in the villages near the Great Lake they say the opposite."
 zin_lastwar.13.t:0 "Refugees on the Roads"
 zin_lastwar.14.a:0 "Man the forts."
 zin_lastwar.14.a_tip:0 "Sea forts will rise on the southern shore of the strait."
 zin_lastwar.14.b:0 "Let them go."
 zin_lastwar.14.d:0 "The Leren fleets that watched the strait for Aenor have sailed home. The strait's southern forts are ours alone, and their garrisons look out at the empty water where the northern masts used to stand."
 zin_lastwar.14.t:0 "Northern Ships Turn Home"
 zin_lastwar.20.a:0 "Fight from every quay."
 zin_lastwar.20.b:0 "Spare the harbour towns."
 zin_lastwar.20.b_tip:0 "The towns the West holds will be easier to govern."
 zin_lastwar.20.c:0 "Send the lake fleet."
 zin_lastwar.20.c_tip:0 "The AI will weigh the western shore for half a year."
 zin_lastwar.20.d:0 "The western host is ashore on Aenor Isle. Their ships lie off the harbour towns of Asgard in the same water where Aenor's first ships once anchored, and the lake fleet, which has never fought in salt water, is being asked to."
 zin_lastwar.20.d_asgard:0 "Our harbours were the first the Aenoran ships reached, long ago. Now the western ships take them, one quay at a time, and the same stones that welcomed the first Aenorans are being walked on by men who have come to remind Parim of that day."
 zin_lastwar.20.t:0 "Sails Off Aenor Isle"
 zin_lastwar.21.a:0 "For the old claims."
 zin_lastwar.21.d:0 "Our grandfathers' grandfathers were ruled from Parim, and told that it was discovery. Our sons are on its shore, and the quays are the same stone. The captains say that there are songs now about the day the sea was crossed the other way."
 zin_lastwar.21.t:0 "The West Remembers"
 zin_lastwar.30.a:0 "Burn them."
 zin_lastwar.30.d:0 "Our soldiers broke their ranks. In the morning the same ranks stood again, in the same order, with the same wounds. The captains of the watch say that it is not the dead who are afraid."
 zin_lastwar.30.t:0 "The Dead Do Not Stay Down"
 zin_lastwar.40.a:0 "Mirolon was right."
 zin_lastwar.40.b:0 "Send the Lost Cause south."
 zin_lastwar.40.b_tip:0 "A thousand sets of arms go to Mirolon."
 zin_lastwar.40.d:0 "Mirolon's watchtowers on the passes are burning. For twenty years Mirolon told the north that this day would come, and for twenty years the north found the warning inconvenient."
 zin_lastwar.40.d_aenor:0 "Mirolon's watchtowers on the passes are burning. For twenty years Mirolon told Parim that this day would come, and for twenty years Parim found the warning inconvenient. The Marshal asks what the Lost Cause is for, if not for this."
 zin_lastwar.40.t:0 "The Passes Burn"
 zin_lastwar.41.a:0 "Hold every ford."
 zin_lastwar.41.a_tip:0 "The marches will dig in for half a year."
 zin_lastwar.41.b:0 "Fall back to the Great Lake."
 zin_lastwar.41.d:0 "The southern marches of the Concord face the whole Dominion. Herez's wardens count the fires on the horizon every night, and the arithmetic does not improve with repetition. The ford-keepers have asked for the old orders, the ones that were never rescinded."
 zin_lastwar.41.t:0 "Herez Holds the Marches"
 zin_lastwar.50.a:0 "Hold with the Captains."
 zin_lastwar.50.b:0 "Every dominion for itself."
 zin_lastwar.50.b_tip:0 "The charters weaken. Below 25 loyalty, a dominion may secede."
 zin_lastwar.50.d:0 "The god who wore Aenor's crown has fled east. The Captains in Parim ask the dominions to hold, and the dominions, who were told for a year and a half that the king was a god, are discovering what they think of the Captains."
 zin_lastwar.50.t:0 "The False God Gone"
 zin_lastwar.51.a:0 "Close the Houses."
 zin_lastwar.51.a_tip:0 "The Houses are shut and their stores seized."
 zin_lastwar.51.b:0 "Keep the hospitals, dismiss the priests."
 zin_lastwar.51.c:0 "Leave them be."
 zin_lastwar.51.d:0 "The Houses of the First Light are full of people who never knew whom they served. Some priests have gone east. Most are still feeding the poor, and have asked the court whether the poor are to be told whose bread they are eating."
 zin_lastwar.51.t:0 "The Faithful Divided"
 zin_lastwar.52.a:0 "Fight them at the Wall."
 zin_lastwar.52.a_tip:0 "The AI will weigh the Great Wall for half a year."
 zin_lastwar.52.d:0 "The eastern host that crossed the rift is in the Middle Lands now. Its banners are the King of the East's, or its own; our scouts cannot tell, and the banners have been taken down from the baggage so that nobody has to say."
 zin_lastwar.52.t:0 "Eastern Banners in the Middle Lands"
 zin_lastwar.60.a:0 "We will take it back."
 zin_lastwar.60.d:0 "The Captains' Regency rules from [ROOT.Capital.GetName]. Parim's people watch the westerners in the streets and count the days until the dead or the south arrive, which they agree will be sooner than the westerners think."
 zin_lastwar.60.t:0 "Parim Under Western Banners"
 zin_lastwar.61.a:0 "Hold on."
 zin_lastwar.61.d:0 "Between the dead from the north and the hosts from the south there is nowhere left to stand. The two darks have fought each other and the field is theirs; the villages in the middle are not on anyone's map any longer."
 zin_lastwar.61.t:0 "Crushed Between Two Darks"
 zin_lastwar.62.a:0 "They are our men still."
 zin_lastwar.62.b:0 "They chose their road."
 zin_lastwar.62.d:0 "Our soldiers who missed the ships are camped beside the Aenorans they fought a season ago. Both are fighting the dead now, and the quartermasters have stopped counting whose bread is whose."
 zin_lastwar.62.t:0 "Stranded Beside the Conquered"
 zin_lastwar.70.a:0 "For now, we are one army."
 zin_lastwar.70.a_tip:0 "Aenor's realms in the coalition will think better of us."
 zin_lastwar.70.d:0 "Our captains share a fire with Aenorans they fought last year. Nobody speaks of it. The older men have found that a man will pass the salt to anyone who has stood on the same line as he has."
 zin_lastwar.70.t:0 "Beside Former Foes"
 zin_lastwar.71.a:0 "Then we fight both."
 zin_lastwar.71.d:0 "The dead and the Dominion no longer fight each other. They fight us. The scouts who have crossed the line between them say that the two hosts keep their camps a bowshot apart and do not look at one another."
 zin_lastwar.71.t:0 "Two Darks, One Field"
 zin_lastwar.72.a:0 "Keep looking."
 zin_lastwar.72.d:0 "Nobody has seen the wizard's small companion since the wards fell. Alleria's scouts found no body, and they looked, as they put it, in all the places where a body would be. The Host has stopped saying that he is dead and has not yet begun to say that he lives."
 zin_lastwar.72.t:0 "Where Is Golbran?"
 zin_lastwar.73.a:0 "They came."
 zin_lastwar.73.d:0 "Elves in white and gold, and things older than elves, came onto the field. They did not come to restore any crown. They came because an Old God's victory would end the freedom of every living people, and they said so, plainly, to the first captain who asked."
 zin_lastwar.73.t:0 "Lorien on the Field"
 zin_lastwar.80.a:0 "Bury them all, ours and theirs."
 zin_lastwar.80.b:0 "Rebuild the walls first."
 zin_lastwar.80.b_tip:0 "A stone fort will rise in the capital's city."
 zin_lastwar.80.d:0 "The dead of the north have lost their hold or gone home. The Dominion's hosts are scattered. The living count who is left, and find that the count is a shorter list than they had hoped, and that the field is wider than any list."
 zin_lastwar.80.t:0 "A Field Full of Dead"
 zin_lastwar.90.a:0 "Never."
 zin_lastwar.90.b:0 "So be it."
 zin_lastwar.90.c:0 "Watch."
 zin_lastwar.90.d:0 "[zin_loc_deliverer] has come back from the East with a new host. He demands that the exhausted kingdoms recognise him as ruler of the East and the Middle Lands. His envoys carry the old temple seals, and they ask the courts they pass through to remember who fed them."
 zin_lastwar.90.t:0 "The King of the East Marches West"
 zin_lastwar.91.a:0 "Never."
 zin_lastwar.91.a_tip:0 "He will not forget it, and neither will we."
 zin_lastwar.91.b:0 "Send no answer."
 zin_lastwar.91.c:0 "Recognise him."
 zin_lastwar.91.c_tip:0 "The King of the East will count us a friend."
 zin_lastwar.91.d:0 "Envoys from Parim demand that our court recognise [zin_loc_deliverer] as king over all Aoaz. They stand in the hall in the grey cloaks of the Houses, and they ask for the answer in writing, so that it may be read out in the east."
 zin_lastwar.91.t:0 "The Claim of All Aoaz"
 zin_lastwar.92.a:0 "Endure."
 zin_lastwar.92.a_tip:0 "Resistance rises in the states the King of the East holds."
 zin_lastwar.92.d:0 "In Parim the old council has resumed its work. Those who spoke against the false god have been taken from their houses at night, and the lists are posted on the doors of the Houses so that no one may say that they were not told."
 zin_lastwar.92.t:0 "Opposition Is Punished"
