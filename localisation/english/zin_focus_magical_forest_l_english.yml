l_english:
 zin_magical_forest_against_the_dark:0 "Against the Dark"
 zin_magical_forest_against_the_dark_desc:0 "The host marches out of the woods toward the enemy of all the free. The woods are silent behind it, and the oldest tree in the grove is said to have wept."
 zin_magical_forest_aoaz_is_shared:0 "Aoaz Is Shared"
 zin_magical_forest_aoaz_is_shared_desc:0 "The land is not the elves' alone, say the Open Houses, and the dark does not stop at the Wall. A letter goes to the courts beyond it, saying that the woods have not forgotten that they are part of Aoaz."
 zin_magical_forest_archers_of_houses:0 "Archers of the Houses"
 zin_magical_forest_archers_of_houses_desc:0 "Each house has its own company of archers, with its own colours and its own songs. When they muster together, the woods look as though they have grown a thousand green banners."
 zin_magical_forest_beacons:0 "Beacons on the Eastern Shore"
 zin_magical_forest_beacons_desc:0 "The beacons are lit at dusk and put out at dawn, and the watchers sing to keep awake. A ship that tries to land in the dark will find the coast already awake."
 zin_magical_forest_bind_the_rivals:0 "Bind the Old Rivals"
 zin_magical_forest_bind_the_rivals_desc:0 "Herrodon and Andos Enda are made to swear, before the Elder Moot, that neither will take up arms against the other. The oath is very old, and has not been used in eight hundred years."
 zin_magical_forest_boundary_groves:0 "The Boundary Groves"
 zin_magical_forest_boundary_groves_desc:0 "The groves along the border of Herrodon and Andos Enda are at the heart of the dispute. The Speakers propose that both sides accept the Forest's judgement as to which is whose."
 zin_magical_forest_call_the_kindred:0 "Call the Kindred"
 zin_magical_forest_call_the_kindred_desc:0 "The Kindred is called to arms, grove by grove, and the realms of the Magical Lands answer in their own tongues. The elves have not stood together like this since the Second Age."
 zin_magical_forest_captains_of_houses:0 "Captains of the Houses"
 zin_magical_forest_captains_of_houses_desc:0 "Ithrandel, who has walked the Long Patrols since she was young, is given a captain's staff. She is the youngest of the houses' captains, and perhaps the most careful."
 zin_magical_forest_close_every_road:0 "Close Every Road"
 zin_magical_forest_close_every_road_desc:0 "Every road that leads to the Zilin Hills is closed by the houses that hold it. No pilgrim will pass, and no pilgrim's friend will follow."
 zin_magical_forest_close_the_wall_roads:0 "Close the Wall Roads"
 zin_magical_forest_close_the_wall_roads_desc:0 "The roads that cross the Wall are shut from the elven side, and the gates are barred with living thorn. It is the harshest thing the houses have done to men in eighteen centuries, and they do it without anger."
 zin_magical_forest_council_of_houses:0 "The Council of Houses"
 zin_magical_forest_council_of_houses_desc:0 "The Magical Forest is ruled by no king. Its houses send speakers to a council under the oldest trees, and the council elects a First Speaker from among them. It has done so for longer than most human kingdoms have had names."
 zin_magical_forest_counsel_of_ancients:0 "Counsel of the Ancients"
 zin_magical_forest_counsel_of_ancients_desc:0 "The eldest of the elves, who remember the Second Age, are asked to give their counsel to the council. They speak slowly, and the council listens, because they have been right before."
 zin_magical_forest_counsel_of_ancients_spirit:0 "Counsel of the Ancients"
 zin_magical_forest_counsel_of_ancients_spirit_desc:0 "The eldest of the elves, who remember the Second Age, advise the council."
 zin_magical_forest_count_the_roosts:0 "Count the Roosts"
 zin_magical_forest_count_the_roosts_desc:0 "Wardens climb to the roosts to count the dragons that remain, and to note which are young, which are old and which are unwell. The count is shorter than the elders hoped."
 zin_magical_forest_count_the_roosts_tip_1:0 "Dragons the mountain can still give: [?global.zin_dragons_free|0]"
 zin_magical_forest_courtesy_to_hermitage:0 "Courtesy to the Hermitage"
 zin_magical_forest_courtesy_to_hermitage_desc:0 "The elves send gifts to the hermitage in the Zilin Hills, a basket of fruit and a polite note. The hermits reply with great warmth, and a slightly overlong list of petitions."
 zin_magical_forest_customs_at_the_gate:0 "Customs at the Gate"
 zin_magical_forest_customs_at_the_gate_desc:0 "The Golden Court's customs men sit at the gate of the Wall with ledgers, scales and a growing list of duties. The elves send a polite note asking what they have done to deserve them."
 zin_magical_forest_deep_timber:0 "Timber of the Deep Woods"
 zin_magical_forest_deep_timber_desc:0 "The elves take only wood that has fallen, or is dying, and they take it with a song. The result is timber that is carved rather than cut, and costs three times as much as a sawyer's."
 zin_magical_forest_defend_ours:0 "Defend What Is Ours"
 zin_magical_forest_defend_ours_desc:0 "Forts, wards and watchers stand along every road into the woods."
 zin_magical_forest_defend_what_is_ours:0 "Defend What Is Ours"
 zin_magical_forest_defend_what_is_ours_desc:0 "If the elves will not march beyond their borders, then the borders must be strong. Forts, wards and watchers are set along every road into the woods."
 zin_magical_forest_dragon_kinship:0 "Dragon Kinship"
 zin_magical_forest_dragon_kinship_desc:0 "A few of the older dragons will allow themselves to be touched, and a few elves have learned to read their moods. The first of these friendships began with a debt, and has become something else."
 zin_magical_forest_dragons_of_march:0 "Dragons of the March"
 zin_magical_forest_dragons_of_march_desc:0 "The mountain sends a dragon to the host, and the elves, who have waited an age to be asked, take it up with reverence. It is a gift and a debt, and both are understood."
 zin_magical_forest_drive_out_temple:0 "Drive Out the Temple"
 zin_magical_forest_drive_out_temple_desc:0 "The houses have decided that the temple cannot be allowed to remain, and the Kindred marches on the Zilin Hills. It is the first war the elves have begun in an age, and they begin it with grief."
 zin_magical_forest_eastern_beacons:0 "Beacons on the Eastern Shore"
 zin_magical_forest_eastern_beacons_desc:0 "Every cape has its beacon, every beacon has its watcher and every watcher is awake."
 zin_magical_forest_elder_archive:0 "The Elder Archive"
 zin_magical_forest_elder_archive_desc:0 "In a hollow oak the loremasters keep what the elves remember: songs, genealogies, treaties with kings who died before Aenor was founded. The archive is open to any scholar who can climb to it."
 zin_magical_forest_elder_archive_spirit:0 "The Elder Archive"
 zin_magical_forest_elder_archive_spirit_desc:0 "A hollow oak holds the songs, genealogies and treaties of an unwritten age."
 zin_magical_forest_elder_kinship:0 "The Elder Kinship"
 zin_magical_forest_elder_kinship_desc:0 "The elves of the Magical Lands are many peoples with one memory. The Magical Forest, as the oldest of them, reminds the others of what they owe each other, and what they would regret forgetting."
 zin_magical_forest_elder_moot:0 "The Elder Moot"
 zin_magical_forest_elder_moot_desc:0 "The eldest of every realm are called to a moot in the Magical Forest, to speak as one people for the first time since the Second Age. What they decide will be told to the young as history."
 zin_magical_forest_elder_wanderers:0 "The Elder Wanderers"
 zin_magical_forest_elder_wanderers_desc:0 "Elders who have not left the woods for centuries take up staves and walk into the lands of men, to heal, to counsel and to stand beside those who ask. The council neither forbids them nor commands them."
 zin_magical_forest_elven_host:0 "The Elven Host"
 zin_magical_forest_elven_host_desc:0 "The musters of the houses are gathered into a host and given a banner. The elves have not carried one beyond their borders since Dardan, and the old ones weep at the sight of it."
 zin_magical_forest_elven_host_spirit:0 "The Elven Host"
 zin_magical_forest_elven_host_spirit_desc:0 "The elves march beyond their borders for the first time since Dardan."
 zin_magical_forest_elven_sails:0 "Elven Sails"
 zin_magical_forest_elven_sails_desc:0 "The elves are not a seafaring people, but they know the rift sea's currents and can build a boat that will outlast a storm. The ships are white-sailed and swift, and they carry watchers, not warriors."
 zin_magical_forest_elven_steeds:0 "Elven Steeds"
 zin_magical_forest_elven_steeds_desc:0 "The white horses of the woods will carry a rider through bramble and bog, and they come when called. They are not for sale, and have never been."
 zin_magical_forest_envoys_to_kin:0 "Envoys to the Kin Realms"
 zin_magical_forest_envoys_to_kin_desc:0 "Speakers go from grove to grove with a greeting and a gift. They are received with the courtesy of old friends who have not seen one another for a long time."
 zin_magical_forest_every_tree:0 "Roots Like Walls"
 zin_magical_forest_every_tree_a_wall:0 "Every Tree a Wall"
 zin_magical_forest_every_tree_a_wall_desc:0 "The woods themselves become the fortress: roots are coaxed across the roads, branches into barricades and thorn into a hedge no horse will cross. The invader will find the forest a harder wall than any made of stone."
 zin_magical_forest_every_tree_desc:0 "The woods themselves have become the fortress: roots across the roads, thorn in the hedges."
 zin_magical_forest_eyes_on_roads:0 "Eyes on the Roads"
 zin_magical_forest_eyes_on_roads_desc:0 "Rangers are posted at every crossing to note who passes, how many and with what burdens. They write it all down, politely, and say nothing about it to the pilgrims."
 zin_magical_forest_eyes_on_roads_spirit:0 "Eyes on the Roads"
 zin_magical_forest_eyes_on_roads_spirit_desc:0 "Rangers at every crossing note who passes, and say nothing about it."
 zin_magical_forest_eyries:0 "Eyries of the Magic Mountains"
 zin_magical_forest_eyries_desc:0 "Eyries are cut into the rock for the beasts that fly, with ledges for the great ones and perches for the lesser. The elves ask nothing of the beasts that nest there, except that they stay."
 zin_magical_forest_fair_tolls:0 "Ask for Fair Tolls"
 zin_magical_forest_fair_tolls_desc:0 "The elves write a letter asking the Golden Court to set fair tolls at the gate. They enclose a table of what they have paid for seventeen years, with a note on how it compares with what is customary."
 zin_magical_forest_first_among_kin:0 "First Among the Kin"
 zin_magical_forest_first_among_kin_desc:0 "The kin realms acknowledge the Magical Forest as first among equals. It is an honour, and a duty, and a thing that the Forest has always insisted it does not want."
 zin_magical_forest_first_among_kin_spirit:0 "First Among the Kin"
 zin_magical_forest_first_among_kin_spirit_desc:0 "The kin acknowledge the Magical Forest as first among equals, to the Forest's mild embarrassment."
 zin_magical_forest_forest_forgets:0 "The Forest Forgets Men"
 zin_magical_forest_forest_forgets_desc:0 "The forest forgets the faces of men, their names and the roads they came by. Even those who work against the woods in secret find that their schemes no longer have a place to stand."
 zin_magical_forest_forest_provides:0 "The Forest Provides"
 zin_magical_forest_forest_provides_desc:0 "The woods give timber, leaf-iron ore and herbs for healing, and in time of danger they give it freely. The elves have never needed to hoard, and are not about to begin."
 zin_magical_forest_forest_rangers:0 "Forest Rangers"
 zin_magical_forest_forest_rangers_desc:0 "The best archers in the woods are enrolled as rangers and taught to move unseen, shoot from cover and fall back before they are found. The elves have done this for ten thousand years."
 zin_magical_forest_free_ally:0 "A Free Ally From the Mountain"
 zin_magical_forest_free_ally_desc:0 "A dragon of the mountain has agreed, if the elves will ask it, to carry [zin_loc_eindil] as a free ally and not as a servant. The Speakers do not know why it has chosen to, and are careful not to ask."
 zin_magical_forest_friends_at_kingson:0 "Friends at Kingson"
 zin_magical_forest_friends_at_kingson_desc:0 "Kingson keeps the main gate of the Wall and has always been friendlier than its masters in Parim. The elves send gifts, a delegation and a very polite invitation to a feast."
 zin_magical_forest_gates_in_war:0 "Gates in Time of War"
 zin_magical_forest_gates_in_war_desc:0 "In time of war the gates of the Wall must be either open or barred, and the council must say which. The Speakers are asked for a decision, and told that every gate will have to be tended by someone."
 zin_magical_forest_gifts_to_great_realms:0 "Gifts to Lccimio and The End"
 zin_magical_forest_gifts_to_great_realms_desc:0 "The two large realms of the rift coast are given gifts of timber, seed-grain and good bows, with a message of kinship. They are the first to face the East, and they should know they are remembered."
 zin_magical_forest_grand_alliance_remembered:0 "The Grand Alliance Remembered"
 zin_magical_forest_grand_alliance_remembered_desc:0 "The houses remember Dardan, and Edran's folly, and the long silence that followed, and decide to be remembered differently this time. The elves march not as an army of men's wars, but as a people who have chosen their own."
 zin_magical_forest_grand_alliance_remembered_spirit:0 "The Grand Alliance Remembered"
 zin_magical_forest_grand_alliance_remembered_spirit_desc:0 "The houses remember Dardan, and march to be remembered differently this time."
 zin_magical_forest_grove_workshops:0 "The Grove Workshops"
 zin_magical_forest_grove_workshops_desc:0 "Bows are strung, blades are folded and cloaks are woven in long halls under the leaves. The elves do not make many weapons, but the ones they make are very good."
 zin_magical_forest_groves_of_refuge:0 "Groves of Refuge"
 zin_magical_forest_groves_of_refuge_desc:0 "Hidden groves are grown into fortresses, with roots for walls and branches for roofs. Anyone who takes shelter there is safe for as long as the trees stand."
 zin_magical_forest_guard_against_wyrms:0 "A Guard Against the Wyrms"
 zin_magical_forest_guard_against_wyrms_desc:0 "Dragons sometimes fly over the Wall, and men below it do not know whether to wave or run. The elves set up a signal-post and a rule: no wyrm crosses without a warning horn."
 zin_magical_forest_guard_the_roosts:0 "Guard the Roosts"
 zin_magical_forest_guard_the_roosts_desc:0 "Wards are laid across the approaches to the roosts, and the watch is doubled. Whatever creeps at the edge of the mountain, it will find the elves awake."
 zin_magical_forest_harvest_moots:0 "The Harvest Moots"
 zin_magical_forest_harvest_moots_desc:0 "Each autumn the houses gather to share the fruit, nuts and honey of the woods and to settle accounts for the year. The moots last three days and nobody leaves hungry."
 zin_magical_forest_harvest_moots_spirit:0 "The Harvest Moots"
 zin_magical_forest_harvest_moots_spirit_desc:0 "Each autumn the houses share the woods' bounty and settle the year's accounts."
 zin_magical_forest_healers_not_hosts:0 "Healers, Not Hosts"
 zin_magical_forest_healers_not_hosts_desc:0 "The elves cannot send armies, but they can send healers, herbs and teachers. A few set out for the lands of men, each alone, each by their own choice."
 zin_magical_forest_heed_the_warning:0 "Heed the Warning"
 zin_magical_forest_heed_the_warning_desc:0 "A traveller has come to the woods bringing a warning from the north. The council has heard many such warnings, but this one comes from [zin_loc_eindil], who has no reason to lie and every reason to be believed."
 zin_magical_forest_hidden_woods:0 "The Hidden Woods"
 zin_magical_forest_hidden_woods_desc:0 "The houses decide that the woods have been too much in the world, and that the wisest thing is to leave it. The roads wander, the gates close and the elves go quietly out of the sight of men."
 zin_magical_forest_hidden_woods_spirit:0 "The Hidden Woods"
 zin_magical_forest_hidden_woods_spirit_desc:0 "The woods have turned away from the world, and the roads wander."
 zin_magical_forest_hold_high_passes:0 "Hold the High Passes"
 zin_magical_forest_hold_high_passes_desc:0 "Nolorim's passes are the back door of the woods, and the Forest sends everything it can spare to hold them. If the passes fall, the eastern host will walk into the heart of the Magical Lands."
 zin_magical_forest_home_to_woods:0 "Home to the Woods"
 zin_magical_forest_home_to_woods_desc:0 "The war is done, and the host goes home under its green banners. The Refusal is taken up again, like a cloak laid aside, and the woods close behind it."
 zin_magical_forest_host_of_woods:0 "The Host of the Woods"
 zin_magical_forest_host_of_woods_desc:0 "The musters are formed into a single host, under a single banner, for the defence of the woods. It will fight in the trees it knows, and on no other ground."
 zin_magical_forest_host_of_woods_spirit:0 "The Host of the Woods"
 zin_magical_forest_host_of_woods_spirit_desc:0 "The musters of the houses have been formed into one host for the defence of the woods."
 zin_magical_forest_house_musters:0 "Every House a Muster"
 zin_magical_forest_house_musters_desc:0 "The horns sound from grove to grove, and every house sends its muster to the council tree. The elves are not many, but they have not all marched together in a very long time."
 zin_magical_forest_house_musters_spirit:0 "Every House a Muster"
 zin_magical_forest_house_musters_spirit_desc:0 "Every house has sent its muster to the council tree, and every muster has a banner."
 zin_magical_forest_houses_in_harmony:0 "Houses in Harmony"
 zin_magical_forest_houses_in_harmony_desc:0 "The old quarrels of the houses are brought to the council and settled one by one, with grace and a great many cups of water. When the last of them is done, the council sings, and the sound is heard in every grove."
 zin_magical_forest_into_the_sea:0 "Throw Them Into the Sea"
 zin_magical_forest_into_the_sea_desc:0 "The order goes out to every ranger and archer: the invader is to be driven from the woods and back to the water. It is the sternest order the houses have given in an age."
 zin_magical_forest_into_the_sea_spirit:0 "Throw Them Into the Sea"
 zin_magical_forest_into_the_sea_spirit_desc:0 "The order is given: the invader is to be driven from the woods and back to the water."
 zin_magical_forest_keepers_of_roosts:0 "Keepers of the Roosts"
 zin_magical_forest_keepers_of_roosts_desc:0 "Dragon Mountain is the home of the last dragons of Aoaz, and the elves are its guardians by old right. The Keeper tends the roosts, brings food and song, and stays out of the dragons' way."
 zin_magical_forest_kin_beside_us:0 "Kin Beside Us"
 zin_magical_forest_kin_beside_us_desc:0 "The Magical Forest asks the kin realms to march with it. Each is free to refuse, and each is asked in its own tongue by a speaker of its own house."
 zin_magical_forest_kindred_marches:0 "The Kindred Marches"
 zin_magical_forest_kindred_marches_desc:0 "The houses set the Refusal aside for this war, and for this war only. The decision is not taken lightly; the elders say that the Refusal is not broken, only laid down for a time, like a sword that is still in its sheath."
 zin_magical_forest_kindred_of_the_woods:0 "The Kindred of the Woods"
 zin_magical_forest_kindred_of_the_woods_desc:0 "The Kindred of the Woods is a pact the elves keep for the day they must defend their land as one. Its banners are green, its oath is short and its members swear it in their own tongues."
 zin_magical_forest_lantern_memory:0 "The Lantern Memory"
 zin_magical_forest_lantern_memory_desc:0 "Lanterns are lit in the groves in memory of the wizard's wardens, who watched the woods in the Third Age. The elves do not say whether the lanterns are for the wardens or for the wizard."
 zin_magical_forest_lantern_memory_spirit:0 "The Lantern Memory"
 zin_magical_forest_lantern_memory_spirit_desc:0 "Lanterns are lit in the groves for the wizard's wardens, and for the wizard."
 zin_magical_forest_leaf_steel:0 "Leaf-Iron"
 zin_magical_forest_leaf_steel_desc:0 "The smiths of the woods fold iron with leaf-ash and song, and the blade that results is thin, light and very hard. It takes a year to make a sword, and a lifetime to wear one out."
 zin_magical_forest_living_halls:0 "The Living Halls"
 zin_magical_forest_living_halls_desc:0 "Halls are grown, not built: living trees are coaxed into arches, branches into rafters and moss into roofs. The halls house workshops, schools and granaries, and last a thousand years."
 zin_magical_forest_living_halls_spirit:0 "The Living Halls"
 zin_magical_forest_living_halls_spirit_desc:0 "Halls are grown, not built, and last a thousand years."
 zin_magical_forest_long_election:0 "The Long Election"
 zin_magical_forest_long_election_desc:0 "The houses elect their First Speaker once in sixty years, and the campaign is slow, courteous and merciless. Songs are written, bargains struck and long-standing slights remembered, and the last ballot is a matter of a single leaf."
 zin_magical_forest_long_patrols:0 "The Long Patrols"
 zin_magical_forest_long_patrols_desc:0 "Patrols range through the woods and beyond them for weeks at a time, speaking to hunters, herdsmen and strangers. They bring back news, and sometimes a visitor who wished to see the woods."
 zin_magical_forest_long_patrols_spirit:0 "The Long Patrols"
 zin_magical_forest_long_patrols_spirit_desc:0 "Patrols range through the woods and beyond for weeks at a time."
 zin_magical_forest_lore_of_dragons:0 "The Lore of Dragons"
 zin_magical_forest_lore_of_dragons_desc:0 "The loremasters set down what is known of the dragons: how they hunt, how they breed, what they fear and what they can be asked. Much of it is song, and much of the rest is guesswork."
 zin_magical_forest_loremasters:0 "The Loremasters"
 zin_magical_forest_loremasters_desc:0 "Loremasters are sent to the houses to teach what the archive holds: the old formations, the names of the passes, the warnings that the grandfathers left. A young archer learns more from them than from a captain."
 zin_magical_forest_mediate_rivals:0 "Mediate Between the Rivals"
 zin_magical_forest_mediate_rivals_desc:0 "The First Speaker herself travels to the border of Herrodon and Andos Enda, sits between their delegations and says nothing for three days. On the fourth, they begin to talk."
 zin_magical_forest_merchants_of_rift:0 "Merchants Across the Rift"
 zin_magical_forest_merchants_of_rift_desc:0 "Merchants from the East Lands come to the elven ports with rich cargoes and bright tales of kings who are strong and neighbours who are weak. The elves buy their wares and listen with great politeness."
 zin_magical_forest_mushroom_trade:0 "Trade With the Mushroom Forest"
 zin_magical_forest_mushroom_trade_desc:0 "In the Mushroom Forest strange lights glow beneath the caps, and its people trade in dyes, medicines and glass. The elves buy from them without asking much, and are paid in kind."
 zin_magical_forest_new_accord:0 "A New Accord at the Wall"
 zin_magical_forest_new_accord_desc:0 "With the long war ended, the elves propose a new Accord to replace the old, written by both sides and sealed on the Wall. This time, the elves suggest, it might be read aloud once a year."
 zin_magical_forest_no_crown_from_victory:0 "No Crown From Victory"
 zin_magical_forest_no_crown_from_victory_desc:0 "The elves say plainly, before any battle is won, that they ask for no land, no crown and no tribute. They have come to defend, and when the work is done, they will go home."
 zin_magical_forest_no_elf_pursues:0 "No Elf Pursues"
 zin_magical_forest_no_elf_pursues_desc:0 "The invader has been driven back to the water, and the council forbids pursuit. The elves defend their woods; they do not march to the ends of the earth to punish those who have left them."
 zin_magical_forest_no_men_in_woods:0 "No Men in the Woods"
 zin_magical_forest_no_men_in_woods_desc:0 "The pilgrim roads and the Wall roads are closed together, and the elves pass a rule: no man shall be received, lodged or listened to. The rule is not cruel; it is only complete."
 zin_magical_forest_old_groves:0 "The Old Groves"
 zin_magical_forest_old_groves_desc:0 "The groves are the oldest living things in Aoaz, and the elves do not own them, only tend them. Paths are cleared, wells are dug and a grove-warden is appointed to each of the great trees."
 zin_magical_forest_old_houses:0 "The Old Houses Speak"
 zin_magical_forest_old_houses_desc:0 "The Old Houses hold that the woods are the world, and that what happens beyond them is not the council's concern. They are respected, and nobody doubts they are right about the woods."
 zin_magical_forest_old_houses_spirit:0 "The Old Houses"
 zin_magical_forest_old_houses_spirit_desc:0 "The Old Houses hold that the woods are the world, and the council is the better for being slow."
 zin_magical_forest_old_pact:0 "The Old Pact With the Mountain"
 zin_magical_forest_old_pact_desc:0 "The pact between the mountain and the woods is as old as the elves, and no one alive has seen it written. The houses meet to renew it by voice, and the mountain, after a long silence, answers."
 zin_magical_forest_old_rivalry:0 "The Old Rivalry"
 zin_magical_forest_old_rivalry_desc:0 "Herrodon and Andos Enda have quarrelled for as long as the Magical Forest can remember, over a river, a grove and a slight at a wedding. The Speakers say it is time someone looked at the matter."
 zin_magical_forest_old_ways:0 "The Old Ways"
 zin_magical_forest_old_ways_desc:0 "The elders teach the young how to move through the woods without leaving a mark, to listen to the leaves and to know where the enemy is by the silence of the birds."
 zin_magical_forest_old_ways_spirit:0 "The Old Ways"
 zin_magical_forest_old_ways_spirit_desc:0 "The elders teach the young to move through the woods without leaving a mark."
 zin_magical_forest_open_houses:0 "The Open Houses Speak"
 zin_magical_forest_open_houses_desc:0 "The Open Houses believe that the woods are one place among many, and that the long-lived have a duty to know their neighbours. They keep the roads open and the gates unlocked, and hear a good deal of news."
 zin_magical_forest_open_houses_spirit:0 "The Open Houses"
 zin_magical_forest_open_houses_spirit_desc:0 "The Open Houses keep the roads open and hear all the news."
 zin_magical_forest_over_wall_as_friends:0 "Over the Wall as Friends"
 zin_magical_forest_over_wall_as_friends_desc:0 "The elves ask Aenor for leave to march over the Wall, as friends and not as masters. The Accord forbids an army to cross it, and the elves are careful to ask in advance."
 zin_magical_forest_pilgrim_hostels:0 "Hostels for the Pilgrims"
 zin_magical_forest_pilgrim_hostels_desc:0 "Hostels are built along the roads, with clean beds, a fire and a healer. The pilgrims leave blessings behind them, and sometimes a coin."
 zin_magical_forest_pilgrim_roads:0 "Pilgrims on the Elven Roads"
 zin_magical_forest_pilgrim_roads_desc:0 "Pilgrims from every court walk the elven roads to a hermitage in the Zilin Hills. The elves give them water and a place to rest, and sometimes wonder what it is they are looking for."
 zin_magical_forest_question_of_refusal:0 "The Question of the Refusal"
 zin_magical_forest_question_of_refusal_desc:0 "The Refusal was made after Dardan, and has stood for three thousand years. The council must now ask whether the world has changed enough to ask something different of the elves."
 zin_magical_forest_quiet_valleys:0 "Questions About the Quiet Valleys"
 zin_magical_forest_quiet_valleys_desc:0 "The valleys of the Zilin Hills are quiet in a way that the loremasters find curious: no old groves, no wells, no songs, nothing older than the hermitage itself. They ask a few polite questions."
 zin_magical_forest_refusal_remembered:0 "The Refusal Remembered"
 zin_magical_forest_refusal_remembered_desc:0 "The war is over, and the Refusal is remembered as the elves' wisest choice, though they took pains to help the one they could. The loremasters write it all down."
 zin_magical_forest_refusal_remembered_spirit:0 "The Refusal Remembered"
 zin_magical_forest_refusal_remembered_spirit_desc:0 "The Refusal is remembered as the elves' wisest choice, though they helped where they could."
 zin_magical_forest_refusal_stands:0 "The Refusal Stands"
 zin_magical_forest_refusal_stands_desc:0 "The houses vote to keep the Refusal: no elven army will march in the wars of men. They will defend their own woods, help whom they can by other means, and not take up the old banners again."
 zin_magical_forest_refusal_stands_spirit:0 "The Refusal Stands"
 zin_magical_forest_refusal_stands_spirit_desc:0 "No elven army will march in the wars of men; the woods will be defended, and nothing more."
 zin_magical_forest_remember_edrans_folly:0 "Remember Edran's Folly"
 zin_magical_forest_remember_edrans_folly_desc:0 "Men marched to Dardan under King Edran, and the elves who marched with them paid for it. The elders recite the names of the fallen and ask what the world has done to deserve another such army of ours."
 zin_magical_forest_renew_accord:0 "Renew the Accord of 4A 96"
 zin_magical_forest_renew_accord_desc:0 "The old Accord is brought out and read aloud on the Wall, clause by clause. The elves ask the Golden Court to put its seal to it once more, as a sign that nothing has changed and nothing will."
 zin_magical_forest_road_tolls:0 "Tolls on the Pilgrim Roads"
 zin_magical_forest_road_tolls_desc:0 "The houses decide that those who walk the elven roads should pay for the wear. The toll is small, and the pilgrims pay it without complaint, which the elves find more interesting than they say."
 zin_magical_forest_roll_of_houses:0 "The Roll of the Houses"
 zin_magical_forest_roll_of_houses_desc:0 "The loremasters renew the great roll of the houses: every line, every grove, every right and every old debt. It takes a year, and the houses are surprised by how much they have in common."
 zin_magical_forest_roost_wardens:0 "Perlan's Roost Wardens"
 zin_magical_forest_roost_wardens_desc:0 "Perlan, who has lived among the roosts longer than most, is given charge of the wardens. His rangers go armed with horns and herbs, and have never struck a dragon."
 zin_magical_forest_sails_on_rift:0 "Sails on the Rift Sea"
 zin_magical_forest_sails_on_rift_desc:0 "Sails have been sighted on the rift sea: too many, too dark and too well ordered for traders. The beacons are lit from cape to cape, and the horns of the shore-levies answer one another along the coast."
 zin_magical_forest_secret_roosts:0 "The Secret Roosts"
 zin_magical_forest_secret_roosts_desc:0 "The roosts of Dragon Mountain are sealed from every eye but the elves', and the dragons are left in peace. Nothing that was not asked for can enter, and nothing that lives there can be asked to leave."
 zin_magical_forest_seek_the_wizard:0 "Seek the Wizard"
 zin_magical_forest_seek_the_wizard_desc:0 "Letters are written in the old tongue and sent by hand to the places where a wizard might be. The council does not say where it thinks he is, and the messengers are told not to ask."
 zin_magical_forest_shared_songs:0 "Shared Songs of the Kin"
 zin_magical_forest_shared_songs_desc:0 "The kin realms sing the same songs in different dialects, and the loremasters discover that the differences matter less than the tune. The songs are collected, and a few turn out to be wards."
 zin_magical_forest_shared_songs_spirit:0 "Shared Songs of the Kin"
 zin_magical_forest_shared_songs_spirit_desc:0 "The kin realms sing one tune in many dialects."
 zin_magical_forest_shelter_the_bearer:0 "Shelter the Bearer"
 zin_magical_forest_shelter_the_bearer_desc:0 "[zin_loc_eindil] is in the woods, and the elves keep his coming a secret. Rangers watch the paths, the Speakers look the other way and the woods themselves turn travellers aside."
 zin_magical_forest_shore_levies:0 "Levies of the Shore"
 zin_magical_forest_shore_levies_desc:0 "Fishermen, boatmen and shore-farmers are enrolled in a levy and drilled to the beacon-horn. They are not warriors, but they know every stone of the coast."
 zin_magical_forest_songs_for_wyrms:0 "Songs for the Wyrms"
 zin_magical_forest_songs_for_wyrms_desc:0 "The elves sing to the dragons each night at dusk, in a tongue older than their own. The dragons do not answer, but they listen, and the singers say that listening is the answer."
 zin_magical_forest_songs_of_making:0 "Songs of Making"
 zin_magical_forest_songs_of_making_desc:0 "The craft-masters sing as they work, and each song shapes the thing they make. The loremasters write down the songs, and discover that the words matter more than the tune."
 zin_magical_forest_speakers_chair:0 "The First Speaker's Chair"
 zin_magical_forest_speakers_chair_desc:0 "The First Speaker's chair is a living root, grown through the floor of the hall. Whoever sits in it speaks for the houses, and for no house in particular."
 zin_magical_forest_speakers_chair_spirit:0 "The First Speaker's Chair"
 zin_magical_forest_speakers_chair_spirit_desc:0 "A chair grown from a living root, in which the First Speaker hears the houses and speaks for all."
 zin_magical_forest_speakers_of_peace:0 "Speakers of Peace"
 zin_magical_forest_speakers_of_peace_desc:0 "The First Speaker takes the title of Speaker of Peace and receives the envoys of every realm in the root hall. She is courteous to all, and answers to none of them."
 zin_magical_forest_speakers_of_peace_spirit:0 "Speakers of Peace"
 zin_magical_forest_speakers_of_peace_spirit_desc:0 "The First Speaker receives every realm's envoys in the root hall, and favours none."
 zin_magical_forest_stone_in_passes:0 "Stone in the High Passes"
 zin_magical_forest_stone_in_passes_desc:0 "Elven masons, who do not usually build in stone, raise forts in the high passes and pack them with provisions. Nolorim's wardens move into them with an air of cautious pride."
 zin_magical_forest_tales_of_wizard:0 "Tales of the Wizard"
 zin_magical_forest_tales_of_wizard_desc:0 "The elders tell of a wizard who unbound a terrible thing in the Second Age, and of the small purple servant who walked beside him. The tales are old, strange and not entirely flattering."
 zin_magical_forest_temple_in_our_woods:0 "The Temple in Our Woods"
 zin_magical_forest_temple_in_our_woods_desc:0 "The pilgrims go on walking the elven roads, but the houses have begun to see where the roads lead. The council meets to decide what the woods owe to a house that has changed what it is."
 zin_magical_forest_wall_accord:0 "The Accord of the Wall"
 zin_magical_forest_wall_accord_desc:0 "The Accord of 4A 96 drew the Great Wall between the elves and Aenor, and promised that neither would cross it in arms. For seventeen centuries both have kept their word."
 zin_magical_forest_wall_moot:0 "The Wall Moot"
 zin_magical_forest_wall_moot_desc:0 "Once a year the elves and men of the Wall meet at Kingson to bring their complaints before a joint bench. The judges are chosen by lot and the verdicts are, remarkably, accepted."
 zin_magical_forest_wall_traders:0 "Traders of the Wall Roads"
 zin_magical_forest_wall_traders_desc:0 "Elven traders cross the Wall in caravans of mule and wagon, bringing herbs, cloth and carved wood. They have been doing it since the Accord was signed, and they do not intend to stop."
 zin_magical_forest_wall_traders_spirit:0 "Traders of the Wall Roads"
 zin_magical_forest_wall_traders_spirit_desc:0 "Elven caravans cross the Wall with herbs, cloth and carved wood."
 zin_magical_forest_wandering_paths:0 "Paths That Wander"
 zin_magical_forest_wandering_paths_desc:0 "Every path through the woods is turned a little, and every landmark moved. A traveller who walks into the forest will find that it has gently rearranged itself, and that he is somewhere else."
 zin_magical_forest_war_across_rift:0 "Carry the War Across the Rift"
 zin_magical_forest_war_across_rift_desc:0 "The Speakers cannot agree whether the invader should be allowed to return home. The Open Houses say no, and the white sails turn east."
 zin_magical_forest_wardens_for_passes:0 "Wardens for Nolorim's Passes"
 zin_magical_forest_wardens_for_passes_desc:0 "Nolorim holds the high passes between the woods and the eastern ranges, and has never had enough wardens to hold them. The Magical Forest sends rangers, supplies and a few of its best captains."
 zin_magical_forest_wardens_of_woods:0 "Wardens of the Woods"
 zin_magical_forest_wardens_of_woods_desc:0 "The wardens are not an army; they are the woods' memory of how to defend themselves. They are few, skilled and patient, and they know every path."
 zin_magical_forest_wards_against_death:0 "Wards Against Death"
 zin_magical_forest_wards_against_death_desc:0 "The dead are walking, and the elves search the old wards for anything that might hold them. The loremasters work day and night, and have found a few that hold."
 zin_magical_forest_wardsong:0 "The Wardsong"
 zin_magical_forest_wardsong_desc:0 "The wardsong is a chant that marks the boundary of the elves' land, so that any who cross it feel their steps grow heavy. It was nearly forgotten, and the loremasters are glad to have it back."
 zin_magical_forest_watch_from_our_side:0 "Watch From Our Side"
 zin_magical_forest_watch_from_our_side_desc:0 "Elven watchtowers rise on the western slope of the Wall, in plain sight of the men on the other side. They are not meant to threaten, only to say that the elves also keep the line."
 zin_magical_forest_watch_rift_sea:0 "Watch the Rift Sea"
 zin_magical_forest_watch_rift_sea_desc:0 "The rift coast faces the East Lands across the water, and no elf has forgotten that the East has ambitions. Watchers are posted at every cape, and a signal-fire is laid on every headland."
 zin_magical_forest_wellsprings:0 "The Essence Wellsprings"
 zin_magical_forest_wellsprings_desc:0 "Where the old roots cross, a clear spring rises that tastes of light. The elves have always known it was magic; the loremasters now build a stone basin and a still to draw the Essence from it."
 zin_magical_forest_wings_over_woods:0 "Wings Over the Woods"
 zin_magical_forest_wings_over_woods_desc:0 "The council asks the mountain for a dragon to guard the woods, and the mountain, for the first time in an age, grants it. The dragon's shadow falls across the canopy, and the birds fall silent."
 zin_magical_forest_wizard_and_servant:0 "The Wizard and His Servant"
 zin_magical_forest_wizard_and_servant_desc:0 "The wizard has come with [zin_loc_eindil], and with him his small purple servant. They sit by the council fire, and the elders listen with attention, because they have been waiting for this a very long time."
 zin_magical_forest_wizard_falls:0 "When the Wizard Falls"
 zin_magical_forest_wizard_falls_desc:0 "The lanterns in the groves are lit one by one, and the elders sing the long song for the wizard. He was a stranger to the woods, and a friend, and what he did for them is not forgotten."
 zin_magical_forest_wizard_remembered:0 "The Wizard Remembered"
 zin_magical_forest_wizard_remembered_desc:0 "The long song has been sung, and the elves fight a little harder for it."
 zin_magical_forest_woods_endure:0 "The Woods Endure"
 zin_magical_forest_woods_endure_desc:0 "The woods are closed, hidden and watchful, and they will endure whatever comes. The elves say it is only a matter of patience, and they have a great deal of that."
 zin_magical_forest_woods_endure_spirit:0 "The Woods Endure"
 zin_magical_forest_woods_endure_spirit_desc:0 "Closed, hidden and watchful, the woods will endure whatever comes."
 zin_magical_forest_woods_stand:0 "The Woods Stand"
 zin_magical_forest_woods_stand_desc:0 "The invader has gone, and the woods are quiet. The elves bury their dead under the roots, mend what was broken and sing the long song of the defence."
 zin_magical_forest_woods_stand_spirit:0 "The Woods Stand"
 zin_magical_forest_woods_stand_spirit_desc:0 "The invader has gone, the woods are quiet, and the elves have buried their dead under the roots."
 zin_magical_forest_wyrm_songs:0 "Songs for the Wyrms"
 zin_magical_forest_wyrm_songs_desc:0 "The dragons are sung to each night at dusk, and the singers say that listening is the answer."
 zin_magical_forest.1.a:0 "The houses are many; the wood is one."
 zin_magical_forest.1.b:0 "Let the eldest speak first."
 zin_magical_forest.1.d:0 "The speakers of the houses have gathered beneath the council tree, each in the colours of her grove. The oldest speaker rises first and says that there are many houses and one wood, and that the council has been called to remember both."
 zin_magical_forest.1.t:0 "The Council of Houses Sits"
 zin_magical_forest.10.a:0 "Speak to both."
 zin_magical_forest.10.b:0 "Let them quarrel."
 zin_magical_forest.10.d:0 "The loremasters lay out the history of Herrodon and Andos Enda: the river, the grove, the slight at a wedding eight hundred years ago. The quarrel is not dangerous; it is only old and stubborn. The First Speaker asks whether anything should be done."
 zin_magical_forest.10.t:0 "The Old Rivalry"
 zin_magical_forest.11.a:0 "Accept the Forest's arbitration."
 zin_magical_forest.11.b:0 "The groves are ours."
 zin_magical_forest.11.d:0 "The Magical Forest has offered to judge which of the border groves belongs to which realm. The offer is courteous and sincere, and each side suspects that the other will accept. It is proud, and it is tired of arguing."
 zin_magical_forest.11.t:0 "The Boundary Groves"
 zin_magical_forest.13.a:0 "Tend them."
 zin_magical_forest.13.b:0 "Leave them wild."
 zin_magical_forest.13.d:0 "Perlan climbs down from the roosts with ash on his cloak and a short list. He tells the Speakers how many dragons remain on the mountain, how many are young and how many are old, and what the mountain asks in return for its kindness."
 zin_magical_forest.13.t:0 "The Roosts Counted"
 zin_magical_forest.14.a:0 "Let them pass."
 zin_magical_forest.14.b:0 "Let them pass, and watch."
 zin_magical_forest.14.d:0 "Pilgrims from every court walk the elven roads to the hermitage in the Zilin Hills. They sleep in the elves' groves and drink from the elves' wells, and the wardens who watch them have begun to ask what they are looking for."
 zin_magical_forest.14.t:0 "Pilgrims on the Elven Roads"
 zin_magical_forest.15.a:0 "Keep watching."
 zin_magical_forest.15.b:0 "Pilgrims are pilgrims."
 zin_magical_forest.15.d:0 "The loremasters have studied the valleys of the Zilin Hills and noted that the hermitage keeps no grove, no well and no song older than its founding. They find it curious, not alarming, and they ask the council whether to keep looking."
 zin_magical_forest.15.t:0 "Questions About the Quiet Valleys"
 zin_magical_forest.16.a:0 "Close every road."
 zin_magical_forest.16.b:0 "They shall leave the hills."
 zin_magical_forest.16.d:0 "The truth is out. The name of the power behind the hermitage is spoken openly in Parim, and the pilgrims who walked the elven roads were walking to the house of Afrit. The houses must decide whether to close every road or to cast the temple out of the hills."
 zin_magical_forest.16.t:0 "The Temple in Our Woods"
 zin_magical_forest.17.a:0 "Remember them."
 zin_magical_forest.17.d:0 "On the long night of the year the elders tell of the wizard of the Unbinding, and of the small purple servant who walked at his side. The young listen with open mouths. The elders do not say where the wizard has gone, because they do not know."
 zin_magical_forest.17.t:0 "Tales of the Wizard"
 zin_magical_forest.18.a:0 "Light the beacons."
 zin_magical_forest.18.b:0 "Merchants' talk."
 zin_magical_forest.18.d:0 "Merchants from the East Lands talk of rich lands and weak kings, with a candour that is slightly too casual. The harbour wardens note the number of ships, the number of men aboard each and the amount of coin that has been spent on nothing in particular."
 zin_magical_forest.18.t:0 "Merchants Across the Rift"
 zin_magical_forest.19.a:0 "Let the houses decide."
 zin_magical_forest.19.d:0 "The council has met in the root hall for three days to debate the Refusal. The kinship of the realms, the heat of the old rivalry, the grievance at the Wall and the shadow over the world have all been set before it. The First Speaker asks the houses to decide."
 zin_magical_forest.19.t:0 "The Question of the Refusal"
 zin_magical_forest.2.a:0 "The Old Houses stand for the seat."
 zin_magical_forest.2.b:0 "The Open Houses stand."
 zin_magical_forest.2.d:0 "The houses have begun the election of the First Speaker. The Old Houses stand for a seat that will keep the woods apart from the world; the Open Houses stand for one that will keep the roads open. The ballots will be cast over a month, and the whole forest is listening."
 zin_magical_forest.2.t:0 "The Long Election"
 zin_magical_forest.20.a:0 "Sign the new Accord."
 zin_magical_forest.20.b:0 "Later."
 zin_magical_forest.20.d:0 "The elves have sent a new Accord to Parim, written by both sides together after the long war. It replaces the old line of stone with something a little warmer, and asks that the two peoples read it aloud once a year."
 zin_magical_forest.20.t:0 "A New Accord at the Wall"
 zin_magical_forest.21.a:0 "For this war only."
 zin_magical_forest.21.d:0 "The houses have voted, and the Refusal is set aside. The elders speak of it as a sword laid in its sheath, not a sword broken. The First Speaker says that the elves go to this war because the world demands it, and for no other cause."
 zin_magical_forest.21.t:0 "The Houses Set the Refusal Aside"
 zin_magical_forest.22.a:0 "March with the Forest."
 zin_magical_forest.22.b:0 "We defend our own woods."
 zin_magical_forest.22.d:0 "A speaker of the Magical Forest has come to the kin realm in the green cloak of the Kindred, with a request that it march. The speaker does not demand, and does not plead; she says that the Forest is marching, and asks whether the kin will walk beside it."
 zin_magical_forest.22.t:0 "The Kin Are Asked to March"
 zin_magical_forest.23.a:0 "Open the gates."
 zin_magical_forest.23.b:0 "No elven host crosses the Wall."
 zin_magical_forest.23.d:0 "An elven host stands before the Wall in good order, under green banners, and asks for leave to cross as friends. It will not enter without permission, and it will not wait for ever. The Golden Court has not seen an elven army in seventeen hundred years."
 zin_magical_forest.23.t:0 "An Elven Host at the Wall"
 zin_magical_forest.24.a:0 "This time we ask nothing."
 zin_magical_forest.24.d:0 "The houses remember Dardan and Edran's folly together, and decide to be remembered differently this time. The elves have come to the war with open hands, and they ask nothing at its end."
 zin_magical_forest.24.t:0 "The Grand Alliance Remembered"
 zin_magical_forest.4.a:0 "A line of stone, not of war."
 zin_magical_forest.4.b:0 "The kings' toll grows heavier each year."
 zin_magical_forest.4.d:0 "The Accord of 4A 96 is read aloud in the root hall, as it is each year. It speaks of a line of stone, not of war, and of an age when elves and men could see each other across it. Some listeners think the line has grown thicker with time."
 zin_magical_forest.4.t:0 "The Accord of the Wall"
 zin_magical_forest.5.a:0 "Ease the tolls."
 zin_magical_forest.5.b:0 "The tolls stand."
 zin_magical_forest.5.d:0 "Envoys of the Magical Forest have come to Parim with a table of the tolls their merchants have paid at the Wall, and a request to ease them. They are courteous, precise and in no hurry. The treasurer of the Golden Court looks at the table, and then at the envoys."
 zin_magical_forest.5.t:0 "Elven Envoys on the Tolls"
 zin_magical_forest.6.a:0 "Grant fair tolls."
 zin_magical_forest.6.b:0 "The crown sets its tolls."
 zin_magical_forest.6.d:0 "A second letter has come from the elves, shorter than the first and just as polite. It asks the Golden Court to set fair tolls at the Wall gates and to publish them. The court must decide whether to grant a favour or to teach the elves a lesson."
 zin_magical_forest.6.t:0 "Fair Tolls at the Wall"
 zin_magical_forest.7.a:0 "Renew it."
 zin_magical_forest.7.b:0 "Not this year."
 zin_magical_forest.7.d:0 "The elves have sent the old Accord to Parim, with a request that the Golden Court put its seal to it once more. The document is seventeen centuries old, and its seal has faded to a faint blue. The treasurer asks whether it is worth renewing."
 zin_magical_forest.7.t:0 "Renewal of the Wall Accord"
