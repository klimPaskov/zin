l_english:
 zin_regional_avalon_an_example_to_the_east:0 "An Example to the East"
 zin_regional_avalon_an_example_to_the_east_desc:0 "Envoys from the surrounding courts come to see how a commonwealth keeps its wells in the hands of its people. The tribunes show them the cisterns and the storehouse."
 zin_regional_avalon_citizen_levies:0 "Townsmen's Levies"
 zin_regional_avalon_citizen_levies_desc:0 "Every householder is liable for a spear and a month's service, and every town has a muster-ground. The levies are poor soldiers and stubborn ones."
 zin_regional_avalon_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_avalon_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_avalon_close_the_houses:0 "Close the Houses"
 zin_regional_avalon_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_avalon_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_avalon_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_avalon_eastern_oath:0 "Oath to the King in the East"
 zin_regional_avalon_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_avalon_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_avalon_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_avalon_forts_of_the_republic:0 "Forts of the Commonwealth"
 zin_regional_avalon_forts_of_the_republic_desc:0 "Low red-stone forts are raised at the river fords and the hill passes. They are plain and thick, and the militia can man them in an hour."
 zin_regional_avalon_free_among_kings:0 "Free Among Kings"
 zin_regional_avalon_free_among_kings_desc:0 "Kings around the Red Lands wait for the commonwealth to fail, and the tribunes know it. The council resolves to owe no one and to answer every letter."
 zin_regional_avalon_free_crown_court:0 "A Free Crown"
 zin_regional_avalon_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_avalon_generous_friends:0 "The Generous Friends"
 zin_regional_avalon_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_avalon_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_avalon_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_avalon_healing_houses:0 "Houses of Healing"
 zin_regional_avalon_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_avalon_houses_of_healing:0 "Houses of Healing"
 zin_regional_avalon_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_avalon_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_avalon_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_avalon_lessons_of_the_red_wells:0 "Lessons of the Red Wells"
 zin_regional_avalon_levies_for_the_host:0 "Levies for the Host"
 zin_regional_avalon_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_avalon_neighbours_in_oreton:0 "Neighbours in Oreton"
 zin_regional_avalon_neighbours_in_oreton_desc:0 "Oreton lies across the southern hills, a small court with a long border and a longer memory. A pact of friendly neighbours is offered and accepted over a shared jar of wine."
 zin_regional_avalon_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_avalon_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_avalon_owe_no_prince:0 "Owe No Prince"
 zin_regional_avalon_owe_no_prince_desc:0 "The tribunes write the pledge on a bronze plate: no loan from a crown, no tribute to a throne. The commonwealth is poorer for it and freer by every year."
 zin_regional_avalon_own_counsel:0 "Our Own Counsel"
 zin_regional_avalon_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_avalon_pikes_and_bows:0 "Pikes and Bows"
 zin_regional_avalon_pikes_and_bows_desc:0 "The militia drills with pikes and short bows, the arms of men who cannot afford a knight's horse. Bowmakers set up in the market squares."
 zin_regional_avalon_quarries_of_red_stone:0 "Quarries of Red Stone"
 zin_regional_avalon_quarries_of_red_stone_desc:0 "Red sandstone is cut in the hills and floated to the towns on barges. The tribunes' hall is built of it, and so is half the commonwealth's pride."
 zin_regional_avalon_question_of_the_east:0 "The Question of the East"
 zin_regional_avalon_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_avalon_red_banners:0 "The Red Banners"
 zin_regional_avalon_red_banners_desc:0 "The rising's banners hang in the tribunes' hall, faded from crimson to rust. Each year they are carried through the streets, and each year they are carried a little more proudly."
 zin_regional_avalon_red_earth:0 "Red Earth Farms"
 zin_regional_avalon_red_earth_desc:0 "The red soil is poor in the dry months and rich after the rains, and its farmers have learned to ride both. A farm of red earth feeds more mouths than a farm of grey."
 zin_regional_avalon_red_earth_farms:0 "Red Earth Farms"
 zin_regional_avalon_red_earth_farms_desc:0 "Farmers learn to sow when the rains come and plough when they leave, and each household stores seed against a bad year. Every field has its name carved on a stone."
 zin_regional_avalon_red_militia:0 "The Militia of the Red Lands"
 zin_regional_avalon_red_militia_desc:0 "Every household keeps a spear, a shield and a place in a militia company. They drill at the town gate on market days, between the cheese and the cloth."
 zin_regional_avalon_republic_stands:0 "The Commonwealth Stands"
 zin_regional_avalon_republic_stands_desc:0 "Kings waited for the commonwealth to fail, and it has not. Its towns are proud of that, and a little stubborn about it."
 zin_regional_avalon_salt_of_the_red_lands:0 "Salt of the Red Lands"
 zin_regional_avalon_salt_of_the_red_lands_desc:0 "Salt-pans on the dry lakes yield grey crystals that are packed in clay jars and sold by the load. A dry summer is a good one."
 zin_regional_avalon_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_avalon_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_avalon_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_avalon_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_avalon_the_bankers_at_the_door:0 "The Bankers at the Door"
 zin_regional_avalon_the_bankers_at_the_door_desc:0 "Postondoroth's agents arrive with a chest of silver and a pleasant offer. The tribunes know what the silver costs and what it buys, and take time to weigh both."
 zin_regional_avalon_the_citizens_assembly:0 "The Townsmen's Assembly"
 zin_regional_avalon_the_citizens_assembly_desc:0 "Every householder of the three states may vote in the assembly, and tribunes are chosen from the benches by lot and by show of hands. The assembly is loud and slow."
 zin_regional_avalon_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_avalon_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_avalon_the_dye_works:0 "The Dye Works"
 zin_regional_avalon_the_dye_works_desc:0 "Madder, ochre and a rare red clay are ground, boiled and set in vats beside the river. The cloth of Avalon is sold across the south in every shade of rust."
 zin_regional_avalon_the_first_tribune:0 "The First Tribune"
 zin_regional_avalon_the_first_tribune_desc:0 "A single tribune is made first among the others, with a seal and a guard. The old men of the towns warn that this is how kings begin."
 zin_regional_avalon_the_free_charter:0 "The Free Charter"
 zin_regional_avalon_the_free_charter_desc:0 "The charter is read aloud at every crossroads, and every landholder swears to keep it. No one rules for longer than a year, and no one rules alone."
 zin_regional_avalon_the_militia_of_the_red_lands:0 "The Militia of the Red Lands"
 zin_regional_avalon_the_militia_of_the_red_lands_desc:0 "The militia drills on market days at the town gate, in red caps and rough boots. A man who misses three drills pays a fine in grain."
 zin_regional_avalon_the_red_banners_endure:0 "The Red Banners Endure"
 zin_regional_avalon_the_red_banners_endure_desc:0 "The faded banners are hung in the new tribunes' hall, and the oath is sworn beneath them. Whatever else changes, the towns will remember what they are."
 zin_regional_avalon_the_red_lands:0 "The Red Lands"
 zin_regional_avalon_the_red_lands_desc:0 "Red hills, red rivers and red clay roofs: the three states are as bright as a ripe pomegranate. The tribunes send surveyors to count every field and every well."
 zin_regional_avalon_the_red_road:0 "The Red Road"
 zin_regional_avalon_the_red_road_desc:0 "A road of packed red clay joins the three towns, ditched on both sides and lined with milestones. Wagons that once took a week now take three days."
 zin_regional_avalon_the_republic_stands:0 "The Commonwealth Stands"
 zin_regional_avalon_the_republic_stands_desc:0 "Five years pass, then ten, and the commonwealth is still free. Its towns keep the walls mended and the banners clean."
 zin_regional_avalon_the_republics_captains:0 "The Commonwealth's Captains"
 zin_regional_avalon_the_republics_captains_desc:0 "Captains are chosen by the militia companies and confirmed by the tribunes. They serve for a year and are obeyed for that year."
 zin_regional_avalon_the_tribunes_charter:0 "The Tribunes' Charter"
 zin_regional_avalon_the_tribunes_charter_desc:0 "The charter binds every tribune to the wells, the walls and the common storehouse. Kings call it the Red Charter, and say it will not last."
 zin_regional_avalon_the_tribunes_republic:0 "The Tribunes' Commonwealth"
 zin_regional_avalon_the_tribunes_republic_desc:0 "In 4A 1719 the towns of the Red Lands rose against a king who had sold their wells to his creditors, and set up the rule of elected tribunes. Tribune Arcon Vel is its first magistrate."
 zin_regional_avalon_tribunes_charter:0 "The Tribunes' Charter"
 zin_regional_avalon_tribunes_charter_desc:0 "The charter was written in a single night by the leaders of the rising and has been amended once since. Every tribune swears to it on red earth, and every child can recite its first article."
 zin_regional_avalon_wait_upon_events:0 "Wait Upon Events"
 zin_regional_avalon_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_avalon_watch_the_quays:0 "Watch the Quays"
 zin_regional_avalon_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_avalon_watchful_quays:0 "Watchful Quays"
 zin_regional_avalon_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_avalon_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_avalon_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_avalon_when_the_king_falls:0 "When the King Falls"
 zin_regional_avalon_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_avalon.1.a:0 "A feast for every street"
 zin_regional_avalon.1.b:0 "A march of the militia"
 zin_regional_avalon.1.d:0 "The towns keep the day they set up the commonwealth, with banners in every window and a bonfire on every hill. The tribunes ask how the day should be kept this year."
 zin_regional_avalon.1.t:0 "The Day of the Red Banners"
 zin_regional_avalon.2.a:0 "Teach them nothing"
 zin_regional_avalon.2.b:0 "Teach them"
 zin_regional_avalon.2.d:0 "Envoys from a neighbouring court ask how a commonwealth keeps its wells in the hands of its people. The tribunes look at one another, and then at the envoys' purses."
 zin_regional_avalon.2.t:0 "An Example to the East"
