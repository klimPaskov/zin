l_english:
 zin_econ_cold_lands:0 "The Long Winters"
 zin_econ_cold_lands_desc:0 "The cold has made the folk hard and every building slow to raise."
 zin_econ_crown_debts:0 "Crown Debts"
 zin_econ_crown_debts_desc:0 "The treasury is bare and the creditors are at the gate."
 zin_econ_dark_lands:0 "Forge-Pits"
 zin_econ_dark_lands_desc:0 "The orc holds burn day and night, and the smiths ask few questions about the folk's needs."
 zin_econ_east_lands:0 "The Caravan Roads"
 zin_econ_east_lands_desc:0 "Caravans carry the gold of the East to every court that will pay."
 zin_econ_ember_lands:0 "Furnace Lands"
 zin_econ_ember_lands_desc:0 "The Ember Lands are hot and storm-girt, and their war-forges never go cold."
 zin_econ_full_granaries:0 "Full Granaries"
 zin_econ_full_granaries_desc:0 "The King's stores are full to the roof, and the builders work without fear of a hard year."
 zin_econ_islands_of_the_south:0 "Hospitable Isles"
 zin_econ_islands_of_the_south_desc:0 "Poor in goods and rich in welcome, the isles keep a gentle peace."
 zin_econ_lands_of_the_sun:0 "Sun-Blessed Fields"
 zin_econ_lands_of_the_sun_desc:0 "The fields of the Sunhot elves are ripe all year, and no one goes hungry."
 zin_econ_lean_harvest:0 "A Lean Year"
 zin_econ_lean_harvest_desc:0 "The harvest was thin, and the folk have tightened their belts."
 zin_econ_magical_lands:0 "Elder Groves"
 zin_econ_magical_lands_desc:0 "Old lore lives in the groves, and craft and study go hand in hand."
 zin_econ_middle_lands:0 "The Great Lake Markets"
 zin_econ_middle_lands_desc:0 "Ships and carts from every shore meet at the Great Lake, and its guilds work in good order."
 zin_econ_new_hall:0 "The King's New Hall"
 zin_econ_new_hall_desc:0 "A new hall in the Golden Court gives the courtiers something to admire."
 zin_econ_north_lands:0 "Northern Shipwrights"
 zin_econ_north_lands_desc:0 "The yards of the strait are old, and their masters know every plank of a hull."
 zin_econ_tariff_paid:0 "Western Tariffs Paid"
 zin_econ_tariff_paid_desc:0 "The realm has paid the tariffs of the West, and its workshops make more for the folk to cover them."
 zin_econ_tritons_islands:0 "Charts of the Pupor Ocean"
 zin_econ_tritons_islands_desc:0 "The islanders keep the oldest sea charts, and their fleets read the water well."
 zin_econ_triumph:0 "The Triumph"
 zin_econ_triumph_desc:0 "A great procession through Parim has lifted the people's hearts for a season."
 zin_econ_west_lands:0 "Western Freeholds"
 zin_econ_west_lands_desc:0 "Free farmers and horse-breeders trade easily and send many sons to the muster."
 zin_interim_landmark:0 "Standing Monument"
 zin_interim_landmark_desc:0 "A monument that stands in no state until Aoaz's own landmarks, such as the Golden Court and the gate at Kingson, are raised."
 zin_interim_landmark_plural:0 "Standing Monument"
 zin_opinion_aenoran_gold:0 "Aenoran Gold"
