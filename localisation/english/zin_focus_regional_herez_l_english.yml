l_english:
 zin_regional_herez_a_league_of_the_south:0 "A League of the South"
 zin_regional_herez_a_league_of_the_south_desc:0 "A seceded Herez throws its lot in with Mirolon's Warden League. The marches have always had more in common with the south than with the lake."
 zin_regional_herez_a_march_of_plenty:0 "A March of Plenty"
 zin_regional_herez_a_march_of_plenty_desc:0 "Granary, smithy and market-hall rise side by side in the march's chief town. Herez has never been rich, but it is no longer poor."
 zin_regional_herez_call_the_concord:0 "Call the Concord"
 zin_regional_herez_call_the_concord_desc:0 "Herez sends riders to every dominion with the same message: the south is moving and the marches cannot hold alone. Some will answer, and some will wait to see who wins."
 zin_regional_herez_concord_shield_south:0 "The Southern Shield"
 zin_regional_herez_concord_shield_south_desc:0 "Herez is named the Southern Shield of the Concord, and means to deserve it."
 zin_regional_herez_eastern_forts_spirit:0 "The Raiders' Forts"
 zin_regional_herez_eastern_forts_spirit_desc:0 "Stone forts on the downs that the eastern occupiers built, garrisoned again by the marches."
 zin_regional_herez_forts_of_the_marches:0 "Forts of the Marches"
 zin_regional_herez_forts_of_the_marches_desc:0 "The towers are linked by curtain walls, and the passes between them are narrowed to a single gate. A host that comes this way will have to queue."
 zin_regional_herez_friends_across_the_border:0 "Friends Across the Border"
 zin_regional_herez_friends_across_the_border_desc:0 "Mirolon's envoys pass through Herez on the way to Parim and back, laughed at at every stop but the marcher lords'. Herez sends its own envoy south, with gifts and good wine."
 zin_regional_herez_hear_the_mirolonese:0 "Hear the Mirolonese"
 zin_regional_herez_hear_the_mirolonese_desc:0 "The marcher lords sit through Mirolon's long warnings without once checking the hour. They do not pretend to believe everything, and they do not pretend to believe nothing."
 zin_regional_herez_hill_companies:0 "Hill Companies"
 zin_regional_herez_hill_companies_desc:0 "The marcher lords raise companies from the hill farms, men who know the passes by smell and the weather by the ache in their knees."
 zin_regional_herez_hold_every_ford:0 "Hold Every Ford"
 zin_regional_herez_hold_every_ford_desc:0 "Every river crossing is trenched, staked and manned. If the host is to come north, it will come wet and slowly."
 zin_regional_herez_houses_on_the_march:0 "Houses on the March"
 zin_regional_herez_houses_on_the_march_desc:0 "The Houses of the First Light send almoners south to the marches, with grain, linen and hospitals. The marcher lords cannot decide whether to be grateful or wary."
 zin_regional_herez_march_wardens:0 "March Wardens"
 zin_regional_herez_march_wardens_desc:0 "Wardens are posted in the old towers and paid, for once, in coin and not in promises. The marcher lords have been asking for it for four generations."
 zin_regional_herez_march_with_the_heir:0 "March with the Heir"
 zin_regional_herez_march_with_the_heir_desc:0 "The Heir has returned, and the marcher lords ride to meet him. They were the first to hear the warnings, and they intend to be among the last to stop."
 zin_regional_herez_marcher_levy:0 "The Marcher Levy"
 zin_regional_herez_marcher_levy_desc:0 "Spears drilled each autumn on the common, and a roll that is for once accurate."
 zin_regional_herez_marcher_lords:0 "The Marcher Lords"
 zin_regional_herez_marcher_lords_2:0 "The Lords' Council"
 zin_regional_herez_marcher_lords_2_desc:0 "A standing council of the marcher lords decides before the dinner is cold."
 zin_regional_herez_marcher_lords_desc:0 "The lords of the marches hold their castles by ancient right and their opinions by habit."
 zin_regional_herez_marcher_resistance:0 "The Marches in the Dark"
 zin_regional_herez_marcher_resistance_desc:0 "The enemy holds the towers but not the hills."
 zin_regional_herez_marcher_smiths:0 "Marcher Smiths"
 zin_regional_herez_marcher_smiths_desc:0 "Smiths who once mended ploughs now beat spearheads. They like the work better and the pay much better."
 zin_regional_herez_marcher_watch:0 "The Marcher Watch"
 zin_regional_herez_marcher_watch_2:0 "Watch on the Storm Wall"
 zin_regional_herez_marcher_watch_2_desc:0 "A night-and-day watch on the dust-dark horizon of the south."
 zin_regional_herez_marcher_watch_desc:0 "Towers that have watched an empty road for centuries are manned again."
 zin_regional_herez_marcher_welcome:0 "Welcome of the Marcher Lords"
 zin_regional_herez_marches_in_the_dark:0 "The Marches in the Dark"
 zin_regional_herez_marches_in_the_dark_desc:0 "The enemy holds the towers, but not the hills. The marcher lords go into the dark with their bows and their long patience, and take back one night at a time."
 zin_regional_herez_petition_for_shields:0 "Petition for Shields"
 zin_regional_herez_petition_for_shields_desc:0 "Herez petitions Parim for a Shield Charter, the old guarantee of garrisons and arms to the dominions of the border. The Golden Court has not yet decided what it thinks of such a thing."
 zin_regional_herez_scouts_beyond_the_border:0 "Scouts Beyond the Border"
 zin_regional_herez_scouts_beyond_the_border_desc:0 "Scouts ride south beyond the border posts, further than any patrol has gone in living memory. They return with dust on their boots and a story that no one in Parim wants to hear."
 zin_regional_herez_shelter_for_mirolon:0 "Shelter for Mirolon"
 zin_regional_herez_shelter_for_mirolon_desc:0 "The marcher lords open their halls to Mirolon's exiled court, should it ever need them. A bed, a roof and a guarded pass are prepared in advance, and the preparation is not discussed."
 zin_regional_herez_shield_of_the_south:0 "Shield of the South"
 zin_regional_herez_shield_of_the_south_desc:0 "Herez takes its old pride in being the Concord's shield. The title is a burden, and the marcher lords have decided to carry it in earnest."
 zin_regional_herez_southern_pastures:0 "Southern Pastures"
 zin_regional_herez_southern_pastures_desc:0 "The southern pastures are walled, cleared of stone and seeded with hardy grass. Herez is poor in gold and rich in horses, and means to stay so."
 zin_regional_herez_southern_shield_of_the_concord:0 "The Southern Shield of the Concord"
 zin_regional_herez_southern_shield_of_the_concord_desc:0 "Herez is named, in the Concord Council's roll, the Southern Shield of the Concord. It is a title of honour, and the marcher lords have decided to deserve it."
 zin_regional_herez_stand_with_the_lost_cause:0 "Stand with the Lost Cause"
 zin_regional_herez_stand_with_the_lost_cause_desc:0 "Herez commits its marcher lords to the Golden King's Lost Cause. The league is more a promise than an army, and the marcher lords mean to make the promise real."
 zin_regional_herez_storm_from_the_south:0 "The Storm from the South"
 zin_regional_herez_storm_from_the_south_desc:0 "The host is marching north, and the marches have waited twelve generations for it."
 zin_regional_herez_the_eastern_forts:0 "The Eastern Forts"
 zin_regional_herez_the_eastern_forts_desc:0 "On the downs stand stone forts that the eastern raiders built when they held the march, and every grandfather told his grandsons never to sleep in them. The wardens clear out the owls and put garrisons in, grandfathers or no."
 zin_regional_herez_the_iron_road_south:0 "The Iron Road South"
 zin_regional_herez_the_iron_road_south_desc:0 "A paved road is cut south toward the iron-bearing hills, and a smelter is raised at its head. The ore is poor, but the hills are close."
 zin_regional_herez_the_kings_garrison:0 "Ask for the King's Garrison"
 zin_regional_herez_the_kings_garrison_desc:0 "Herez writes to Parim to request a garrison from the Golden King. If the answer is yes, the marches are safe. If it is no, then at least the marcher lords will know where they stand."
 zin_regional_herez_the_lords_council:0 "The Lords' Council"
 zin_regional_herez_the_lords_council_desc:0 "The marcher lords agree to sit in permanent council, with a seat each and a rotating chair. For the first time in memory, they decide something before the dinner is cold."
 zin_regional_herez_the_march_charter:0 "The March Charter"
 zin_regional_herez_the_march_charter_desc:0 "The charter that made Herez a dominion of the Concord is read aloud at midsummer. The marcher lords listen, nod and wonder what it will say when it is tested."
 zin_regional_herez_the_marcher_levy:0 "The Marcher Levy"
 zin_regional_herez_the_marcher_levy_desc:0 "Every holding of the marches owes the lord a levy of spears, drilled each autumn on the common. The roll is long and, for once, accurate."
 zin_regional_herez_the_marcher_lords:0 "The Marcher Lords"
 zin_regional_herez_the_marcher_lords_desc:0 "The marcher lords hold their castles by ancient right and their opinions by habit. They meet at midsummer, argue until midnight and ride home united."
 zin_regional_herez_the_marches_pact:0 "The Southern Marches Pact"
 zin_regional_herez_the_marches_pact_desc:0 "Herez and Mirolon exchange oaths on the border stone: neither shall stand by while the other burns. The oath is brief, and its witnesses are few."
 zin_regional_herez_the_marches_restored:0 "The Marches Restored"
 zin_regional_herez_the_marches_restored_desc:0 "The south is quiet and the marches are theirs again. The marcher lords walk their old towers, count the cost and begin, patiently, to rebuild."
 zin_regional_herez_the_southern_front:0 "The Front of the Marches"
 zin_regional_herez_the_southern_front_desc:0 "Herez becomes the southern front of the Middle Lands, and the marcher lords the captains of it. Their castles are supply depots, their fields are muster-grounds and their wells are shared."
 zin_regional_herez_the_southern_marches:0 "The Southern Marches"
 zin_regional_herez_the_southern_marches_desc:0 "Herez holds the southern marches of the Concord, where the Middle Lands fall away toward the heat of the Ember Lands. Its towers have watched an empty road for centuries."
 zin_regional_herez_the_storm_breaks:0 "The Storm Breaks"
 zin_regional_herez_the_storm_breaks_desc:0 "The dust on the horizon is a host, and it is marching north. The marcher lords have waited twelve generations for this day, and they do not hesitate."
 zin_regional_herez_the_storm_wall_watch:0 "Watch on the Storm Wall"
 zin_regional_herez_the_storm_wall_watch_desc:0 "The marcher lords keep a night-and-day watch on the dust-dark horizon of the south, where the sky is sometimes the colour of old iron. They have no name for what they are watching for."
 zin_regional_herez.1.a:0 "Build another tower."
 zin_regional_herez.1.b:0 "Tell Parim."
 zin_regional_herez.1.c:0 "Tell Mirolon."
 zin_regional_herez.1.d:0 "The scouts return from the south with dust in their hair and the same story, told by every one of them: columns of dust on the southern road, day after day, from no direction that could be explained. Herez must decide who should hear of it first."
 zin_regional_herez.1.t:0 "What the Scouts Found"
 zin_regional_herez.2.a:0 "Herez answers to Parim."
 zin_regional_herez.2.b:0 "Welcome the marcher lords."
 zin_regional_herez.2.d:0 "A party of the marcher lords of Herez has come to the court of Mirolon, in their best mail, with gifts and the sort of plain courtesy that Mirolon has not met in Parim. They ask only to be heard."
 zin_regional_herez.2.t:0 "Greetings from Herez"
 zin_regional_herez.3.a:0 "Listen."
 zin_regional_herez.3.b:0 "Laugh, as in 4A 1736."
 zin_regional_herez.3.d:0 "The marcher lords of Herez have sent a warning to Parim: dust on the southern road, scouts beyond the border and an old tale that a certain dead king is not so dead. The court has heard such warnings before, in 4A 1736."
 zin_regional_herez.3.t:0 "Herez Warns Parim"
 zin_regional_herez.4.a:0 "The marches feed their own."
 zin_regional_herez.4.b:0 "Give them a hall."
 zin_regional_herez.4.d:0 "The Deliverer's almoners have come to Herez with grain, linen and a plan for a hospital, and ask the marcher lords for a hall to hold it in. The offer is generous and the almoners are tireless."
 zin_regional_herez.4.t:0 "The Almoners Come South"
 zin_regional_herez.5.a:0 "Send arms."
 zin_regional_herez.5.b:0 "The south is quiet."
 zin_regional_herez.5.d:0 "A message from Herez asks the Golden King for a garrison on the southern border. The court is asked to find men and arms for a danger that most of its members believe is a legend."
 zin_regional_herez.5.t:0 "Herez Asks for a Garrison"
