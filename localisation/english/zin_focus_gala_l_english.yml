l_english:
 zin_gala_armour_and_sword:0 "Armour and Sword"
 zin_gala_armour_and_sword_desc:0 "Gala's smiths forge a suit of silvered mail and a long grey blade for the stranger. They work in silence, and the work takes all night."
 zin_gala_arms_of_gala:0 "Arms of Gala"
 zin_gala_arms_of_gala_desc:0 "Slender spears with leaf-shaped heads, silvered mail and bows of white yew. The smiths of Gala make little, and make it well."
 zin_gala_bearer_of_glo:0 "Word From the North"
 zin_gala_bearer_of_glo_desc:0 "Sailors returning from the north say the stranger lives and carries a light out of the cold. Gala keeps the news to itself, for now."
 zin_gala_care_for_aoaz:0 "Care for All Aoaz"
 zin_gala_care_for_aoaz_desc:0 "Lorien has said he still cares for the fate of Aoaz, though his people will not march for it. In a darkening time he is not alone in this."
 zin_gala_carry_it_to_gala:0 "Carry It to Gala"
 zin_gala_carry_it_to_gala_desc:0 "\"Carry it to Gala\" has become a saying in the south: whatever you cannot understand, take it to the old king. The scholars arrive with their puzzles in satchels."
 zin_gala_court_archers:0 "Archers of the King's Court"
 zin_gala_court_archers_desc:0 "The King's archers are chosen for patience as much as aim. They stand quietly in the colonnades, and no one passes unseen."
 zin_gala_courteous_distance:0 "A Courteous Distance"
 zin_gala_courteous_distance_desc:0 "Gala thanks the priests for their offer and politely declines it. The harbour is open to all, but the healing house will not be built."
 zin_gala_courtyard_of_rain:0 "The Courtyard of Rain"
 zin_gala_courtyard_of_rain_desc:0 "Tall silver trees are planted round the courtyard to keep the wind from the water, and benches are set for those who wait their turn to look."
 zin_gala_crew_of_many_peoples:0 "A Crew of Many Peoples"
 zin_gala_crew_of_many_peoples_desc:0 "Western friends, island navigators and Gala elves sign on for a voyage none of them can name the end of. They are an odd crew, and a good one."
 zin_gala_eldest_court:0 "The Eldest Court"
 zin_gala_eldest_court_desc:0 "Gala's court has met in the same halls since before the kings of men learned to read. Its customs are older than the realms around it, and it wears them lightly."
 zin_gala_eldest_court_spirit:0 "The Eldest Court"
 zin_gala_eldest_court_spirit_desc:0 "Gala's court keeps customs older than most realms, and wears them as lightly as a robe."
 zin_gala_elven_hulls:0 "Elven Hulls"
 zin_gala_elven_hulls_desc:0 "Hull-planks are steamed and bent in the elven manner, joined without nails. They are lighter than the ships of men, quicker and quiet on the water."
 zin_gala_envoys_lands_of_light:0 "Envoys to the Lands of Light"
 zin_gala_envoys_lands_of_light_desc:0 "A delegation travels south to the largest of the Sunhot realms with a gift of silver wood and a letter in Lorien's own hand."
 zin_gala_first_men_records:0 "Records of the First Men"
 zin_gala_first_men_records_desc:0 "Scrolls of the First Men, stronger and longer-lived than their heirs, are copied by Gala's scribes. Most are about ordinary things: harvests, quarrels, the names of roads."
 zin_gala_fleet_of_sun:0 "The Fleet of the Sun"
 zin_gala_fleet_of_sun_desc:0 "A small, swift fleet of white ships patrols the Sea of Gods. It has never fired a shot in anger, and every captain in it prays that this remains true."
 zin_gala_fleet_of_sun_spirit:0 "The Fleet of the Sun"
 zin_gala_fleet_of_sun_spirit_desc:0 "White ships on the Sea of Gods, well drilled and ready, which no one in Gala expects to use."
 zin_gala_for_all_the_living:0 "For All the Living"
 zin_gala_for_all_the_living_desc:0 "The old lords are told what is coming and invited to ride. Lorien does not say that he expects to return."
 zin_gala_friends_not_allies:0 "Friends Without Oaths"
 zin_gala_friends_not_allies_desc:0 "Gala will send help, but not armies: healers, loremasters, a little counsel. The Wanderers who leave the court carry the king's good name with them."
 zin_gala_gala_endures:0 "Gala Endures"
 zin_gala_gala_endures_desc:0 "A steward is chosen, the walls are manned and the court goes on. Gala was ancient before Lorien took its crown, and it will be ancient after."
 zin_gala_gala_endures_spirit:0 "Gala Endures"
 zin_gala_gala_endures_spirit_desc:0 "The court is older than its last king and will outlast him. The walls hold, the Mirror answers, the bells are rung at noon."
 zin_gala_guard_courtyard:0 "Guard the Courtyard of Rain"
 zin_gala_guard_courtyard_desc:0 "A ring of guards stands day and night about the Mirror. They watch the water, and they watch whoever looks into it."
 zin_gala_guest_at_noon:0 "A Guest at the Noon Council"
 zin_gala_guest_at_noon_desc:0 "The Sunhot realms meet at noon each season under the presidency of the Lands of Light. Gala is asked to attend as a guest, to speak but not to vote."
 zin_gala_harbour_wardens:0 "Harbour Wardens"
 zin_gala_harbour_wardens_desc:0 "The harbour is watched, though not harshly: wardens in grey stand at every quay to note who comes and goes."
 zin_gala_harbour_wardens_spirit:0 "Harbour Wardens"
 zin_gala_harbour_wardens_spirit_desc:0 "Grey-robed wardens at every quay note who comes and who goes, and say nothing about it."
 zin_gala_healers_of_gala:0 "Healers of Gala"
 zin_gala_healers_of_gala_desc:0 "Gala's healers are known across the central sea, and the best of them are sent out to the cities of men with only their herb-bags."
 zin_gala_his_memory:0 "His Memory Kept"
 zin_gala_his_memory_desc:0 "The songs, the sayings and the empty chair: Gala keeps the king alive in the only way left to it."
 zin_gala_home_from_last_war:0 "Home From the Last War"
 zin_gala_home_from_last_war_desc:0 "Gala's war is over. The Refusal is restored, the guard returns to the walls, and the court turns to mending what the long journey has taken."
 zin_gala_honour_sunhot:0 "Honour the Sunhot Elves"
 zin_gala_honour_sunhot_desc:0 "Lorien sends gifts and a formal word of honour to every Sunhot court. They are a peaceful people, and he thinks them worth honouring."
 zin_gala_keep_his_memory:0 "Keep His Memory"
 zin_gala_keep_his_memory_desc:0 "His songs are sung, his sayings written, his chair left empty. Gala resolves that what he remembered will not be forgotten with him."
 zin_gala_keeper_of_mirror:0 "The Keeper of the Mirror"
 zin_gala_keeper_of_mirror_desc:0 "Heveneya, a theorist of the old school, takes up the long watch beside the water. She studies the ripples as a scribe studies a hand."
 zin_gala_king_beyond_ages:0 "A King Beyond the Ages"
 zin_gala_king_beyond_ages_desc:0 "Gala's king has outlived every grudge held against him and most of the causes that made them. His court is a fixed point in a changing world."
 zin_gala_king_has_fallen:0 "The King Has Fallen"
 zin_gala_king_has_fallen_desc:0 "Word comes that Lorien rode north and did not return. The halls of Gala are silent, and the Mirror lies unstirred."
 zin_gala_kings_audiences:0 "The King's Audiences"
 zin_gala_kings_audiences_desc:0 "On certain mornings Lorien receives anyone who comes, in the open court beside the Mirror. Kings and shepherds wait in the same line, and he hears them in the order they arrived."
 zin_gala_kings_last_armour:0 "The King's Last Armour"
 zin_gala_kings_last_armour_desc:0 "Lorien's armour is brought out of the vault, mended and polished. He has not worn it since Dardan, and he does not say why he wears it now."
 zin_gala_kings_last_armour_spirit:0 "The King's Last Armour"
 zin_gala_kings_last_armour_spirit_desc:0 "Lorien wears the armour of Dardan again. The guard, seeing it, stands a little straighter."
 zin_gala_kings_patience:0 "The King's Patience"
 zin_gala_kings_patience_desc:0 "Lorien chooses to wait, and to let the world come to him. Patience, he says, is not indifference, though it takes a patient mind to tell the two apart."
 zin_gala_kings_patience_spirit:0 "The King's Patience"
 zin_gala_kings_patience_spirit_desc:0 "Lorien waits, and the court waits with him. Little is rushed, and less is regretted."
 zin_gala_kings_ships:0 "The King's Ships"
 zin_gala_kings_ships_desc:0 "Gala is small but its ships are among the finest in Aoaz: long, pale hulls with sails like folded wings. Lorien has them built for beauty and for need alike."
 zin_gala_kings_warning:0 "The King's Warning"
 zin_gala_kings_warning_desc:0 "Lorien decides that some dangers must be spoken of before they arrive. He sends word to the courts that will listen, knowing that warnings do not always help."
 zin_gala_letters_to_parim:0 "Letters to Parim"
 zin_gala_letters_to_parim_desc:0 "Lorien writes, in his own hand, to the King of Aenor. The letter is courteous and carefully short."
 zin_gala_long_estrangement:0 "The Long Estrangement"
 zin_gala_long_estrangement_desc:0 "Since Edran's folly, the elves have kept apart from the kings of Aenor. Gala shares the Refusal, and Lorien has never apologised for it."
 zin_gala_mediator_of_south:0 "Mediator of the South"
 zin_gala_mediator_of_south_desc:0 "When two Sunhot courts quarrel, Gala's envoys are the ones both sides will receive. A quarrel talked out is a war avoided."
 zin_gala_memory_before_aen:0 "Memory Before Aen"
 zin_gala_memory_before_aen_desc:0 "Lorien remembers a time before the House of Aen, and his scribes write it down before it is forgotten again. History, he says, is mostly the story of what people chose to remember."
 zin_gala_memory_before_aen_spirit:0 "Memory Before Aen"
 zin_gala_memory_before_aen_spirit_desc:0 "The scribes set down what Lorien remembers while he still remembers it."
 zin_gala_mirror_of_first_rain:0 "The Mirror of First Rain"
 zin_gala_mirror_of_first_rain_desc:0 "In a stone courtyard at the heart of Gala lies a spring that gathers the first rain of each year. Lorien says it shows true traces of what has passed and possible shapes of what may come, and never a certain one."
 zin_gala_mirror_shows_a_name:0 "The Mirror Shows a Name"
 zin_gala_mirror_shows_a_name_desc:0 "On a still night the water shows the court a name. Lorien does not speak it aloud until he is sure."
 zin_gala_mirror_without_king:0 "The Mirror Without Its King"
 zin_gala_mirror_without_king_desc:0 "The Keeper takes up the long watch beside the water alone. The Mirror answers her as it answered him, which is a comfort to nobody and a relief to all."
 zin_gala_name_in_the_water:0 "The Name in the Water"
 zin_gala_name_in_the_water_desc:0 "The court has heard the name the water gave, and Gala will help the man who bears it."
 zin_gala_new_voice_at_noon:0 "A New Voice at Noon"
 zin_gala_new_voice_at_noon_desc:0 "Gala's new envoy takes the guest's seat at the Noon Council. The Sunhot courts rise to receive her."
 zin_gala_no_word_leaves:0 "No Word Leaves Gala"
 zin_gala_no_word_leaves_desc:0 "A guest's departure is not a matter for gossip. The court quietly closes its doors to anyone who asks where he has gone."
 zin_gala_noon_council_arms:0 "The Noon Council Arms"
 zin_gala_noon_council_arms_desc:0 "If the south is attacked, the Noon Council may raise a league of its own realms. Gala offers to keep the records and to bring the oldest spears."
 zin_gala_old_lords:0 "The Old Lords"
 zin_gala_old_lords_desc:0 "Lorien sends word to lords and spirits who have lived since Dardan. Some answer; some are not sure how to."
 zin_gala_pilgrim_priests:0 "The Pilgrim Priests"
 zin_gala_pilgrim_priests_desc:0 "Priests of the Deliverer ask leave to open a house of healing by the harbour. They bring skilled hands and generous gifts."
 zin_gala_quiet_questions:0 "Quiet Questions"
 zin_gala_quiet_questions_desc:0 "Wardens put gentle questions to arriving travellers: where they have been, whom they serve and how long they mean to stay. Most answer freely."
 zin_gala_quiet_questions_spirit:0 "Quiet Questions"
 zin_gala_quiet_questions_spirit_desc:0 "The wardens ask arriving travellers gentle questions, and most are happy to answer."
 zin_gala_refusal_holds:0 "The Refusal Holds"
 zin_gala_refusal_holds_desc:0 "The elves will not fight the wars of men, and Lorien has no intention of pretending otherwise. The court is quiet, and quietly relieved."
 zin_gala_sea_of_gods:0 "Pilgrims to the Sea of Gods"
 zin_gala_sea_of_gods_desc:0 "Gala makes room for pilgrims who walk the coast road to the Sea of Gods, with inns and wells along the way."
 zin_gala_share_the_sight:0 "Share the Sight"
 zin_gala_share_the_sight_desc:0 "What the Mirror shows is written out fair and sent to those who might use it. Some will not believe it, and Lorien is content that they were told."
 zin_gala_ship_beyond_compare:0 "A Ship Beyond Compare"
 zin_gala_ship_beyond_compare_desc:0 "In the deep yard a single hull is laid down, finer than any other, with a keel cut from a tree older than the realm. Lorien has not said what it is for."
 zin_gala_ship_sails_north:0 "The Ship Sails North"
 zin_gala_ship_sails_north_desc:0 "The finest ship in Gala slips out of the Sun Harbour on the morning tide, bound for the frozen north with a crew and a quest."
 zin_gala_ships_north_for_king:0 "Ships North for the King"
 zin_gala_ships_north_for_king_desc:0 "The King's ships are readied for a long northern voyage. If Lorien rides, he will not ride alone, and he will need ships to follow."
 zin_gala_ships_to_islands:0 "Ships Calling at the Islands"
 zin_gala_ships_to_islands_desc:0 "Ships of Gala visit the island harbours of the south, bearing books, seed and news, and come home with songs and sailors' tales. Word spreads that the King's ships are friendly."
 zin_gala_shipwrights:0 "Sulestien's Shipwrights"
 zin_gala_shipwrights_desc:0 "Sulestien, Master of the King's Ships, takes charge of the yards and chooses the craftsmen himself. It is said he has never built a vessel that was not named before it was finished."
 zin_gala_songs_of_dardan:0 "The Songs of Dardan"
 zin_gala_songs_of_dardan_desc:0 "The old songs are sung again in the evenings, those that tell of the field where the Grand Alliance stood. The young guards learn them, and learn what the singers leave out."
 zin_gala_songs_of_dardan_spirit:0 "The Songs of Dardan"
 zin_gala_songs_of_dardan_spirit_desc:0 "The guard sings the old songs at dusk, and the young learn what the singers hold back."
 zin_gala_southern_charts:0 "Charts of the Southern Seas"
 zin_gala_southern_charts_desc:0 "Captains of the King's ships record every reef, current and island they pass. The result is a chart of the southern waters more exact than any other."
 zin_gala_southern_charts_spirit:0 "Charts of the Southern Seas"
 zin_gala_southern_charts_spirit_desc:0 "The finest charts of the southern waters hang in the harbour-hall, corrected after every voyage."
 zin_gala_spirits_who_remember:0 "Spirits Who Remember Dardan"
 zin_gala_spirits_who_remember_desc:0 "Spirits that have lived since Dardan will not come to a summons, but they will come to a request. Lorien asks in the old way."
 zin_gala_still_water:0 "Still Water"
 zin_gala_still_water_desc:0 "A rule is made that no ripple shall be added to the spring but rain. The water clears, and the Keeper finds that clear water is easier to read than troubled."
 zin_gala_still_water_spirit:0 "Still Water"
 zin_gala_still_water_spirit_desc:0 "No ripple but rain disturbs the spring, and the Mirror answers more clearly for it."
 zin_gala_stranger_from_islands:0 "A Stranger From the Islands"
 zin_gala_stranger_from_islands_desc:0 "A man arrives at Gala from the Islands of the South, weary and quiet, with no name he can give. Lorien receives him in the Courtyard of Rain and does not let him leave that night."
 zin_gala_strangers_at_quays:0 "Strangers at the Quays"
 zin_gala_strangers_at_quays_desc:0 "Foreign priests, traders and scribes arrive at Gala's harbour in numbers not seen before. They are courteous, and they ask a great many questions."
 zin_gala_summon_ancient_lords:0 "Summon the Ancient Lords"
 zin_gala_summon_ancient_lords_desc:0 "Heralds travel to forgotten halls and high places to call the ancient lords to Gala. It is an old summons, and few have heard it in an age."
 zin_gala_sun_festivals:0 "The Sun Festivals"
 zin_gala_sun_festivals_desc:0 "Gala joins the festivals of its neighbours: the Day of First Light, the Feast of the Long Noon, the lantern-nights. Guests come from three realms and leave late."
 zin_gala_sun_festivals_spirit:0 "The Sun Festivals"
 zin_gala_sun_festivals_spirit_desc:0 "Gala joins the lantern-nights of its neighbours, and finds that a friend at a feast is a friend in a crisis."
 zin_gala_sun_guard_friends:0 "Friends Among the Sun Guard"
 zin_gala_sun_guard_friends_desc:0 "The Sun Guard keeps the borders of the Sunhot realms. Gala sends its officers to share bread and talk of watches with them."
 zin_gala_sun_harbour:0 "The Sun Harbour"
 zin_gala_sun_harbour_desc:0 "A curved harbour of white stone is cut into Gala's coast, deep enough for the largest hull and sheltered from the western gales."
 zin_gala_sun_realms:0 "Among the Sun Realms"
 zin_gala_sun_realms_desc:0 "Gala shares its coasts and skies with the great Sunhot realms, whose elves are the tallest and gentlest in Aoaz. Lorien sends them courtesy in every season."
 zin_gala_sunward_guard:0 "The Sunward Guard"
 zin_gala_sunward_guard_desc:0 "Gala's guard is small and old: a few hundred spears, led by veterans who fought at Dardan. They guard the court with the patience of long habit."
 zin_gala_tales_from_the_shores:0 "Tales From Every Shore"
 zin_gala_tales_from_the_shores_desc:0 "Travellers from distant coasts bring Gala stories too strange for anyone else to keep. The archives take them in without judgement."
 zin_gala_tangsiel_command:0 "Tangsiel's Command"
 zin_gala_tangsiel_command_desc:0 "Tangsiel, a captain who has never lost a gate, is given command of the guard. She believes in long drills and short speeches."
 zin_gala_true_traces:0 "Reading True Traces"
 zin_gala_true_traces_desc:0 "Heveneya teaches the court to read what the water has already shown: the marks of deeds done, the wake of ships long gone. Of all its answers, these are the surest."
 zin_gala_uncertain_futures:0 "Uncertain Futures"
 zin_gala_uncertain_futures_desc:0 "Lorien warns his scribes that a vision of the future is a river in flood, not a road. They write the warning above the water."
 zin_gala_veterans_of_dardan:0 "Veterans of Dardan"
 zin_gala_veterans_of_dardan_desc:0 "A few of the guard remember the field of Dardan, and they teach the rest in the evenings what the singers leave out."
 zin_gala_veterans_of_dardan_spirit:0 "Veterans of Dardan"
 zin_gala_veterans_of_dardan_spirit_desc:0 "The few who stood at Dardan teach the rest, and the lesson is mostly about patience."
 zin_gala_visions_across_seas:0 "Visions Across the Seas"
 zin_gala_visions_across_seas_desc:0 "The water is asked about the far islands and the central sea. It shows ships, and a great many of them."
 zin_gala_visions_north:0 "Visions of the North"
 zin_gala_visions_north_desc:0 "The water is asked about the northern seas, the black islands and the long ocean beyond them. It answers in shades of grey."
 zin_gala_visions_south:0 "Visions of the South"
 zin_gala_visions_south_desc:0 "The water is asked about the southern deserts and the roads that lead into them. It shows dust, and a pale moving line that may be marching."
 zin_gala_voice_of_memory:0 "The Voice of Memory"
 zin_gala_voice_of_memory_desc:0 "Lorien's counsel is sought by courts that have long forgotten why they trust him. They do trust him, and he knows what that means."
 zin_gala_voice_of_memory_spirit:0 "The Voice of Memory"
 zin_gala_voice_of_memory_spirit_desc:0 "Courts that have forgotten why they trust Gala trust it anyway, and Lorien takes care never to abuse the habit."
 zin_gala_walls_of_gala:0 "The Walls of Gala"
 zin_gala_walls_of_gala_desc:0 "The old walls are mended and raised in pale stone, with high towers and gates of silvered oak. They are meant to deter, and to be beautiful."
 zin_gala_wardsong_of_gala:0 "The Wardsong of Gala"
 zin_gala_wardsong_of_gala_desc:0 "A low chant taught by Lorien's oldest singers, sung at the changing of the watch, holds back shadows that ordinary courage cannot. Against the dead it may matter."
 zin_gala_warships_of_gala:0 "Warships of Gala"
 zin_gala_warships_of_gala_desc:0 "Gala is no realm that wants war. Yet its shipwrights lay down a few warships against need, as a prudent household keeps a lock on its door."
 zin_gala_weeks_of_memory:0 "Weeks of Memory"
 zin_gala_weeks_of_memory_desc:0 "For weeks Lorien speaks with the stranger, telling him what the world was and what it has become. The stranger answers little, and learns a great deal."
 zin_gala_welcome_priests:0 "Welcome the Healing Houses"
 zin_gala_welcome_priests_desc:0 "The priests are given a house by the harbour and the hearty thanks of the sick. Gala has never turned healers away."
 zin_gala_what_death_cannot_end:0 "What Death Cannot End"
 zin_gala_what_death_cannot_end_desc:0 "The singers of Gala study the song that holds back the dead of Zol. It is old, it is hard, and it may stand against what ordinary weapons cannot answer."
 zin_gala_what_lorien_remembers:0 "What Lorien Remembers"
 zin_gala_what_lorien_remembers_desc:0 "The king of the Gala elves has watched the ages turn since before Dardan. He speaks of them only when asked, and his court has learned to ask."
 zin_gala.1.a:0 "Memory is a duty."
 zin_gala.1.b:0 "Memory is a burden."
 zin_gala.1.d:0 "The King speaks in the open court of Dardan and of the kings who came after it. He says nothing that is not already written, and everyone listens as if it were new."
 zin_gala.1.t:0 "What Lorien Remembers"
 zin_gala.10.a:0 "The estrangement stands."
 zin_gala.10.b:0 "Aoaz's fate still matters to us."
 zin_gala.10.d:0 "Lorien recalls Edran's folly in the old hall, in words that have not changed in centuries. The court listens, and it is not clear whether it is listening for grief or for habit."
 zin_gala.10.t:0 "The Long Estrangement"
 zin_gala.11.a:0 "Gala will help him."
 zin_gala.11.d:0 "The court hears the name that the water gave: Eindil, son of Ein. Lorien says it aloud once, and nobody in the hall moves for a long moment. Then the Keeper bows, and the court follows."
 zin_gala.11.t:0 "The Name in the Water"
 zin_gala.12.a:0 "Then the voyage was not in vain."
 zin_gala.12.d:0 "Sailors returning from the north say the stranger lives and carries a green light out of the cold. They have it from a fisherman, who had it from a trader, and Lorien smiles and asks for the trader's name."
 zin_gala.12.t:0 "Word From the North"
 zin_gala.13.a:0 "Let them remember."
 zin_gala.13.d:0 "Lorien sends word to lords and spirits who have lived since Dardan. He does not name them, and the heralds do not ask who they are; they carry the word to hills and hollows, and wait."
 zin_gala.13.t:0 "The Old Lords"
 zin_gala.2.a:0 "Keep them in the archive."
 zin_gala.2.b:0 "Send answers back with them."
 zin_gala.2.d:0 "Island scholars bring tales too old for any man to explain: a song with no beginning, a map with one coast missing, a bowl whose glaze nobody can name. They ask the King what he thinks."
 zin_gala.2.t:0 "Tales From Every Shore"
 zin_gala.3.a:0 "Let the water be still."
 zin_gala.3.d:0 "In an old courtyard lies a spring. Lorien tells the court that the water shows true traces and possible futures, and never a certain one, and that it is the second thing that will tempt them."
 zin_gala.3.t:0 "The Mirror of First Rain"
 zin_gala.4.a:0 "We will speak with care."
 zin_gala.4.d:0 "Lorien teaches that a prophecy can frighten people into the very deeds it foretells. He asks that nothing the water shows be spoken in haste."
 zin_gala.4.t:0 "Uncertain Futures"
 zin_gala.5.a:0 "Honour the King of Gala."
 zin_gala.5.b:0 "Hear him politely."
 zin_gala.5.d:0 "The King of Gala asks to sit at the Noon Council as a guest, to listen and, when asked, to speak. The Council debates whether the oldest court in Aoaz needs an invitation."
 zin_gala.5.t:0 "A Guest at the Noon Council"
 zin_gala.6.a:0 "Hear them all."
 zin_gala.6.d:0 "Scholars from many shores arrive in Gala with what they cannot explain: a coin, a carving, a dream that three people had on the same night. They have been told that if the old king cannot make sense of it, nobody can."
 zin_gala.6.t:0 "Carry It to Gala"
 zin_gala.7.a:0 "Not yet."
 zin_gala.7.b:0 "Raise the Noon League."
 zin_gala.7.d:0 "Gala's envoy asks the Noon Council to consider a league of the Sunhot realms for defence. The head of the Council is silent for a moment, then asks the hall whether it is time."
 zin_gala.7.t:0 "The Noon Council Arms"
 zin_gala.8.a:0 "Watch them."
 zin_gala.8.b:0 "Gala is open to all."
 zin_gala.8.d:0 "Foreign priests and traders have been arriving in Gala in greater numbers. The wardens report that they are polite, generous and unusually curious about who comes and goes."
 zin_gala.8.t:0 "Strangers at the Quays"
 zin_gala.9.a:0 "We will consider it."
 zin_gala.9.d:0 "Priests of the Deliverer ask leave to open a house of healing by the harbour. They have brought physicians, medicines and a purse; the sick of the quays are watching to see what Gala will say."
 zin_gala.9.t:0 "The Pilgrim Priests"
