l_english:
 zin_regional_fearno_a_lord_among_lords:0 "A Lord Among Lords"
 zin_regional_fearno_a_lord_among_lords_desc:0 "The hall decides to be friendly to both crowns and bound to neither. Furs go south and iron goes north, and the lords of Fearno sit comfortably between."
 zin_regional_fearno_accord_hunters:0 "Hunters of the Accord"
 zin_regional_fearno_accord_hunters_desc:0 "Fearno hunters ride with the Winter Crown's wardens and share their winter lodges. The Accord has learned the forest, and the forest has learned the Accord."
 zin_regional_fearno_between_two_crowns:0 "Between Two Crowns"
 zin_regional_fearno_between_two_crowns_desc:0 "Fandanar sends envoys with sable and promises, and the Iron Hall sends envoys with iron and flattery. The hall of Fearno must choose which of them to listen to, or whether to listen to neither."
 zin_regional_fearno_bowmen_of_the_pines:0 "Bowmen of the Pines"
 zin_regional_fearno_bowmen_of_the_pines_desc:0 "Fearno bowmen shoot from the cover of the forest and are gone before the arrows land. Their bows are cut from yew and strung with sinew."
 zin_regional_fearno_call_the_free_steadings:0 "Call the Free Steadings"
 zin_regional_fearno_call_the_free_steadings_desc:0 "Horns are blown from the hall of Fearno to every clan realm that wants neither crown. Those who answer will be bound by oath, shield and salt, and Fearno will hold the horn."
 zin_regional_fearno_envoys_to_fandanar:0 "Envoys to Fandanar"
 zin_regional_fearno_envoys_to_fandanar_desc:0 "Fearno sends a company of envoys south, with furs for the Winter Crown's table and a lord of good family at their head. They are well received and carefully watched."
 zin_regional_fearno_fearno_keeps_its_snows:0 "Fearno Keeps Its Snows"
 zin_regional_fearno_fearno_keeps_its_snows_desc:0 "The hall decides that Fearno will keep to its snows, its forests and its own business. The war will have to come north to find the hunters."
 zin_regional_fearno_fearno_united:0 "The Hall United"
 zin_regional_fearno_fearno_united_desc:0 "Twenty lords sit in the hall, and on the great questions they now sit as one. Fearno has found that a realm of many voices is hardest to buy when the voices have learned to agree."
 zin_regional_fearno_fearno_wardens:0 "Wardens of Fearno"
 zin_regional_fearno_fearno_wardens_desc:0 "Stone lodges in the deep forest are manned by wardens who know every trail and spring. An invader must cross the whole of Fearno to learn that it is not an empty land."
 zin_regional_fearno_free_steadings:0 "The Free Steadings"
 zin_regional_fearno_free_steadings_desc:0 "Clan realms that want neither crown have bound themselves to one another, and Fearno holds the horn. A league of the unbowed is stubborn and hard to scatter."
 zin_regional_fearno_friends_of_the_winter_crown:0 "Friends of the Winter Crown"
 zin_regional_fearno_friends_of_the_winter_crown_desc:0 "Some lords like the order of Fandanar and the roads it keeps open. They send gifts south and ask for a place at the Accord's table, which they have not yet been offered."
 zin_regional_fearno_friendship:0 "Friends of the Winter Crown"
 zin_regional_fearno_hunters_for_the_living:0 "Hunters for the Living"
 zin_regional_fearno_hunters_for_the_living_desc:0 "Some lords say that a hunter does not wait for the wolf to find his door. They send riders to ask where the living stand, and what the hunters might do."
 zin_regional_fearno_hunters_of_the_far_ice:0 "Hunters of the Far Ice"
 zin_regional_fearno_hunters_of_the_far_ice_desc:0 "The boldest hunters range across the ice-fields beyond the last forests. They set up caches and cairns as they go, and the road north is a little shorter each year."
 zin_regional_fearno_iron_of_the_north_hills:0 "Iron of the North Hills"
 zin_regional_fearno_iron_of_the_north_hills_desc:0 "Bog-iron and hill-iron are smelted in the northern valleys with charcoal from the pine forests. It is rough iron, but there is a great deal of it."
 zin_regional_fearno_keeps_its_snows:0 "Fearno Keeps Its Snows"
 zin_regional_fearno_keeps_its_snows_desc:0 "The lords have chosen to hold their forests and let the south settle its own quarrels. It is a prudent choice, and an uneasy one."
 zin_regional_fearno_lord_among_lords:0 "A Lord Among Lords"
 zin_regional_fearno_lord_among_lords_desc:0 "Fearno trades with both crowns and bows to neither, and its lords have learned to profit from the quarrel. A guest of two tables eats well."
 zin_regional_fearno_lord_esroms_hall:0 "Lord Esrom's Hall"
 zin_regional_fearno_lord_esroms_hall_desc:0 "The hall of Fearno is a hundred paces of pine beams and bear-skins, and Lord Esrom sits at its head only because no other lord will give another the honour. His authority is a courtesy that everyone has agreed to keep."
 zin_regional_fearno_markets_for_both_crowns:0 "Markets for Both Crowns"
 zin_regional_fearno_markets_for_both_crowns_desc:0 "Fearno opens a market at its southern border and another at its northern, and the same furs are sold at each for a slightly different price. The lords pretend not to notice."
 zin_regional_fearno_neither_crown:0 "Neither Crown nor Iron"
 zin_regional_fearno_neither_crown_desc:0 "The lords of Fearno carry their own banner on every road of the north, and the crowns have stopped asking them to carry another. A free realm is respected where a servant is merely used."
 zin_regional_fearno_neither_crown_nor_iron:0 "Neither Crown nor Iron"
 zin_regional_fearno_neither_crown_nor_iron_desc:0 "The hall declares that Fearno will not wear a crown it did not forge, nor bear an iron collar it did not buy. The two great halls take the news with different faces, and both nod."
 zin_regional_fearno_pride_of_fearno:0 "The Pride of Fearno"
 zin_regional_fearno_pride_of_fearno_desc:0 "The lords agree on a banner: a green pine on a field of white, with no crown above it. Every hall in Fearno hangs it, and every steward knows what it means."
 zin_regional_fearno_proud_fearno:0 "Fearno Stands Alone"
 zin_regional_fearno_proud_fearno_desc:0 "It bowed neither to the Winter Crown nor to the Iron Hall. Distance, pine forest and pride kept it apart, and it means to stay so."
 zin_regional_fearno_shield_of_the_steadings:0 "Shield of the Steadings"
 zin_regional_fearno_shield_of_the_steadings_desc:0 "Fearno promises its shield to every steading that has sworn at the moot. A hand laid on one is a hand laid on all, and the oath is cut into the stone of the moot-hill."
 zin_regional_fearno_snow_trackers:0 "Snow Trackers"
 zin_regional_fearno_snow_trackers_desc:0 "The best trackers are taught to follow a trail over crusted snow, through blizzard and under starlight. A foe that leaves a track in Fearno is found before he has finished eating."
 zin_regional_fearno_snow_trackers_trained:0 "Snow Trackers"
 zin_regional_fearno_snow_trackers_trained_desc:0 "Trackers who can follow a hare across crusted snow and read the night from the stars. A band led by one of them is seldom lost and never surprised."
 zin_regional_fearno_songs_of_the_houseless_king:0 "Songs of the King Without a House"
 zin_regional_fearno_songs_of_the_houseless_king_desc:0 "A new song is sung in the halls of Fearno, about a king without a house who wears no crown and walks where the snow is deepest. The singers are asked who taught it to them, and they say the road."
 zin_regional_fearno_stores_against_the_winter:0 "Stores Against the Winter"
 zin_regional_fearno_stores_against_the_winter_desc:0 "Every lodge keeps a store of smoked meat, dried fish and barley against the white months. The lords' stewards count the stores each autumn, and the lords drink to the count."
 zin_regional_fearno_tales_of_the_north:0 "Tales of the North"
 zin_regional_fearno_tales_of_the_north_desc:0 "Hunters who have ranged far to the north come home with stories, and the hall of Fearno has a bench by the fire reserved for those who tell them. The stories are sorted, set in order and, for the most part, believed."
 zin_regional_fearno_the_accords_door:0 "The Accord's Door"
 zin_regional_fearno_the_accords_door_desc:0 "Fandanar's regard for Fearno has warmed, and a door at the Accord's table is held open. The lords wait for the formal invitation."
 zin_regional_fearno_the_accords_door_tip_1:0 "Fandanar may now invite us into the Accord."
 zin_regional_fearno_the_free_steadings:0 "The Free Steadings"
 zin_regional_fearno_the_free_steadings_desc:0 "The boldest lords say that Fearno need not choose a crown at all, for it could lead the steadings that want neither. The hall listens, uneasy and curious."
 zin_regional_fearno_the_fur_markets:0 "The Fur Markets"
 zin_regional_fearno_the_fur_markets_desc:0 "Marten, sable and white fox come down from the forest in bales, and Fearno's fur markets set the price for the whole north. Foreign buyers arrive each autumn with silver in their belts and lists in their heads."
 zin_regional_fearno_the_great_hunt:0 "The Great Hunt"
 zin_regional_fearno_the_great_hunt_desc:0 "Once a year every lord rides with his huntsmen and hounds in a single line across the forest, and the whole realm eats of what they bring down. The ride is loud, cold and very good for the temper."
 zin_regional_fearno_the_hall_of_many_lords:0 "The Hall of Many Lords"
 zin_regional_fearno_the_hall_of_many_lords_desc:0 "The lords gather at midwinter to hear grievances, trade complaints and renew their toasts. Esrom must keep them from the old quarrels, and from new ones."
 zin_regional_fearno_the_hunt_rides_south:0 "The Hunt Rides South"
 zin_regional_fearno_the_hunt_rides_south_desc:0 "The Great Hunt rides out of Fearno in the wrong season and in the wrong direction. Behind the huntsmen come the sledges, loaded with iron, grain and hope."
 zin_regional_fearno_the_hunting_host:0 "The Hunting Host"
 zin_regional_fearno_the_hunting_host_desc:0 "Huntsmen from every valley gather each autumn and learn to move together through the woods. They hunt deer and bear, and they learn to hunt men."
 zin_regional_fearno_the_huntmaster:0 "The Huntmaster"
 zin_regional_fearno_the_huntmaster_desc:0 "Hroth Vael, the Huntmaster, has led the autumn ride for thirty years. At his word ten thousand huntsmen put on their cloaks and take to the woods."
 zin_regional_fearno_the_long_roads:0 "The Long Roads"
 zin_regional_fearno_the_long_roads_desc:0 "The long roads of Fearno run through forest, fen and fell for days without a village. The lords agree to keep a rest-house at every day's march, and to light a lamp in it."
 zin_regional_fearno_the_lords_of_fearno:0 "The Lords of Fearno"
 zin_regional_fearno_the_lords_of_fearno_desc:0 "Each lord in the hall holds a valley, a forest or a stretch of coast, and each sends a steward to speak when he cannot. Steward Ilse Morrow keeps the count of votes, of oaths and of debts."
 zin_regional_fearno_the_open_road:0 "The Open Road"
 zin_regional_fearno_the_open_road_desc:0 "Roads are cut through the pines and raised above the bogs, so that a laden sledge may pass from one border to the other. Fearno's lords take a toll at every ford, and their steward counts it."
 zin_regional_fearno_the_silent_castle_tale:0 "The Silent Castle"
 zin_regional_fearno_the_silent_castle_tale_desc:0 "A green light burns at the edge of the world, say the hunters, above a castle that no one reaches. Those who have walked toward it for days found it no nearer, and turned home."
 zin_regional_fearno_the_silent_castle_tale_tip_1:0 "A green light in the north, and a castle no hunter reaches."
 zin_regional_fearno_the_south_burns:0 "The South Burns"
 zin_regional_fearno_the_south_burns_desc:0 "Smoke on the southern horizon and ravens from every border: the war that the lords have long dreaded has begun. The hall of Fearno sits in the dark and debates how much of it concerns the forest."
 zin_regional_fearno_the_steadings_moot:0 "The Steadings' Moot"
 zin_regional_fearno_the_steadings_moot_desc:0 "The first delegates arrive in sleds and on foot, and the moot sits on a hillside in the wind. Whatever is said there is said in the open, and whatever is sworn is sworn on the fire."
 zin_regional_fearno_the_stranger_of_the_ice:0 "The Stranger from the Ice"
 zin_regional_fearno_the_stranger_of_the_ice_desc:0 "A hunter comes in from the far ice with a tale of a man found half-dead in the snow, who walked out of a place no one lives. The hall listens and says nothing for a long while."
 zin_regional_fearno_timber_of_fearno:0 "Timber of Fearno"
 zin_regional_fearno_timber_of_fearno_desc:0 "Straight pines are felled in winter, dragged by horse-teams to the rivers and floated down in the thaw. A shipwright in Windwaith will pay well for a Fearno mast."
 zin_regional_fearno_under_the_accord:0 "Under the Accord"
 zin_regional_fearno_under_the_accord_desc:0 "Fearno takes its seat among the Accord's lords, and its hunters learn the Accord's horn-calls. The north is now a little more crowded and a little safer."
 zin_regional_fearno_wardens_of_fearno:0 "Wardens of Fearno"
 zin_regional_fearno_wardens_of_fearno_desc:0 "Permanent wardens are posted at every pass and ford, living year-round in lodges of stone and timber. They are paid in grain, salt and respect."
 zin_regional_fearno.1.a:0 "Esrom speaks first."
 zin_regional_fearno.1.b:0 "Every lord speaks."
 zin_regional_fearno.1.d:0 "The lords have come from every valley and coast, and the hall is crowded with fur cloaks and old grievances. Esrom raises his hand, and for a moment the noise falls."
 zin_regional_fearno.1.t:0 "The Hall of Many Lords"
 zin_regional_fearno.2.a:0 "Keep them waiting"
 zin_regional_fearno.2.b:0 "Welcome them"
 zin_regional_fearno.2.d:0 "Envoys from Fearno stand in the hall of the Winter Crown with a gift of white furs and a lord of good family at their head. They ask for nothing, which Fandanar finds more worrying than a request."
 zin_regional_fearno.2.t:0 "Envoys from Fearno"
 zin_regional_fearno.3.a:0 "Keep our own counsel"
 zin_regional_fearno.3.b:0 "Join the Free Steadings"
 zin_regional_fearno.3.d:0 "A rider from Fearno has come with a horn and a message. Fearno asks whether this realm would join a league of the unbowed, sworn on the fire and bound by salt, to answer neither Fandanar nor the Iron Hall."
 zin_regional_fearno.3.t:0 "The Free Steadings Call"
