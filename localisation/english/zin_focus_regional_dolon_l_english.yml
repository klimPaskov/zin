l_english:
 zin_regional_dolon_a_ledger_of_our_own:0 "A Ledger of Our Own"
 zin_regional_dolon_a_ledger_of_our_own_desc:0 "Morvath opens a new book in the counting-house and starts to enter figures that the Dominion has never seen. It is a slow, patient and entirely lawful kind of rebellion."
 zin_regional_dolon_a_steward_of_salt:0 "A Steward of Salt"
 zin_regional_dolon_a_steward_of_salt_desc:0 "Morvath names himself Steward of Salt, a title that belongs to no overlord. It is a small thing, written in a small hand, and it changes everything."
 zin_regional_dolon_a_throne_that_does_not_answer:0 "A Throne That Does Not Answer"
 zin_regional_dolon_a_throne_that_does_not_answer_desc:0 "The black-sealed letters no longer arrive from Nafeher. The Steward writes in a name that does not answer, and Morvath reads the letters twice and puts them in a drawer."
 zin_regional_dolon_arms_for_nafeher:0 "Arms for Nafeher"
 zin_regional_dolon_arms_for_nafeher_desc:0 "Carts loaded with blades, spearheads and shield-bosses go north under Nafeher's seal. Ossira Forge-Mother signs for each one, and notes the count in the ash."
 zin_regional_dolon_arms_of_dolon:0 "The Arms of Dolon"
 zin_regional_dolon_arms_of_dolon_desc:0 "The marks of Dolon are stamped on every blade, and the marks are known from the Dead Sea to the cold north. A smith who forges for Dolon forges for the whole Dominion."
 zin_regional_dolon_arms_of_dolon_spirit:0 "The Arms of Dolon"
 zin_regional_dolon_arms_of_dolon_spirit_desc:0 "Blades, spearheads and shield-bosses stamped with the mark of the Dead Sea go north in the hundreds. They are plain, heavy and unfailingly sound."
 zin_regional_dolon_ash_kilns:0 "Ash Kilns"
 zin_regional_dolon_ash_kilns_desc:0 "Kilns of fired ash and clay are built beside the forges to bake the moulds. A well-made mould makes a hundred blades, and a hundred blades make a company."
 zin_regional_dolon_beyond_the_storms:0 "Trade Beyond the Storms"
 zin_regional_dolon_beyond_the_storms_desc:0 "Dolon's galleys, born under the storms, sail through them where other ships turn back. They carry salt and glass to coasts that the Dominion has never named."
 zin_regional_dolon_black_galleys:0 "Black Galleys"
 zin_regional_dolon_black_galleys_desc:0 "Black galleys, pitched against the brine and rowed by crews born under the storms, are laid down on the Dead Sea shore. They sail where others will not, and come home with salt and silver."
 zin_regional_dolon_court_of_the_dead_sea:0 "The Court of the Dead Sea"
 zin_regional_dolon_court_of_the_dead_sea_desc:0 "Morvath of the Dead Sea holds court in a counting-house as much as a throne room, with ledgers on every table and salt-lords on every bench. A court that counts everything is hard to cheat."
 zin_regional_dolon_dead_sea_salt:0 "Salt of the Dead Sea"
 zin_regional_dolon_dead_sea_salt_desc:0 "Salt is raked from the pans in grey mounds, packed in barrels and sent north in the black galleys. It preserves meat, cures hides and pays for most things Dolon needs."
 zin_regional_dolon_deep_salt_pans:0 "Deep Salt-Pans"
 zin_regional_dolon_deep_salt_pans_desc:0 "New pans are dug deep into the salt flats, past the old brine-wells. They fill by hand and dry by sun, and every crust is worth a copper."
 zin_regional_dolon_dolon_at_peace:0 "Dolon at Peace"
 zin_regional_dolon_dolon_at_peace_desc:0 "The war is over, and the forges slow to a walk. Morvath balances the ledger, pays the smiths and lets the galleys put to sea again."
 zin_regional_dolon_dolon_endures:0 "Dolon Endures"
 zin_regional_dolon_dolon_endures_desc:0 "Whatever the Dominion asks, Dolon keeps its forges lit and its pans raked. The court proclaims that the land will endure, and the proclamation is written on a plate of black glass."
 zin_regional_dolon_dolon_for_dolon:0 "Dolon for Dolon"
 zin_regional_dolon_dolon_for_dolon_desc:0 "Dolon raises its own banner: a black galley on a field of grey salt. It answers to the Dead Sea and to no throne beyond it."
 zin_regional_dolon_dolon_marches:0 "Dolon Marches"
 zin_regional_dolon_dolon_marches_desc:0 "The war-horns of Dolon sound over the Dead Sea, and the forges are banked for the march. Every blade in the arsenal goes into a wagon, and every wagon goes north."
 zin_regional_dolon_forges_never_rest:0 "The Forges Never Rest"
 zin_regional_dolon_forges_never_rest_desc:0 "Every forge in Dolon is lit night and day, and the glow of them can be seen from the Dead Sea itself. The smiths sleep in shifts, and the anvils never cool."
 zin_regional_dolon_forges_never_rest_spirit:0 "The Forges Never Rest"
 zin_regional_dolon_forges_never_rest_spirit_desc:0 "Every forge in Dolon is lit night and day, and the glow of them can be seen from the Dead Sea itself. Workers sleep in shifts, and the anvils never cool."
 zin_regional_dolon_forges_of_dolon:0 "The Forges of Dolon"
 zin_regional_dolon_forges_of_dolon_desc:0 "The forges of Dolon arm the hosts of the Dominion, and every blade that goes north carries the mark of the Dead Sea. Morvath opens a new row of furnaces and counts the hours until they are lit."
 zin_regional_dolon_free_dolon:0 "Free Dolon"
 zin_regional_dolon_free_dolon_desc:0 "Morvath strikes out the Dominion's name from the ledger with a single stroke of the pen. Dolon is free, and the salt-lords drink to it standing."
 zin_regional_dolon_galleys_for_the_dominion:0 "Galleys for the Dominion"
 zin_regional_dolon_galleys_for_the_dominion_desc:0 "The galleys of Dolon are sent north to serve Nafeher, painted black and flying the Dominion's horned banner. Their crews are proud of it, and a little afraid."
 zin_regional_dolon_iron_steward:0 "The Iron Steward"
 zin_regional_dolon_iron_steward_desc:0 "Morvath keeps the ledgers of the Dominion in his own hand, and he keeps its forges in his own fist. A steward of iron is rarely kind, and always on time."
 zin_regional_dolon_morvaths_ledger:0 "Morvath's Ledger"
 zin_regional_dolon_morvaths_ledger_desc:0 "Morvath keeps the Dominion's ledgers and a few of his own. Nobody has ever seen the second set, and everybody knows what they contain."
 zin_regional_dolon_own_crown:0 "Dolon for Dolon"
 zin_regional_dolon_own_crown_desc:0 "The Dead Sea has its own ledger now, and its own seal. Morvath signs in his own name, and the salt-lords write the date in their own calendar."
 zin_regional_dolon_quiet_from_nafeher:0 "Quiet from Nafeher"
 zin_regional_dolon_quiet_from_nafeher_desc:0 "The seals from Nafeher grow fewer and the summons less urgent. Dolon's court is wise enough to use the quiet and not mention it."
 zin_regional_dolon_salt_and_iron_endure:0 "Salt and Iron Endure"
 zin_regional_dolon_salt_and_iron_endure_desc:0 "Salt and iron are still salt and iron, whoever holds the seal. The forges burn on, the pans fill and the galleys sail on with the tide."
 zin_regional_dolon_salt_council:0 "The Salt Council"
 zin_regional_dolon_salt_council_desc:0 "The salt-lords of the Dead Sea sit in a ring of grey benches and argue about every barrel. A council that argues so well rarely makes a bad bargain."
 zin_regional_dolon_salt_harbour:0 "The Salt Harbour"
 zin_regional_dolon_salt_harbour_desc:0 "A harbour of grey stone is cut into the shore of the Dead Sea, with moles to break the storm swells. The galleys moor there in rows, and the salt-ships load beside them."
 zin_regional_dolon_salt_of_the_dead_sea:0 "Salt of the Dead Sea"
 zin_regional_dolon_salt_of_the_dead_sea_desc:0 "Grey mounds of salt line the shore of the Dead Sea, raked by hand and packed into barrels. It keeps meat for a year and a day, and the whole Dominion eats from it."
 zin_regional_dolon_shields_of_dolon:0 "Shields of Dolon"
 zin_regional_dolon_shields_of_dolon_desc:0 "Dolon's shields are heavy, plain and unbreakable, and the Dominion's hosts march behind them. The smiths stamp each one with the black galley of the Dead Sea."
 zin_regional_dolon_stand_with_the_steward:0 "Stand with the Steward"
 zin_regional_dolon_stand_with_the_steward_desc:0 "Morvath decides that Dolon's debts were owed to Nafeher, not to a name, and that Nafeher still stands. The Steward speaks for it, and Dolon's forges will serve the Steward's banner."
 zin_regional_dolon_storm_harbour_chain:0 "The Storm-Harbour Chain"
 zin_regional_dolon_storm_harbour_chain_desc:0 "A great chain, wrapped in tarred cloth against the salt, is stretched across the mouth of the harbour. No ship passes it uninvited, and few pass it in a storm."
 zin_regional_dolon_storm_pilots_of_dolon:0 "Storm Wayfinders of Dolon"
 zin_regional_dolon_storm_pilots_of_dolon_desc:0 "Thuul of the Black Galleys teaches the wayfinders who steer through the storm coast, reading the waves like a script. A galley under such a hand reaches harbour when no one else does."
 zin_regional_dolon_the_iron_steward:0 "The Iron Steward"
 zin_regional_dolon_the_iron_steward_desc:0 "Morvath takes the ledger and the seal into one hand. The salt-lords find that their votes have become a courtesy."
 zin_regional_dolon_the_salt_council:0 "The Salt Council"
 zin_regional_dolon_the_salt_council_desc:0 "The salt-lords persuade Morvath to share the ledger with a council of their own. Every barrel now has three names on it."
 zin_regional_dolon_the_salt_lords:0 "The Salt-Lords"
 zin_regional_dolon_the_salt_lords_desc:0 "The salt-lords hold the pans and the barrel-yards, and their word on prices is final. They sit on grey benches at the court's left hand."
 zin_regional_dolon_trade_beyond_the_storms:0 "Trade Beyond the Storms"
 zin_regional_dolon_trade_beyond_the_storms_desc:0 "Dolon's galleys, born under the storms, sail through them where other ships turn back. They carry salt and glass to coasts that the Dominion has never named."
 zin_regional_dolon.1.a:0 "Count the ledgers."
 zin_regional_dolon.1.b:0 "Feast the salt-lords."
 zin_regional_dolon.1.d:0 "The salt-lords gather in the counting-house, with ledgers open and pens ready. Morvath enters, takes his seat and asks what is to be counted first."
 zin_regional_dolon.1.t:0 "The Court of the Dead Sea"
 zin_regional_dolon.2.a:0 "Wait and watch."
 zin_regional_dolon.2.d:0 "The black seals have stopped arriving, and the galleys wait in harbour for an order that does not come. What remains of the master of Nafeher, no one living can say."
 zin_regional_dolon.2.t:0 "Silence on the Dead Sea"
