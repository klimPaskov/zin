l_english:
 zin_regional_alerhia_aid_the_elder_groves:0 "Aid the Elder Groves"
 zin_regional_alerhia_aid_the_elder_groves_desc:0 "When the eastern host lands on the elven shore, Alerhia's warden-king sends word that he will stand with those it attacks. His treasury pays for the courage."
 zin_regional_alerhia_bargain_resented:0 "Alerhia Took Both Purses"
 zin_regional_alerhia_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_alerhia_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_alerhia_close_the_houses:0 "Close the Houses"
 zin_regional_alerhia_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_alerhia_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_alerhia_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_alerhia_court_of_alerhan:0 "The Court of King Alerhan"
 zin_regional_alerhia_court_of_alerhan_desc:0 "The king sits under ochre and turquoise hangings and hears every petition in person. A court that listens learns who is lying."
 zin_regional_alerhia_court_of_alerhan_spirit:0 "The Court of King Alerhan"
 zin_regional_alerhia_court_of_alerhan_spirit_desc:0 "Turquoise and ochre hangings fill the hall where Alerhan III hears his lords. Petitioners come from the dunes and the rift coast and leave with answers."
 zin_regional_alerhia_customs_of_alerhia:0 "The Customs of Alerhia"
 zin_regional_alerhia_customs_of_alerhia_desc:0 "The tariff is written on bronze and fixed to the gate, so that no toll-keeper can raise it without the king knowing. Merchants trade where the rules are plain."
 zin_regional_alerhia_customs_of_alerhia_spirit:0 "The Customs of Alerhia"
 zin_regional_alerhia_customs_of_alerhia_spirit_desc:0 "A written tariff hangs on every gate, and the toll-keepers answer to the king alone. Merchants grumble at the price and trust the count."
 zin_regional_alerhia_diggers_of_wells:0 "Diggers of Wells"
 zin_regional_alerhia_diggers_of_wells_desc:0 "Teams of well-diggers travel the dry roads with ropes, buckets and divining rods. A well takes a season to sink and saves a hundred lives in the next drought."
 zin_regional_alerhia_dune_riders:0 "Riders of the Dunes"
 zin_regional_alerhia_dune_riders_desc:0 "Camel and horse riders cross a day's sand in a night."
 zin_regional_alerhia_eastern_oath:0 "Oath to the King in the East"
 zin_regional_alerhia_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_alerhia_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_alerhia_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_alerhia_ferries_to_zilin:0 "Ferries to Zilin"
 zin_regional_alerhia_ferries_to_zilin_desc:0 "Flat-bottomed ferries carry the faithful across the rift to the Deliverer's hermitage in the Zilin Hills. The temples on the waterfront grow rich on the traffic and generous with their thanks."
 zin_regional_alerhia_ferries_to_zilin_tip_1:0 "Pilgrims cross from our quays to the Deliverer's hermitage."
 zin_regional_alerhia_free_crown_court:0 "A Free Crown"
 zin_regional_alerhia_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_alerhia_generous_friends:0 "The Generous Friends"
 zin_regional_alerhia_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_alerhia_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_alerhia_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_alerhia_greatest_court:0 "The Greatest Court of the East"
 zin_regional_alerhia_greatest_court_desc:0 "No hall in the East seats so many kings' envoys at once. The Rift Crown receives them all and keeps the greater share of every secret."
 zin_regional_alerhia_harbour_forts_of_the_rift:0 "Harbour Forts of the Rift"
 zin_regional_alerhia_harbour_forts_of_the_rift_desc:0 "The moles are crowned with towers and chains, so that a hostile fleet must pass under the king's eye. Wardens learn every cry of the gulls and every mast on the horizon."
 zin_regional_alerhia_healing_houses:0 "Houses of Healing"
 zin_regional_alerhia_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_alerhia_houses_of_healing:0 "Houses of Healing"
 zin_regional_alerhia_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_alerhia_into_the_deep_sand:0 "Into the Deep Sand"
 zin_regional_alerhia_into_the_deep_sand_desc:0 "Beyond the farthest well the dunes run on, and no caravan has come back from their end. A scouting party of [ROOT.GetName] loads its camels and goes to see how far the desert goes."
 zin_regional_alerhia_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_alerhia_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_alerhia_keep_the_ports_open:0 "Keep the Ports Open"
 zin_regional_alerhia_keep_the_ports_open_desc:0 "Alerhia's quays take every flag and every cargo, and the harbour dues stay fixed through the worst of the news. A kingdom that stays open is a kingdom that stays rich."
 zin_regional_alerhia_let_the_roads_bid:0 "Let the Roads Bid"
 zin_regional_alerhia_let_the_roads_bid_desc:0 "The king sets two chairs in his hall and names no favourite. Each power may name its price, and Alerhia keeps its freedom for as long as the bidding lasts."
 zin_regional_alerhia_levies_for_the_host:0 "Levies for the Host"
 zin_regional_alerhia_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_alerhia_lord_of_far_shore:0 "Lord of the Far Shore"
 zin_regional_alerhia_lord_of_far_shore_desc:0 "Alerhia holds towns on the elven coast, and its king sits among them as a lord among lords. The treasury has not yet learned to be modest about it."
 zin_regional_alerhia_lord_of_the_crossing:0 "Lord of the Crossing"
 zin_regional_alerhia_lord_of_the_crossing_desc:0 "If the coalition forms, Alerhia will have the harbours, the steersmen and the heaviest court. A king who leads the crossing leads the whole venture."
 zin_regional_alerhia_lord_of_the_rift_shores:0 "Lord of the Rift Shores"
 zin_regional_alerhia_lord_of_the_rift_shores_desc:0 "Towns on the far coast now fly the Rift Crown's banner. The king rules them from the capital and learns how far a letter can travel in a season."
 zin_regional_alerhia_lords_of_the_desert_half:0 "Lords of the Desert Half"
 zin_regional_alerhia_lords_of_the_desert_half_desc:0 "The southern half of the realm is ruled by lords who rarely see the capital. The king sends them gifts, banners and tax-collectors, in that order, and they send back riders."
 zin_regional_alerhia_master_of_the_rift_sea:0 "Master of the Rift Sea"
 zin_regional_alerhia_master_of_the_rift_sea_desc:0 "No ship crosses the narrow sea without Alerhia knowing of it. The king's admirals have charted both coasts and have begun to name the winds."
 zin_regional_alerhia_muster_for_the_crossing:0 "Muster for the Crossing"
 zin_regional_alerhia_muster_for_the_crossing_desc:0 "Banners gather at the quays and the lords of the dunes bring their riders to the water. The muster rolls are the longest the court has ever written."
 zin_regional_alerhia_oasis_gardens:0 "Oasis Gardens"
 zin_regional_alerhia_oasis_gardens_desc:0 "Date palms, pomegranates and small plots of barley ring the old springs of [ROOT.GetName]. In the middle of a hundred miles of dust, the smell of green is the court's greatest luxury."
 zin_regional_alerhia_oasis_gardens_spirit:0 "Oasis Gardens"
 zin_regional_alerhia_oasis_gardens_spirit_desc:0 "Date palms and barley ring the old springs, and green is the greatest luxury."
 zin_regional_alerhia_open_ports:0 "The Open Ports"
 zin_regional_alerhia_open_ports_desc:0 "Alerhia's quays stay open to every flag, and the harbour dues are fair and fixed. Ships from both shores prefer them to any other."
 zin_regional_alerhia_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_alerhia_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_alerhia_own_counsel:0 "Our Own Counsel"
 zin_regional_alerhia_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_alerhia_pilgrim_tolls:0 "The Pilgrim Tolls"
 zin_regional_alerhia_pilgrim_tolls_desc:0 "Every pilgrim who sails for the hermitage pays a small coin at the quay. The coins are many, and the harbour masters have learned to count them quickly."
 zin_regional_alerhia_question_of_the_east:0 "The Question of the East"
 zin_regional_alerhia_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_alerhia_riders_of_the_dunes:0 "Riders of the Dunes"
 zin_regional_alerhia_riders_of_the_dunes_desc:0 "Camel and horse riders of the desert know the dunes the way sailors know the sea. They cross a day's sand in a night and appear at a well before the enemy has found the road."
 zin_regional_alerhia_rift_ambition:0 "The Rift Calls"
 zin_regional_alerhia_rift_ambition_desc:0 "The court has looked across the water and liked what it saw. Captains drill with a far shore in mind."
 zin_regional_alerhia_rift_sea_masters:0 "Masters of the Rift Sea"
 zin_regional_alerhia_rift_sea_masters_desc:0 "Alerhia's steersmen know every current of the narrow sea and every shoal of both shores. Few crews dare to race them."
 zin_regional_alerhia_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_alerhia_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_alerhia_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_alerhia_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_alerhia_the_bankers_offer:0 "The Bankers' Offer"
 zin_regional_alerhia_the_bankers_offer_desc:0 "Postondoroth offers credit, ledgers and a place at the counting-table. The loans are generous, and the books are long."
 zin_regional_alerhia_the_crossing_of_the_rift:0 "The Crossing of the Rift"
 zin_regional_alerhia_the_crossing_of_the_rift_desc:0 "The fleet sails at dawn with the host aboard, and the steersmen steer by the old stars. What lies on the far shore has been argued about for a year."
 zin_regional_alerhia_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_alerhia_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_alerhia_the_dry_roads:0 "The Dry Roads"
 zin_regional_alerhia_the_dry_roads_desc:0 "South of the last green hills the road runs through sand and stone, and every drop of water has a name. The court of [ROOT.GetName] counts its wells and sends surveyors to look for more."
 zin_regional_alerhia_the_gold_road_gate:0 "The Gold Road Gate"
 zin_regional_alerhia_the_gold_road_gate_desc:0 "A new gate of dressed stone closes the Gold Road at the capital. Caravans pass beneath its arch, and every wagon is marked and counted."
 zin_regional_alerhia_the_greatest_court_of_the_east:0 "The Greatest Court of the East"
 zin_regional_alerhia_the_greatest_court_of_the_east_desc:0 "Envoys from every crown of the East now crowd Alerhia's hall, and the king receives them with the care of a man who knows he is watched. The Rift Crown is spoken of from Furvior to the southern sands."
 zin_regional_alerhia_the_kings_road_tax:0 "The King's Road Tax"
 zin_regional_alerhia_the_kings_road_tax_desc:0 "Both great roads end at Alerhia's gates, and everything that arrives pays. A fixed tariff and a counting-house on the Gold Road make the payment orderly."
 zin_regional_alerhia_the_mountain_marches:0 "The Mountain Marches"
 zin_regional_alerhia_the_mountain_marches_desc:0 "The hills behind the capital hold narrow passes that no army has forced in living memory. The king mends their walls and posts a warden in each."
 zin_regional_alerhia_the_pilgrim_ports:0 "The Pilgrim Ports"
 zin_regional_alerhia_the_pilgrim_ports_desc:0 "Pilgrims by the thousand come to Alerhia's quays for the crossing to the hermitage. The harbour masters widen the moles and hang lanterns on every pier."
 zin_regional_alerhia_the_question_of_the_rift:0 "The Question of the Rift"
 zin_regional_alerhia_the_question_of_the_rift_desc:0 "Envoys have begun to speak of rich, weak lands across the water, and of kings who rule them poorly. The court listens, and a map is unrolled on the long table."
 zin_regional_alerhia_the_riders_offer:0 "The Riders' Offer"
 zin_regional_alerhia_the_riders_offer_desc:0 "Furvior offers escorts for every caravan and a place at the riders' fires. The price is that the Rift Road should speak with Furvior's voice."
 zin_regional_alerhia_the_rift_crown:0 "The Rift Crown"
 zin_regional_alerhia_the_rift_crown_desc:0 "Alerhan's forebears took the narrow crown of rift pearls when the desert lords first agreed to follow one king. His court is rich, proud and courted from two roads at once."
 zin_regional_alerhia_the_rift_crown_waits:0 "The Rift Crown Waits"
 zin_regional_alerhia_the_rift_crown_waits_desc:0 "The king writes to neither side and sends the envoys home with gifts. A throne that waits is a throne that keeps its options."
 zin_regional_alerhia_the_rift_fleet:0 "The Rift Fleet"
 zin_regional_alerhia_the_rift_fleet_desc:0 "Oared galleys with shallow keels suit the narrow sea better than any deep-water hull. The yards on the east shore turn out a pair each season."
 zin_regional_alerhia_traders_of_the_elder_groves:0 "Traders of the Elder Groves"
 zin_regional_alerhia_traders_of_the_elder_groves_desc:0 "Across the water the elves of the groves pay well for desert salt, dyed cloth and lamp wicks. A steady trade is the best argument for a lasting peace."
 zin_regional_alerhia_wait_upon_events:0 "Wait Upon Events"
 zin_regional_alerhia_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_alerhia_warden_of_the_rift:0 "Warden of the Rift"
 zin_regional_alerhia_warden_of_the_rift_desc:0 "The elves across the water have done Alerhia no harm, and their groves are older than the Rift Crown. A king who guards that shore guards his own name."
 zin_regional_alerhia_watch_the_quays:0 "Watch the Quays"
 zin_regional_alerhia_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_alerhia_watchful_quays:0 "Watchful Quays"
 zin_regional_alerhia_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_alerhia_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_alerhia_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_alerhia_when_the_king_falls:0 "When the King Falls"
 zin_regional_alerhia_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_alerhia_where_two_roads_end:0 "Where Two Roads End"
 zin_regional_alerhia_where_two_roads_end_desc:0 "The Gold Road ends at the capital and the Rift Road at the harbours. Furvior's riders and Postondoroth's bankers each assume Alerhia is theirs; the king is not so sure."
 zin_regional_alerhia_where_two_roads_end_tip_1:0 "Both great roads of the south end at our gates."
 zin_regional_alerhia.1.a:0 "Let them both wait"
 zin_regional_alerhia.1.b:0 "Furvior's riders first"
 zin_regional_alerhia.1.c:0 "Postondoroth's bankers first"
 zin_regional_alerhia.1.d:0 "Riders from Furvior and bankers from Postondoroth sit in the same antechamber, each pretending not to see the other. King Alerhan has not yet decided whom to receive first, and the whole court is watching his door."
 zin_regional_alerhia.1.t:0 "The Rift Crown"
 zin_regional_alerhia.2.a:0 "Take both and promise nothing"
 zin_regional_alerhia.2.b:0 "Take Furvior's gold"
 zin_regional_alerhia.2.c:0 "Take Postondoroth's gold"
 zin_regional_alerhia.2.d:0 "Each great road has named a price for Alerhia's friendship, and the king's treasurers have counted both twice. Whoever takes the gold takes also a rival, but the court can keep its freedom if it is careful with its promises."
 zin_regional_alerhia.2.t:0 "The Roads Bid for Alerhia"
