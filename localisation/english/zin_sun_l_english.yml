l_english:
 zin_opinion_warning_dismissed:0 "Warning Dismissed"
 zin_sun_ask_sun_guard:0 "Ask the Sun Guard to Watch Gala's Borders"
 zin_sun_ask_sun_guard_desc:0 "Gala's levy is a few hundred spears. When the dark grows, Lorien asks the Speaker of the Noon Council to put the Sun Guard on Gala's borders, and spends the weight of his word to do it. The Speaker may say no."
 zin_sun_ask_timber:0 "Ask the Noon Council for Timber and Ships"
 zin_sun_ask_timber_desc:0 "Gala is one state with little wood. When Lorien asks, the foresters of the sun realms float seasoned timber down their rivers to Gala's yards. Lorien does not ask often, because each asking uses up some of the trust that makes the next one possible."
 zin_sun_audience:0 "Lorien's Audience"
 zin_sun_audience_desc:0 "Receive an envoy in the old courtyard. The King speaks of Dardan and of the harvests of the south, and the guest goes home having been listened to. Gala's counsel rises, and the guest's court thinks well of Gala."
 zin_sun_cost_counsel_10:0 "§Y10§! Counsel"
 zin_sun_cost_counsel_10_blocked:0 "§R10§! Counsel"
 zin_sun_cost_counsel_10_tooltip:0 "Costs 10 of Gala's counsel, the weight Lorien's word carries in the courts of the south."
 zin_sun_cost_counsel_20:0 "§Y20§! Counsel"
 zin_sun_cost_counsel_20_blocked:0 "§R20§! Counsel"
 zin_sun_cost_counsel_20_tooltip:0 "Costs 20 of Gala's counsel, the weight Lorien's word carries in the courts of the south."
 zin_sun_cost_counsel_30:0 "§Y30§! Counsel"
 zin_sun_cost_counsel_30_blocked:0 "§R30§! Counsel"
 zin_sun_cost_counsel_30_tooltip:0 "Costs 30 of Gala's counsel, the weight Lorien's word carries in the courts of the south."
 zin_sun_council:0 "The Noon Council"
 zin_sun_council_desc:0 "The Sunhot realms meet under the presidency of the strongest among them. They do not rule one another; they agree, when they agree, to stand together. Concord now stands at §Y[?global.zin_sun_concord|0]§! of a hundred."
 zin_sun_council_timber:0 "Timber From the Sun Realms"
 zin_sun_council_timber_desc:0 "The foresters of the Noon Council float seasoned timber down the rivers to Gala's yards."
 zin_sun_counsel:0 "Lorien's Counsel"
 zin_sun_counsel_desc:0 "The King of Gala fought at Dardan in the First Age, and the south still listens when he speaks. His word is a store of trust: every audience adds to it, every request spends some. Counsel now stands at §Y[?zin_gala_counsel|0]§! of a hundred."
 zin_sun_heeded_east:0 "Heeded: The East"
 zin_sun_heeded_east_desc:0 "Gala's warning of sails on the narrow sea and gold in eastern halls was heeded. The border hosts stay ready, and the people have been told why."
 zin_sun_heeded_north:0 "Heeded: The North"
 zin_sun_heeded_north_desc:0 "Gala's warning of black sails and restless dead was heeded. The coasts are watched and the sea forts are dug deep."
 zin_sun_heeded_seas:0 "Heeded: The Seas"
 zin_sun_heeded_seas_desc:0 "Gala's warning of a great fleet on the wide sea was heeded. The harbours keep watchers day and night, and the sea forts are manned."
 zin_sun_heeded_south:0 "Heeded: The South"
 zin_sun_heeded_south_desc:0 "Gala's warning of banners in the southern haze was heeded. The defenders hold their ground, and dig in sooner."
 zin_sun_king_fallen:0 "The King Has Fallen"
 zin_sun_king_fallen_desc:0 "Lorien is dead. Gala mourns, angry and uncertain, and the court does not yet know what it will be without him."
 zin_sun_kings_ride:0 "The King's Ride"
 zin_sun_kings_ride_desc:0 "Lorien rides north with his lords, and all who ride beside him fight as they did at Dardan."
 zin_sun_look_mirror:0 "Look Into the Mirror"
 zin_sun_look_mirror_desc:0 "Lorien and the Keeper of the Mirror stand at the basin and ask the water what it shows. It answers only truly, and only a little at a time. If nothing is stirring that the water can read, it shows rain on still water and the cost is halved."
 zin_sun_mirror:0 "The Mirror of First Rain"
 zin_sun_mirror_desc:0 "In an old courtyard of Gala a spring lies in a stone basin. Lorien reads it, and it answers truly about what was and unsurely about what may be. Each vision clouds the water; the months clear it again. Clarity now stands at §Y[?global.zin_mirror_clarity|0]§! of a hundred, and the ancient lords who will ride with the King number §Y[?zin_gala_old_lords|0]§!."
 zin_sun_mourning:0 "Mourning for Lorien"
 zin_sun_mourning_desc:0 "The elves have heard that the King of Gala is dead. They keep the silent days."
 zin_sun_need_counsel_40:0 "Gala holds at least §Y40§! counsel: the Council grants this only to a king whose word still carries weight."
 zin_sun_need_counsel_60:0 "Gala holds at least §Y60§! counsel: the Council grants this only to a king whose word still carries great weight."
 zin_sun_old_lords:0 "Send Word to the Old Lords"
 zin_sun_old_lords_desc:0 "There are lords older than any kingdom, scattered since Dardan, who answered Lorien once and may answer again. A rider goes to find one. The journey takes a year, and not every rider returns."
 zin_sun_old_powers_stand_1:0 "The Old Powers Stand"
 zin_sun_old_powers_stand_1_desc:0 "One of the old lords stands behind the line, and the living find that they do not break as soon as they feared."
 zin_sun_old_powers_stand_2:0 "The Old Powers Stand"
 zin_sun_old_powers_stand_2_desc:0 "Several old lords and spirits stand in the line beside the living, and the line holds where it should have bent."
 zin_sun_old_powers_stand_3:0 "The Old Powers Stand"
 zin_sun_old_powers_stand_3_desc:0 "The oldest lords and spirits of the world stand with the living, and they have not come to restore any crown: they have come because Zol's victory would end the freedom of every people."
 zin_sun_raise_league:0 "Raise the Noon League"
 zin_sun_raise_league_desc:0 "The sun realms are bound by custom, not by oath. When strangers hold their halls, or the Dark grows too great to wait on, the Speaker of the Noon Council may ask them to swear: to defend the Lands of the Sun, and nothing beyond them."
 zin_sun_send_word:0 "Send Word of the Vision"
 zin_sun_send_word_desc:0 "Send envoys to a court the water has spoken of. Gala does not say it will be so; it says what the water showed and leaves the court to judge. A court that heeds the warning is better prepared, but fear can do a prophecy's work for it."
 zin_sun_send_word_free:0 "Send Word of the Vision"
 zin_sun_send_word_free_desc:0 "Send envoys to a court the water has spoken of. Gala does not say it will be so; it says what the water showed and leaves the court to judge. A court that heeds the warning is better prepared, but fear can do a prophecy's work for it."
 zin_sun_send_word_half:0 "Send Word of the Vision"
 zin_sun_send_word_half_desc:0 "Send envoys to a court the water has spoken of. Gala does not say it will be so; it says what the water showed and leaves the court to judge. A court that heeds the warning is better prepared, but fear can do a prophecy's work for it."
 zin_sun_speak_quarrel:0 "Speak for a Sunhot Quarrel"
 zin_sun_speak_quarrel_desc:0 "Two Sunhot realms are at odds, as neighbours who share a river will be. The King of Gala speaks to both of them, and they hear him, if not yet each other. Their regard for one another mends, and the sun realms close ranks."
 zin_sun.10.a:0 "The water has spoken."
 zin_sun.10.d_centre:0 "A golden hall, and a cup passed from hand to hand along a long table. The water did not show whose hand. The Keeper said afterwards that the cup was the only thing in the picture that was not afraid."
 zin_sun.10.d_east:0 "Sails gathered on a narrow sea, and in a hall beyond it gold changed hands across a table. The faces were turned away. Rain broke the picture before anyone could say whose hall it was."
 zin_sun.10.d_north:0 "Black sails moved among northern islands, more than any fisherman had counted. On a pale shore the shapes of the fallen did not lie where they fell. Then the ripples took the picture, and the water was only water."
 zin_sun.10.d_rain:0 "The water was still. A little rain fell on it, and the rings spread and met and were gone. The Keeper of the Mirror bowed her head: the spring had nothing to say today, and Lorien did not ask it twice."
 zin_sun.10.d_seas:0 "A wide grey sea, and on it ships beyond counting, every prow set to the east. No harbour showed, and no flag that Lorien knew. The water closed over it like a hand."
 zin_sun.10.d_south:0 "Banners stood in heat-haze above a southern road, row on row, and behind them the smoke of some great forge. At a gate in the south a few spears held a pass. The image sank before the Keeper could read the colours."
 zin_sun.10.t:0 "The Water Stills"
 zin_sun.20.a:0 "Old elves see ghosts in water."
 zin_sun.20.b:0 "Heed it."
 zin_sun.20.d_centre:0 "Envoys from Gala ask to speak without the court, and what they have to say is not pleasant to hear in a golden hall. The King of the Gala elves has looked into his spring, they say, and the water showed a cup passed from hand to hand at a long table. It did not show whose hand. They do not say it will be so. They say only that Lorien thought it worth a rider's journey."
 zin_sun.20.d_east:0 "Envoys from Gala ask to speak without the court. The King of the Gala elves has looked into his spring, they say, and the water showed sails gathering on a narrow sea and gold changing hands in eastern halls. They do not say it will be so. They say only that Lorien thought it worth a rider's journey. Old elves see many things in water; whether to believe them is for us to say."
 zin_sun.20.d_north:0 "Envoys from Gala ask to speak without the court. The King of the Gala elves has looked into his spring, they say, and the water showed black sails among the northern islands and dead that would not lie still. They do not say it will be so. They say only that Lorien thought it worth a rider's journey. Old elves see many things in water; whether to believe them is for us to say."
 zin_sun.20.d_seas:0 "Envoys from Gala ask to speak without the court. The King of the Gala elves has looked into his spring, they say, and the water showed a great fleet on the wide sea, all of it sailing east. They do not say it will be so. They say only that Lorien thought it worth a rider's journey. Old elves see many things in water; whether to believe them is for us to say."
 zin_sun.20.d_south:0 "Envoys from Gala ask to speak without the court. The King of the Gala elves has looked into his spring, they say, and the water showed banners in the southern haze and a gate held by too few. They do not say it will be so. They say only that Lorien thought it worth a rider's journey. Old elves see many things in water; whether to believe them is for us to say."
 zin_sun.20.t:0 "A Warning From Gala"
 zin_sun.21.a:0 "The water must be read with more care."
 zin_sun.21.d:0 "Word of Gala's warning has gone further than the envoys meant. [FROM.GetNameDef] has begun to arm against what the water showed, and its neighbours have begun to arm against [FROM.GetNameDef]. Lorien looks at the basin a long time. He said once that a prophecy heeded too hard can be the very hand that pushes, and here is the hand."
 zin_sun.21.t:0 "Fear Does the Prophecy's Work"
 zin_sun.30.a:0 "The sun stands guard."
 zin_sun.30.d:0 "The Sunhot realms have sworn the Noon League under the Speaker of the Noon Council. Every hall of the sun is asked to stand beside it, and none is asked to kneel. The League is sworn to defend the Lands of the Sun, and nothing beyond them."
 zin_sun.30.t:0 "The Noon League Is Raised"
 zin_sun.31.a:0 "Keep apart."
 zin_sun.31.b:0 "Join the League."
 zin_sun.31.d:0 "The Speaker of the Noon Council has sent riders to every hall of the sun. The Noon League is raised, and a seat is kept at its table. Those who join defend their own region and take back what has been lost; they march nowhere else. Those who keep apart owe nothing, and will not be thought the worse of."
 zin_sun.31.t:0 "A Call From the Noon Council"
 zin_sun.35.a:0 "Until the courtyard is free again."
 zin_sun.35.d_gala:0 "Foreign soldiers hold the old courtyard. The spring has not dried; it has gone silent, as water will before those who came with swords. Lorien does not say what he thinks. The Keeper of the Mirror sits by the basin and waits for the courtyard to be free again."
 zin_sun.35.d_occupier:0 "Our soldiers hold the courtyard of an elven court, and in it a spring in a stone basin. The soldiers say it gives no answer to anyone. They have stopped asking. The elves say it will answer again when the courtyard is theirs."
 zin_sun.35.t:0 "The Mirror Is Stilled"
 zin_sun.5.a:0 "A king who remembers."
 zin_sun.5.d:0 "Our envoy came back from Gala quieter than he went. The King of the Gala elves had received him beside a stone basin in an old courtyard, spoken of Dardan as men speak of weather long past, and asked after the harvest. He asked nothing else. The envoy says that is the strange part: he was asked nothing, and he told everything."
 zin_sun.5.t:0 "An Audience With the King"
 zin_sun.6.a:0 "The Sun Guard will watch."
 zin_sun.6.b:0 "We cannot spare the spears."
 zin_sun.6.d:0 "Riders from Gala stand before the Noon Council. The King's court is small, they say: one state, a few hundred spears, and a spring in a courtyard. The Dark is not small. They ask that the Sun Guard keep watch on Gala's borders, and they ask it as one neighbour asks another. The Speaker of the Council must answer."
 zin_sun.6.t:0 "Gala Asks the Sun Guard"
