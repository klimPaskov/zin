l_english:
 zin_regional_dreson_ambush_in_the_reeds:0 "Ambush in the Reeds"
 zin_regional_dreson_ambush_in_the_reeds_desc:0 "An enemy column wades into the reeds and finds, too late, that the reeds are full of spears. A dozen survivors walk out the next morning, and none of them can say where the rest went."
 zin_regional_dreson_answer_the_moot:0 "Answer the Moot"
 zin_regional_dreson_answer_the_moot_desc:0 "A call has come from the Moot, carried by a rider who got lost twice in the fens. Dresk sends the council's answer back by a boy who has never been lost."
 zin_regional_dreson_bog_iron:0 "Bog-Iron"
 zin_regional_dreson_bog_iron_desc:0 "Rust-red iron is raked from the fen floor and smelted in peat furnaces. It is soft and brittle, but there is plenty of it, and Dreson learns to make it last."
 zin_regional_dreson_call_the_moot_to_the_fens:0 "Call the Moot to the Fens"
 zin_regional_dreson_call_the_moot_to_the_fens_desc:0 "Fen-riders carry a bundle of black reeds to every Moot member, the sign of a hold that is under attack. The answering drums begin to sound from far across the Dark Lands."
 zin_regional_dreson_coast_beacons_of_dreson:0 "Coast Beacons"
 zin_regional_dreson_coast_beacons_of_dreson_desc:0 "Beacon-towers of black pine rise on the creek-heads, each with a pile of pitch-soaked reed and a watchman. At dusk the fens glow with a ring of fires."
 zin_regional_dreson_dresks_reed_council:0 "Dresk's Reed-Council"
 zin_regional_dreson_dresks_reed_council_desc:0 "The council of the reed-islands meets in the hall on stormy nights, when the causeway is under water and nobody can leave. Old Moss-Eye speaks last, and her word is the one that is kept."
 zin_regional_dreson_dresons_answer:0 "Dreson's Answer"
 zin_regional_dreson_dresons_answer_desc:0 "The reed-council answers the Warking at last, in a single sentence carved on a piece of peeled willow and dropped in the river. It floats north, and Cocanoor reads it."
 zin_regional_dreson_drown_their_gifts:0 "Drown Their Gifts"
 zin_regional_dreson_drown_their_gifts_desc:0 "The strangers' gifts are tipped, chest by chest, into the deepest pool in the fens. The strangers are rowed back to the sea, and nobody offers them a towel."
 zin_regional_dreson_drowned_road:0 "The Drowned Road"
 zin_regional_dreson_drowned_road_desc:0 "The hidden paths are drowned, the causeways broken and the guides sent home. Only Dreson's own folk can cross the fens now, and they cross only when they wish."
 zin_regional_dreson_eel_markets:0 "Eel Markets"
 zin_regional_dreson_eel_markets_desc:0 "Smoked eel is bundled on withies and sold at the fairs of three hold-lands. The traders pay in silver and complain about the smell."
 zin_regional_dreson_eel_markets_spirit:0 "Eel Markets"
 zin_regional_dreson_eel_markets_spirit_desc:0 "Smoked eel is sold in every town of the Dark Lands, strung on withies and carried by the dozen. Dreson is poor, but it is never hungry."
 zin_regional_dreson_envoys_in_the_reeds:0 "Envoys in the Reeds"
 zin_regional_dreson_envoys_in_the_reeds_desc:0 "A boat from the south comes up the creek, with strangers who do not like the water and gifts wrapped against the damp. The reed-council meets them on a landing and says very little."
 zin_regional_dreson_eyes_in_the_reeds:0 "Eyes in the Reeds"
 zin_regional_dreson_eyes_in_the_reeds_desc:0 "Whichever answer was given, the reed-boys now watch the water. They sit in the reeds from dawn to dusk, counting boats and listening for hooves."
 zin_regional_dreson_fen_fishers:0 "The Fen-Fishers' Watch"
 zin_regional_dreson_fen_fishers_desc:0 "Fishers in reed-boats watch the coastal creeks by night, with horns and a stock of tarred brands. Nothing slides in on the tide unseen."
 zin_regional_dreson_fen_fishers_watch:0 "The Fen-Fishers' Watch"
 zin_regional_dreson_fen_fishers_watch_desc:0 "Fishermen are paid to watch the coast by night, with a horn and a bundle of pitch-brands. At the first strange sail the creeks light up."
 zin_regional_dreson_fen_kin:0 "Kin of the Fens"
 zin_regional_dreson_fen_law:0 "Fen Law"
 zin_regional_dreson_fen_law_desc:0 "The council sets down the law of the fens on peeled willow-wands, bound in bundles and kept in the hall's roof. Anyone may read it, and no one may take it away."
 zin_regional_dreson_fen_law_spirit:0 "Fen Law"
 zin_regional_dreson_fen_law_spirit_desc:0 "The law of the fens is simple: a man may walk where he knows, and a stranger may not. The reed-council writes it on peeled willow-wands and lets the rain wash off the rest."
 zin_regional_dreson_fen_roads:0 "Causeways"
 zin_regional_dreson_fen_roads_desc:0 "Causeways of faggots and clay are laid across the worst of the mire. Only Dreson knows where they begin and where they end."
 zin_regional_dreson_fen_scouts:0 "Moot Scouts"
 zin_regional_dreson_fen_scouts_desc:0 "Fen-folk who know every causeway go ahead of the Moot's hosts, marking the firm ground with peeled wands. A column that follows them arrives dry."
 zin_regional_dreson_fens_rise:0 "The Fens Rise"
 zin_regional_dreson_fens_rise_desc:0 "The reed-council has called out every man of the hold. The fens are full of hidden spears, and the mist hides all of them."
 zin_regional_dreson_fens_swallow_armies:0 "The Fens Swallow Armies"
 zin_regional_dreson_fens_swallow_armies_desc:0 "Dresk declares that the fens are Dreson's wall, and the wall is lifted: signposts are pulled down and guides sworn to silence. Cocanoor's maps of the fens are already a century out of date."
 zin_regional_dreson_fens_swallow_armies_spirit:0 "The Fens Swallow Armies"
 zin_regional_dreson_fens_swallow_armies_spirit_desc:0 "Roads sink, wagons stick and whole companies vanish into the mist. Armies that enter the fens do not leave them quickly, and many do not leave them at all."
 zin_regional_dreson_gifts_drowned:0 "Gifts Drowned"
 zin_regional_dreson_hidden_paths:0 "Hidden Paths"
 zin_regional_dreson_hidden_paths_desc:0 "A few paths through the fens are known to no one but the hold's own scouts, and these are moved a little every year. A hostile guide is led onto them, and not out."
 zin_regional_dreson_kin_of_the_moot:0 "Kin of the Moot"
 zin_regional_dreson_kin_of_the_moot_desc:0 "Reed-boats carry Dresk's envoys to every free hold in the Dark Lands with a bundle of eels and a plain message: a fen has many neighbours, and Dreson counts them as kin."
 zin_regional_dreson_moot_scouts:0 "Moot Scouts"
 zin_regional_dreson_moot_scouts_desc:0 "Fen-folk who know every causeway go ahead of the Moot's hosts, marking firm ground with peeled wands. A column that follows them arrives dry."
 zin_regional_dreson_no_chains:0 "No Chains in the Fens"
 zin_regional_dreson_no_chains_in_the_fens:0 "No Chains in the Fens"
 zin_regional_dreson_no_chains_in_the_fens_desc:0 "Cocanoor's envoy offers chains of black iron as a gift of friendship. Dresk has them flung into the deepest pool in the fens and invites the envoy to fetch them."
 zin_regional_dreson_peace_in_the_fens:0 "Peace in the Fens"
 zin_regional_dreson_peace_in_the_fens_desc:0 "The war moves on, and the mist settles back over the fens. The reed-council counts the dead, pays the weirs and lets the boats go out again."
 zin_regional_dreson_peat_fires:0 "Peat Fires"
 zin_regional_dreson_peat_fires_desc:0 "Peat is cut from the dry banks, stacked to dry and burned in clay-lined furnaces. It makes a low, red fire that smelts bog-iron better than any wood."
 zin_regional_dreson_reed_and_eel:0 "Reed and Eel"
 zin_regional_dreson_reed_and_eel_desc:0 "Weirs of woven reed are staked across every channel, and the eels come in by the thousand. Reeds are cut for thatch, baskets and boats, and the trade runs all year round."
 zin_regional_dreson_reed_and_eel_spirit:0 "Reed and Eel"
 zin_regional_dreson_reed_and_eel_spirit_desc:0 "Eels from the weirs and reeds from the shallows are Dreson's two crops, and both grow without ploughing. A hold that cannot be starved is a hold that can be stubborn."
 zin_regional_dreson_reed_boats:0 "Reed Boats"
 zin_regional_dreson_reed_boats_desc:0 "Light boats of bundled reed and pitch are launched from the creek-mouths, each carrying a dozen oars and a spear. They are fast, quiet and nearly invisible on the evening tide."
 zin_regional_dreson_reed_eyes:0 "Eyes in the Reeds"
 zin_regional_dreson_reed_eyes_desc:0 "Boys of the fen villages sit in the reeds from dawn to dusk, counting boats and listening for hooves. They are paid in eels and sweets, and they miss nothing."
 zin_regional_dreson_smugglers:0 "Smugglers of the Fens"
 zin_regional_dreson_smugglers_desc:0 "Where the fens meet the sea, a hundred hidden jetties serve a trade that has no ledger. The smugglers are loyal to Dreson, and the profits are its own."
 zin_regional_dreson_smugglers_of_the_fens:0 "Smugglers of the Fens"
 zin_regional_dreson_smugglers_of_the_fens_desc:0 "A hundred hidden jetties serve a trade that has no ledger, and the hold takes a quiet tenth. Dresk does not ask what is carried, and the smugglers do not ask what he does with the silver."
 zin_regional_dreson_southern_coin:0 "Southern Coin"
 zin_regional_dreson_southern_coin_desc:0 "Silver in the strangers' coin is silver all the same, and the fens are poor. Dresk takes it and puts it in the hall's strongbox, and wonders aloud what it will cost."
 zin_regional_dreson_the_drowned_road:0 "The Drowned Road"
 zin_regional_dreson_the_drowned_road_desc:0 "The old causeway is flooded on purpose, and the new ones broken at the middle. Dreson is now an island of firm ground in a sea of mire."
 zin_regional_dreson_the_eel_feasts:0 "The Eel Feasts"
 zin_regional_dreson_the_eel_feasts_desc:0 "At the turn of the season the reed-islands feast on smoked eel, black bread and peat-fire beer. Old feuds are settled over the bones, and new ones begin at the bottom of the jugs."
 zin_regional_dreson_the_fen_hold:0 "The Fen-Hold"
 zin_regional_dreson_the_fen_hold_desc:0 "Chief Dresk's hall stands on black piles above the water, reached by a causeway that only Dreson's own folk can find. From its windows the fens roll out to the horizon, grey, green and very quiet."
 zin_regional_dreson_the_fens_ride_with_the_moot:0 "The Fens Ride with the Moot"
 zin_regional_dreson_the_fens_ride_with_the_moot_desc:0 "The reed-islands send their spearmen to the Moot's muster, carried in rows of bundled-reed boats. They are no cavalry, but they appear where cavalry cannot."
 zin_regional_dreson_the_fens_rise:0 "The Fens Rise"
 zin_regional_dreson_the_fens_rise_desc:0 "The reed-council sounds the horns of the fens, and every island answers. Spearmen slip out of the reeds, and the mist closes behind them."
 zin_regional_dreson_the_reed_crown:0 "The Reed Crown"
 zin_regional_dreson_the_reed_crown_desc:0 "A ring of woven reeds, stiff with pitch, is set on Dresk's head at the midwinter feast. The crown is a joke that nobody laughs at, and a title that nobody dares to mock."
 zin_regional_dreson.1.a:0 "The reed-council debates."
 zin_regional_dreson.1.b:0 "Dresk decides."
 zin_regional_dreson.1.d:0 "The causeway is under a hand's depth of water, and the hall on black piles is cut off for the night. The reed-council sits round the fire, and Dresk waits to see who speaks first."
 zin_regional_dreson.1.t:0 "The Hall on the Water"
 zin_regional_dreson.2.a:0 "Hear them out."
 zin_regional_dreson.2.d:0 "A boat from the south has come up the creek, carrying strangers who do not like the water and gifts wrapped against the damp. They are polite, and they say that they come from Nafeher."
 zin_regional_dreson.2.t:0 "Envoys in the Reeds"
