l_english:
 zin_regional_seite_islands_armed_fishers:0 "The Fishing Fleet Armed"
 zin_regional_seite_islands_armed_fishers_desc:0 "Every boat that works the banks carries spears, nets for fouling an oar and a slinger or two. A fisher who rows to the nets knows how to fight back."
 zin_regional_seite_islands_banks_fleet:0 "The Banks Fleet"
 zin_regional_seite_islands_banks_fleet_desc:0 "The fishing boats that guard the banks are fitted with shields at the rail and a signal lamp at the mast. They are not warships, but they are not defenceless."
 zin_regional_seite_islands_banks_squadron:0 "The Banks Flotilla"
 zin_regional_seite_islands_banks_squadron_desc:0 "The moot's boats sail the banks together in a loose line, hailing each other by lamp. They are many and they are close, and a stranger sees an army."
 zin_regional_seite_islands_boats_for_the_crossing:0 "Boats for the Crossing"
 zin_regional_seite_islands_boats_for_the_crossing_desc:0 "The western host needs small boats for landing and ferrying. The Seite clans have hundreds, and a price for each."
 zin_regional_seite_islands_boats_on_the_banks:0 "Boats on the Banks"
 zin_regional_seite_islands_boats_on_the_banks_desc:0 "More boats are sent to the banks, each with a lookout and a horn. If any hull comes near, the whole fleet hears of it."
 zin_regional_seite_islands_boatwrights:0 "Boatwrights"
 zin_regional_seite_islands_boatwrights_desc:0 "Boatwrights from the four isles are given a common yard and a common supply of timber. They build a better boat in half the time."
 zin_regional_seite_islands_call_on_friends:0 "Call on Friends"
 zin_regional_seite_islands_call_on_friends_desc:0 "The moot sends word to every island with a fleet. They ask for friends, not for arms, and they ask politely."
 zin_regional_seite_islands_charter_watch:0 "The Charter Watch"
 zin_regional_seite_islands_charter_watch_desc:0 "Boats from the Seite Isles join the Charter's patrols. They are small, and quick, and know where the corsairs hide."
 zin_regional_seite_islands_cove_raiders:0 "Cove Raiders"
 zin_regional_seite_islands_cove_raiders_desc:0 "A few of the fishing clans take to raiding in the lean months. The moot pretends not to see, and collects a fifth."
 zin_regional_seite_islands_defy_the_king:0 "Defy the King"
 zin_regional_seite_islands_defy_the_king_desc:0 "The moot answers Nondondor's herald with a single sentence: the banks were fished by our fathers and will be fished by our sons. The king is not asked again."
 zin_regional_seite_islands_drying_racks:0 "Drying Racks"
 zin_regional_seite_islands_drying_racks_desc:0 "Wooden racks line the beaches, hung with split cod and herring. The wind and the sun do the rest, and the clans eat well through the winter."
 zin_regional_seite_islands_elders_of_the_isles:0 "Elders of the Isles"
 zin_regional_seite_islands_elders_of_the_isles_desc:0 "The oldest fisher of each isle sits at the stone with a staff. They have outlived many kings, and they intend to outlive more."
 zin_regional_seite_islands_fishers_for_the_living:0 "Fishers for the Living"
 zin_regional_seite_islands_fishers_for_the_living_desc:0 "The stranger has returned, and the clans remember the ship that once begged a harbour from them. They send their best fishers to the coalition, with nets and spears."
 zin_regional_seite_islands_harbour_for_strangers:0 "A Harbour for Strangers"
 zin_regional_seite_islands_harbour_for_strangers_desc:0 "The moot lets it be known that any ship may beach on the Seite shore. The clans ask for a small gift, and the gift is always given."
 zin_regional_seite_islands_isle_boats:0 "The Isle Boats"
 zin_regional_seite_islands_isle_boats_desc:0 "The long fishing boats are refitted with a second bank of oars and a stronger keel. They are still slow, but they are no longer easy to catch."
 zin_regional_seite_islands_isle_moot_custom:0 "The Moot of the Isles"
 zin_regional_seite_islands_isle_moot_custom_desc:0 "The Seite clans settle every matter at the moot stone, where each fisher has a voice and none a vote that counts for more. It is fair, and it is slow."
 zin_regional_seite_islands_isles_apart:0 "The Isles Keep Apart"
 zin_regional_seite_islands_isles_apart_desc:0 "The Seite clans pull their boats up the beach and mend their nets while the great crowns fight. The moot has said that this war is no concern of theirs."
 zin_regional_seite_islands_join_the_charter:0 "Join the Pupor Charter"
 zin_regional_seite_islands_join_the_charter_desc:0 "The moot votes to sign the Pupor Charter, and the elder's mark is cut on the roll. The clans will keep the lanes and take the chart houses' side."
 zin_regional_seite_islands_moot_stone:0 "The Moot Stone"
 zin_regional_seite_islands_moot_stone_desc:0 "The moot stone is carved with the names of the clans and set on a new platform. Elder Tamsa speaks from it, and fewer arguments go unfinished."
 zin_regional_seite_islands_our_fathers_banks:0 "Our Fathers' Banks"
 zin_regional_seite_islands_our_fathers_banks_desc:0 "The southern banks have been fished by the Seite clans since before any king claimed them. The moot says so, in its own words, at the start of every season."
 zin_regional_seite_islands_seek_the_brokers:0 "Seek the Brokers' Judgment"
 zin_regional_seite_islands_seek_the_brokers_desc:0 "The moot sends a shell-bound petition to Raerby, asking its captains to judge. It would sooner lose a hearing than win a war."
 zin_regional_seite_islands_stores_of_salt_fish:0 "Stores of Salt Fish"
 zin_regional_seite_islands_stores_of_salt_fish_desc:0 "Barrels of salt-fish are set aside in the moot-house. In a hard year, each clan may draw what it needs, and each must give back in the next."
 zin_regional_seite_islands_the_banks_accord_kept:0 "The Banks Accord"
 zin_regional_seite_islands_the_banks_accord_kept_desc:0 "The banks are shared, and a mark is cut in the moot stone to say so. The Seite clans keep their word, and expect the king to keep his."
 zin_regional_seite_islands_the_banks_fleet:0 "The Banks Fleet"
 zin_regional_seite_islands_the_banks_fleet_desc:0 "The moot has the fishing boats fitted out for a fight. They are still fishing boats, and they will fish whenever there is no one to fight."
 zin_regional_seite_islands_the_banks_squadron:0 "The Banks Flotilla"
 zin_regional_seite_islands_the_banks_squadron_desc:0 "The moot's boats sail the banks together, hailing each other by lamp and horn. A stranger sees a fleet, and is not far wrong."
 zin_regional_seite_islands_the_fishers_voice:0 "The Fishers' Voice"
 zin_regional_seite_islands_the_fishers_voice_desc:0 "Any fisher may stand at the stone and speak for a count of a hundred. The moot listens, even to those who have nothing to say."
 zin_regional_seite_islands_the_fishing_fleet_armed:0 "The Fishing Fleet Armed"
 zin_regional_seite_islands_the_fishing_fleet_armed_desc:0 "Every boat that goes to the banks now carries spears and a heavy net. The nets are cast over an enemy's oars, and the spears do the rest."
 zin_regional_seite_islands_the_free_coves:0 "The Free Coves"
 zin_regional_seite_islands_the_free_coves_desc:0 "The moot opens its quiet coves to any captain who wishes to rest. They ask no questions, and take a tithe of what comes ashore."
 zin_regional_seite_islands_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_seite_islands_the_great_war_at_sea_desc:0 "The great fleets have put to sea. The moot meets on the beach at night, and the question before it is whether the isles will stay or sail."
 zin_regional_seite_islands_the_isle_harbours:0 "The Isle Harbours"
 zin_regional_seite_islands_the_isle_harbours_desc:0 "The best coves of the four isles are cleared of rock and given stone quays. A boat may now land its catch at any state of the tide."
 zin_regional_seite_islands_the_isle_market:0 "The Isle Market"
 zin_regional_seite_islands_the_isle_market_desc:0 "The isles hold one market, on the beach of the main isle, at the end of each season. Everything from sealskin to fishhooks is for sale."
 zin_regional_seite_islands_the_isle_moot:0 "The Isle Moot"
 zin_regional_seite_islands_the_isle_moot_desc:0 "The four isles are governed by a moot of fishing clans that meets at a standing stone. Elder Tamsa speaks for it, and decisions are made only when every clan has been heard."
 zin_regional_seite_islands_the_isles_keep_apart:0 "The Isles Keep Apart"
 zin_regional_seite_islands_the_isles_keep_apart_desc:0 "The moot decides that the isles will mend their nets and watch the sea. They have been left alone before, and they will be again."
 zin_regional_seite_islands_the_moot_stone:0 "The Moot Stone"
 zin_regional_seite_islands_the_moot_stone_desc:0 "The old stone is raised on a new base, and the names of the clans are cut into it again. The moot meets there each season."
 zin_regional_seite_islands_the_moots_captain:0 "The Moot's Captain"
 zin_regional_seite_islands_the_moots_captain_desc:0 "The moot gives command of its boats to Captain Brann of the Banks, who has fished there all his life. He knows every rock, and every rock knows him."
 zin_regional_seite_islands_the_pupor_question:0 "The Pupor Question"
 zin_regional_seite_islands_the_pupor_question_desc:0 "The chart houses invite the isles to join a Charter; the coves invite them to profit from the lanes. The moot hears both, and every clan has an opinion."
 zin_regional_seite_islands_watch_the_kings_galleys:0 "Watch the King's Galleys"
 zin_regional_seite_islands_watch_the_kings_galleys_desc:0 "Watch-huts are raised along the southern shore to see the king's galleys coming. A beacon on each can be lit in a breath."
 zin_regional_seite_islands.1.a:0 "Judge the banks"
 zin_regional_seite_islands.1.b:0 "Not our quarrel"
 zin_regional_seite_islands.1.d:0 "A fishing boat from the Seite Isles has anchored off the council hall, bearing a shell-bound petition from the moot stone. The Seite clans will accept the word of Raerby's captains on the southern banks, and ask whether Raerby will judge between them and Nondondor's king."
 zin_regional_seite_islands.1.t:0 "The Seite Isles Ask Raerby to Judge the Banks"
 zin_regional_seite_islands.2.a:0 "Stand behind them"
 zin_regional_seite_islands.2.b:0 "Not our quarrel"
 zin_regional_seite_islands.2.d:0 "A Seite elder has come to the harbour in a patched boat, with a short speech. The southern banks are in dispute, Nondondor's galleys are many, and the Seite clans have only nets. They ask whether our realm will stand behind them."
 zin_regional_seite_islands.2.t:0 "The Seite Isles Ask for a Shield"
