l_english:
 zin_trait_temper_ambitious:0 "Ambitious"
 zin_trait_temper_ambitious_desc:0 "Means to leave the realm larger than it was found, and has had the old maps of every border brought up from the archive."
 zin_trait_temper_beloved:0 "Beloved of the People"
 zin_trait_temper_beloved_desc:0 "The common folk would follow their ruler into the sea, and the lords know it."
 zin_trait_temper_bold:0 "Bold-Hearted"
 zin_trait_temper_bold_desc:0 "Rides at the head of the host and expects the council to keep up."
 zin_trait_temper_builder:0 "Builder"
 zin_trait_temper_builder_desc:0 "Cannot pass a ruined wall without ordering it rebuilt, and keeps the masons of half the realm in the crown's pay."
 zin_trait_temper_cautious:0 "Cautious"
 zin_trait_temper_cautious_desc:0 "Counts the granaries twice before giving any order that cannot be taken back."
 zin_trait_temper_cruel:0 "Cruel"
 zin_trait_temper_cruel_desc:0 "Rules by the gallows and the dungeon, and the court goes very quiet at the sound of the royal step."
 zin_trait_temper_fortunate:0 "Fortune's Favourite"
 zin_trait_temper_fortunate_desc:0 "Has come through a fall from the saddle, a fever, two battles and a poisoned cup, and the common folk say the gods are fond of the crown."
 zin_trait_temper_generous:0 "Generous"
 zin_trait_temper_generous_desc:0 "Gives feasts, alms and pardons with an open hand, and the treasurers despair of it."
 zin_trait_temper_grasping:0 "Grasping"
 zin_trait_temper_grasping_desc:0 "Finds a tax, a fee or a fine for everything, and remembers who has not paid."
 zin_trait_temper_idle:0 "Idle"
 zin_trait_temper_idle_desc:0 "Leaves the writs to the clerks and the wars to the captains, and spends the summers hunting."
 zin_trait_temper_just:0 "Even-Handed"
 zin_trait_temper_just_desc:0 "Hears both sides of every quarrel before giving judgement, and both sides grumble that it took too long."
 zin_trait_temper_melancholy:0 "Melancholy"
 zin_trait_temper_melancholy_desc:0 "Sits for days in a darkened room, and comes out with verses that nobody at court understands."
 zin_trait_temper_pious:0 "Pious"
 zin_trait_temper_pious_desc:0 "Hears every rite of the temples and keeps a priest at the elbow in council."
 zin_trait_temper_scholarly:0 "Scholarly"
 zin_trait_temper_scholarly_desc:0 "Would rather read the old charters than ride out to inspect the levies."
 zin_trait_temper_silver_tongued:0 "Silver-Tongued"
 zin_trait_temper_silver_tongued_desc:0 "Can talk a hostile envoy into a treaty and a hungry crowd into going home."
 zin_trait_temper_stern:0 "Stern"
 zin_trait_temper_stern_desc:0 "Drills the levies in person at dawn and has never once been seen to laugh."
 zin_trait_temper_suspicious:0 "Suspicious"
 zin_trait_temper_suspicious_desc:0 "Trusts no one at court, tastes nothing twice, and keeps a list of every lord who smiles too often."
 zin_trait_temper_touched:0 "Touched"
 zin_trait_temper_touched_desc:0 "Hears voices nobody else hears and gives orders no captain would dare to give, and some of them have turned out to be brilliant."
 zin_trait_temper_vengeful:0 "Vengeful"
 zin_trait_temper_vengeful_desc:0 "Keeps a list of every slight to the crown and means to answer each of them."
 zin_trait_temper_weary:0 "Weary"
 zin_trait_temper_weary_desc:0 "Has carried the crown a long time and would be glad to set it down."
 zin_variety.1.a:0 "The age takes its shape."
 zin_variety.2.a:0 "The feuds are done."
