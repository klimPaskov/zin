l_english:
 zin_shared_magical_lands_a_banner_not_our_own:0 "A Banner Not Our Own"
 zin_shared_magical_lands_a_banner_not_our_own_desc:0 "A foreign banner flies over the council oak. [ROOT.GetName] has not forgotten what it was, and neither have its trees."
 zin_shared_magical_lands_a_council_in_harmony:0 "A Council in Harmony"
 zin_shared_magical_lands_a_council_in_harmony_desc:0 "In time the houses of [ROOT.GetName] come to sit at one fire and sing one verse. The elves say a council that has once agreed finds it easy to agree again."
 zin_shared_magical_lands_a_word_at_the_gate:0 "A Word at the Gate"
 zin_shared_magical_lands_a_word_at_the_gate_desc:0 "The grievance at the Wall has grown large enough that a quiet word must be had with the gate-wardens. [ROOT.GetName] sends an elder with a short letter and a long patience."
 zin_shared_magical_lands_answer_the_elder_moot:0 "Answer the Elder Moot"
 zin_shared_magical_lands_answer_the_elder_moot_desc:0 "When the Elder Moot calls the kin to council, [ROOT.GetName] answers and sends one of its eldest to sit in it. The kin remember who came and who did not."
 zin_shared_magical_lands_black_shore_wardens:0 "Wardens of the Black Shore"
 zin_shared_magical_lands_black_shore_wardens_desc:0 "A chain of stone posts is raised along the northern shore, each within sight of the next. The wardens who man them are told to watch, to light the beacon and then to run."
 zin_shared_magical_lands_council_of_the_grove:0 "The Council of [ROOT.GetName]"
 zin_shared_magical_lands_council_of_the_grove_desc:0 "The elders of [ROOT.GetName] sit beneath the oldest tree in the realm, as their forebears did long before there were kings elsewhere. Nobody hurries them, and the realm has never been the worse for waiting on their word."
 zin_shared_magical_lands_customs_at_the_wall:0 "Customs at the Wall"
 zin_shared_magical_lands_customs_at_the_wall_desc:0 "The Great Wall is old, and the customs men at its gates are older in their habits. [ROOT.GetName] sends a patient clerk to learn the tariffs and to write down what each of them costs."
 zin_shared_magical_lands_edge_of_the_woods:0 "The Edge of the Woods"
 zin_shared_magical_lands_edge_of_the_woods_desc:0 "The wardens of [ROOT.GetName] stand at the border with their backs to the trees and their faces to the dark."
 zin_shared_magical_lands_elder_groves:0 "Elder Groves of [ROOT.GetName]"
 zin_shared_magical_lands_elder_groves_desc:0 "Ancient groves stand about the springs of [ROOT.GetName], and their keepers have always lived from them without felling them. A Guild Workshop is raised at the edge of one, in the shade, from timber the storms brought down."
 zin_shared_magical_lands_elders_speak:0 "The Elders Speak"
 zin_shared_magical_lands_elders_speak_desc:0 "The eldest houses speak first and at length, and no one interrupts. Their memory of old quarrels is the realm's best guard against living through them twice."
 zin_shared_magical_lands_elven_sails:0 "[ROOT.GetAdjective] Sails"
 zin_shared_magical_lands_elven_sails_desc:0 "Slender ships of pale timber with sails the colour of birch bark leave the harbours of [ROOT.GetName], built for speed and silence. They are meant to watch, and not to fight."
 zin_shared_magical_lands_essence_workshops:0 "Essence Workshops"
 zin_shared_magical_lands_essence_workshops_desc:0 "Distillers draw the essence of the groves into small clear flasks for healers and warders. Theirs is the quietest workshop in Aoaz and among the most profitable."
 zin_shared_magical_lands_every_tree_a_wall:0 "Every Grove a Fort"
 zin_shared_magical_lands_every_tree_a_wall_desc:0 "The groves of [ROOT.GetName] have been walled in thorn and living stone for an age, waiting for this day. Now the gates are shut and the archers stand at the loopholes."
 zin_shared_magical_lands_eyes_on_the_black_north:0 "Eyes on the Black North"
 zin_shared_magical_lands_eyes_on_the_black_north_desc:0 "To the north the sea turns dark and the sky does not clear. Fishers of [ROOT.GetName] have seen black hulls on the horizon at evening, and none in the morning."
 zin_shared_magical_lands_fallen:0 "The Fallen Among Us"
 zin_shared_magical_lands_fallen_desc:0 "Some houses of [ROOT.GetName] have turned from the old songs, and the rest cannot agree what to do about it."
 zin_shared_magical_lands_ferries_over_the_drowned_road:0 "Ferries over the Drowned Road"
 zin_shared_magical_lands_ferries_over_the_drowned_road_desc:0 "Our ferries cross the Narrows on the line of a road that ran on dry land before the rift, and the ferry-masters still steer by its milestones on the bottom. If the eastern scribes want to dig at the old gate, they will need our boats and our leave."
 zin_shared_magical_lands_gain_autonomy_tip_1:0 "The overlord is reminded of the terms of the oath."
 zin_shared_magical_lands_gate_traders:0 "Traders at the Gate"
 zin_shared_magical_lands_grove_riders:0 "Grove Riders"
 zin_shared_magical_lands_grove_riders_desc:0 "White deer of the deep wood carry the lightest riders of the realm along paths no horse can use. They are rare, fast and almost never seen."
 zin_shared_magical_lands_grove_roads:0 "Grove Roads"
 zin_shared_magical_lands_grove_roads_desc:0 "Roads of beaten earth wind between the trunks, laid so that no tree is hurt and no cart delayed. [ROOT.GetName] adds a straighter, wider road to its busiest valley."
 zin_shared_magical_lands_groves_provide:0 "The Groves Provide"
 zin_shared_magical_lands_groves_provide_desc:0 "Timber, fruit, herbs and shade come in their seasons, and [ROOT.GetName] builds on the surplus."
 zin_shared_magical_lands_guard_the_roosts:0 "Guard the Roosts"
 zin_shared_magical_lands_guard_the_roosts_desc:0 "Sickness has crept among the roosts, and the wyrms trust nobody near them. The keepers of [ROOT.GetName] set a guard on every ledge and bar the mountain roads to strangers."
 zin_shared_magical_lands_healers_of_the_house:0 "Healers of [ROOT.GetName]"
 zin_shared_magical_lands_healers_of_the_house_desc:0 "Elves do not march in other peoples' quarrels, but their healers have always gone where the hurt lay. [ROOT.GetName] gathers a company of its best and lets them walk the world as they please."
 zin_shared_magical_lands_high_seat:0 "Lords of the High Seat"
 zin_shared_magical_lands_high_seat_desc:0 "A single lord holds the high seat of [ROOT.GetName] and decides what the council once debated."
 zin_shared_magical_lands_house_wardens:0 "House Wardens of [ROOT.GetName]"
 zin_shared_magical_lands_house_wardens_desc:0 "Every old house of the realm keeps a few wardens trained from childhood in bow, blade and woodcraft. [ROOT.GetName] gathers them into one roll and gives them a standard."
 zin_shared_magical_lands_house_wardens_spirit:0 "Wardens of the House"
 zin_shared_magical_lands_house_wardens_spirit_desc:0 "The wardens of [ROOT.GetName] practise together once a year and alone the rest of it, and they are good at both."
 zin_shared_magical_lands_keep_the_roads_open:0 "Keep the Roads Open"
 zin_shared_magical_lands_keep_the_roads_open_desc:0 "The roads are swept, the wells sweetened and the inns kept ready for travellers. [ROOT.GetName] asks nothing of the pilgrims but good manners, and the pilgrims return the favour."
 zin_shared_magical_lands_kin_envoys:0 "Envoys to the Kin"
 zin_shared_magical_lands_kin_envoys_desc:0 "The elven realms of the Magical Lands are many courts and one folk. [ROOT.GetName] sends envoys with gifts to the Magical Forest and learns who is well and who is in need."
 zin_shared_magical_lands_longbows_of_the_house:0 "[ROOT.GetAdjective] Longbows"
 zin_shared_magical_lands_longbows_of_the_house_desc:0 "The bowyers of [ROOT.GetName] cut yew in winter and season it for ten years. The bows they make are taller than a man and shoot further than any other in Aoaz."
 zin_shared_magical_lands_lords_of_the_high_seat:0 "Lords of the High Seat"
 zin_shared_magical_lands_lords_of_the_high_seat_desc:0 "One lord now sits in the high seat of [ROOT.GetName], and the council fire has become a ceremony. The elders dislike it, but the lord is stronger than they are."
 zin_shared_magical_lands_loremasters_abroad:0 "Loremasters Abroad"
 zin_shared_magical_lands_loremasters_abroad_desc:0 "A loremaster of [ROOT.GetName] spends a year in the courts of men, listening more than she speaks. She returns with their histories, their grievances and their dialects, and the realm is wiser for it."
 zin_shared_magical_lands_old_houses:0 "The Old Houses"
 zin_shared_magical_lands_old_houses_desc:0 "The oldest houses keep the high seats of [ROOT.GetName], and little that matters is done without them."
 zin_shared_magical_lands_old_woods_timber:0 "Timber of the Old Woods"
 zin_shared_magical_lands_old_woods_timber_desc:0 "Century-seasoned timber from [ROOT.GetName] is sought on every coast of Aoaz."
 zin_shared_magical_lands_open_houses:0 "The Open Houses"
 zin_shared_magical_lands_open_houses_desc:0 "Every house of [ROOT.GetName] may speak at the council fire. The realm decides slowly and learns quickly."
 zin_shared_magical_lands_pilgrims_on_our_roads:0 "Pilgrims on Our Roads"
 zin_shared_magical_lands_pilgrims_on_our_roads_desc:0 "Pilgrims in undyed cloth tread the long roads of [ROOT.GetName] toward the hermitage in the Zilin Hills. The council must decide how the realm will meet them."
 zin_shared_magical_lands_rift_watch:0 "Watch on the Rift"
 zin_shared_magical_lands_rift_watch_desc:0 "A watch stands day and night on the shore of [ROOT.GetName], and nothing crosses the water unseen."
 zin_shared_magical_lands_roost_keepers:0 "Keepers of the Roosts"
 zin_shared_magical_lands_roost_keepers_desc:0 "High on the mountain the great wyrms roost, and a few elven houses have kept the ledges clean and the eggs warm for as long as songs remember. [ROOT.GetName] takes up the oath."
 zin_shared_magical_lands_rumours_across_the_rift:0 "Rumours Across the Rift"
 zin_shared_magical_lands_rumours_across_the_rift_desc:0 "Traders at the rift port say the courts of the far shore are building ships and counting men. The watch of [ROOT.GetName] collects every tale and sorts the true from the idle."
 zin_shared_magical_lands_secluded:0 "The Secluded"
 zin_shared_magical_lands_secluded_desc:0 "The paths are closed and strangers are turned back at the border. [ROOT.GetName] keeps itself to itself."
 zin_shared_magical_lands_shared_songs_of_the_kin:0 "Shared Songs of the Kin"
 zin_shared_magical_lands_shared_songs_of_the_kin_desc:0 "The kin sing the same songs in different dialects, and when the realms trade verses they trade craft with them. [ROOT.GetName] sends its best singers east and west and welcomes the singers of others."
 zin_shared_magical_lands_shore_beacons:0 "Shore Beacons"
 zin_shared_magical_lands_shore_beacons_desc:0 "Pyres of resinous pine stand on every headland, stacked, tarred and turfed over against the rain. A watcher on one can wake the whole coast within the hour."
 zin_shared_magical_lands_shore_levies:0 "Shore Levies"
 zin_shared_magical_lands_shore_levies_desc:0 "The coast-wardens call every fisher and woodcutter who can draw a bow to the beacons for a month in the year. It is not an army, but it is more than the rift expects to meet."
 zin_shared_magical_lands_songs_for_the_wyrms:0 "Songs for the Wyrms"
 zin_shared_magical_lands_songs_for_the_wyrms_desc:0 "The wyrms answer singing when it is slow and low. The keepers of [ROOT.GetName] teach their children a song for each hour of the day and night."
 zin_shared_magical_lands_stand_with_the_kindred:0 "Stand with the Kindred"
 zin_shared_magical_lands_stand_with_the_kindred_desc:0 "Should the elves of the woods ever bind themselves into a Kindred, [ROOT.GetName] will stand in it. It joins no fellowship of men, and it asks no host from its neighbours."
 zin_shared_magical_lands_the_edge_of_the_woods:0 "The Edge of the Woods"
 zin_shared_magical_lands_the_edge_of_the_woods_desc:0 "The dark has come south at last, and the edge of the woods is where it must be stopped. [ROOT.GetName] stands on its own border with every warden it has and a deep distrust of the shadows ahead."
 zin_shared_magical_lands_the_fallen_among_us:0 "The Fallen Among Us"
 zin_shared_magical_lands_the_fallen_among_us_desc:0 "Some houses of [ROOT.GetName] have turned from the old songs and sing others now, in the dark. The council cannot decide whether to ignore them, to silence them or to learn what they know."
 zin_shared_magical_lands_the_groves_provide:0 "The Groves Provide"
 zin_shared_magical_lands_the_groves_provide_desc:0 "The groves give timber, fruit, herbs and shade, each in its season, and the realm asks for each only when it is offered. A last Guild Workshop rises where the three roads meet, and the folk of [ROOT.GetName] live better than they did."
 zin_shared_magical_lands_the_kin_answer:0 "The Kin Answer"
 zin_shared_magical_lands_the_kin_answer_desc:0 "Messengers have gone out through the woods, and the kin have answered. They send bows, arrows and a promise not to ask for more than the realm can give."
 zin_shared_magical_lands_the_kin_remember_us:0 "The Kin Remember Us"
 zin_shared_magical_lands_the_kin_remember_us_desc:0 "Word of the realm's fall under a stranger's hand has gone out through the woods, and letters come in from kin who have no armies but long memories. They promise to remember the realm's name."
 zin_shared_magical_lands_the_old_freedom:0 "The Old Freedom"
 zin_shared_magical_lands_the_old_freedom_desc:0 "Elves are patient. [ROOT.GetName] reminds its overlord, politely and often, of the terms on which it agreed to be a subject, and in time it is believed."
 zin_shared_magical_lands_the_old_houses:0 "The Old Houses"
 zin_shared_magical_lands_the_old_houses_desc:0 "The oldest houses keep the high seats and the oldest customs. [ROOT.GetName] confirms that nothing is done without their word, which makes the realm slow to change and very hard to break."
 zin_shared_magical_lands_the_open_houses:0 "The Open Houses"
 zin_shared_magical_lands_the_open_houses_desc:0 "Every house, old or young, great or small, may speak at the council fire. [ROOT.GetName] takes longer to decide and decides better, and its young people learn faster for being heard."
 zin_shared_magical_lands_the_refusal_kept:0 "The Refusal Kept"
 zin_shared_magical_lands_the_refusal_kept_desc:0 "The elves of the Magical Lands refused an age ago to fight in the wars of men, and [ROOT.GetName] reaffirms the refusal in open council. It is hard to keep and harder to explain, but the kin respect it."
 zin_shared_magical_lands_the_secluded:0 "The Secluded"
 zin_shared_magical_lands_the_secluded_desc:0 "The council has closed the paths and shut the gates, and strangers are turned back at the border. [ROOT.GetName] has chosen silence, and is not unhappy with its choice."
 zin_shared_magical_lands_the_temple_in_the_hills:0 "The Temple in the Hills"
 zin_shared_magical_lands_the_temple_in_the_hills_desc:0 "Word from the hermitage in the Zilin Hills has changed what [ROOT.GetName] thinks of the pilgrim road. The council closes the gates, shuts the inns and does it quietly."
 zin_shared_magical_lands_the_woods_defended:0 "The Woods Defended"
 zin_shared_magical_lands_the_woods_defended_desc:0 "Elves do not make war, but they defend what is theirs, and what is theirs has been entered. [ROOT.GetName] rises as one, from the oldest elder to the youngest archer."
 zin_shared_magical_lands_the_woods_quiet:0 "The Woods Are Quiet"
 zin_shared_magical_lands_the_woods_quiet_desc:0 "The last of the invaders is gone and the woods are quiet again. [ROOT.GetName] mends its fences, tends the burned groves and grieves for what was lost."
 zin_shared_magical_lands_the_young_houses:0 "The Young Houses"
 zin_shared_magical_lands_the_young_houses_desc:0 "Houses a century or two old ask for a hearing and a share in the work of warding stones. [ROOT.GetName] grants both, and the old trees do not seem to mind."
 zin_shared_magical_lands_throw_them_out:0 "Throw Them Out of the Woods"
 zin_shared_magical_lands_throw_them_out_desc:0 "The invaders are strangers to every root and path of the woods. [ROOT.GetName] harries them through the trees until they know it too."
 zin_shared_magical_lands_timber_of_the_old_woods:0 "Timber of the Old Woods"
 zin_shared_magical_lands_timber_of_the_old_woods_desc:0 "Fallen timber of the old woods, seasoned for a century, is the finest in Aoaz, and the merchants of the coast know it. [ROOT.GetName] sells it by the measured stack and never by the tree."
 zin_shared_magical_lands_toll_the_pilgrims:0 "Toll the Pilgrims"
 zin_shared_magical_lands_toll_the_pilgrims_desc:0 "A modest toll is set at the border posts, enough to pay for the roads and too little to turn anyone back. The pilgrims grumble and pay, and the treasury is the better for it."
 zin_shared_magical_lands_traders_at_kingson:0 "Traders at Kingson"
 zin_shared_magical_lands_traders_at_kingson_desc:0 "Kingson sits in the Wall like a stone in a ring, and its markets are open to anyone who pays the gate toll. Traders of [ROOT.GetName] carry timber and herbs there and come home with grain and good will."
 zin_shared_magical_lands_wall_roads:0 "The Wall Roads Open"
 zin_shared_magical_lands_wall_roads_desc:0 "The toll at each gate is posted in plain sight, and both sides of the Wall trade more and quarrel less."
 zin_shared_magical_lands_wall_roads_open:0 "The Wall Roads Open"
 zin_shared_magical_lands_wall_roads_open_desc:0 "The roads through the Wall are open to carts and caravans alike, and the toll at each gate is posted in plain sight. Both sides of the Wall trade more and quarrel less."
 zin_shared_magical_lands_wall_traders:0 "Traders at Kingson"
 zin_shared_magical_lands_wall_traders_desc:0 "Carts of timber and herbs go through the Wall gate to Kingson, and carts of grain come back."
 zin_shared_magical_lands_wardens_for_friends:0 "Wardens for Friends"
 zin_shared_magical_lands_wardens_for_friends_desc:0 "When a friend is in need, a few wardens of [ROOT.GetName] go without banners or orders and are home before the leaves turn. This is not war, and the council does not call it war."
 zin_shared_magical_lands_wardens_of_the_house:0 "Wardens of the House"
 zin_shared_magical_lands_wardens_of_the_house_desc:0 "The wardens of [ROOT.GetName] muster once a year at the great spring contest, and for the rest of the year each practises alone. The realm is the safer for both."
 zin_shared_magical_lands_wardens_to_nolorim:0 "Wardens to Nolorim"
 zin_shared_magical_lands_wardens_to_nolorim_desc:0 "Nolorim holds a mountain pass, and the pass holds more than Nolorim. [ROOT.GetName] sends a few wardens to its watch for a season, and they return with tales of the high wind."
 zin_shared_magical_lands_watch_the_rift:0 "Watch the Rift"
 zin_shared_magical_lands_watch_the_rift_desc:0 "Beyond the water lies the rift, and beyond the rift a shore the elves know only from old charts. [ROOT.GetName] raises a watch at the sea's edge and keeps it manned by day and night."
 zin_shared_magical_lands_wellspring_keepers:0 "Wellspring Keepers"
 zin_shared_magical_lands_wellspring_keepers_desc:0 "Keepers watch over the springs that feed the groves and the workshops. They know how much water each grove can give and when it must rest, and the workshops learn to work to their calendar."
 zin_shared_magical_lands_wellspring_keepers_spirit:0 "Wellspring Keepers"
 zin_shared_magical_lands_wellspring_keepers_spirit_desc:0 "The keepers of the springs tell each workshop when its grove must rest, and the work goes steadier for it."
 zin_shared_magical_lands_woods_hold:0 "The Woods Hold"
 zin_shared_magical_lands_woods_hold_desc:0 "Every path of [ROOT.GetName] has become a trap for those who do not belong in it."
 zin_shared_magical_lands_wyrm_songs:0 "Songs for the Wyrms"
 zin_shared_magical_lands_wyrm_songs_desc:0 "The slow songs of the keepers calm the wyrms on their ledges and keep the roosts at peace."
 zin_shared_magical_lands.1.a:0 "The elders speak."
 zin_shared_magical_lands.1.b:0 "The young houses speak."
 zin_shared_magical_lands.1.d:0 "The elders gather beneath the old oak and begin, slowly, to speak. The younger voices wait their turn at the edge of the circle. Whichever way the council leans this season will colour everything the realm does."
 zin_shared_magical_lands.1.t:0 "The Council of [ROOT.GetName] Meets"
 zin_shared_magical_lands.2.a:0 "Let them pass in peace."
 zin_shared_magical_lands.2.d:0 "A line of pilgrims in undyed cloth passes through [ROOT.GetName] on its way to the hermitage in the Zilin Hills, courteous and footsore. They carry the blessing of [zin_loc_deliverer] and ask for nothing but water."
 zin_shared_magical_lands.2.t:0 "Pilgrims on Our Roads"
 zin_shared_magical_lands.3.a:0 "Warn the kin."
 zin_shared_magical_lands.3.b:0 "Trade is trade."
 zin_shared_magical_lands.3.d:0 "Merchants at the rift port speak of shipyards on the far shore, busier than any in living memory. Whether the ships are meant for trade, for pilgrimage or for something else, nobody will say, and nobody will say who pays for them."
 zin_shared_magical_lands.3.t:0 "Rumours Across the Rift"
 zin_shared_magical_lands.4.a:0 "Send a boat to look."
 zin_shared_magical_lands.4.b:0 "Fishers' tales."
 zin_shared_magical_lands.4.d:0 "Fishers in the north report black ships off the coast at dusk, low in the water and showing no lights. By dawn they are gone, and the fishers will not say how many there were."
 zin_shared_magical_lands.4.t:0 "Black Ships Off Our Shore"
