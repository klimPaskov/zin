l_english:
 zin_regional_pertolor_a_coldor_match:0 "A Match with Coldor"
 zin_regional_pertolor_a_coldor_match_desc:0 "The Winter Crown sends its own kin to the vale, and the match brings the vale into the Queen's peace on the snow road."
 zin_regional_pertolor_a_coldor_match_tip_1:0 "The houses of Coldor and Pertolor keep the peace."
 zin_regional_pertolor_a_melkgard_match:0 "A Match with Melkgard"
 zin_regional_pertolor_a_melkgard_match_desc:0 "The lords of Melkgard send a bride up the valley road, and the marriage brings the vale a seat at the table of the Melkgard houses."
 zin_regional_pertolor_a_melkgard_match_tip_1:0 "The houses of Melkgard and Pertolor keep the peace."
 zin_regional_pertolor_await_the_worthy:0 "Await the Worthy"
 zin_regional_pertolor_await_the_worthy_desc:0 "The castle has waited for one who comes in need and asks for nothing. Its keeper prepares the hall for him: clean bedding, a full hearth and an open gate."
 zin_regional_pertolor_await_the_worthy_tip_1:0 "The keeper of the hall tests the heir in thirty days, not sixty."
 zin_regional_pertolor_black_faced_line:0 "The Black-Faced Line"
 zin_regional_pertolor_black_faced_line_desc:0 "Every ram of the flock is counted and no ram is sold out of the vale. The wool goes to the markets of both crowns, and the buyers pay for it in silver."
 zin_regional_pertolor_cousins_to_both_crowns:0 "Cousins to Both Crowns"
 zin_regional_pertolor_cousins_to_both_crowns_desc:0 "The lords of Pertolor are kin to the Hozening houses on both sides of the mountains. Each crown has sent a letter asking for a marriage, and the answer will be read in every hall of the vale."
 zin_regional_pertolor_deny_the_dark:0 "Deny the Dark"
 zin_regional_pertolor_deny_the_dark_desc:0 "The wardens renew every ward on the sealed hall and walk its circuit on the longest nights. A thief would have to hold the castle for a very long time before the seal gave way."
 zin_regional_pertolor_deny_the_dark_tip_1:0 "Defiling the seal takes 545 days instead of 365."
 zin_regional_pertolor_faith_high_ground:0 "Faith with the High Ground"
 zin_regional_pertolor_faith_high_ground_desc:0 "The due is paid at every Long Light, and the vale keeps its word to the high ground. The shepherds sleep easy and are slow to take up arms against the castle road."
 zin_regional_pertolor_headmens_hall:0 "The Headmen's Hall"
 zin_regional_pertolor_headmens_hall_desc:0 "The headmen of the vale sit in one hall in the town of Simoto, under the castle road. Their word is the vale's word, and their quarrels are settled before the snow comes."
 zin_regional_pertolor_light_the_shore_beacon:0 "Light the Shore Beacon"
 zin_regional_pertolor_light_the_shore_beacon_desc:0 "A tall beacon is raised on the headland where a southern ship might land. If it is lit, a tired crew will know where the shore is friendly."
 zin_regional_pertolor_light_the_shore_beacon_tip_1:0 "Any ambush at the landing is weaker by one."
 zin_regional_pertolor_marriage_gifts:0 "The Marriage Gifts"
 zin_regional_pertolor_marriage_gifts_desc:0 "The gifts of the match are counted in the lord's book: silver, furs, a flock of ewes and a charter for the town. Every gift is written down so that no one can later say the vale was owed more."
 zin_regional_pertolor_mutton_for_the_crowns:0 "Mutton for the Crowns"
 zin_regional_pertolor_mutton_for_the_crowns_desc:0 "The flocks are driven down to the lowland markets in the autumn, and the mutton is salted and sent to both crowns. Their stewards write the orders in the same hand."
 zin_regional_pertolor_open_for_the_heir:0 "Open for the Heir"
 zin_regional_pertolor_open_for_the_heir_desc:0 "If the heir comes, the bars will come down and the gate will open before he knocks. The castle's riders clear the road and stand at the posts to welcome him."
 zin_regional_pertolor_open_for_the_heir_tip_1:0 "The seal opens the day the heir arrives, and his renown grows by ten."
 zin_regional_pertolor_seal_the_hall:0 "Seal the Hall"
 zin_regional_pertolor_seal_the_hall_desc:0 "The castle gate is sealed and the bars are drawn across the hall. The keeper swears that none shall pass them while Glo sleeps behind the gate."
 zin_regional_pertolor_seal_the_hall_tip_1:0 "The bars are drawn across the hall. No one passes the gate until the keeper says so."
 zin_regional_pertolor_seek_a_second_bearer:0 "Seek a Second Bearer"
 zin_regional_pertolor_seek_a_second_bearer_desc:0 "The heir is lost. The keepers of the hall will not leave Glo to sleep forever while the dark gathers, and they send a call to every court that might have a worthy hand."
 zin_regional_pertolor_seek_a_second_bearer_tip_1:0 "Worthy claimants seek Glo as its bearer without the usual cost."
 zin_regional_pertolor_send_guides_to_the_landing:0 "Send Guides to the Landing"
 zin_regional_pertolor_send_guides_to_the_landing_desc:0 "The best trackers of the valley below the castle go down to the landing with sleds and dogs. They know the ice and the weather, and they will lead any friend safely to the castle road."
 zin_regional_pertolor_send_guides_to_the_landing_tip_1:0 "Any ambush at the landing is weaker by one."
 zin_regional_pertolor_simoto_charter:0 "The Charter of Simoto"
 zin_regional_pertolor_simoto_charter_desc:0 "The old charter of Simoto is copied into the lord's book and sealed with the ram. Its market days, its water rights and its exemption from the road tax are written there for every successor to read."
 zin_regional_pertolor_simoto_charter_tip_1:0 "The charter of Simoto is copied into the lord's book."
 zin_regional_pertolor_the_black_faced_flock:0 "The Black-Faced Flock"
 zin_regional_pertolor_the_black_faced_flock_desc:0 "The black-faced rams are counted and marked, and none is sold out of the vale. Their wool is the finest in the north, and the buyers of both crowns come up to the pastures for it."
 zin_regional_pertolor_the_due_paid:0 "The Due Paid"
 zin_regional_pertolor_the_due_paid_desc:0 "The due has been paid in full at the foot of the road, and the vale is at peace with the high ground. The shepherds say the ram has been seen on the ridge."
 zin_regional_pertolor_the_due_untouched:0 "The Due Untouched"
 zin_regional_pertolor_the_due_untouched_desc:0 "The loaf and the fleece are still on the step of the Silent Road when the next Long Light comes round. The shepherds are frightened, and the headmen ask Pertolor what must be done."
 zin_regional_pertolor_the_headmen_council:0 "The Headmen's Council"
 zin_regional_pertolor_the_headmen_council_desc:0 "The headmen gather to decide whether the town's old law still holds against the buyers from the crowns."
 zin_regional_pertolor_the_hozening_match:0 "The Hozening Match"
 zin_regional_pertolor_the_hozening_match_desc:0 "The Hozening lords agree to a match between their houses and the lords of the vale. Both crowns hear of it, and both crowns send their envoys to see the bride."
 zin_regional_pertolor_the_loaf_custom:0 "The Loaf Custom"
 zin_regional_pertolor_the_loaf_custom_desc:0 "A loaf is baked at every hearth of the vale and carried to the top of the Silent Road each Long Light. No headman has ever been asked why, and none has ever refused to bake."
 zin_regional_pertolor_the_loaf_custom_tip_1:0 "The loaf is baked in every hearth of the vale."
 zin_regional_pertolor_the_long_light:0 "The Long Light"
 zin_regional_pertolor_the_long_light_desc:0 "The longest night of the year is kept with a fire at the top of the town and a feast for every hearth. The vale says the flock comes home when the light is longest."
 zin_regional_pertolor_the_ram_fair:0 "The Ram Fair"
 zin_regional_pertolor_the_ram_fair_desc:0 "The best rams of the flock are shown at a fair in Simoto. Buyers come up from the lowlands and the crowns' stewards write their names in the book."
 zin_regional_pertolor_the_ram_s_due:0 "The Ram's Due"
 zin_regional_pertolor_the_ram_s_due_desc:0 "Each Long Light a loaf and a fleece are carried to the start of the Silent Road, as the vale has carried them since the flock came down out of the whiteout. The due is never sold and never refused."
 zin_regional_pertolor_the_ram_s_due_tip_1:0 "The due of the ram is carried to the Silent Road each Long Light."
 zin_regional_pertolor_the_town_below:0 "The Town Below the Castle"
 zin_regional_pertolor_the_town_below_desc:0 "Simoto lies under the silent castle and is treated as kin by the vale. Its gates are never shut to a traveller, and its people are never taxed for the road."
 zin_regional_pertolor_the_town_wall:0 "The Wall of Simoto"
 zin_regional_pertolor_the_town_wall_desc:0 "The town's old stone wall is raised and mended above the castle road. It is not meant to keep out an army; it is meant to show the road that the town has been seen."
 zin_regional_pertolor_the_tribes_of_the_ice:0 "The Tribes of the Ice"
 zin_regional_pertolor_the_tribes_of_the_ice_desc:0 "The tribes of the ice come down to the shore below the town to trade, and they bring word from the far snow. Pertolor's riders take their news to the headmen."
 zin_regional_pertolor_the_unyielding_hall:0 "The Unyielding Hall"
 zin_regional_pertolor_the_unyielding_hall_desc:0 "Within the walls of the castle above the town, borrowed power falters, and the keeper means to keep it so. Arts that serve a thief in the open field find the hall deaf to them."
 zin_regional_pertolor_the_unyielding_hall_tip_1:0 "Within these walls, borrowed power falters."
 zin_regional_pertolor_the_valley_levy:0 "The Valley Levy"
 zin_regional_pertolor_the_valley_levy_desc:0 "Every household of the valley sends one son to the levy when the snow melts, to learn the cold and the flock together. The levy keeps the road and the sheepfolds in good order."
 zin_regional_pertolor_the_valley_road:0 "The Valley Road"
 zin_regional_pertolor_the_valley_road_desc:0 "A road is cut from the lower pastures to the town, and the traders who come up it bring salt and iron to the high flocks."
 zin_regional_pertolor_the_valley_treaty:0 "A Treaty with the Valley"
 zin_regional_pertolor_the_valley_treaty_desc:0 "The valley folk of the lower pastures come to Simoto with their sheep and their grievances. Pertolor makes a treaty with them for the grazing and for the road."
 zin_regional_pertolor_the_wool_market:0 "The Wool Market"
 zin_regional_pertolor_the_wool_market_desc:0 "A market for the wool is opened in Simoto. The stewards of both crowns bid for the clip, and the town keeps a fifth of the price for the road."
 zin_regional_pertolor_watchers_on_the_coast:0 "Watchers on the Coast"
 zin_regional_pertolor_watchers_on_the_coast_desc:0 "Beacon-huts rise along the shore below the Castle of Yeldenne, each with a ward-keeper and a stack of dry driftwood. If a strange keel comes into the fjords, the whole coast will know by dusk."
 zin_regional_pertolor_watchers_on_the_coast_tip_1:0 "Raises the watch on the coast: any ambush at the landing is weaker by one."
 zin_regional_pertolor.1.a:0 "Keep the old loaf law"
 zin_regional_pertolor.1.b:0 "Open the market to the crowns' buyers"
 zin_regional_pertolor.1.d:0 "The headmen of the vale have come down from the high pastures to the town of Simoto. The old loaf law says the town is never taxed; the wool-buyers say the market is too small to leave closed. The council waits for Pertolor to speak."
 zin_regional_pertolor.1.t:0 "The Headmen's Council"
 zin_regional_pertolor.2.a:0 "Send the best ram up the road"
 zin_regional_pertolor.2.b:0 "Leave the step empty"
 zin_regional_pertolor.2.d:0 "The loaf and the fleece are still on the step of the Silent Road in the next Long Light, and nobody of the vale has walked up to take them. The shepherds are frightened. Nobody can say who has been eating the offering."
 zin_regional_pertolor.2.t:0 "The Due Untouched"
