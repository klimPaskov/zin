l_english:
 zin_dominion_bind_the_restless:0 "Bind the Restless"
 zin_dominion_bind_the_restless_desc:0 "Bind the dead who fell in this war to the banners of the Dominion, so that none rises against its own side."
 zin_dominion_broken_host:0 "The Broken Host"
 zin_dominion_broken_host_desc:0 "The Master's body is broken, and with it the order of the hosts. They stand where they stood, and do not know why."
 zin_dominion_caught_unready:0 "Caught Unready"
 zin_dominion_caught_unready_desc:0 "The forts were not finished, and the host came from nowhere. Mirolon's wardens are fighting before they have stood to."
 zin_dominion_champion_falls:0 "The Champion Falls"
 zin_dominion_champion_falls_desc:0 "The champion of men has fallen before the whole army. The hosts of the south take heart and the war moves faster."
 zin_dominion_cost_100_20:0 "100 Authority, 20 Orders"
 zin_dominion_cost_100_20_blocked:0 "§R100 Authority, 20 Orders§!"
 zin_dominion_cost_100_20_tooltip:0 "Costs 100 Authority and 20 Orders. Needs four Middle Lands states under Volgan's hand."
 zin_dominion_cost_40_10:0 "40 Authority, 10 Orders"
 zin_dominion_cost_40_10_blocked:0 "§R40 Authority, 10 Orders§!"
 zin_dominion_cost_40_10_tooltip:0 "Costs 40 Authority and 10 Orders."
 zin_dominion_court:0 "The Court of Nafeher"
 zin_dominion_court_desc:0 "The oaths of the sworn realms, the Nether, the Abyss, the envoys to the free holds and the clients of the march."
 zin_dominion_demand_tribute:0 "Demand Tribute"
 zin_dominion_demand_tribute_desc:0 "Take grain, iron and levies from a sworn realm. The Dominion is stronger, and the realm is not pleased."
 zin_dominion_descend_again:0 "Descend Again"
 zin_dominion_descend_again_desc:0 "Send a new embassy down the stair of the Abyss. The depths are not asked twice in one year."
 zin_dominion_forewarned:0 "Forewarned"
 zin_dominion_forewarned_desc:0 "The scouts had told us. The passes were manned and the signal-fires laid, and the south found its road barred."
 zin_dominion_gate_scars:0 "Scars of the Gate"
 zin_dominion_grant_spoils:0 "Grant Spoils"
 zin_dominion_grant_spoils_desc:0 "Give a sworn realm a state that Volgan holds. Its oath grows deep."
 zin_dominion_grave_musters:0 "The Grave Musters"
 zin_dominion_grave_musters_desc:0 "Wake the dead of the Ember Lands in secret and raise them into the hosts of the Dominion."
 zin_dominion_heeded_warning:0 "A Warning Heeded"
 zin_dominion_heeded_warning_desc:0 "Parim listened at last, and the frontier companies of the Lost Cause are on the way. Mirolon is no longer alone."
 zin_dominion_hold_the_passes:0 "Hold the Passes"
 zin_dominion_hold_the_passes_desc:0 "The forts are ready, the warnings believed, and every pass has its warden. The south must pay for each mile."
 zin_dominion_hosts:0 "The Hosts of the Dominion"
 zin_dominion_make_a_client_crown:0 "Make a Client Crown"
 zin_dominion_make_a_client_crown_desc:0 "Set a conquered or fallen realm back on its throne as a vassal of Nafeher. It keeps its crown and pays its tithe."
 zin_dominion_march_stalls:0 "The March Stalls"
 zin_dominion_march_stalls_desc:0 "A year at the passes has cost the south dear. The hosts are tired and doubtful, and no one at Nafeher speaks of the march."
 zin_dominion_mirolon_friendship:0 "Friends of Mirolon"
 zin_dominion_mirolon_watch:0 "The Watch on the Passes"
 zin_dominion_mirolon_watch_desc:0 "Scouts, word to Parim and stone in the passes: how Mirolon watches the south."
 zin_dominion_muster_beneath_the_storms:0 "Muster Beneath the Storms"
 zin_dominion_muster_beneath_the_storms_desc:0 "Gather the hosts under the weather that hides them. Nothing is seen from the passes, and the Dominion grows stronger for it."
 zin_dominion_nether_gate:0 "Open the Nether Gate"
 zin_dominion_nether_gate_desc:0 "The court of the Nether opens a gate under an enemy-held state next to our lines. Fire and Netherborn come through it for a night, and the roads and fields of that land do not recover for a season."
 zin_dominion_out_of_the_storms:0 "Out of the Storms"
 zin_dominion_out_of_the_storms_desc:0 "The host came out of weather that hid it for a hundred years. The enemy has not yet understood what it faces."
 zin_dominion_raise_a_grave_host:0 "Raise a Grave Host"
 zin_dominion_raise_a_grave_host_desc:0 "Call two hosts of grave-risen to stand at Nafeher. The graves of the south give them up, and the veil thins a little each time."
 zin_dominion_raise_the_pass_forts:0 "Raise the Pass Forts"
 zin_dominion_raise_the_pass_forts_desc:0 "Put masons and levies to work on the forts of the passes. Every course of stone is a day bought."
 zin_dominion_seeking_own_road:0 "Its Own Road"
 zin_dominion_seeking_own_road_desc:0 "The sworn realm no longer asks Nafeher what to do. It looks for its own road, and it will find one."
 zin_dominion_send_envoys:0 "Send Envoys"
 zin_dominion_send_envoys_desc:0 "Send a herald of Nafeher with gifts and an offer to a free hold of the Dark Lands. The road is long, and most holds answer only to themselves."
 zin_dominion_send_scouts_south:0 "Send Scouts South"
 zin_dominion_send_scouts_south_desc:0 "Send scouts down the passes to look at what the south is doing. Every report is one more thing a court cannot laugh away."
 zin_dominion_send_word_to_parim:0 "Send Word to Parim"
 zin_dominion_send_word_to_parim_desc:0 "Send the Ledger of Warnings to the court of Aenor and ask it to look south. The Golden Court has laughed before."
 zin_dominion_silence_the_watchers:0 "Silence the Watchers"
 zin_dominion_silence_the_watchers_desc:0 "Some of the scouts that Mirolon sends south do not come home. What they saw is buried with them, and the veil closes again."
 zin_dominion_silent_throne:0 "The Silent Throne"
 zin_dominion_silent_throne_desc:0 "The throne of Nafeher answers no one. The Steward rules in a name that does not reply, and the court has learned to be careful of its words."
 zin_dominion_summon_the_dominion:0 "Summon the Dominion"
 zin_dominion_summon_the_dominion_desc:0 "The sworn realms are called to Nafeher and reminded whom they serve. Their oaths hold the firmer for it, and they drift no more for half a year."
 zin_dominion_wake_old_barrows:0 "Wake the Old Barrows"
 zin_dominion_wake_old_barrows_desc:0 "Send the barrow-priests into the old tombs of the south. The dead who rise there are many and quiet. The storms that cover the work burn a little thinner."
 zin_dominion_wake_old_battlefields:0 "Wake the Old Battlefields"
 zin_dominion_wake_old_battlefields_desc:0 "Call the dead of the old battlefields of the Middle Lands. Three hosts rise where the First Age fell, and they remember whom to hate."
 zin_dominion_watch_with_mirolon:0 "Watching beside Mirolon"
 zin_dominion.2.a:0 "We have heard such talk before"
 zin_dominion.2.d:0 "Travellers coming up from the Ember Lands tell of a stranger weather there: storms that stand still for weeks over the same valleys, and lights in the old barrows. Nobody can say what is under them, and the old men say it is only weather."
 zin_dominion.2.t:0 "Rumours from the South"
 zin_dominion.20.a:0 "The march waits"
 zin_dominion.20.d:0 "For a year the hosts of the south have beaten on the passes of Mirolon and have not passed. The Dominion is weary and the wardens are proud, and no one at Nafeher will say how long the march can wait."
 zin_dominion.20.t:0 "The Passes Held"
 zin_dominion.21.a:0 "Again, when the gate allows"
 zin_dominion.21.d:0 "The gate under the enemy's land has opened and closed. By morning the fields were burnt and the roads broken, and the Netherborn had gone back to where they came from. The court of the Nether sends no word, only a bill."
 zin_dominion.21.t:0 "Fire from the Gate"
 zin_dominion.22.a:0 "Renew the oath"
 zin_dominion.22.b:0 "Seek our own road"
 zin_dominion.22.d:0 "The council of this realm has begun to ask what the oath to Nafeher gives it. The levies are heavy, the tribute is old, and the road to the master is a long one. A party of the captains whispers of another way."
 zin_dominion.22.t:0 "The Oath Falters"
 zin_dominion.25.a:0 "In this telling, the throne answers"
 zin_dominion.25.d:0 "In this telling of the age, something stirs in the throne room of Nafeher. The braziers are lit, the court rises, and a voice that no one has heard in many years says the names of the sworn realms. The scribes write only what they saw."
 zin_dominion.25.t:0 "A Stirring in Nafeher"
 zin_dominion.26.a:0 "Peace, then"
 zin_dominion.26.b:0 "Finish what the sword began"
 zin_dominion.26.d:0 "A herald in ember and black has come to our court from Nafeher with a white banner. The Steward of Nafeher offers peace without spoils and without conditions, and asks only that the hosts of the south be allowed to go home."
 zin_dominion.26.t:0 "The Steward Asks for Peace"
 zin_dominion.27.a:0 "Mirolon was right"
 zin_dominion.27.d:0 "Mirolon has laid its proof before the courts of Aoaz, and no one can laugh at it any more: the hosts, the barrows, the oaths of the sworn realms, all set down plainly. It is now certain that Mirolon told the truth."
 zin_dominion.27.t:0 "Mirolon's Proof"
 zin_dominion.28.a:0 "Kneel as a client crown"
 zin_dominion.28.b:0 "We paid for quiet, not chains"
 zin_dominion.28.d:0 "The march has begun, and a herald of Nafeher stands at our gate with new terms. We have paid for quiet in the past, and the herald reminds us of it. He offers a crown of our own, as a client of the Dominion, if we kneel before the army reaches us."
 zin_dominion.28.t:0 "Terms from Nafeher"
 zin_dominion.3.a:0 "Watch with them"
 zin_dominion.3.b:0 "Mirolon frets"
 zin_dominion.3.d:0 "A rider from Mirolon has come to our court with a ledger of small things: ash on the winds, tracks in the passes where nothing should walk. The wardens of Mirolon do not claim to know what they mean. They only ask that someone else should look too."
 zin_dominion.3.t:0 "Mirolon's Fears"
 zin_dominion.4.a:0 "So the legends wake"
 zin_dominion.4.d:0 "The storms over the Ember Lands have thinned, and what they hid can be seen from the passes. Hosts are mustered in the valleys of the south, more than any watcher has seen since the First Age. The tales are not tales."
 zin_dominion.4.t:0 "The Ember Lands Are Arming"
 zin_dominion.5.a:0 "Volgan is a nursery tale"
 zin_dominion.5.b:0 "Let the Lost Cause send its frontier companies"
 zin_dominion.5.c:0 "Aenor will guarantee Mirolon"
 zin_dominion.5.d:0 "The High Warden of Mirolon has sent a sealed ledger to the Golden Court: scouts' reports, tallies of the southern fords, the names of three barrow-priests seen in the foothills. The envoy waits in the antechamber. The seal-bearer reads a line aloud and the courtiers smile."
 zin_dominion.5.t:0 "Mirolon's Warning"
 zin_dominion.6.a:0 "Their names go on the wall"
 zin_dominion.6.d:0 "A party of scouts went south into the foothills and has not come back. The pass-watch found their fire-pit cold and their pony standing in the road, with nothing else of them. Hadric Thorne keeps their names in the ledger."
 zin_dominion.6.t:0 "Scouts Lost"
 zin_dominion.7.a:0 "Double the watch"
 zin_dominion.7.b:0 "Keep it quiet"
 zin_dominion.7.d:0 "Two of the scouts sent south were found at the foot of the pass in a ditch, laid side by side with their hands folded. Somebody wished it known that the south has eyes of its own."
 zin_dominion.7.t:0 "Scouts Found Dead"
 zin_dominion.8.a:0 "Hear them"
 zin_dominion.8.b:0 "Send them back south"
 zin_dominion.8.d:0 "A herald in black and ember has come to our hall with gifts of iron and a sealed offer. Nafeher asks nothing yet but an open ear. The herald does not say what the Dominion will want later, and nobody in the hall asks."
 zin_dominion.8.t:0 "Envoys from Nafeher"
 zin_dominion.9.a:0 "As expected"
 zin_dominion.9.d:0 "The envoys have come back from the hold they were sent to. The offer was heard and closed again, and the scribe has set down the answer exactly."
 zin_dominion.9.d_accepted:0 "The envoys have come back from the hold they were sent to. The offer was heard and taken up, and the scribe has set down the terms exactly."
 zin_dominion.9.t:0 "The Envoys Return"
 zin_mirolon_almon:0 "Captain Selda Varrow"
 zin_mirolon_hadric:0 "Scout-Master Hadric Thorne"
 zin_mirolon_hadric_desc:0 "Hadric Thorne has walked the southern passes for thirty years and counts every stone of them. He believes what he has seen, and he has seen enough to be afraid."
 zin_mirolon_maeric:0 "High Warden Maeric"
 zin_mirolon_parim_laughed_opinion:0 "Laughed at in Parim"
 zin_trait_great_spirit_in_arms:0 "Great Spirit in Arms"
 zin_trait_great_spirit_in_arms_desc:0 "A Great Spirit leads the host in person. His army fights as one mind, and the enemy is lost before the battle is."
 zin_volgan_ember_herald:0 "The Ember Herald"
 zin_volgan_envoys_received:0 "Received the envoys of Nafeher"
 zin_volgan_envoys_refused:0 "Refused the envoys of Nafeher"
 zin_volgan_ghorvak:0 "Ghorvak of the Hundred Clubs"
 zin_volgan_grave_warden:0 "The Grave-Warden"
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR:0 "Volgan's Patience (AI)"
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_AI_FREE:0 "May Break the Veil"
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_AI_FREE_DESC:0 "Volgan's AI may break the veil early once its hosts are very strong."
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_AI_HISTORICAL:0 "Wait for the War"
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_AI_HISTORICAL_DESC:0 "Volgan's AI never breaks the veil before the War of the Last Crowns."
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_DEFAULT:0 "Follow the Path"
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_DEFAULT_DESC:0 "Follows the rule for the path of the story: the historical and plausible paths wait for the war; the free path may break the veil."
 ZIN_ZIN_RULE_VOLGAN_EARLY_WAR_DESC:0 "Decides whether Volgan's AI may break the Veil of Storms before the War of the Last Crowns. A player's Volgan is never steered."
 ZIN_ZIN_RULE_VOLGAN_SPIRIT:0 "What Remains of Volgan"
 ZIN_ZIN_RULE_VOLGAN_SPIRIT_DESC:0 "Decides whether anything returns to Nafeher when the Master's body is broken. The chronicle itself never says."
 ZIN_ZIN_RULE_VOLGAN_SPIRIT_STIRRING:0 "A Stirring (sandbox)"
 ZIN_ZIN_RULE_VOLGAN_SPIRIT_STIRRING_DESC:0 "From 4A 1765, once a year there is one chance in ten that the throne of Nafeher answers again. The tale is told as a telling of the age, not as history."
 ZIN_ZIN_RULE_VOLGAN_SPIRIT_UNRESOLVED:0 "Unresolved"
 ZIN_ZIN_RULE_VOLGAN_SPIRIT_UNRESOLVED_DESC:0 "Nothing returns. No text says whether the Master's spirit endured."
