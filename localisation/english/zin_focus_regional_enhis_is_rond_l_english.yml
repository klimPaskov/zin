l_english:
 zin_regional_enhis_is_rond_boatwrights_of_the_isles:0 "Boatwrights of the Isles"
 zin_regional_enhis_is_rond_boatwrights_of_the_isles_desc:0 "The boatwrights of [ROOT.GetName] build low, broad hulls with outriggers that no storm has ever turned over. Visitors from richer lands copy them and call them their own."
 zin_regional_enhis_is_rond_carry_the_name_to_gala:0 "Carry the Name to Gala"
 zin_regional_enhis_is_rond_carry_the_name_to_gala_desc:0 "The priests copy the name and its story onto cedar slats, and send them south to Gala in a sealed chest. A tale too old for any man to explain may be understood by those who live long."
 zin_regional_enhis_is_rond_carry_the_name_to_gala_tip_1:0 "A tale too old for any man to explain goes south to Gala."
 zin_regional_enhis_is_rond_close_the_houses_of_the_isle:0 "Close the Houses of the Isle"
 zin_regional_enhis_is_rond_close_the_houses_of_the_isle_desc:0 "The house on the quay is shuttered, the well sealed and the healers' ledgers surrendered to the elders. The island's kindness has limits, and the elders have chosen where they lie."
 zin_regional_enhis_is_rond_copy_the_inscription:0 "Copy the Inscription"
 zin_regional_enhis_is_rond_copy_the_inscription_desc:0 "The priests copy the name over the door onto sheets of bark and clay, and send the copies to the temple library. They repeat it with care and cannot explain it."
 zin_regional_enhis_is_rond_copy_the_inscription_tip_1:0 "The priests copy a name they repeat but do not understand."
 zin_regional_enhis_is_rond_divers_of_the_shrine:0 "Divers of the Shrine"
 zin_regional_enhis_is_rond_divers_of_the_shrine_desc:0 "Pearl-divers are trained to work the waters round the shrine, and told never to touch the stones. They bring up shells, sand and sometimes a worked bead."
 zin_regional_enhis_is_rond_eldest_priest:0 "The Eldest Priest"
 zin_regional_enhis_is_rond_eldest_priest_desc:0 "The eldest of the priest-elders leads the rite and rules the island, and his staff is carved with every name the rite has kept. His word is law because it is also prayer."
 zin_regional_enhis_is_rond_far_from_the_kings_wars:0 "Far From the Kings' Wars"
 zin_regional_enhis_is_rond_far_from_the_kings_wars_desc:0 "The island declares that the wars of the great are not its wars. The harbour is closed to warships, the boats stay in their sheds, and the elders send word to every side that [ROOT.GetName] wants only to be left alone."
 zin_regional_enhis_is_rond_far_from_the_war:0 "Far From the Kings' Wars"
 zin_regional_enhis_is_rond_far_from_the_war_desc:0 "The harbour is closed to warships and the boats stay in their sheds. The island wants only to be left alone."
 zin_regional_enhis_is_rond_fishing_fleets:0 "The Fishing Fleets"
 zin_regional_enhis_is_rond_fishing_fleets_desc:0 "A hundred sails leave the beaches at dawn and spread across the water like gulls."
 zin_regional_enhis_is_rond_healers_at_the_quays:0 "Healers at the Quays"
 zin_regional_enhis_is_rond_healers_at_the_quays_desc:0 "Healers in grey robes tend the sick on the quay and feed the hungry."
 zin_regional_enhis_is_rond_island_levy:0 "The Island Levy"
 zin_regional_enhis_is_rond_island_levy_desc:0 "Every terrace village keeps a muster-roll and a stack of spears, and the priests bless both at the rite. The island is crowded, and its sons are many."
 zin_regional_enhis_is_rond_island_markets:0 "Island Markets"
 zin_regional_enhis_is_rond_island_markets_desc:0 "Each full moon, boats from three isles meet in the lee of a reef and trade. Salt, pearls, dried fish and woven mats change hands, and the haggling goes on until the tide turns."
 zin_regional_enhis_is_rond_island_markets_spirit:0 "Island Markets"
 zin_regional_enhis_is_rond_island_markets_spirit_desc:0 "Boats from three isles meet in the lee of a reef each full moon, and the haggling goes on until the tide turns."
 zin_regional_enhis_is_rond_low_tide_rite:0 "The Low-Tide Rite"
 zin_regional_enhis_is_rond_low_tide_rite_desc:0 "At the lowest tides the priests walk down the causeway to the drowned shrine and chant the name carved above its door. The island gathers on the shore to listen."
 zin_regional_enhis_is_rond_many_hands:0 "Many Hands"
 zin_regional_enhis_is_rond_many_hands_desc:0 "A crowded island has many hands, and the priests find work for them all: weavers, potters, rope-makers and masons. No one is idle for long."
 zin_regional_enhis_is_rond_nets_and_boats:0 "Nets and Boats"
 zin_regional_enhis_is_rond_nets_and_boats_desc:0 "New nets are knotted in the long evenings, and the boat-sheds ring with the sound of adzes. The fishers of [ROOT.GetName] ask for a proper slip and a shipwright who has seen more than one kind of hull."
 zin_regional_enhis_is_rond_old_rite:0 "The Old Rite"
 zin_regional_enhis_is_rond_old_rite_desc:0 "The priests chant at dawn and dusk in a tongue nobody speaks, and the chant is taught to every child. Nobody knows what the words mean, and nobody has ever asked to stop."
 zin_regional_enhis_is_rond_pearl_divers:0 "The Pearl Divers"
 zin_regional_enhis_is_rond_pearl_divers_desc:0 "Divers go down on a single breath with a stone in their hands and come up with their pockets full of grey and silver. A good pearl is worth more than a boat, and the divers know it."
 zin_regional_enhis_is_rond_priests_at_the_quays:0 "Priests at the Quays"
 zin_regional_enhis_is_rond_priests_at_the_quays_desc:0 "Grey-robed priests from the north have begun to meet the ships, offering blessings, bread and news. The islanders of [ROOT.GetName] are polite to them, and a little curious."
 zin_regional_enhis_is_rond_salt_pans:0 "The Salt Pans"
 zin_regional_enhis_is_rond_salt_pans_desc:0 "Shallow pans are scraped out behind the dunes, and the sun does the rest. Salt is the island's oldest wealth, and every trader who has ever called at [ROOT.GetName] has bought some."
 zin_regional_enhis_is_rond_scholars_at_the_shrine:0 "Scholars at the Shrine"
 zin_regional_enhis_is_rond_scholars_at_the_shrine_desc:0 "Visiting scholars ask leave to study the shrine, bringing paper, ink and a generous letter. The priest-elders admit them to the causeway and keep one eye on their notes."
 zin_regional_enhis_is_rond_send_them_on_their_way:0 "Send Them on Their Way"
 zin_regional_enhis_is_rond_send_them_on_their_way_desc:0 "The elders of [ROOT.GetName] thank the priests for their kindness, give them a good meal and put them on the next boat out. There is no insult in it, only the island's way of keeping what is its own."
 zin_regional_enhis_is_rond_ships_for_the_strangers_host:0 "Ships for the Gathering Host"
 zin_regional_enhis_is_rond_ships_for_the_strangers_host_desc:0 "When a host gathers against the dead, the isles can send it boats and men."
 zin_regional_enhis_is_rond_shrine_wardens:0 "The Shrine Wardens"
 zin_regional_enhis_is_rond_shrine_wardens_desc:0 "Wardens keep watch over the drowned shrine from boats and rocks, in turns, from tide to tide. Nobody touches the stones, and nobody sleeps near them."
 zin_regional_enhis_is_rond_terraced_villages:0 "Terraced Villages"
 zin_regional_enhis_is_rond_terraced_villages_desc:0 "Villages climb the terraces in steps, each with its own well and shrine. Craftsmen set up their workshops along the lowest terrace, where the roads are widest."
 zin_regional_enhis_is_rond_the_council_of_priests:0 "The Council of Priests"
 zin_regional_enhis_is_rond_the_council_of_priests_desc:0 "The priests sit in a ring in the temple court, each with a staff, and speak in order of age. The youngest speak last and are heard most closely."
 zin_regional_enhis_is_rond_the_crowded_isle:0 "The Crowded Isle"
 zin_regional_enhis_is_rond_the_crowded_isle_desc:0 "More people live on this round island than on any of its neighbours, and every hillside is terraced to the top. The priests count them at the rite and write the number in the temple book."
 zin_regional_enhis_is_rond_the_eldest_priest:0 "The Eldest Priest"
 zin_regional_enhis_is_rond_the_eldest_priest_desc:0 "The oldest of the priests takes the staff and the title, and rules the island from the temple court. He is never alone, for the rite is always with him."
 zin_regional_enhis_is_rond_the_fishing_fleets:0 "The Fishing Fleets"
 zin_regional_enhis_is_rond_the_fishing_fleets_desc:0 "Every dawn, a hundred sails leave the beaches of [ROOT.GetName] and spread across the water like gulls. They return at dusk with enough for the whole island and enough over to sell."
 zin_regional_enhis_is_rond_the_island_law:0 "The Island Law"
 zin_regional_enhis_is_rond_the_island_law_desc:0 "The island's law is taught to children as a chant, so that no one can claim not to know it. A dispute is settled when both sides can recite the same verse."
 zin_regional_enhis_is_rond_the_island_levy:0 "The Island Levy"
 zin_regional_enhis_is_rond_the_island_levy_desc:0 "Every village keeps a muster-roll and a stack of spears, and the priests bless both at the rite. The levy is large, quiet and very rarely called."
 zin_regional_enhis_is_rond_the_isles_stand_together:0 "The Isles Stand Together"
 zin_regional_enhis_is_rond_the_isles_stand_together_desc:0 "Boats go out to every neighbouring island carrying a knotted cord, the island way of saying that peace is promised. [ROOT.GetName] and its neighbours agree to keep the peace between them for as long as the war lasts."
 zin_regional_enhis_is_rond_the_low_tide_rite:0 "The Low-Tide Rite"
 zin_regional_enhis_is_rond_the_low_tide_rite_desc:0 "A causeway of laid stones is built to the shrine, passable only at the lowest tide. The rite is held there each year, and the island gathers on the shore to hear it."
 zin_regional_enhis_is_rond_the_name_is_answered:0 "The Name Is Answered"
 zin_regional_enhis_is_rond_the_name_is_answered_desc:0 "The name over the shrine door has an answer, and the priests have heard it. They sing the rite again that night, and the words mean something at last."
 zin_regional_enhis_is_rond_the_old_rite:0 "The Old Rite"
 zin_regional_enhis_is_rond_the_old_rite_desc:0 "The rite is sung at dawn and dusk on every terrace, and the chant is older than any priest-elder's memory. It binds the island together as a rope binds a boat."
 zin_regional_enhis_is_rond_the_priest_elders:0 "The Priest-Elders"
 zin_regional_enhis_is_rond_the_priest_elders_desc:0 "Enhis Is Rond is the most peopled of the southern isles, a round terraced island ruled by priest-elders. Priest-Elder Enhis keeps the rite and the law, and finds little difference between them."
 zin_regional_enhis_is_rond_the_shrine_beneath_the_tide:0 "The Shrine Beneath the Tide"
 zin_regional_enhis_is_rond_the_shrine_beneath_the_tide_desc:0 "Off the southern shore a ruined shrine stands beneath the tide, its door carved with a name. At the lowest tides the priests walk down to it and chant the name, as their fathers did."
 zin_regional_enhis_is_rond_the_shrine_wardens:0 "The Shrine Wardens"
 zin_regional_enhis_is_rond_the_shrine_wardens_desc:0 "Wardens are appointed from the oldest families to guard the drowned shrine. They serve for life and are buried in sight of it."
 zin_regional_enhis_is_rond_the_storm_years:0 "The Storm Years"
 zin_regional_enhis_is_rond_the_storm_years_desc:0 "Word arrives by every boat that the kings of the north and west are at war. The islanders of [ROOT.GetName] look out across the empty sea, count their stores and decide to keep the war on the far side of the horizon."
 zin_regional_enhis_is_rond_the_stranger_reads_the_stones:0 "The Stranger Reads the Stones"
 zin_regional_enhis_is_rond_the_stranger_reads_the_stones_desc:0 "A stranger from the sea read the old stones with our priests and went away quiet. He asked only how the name was sung, and he sang it back to them correctly."
 zin_regional_enhis_is_rond_the_stranger_reads_the_stones_tip_1:0 "A stranger from the sea read the old stones with our priests and went away quiet."
 zin_regional_enhis_is_rond_watch_the_southern_waves:0 "Watch the Southern Waves"
 zin_regional_enhis_is_rond_watch_the_southern_waves_desc:0 "Whatever else the war brings, it may bring ships. Lookouts take their places on the headlands of [ROOT.GetName], and the boats are kept ready on their rollers."
 zin_regional_enhis_is_rond_welcome_the_healers:0 "Welcome the Healers"
 zin_regional_enhis_is_rond_welcome_the_healers_desc:0 "The healers of the Deliverer ask for a house on the quay, where the sick can be tended and the hungry fed. [ROOT.GetName] gives them a building, a well and a cautious welcome."
 zin_regional_enhis_is_rond.1.a:0 "Keep the rite as our fathers did"
 zin_regional_enhis_is_rond.1.b:0 "Ask the old ones what the name means"
 zin_regional_enhis_is_rond.1.d:0 "At the lowest tide of the year the priests walk down to the drowned shrine and chant the old name. The island watches from the shore, as it has always done, and the children are told to be quiet."
 zin_regional_enhis_is_rond.1.t:0 "The Low-Tide Rite"
 zin_regional_enhis_is_rond.2.a:0 "The shrine is ours"
 zin_regional_enhis_is_rond.2.b:0 "Let them copy it"
 zin_regional_enhis_is_rond.2.d:0 "Scholars from the Deliverer's temples ask leave to copy the old inscription for their libraries. They are courteous, well supplied and very patient, and they do not say why they want it."
 zin_regional_enhis_is_rond.2.t:0 "Scholars at the Shrine"
 zin_regional_enhis_is_rond.3.a:0 "Carve his name beside it"
 zin_regional_enhis_is_rond.3.b:0 "Send our priests to tell the world"
 zin_regional_enhis_is_rond.3.d:0 "Word comes that the stranger has named himself in the courts of the north: Eindil, son of Ein, grandson of Aen. The priests of the drowned shrine now know whose name they have been chanting."
 zin_regional_enhis_is_rond.3.t:0 "The Name Is Answered"
