l_english:
 zin_regional_miaed_caravan_guards:0 "Caravan Guards"
 zin_regional_miaed_caravan_guards_desc:0 "Spearmen of the passes ride beside every caravan to the lower gate, in dust cloaks and with water for the beasts. The merchants say a guarded wagon is half a day faster."
 zin_regional_miaed_caravan_guards_of_the_passes:0 "Caravan Guards of the Passes"
 zin_regional_miaed_caravan_guards_of_the_passes_desc:0 "Spear-companies ride with the wagons from gate to gate, and the toll-keepers add their wage to the tariff. Merchants who once hired their own guards now hire none."
 zin_regional_miaed_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_miaed_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_miaed_close_the_houses:0 "Close the Houses"
 zin_regional_miaed_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_miaed_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_miaed_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_miaed_diggers_of_wells:0 "Diggers of Wells"
 zin_regional_miaed_diggers_of_wells_desc:0 "Teams of well-diggers travel the dry roads with ropes, buckets and divining rods. A well takes a season to sink and saves a hundred lives in the next drought."
 zin_regional_miaed_dune_riders:0 "Riders of the Dunes"
 zin_regional_miaed_dune_riders_desc:0 "Camel and horse riders cross a day's sand in a night."
 zin_regional_miaed_eastern_oath:0 "Oath to the King in the East"
 zin_regional_miaed_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_miaed_envoys_to_the_lands_of_light:0 "Envoys to the Lands of Light"
 zin_regional_miaed_envoys_to_the_lands_of_light_desc:0 "The tall realm to the south-west keeps a quiet court and a long memory. A courteous letter and a gift of dates open a correspondence that Miaed will value later."
 zin_regional_miaed_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_miaed_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_miaed_forewarned_passes:0 "The Passes Forewarned"
 zin_regional_miaed_forewarned_passes_desc:0 "A warning from the south was heeded before the dust rose, and the gates were mended, the cisterns filled and the horns tuned. Miaed will not be surprised."
 zin_regional_miaed_free_crown_court:0 "A Free Crown"
 zin_regional_miaed_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_miaed_gatekeeper_of_the_south:0 "Gatekeeper of the South"
 zin_regional_miaed_gatekeeper_of_the_south_desc:0 "The south road is shut by one hand and opened by it. Miaed's lord is known to every caravan master from the lakes to the sand, and none of them questions his gates."
 zin_regional_miaed_gatekeepers:0 "Gatekeepers of the South"
 zin_regional_miaed_gatekeepers_desc:0 "Every gate has its tally-keeper, its watch-tower and its horn, and every horn has been tried against the others. A rider cannot pass the high road unseen."
 zin_regional_miaed_generous_friends:0 "The Generous Friends"
 zin_regional_miaed_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_miaed_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_miaed_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_miaed_healing_houses:0 "Houses of Healing"
 zin_regional_miaed_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_miaed_heed_the_south:0 "Heed the South"
 zin_regional_miaed_heed_the_south_desc:0 "A warning from Gala speaks of danger in the south, and Lord Furanow has it copied for every gate. The wardens read it twice and mend what needs mending."
 zin_regional_miaed_hold_the_southern_passes:0 "Hold the Southern Passes"
 zin_regional_miaed_hold_the_southern_passes_desc:0 "The southern gates are closed, the cisterns sealed and the spear-companies posted on the ridge. Whatever comes up the road will come against stone."
 zin_regional_miaed_houses_of_healing:0 "Houses of Healing"
 zin_regional_miaed_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_miaed_into_the_deep_sand:0 "Into the Deep Sand"
 zin_regional_miaed_into_the_deep_sand_desc:0 "Beyond the farthest well the dunes run on, and no caravan has come back from their end. A scouting party of [ROOT.GetName] loads its camels and goes to see how far the desert goes."
 zin_regional_miaed_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_miaed_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_miaed_levies_for_the_host:0 "Levies for the Host"
 zin_regional_miaed_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_miaed_long_watch:0 "The Long Watch"
 zin_regional_miaed_long_watch_desc:0 "Lamps burn in the far towers all night, and the keepers write down what they see before sleeping. Little escapes the book."
 zin_regional_miaed_lord_of_the_passes:0 "Lord of the Passes"
 zin_regional_miaed_lord_of_the_passes_desc:0 "Miaed keeps the gates where the Sand Road climbs from the dunes to the high country, and every caravan pays for the climb. Lord Furanow owes neither Furvior nor Postondoroth, and means to keep it so."
 zin_regional_miaed_oasis_gardens:0 "Oasis Gardens"
 zin_regional_miaed_oasis_gardens_desc:0 "Date palms, pomegranates and small plots of barley ring the old springs of [ROOT.GetName]. In the middle of a hundred miles of dust, the smell of green is the court's greatest luxury."
 zin_regional_miaed_oasis_gardens_spirit:0 "Oasis Gardens"
 zin_regional_miaed_oasis_gardens_spirit_desc:0 "Date palms and barley ring the old springs, and green is the greatest luxury."
 zin_regional_miaed_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_miaed_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_miaed_own_counsel:0 "Our Own Counsel"
 zin_regional_miaed_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_miaed_pass_forts:0 "Forts in the Passes"
 zin_regional_miaed_pass_forts_desc:0 "New towers rise on the ridges above the gate, with beacon-stacks and wall-walks wide enough for two spearmen abreast. Any host that wants the high country will have to force these stones."
 zin_regional_miaed_pass_lords:0 "The Pass Lords"
 zin_regional_miaed_pass_lords_desc:0 "The wardens of each gate answer to a lord, and the lords answer to Lord Furanow. The arrangement is old, and nobody has found a better one."
 zin_regional_miaed_pass_tolls:0 "Tolls of the Passes"
 zin_regional_miaed_pass_tolls_desc:0 "The toll is the same for the riders of Furvior and the wagons of Postondoroth. A price that never changes is a price that nobody argues over."
 zin_regional_miaed_passage_for_furvior:0 "Passage for Furvior"
 zin_regional_miaed_passage_for_furvior_desc:0 "Furvior's riders are given the first watering and the best stabling. They keep the road clear of raiders in return, and ask a little more of Miaed's ear each year."
 zin_regional_miaed_passage_for_postondoroth:0 "Passage for Postondoroth"
 zin_regional_miaed_passage_for_postondoroth_desc:0 "Postondoroth's ledger-men are given a counting-house at the lower gate and a clerk at every cistern. They count the wagons twice and the water thrice."
 zin_regional_miaed_question_of_the_east:0 "The Question of the East"
 zin_regional_miaed_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_miaed_riders_of_the_dunes:0 "Riders of the Dunes"
 zin_regional_miaed_riders_of_the_dunes_desc:0 "Camel and horse riders of the desert know the dunes the way sailors know the sea. They cross a day's sand in a night and appear at a well before the enemy has found the road."
 zin_regional_miaed_scouts_of_the_waste:0 "Scouts of the Waste"
 zin_regional_miaed_scouts_of_the_waste_desc:0 "Light riders go out beyond the last well, three days at a time, and return with sketches and sunburn. What they find is written in the gatehouse book."
 zin_regional_miaed_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_miaed_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_miaed_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_miaed_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_miaed_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_miaed_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_miaed_the_desert_court:0 "The Desert Court"
 zin_regional_miaed_the_desert_court_desc:0 "The court meets under awnings in the shade of the lower fort, and petitioners wait in rows by the water jars. Justice is slow and rarely appealed."
 zin_regional_miaed_the_dry_roads:0 "The Dry Roads"
 zin_regional_miaed_the_dry_roads_desc:0 "South of the last green hills the road runs through sand and stone, and every drop of water has a name. The court of [ROOT.GetName] counts its wells and sends surveyors to look for more."
 zin_regional_miaed_the_gate_of_the_sands:0 "The Gate of the Sands"
 zin_regional_miaed_the_gate_of_the_sands_desc:0 "At the Gate of the Sands the Sand Road's branch meets the dunes, and every wagon is weighed. The toll-keepers have fixed a price and posted it on a bronze board."
 zin_regional_miaed_the_long_watch_of_miaed:0 "The Long Watch of Miaed"
 zin_regional_miaed_the_long_watch_of_miaed_desc:0 "The watch-towers are linked by beacon-lines, so that a lamp lit in the far desert is seen at the high gate within the hour. Miaed's wardens sleep lightly."
 zin_regional_miaed_the_lords_justice:0 "The Lord's Justice"
 zin_regional_miaed_the_lords_justice_desc:0 "Lord Furanow's seal on a ruling ends the dispute, and the lords have learned to carry their quarrels to him early. A fair verdict is worth more than a lost season of tolls."
 zin_regional_miaed_the_pass_lords:0 "The Pass Lords"
 zin_regional_miaed_the_pass_lords_desc:0 "Each pass has its lord, and each lord keeps a company of wardens and a book of tolls. Furanow meets them at the turn of every season and hears all their complaints."
 zin_regional_miaed_the_sand_road_branch:0 "The Sand Road Branch"
 zin_regional_miaed_the_sand_road_branch_desc:0 "The branch road is paved to the lower gate with dressed stone, and wells are dug at every day's march. A wagon that once took ten days now takes eight."
 zin_regional_miaed_tolls_for_all:0 "Tolls for All"
 zin_regional_miaed_tolls_for_all_desc:0 "The same price for every banner, written on the gate and kept for a generation. Neither the riders nor the bankers love it, and both pay it."
 zin_regional_miaed_wait_upon_events:0 "Wait Upon Events"
 zin_regional_miaed_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_miaed_wardens_of_the_high_road:0 "Wardens of the High Road"
 zin_regional_miaed_wardens_of_the_high_road_desc:0 "Wardens ride the high road at night with lanterns and spears, and the rock-cut fort at the capital's gate is given a second wall."
 zin_regional_miaed_watch_on_the_far_marches:0 "Watch on the Far Marches"
 zin_regional_miaed_watch_on_the_far_marches_desc:0 "Miaed's south-west is a long edge of rock, sand and silence. Watch-posts are set out along it, and each is told to report what it sees and not what it expects."
 zin_regional_miaed_watch_the_quays:0 "Watch the Quays"
 zin_regional_miaed_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_miaed_watchful_quays:0 "Watchful Quays"
 zin_regional_miaed_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_miaed_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_miaed_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_miaed_when_the_king_falls:0 "When the King Falls"
 zin_regional_miaed_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_miaed_word_from_the_passes:0 "A Warning From the Passes"
 zin_regional_miaed.1.a:0 "Raise the toll"
 zin_regional_miaed.1.b:0 "Wave the riders through"
 zin_regional_miaed.1.c:0 "Wave the bankers through"
 zin_regional_miaed.1.d:0 "Caravans queue for a mile below the high gate, riders from Furvior at the head and Postondoroth's wagons behind them. The gate-wardens look to Lord Furanow, who must decide whose beasts go through first."
 zin_regional_miaed.1.t:0 "Lord of the Passes"
 zin_regional_miaed.2.a:0 "Keep the report in the gatehouse"
 zin_regional_miaed.2.b:0 "Write to Furvior and Postondoroth"
 zin_regional_miaed.2.d:0 "Scouts return from the far desert with tales of heat-haze, dust columns and empty forts. None of them can say what raised the dust, and the oldest scout will only say that the sand has not looked like that before."
 zin_regional_miaed.2.t:0 "Scouts of the Waste"
 zin_regional_miaed.3.a:0 "Keep the report in the gatehouse"
 zin_regional_miaed.3.b:0 "Write to Furvior and Postondoroth"
 zin_regional_miaed.3.d:0 "Scouts return from the far desert with word of long columns marching north under dark banners, and of forts that were empty a season ago now standing watch. The old songs of the passes spoke of such armies; the scouts had hoped they were only songs."
 zin_regional_miaed.3.t:0 "Scouts of the Waste"
