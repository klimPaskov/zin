l_english:
 zin_coldor_a_share_of_the_plunder:0 "A Share of the Plunder"
 zin_coldor_a_share_of_the_plunder_desc:0 "The Western Crossing has begun, and the Queen asks what her share will be. She sends cogs to carry the host of the West."
 zin_coldor_a_watch_on_mpe:0 "A Watch on Mp'E"
 zin_coldor_a_watch_on_mpe_desc:0 "With the guardian gone, a company keeps watch on the approaches of the castle, lest the wrong hands claim what lies within."
 zin_coldor_answer_the_heirs_call:0 "Answer the Heir's Call"
 zin_coldor_answer_the_heirs_call_desc:0 "The King Without a House has come back and asks for the Cold Lands' aid. The White Companies sail."
 zin_coldor_beyond_the_last_steading:0 "Beyond the Last Steading"
 zin_coldor_beyond_the_last_steading_desc:0 "The Queen's wardens set out for the far north-west, where the maps end and the ice begins. Warden Ysolde leads them."
 zin_coldor_border_forts_of_coldor:0 "Border Forts of Coldor"
 zin_coldor_border_forts_of_coldor_desc:0 "Coldor raises its own line of stone keeps opposite Isengard's towers. Neither side will say they are meant for war."
 zin_coldor_chancellors_ledgers:0 "The Steward's Ledgers"
 zin_coldor_chancellors_ledgers_desc:0 "The Queen's steward lays a year's grain, furs and iron before her in a single book. The books are honest, and the sums are grim."
 zin_coldor_chancellors_ledgers_spirit:0 "The Steward's Ledgers"
 zin_coldor_chancellors_ledgers_spirit_desc:0 "Every barrel, bale and bar of iron is written in the steward's books. The court may not like the numbers, but it can no longer pretend to ignore them."
 zin_coldor_charter_for_isengard:0 "A Charter for Isengard"
 zin_coldor_charter_for_isengard_desc:0 "A charter is drawn that lets Isengard keep its warlord, its forts and its law, and asks only that it sit with the Accord."
 zin_coldor_close_the_ports_to_war:0 "Close the Ports to War"
 zin_coldor_close_the_ports_to_war_desc:0 "Harbour chains are drawn and the harbour-masters ordered to turn away every ship of war. The merchants complain, and the sea stays quiet."
 zin_coldor_coastal_watch:0 "The Coastal Watch"
 zin_coldor_coastal_watch_desc:0 "Watch-towers and chain-booms rise at the harbour mouths. Raiders from the sea will find the coast awake."
 zin_coldor_cold_lands_at_peace:0 "The Cold Lands at Peace"
 zin_coldor_cold_lands_at_peace_desc:0 "The march lies quiet, the passes are open and the Queen's attention is free for the first time in a generation."
 zin_coldor_cold_seas:0 "Masters of the Cold Seas"
 zin_coldor_cold_seas_desc:0 "Cold Coast captains navigate by sounding and instinct through ice and fog that would send a southern crew home in a week."
 zin_coldor_count_isengards_forts:0 "Count Isengard's Forts"
 zin_coldor_count_isengards_forts_desc:0 "Scouts walk the border and count the towers, ditches and garrisons. The tally is longer than the court expected."
 zin_coldor_crown_of_850:0 "The Crown of 850"
 zin_coldor_crown_of_850_desc:0 "In 850 the clans of the interior swore one oath beneath one banner. Isengard remembers the oath too, and remembers refusing it."
 zin_coldor_crown_of_850_tip_1:0 "The interior was made one in 850. Isengard remembers it too."
 zin_coldor_deep_iron_mines:0 "The Deep Iron Mines"
 zin_coldor_deep_iron_mines_desc:0 "Shafts are sunk below the frost line, braced with timbers hauled from the western slopes. The seams run black and rich."
 zin_coldor_envoys_to_isengard:0 "Envoys to Isengard"
 zin_coldor_envoys_to_isengard_desc:0 "The Queen's envoys cross the march under a white flag, with gifts for Isengard's warlord. They are received, though not warmly."
 zin_coldor_envoys_to_the_steadings:0 "Envoys to the Steadings"
 zin_coldor_envoys_to_the_steadings_desc:0 "Skilled speakers of the court are sent to the free steadings with gifts of salt and promises of protection."
 zin_coldor_far_ice_wardens:0 "Wardens of the Far Ice"
 zin_coldor_far_ice_wardens_desc:0 "A chain of watch-huts across the ice fields keeps travellers alive and strangers noticed."
 zin_coldor_favour_the_ports:0 "Favour the Ports"
 zin_coldor_favour_the_ports_desc:0 "Harbour-Master Alorio's argument carries the day: ships, timber and trade with the West will make Coldor rich, whatever the steadings say."
 zin_coldor_favour_the_steadings:0 "Favour the Steadings"
 zin_coldor_favour_the_steadings_desc:0 "The clans of the interior hold the passes and fill the levies. The Queen judges that a crown is only as strong as the steadings that feed it."
 zin_coldor_fires_through_the_long_night:0 "Fires Through the Long Night"
 zin_coldor_fires_through_the_long_night_desc:0 "Great hearths burn in every hall of the Cold Lands from Mistfall to Thaw. Those who tend them are honoured; those who let them die are not."
 zin_coldor_forges_of_fandanar:0 "The Forges of Fandanar"
 zin_coldor_forges_of_fandanar_desc:0 "Furnaces roar in the stone halls beneath the Queen's seat. The smiths of Fandanar make blades that do not crack in the cold."
 zin_coldor_frost_hardened:0 "Frost-Hardened"
 zin_coldor_frost_hardened_desc:0 "Furs, felt and fat-greased boots are issued to every soldier. The cold becomes a nuisance and no longer an enemy."
 zin_coldor_frozen_crown:0 "The Frozen Crown"
 zin_coldor_frozen_crown_desc:0 "A third of the Cold Lands takes counsel from Fandanar, and the Queen finds that hearing many voices keeps her sharp."
 zin_coldor_fur_trade:0 "The Fur Trade"
 zin_coldor_fur_trade_desc:0 "White-cloaked traders carry the pelts of the north to the western quays. The wealth is real, and the hunters' hunger for coin is real too."
 zin_coldor_giants_on_the_passes:0 "Giants on the Passes"
 zin_coldor_giants_on_the_passes_desc:0 "Giants of Titanos stand watch on the high passes, taller than the watchtowers and unimpressed by raiders."
 zin_coldor_giants_on_the_passes_spirit:0 "Giants on the Passes"
 zin_coldor_giants_on_the_passes_spirit_desc:0 "A giant on a pass is a landmark, a wall and a rumour all at once. Few raiders test whether the rumour is true."
 zin_coldor_gifts_of_salt_and_iron:0 "Gifts of Salt and Iron"
 zin_coldor_gifts_of_salt_and_iron_desc:0 "A second embassy brings what the yeti value: salt for their meat and iron for their tools."
 zin_coldor_grain_from_the_west:0 "Grain from the West"
 zin_coldor_grain_from_the_west_desc:0 "Traders from the West Lands bring wheat and barley to Coldor's quays in exchange for furs and timber. The winter stores fill without anyone going hungry."
 zin_coldor_grindoks_drill:0 "Marshal Grindok's Drill"
 zin_coldor_grindoks_drill_desc:0 "The old marshal's drill book is read at every muster: how to march in wind, how to sleep in snow and how to die last."
 zin_coldor_guard_outside_the_hall:0 "Stand Guard Outside the Hall"
 zin_coldor_guard_outside_the_hall_desc:0 "A small company is posted outside the castle gate, to keep strangers away and, if need be, to tell the keeper of the hall that someone is coming."
 zin_coldor_guides_of_the_snow:0 "Guides of the Snow"
 zin_coldor_guides_of_the_snow_desc:0 "Trappers who know the trails to the far north are paid to guide travellers. They ask no questions, and they remember faces."
 zin_coldor_halls_of_stone:0 "Halls of Stone"
 zin_coldor_halls_of_stone_desc:0 "Quarrymen and masons raise long halls where whole clans can winter under one roof. They are warm, and they are built to last."
 zin_coldor_harbour_charter:0 "The Harbour-Master's Charter"
 zin_coldor_harbour_charter_desc:0 "Fair dues, open berths and an honest weigh-house. Captains who put in to a Coldor harbour tend to come back."
 zin_coldor_harbour_masters_charter:0 "The Harbour-Master's Charter"
 zin_coldor_harbour_masters_charter_desc:0 "Alorio's charter sets fair dues and open berths for every flag. Captains from the West Lands begin to prefer Coldor's harbours to their own."
 zin_coldor_hearth_and_height:0 "Hearth and Height"
 zin_coldor_hearth_and_height_desc:0 "The pacts are renewed at their highest level. In war, the old peoples will answer a call from Fandanar, if they judge it just."
 zin_coldor_hide_and_wool:0 "Hide and Wool"
 zin_coldor_hide_and_wool_desc:0 "Fleeces, hides and felted cloth are made in bulk by the steading women. The Host will be clothed before the snow comes."
 zin_coldor_hide_and_wool_spirit:0 "Hide and Wool"
 zin_coldor_hide_and_wool_spirit_desc:0 "Felted cloaks, greased boots and good leather mittens are issued to every soldier. The cold has fewer teeth."
 zin_coldor_high_crown_of_the_north:0 "High Crown of the North"
 zin_coldor_high_crown_of_the_north_desc:0 "The Queen is crowned a second time, in the stone hall at the head of the Neck Road. The clans bring white furs and keep their swords."
 zin_coldor_high_crown_of_the_north_spirit:0 "High Crown of the North"
 zin_coldor_high_crown_of_the_north_spirit_desc:0 "Crowned twice and owed oaths by a hundred chiefs, the Queen of Coldor speaks and the Cold Lands, for the most part, listen."
 zin_coldor_highland_roads:0 "Highland Roads"
 zin_coldor_highland_roads_desc:0 "Roads cut across the high passes tie Horidor's valleys to Fandanar. The pack-teams that use them are glad of the way-houses."
 zin_coldor_iron_and_furs:0 "Iron and Furs"
 zin_coldor_iron_and_furs_desc:0 "The wealth of the interior is iron under the rock and fur on the hunters' backs. The Queen resolves to count both and spend them on purpose."
 zin_coldor_isengard_must_kneel:0 "Isengard Must Kneel"
 zin_coldor_isengard_must_kneel_desc:0 "Isengard's last refusal ends the Queen's patience. The Winter Host marches, and this time it does not stop at the march."
 zin_coldor_isengard_question:0 "The Isengard Question"
 zin_coldor_isengard_question_desc:0 "Isengard refused the oath of 850 and has kept its borders with pride ever since. Fandanar must decide whether to answer pride with patience or with iron."
 zin_coldor_isengard_swears:0 "Isengard Swears"
 zin_coldor_isengard_swears_desc:0 "Isengard's warlord rides to Fandanar and kneels, stiffly, before the Queen. Whatever his pride may be, he has sworn."
 zin_coldor_kin_of_the_north:0 "Kin of the North"
 zin_coldor_kin_of_the_north_desc:0 "Isengard's hearths are fed from Coldor's stores and its walls mended with Coldor's iron. It is easier to love a friend who feeds you."
 zin_coldor_kinship_with_horidor:0 "Kinship with Horidor"
 zin_coldor_kinship_with_horidor_desc:0 "Horidor's chief and the Queen share a cup at the border stone. Their clans have married across the line for as long as anyone remembers."
 zin_coldor_law_of_the_long_winter:0 "Law of the Long Winter"
 zin_coldor_law_of_the_long_winter_desc:0 "A law sets out who feeds whom when the snows close the roads. It is written in short, hard sentences, in the manner of the interior."
 zin_coldor_law_of_the_long_winter_spirit:0 "Law of the Long Winter"
 zin_coldor_law_of_the_long_winter_spirit_desc:0 "The law is short and hard and everyone knows it by heart: feed your neighbour, keep your fire and do not sell what the winter will need."
 zin_coldor_leave_the_hall_in_peace:0 "Leave the Hall in Peace"
 zin_coldor_leave_the_hall_in_peace_desc:0 "The Queen decrees that no host of Coldor shall approach the silent castle uninvited. The north is wide enough for both."
 zin_coldor_long_night_fires:0 "Fires Through the Long Night"
 zin_coldor_long_night_fires_desc:0 "The great hearths of the halls never go cold, and builders work by firelight when the sun does not rise."
 zin_coldor_long_sea_road:0 "The Long Sea Road to Parim"
 zin_coldor_long_sea_road_desc:0 "Cogs of Coldor cross the central sea to the Lake and return with Aenoran silver. It is a long road, and it pays."
 zin_coldor_marriage_across_the_march:0 "A Marriage Across the March"
 zin_coldor_marriage_across_the_march_desc:0 "A match is proposed between the house of Fandanar and the house of Isengard. Weddings across the march have ended feuds before."
 zin_coldor_marshals_counsel:0 "The Marshal's Counsel"
 zin_coldor_marshals_counsel_desc:0 "Marshal Grindok Azlen speaks of snow, supply and the hard sums of marching in winter. The council listens, because he has never once been wrong about the cold."
 zin_coldor_masters_of_the_cold_seas:0 "Masters of the Cold Seas"
 zin_coldor_masters_of_the_cold_seas_desc:0 "A fleet that sails in ice and fog is a fleet no southern captain wants to meet. The flotillas of the Cold Coast earn a name."
 zin_coldor_neutral_ports:0 "Ports Closed to War"
 zin_coldor_neutral_ports_desc:0 "No ship of war may anchor in a Coldor harbour. Merchants grumble, and the harbours stay empty of trouble."
 zin_coldor_northern_accord:0 "The Northern Accord"
 zin_coldor_northern_accord_desc:0 "Coldor and Horidor have kept the old league of the north for generations. The Queen sends a rider to Horidor's hall to renew it."
 zin_coldor_northern_coast_watch:0 "The Northern Coast Watch"
 zin_coldor_northern_coast_watch_desc:0 "Fishing villages on the northern shore are given spyglasses, horns and a signal code. They will see ships long before the ships see them."
 zin_coldor_northern_squadrons:0 "The Northern Fleet"
 zin_coldor_northern_squadrons_desc:0 "Captain Harl of the Cold Coast is given a flotilla of the new cogs and told to keep the sea lanes clear of pirates, and of worse."
 zin_coldor_northern_workshops:0 "The Northern Workshops"
 zin_coldor_northern_workshops_desc:0 "In the lee of the mountains, guild halls of smiths, wrights and tanners turn out tools for the whole of the north."
 zin_coldor_one_banner:0 "One Banner of the Ice"
 zin_coldor_one_banner_desc:0 "The white banner flies from coast to coast. No chief of the Accord thinks himself a vassal, and none thinks of leaving."
 zin_coldor_one_banner_of_the_ice:0 "One Banner of the Ice"
 zin_coldor_one_banner_of_the_ice_desc:0 "From the western ports to the northern coasts the white banner flies. The Cold Lands have never been so nearly one."
 zin_coldor_one_crown_of_ice:0 "One Crown of Ice"
 zin_coldor_one_crown_of_ice_desc:0 "With the quarrel settled, harbour, hill and steading answer to one seat. The Queen's court breathes out."
 zin_coldor_open_the_accord:0 "Open the Accord"
 zin_coldor_open_the_accord_desc:0 "The Accord's doors are thrown wide. Any steading, town or hold may join, on the Queen's word that it will be protected and not ruled."
 zin_coldor_opinion_friendship:0 "Friends of the Winter Crown"
 zin_coldor_ports_against_interior:0 "Ports Against the Interior"
 zin_coldor_ports_against_interior_desc:0 "The harbour-masters of the west and the clan-chiefs of the interior have quarrelled for as long as the crown has been worn. The Queen's court spends half its strength keeping the peace between them."
 zin_coldor_ports_and_steadings:0 "Ports and Steadings"
 zin_coldor_ports_and_steadings_desc:0 "The coast wants ships and the hills want levies, and both want the Queen's ear. She must choose whom to disappoint first."
 zin_coldor_ports_ascendant:0 "The Ports Ascendant"
 zin_coldor_ports_ascendant_desc:0 "Harbour-masters sit at the Queen's right hand, and her treasury counts its wealth in cogs and cargo. The steadings are told to be patient."
 zin_coldor_provisions_for_the_stranger:0 "Provisions for the Stranger"
 zin_coldor_provisions_for_the_stranger_desc:0 "Furs, bread and a guide are sent to the man from the ice to see him south. The Queen asks nothing in return."
 zin_coldor_queens_council:0 "The Queen's Council"
 zin_coldor_queens_council_desc:0 "Vaestia calls her councillors to the long table of Fandanar and asks them for the truth. They give her the whole of it, and she thanks them for it."
 zin_coldor_queens_progress:0 "The Queen's Progress"
 zin_coldor_queens_progress_desc:0 "Vaestia travels from steading to steading by sledge, eating at every hearth and hearing every grievance. The clans do not forget a ruler who came in person."
 zin_coldor_shipwrights_of_the_cold_coast:0 "Shipwrights of the Cold Coast"
 zin_coldor_shipwrights_of_the_cold_coast_desc:0 "Yards in the fjords build cogs of pine and oak, with hulls tarred against the ice."
 zin_coldor_sledge_roads:0 "The Sledge Roads"
 zin_coldor_sledge_roads_desc:0 "Packed-snow roads are marked with cairns and way-houses from the interior to the coast. A laden sledge can cross the Cold Lands before the thaw."
 zin_coldor_snow_runners:0 "The Snow-Runners"
 zin_coldor_snow_runners_desc:0 "Skirmishers on broad wooden snowshoes cross drifts that stop horses. They arrive unseen and leave the same way."
 zin_coldor_snow_runners_spirit:0 "The Snow-Runners"
 zin_coldor_snow_runners_spirit_desc:0 "Light foot on broad snowshoes cross the drifts in half the time. They arrive tired, and they arrive first."
 zin_coldor_stand_apart:0 "The Cold Lands Stand Apart"
 zin_coldor_stand_apart_desc:0 "Coldor declares that the war in the south is not its war. The ports will close, the passes will be watched and the winter will do the rest."
 zin_coldor_stand_apart_spirit:0 "The Cold Lands Stand Apart"
 zin_coldor_stand_apart_spirit_desc:0 "The Queen has declared that the war in the south is not Coldor's, and the land is quiet. It is a peace paid for with a little pride."
 zin_coldor_steading_charters:0 "Steading Charters"
 zin_coldor_steading_charters_desc:0 "Written charters set out what each steading owes and what it is owed. The Queen's seal is cheap to give and dear to break."
 zin_coldor_steadings_ascendant:0 "The Steadings Ascendant"
 zin_coldor_steadings_ascendant_desc:0 "The clans of the interior are the crown's first care, and their levies are quick to muster. The coast, in the meantime, is left to look after itself."
 zin_coldor_the_coast_towns:0 "The Coast Towns"
 zin_coldor_the_coast_towns_desc:0 "Holdon and Wonderland sell fish and amber from their small harbours. Both would gladly have a strong friend at their backs."
 zin_coldor_the_cold_endures:0 "The Cold Endures"
 zin_coldor_the_cold_endures_desc:0 "The Cold Lands refused the war and survived it. The Queen's court holds that this, too, is a kind of victory."
 zin_coldor_the_cold_lands_at_peace:0 "The Cold Lands at Peace"
 zin_coldor_the_cold_lands_at_peace_desc:0 "The old quarrel is ended, by oath or by conquest. The march falls quiet and the passes stand open from sea to sea."
 zin_coldor_the_empty_hall:0 "The Empty Hall"
 zin_coldor_the_empty_hall_desc:0 "Word reaches Fandanar that the castle's guardian is gone. What stands in his hall now is a matter for the Queen's council."
 zin_coldor_the_fearno_question:0 "The Fearno Question"
 zin_coldor_the_fearno_question_desc:0 "Fearno lies between Coldor and the free towns. Its stewards must be asked, with courtesy, whether they will walk the road beside the Accord."
 zin_coldor_the_frost_kings_hall:0 "Envoys to the Frost-King's Hall"
 zin_coldor_the_frost_kings_hall_desc:0 "Messengers with gifts climb to the hall of the ice giants of Titanos. The doors are very large, and they open."
 zin_coldor_the_frozen_crown:0 "The Frozen Crown"
 zin_coldor_the_frozen_crown_desc:0 "With a third of the Cold Lands taking her counsel, Vaestia wears her crown among chiefs who have never seen a king."
 zin_coldor_the_fur_trade:0 "The Fur Trade"
 zin_coldor_the_fur_trade_desc:0 "Traders in white cloaks carry sable, ermine and fox to the western ports, where ship captains pay in silver and spice."
 zin_coldor_the_giants_toll:0 "The Giants' Toll"
 zin_coldor_the_giants_toll_desc:0 "The giants ask a toll for the passes: so many sacks of grain, so many barrels of mead. It is a price the Queen is glad to pay."
 zin_coldor_the_houseless_king:0 "The King Without a House"
 zin_coldor_the_houseless_king_desc:0 "Travellers from the south say the man from the ice leads a host and is hailed as a king. Fandanar sends greetings, and waits."
 zin_coldor_the_hunters_trade:0 "The Hunters' Trade"
 zin_coldor_the_hunters_trade_desc:0 "Walrus-hunters and seal-takers from the far coasts trade tusks and rendered fat for iron and cloth. The Queen's tax-gatherers follow close behind."
 zin_coldor_the_hunting_grounds:0 "Envoys to the Hunting Grounds"
 zin_coldor_the_hunting_grounds_desc:0 "Messengers carrying salt and iron walk to the yeti of the high hunting grounds. They return with tales, and with a nod."
 zin_coldor_the_iron_hand:0 "The Iron Hand"
 zin_coldor_the_iron_hand_desc:0 "The Queen resolves that Isengard will be brought to the Accord by force of arms if it will not come by choice."
 zin_coldor_the_iron_levy:0 "The Iron Levy"
 zin_coldor_the_iron_levy_desc:0 "Each steading sends its quota of men to the Queen's muster, bearing its own spear and shield."
 zin_coldor_the_march_forts:0 "The March Forts"
 zin_coldor_the_march_forts_desc:0 "The border keeps are manned and the order given. The war on the march begins, small and bitter, over towers and ford roads."
 zin_coldor_the_north_remembers:0 "The North Remembers"
 zin_coldor_the_north_remembers_desc:0 "The war is over, the dark is broken, and the Cold Lands remember who stood at their side. The Queen's court counts its debts and its friends."
 zin_coldor_the_old_pacts:0 "The Old Pacts"
 zin_coldor_the_old_pacts_desc:0 "The pacts are sworn with fire and stone. They bind no one to anything but friendship, which is already a great deal."
 zin_coldor_the_old_peoples:0 "The Old Peoples of the Ice"
 zin_coldor_the_old_peoples_desc:0 "Beyond the last steading live peoples who answer to no crown. The Queen sends gifts instead of orders."
 zin_coldor_the_open_hand:0 "The Open Hand"
 zin_coldor_the_open_hand_desc:0 "The Queen resolves to offer Isengard a place at the table, with no condition but peace."
 zin_coldor_the_silent_castle:0 "Legends of the Silent Castle"
 zin_coldor_the_silent_castle_desc:0 "Traders speak of a castle in the frozen north, and of a light there that does not fail."
 zin_coldor_the_silent_castle_tip_1:0 "Traders speak of a castle in the frozen north, and a light that does not fail."
 zin_coldor_the_western_contracts:0 "The Western Contracts"
 zin_coldor_the_western_contracts_desc:0 "Contracts for timber, ships and iron are signed with western shipping houses. The coffers fill and the ports hum."
 zin_coldor_the_western_ports:0 "The Western Ports"
 zin_coldor_the_western_ports_desc:0 "Where the Cold Lands meet the western sea, Harbour-Master Alorio keeps a dozen ports open through all but the worst ice."
 zin_coldor_the_white_companies:0 "The White Companies"
 zin_coldor_the_white_companies_desc:0 "Volunteers from every steading are mustered under white banners to sail south to the living. They go to fight beside strangers, and the Queen blesses them."
 zin_coldor_the_white_companies_hold:0 "The White Companies Hold"
 zin_coldor_the_white_companies_hold_desc:0 "Far from home, the White Companies hold a line for the living. They have not been broken, and the Cold Lands sing of them."
 zin_coldor_the_white_host:0 "The White Host"
 zin_coldor_the_white_host_desc:0 "Clad in white cloaks and carrying white-painted shields, the army marches out of the blizzard like a second winter."
 zin_coldor_the_white_road:0 "The White Road"
 zin_coldor_the_white_road_desc:0 "A road of packed snow and ice-markers runs from the last steading into the far north-west. It is the first road ever laid there."
 zin_coldor_the_windwaith_question:0 "The Windwaith Question"
 zin_coldor_the_windwaith_question_desc:0 "Windwaith's harbours rival Coldor's on the same coast. The Harbour-Master suggests a compact in place of a quarrel."
 zin_coldor_the_winter_army:0 "The Winter Army"
 zin_coldor_the_winter_army_desc:0 "Marshal Grindok Azlen's army drills in the hardest season, because it will have to fight in it."
 zin_coldor_the_winter_host:0 "The Winter Host"
 zin_coldor_the_winter_host_desc:0 "The finest soldiers of the Queen assemble in the great hall of Fandanar, a host that does not fear snow."
 zin_coldor_the_winter_wall:0 "The Winter Wall"
 zin_coldor_the_winter_wall_desc:0 "Walls of ice and stone are thrown across the main passes and coastal approaches. If the war comes north, it will find the Cold Lands ready."
 zin_coldor_the_world_beyond_the_ice:0 "The World Beyond the Ice"
 zin_coldor_the_world_beyond_the_ice_desc:0 "War has come to the south, and the Cold Lands cannot pretend not to hear it. The Queen's council meets to choose a road."
 zin_coldor_timber_and_ships:0 "Timber and Ships for the West"
 zin_coldor_timber_and_ships_desc:0 "Coldor sells masts, planking and cogs to the West Lands. The Queen insists on being paid in advance."
 zin_coldor_timber_for_the_west:0 "Timber for the West"
 zin_coldor_timber_for_the_west_desc:0 "Western shipyards pay silver for Cold Lands pine. The Queen decides that selling the West its masts is no sin, whatever it builds with them."
 zin_coldor_trackers_in_the_snow:0 "Trackers in the Snow"
 zin_coldor_trackers_in_the_snow_desc:0 "Yeti trackers walk beside the Queen's scouts, and no patrol is lost in the snow while they are near."
 zin_coldor_walls_of_isengard:0 "The Walls of Isengard"
 zin_coldor_walls_of_isengard_desc:0 "Isengard's keeps stand on high stone, and the Host must take them one by one. The assault will be long, and cold, and costly."
 zin_coldor_walls_of_isengard_spirit:0 "The Walls of Isengard"
 zin_coldor_walls_of_isengard_spirit_desc:0 "The Host breaks itself on Isengard's keeps and grows stronger for it. Every tower taken is a lesson learned and paid for."
 zin_coldor_war_sledges:0 "War-Sledges"
 zin_coldor_war_sledges_desc:0 "Sledges mounted with ballistae and shield-walls speed across the ice behind teams of dogs. They are loud, ugly and very fast."
 zin_coldor_war_sledges_spirit:0 "War-Sledges"
 zin_coldor_war_sledges_spirit_desc:0 "Dog-drawn sledges with shield-wall and bolt-thrower speed across the ice. The supply wagons have no complaint."
 zin_coldor_wardens_of_the_far_ice:0 "Wardens of the Far Ice"
 zin_coldor_wardens_of_the_far_ice_desc:0 "A chain of watch-huts is raised across the ice fields, each manned by a warden and a pair of dogs."
 zin_coldor_wardens_of_the_peaks:0 "Wardens of the Peaks"
 zin_coldor_wardens_of_the_peaks_desc:0 "Mountain wardens trained to hold the high passes are issued the new spears and bows. The passes are theirs."
 zin_coldor_watch_fires_of_the_north:0 "Watch-Fires of the North"
 zin_coldor_watch_fires_of_the_north_desc:0 "Beacons on the northern headlands are lit every night, and a sentry on each counts the ships that pass."
 zin_coldor_white_companies_abroad:0 "The White Companies Abroad"
 zin_coldor_white_companies_abroad_desc:0 "Far from the snow, the volunteers of the Cold Lands fight in white and sing in the old tongue. They are not easy to break."
 zin_coldor_white_host:0 "The White Host"
 zin_coldor_white_host_desc:0 "Clad in white and drilled in a blizzard, the Host fights as if the cold itself were on its side."
 zin_coldor_winter_crown:0 "The Winter Crown of Fandanar"
 zin_coldor_winter_crown_desc:0 "Queen Vaestia sits beneath the white banner at Fandanar, heir to a crown the interior made in 850 and the ports have never quite forgiven. The first work of a queen is to hear them all."
 zin_coldor_winter_crown_spirit:0 "The Winter Crown"
 zin_coldor_winter_crown_spirit_desc:0 "The white banner of Fandanar hangs in every hall of the interior, and the clans have learned to look up when it is raised."
 zin_coldor_winter_moot_gifts:0 "Gifts for the Winter Moot"
 zin_coldor_winter_moot_gifts_desc:0 "At the Winter Moot the Queen gives furs, salt and iron to every chief who comes. No one forgets who fed them."
 zin_coldor_winter_stores:0 "Winter Stores"
 zin_coldor_winter_stores_desc:0 "Every steading is bidden to lay up grain and salted meat against the long dark, and the Queen's stewards check the barrels one by one."
 zin_coldor_winter_wall:0 "The Winter Wall"
 zin_coldor_winter_wall_desc:0 "Walls of ice and stone close the passes, and ditches are flooded to freeze. Any host that wants the Cold Lands will have to climb for them."
 zin_coldor_word_from_the_far_ice:0 "Word from the Far Ice"
 zin_coldor_word_from_the_far_ice_desc:0 "The wardens report that a man has been found alive in the ice, with no name and no memory of how he came there."
 zin_coldor_yeti_trackers:0 "Trackers in the Snow"
 zin_coldor_yeti_trackers_desc:0 "Yeti trackers range ahead of every column and read the drifts as a clerk reads a page. Nobody gets lost, and nobody is ambushed."
 zin_coldor.1.a:0 "The ports pay for the crown."
 zin_coldor.1.b:0 "The steadings are the crown."
 zin_coldor.1.d:0 "At the long table in Fandanar the Harbour-Master and the Marshal both ask for the Queen's favour. One wants ships to carry the crown's name to the western sea; the other wants levies to hold the passes. Both are right, and only one can be answered first."
 zin_coldor.1.t:0 "Ports and Steadings"
 zin_coldor.2.a:0 "Friends of the Winter Crown."
 zin_coldor.2.b:0 "Fearno stands alone."
 zin_coldor.2.d:0 "A rider in white furs reaches the stewards of Fearno with a letter under the Queen's seal. Coldor offers the friendship of the Northern Accord and the protection of its spears, and asks only that Fearno name Fandanar its friend."
 zin_coldor.2.t:0 "Fandanar Asks for Friendship"
 zin_coldor.3.a:0 "Let the north keep its silence."
 zin_coldor.3.d:0 "The riders from the north say that the light in the silent castle still burns, but nobody comes to the gate any more. The guardian is gone. Fandanar will not ask who ended him."
 zin_coldor.3.t:0 "The Empty Hall"
