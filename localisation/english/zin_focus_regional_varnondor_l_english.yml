l_english:
 zin_regional_varnondor_a_delegate_from_the_capes:0 "A Delegate from the Capes"
 zin_regional_varnondor_a_delegate_from_the_capes_desc:0 "A cape lord is sent to sit at the Ford Council. He brings his own chair, a chart of the approaches and a firm opinion about where the fleet should anchor."
 zin_regional_varnondor_anchorages_of_the_peninsula:0 "Anchorages of the Peninsula"
 zin_regional_varnondor_anchorages_of_the_peninsula_desc:0 "Deep-water anchorages are marked with buoys and moorings, and a harbour-master is stationed at each. A hundred ships can lie in them in a gale."
 zin_regional_varnondor_approach_watchers:0 "Watchers of the Approaches"
 zin_regional_varnondor_approach_watchers_desc:0 "The capes of Varnondor face the wide central sea, and every headland has its lamp and its watchman. Not a hull has come within a day's sail unseen since the First Age."
 zin_regional_varnondor_approaches_closed:0 "The Approaches Closed"
 zin_regional_varnondor_approaches_closed_desc:0 "The king has barred the sea-lanes past his capes to every war-fleet. His forts are manned, his chains are drawn and his lanterns are dark."
 zin_regional_varnondor_bows_of_the_capes:0 "Bows of the Capes"
 zin_regional_varnondor_bows_of_the_capes_desc:0 "The cape bowmen shoot from the walls of the forts and from the decks of the boats. Their bows are short, their arrows are long and their aim is excellent."
 zin_regional_varnondor_cape_forts:0 "Cape Forts"
 zin_regional_varnondor_cape_forts_desc:0 "Old forts on the capes are rebuilt in stone, with sea-gates and catapult platforms. Each has a garrison and a well, and all of them look out to sea."
 zin_regional_varnondor_cape_lights:0 "Lighthouses of the Capes"
 zin_regional_varnondor_cape_lights_desc:0 "Every headland has a tower with a fire on its crown, kept by a family who inherit the work. The lights can be seen from the open sea on a clear night."
 zin_regional_varnondor_cape_sea_soldiers:0 "Sea Soldiers of the Capes"
 zin_regional_varnondor_cape_sea_soldiers_desc:0 "The cape-wardens are trained to leap from a boat onto a beach with a shield on the arm and a spear in the hand. They are a small band, and a very rough one."
 zin_regional_varnondor_close_the_approaches:0 "Close the Approaches"
 zin_regional_varnondor_close_the_approaches_desc:0 "The king orders his chains drawn across every narrows and his lanterns put out. No war-fleet shall pass the capes, whatever flag it flies."
 zin_regional_varnondor_far_shore_watch:0 "Watch on the Far Shore"
 zin_regional_varnondor_far_shore_watch_desc:0 "Fast boats go out each dusk toward the Middle Lands, and come home each dawn. What they see is written down and given to the king."
 zin_regional_varnondor_first_ashore:0 "First Ashore"
 zin_regional_varnondor_first_ashore_desc:0 "The cape-wardens go in the first boats, with a flag of Varnondor on a staff. They are the first to land, and the first to dig in."
 zin_regional_varnondor_first_ashore_host:0 "First Ashore"
 zin_regional_varnondor_first_ashore_host_desc:0 "The cape-wardens are the first men over the side of the first boats. They carry a strip of cloth in the colours of Varnondor, and they plant it on the sand."
 zin_regional_varnondor_harbours_for_the_host:0 "Harbours of the Peninsula"
 zin_regional_varnondor_harbours_for_the_host_desc:0 "The peninsula's coves are dredged and their quays rebuilt. A fleet that anchors there will find fresh water, dry stores and a wayfinder at the gate."
 zin_regional_varnondor_king_oslins_court:0 "King Oslin's Court"
 zin_regional_varnondor_king_oslins_court_desc:0 "Varnondor is a small kingdom of four states on an eastern peninsula, facing the wide central sea. King Oslin keeps lighthouses burning on every headland, and sleeps beside a window."
 zin_regional_varnondor_kings_lanterns:0 "The King's Lanterns"
 zin_regional_varnondor_kings_lanterns_desc:0 "The lamps of the peninsula now burn at Parim's bidding as well as the king's own. Their light shows an Aenoran ship the safe way into harbour."
 zin_regional_varnondor_lanterns:0 "Lanterns on the Capes"
 zin_regional_varnondor_lighthouses_of_the_capes:0 "Lighthouses of the Capes"
 zin_regional_varnondor_lighthouses_of_the_capes_desc:0 "Tall towers go up on the headlands, each a little higher than the last. Their keepers are paid by the king and fed by the villagers."
 zin_regional_varnondor_muster_harbour:0 "The Muster Harbour"
 zin_regional_varnondor_muster_harbour_desc:0 "The great harbour of the peninsula is arranged to take a whole fleet: a hundred berths, pitch-sheds, stores and cisterns. A host can embark from it in a week."
 zin_regional_varnondor_old_landings_remembered:0 "The Old Landings Remembered"
 zin_regional_varnondor_old_landings_remembered_desc:0 "Stone markers are set on the beaches where Aenor's fleets once came ashore. The cape lords read the names aloud at the autumn feast."
 zin_regional_varnondor_old_landings_remembered_tip_1:0 "Aenor's fleets came ashore on these capes in the First Age."
 zin_regional_varnondor_open_the_approaches:0 "Open the Approaches"
 zin_regional_varnondor_open_the_approaches_desc:0 "The king opens his harbours to the western fleet, and lights his lanterns for its ships. The old watchmen mutter, but the young ones are glad."
 zin_regional_varnondor_peninsula_crown:0 "The Peninsula Crown"
 zin_regional_varnondor_peninsula_crown_desc:0 "The king wears a crown of silvered iron, shaped like the lantern-tower on the great cape. Four states are held by it, and none has ever left it."
 zin_regional_varnondor_pilots_of_the_approaches:0 "Wayfinders of the Approaches"
 zin_regional_varnondor_pilots_of_the_approaches_desc:0 "The best sailors of the capes are taught the safe channels past every reef. They guide any fleet that asks, and learn what the fleets are doing as they go."
 zin_regional_varnondor_sea_soldiers_of_the_capes:0 "Sea Soldiers of the Capes"
 zin_regional_varnondor_sea_soldiers_of_the_capes_desc:0 "Cape-Warden Tomas Reed is given the task of teaching the levy to fight from boats and to storm a beach. He teaches by example, and bruises easily."
 zin_regional_varnondor_stranded_on_the_far_shore:0 "Stranded on the Far Shore"
 zin_regional_varnondor_stranded_on_the_far_shore_desc:0 "Some of the first ashore did not sail home. They hold a beach on the far coast, and they have a new banner to rally to."
 zin_regional_varnondor_the_approaches:0 "The Blue-Sea Approaches"
 zin_regional_varnondor_the_approaches_desc:0 "The sea-lanes past Varnondor's capes are the approaches to the Middle Lands. The king plants a fort at each narrows, with a chain and a lantern."
 zin_regional_varnondor_the_cape_levy:0 "The Cape Levy"
 zin_regional_varnondor_the_cape_levy_desc:0 "Every village of the capes provides a man for the king's host. They are fishers and lamp-keepers, and they can all swim."
 zin_regional_varnondor_the_cape_lords:0 "The Cape Lords"
 zin_regional_varnondor_the_cape_lords_desc:0 "The lords of the capes hold their heads high and their towers higher. They meet at the king's table each quarter, and the talk is always of weather."
 zin_regional_varnondor_the_capes_hold:0 "The Capes Hold"
 zin_regional_varnondor_the_capes_hold_desc:0 "The king keeps his hosts at home, and his lanterns burning. Whatever the fleets do on the far shore, the capes will be there when they come back."
 zin_regional_varnondor_the_capes_remember:0 "The Capes Remember"
 zin_regional_varnondor_the_capes_remember_desc:0 "The ships come home to the capes, or they do not. The king lights the lamps for all of them, and keeps the great lamp burning until dawn."
 zin_regional_varnondor_the_fleets_gather:0 "The Fleets Gather"
 zin_regional_varnondor_the_fleets_gather_desc:0 "The ships of the West have begun to assemble in the harbours of the peninsula. The king stands on the great cape and watches them come in, hull after hull, to the lighting of the lamps."
 zin_regional_varnondor_the_kings_harbour:0 "The King's Harbour"
 zin_regional_varnondor_the_kings_harbour_desc:0 "The king's own harbour is dredged and a new mole is built. It is the nearest western anchorage to the Middle Lands, and the king knows how much that is worth."
 zin_regional_varnondor_the_kings_lanterns:0 "The King's Lanterns"
 zin_regional_varnondor_the_kings_lanterns_desc:0 "The capes now burn their lamps at the bidding of the crown. A royal galley is welcome in every harbour, and no ship is stopped without leave."
 zin_regional_varnondor_the_muster_harbour:0 "The Muster Harbour"
 zin_regional_varnondor_the_muster_harbour_desc:0 "The greatest harbour of the peninsula is arranged to take a whole fleet at once: berths, stores, cisterns, pitch and a long beach for embarking troops. A host can sail from it in a week."
 zin_regional_varnondor_the_neutral_capes:0 "The Neutral Capes"
 zin_regional_varnondor_the_neutral_capes_desc:0 "The capes are neutral, and the king says so on every wall. His lords are not asked to pick a side, and his ports are not asked to take a flag."
 zin_regional_varnondor_the_old_grudge:0 "The Old Grudge"
 zin_regional_varnondor_the_old_grudge_desc:0 "Varnondor's grudge is the grudge of a watchman, who remembers where the enemy came ashore. The king puts the question to his lords: what do the capes owe to Aenor?"
 zin_regional_varnondor_the_peninsula_crown:0 "The Peninsula Crown"
 zin_regional_varnondor_the_peninsula_crown_desc:0 "A crown of silvered iron, in the shape of a lantern-tower, is made for King Oslin. He wears it to the lighting of the first lamp each dusk."
 zin_regional_varnondor_the_peninsula_host:0 "The Peninsula Host"
 zin_regional_varnondor_the_peninsula_host_desc:0 "The levy, the sea soldiers and the bowmen are joined in a single host. It marches under the lantern banner, and keeps time with the drum."
 zin_regional_varnondor_the_sea_watch:0 "The Sea Watch"
 zin_regional_varnondor_the_sea_watch_desc:0 "Lady Sevra of the Capes commands the sea watch from the great light-tower. She has sharper eyes than any of her wardens, and a very short temper."
 zin_regional_varnondor_the_staging_yards:0 "The Staging Yards"
 zin_regional_varnondor_the_staging_yards_desc:0 "Slips and pitch-sheds are built to refit and repair a fleet in a week. The western fleet may use them, if the Ford Council asks nicely."
 zin_regional_varnondor_the_varnondor_pledge:0 "The Varnondor Pledge"
 zin_regional_varnondor_the_varnondor_pledge_desc:0 "The cape lords stand at the lamp-tower and pledge their hosts to the Crossing, one by one. The king is the last to speak, and says only: we know the sea."
 zin_regional_varnondor_watch_for_parim:0 "Lanterns for Parim"
 zin_regional_varnondor_watch_for_parim_desc:0 "The king sends word to Parim that his lanterns burn for the crown. It is an old watchman's trick: to light the lamp for the strongest, and wait to see who comes."
 zin_regional_varnondor_watch_on_the_far_shore:0 "Watch on the Far Shore"
 zin_regional_varnondor_watch_on_the_far_shore_desc:0 "Fast boats are sent across the central sea to watch the Middle Lands' coast. They carry no cargo, only a lamp, a pair of keen eyes and a promise to return."
 zin_regional_varnondor.1.a:0 "Ignore them"
 zin_regional_varnondor.1.b:0 "Accept their friendship"
 zin_regional_varnondor.1.d:0 "A fast boat from Varnondor has anchored under the sea-wall at Parim. The king of the capes, it says, would light his lanterns for Aenor's ships, for a price and a promise: that the crown remember the cape lords, who have watched the central sea for a thousand years."
 zin_regional_varnondor.1.t:0 "Lanterns on the Capes"
