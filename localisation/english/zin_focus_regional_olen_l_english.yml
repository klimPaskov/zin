l_english:
 zin_regional_olen_behind_our_cliffs:0 "Behind Our Cliffs"
 zin_regional_olen_behind_our_cliffs_desc:0 "Olen decides to trust nobody and wall itself behind the cliffs. Every landing is fortified, every path is watched and the shrines keep their lamps lit through the night."
 zin_regional_olen_breeze_alone:0 "The Breeze Alone"
 zin_regional_olen_breeze_alone_desc:0 "Olen keeps its own shrines and its own healers, and welcomes nobody else's. The Holy Breeze is enough, say the keepers, and the pilgrims go home."
 zin_regional_olen_breeze_and_lamp:0 "The Breeze and the Lamp"
 zin_regional_olen_breeze_and_lamp_desc:0 "Healers of the Houses of the First Light work beside the shrines, with their lamps, their herbs and their patient hands. Fewer children die in Olen than in any land for a hundred leagues."
 zin_regional_olen_breeze_guard:0 "The Breeze Guard"
 zin_regional_olen_breeze_guard_desc:0 "The guard of the cliff shrines is raised from the sons of the keepers, armed with spears and shown how to hold a path. They wear white cloaks and march in step."
 zin_regional_olen_breeze_healers:0 "The Breeze Healers"
 zin_regional_olen_breeze_healers_desc:0 "Healers of the Breeze walk the cliff roads with lamps and herb-bags, tending the sick of every folk. They are honoured by the keepers and welcomed by everyone else."
 zin_regional_olen_breeze_healers_spirit:0 "The Breeze Healers"
 zin_regional_olen_breeze_healers_spirit_desc:0 "Healers walk the cliff roads with lamps and herb-bags, tending the sick of every folk and every land. The hurt of Olen are cared for, and so are the hurt of its neighbours."
 zin_regional_olen_breeze_keepers:0 "The Breeze-Keepers"
 zin_regional_olen_breeze_keepers_desc:0 "The keepers of the cliff shrines tend the evening wind with song and lamp, and teach the pilgrims how to feel it on their faces. A land that prays in one voice is slow to quarrel."
 zin_regional_olen_breeze_markets:0 "Breeze Markets"
 zin_regional_olen_breeze_markets_desc:0 "A market is held every evening when the cool wind rises, under awnings of sail-cloth. Traders from Mirolon and the south sell side by side and compare their prices."
 zin_regional_olen_breeze_markets_spirit:0 "Breeze Markets"
 zin_regional_olen_breeze_markets_spirit_desc:0 "A market is held every evening when the cool wind rises, under awnings of sail-cloth. Traders come from the Dominion and from Mirolon, and nobody asks where the others are from."
 zin_regional_olen_breeze_shrines:0 "The Breeze Shrines"
 zin_regional_olen_breeze_shrines_desc:0 "Small shrines are built on every cliff-top, each with a cup for the wind and a lamp for the night. The keepers tend them, and the pilgrims leave gifts."
 zin_regional_olen_cistern_roads:0 "Cistern Roads"
 zin_regional_olen_cistern_roads_desc:0 "Roads are cut beside the cistern channels, so that water and wagons share the same level path. Marra Cisternwright walks them every spring and mends what the rains have broken."
 zin_regional_olen_cliff_archers:0 "Cliff Archers"
 zin_regional_olen_cliff_archers_desc:0 "Archers are posted along the cliff-tops with long bows and quivers of fletched cane. A boat that tries to land below them is shot to pieces before the keel touches shingle."
 zin_regional_olen_cliff_terraces:0 "Cliff Terraces"
 zin_regional_olen_cliff_terraces_desc:0 "The cliffs of Olen are cut into terraces and held by walls of dry stone. Cistern-water runs down them in channels, and barley grows where no barley should."
 zin_regional_olen_cliff_terraces_spirit:0 "Cliff Terraces"
 zin_regional_olen_cliff_terraces_spirit_desc:0 "Terrace upon terrace of barley and beans climbs the cliffs, held by walls of dry stone and watered from the cisterns. Olen eats well in a land where almost no one else does."
 zin_regional_olen_cliffs_hold:0 "The Cliffs Hold"
 zin_regional_olen_cliffs_hold_desc:0 "The cliffs are walled at every landing and fortified at every pass. Whatever comes from the sea will find the cliffs a good deal taller than expected."
 zin_regional_olen_guard_of_the_breeze:0 "Guard of the Breeze"
 zin_regional_olen_guard_of_the_breeze_desc:0 "The guard is drawn together into a single body under Captain Joss Ardel, with white cloaks and iron-rimmed shields. They are few, but they are steady."
 zin_regional_olen_guard_of_the_breeze_spirit:0 "Guard of the Breeze"
 zin_regional_olen_guard_of_the_breeze_spirit_desc:0 "The guard of the cliff shrines wear white and carry long spears. They are few, but they are devoted, and they stand where they are told to stand."
 zin_regional_olen_healers_sent:0 "Healers Sent"
 zin_regional_olen_healers_to_mirolon:0 "Healers to Mirolon"
 zin_regional_olen_healers_to_mirolon_desc:0 "A company of healers travels north to the lake towns of Mirolon, bringing herbs, lamps and a calm that the wardens badly need. They are received with gratitude and a long list of patients."
 zin_regional_olen_healers_to_the_north:0 "Healers to the North"
 zin_regional_olen_healers_to_the_north_desc:0 "Another company of healers is sent to the court of Aenor, where Olen's herbs are valued and its methods are studied. It is a small gift, and the court remembers it."
 zin_regional_olen_hold_the_cliffs:0 "Hold the Cliffs"
 zin_regional_olen_hold_the_cliffs_desc:0 "Every landing is manned, every path watched and every shrine garrisoned. The Breeze blows on, and Olen holds the cliffs it blows over."
 zin_regional_olen_hold_the_cliffs_spirit:0 "Hold the Cliffs"
 zin_regional_olen_hold_the_cliffs_spirit_desc:0 "Every landing is manned, every path watched and every shrine garrisoned. The Breeze blows on, and Olen holds the cliffs it blows over."
 zin_regional_olen_keep_the_old_quiet:0 "Keep the Old Quiet"
 zin_regional_olen_keep_the_old_quiet_desc:0 "Olen has kept the old quiet with Nafeher for generations: a tribute of salt and dried fish, and in return no questions. The keepers agree to send it again."
 zin_regional_olen_olen_at_peace:0 "Olen at Peace"
 zin_regional_olen_olen_at_peace_desc:0 "The shrines are tended, the terraces are green and the evening wind comes on time. Olen is at peace, and it knows what that is worth."
 zin_regional_olen_olen_prospers:0 "Olen Prospers"
 zin_regional_olen_olen_prospers_desc:0 "Terraces, mills and markets bring coin to Olen, and the keepers of the shrines remember to give some of it back to the Breeze. The cisterns are enlarged and the lamps are lit."
 zin_regional_olen_olenas_counsel:0 "Olena's Counsel"
 zin_regional_olen_olenas_counsel_desc:0 "Olena has kept the chief shrine since she was a girl and knows every verse of the Breeze's songs. Her counsel is gentle, brief and almost always followed."
 zin_regional_olen_sea_watch:0 "The Sea Watch"
 zin_regional_olen_sea_watch_desc:0 "Lamps burn on the cliff-tops through the night, and watchers sit beside each. A hull on the horizon is seen long before it can be named."
 zin_regional_olen_sea_watch_spirit:0 "The Sea Watch"
 zin_regional_olen_sea_watch_spirit_desc:0 "Lamps burn on the cliff-tops through the night, and watchers sit beside each. A hull on the horizon is seen long before it can be named."
 zin_regional_olen_stand_with_the_wardens:0 "Stand with the Wardens"
 zin_regional_olen_stand_with_the_wardens_desc:0 "Mirolon's wardens hold the lake towns against the storm, and Olen is asked to stand beside them. The keepers vote to send an answer on the evening wind."
 zin_regional_olen_the_breeze_alone:0 "The Breeze Alone"
 zin_regional_olen_the_breeze_alone_desc:0 "Olen keeps its own shrines and its own healers. The keepers say that the Breeze needs no lamps but its own, and the visitors are courteously escorted home."
 zin_regional_olen_the_breeze_and_the_lamp:0 "The Breeze and the Lamp"
 zin_regional_olen_the_breeze_and_the_lamp_desc:0 "Healers of the Houses of the First Light are welcomed beside the shrines, with their lamps, their herbs and their grain-stores. The keepers are divided about them, but the sick are glad."
 zin_regional_olen_the_breeze_carries_word:0 "The Breeze Carries Word"
 zin_regional_olen_the_breeze_carries_word_desc:0 "A pilgrim from the north reaches the cliffs with word of [zin_loc_eindil], whose road passes through the lands where the healers have worked. The keepers listen to the tale and add a verse to the evening song."
 zin_regional_olen_the_breeze_keepers:0 "The Breeze-Keepers"
 zin_regional_olen_the_breeze_keepers_desc:0 "The keepers of the shrines form a body with its own rule and its own hymns. They are the heart of Olen's quiet, and the quiet is the heart of Olen."
 zin_regional_olen_the_breeze_returns:0 "The Breeze Returns"
 zin_regional_olen_the_breeze_returns_desc:0 "The war moves on, and the evening wind blows from the sea once more. The keepers relight the lamps one by one, and the cliff-tops glow."
 zin_regional_olen_the_breeze_turns:0 "The Breeze Turns"
 zin_regional_olen_the_breeze_turns_desc:0 "The evening wind blows from the wrong quarter, and the keepers know what it means. War is coming to the cliffs, and Olena calls the people to the shrines."
 zin_regional_olen_the_cliffs_hold:0 "The Cliffs Hold"
 zin_regional_olen_the_cliffs_hold_desc:0 "The cliff forts are completed: stone towers at every landing, with winches, signal-fires and stocks of arrows. Olen can now be taken only by a fleet that is willing to lose half of itself."
 zin_regional_olen_the_cool_harbour:0 "The Cool Harbour"
 zin_regional_olen_the_cool_harbour_desc:0 "A harbour is cut into the foot of the cliffs, where the cool wind blows into the water and keeps the heat at bay. The galleys of the Dominion buy salt there and ask nothing."
 zin_regional_olen_the_holy_breeze:0 "The Holy Breeze"
 zin_regional_olen_the_holy_breeze_desc:0 "Each evening a cool wind rises off the sea, the only cool air for a hundred leagues, and Olena of the Holy Breeze goes to the cliff-top shrine to meet it. The people say that the wind is a gift, and the freeholders of Olen believe them."
 zin_regional_olen_the_quiet_kept:0 "The Quiet Kept"
 zin_regional_olen_the_quiet_kept_desc:0 "Nafeher has accepted Olen's tribute, and the old quiet holds. The keepers breathe more easily, though not very easily."
 zin_regional_olen_the_shrines_shelter:0 "The Shrines Shelter"
 zin_regional_olen_the_shrines_shelter_desc:0 "Refugees from the north climb to the shrines, footsore and hungry, with children on their backs. The keepers open the doors, and the cisterns, and the granaries."
 zin_regional_olen_the_southern_storm:0 "The Southern Storm"
 zin_regional_olen_the_southern_storm_desc:0 "The storms over Nafeher have not lifted in a year, and the galleys of Dolon are buying more salt than a peaceful land eats. The keepers of the shrines watch the southern sky and say little."
 zin_regional_olen_the_warden_league:0 "The Warden League"
 zin_regional_olen_the_warden_league_desc:0 "Mirolon's wardens have raised a league of the free south, and Olen is invited to join. The keepers bless the banner, and Olena rides to the league's first meeting with a lamp in her hand."
 zin_regional_olen_windmills_of_the_cliffs:0 "Windmills of the Cliffs"
 zin_regional_olen_windmills_of_the_cliffs_desc:0 "Windmills crown the cliff-tops, turning in the sea breeze and grinding grain, pumping water and driving a hundred small machines. The mills of Olen are slow, steady and always turning."
 zin_regional_olen.1.a:0 "Light the shrines."
 zin_regional_olen.1.b:0 "Open the cisterns."
 zin_regional_olen.1.d:0 "The cool wind rises off the sea, as it does every evening, and the people of the cliff-towns come out of their houses to feel it. Olena asks the keepers what the Breeze would have the shrines do."
 zin_regional_olen.1.t:0 "The Evening Breeze"
 zin_regional_olen.2.a:0 "Listen to the wind."
 zin_regional_olen.2.d:0 "Traders bring word that the galleys of Dolon are buying more salt than a peaceful land eats, and that the storms over Nafeher have not lifted in a year. The keepers do not say what they think."
 zin_regional_olen.2.t:0 "Rumours from Nafeher"
 zin_regional_olen.3.a:0 "Nafeher takes no gifts from the north."
 zin_regional_olen.3.b:0 "The quiet holds."
 zin_regional_olen.3.d:0 "A string of mules from Olen arrives at the border of the Dominion, loaded with salt, dried fish and a small chest of silver. The keepers ask for nothing but the old quiet."
 zin_regional_olen.3.t:0 "Tribute from Olen"
 zin_regional_olen.4.a:0 "We keep our own counsel."
 zin_regional_olen.4.b:0 "Stand together."
 zin_regional_olen.4.d:0 "Envoys of Olen stand in the lake-hall of Mirolon, in white cloaks and with a lamp between them. They offer the wardens a friendship as constant as the evening wind."
 zin_regional_olen.4.t:0 "Friendship from Olen"
 zin_regional_olen.5.a:0 "So the wind carries it."
 zin_regional_olen.5.d:0 "The answer has come back on the evening wind, and it is yes. The keepers read it in the faces of the envoys before a word is spoken."
 zin_regional_olen.5.t:0 "An Answer on the Wind"
 zin_regional_olen.6.a:0 "We keep our cliffs."
 zin_regional_olen.6.d:0 "The envoys come back with nothing. The wind falls still over the cliffs, and the keepers go quietly to their shrines."
 zin_regional_olen.6.t:0 "The Wind Falls Still"
