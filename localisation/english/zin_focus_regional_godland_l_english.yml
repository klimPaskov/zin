l_english:
 zin_regional_godland_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_godland_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_godland_a_seat_at_noon:0 "A Seat at Noon"
 zin_regional_godland_a_seat_at_noon_desc:0 "The Sunhot realms meet at midday in an open court with no roof, where nothing is decided before the sun is overhead. [ROOT.GetName] takes its seat among them and speaks in its turn."
 zin_regional_godland_carry_the_stones_tale_to_gala:0 "Carry the Stones' Tale to Gala"
 zin_regional_godland_carry_the_stones_tale_to_gala_desc:0 "Some tales are too old for anyone in Godland to explain, and the keepers have chosen to send them to Gala. A messenger goes south with a packet of rubbings and a sealed letter."
 zin_regional_godland_carry_the_stones_tale_to_gala_tip_1:0 "A tale too old for anyone here to explain."
 zin_regional_godland_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_godland_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_godland_healing_houses:0 "The Healing Houses"
 zin_regional_godland_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_godland_honour_the_president:0 "Honour the Chair"
 zin_regional_godland_honour_the_president_desc:0 "The realm that keeps the Council's chair holds it for all and answers to all. [ROOT.GetName] sends gifts and an envoy to its court, and is thanked in the old words."
 zin_regional_godland_keeper_aldoreth:0 "The Keeper of the High Places"
 zin_regional_godland_keeper_aldoreth_desc:0 "Aldoreth keeps the high places for the realm, as a long line of keepers has done before. He is the oldest in the court and the quietest."
 zin_regional_godland_keepers_court:0 "The Keepers' Court"
 zin_regional_godland_keepers_court_desc:0 "The keepers of the high places govern from a hall of white stone on the first ridge. They are shepherds, masons and pilgrims by turns, and they speak softly."
 zin_regional_godland_long_keeping:0 "The Long Keeping"
 zin_regional_godland_long_keeping_desc:0 "The keepers have kept the high places longer than any record can say, and they intend to keep them longer still. Their patience is a kind of wealth."
 zin_regional_godland_masons:0 "Masons of Godland"
 zin_regional_godland_masons_desc:0 "Godland's masons cut white stone so true that a wall of it needs no binding. Half the towns of the Lands of the Sun were raised by their hands."
 zin_regional_godland_masons_of_godland:0 "Masons of Godland"
 zin_regional_godland_masons_of_godland_desc:0 "The masons cut, square and dress the white stone, and their lodge is the oldest in the south. A mason's mark is as good as a seal."
 zin_regional_godland_old_strength:0 "The Old Strength"
 zin_regional_godland_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_godland_our_share_of_the_sun_guard:0 "Our Share of the Sun Guard"
 zin_regional_godland_our_share_of_the_sun_guard_desc:0 "A guard of tall spearmen from every realm keeps the open court and the roads that lead to it. [ROOT.GetName] sends its share, drilled in the slow, heavy step that Sunhot spears have always kept."
 zin_regional_godland_peace_among_the_realms:0 "Peace Among the Realms"
 zin_regional_godland_peace_among_the_realms_desc:0 "The Council's oldest custom is that no realm raises a hand against another, and that a quarrel over a boundary stone is settled by an elder from a third realm. [ROOT.GetName] swears it again, and means it."
 zin_regional_godland_peace_of_noon:0 "The Peace of Noon"
 zin_regional_godland_peace_of_noon_desc:0 "No realm of the Council raises a hand to another, and [ROOT.GetName] guards that peace as closely as its own gates."
 zin_regional_godland_pilgrims_to_the_high_places:0 "Pilgrims to the High Places"
 zin_regional_godland_pilgrims_to_the_high_places_desc:0 "Pilgrims arrive in long lines, from valleys that have never heard of Godland and from towns that have. They bring no gifts, and the keepers ask for none."
 zin_regional_godland_priests_from_afar:0 "Priests From Afar"
 zin_regional_godland_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_godland_ready_for_the_noon_league:0 "Ready for the Noon League"
 zin_regional_godland_ready_for_the_noon_league_desc:0 "When danger passes the borders, the Council can bind its realms into one league with one banner and one watch-fire. [ROOT.GetName] gives its word beforehand, so that nobody need ask it twice."
 zin_regional_godland_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_godland_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_godland_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_godland_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_godland_songs_of_stones:0 "Songs of the Old Stones"
 zin_regional_godland_songs_of_stones_desc:0 "Pilgrims who climb to the stones come down with songs in an old measure, and the shepherds teach them to their children. Nobody knows who made the songs, and nobody has stopped singing them."
 zin_regional_godland_songs_of_the_old_stones:0 "Songs of the Old Stones"
 zin_regional_godland_songs_of_the_old_stones_desc:0 "The songs that pilgrims bring down from the stones are gathered and sung in the keepers' hall. Their measure is older than the hall, and nobody has changed a word of them."
 zin_regional_godland_stone_readers:0 "The Stone-Readers"
 zin_regional_godland_stone_readers_desc:0 "Scholars take rubbings of the marks and compare them in the keepers' hall. They agree on very little, and have filled a hundred sheets with their disagreement."
 zin_regional_godland_sun_guard_share:0 "Our Share of the Sun Guard"
 zin_regional_godland_sun_guard_share_desc:0 "A company of tall spearmen from [ROOT.GetName] stands in the Council's guard, and its drill is the finest in the south."
 zin_regional_godland_the_council_endures:0 "The Council Endures"
 zin_regional_godland_the_council_endures_desc:0 "Generations of Sunhot elves have sat in that court without once drawing a blade in it. [ROOT.GetName] adds its name to the long roll of those who kept it so."
 zin_regional_godland_the_four_lands:0 "The Four Lands"
 zin_regional_godland_the_four_lands_desc:0 "Paths of laid stone join the four states, with cairns at each bend and a well at every fork. Walkers say the roads are easier to follow than to leave."
 zin_regional_godland_the_hidden_terraces:0 "The Hidden Terraces"
 zin_regional_godland_the_hidden_terraces_desc:0 "Terraces cut into the north faces of the mountains catch the last light of the day. They grow barley, beans and a small yellow apple."
 zin_regional_godland_the_high_places:0 "The High Places"
 zin_regional_godland_the_high_places_desc:0 "Godland is four high states named on the oldest maps, crowned with standing stones older than any Sunhot record. Its white stone builds half the towns of the south."
 zin_regional_godland_the_keepers_council:0 "The Keepers' Council"
 zin_regional_godland_the_keepers_council_desc:0 "The keepers of the four states meet on the first ridge each equinox. They bring pebbles from their own hills, and set them in a ring on the council table."
 zin_regional_godland_the_keepers_law:0 "The Keepers' Law"
 zin_regional_godland_the_keepers_law_desc:0 "The law of the keepers is short, written on a single stone and read aloud each midsummer. Every shepherd and mason knows it, and few have broken it."
 zin_regional_godland_the_long_keeping:0 "The Long Keeping"
 zin_regional_godland_the_long_keeping_desc:0 "The keepers write down every season's events in a book of thin stone leaves. The book is older than the hall, and is kept in a niche of its own."
 zin_regional_godland_the_old_stones:0 "The Old Stones"
 zin_regional_godland_the_old_stones_desc:0 "Standing stones crown the high places, grey and weathered and marked with signs nobody reads. Pilgrims climb to them at midsummer, and the keepers do not say what the stones are."
 zin_regional_godland_the_old_strength:0 "The Old Strength"
 zin_regional_godland_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_godland_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_godland_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_godland_the_sanctuary_paths:0 "The Sanctuary Paths"
 zin_regional_godland_the_sanctuary_paths_desc:0 "Paths of dressed stone lead to the high places, with rest-huts and water at every league. The keepers ask that pilgrims walk and not ride."
 zin_regional_godland_the_stone_roads:0 "The Stone Roads"
 zin_regional_godland_the_stone_roads_desc:0 "White stone roads descend from the quarries to the valley towns, each slab laid by a mason and checked by his master. They wear very slowly."
 zin_regional_godland_walls_of_the_high_places:0 "Walls of the High Places"
 zin_regional_godland_walls_of_the_high_places_desc:0 "Walls of white stone are raised across the passes, plain and thick and as old-looking as the hills. If the danger comes, they will be ready."
 zin_regional_godland_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_godland_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_godland_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_godland_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_godland_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_godland_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_godland_white_stone_quarries:0 "White Stone Quarries"
 zin_regional_godland_white_stone_quarries_desc:0 "Godland's white stone is cut from the lower slopes in great blocks, and the quarries are never worked at midsummer. Carters take the stone down in oxen-drawn sleds."
 zin_regional_godland.1.a:0 "Let them stand as they are"
 zin_regional_godland.1.b:0 "Read the marks on the stones"
 zin_regional_godland.1.d:0 "At midsummer the pilgrims climb to the stones, as they have done for longer than anyone can say. Nobody remembers who raised them, and the keepers do not pretend to know."
 zin_regional_godland.1.t:0 "The Old Stones"
