l_english:
 zin_mirolon_a_wall_of_realms:0 "A Wall of Realms"
 zin_mirolon_a_wall_of_realms_desc:0 "Friends in the north and kin in the south: a line of allies runs the length of the border, thin in places but unbroken. The Dark King, if he is watching, will see it too."
 zin_mirolon_a_watch_for_the_ages:0 "A Watch for the Ages"
 zin_mirolon_a_watch_for_the_ages_desc:0 "The towers will be manned in every season of every year, by sons and daughters not yet born. If the south ever stirs again, Mirolon will not be the last to know."
 zin_mirolon_appeal_to_gala:0 "An Appeal to Gala"
 zin_mirolon_appeal_to_gala_desc:0 "A letter goes to the court of the Gala elves, far in the south-west, reminding them whose graves lie in the old fields. It asks for no army, only for rangers who choose to come."
 zin_mirolon_arms_from_the_lake_forges:0 "Arms from the Lake Forges"
 zin_mirolon_arms_from_the_lake_forges_desc:0 "The forges run day and night, and the carts come up the pass roads loaded to the axles with spears, shields and arrowheads. A realm that has hoarded for a year may fight for a year."
 zin_mirolon_arms_of_the_lake:0 "Arms of the Lake Towns"
 zin_mirolon_arms_of_the_lake_desc:0 "Smiths of the lake towns agree on one pattern of spearhead and one length of shaft, so that a pass-lord's men and a townsman's son are armed alike. The armoury in the capital keeps the pattern, and lends it to anyone who can hold a hammer."
 zin_mirolon_army_of_the_passes:0 "The Army of the Passes"
 zin_mirolon_army_of_the_passes_desc:0 "The warden calls the garrisons, the levies and the town companies into one order of battle under the captains of the passes. It is a small army, and it is meant to fight only in places it knows."
 zin_mirolon_ask_the_lost_cause:0 "Ask the Lost Cause"
 zin_mirolon_ask_the_lost_cause_desc:0 "The Lost Cause is the league of Aenor's loyal frontier, and it is old enough to know what a southern border is worth. Mirolon asks to be counted among its companions, if Parim will have it."
 zin_mirolon_burn_the_bridges:0 "Burn the Bridges"
 zin_mirolon_burn_the_bridges_desc:0 "The great bridges and the ferries are broken, and the fords are staked with sharpened logs. It will cost years to rebuild them, and Mirolon would rather pay that than have the road kept open."
 zin_mirolon_bury_the_dead_of_two_ages:0 "Bury the Dead of Two Ages"
 zin_mirolon_bury_the_dead_of_two_ages_desc:0 "The fallen of the occupation and the fallen of the first conquest are laid in the same long barrows, with the names cut in the stone. The realm weeps, and then, quietly, begins to heal."
 zin_mirolon_captain_of_the_passes:0 "The Captain of the Passes"
 zin_mirolon_captain_of_the_passes_desc:0 "Selda Varrow has held the Lake Gate for twenty years against bandits, floods and the occasional foolish lord. The High Warden gives her a captain's baton and the right to ask for anything the passes need."
 zin_mirolon_carry_the_war_south:0 "Carry the War South"
 zin_mirolon_carry_the_war_south_desc:0 "Some in the hall say that Mirolon has a right to the Dark King's lands, and that a broken enemy does not come back. Others remember who last crossed the passes with a banner and an answer."
 zin_mirolon_charter_of_the_lake_towns:0 "Charter of the Lake Towns"
 zin_mirolon_charter_of_the_lake_towns_desc:0 "The towns win a written charter: their own courts, their own market tolls and a seat for their speakers beside the pass-lords. In return they open their strong-rooms when the realm is in danger."
 zin_mirolon_chronicles_of_the_alliance:0 "Chronicles of the Grand Alliance"
 zin_mirolon_chronicles_of_the_alliance_desc:0 "The chroniclers set down how Mirolon's companies marched with King Edran's host, what they learned from it and what it cost. Captains study the pages the way other men study maps."
 zin_mirolon_coast_harbours:0 "Harbours of the Coast"
 zin_mirolon_coast_harbours_desc:0 "New quays, breakwaters and a shipwright's slip open on the coast. Mirolon's sea is small, but a fleet that is not there cannot be sunk, and cannot carry a levy north either."
 zin_mirolon_coastal_watch_towers:0 "Coastal Watch-Towers"
 zin_mirolon_coastal_watch_towers_desc:0 "Towers along the shore keep a lamp lit every night and a watcher awake beside it. Ships that stand far off the coast are noted in the log, and nobody has yet been able to explain some of them."
 zin_mirolon_concord_backing:0 "The Concord's Backing"
 zin_mirolon_concord_backing_desc:0 "Spears and promises from the middle lands have reached the passes, and the garrisons are steadier for knowing they are not forgotten."
 zin_mirolon_counting_the_fires:0 "Counting the Fires"
 zin_mirolon_counting_the_fires_desc:0 "From the high watch-towers the keepers tally the camp-fires on the southern plain, night by night. A number that grows every month is a harder argument than any rumour."
 zin_mirolon_deep_patrols:0 "Deep Patrols"
 zin_mirolon_deep_patrols_desc:0 "Rangers go further south than any scout has gone, living off the land for a month at a time. They are not meant to fight; they are meant to see."
 zin_mirolon_deep_patrols_spirit:0 "Deep Patrols"
 zin_mirolon_deep_patrols_spirit_desc:0 "Rangers range far to the south, and little that moves in the Ember Lands goes unremarked for long."
 zin_mirolon_doctrine_of_the_narrows:0 "Doctrine of the Narrows"
 zin_mirolon_doctrine_of_the_narrows_desc:0 "The captains write down how to hold a narrow place against a stronger host: where the line is thickest, when the reserve is committed and who gives the order to fall back. It is a short book, much thumbed."
 zin_mirolon_elective_crown:0 "The Elective Crown"
 zin_mirolon_elective_crown_desc:0 "The High Warden is confirmed for life, with the right to speak for the realm abroad and to call the levy without waiting for the hall. Quick decisions are the price of an enemy that moves quickly."
 zin_mirolon_envoy_to_parim:0 "An Envoy to Parim"
 zin_mirolon_envoy_to_parim_desc:0 "The finest of the High Warden's speakers rides to the Golden Court with the first sealed report of what the watchers have seen. Whether the court listens is for the court; Mirolon has done its part in writing."
 zin_mirolon_evacuate_the_lake_towns:0 "Evacuate the Lake Towns"
 zin_mirolon_evacuate_the_lake_towns_desc:0 "The towns are emptied in good order, carts and boats loaded, the elders in front and the strong-rooms behind. Those who go will be missed, and those who stay will fight on cleared ground."
 zin_mirolon_every_hand:0 "Every Hand a Warden"
 zin_mirolon_every_hand_a_warden:0 "Every Hand a Warden"
 zin_mirolon_every_hand_a_warden_desc:0 "Each household learns its place on the wall: who carries water, who mends, who loads the engines and who goes up the pass. When the horns sound, the realm does not need to be told twice."
 zin_mirolon_every_hand_desc:0 "Every household has a place on the wall, and everyone knows it."
 zin_mirolon_fallback_lines:0 "Sunken Roads and Fallback Lines"
 zin_mirolon_fallback_lines_desc:0 "Sunken roads, ditches and stone redoubts are laid out in depth behind the gates, so that each line can be given up for the sake of the next. A defender who may fall back in order is not defeated."
 zin_mirolon_fallback_lines_spirit:0 "Fallback Lines"
 zin_mirolon_fallback_lines_spirit_desc:0 "Sunken roads and stone redoubts stand in depth behind the gates, so that ground may be given up in good order."
 zin_mirolon_fire_against_dead:0 "Fire Against the Dead"
 zin_mirolon_fire_against_dead_desc:0 "Pitch, tallow and fire-arrows are laid in along the walls for any host that does not feel the cold."
 zin_mirolon_fire_against_the_dead:0 "Fire Against the Dead"
 zin_mirolon_fire_against_the_dead_desc:0 "Old tales say the grave-hosts fear fire most, and the engineers of the lake towns take the tales at their word. Pitch-throwers, fire-arrows and tallow by the barrel are made ready along the passes."
 zin_mirolon_forest_rangers:0 "Rangers of the Mirolon Forests"
 zin_mirolon_forest_rangers_desc:0 "Green cloaks and long bows move through the trees; a column that enters the wood seldom comes out the way it went in."
 zin_mirolon_forest_timber:0 "Timber of the Forests"
 zin_mirolon_forest_timber_desc:0 "The forests that shelter the passes also yield beams, planks and charcoal. A new yard at the forest edge turns them into rafters and barge hulls."
 zin_mirolon_free_realms_of_the_ember_lands:0 "Free Realms of the Ember Lands"
 zin_mirolon_free_realms_of_the_ember_lands_desc:0 "Scattered through the south are towns and holds that still keep their own gates. A rider goes to each of them with the same question: when the storm comes, will you stand beside us or be broken one by one?"
 zin_mirolon_friendship_with_herez:0 "Friendship with Herez"
 zin_mirolon_friendship_with_herez_desc:0 "Herez is a neighbour on the northern road, a ranger land that knows the cost of a long border. A gift of salted fish and a formal letter ask whether Herez would call Mirolon a friend."
 zin_mirolon_high_wardens_council:0 "The High Warden's Council"
 zin_mirolon_high_wardens_council_desc:0 "High Warden Maeric takes counsel from the lords of the passes and from the speakers of the lake towns, and does not hide that they disagree. Whichever voice he hears first will shape the year."
 zin_mirolon_hold_every_stone:0 "Hold Every Stone"
 zin_mirolon_hold_every_stone_desc:0 "The order goes down every wall: nothing is to be abandoned that can be defended and nothing defended that cannot be reinforced. For half a year the garrisons will be asked for more than anyone can give."
 zin_mirolon_hold_every_stone_spirit:0 "Hold Every Stone"
 zin_mirolon_hold_every_stone_spirit_desc:0 "Nothing may be given up that can be held. The order will last half a year, and the walls will remember it."
 zin_mirolon_hope_from_the_north:0 "Hope from the North"
 zin_mirolon_hope_from_the_north_desc:0 "News from the north is on every lip, though few agree on what it means. Something has changed in the world, and for the first time in years the wardens of Mirolon dare to lift their heads."
 zin_mirolon_lake_and_coast:0 "Lake and Coast"
 zin_mirolon_lake_and_coast_desc:0 "Mirolon lives between the lakes and the sea: nets, timber, grain and the harbour towns that sell them. Before the passes can be fortified the realm must be able to pay for them."
 zin_mirolon_lake_charter:0 "Charter of the Lake Towns"
 zin_mirolon_lake_charter_desc:0 "Free towns, free courts and a seat in the hall: the lake towns give more because they are asked to give less."
 zin_mirolon_lake_fisheries:0 "The Lake Fisheries"
 zin_mirolon_lake_fisheries_desc:0 "Smoked and salted fish from the long lakes feed every town from the shore to the foothills. A realm that eats well keeps its temper in a hard year."
 zin_mirolon_lake_fisheries_spirit:0 "The Lake Fisheries"
 zin_mirolon_lake_fisheries_spirit_desc:0 "The long lakes feed the realm, and the fishers settle quarrels over nets with a handshake and a shared pot."
 zin_mirolon_lake_levies:0 "Levies of the Lake Towns"
 zin_mirolon_lake_levies_desc:0 "Each ward owes a levy and each ward has trained it. The men who come know their captains by name."
 zin_mirolon_last_free_realm:0 "The Last Free Realm of the South"
 zin_mirolon_last_free_realm_desc:0 "Everything south of the passes is under the Dark King's shadow, or hides from it. Mirolon says plainly that it is the last free realm there, and that it intends to remain so."
 zin_mirolon_last_stand:0 "The Last Stand"
 zin_mirolon_last_stand_at_the_passes:0 "The Last Stand at the Passes"
 zin_mirolon_last_stand_at_the_passes_desc:0 "The warden swears that no gate will be given up while a man can stand at it. There is no plan for retreat, no ship waiting and no road home beyond the one the enemy will march up."
 zin_mirolon_last_stand_desc:0 "There is no retreat and no plan for one. The garrisons fight with their backs to the gates they have sworn to hold."
 zin_mirolon_league_musters:0 "The League Musters"
 zin_mirolon_league_musters_desc:0 "Once a season the companies of the league gather at the Lake Gate for drill, and the captains agree on signals, rations and a common word of command. The first muster is awkward and the second is not."
 zin_mirolon_league_musters_spirit:0 "The League Musters"
 zin_mirolon_league_musters_spirit_desc:0 "The league's companies drill together each season and know each other's horns."
 zin_mirolon_ledger_of_warnings:0 "The Ledger of Warnings"
 zin_mirolon_ledger_of_warnings_desc:0 "Every sighting, every count and every witness is written in a single sealed book, signed and dated, and a fair copy goes north. Whatever Parim does with it, no one can say Mirolon did not write it down."
 zin_mirolon_levies_of_the_lake_towns:0 "Levies of the Lake Towns"
 zin_mirolon_levies_of_the_lake_towns_desc:0 "The towns promise a levy, and for once they promise it in writing: so many men from each ward, trained on feast-days and paid from the lake tolls. The men who answer will fight for their own doors."
 zin_mirolon_long_watch:0 "The Long Watch"
 zin_mirolon_long_watch_desc:0 "For four generations the passes have never been left unmanned, and the habit shows in how Mirolon sees and how it fights."
 zin_mirolon_masons_guild:0 "The Masons' Guild"
 zin_mirolon_masons_guild_desc:0 "The stonemasons of the lake towns form a guild for the sake of the passes, with rules for wages, apprentices and the testing of a wall. Its masters answer to the High Warden for every course laid."
 zin_mirolon_masons_guild_spirit:0 "The Masons' Guild"
 zin_mirolon_masons_guild_spirit_desc:0 "A guild of masons builds fast and tests every wall twice."
 zin_mirolon_memory_of_the_first_conquest:0 "The Memory of the First Conquest"
 zin_mirolon_memory_of_the_first_conquest_desc:0 "The archives of the lake towns keep a long list: the first realm the Dark King took, the burned granaries, the names of those carried south. Mirolon reads it aloud once a year, and has never stopped."
 zin_mirolon_mirolon_forests:0 "The Mirolon Forests"
 zin_mirolon_mirolon_forests_desc:0 "The forests of the foothills are old, dense and full of tracks that only a few know. Rangers who keep them can cost an invader a week in every mile."
 zin_mirolon_mirolon_rises_again:0 "Mirolon Rises Again"
 zin_mirolon_mirolon_rises_again_desc:0 "The master of Nafeher has fallen, and the south is quiet for the first time in an age. The warden orders the banners unfurled and the gates opened: it is time to go home."
 zin_mirolon_narrows_doctrine:0 "Doctrine of the Narrows"
 zin_mirolon_narrows_doctrine_desc:0 "The captains of the passes fight by one short book, and by the habit of obeying it."
 zin_mirolon_never_again:0 "Never Again"
 zin_mirolon_never_again_desc:0 "Two words are carved over the lintel of every muster hall in the realm. Those who read them have buried a grandfather or been buried under an empire, and they do not need them explained."
 zin_mirolon_occupied_years_remembered:0 "The Occupied Years Remembered"
 zin_mirolon_occupied_years_remembered_desc:0 "The songs of the first occupation are taught to children before their letters, and no one forgets the words."
 zin_mirolon_one_realm_one_watch:0 "One Realm, One Watch"
 zin_mirolon_one_realm_one_watch_desc:0 "The pass-lords, the towns and the warden swear a single oath on the lake shore: the realm will stand watch together, and no one will leave his post before the others. It is the nearest Mirolon has come to a banner since the Grand Alliance."
 zin_mirolon_open_the_muster_rolls:0 "Open the Muster Rolls"
 zin_mirolon_open_the_muster_rolls_desc:0 "Every lake town opens its rolls: names, ages, trades, and the old men who can still carry a pike. The tally is long, and it is kept where a messenger can find it in an hour."
 zin_mirolon_own_coin:0 "Mirolon's Own Coin"
 zin_mirolon_own_coin_desc:0 "The pass-lords strike a coin of their own, stamped with the tower and the lake, and levy a plain toll to back it. It buys slowly, but nobody in Parim holds its ledger."
 zin_mirolon_own_coin_spirit:0 "Mirolon's Own Coin"
 zin_mirolon_own_coin_spirit_desc:0 "The tower-and-lake penny is accepted in every market on the lakes, and nobody abroad can call it in."
 zin_mirolon_parim_bankers:0 "Loans from Parim's Bankers"
 zin_mirolon_parim_bankers_desc:0 "The money-changers of Parim lend freely to a frontier that might need them, and take their interest in wares and favours. Workshops rise at once, and so does a debt that will be felt long after."
 zin_mirolon_parim_debts:0 "Debts in Parim"
 zin_mirolon_parim_debts_desc:0 "The ledgers of Parim hold a long account against Mirolon, and the interest is paid in wares that the realm would rather keep."
 zin_mirolon_pass_warden_companies:0 "Pass Warden Companies"
 zin_mirolon_pass_warden_companies_desc:0 "Each pass raises a standing company, drilled on its own ground and armed from the lake-town forges. They know every ledge and every spring, and they have been told not to be proud."
 zin_mirolon_passes_are_shut:0 "The Passes Are Shut"
 zin_mirolon_passes_are_shut_desc:0 "Every gate is barred, every ford is watched and the roads between the forts have been dug out and stoned over. A traveller may still come in from the north, but nothing will go through from the south without a fight."
 zin_mirolon_passes_shut:0 "The Passes Are Shut"
 zin_mirolon_passes_shut_desc:0 "Every gate is barred, every ford watched. An enemy must learn what the stone is worth."
 zin_mirolon_pride_of_the_passes:0 "The Pride of the Passes"
 zin_mirolon_pride_of_the_passes_desc:0 "The realm that nobody believed has held the gates for a year. The soldiers walk differently now."
 zin_mirolon_proof_no_court_can_laugh_at:0 "Proof No Court Can Laugh At"
 zin_mirolon_proof_no_court_can_laugh_at_desc:0 "Maps, tallies, sworn testimony and a handful of things the scouts should not have been able to carry home are laid together before the Golden Court. A court may mock an envoy; it will find it harder to mock a heap of evidence."
 zin_mirolon_quarry_roads:0 "Quarry Roads"
 zin_mirolon_quarry_roads_desc:0 "Carts cannot reach the best quarries, so the roads are cut and paved, and the grades eased for oxen. Every road to a fort is also a road away from it, and the engineers have thought of that."
 zin_mirolon_rangers_of_the_forests:0 "Rangers of the Forests"
 zin_mirolon_rangers_of_the_forests_desc:0 "Hunters, foresters and trappers are enrolled as rangers, each with a green cloak, a long bow and a sworn duty to harry what cannot be held. They are paid in salt, silver and game rights."
 zin_mirolon_rebuild_the_gates:0 "Rebuild the Gates"
 zin_mirolon_rebuild_the_gates_desc:0 "The masons come back to the passes, and so do the quarrymen, the carters and the old pass-lords who were carried out in litters. Gates that were broken in the storm are raised again in stone that will be harder to move."
 zin_mirolon_scout_masters_school:0 "The Scout-Master's School"
 zin_mirolon_scout_masters_school_desc:0 "Hadric Thorne, who has crossed the passes more often than any living man, agrees to teach what he knows to those who will go after him. His pupils learn to move by night, to count without being seen and to come home."
 zin_mirolon_scouts_beyond_the_heat:0 "Scouts Beyond the Heat"
 zin_mirolon_scouts_beyond_the_heat_desc:0 "Volunteers go over the passes in pairs, wearing the dust of the Ember Lands, and come back thin and burnt. What they bring is not much, but the heat has begun to hide less than it did."
 zin_mirolon_seats_for_pass_lords:0 "Seats for the Pass-Lords"
 zin_mirolon_seats_for_pass_lords_desc:0 "Each lord who holds a pass is given a permanent seat in the hall, and a voice on how the forts are to be built. They have kept the gates for four generations without thanks, and are glad of a chair."
 zin_mirolon_siege_granaries:0 "Granaries Against the Siege"
 zin_mirolon_siege_granaries_desc:0 "Stone barns, dry and deep, are filled each autumn against a winter in which the roads may be closed. Mirolon remembers the occupied years, and what an empty granary cost."
 zin_mirolon_siege_granaries_spirit:0 "Granaries Against the Siege"
 zin_mirolon_siege_granaries_spirit_desc:0 "Dry barns of stone stand full against the day the roads close."
 zin_mirolon_signal_towers:0 "Signal Towers"
 zin_mirolon_signal_towers_desc:0 "A chain of towers, each in sight of the next, carries a fire-signal from the passes to the capital in less than an hour. The signals have a code, and the code has been changed twice since the masons finished."
 zin_mirolon_signs_at_the_grave_fields:0 "Signs at the Grave-Fields"
 zin_mirolon_signs_at_the_grave_fields_desc:0 "The watchers report that the old battlefields of the south are no longer still. The fields where the First Age died have been turned, and not by ploughs."
 zin_mirolon_songs_of_the_occupied_years:0 "Songs of the Occupied Years"
 zin_mirolon_songs_of_the_occupied_years_desc:0 "Under the occupation the people sang quietly, in kitchens and cellars, of the day the gates would open. The songs are sung aloud now, and no one in the realm will ever again agree to kneel."
 zin_mirolon_southern_marches_pact:0 "The Southern Marches Pact"
 zin_mirolon_southern_marches_pact_desc:0 "Friendship in a letter is one thing, and men on the road are another. Mirolon proposes a pact for the marches: if the storm comes, each will send what it can spare."
 zin_mirolon_southern_war:0 "The War Carried South"
 zin_mirolon_southern_war_desc:0 "Mirolon's host marches over the passes to the lands of the old enemy, remembering Edran's host and trying not to repeat it."
 zin_mirolon_stone_on_the_passes:0 "Stone on the Passes"
 zin_mirolon_stone_on_the_passes_desc:0 "The quarries of the high valleys are opened again and the old gate-towers are measured for repair. The stone is already lying where the forts will stand."
 zin_mirolon_storm_pilots:0 "Storm Helmsmen"
 zin_mirolon_storm_pilots_desc:0 "The fishers know every squall that comes off the water, and the harbour masters pay them to teach it. Helmsmen who can read the sky will bring galleys home that a chart alone would lose."
 zin_mirolon_the_court_abroad:0 "The Court Abroad"
 zin_mirolon_the_court_abroad_desc:0 "The High Warden sits in a borrowed hall in a friendly land, with the seals on the table and the registers in chests. Mirolon is not a place now; it is a promise that the people keep."
 zin_mirolon_the_exile_court:0 "The Exile Court"
 zin_mirolon_the_exile_court_desc:0 "In the strongest hall of the realm the warden's household packs the seals, the charters and the registers of every town. If the passes fall, a court will leave with them, and Mirolon will go on elsewhere."
 zin_mirolon_the_first_gate:0 "The First Gate"
 zin_mirolon_the_first_gate_desc:0 "The outer gate of the main pass is rebuilt in dressed stone, with a killing ground before it and a barbican behind. It will not stop a host, but it will make a host stop."
 zin_mirolon_the_free_south:0 "The Free South"
 zin_mirolon_the_free_south_desc:0 "The realm that was the first to be conquered is the first to be free. It has its warden, its hall, its gates and its friends, and it is in no hurry to ask anyone's leave to keep them."
 zin_mirolon_the_hidden_mirolon:0 "The Hidden Mirolon"
 zin_mirolon_the_hidden_mirolon_desc:0 "In the occupied towns the lamps are shaded and the messages are written on bread-wrappers and boot-soles. The people greet the invader politely, count his patrols and wait for the warden's word."
 zin_mirolon_the_iron_gate:0 "The Iron Gate"
 zin_mirolon_the_iron_gate_desc:0 "The great gate is hung with iron beams, the work of the lake-town smiths and the masons together. It takes a week to open or shut, and Mirolon intends to shut it."
 zin_mirolon_the_north_listens:0 "The North Listens"
 zin_mirolon_the_north_listens_desc:0 "With so much laid out, even the proudest ear in the north must turn. The warning is no longer a rumour from a frontier, and some courts will begin to count the days the way Mirolon does."
 zin_mirolon_the_passes_held:0 "The Passes Held"
 zin_mirolon_the_passes_held_desc:0 "A full year has passed and the gates still stand. The Dark King's hosts have bled on the stone, and the realm that no one believed has become the wall that held."
 zin_mirolon_the_second_gate:0 "The Second Gate"
 zin_mirolon_the_second_gate_desc:0 "Behind the first gate a second wall rises, higher and thicker, with a cistern, a barracks and a store for a season's food. If the outer works fall, the garrison will still have somewhere to stand."
 zin_mirolon_the_storm_comes:0 "The Storm Comes"
 zin_mirolon_the_storm_comes_desc:0 "The southern sky is red and the signal fires run from tower to tower. The long wait is over, and the first hosts of the Dark King are on the roads."
 zin_mirolon_the_wardens_law:0 "The Wardens' Law"
 zin_mirolon_the_wardens_law_desc:0 "A short code is written down at last: what a warden may command, what the hall may refuse and what no one may do to a free man of the realm. It is read in every market on the first day of the year."
 zin_mirolon_through_the_concord_doors:0 "Through the Concord's Doors"
 zin_mirolon_through_the_concord_doors_desc:0 "The doors of the Concord open to Mirolon's riders. Armouries in the middle lands send spears, helms and good shafts south, and a promise that the passes are not forgotten."
 zin_mirolon_trade_with_the_north:0 "Trade with the North"
 zin_mirolon_trade_with_the_north_desc:0 "Barges of salt fish and lake pearls go up the rivers to Herez and beyond, and come back with iron and good cloth. Merchants who are paid on both ends do not lose heart over rumours of war."
 zin_mirolon_unheeded_warnings:0 "Unheeded Warnings"
 zin_mirolon_unheeded_warnings_desc:0 "Every report Mirolon has sent north has been filed and forgotten. A realm that cannot make itself believed pays in patience and in weight at the council table."
 zin_mirolon_voices_to_the_north:0 "Voices to the North"
 zin_mirolon_voices_to_the_north_desc:0 "Mirolon cannot hold the passes alone for ever, and the realm is known for wearing out its welcome with the truth. Envoys are chosen for patience and told to say little and be believed."
 zin_mirolon_war_footing:0 "A Realm on War Footing"
 zin_mirolon_war_footing_desc:0 "Every smith in the realm is told the number of spears the passes will want, and the guilds are given a year to deliver them. It is an expensive preparation for a war that most of Aoaz will not believe in."
 zin_mirolon_warden_assembly:0 "The Assembly of Wardens"
 zin_mirolon_warden_assembly_desc:0 "The hall keeps the power it won: nothing of weight is done without a vote of the pass-lords and the towns together. It is slow, and it is hard to deceive."
 zin_mirolon_warden_assembly_spirit:0 "The Assembly of Wardens"
 zin_mirolon_warden_assembly_spirit_desc:0 "No law is passed that the pass-lords and the towns have not both argued over. It is slow, and it holds."
 zin_mirolon_warden_kingship:0 "The Elective Crown"
 zin_mirolon_warden_kingship_desc:0 "The High Warden holds a crown for life and speaks for the whole realm. The hall chose him, and the hall can say he is wrong."
 zin_mirolon_warden_league:0 "The Warden League"
 zin_mirolon_warden_league_desc:0 "The free holds of the south sign a league under the warden's banner, each keeping its own laws and its own gates. The league has one rule, written plainly: no member stands alone."
 zin_mirolon_wardens_hall:0 "The Wardens' Hall"
 zin_mirolon_wardens_hall_desc:0 "The pass-lords and the lake towns gather in a plain stone hall under the High Warden's chair. They elect their warden for life, and he answers to them every season."
 zin_mirolon_watch_for_ages:0 "A Watch for the Ages"
 zin_mirolon_watch_for_ages_desc:0 "The towers are manned in every season, and the oath to keep them is older than anyone in the hall."
 zin_mirolon_watch_never_sleeps:0 "The Watch Never Sleeps"
 zin_mirolon_watch_never_sleeps_desc:0 "The watch becomes a calling: sons take their fathers' towers and daughters learn the signal horns before they learn their letters. Mirolon has decided that it will not be surprised twice."
 zin_mirolon_watch_never_sleeps_spirit:0 "The Watch Never Sleeps"
 zin_mirolon_watch_never_sleeps_spirit_desc:0 "In Mirolon there is always a lamp lit on the wall and always someone to see by it."
 zin_mirolon_watch_on_the_passes:0 "The Watch on the Passes"
 zin_mirolon_watch_on_the_passes_desc:0 "The pass-lords set a standing watch on the mountain roads south, relieved every ten days, with a lamp-keeper at every bend. It is a modest order, and it is the reason Mirolon knows anything at all."
 zin_mirolon_what_the_elves_remember:0 "What the Elves Remember"
 zin_mirolon_what_the_elves_remember_desc:0 "The elves of the far forests were at the Grand Alliance too, and some of them still count the dead. Mirolon sends letters that do not ask for an army, only for remembrance."
 zin_mirolon.1.a:0 "Hear the pass-lords."
 zin_mirolon.1.b:0 "Hear the lake towns."
 zin_mirolon.1.d:0 "The pass-lords and the speakers of the lake towns have each asked to be heard first in the new council. High Warden Maeric looks at the two delegations, who have not looked at each other, and asks which will speak."
 zin_mirolon.1.t:0 "The High Warden's Council"
 zin_mirolon.10.a:0 "To the passes!"
 zin_mirolon.10.d:0 "The beacons are lit on every tower, from the Lake Gate to the sea. Scouts report banners on the southern road and a darkness behind them that does not move with the clouds. The High Warden stands on the wall and says only that the long watch is over."
 zin_mirolon.10.t:0 "The Storm Comes"
 zin_mirolon.11.a:0 "Home."
 zin_mirolon.11.d:0 "The master of Nafeher has fallen. What remains of him, no one in Mirolon can say. The warden orders the banners hoisted and the gates opened, and the people, who have waited so long, go slowly home along the roads."
 zin_mirolon.11.t:0 "Mirolon Rises Again"
 zin_mirolon.12.a:0 "Carry it south."
 zin_mirolon.12.b:0 "Remember Edran's host."
 zin_mirolon.12.d:0 "The Dark King's host is gone from the passes and some in the hall say it should be hunted into the south before it can gather again. Old men remind them that King Edran's host once went south to settle accounts, and did not come back."
 zin_mirolon.12.t:0 "Into the Ember Lands?"
 zin_mirolon.2.a:0 "Send more scouts."
 zin_mirolon.2.b:0 "Write it down and wait."
 zin_mirolon.2.d:0 "Rangers report that the old graves of the south have been opened from beneath, and that fresh tracks lead away from them in good order. The captain of the watch asks whether he should send more men to see, or write down what has been seen and wait."
 zin_mirolon.2.t:0 "Signs at the Grave-Fields"
 zin_mirolon.3.a:0 "Herez stands with Mirolon."
 zin_mirolon.3.b:0 "Herez answers to Parim."
 zin_mirolon.3.d:0 "An envoy from Mirolon has arrived with a gift of lake fish, a letter in a plain hand and a polite request. The lords of Herez are asked whether they would call the people of the passes friends, and what they would do if those passes were threatened."
 zin_mirolon.3.t:0 "Friendship with Mirolon"
 zin_mirolon.4.a:0 "Stand with the wardens."
 zin_mirolon.4.b:0 "We keep our own counsel."
 zin_mirolon.4.d:0 "A rider in a green cloak has ridden to the gate of a free hold with a letter from the High Warden of Mirolon. It proposes a league of the free south, in which no member would stand alone when the dark came to its door."
 zin_mirolon.4.t:0 "An Invitation from Mirolon"
 zin_mirolon.5.a:0 "If the storm comes, Herez will send men."
 zin_mirolon.5.b:0 "Herez cannot promise."
 zin_mirolon.5.d:0 "Mirolon proposes a compact of the southern marches: if either is attacked, the other will send men and wagons without waiting to be asked. The lords of Herez have fought their own border wars and read the text carefully."
 zin_mirolon.5.t:0 "The Southern Marches Pact"
 zin_mirolon.6.a:0 "Admit Mirolon."
 zin_mirolon.6.b:0 "A frontier realm's fears are not ours."
 zin_mirolon.6.d:0 "A letter from the High Warden of Mirolon asks to be numbered among the companions of the Lost Cause. The frontier lords who read it say the passes are the true bulwark of the realm; the courtiers say a border realm's fears should not trouble the capital."
 zin_mirolon.6.t:0 "Mirolon Asks to Join the Lost Cause"
 zin_mirolon.7.a:0 "Send rangers north."
 zin_mirolon.7.b:0 "The elves made their choice long ago."
 zin_mirolon.7.d:0 "A letter from the far south reminds the court of Gala that elves and men once stood together, and that the fields where the First Age died still hold their dead. It asks nothing of the court as a whole; it asks only whether any of its rangers might wish to come."
 zin_mirolon.7.t:0 "Mirolon Remembers"
 zin_mirolon.8.a:0 "Read it to the young."
 zin_mirolon.8.d:0 "In the deep vault of the Wardens' Hall the oldest rolls of the realm are opened: the list of the dead of the first conquest, the names of the carried-off and the oath sworn by the survivors. A keeper reads them in a flat voice, as she has done every year."
 zin_mirolon.8.t:0 "The Archives of the First Conquest"
 zin_mirolon.9.a:0 "Mirolon stands."
 zin_mirolon.9.d:0 "A year after the storm broke, the gates of Mirolon still stand. The realm that no court would believe has held the Dark King's hosts on the mountain roads, and the whole of Aoaz now asks how."
 zin_mirolon.9.t:0 "The Passes Held"
