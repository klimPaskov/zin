l_english:
 zin_regional_mina_a_seat_in_the_compact:0 "A Seat in the Compact"
 zin_regional_mina_a_seat_in_the_compact_desc:0 "Mina asks Lerendor for a seat in the Leren Compact. The Compact buys Mina's iron already; a seat would make the arrangement a lasting one."
 zin_regional_mina_chapels_in_the_hills:0 "Chapels in the Hills"
 zin_regional_mina_chapels_in_the_hills_desc:0 "The almoners ask to raise chapels in the hill villages. The reeves are not sure, and the miners are rather keen."
 zin_regional_mina_compact_iron:0 "Compact Iron"
 zin_regional_mina_compact_iron_desc:0 "Mina's iron arms the Compact, and Mina is among its first customers. The smelters are given a contract, and the carts are given priority at the river locks."
 zin_regional_mina_deep_shafts:0 "Deep Shafts"
 zin_regional_mina_deep_shafts_2:0 "The Iron Hills"
 zin_regional_mina_deep_shafts_2_desc:0 "The hills are riddled with galleries, cart-ways and lamp-stations, a town beneath a town. Every miner knows his way out, and the ore keeps coming."
 zin_regional_mina_deep_shafts_desc:0 "The miners go deeper, and the ore is richer for it. Pumps are installed, ladders are replaced by cages and the foremen are paid by the load."
 zin_regional_mina_deep_shafts_spirit:0 "Deep Shafts"
 zin_regional_mina_deep_shafts_spirit_desc:0 "Mina's miners have sunk shafts deeper than any in the North. The ore is richer below, and the foremen are paid by the load."
 zin_regional_mina_envoys_to_the_hold:0 "Envoys to The Hold"
 zin_regional_mina_envoys_to_the_hold_desc:0 "Mina is friends with its neighbour The Hold, and sends envoys to say so. They carry samples of iron, a map of the hill roads and a proposal."
 zin_regional_mina_forts_in_the_passes:0 "Forts in the Passes"
 zin_regional_mina_forts_in_the_passes_desc:0 "Stone forts are raised in the narrowest passes, with a wall, a well and a store of arrows. Anyone who comes through the hills comes through a gate."
 zin_regional_mina_friendship:0 "Iron Contract"
 zin_regional_mina_hill_companies:0 "Hill Companies"
 zin_regional_mina_hill_companies_desc:0 "The wardens are formed into companies, each from a single valley, each led by a reeve. They know the hills better than the hills know themselves."
 zin_regional_mina_hill_road_pact:0 "The Hill Road Pact"
 zin_regional_mina_hill_road_pact_desc:0 "Mina and The Hold keep their hill roads open to each other's carts, and charge no toll. Their merchants have a saying about tolls that is not repeatable."
 zin_regional_mina_hill_roads:0 "The Hill Roads Shared"
 zin_regional_mina_hill_wardens:0 "Hill Wardens"
 zin_regional_mina_hill_wardens_2:0 "Wardens of the Hills"
 zin_regional_mina_hill_wardens_2_desc:0 "The hill companies are drilled together under the reeves' banner. They dig in swiftly, hold their ground and bleed whoever tries to move them."
 zin_regional_mina_hill_wardens_desc:0 "Every pass has its warden and every village its spear. Etonar names a captain for each of the hill-roads and orders them to drill in the autumn."
 zin_regional_mina_hill_wardens_spirit:0 "Hill Companies"
 zin_regional_mina_hill_wardens_spirit_desc:0 "Every hill village keeps a company of wardens who know the paths, the passes and the places where an enemy cannot see. They do not leave the hills lightly."
 zin_regional_mina_hills_arm:0 "The Hills Arm"
 zin_regional_mina_hills_arm_desc:0 "The hills have taken up the sword. Smelters work through the night, wardens man every pass, and the whole of Mina is ready to answer the horn."
 zin_regional_mina_hold_the_hills:0 "Hold the Hills"
 zin_regional_mina_hold_the_hills_desc:0 "The passes are barred with stone and timber, and the forts are manned from end to end. Whoever comes over the hills must come through them."
 zin_regional_mina_iron_for_parim:0 "Iron for Parim"
 zin_regional_mina_iron_for_parim_desc:0 "Parim pays well for iron, and Mina has never refused a good price. A contract is drawn up with the king's factors, and the carts head south."
 zin_regional_mina_iron_for_sonargur:0 "Iron for Sonargur"
 zin_regional_mina_iron_for_sonargur_desc:0 "Mina signs a yearly contract to send iron to the crown at Sonargur. The price is fair, the carts are regular and the reeves hold the key."
 zin_regional_mina_iron_for_the_watch:0 "Iron for the Watch"
 zin_regional_mina_iron_for_the_watch_desc:0 "The smelters work day and night to arm the northern watch. Cart after cart of spear-heads and shield-bosses rolls down to the river."
 zin_regional_mina_ledgers_of_iron:0 "Ledgers of Iron"
 zin_regional_mina_ledgers_of_iron_desc:0 "Every shaft has a clerk and every cart has a tally. At the end of the quarter, the moot knows to the pound what the hills have yielded."
 zin_regional_mina_lords_of_the_delvings:0 "Lords of the Delvings"
 zin_regional_mina_lords_of_the_delvings_2:0 "The Reeves' Law"
 zin_regional_mina_lords_of_the_delvings_2_desc:0 "The reeves have written the law of the mines on a roll of hide, and the lords have sworn to keep it. A quarrel over a vein is now a matter for the moot, and not for the pick."
 zin_regional_mina_lords_of_the_delvings_desc:0 "The lords of Mina hold their hills by the right of the delve: whoever can dig a mine and keep it, keeps it. The title is old, and the iron is older."
 zin_regional_mina_mina_keeps_its_name:0 "Mina Keeps Its Name"
 zin_regional_mina_mina_keeps_its_name_desc:0 "The moot decides that Mina sells iron to anyone who pays and joins nobody's alliance. The reeves put it on a stone, in the cavern where the moot meets."
 zin_regional_mina_mina_united:0 "Mina United"
 zin_regional_mina_mina_united_desc:0 "Lords, reeves and smelt-masters take one oath on the hill-stone. The banner of Mina, a hammer on a grey field, is raised over every mine."
 zin_regional_mina_miners_with_the_heir:0 "Miners with the Heir"
 zin_regional_mina_miners_with_the_heir_desc:0 "The Heir has returned, and the miners of Mina volunteer to dig him a road. They bring picks and spades, and the wardens come with spears."
 zin_regional_mina_own_counsel_mina:0 "Mina Keeps Its Name"
 zin_regional_mina_own_counsel_mina_desc:0 "Mina sells its iron to Sonargur, and takes its counsel from nobody. The moot has said so, and the reeves have sealed it."
 zin_regional_mina_pikes_of_mina_iron:0 "Pikes of Mina Iron"
 zin_regional_mina_pikes_of_mina_iron_desc:0 "The smelters of Mina forge long pike-heads and broad shield-bosses from their best iron. The wardens carry them with a pride that comes of knowing where the iron came from."
 zin_regional_mina_quarries_of_mina:0 "The Quarries of Mina"
 zin_regional_mina_quarries_of_mina_desc:0 "Grey stone for walls and good white stone for halls are cut from the hills in great blocks. They are carted away to build, and the pits are left to fill with water."
 zin_regional_mina_river_barges:0 "River Barges"
 zin_regional_mina_river_barges_desc:0 "Barges carry the iron from the hill-heads to the river towns. The locks are rebuilt and the towpaths widened, and the bargemen are paid in advance."
 zin_regional_mina_shared_watch:0 "The Watch Shared"
 zin_regional_mina_shared_watch_desc:0 "The hill-beacons of Mina are lit in time with the beacons of its neighbours, and the signals are the same. A warning passed along the hills reaches Sonargur in an hour."
 zin_regional_mina_smelting_halls:0 "Smelting Halls"
 zin_regional_mina_smelting_halls_desc:0 "Great halls with a dozen furnaces each are raised at the hill-foot. The fires are never let out, and the glow can be seen from the next valley."
 zin_regional_mina_sonargurs_friend:0 "Sonargur's Friend"
 zin_regional_mina_sonargurs_friend_desc:0 "Mina leans toward Sonargur because Sonargur buys its iron. The moot makes the leaning official, and writes a letter to the crown."
 zin_regional_mina_the_delvings:0 "The Delvings"
 zin_regional_mina_the_delvings_desc:0 "The Delvings of Mina are shafts and galleries cut into the hills in an age no one remembers. New pits are sunk beside the old, and the lamps are trimmed."
 zin_regional_mina_the_delvings_reopen:0 "The Delvings Reopen"
 zin_regional_mina_the_delvings_reopen_desc:0 "The beacon-fires burn low and the shafts are opened once more. The wardens go home with their wages, and the miners go back to the pits."
 zin_regional_mina_the_hill_moot:0 "The Hill Moot"
 zin_regional_mina_the_hill_moot_desc:0 "The moot of reeves meets in a cavern under the hill, where the voices carry and the lamps never go out. Etonar sits on a stone chair at its head."
 zin_regional_mina_the_hill_road_pact:0 "The Hill Road Pact"
 zin_regional_mina_the_hill_road_pact_desc:0 "The pact is cut in a stone and set at the border: the hill roads are open to both lands, and no toll is charged on either side."
 zin_regional_mina_the_hills_arm:0 "The Hills Arm"
 zin_regional_mina_the_hills_arm_desc:0 "The beacons are lit on every peak, and the wardens are called to their passes. The Lord of Mina says that the hills have taken up the sword."
 zin_regional_mina_the_iron_hills:0 "The Iron Hills"
 zin_regional_mina_the_iron_hills_desc:0 "The hills of Mina are known across the North for their iron. Miners and smelters take a pride in the name, and the iron lives up to it."
 zin_regional_mina_the_lord_of_mina:0 "The Lord of Mina"
 zin_regional_mina_the_lord_of_mina_desc:0 "Lord Etonar governs four states of hills and mines through a moot of reeves and smelt-masters. The iron of Mina goes down the river to Sonargur, and the silver comes back up."
 zin_regional_mina_the_mina_levy:0 "The Mina Levy"
 zin_regional_mina_the_mina_levy_desc:0 "The moot orders a levy from every hill village. The miners go to the muster with their picks over their shoulders, and are given spears when they arrive."
 zin_regional_mina_the_reeves_law:0 "The Reeves' Law"
 zin_regional_mina_the_reeves_law_desc:0 "The reeves write the law of the mines: how a vein is claimed, how a shaft is shared and what a miner is owed for a lost hand."
 zin_regional_mina_the_watch_shared:0 "The Watch Shared"
 zin_regional_mina_the_watch_shared_desc:0 "The beacons of the hills are lit in time with the beacons of Mina's neighbours. A warning in the passes is known in Sonargur within the hour."
 zin_regional_mina_wardens_of_the_hills:0 "Wardens of the Hills"
 zin_regional_mina_wardens_of_the_hills_desc:0 "The hill companies are drilled together under the reeves' banner, and learn to dig in as fast as a mine-gang. Whoever meets them in the passes will pay for every foot."
 zin_regional_mina.1.a:0 "The reeves say no"
 zin_regional_mina.1.b:0 "Let the almoners build"
 zin_regional_mina.1.d:0 "The almoners of the Houses of the First Light have come to the hill villages with a plan: a chapel and a hall of healing, a granary and a register of births. The reeves of Mina are wary of anyone who builds on their hills without paying for the stone."
 zin_regional_mina.1.t:0 "A Chapel in the Hills"
 zin_regional_mina.2.a:0 "We have our own"
 zin_regional_mina.2.b:0 "Buy the iron"
 zin_regional_mina.2.d:0 "A smelt-master of Mina has come with a string of carts loaded with bar-iron and a contract. Lord Etonar offers a year's supply at a good price, to be paid in advance and delivered to the river. The offer is fair, and he is not the only one who has made it."
 zin_regional_mina.2.t:0 "Iron from Mina"
 zin_regional_mina.3.a:0 "The Hold keeps its roads"
 zin_regional_mina.3.b:0 "Share the hill roads"
 zin_regional_mina.3.d:0 "Envoys from the hills of Mina have come to The Hold with an offer: to keep the hill roads open between the two lands, toll-free, for a thousand years. They bring a map and a sample of the road-stone."
 zin_regional_mina.3.t:0 "Envoys from Mina"
