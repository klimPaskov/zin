l_english:
 zin_regional_dondor_a_strangers_warning:0 "A Stranger's Warning"
 zin_regional_dondor_a_strangers_warning_desc:0 "A rider reaches Notbuton from the south with word from [zin_loc_eindil], whose road leads through the free lands. He speaks of a darkness that gathers, and Dondor listens as it has not listened before."
 zin_regional_dondor_accord_watch:0 "One Shore, One Watch"
 zin_regional_dondor_accord_watch_desc:0 "Dondor and Belonton keep a single watch on the Sea of Darkness, with lamps lit on both shores. No sail can pass the straits unseen."
 zin_regional_dondor_beacon_kin:0 "Kin by the Beacons"
 zin_regional_dondor_beacon_scouts:0 "Beacon Scouts"
 zin_regional_dondor_beacon_scouts_desc:0 "The quickest runners of the marshes are given leather boots and a horn, and sent from beacon to beacon with news. Their tracks are the roads of Dondor."
 zin_regional_dondor_beacon_scouts_spirit:0 "Beacon Scouts"
 zin_regional_dondor_beacon_scouts_spirit_desc:0 "Scouts range between the beacon hills at all hours, reading smoke and counting riders. A column that approaches the march is seen before it has finished its breakfast."
 zin_regional_dondor_belontons_oath:0 "Belonton's Oath"
 zin_regional_dondor_belontons_oath_desc:0 "Dondor sends a rider to Belonton with a cup of brine from Notbuton's harbour. If the oath is still kept there, the cup will be drunk."
 zin_regional_dondor_brothers_of_blackton:0 "Brothers of Blackton"
 zin_regional_dondor_brothers_of_blackton_desc:0 "The five towns of Blackton trade with everyone and swear to no one. Dondor sends an envoy to ask what the towns would swear if the price were right."
 zin_regional_dondor_brute_companies:0 "Brute Companies"
 zin_regional_dondor_brute_companies_desc:0 "The muster rolls are rewritten in companies of fifty, each with its own captain, its own banner and its own drum. A company holds a stretch of the march for life."
 zin_regional_dondor_brute_companies_spirit:0 "Brute Companies"
 zin_regional_dondor_brute_companies_spirit_desc:0 "The Brutes are formed into companies of fifty under captains who have held the same stretch of march for twenty years. They fight as they have lived: together, and in the same place."
 zin_regional_dondor_brute_forges:0 "The Brute Forges"
 zin_regional_dondor_brute_forges_desc:0 "Smiths of the Brute households fire their forges day and night, turning out spearheads, shields and the heavy axes that the march prefers. The smoke of Notbuton hangs over the marsh."
 zin_regional_dondor_brutes_of_dondor:0 "The Brutes of Dondor"
 zin_regional_dondor_brutes_of_dondor_desc:0 "Broad, stubborn men with square shields and short axes, the Brutes of Dondor have held the march since Goldoroth first rose. They are taught that a step back costs a hold, and a hold costs a family."
 zin_regional_dondor_call_the_guarantors:0 "Call the Guarantors"
 zin_regional_dondor_call_the_guarantors_desc:0 "Riders gallop to Sonargur and Parim with sealed letters and the king's seal. They bear a single line: Notbuton burns, and the old debts are due."
 zin_regional_dondor_charter_of_the_dark_sea:0 "A Charter of the Dark Sea"
 zin_regional_dondor_charter_of_the_dark_sea_desc:0 "The Accord is set down in writing at last, in the tongues of every hold that swore to it. The charter is cut in stone at Notbuton so that the next generation cannot say it was only a rumour."
 zin_regional_dondor_charter_of_the_dark_sea_spirit:0 "A Charter of the Dark Sea"
 zin_regional_dondor_charter_of_the_dark_sea_spirit_desc:0 "The Accord sets its terms down in writing and has them cut into stone at Notbuton. The shore is at peace, and every hold on it knows what peace costs."
 zin_regional_dondor_crown_of_iron_and_salt:0 "A Crown of Iron and Salt"
 zin_regional_dondor_crown_of_iron_and_salt_desc:0 "A smith of Notbuton forges Dunmar a crown of dark iron, and the salt-gatherers crust it white. He wears it only once, at the gate, and the Brutes shout until the walls ring."
 zin_regional_dondor_crown_of_iron_and_salt_spirit:0 "A Crown of Iron and Salt"
 zin_regional_dondor_crown_of_iron_and_salt_spirit_desc:0 "King Dunmar wears a crown of dark iron, crusted with white salt from the marsh. It is ugly, heavy and very much his own."
 zin_regional_dondor_custom_of_the_blood_price:0 "The Custom of the Blood-Price"
 zin_regional_dondor_custom_of_the_blood_price_desc:0 "When a Brute dies on the march, his kin are paid in silver by the raiders' chief, and a hostage is given for the next season. The custom is older than the Accord, and it keeps more peace than the Accord does."
 zin_regional_dondor_dark_sea_fisheries:0 "Fisheries of the Dark Sea"
 zin_regional_dondor_dark_sea_fisheries_desc:0 "Salt-boats put out before dawn and return heavy with fish for the pans. The catch feeds the walls of Notbuton, and the surplus feeds the guild."
 zin_regional_dondor_dead_on_the_dark_shore:0 "Dead on the Dark Shore"
 zin_regional_dondor_dead_on_the_dark_shore_desc:0 "Black hulls rise out of the sea at dawn, and shapes walk up the beach with water running from their bones. The watch lights the signal-fires, and the Brutes go down to meet them."
 zin_regional_dondor_doors_open_to_the_holds:0 "Doors Open to the Holds"
 zin_regional_dondor_doors_open_to_the_holds_desc:0 "Notbuton's envoys ride south to the free holds with gifts of salt and a plain invitation: come under the Accord, and be defended by it. The holds consider it, and some of them come."
 zin_regional_dondor_every_beacon_lit:0 "Every Beacon Lit"
 zin_regional_dondor_every_beacon_lit_desc:0 "From the sea to the hills, every beacon is aflame. The march will know before dawn that Notbuton is ready."
 zin_regional_dondor_every_beacon_lit_spirit:0 "Every Beacon Lit"
 zin_regional_dondor_every_beacon_lit_spirit_desc:0 "From the sea to the hills, every beacon is aflame, and every Brute who sees one lifts his spear. The whole march knows that the war has come."
 zin_regional_dondor_fire_breaks_their_shapes:0 "Fire Breaks Their Shapes"
 zin_regional_dondor_fire_breaks_their_shapes_desc:0 "Tar-pits are lit on the beach and the dead walk through them. Fire breaks their shapes. It does not end them."
 zin_regional_dondor_friends_beyond_the_straits:0 "Friends Beyond the Straits"
 zin_regional_dondor_friends_beyond_the_straits_desc:0 "Dondor is small and the march is long. The king sends envoys across the narrow straits to ask who among the great crowns remembers the old alliance."
 zin_regional_dondor_harbour_of_notbuton:0 "The Harbour of Notbuton"
 zin_regional_dondor_harbour_of_notbuton_desc:0 "Notbuton's harbour is cut into the rock of the shore, with a chain across its mouth and a tower on either side. The king orders it deepened and a dockyard raised beside the quay."
 zin_regional_dondor_hold_notbuton:0 "Hold Notbuton"
 zin_regional_dondor_hold_notbuton_desc:0 "The king takes his place on the great wall, and every Brute capable of bearing arms takes his own. Notbuton will not fall while a Brute lives to hold the gate."
 zin_regional_dondor_iron_from_the_holds:0 "Iron Bought from the Holds"
 zin_regional_dondor_iron_from_the_holds_desc:0 "Dondor buys iron from the orc holds in the south, for coin or for salt. The hold-chiefs are glad of the silver, and the king is glad of the iron."
 zin_regional_dondor_iron_trade:0 "Iron Bought Fairly"
 zin_regional_dondor_kings_justice:0 "The King's Justice"
 zin_regional_dondor_kings_justice_desc:0 "King Dunmar sits in judgement at the gate of Notbuton on market days, and every Brute can bring him a quarrel. His rulings are blunt and quickly forgotten, which is the point of them."
 zin_regional_dondor_leren_ship_masters:0 "Leren Ship-Masters"
 zin_regional_dondor_leren_ship_masters_desc:0 "Ship-masters from Lerendor teach the Notbuton yards how to cut a hull for rough water. Their pupils sail further and see more."
 zin_regional_dondor_light_the_sea_beacons:0 "Light the Sea Beacons"
 zin_regional_dondor_light_the_sea_beacons_desc:0 "The beacons of Notbuton are lit in a long chain across the water, and the answering fires rise one by one on the far shore. Anyone who watches can see the Accord stretch from coast to coast."
 zin_regional_dondor_lords_of_the_marches:0 "Lords of the Marches"
 zin_regional_dondor_lords_of_the_marches_desc:0 "The lords of the northern and southern marches are called to Notbuton and given a seat at the king's table. They leave with a charge and a share of the salt."
 zin_regional_dondor_moot_and_accord:0 "The Moot and the Accord"
 zin_regional_dondor_moot_and_accord_desc:0 "The free holds have called a Moot of their own, and Dondor sends an envoy to its fire with an offer of good will. The Moot and the Accord are not rivals, he says, but two hands on the same blade."
 zin_regional_dondor_muster_drill:0 "The Muster Drill"
 zin_regional_dondor_muster_drill_desc:0 "Twice a year the whole march is called to arms in a single morning, and each company is timed from the horn to the gate. The slowest company is made to carry the king's banner for a week."
 zin_regional_dondor_notbuton_asks_parim:0 "Notbuton Asks Parim"
 zin_regional_dondor_notbuton_asks_parim_desc:0 "A sealed letter goes to the Golden Court, carried by Wenna Saltbrow in her best coat. It asks only for what the Court's sealing-wax can give: a blessing, and the weight of a name."
 zin_regional_dondor_notbuton_calls_on_the_north:0 "Notbuton Calls on the North"
 zin_regional_dondor_notbuton_calls_on_the_north_desc:0 "Across the straits lies Sonargur, where the old Leren compact still holds. Dunmar writes to its Warden-King as a neighbour, not a suppliant."
 zin_regional_dondor_notbuton_stands:0 "Notbuton Stands"
 zin_regional_dondor_notbuton_stands_desc:0 "The great town is made a fortress: inner wall, outer wall, a moat fed from the marsh and a gate that can be dropped in a single stroke. The king has the plans cut on a slab of stone and set above his hall."
 zin_regional_dondor_notbuton_stands_spirit:0 "Notbuton Stands"
 zin_regional_dondor_notbuton_stands_spirit_desc:0 "The walls of the great town are doubled, the gates are iron-banded and every tower holds a store of bolts. Whoever takes Notbuton will pay for every stone."
 zin_regional_dondor_oath_of_the_brutes:0 "The Oath of the Brutes"
 zin_regional_dondor_oath_of_the_brutes_desc:0 "Every man of Dondor who can bear arms swears to hold the march. The oath is sworn on an old blade at the gate of Notbuton, before any witness who cares to see."
 zin_regional_dondor_oath_of_the_brutes_spirit:0 "The Oath of the Brutes"
 zin_regional_dondor_oath_of_the_brutes_spirit_desc:0 "Each Brute swears on his father's blade to hold the march and to die in it if he must. The oath is short, and nobody in Dondor has ever been known to break it."
 zin_regional_dondor_old_debts_of_the_alliance:0 "Old Debts of the Alliance"
 zin_regional_dondor_old_debts_of_the_alliance_desc:0 "The chronicles of Notbuton list every debt that the free banners of the First Age owed one another. Dunmar reads the list aloud to the envoys of the great crowns and waits."
 zin_regional_dondor_one_shore_one_watch:0 "One Shore, One Watch"
 zin_regional_dondor_one_shore_one_watch_desc:0 "The two shores of the Dark Sea set a single watch and a single code of lamps. A signal lit at Notbuton is read at the last hold on the coast within the hour."
 zin_regional_dondor_polite_refusal:0 "A Courteous Refusal"
 zin_regional_dondor_riders_of_the_march:0 "Riders of the March"
 zin_regional_dondor_riders_of_the_march_desc:0 "Dondor has few horses, and the riders who have them are proud of them. They patrol the marsh tracks and the beacon-road, and never ride out of sight of a fire."
 zin_regional_dondor_rovek_remembered:0 "Rovek Remembered"
 zin_regional_dondor_rovek_remembered_desc:0 "The chroniclers of Notbuton keep a name in their rolls: Rovek of Dondor, who stood among the free banners against Volgan in an older age. The holds tell the story differently, and Dondor does not argue."
 zin_regional_dondor_salt_and_fish:0 "Salt and Fish of the Dark Sea"
 zin_regional_dondor_salt_and_fish_desc:0 "The marsh-folk rake salt from the pans and the boats fill their holds with herring. A town that can feed itself on salt fish can survive a siege."
 zin_regional_dondor_same_shore:0 "One Shore"
 zin_regional_dondor_ships_for_notbuton:0 "Ships for Notbuton"
 zin_regional_dondor_ships_for_notbuton_desc:0 "Lerendor lends Dondor ship-masters and two hulls from its yards. They sail for Notbuton under the Leren pennant, and are welcomed with horns."
 zin_regional_dondor_shore_fires:0 "Fires on the Shore"
 zin_regional_dondor_shore_fires_desc:0 "Great fires burn along the shore at night, and fire-pits are dug above the tide line. The dead come ashore into the light, and the Brutes meet them there."
 zin_regional_dondor_stand_with_the_living:0 "Stand with the Living"
 zin_regional_dondor_stand_with_the_living_desc:0 "Dondor sends word to every shore that the dead are abroad and that the living must stand together. For once the holds of the south answer without asking the price."
 zin_regional_dondor_strait_watch:0 "The Strait Watch"
 zin_regional_dondor_strait_watch_desc:0 "Lookouts stand on the headlands night and day, ready to light the signal-fires. No shape on the water comes within a league without being seen."
 zin_regional_dondor_the_accord_at_war:0 "The Accord at War"
 zin_regional_dondor_the_accord_at_war_desc:0 "The horns have sounded and the beacons are alight. Dondor stands with its friends on the march, and the Accord is no longer a compact on parchment."
 zin_regional_dondor_the_accord_endures:0 "The Accord Endures"
 zin_regional_dondor_the_accord_endures_desc:0 "The war is over, and the Accord still stands, with fewer hulls and a longer list of names on the memorial stone. The king reads the names aloud and lets the silence stay."
 zin_regional_dondor_the_beacon_hills:0 "The Beacon Hills"
 zin_regional_dondor_the_beacon_hills_desc:0 "On every hill between the sea and the march a pile of tarred wood stands ready, with a watchman beside it. A fire at Notbuton can be answered at the farthest hold before the sun has moved a hand-breadth."
 zin_regional_dondor_the_brute_kings_hall:0 "The Brute-King's Hall"
 zin_regional_dondor_the_brute_kings_hall_desc:0 "King Dunmar's hall in Notbuton is built of black stone and salt-bleached timber, and it smells of tar and fish. A Brute may come in from the march with his boots wet and be heard."
 zin_regional_dondor_the_brute_muster:0 "The Brute Muster"
 zin_regional_dondor_the_brute_muster_desc:0 "The king calls the muster instead: every spear, every horn, every man of fighting age, drilled until the march is a single wall. It takes a long time, and no one complains."
 zin_regional_dondor_the_brute_muster_spirit:0 "The Brute Muster"
 zin_regional_dondor_the_brute_muster_spirit_desc:0 "Every household in Dondor keeps a spear by the door and a bag packed, and the horn calls them out at a moment's notice. The march has not been unguarded for three centuries."
 zin_regional_dondor_the_counterstroke:0 "The Counterstroke"
 zin_regional_dondor_the_counterstroke_desc:0 "The king orders the Brute companies to cross the march and reclaim what was taken. They go with their axes and their shields, and the old claims are read aloud."
 zin_regional_dondor_the_dark_sea_accord:0 "The Dark Sea Accord"
 zin_regional_dondor_the_dark_sea_accord_desc:0 "Dondor and Belonton keep a compact on the Sea of Darkness, sworn in the old way over a drawn blade and a cup of brine. The king asks his envoys to remind every shore that it still stands."
 zin_regional_dondor_the_kings_justice:0 "The King's Justice"
 zin_regional_dondor_the_kings_justice_desc:0 "Dunmar hears every dispute of the march at the gate of Notbuton, and settles it before the evening bell. Brutes say his justice is hard but quick, and they prefer it to the slow kind."
 zin_regional_dondor_the_kings_peace:0 "The King's Peace"
 zin_regional_dondor_the_kings_peace_desc:0 "Blood-prices are paid before the first snow, and Dunmar promises that no Brute will raid across the march while the price is honoured. The summer passes quietly."
 zin_regional_dondor_the_kings_peace_spirit:0 "The King's Peace"
 zin_regional_dondor_the_kings_peace_spirit_desc:0 "Blood-prices are paid in coin before the winter and the march is quiet. A Brute who can keep a peace through one summer will keep it through another."
 zin_regional_dondor_the_shield_holds:0 "The Shield Holds"
 zin_regional_dondor_the_shield_holds_desc:0 "Dondor has bled, but the line has held. The Brutes lean on their shields and the chroniclers write that the march was not lost."
 zin_regional_dondor_the_shield_line:0 "The Shield-Line"
 zin_regional_dondor_the_shield_line_desc:0 "Brute shields overlap in a line three men deep, rimmed with iron and studded with salt-hardened nails. A charge against them is like a charge against a wall."
 zin_regional_dondor_the_strait_watch:0 "The Strait Watch"
 zin_regional_dondor_the_strait_watch_desc:0 "Chains are strung across the narrows and lookouts posted on every headland. Nothing slips through the straits at night, whether it breathes or not."
 zin_regional_dondor_the_unbroken_line:0 "The Unbroken Line"
 zin_regional_dondor_the_unbroken_line_desc:0 "Stakes, trenches and earth ramparts are joined into a single line from the sea to the hills. It is watched day and night, and no one in Dondor remembers when it was not."
 zin_regional_dondor_unbroken_line:0 "The Unbroken Line"
 zin_regional_dondor_unbroken_line_desc:0 "Trenches, stakes and earthworks run the length of the march in a single chain, manned every hour of the year. The line has never been broken, and the Brutes mean to keep it so."
 zin_regional_dondor_under_the_lost_causes_banner:0 "Under the Lost Cause's Banner"
 zin_regional_dondor_under_the_lost_causes_banner_desc:0 "The Golden King's league against the powers of the dark has no seat for a small hold on the Sea of Darkness. Dunmar asks for one anyway, and sends his best salt as a gift."
 zin_regional_dondor_walls_on_the_march:0 "Walls on the March"
 zin_regional_dondor_walls_on_the_march_desc:0 "New ramparts rise along the northern march, with a ditch and a palisade in front. Every Brute household sends a man to dig, and a woman to feed him."
 zin_regional_dondor.1.a:0 "The King hears the marches."
 zin_regional_dondor.1.b:0 "The King hears the harbour."
 zin_regional_dondor.1.d:0 "The great hall of Notbuton fills with Brutes in salt-stiff cloaks and captains with rust on their hands. Dunmar has two questions, and he asks the one that matters first: where is the march weakest?"
 zin_regional_dondor.1.t:0 "The Hall Assembles"
 zin_regional_dondor.2.a:0 "The march remembers."
 zin_regional_dondor.2.d:0 "A chronicler of Notbuton reads aloud a passage from the old rolls: Rovek of Dondor stood among the free banners against Volgan in an age before the Accord. The holds tell the story differently, but the chronicle is Notbuton's, and the Brutes cheer."
 zin_regional_dondor.2.t:0 "Rovek Remembered"
 zin_regional_dondor.3.a:0 "Belonton watches."
 zin_regional_dondor.3.b:0 "Belonton lights its hills."
 zin_regional_dondor.3.d:0 "Across the water, the hills of Belonton darken, and then one by one they flare. A rider brings word that the chain has been lit as far as the last headland, and that no sail passed it unseen."
 zin_regional_dondor.3.t:0 "Beacons on the Southern Hills"
 zin_regional_dondor.4.a:0 "The oath is old."
 zin_regional_dondor.4.b:0 "Keep the oath."
 zin_regional_dondor.4.d:0 "Dondor's rider has crossed the water with a cup of brine and an old question. The chiefs of Belonton drink to the Accord, or they do not."
 zin_regional_dondor.4.t:0 "The Oath Renewed"
 zin_regional_dondor.5.a:0 "Blackton trades with all."
 zin_regional_dondor.5.b:0 "Stand with Notbuton."
 zin_regional_dondor.5.d:0 "Envoys from Notbuton stand in the harbour-hall of Blackton with salt, a sealed letter and a simple question. Will the five towns stand with the Accord, or trade with all?"
 zin_regional_dondor.5.t:0 "The Accord Asks"
 zin_regional_dondor.6.a:0 "Notbuton is far away."
 zin_regional_dondor.6.b:0 "Name Dondor an honorary crown."
 zin_regional_dondor.6.d:0 "A small hold on the Sea of Darkness asks for a seat in the Golden King's league against the powers of the dark. The court of Parim finds the request touching, and a little impractical."
 zin_regional_dondor.6.t:0 "Notbuton Seeks the League"
 zin_regional_dondor.7.a:0 "We cannot."
 zin_regional_dondor.7.b:0 "Send help."
 zin_regional_dondor.7.d:0 "A rider reaches the court with ash in his hair and a sealed letter held out in both hands. Notbuton burns, it says, and the old alliance is called."
 zin_regional_dondor.7.t:0 "Notbuton Burns"
 zin_regional_dondor.8.a:0 "Notbuton is not alone."
 zin_regional_dondor.8.d:0 "A rider comes in over the straits with a message from a friend beyond them. The answer is yes, and it is delivered in the hearing of the whole hall."
 zin_regional_dondor.8.t:0 "An Answer from Afar"
