l_english:
 zin_regional_poyang_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_poyang_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_poyang_a_garden_for_the_council:0 "A Garden for the Council"
 zin_regional_poyang_a_garden_for_the_council_desc:0 "The gardeners offer to plant a garden at the Noon Council's hall, so that the Speakers may talk among flowers. The beds are laid out in a single afternoon."
 zin_regional_poyang_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_poyang_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_poyang_envoys_to_gala:0 "Envoys to Gala"
 zin_regional_poyang_envoys_to_gala_desc:0 "The court at Gala is old, and its king has seen what nobody else alive remembers. [ROOT.GetName] sends envoys with gifts and a plain wish to hear his counsel."
 zin_regional_poyang_eternal_garden:0 "The Eternal Garden"
 zin_regional_poyang_eternal_garden_desc:0 "The gardens of Poyang bloom in turn, so that at no season is a valley bare. Visitors say it is the only realm where a person can walk from spring into summer without leaving the path."
 zin_regional_poyang_flower_markets:0 "The Flower Markets"
 zin_regional_poyang_flower_markets_desc:0 "Cut flowers, dried herbs and seed-packets are sold from stalls that fill the market streets at dawn. Poyang's seeds are bought for gardens in realms it has never visited."
 zin_regional_poyang_granaries_of_poyang:0 "Granaries of Poyang"
 zin_regional_poyang_granaries_of_poyang_desc:0 "Dry stone granaries stand on every terrace, built to keep fruit, grain and seed through the long winter. They are full by midautumn, and never quite empty by spring."
 zin_regional_poyang_harbours_on_the_sea_of_gods:0 "Harbours on the Sea of Gods"
 zin_regional_poyang_harbours_on_the_sea_of_gods_desc:0 "The Sea of Gods lies warm and green off the coast of [ROOT.GetName], and its harbours are kept swept and whitewashed. Pilgrims and merchants both come in fair weather, and every one is given a berth."
 zin_regional_poyang_healers_herbs:0 "Healers' Herbs"
 zin_regional_poyang_healers_herbs_desc:0 "Physic-gardens grow herbs for every ill, and apothecaries pack them in labelled boxes. Sunhot healers write to Poyang before they write to anyone else."
 zin_regional_poyang_healers_herbs_spirit:0 "Healers' Herbs"
 zin_regional_poyang_healers_herbs_spirit_desc:0 "Poyang's physic-gardens grow herbs for every ill, and the apothecaries pack them in labelled boxes. Sunhot healers write to Poyang before they write to anyone else."
 zin_regional_poyang_healing_houses:0 "The Healing Houses"
 zin_regional_poyang_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_poyang_heed_the_old_king:0 "Heed the Old King"
 zin_regional_poyang_heed_the_old_king_desc:0 "When the old king of Gala sends a word of warning, [ROOT.GetName] will hear it in full council and act on it before the next moon. A court that listens early loses the least."
 zin_regional_poyang_heeding_court:0 "A Court That Heeds"
 zin_regional_poyang_heeding_court_desc:0 "Warnings from Gala are read aloud in full council, and [ROOT.GetName] acts on them while the ink is wet."
 zin_regional_poyang_high_gardener:0 "The High Gardener"
 zin_regional_poyang_high_gardener_desc:0 "Yanthe was chosen by the valley households for her care of the land, not for wealth or war. She still prunes her own roses at dawn."
 zin_regional_poyang_high_gardener_yanthe:0 "The High Gardener"
 zin_regional_poyang_high_gardener_yanthe_desc:0 "The valley households choose their High Gardener for her care of the land. Yanthe tends her own beds, and sends seeds as gifts to every realm that writes to her."
 zin_regional_poyang_mourning_for_lorien:0 "Mourning for Lorien"
 zin_regional_poyang_mourning_for_lorien_desc:0 "A season of mourning waits in the customs of the realms for the day their king at Gala is lost. When that day comes, [ROOT.GetName] will light its lamps, close its feasting halls and walk in the long procession."
 zin_regional_poyang_mourning_for_lorien_tip_1:0 "The realms under the sun keep a season of mourning."
 zin_regional_poyang_old_strength:0 "The Old Strength"
 zin_regional_poyang_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_poyang_pilgrims_of_the_sea_of_gods:0 "Pilgrims of the Sea of Gods"
 zin_regional_poyang_pilgrims_of_the_sea_of_gods_desc:0 "White sails come along the coast each summer carrying pilgrims to the shrines of the Sea of Gods. [ROOT.GetName] gives them water, shade and a safe road, and is spoken of kindly all along the shore."
 zin_regional_poyang_poyangs_voice_at_noon:0 "Poyang's Voice at Noon"
 zin_regional_poyang_poyangs_voice_at_noon_desc:0 "When the Council sits, the High Gardener speaks late and briefly. The Speakers have learned that what she says is usually what they will end by agreeing."
 zin_regional_poyang_priests_from_afar:0 "Priests From Afar"
 zin_regional_poyang_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_poyang_quiet_mediators:0 "The Quiet Mediators"
 zin_regional_poyang_quiet_mediators_desc:0 "When the Sunhot realms quarrel, a Poyang gardener appears with a basket of fruit and a question. By the time the basket is empty, the quarrel is usually over."
 zin_regional_poyang_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_poyang_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_poyang_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_poyang_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_poyang_seeds_for_every_realm:0 "Seeds for Every Realm"
 zin_regional_poyang_seeds_for_every_realm_desc:0 "Poyang sends a packet of seeds to every Sunhot court at the turn of spring, each wrapped in a leaf and labelled in the Gardener's own hand. The gifts are remembered long after the flowers have faded."
 zin_regional_poyang_ships_for_the_isles:0 "Ships for the Isles"
 zin_regional_poyang_ships_for_the_isles_desc:0 "South of the Sea of Gods lie islands that trade with the Sunhot coasts and remember them in song. [ROOT.GetName] sends ships and gifts to their harbours, and the isles send back fruit and fair words."
 zin_regional_poyang_support_the_president:0 "Support the Chair"
 zin_regional_poyang_support_the_president_desc:0 "Poyang's gardener sends a basket of fruit and a loyal note to the Lands of Light's chair. The Radiant Speaker keeps the note and eats the fruit."
 zin_regional_poyang_terraces_of_poyang:0 "Terraces of Poyang"
 zin_regional_poyang_terraces_of_poyang_desc:0 "Stone-wall terraces climb the valley sides, each faced with local stone and planted with fruit trees. The masons who built them are honoured at the harvest feast."
 zin_regional_poyang_the_eternal_garden:0 "The Eternal Garden"
 zin_regional_poyang_the_eternal_garden_desc:0 "Beds are planted so that something blooms in every season, and the valleys are never quite bare. Poyang's gardeners say they are not working for the year but for the century."
 zin_regional_poyang_the_five_valleys:0 "The Five Valleys"
 zin_regional_poyang_the_five_valleys_desc:0 "Garden paths link the five valleys, edged with low hedges and shaded by fruit trees. A traveller on them is never more than a hundred paces from water."
 zin_regional_poyang_the_flower_markets:0 "The Flower Markets"
 zin_regional_poyang_the_flower_markets_desc:0 "Dawn markets fill the streets of the garden towns with cut flowers, dried herbs and seed-packets. Poyang's colours are sold in realms it has never visited."
 zin_regional_poyang_the_garden_court:0 "The Garden Court"
 zin_regional_poyang_the_garden_court_desc:0 "Poyang is five garden valleys, terraced and watered from the hills, whose fruit and flowers are sold at every Sunhot fair. The Noon Council calls it the garden, and listens to it on matters of peace."
 zin_regional_poyang_the_gardeners_council:0 "The Gardeners' Council"
 zin_regional_poyang_the_gardeners_council_desc:0 "The gardeners of the five valleys meet at the turn of each season, each with a basket of what they have grown. They argue about rain, and agree about everything else."
 zin_regional_poyang_the_old_strength:0 "The Old Strength"
 zin_regional_poyang_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_poyang_the_quiet_mediators:0 "The Quiet Mediators"
 zin_regional_poyang_the_quiet_mediators_desc:0 "When the Sunhot realms quarrel, a gardener appears with a basket of fruit and a patient question. By the time the basket is empty, the quarrel is usually over."
 zin_regional_poyang_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_poyang_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_poyang_the_richest_gardens:0 "The Richest Gardens"
 zin_regional_poyang_the_richest_gardens_desc:0 "Poyang's gardens have never been so full, nor its coffers. The Gardener puts half the surplus into new beds, and the rest into the treasury."
 zin_regional_poyang_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_poyang_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_poyang_water_from_the_hills:0 "Water From the Hills"
 zin_regional_poyang_water_from_the_hills_desc:0 "Springs in the hills are caught in stone cisterns and sent down the terraces by a web of channels. The water-wardens keep the stops and the sluices, and know every drop by name."
 zin_regional_poyang_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_poyang_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_poyang_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_poyang_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_poyang_white_sails:0 "White Sails"
 zin_regional_poyang_white_sails_desc:0 "The ships of this coast carry sails of undyed cloth, so that a fleet in the distance looks like a flock of gulls. [ROOT.GetName] builds and rigs them in its own yards and teaches its captains every wind of the Sea of Gods."
 zin_regional_poyang.1.a:0 "Plant it in our colours"
 zin_regional_poyang.1.b:0 "Let every realm bring a seed"
 zin_regional_poyang.1.d:0 "The gardeners offer to plant a garden at the Noon Council's hall, so that the Speakers may talk among flowers. The High Gardener asks whose colours the beds should wear, and the other realms are curious to know."
 zin_regional_poyang.1.t:0 "A Garden for the Council"
 zin_regional_poyang.2.a:0 "Open our harbours to them"
 zin_regional_poyang.2.b:0 "Let them pass by"
 zin_regional_poyang.2.d:0 "White sails carry pilgrims along the coast for the summer feasts. The harbour keeper of [ROOT.GetName] asks whether they are to be given moorings and a feast-day, or left to sail on."
 zin_regional_poyang.2.t:0 "Pilgrims on the Sea of Gods"
