 ZIN_COUNCIL_T1_KNOWN_hub:0 "The name is known. The Veil is gone, and the Houses answer to the open god."
 ZIN_COUNCIL_T1_NOTE_hub:0 "Below 30 the Veil thins and the courts of the Light begin to watch the Houses. At 0 the name is spoken. The Council plays a patient game: charity and discretion raise the Veil, risky work lowers it."
 ZIN_COUNCIL_T1_PLOT_hub:0 "The King's end is prepared to §Y[?global.zin_afrit_regicide_plot|0]§! of 100."
 ZIN_COUNCIL_T1_VEIL_hub:0 "The Veil: §Y[?global.zin_afrit_veil|0]§! of 100. Last month: [?global.zin_afrit_veil_last_change|0]."
