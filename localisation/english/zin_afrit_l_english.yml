 zin_footholds_map_mode_tooltip_delayed:0 "Houses of the First Light"
 zin_ilvane:0 "Ilvane, High Confessor"
 zin_ilvane_adv:0 "Ilvane, High Confessor"
 zin_kessarion:0 "Kessarion the Envoy"
 zin_kessarion_adv:0 "Kessarion the Envoy"
 zin_loc_deliverer_public:0 "Aurevan the Deliverer"
 zin_loc_deliverer_true:0 "Afrit"
 zin_name_afrit:0 "Afrit"
 zin_name_afrit_king_of_east:0 "Afrit, King of the East"
 zin_name_afrit_revealed:0 "Afrit"
 zin_name_aurevan:0 "Aurevan the Deliverer"
 zin_ossar:0 "Magister Velan Ossar"
 zin_ossar_adv:0 "Magister Velan Ossar"
 zin_sevrin:0 "Sevrin the Unending"
 zin_sevrin_adv:0 "Sevrin the Unending"
 zin_trait_deliverer:0 "Beloved of the Faithful"
 zin_trait_deliverer_desc:0 "The people love the god who guards them, and tell him so in every street."
 zin_trait_envoy_of_many_courts:0 "Envoy of Many Courts"
 zin_trait_envoy_of_many_courts_desc:0 "He has a seat at every table and a word for every king."
 zin_trait_high_confessor:0 "High Confessor"
 zin_trait_high_confessor_desc:0 "The priest who keeps the temples' voice and the realm's conscience."
 zin_trait_master_of_couriers:0 "Master of Couriers"
 zin_trait_master_of_couriers_desc:0 "He knows every road and every rider on it."
 zin_trait_seeker_of_relics:0 "Seeker of Relics"
 zin_trait_seeker_of_relics_desc:0 "A scholar who reads old things for the power they still hold."
 zin_trait_unending_thief:0 "The Unending"
 zin_trait_unending_thief_desc:0 "A man who has lived longer than anyone should, and who has learned to take what he wants."
 zin_trait_unmasked:0 "The Unmasked God"
 zin_trait_unmasked_desc:0 "The name is spoken and the glory is no longer veiled. Some kneel at once, and some run."
 zin_wsd_a_court_in_the_east_desc_public:0 "Embassies from the Hermitage go to the dawn lands, bearing gifts and an invitation. The eastern kings receive them with courtesy."
 zin_wsd_a_court_in_the_east_desc_true:0 "A court in the East. The Council's servants speak to every eastern king who refused, and offer them one more chance."
 zin_wsd_a_court_in_the_east_name_public:0 "Embassies to the Dawn"
 zin_wsd_a_court_in_the_east_name_true:0 "A Court in the East"
 zin_wsd_a_god_for_an_empty_throne_desc_public:0 "The Deliverer guards the crown. If the throne of Aenor falls empty, the temple will see that it is not left unattended."
 zin_wsd_a_god_for_an_empty_throne_desc_true:0 "A god for an empty throne. When the Golden King falls, the Deliverer will step into the gap, and the faithful will cry out in thanks."
 zin_wsd_a_god_for_an_empty_throne_name_public:0 "The Deliverer Guards the Crown"
 zin_wsd_a_god_for_an_empty_throne_name_true:0 "A God for an Empty Throne"
 zin_wsd_a_guest_who_does_not_age_desc_public:0 "A guest has come to the reliquary, a pleasant, quiet man who asks to see the old things. The keepers are glad of his interest."
 zin_wsd_a_guest_who_does_not_age_desc_true:0 "The Unending Thief has come to the Council. He does not age, he does not sleep, and he knows where every artifact lies."
 zin_wsd_a_guest_who_does_not_age_name_public:0 "A Guest of the Reliquary"
 zin_wsd_a_guest_who_does_not_age_name_true:0 "The Unending Thief"
 zin_wsd_a_pliant_heir_desc_public:0 "A tutor is found for the Golden King's heir, a devout man who loves the temple and whom the boy is fond of."
 zin_wsd_a_pliant_heir_desc_true:0 "The Council chooses a pliant heir. A child on the throne, a tutor at his ear, and the Council in every room."
 zin_wsd_a_pliant_heir_name_public:0 "A Tutor for the Heir"
 zin_wsd_a_pliant_heir_name_true:0 "A Pliant Heir"
 zin_wsd_a_steady_hand_on_the_seals_desc_public:0 "A steady hand is advised for the royal seals, so that the business of the realm may continue whatever befalls its king."
 zin_wsd_a_steady_hand_on_the_seals_desc_true:0 "The seals are secured. When the King falls, no hand but the Council's will touch the instruments of rule."
 zin_wsd_a_steady_hand_on_the_seals_name_public:0 "A Steady Hand on the Seals"
 zin_wsd_a_steady_hand_on_the_seals_name_true:0 "Secure the Seals"
 zin_wsd_a_vigil_for_the_king_desc_public:0 "A vigil is kept for the Golden King in the great temple. Choirs sing, candles burn, and the faithful pray through the night."
 zin_wsd_a_vigil_for_the_king_desc_true:0 "The instrument is chosen. Some hand must strike, and the Council decides whose."
 zin_wsd_a_vigil_for_the_king_name_public:0 "A Vigil for the King"
 zin_wsd_a_vigil_for_the_king_name_true:0 "Choose the Instrument"
 zin_wsd_blessing_of_the_kings_table_desc_public:0 "The temple blesses the King's table. The cooks are devout, the dishes are simple and the wine is from the Hermitage's own vineyards."
 zin_wsd_blessing_of_the_kings_table_desc_true:0 "The tasters are silenced. Whoever served the King's food will say nothing of what they saw."
 zin_wsd_blessing_of_the_kings_table_name_public:0 "Blessing of the King's Table"
 zin_wsd_blessing_of_the_kings_table_name_true:0 "Silence the Tasters"
 zin_wsd_brother_against_brother_desc_public:0 "The field before Parim is the place where the Deliverer will meet his accuser. The faithful gather to see justice done."
 zin_wsd_brother_against_brother_desc_true:0 "Brother against brother. The Council's master and the stranger meet before the walls of Parim, and one of them will not leave."
 zin_wsd_brother_against_brother_name_public:0 "The Field Before Parim"
 zin_wsd_brother_against_brother_name_true:0 "Brother Against Brother"
 zin_wsd_buy_the_offices_desc_public:0 "Offices of the royal court are open for purchase, and the temple's friends have the funds. The posts they buy are filled with careful men."
 zin_wsd_buy_the_offices_desc_true:0 "The offices Merovan sells are all bought by the Council's friends. In a year the court will be full of them."
 zin_wsd_buy_the_offices_name_public:0 "Purchase of Offices"
 zin_wsd_buy_the_offices_name_true:0 "Buy the Offices He Sells"
 zin_wsd_cast_off_the_mask_desc_public:0 "The Deliverer's radiance is shown to the faithful. His face glows, his robes are bright, and a hundred thousand voices cry out his name."
 zin_wsd_cast_off_the_mask_desc_true:0 "Cast off the mask. The Council steps into the light, and Afrit is named."
 zin_wsd_cast_off_the_mask_name_public:0 "The Deliverer's Radiance"
 zin_wsd_cast_off_the_mask_name_true:0 "Cast Off the Mask"
 zin_wsd_counsel_for_the_chancellor_desc_public:0 "The keeper of the royal seals is a devout man and a friend of the Hermitage. The temple sends him counsel and the occasional gift."
 zin_wsd_counsel_for_the_chancellor_desc_true:0 "Merovan keeps the seals of Aenor and the Council's secrets. His loyalty is bought, his service is willing and his letters are frequent."
 zin_wsd_counsel_for_the_chancellor_name_public:0 "Counsel for the Seal-Keeper"
 zin_wsd_counsel_for_the_chancellor_name_true:0 "Merovan's Seals"
 zin_wsd_doors_in_the_hermitage_walls_desc_public:0 "Doors are cut in the walls of the Hermitage for the use of pilgrims, who may come and go as they like."
 zin_wsd_doors_in_the_hermitage_walls_desc_true:0 "The Ring of Doors is attuned. A door in one place may open in another, and the Council's servants will pass through them."
 zin_wsd_doors_in_the_hermitage_walls_name_public:0 "Doors in the Hermitage Walls"
 zin_wsd_doors_in_the_hermitage_walls_name_true:0 "Attune the Ring of Doors"
 zin_wsd_ears_in_sonargur_desc_public:0 "The Hermitage makes friends at the court of Sonargur, where the sea-kings are sometimes proud and sometimes lonely. A friendly ear is always welcome."
 zin_wsd_ears_in_sonargur_desc_true:0 "Your couriers listen at the Leren court. What they hear of the sea-kings' grievances is written down and sent to the Seat."
 zin_wsd_ears_in_sonargur_name_public:0 "Friends in Sonargur"
 zin_wsd_ears_in_sonargur_name_true:0 "Ears in Sonargur"
 zin_wsd_endow_the_genealogists_desc_public:0 "The temple endows the genealogists with a generous stipend. Their work is quiet, careful and entirely unobjectionable."
 zin_wsd_endow_the_genealogists_desc_true:0 "The scholars are quieted. Those who might have traced the Deliverer's lineage are paid to look elsewhere."
 zin_wsd_endow_the_genealogists_name_public:0 "Endow the Genealogists"
 zin_wsd_endow_the_genealogists_name_true:0 "Quiet the Scholars"
 zin_wsd_every_house_a_fortress_desc_public:0 "Every House of the First Light is a refuge. Its walls are thick, its gates are barred, and its lamps burn through the night."
 zin_wsd_every_house_a_fortress_desc_true:0 "Every house a fortress. A purge of the Houses will find them harder to close."
 zin_wsd_every_house_a_fortress_name_public:0 "Every House a Refuge"
 zin_wsd_every_house_a_fortress_name_true:0 "Every House a Fortress"
 zin_wsd_every_road_has_ears_desc_public:0 "The pilgrim roads of Aoaz are now linked by an unbroken line of wayhouses. Every road, in some sense, leads to the Hermitage."
 zin_wsd_every_road_has_ears_desc_true:0 "Every road of Aoaz has ears. The Council hears what is said at every crossroads, every well and every inn."
 zin_wsd_every_road_has_ears_name_public:0 "Every Road a Pilgrim Road"
 zin_wsd_every_road_has_ears_name_true:0 "Every Road Has Ears"
 zin_wsd_fear_and_worship_desc_public:0 "Awe and worship fill the cities of the faithful. The temples are packed and the streets are quiet."
 zin_wsd_fear_and_worship_desc_true:0 "Fear and worship. The people cannot tell the one from the other, and the Council does not mind."
 zin_wsd_fear_and_worship_name_public:0 "Awe and Worship"
 zin_wsd_fear_and_worship_name_true:0 "Fear and Worship"
 zin_wsd_feed_the_kings_appetite_desc_public:0 "The temple sends gifts to the golden court, wines, spices and sweetmeats from the East. The old king is fond of them."
 zin_wsd_feed_the_kings_appetite_desc_true:0 "The King's appetite is the Council's ally. Rich gifts make him slow, generous and unwatchful."
 zin_wsd_feed_the_kings_appetite_name_public:0 "Gifts for the Golden Court"
 zin_wsd_feed_the_kings_appetite_name_true:0 "Feed the King's Appetite"
 zin_wsd_first_of_his_name_desc_public:0 "Blessings are sung on the throne of Aenor, and the new king is anointed with balm. He is a gentle, devout man, and the court is pleased."
 zin_wsd_first_of_his_name_desc_true:0 "Aurevan the First of his name sits upon the throne of Aenor. The Council has its crown."
 zin_wsd_first_of_his_name_name_public:0 "Blessings on the Throne"
 zin_wsd_first_of_his_name_name_true:0 "First of His Name"
 zin_wsd_hear_the_dominions_desc_public:0 "The Hermitage listens to the dominions of the Concord and hears their complaints. Their burdens are heavy, and the temple prays for them."
 zin_wsd_hear_the_dominions_desc_true:0 "The dominions are told that their burdens come from the King's taxes. A seed of resentment is sown in each."
 zin_wsd_hear_the_dominions_name_public:0 "Hear the Dominions"
 zin_wsd_hear_the_dominions_name_true:0 "Blame the King's Taxes"
 zin_wsd_hunters_on_the_ice_desc_public:0 "Guides are hired to lead pilgrims across the northern ice. They are experienced, patient and well paid."
 zin_wsd_hunters_on_the_ice_desc_true:0 "The ambush is prepared. When the brother crosses the ice, the Council's hunters will be waiting."
 zin_wsd_hunters_on_the_ice_name_public:0 "Guides for the Ice"
 zin_wsd_hunters_on_the_ice_name_true:0 "The Ambush Prepared"
 zin_wsd_hymns_for_a_new_reign_desc_public:0 "Hymns are composed for a new reign, as every prudent temple does when its king is aged. They are gentle, hopeful and ready."
 zin_wsd_hymns_for_a_new_reign_desc_true:0 "The temples are made ready. When the King dies, a hundred choirs will sing in the Deliverer's name."
 zin_wsd_hymns_for_a_new_reign_name_public:0 "Hymns for the Crown"
 zin_wsd_hymns_for_a_new_reign_name_true:0 "Ready the Temples"
 zin_wsd_king_of_the_east_desc_public:0 "A crown of dawn is set on the Deliverer's head by the kings of the East. It is a blessing, a gift and a promise."
 zin_wsd_king_of_the_east_desc_true:0 "King of the East. The Deliverer wears a second crown, and the East kneels, or resists."
 zin_wsd_king_of_the_east_name_public:0 "A Crown of Dawn"
 zin_wsd_king_of_the_east_name_true:0 "King of the East"
 zin_wsd_lamps_in_the_deep_vault_desc_public:0 "Lamps are lit in the deep vault, and the keepers go down with lamp-fat and cloth. The vault is old and needs care."
 zin_wsd_lamps_in_the_deep_vault_desc_true:0 "The Necklace Wakes. A great lamp burns in the deep vault, and the Necklace of the Abyss stirs."
 zin_wsd_lamps_in_the_deep_vault_name_public:0 "Lamps in the Deep Vault"
 zin_wsd_lamps_in_the_deep_vault_name_true:0 "The Necklace Wakes"
 zin_wsd_levies_of_the_caravan_kings_desc_public:0 "Pilgrims from the caravan roads gather at the Hermitage in thousands. Their camels are loaded and their banners are blessed."
 zin_wsd_levies_of_the_caravan_kings_desc_true:0 "The caravan kings send their levies. The East has raised its first host for the Deliverer."
 zin_wsd_levies_of_the_caravan_kings_name_public:0 "Pilgrims from the Caravan Roads"
 zin_wsd_levies_of_the_caravan_kings_name_true:0 "Levies of the Caravan Kings"
 zin_wsd_long_live_the_golden_king_desc_public:0 "Long live the Golden King! The temple's prayers are for his health, and the faithful cheer him through the streets."
 zin_wsd_long_live_the_golden_king_desc_true:0 "The Golden King shall be kept. The Council will rule through him, and he will not know."
 zin_wsd_long_live_the_golden_king_name_public:0 "Long Live the Golden King"
 zin_wsd_long_live_the_golden_king_name_true:0 "Keep the Golden King"
 zin_wsd_lord_of_all_aoaz_desc_public:0 "Light over all Aoaz, the faithful sing. The Deliverer's peace is declared for every land, and the temples ring with joy."
 zin_wsd_lord_of_all_aoaz_desc_true:0 "Lord of all Aoaz. The claim is made, and the Council marches to take what it says is owed."
 zin_wsd_lord_of_all_aoaz_name_public:0 "Light Over All Aoaz"
 zin_wsd_lord_of_all_aoaz_name_true:0 "Lord of All Aoaz"
 zin_wsd_merchants_gossip_desc_public:0 "Merchants bring news to the Hermitage along with their prayers. The scribes write down what they hear and file it away."
 zin_wsd_merchants_gossip_desc_true:0 "Your listeners in the West gather whispers of an old brother, a stranger from the ice. You will know his name before the world does."
 zin_wsd_merchants_gossip_name_public:0 "Merchants' Gossip"
 zin_wsd_merchants_gossip_name_true:0 "Ears in the West"
 zin_wsd_oaths_in_gold_desc_public:0 "Oaths are sworn in gold at the temple, as they have been since the Jubilee. The faithful come to renew them."
 zin_wsd_oaths_in_gold_desc_true:0 "The Crown of Witnesses is attuned. Oaths sworn under it are heard by many, and the Council is among the hearers."
 zin_wsd_oaths_in_gold_name_public:0 "Oaths in Gold"
 zin_wsd_oaths_in_gold_name_true:0 "Attune the Crown of Witnesses"
 zin_wsd_oaths_of_the_royal_army_desc_public:0 "The temple blesses the royal army and its captains. The soldiers kneel in their thousands, and the chaplains of the Hermitage go with them to every post."
 zin_wsd_oaths_of_the_royal_army_desc_true:0 "The army swears the Oaths. Every captain of Aenor knows the name of the Deliverer and will answer to it when the Council gives the word."
 zin_wsd_oaths_of_the_royal_army_name_public:0 "Blessing the Royal Army"
 zin_wsd_oaths_of_the_royal_army_name_true:0 "Oaths of the Royal Army"
 zin_wsd_parim_shall_not_fall_desc_public:0 "Parim shall not fall. The Deliverer's peace will shield the city, and the faithful gather within its walls."
 zin_wsd_parim_shall_not_fall_desc_true:0 "Stand in Parim. The Deliverer will not flee. If the stranger comes, he will meet the Council at the gates."
 zin_wsd_parim_shall_not_fall_name_public:0 "Parim Shall Not Fall"
 zin_wsd_parim_shall_not_fall_name_true:0 "Stand in Parim"
 zin_wsd_patrons_of_the_lost_cause_desc_public:0 "The temple is a patron of the Lost Cause, the old league of the Middle Lands. Its prayers and its alms are open to any who ask."
 zin_wsd_patrons_of_the_lost_cause_desc_true:0 "The Council watches the Lost Cause, the old league sworn to the Golden King. Its leaders must be known, so that none will surprise the Council."
 zin_wsd_patrons_of_the_lost_cause_name_public:0 "Patrons of the Lost Cause"
 zin_wsd_patrons_of_the_lost_cause_name_true:0 "Watch the Lost Cause"
 zin_wsd_peace_for_the_realm_desc_public:0 "Peace is proclaimed for the realm, and claimants to the throne are asked to lay down their pretensions. The proclamation is read in every temple."
 zin_wsd_peace_for_the_realm_desc_true:0 "The claimants are silenced. The Golden King's cousins, nephews and counsellors find themselves unwelcome in Parim."
 zin_wsd_peace_for_the_realm_name_public:0 "Peace for the Realm"
 zin_wsd_peace_for_the_realm_name_true:0 "Silence the Claimants"
 zin_wsd_pray_for_patience_desc_public:0 "The Hermitage asks for patience. The Golden King is old, and the faithful should pray that he lives long and well."
 zin_wsd_pray_for_patience_desc_true:0 "The Council stays its hand. The plan is delayed, and the Golden King is spared for now."
 zin_wsd_pray_for_patience_name_public:0 "Pray for Patience"
 zin_wsd_pray_for_patience_name_true:0 "Stay the Hand"
 zin_wsd_remedies_of_the_royal_physicians_desc_public:0 "Remedies of the royal physicians are blessed by the temple. The best herbs of the Hermitage are sent to the golden court."
 zin_wsd_remedies_of_the_royal_physicians_desc_true:0 "The physician is one of the Council's own. The King's cup is filled by a hand that knows its business."
 zin_wsd_remedies_of_the_royal_physicians_name_public:0 "Remedies of the Royal Physicians"
 zin_wsd_remedies_of_the_royal_physicians_name_true:0 "The Physician's Hand"
 zin_wsd_rest_at_the_hermitage_desc_public:0 "The Deliverer rests at the Hermitage. The sisters bring him broth and the choir sings softly in the hall."
 zin_wsd_rest_at_the_hermitage_desc_true:0 "The wound is hidden. The Deliverer must appear strong, whatever he has suffered in the north."
 zin_wsd_rest_at_the_hermitage_name_public:0 "Rest at the Hermitage"
 zin_wsd_rest_at_the_hermitage_name_true:0 "Hide the Wound"
 zin_wsd_rumours_of_a_green_light_desc_public:0 "Rumours reach the Hermitage of a green light in a castle in the north. The monks write them down and wonder."
 zin_wsd_rumours_of_a_green_light_desc_true:0 "The Council seeks Glo. A green crystal is rumoured in the north, and with it a brother who must not be allowed to return."
 zin_wsd_rumours_of_a_green_light_name_public:0 "Rumours of a Green Light"
 zin_wsd_rumours_of_a_green_light_name_true:0 "Seek Glo"
 zin_wsd_seat_of_censers_desc_public:0 "A chapter of the Hermitage is raised for those who tend the censers and lead the hymns. It is the heart of the temple's worship."
 zin_wsd_seat_of_censers_desc_true:0 "The Seat of Censers is taken. Worship is the Council's mask, and this seat keeps the mask straight."
 zin_wsd_seat_of_censers_name_public:0 "The Censer Chapter"
 zin_wsd_seat_of_censers_name_true:0 "The Seat of Censers"
 zin_wsd_seat_of_relics_desc_public:0 "A chapter of the Hermitage is founded to guard its relics. The reliquary is old, the relics are holy, and the vaults are kept dry."
 zin_wsd_seat_of_relics_desc_true:0 "The Seat of Relics is taken. The Council's artifacts are gathered, attuned and made ready."
 zin_wsd_seat_of_relics_name_public:0 "The Reliquary Chapter"
 zin_wsd_seat_of_relics_name_true:0 "The Seat of Relics"
 zin_wsd_seat_of_seals_desc_public:0 "The Deliverer has friends at the golden court of Parim. Their advice is sought and their prayers are valued."
 zin_wsd_seat_of_seals_desc_true:0 "The Seat of Seals is taken. The Council's hand now rests on the rule of Aenor."
 zin_wsd_seat_of_seals_name_public:0 "Friends at the Golden Court"
 zin_wsd_seat_of_seals_name_true:0 "The Seat of Seals"
 zin_wsd_seat_of_whispers_desc_public:0 "A chapter of couriers is founded at the Hermitage. They carry letters, learn languages and are welcome at any court that has a table and a chair."
 zin_wsd_seat_of_whispers_desc_true:0 "The first seat of the Council of the Deliverer takes its place: the Seat of Whispers, which gathers what every court wishes hidden."
 zin_wsd_seat_of_whispers_name_public:0 "The Couriers' Chapter"
 zin_wsd_seat_of_whispers_name_true:0 "The Seat of Whispers"
 zin_wsd_servants_beyond_the_veil_desc_public:0 "Wardens unseen are said to watch over the Hermitage by night. The pilgrims claim to have felt their eyes."
 zin_wsd_servants_beyond_the_veil_desc_true:0 "Servants beyond the veil. The Council's oldest allies are called to the Hermitage, and they come."
 zin_wsd_servants_beyond_the_veil_name_public:0 "Wardens Unseen"
 zin_wsd_servants_beyond_the_veil_name_true:0 "Servants Beyond the Veil"
 zin_wsd_ships_for_the_northern_pilgrims_desc_public:0 "Ships are fitted out for pilgrims who wish to visit the shrines of the north. They are sturdy, well-stocked and fast."
 zin_wsd_ships_for_the_northern_pilgrims_desc_true:0 "Ships for the North. They will carry the Council's hunters to the cold coast where the brother has been seen."
 zin_wsd_ships_for_the_northern_pilgrims_name_public:0 "Ships for the Northern Pilgrims"
 zin_wsd_ships_for_the_northern_pilgrims_name_true:0 "Ships for the North"
 zin_wsd_the_ashen_throne_desc_public:0 "The radiant throne is raised at Parim, in white and gold, and the Deliverer takes his place upon it."
 zin_wsd_the_ashen_throne_desc_true:0 "The Ashen Throne. The Council has won, and Aoaz is ruled by a god of ash."
 zin_wsd_the_ashen_throne_name_public:0 "The Radiant Throne"
 zin_wsd_the_ashen_throne_name_true:0 "The Ashen Throne"
 zin_wsd_the_coronation_oaths_desc_public:0 "The faithful swear oaths to the new king in their thousands. The temples are full, and the coronation is spoken of for years."
 zin_wsd_the_coronation_oaths_desc_true:0 "The coronation oaths are sworn under the Crown of Witnesses. The faithful have bound themselves, and every oath is heard."
 zin_wsd_the_coronation_oaths_name_public:0 "Oaths of the Faithful"
 zin_wsd_the_coronation_oaths_name_true:0 "The Coronation Oaths"
 zin_wsd_the_councils_verdict_desc_public:0 "Prayers are offered for the Golden King's health, in every temple and every house of the First Light. The court is touched by the devotion."
 zin_wsd_the_councils_verdict_desc_true:0 "The Council hears the matter of the Golden King and delivers its verdict. The hour is not yet fixed, but the plan is made."
 zin_wsd_the_councils_verdict_name_public:0 "Prayers for the King"
 zin_wsd_the_councils_verdict_name_true:0 "The Council's Verdict"
 zin_wsd_the_eastern_chapter_desc_public:0 "A chapter of the Hermitage opens in the East, with a hospital, a school and a guest-house for travelling merchants. The kings of the East are courteous and curious."
 zin_wsd_the_eastern_chapter_desc_true:0 "The Eastern Branch of the Council is founded. The reserve seat of the Deliverer begins to take root in the courts of the East."
 zin_wsd_the_eastern_chapter_name_public:0 "The Eastern Chapter"
 zin_wsd_the_eastern_chapter_name_true:0 "The Eastern Branch"
 zin_wsd_the_eastern_war_council_desc_public:0 "A council of the dawn meets at the Hermitage. Its members are priests, merchants and old soldiers, and their talk is of the road."
 zin_wsd_the_eastern_war_council_desc_true:0 "The Eastern War Council. Aurevan takes the field-marshal role, and the host is given a single will."
 zin_wsd_the_eastern_war_council_name_public:0 "Council of the Dawn"
 zin_wsd_the_eastern_war_council_name_true:0 "The Eastern War Council"
 zin_wsd_the_endless_regency_desc_public:0 "A wise regency governs Aenor in the name of its king. The regents are honest, devout and very capable."
 zin_wsd_the_endless_regency_desc_true:0 "The Endless Regency. The Golden Court is a client of the Council, and the Council is the hand inside it."
 zin_wsd_the_endless_regency_name_public:0 "A Wise Regency"
 zin_wsd_the_endless_regency_name_true:0 "The Endless Regency"
 zin_wsd_the_faithful_rise_desc_public:0 "The faithful gather in their thousands. They carry candles, sing hymns and ask only to see the Deliverer pass."
 zin_wsd_the_faithful_rise_desc_true:0 "The Faithful Rise. Every House of the First Light is a barracks, and every convert is a soldier."
 zin_wsd_the_faithful_rise_name_public:0 "The Faithful Gather"
 zin_wsd_the_faithful_rise_name_true:0 "The Faithful Rise"
 zin_wsd_the_first_seal_desc_public:0 "The first seal of the temple is brought out and shown to the faithful. It is a plain bracelet of old silver."
 zin_wsd_the_first_seal_desc_true:0 "The Bracelet of the First Seal is attuned. What it closes, only the Council can open."
 zin_wsd_the_first_seal_name_public:0 "The First Seal"
 zin_wsd_the_first_seal_name_true:0 "Attune the Bracelet of the First Seal"
 zin_wsd_the_host_of_the_east_desc_public:0 "The faithful of the East gather in a great host. They carry banners of white and gold, and they sing as they march."
 zin_wsd_the_host_of_the_east_desc_true:0 "The Host of the East is assembled. Nothing like it has been seen in the lands of the dawn since the Second Age."
 zin_wsd_the_host_of_the_east_name_public:0 "Gathering of the Faithful"
 zin_wsd_the_host_of_the_east_name_true:0 "The Host of the East"
 zin_wsd_the_mistfall_vigil_desc_public:0 "The Mistfall Vigil is kept in the great temple of Parim. Candles are lit for the Golden King, and the faithful pray through the long night."
 zin_wsd_the_mistfall_vigil_desc_true:0 "The Night of Mistfall. At the hour the Council has fixed, the Golden King will die, and his throne will be empty."
 zin_wsd_the_mistfall_vigil_name_public:0 "The Mistfall Vigil"
 zin_wsd_the_mistfall_vigil_name_true:0 "The Night of Mistfall"
 zin_wsd_the_old_council_resumes_desc_public:0 "The Houses are restored in every land, with new gifts, new wards and new patrons. The poor are fed once more."
 zin_wsd_the_old_council_resumes_desc_true:0 "The Old Council resumes. Its seats are filled in every land, and its servants are in every court."
 zin_wsd_the_old_council_resumes_name_public:0 "The Houses Restored"
 zin_wsd_the_old_council_resumes_name_true:0 "The Old Council Resumes"
 zin_wsd_the_quiet_hands_desc_public:0 "The sisters of the Hermitage tend the sick and lay hands on the dying. They are gentle, compassionate and never in the way."
 zin_wsd_the_quiet_hands_desc_true:0 "The Silent Knives of the Council are trained in the quiet art. A dissenter who speaks too loud may find that he has been silenced."
 zin_wsd_the_quiet_hands_name_public:0 "Hands of Mercy"
 zin_wsd_the_quiet_hands_name_true:0 "The Silent Knives"
 zin_wsd_the_radiant_face_desc_public:0 "The Deliverer's face is shown in the great temple, radiant and mild. The faithful weep to see it, and the doubters are quieted."
 zin_wsd_the_radiant_face_desc_true:0 "The Veil of Aurevan is perfected. His face is gentle, and the world sees nothing else."
 zin_wsd_the_radiant_face_name_public:0 "The Radiant Face"
 zin_wsd_the_radiant_face_name_true:0 "The Veil of Aurevan"
 zin_wsd_the_return_desc_public:0 "The pilgrims return from the East. The Deliverer is among them, and the faithful turn out in thousands to greet him."
 zin_wsd_the_return_desc_true:0 "The Return from the East. The host marches west under the Deliverer's banner, and the war is carried to Aenor."
 zin_wsd_the_return_name_public:0 "The Pilgrims Return"
 zin_wsd_the_return_name_true:0 "The Return from the East"
 zin_wsd_the_seals_will_pass_desc_public:0 "The keepers of the seals will pass them to the Deliverer's own hand, and the temple will bless the new reign."
 zin_wsd_the_seals_will_pass_desc_true:0 "The Council commits to the crown. Aurevan will be crowned, and the Deliverer will sit on the throne of Aenor."
 zin_wsd_the_seals_will_pass_name_public:0 "Keepers of the Seals"
 zin_wsd_the_seals_will_pass_name_true:0 "Commit to the Crown"
 zin_wsd_the_whisper_network_desc_public:0 "The pilgrim network of the Hermitage is a marvel of order. News from the farthest courts reaches it faster than any royal courier."
 zin_wsd_the_whisper_network_desc_true:0 "The Whisper Network is complete. No word is spoken in the courts of Aoaz that the Council does not hear within the month."
 zin_wsd_the_whisper_network_name_public:0 "The Pilgrim Network"
 zin_wsd_the_whisper_network_name_true:0 "The Whisper Network"
 zin_wsd_those_who_refused_desc_public:0 "Letters go out to those who doubted the Deliverer. They are gentle, patient and unmistakably clear."
 zin_wsd_those_who_refused_desc_true:0 "Those who refused are named. The Council writes their names on the list of the first campaign."
 zin_wsd_those_who_refused_name_public:0 "Letters to the Doubtful"
 zin_wsd_those_who_refused_name_true:0 "Those Who Refused"
 zin_wsd_through_the_elven_woods_desc_public:0 "Pilgrim paths are marked through the elven woods. The elves are asked for passage and are told that the Deliverer's blessing goes with the pilgrims."
 zin_wsd_through_the_elven_woods_desc_true:0 "Strike the Magical Lands. The host crosses the rift, and the elven woods are claimed for the Deliverer."
 zin_wsd_through_the_elven_woods_name_public:0 "Pilgrim Paths Through the Woods"
 zin_wsd_through_the_elven_woods_name_true:0 "Strike the Magical Lands"
 zin_wsd_watchers_of_the_south_desc_public:0 "Pilgrims go south to Mirolon and are welcomed by the keepers of the passes. They pray at the shrines and are shown the walls."
 zin_wsd_watchers_of_the_south_desc_true:0 "Your pilgrims count the passes of Mirolon, its garrisons and the storms that guard them. They report to the Seat of Whispers."
 zin_wsd_watchers_of_the_south_name_public:0 "Pilgrims to Mirolon"
 zin_wsd_watchers_of_the_south_name_true:0 "Watchers of the South"
