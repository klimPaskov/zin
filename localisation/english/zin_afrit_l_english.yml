l_english:
 MAPMODE_ZIN_FOOTHOLDS_MAP_MODE:0 "Houses of the First Light"
 MAPMODE_ZIN_FOOTHOLDS_MAP_MODE_DESCRIPTION:0 "Shows where a House of the First Light serves."
 MAPMODE_ZIN_FOOTHOLDS_MAP_MODE_NAME:0 "Houses of the First Light"
 zin_afrit_aurevan_away:0 "The Deliverer Is Away"
 zin_afrit_aurevan_away_desc:0 "The god-king has sailed north and left the kingdom to his seal-keeper. The court manages, and counts the days."
 zin_afrit_call_debt:0 "Call In a Debt at [FROM.GetName]"
 zin_afrit_call_debt_desc:0 "The Houses have been kind to this court for years. A letter reminds it of the kindness, and asks for a small return."
 zin_afrit_cat_houses:0 "The Houses of the First Light"
 zin_afrit_cat_houses_desc:0 "The hospitals, granaries and scribes that a pilgrim house keeps. A court that doubts them may close their doors."
 zin_afrit_close_houses:0 "Close the Houses of the First Light"
 zin_afrit_close_houses_desc:0 "The court has weighed the hospitals, the granaries and the scribes against what the pilgrims ask, and has found the price too high. The doors are shut."
 zin_afrit_confess_cause_hub:0 "sits among the Lost Cause's friends and watches Parim"
 zin_afrit_confess_dom_hub:0 "keeps a proud court that sells its offices"
 zin_afrit_confess_light_hub:0 "keeps a Light court that asks careful questions"
 zin_afrit_confess_quiet_hub:0 "is quiet and keeps its own counsel"
 zin_afrit_confess_war_hub:0 "is at war and speaks of nothing else"
 zin_afrit_council:0 "[ROOT.zin_afrit_council_name]"
 zin_afrit_council_desc:0 "The Council's work, in the order it is done: footholds, favours, the Reliquary and the court of Aenor."
 zin_afrit_council_name_public:0 "The Hermitage Chapter"
 zin_afrit_council_name_true:0 "The Hidden Council"
 zin_afrit_deliverer_rests:0 "The Deliverer Rests"
 zin_afrit_deliverer_rests_desc:0 "The god keeps to his rooms, and no petition reaches him. The realm waits, singing."
 zin_afrit_draw_on_necklace:0 "Draw on the Necklace"
 zin_afrit_draw_on_necklace_desc:0 "The Necklace of the Abyss gives what it is asked for, for thirty days. Something in the vault is a little colder afterwards."
 zin_afrit_edict_of_arms:0 "The Edict of Arms"
 zin_afrit_edict_of_arms_desc:0 "The King's edict puts every muster-roll in the temples' hands, and every drill-yard under the altar."
 zin_afrit_edict_of_summons:0 "The Edict of Summons"
 zin_afrit_edict_of_summons_desc:0 "The King summons the lords of every dominion to swear again. Most come."
 zin_afrit_edict_of_the_faithful:0 "The Edict of the Faithful"
 zin_afrit_edict_of_the_faithful_desc:0 "Two dominions of the Concord are told that the Houses of the First Light are to be given a place in their halls."
 zin_afrit_edict_of_the_temple_treasury:0 "The Edict of the Temple Treasury"
 zin_afrit_edict_of_the_temple_treasury_desc:0 "The treasury of the kingdom and the treasury of the temples are, for a season, one purse. The hermitage is richer for it."
 zin_afrit_graces:0 "Graces of the Deliverer"
 zin_afrit_graces_desc:0 "The old treasures of the hermitage bless the realm that the Deliverer rules. Each is stronger when it is woken, and the Necklace is strongest in the heart of the Middle Kingdom."
 zin_afrit_hear_confession:0 "Hear the Confession of [FROM.GetName]"
 zin_afrit_hear_confession_desc:0 "Priests who sit in the confessional of a foreign court hear what its great ones will not say aloud. The report reaches the hermitage within the week."
 zin_afrit_houses:0 "Houses of the First Light"
 zin_afrit_houses_desc:0 "A hospital, a grain store and a school of scribes, kept by priests who serve most of their people sincerely. The better the court knows them, the more it leans on them."
 zin_afrit_necklace_drawn:0 "The Necklace Drawn Upon"
 zin_afrit_necklace_drawn_desc:0 "The Necklace gives what it can, for a time, and the price is paid in the dark."
 zin_afrit_open_famine_stores:0 "Open the Famine Stores at [FROM.GetName]"
 zin_afrit_open_famine_stores_desc:0 "Where war or hunger has broken a court, the Houses open their stores to all, and ask nothing but gratitude."
 zin_afrit_open_house:0 "Open a House in [FROM.GetName]"
 zin_afrit_open_house_desc:0 "A hospital, a granary and a school of scribes, offered in the name of the First Light. Sixty days of patience, and a court that may or may not be glad of it."
 zin_afrit_opinion_famine_stores:0 "The Famine Stores Were Opened"
 zin_afrit_opinion_thief_caught:0 "A Thief Was Caught"
 zin_afrit_raise_the_faithful:0 "Raise the Faithful in [FROM.GetName]"
 zin_afrit_raise_the_faithful_desc:0 "The Houses answer at last as what they are. The Faithful of the land rise at the Deliverer's word, and the court has thirty days to decide whose servants it is."
 zin_afrit_send_the_thief:0 "Send the Thief to [FROM.GetName]"
 zin_afrit_send_the_thief_desc:0 "The man who does not age goes to a foreign court with his light hands. What he brings back is worth a season of research. If he is caught, it is worth a great deal less."
 zin_afrit_silence_dissenter:0 "Silence a Dissenter"
 zin_afrit_silence_dissenter_desc:0 "A preacher in some far town has begun to ask the wrong questions. The Hands of Mercy go to him, and he is quiet. Usually."
 zin_afrit_steer_the_court:0 "Steer the Court"
 zin_afrit_steer_the_court_desc:0 "A letter to Merovan, in the hand of the Council, tells him how the King should be advised this month."
 zin_afrit_tt_aoaz:0 "The Deliverer takes the crown of Parim again."
 zin_afrit_tt_chapter:0 "The chapter sends word."
 zin_afrit_tt_claims:0 "Old claims are read out in every hall."
 zin_afrit_tt_closed:0 "The doors of the Houses are shut."
 zin_afrit_tt_crown:0 "The temples lay the crown before the Deliverer."
 zin_afrit_tt_dawn:0 "The kings of the East name the Deliverer their king."
 zin_afrit_tt_defend:0 "The hermitage answers the intruders."
 zin_afrit_tt_east:0 "The Deliverer turns his face to the East."
 zin_afrit_tt_faithful_rise:0 "The Faithful rise in the land."
 zin_afrit_tt_fall:0 "The false god falls."
 zin_afrit_tt_host:0 "The pilgrims of the East gather under one banner."
 zin_afrit_tt_houses:0 "The Houses of the First Light tend to their work."
 zin_afrit_tt_kneel:0 "The court takes the Deliverer for its king."
 zin_afrit_tt_lost:0 "A treasure of the hermitage is lost."
 zin_afrit_tt_name:0 "The Deliverer is no longer veiled."
 zin_afrit_tt_prayers:0 "The faithful pray for the King."
 zin_afrit_tt_refuser:0 "A letter is sent to the doubtful court."
 zin_afrit_tt_rest:0 "The Deliverer withdraws to rest."
 zin_afrit_tt_return:0 "The pilgrims turn homeward."
 zin_afrit_tt_ships:0 "The pilgrim ships put out to sea."
 zin_afrit_tt_silent:0 "The Hands of Mercy go quietly."
 zin_afrit_tt_tutor:0 "The temples send a tutor to the heir."
 zin_afrit_tt_vaults:0 "The vaults are opened and the lamps are lit."
 zin_afrit_tt_vigil:0 "A vigil is kept for the King."
 zin_afrit_tt_wards:0 "The wards of the palace are woken."
 zin_afrit_unmasked:0 "The Mask Slips"
 zin_afrit_unmasked_desc:0 "The secret came out before its hour. Every house is watched, and every friend is a question."
 zin_afrit.1.a:0 "The month turns."
 zin_afrit.2.a:0 "The month turns."
 zin_afrit.3.a:0 "Let it grow quietly."
 zin_afrit.3.desc:0 "The masons have finished their work in [zin_afrit_hub_target.GetName]. A hospital, a granary and a school of scribes have opened their doors under the First Light, and the neighbours have already begun to come."
 zin_afrit.3.t:0 "A House Opens in [zin_afrit_hub_target.GetName]"
 zin_afrit.4.a:0 "Withdraw the pilgrims."
 zin_afrit.4.b:0 "Brazen it out."
 zin_afrit.4.c:0 "Pay for silence."
 zin_afrit.4.desc:0 "The court of [zin_afrit_hub_target.GetName] has asked what the pilgrims want, and has not liked the answers. A watcher stands at every door of the new house."
 zin_afrit.4.t:0 "Suspicion in [zin_afrit_hub_target.GetName]"
 zin_afrit.41.a:0 "Mend it, or hold your breath."
 zin_afrit.41.desc:0 "The Veil is thin. In the Light courts the priests of the Houses are watched, and the pilgrims have begun to be asked who sent them. Another unwise week and the name will be on every tongue."
 zin_afrit.41.t:0 "The Veil Thins"
 zin_afrit.42.a:0 "Then let it be known."
 zin_afrit.42.desc:0 "The name is spoken in the open: Afrit, in every hall that has ears. The Veil is gone. What was patient work is now a war for belief, and the Houses must choose whose servants they are."
 zin_afrit.42.t:0 "The Name Is Spoken"
 zin_afrit.44.a:0 "We begin again from the ruin."
 zin_afrit.44.desc:0 "The name came out before the crown was taken. The kingdom has seen the thing that the temples served, and the Houses are watched in every land. This is what the Council's work was meant to avoid."
 zin_afrit.44.t:0 "Unmasked Too Soon"
 zin_afrit.5.a:0 "It is written in the ledger."
 zin_afrit.5.desc:0 "The doors of the First Light are shut in [zin_afrit_hub_target.GetName]. The priests have gone, and the granary is locked. It will take a long time to open them again."
 zin_afrit.5.t:0 "The Houses Are Closed in [zin_afrit_hub_target.GetName]"
 zin_afrit.54.a:0 "Let the council sit."
 zin_afrit.54.desc:0 "The kings of the East sit in council at the Dawn, and the Deliverer takes the marshal's chair himself. The Necklace is on his breast. The kings do not look at it."
 zin_afrit.54.t:0 "The War Council of the East"
 zin_afrit.6.a:0 "Send them the equipment."
 zin_afrit.6.b:0 "Grant them passage."
 zin_afrit.6.c:0 "Refuse."
 zin_afrit.6.desc:0 "The hermitage reminds our court of its kindness. Its envoy asks, without raising his voice, for a small return: arms for the pilgrims' guard, or passage for their column."
 zin_afrit.6.t:0 "The Faithful Ask a Favour"
 zin_afrit.7.a:0 "The ledger is filled."
 zin_afrit.7.desc:0 "The confessors of [zin_afrit_confessed.GetName] have written to the hermitage. The court [zin_afrit_confessed.zin_afrit_confession_word]."
 zin_afrit.7.t:0 "What the Confessors Heard"
 zin_afrit.8.a:0 "The month turns."
 zin_afrit.9.a:0 "The month turns."
 zin_afrit.90.a:0 "Let the people believe what they will."
 zin_afrit.90.desc:0 "A woman who had been ill for a year rose from her bed in the house of the First Light and walked to the well. The neighbours say it was the god. The physicians say it was the broth."
 zin_afrit.90.t:0 "A Healing in [Root.GetName]"
 zin_afrit.91.a:0 "Keep it in the ledger."
 zin_afrit.91.desc:0 "A pilgrim returned from the far South tells the hermitage a story that is half a song. A city by a lake, a king who wears a veil, a river that runs the wrong way. The scribes write it down."
 zin_afrit.91.t:0 "The Pilgrims' Tale"
 zin_afrit.92.a:0 "Send him out."
 zin_afrit.92.b:0 "Keep him close."
 zin_afrit.92.desc:0 "Sevrin has not been out of the Reliquary in two years. He walks the vault at night and counts the shelves. He says he has been here long enough to know when a thing is hungry."
 zin_afrit.92.t:0 "The Thief Grows Restless"
