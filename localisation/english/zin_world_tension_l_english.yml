 zin_world_gd_turned:0 "The Age Has Turned"
 zin_world_lord_of_a_ruined_world:0 "Lord of a Ruined World"
 zin_world_lord_of_a_ruined_world_desc:0 "The grave hosts hold the plains, the client crowns kneel, and the world that remains is ruled by fear and by the dead who will not lie down."
 zin_world_no_crown_over_crowns:0 "No Crown over Crowns"
 zin_world_no_crown_over_crowns_desc:0 "The league that crowned this king did not fight for an empire, and the settlement it made binds the crown to that purpose: the realms that bled for Aenor kneel to no one in Parim."
 zin_world_outcome_eastern_king:0 "One King in the East"
 zin_world_outcome_eastern_king_desc:0 "In this telling of the age the caravan roads answer to one crown, and the courts of the East bow to a king of their own choosing."
 zin_world_outcome_golden_court:0 "The Golden Court Endures"
 zin_world_outcome_golden_court_desc:0 "In this telling of the age the Golden Court outlasted every storm, and Parim still feasts beneath its gilded roofs."
 zin_world_outcome_strait_master:0 "Master of the Strait"
 zin_world_outcome_strait_master_desc:0 "In this telling of the age no ship passes the Narrow Sea without leave, and the chain across the strait answers to one crown alone."
 zin_world_outcome_western_crown:0 "A Western Crown in Parim"
 zin_world_outcome_western_crown_desc:0 "In this telling of the age a crown of the West took the oldest city of men and held it, and the western banners still fly over Parim."
 zin_world_the_worshipped_king:0 "The Worshipped King"
 zin_world_the_worshipped_king_desc:0 "The temples are full and the council sits in every court. Here the king is not obeyed so much as adored, and those who doubt him keep their doubts to themselves."
 zin_world_threat_gathering_dark:0 "The Gathering Dark"
 zin_world.1.a:0 "The month turns."
 zin_world.10.a:0 "These are uneasy times."
 zin_world.10.desc:0 "In every court of Aoaz the talk has grown careful. Merchants price their cargoes against rumours from the south, envoys linger longer than their errands need, and old treaties are read again by lamplight, as though someone expected to need them."
 zin_world.10.t:0 "An Uneasy Season"
 zin_world.11.a:0 "Let the realms prepare."
 zin_world.11.desc:0 "No one in Aoaz still calls the peace a peace. Garrisons that slept for a generation are drilling again, the roads carry more soldiers than traders, and in the temples the priests pray for the old safety in words their grandfathers never needed."
 zin_world.11.t:0 "The Gathering Dark"
 zin_world.12.a:0 "So the age turns."
 zin_world.12.desc:0 "The age has come to its edge. Every crown that still stands is arming, and the chroniclers write as though they were recording the last days of an age rather than a season of trouble."
 zin_world.12.t:0 "The Last Crowns"
 zin_world.2.a:0 "The month turns."
 zin_world.20.a:0 "Let every crown look to its walls."
 zin_world.20.desc:0 "No single blow began it. One war has followed another across Aoaz until the chroniclers could no longer tell where each began, and now they call them all by one name: the War of the Last Crowns."
 zin_world.20.desc1:0 "Crowns are arming on every shore of Aoaz. Old grudges have become plans of war and old legends have become banners, and the chroniclers have begun to call the many wars of these years by one name: the War of the Last Crowns."
 zin_world.20.t:0 "The War of the Last Crowns"
