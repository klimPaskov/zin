l_english:
 zin_regional_asgard_bar_the_harbours:0 "Bar the Harbours"
 zin_regional_asgard_bar_the_harbours_desc:0 "The harbours are shut with chains and ships. If the fleet of the West is to land, it will have to land somewhere else, and the Queen has made it clear where she would prefer."
 zin_regional_asgard_chapels_by_the_harbour:0 "Chapels by the Harbour"
 zin_regional_asgard_chapels_by_the_harbour_desc:0 "Chapels have begun to appear by the harbour, small, white and open at all hours. The Houses of the First Light bless the departing ships, and the sailors do not object."
 zin_regional_asgard_charts_of_the_central_sea:0 "Charts of the Central Sea"
 zin_regional_asgard_charts_of_the_central_sea_desc:0 "The isle's steersmen draw charts of the central sea, with every current, shoal and wreck set down in a clear hand. Such charts are worth more than the ships that sail by them."
 zin_regional_asgard_crown_and_isle:0 "Crown and Isle"
 zin_regional_asgard_crown_and_isle_desc:0 "Asgard is the Concord's most loyal dominion, and its houses make a point of saying so at every gathering. The loyalty is genuine, and it is rewarded."
 zin_regional_asgard_divers_of_borrak:0 "Divers of Borrak"
 zin_regional_asgard_divers_of_borrak_desc:0 "The houses school divers on the long swims between the chamber mouths, where a breath held too long is the only mistake a diver makes once. The best of them can work a full minute on the bottom at slack water."
 zin_regional_asgard_harbour_chains:0 "Harbour Chains"
 zin_regional_asgard_harbour_chains_desc:0 "Great iron chains are laid across the harbour mouths, to be raised with a capstan when a strange sail is sighted. A fleet that wishes to land must first break them."
 zin_regional_asgard_harbour_chains_tip_1:0 "Chains across the harbour slow a landing."
 zin_regional_asgard_harbours_for_the_heir:0 "Harbours for the Heir"
 zin_regional_asgard_harbours_for_the_heir_desc:0 "The Heir has returned, and the isle's harbours are opened to him and his ships. The Queen gives him the best steersmen she has."
 zin_regional_asgard_harbours_of_the_isle:0 "Harbours of the Isle"
 zin_regional_asgard_harbours_of_the_isle_desc:0 "The isle's harbours are deepened and walled, and the old quays are rebuilt in stone. A hundred ships may lie here in any wind."
 zin_regional_asgard_house_ledgers:0 "The House Ledgers"
 zin_regional_asgard_house_ledgers_desc:0 "The houses audit one another each spring: tedious and extraordinarily effective."
 zin_regional_asgard_house_moot:0 "The House-Moot"
 zin_regional_asgard_house_moot_2:0 "The Queen's Peace"
 zin_regional_asgard_house_moot_2_desc:0 "No house seizes another's ship and no quarrel is carried onto the quays."
 zin_regional_asgard_house_moot_desc:0 "Four houses, one moot, and a queen chosen by consent."
 zin_regional_asgard_isle_fisheries:0 "The Fishing Fleets"
 zin_regional_asgard_isle_fisheries_desc:0 "Half the isle eats from the sea, and the other half sells to those who do."
 zin_regional_asgard_isle_fleet:0 "The Isle Fleet"
 zin_regional_asgard_isle_fleet_desc:0 "Galleys, warships and guide-boats under the Queen's own flag."
 zin_regional_asgard_isle_lords_at_parim:0 "Isle Lords at Parim"
 zin_regional_asgard_isle_lords_at_parim_desc:0 "The four lords of the isle travel to Parim for the Concord Council, in their best robes and their worst tempers. They return with promises and a new respect for distance."
 zin_regional_asgard_isle_shipwrights:0 "Isle Shipwrights"
 zin_regional_asgard_isle_shipwrights_desc:0 "The isle's shipwrights build the sturdiest hulls in the central sea, on slips of black oak that were old when the first Aenoran landed."
 zin_regional_asgard_isle_spared:0 "The Isle Spared"
 zin_regional_asgard_isle_spared_desc:0 "The harbours were opened to spare the towns, and the people are not sure whether to be proud."
 zin_regional_asgard_lighthouses:0 "Lighthouses"
 zin_regional_asgard_lighthouses_desc:0 "Tall stone lighthouses are raised on the western headlands, each with a fire-basket and a watch-room. They warn friends and mark the isle for strangers."
 zin_regional_asgard_loyal_isle:0 "The Loyal Isle"
 zin_regional_asgard_loyal_isle_desc:0 "The Concord Council has named Asgard the Loyal Isle."
 zin_regional_asgard_nets_of_field_stone_kept:0 "Nets of Field-Stone Kept"
 zin_regional_asgard_nets_of_field_stone_kept_desc:0 "The fishers of the western shore bring up quern-stones and the footings of field walls in their nets, and they have always thrown them back. The queen asks them to bring the stones ashore instead and give them to the old women of the houses."
 zin_regional_asgard_one_isle_one_queen:0 "One Isle, One Queen"
 zin_regional_asgard_one_isle_one_queen_desc:0 "The four houses declare that the isle has one queen and one law. The house-moot sits in the same hall, and its seats are a little closer together."
 zin_regional_asgard_sea_soldiers:0 "Sea Soldiers"
 zin_regional_asgard_sea_soldiers_desc:0 "The isle schools its own sea soldiers, men who fight from the deck and the quay with equal ease. They wear leather, carry short blades and do not fear the water."
 zin_regional_asgard_sea_watch:0 "The Sea Watch"
 zin_regional_asgard_sea_watch_2:0 "The Isle Stands"
 zin_regional_asgard_sea_watch_2_desc:0 "Beacon, wall and fleet joined into a single system."
 zin_regional_asgard_sea_watch_desc:0 "Watchers on the headlands scan the horizon day and night."
 zin_regional_asgard_ships_for_the_kings_fleet:0 "Ships for the King's Fleet"
 zin_regional_asgard_ships_for_the_kings_fleet_desc:0 "The isle's shipwrights build for the Golden King's fleet, and the isle's steersmen lead it across the wide central sea. The Golden Court pays promptly, which is rare enough to be noted."
 zin_regional_asgard_spare_the_isle:0 "Spare the Isle"
 zin_regional_asgard_spare_the_isle_desc:0 "The Queen opens the harbours to spare her towns the fire. Her sailors are ashamed and her merchants are relieved, and the history of the isle is rewritten in a single afternoon."
 zin_regional_asgard_the_first_port:0 "The First Port"
 zin_regional_asgard_the_first_port_desc:0 "Asgard was the first port Aenoran ships reached, and its houses have never let anyone forget it. The crown thanks them for it, in its fashion."
 zin_regional_asgard_the_fishing_fleets:0 "The Fishing Fleets"
 zin_regional_asgard_the_fishing_fleets_desc:0 "The isle's fleets put out at dawn and return at dusk, their holds full of silver fish. Half the isle eats from the sea, and the other half sells to those who do."
 zin_regional_asgard_the_four_houses:0 "The Four Houses"
 zin_regional_asgard_the_four_houses_desc:0 "Each of the four houses keeps a seat in the moot, a ship in the harbour and a long memory of the others' errors. The Queen is chosen from among them and rules by consent."
 zin_regional_asgard_the_house_ledgers:0 "The House Ledgers"
 zin_regional_asgard_the_house_ledgers_desc:0 "The four houses agree to keep their books in the same hand, and to audit one another each spring. It is expensive, tedious and extraordinarily effective."
 zin_regional_asgard_the_isle_charter_confirmed:0 "The Isle Charter Confirmed"
 zin_regional_asgard_the_isle_charter_confirmed_desc:0 "The Old Charter of the isle is read aloud in the moot and confirmed by all four houses. The Queen signs, the lords seal, and the crown is informed."
 zin_regional_asgard_the_isle_fleet:0 "The Isle Fleet"
 zin_regional_asgard_the_isle_fleet_desc:0 "The isle's galleys, warships and guide-boats are joined into a single fleet under the Queen's own flag. It is not a large navy, but it is very well informed."
 zin_regional_asgard_the_isle_galleys:0 "The Isle Galleys"
 zin_regional_asgard_the_isle_galleys_desc:0 "Long oared galleys are built on the isle's slips, fast and shallow, for the patrol of the coast and the escort of merchant fleets."
 zin_regional_asgard_the_isle_garrison:0 "The Isle Garrison"
 zin_regional_asgard_the_isle_garrison_desc:0 "A permanent garrison is raised for the isle, drawn from the four houses in equal numbers. It is the only army on Aenor Isle, and it is not small."
 zin_regional_asgard_the_isle_houses:0 "The Isle Houses"
 zin_regional_asgard_the_isle_houses_desc:0 "Queen Faberra sits in the house-moot with the lords of four old houses: Rish, Tinta, Holod and Faber. They have ruled Aenor Isle together since the first Aenoran ships dropped anchor."
 zin_regional_asgard_the_isle_rebuilt:0 "The Isle Rebuilt"
 zin_regional_asgard_the_isle_rebuilt_desc:0 "The sails are gone and the isle begins to mend. The harbours are cleared, the quays rebuilt and the first fishing-boat puts out at dawn, as if nothing had happened."
 zin_regional_asgard_the_isle_rises:0 "The Isle Rises"
 zin_regional_asgard_the_isle_rises_desc:0 "Every fisherman and every dockhand takes up a spear. The isle has not been invaded in living memory, and its people have no intention of losing the habit."
 zin_regional_asgard_the_isle_stands:0 "The Isle Stands"
 zin_regional_asgard_the_isle_stands_desc:0 "The isle's defences are joined into a single system of beacon, wall and fleet. If the central sea should ever bring a host to these shores, the isle will stand."
 zin_regional_asgard_the_loyal_isle:0 "The Loyal Isle"
 zin_regional_asgard_the_loyal_isle_desc:0 "The Concord Council names Asgard the Loyal Isle, and the title is carved over the harbour gate. The islanders pretend not to notice."
 zin_regional_asgard_the_mound_at_low_water:0 "The Mound at Low Water"
 zin_regional_asgard_the_mound_at_low_water_desc:0 "At the lowest spring tides a reef of cut stone breaks the water west of the isle, and the oldest women of the houses call it the Mothers' Mound. The queen means to send her own divers down to it under her own flag."
 zin_regional_asgard_the_queens_peace:0 "The Queen's Peace"
 zin_regional_asgard_the_queens_peace_desc:0 "Queen Faberra lays her peace on the isle: no house shall seize another's ship, and no quarrel shall be carried onto the quays."
 zin_regional_asgard_the_queens_rite:0 "The Queens' Rite"
 zin_regional_asgard_the_queens_rite_desc:0 "The rite of the tide-chamber belongs to the isle houses alone, and two claimants have come asking to share it: the crown at Parim and the Orran mothers of the downs. The queens will give it to one of them and never to both."
 zin_regional_asgard_the_sea_watch:0 "The Sea Watch"
 zin_regional_asgard_the_sea_watch_desc:0 "Watchers on the headlands scan the horizon day and night. Any sail, any smoke, any change in the colour of the water is reported to the Queen before noon."
 zin_regional_asgard_the_tide_chambers_opened:0 "The Tide-Chambers Opened"
 zin_regional_asgard_the_tide_chambers_opened_desc:0 "Under Borrak the old halls are cut into the last hill of rock, and the sea fills them at every high water. The queen orders them pumped and lit at low tide, and the isle houses store their grain where their great-grandmothers held their moots."
 zin_regional_asgard_the_western_beacons:0 "The Western Beacons"
 zin_regional_asgard_the_western_beacons_desc:0 "Beacons are raised along the western shore, each a bow-shot from the next. A flame at the isle's tip is seen on the mainland within the hour."
 zin_regional_asgard_the_western_lanes:0 "The Western Lanes"
 zin_regional_asgard_the_western_lanes_desc:0 "Asgard's steersmen know the sea-lanes to the West Lands, mile by mile, and sell the knowledge to anyone who can afford it. The western courts trade here, and resent Aenor's tariffs."
 zin_regional_asgard_the_western_sails:0 "The Western Sails"
 zin_regional_asgard_the_western_sails_desc:0 "Sails on the western horizon, hundreds of them, and not one of them flies a friend's colours. The beacons are lit and the chains are raised."
 zin_regional_asgard_warehouses_of_asgard:0 "Warehouses of Asgard"
 zin_regional_asgard_warehouses_of_asgard_desc:0 "Great warehouses line the harbour, stocked with the goods of two coasts. A merchant who wants anything in the central sea begins his search here."
 zin_regional_asgard_western_lanes:0 "The Western Lanes"
 zin_regional_asgard_western_lanes_desc:0 "Steersmen who know the sea-lanes to the West Lands mile by mile."
 zin_regional_asgard_western_sails:0 "The Western Sails"
 zin_regional_asgard_western_sails_desc:0 "Sails on the western horizon: the beacons are lit and the chains are raised."
 zin_regional_asgard.1.a:0 "House Holod speaks for the purse."
 zin_regional_asgard.1.b:0 "House Tinta speaks for trade."
 zin_regional_asgard.1.c:0 "House Rish speaks for the crown."
 zin_regional_asgard.1.d:0 "The four houses of Asgard have assembled in the moot-hall, and each has sent a speaker with a different concern. Queen Faberra must decide which of the three to hear first, and the other two will remember."
 zin_regional_asgard.1.t:0 "The House-Moot"
 zin_regional_asgard.2.a:0 "The sea keeps its own gods."
 zin_regional_asgard.2.b:0 "Bless the fleet in the Deliverer's name."
 zin_regional_asgard.2.d:0 "A chapel of the First Light has been raised beside the harbour, and the almoners ask the Queen to bless the fleet there in the Deliverer's name. The sailors do not mind, and the old fishermen do not entirely like it."
 zin_regional_asgard.2.t:0 "A Chapel by the Harbour"
