l_english:
 zin_regional_blackton_a_freehold_among_holds:0 "A Freehold Among the Holds"
 zin_regional_blackton_a_freehold_among_holds_desc:0 "The Moot proclaims that Blackton is a freehold of free towns, owing nothing to Cocanoor and begging nothing from Notbuton. The proclamation is read at every gate and pinned to every harbour post."
 zin_regional_blackton_ask_for_leren_ships:0 "Ask for Leren Ships"
 zin_regional_blackton_ask_for_leren_ships_desc:0 "The Moot sends a petition to the Warden-King of Lerendor, asking for hulls to guard the shore. It is carefully worded, so that Blackton can leave with honour if the answer is no."
 zin_regional_blackton_between_two_shores:0 "Between Two Shores"
 zin_regional_blackton_between_two_shores_desc:0 "To the south is Cocanoor and its tallymen; to the north-west, Notbuton and its Accord. The Moot meets in closed session to decide which shore Blackton will lean toward."
 zin_regional_blackton_between_two_shores_spirit:0 "Between Two Shores"
 zin_regional_blackton_between_two_shores_spirit_desc:0 "Blackton has settled its account with Cocanoor and with Notbuton, and owes neither a favour. The towns breathe easily for it."
 zin_regional_blackton_chains_for_envoys:0 "Chains for Our Envoys"
 zin_regional_blackton_charts_of_the_dark_sea:0 "Charts of the Dark Sea"
 zin_regional_blackton_charts_of_the_dark_sea_desc:0 "Tobin Greywater keeps the charts of the Dark Sea in a locked chest, copied from the notes of a hundred masters. His soundings are better than anyone's, and he sells them dear."
 zin_regional_blackton_coin_of_cocanoor:0 "The Coin of Cocanoor"
 zin_regional_blackton_coin_of_cocanoor_desc:0 "Cocanoor's tallymen are admitted to the quays and Cocanoor's coin to the strongrooms. In return, the corsairs leave Blackton's hulls alone."
 zin_regional_blackton_crossbows_on_the_walls:0 "Crossbows on the Walls"
 zin_regional_blackton_crossbows_on_the_walls_desc:0 "Crossbowmen are posted on every tower and gatehouse, with a stock of bolts and a spanner. A wall defended by crossbows will not be climbed easily."
 zin_regional_blackton_dead_on_our_shore:0 "Dead on Our Shore"
 zin_regional_blackton_dead_on_our_shore_desc:0 "The dead have landed on the Blackton shore, and the harbour is full of pale lights. The watch rings the bells, and the guilds send every man they can arm."
 zin_regional_blackton_five_towns_militia:0 "Militia of the Five Towns"
 zin_regional_blackton_five_towns_militia_desc:0 "Each town keeps a company of townsmen at the ready, armed from its own armouries and drilled at its own expense. Together they make a host of surprising size."
 zin_regional_blackton_five_towns_stand:0 "The Five Towns Stand"
 zin_regional_blackton_five_towns_stand_desc:0 "The gates are barred, the walls are manned, and the harbour-chains are up. Every guild has pledged its stores to the defence."
 zin_regional_blackton_free_harbour:0 "The Free Harbour"
 zin_regional_blackton_free_harbour_desc:0 "Any hull may moor in Blackton and any cargo may be sold, as long as the fee is paid and no questions are asked. The towns grow rich on being asked nothing."
 zin_regional_blackton_free_towns_charter:0 "The Free Towns' Charter"
 zin_regional_blackton_free_towns_charter_desc:0 "Each town sends its own council to the Moot and counts its votes openly. No lord sits above them, and the harbour fees are the council's to set."
 zin_regional_blackton_freehold_among_holds:0 "A Freehold Among the Holds"
 zin_regional_blackton_freehold_among_holds_desc:0 "Blackton is not a hold of orcs and has no wish to be one. Its walls are high, its guilds are rich, and its neighbours know better than to press a towns-people who can hire an army."
 zin_regional_blackton_good_customers:0 "Good Customers"
 zin_regional_blackton_haclton_of_the_harbour:0 "Haclton of the Harbour"
 zin_regional_blackton_haclton_of_the_harbour_desc:0 "Haclton holds the keys to the harbour of the greatest town and has done so for thirty winters. His seal is on every bill of lading from the Sea of Darkness to the straits."
 zin_regional_blackton_hang_the_envoys:0 "Send Them Back in Chains"
 zin_regional_blackton_hang_the_envoys_desc:0 "The Moot has the strangers seized, shackled and put on a hull bound for the south. A note is pinned to the first of them: Blackton does not sell its harbour."
 zin_regional_blackton_harbour_of_the_five_towns:0 "Harbour of the Five Towns"
 zin_regional_blackton_harbour_of_the_five_towns_desc:0 "A shared deep-water harbour is dredged between the towns, with quays long enough for the biggest hulls. Dockyards rise along its edges."
 zin_regional_blackton_iron_market:0 "The Iron Market"
 zin_regional_blackton_iron_market_desc:0 "Orc iron comes down the Black Road to the market of Blackton and leaves again in Leren ships. Every bar is weighed twice and sold three times."
 zin_regional_blackton_iron_trade:0 "Iron Bought Fairly"
 zin_regional_blackton_leren_quarter:0 "The Leren Quarter"
 zin_regional_blackton_leren_quarter_desc:0 "A quarter of the harbour town is set aside for Leren factors, with its own warehouse, chapel and tavern. The streets there smell of tar and cedar."
 zin_regional_blackton_lords_charter:0 "The Lord's Charter"
 zin_regional_blackton_lords_charter_desc:0 "Lord Haclton's charter gives the harbour-lord the last word and the guilds the first. It saves time at the Moot and costs the guilds a little pride."
 zin_regional_blackton_merchant_houses:0 "The Merchant Houses"
 zin_regional_blackton_merchant_houses_desc:0 "The great houses form a guild of their own, with a common strongroom and a common seal. A bill drawn on Blackton is honoured in every harbour of the north."
 zin_regional_blackton_merchant_houses_spirit:0 "The Merchant Houses"
 zin_regional_blackton_merchant_houses_spirit_desc:0 "The great houses of Blackton hold warehouses on every quay and credit in every harbour. They lend to anyone, as long as the loan is secured."
 zin_regional_blackton_militia_of_the_five_towns:0 "Militia of the Five Towns"
 zin_regional_blackton_militia_of_the_five_towns_desc:0 "The five town militias are placed under a single captain, who is chosen by lot. The result is not as chaotic as the guilds feared."
 zin_regional_blackton_neither_master_nor_tribute:0 "Neither Master nor Tribute"
 zin_regional_blackton_neither_master_nor_tribute_desc:0 "Whichever path the Moot chose, the towns state it plainly: Blackton serves no master and pays no tribute. The words are carved over the harbour gate."
 zin_regional_blackton_our_walls_our_own:0 "Our Walls, Our Own"
 zin_regional_blackton_our_walls_our_own_desc:0 "The Moot rejects Cocanoor's gifts of black iron and builds its own walls instead, paid for by the guilds. A town that owns its walls owes no one thanks for them."
 zin_regional_blackton_privateers:0 "Privateers of Blackton"
 zin_regional_blackton_privateers_desc:0 "Letters of marque go out to every merchant captain with a swift hull. They hunt the war-hulls of the enemy and come home with prizes."
 zin_regional_blackton_privateers_of_blackton:0 "Privateers of Blackton"
 zin_regional_blackton_privateers_of_blackton_desc:0 "Letters of marque go out to every swift merchantman. Blackton hulls prey on the enemy's trade and bring their prizes home."
 zin_regional_blackton_quay_watch:0 "Watchers on the Quay"
 zin_regional_blackton_quay_watch_desc:0 "Harbour-watchers record every stranger who steps ashore and every cargo he carries. A spy who lands at Blackton is known by supper."
 zin_regional_blackton_sails_to_sonargur:0 "Sails to Sonargur"
 zin_regional_blackton_sails_to_sonargur_desc:0 "Blackton hulls make the crossing to Sonargur each spring, laden with salt and iron, and return with timber and cedar. The captains are received in the Warden's own hall."
 zin_regional_blackton_salt_iron_and_sails:0 "Salt, Iron and Sails"
 zin_regional_blackton_salt_iron_and_sails_desc:0 "The trade of Blackton runs on three things: salt from the pans, iron from the holds and sails from the Leren yards. The Moot sends a clerk to each quay to keep a tally of them."
 zin_regional_blackton_sea_companies:0 "Sea Companies"
 zin_regional_blackton_sea_companies_desc:0 "Boarders of the Moot's own, picked from the harbour wards, drill on the decks of armed merchantmen. They enjoy the work more than they should."
 zin_regional_blackton_shore_lanterns:0 "Shore Lanterns"
 zin_regional_blackton_shore_lanterns_desc:0 "Lanterns are hung along the whole shore, a hundred paces apart. They show where the dead come ashore. They do not stop them."
 zin_regional_blackton_shore_lanterns_spirit:0 "Shore Lanterns"
 zin_regional_blackton_shore_lanterns_spirit_desc:0 "Lanterns hang along the whole shore, and watchmen sit beside each. They show where the dead come ashore. They do not stop them."
 zin_regional_blackton_southern_silver:0 "Southern Silver"
 zin_regional_blackton_southern_silver_desc:0 "The strangers pay well, in a coin nobody on the quay has seen before. Haclton takes it, weighs it twice, and asks no questions."
 zin_regional_blackton_strait_pilots:0 "Strait Guides"
 zin_regional_blackton_strait_pilots_desc:0 "Blackton keeps guides who know the narrow waters between the Dark Lands and the North better than the Lerens themselves. Their service is bought by the hull, and worth it."
 zin_regional_blackton_strangers_in_the_harbour:0 "Strangers in the Harbour"
 zin_regional_blackton_strangers_in_the_harbour_desc:0 "Men from Nafeher have begun to appear on the quays, asking after ships, iron and the price of a berth. The harbour-reeve reports it to the Moot, and the Moot considers."
 zin_regional_blackton_the_corsair_question:0 "The Corsair Question"
 zin_regional_blackton_the_corsair_question_desc:0 "The black sails of Cocanoor's corsairs have been seen off the headlands, and the shipping guilds demand an answer. Will the Moot pay the corsairs to pass, or arm its merchants to fight?"
 zin_regional_blackton_the_five_towns:0 "The Five Towns"
 zin_regional_blackton_the_five_towns_desc:0 "Five walled towns share a coast, a language and a long argument. Lord Haclton calls the Town Moot to the great hall of the largest, and the guilds arrive with their ledgers under their arms."
 zin_regional_blackton_the_five_towns_stand:0 "The Five Towns Stand"
 zin_regional_blackton_the_five_towns_stand_desc:0 "The gates hold, the walls stand and the guilds keep their stores open to the garrison. Whatever the world does, Blackton does not move."
 zin_regional_blackton_the_free_harbour:0 "The Free Harbour"
 zin_regional_blackton_the_free_harbour_desc:0 "The Moot declares that the harbour is free and will remain so: no banner above its gates, no tribute from its quays. A free harbour is rich, if it can keep its friends close and its enemies busy."
 zin_regional_blackton_the_free_towns_charter:0 "The Free Towns' Charter"
 zin_regional_blackton_the_free_towns_charter_desc:0 "The guilds draw up a different charter, in which the lord is a servant of the Moot and every town votes its own mind. Haclton reads it in silence and puts down his pen."
 zin_regional_blackton_the_harbour_chain:0 "The Harbour Chain"
 zin_regional_blackton_the_harbour_chain_desc:0 "A great iron chain is forged to bar the harbour mouth, and raised at need by a team of oxen. No hull passes it without the harbour-reeve's leave."
 zin_regional_blackton_the_iron_market:0 "The Iron Market"
 zin_regional_blackton_the_iron_market_desc:0 "A covered market of stone is built beside the great quay, where orc iron is weighed, graded and sold. Buyers from the Middle Lands and the North come every season."
 zin_regional_blackton_the_leren_quarter:0 "The Leren Quarter"
 zin_regional_blackton_the_leren_quarter_desc:0 "A quarter of the harbour town is given to the Leren factors, with its own warehouse and chapel. Where they go, goodwill follows."
 zin_regional_blackton_the_lords_charter:0 "The Lord's Charter"
 zin_regional_blackton_the_lords_charter_desc:0 "A charter is drawn up and signed by the five councils, giving the lord of the harbour the right to speak last. The guilds read it twice, and sign."
 zin_regional_blackton_the_salt_pans:0 "The Salt-Pans"
 zin_regional_blackton_the_salt_pans_desc:0 "Shallow pans are cut along the shore and flooded at the spring tides. The brine dries in the sun to white salt, which is sold in every market of the Sea of Darkness."
 zin_regional_blackton_the_town_moot_sits:0 "The Town Moot Sits"
 zin_regional_blackton_the_town_moot_sits_desc:0 "The five councils send their speakers to a single bench, and the bench becomes a court of its own. Whatever the Moot decides, the towns obey, or the towns leave."
 zin_regional_blackton_the_towns_close_their_gates:0 "The Towns Close Their Gates"
 zin_regional_blackton_the_towns_close_their_gates_desc:0 "Every gate is barred and every chain raised. The five towns pull in their ships and their strangers and prepare to wait out the storm."
 zin_regional_blackton_town_companies:0 "The Town Companies"
 zin_regional_blackton_town_companies_desc:0 "Each town raises a company from its householders, armed at its own cost and drilled on the common. They are no match for professional soldiers, but they have a very good reason to fight."
 zin_regional_blackton_town_moot:0 "The Town Moot"
 zin_regional_blackton_town_moot_desc:0 "Five towns, five guilds and a lord with a harbour: the Moot is where they argue about the price of salt and the width of the quays. It decides slowly and is very hard to overrule."
 zin_regional_blackton_under_the_leren_banner:0 "Under the Leren Banner"
 zin_regional_blackton_under_the_leren_banner_desc:0 "The Moot agrees to fly the Leren pennant beside its own, and to accept the Warden-King's protection in return. Haclton signs, and the Moot sighs."
 zin_regional_blackton_walls_of_the_five_towns:0 "Walls of the Five Towns"
 zin_regional_blackton_walls_of_the_five_towns_desc:0 "The walls of the five towns are lengthened and doubled, and the sea-gates are fitted with portcullises. A town may be besieged by land or by sea, and it will be ready."
 zin_regional_blackton_watchers_on_the_quay:0 "Watchers on the Quay"
 zin_regional_blackton_watchers_on_the_quay_desc:0 "Whatever the Moot decided, the quay now has watchers: sharp-eyed clerks who note every stranger's face and every unusual cargo. A town that knows who has landed knows who to fear."
 zin_regional_blackton_with_the_accord:0 "With the Accord"
 zin_regional_blackton_with_the_accord_desc:0 "The Moot agrees to sit in the Dark Sea Accord and defend the coast beside Dondor and Belonton. The vote is close, and the Accord is not told how close."
 zin_regional_blackton.1.a:0 "The lords speak first."
 zin_regional_blackton.1.b:0 "The guilds speak first."
 zin_regional_blackton.1.d:0 "The five councils meet in the great hall under the lord's banner. The lords wish to speak first, as they always have, and the guilds wish to speak first, as they always will."
 zin_regional_blackton.1.t:0 "The Town Moot"
 zin_regional_blackton.2.a:0 "Not now."
 zin_regional_blackton.2.b:0 "Ships for Blackton."
 zin_regional_blackton.2.c:0 "Under our banner."
 zin_regional_blackton.2.d:0 "An envoy of the five towns stands before the Warden-King of Lerendor with a petition and a purse. Blackton asks for hulls and a promise, and does not say what it will pay if the answer is no."
 zin_regional_blackton.2.t:0 "Blackton Asks for Ships"
 zin_regional_blackton.3.a:0 "Pay the Black-Sails."
 zin_regional_blackton.3.b:0 "Arm the merchantmen."
 zin_regional_blackton.3.d:0 "Black sails stand off the headlands, and the shipping guilds are in uproar. A message comes under a white flag: for a fee, the corsairs will leave Blackton hulls alone."
 zin_regional_blackton.3.t:0 "Black Sails Off the Five Towns"
 zin_regional_blackton.4.a:0 "Notbuton keeps its own counsel."
 zin_regional_blackton.4.b:0 "Open the Accord to Blackton."
 zin_regional_blackton.4.d:0 "The envoys of the five towns arrive in Notbuton in their best furs, with a question the king has waited a long time to hear. Will the Accord take Blackton in?"
 zin_regional_blackton.4.t:0 "Blackton Seeks the Accord"
 zin_regional_blackton.5.a:0 "Watch them."
 zin_regional_blackton.5.d:0 "Men from the south have taken rooms above the harbour tavern. They ask about ships, iron and the price of a berth, and they say they come from Nafeher and say little else."
 zin_regional_blackton.5.t:0 "Strangers in the Harbour"
 zin_regional_blackton.6.a:0 "The harbour is safer."
 zin_regional_blackton.6.d:0 "A hull flying a friendly pennant comes in on the evening tide, with a letter for the harbour-reeve. The answer was yes, and the harbour-reeve reads it aloud on the quay."
 zin_regional_blackton.6.t:0 "An Answer by Sea"
