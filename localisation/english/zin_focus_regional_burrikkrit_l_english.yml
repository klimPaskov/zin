l_english:
 zin_regional_burrikkrit_a_secret_worth_keeping:0 "A Secret Worth Keeping"
 zin_regional_burrikkrit_a_secret_worth_keeping_desc:0 "No map of the under-roads exists outside Zigka's head, and the king means to keep it so. A secret that only the warrens hold is worth more to them than anything they could dig."
 zin_regional_burrikkrit_a_word_at_the_tower:0 "A Word at the Tower"
 zin_regional_burrikkrit_a_word_at_the_tower_desc:0 "The Klungori Guard keeps its tower on the South Pass to watch the warrens, and the warrens know it. The king would like the old boss's helmet back from the tower wall, and he is willing to ask nicely."
 zin_regional_burrikkrit_chalk_marks_in_the_dark:0 "Chalk Marks in the Dark"
 zin_regional_burrikkrit_chalk_marks_in_the_dark_desc:0 "The tunnel-sellers mark the turnings with chalk signs that only goblins can read and clear the falls of stone. A road nobody can find is only worth something if the seller can."
 zin_regional_burrikkrit_chosen_at_the_lamp:0 "Chosen at the Lamp"
 zin_regional_burrikkrit_chosen_at_the_lamp_desc:0 "Snikit proposes that the bosses raise their own lamps in the throne-cave and that the king be the hobgoblin with the most lamps held up for him. It is a strange new way, and nobody has to lose an ear over it."
 zin_regional_burrikkrit_deep_seams:0 "Deep Seams"
 zin_regional_burrikkrit_deep_seams_desc:0 "Under the Cursed Mountains there is gold, if a goblin digs deep enough and does not mind the air. The bosses send their warrens down with lamps and baskets."
 zin_regional_burrikkrit_dug_in_deep:0 "Dug In Deep"
 zin_regional_burrikkrit_dug_in_deep_desc:0 "The warrens have pulled in their lamps and sealed the outer tunnels, and any army that wants the throne-cave must dig for it. The Order could not dig the goblins out, and nobody since has done better."
 zin_regional_burrikkrit_dwarf_iron_in_goblin_hands:0 "Dwarf Iron in Goblin Hands"
 zin_regional_burrikkrit_dwarf_iron_in_goblin_hands_desc:0 "Iron comes through the Western Gate by the honest pound, and the warren smiths turn it into blades and lamp-hooks. The dwarves pretend not to know what the goblins make of it."
 zin_regional_burrikkrit_eyes_in_the_dark:0 "Eyes in the Dark"
 zin_regional_burrikkrit_eyes_in_the_dark_desc:0 "Goblin riders take their warren wurghs out on the southern roads after sunset, when the big folk are blind and the goblins are wide awake. They see the herds first and the patrols second."
 zin_regional_burrikkrit_feed_an_heir:0 "Feed an Heir"
 zin_regional_burrikkrit_feed_an_heir_desc:0 "Dwibrik means to choose his own successor and make sure of him by feeding him, and he has chosen Nubbix Shieldwall, the second-biggest hobgoblin in the warrens. Nubbix has always known better than to grow any bigger, and now the king insists on it."
 zin_regional_burrikkrit_fill_the_hoard:0 "Fill the Hoard"
 zin_regional_burrikkrit_fill_the_hoard_desc:0 "The king sits on the hoard of Glimzig in the evenings and counts, and he means to have more to count. Gold in the cellar buys friends when friends are needed."
 zin_regional_burrikkrit_fire_pots:0 "Fire-Pots"
 zin_regional_burrikkrit_fire_pots_desc:0 "Krittik Fire-Pot makes the crude powder that the goblins pack into clay pots and throw in the tunnels. He has lost fewer fingers at it than his predecessor, and he would like a proper workshop."
 zin_regional_burrikkrit_gold_enough_for_a_king:0 "Gold Enough for a King"
 zin_regional_burrikkrit_gold_enough_for_a_king_desc:0 "There is gold enough in Burrikkrit for the king and the bosses, or near enough that they have stopped stealing from each other. The warrens have never been so rich, and they are already planning how to be richer."
 zin_regional_burrikkrit_gold_hunger:0 "Gold-Hunger"
 zin_regional_burrikkrit_gold_hunger_desc:0 "Goblins love gold, rings and fine things more than food, and the warrens of Burrikkrit love them more than most. The king means to put the hunger to work before it turns the bosses on each other."
 zin_regional_burrikkrit_gold_hunger_spirit:0 "Gold-Hunger"
 zin_regional_burrikkrit_gold_hunger_spirit_desc:0 "Every goblin in the warrens wants gold, rings and fine things, and every goblin is quite sure his neighbour has more than his share. The bosses dig harder for it and steal from each other when the digging is slow."
 zin_regional_burrikkrit_hoard_of_glimzig:0 "The Hoard of Glimzig"
 zin_regional_burrikkrit_hoard_of_glimzig_desc:0 "The hoard under the throne-cave grows every season, and the king sits on it in the evenings, counting. A realm with that much gold in the cellar can buy what it needs when the time comes."
 zin_regional_burrikkrit_hobgoblins_carry_stone:0 "Hobgoblins Carry the Stone"
 zin_regional_burrikkrit_hobgoblins_carry_stone_desc:0 "The hobgoblins of the warrens carry the stone that small goblins cannot lift, and they carry it quickly, because the bosses pay them in meat. Walls and tunnel-mouths go up faster in Burrikkrit than anywhere in the range."
 zin_regional_burrikkrit_hobgoblins_carry_the_stone:0 "Hobgoblins Carry the Stone"
 zin_regional_burrikkrit_hobgoblins_carry_the_stone_desc:0 "The hobgoblins carry the stone that the small goblins cannot lift, and the bosses pay them in meat to carry it faster. Walls and tunnel-mouths go up quicker in Burrikkrit than anywhere in the range."
 zin_regional_burrikkrit_hosts_in_the_under_roads:0 "Hosts in the Under-Roads"
 zin_regional_burrikkrit_hosts_in_the_under_roads_desc:0 "The southern hosts come up through the warrens by night, with goblin guides at their head and the tunnel-sellers counting them. The warrens are paid by the company and ask no questions about the companies."
 zin_regional_burrikkrit_keep_the_road_dark:0 "Keep the Road Dark"
 zin_regional_burrikkrit_keep_the_road_dark_desc:0 "Every army in the world wants the under-roads now, and the king tells every one of them that the tunnels have fallen in. A road sold once is sold for ever, and the warrens would rather keep their dark."
 zin_regional_burrikkrit_king_dwibriks_court:0 "King Dwibrik's Court"
 zin_regional_burrikkrit_king_dwibriks_court_desc:0 "The king's court is a cave full of bosses, hangers-on and stolen banners, with Snikit the Lamp-Keeper shouting over all of them. A court that loud needs a keeper of the lamp who can be heard at the back."
 zin_regional_burrikkrit_lamp_council:0 "Lamps Held Up"
 zin_regional_burrikkrit_lamp_council_desc:0 "When the lamp passes, the warren-bosses hold up their own lamps in the throne-cave, and the king is the hobgoblin with the most lamps raised for him. It is slower than a fight and nobody's ears are bitten off."
 zin_regional_burrikkrit_lamp_guttering:0 "The Lamp Guttering"
 zin_regional_burrikkrit_lamp_guttering_desc:0 "Nobody in the warrens has trimmed the lamp of the truce this season, and the dwarves have noticed. The bosses sharpen their knives and talk about the galleries on the far side of the old seal."
 zin_regional_burrikkrit_lamp_truce:0 "The Lamp Truce"
 zin_regional_burrikkrit_lamps_in_the_war_years:0 "Lamps in the War-Years"
 zin_regional_burrikkrit_lamps_in_the_war_years_desc:0 "The big folk are at war across the whole of Aoaz, and the warrens pull in their lamps and count their riders. A goblin realm survives a war by choosing its side late and its tunnels early."
 zin_regional_burrikkrit_let_the_lamp_gutter:0 "Let the Lamp Gutter"
 zin_regional_burrikkrit_let_the_lamp_gutter_desc:0 "Nobody trims the lamp of the truce this season, and the bosses talk openly about the galleries on the far side of the seal. The dwarves have good iron and bad tempers, and the warrens want both tested."
 zin_regional_burrikkrit_nobody_digs_us_out:0 "Nobody Digs Us Out"
 zin_regional_burrikkrit_nobody_digs_us_out_desc:0 "The Order could not dig the goblins out of these caves, and neither could anyone who came after it. The warrens seal their outer tunnels and wait for the war to pass over them."
 zin_regional_burrikkrit_nobody_gets_through:0 "Nobody Gets Through"
 zin_regional_burrikkrit_nobody_gets_through_desc:0 "The tunnel-mouths are shut with fallen stone and fire-pot traps, and the hobgoblins stand behind them with their mallets. The warrens are poorer for it and safer than they have ever been."
 zin_regional_burrikkrit_open_purse:0 "The King's Open Purse"
 zin_regional_burrikkrit_open_purse_desc:0 "King Dwibrik has opened the hoard of Glimzig and paid it out for tools, timbers and smiths. The warrens grumble at the waste and work twice as hard to fill it again."
 zin_regional_burrikkrit_pass_friends:0 "Friends of the Pass"
 zin_regional_burrikkrit_raid_the_southern_roads:0 "Raid the Southern Roads"
 zin_regional_burrikkrit_raid_the_southern_roads_desc:0 "The southern roads are full of wagons, herds and nervous carters, and nobody is watching them at night. Blikkit takes every rider in the warrens out after dark."
 zin_regional_burrikkrit_relight_the_lamp:0 "Relight the Lamp"
 zin_regional_burrikkrit_relight_the_lamp_desc:0 "The king sends a new lamp to the Deep Hall and another to the Guard's tower, with the old words of the truce. A truce costs a lamp a year and a war costs a warren."
 zin_regional_burrikkrit_riders_by_night:0 "Riders by Night"
 zin_regional_burrikkrit_riders_by_night_desc:0 "The sun makes a goblin sleepy, so the riders go out after sunset, when the big folk are blind. Blikkit the Wurgh-Rider leads them on the southern roads and comes home with somebody's sheep."
 zin_regional_burrikkrit_road_bought:0 "A Road Bought"
 zin_regional_burrikkrit_road_tolls:0 "The Smugglers' Rate"
 zin_regional_burrikkrit_road_tolls_desc:0 "Whoever wants to cross under the range pays the warrens by the head, by the mule and by the bale, and pays again to forget the way. The tunnel-sellers keep the rates, and the king keeps the purse."
 zin_regional_burrikkrit_salvage_at_the_edges:0 "Salvage at the Edges"
 zin_regional_burrikkrit_salvage_at_the_edges_desc:0 "Goblin traders sell stolen and salvaged goods at the edges of the range, from a cart that is never in the same place twice. The herders of the southern roads buy back their own buckles and grumble about the price."
 zin_regional_burrikkrit_salvage_for_iron:0 "Salvage for Iron"
 zin_regional_burrikkrit_salvage_for_iron_desc:0 "The dwarves have iron and the goblins have salvage, and the two have traded at the Western Gate for longer than either will admit. The king sends a cart and a trader with a good scale."
 zin_regional_burrikkrit_sell_the_road_south:0 "Sell the Road to the South"
 zin_regional_burrikkrit_sell_the_road_south_desc:0 "The hosts of Nafeher would pay well for a way under the range that comes out where nobody keeps watch. Zigka will go south herself with the offer, if the king pays her passage."
 zin_regional_burrikkrit_sell_the_road_to_the_crown:0 "Sell the Road to the Crown"
 zin_regional_burrikkrit_sell_the_road_to_the_crown_desc:0 "The crown in Parim has never asked the goblins for anything, and it may be ready to start. Guides through the range are worth a great deal to a king with enemies on the far side of it."
 zin_regional_burrikkrit_sell_the_road_west:0 "Sell the Road to the West"
 zin_regional_burrikkrit_sell_the_road_west_desc:0 "The western hosts have crossed the sea for the crown of Aenor and want any road that brings them closer to it. They have gold, and they are a long way from home."
 zin_regional_burrikkrit_spend_the_hoard:0 "Spend the Hoard"
 zin_regional_burrikkrit_spend_the_hoard_desc:0 "The king opens the hoard of Glimzig and pays it out for tools, timbers and smiths. It hurts him to watch, and the warrens are better for it."
 zin_regional_burrikkrit_stand_with_the_pass_lord:0 "Stand with the Pass-Lord"
 zin_regional_burrikkrit_stand_with_the_pass_lord_desc:0 "Whoever holds Kingson holds the road through the range, and the warrens would rather be his friend than his problem. The king sends the Pass-Lord a lamp and an offer to leave his road alone."
 zin_regional_burrikkrit_the_biggest_rules:0 "The Biggest Rules"
 zin_regional_burrikkrit_the_biggest_rules_desc:0 "The warrens keep the oldest custom they have: the biggest hobgoblin holds the lamp until a bigger one takes it from him. Every boss is eating hard, and every warren is ready for a fight."
 zin_regional_burrikkrit_the_counting_cave:0 "The Counting-Cave"
 zin_regional_burrikkrit_the_counting_cave_desc:0 "The king opens a cave beside the throne-cave where the shares are weighed and written down by goblins who cannot keep any of it. The bosses hate it, and they cheat a good deal less."
 zin_regional_burrikkrit_the_fed_heir:0 "The Fed Heir"
 zin_regional_burrikkrit_the_fed_heir_desc:0 "King Dwibrik has chosen the hobgoblin who will follow him and is feeding him at the royal table, so that when the day comes nobody in the warrens will be bigger. The bosses think it unfair, and they are right."
 zin_regional_burrikkrit_the_galleries:0 "Goblins in the Galleries"
 zin_regional_burrikkrit_the_galleries_desc:0 "Goblins are digging in the dwarves' old galleries, carrying out ore by the basket and arguing about the best seams. The work is good and the tunnels are full of strangers who would like their mountain back."
 zin_regional_burrikkrit_the_galleries_taken:0 "The Galleries Taken"
 zin_regional_burrikkrit_the_galleries_taken_desc:0 "The warrens hold galleries that the dwarves cut, and the goblins dig in them by the basket. Holding them will take more fire-pots than taking them did."
 zin_regional_burrikkrit_the_heir_grows:0 "The Heir Grows"
 zin_regional_burrikkrit_the_heir_grows_desc:0 "Nubbix eats at the king's table every night, and he grows. The bosses watch him fill the doorway and decide, one by one, that they never wanted the lamp anyway."
 zin_regional_burrikkrit_the_hobgoblin_shield_wall:0 "The Hobgoblin Shield-Wall"
 zin_regional_burrikkrit_the_hobgoblin_shield_wall_desc:0 "Hobgoblins are a head taller than a tall man, and behind a shield the size of a door they hold a tunnel-mouth against anything. The warrens drill them in the long caves under Glimzig."
 zin_regional_burrikkrit_the_lamp_in_the_throne_cave:0 "The Lamp in the Throne-Cave"
 zin_regional_burrikkrit_the_lamp_in_the_throne_cave_desc:0 "Deep under the Cursed Mountains, in the throne-cave of Glimzig, King Dwibrik keeps the great lamp of the warrens burning. Burrikkrit is two caves' worth of goblins and hobgoblins inside a range the dwarves hold, and its king means to keep it that way."
 zin_regional_burrikkrit_the_lamp_passes:0 "The Lamp Passes"
 zin_regional_burrikkrit_the_lamp_passes_desc:0 "However it is done, the lamp of Glimzig passes to its next keeper without going out, and the warrens count it the best luck a realm can have. The bosses go home, the shares are paid, and nobody digs a new tunnel for a season."
 zin_regional_burrikkrit_the_lamp_truce:0 "The Lamp Truce"
 zin_regional_burrikkrit_the_lamp_truce_desc:0 "In 4A 96 the hobgoblin king swore the Lamp Truce over a lit lamp with the Lord of the Deep Hall and the Klungori Guard: the goblins keep the caves, the dwarves the galleries, and nobody crosses into the other's dark. The truce has held through one Tunnel Fight and a great many arguments."
 zin_regional_burrikkrit_the_lamp_truce_sworn_anew:0 "The Lamp Truce Sworn Anew"
 zin_regional_burrikkrit_the_lamp_truce_sworn_anew_desc:0 "The king, the Lord of the Deep Hall and the Captain of the Guard swear the truce again over a lit lamp, with three new clauses about salvage. The dwarves cut it in stone and the goblins keep the lamp."
 zin_regional_burrikkrit_the_lamps_raised:0 "The Lamps Raised"
 zin_regional_burrikkrit_the_lamps_raised_desc:0 "The bosses gather in the throne-cave with their lamps, and the king is counted by the light. The bosses who raised their lamps for the winner expect to be remembered for it."
 zin_regional_burrikkrit_the_old_custom:0 "The Old Custom"
 zin_regional_burrikkrit_the_old_custom_desc:0 "The biggest rules, and the throne-cave decides it with fists, as it always has. The custom makes for strong kings and short tempers, and the warrens like it very much."
 zin_regional_burrikkrit_the_road_dark:0 "Nobody Gets Through"
 zin_regional_burrikkrit_the_road_dark_desc:0 "The under-roads are shut with fallen stone and fire-pot traps, and the king has told every buyer that the tunnels have caved in. The warrens are poorer for it, and very hard to reach."
 zin_regional_burrikkrit_the_second_tunnel_fight:0 "The Second Tunnel Fight"
 zin_regional_burrikkrit_the_second_tunnel_fight_desc:0 "While the big folk are busy with their war, the warrens come up through the new gallery into the dwarves' mountain. The first Tunnel Fight lasted a winter, and the bosses swear this one will be shorter."
 zin_regional_burrikkrit_the_secret_roads:0 "A Secret Worth Keeping"
 zin_regional_burrikkrit_the_secret_roads_desc:0 "Only the goblins know every turning of the old tunnels under the Giant Mountains, and they mean to keep it that way. A warren that knows its own dark can move where nobody else can follow."
 zin_regional_burrikkrit_the_smugglers_rate:0 "The Smugglers' Rate"
 zin_regional_burrikkrit_the_smugglers_rate_desc:0 "Whoever crosses under the range pays the warrens by the head, by the mule and by the bale. The king keeps the rates low enough to bring them back and high enough to fill the purse."
 zin_regional_burrikkrit_the_throne_cave_fight:0 "A Fight in the Throne-Cave"
 zin_regional_burrikkrit_the_throne_cave_fight_desc:0 "Sooner or later a hungry hobgoblin walks into the throne-cave and puts his hand on the lamp. The king must throw him out or go himself, and the warrens will follow whoever is still standing."
 zin_regional_burrikkrit_the_truce_questioned:0 "The Truce Questioned"
 zin_regional_burrikkrit_the_truce_questioned_desc:0 "Goblins have been seen on the dwarves' side of the old seal, or so the Guard says, and a captain has come to the warrens for an answer. The king must decide whether the truce is worth an apology."
 zin_regional_burrikkrit_the_under_roads:0 "The Under-Roads"
 zin_regional_burrikkrit_the_under_roads_desc:0 "Under the Giant Mountains run tunnels older than the warrens, which the Order's garrisons used and only the goblins know in full. Zigka the Tunnel-Seller holds the keys, and she remembers what happened to the last guild that talked about them."
 zin_regional_burrikkrit_the_warren_bosses:0 "The Warren-Bosses"
 zin_regional_burrikkrit_the_warren_bosses_desc:0 "Under the king every warren has its boss, and every boss has a share of the salvage that he thinks too small. The king hears them out once a season, which is usually enough."
 zin_regional_burrikkrit_the_warren_host:0 "The Warren Host"
 zin_regional_burrikkrit_the_warren_host_desc:0 "Riders, fire-pot throwers and the shield-wall drill together until they can hold a cave or empty a road. A warren host is small, but it fights in its own dark."
 zin_regional_burrikkrit_truce_renewed:0 "The Lamp Relit"
 zin_regional_burrikkrit_truce_renewed_desc:0 "The lamp of the truce has been lit again between the warrens, the Deep Hall and the Klungori Guard. Each side keeps to its own dark, and the trading at the edges goes on without anyone losing a hand."
 zin_regional_burrikkrit_truce_strained:0 "The Lamp Guttering"
 zin_regional_burrikkrit_truce_sworn:0 "The Lamp Truce Sworn Anew"
 zin_regional_burrikkrit_truce_sworn_desc:0 "The truce of 4A 96 has been sworn again over a lit lamp, with the same words and three new clauses about salvage. The dwarves keep a copy cut in stone, and the goblins keep the lamp."
 zin_regional_burrikkrit_tunnels_under_the_deep_hall:0 "Tunnels under the Deep Hall"
 zin_regional_burrikkrit_tunnels_under_the_deep_hall_desc:0 "The tunnel-diggers start a new gallery under the old seal, very quietly and with the lamps hooded. If the truce ends, the warrens mean to come up inside the dwarves' mountain rather than knock at its gate."
 zin_regional_burrikkrit_warren_host:0 "The Warren Host"
 zin_regional_burrikkrit_warren_host_desc:0 "Riders, fire-pot throwers and the hobgoblin shield-wall drill together in the long caves under Glimzig. A warren host fights best in its own tunnels, and it has a great many tunnels."
 zin_regional_burrikkrit_warren_luck:0 "The Warren Luck"
 zin_regional_burrikkrit_warren_luck_2:0 "The Lamp Burns Bright"
 zin_regional_burrikkrit_warren_luck_2_desc:0 "The lamp of Glimzig has passed to a new keeper without going out, which every goblin in the warrens counts as the best luck a realm can have. The bosses grumble less and pay their shares more often."
 zin_regional_burrikkrit_warren_luck_desc:0 "A lamp burns in every warren of Burrikkrit, and the goblins say that a warren lives as long as its lamp does. King Dwibrik keeps the great lamp of Glimzig in his own throne-cave, where nobody can blow it out but him."
 zin_regional_burrikkrit_what_the_road_was_worth:0 "What the Road Was Worth"
 zin_regional_burrikkrit_what_the_road_was_worth_desc:0 "Sold or kept, the under-roads have made Burrikkrit something that the big folk must reckon with. The bosses argue about what the road was really worth, and the king lets them, because he knows."
 zin_regional_burrikkrit_who_is_biggest:0 "Who Is Biggest?"
 zin_regional_burrikkrit_who_is_biggest_desc:0 "The warrens have no heir and never have: a king rules until a bigger hobgoblin throws him out of the throne-cave. Dwibrik has ruled a very long time, and the question of who comes next will be answered whether he likes it or not."
 zin_regional_burrikkrit_wurgh_pens_of_darkhere:0 "Wurgh Pens in Darkhere"
 zin_regional_burrikkrit_wurgh_pens_of_darkhere_desc:0 "The warren wurghs of Burrikkrit are smaller than the Dark Lands kind and pale-eyed, bred to carry a rider in a tunnel as well as on a road. The pens in the Forests of Darkhere are full of pups that want breaking to the saddle."
 zin_regional_burrikkrit_wurgh_raids:0 "Wurgh Raids on the Southern Roads"
 zin_regional_burrikkrit_wurgh_raids_desc:0 "The riders are out every night, and the herders of the southern roads lose stock faster than they can count it. The raids feed the warrens and keep the enemy looking over his shoulder."
 zin_regional_burrikkrit.1.a:0 "Knock their heads together."
 zin_regional_burrikkrit.1.b:0 "Feed them until they stop talking."
 zin_regional_burrikkrit.1.d:0 "The warren-bosses have come to the throne-cave with a complaint, which is that the king's share of the salvage is too big and theirs too small. Each of them has brought his biggest hobgoblin, and each of them is pretending not to have noticed the others'."
 zin_regional_burrikkrit.1.t:0 "The Bosses Grumble"
 zin_regional_burrikkrit.2.a:0 "The king is still the biggest."
 zin_regional_burrikkrit.2.d:0 "King Dwibrik has held the lamp of Glimzig longer than any king the warrens can name, and the bosses have started measuring the doorways of the throne-cave when they think he is not looking. Nobody says the word succession out loud, but every goblin in the warrens is thinking it, and the biggest hobgoblins have taken to eating with the doors shut."
 zin_regional_burrikkrit.2.t:0 "The Question of Size"
 zin_regional_burrikkrit.3.a:0 "The old king holds the lamp."
 zin_regional_burrikkrit.3.b:0 "A bigger king takes it."
 zin_regional_burrikkrit.3.d:0 "A boss's hobgoblin, very large and newly fed, has walked into the throne-cave and put his hand on the lamp. The custom is plain: the king must throw him out or be thrown out himself, and the whole warren has crowded into the cave to watch which it will be."
 zin_regional_burrikkrit.3.t:0 "A Fight in the Throne-Cave"
 zin_regional_burrikkrit.4.a:0 "Let them come and look, if they dare."
 zin_regional_burrikkrit.4.b:0 "Send the captain a lamp and an apology."
 zin_regional_burrikkrit.4.d:0 "A captain of the Klungori Guard has ridden to the mouth of the warrens with a letter, which says that goblins have been seen in tunnels on the dwarves' side of the old seal and asks the king to explain. The bosses say the tunnels were empty and the goblins were somebody else's, and the captain is waiting outside for an answer he can carry home."
 zin_regional_burrikkrit.4.t:0 "The Lamp Truce Questioned"
 zin_regional_burrikkrit.5.a:0 "The clans buy nothing from thieves."
 zin_regional_burrikkrit.5.b:0 "Weigh it honestly and pay in iron."
 zin_regional_burrikkrit.5.d:0 "A goblin trader from Burrikkrit has come to the Western Gate of the Deep Hall with a cart of salvage: old buckles, broken blades, a lamp of good brass and a great deal of copper wire. He asks the clans for iron in exchange, at a weight he describes as fair and the clerks describe as optimistic."
 zin_regional_burrikkrit.5.t:0 "Salvage for Iron"
 zin_regional_burrikkrit.6.a:0 "The helmet stays on the wall."
 zin_regional_burrikkrit.6.b:0 "Give them their helmet and their lamp."
 zin_regional_burrikkrit.6.d:0 "Two goblins under a white rag have climbed to the Guard's tower on the South Pass with a request from their king. He would like back the helmet of the warren-boss that hangs on the tower wall, which the Guard took in the Tunnel Fight and has polished ever since, and he offers a fair price for it."
 zin_regional_burrikkrit.6.t:0 "Goblins at the Tower"
 zin_regional_burrikkrit.7.a:0 "We have roads of our own."
 zin_regional_burrikkrit.7.b:0 "Pay the goblins."
 zin_regional_burrikkrit.7.d:0 "A goblin with a ring of keys has come all the way to Nafeher with a proposal from the warren-king of Burrikkrit. For a fair weight of gold, his tunnel-sellers will lead any host that wishes it under the Giant Mountains and out on the far side of the range, where nobody keeps watch, and they will forget the way afterwards for a little more."
 zin_regional_burrikkrit.7.t:0 "A Road through the Range"
 zin_regional_burrikkrit.8.a:0 "The crown does not deal with goblins."
 zin_regional_burrikkrit.8.b:0 "Pay for the guides."
 zin_regional_burrikkrit.8.d:0 "A goblin with a ring of keys has asked for an audience at court and been received, to the horror of the chamberlains. The warren-king of Burrikkrit offers the crown guides for the old tunnels under the range, so that the crown's companies can move where the enemy does not look, and names a price that the treasurers call shameless."
 zin_regional_burrikkrit.8.t:0 "Goblin Guides for the Crown"
 zin_regional_burrikkrit.9.a:0 "We will take the roads we can see."
 zin_regional_burrikkrit.9.b:0 "Pay for the guides."
 zin_regional_burrikkrit.9.d:0 "A goblin with a ring of keys has found the western camp and asked, very politely, for the captain with the most gold. The warren-king of Burrikkrit will sell the western hosts a way under the Great Wall of Aenor, he says, and he will sell it to nobody else while the price is paid on time."
 zin_regional_burrikkrit.9.t:0 "Guides for the West"
