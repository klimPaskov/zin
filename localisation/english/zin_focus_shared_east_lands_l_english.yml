l_english:
 zin_shared_east_lands_a_crown_over_the_road_lords:0 "A Crown Over the Road Lords"
 zin_shared_east_lands_a_crown_over_the_road_lords_desc:0 "The road lords of [ROOT.GetName] have always been proud, quarrelsome and rich. The court proposes a crown to stand over them, with its own seat, its own guard and a name the lords must speak with respect."
 zin_shared_east_lands_answer_the_coalition:0 "Answer the Eastern Coalition"
 zin_shared_east_lands_answer_the_coalition_desc:0 "The eastern coalition has raised its banner, and [ROOT.GetName] sends its companies to the muster. Trade across the rift is forgotten, and every mind is on the road west."
 zin_shared_east_lands_ask_for_the_pact:0 "Ask for the Pact"
 zin_shared_east_lands_ask_for_the_pact_desc:0 "The court of [ROOT.GetName] asks Postondoroth for a place in the Stabilo Pact. The bankers' clerks draw up the draft and return it with a note: terms may change before the seal is pressed."
 zin_shared_east_lands_ask_for_the_treaty:0 "Ask for the Treaty"
 zin_shared_east_lands_ask_for_the_treaty_desc:0 "The court of [ROOT.GetName] writes to Furvior asking for a place in the Noris Treaty, and sends a petition with a hundred seals. The reply may take months, and the answer may not be a yes."
 zin_shared_east_lands_bows_of_the_east:0 "Bows of the East"
 zin_shared_east_lands_bows_of_the_east_desc:0 "Curved bows of horn and sinew, short enough to shoot from the saddle, are issued to the court's archers. Their range is long, their draw is smooth and the arrows are tipped in iron."
 zin_shared_east_lands_bring_the_companies_home:0 "Bring the Companies Home"
 zin_shared_east_lands_bring_the_companies_home_desc:0 "The war has become a ruin, and the court of [ROOT.GetName] wants its men back. Messengers carry white banners to the front, and a few companies are seen on the road east."
 zin_shared_east_lands_bring_the_companies_home_tip_1:0 "Some companies will not come home."
 zin_shared_east_lands_captains_of_the_court:0 "Captains of the Court"
 zin_shared_east_lands_captains_of_the_court_desc:0 "The court's best officers are called to the audience hall to study maps, argue over routes and drink the king's wine. By the end of the season they have a plan for every road in the land."
 zin_shared_east_lands_caravanserai_trade:0 "Caravanserais"
 zin_shared_east_lands_caravanserai_trade_desc:0 "Walled yards a day's march apart feed, water and shelter every traveller."
 zin_shared_east_lands_caravanserais:0 "Caravanserais of [ROOT.GetName]"
 zin_shared_east_lands_caravanserais_desc:0 "Walled yards with wells, stables and sleeping-galleries are raised a day's march apart along the road. Travellers pay for fodder and a roof, and the court of [ROOT.GetName] grows rich on both."
 zin_shared_east_lands_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_shared_east_lands_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_shared_east_lands_close_the_houses:0 "Close the Houses"
 zin_shared_east_lands_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_shared_east_lands_council_of_the_towns:0 "Council of the Towns"
 zin_shared_east_lands_council_of_the_towns_desc:0 "Each town sends a speaker to the council hall, and the speakers meet in a long room with a long table. They disagree, argue and settle matters faster than any lord could."
 zin_shared_east_lands_count_the_temple_gold:0 "Count the Temple Gold"
 zin_shared_east_lands_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_shared_east_lands_courts_of_the_east:0 "The Court of [ROOT.GetName]"
 zin_shared_east_lands_courts_of_the_east_desc:0 "Banners hang in the audience hall, camels are tethered in the yard, and petitioners from three roads wait in the shade. The court of [ROOT.GetName] is small, but it sits where caravans must pass, and it knows the price of everything that does."
 zin_shared_east_lands_credit_from_postondoroth:0 "Credit From Postondoroth"
 zin_shared_east_lands_credit_from_postondoroth_desc:0 "The bankers of Postondoroth open a line of credit for [ROOT.GetName], at rates so low that the treasurer checks the figures twice. The loan is a gift now, and a chain later."
 zin_shared_east_lands_diggers_of_wells:0 "Diggers of Wells"
 zin_shared_east_lands_diggers_of_wells_desc:0 "Teams of well-diggers travel the dry roads with ropes, buckets and divining rods. A well takes a season to sink and saves a hundred lives in the next drought."
 zin_shared_east_lands_drill_the_levies:0 "Drill the Levies"
 zin_shared_east_lands_drill_the_levies_desc:0 "Village headmen send their able men to the muster-yard twice a year, where court drill-masters teach them to hold a line. A levy that has drilled once is worth three that have not."
 zin_shared_east_lands_drilled_levies:0 "Drilled Levies"
 zin_shared_east_lands_drilled_levies_desc:0 "A levy that has drilled once is worth three that have not."
 zin_shared_east_lands_dune_riders:0 "Riders of the Dunes"
 zin_shared_east_lands_dune_riders_desc:0 "Camel and horse riders cross a day's sand in a night."
 zin_shared_east_lands_eastern_oath:0 "Oath to the King in the East"
 zin_shared_east_lands_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_shared_east_lands_envoys_from_both_roads:0 "Envoys From Both Roads"
 zin_shared_east_lands_envoys_from_both_roads_desc:0 "Riders from Furvior and bankers from Postondoroth arrive in the same week, both with gifts and both with smiles. The court of [ROOT.GetName] seats them at the same table and watches what each of them does not say."
 zin_shared_east_lands_envoys_from_both_roads_tip_1:0 "Riders from Furvior and bankers from Postondoroth both bring gifts."
 zin_shared_east_lands_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_shared_east_lands_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_shared_east_lands_fishers_of_the_north_sea:0 "Fishers of the Northern Sea"
 zin_shared_east_lands_fishers_of_the_north_sea_desc:0 "The northern shore of [ROOT.GetName] is rocky, grey and cold, and its fishers are hard, quiet men. They sail out before dawn and return after dark with catches that feed half the coast."
 zin_shared_east_lands_forts_on_the_marches:0 "Forts on the Marches"
 zin_shared_east_lands_forts_on_the_marches_desc:0 "Mud-brick forts are raised on the hills along the borders, each with a well, a granary and a signal-tower. They are not grand, but a column that must pass them knows it has been seen."
 zin_shared_east_lands_free_crown_court:0 "A Free Crown"
 zin_shared_east_lands_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_shared_east_lands_free_lords:0 "The Free Lords"
 zin_shared_east_lands_free_lords_desc:0 "The lords of the road meet once a year to settle their quarrels, and rule as they please between."
 zin_shared_east_lands_generous_friends:0 "The Generous Friends"
 zin_shared_east_lands_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_shared_east_lands_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_shared_east_lands_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_shared_east_lands_guard_the_rift_shore:0 "Guard the Rift Shore"
 zin_shared_east_lands_guard_the_rift_shore_desc:0 "Forts and sea-walls go up along the rift shore, with ballistae on their roofs. A court that trades with the far bank must also be ready to defend itself against it."
 zin_shared_east_lands_guild_of_factors:0 "The Factors' Guild"
 zin_shared_east_lands_guild_of_factors_desc:0 "The factors who buy, sell and lend in the markets of [ROOT.GetName] organise themselves into a guild with a hall, a seal and a table of rates. Their ledgers are the best record of what the east is worth."
 zin_shared_east_lands_healing_houses:0 "Houses of Healing"
 zin_shared_east_lands_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_shared_east_lands_horse_and_camel:0 "Horse and Camel"
 zin_shared_east_lands_horse_and_camel_desc:0 "Camel riders for the dry roads and horsemen for the grassland: [ROOT.GetName] learns to use each where it serves best. Their mounts are bred from the finest stock the court can buy."
 zin_shared_east_lands_houses_of_healing:0 "Houses of Healing"
 zin_shared_east_lands_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_shared_east_lands_into_the_deep_sand:0 "Into the Deep Sand"
 zin_shared_east_lands_into_the_deep_sand_desc:0 "Beyond the farthest well the dunes run on, and no caravan has come back from their end. A scouting party of [ROOT.GetName] loads its camels and goes to see how far the desert goes."
 zin_shared_east_lands_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_shared_east_lands_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_shared_east_lands_kings_law:0 "The King's Law"
 zin_shared_east_lands_kings_law_desc:0 "A written code, with a penalty against every offence, is carried to every town."
 zin_shared_east_lands_lean_to_furvior:0 "The Riders' Friendship"
 zin_shared_east_lands_lean_to_furvior_desc:0 "The court of [ROOT.GetName] has decided that the riders of Furvior are the surer friends. Their horses are in the yard, their captains drink at the board, and their banners are raised beside the court's own."
 zin_shared_east_lands_lean_to_postondoroth:0 "The Bankers' Friendship"
 zin_shared_east_lands_lean_to_postondoroth_desc:0 "Gold from Postondoroth opens doors that swords cannot, and the court of [ROOT.GetName] has found the loans easy and the terms fair. The bankers' clerks begin to appear at the treasury, and nobody is quite sure when they started."
 zin_shared_east_lands_levies_for_the_host:0 "Levies for the Host"
 zin_shared_east_lands_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_shared_east_lands_lords_of_the_road:0 "Lords of the Road"
 zin_shared_east_lands_lords_of_the_road_desc:0 "Whoever holds the wells and the passes holds the road, and the road holds the wealth of [ROOT.GetName]. The court names wardens for its stretch of the caravan way and sends gifts to their captains."
 zin_shared_east_lands_loyal_vassal:0 "A Loyal House"
 zin_shared_east_lands_loyal_vassal_desc:0 "The court of [ROOT.GetName] makes itself useful to its protector, in tribute, in troops and in good counsel. The protector is pleased, and a pleased master loosens the leash."
 zin_shared_east_lands_market_of_the_court:0 "Markets of the [ROOT.GetAdjective] Towns"
 zin_shared_east_lands_market_of_the_court_desc:0 "Stalls of dried fruit, spices, copper pans and woven rugs crowd the squares of [ROOT.GetName]. The court appoints market-wardens, fixes the weights and takes a modest tithe of every sale."
 zin_shared_east_lands_north_sea_watch:0 "The Northern Sea Watch"
 zin_shared_east_lands_north_sea_watch_desc:0 "Galleys and beacon-towers watch the northern shore for black hulls."
 zin_shared_east_lands_oasis_gardens:0 "Oasis Gardens"
 zin_shared_east_lands_oasis_gardens_desc:0 "Date palms, pomegranates and small plots of barley ring the old springs of [ROOT.GetName]. In the middle of a hundred miles of dust, the smell of green is the court's greatest luxury."
 zin_shared_east_lands_oasis_gardens_spirit:0 "Oasis Gardens"
 zin_shared_east_lands_oasis_gardens_spirit_desc:0 "Date palms and barley ring the old springs, and green is the greatest luxury."
 zin_shared_east_lands_oath_to_the_protector:0 "The Oath to the Protector"
 zin_shared_east_lands_oath_to_the_protector_desc:0 "The king of [ROOT.GetName] kneels in the audience hall of a greater power and swears to keep the protector's peace. The oath is given aloud and remembered in silence."
 zin_shared_east_lands_open_road:0 "The Open Road"
 zin_shared_east_lands_open_road_desc:0 "The road is open to all who pay the toll and leave the peace unbroken."
 zin_shared_east_lands_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_shared_east_lands_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_shared_east_lands_own_counsel:0 "Our Own Counsel"
 zin_shared_east_lands_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_shared_east_lands_protectors_favour:0 "The Protector's Favour"
 zin_shared_east_lands_protectors_favour_desc:0 "The protector is pleased with its loyal house, and a pleased master loosens the leash."
 zin_shared_east_lands_question_of_the_east:0 "The Question of the East"
 zin_shared_east_lands_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_shared_east_lands_richest_road_in_the_east:0 "The Richest Road in the East"
 zin_shared_east_lands_richest_road_in_the_east_desc:0 "Merchants speak of the road through [ROOT.GetName] as the safest, the best-watered and the best-fed in the east. Their word travels faster than their camels, and more caravans arrive every season."
 zin_shared_east_lands_riders_of_the_dunes:0 "Riders of the Dunes"
 zin_shared_east_lands_riders_of_the_dunes_desc:0 "Camel and horse riders of the desert know the dunes the way sailors know the sea. They cross a day's sand in a night and appear at a well before the enemy has found the road."
 zin_shared_east_lands_riders_of_the_treaty:0 "Riders of the Treaty"
 zin_shared_east_lands_riders_of_the_treaty_desc:0 "A company of Furvior's riders is quartered in [ROOT.GetName] under the Treaty, and its captains teach the court's young horsemen their ways. By the end of the season, the horsemen ride like the riders."
 zin_shared_east_lands_rift_harbours:0 "Harbours on the Rift"
 zin_shared_east_lands_rift_harbours_desc:0 "The rift sea lies in front of [ROOT.GetName] like a long green road, and the court builds harbours to use it. Quays, chandlers' yards and warehouses rise on the shore."
 zin_shared_east_lands_rift_trade:0 "Trade Across the Rift"
 zin_shared_east_lands_rift_trade_desc:0 "Ships carry salt and copper west and return with glass and silk."
 zin_shared_east_lands_seek_more_freedom:0 "Our Own Laws"
 zin_shared_east_lands_seek_more_freedom_desc:0 "The court of [ROOT.GetName] reminds its protector that the oath was to keep the peace, not to make the laws. A small embassy is sent, with a long list of customs the protector has agreed not to change."
 zin_shared_east_lands_servant_of_no_road:0 "Servant of No Road"
 zin_shared_east_lands_servant_of_no_road_desc:0 "The court chooses neither the riders nor the bankers, and says so politely. Neither is pleased, but both leave a gift at the gate, for a court that will not be bought is worth keeping on good terms."
 zin_shared_east_lands_serve_the_strangers_coalition:0 "Serve Another Banner"
 zin_shared_east_lands_serve_the_strangers_coalition_desc:0 "Cut off from home, the companies of [ROOT.GetName] take their pay and their orders from another banner, raised against the dead. They fight well for it, because they have nothing else to fight for."
 zin_shared_east_lands_serve_the_strangers_coalition_tip_1:0 "Our cut-off companies will fight on under those who stand against the dead."
 zin_shared_east_lands_ships_against_the_dead:0 "Ships Against the Dead"
 zin_shared_east_lands_ships_against_the_dead_desc:0 "The dead have come out of the north on black hulls, and the shipwrights of [ROOT.GetName] lay down galleys to meet them. The oarsmen sing as they row, because silence is what the dead like best."
 zin_shared_east_lands_spoils_across_the_rift:0 "Spoils Across the Rift"
 zin_shared_east_lands_spoils_across_the_rift_desc:0 "Across the rift, the elven shore lies open to the coalition's boats. The captains of [ROOT.GetName] sail with maps, empty holds and an eye for what they can take."
 zin_shared_east_lands_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_shared_east_lands_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_shared_east_lands_tales_of_black_ships:0 "Tales of Black Ships"
 zin_shared_east_lands_tales_of_black_ships_desc:0 "Old fishermen mutter of dark sails among the far islands, ships that answer no hail and leave no wake. The court of [ROOT.GetName] hears the tales in silence and does not dismiss them."
 zin_shared_east_lands_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_shared_east_lands_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_shared_east_lands_the_court_guard:0 "The [ROOT.GetAdjective] Guard"
 zin_shared_east_lands_the_court_guard_desc:0 "A standing company in the court's colours is posted at the gates, the treasury and the audience hall. They wear mail from the armoury of [ROOT.GetName] and drill each morning in the yard."
 zin_shared_east_lands_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_shared_east_lands_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_shared_east_lands_the_dry_roads:0 "The Dry Roads"
 zin_shared_east_lands_the_dry_roads_desc:0 "South of the last green hills the road runs through sand and stone, and every drop of water has a name. The court of [ROOT.GetName] counts its wells and sends surveyors to look for more."
 zin_shared_east_lands_the_free_council:0 "The Free Council"
 zin_shared_east_lands_the_free_council_desc:0 "The merchants and landholders of [ROOT.GetName] seat themselves in a council with equal voices. The king still sits at the head of the board, but he is asked to listen first."
 zin_shared_east_lands_the_free_lords:0 "The Free Lords"
 zin_shared_east_lands_the_free_lords_desc:0 "The lords of the road, each master of his own wells and watch-towers, agree to meet once a year and settle their quarrels at the same table. Between meetings, they rule as they please."
 zin_shared_east_lands_the_freeholds_endure:0 "The Freeholds Endure"
 zin_shared_east_lands_the_freeholds_endure_desc:0 "The free farmers and herders of [ROOT.GetName] have kept their lands and their customs for as long as anyone can remember. The court sees no reason to change a thing that works."
 zin_shared_east_lands_the_kings_law:0 "The King's Law"
 zin_shared_east_lands_the_kings_law_desc:0 "A code of the king's laws is written down and carried to every town, with penalties set against each offence. The lords grumble, and the poor learn that the same rules apply to the rich."
 zin_shared_east_lands_the_old_customs:0 "The Old Customs of [ROOT.GetName]"
 zin_shared_east_lands_the_old_customs_desc:0 "Who sits first, who speaks next and who carries the water are rules older than the court, and [ROOT.GetName] keeps them with care. The elders gather to say which of them are worth keeping and which have outlived their use."
 zin_shared_east_lands_the_open_road:0 "The Open Road"
 zin_shared_east_lands_the_open_road_desc:0 "The court declares that its road is open to all who pay the toll and leave the peace unbroken. Riders from both great powers pass freely, and the toll-keepers are told to be courteous to every flag."
 zin_shared_east_lands_the_protectors_due:0 "The Protector's Due"
 zin_shared_east_lands_the_protectors_due_desc:0 "Every year the protector's steward comes to count the harvest and name the levy, and every year [ROOT.GetName] pays what it owes. Those who owe the most learn to love the protector's road."
 zin_shared_east_lands_tolls_at_the_gates:0 "Tolls at the Gates"
 zin_shared_east_lands_tolls_at_the_gates_desc:0 "Every gate of [ROOT.GetName] gains a toll-keeper, a ledger and a dozen guards. Merchants grumble, pay and note that the roads are safer than they were."
 zin_shared_east_lands_town_council:0 "Council of the Towns"
 zin_shared_east_lands_town_council_desc:0 "Each town sends a speaker to the long room, and the speakers settle matters faster than any lord."
 zin_shared_east_lands_traders_across_the_rift:0 "Traders Across the Rift"
 zin_shared_east_lands_traders_across_the_rift_desc:0 "Across the rift lies the elven shore, with its glass, its silks and its polite, unhurried merchants. Ships from [ROOT.GetName] carry salt and copper west and return with goods that sell for ten times the price."
 zin_shared_east_lands_wait_upon_events:0 "Wait Upon Events"
 zin_shared_east_lands_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_shared_east_lands_watch_fires_on_the_coast:0 "Watch-Fires on the Coast"
 zin_shared_east_lands_watch_fires_on_the_coast_desc:0 "Beacon-stacks of pitch-soaked wood are raised on the headlands, each tended by a watcher with a horn. If the strange ships come ashore, the coast will be warned an hour before the first bow touches sand."
 zin_shared_east_lands_watch_the_quays:0 "Watch the Quays"
 zin_shared_east_lands_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_shared_east_lands_watchful_quays:0 "Watchful Quays"
 zin_shared_east_lands_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_shared_east_lands_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_shared_east_lands_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_shared_east_lands_when_the_king_falls:0 "When the King Falls"
 zin_shared_east_lands_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_shared_east_lands_with_the_host_to_parim:0 "With the Host to Parim"
 zin_shared_east_lands_with_the_host_to_parim_desc:0 "The coalition turns west, and the companies of [ROOT.GetName] march with it. Their orders are to reach a city none of them has seen, and take what its lords have kept."
 zin_shared_east_lands_workshops_of_the_towns:0 "Workshops of the Towns"
 zin_shared_east_lands_workshops_of_the_towns_desc:0 "Potters, weavers and smiths gather in the quarters near the market, and the court grants each trade a street of its own. [ROOT.GetName] begins to export its work as well as its road."
 zin_shared_east_lands.1.a:0 "Welcome them into the Treaty"
 zin_shared_east_lands.1.b:0 "Not yet"
 zin_shared_east_lands.1.d:0 "Riders from [FROM.GetName] wait at the gate of Furvior with a petition in a leather case. The court of [FROM.GetName] asks for a place in the Noris Treaty and offers its roads, its wells and its horses."
 zin_shared_east_lands.1.t:0 "A Court Asks for the Treaty"
 zin_shared_east_lands.2.a:0 "Welcome them into the Pact"
 zin_shared_east_lands.2.b:0 "Not yet"
 zin_shared_east_lands.2.d:0 "A clerk from [FROM.GetName] lays a petition on the table in Postondoroth. The court of [FROM.GetName] asks for a place in the Stabilo Pact and offers its markets, its roads and its goodwill."
 zin_shared_east_lands.2.t:0 "A Court Asks for the Pact"
 zin_shared_east_lands.3.a:0 "Old fishermen's tales"
 zin_shared_east_lands.3.b:0 "Send a boat to look"
 zin_shared_east_lands.3.b_tip_1:0 "The boat comes back with nothing to tell, and nobody aboard will speak of it."
 zin_shared_east_lands.3.d:0 "Fishermen of [ROOT.GetName] speak of dark sails among the far islands, ships that answer no hail and show no lights. Some say a boat should go and look. Others say a boat that goes may not come back."
 zin_shared_east_lands.3.t:0 "Tales of Black Ships"
 zin_shared_east_lands.4.a:0 "We have our answer"
 zin_shared_east_lands.4.d:0 "The envoys return from [FROM.GetName] with the answer. Whether it is a welcome or a request to wait, it was given courteously, and they were sent home with gifts for the court."
 zin_shared_east_lands.4.t:0 "The Answer of [FROM.GetName]"
