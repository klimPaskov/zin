l_english:
 zin_regional_gondolin_a_match_in_furvior:0 "A Match in Furvior"
 zin_regional_gondolin_a_voice_at_the_table:0 "A Voice at the Table"
 zin_regional_gondolin_a_voice_in_the_treaty_council:0 "A Voice in the Treaty Council"
 zin_regional_gondolin_a_voice_in_the_treaty_council_desc:0 "Gondolin asks for a seat at the Treaty's table and a vote on its roads. Noris's riders are not used to being asked, and listen."
 zin_regional_gondolin_ask_more_of_furvior:0 "Ask More of Furvior"
 zin_regional_gondolin_ask_more_of_furvior_desc:0 "Gondolin asks for a larger share of the salt trade and a subsidy for its yards. Furvior's court sighs, haggles and pays a little."
 zin_regional_gondolin_beacons_of_the_shore:0 "Beacons of the Shore"
 zin_regional_gondolin_beacons_of_the_shore_desc:0 "A chain of beacons is raised along the whole northern shore, each in sight of the next. A flame at one end of the coast is seen at the other within the hour."
 zin_regional_gondolin_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_gondolin_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_gondolin_close_the_houses:0 "Close the Houses"
 zin_regional_gondolin_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_gondolin_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_gondolin_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_gondolin_crown_of_the_northern_shore:0 "Crown of the Northern Shore"
 zin_regional_gondolin_crown_of_the_northern_shore_desc:0 "Lorvena is crowned again at the midwinter fair, with pearls from the northern beds and silver from the Salt Road. Fishers and captains cheer from the quay."
 zin_regional_gondolin_eastern_oath:0 "Oath to the King in the East"
 zin_regional_gondolin_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_gondolin_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_gondolin_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_gondolin_free_crown_court:0 "A Free Crown"
 zin_regional_gondolin_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_gondolin_galleys_of_gondolin:0 "Galleys of Gondolin"
 zin_regional_gondolin_galleys_of_gondolin_desc:0 "Long, narrow galleys are built for the northern coast, fast under oars and steady in a swell. The yard-masters carve the queen's sign on every prow."
 zin_regional_gondolin_generous_friends:0 "The Generous Friends"
 zin_regional_gondolin_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_gondolin_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_gondolin_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_gondolin_harbours_of_gondolin:0 "Harbours of Gondolin"
 zin_regional_gondolin_harbours_of_gondolin_desc:0 "Stone moles reach out from every cove, and a breakwater is begun at the largest. A shipyard rises beside the fish-market, and its hammers never stop."
 zin_regional_gondolin_healing_houses:0 "Houses of Healing"
 zin_regional_gondolin_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_gondolin_houses_of_healing:0 "Houses of Healing"
 zin_regional_gondolin_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_gondolin_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_gondolin_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_gondolin_levies_for_the_host:0 "Levies for the Host"
 zin_regional_gondolin_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_gondolin_lorvenas_court:0 "Lorvena's Court"
 zin_regional_gondolin_lorvenas_court_desc:0 "The queen's court is a sea-hall of dark timber and grey stone. Its walls are hung with charts, and its tables are set with maps instead of cloths."
 zin_regional_gondolin_lorvenas_court_spirit:0 "Lorvena's Court"
 zin_regional_gondolin_lorvenas_court_spirit_desc:0 "The queen's court stands above the quays, and its windows face the northern sea. Captains are welcome at her table; courtiers who have never smelled tar are not."
 zin_regional_gondolin_masters_of_the_northern_sea:0 "Masters of the Northern Sea"
 zin_regional_gondolin_masters_of_the_northern_sea_desc:0 "A war-fleet stands in the northern roads under the queen's banner, and the coasters call her captains the sea's own. Few vessels dare the channel without leave."
 zin_regional_gondolin_northern_anchor_of_the_treaty:0 "Northern Anchor of the Treaty"
 zin_regional_gondolin_northern_anchor_of_the_treaty_desc:0 "Gondolin has been Furvior's partner in the Noris Treaty for generations, and its quays carry the Treaty's salt. The queen takes the title of anchor with pride."
 zin_regional_gondolin_northern_sea_masters:0 "Masters of the Northern Sea"
 zin_regional_gondolin_northern_sea_masters_desc:0 "No ship sails the northern coast without being noted by a Gondolin watcher, and no storm surprises a Gondolin captain. The coasters call the queen's captains the sea's own."
 zin_regional_gondolin_northern_shore_crown:0 "Crown of the Northern Shore"
 zin_regional_gondolin_northern_shore_crown_desc:0 "Lorvena wears a crown of grey pearl and dark silver, and the harbours of the north answer to her. A captain who sails under her flag has the best charts and the longest memory in the East."
 zin_regional_gondolin_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_gondolin_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_gondolin_own_counsel:0 "Our Own Counsel"
 zin_regional_gondolin_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_gondolin_question_of_the_east:0 "The Question of the East"
 zin_regional_gondolin_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_gondolin_sea_charts_of_the_north:0 "Sea Charts of the North"
 zin_regional_gondolin_sea_charts_of_the_north_desc:0 "Captains copy their logs into a single chart-book, kept at the harbour hall and updated each season. A ship without a chart is a lost ship, and Gondolin loses few."
 zin_regional_gondolin_ships_against_the_black_sails:0 "Ships Against the Black Sails"
 zin_regional_gondolin_ships_against_the_black_sails_desc:0 "Every hull that can carry a ram is sent to the northern roads, and the captains are told to sink black sails and spare nothing else. The queen herself watches the first fleet leave."
 zin_regional_gondolin_stand_against_the_tide:0 "Stand Against the Tide"
 zin_regional_gondolin_stand_against_the_tide_desc:0 "The northern shore has seen what comes out of the dark water, and Gondolin has chosen to meet it on the sand. Every fisher and farmer knows where to stand when the horn blows."
 zin_regional_gondolin_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_gondolin_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_gondolin_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_gondolin_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_gondolin_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_gondolin_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_gondolin_the_dead_on_the_shore:0 "The Dead on the Shore"
 zin_regional_gondolin_the_dead_on_the_shore_desc:0 "The dead have come out of the northern sea, and the beacons burn from end to end of the coast. Gondolin's fishers and farmers take up their spears and stand on the sand."
 zin_regional_gondolin_the_fishing_fleets:0 "The Fishing Fleets"
 zin_regional_gondolin_the_fishing_fleets_desc:0 "Fishing fleets sail with the dawn tide and return with the dusk, and the catch is salted on the quay. A good year feeds half the northern coast."
 zin_regional_gondolin_the_northern_houses:0 "The Northern Houses"
 zin_regional_gondolin_the_northern_houses_desc:0 "The houses of the northern shore sit on the queen's council, each with a harbour, a fleet of boats and a quarrel. Lorvena keeps the peace by remembering all of them."
 zin_regional_gondolin_the_queens_council:0 "The Queen's Council"
 zin_regional_gondolin_the_queens_council_desc:0 "The queen sets up a council of captains and shipwrights, who meet monthly in the harbour hall. They advise her on tides, timber and the price of rope."
 zin_regional_gondolin_the_royal_house_of_gondolin:0 "The Royal House of Gondolin"
 zin_regional_gondolin_the_royal_house_of_gondolin_desc:0 "The question of the succession is raised in council and not answered. The queen's captains, the houses and the allies in Furvior each have a candidate."
 zin_regional_gondolin_the_salt_quays:0 "The Salt Quays"
 zin_regional_gondolin_the_salt_quays_desc:0 "Noris's salt comes up the Salt Road in sacks and goes out by sea in barrels, and every barrel pays a coin at the quays. The harbour master keeps the books himself."
 zin_regional_gondolin_the_salt_roads_end:0 "The Salt Road's End"
 zin_regional_gondolin_the_salt_roads_end_desc:0 "The Salt Road ends at the sea, and its last miles are paved and lit. Everything that comes down it is weighed, marked and shipped within a day."
 zin_regional_gondolin_the_sea_crown:0 "The Sea Crown"
 zin_regional_gondolin_the_sea_crown_desc:0 "Gondolin's queens have ruled the northern coast from a hall above the salt quays. Lorvena is proud of the Treaty and prouder of her captains."
 zin_regional_gondolin_the_watchers_of_gondolin:0 "The Watchers of Gondolin"
 zin_regional_gondolin_the_watchers_of_gondolin_desc:0 "The watchers are drawn from old fishing families, who know the sea by its sound. They are posted in pairs, and no pair is allowed to sleep at once."
 zin_regional_gondolin_treaty_levies_of_gondolin:0 "Treaty Levies of Gondolin"
 zin_regional_gondolin_treaty_levies_of_gondolin_desc:0 "Spearmen of the northern shore are sent to Furvior to drill beside the Treaty's riders. They return seasick and wiser."
 zin_regional_gondolin_wait_upon_events:0 "Wait Upon Events"
 zin_regional_gondolin_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_gondolin_warships_of_the_north:0 "Warships of the North"
 zin_regional_gondolin_warships_of_the_north_desc:0 "Two-masted warships with iron rams and fighting-tops are laid down in the yards, built to hold the northern waves. Their keels are cut from the best timber of the coast."
 zin_regional_gondolin_watch_on_the_northern_sea:0 "Watch on the Northern Sea"
 zin_regional_gondolin_watch_on_the_northern_sea_desc:0 "Beacon towers rise on every headland, each with a keeper and a log. The queen asks that every light, every sail and every odd shadow be written down."
 zin_regional_gondolin_watch_the_quays:0 "Watch the Quays"
 zin_regional_gondolin_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_gondolin_watchers_of_gondolin:0 "The Watchers of Gondolin"
 zin_regional_gondolin_watchers_of_gondolin_desc:0 "Lookouts on every headland keep a log of every sail and an eye on every shadow. A quiet sea is no reason to sleep."
 zin_regional_gondolin_watchful_quays:0 "Watchful Quays"
 zin_regional_gondolin_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_gondolin_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_gondolin_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_gondolin_when_the_king_falls:0 "When the King Falls"
 zin_regional_gondolin_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_gondolin_word_to_furvior:0 "Word to Furvior"
 zin_regional_gondolin_word_to_furvior_desc:0 "A rider is sent over the Salt Road with a sealed report for Noris's court. Lorvena asks her ally to read it with care and answer it without delay."
 zin_regional_gondolin.1.a:0 "Fishermen's lamps"
 zin_regional_gondolin.1.b:0 "Double the watch"
 zin_regional_gondolin.1.d:0 "Lookouts on the northern headland report lights where no harbour stands, small and pale and far from any known shore. The old fishers say they are lamps, and the young lookouts are not so sure."
 zin_regional_gondolin.1.t:0 "Lights Beyond the Islands"
 zin_regional_gondolin.2.a:0 "No match this year"
 zin_regional_gondolin.2.b:0 "A match in Furvior"
 zin_regional_gondolin.2.c:0 "A match among our captains"
 zin_regional_gondolin.2.d:0 "Queen Lorvena has no heir, and her council has begun to speak of a match. Furvior has sent letters, her captains have sent poems, and the old houses of the northern shore have sent their sons."
 zin_regional_gondolin.2.t:0 "The Royal House of Gondolin"
 zin_regional_gondolin.3.a:0 "Double the watch"
 zin_regional_gondolin.3.d:0 "The lights beyond the islands are no longer a story. Fishers tell of dead men on far shores, of black hulls under dark sails and of a cold that comes before them. The queen's council sits all night and speaks of nothing else."
 zin_regional_gondolin.3.t:0 "Lights Beyond the Islands"
