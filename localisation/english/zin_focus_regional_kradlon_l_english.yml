l_english:
 zin_regional_kradlon_aenoran_duties:0 "Aenoran Duties"
 zin_regional_kradlon_aenoran_duties_desc:0 "Every cart that crosses the sea pays duty at Parim, and every journeyman knows the figure by heart. Kradlon's goods are good, and Aenor's tariffs are higher than its patience."
 zin_regional_kradlon_apprentice_rolls:0 "Apprentice Rolls"
 zin_regional_kradlon_apprentice_rolls_desc:0 "Every guild keeps a roll of its apprentices, with their masters and their terms. A boy who is not on a roll is not allowed near a forge."
 zin_regional_kradlon_arm_the_western_host:0 "Arm the Western Host"
 zin_regional_kradlon_arm_the_western_host_desc:0 "Wagons of arms roll out of the guild halls, bound for the western host. The First Guildsman rides at the head of the first column, and counts every cartload."
 zin_regional_kradlon_arms_for_the_west:0 "Arms for the West"
 zin_regional_kradlon_arms_for_the_west_desc:0 "The guilds pledge their forges to the Ford Council: pikes by the hundred, mail by the cartload. Kradlon's smiths will arm the West, and the West will remember who did it."
 zin_regional_kradlon_charter_of_the_guilds:0 "Charter of the Guilds"
 zin_regional_kradlon_charter_of_the_guilds_desc:0 "The moot adopts one charter for all the guilds, and the First Guildsman signs it with his chain on. It lasts a hundred years, if no one breaks it."
 zin_regional_kradlon_coal_and_ore_carts:0 "Charcoal and Ore Carts"
 zin_regional_kradlon_coal_and_ore_carts_desc:0 "Cart-lines run from the hills to the forges, carrying ore down and charcoal up. The roads are rutted, and the carters have a union."
 zin_regional_kradlon_count_the_duties:0 "Count the Duties"
 zin_regional_kradlon_count_the_duties_desc:0 "Clerks sit in the toll-houses and count every cart. At the end of the season, they know to the copper what Aenor has taken."
 zin_regional_kradlon_crossbow_guilds:0 "Crossbow Guilds"
 zin_regional_kradlon_crossbow_guilds_desc:0 "The fletchers' and smiths' guilds join to make a crossbow that any journeyman can span. A guild company armed with them is a match for a baron's retinue."
 zin_regional_kradlon_forge_rows:0 "Forge Rows"
 zin_regional_kradlon_forge_rows_desc:0 "A whole street of forges is built under one roof, with a common chimney and a common bell. Hesta Varn runs it, and the bell rings on the hour."
 zin_regional_kradlon_guild_charter:0 "Charter of the Guilds"
 zin_regional_kradlon_guild_charter_desc:0 "The guilds have written their rights into one charter, and the First Guildsman has sworn to uphold them. Masters, journeymen and apprentices all know where they stand."
 zin_regional_kradlon_guild_militia:0 "The Guild Militia"
 zin_regional_kradlon_guild_militia_desc:0 "Each guild raises a company of its own journeymen, with its own banner and its own drum. They drill on Sundays and fight when called."
 zin_regional_kradlon_guilds_abroad:0 "The Guilds Abroad"
 zin_regional_kradlon_guilds_abroad_desc:0 "The guild companies have crossed the central sea with their forge-wagons and their field smithies. They carry their trade with them, and mend what they break."
 zin_regional_kradlon_heed_the_warning:0 "Heed the Warning"
 zin_regional_kradlon_heed_the_warning_desc:0 "The stranger had a warning about the king in Parim, and the guilds have decided to heed it. The old grudge softens, a little, for a stranger's sake."
 zin_regional_kradlon_hulls_from_kradlon:0 "Hulls from Kradlon"
 zin_regional_kradlon_hulls_from_kradlon_desc:0 "The guilds build hulls for the western fleet: keels from Kradlon's oak, planks from its pitch-pine and rope from its own ropewalks."
 zin_regional_kradlon_markets_across_the_sea:0 "Markets Across the Sea"
 zin_regional_kradlon_markets_across_the_sea_desc:0 "Kradlon's carts load onto ships bound for the markets of the central sea. The guilds learn to price their goods in Aenoran silver."
 zin_regional_kradlon_master_smiths:0 "Master Smiths"
 zin_regional_kradlon_master_smiths_desc:0 "The best smiths are honoured with a master's hammer and a seat in the hammer-hall. What they forge is the best in the West, and they know it."
 zin_regional_kradlon_masters_of_the_forges:0 "Masters of the Forges"
 zin_regional_kradlon_masters_of_the_forges_desc:0 "The smiths' guild is the oldest and richest in Kradlon, and its masters take the first seats at the moot. Their rules govern the price of iron from the hills to the sea."
 zin_regional_kradlon_parim_market:0 "A Market in Parim"
 zin_regional_kradlon_parim_market_desc:0 "A quarter of Parim has been given to Kradlon's guilds, with stalls, warehouses and a gate of their own. The king's tariffs bite less there."
 zin_regional_kradlon_sea_markets:0 "Markets Across the Sea"
 zin_regional_kradlon_sea_markets_desc:0 "Kradlon's goods are sold in the market of Parim and the stalls of the central sea. The guilds earn silver, and the duties are paid without complaint."
 zin_regional_kradlon_stranded_journeymen:0 "Journeymen Beyond the Sea"
 zin_regional_kradlon_stranded_journeymen_desc:0 "Some journeymen stayed behind with their forges, and now they have a banner to follow. The guilds send word that they are to follow it."
 zin_regional_kradlon_the_first_guildsmans_chain:0 "The First Guildsman's Chain"
 zin_regional_kradlon_the_first_guildsmans_chain_desc:0 "The chain of office is a heavy thing, made of one link from each guild's signet. Trilo Kradd wears it to the moot and takes it off to sleep."
 zin_regional_kradlon_the_great_hammer_halls:0 "The Great Hammer-Halls"
 zin_regional_kradlon_the_great_hammer_halls_desc:0 "Water-driven hammers the size of a cart pound out bars of iron in a single heat. The noise carries for miles, and Kradlon has grown used to it."
 zin_regional_kradlon_the_guild_moot:0 "The Guild Moot"
 zin_regional_kradlon_the_guild_moot_desc:0 "Kradlon is a league of guild towns, and the masters of the guilds meet in a moot to choose a First Guildsman. Trilo Kradd wears the chain of office today."
 zin_regional_kradlon_the_guild_pledge:0 "The Guild Pledge"
 zin_regional_kradlon_the_guild_pledge_desc:0 "Each guild swears to send men and arms to the crossing. The oaths are sworn on an anvil, and the sound of the hammer on the iron seals them."
 zin_regional_kradlon_the_guilds_across_the_sea:0 "The Guilds Across the Sea"
 zin_regional_kradlon_the_guilds_across_the_sea_desc:0 "Guild companies cross the sea with field forges and wagon-strings of their own. They mend the host's arms on the beach and drink the host's wine."
 zin_regional_kradlon_the_guilds_petition:0 "The Guilds' Petition"
 zin_regional_kradlon_the_guilds_petition_desc:0 "The masters write a respectful petition to Parim, listing every tariff and what it costs. The king's secretaries will read it, and probably do nothing."
 zin_regional_kradlon_the_guilds_remember:0 "The Guilds Remember"
 zin_regional_kradlon_the_guilds_remember_desc:0 "Every duty is entered in a black book, and the book is read aloud at the moot. The guilds do not forget, and neither do their sons."
 zin_regional_kradlon_the_journeymen:0 "The Journeymen"
 zin_regional_kradlon_the_journeymen_desc:0 "Journeymen are given a voice at the moot, though not yet a vote. They have a great deal to say about the masters' hours."
 zin_regional_kradlon_the_long_road_home:0 "The Long Road Home"
 zin_regional_kradlon_the_long_road_home_desc:0 "The guild companies march home, weary and short of tools. The moot welcomes them, and the masters ask what they have learned."
 zin_regional_kradlon_the_militia_drilled:0 "The Militia Drilled"
 zin_regional_kradlon_the_militia_drilled_desc:0 "The companies march and shoot together on the great common. By the end of the season, they can march in step, and sometimes in time."
 zin_regional_kradlon_the_stranger_at_the_forge:0 "The Stranger at the Forge"
 zin_regional_kradlon_the_stranger_at_the_forge_desc:0 "A stranger came to a Kradlon forge in the dead of winter and asked for nothing but a place by the fire. The smiths remember what he said."
 zin_regional_kradlon_the_tariff_quarrel:0 "The Tariff Quarrel"
 zin_regional_kradlon_the_tariff_quarrel_desc:0 "Kradlon pays the heaviest duties of any western court, and the masters are keeping count. Nobody yet speaks of war, but every ledger has a column for what is owed."
 zin_regional_kradlon_the_wagon_works:0 "The Wagon-Works"
 zin_regional_kradlon_the_wagon_works_desc:0 "Wagon-wrights build the carts that carry Kradlon's goods to every market. Roads are widened to take them, and the toll-houses are rebuilt."
 zin_regional_kradlon_trade_before_grudge:0 "Trade Before Grudge"
 zin_regional_kradlon_trade_before_grudge_desc:0 "The First Guildsman decides that grudges do not fill a warehouse. He sends a quiet offer to Parim: Kradlon will drop its demands, if the king will open a market."
 zin_regional_kradlon_voices_at_the_ford:0 "Voices at the Ford"
 zin_regional_kradlon_voices_at_the_ford_desc:0 "Kradlon sends its delegates to the Ford Council with a sealed folio of grievances. They are told to speak when the tariffs are mentioned, and to shout when they are not."
 zin_regional_kradlon_wagon_forts:0 "Wagon-Forts"
 zin_regional_kradlon_wagon_forts_desc:0 "Captain Bram Kettle teaches the militia to circle the wagons and chain them. A camp made of carts is a camp made of walls."
 zin_regional_kradlon_wagon_forts_drill:0 "Wagon-Forts"
 zin_regional_kradlon_wagon_forts_drill_desc:0 "Kradlon's journeymen learned to circle their wagons against raiders, and the habit stuck. A camp laid out in a wagon-ring is a hard thing to break."
 zin_regional_kradlon_western_arsenal:0 "Arsenal of the West"
 zin_regional_kradlon_western_arsenal_desc:0 "Every forge in Kradlon is on a war footing, and the guild-masters have promised the western courts their pick of the new-made arms. The hammers ring all night."
 zin_regional_kradlon_workshops_of_the_west:0 "Workshops of the West"
 zin_regional_kradlon_workshops_of_the_west_desc:0 "Kradlon's workshops make much of what the West sells and buys. New halls are raised, and the old ones are doubled in size."
 zin_regional_kradlon.1.a:0 "Refuse"
 zin_regional_kradlon.1.b:0 "Open the market"
 zin_regional_kradlon.1.d:0 "The First Guildsman's envoy has come to Parim with a single request: a place in the capital where Kradlon's goods may be sold without the heaviest duties. In return, the guilds will pay a yearly gift into the king's treasury."
 zin_regional_kradlon.1.t:0 "The Guilds of Kradlon Ask for a Market"
