l_english:
 zin_regional_heaven_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_heaven_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_heaven_a_seat_at_noon:0 "A Seat at Noon"
 zin_regional_heaven_a_seat_at_noon_desc:0 "The Sunhot realms meet at midday in an open court with no roof, where nothing is decided before the sun is overhead. [ROOT.GetName] takes its seat among them and speaks in its turn."
 zin_regional_heaven_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_heaven_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_heaven_cloud_warden:0 "The Cloud-Warden"
 zin_regional_heaven_cloud_warden_desc:0 "Ithrael is warden of the high terraces and keeper of the old star tables. He climbs the stairs at every dusk to see what the sky has done."
 zin_regional_heaven_cloud_warden_ithrael:0 "The Cloud-Warden"
 zin_regional_heaven_cloud_warden_ithrael_desc:0 "Ithrael is the warden of the high terraces and the keeper of the star tables. He wears a grey cloak the colour of the morning mist."
 zin_regional_heaven_healing_houses:0 "The Healing Houses"
 zin_regional_heaven_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_heaven_heaven_keeps_its_peace:0 "Heaven Keeps Its Peace"
 zin_regional_heaven_heaven_keeps_its_peace_desc:0 "Heaven wants nothing but its stairs, its tables and its view. It sends word to every court that it will keep its peace, and asks only the same."
 zin_regional_heaven_heaven_welcomes:0 "Heaven Welcomes All"
 zin_regional_heaven_heaven_welcomes_all:0 "Heaven Welcomes All"
 zin_regional_heaven_heaven_welcomes_all_desc:0 "Any pilgrim may climb, and any may leave. The warden asks only that they take nothing and leave no mark, and they do as he asks."
 zin_regional_heaven_heaven_welcomes_desc:0 "Pilgrims of every realm and kind climb the stairs of Heaven for the view and the quiet. They are fed, housed and sent down again, and none is asked their name."
 zin_regional_heaven_heavens_peace:0 "Heaven Keeps Its Peace"
 zin_regional_heaven_heavens_peace_desc:0 "The terraces are high, the air is thin and the stairs are many. Few have climbed them with anything but pilgrimage in mind, and Heaven has kept its peace."
 zin_regional_heaven_honour_the_president:0 "Honour the Chair"
 zin_regional_heaven_honour_the_president_desc:0 "The realm that keeps the Council's chair holds it for all and answers to all. [ROOT.GetName] sends gifts and an envoy to its court, and is thanked in the old words."
 zin_regional_heaven_houses_for_pilgrims:0 "Houses for Pilgrims"
 zin_regional_heaven_houses_for_pilgrims_desc:0 "Stone rest-houses with hearths and bedrolls are built beside the stair, kept by the terrace families in turn. Pilgrims leave a coin or a verse."
 zin_regional_heaven_letters_to_the_mirror_keepers:0 "Letters to the Mirror's Keepers"
 zin_regional_heaven_letters_to_the_mirror_keepers_desc:0 "The watchers write to the keepers of the Mirror of First Rain at Gala, with their records of the sky. The Mirror's keepers answer with thanks and a question."
 zin_regional_heaven_long_sight:0 "The Long Sight"
 zin_regional_heaven_long_sight_desc:0 "The watchers of Heaven keep records of the sky for longer than any court has kept its accounts. What they see is written down plainly, and is read plainly, and nothing more is claimed."
 zin_regional_heaven_old_strength:0 "The Old Strength"
 zin_regional_heaven_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_heaven_omens_in_the_sky:0 "Omens in the Sky"
 zin_regional_heaven_omens_in_the_sky_desc:0 "Something strange is seen in the sky, and the watchers write it down without comment. They ask the warden what is to be done with such a record."
 zin_regional_heaven_our_share_of_the_sun_guard:0 "Our Share of the Sun Guard"
 zin_regional_heaven_our_share_of_the_sun_guard_desc:0 "A guard of tall spearmen from every realm keeps the open court and the roads that lead to it. [ROOT.GetName] sends its share, drilled in the slow, heavy step that Sunhot spears have always kept."
 zin_regional_heaven_peace_among_the_realms:0 "Peace Among the Realms"
 zin_regional_heaven_peace_among_the_realms_desc:0 "The Council's oldest custom is that no realm raises a hand against another, and that a quarrel over a boundary stone is settled by an elder from a third realm. [ROOT.GetName] swears it again, and means it."
 zin_regional_heaven_peace_of_noon:0 "The Peace of Noon"
 zin_regional_heaven_peace_of_noon_desc:0 "No realm of the Council raises a hand to another, and [ROOT.GetName] guards that peace as closely as its own gates."
 zin_regional_heaven_pilgrims_to_heaven:0 "Pilgrims to Heaven"
 zin_regional_heaven_pilgrims_to_heaven_desc:0 "Pilgrims climb the stairs of Heaven for the view and the quiet, in lines that stretch down the mountain. They are fed, housed and sent down again."
 zin_regional_heaven_priests_from_afar:0 "Priests From Afar"
 zin_regional_heaven_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_heaven_ready_for_the_noon_league:0 "Ready for the Noon League"
 zin_regional_heaven_ready_for_the_noon_league_desc:0 "When danger passes the borders, the Council can bind its realms into one league with one banner and one watch-fire. [ROOT.GetName] gives its word beforehand, so that nobody need ask it twice."
 zin_regional_heaven_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_heaven_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_heaven_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_heaven_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_heaven_storm_readers:0 "The Storm-Readers"
 zin_regional_heaven_storm_readers_desc:0 "A school of storm-readers is founded in the lower tower, learning to tell a gale from a squall by the colour of the cloud-bank. Their forecasts are posted on the stairs."
 zin_regional_heaven_storm_readers_spirit:0 "The Storm-Readers"
 zin_regional_heaven_storm_readers_spirit_desc:0 "The storm-readers watch the weather over the whole south-west from towers cut into the rock. They see a gale a day before the coast does, and say so."
 zin_regional_heaven_sun_guard_share:0 "Our Share of the Sun Guard"
 zin_regional_heaven_sun_guard_share_desc:0 "A company of tall spearmen from [ROOT.GetName] stands in the Council's guard, and its drill is the finest in the south."
 zin_regional_heaven_terraces_above_the_clouds:0 "Terraces Above the Clouds"
 zin_regional_heaven_terraces_above_the_clouds_desc:0 "Terraces cling to the cliff above the cloud-line, planted with barley, tea and bitter herbs. The farmers work them roped to iron rings."
 zin_regional_heaven_the_council_endures:0 "The Council Endures"
 zin_regional_heaven_the_council_endures_desc:0 "Generations of Sunhot elves have sat in that court without once drawing a blade in it. [ROOT.GetName] adds its name to the long roll of those who kept it so."
 zin_regional_heaven_the_high_terraces:0 "The High Terraces"
 zin_regional_heaven_the_high_terraces_desc:0 "Heaven is one high state: terraces above the clouds where the air is still and the sky is close. Its Cloud-Warden, Ithrael, keeps the old tables of the stars and the weather over the south-west."
 zin_regional_heaven_the_long_sight:0 "The Long Sight"
 zin_regional_heaven_the_long_sight_desc:0 "Records of the sky are kept for generation after generation, each in a numbered chest. What they show is read plainly, and nothing more is claimed for it."
 zin_regional_heaven_the_old_strength:0 "The Old Strength"
 zin_regional_heaven_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_heaven_the_pilgrim_stairs:0 "The Pilgrim Stairs"
 zin_regional_heaven_the_pilgrim_stairs_desc:0 "The stairs are recut in the living rock, with a handrail of rope and a rest-shelf at every hundred steps. A fit pilgrim climbs them in a day."
 zin_regional_heaven_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_heaven_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_heaven_the_star_tables:0 "The Star Tables"
 zin_regional_heaven_the_star_tables_desc:0 "The star tables are copied out afresh on fine vellum, with the old errors corrected in red. Copies go to every Sunhot court that asks."
 zin_regional_heaven_the_still_air:0 "The Still Air"
 zin_regional_heaven_the_still_air_desc:0 "The air above the clouds is still, and a lamp burns without flickering. Quarrels seem to lose their edge up here, and councillors speak slowly."
 zin_regional_heaven_the_wardens_hall:0 "The Warden's Hall"
 zin_regional_heaven_the_wardens_hall_desc:0 "The warden's hall is a round room of grey stone with a roof open to the sky. Its council sits on benches ringed round a pool, and watches the stars in the water."
 zin_regional_heaven_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_heaven_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_heaven_watchers_of_the_sky:0 "Watchers of the Sky"
 zin_regional_heaven_watchers_of_the_sky_desc:0 "Observation towers rise on the highest ridges, each with a brass ring, a slate and a keeper. The watchers sleep by day and write by night."
 zin_regional_heaven_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_heaven_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_heaven_what_the_sky_cannot_show:0 "What the Sky Cannot Show"
 zin_regional_heaven_what_the_sky_cannot_show_desc:0 "The watchers write a short rule on the door of the hall: no sign may be called a prophecy. They have seen what fear does to those who are told their end."
 zin_regional_heaven_what_the_sky_cannot_show_tip_1:0 "A sign read as a certainty can frighten people into the deeds it foretells."
 zin_regional_heaven_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_heaven_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_heaven.1.a:0 "Keep them in the hall"
 zin_regional_heaven.1.b:0 "Send the tables to Gala"
 zin_regional_heaven.1.d:0 "The watchers see a long-tailed star and storms that do not move. They write that it is a sign of weather, not of fate, and ask whether the tables should go to Gala or stay in the hall."
 zin_regional_heaven.1.t:0 "Omens in the Sky"
