l_english:
 ZIN_RULE_WEST_ROUTE:0 "The West's Course"
 ZIN_RULE_WEST_ROUTE_CROSSING_HOLD:0 "Cross and Hold"
 ZIN_RULE_WEST_ROUTE_CROSSING_HOLD_DESC:0 "The West crosses and never sails home. The far shore is held until it breaks."
 ZIN_RULE_WEST_ROUTE_DEFAULT:0 "Follows the Historical Path"
 ZIN_RULE_WEST_ROUTE_DEFAULT_DESC:0 "The western crowns choose as the Historical Path rule says."
 ZIN_RULE_WEST_ROUTE_DESC:0 "Where the western crowns steer when no player steers them."
 ZIN_RULE_WEST_ROUTE_DIVIDED:0 "Keep Our Own Shore"
 ZIN_RULE_WEST_ROUTE_DIVIDED_DESC:0 "The Ford Council breaks up. No western banner crosses the sea."
 ZIN_RULE_WEST_ROUTE_FREE:0 "Every Crown Chooses"
 ZIN_RULE_WEST_ROUTE_FREE_DESC:0 "Resolve, unity and old grudges decide the course."
 ZIN_RULE_WEST_ROUTE_HISTORICAL:0 "As the Chronicle Tells It"
 ZIN_RULE_WEST_ROUTE_HISTORICAL_DESC:0 "The West prepares the Crossing, launches when the great war begins, and sails home when the shore cannot be held."
 ZIN_RULE_WEST_ROUTE_RELIEF:0 "Sail to the Rescue"
 ZIN_RULE_WEST_ROUTE_RELIEF_DESC:0 "The West sails to Aenor's help against the dark, as allies and never as conquerors."
 zin_west_accept_surrenders:0 "Accept the Surrenders"
 zin_west_accept_surrenders_desc:0 "Aenoran commanders ask terms. Take them, and keep the terms, and the conquered will not take up the torch."
 zin_west_aenoran_gold:0 "Aenoran Gold"
 zin_west_aenoran_gold_desc:0 "Parim's coin pays the court's debts and the court's silence. The old claims are mentioned less often at table."
 zin_west_beachhead_host:0 "The Beachhead"
 zin_west_beachhead_host_desc:0 "Our banners stand on the far shore. Every man there knows the sea behind him is wide."
 zin_west_beside_former_foes:0 "Beside Former Foes"
 zin_west_beside_former_foes_desc:0 "Our soldiers share a fire with the Aenorans they fought a season ago. Neither side talks about it."
 zin_west_build_crossing_ships:0 "Build Crossing Ships"
 zin_west_build_crossing_ships_desc:0 "The sea is wider than the old maps drew. Lay down hulls and hire island charters until the fleet can lift a host."
 zin_west_choose_course:0 "The Question of the Sea"
 zin_west_choose_course_desc:0 "The Council has sat long enough. Put the question to the crowns: cross, stay, or sail to Aenor's aid."
 zin_west_claimant_of_parim:0 "Claimant to the Throne of Men"
 zin_west_claimant_of_parim_desc:0 "A western hand rests on the old throne of Aenor. It is a heavy thing to hold, and a heavier thing to be seen holding."
 zin_west_conquerors:0 "Conquerors of Parim"
 zin_west_convene_council:0 "Convene the Ford Council"
 zin_west_convene_council_desc:0 "Summon the crowns of the West to the Grey Ford. Whoever convenes it will lead what comes after."
 zin_west_council:0 "The Ford Council"
 zin_west_council_desc:0 "The crowns of the West meet where the old truce was signed, and decide whether the West stays divided, sails for revenge, or sails to Aenor's help."
 zin_west_crossing:0 "The Western Crossing"
 zin_west_crossing_desc:0 "The host has sailed, or is about to. Landings, surrenders, the long wait for ships home."
 zin_west_end_the_truce:0 "End the Truce of the Grey Ford"
 zin_west_end_the_truce_desc:0 "The truce has worn thin and the dark is rising. Let the old quarrel be fought out at the ford, as a border feud and no more."
 zin_west_envoy_welcome:0 "Envoys of the Ford Council"
 zin_west_fleet_waits:0 "The Fleet Waits"
 zin_west_fleet_waits_desc:0 "The fleet lies at the shore for sixty days. Every host that reaches a harbour sails home. Those that do not may not see another ship."
 zin_west_ford_blood:0 "Blood at the Grey Ford"
 zin_west_fought_beside:0 "Fought Beside Us"
 zin_west_generous_conquerors:0 "Generous Conquerors"
 zin_west_generous_conquerors_desc:0 "Our captains accepted surrenders and kept their word. Towns that opened their gates were not burned."
 zin_west_hold_fast:0 "Hold What We Took"
 zin_west_hold_fast_desc:0 "The host refused the ships and dug in on the far shore. Every day it holds, the dead and the south draw nearer."
 zin_west_launch:0 "Launch the Crossing"
 zin_west_launch_desc:0 "The ships are ready and the crowns are pledged. Name the landing and sail."
 zin_west_own_shore:0 "Our Own Shore"
 zin_west_own_shore_desc:0 "The Ford Council broke up without a crossing, and every court went home to its own harvest. It is a quieter, poorer, safer year."
 zin_west_parim_defiant:0 "Parim Will Not Yield"
 zin_west_parim_defiant_desc:0 "The old city's defenders have sworn to fight from the cellars, and the garrison believes it."
 zin_west_pledge_holders:0 "Holders of Parim in Pledge"
 zin_west_refused_the_call:0 "Refused the Call to Cross"
 zin_west_second_sailing:0 "The Second Sailing"
 zin_west_second_sailing_desc:0 "The ships have come home empty. Load the rest of the pledged hosts and cross again."
 zin_west_send_envoys:0 "Send Envoys to a Western Court"
 zin_west_send_envoys_desc:0 "Carry the Council's argument to a court that has not yet sent a delegate. Old grudges are easier to water than to uproot."
 zin_west_sound_the_retreat:0 "Sound the Retreat"
 zin_west_sound_the_retreat_desc:0 "The far shore is untenable. Call the ships and let the hosts march to the harbours while there is time."
 zin_west_strain_mod:0 "The Strain of the Far Shore"
 zin_west_stranded_host:0 "Stranded Beyond the Sea"
 zin_west_stranded_host_desc:0 "Part of our army missed the last ships and stands on a foreign shore with nowhere to run. Men with nowhere to run hold their ground."
 zin_west_tt_dark:0 "The Gathering Dark has risen"
 zin_west_tt_envoy:0 "The target has sent no delegate"
 zin_west_tt_fleet:0 "The fleet grows"
 zin_west_tt_peace:0 "The West is at peace with itself."
 zin_west_tt_pledges:0 "Pledges remain unsailed"
 zin_west_tt_question:0 "The Council sits and the West is united enough to choose"
 zin_west_tt_ready:0 "The ships, the pledges and the cause are ready"
 zin_west_tt_second:0 "Ninety days have passed since the first sailing"
 zin_west_tt_ships:0 "The realm has a shipwright and timber for hulls"
 zin_west_tt_strain:0 "The far shore strains the host"
 zin_west_tt_surrenders:0 "The host holds three or more states of Aenor"
 zin_west_tt_truce_low:0 "The truce is almost spent"
 zin_west.10.a:0 "Lower the duty."
 zin_west.10.b:0 "Refuse. The duty stands."
 zin_west.10.d:0 "A western court writes to Parim, politely, that the duties on its goods are heavier than the treaties allow. The letter is signed by a councillor of trade and read aloud by a clerk who cannot quite keep a straight face. The court wants an answer, and it wants one in writing."
 zin_west.10.t:0 "A Protest from the West"
 zin_west.15.a:0 "So the old claims stir."
 zin_west.15.d:0 "The temples of Parim rejoice, and the news crosses the sea faster than the ships. A god sits on the throne that once was claimed over our fathers. The old claims stir in the western halls, and a number of lords are asking, rather too loudly, how a god keeps a treaty."
 zin_west.15.t:0 "A God on Aenor's Throne"
 zin_west.20.a:0 "Sit with them."
 zin_west.20.b:0 "Decline."
 zin_west.20.d:0 "Gunwaith proposes a commission of both courts to sit at the Grey Ford and settle the small quarrels before they become large ones. Our wardens are suspicious. The proposal is, however, signed in good ink and sealed in the old way."
 zin_west.20.t:0 "The Ford Commission"
 zin_west.21.a:0 "Answer in kind."
 zin_west.21.b:0 "Pay the blood-price."
 zin_west.21.c:0 "Refer it to the Ford Commission."
 zin_west.21.d:0 "Riders crossed the shallows at night and drove off cattle. Whoever they were, they did not wear a banner. The thanes want to answer in kind, the elders want to pay the blood-price, and the old men who remember the last war are asking everybody to be quiet."
 zin_west.21.t:0 "A Raid at the Ford"
 zin_west.22.a:0 "To the ford!"
 zin_west.22.d:0 "The truce is broken. At the ford both banks are lit with torches, and the nearest villages are emptying. Neither side will say who began it. Both are certain of the answer."
 zin_west.22.t:0 "Blood at the Grey Ford"
 zin_west.24.a:0 "Make peace."
 zin_west.24.b:0 "Stay hostile."
 zin_west.24.d:0 "The feud at the ford is over. The dead are counted, the prisoners are bargained for, and the old border sits where it sat before. One court has won and one has lost, and both know the stranger's peace was a better bargain than this."
 zin_west.24.t:0 "After the Feud"
 zin_west.25.a:0 "Bad news for every road in the West."
 zin_west.25.d:0 "The Truce of the Grey Ford has broken. Gunwaith and Girdon are at the ford with their banners, and every court of the West is deciding which side to blame. The West has been at peace for three winters. It will not be at peace for many more unless someone can end this."
 zin_west.25.t:0 "The Grey Ford Is Broken"
 zin_west.26.a:0 "May the peace hold."
 zin_west.26.d:0 "The feud at the Grey Ford is over. The courts have put their banners away, the dead are in the ground, and the traders are already arguing about tolls on the new road. It was a small war, and the next one will not be."
 zin_west.26.t:0 "Peace at the Ford"
 zin_west.3.a:0 "Prepare the Crossing."
 zin_west.3.b:0 "Keep our own shore."
 zin_west.3.c:0 "Sail to Aenor's help."
 zin_west.3.d:0 "The delegates have sat at the Grey Ford long enough to know each other's faces. The old claims on Parim are spoken of openly now, and so are the ships. The question is put to the crowns: do we cross the sea to end the quarrel with Aenor, keep to our own shore, or sail to Aenor's help against what is rising?"
 zin_west.3.t:0 "The Question of the Sea"
 zin_west.30.a:0 "Send a delegate."
 zin_west.30.b:0 "Stay away."
 zin_west.30.d:0 "The convener of the Council has sent riders to every western court: the crowns will meet at the Grey Ford, where the truce was signed, to speak of the old claims and the sea. Our delegates would ride at our expense and speak with our voice. We may also stay at home and leave the speaking to others."
 zin_west.30.t:0 "The Ford Council Convenes"
 zin_west.31.a:0 "Refuse."
 zin_west.31.b:0 "Pledge the host."
 zin_west.31.c:0 "Send ships, not men."
 zin_west.31.d:0 "The Ford Council has chosen. The West will cross the wide sea to end the old quarrel with Aenor for good. The convener asks each court for its host: a pledge of men, ships alone, or nothing. Parim has not yet heard of it. When it does, the answer will be written in blood."
 zin_west.31.t:0 "The Call to Cross"
 zin_west.40.a:0 "Aenor Isle first."
 zin_west.40.b:0 "Straight to the mainland shore."
 zin_west.40.d:0 "The ships are laden and the pledged hosts are aboard. The pilots ask the only question that matters: where? The isle off the Middle Lands' western coast is nearest, and its harbours were the first Aenor's ships reached in ages past. The mainland shore is larger, and defended in proportion."
 zin_west.40.t:0 "Where Shall the Host Land?"
 zin_west.41.a:0 "The West has sailed."
 zin_west.41.d:0 "The western fleet has crossed the wide sea. Beacons burn along the coast of the Middle Lands, and the first reports are contradictory. It is certain only that banners from the far shore have been seen on the water, and that the water is wider than the maps allowed."
 zin_west.41.t:0 "The Western Crossing"
 zin_west.42.a:0 "Man the shore."
 zin_west.42.d:0 "Sails on the western horizon, then more sails, then the coast watch stopped counting. Whatever the western courts have been planning for fifty years has put to sea. The harbour garrison asks for orders."
 zin_west.42.t:0 "Sails on the Western Sea"
 zin_west.44.a:0 "Press on with what remains."
 zin_west.44.d:0 "The sea took part of the fleet. Our pilots kept their heads and the main host landed, but a quarter of the transports are gone, and the foe's ships were waiting on the weather. What was hoped to be a landing is a salvage."
 zin_west.44.t:0 "Storm and Sail"
 zin_west.50.a:0 "Grant passage."
 zin_west.50.b:0 "Refuse."
 zin_west.50.d:0 "A rider from the western courts brings a plain letter. The dead are moving in the north, the south is arming, and Aenor stands alone. The crowns of the West do not forget the old quarrel, but they remember it is old. They ask passage for their ships through your ports, and the right to stand beside you."
 zin_west.50.t:0 "Letters from the West"
 zin_west.51.a:0 "A strange alliance."
 zin_west.51.d:0 "The ships that come into Aenor's harbours carry no conquerors' banners. Western hosts are landing in friendly ports and marching for the fronts. Old men on the quays say they never thought to see the day."
 zin_west.51.t:0 "The Western Relief"
 zin_west.55.a:0 "Fight for every street."
 zin_west.55.b:0 "Yield the city to spare it."
 zin_west.55.d:0 "The western host is at the gates, and the Captains' Regency has counted it. The dead are in the north, the south is on the road, the king has gone east, and Parim has no army that can hold a siege. The western commander has sent word that the city will be spared if the gates are opened."
 zin_west.55.t:0 "The Keys of Parim"
 zin_west.56.a:0 "The city has new masters."
 zin_west.56.d:0 "Western banners fly over Parim. The Captains yielded the city to spare it, or the city was taken, depending on whom you ask. The western leader has announced what he will do with it. The announcement was shorter than expected."
 zin_west.56.t:0 "Western Banners over Parim"
 zin_west.57.a:0 "Claim the throne of men."
 zin_west.57.b:0 "Hold Parim as a pledge."
 zin_west.57.d:0 "Parim is in our hands, and the old throne of Aenor stands empty in the great hall. The crowns who followed us will ask what we mean to do with it. Some say take the throne. Others say hold the city as a pledge against the sea. Whoever sits in that hall will be remembered for what he did next."
 zin_west.57.t:0 "The Throne of Men"
 zin_west.60.a:0 "Sail home."
 zin_west.60.b:0 "Hold what we took."
 zin_west.60.d:0 "The dead have crossed the northern coasts, the south is on the march, eastern banners have been seen on the passes, and Parim cannot be held. The fleet lies at the shore. The commanders ask whether to sail home while there are ships to sail in, or to dig in and hope the sea is kinder than the land."
 zin_west.60.t:0 "The Shore Calls"
 zin_west.61.a:0 "March to the ports."
 zin_west.61.d:0 "The fleet has come to the shore, and the call has gone out: every host that can reach a harbour within sixty days will sail home. Those that do not are on their own. Your captains are already looking at the roads."
 zin_west.61.t:0 "The Fleet at the Shore"
 zin_west.62.a:0 "Let them stand with us."
 zin_west.62.b:0 "Let them go, but not on our soil."
 zin_west.62.c:0 "No terms."
 zin_west.62.d:0 "The western fleet has sailed, and part of the western host has not. Several thousand soldiers stand on your soil with no ships, no supplies and no orders. They have asked for terms. The captains say the terms are simple: nothing is demanded of them but that they do not burn anything."
 zin_west.62.t:0 "Terms on the Shore"
 zin_west.63.a:0 "Send word home."
 zin_west.63.b:0 "Make the best of it."
 zin_west.63.d:0 "Our soldiers who missed the ships are camped beside the Aenorans they fought a season ago. Both are fighting the dead now. The commanders write home each week, and each week the letters are shorter."
 zin_west.63.t:0 "Those Left Behind"
 zin_west.64.a:0 "To the ships, if there are ships."
 zin_west.64.d:0 "The far shore broke the host. Without supplies, without ships and under the weight of the war around them, the hosts came apart in a week. Those who can still march are marching for the harbours."
 zin_west.64.t:0 "The Host Breaks"
 zin_west.66.a:0 "Some did not sail."
 zin_west.66.d:0 "Some sailed home. Some were still on the march when the fleet left. The harbours of the Middle Lands are quieter now, and the western banners that remain on the shore are held by men who have decided to stay."
 zin_west.66.t:0 "The Western Fleet Sails Home"
 zin_west.70.a:0 "Bring them home."
 zin_west.70.b:0 "Let those who wish stay."
 zin_west.70.d:0 "In this telling, the false god is dead and the heir is crowned. The men who stayed behind in the Middle Lands ask the same question: now what? A ship could be sent, or they could stay. The decision is ours to make, and those soldiers will not thank us for either."
 zin_west.70.t:0 "The Long Way Home"
 zin_west.71.a:0 "A crown across the sea."
 zin_west.71.d:0 "A western crown holds Parim. The Fourth Age has not yet found an end, and in the meantime a king from across the sea sits in the old palace. Nobody knows what he means to do with it."
 zin_west.71.t:0 "A Crown Across the Sea"
 zin_west.72.a:0 "Give him the city."
 zin_west.72.b:0 "Keep it."
 zin_west.72.d:0 "The heir of Aen has come to the western holder of Parim with a plain request: the city is his, and he asks for it freely. He does not demand that the western crowns give up their own, and he promises that the city will keep its walls and its treaties. Our captains are divided."
 zin_west.72.t:0 "The Heir Asks for Parim"
 zin_west.80.a:0 "A quiet year."
 zin_west.80.d:0 "The Ford Council has broken up without a crossing. The crowns have gone home, and for the first time in a generation no one in the West is planning a war. The old claims on Parim are spoken of only on feast days."
 zin_west.80.t:0 "The West Keeps Its Own Shore"
 zin_west.90.a:0 "Dismiss the tale."
 zin_west.90.b:0 "Fortify the shore."
 zin_west.90.c:0 "Send gold west."
 zin_west.90.d:0 "Merchants returning from the western shores bring a rumour: the shipwrights are working through the night. No one in the West says the word 'invasion'. The captain of the western shore asks whether to fortify, to send gold to the western courts, or to dismiss the talk."
 zin_west.90.t:0 "Talk of Ships in Western Yards"
