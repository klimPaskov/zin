l_english:
 zin_regional_nether_a_bargain_never_an_oath:0 "A Bargain, Never an Oath"
 zin_regional_nether_a_bargain_never_an_oath_desc:0 "Whatever Nafeher thinks of the king, it has learned that the Halls cannot be commanded, only paid or refused. The court is satisfied, which happens about once an age."
 zin_regional_nether_a_summoner_at_the_rim:0 "A Summoner at the Rim"
 zin_regional_nether_a_summoner_at_the_rim_desc:0 "Every few years a mortal comes to the shore of the Sea of Lava with the old words and a desperate face. The king hears every one of them, because every one of them pays."
 zin_regional_nether_bargain_kept:0 "The Bargain Kept"
 zin_regional_nether_call_the_kin_home:0 "Call the Kin Home"
 zin_regional_nether_call_the_kin_home_desc:0 "The demon realms of the island swore to Nafeher, not to the Halls, and their oaths have gone cold with their master. The king sends heralds to every one of them that stands free, to say that the kin of the Nether are welcome at the Throne of Embers as friends."
 zin_regional_nether_clear_the_old_rings:0 "Clear the Old Rings"
 zin_regional_nether_clear_the_old_rings_desc:0 "Thralls dig the cinders out of the rings and set the fallen stones upright again. A ring that cannot be reached cannot be lit, and the roads to them have been buried for an age."
 zin_regional_nether_companies_for_hire:0 "Companies for Hire"
 zin_regional_nether_companies_for_hire_desc:0 "The houses send their Netherborn companies to Nafeher's musters and Zarek counts the price in at the shore. The king lends demons and never gives them."
 zin_regional_nether_companies_through_the_rings:0 "Companies through the Rings"
 zin_regional_nether_companies_through_the_rings_desc:0 "With the rings relit, the houses can send their companies where the king points rather than where the galleys can land. Vorathael leads the first of them through."
 zin_regional_nether_devils_of_the_burning_shore:0 "Devils of the Burning Shore"
 zin_regional_nether_devils_of_the_burning_shore_desc:0 "A handful of devils lair on the Burning Shore, few, huge and answerable to nobody. Some of them have fought in Nafeher's hosts, and the king would like them to fight for the Halls."
 zin_regional_nether_envoys_of_nafeher:0 "Envoys of Nafeher"
 zin_regional_nether_envoys_of_nafeher_desc:0 "Since the first bargain of this age, envoys of Nafeher have come to the Halls once in every reign to ask for the king's companies. The king has never sworn to Volgan and never knelt, but he has always named a price."
 zin_regional_nether_every_bargain_kept:0 "Every Bargain Kept"
 zin_regional_nether_every_bargain_kept_desc:0 "Tribute, service and thralls come to the Halls from every pact the king has struck, and every pact is kept. The houses of the Nether have never been so well supplied, nor so feared by those who know of them."
 zin_regional_nether_every_bargain_kept_spirit:0 "Every Bargain Kept"
 zin_regional_nether_every_bargain_kept_spirit_desc:0 "Tribute, service and thralls come to the Halls from every bargain the king has struck, and the price of each ends with the life of the one who paid it. The houses have never been so well supplied."
 zin_regional_nether_fire_from_the_rings:0 "Fire from the Rings"
 zin_regional_nether_fire_from_the_rings_desc:0 "The rings burn and the companies of the houses come through them onto the enemy's roads, as they did in the Second Age. The rings cannot be held open for long, so the raids are short and very hard."
 zin_regional_nether_fire_from_the_rings_spirit:0 "Fire from the Rings"
 zin_regional_nether_fire_from_the_rings_spirit_desc:0 "The rings burn and the companies of the houses come through them onto the enemy's roads. The raids are short and terrible, and the rings cannot be held open for long."
 zin_regional_nether_fire_galleys:0 "Fire-Galleys on the Sea of Lava"
 zin_regional_nether_fire_galleys_desc:0 "No mortal ship crosses the Sea of Lava unhelped, but the black iron galleys of the houses do, with demons at the oars. Thazira commands them, and she would like more of them."
 zin_regional_nether_fire_glass_and_sulphur:0 "Fire-Glass and Sulphur"
 zin_regional_nether_fire_glass_and_sulphur_desc:0 "The Nether's sulphur and fire-glass go across the Sea of Lava to the sworn realms of the island and come back as tribute. The armourers of the Halls keep the best of the glass for blades."
 zin_regional_nether_gates_for_nafeher:0 "Gates for Nafeher"
 zin_regional_nether_gates_for_nafeher_desc:0 "The king will open the rings for Nafeher's wars, at a price, as part of the bargain of this reign. The houses will hold the rings and Nafeher will choose where they open."
 zin_regional_nether_gates_for_the_houses:0 "Gates for the Houses"
 zin_regional_nether_gates_for_the_houses_desc:0 "The rings belong to the houses of the Halls and open for nobody else. If Nafeher wants a gate, it can ask like any other mortal court and pay like one."
 zin_regional_nether_give_agon_the_maw:0 "Give Agon's House the Maw"
 zin_regional_nether_give_agon_the_maw_desc:0 "The king gives the house of Agon the Nether Maw to hold, the vent that Nafeher's servants also claim. If the house wants to raid, it can raid there, and it can explain itself to Nafeher."
 zin_regional_nether_halls_sealed:0 "The Halls Sealed"
 zin_regional_nether_halls_sealed_desc:0 "The rings are dark, the galleys are drawn up and the envoys of every mortal court are turned away at the shore. The Halls have waited out whole ages before, and they mean to wait out this one."
 zin_regional_nether_hold_the_burning_shore:0 "Hold the Burning Shore"
 zin_regional_nether_hold_the_burning_shore_desc:0 "The companies of the houses man every outer fort from the black beaches to the cinder plains. An enemy who lands on the Burning Shore will learn why nobody does."
 zin_regional_nether_hold_the_steward_to_the_bargain:0 "Hold the Steward to the Bargain"
 zin_regional_nether_hold_the_steward_to_the_bargain_desc:0 "A bargain struck with Nafeher is a bargain with Nafeher, whoever speaks for it. The king sends his heralds to the Steward to say that the price is still due and the companies are still for hire."
 zin_regional_nether_houses_contend:0 "The Houses Contend"
 zin_regional_nether_houses_contend_desc:0 "Every house of the Halls keeps its own pact-name and wants the king's favour and the right to open the rings, and none of them trusts the others with either. The court is old, proud and very quarrelsome."
 zin_regional_nether_houses_due_spirit:0 "The Houses' Due"
 zin_regional_nether_houses_due_spirit_desc:0 "The king has given each house its share of the rings, the thralls and the raids, and each house now fights for the court because the court pays it to. They are loyal while they are fed."
 zin_regional_nether_houses_gates:0 "Gates for the Houses"
 zin_regional_nether_houses_gates_desc:0 "The portal rings open for the houses of the Halls and for nobody else, and the houses go through them to raid as their fathers did. Nafeher must ask, like everyone else."
 zin_regional_nether_humble_the_house_of_agon:0 "Humble the House of Agon"
 zin_regional_nether_humble_the_house_of_agon_desc:0 "The house of Agon has raided once too often without leave, and the king takes its vents and gives them to houses that ask first. Khorvael bows very low and says nothing at all."
 zin_regional_nether_kept_to_the_letter:0 "To the Letter"
 zin_regional_nether_kept_to_the_letter_desc:0 "The Halls keep every bargain to the letter, which is exactly what the mortals who make them forget to fear. The price comes in on the day it is due, and it is always paid."
 zin_regional_nether_kin_courtesy:0 "Kin of the Nether"
 zin_regional_nether_kings_favour_spirit:0 "The King's Favour"
 zin_regional_nether_kings_favour_spirit_desc:0 "The houses come to the Throne of Embers one by one and leave with what the king chooses to give them. Nobody in the Halls doubts any longer whose court it is."
 zin_regional_nether_kings_own_counsel:0 "The King's Own Counsel"
 zin_regional_nether_kings_own_counsel_desc:0 "The king of the Halls has sent Nafeher's envoys home with nothing, and the Halls keep their own counsel behind the Sea of Lava. The court is proud of it and watches the Maw."
 zin_regional_nether_lava_rite_spirit:0 "The Lava Rite"
 zin_regional_nether_lava_rite_spirit_desc:0 "The keepers of the Burning Shore keep the pits where a slain devil's skull is thrown into the fire, so that it may come back. The devils of the shore know it, and they fight for the Halls."
 zin_regional_nether_maw_disputed:0 "The Maw Disputed"
 zin_regional_nether_pact_heralds_spirit:0 "The Pact-Heralds"
 zin_regional_nether_pact_heralds_spirit_desc:0 "Heralds of the Halls carry the king's word to anyone who has called on him by the old rites, and they bring back exactly what was agreed. They are courteous, patient and impossible to cheat."
 zin_regional_nether_price_raised:0 "The Price Raised"
 zin_regional_nether_raise_the_price:0 "Raise the Price"
 zin_regional_nether_raise_the_price_desc:0 "Nafeher needs the companies more than it did a reign ago, and the king knows it. He renews the bargain, but at a price the envoys carry home in silence."
 zin_regional_nether_refuse_nafeher:0 "Refuse Nafeher"
 zin_regional_nether_refuse_nafeher_desc:0 "The king sends the envoys home with nothing. The Halls were old before Volgan first took Mirolon, and they owe him nothing that has not been paid for."
 zin_regional_nether_refused_nafeher:0 "Nafeher Refused"
 zin_regional_nether_renew_the_bargain:0 "Renew the Bargain"
 zin_regional_nether_renew_the_bargain_desc:0 "The king renews the bargain on the old terms: Netherborn companies for Nafeher's wars, paid for in tribute and in thralls. It is a bargain, never an oath, and both sides are careful to say so."
 zin_regional_nether_seal_the_halls:0 "Seal the Halls"
 zin_regional_nether_seal_the_halls_desc:0 "The rings go dark, the galleys are drawn up and every envoy is turned away at the shore. The Halls have waited out whole ages before, and they can wait out this one."
 zin_regional_nether_shore_defended:0 "The Shore Defended"
 zin_regional_nether_shore_defended_desc:0 "Every house has sent its companies to the outer forts, and the shore is held from the black beaches to the cinder plains. An enemy who lands will not land twice."
 zin_regional_nether_shore_holds_spirit:0 "The Shore Holds"
 zin_regional_nether_shore_holds_spirit_desc:0 "The outer forts of the Burning Shore are manned, the galleries are working and the cinder-hounds are fed. No mortal army has ever crossed the Sea of Lava unhelped, and none will now."
 zin_regional_nether_silence_in_nafeher:0 "Silence in Nafeher"
 zin_regional_nether_silence_in_nafeher_desc:0 "The throne in Nafeher does not answer, and the envoys no longer come to the shore. What remains of the master of Nafeher, no one living can say, and the houses want to know what becomes of the bargain."
 zin_regional_nether_the_burning_shore:0 "The Burning Shore"
 zin_regional_nether_the_burning_shore_desc:0 "Above the Halls lie the black beaches and cinder plains of the Burning Shore, where the houses keep their outer forts and the thralls work. Everything the Nether owns that is not underground is here."
 zin_regional_nether_the_gate_of_nezer_smoulders:0 "The Gate of Nezer Smoulders"
 zin_regional_nether_the_gate_of_nezer_smoulders_desc:0 "The Burning Gate of Nezer, the broken ring on the coast where men, elves and Dark Lands soldiers closed a gate in an older age, still smoulders. Nezer holds it now, and the keepers of the rings would very much like to see it."
 zin_regional_nether_the_halls_answer:0 "The Halls Answer to One Throne"
 zin_regional_nether_the_halls_answer_desc:0 "However the king has settled the houses, the Halls speak with one voice at the Throne of Embers. It will not last for ever, and it does not need to."
 zin_regional_nether_the_house_of_agon:0 "The House of Agon"
 zin_regional_nether_the_house_of_agon_desc:0 "The house of Agon is among the oldest of the Halls and the least obedient, and its lord Khorvael speaks for it at court as obediently as it ever does. Its companies hold the vents nearest the Maw and like to use them."
 zin_regional_nether_the_houses_due:0 "The Houses' Due"
 zin_regional_nether_the_houses_due_desc:0 "The king gives every house its share of the rings and the raids by right, and asks only that they fight for the court when it calls. The houses are delighted and very hard to stop."
 zin_regional_nether_the_houses_take_the_field:0 "The Houses Take the Field"
 zin_regional_nether_the_houses_take_the_field_desc:0 "The Halls are at war, and every house sends its companies up to the Burning Shore. The houses have quarrelled for an age and they fight together very well."
 zin_regional_nether_the_king_does_not_take_the_dead:0 "The King Does Not Take the Dead"
 zin_regional_nether_the_king_does_not_take_the_dead_desc:0 "The mortals of the south believe that the king owns a bargainer after death, and the pact-sellers do not correct them. The truth is plainer: the pact ends with the life that paid for it, and the heir goes free."
 zin_regional_nether_the_kings_favour:0 "The King's Favour"
 zin_regional_nether_the_kings_favour_desc:0 "The king gives the rings, the thralls and the raids to the houses he favours and to no others. The houses compete for his favour, as they always have, but now they compete in his hall and on his terms."
 zin_regional_nether_the_kings_hall:0 "The King's Hall"
 zin_regional_nether_the_kings_hall_desc:0 "The king's own hall stands at the heart of the Halls, cut from obsidian and lit by slow fire. The houses come to it when they are summoned and not before."
 zin_regional_nether_the_lava_rite:0 "The Lava Rite"
 zin_regional_nether_the_lava_rite_desc:0 "A devil is bound to its body and can be killed, and a slain devil comes back only if its skull is thrown into lava. The houses offer to keep the pits on the Burning Shore, and the devils listen very carefully."
 zin_regional_nether_the_long_counsel:0 "The Long Counsel of the Halls"
 zin_regional_nether_the_long_counsel_desc:0 "The age of Nafeher's bargains has ended one way or another, and the court of the Nether is still here, as it was before Volgan and will be after. The king takes the long counsel he has always taken, and the houses are content to wait."
 zin_regional_nether_the_maw_disputed:0 "The Maw Disputed"
 zin_regional_nether_the_maw_disputed_desc:0 "Nafeher's servants claim the Nether Maw, and so does the king, and now there is no bargain to keep them civil. The houses fortify the vents and wait to see who blinks."
 zin_regional_nether_the_obsidian_galleries:0 "The Obsidian Galleries"
 zin_regional_nether_the_obsidian_galleries_desc:0 "Zarek, Master of the Galleries, works the thralls in the obsidian galleries under Mount Nether, where the glass comes out black and sharp. The work is hot and the roll of thralls is long."
 zin_regional_nether_the_old_rites:0 "The Old Rites"
 zin_regional_nether_the_old_rites_desc:0 "Those who know the old rites can still call on the King of Demons and bargain with him, and what he gives is real. His pacts bind the living who make them, in service, obedience or tribute, for as long as they live."
 zin_regional_nether_the_outer_forts:0 "The Outer Forts of the Shore"
 zin_regional_nether_the_outer_forts_desc:0 "Where the Sea of Lava can be crossed at all, the houses keep forts of black stone with cinder-hounds in the yards. The forts are old and the hounds are hungry."
 zin_regional_nether_the_pact_heralds:0 "The Pact-Heralds"
 zin_regional_nether_the_pact_heralds_desc:0 "The heralds of the Halls carry the king's word to whoever calls on him and bring back exactly what was agreed. They are courteous and patient, and they have never once been cheated."
 zin_regional_nether_the_pact_names_counted:0 "The Pact-Names Counted"
 zin_regional_nether_the_pact_names_counted_desc:0 "Every house keeps a pact-name known only to its own members, and the king knows all of them. He has them counted before the court, which reminds each house of what the throne holds over it."
 zin_regional_nether_the_portal_rings:0 "The Portal Rings"
 zin_regional_nether_the_portal_rings_desc:0 "On the Burning Shore stand the old portal rings through which the houses raided Aenor and other lands in the Second Age. They have stood closed since the houses quarrelled with the Necromancer's order, and Zhorara keeps them."
 zin_regional_nether_the_rings_relit:0 "The Rings Relit"
 zin_regional_nether_the_rings_relit_desc:0 "For the first time since the portals closed, fire runs round the rings of the Burning Shore. They do not open yet, and the keepers say that when they do, they will open where the king chooses."
 zin_regional_nether_the_shore_holds:0 "The Shore Holds"
 zin_regional_nether_the_shore_holds_desc:0 "The galleries are working, the forts are manned and the armourers have glass to spare. The houses say that no mortal army has ever crossed the Sea of Lava unhelped, and they intend to keep saying it."
 zin_regional_nether_the_throne_of_embers:0 "The Throne of Embers"
 zin_regional_nether_the_throne_of_embers_desc:0 "Under Mount Nether, where the heat is greatest and no mortal army can reach, the King of Demons holds court at Zarath-Nazur over the houses of the Halls. The houses are old, proud and quarrelsome, and every one of them wants something from the throne."
 zin_regional_nether_thralls_of_the_burning_shore:0 "Thralls of the Burning Shore"
 zin_regional_nether_thralls_of_the_burning_shore_desc:0 "Men, orcs and goblins taken in the old raids or given in pacts, and their children after them, work the shore and the galleries. The houses count them as they count their gold, and arm them when they must."
 zin_regional_nether_to_the_letter:0 "To the Letter"
 zin_regional_nether_to_the_letter_desc:0 "The Halls keep every bargain to the letter and expect the same of the other party. The price comes in on the day it is due, and the heralds see to it that it does."
 zin_regional_nether.1.a:0 "Let them keep their sport."
 zin_regional_nether.1.b:0 "Call the house to the Halls."
 zin_regional_nether.1.d:0 "A raiding party of the house of Agon has gone up through a vent of the Nether Maw and come back with thralls and plunder, and nobody asked the king's leave. The lord of the house says he was only keeping his companies sharp, and the other houses are waiting to see what the throne will say."
 zin_regional_nether.1.t:0 "Agon Raids Alone"
 zin_regional_nether.2.a:0 "Send him home unanswered."
 zin_regional_nether.2.b:0 "Hear his price."
 zin_regional_nether.2.d:0 "A mortal lord in a hood has come across the Sea of Lava in a demon's galley, with a pact-herald at his elbow and the old words of the rite written on a strip of skin. He wants strength for a war at home and says he will pay whatever is asked, which is what they all say."
 zin_regional_nether.2.t:0 "A Summoner at the Rim"
 zin_regional_nether.3.a:0 "The heir owes nothing."
 zin_regional_nether.3.b:0 "Offer the heir a pact of his own."
 zin_regional_nether.3.d:0 "A mortal who bargained with the Halls has died, and his heir has sent a herald to ask what the house still owes. The answer is the one the court has always given: the pact bound the living man and ended with him, and the houses hold that the dead belong to Zol, which the king has never cared to dispute."
 zin_regional_nether.3.t:0 "The King Will Not Take the Dead"
 zin_regional_nether.4.a:0 "The ring stays broken, and it stays ours."
 zin_regional_nether.4.b:0 "Let the keepers look, under guard."
 zin_regional_nether.4.d:0 "Keepers of the portal rings have come from the Nether to ask whether they may study the broken gate-ring in our hold on the coast, the one men, elves and Dark Lands soldiers closed in an older age. They promise to touch nothing and to leave by sunset, and our own lords are already arguing about whether that is a promise or a threat."
 zin_regional_nether.4.t:0 "The Broken Ring"
 zin_regional_nether.5.a:0 "Leave them to their lairs."
 zin_regional_nether.5.b:0 "Strike a bargain with the devils."
 zin_regional_nether.5.d:0 "The devils of the Burning Shore are few and very large, and they answer to nobody, though some of them have fought in Nafeher's hosts. A devil can be killed, and the keepers of the shore say that a slain devil comes back only if its skull is thrown into the lava, which makes the keepers of the lava pits very interesting to the devils."
 zin_regional_nether.5.t:0 "Devils on the Burning Shore"
 zin_regional_nether.6.a:0 "The Halls will choose in their own time."
 zin_regional_nether.6.d:0 "The envoys of Nafeher have stopped coming to the shore, and the throne in Nafeher does not answer. The Steward speaks in a name that no longer replies, and what remains of the master he served, no one living can say. The houses of the Halls have gathered at the Throne of Embers to hear what the king will do with a bargain whose other party has fallen silent."
 zin_regional_nether.6.t:0 "Silence in Nafeher"
 zin_regional_nether.7.a:0 "Our road is our own."
 zin_regional_nether.7.b:0 "Answer the Halls."
 zin_regional_nether.7.d:0 "A pact-herald of the Halls has come to our court with a message from the King of Demons. Our oath to Nafeher has gone cold with its master, he says, and the kin of the Nether would be welcome at the Throne of Embers again, as friends and not as servants, if they wish it."
 zin_regional_nether.7.t:0 "The King Calls the Kin"
