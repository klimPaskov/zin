l_english:
 zin_regional_adel_a_charter_of_the_isles:0 "A Charter of the Isles"
 zin_regional_adel_a_charter_of_the_isles_desc:0 "The charter is written and signed. The chart houses will keep the lanes, share their soundings and hang no sailor without a hearing."
 zin_regional_adel_a_harbour_for_any_sail:0 "A Harbour for Any Sail"
 zin_regional_adel_a_harbour_for_any_sail_desc:0 "The Speaker lets it be known that any ship may enter Adel's harbour without questions. A tired crew pays its dues, buys its stores and goes."
 zin_regional_adel_adel_marines:0 "Island Boarders"
 zin_regional_adel_adel_marines_desc:0 "Fishers and cargo-handlers drill in the old way: grapnel, hatchet and a shield strapped to the arm. They are small in number and very quick on a deck."
 zin_regional_adel_chart_hall_pride:0 "Keepers of the Charts"
 zin_regional_adel_chart_hall_pride_desc:0 "The Chart Hall holds the Pupor charts that the islanders drew long ago and sold to every crown. Every captain in Aoaz knows that the best soundings are still kept here."
 zin_regional_adel_charter_neutral:0 "The Charter Stays Neutral"
 zin_regional_adel_charter_neutral_desc:0 "The Pupor Charter takes no side in the war of the crowns. Every flag may use its harbours, and every flag is asked to leave its quarrel on the quay."
 zin_regional_adel_charter_patrols_of_adel:0 "Patrols of the North Isles"
 zin_regional_adel_charter_patrols_of_adel_desc:0 "Armed galleys now cruise the northern lanes under the Charter's flag. They stop corsair skiffs, escort slow merchantmen and bring any wreck survivors home."
 zin_regional_adel_charts_for_every_crown:0 "Charts for Every Crown"
 zin_regional_adel_charts_for_every_crown_desc:0 "Copies of the better-known charts are sold openly at Adel. The price is fair, and it keeps the chart-masters fed and the rest of the world friendly."
 zin_regional_adel_charts_for_the_crossing:0 "Charts for the Crossing"
 zin_regional_adel_charts_for_the_crossing_desc:0 "The western fleets cross the central sea with Adel's soundings in the chart-room of every flagship. The price is high, and the chart-masters take it."
 zin_regional_adel_charts_for_the_west:0 "Charts for the West"
 zin_regional_adel_charts_for_the_west_desc:0 "The Ford Council in the West Lands wants charts of the central sea. Adel can give them, and the chart-masters know what a good price is for a western friend."
 zin_regional_adel_charts_kept_close:0 "Charts Kept Close"
 zin_regional_adel_charts_kept_close_desc:0 "The Great Chart is locked in the Hall and read only by the chart-masters. What a captain does not know, a rival cannot sell."
 zin_regional_adel_elections_of_the_isles:0 "Elections of the Isles"
 zin_regional_adel_elections_of_the_isles_desc:0 "Every four years the isles vote. The Speaker stands on the pier and answers whatever any fisher shouts, and the chart-masters count the pebbles in the voting jars."
 zin_regional_adel_envoys_to_pollos:0 "Envoys to Pollos"
 zin_regional_adel_envoys_to_pollos_desc:0 "Pollos has the busiest market of the isles and the strongest reasons to want the lanes kept safe. A letter from the Speaker, carried by a chart-master, should be well received."
 zin_regional_adel_envoys_to_raerby:0 "Envoys to Raerby"
 zin_regional_adel_envoys_to_raerby_desc:0 "Raerby's captains judge disputes between the islands and carry letters to the mainland courts. Adel asks them to sit with the chart houses and give the Charter their blessing."
 zin_regional_adel_federation_of_the_north_isles:0 "Federation of the North Isles"
 zin_regional_adel_federation_of_the_north_isles_desc:0 "The northern isles speak with one voice in the island assembly. Quarrels over a pier or a catch are settled by vote, not by oars."
 zin_regional_adel_fisheries:0 "The Fisheries"
 zin_regional_adel_fisheries_desc:0 "Adel feeds itself on cod, herring and the fat grey eel. The guild of fishers is given a share of the dues, and promises a better catch."
 zin_regional_adel_friendship:0 "Friendship of the Isles"
 zin_regional_adel_galleys_of_adel:0 "Galleys of Adel"
 zin_regional_adel_galleys_of_adel_desc:0 "The yard-masters of Adel draw up a new galley with a finer bow and a longer keel. The oarsmen are paid by the voyage, and the voyage is always longer than the contract says."
 zin_regional_adel_great_chart:0 "The Great Chart"
 zin_regional_adel_great_chart_desc:0 "A single chart of the whole Pupor Ocean, redrawn from every captain's log and every lead-line cast in a hundred years. A ship with a copy of it can cross in weather others would shelter from."
 zin_regional_adel_harbour_of_adel:0 "The Harbour of Adel"
 zin_regional_adel_harbour_of_adel_desc:0 "The great harbour is dredged and the quays are mended. A ship can now be loaded and sailed on a single tide."
 zin_regional_adel_island_marines:0 "Island Boarders"
 zin_regional_adel_island_marines_desc:0 "A few hundred young fishers sign up to fight from the decks. They are small in number, and every one of them can swim."
 zin_regional_adel_new_soundings:0 "New Soundings"
 zin_regional_adel_new_soundings_desc:0 "Boats go out with lead-lines and tallow to feel the sea-floor again. Banks shift and channels silt, and a chart that is a generation old can wreck a ship."
 zin_regional_adel_northern_squadron:0 "The Northern Flotilla"
 zin_regional_adel_northern_squadron_desc:0 "Galleys from every north-isle yard sail together under the Speaker's flag. They practise signals, formation and the rescue of a ship in trouble."
 zin_regional_adel_northern_yards:0 "The Northern Yards"
 zin_regional_adel_northern_yards_desc:0 "New slips are laid down on the shore at Adel, and the old ones are rebuilt. A galley that is launched here is as good as any in the western seas."
 zin_regional_adel_pilots_for_the_living:0 "Wayfinders for the Living"
 zin_regional_adel_pilots_for_the_living_desc:0 "The stranger's ship is known in the northern isles now. Adel sends its best wayfinders to join the coalition, because the living must be guided home."
 zin_regional_adel_stores_and_salt:0 "Stores and Salt"
 zin_regional_adel_stores_and_salt_desc:0 "Barrels of salt-fish, ship's biscuit and dried peas fill the warehouses. A winter siege or a lean season will find the isles with food enough."
 zin_regional_adel_the_chart_hall:0 "The Chart Hall"
 zin_regional_adel_the_chart_hall_desc:0 "Behind a plain door in Adel's harbour lies the greatest store of sea-charts in Aoaz. Its keepers make no secret of what they own, and expect to be paid for it."
 zin_regional_adel_the_chart_masters:0 "The Chart-Masters"
 zin_regional_adel_the_chart_masters_desc:0 "The chart-masters are the isles' most honoured trade, and Ysmay Corran is the best of them. A seat on the Speaker's council gives her the right to lay a new sounding before the whole assembly."
 zin_regional_adel_the_charter_stays_neutral:0 "The Charter Stays Neutral"
 zin_regional_adel_the_charter_stays_neutral_desc:0 "Adel offers its harbours to every flag and asks only that its pier stay free of fighting. The Charter agrees, and the chart-masters hang a white lantern over the Hall."
 zin_regional_adel_the_federation_oath:0 "The Federation Oath"
 zin_regional_adel_the_federation_oath_desc:0 "Every harbour swears to keep the peace of the northern isles and to come to any harbour's aid. Words are cheap, but the oath is cut in stone above the hall door."
 zin_regional_adel_the_great_chart:0 "The Great Chart"
 zin_regional_adel_the_great_chart_desc:0 "The masters sew a hundred sheets into one great chart of the Pupor Ocean. It takes up a whole wall, and it takes a winter to copy."
 zin_regional_adel_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_adel_the_great_war_at_sea_desc:0 "Fleets are gathering on the western and central seas. The Speaker calls the assembly, for Adel must decide what its charts are for."
 zin_regional_adel_the_island_assembly:0 "The Island Assembly"
 zin_regional_adel_the_island_assembly_desc:0 "Delegates from every pier and chart-room meet at the turn of each season. They argue loudly and vote quietly, and the quarrels seldom last past the next tide."
 zin_regional_adel_the_leagues_oldest_charts:0 "The League's Oldest Charts"
 zin_regional_adel_the_leagues_oldest_charts_desc:0 "At the bottom of the Chart Hall's oldest press lies a bundle of charts that nobody has asked for in centuries. They show four moles and a lit harbour where every captain now sees only the reefs of the Cursed Square."
 zin_regional_adel_the_northern_squadron:0 "The Northern Flotilla"
 zin_regional_adel_the_northern_squadron_desc:0 "The galleys of the isles begin to sail together, learning flag signals and fighting in line. By the end of the season they can turn as one."
 zin_regional_adel_the_pupor_charter:0 "The Pupor Charter"
 zin_regional_adel_the_pupor_charter_desc:0 "The Pupor Ocean has no king, and its corsairs know it. Adel proposes a charter among the chart houses to keep the sea-lanes open and the cargoes safe."
 zin_regional_adel_the_rope_walks:0 "The Rope-Walks"
 zin_regional_adel_the_rope_walks_desc:0 "Long sheds along the shore spin hemp into cable. A galley needs more rope than timber, and the isles had been buying theirs from strangers."
 zin_regional_adel_the_sea_roads_rejoined:0 "The Sea-Roads Rejoined"
 zin_regional_adel_the_sea_roads_rejoined_desc:0 "If the old harbour can be lit again, the Charter could be what the isles were before the Grey Breath: one league of every isle and every lit passage. The Chart Hall drafts the oaths in the old form, just in case."
 zin_regional_adel_the_sea_wardens:0 "The Sea-Wardens"
 zin_regional_adel_the_sea_wardens_desc:0 "Captain Edda Brine has taught half the northern isles to read the weather from the colour of the sky. The Speaker gives her a ship and a crew, and asks her to keep the lanes."
 zin_regional_adel_the_southern_ship:0 "The Southern Ship"
 zin_regional_adel_the_southern_ship_desc:0 "A fast ship from the south has been sighted, with elves among her crew. Whoever she carries, Adel's harbour is open to her."
 zin_regional_adel_the_speakers_hall:0 "The Speaker's Hall"
 zin_regional_adel_the_speakers_hall_desc:0 "Adel is a federation of harbours, and its Speaker is chosen by an assembly of fishers, chart-masters and ship-owners. The hall is a plain stone building with a good view of the water."
 zin_regional_adel_whose_square:0 "Whose Square?"
 zin_regional_adel_whose_square_desc:0 "Benan claims the Square and has never set foot on it, and the Charter would like it back if anyone could say who it belongs to. The speakers argue the point over three evenings and agree only that somebody will have to pay."
 zin_regional_adel.1.a:0 "The chart-masters win"
 zin_regional_adel.1.b:0 "The fishers win"
 zin_regional_adel.1.d:0 "It is the day of the island assembly. The chart-masters want the Speaker to fund the Chart Hall, and the fishers want better piers and a lower dues-list. Both sides have packed the benches, and the votes are close."
 zin_regional_adel.1.t:0 "The North Isles Vote"
 zin_regional_adel.2.a:0 "Welcome them"
 zin_regional_adel.2.b:0 "Not now"
 zin_regional_adel.2.d:0 "A fast boat from Adel has come in under the Speaker's flag. The envoys carry sea-charts as gifts and a proposal: the isles should agree among themselves how the Pupor Ocean is to be kept, before a stronger hand decides it for them."
 zin_regional_adel.2.t:0 "Envoys from Adel"
