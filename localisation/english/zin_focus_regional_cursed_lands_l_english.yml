l_english:
 zin_regional_cursed_lands_a_crack_in_the_veil:0 "A Crack in the Veil"
 zin_regional_cursed_lands_a_crack_in_the_veil_desc:0 "A few strangers are admitted to the valley, and a few of the valley folk are sent out in return. The veil is not lifted, only thinned, and the Elder says nothing at all."
 zin_regional_cursed_lands_a_people_apart:0 "A People Apart"
 zin_regional_cursed_lands_a_people_apart_desc:0 "The valley folk agree that they are a people apart, and the veil is drawn tighter. They want to be left alone, and nothing else about them is anyone's business."
 zin_regional_cursed_lands_a_scholar_at_the_edge:0 "A Scholar at the Edge"
 zin_regional_cursed_lands_a_scholar_at_the_edge_desc:0 "A scholar of the Lost Cause has walked a long way to ask a question. The watchers hear it, and send word to the Elder, who does not answer."
 zin_regional_cursed_lands_bar_the_barrows:0 "Bar the Barrows"
 zin_regional_cursed_lands_bar_the_barrows_desc:0 "Every barrow is sealed with stone and thorn, and the keepers take their stations on the mounds. The veil is drawn tight, and what the mounds keep will keep."
 zin_regional_cursed_lands_barrow_lanterns:0 "Lanterns on the Mounds"
 zin_regional_cursed_lands_barrow_lanterns_2:0 "The Mounds Are Quiet"
 zin_regional_cursed_lands_barrow_lanterns_2_desc:0 "The keepers have pronounced the mounds quiet, and the valley holds its breath."
 zin_regional_cursed_lands_barrow_lanterns_desc:0 "Lit at dusk, burning until dawn, every night since before any record."
 zin_regional_cursed_lands_charcoal_and_iron:0 "Charcoal and Iron"
 zin_regional_cursed_lands_charcoal_and_iron_desc:0 "Charcoal-burners and smelters work in a hidden gully, their smoke drawn away down a long flue so that no stranger will ever see it."
 zin_regional_cursed_lands_crack_in_the_veil:0 "A Crack in the Veil"
 zin_regional_cursed_lands_crack_in_the_veil_desc:0 "A few strangers admitted, a few of the valley folk sent out."
 zin_regional_cursed_lands_edge_watchers:0 "Watchers at the Edge"
 zin_regional_cursed_lands_edge_watchers_desc:0 "Hooded watchers at the border stone, in the same places as their grandmothers."
 zin_regional_cursed_lands_enough_for_ourselves:0 "Enough for Ourselves"
 zin_regional_cursed_lands_enough_for_ourselves_desc:0 "The valley feeds, clothes and arms itself. It buys nothing and sells nothing, and the valley folk are well content to keep it that way."
 zin_regional_cursed_lands_healers_from_outside:0 "Healers from Outside"
 zin_regional_cursed_lands_healers_from_outside_desc:0 "Almoners of the Deliverer come to the edge with bread and medicine and a plan for a hospital. The watchers send them back to the border stone and tell them to wait."
 zin_regional_cursed_lands_lanterns_on_the_mounds:0 "Lanterns on the Mounds"
 zin_regional_cursed_lands_lanterns_on_the_mounds_desc:0 "Lanterns are lit on the mounds at dusk and kept burning until dawn. They have been lit every night since before any record, and the tallow is never allowed to run low."
 zin_regional_cursed_lands_no_road_in:0 "No Road In"
 zin_regional_cursed_lands_no_road_in_desc:0 "The valley roads are closed with stone and thorn, and the passes are narrowed to a footpath. Anyone who wishes to enter must first be seen to have a reason."
 zin_regional_cursed_lands_open_the_veil:0 "Open the Veil"
 zin_regional_cursed_lands_open_the_veil_desc:0 "The Elder lifts the veil. The valley folk go out among the living, with their bows and their silence, and the living find that they are very good company in a dark hour."
 zin_regional_cursed_lands_quiet_earth:0 "Quiet Earth"
 zin_regional_cursed_lands_quiet_earth_desc:0 "The earth over the mounds is kept still: no plough, no spade, no wandering goat. The keepers say a quiet earth is a quiet sleep."
 zin_regional_cursed_lands_self_sufficient:0 "Enough for Ourselves"
 zin_regional_cursed_lands_self_sufficient_desc:0 "The valley feeds, clothes and arms itself, and buys nothing."
 zin_regional_cursed_lands_strangers_at_the_edge:0 "Strangers at the Edge"
 zin_regional_cursed_lands_strangers_at_the_edge_desc:0 "Strangers arrive at the edge, usually one at a time, usually hungry. The watchers meet each at the border stone and hear what they have to say."
 zin_regional_cursed_lands_tallies_read:0 "A Scholar at the Edge"
 zin_regional_cursed_lands_tax_men_turned:0 "Tax-Men Turned Back"
 zin_regional_cursed_lands_tax_men_turned_back:0 "The Tax-Men Turned Back"
 zin_regional_cursed_lands_tax_men_turned_back_desc:0 "Parim's tax-men have reached the edge of the valley with their ledgers and their escorts. They are courteous, they are persistent, and they have not understood where they are."
 zin_regional_cursed_lands_terraced_fields:0 "Terraced Fields"
 zin_regional_cursed_lands_terraced_fields_desc:0 "The valley's slopes are terraced to the very top, each wall dry-laid and mended every spring. Nothing is wasted, and nothing is sold."
 zin_regional_cursed_lands_terraces:0 "Terraced Fields"
 zin_regional_cursed_lands_terraces_desc:0 "Every slope terraced to the very top, and nothing wasted."
 zin_regional_cursed_lands_the_barrow_keepers:0 "The Barrow-Keepers"
 zin_regional_cursed_lands_the_barrow_keepers_desc:0 "The valley keeps barrows older than the Concord, and a line of keepers older than the barrows. They speak of them as the mounds, and of what the mounds keep as nothing in particular."
 zin_regional_cursed_lands_the_dead_walk:0 "When the Dead Walk"
 zin_regional_cursed_lands_the_dead_walk_desc:0 "The lanterns on the mounds gutter and flare."
 zin_regional_cursed_lands_the_elders_silence:0 "The Elder's Silence"
 zin_regional_cursed_lands_the_elders_silence_desc:0 "The Veiled Elder governs the valley and says very little. A decision from the Elder is a nod, a pause or an empty chair, and the valley has always understood which is which."
 zin_regional_cursed_lands_the_hidden_valley:0 "The Hidden Valley"
 zin_regional_cursed_lands_the_hidden_valley_desc:0 "The valley is hidden from every road, and its one pass is a goat-track under an overhang. Inside, the land is green and well-tended, and quiet as a held breath."
 zin_regional_cursed_lands_the_inner_smithy:0 "The Inner Smithy"
 zin_regional_cursed_lands_the_inner_smithy_desc:0 "The valley's smiths work behind closed doors, and the work that leaves their forge is never marked. Their blades are plain and extremely sharp."
 zin_regional_cursed_lands_the_keepers_oath:0 "The Keepers' Oath"
 zin_regional_cursed_lands_the_keepers_oath_desc:0 "Each keeper swears an oath that is spoken only once, in the dark, at the foot of the oldest mound. What it says is not known beyond the valley, and not all of it within."
 zin_regional_cursed_lands_the_long_night_watch:0 "The Long Night Watch"
 zin_regional_cursed_lands_the_long_night_watch_desc:0 "The watchers are doubled and then doubled again. They stand through the long nights with lanterns and bows, and they do not talk about what they are watching for."
 zin_regional_cursed_lands_the_mounds_are_quiet:0 "The Mounds Are Quiet"
 zin_regional_cursed_lands_the_mounds_are_quiet_desc:0 "The keepers pronounce the mounds quiet, and a hush falls on the valley. It is a hush of the kind one hears before a storm, or after one."
 zin_regional_cursed_lands_the_old_tallies:0 "The Old Tallies"
 zin_regional_cursed_lands_the_old_tallies_desc:0 "The Tally-Keeper counts what the mounds keep, as every year. The count is written on knotted cords, and nobody outside the valley has ever seen one."
 zin_regional_cursed_lands_the_unspoken_law:0 "The Unspoken Law"
 zin_regional_cursed_lands_the_unspoken_law_desc:0 "There is a law in the valley that is never written and never spoken, and no one has ever been found who broke it twice."
 zin_regional_cursed_lands_the_veil:0 "The Veil"
 zin_regional_cursed_lands_the_veil_2:0 "A People Apart"
 zin_regional_cursed_lands_the_veil_2_desc:0 "The veil is drawn tighter, and nothing else is anyone's business."
 zin_regional_cursed_lands_the_veil_desc:0 "The Cursed Lands lie behind a veil that is partly stone, partly custom and partly something no traveller has ever been able to name. Parim calls the land cursed; its people do not say why."
 zin_regional_cursed_lands_the_veil_holds:0 "The Veil Holds"
 zin_regional_cursed_lands_the_veil_holds_desc:0 "The veil has held for longer than the Concord has stood. It will go on holding, so long as no one looks too closely at what it is made of."
 zin_regional_cursed_lands_the_veil_mended:0 "The Veil Mended"
 zin_regional_cursed_lands_the_veil_mended_desc:0 "The war is over, and the Elder draws the veil closed once more. Whatever came out has gone back in, and the lanterns on the mounds burn steady again."
 zin_regional_cursed_lands_the_veil_spirit:0 "The Veil"
 zin_regional_cursed_lands_the_veil_spirit_desc:0 "A veil of stone, custom and something no traveller could name."
 zin_regional_cursed_lands_token_paid:0 "A Token Paid"
 zin_regional_cursed_lands_veil_accord:0 "The Veil and the Forest"
 zin_regional_cursed_lands_watchers_at_the_edge:0 "Watchers at the Edge"
 zin_regional_cursed_lands_watchers_at_the_edge_desc:0 "Hooded watchers stand at the valley's edge, in the same places their grandmothers stood. They wave no one in, and they wave no one off."
 zin_regional_cursed_lands_when_the_dead_walk:0 "When the Dead Walk"
 zin_regional_cursed_lands_when_the_dead_walk_desc:0 "The lanterns on the mounds gutter and flare. Whatever the barrows keep, the dead have begun to walk elsewhere, and the valley must choose what it will do about it."
 zin_regional_cursed_lands_with_the_living:0 "With the Living"
 zin_regional_cursed_lands_with_the_living_desc:0 "The valley folk come out in their dark cloaks to stand with the Heir. They ask for nothing, and they say very little, and they fight as if they had been waiting for this all their lives."
 zin_regional_cursed_lands_words_with_the_redbarks:0 "Words with the Redbarks"
 zin_regional_cursed_lands_words_with_the_redbarks_desc:0 "The red-barked tribes of the northern forest are the valley's neighbours and have never asked to enter. The Elder sends a messenger with fruit and a few plain words."
 zin_regional_cursed_lands.1.a:0 "The count is the same."
 zin_regional_cursed_lands.1.d:0 "The Tally-Keeper counts what the mounds keep, as every year, on knotted cords in the lantern-light. He does not say what the cords add up to, and no one in the valley has ever thought to ask him."
 zin_regional_cursed_lands.1.t:0 "The Old Tallies"
 zin_regional_cursed_lands.2.a:0 "The forest trusts no veil."
 zin_regional_cursed_lands.2.b:0 "Leave each other be."
 zin_regional_cursed_lands.2.d:0 "Hooded envoys of the Cursed Lands have come to the moot of the Red Woods with fruit and a few plain words. They ask only that the forest and the valley leave each other be, and they wait to hear the answer."
 zin_regional_cursed_lands.2.t:0 "Veiled Envoys"
 zin_regional_cursed_lands.3.a:0 "Turn them back."
 zin_regional_cursed_lands.3.b:0 "Pay a token."
 zin_regional_cursed_lands.3.d:0 "A party of Parim's tax-men has reached the border stone, courteous, persistent and entirely lost. The watchers could turn them back, or they could pay a small token to be left in peace."
 zin_regional_cursed_lands.3.t:0 "Tax-Men at the Edge"
 zin_regional_cursed_lands.4.a:0 "Send him away."
 zin_regional_cursed_lands.4.b:0 "Let him read."
 zin_regional_cursed_lands.4.d:0 "A scholar of the Lost Cause stands at the border stone and asks, very politely, to read the tallies of the barrows. The Elder is told, and the watchers wait for a nod, a pause or an empty chair."
 zin_regional_cursed_lands.4.t:0 "A Scholar Asks"
 zin_regional_cursed_lands.5.a:0 "The veil stays closed."
 zin_regional_cursed_lands.5.b:0 "Let them heal."
 zin_regional_cursed_lands.5.d:0 "Almoners of the Deliverer wait at the border stone with bread, linen and a plan for a hospital in the valley. The watchers send word to the Elder, who is patient, and so are they."
 zin_regional_cursed_lands.5.t:0 "Almoners at the Edge"
