l_english:
 zin_regional_cursed_lands_a_crack_in_the_veil:0 "A Crack in the Veil"
 zin_regional_cursed_lands_a_crack_in_the_veil_desc:0 "A few strangers are admitted to the downs, and a few of the Veiled are sent out in return. The veil is not lifted, only thinned, and the cord-mothers say nothing at all."
 zin_regional_cursed_lands_a_people_apart:0 "A People Apart"
 zin_regional_cursed_lands_a_people_apart_desc:0 "The Veiled agree that they are a people apart, and the veil is drawn tighter. They want to be left alone, and nothing else about them is anyone's business."
 zin_regional_cursed_lands_a_scholar_at_the_edge:0 "A Scholar at the Edge"
 zin_regional_cursed_lands_a_scholar_at_the_edge_desc:0 "A scholar of the Lost Cause has walked a long way to ask a question. The watchers hear it and send word to the cord-mothers, who do not answer."
 zin_regional_cursed_lands_bar_the_barrows:0 "Bar the Barrows"
 zin_regional_cursed_lands_bar_the_barrows_desc:0 "Every barrow is sealed with stone and thorn, and the keepers take their stations on the mounds. The veil is drawn tight, and what the mounds keep will keep."
 zin_regional_cursed_lands_barrow_lanterns:0 "Lanterns on the Mounds"
 zin_regional_cursed_lands_barrow_lanterns_2:0 "The Mounds Are Quiet"
 zin_regional_cursed_lands_barrow_lanterns_2_desc:0 "The keepers have pronounced the mounds quiet, and the downs hold their breath."
 zin_regional_cursed_lands_barrow_lanterns_desc:0 "Lit at dusk, burning until dawn, every night since before any record."
 zin_regional_cursed_lands_cairn_words:0 "Words with the Stone-Counters"
 zin_regional_cursed_lands_charcoal_and_iron:0 "Charcoal and Iron"
 zin_regional_cursed_lands_charcoal_and_iron_desc:0 "Charcoal-burners and smelters work in a hidden gully, their smoke drawn away down a long flue so that no stranger will ever see it."
 zin_regional_cursed_lands_crack_in_the_veil:0 "A Crack in the Veil"
 zin_regional_cursed_lands_crack_in_the_veil_desc:0 "A few strangers admitted, a few of the Veiled sent out."
 zin_regional_cursed_lands_edge_watchers:0 "Watchers at the Edge"
 zin_regional_cursed_lands_edge_watchers_desc:0 "Hooded watchers at the border stone, in the same places as their grandmothers."
 zin_regional_cursed_lands_enough_for_ourselves:0 "Enough for Ourselves"
 zin_regional_cursed_lands_enough_for_ourselves_desc:0 "The Veiled feed, clothe and arm themselves from the downs, and they trade at the edge only roots and mushrooms for salt and iron. They are well content to keep it that way."
 zin_regional_cursed_lands_healers_from_outside:0 "Healers from Outside"
 zin_regional_cursed_lands_healers_from_outside_desc:0 "Almoners of the Deliverer come to the edge with bread and medicine and a plan for a hospital. The watchers send them back to the border stone and tell them to wait."
 zin_regional_cursed_lands_lanterns_on_the_mounds:0 "Lanterns on the Mounds"
 zin_regional_cursed_lands_lanterns_on_the_mounds_desc:0 "Lanterns are lit on the mounds at dusk and kept burning until dawn. They have been lit every night since before any record, and the tallow is never allowed to run low."
 zin_regional_cursed_lands_no_road_in:0 "No Road In"
 zin_regional_cursed_lands_no_road_in_desc:0 "The roads into the downs are closed with stone and thorn, and the passes are narrowed to a footpath. Anyone who wishes to enter must first be seen to have a reason."
 zin_regional_cursed_lands_open_the_veil:0 "Open the Veil"
 zin_regional_cursed_lands_open_the_veil_desc:0 "The cord-mothers lift the veil. The Veiled go out among the living with their bows and their silence, and the living find that they are very good company in a dark hour."
 zin_regional_cursed_lands_quiet_earth:0 "Quiet Earth"
 zin_regional_cursed_lands_quiet_earth_desc:0 "The earth over the mounds is kept still: no plough, no spade, no wandering goat. The keepers say a quiet earth is a quiet sleep."
 zin_regional_cursed_lands_self_sufficient:0 "Enough for Ourselves"
 zin_regional_cursed_lands_self_sufficient_desc:0 "The downs feed, clothe and arm the Veiled, who buy little but salt and iron."
 zin_regional_cursed_lands_strangers_at_the_edge:0 "Strangers at the Edge"
 zin_regional_cursed_lands_strangers_at_the_edge_desc:0 "Strangers arrive at the edge, usually one at a time, usually hungry. The watchers meet each at the border stone and hear what they have to say."
 zin_regional_cursed_lands_tallies_read:0 "A Scholar at the Edge"
 zin_regional_cursed_lands_tax_men_turned:0 "Tax-Men Turned Back"
 zin_regional_cursed_lands_tax_men_turned_back:0 "The Tax-Men Turned Back"
 zin_regional_cursed_lands_tax_men_turned_back_desc:0 "Parim's tax-men have reached the edge of the downs with their ledgers and their escorts. They are courteous, they are persistent, and they have not understood where they are."
 zin_regional_cursed_lands_terraced_fields:0 "Beds in the Sour Ground"
 zin_regional_cursed_lands_terraced_fields_desc:0 "Nothing sown in the usual way will grow on the sour downs, so the Veiled grow roots and mushrooms in deep beds walled with dry stone and mended every spring. Nothing is wasted, and nothing is sold."
 zin_regional_cursed_lands_terraces:0 "Beds in the Sour Ground"
 zin_regional_cursed_lands_terraces_desc:0 "Roots and mushrooms in walled beds on the sour downs, and nothing wasted."
 zin_regional_cursed_lands_the_barrow_keepers:0 "The Barrow-Keepers"
 zin_regional_cursed_lands_the_barrow_keepers_desc:0 "The downs keep barrows older than the Concord, and a line of keepers older than the barrows. They speak of them as the mounds, and of what the mounds keep as nothing in particular."
 zin_regional_cursed_lands_the_dead_walk:0 "When the Dead Walk"
 zin_regional_cursed_lands_the_dead_walk_desc:0 "The lanterns on the mounds gutter and flare."
 zin_regional_cursed_lands_the_elders_silence:0 "The Mothers' Silence"
 zin_regional_cursed_lands_the_elders_silence_desc:0 "The council of cord-mothers governs the downs and says very little. A decision of the council is a nod, a pause or an empty chair, and the Veiled have always understood which is which."
 zin_regional_cursed_lands_the_hidden_valley:0 "The Hidden Downs"
 zin_regional_cursed_lands_the_hidden_valley_desc:0 "The downs are hidden from every road, and the one way in is a goat-track under an overhang. Inside, the ground is grey and sour, and every root and mushroom bed on it is tended as carefully as a child."
 zin_regional_cursed_lands_the_inner_smithy:0 "The Inner Smithy"
 zin_regional_cursed_lands_the_inner_smithy_desc:0 "The smiths of the downs work behind closed doors, and the work that leaves their forge is never marked. Their blades are plain and extremely sharp."
 zin_regional_cursed_lands_the_keepers_oath:0 "The Keepers' Oath"
 zin_regional_cursed_lands_the_keepers_oath_desc:0 "Each keeper swears an oath that is spoken only once, in the dark, at the foot of the oldest mound. What it says is not known beyond the valley, and not all of it within."
 zin_regional_cursed_lands_the_last_cord_hidden:0 "The Last Cord Hidden"
 zin_regional_cursed_lands_the_last_cord_hidden_desc:0 "The mothers move the Last Cord out of the eldest barrow by night, and only three of them know where it went. A stranger who takes the barrow will find stones and silence there and nothing else."
 zin_regional_cursed_lands_the_last_cord_shown:0 "The Last Cord Shown"
 zin_regional_cursed_lands_the_last_cord_shown_desc:0 "The cord-mothers bring the Last Cord up out of the eldest barrow and let the other Orran houses see it. Whoever wants to know where it lies will now find out, and the mothers have decided that the Redbark should know first."
 zin_regional_cursed_lands_the_long_night_watch:0 "The Long Night Watch"
 zin_regional_cursed_lands_the_long_night_watch_desc:0 "The watchers are doubled and then doubled again. They stand through the long nights with lanterns and bows, and they do not talk about what they are watching for."
 zin_regional_cursed_lands_the_moot_of_mothers:0 "The Moot of Mothers"
 zin_regional_cursed_lands_the_moot_of_mothers_desc:0 "The cords and the stones agree, and the mothers now know what their grandmothers would never say aloud. They talk of a moot that sat before any crown, and of what it would mean to sit in it again."
 zin_regional_cursed_lands_the_mounds_are_quiet:0 "The Mounds Are Quiet"
 zin_regional_cursed_lands_the_mounds_are_quiet_desc:0 "The keepers pronounce the mounds quiet, and a hush falls on the downs. It is a hush of the kind one hears before a storm, or after one."
 zin_regional_cursed_lands_the_old_tallies:0 "The Old Tallies"
 zin_regional_cursed_lands_the_old_tallies_desc:0 "The Mother of the Eldest Cord counts what the mounds keep, as every year. The count is tied into the cords, and nobody outside the downs has ever seen one."
 zin_regional_cursed_lands_the_unspoken_law:0 "The Unspoken Law"
 zin_regional_cursed_lands_the_unspoken_law_desc:0 "There is a law on the downs that is never written and never spoken, and no one has ever been found who broke it twice."
 zin_regional_cursed_lands_the_veil:0 "The Veil"
 zin_regional_cursed_lands_the_veil_2:0 "A People Apart"
 zin_regional_cursed_lands_the_veil_2_desc:0 "The veil is drawn tighter, and nothing else is anyone's business."
 zin_regional_cursed_lands_the_veil_desc:0 "The Cursed Lands lie behind a veil that is partly stone, partly custom and partly something no traveller has ever been able to name. Parim calls the land cursed; its people do not say why."
 zin_regional_cursed_lands_the_veil_holds:0 "The Veil Holds"
 zin_regional_cursed_lands_the_veil_holds_desc:0 "The veil has held for longer than the Concord has stood. It will go on holding, so long as no one looks too closely at what it is made of."
 zin_regional_cursed_lands_the_veil_mended:0 "The Veil Mended"
 zin_regional_cursed_lands_the_veil_mended_desc:0 "The war is over, and the cord-mothers draw the veil closed once more. Whatever came out has gone back in, and the lanterns on the mounds burn steady again."
 zin_regional_cursed_lands_the_veil_spirit:0 "The Veil"
 zin_regional_cursed_lands_the_veil_spirit_desc:0 "A veil of stone, custom and something no traveller could name."
 zin_regional_cursed_lands_tide_words:0 "Words with the Tide-Queens"
 zin_regional_cursed_lands_token_paid:0 "A Token Paid"
 zin_regional_cursed_lands_veil_accord:0 "The Veil and the Forest"
 zin_regional_cursed_lands_watchers_at_the_edge:0 "Watchers at the Edge"
 zin_regional_cursed_lands_watchers_at_the_edge_desc:0 "Hooded watchers stand at the edge of the downs, in the same places their grandmothers stood. They wave no one in, and they wave no one off."
 zin_regional_cursed_lands_what_the_cords_count:0 "What the Cords Count"
 zin_regional_cursed_lands_what_the_cords_count_desc:0 "The eldest cord-mother lays the cords of every line side by side, which has not been done in living memory. The ties run back past the Withdrawal and on into years for which the downs keep no other name, and far more of them are black than anyone expected."
 zin_regional_cursed_lands_when_the_dead_walk:0 "When the Dead Walk"
 zin_regional_cursed_lands_when_the_dead_walk_desc:0 "The lanterns on the mounds gutter and flare. Whatever the barrows keep, the dead have begun to walk elsewhere, and the downs must choose what they will do about it."
 zin_regional_cursed_lands_with_the_living:0 "With the Living"
 zin_regional_cursed_lands_with_the_living_desc:0 "The Veiled come out in their grey hoods to stand with the Heir. They ask for nothing, and they say very little, and they fight as if they had been waiting for this all their lives."
 zin_regional_cursed_lands_words_with_the_redbarks:0 "Words with the Redbarks"
 zin_regional_cursed_lands_words_with_the_redbarks_desc:0 "The Redbark of the red woods speak the same old tongue as the Veiled and have never asked to enter. The cord-mothers send a messenger with roots, fruit and a few plain words."
 zin_regional_cursed_lands_words_with_the_stone_counters:0 "Words with the Stone-Counters"
 zin_regional_cursed_lands_words_with_the_stone_counters_desc:0 "A cord-mother walks west to the giants of the ring with a cord in her satchel. The cairn-keepers are said to count the same years in stone, and the mothers would like to know whether the two counts agree."
 zin_regional_cursed_lands_words_with_the_tide_queens:0 "Words with the Tide-Queens"
 zin_regional_cursed_lands_words_with_the_tide_queens_desc:0 "The queens of the isle houses choose their queen at the turn of the tide and give their dead to the sea, much as the mothers did long ago. A grey-hooded envoy takes ship for Borrak to ask what else the tide remembers."
 zin_regional_cursed_lands.1.a:0 "The count is the same."
 zin_regional_cursed_lands.1.d:0 "The Mother of the Eldest Cord counts what the mounds keep, as every year, on knotted cords in the lantern-light. She does not say what the cords add up to, and no one on the downs has ever thought to ask her."
 zin_regional_cursed_lands.1.t:0 "The Old Tallies"
 zin_regional_cursed_lands.2.a:0 "The forest trusts no veil."
 zin_regional_cursed_lands.2.b:0 "Leave each other be."
 zin_regional_cursed_lands.2.d:0 "Hooded envoys of the Cursed Lands have come to the moot of the Red Woods with fruit and a few plain words. They ask only that the forest and the valley leave each other be, and they wait to hear the answer."
 zin_regional_cursed_lands.2.t:0 "Veiled Envoys"
 zin_regional_cursed_lands.3.a:0 "Turn them back."
 zin_regional_cursed_lands.3.b:0 "Pay a token."
 zin_regional_cursed_lands.3.d:0 "A party of Parim's tax-men has reached the border stone, courteous, persistent and entirely lost. The watchers could turn them back, or they could pay a small token to be left in peace."
 zin_regional_cursed_lands.3.t:0 "Tax-Men at the Edge"
 zin_regional_cursed_lands.4.a:0 "Send him away."
 zin_regional_cursed_lands.4.b:0 "Let him read."
 zin_regional_cursed_lands.4.d:0 "A scholar of the Lost Cause stands at the border stone and asks, very politely, to read the tallies of the barrows. The cord-mothers are told, and the watchers wait for a nod, a pause or an empty chair."
 zin_regional_cursed_lands.4.t:0 "A Scholar Asks"
 zin_regional_cursed_lands.5.a:0 "The veil stays closed."
 zin_regional_cursed_lands.5.b:0 "Let them heal."
 zin_regional_cursed_lands.5.d:0 "Almoners of the Deliverer wait at the border stone with bread, linen and a plan for a hospital on the downs. The watchers send word to the cord-mothers, who are patient, and so are they."
 zin_regional_cursed_lands.5.t:0 "Almoners at the Edge"
