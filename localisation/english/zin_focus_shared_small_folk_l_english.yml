l_english:
 zin_shared_small_folk_a_friend_who_asks:0 "A Friend Who Asks"
 zin_shared_small_folk_a_friend_who_asks_desc:0 "One of the letters comes from a friend who has helped the small folk before and now asks for help in return, and the moot decides that a friend who asks should be answered."
 zin_shared_small_folk_a_stranger_at_the_saddle:0 "A Stranger at the Saddle"
 zin_shared_small_folk_a_stranger_at_the_saddle_desc:0 "A stranger in a grey robe has come over the Grano Saddle and asks to speak with the Warden, and the giants who let him through are waiting to hear what the Warden says."
 zin_shared_small_folk_a_watch_of_our_own:0 "A Watch of Our Own"
 zin_shared_small_folk_a_watch_of_our_own_desc:0 "Some of the younger householders say the small folk should not leave their gates to men from outside, and they go up to the passes themselves with slings and lanterns."
 zin_shared_small_folk_barley_and_beans:0 "Barley and Beans"
 zin_shared_small_folk_barley_and_beans_desc:0 "New fields are broken for barley and beans on the warm slopes, and the mills along the streams are given new stones."
 zin_shared_small_folk_beer_for_the_halls:0 "Beer for the Halls"
 zin_shared_small_folk_beer_for_the_halls_desc:0 "The small folk taught the herders of the Grano to brew in a famine long ago, and now the giants' halls drink more of Tirlan's beer than Tirlan does."
 zin_shared_small_folk_bread_for_the_hungry:0 "Bread for the Hungry"
 zin_shared_small_folk_bread_for_the_hungry_desc:0 "Grain from the full granaries goes out to the hungry folk on the roads, as it went to the starving clansmen in the famine of 3A 899, and nobody in [ROOT.GetName] asks for anything in return."
 zin_shared_small_folk_children_hidden:0 "The Children Hidden"
 zin_shared_small_folk_children_hidden_desc:0 "The children of [ROOT.GetName] have been taken to the safest places the small folk know, and their parents work all the harder for knowing where they are."
 zin_shared_small_folk_come_home_safe:0 "Come Home Safe"
 zin_shared_small_folk_come_home_safe_desc:0 "Whether its gates stayed shut or its travellers went out and came back, [ROOT.GetName] is still at home, and its folk mean to keep it so."
 zin_shared_small_folk_every_hearth:0 "Every Hearth a Voice"
 zin_shared_small_folk_every_hearth_a_voice:0 "Every Hearth a Voice"
 zin_shared_small_folk_every_hearth_a_voice_desc:0 "Every hearth may send someone to the moot, even the cottagers at the end of the lanes, and the long hall is suddenly not long enough."
 zin_shared_small_folk_every_hearth_desc:0 "Every hearth of [ROOT.GetName] may send someone to the moot, which makes it louder and longer and, the Warden admits, a good deal harder to ignore."
 zin_shared_small_folk_evil_does_not_enter:0 "Evil Does Not Enter"
 zin_shared_small_folk_evil_does_not_enter_desc:0 "The small folk say evil cannot enter the basin because the Watch keeps it, and the Watch, which has heard the saying all its life, has come to believe it too."
 zin_shared_small_folk_fed_by_the_valleys:0 "Fed by the Valleys"
 zin_shared_small_folk_fed_by_the_valleys_desc:0 "The halls of the giants eat the barley, beans and honey of the small folk's valleys, and the giants are very fond of honey."
 zin_shared_small_folk_gates_shut:0 "The Gates Kept Shut"
 zin_shared_small_folk_gates_shut_desc:0 "Nobody comes into [ROOT.GetName] who was not born there or asked for, and nobody born there sees much reason to leave."
 zin_shared_small_folk_harvest_feast:0 "The Harvest Feast"
 zin_shared_small_folk_harvest_feast_desc:0 "The granaries are full and the feast has lasted three days, which the small folk consider a reasonable length for a feast."
 zin_shared_small_folk_hide_the_children:0 "Hide the Children"
 zin_shared_small_folk_hide_the_children_desc:0 "The children are taken to the safest places the small folk know, the cellars, the hill-barns and, in Tirlan, the giants' cairn-halls, as they were when the dead came to the Hilorn Gap."
 zin_shared_small_folk_leaf_and_cheese_for_the_dwarves:0 "Leaf and Cheese for the Dwarves"
 zin_shared_small_folk_leaf_and_cheese_for_the_dwarves_desc:0 "Ponies go up to the high passes laden with hearth-leaf and cheese for the dwarves of Brundahrim, with a letter asking whether they will go on keeping the passes shut."
 zin_shared_small_folk_leaf_for_the_guards:0 "Leaf for the Guards"
 zin_shared_small_folk_leaf_for_the_guards_desc:0 "The leaf goes out only through the guards who keep the ways in, as it always has, so that the folk who protect [ROOT.GetName] are the folk who profit from it."
 zin_shared_small_folk_leaf_for_the_markets:0 "Leaf for the Markets"
 zin_shared_small_folk_leaf_for_the_markets_desc:0 "The moot lets factors of men come to the edge of the land to buy leaf for the markets of the world, which brings in silver and, the old households grumble, strangers."
 zin_shared_small_folk_old_households:0 "The Old Households"
 zin_shared_small_folk_old_households_desc:0 "The great households of [ROOT.GetName] keep the moot as their grandmothers kept it, with the same seats, the same quarrels and the same pies afterwards."
 zin_shared_small_folk_old_promise:0 "The Old Promise"
 zin_shared_small_folk_old_promise_2:0 "The Promise Kept"
 zin_shared_small_folk_old_promise_2_desc:0 "Every path into the ring is watched by a giant, the share is paid on the first of the harvest, and the valleys of Tirlan are the safest farmland in Aoaz."
 zin_shared_small_folk_old_promise_desc:0 "The giants promised the first households that no evil would enter the valleys while the harvest-share was paid, and the giants keep their promises."
 zin_shared_small_folk_orchard_gift:0 "The Orchard Gift"
 zin_shared_small_folk_orchards_and_bees:0 "Orchards and Bees"
 zin_shared_small_folk_orchards_and_bees_desc:0 "Orchards are planted along every lane and hives set in every orchard, and the honey of [ROOT.GetName] begins to be known outside it."
 zin_shared_small_folk_pipes_at_every_door:0 "Pipes at Every Door"
 zin_shared_small_folk_pipes_at_every_door_desc:0 "On a summer evening every doorstep in [ROOT.GetName] has someone sitting on it with a pipe, and the drying sheds along the lanes are full to the eaves."
 zin_shared_small_folk_promise_honoured:0 "The Old Promise Honoured"
 zin_shared_small_folk_ronbo_watch:0 "The Ronbo Watch"
 zin_shared_small_folk_ronbo_watch_2:0 "Evil Does Not Enter"
 zin_shared_small_folk_ronbo_watch_2_desc:0 "The small folk say that evil cannot enter the basin because the Watch keeps it, and for as long as anyone can remember they have been right."
 zin_shared_small_folk_ronbo_watch_desc:0 "Men of the Ronbo Watch keep the two passes into the basin, bound at a standing stone and paid in grain and leaf, and the dwarves keep the high passes above them."
 zin_shared_small_folk_slings_and_hedges:0 "Slings and Hedges"
 zin_shared_small_folk_slings_and_hedges_desc:0 "The small folk are deadly with a sling and know every hedge and ditch of their land, and the young watchers learn to use both."
 zin_shared_small_folk_small_folk_bread:0 "Bread from the Small Folk"
 zin_shared_small_folk_small_folk_bread_desc:0 "Carts of bread, beans and beer come in from the small folk, who will not fight but will make very sure that the host eats."
 zin_shared_small_folk_small_folk_gifts:0 "Leaf and Cheese"
 zin_shared_small_folk_stay_home:0 "Stay Home"
 zin_shared_small_folk_stay_home_desc:0 "The moot reads the letters, thanks everyone who wrote them and decides, very nearly without argument, that [ROOT.GetName] will stay at home."
 zin_shared_small_folk_the_cairn_halls:0 "The Cairn-Halls"
 zin_shared_small_folk_the_cairn_halls_desc:0 "When the dead came to the Hilorn Gap the giants hid every child of the valleys in the cairn-halls, and the households go up to see that the halls are dry and the doors still open."
 zin_shared_small_folk_the_first_travellers:0 "The First Travellers"
 zin_shared_small_folk_the_first_travellers_desc:0 "A few young householders go out with the friend who asked, the first of their family to do so in any song they know, and come back with a great deal to say."
 zin_shared_small_folk_the_full_granaries:0 "The Full Granaries"
 zin_shared_small_folk_the_full_granaries_desc:0 "The granaries are full to the rafters, and the Warden walks round them every evening with the satisfaction of somebody who has never been hungry and means to keep it so."
 zin_shared_small_folk_the_gates_kept_shut:0 "The Gates Kept Shut"
 zin_shared_small_folk_the_gates_kept_shut_desc:0 "The ways into [ROOT.GetName] are walked by the guards every night, and anybody who was not born there or asked for is turned back with a loaf and a lantern."
 zin_shared_small_folk_the_harvest:0 "The Harvest"
 zin_shared_small_folk_the_harvest_desc:0 "Everything in [ROOT.GetName] turns on the harvest, and the small folk are better at it than anybody else in Aoaz, because they have never had to think about anything else."
 zin_shared_small_folk_the_harvest_feast:0 "The Harvest Feast"
 zin_shared_small_folk_the_harvest_feast_desc:0 "The harvest is in, and [ROOT.GetName] holds the feast. How long it lasts depends on how full the granaries are, and the small folk see no reason to be modest about it."
 zin_shared_small_folk_the_harvest_feast_tip_1:0 "With forty or more in the stores the feast lasts all year."
 zin_shared_small_folk_the_harvest_share:0 "The Harvest Share"
 zin_shared_small_folk_the_harvest_share_desc:0 "The share of the harvest goes up to the giants' halls on the first day of the reaping, barley, beans, honey and beer, and the giants are very fond of the honey."
 zin_shared_small_folk_the_harvest_tip_1:0 "The harvest comes in: stores rise."
 zin_shared_small_folk_the_hearth_leaf:0 "The Hearth-Leaf"
 zin_shared_small_folk_the_hearth_leaf_desc:0 "The small folk grow a smoking leaf on their warm slopes and smoke a great deal of it, and the folk outside who have tried it would like a great deal more."
 zin_shared_small_folk_the_householders_moot:0 "The Householders' Moot"
 zin_shared_small_folk_the_householders_moot_desc:0 "The moot meets in the long hall with the windows open and the beer on the side table, and this year it has more to talk about than the price of seed."
 zin_shared_small_folk_the_moot_hall_mended:0 "The Moot Hall Mended"
 zin_shared_small_folk_the_moot_hall_mended_desc:0 "The moot hall gets a new roof, new benches and a bigger side table, and the households agree that this was the most useful thing the moot has done in years."
 zin_shared_small_folk_the_old_households:0 "The Old Households"
 zin_shared_small_folk_the_old_households_desc:0 "The great households keep their seats and their say, as they have since the first moot, and the younger folk are told they will have their turn."
 zin_shared_small_folk_the_old_promise:0 "The Old Promise"
 zin_shared_small_folk_the_old_promise_desc:0 "The first households came ashore at the Hilorn mouth on a grain ship blown off its course, and the giants gave them the three low valleys and swore that no evil would enter them while the harvest-share was paid."
 zin_shared_small_folk_the_orchard_gift:0 "The Orchard Gift"
 zin_shared_small_folk_the_orchard_gift_desc:0 "When blight took Thenon's olive groves, a Warden sent cuttings from the basin's orchards over the passes. Thenon's groves are in trouble again, and the Warden sends cuttings again."
 zin_shared_small_folk_the_promise_kept:0 "The Promise Kept"
 zin_shared_small_folk_the_promise_kept_desc:0 "Every path into the ring is watched by a giant and the share is paid on the first of the harvest, and the small folk of Tirlan sleep as soundly as anybody in Aoaz."
 zin_shared_small_folk_the_ronbo_watch:0 "The Ronbo Watch"
 zin_shared_small_folk_the_ronbo_watch_desc:0 "The men of the Ronbo Watch keep the two passes into the basin, bound at a standing stone in 3A 904 by the clansmen the small folk had fed in the famine, and the dwarves of Brundahrim keep the high passes shut above them."
 zin_shared_small_folk_the_saddle_road:0 "The Saddle Road"
 zin_shared_small_folk_the_saddle_road_desc:0 "The cart road over the Grano Saddle is the only way out of the ring that carts can use, and the households pay to have it mended so that their barley reaches the lake."
 zin_shared_small_folk_the_small_folk_go_out:0 "The Small Folk Go Out"
 zin_shared_small_folk_the_small_folk_go_out_desc:0 "For the first time in memory a company of small folk goes out into the war. They carry food and hide children rather than fight, and they come back, mostly, with stories nobody quite believes."
 zin_shared_small_folk_the_standing_stone:0 "The Standing Stone"
 zin_shared_small_folk_the_standing_stone_desc:0 "The Watch swears its oath again at the standing stone of the Ronbo Oath, and the clansmen of Thenon remember why their grandfathers swore it."
 zin_shared_small_folk_the_three_valleys:0 "The Three Valleys"
 zin_shared_small_folk_the_three_valleys_desc:0 "The three valleys of the Hilorn are the most closely farmed land in Aoaz, and the households find room for another field along every stream."
 zin_shared_small_folk_the_two_passes:0 "The Two Passes"
 zin_shared_small_folk_the_two_passes_desc:0 "Stone gatehouses are built across both passes into the basin, low and thick, with bunks for the Watch and a kitchen that the Watch says is the best in the West."
 zin_shared_small_folk_the_warden_of_the_fields:0 "The Warden of the Fields"
 zin_shared_small_folk_the_warden_of_the_fields_desc:0 "The households have chosen their Warden of the Fields, as they do, mostly for the tidiness of a hedge and the quality of a beer. [ROOT.GetName] is the safest farmland in Aoaz, and the Warden's chief worry is the weather."
 zin_shared_small_folk_the_warden_of_the_fields_tip_1:0 "The granaries of the small folk are counted in stores: the harvest fills them, and the guards, the giants and the hungry empty them."
 zin_shared_small_folk_the_warden_walks_to_parim:0 "The Warden Walks to Parim"
 zin_shared_small_folk_the_warden_walks_to_parim_desc:0 "The Warden of the Fields walks over the Saddle to Parim, barefoot, to sell the crown the valleys' barley, and comes home saying the city was very large and very noisy and that he did not care for it."
 zin_shared_small_folk_the_watch_paid_in_grain:0 "The Watch Paid in Grain"
 zin_shared_small_folk_the_watch_paid_in_grain_desc:0 "The Watch is paid in grain and leaf, on time and in full, and the Warden asks after every man in it by name."
 zin_shared_small_folk_the_world_beyond_the_hills:0 "The World Beyond the Hills"
 zin_shared_small_folk_the_world_beyond_the_hills_desc:0 "The small folk rarely leave their land and almost never wear boots, but the world beyond the hills has a way of sending letters, and this year it has sent several."
 zin_shared_small_folk_travellers:0 "Travellers Come Home"
 zin_shared_small_folk_travellers_desc:0 "A few of the small folk have been out in the world with a friend who asked for help, and they have come home full of stories nobody quite believes."
 zin_shared_small_folk_warden_at_court:0 "A Warden at Court"
 zin_shared_small_folk_watch_paid:0 "The Watch Paid in Grain"
 zin_shared_small_folk_when_the_war_comes:0 "When the War Comes"
 zin_shared_small_folk_when_the_war_comes_desc:0 "War has come to Aoaz, and even in [ROOT.GetName] the smoke can be seen from the hilltops. The small folk will not fight, but they have never yet been helpless."
 zin_shared_small_folk.1.a:0 "Thank them and keep the passes as they are."
 zin_shared_small_folk.1.b:0 "Swear the passes shut for them again."
 zin_shared_small_folk.1.d:0 "Small folk have come up to the high passes with ponies laden with hearth-leaf and good cheese, which is what they always send, and a letter in very careful writing asking whether the dwarves will go on keeping the passes shut."
 zin_shared_small_folk.1.t:0 "Leaf and Cheese from [FROM.GetName]"
 zin_shared_small_folk.2.a:0 "Send him back over the Saddle with a loaf."
 zin_shared_small_folk.2.b:0 "Let the House build its almshouse."
 zin_shared_small_folk.2.d:0 "A grey-robed almoner of the Houses of the First Light has walked over the Grano Saddle and asks the Warden for a plot of land to build an almshouse in the valleys. The giants have never let a House inside the ring, and they have sent down to ask what the Warden thinks."
 zin_shared_small_folk.2.t:0 "A Stranger at the Saddle"
 zin_shared_small_folk.3.a:0 "Give him supper and send him home."
 zin_shared_small_folk.3.b:0 "Buy the barley for the crown's granaries."
 zin_shared_small_folk.3.d:0 "The Warden of the Fields of [FROM.GetName] has walked to Parim barefoot, which has caused a stir at the gate, and asks to sell the crown the barley of the three valleys at a fair price. He has also brought the court a cheese, which nobody quite knows what to do with."
 zin_shared_small_folk.3.t:0 "A Warden of the Fields at Court"
