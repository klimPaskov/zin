l_english:
 zin_aenor_a_common_cause:0 "A Common Cause"
 zin_aenor_a_common_cause_desc:0 "Riders go to every realm that fights the dark powers. Aenor asks for open roads and offers its own in return."
 zin_aenor_a_golden_peace:0 "A Golden Peace"
 zin_aenor_a_golden_peace_desc:0 "Envoys carry gold to Lerendor and Gunwaith with the offer of a long truce. They return richer in promises than in friends."
 zin_aenor_a_kingdom_of_ruins:0 "A Kingdom of Ruins"
 zin_aenor_a_kingdom_of_ruins_desc:0 "The war is over, and what is left of Aenor must be built anew. The King walks among broken walls and orders them raised, stone by stone."
 zin_aenor_abandoned_throne:0 "The Abandoned Throne"
 zin_aenor_abandoned_throne_desc:0 "The Deliverer has gone and taken his guards with him. The throne room is silent, the temples are shuttered and the realm must remember how to rule itself."
 zin_aenor_aenor_beset:0 "Aenor Beset"
 zin_aenor_aenor_beset_desc:0 "Enemies press from every side, and the Middle Kingdom must hold. Every dominion is asked to remember what it owes the crown."
 zin_aenor_against_the_deathless:0 "Against the Deathless Dead"
 zin_aenor_against_the_deathless_desc:0 "The dead walk out of the north at Zol's will. Ordinary weapons break them but cannot end them, and the Host must learn to hold the line whatever the cost."
 zin_aenor_against_the_deathless_tip_1:0 "Ordinary weapons break Zol's dead but cannot end them."
 zin_aenor_age_of_the_king:0 "The Age of the King"
 zin_aenor_age_of_the_king_desc:0 "A new reign in a rebuilt land. The old quarrels are put away, and the realm stands as it has not for centuries."
 zin_aenor_almoners:0 "The Royal Almoners"
 zin_aenor_almoners_desc:0 "Bread is handed out at the temple door every dawn, and few ask where the grain comes from."
 zin_aenor_altar_and_throne:0 "Temple and Crown"
 zin_aenor_altar_and_throne_desc:0 "The priests sit beside the throne, and the throne sits within the priests' prayer."
 zin_aenor_arrest_the_chancellor:0 "Arrest the Keeper of Seals"
 zin_aenor_arrest_the_chancellor_desc:0 "Merovan is taken from his hall at dawn, still wearing the chain of his office. The seals pass back into the King's own hand, and the Council's friends at court lose their voice."
 zin_aenor_arrest_the_chancellor_tip_1:0 "Merovan, Keeper of the Seals, is removed from the King's council."
 zin_aenor_arsenals_of_parim:0 "The Arsenals of Parim"
 zin_aenor_arsenals_of_parim_desc:0 "Armourers, fletchers and spear-makers work in vaulted halls beneath the palace hill, and the racks never stand empty."
 zin_aenor_asgard_isle:0 "The Isle of Asgard"
 zin_aenor_asgard_isle_desc:0 "Off the western coast lies the isle of Asgard, whose houses have sworn to the crown since the first charter. A beacon-tower is raised on their headland."
 zin_aenor_audit_treasury:0 "Audit the Royal Treasury"
 zin_aenor_audit_treasury_desc:0 "Clerks who owe nothing to the throne are set to count what the King's friends have taken. The sum will be a shock to somebody."
 zin_aenor_banner_of_the_dragon:0 "The Dragon Banner"
 zin_aenor_banner_of_the_dragon_desc:0 "A dragon circles above the host. Horses scream, riders cheer and the foe loses its nerve before the first arrow is shot."
 zin_aenor_birth_rolls:0 "The Birth Rolls"
 zin_aenor_birth_rolls_desc:0 "The temples record every birth and every death in the realm, and the King's officers learn at last how many hands he can call to his banner."
 zin_aenor_black_ships:0 "The Black Ships"
 zin_aenor_black_ships_desc:0 "Fishermen on the western coast tell of black hulls moving without wind, and of lanterns that burn the wrong colour. The King's men note the tales and decide what to do."
 zin_aenor_blessed_crown:0 "The Blessed Crown"
 zin_aenor_blessed_crown_desc:0 "The King is anointed in the great temple, and the Deliverer's priests proclaim him favoured of heaven. The people kneel more readily afterwards."
 zin_aenor_blessed_realm:0 "One Faith, One Realm"
 zin_aenor_blessed_realm_desc:0 "The Deliverer's rites are kept in every dominion. Dissent is quiet, and so is much else."
 zin_aenor_bought_commissions:0 "Commissions for Sale"
 zin_aenor_bought_commissions_desc:0 "Captains pay for their ranks and expect to recoup the cost. The ranks look splendid and drill poorly."
 zin_aenor_buy_the_captains:0 "Buy the Captains"
 zin_aenor_buy_the_captains_desc:0 "Every captain of the Host receives a purse and a promise. Most of them take both."
 zin_aenor_call_the_free_peoples:0 "Call the Free Peoples"
 zin_aenor_call_the_free_peoples_desc:0 "Beacons are lit on the highest hills, and messengers go to every realm that fights the dark. The King Without a House asks only for their spears."
 zin_aenor_canal_works:0 "The Canal Works"
 zin_aenor_canal_works_desc:0 "Gangs of diggers cut waterways between the lake and the rivers beyond it, and lock-keepers learn a trade that did not exist a generation ago."
 zin_aenor_captains_command:0 "The Captains' Command"
 zin_aenor_captains_command_desc:0 "The captains hold the keys and give the orders. They are better at the second than the first."
 zin_aenor_chancery:0 "The Seals of State"
 zin_aenor_chancery_desc:0 "Scribes in white sort the realm's letters, and no decree leaves Parim without the Deliverer's seal."
 zin_aenor_charters_renewed:0 "The Charters of Parim Renewed"
 zin_aenor_charters_renewed_desc:0 "The old charters are read aloud and sealed afresh. Every dominion is promised its liberties in plain words, and the lords weigh the promise against the King's record."
 zin_aenor_coastal_watch:0 "Watch on the Coasts"
 zin_aenor_coastal_watch_desc:0 "Look-out towers rise on every headland of the western shore, and fishermen are paid to count the sails they see."
 zin_aenor_commissions_by_merit:0 "Commissions by Merit"
 zin_aenor_commissions_by_merit_desc:0 "Officers are chosen by trial and by record, not by purse. Some noble houses are insulted, and the soldiers cheer."
 zin_aenor_commissions_for_sale:0 "Commissions for Sale"
 zin_aenor_commissions_for_sale_desc:0 "Captaincies go to the sons of men who can afford them. The ranks are filled with polished boots and unpractised spears."
 zin_aenor_common_army:0 "The Common Army of the Concord"
 zin_aenor_common_army_desc:0 "Drill-masters of Parim teach the same signals, the same formations and the same marching songs to levies from every dominion."
 zin_aenor_common_army_drill:0 "The Common Army"
 zin_aenor_common_army_drill_desc:0 "Spearmen from every dominion learn the same signals and the same songs. A horn in Selen is understood in Kingson."
 zin_aenor_common_cause:0 "A Common Cause"
 zin_aenor_common_cause_desc:0 "Realms at war with the dark have opened their roads to Aenor, and Aenor has opened hers. Messengers pass freely."
 zin_aenor_common_defence:0 "A Common Defence"
 zin_aenor_common_defence_desc:0 "Dominions pledge spears to a shared host under a marshal chosen by the Speakers. Each keeps its own banner and its own captains."
 zin_aenor_concord_levies:0 "The Concord Levies"
 zin_aenor_concord_levies_desc:0 "Each dominion owes the crown a fixed muster of spears every year. The lords mutter, and the rolls are kept in Parim."
 zin_aenor_concord_of_equals:0 "The Concord of Equals"
 zin_aenor_concord_of_equals_desc:0 "The Free Dominions take the seals of Aenor and declare the Charters of Parim a compact among equals. The crown is a chair at the table, no more."
 zin_aenor_concord_reborn:0 "The Concord Reborn"
 zin_aenor_concord_reborn_desc:0 "The old compact is spoken again at the Council, and this time the lords mean the words. The Middle Kingdom stands as one realm, and says so."
 zin_aenor_concord_renewed:0 "The Concord Reborn"
 zin_aenor_concord_renewed_desc:0 "The old compact has been spoken again and believed. Lords who once sulked now ride to Parim of their own accord."
 zin_aenor_concord_stands:0 "The Concord Stands"
 zin_aenor_concord_stands_desc:0 "The compact has been remade by consent, and the realm hums with the quiet confidence of a thing that wants to last."
 zin_aenor_convene_the_concord:0 "Convene the Concord Council"
 zin_aenor_convene_the_concord_desc:0 "Lords of every dominion take their seats in the long hall at Parim, as their fathers did. They come to be heard, and the King comes to be obeyed."
 zin_aenor_counted_realm:0 "The Birth Rolls"
 zin_aenor_counted_realm_desc:0 "The King now knows how many hands he can call. Recruiting captains no longer need to guess."
 zin_aenor_court_of_accounts:0 "The Court of Accounts"
 zin_aenor_court_of_accounts_desc:0 "A standing bench of auditors may summon any officer of the realm to answer for a missing sum. Theft becomes a risk instead of a custom."
 zin_aenor_crown_blessed:0 "The Blessed Crown"
 zin_aenor_crown_blessed_desc:0 "The people kneel to a crown the temples have anointed, and they find it easier to forgive what it does."
 zin_aenor_crown_kept_for_no_king:0 "A Crown Kept for No King"
 zin_aenor_crown_kept_for_no_king_desc:0 "The crown rests on its cushion in the empty throne room, and the Regency rules in its shadow. No king has been named, and the Golden Court means to keep it so."
 zin_aenor_crown_purse:0 "The Crown's Purse"
 zin_aenor_crown_purse_desc:0 "However the court has managed its gold, the treasury now answers to one purse and one seal. The King spends as he pleases, and knows to the coin what he has."
 zin_aenor_crush_the_pretenders:0 "Crush the Pretenders"
 zin_aenor_crush_the_pretenders_desc:0 "Every rival camp is named an enemy of the crown. Captains with warrants ride to arrest their leaders before the next feast."
 zin_aenor_defence_pact:0 "A Common Defence"
 zin_aenor_defence_pact_desc:0 "A shared host under a chosen marshal, and a shared understanding that an attack on one dominion is an attack on all."
 zin_aenor_deliverance_shield:0 "The Shield of Deliverance"
 zin_aenor_deliverance_shield_desc:0 "Carved wards guard the gates, and the temple guard keeps the towers. Parim feels safe, and will until it learns otherwise."
 zin_aenor_deliverer_crowned:0 "The Deliverer Crowned"
 zin_aenor_deliverer_crowned_desc:0 "The people kneel in the streets as the king passes. Whatever else he is, he is loved."
 zin_aenor_deliverers_relief:0 "The Deliverer's Relief"
 zin_aenor_deliverers_relief_desc:0 "Grain wagons roll from the Houses of the First Light to every hungry dominion. The people name the new king their saviour, and they mean it."
 zin_aenor_denounce_the_impostor:0 "Denounce the Impostor"
 zin_aenor_denounce_the_impostor_desc:0 "A man from the frontier is hailed by common folk as the rightful heir. The Deliverer's heralds declare him a fraud, and the temples ring with the denunciation."
 zin_aenor_dismiss_flatterers:0 "Dismiss the Flatterers"
 zin_aenor_dismiss_flatterers_desc:0 "The courtiers who echo the King's every word are sent back to their estates. The council chamber falls quiet, and for the first time in years someone says no."
 zin_aenor_dragon_banner:0 "The Dragon Banner"
 zin_aenor_dragon_banner_desc:0 "A dragon wheels above the Hailed King's host, and no horse in Aoaz will stand against it. Men who laughed at the old tales stop laughing."
 zin_aenor_drill_fields:0 "The Drill Fields"
 zin_aenor_drill_fields_desc:0 "Wide meadows beside the lake are cleared for the daily drill. Veterans teach shield-wall and volley to recruits who thought a march was a stroll."
 zin_aenor_drilled_regiments:0 "The Drill Fields"
 zin_aenor_drilled_regiments_desc:0 "Recruits drill on the lakeside meadows from first light under cheerfully merciless drill-masters."
 zin_aenor_eastern_caravans:0 "The Eastern Caravans"
 zin_aenor_eastern_caravans_desc:0 "Camel caravans from the far side of the rift sea reach Parim by the salt roads, and the court sends envoys with gifts to greet the caravan masters."
 zin_aenor_equal_tolls:0 "Equal Tolls"
 zin_aenor_equal_tolls_desc:0 "Customs on every road and river are set at one rate, the same for Parim and the smallest dominion. Merchants praise it; old tollkeepers do not."
 zin_aenor_feast_of_the_deliverer:0 "The Feast of the Deliverer"
 zin_aenor_feast_of_the_deliverer_desc:0 "On the longest night every hearth in Aenor lights a white candle, and every temple hall serves bread to all who come. The Deliverer's blessing is spoken in the King's name."
 zin_aenor_final_stand:0 "The Last Stand"
 zin_aenor_final_stand_desc:0 "Every soldier, mason and baker has a post. Nobody asks if the city can be held, because nobody intends to ask what happens if it cannot."
 zin_aenor_first_light_houses:0 "The Houses of the First Light"
 zin_aenor_first_light_houses_desc:0 "Hospitals, granaries and birth rolls, kept by the temples and trusted by the people. Whoever holds the keys holds the realm's gratitude."
 zin_aenor_first_of_his_name:0 "First of His Name"
 zin_aenor_first_of_his_name_desc:0 "The Deliverer takes the crown of Aenor in the great temple of Parim, under the name of Aurevan, and the bells ring for three days. Old men weep at the gates; children are lifted to see him pass."
 zin_aenor_fleet_of_the_lake:0 "The Lake Fleet"
 zin_aenor_fleet_of_the_lake_desc:0 "Broad-beamed galleys patrol the lake in long lines, drilled in oar-signals and fire-pot drill."
 zin_aenor_fortress_parim:0 "Fortress Parim"
 zin_aenor_fortress_parim_desc:0 "The palace hill is ringed in stone, the lake gate chained, the cisterns filled. Parim has not known a siege in seventeen centuries."
 zin_aenor_friends_in_the_east:0 "Friends in the East"
 zin_aenor_friends_in_the_east_desc:0 "Gifts and letters go to the courts of Noris, Stabilo and Alerhia, with the Deliverer's blessing and no demands attached. The gifts are generous."
 zin_aenor_frontier_companies:0 "The Frontier Companies"
 zin_aenor_frontier_companies_desc:0 "Rangers, scouts and ex-soldiers are given the King's coin and sent to watch the borders where the maps run out. Few of them are in it for the banners."
 zin_aenor_gilded_halls:0 "Gild the Halls of Parim"
 zin_aenor_gilded_halls_desc:0 "Gold leaf for the pillars, silver for the stair-rails, mirrors for the vaults. The city shines and the court is pleased, and its debts grow with the glitter."
 zin_aenor_gilded_parim:0 "Gilded Parim"
 zin_aenor_gilded_parim_desc:0 "Gold leaf glitters on every pillar of the capital. The city has never looked richer, and the people have never felt more pleased with their King."
 zin_aenor_glo_light:0 "The Light of Glo"
 zin_aenor_glo_light_desc:0 "A green glow in the van of the host. Men say it is hope. The dark things say nothing."
 zin_aenor_gold_for_the_dominions:0 "Gold for the Dominions"
 zin_aenor_gold_for_the_dominions_desc:0 "The treasury opens to the dominion lords one last time. Those who take the coin swear to the Regency; those who refuse are remembered."
 zin_aenor_gold_regency:0 "The Regency of Gold"
 zin_aenor_gold_regency_desc:0 "The Golden Court rules in the name of a crown nobody wears. Gold buys loyalty, and the court spends freely."
 zin_aenor_golden_charters:0 "The Golden Charters"
 zin_aenor_golden_charters_desc:0 "Privileges are sold to the dominion lords: tolls, mills and the right to hold their own courts. The Concord grows rich, and loyalty is for sale to the highest bidder."
 zin_aenor_golden_guard:0 "The Golden Guard"
 zin_aenor_golden_guard_desc:0 "Two thousand picked men in gilded helms are quartered in the palace barracks. They cost a fortune, and they look splendid at the gate."
 zin_aenor_golden_jubilee:0 "The Golden Jubilee"
 zin_aenor_golden_jubilee_desc:0 "Fifty days of feasting honour the long reign. Bells ring in every dominion, and nobody counts the cost until the lamps burn down."
 zin_aenor_golden_king_reborn:0 "The Golden King Reborn"
 zin_aenor_golden_king_reborn_desc:0 "The man who sold his offices is gone. In his place sits a king who has looked at his own death and learned what it is worth."
 zin_aenor_golden_tribute:0 "The Golden Tribute"
 zin_aenor_golden_tribute_desc:0 "Heralds ride out to name the sum each dominion owes the throne. The coffers swell; the lords pay, and remember."
 zin_aenor_great_lake_ports:0 "The Great Lake Ports"
 zin_aenor_great_lake_ports_desc:0 "The Lake is Aenor's road and its larder. New quays, chain-booms and harbour-lights make its ports the busiest water in the Middle Lands."
 zin_aenor_great_wall:0 "The Great Wall of Aenor"
 zin_aenor_great_wall_desc:0 "From the Organ Mountains to the gate at Kingson the Wall stands, as it has since the Wall Accord. Its towers are repaired and its ditches dug afresh."
 zin_aenor_guard_of_gold:0 "The Golden Guard"
 zin_aenor_guard_of_gold_desc:0 "Two thousand picked spears in gilded helms hold the palace gates, and every one of them knows his name is on the roll."
 zin_aenor_guild_halls:0 "The Guild Halls"
 zin_aenor_guild_halls_desc:0 "Each craft builds its own hall of carved timber and keeps its own rolls of masters. Apprentices travel from far shores to be bound there."
 zin_aenor_hold_parim:0 "Hold Parim for the Crown"
 zin_aenor_hold_parim_desc:0 "The war has come to the lake. Every gate of the capital is walled, every tower manned and every bell readied to ring when the enemy is seen."
 zin_aenor_hold_the_western_shore:0 "Hold the Western Shore"
 zin_aenor_hold_the_western_shore_desc:0 "The coast is lined with new forts, all facing the sea. Fishermen are paid to watch, and signal-masters are posted on every headland."
 zin_aenor_honest_accounts:0 "Honest Accounts"
 zin_aenor_honest_accounts_desc:0 "Every sum that enters or leaves the treasury is written in an open ledger. It is slow, and it is clean."
 zin_aenor_honest_ledgers:0 "Honest Ledgers"
 zin_aenor_honest_ledgers_desc:0 "Every purse that passes the treasury door is written in a book that any lord may read. The court grumbles; the tax-gatherers sleep better."
 zin_aenor_honorary_crowns:0 "Honorary Crowns"
 zin_aenor_honorary_crowns_desc:0 "Far courts are offered a place in the league as honorary members. It costs the King only a few ribbons, and it may buy a friend who matters."
 zin_aenor_host_of_the_king:0 "The King's Host"
 zin_aenor_host_of_the_king_desc:0 "Heavy foot, horse and archers wear the lake colours and march to one horn."
 zin_aenor_houses_of_the_first_light:0 "The Houses of the First Light"
 zin_aenor_houses_of_the_first_light_desc:0 "Hospitals, grain stores and birth rolls, kept by the temples and open to all. No one in Aenor remembers when the realm did without them."
 zin_aenor_jubilee_celebrations:0 "The Golden Jubilee"
 zin_aenor_jubilee_celebrations_desc:0 "Bonfires, banquets and bell-ringing for the long reign. For a season the whole realm is at festival."
 zin_aenor_king_without_a_house:0 "The King Without a House"
 zin_aenor_king_without_a_house_desc:0 "He has no palace, no treasury and no crown, only a following of rangers, scholars and plain folk who believe he is their king. They call him the Hailed King."
 zin_aenor_kingdom_of_plenty:0 "A Kingdom of Plenty"
 zin_aenor_kingdom_of_plenty_desc:0 "Granaries are full, the roads are busy and the guilds are fat. For a season it seems that nothing in Aenor could ever go wrong."
 zin_aenor_kingdom_of_ruins:0 "A Kingdom of Ruins"
 zin_aenor_kingdom_of_ruins_desc:0 "Half the realm is rubble and the other half is scaffolding. Builders are everywhere, and so is dust."
 zin_aenor_kingdoms_armouries:0 "The Kingdom's Armouries"
 zin_aenor_kingdoms_armouries_desc:0 "When the crown calls its banners, the armouries are thrown open and every smith in the realm turns to the forge."
 zin_aenor_kings_awakening:0 "The King Awakes"
 zin_aenor_kings_awakening_desc:0 "The King has smelled the poison and understood what it meant. He is sharp, wary and, for the first time in years, truly king."
 zin_aenor_kings_host:0 "The King's Host"
 zin_aenor_kings_host_desc:0 "When the King raises his standard, the Host answers: heavy foot, horse and archers in the colours of the lake. It will be a sight to see, and a worse one to face."
 zin_aenor_kings_league:0 "The King's League"
 zin_aenor_kings_league_desc:0 "Banners of the Lost Cause are raised above the palace court. It is a league of fine robes and grand words, and the King is its most devoted member."
 zin_aenor_kings_own_counsel:0 "The King's Own Counsel"
 zin_aenor_kings_own_counsel_desc:0 "The King reminds his councillors that he alone appoints them. The temples bow, smile and remain exactly where they were."
 zin_aenor_kings_war:0 "The King's War"
 zin_aenor_kings_war_desc:0 "The sovereign is in the field with his own banner. The Host remembers what it is for."
 zin_aenor_kingson_gate:0 "The Gate of Kingson"
 zin_aenor_kingson_gate_desc:0 "The gate in the Great Wall is rebuilt in dressed stone, with towers on either side and a portcullis that three men can raise."
 zin_aenor_lake_fleet:0 "The Lake Fleet"
 zin_aenor_lake_fleet_desc:0 "A fleet of galleys keeps the lake lanes clear of smugglers and the shores clear of rumour. Its captains are proud and expensive."
 zin_aenor_lake_levy:0 "The Levy of the Lake"
 zin_aenor_lake_levy_desc:0 "One man in three has taken spear and shield. The villages are quiet and the barracks are loud."
 zin_aenor_lake_shipwrights:0 "Lake Shipwrights"
 zin_aenor_lake_shipwrights_desc:0 "Yards along the shore lay keels for broad, shallow ships that no sea captain would trust and no lake captain would be without."
 zin_aenor_last_alliance:0 "The Last Alliance of Men"
 zin_aenor_last_alliance_desc:0 "Banners from the whole of the north and west stand under one king. The host is large, and for once, it is united."
 zin_aenor_last_stand:0 "The Last Stand of the Middle Kingdom"
 zin_aenor_last_stand_desc:0 "If the Middle Kingdom falls, it will fall at Parim. Every soldier, mason and baker takes a post, and the lake gate is sealed."
 zin_aenor_league_of_free_crowns:0 "The League of Free Crowns"
 zin_aenor_league_of_free_crowns_desc:0 "Letters go to Mirolon, Lerendor and Gunwaith. The Concord of Equals has no ambitions beyond its borders, and wishes its neighbours to know it."
 zin_aenor_league_of_the_king:0 "The King's League"
 zin_aenor_league_of_the_king_desc:0 "Banner, oath and gilt mail: the Lost Cause has its own hall, its own colours and a king who loves to preside."
 zin_aenor_learned_halls:0 "The Universities"
 zin_aenor_learned_halls_desc:0 "The halls of Parim and Selen share their masters and their books, and learning moves briskly between them."
 zin_aenor_ledger_of_heirs:0 "The Ledger of Heirs"
 zin_aenor_ledger_of_heirs_desc:0 "Heralds open the great rolls and read the names of the royal house aloud. The Regency must find a name to rule for, and few are free of suspicion."
 zin_aenor_letters_to_the_free:0 "Letters to the Free Dominions"
 zin_aenor_letters_to_the_free_desc:0 "Messengers carry an offer to each dominion that left the Concord: return under a Free Charter, or stay free and be a friend."
 zin_aenor_levies_of_the_concord:0 "The Concord Levies"
 zin_aenor_levies_of_the_concord_desc:0 "Each dominion keeps its quota of spears on the rolls, drilled by the village reeve and ready on the King's word."
 zin_aenor_levy_of_the_lake:0 "The Levy of the Lake"
 zin_aenor_levy_of_the_lake_desc:0 "Every village on the lake is told to send one man in three. They come, and the barracks of the capital overflow."
 zin_aenor_light_of_glo:0 "The Light of Glo"
 zin_aenor_light_of_glo_desc:0 "A green light burns in the Hailed King's hand. Men who see it grow quiet, and the dark things that watch the host draw back."
 zin_aenor_lost_cause_reborn:0 "The Lost Cause Reborn"
 zin_aenor_lost_cause_reborn_desc:0 "The league is no longer the King's plaything. Its banners follow a stranger, and its companies at last fight for something they believe in."
 zin_aenor_market_charters:0 "Market Charters"
 zin_aenor_market_charters_desc:0 "The King grants a fair to every town that asks, and takes a tenth of what is sold. More towns ask than anyone expected."
 zin_aenor_men_of_selen:0 "The Men of Selen"
 zin_aenor_men_of_selen_desc:0 "The rangers of Selen ride beneath the Hailed King's banner. Selen has waited a long time for a king who deserved it."
 zin_aenor_merchant_houses:0 "The Merchant Houses"
 zin_aenor_merchant_houses_desc:0 "The great trading houses of the lake keep their own agents at court and their own wharves in every port."
 zin_aenor_merchant_princes:0 "The Merchant Princes"
 zin_aenor_merchant_princes_desc:0 "The great houses of the Lake pay handsomely for their charters, and the King lets them write the tariffs in return. Wealth follows, and so do favours."
 zin_aenor_merit_commissions:0 "Commissions by Merit"
 zin_aenor_merit_commissions_desc:0 "Officers rise on trial and record. Noble sons grumble, and the rank and file feel they are worth something."
 zin_aenor_merovans_seals:0 "The Keeper's Seals"
 zin_aenor_merovans_seals_desc:0 "Merovan, who holds the seals of the realm, is given a hall of his own beside the throne room. Letters of state now reach the King by way of his table."
 zin_aenor_merovans_seals_tip_1:0 "Merovan, Keeper of the Seals, gains authority in the King's council."
 zin_aenor_middle_kingdom_concord:0 "The Middle Kingdom Concord"
 zin_aenor_middle_kingdom_concord_desc:0 "Aenor and her twenty-six chartered dominions are one realm in law and many in custom. The Charters of Parim bind them; the King's heralds remind them."
 zin_aenor_mobilise_the_realm:0 "Mobilise the Realm"
 zin_aenor_mobilise_the_realm_desc:0 "Beacons burn from the Wall to the lake, and every dominion is bidden to send its men. Aenor goes to war as it has not in generations."
 zin_aenor_new_doctrine:0 "A New Doctrine of War"
 zin_aenor_new_doctrine_desc:0 "Marshals of the old school argue with young captains over the lessons of the frontier. The King listens to both and decides for neither, so both are heard."
 zin_aenor_no_crown_by_force:0 "No Crown Taken by Force"
 zin_aenor_no_crown_by_force_desc:0 "The King Without a House will not take any dominion's loyalty at sword-point. Charters are offered freely, and the dominions are asked to come as friends."
 zin_aenor_oaths_of_the_lost_cause:0 "The Oaths of the Lost Cause"
 zin_aenor_oaths_of_the_lost_cause_desc:0 "The King's league against the powers of the dark was sworn in 4A 1741, on the steps of the palace. Now its oaths are renewed before the lords of the realm, and nobody laughs."
 zin_aenor_oaths_of_the_realm:0 "The Oaths of the Realm"
 zin_aenor_oaths_of_the_realm_desc:0 "Every lord, captain and magistrate kneels in the temple to swear fealty to the Deliverer's crown. The oaths are written in a book that is kept under lock."
 zin_aenor_offices_for_sale:0 "Offices for Sale"
 zin_aenor_offices_for_sale_desc:0 "Anything in the realm with a seal on it can be bought, and the buyers expect to be repaid."
 zin_aenor_old_genealogies:0 "The Old Genealogies"
 zin_aenor_old_genealogies_desc:0 "Heralds copy out the great houses' lines of descent, back to the First Men and the first charters. Old claims are found, and some old names are forgotten for good reason."
 zin_aenor_one_faith_one_realm:0 "One Faith, One Realm"
 zin_aenor_one_faith_one_realm_desc:0 "The King decrees that the Deliverer's rites shall be kept in every dominion. The temples are glad, the Concord is quiet, and a few old shrines go dark."
 zin_aenor_open_temple_vaults:0 "Open the Temple Vaults"
 zin_aenor_open_temple_vaults_desc:0 "The temples' treasuries are broken open and counted. The gold goes to arms, the grain to the hungry and the ledgers to the archives."
 zin_aenor_opinion_envoys_received:0 "Envoys Received Warily"
 zin_aenor_opinion_envoys_welcomed:0 "Envoys Welcomed"
 zin_aenor_opinion_gifts_accepted:0 "Gifts Accepted"
 zin_aenor_opinion_gifts_refused:0 "Gifts Refused"
 zin_aenor_opinion_honorary_crown:0 "Honorary Crown Accepted"
 zin_aenor_opinion_southern_aid:0 "Aid from the Middle Kingdom"
 zin_aenor_own_counsel:0 "The King's Own Counsel"
 zin_aenor_own_counsel_desc:0 "The King chooses his councillors himself, and cannot always tell which of them chose him."
 zin_aenor_pacify_bloody_forest:0 "Pacify the Bloody Forest"
 zin_aenor_pacify_bloody_forest_desc:0 "The Bloody Forest has never accepted the crown, and its raiders have never stopped trying the borders of the Concord. The Golden Guard is sent to teach it manners."
 zin_aenor_peace_of_treaties:0 "Treaties, Not Conquest"
 zin_aenor_peace_of_treaties_desc:0 "The King sends heralds before he sends spears. Neighbours have noticed, and some have begun to answer."
 zin_aenor_peoples_of_the_concord:0 "The Peoples of the Concord"
 zin_aenor_peoples_of_the_concord_desc:0 "Kilinti's ents, the giants of Hiloron and the riders of Hunhun are invited to Parim as guests, not subjects. Their long memory is worth more than tribute."
 zin_aenor_poison_in_the_cup:0 "Poison in the Cup"
 zin_aenor_poison_in_the_cup_desc:0 "A taster falls ill on a cup meant for the King. The court whispers of poison, and for the first time in years the King listens to a voice other than his own."
 zin_aenor_popular_host:0 "The Popular Host"
 zin_aenor_popular_host_desc:0 "Rangers, scholars and ploughmen march under one banner. They are poorly equipped and tremendously sure."
 zin_aenor_proof_of_blood:0 "Proof of Blood"
 zin_aenor_proof_of_blood_desc:0 "A man from the frontier carries a line of descent that the heralds cannot fault. Whoever stands behind him will want his claim made plain."
 zin_aenor_rangers_of_selen:0 "The Rangers of Selen"
 zin_aenor_rangers_of_selen_desc:0 "The rangers of Selen are asked to lend their skills to the Lost Cause. They answer that the wild does not take orders, and then they come anyway."
 zin_aenor_realm_beset:0 "Aenor Beset"
 zin_aenor_realm_beset_desc:0 "The realm is attacked on every side. Every wall is manned, every road watched, and every heart a little harder."
 zin_aenor_realm_mobilised:0 "The Realm Mobilised"
 zin_aenor_realm_mobilised_desc:0 "Beacons burn, bells ring and every village sends its men. Aenor is on a war footing."
 zin_aenor_realm_of_plenty:0 "A Kingdom of Plenty"
 zin_aenor_realm_of_plenty_desc:0 "Barns brim and workshops hum. Builders find timber and journeymen where a few years ago they found excuses."
 zin_aenor_reform_the_court:0 "Reform the Court"
 zin_aenor_reform_the_court_desc:0 "Gilded fittings are sold, sinecures struck from the rolls and the court's hours given back to the kingdom's business. Those it used to feed will not forgive it."
 zin_aenor_regency_of_gold:0 "The Regency of Gold"
 zin_aenor_regency_of_gold_desc:0 "The throne stands empty and the Golden Court rules in its name. The seals are kept in a gilded casket, and every decree begins with the words \"For the crown\"."
 zin_aenor_regency_war_chest:0 "The Treasury of War"
 zin_aenor_regency_war_chest_desc:0 "The Regency's hoard has been turned to iron and timber. The forges of the lake never cool."
 zin_aenor_restore_by_force:0 "Restore the Charters by Force"
 zin_aenor_restore_by_force_desc:0 "Those who left the Concord will be brought back by the Speakers' orders, and by the Host if need be. The Charters, after all, are law."
 zin_aenor_retake_parim:0 "Retake Parim"
 zin_aenor_retake_parim_desc:0 "The capital lies in the hands of the western host. The King Without a House marches to take it back, street by street if he must."
 zin_aenor_roads_of_parim:0 "The Roads of Parim"
 zin_aenor_roads_of_parim_desc:0 "Paved ways run from the palace gate to every dominion that owes the crown a tithe. Wagons that took a fortnight now take a week."
 zin_aenor_royal_almoners:0 "The Royal Almoners"
 zin_aenor_royal_almoners_desc:0 "Almoners with the temples' badge walk the poorer quarters of Parim each dawn, and the poor bless a crown that seems to care."
 zin_aenor_royal_army:0 "The Royal Army of Aenor"
 zin_aenor_royal_army_desc:0 "The King's host is the strongest in the Middle Lands, and he keeps it sharp. It parades at every feast and has not yet been asked to fight."
 zin_aenor_royal_auditors:0 "The Royal Auditors"
 zin_aenor_royal_auditors_desc:0 "Auditors in grey robes walk the offices of the realm with their rods and their ink. Clerks have learned to check their sums twice."
 zin_aenor_royal_envoys:0 "Royal Envoys to the Dominions"
 zin_aenor_royal_envoys_desc:0 "Heralds with the King's seal travel to every dominion court, and return with the true measure of each lord's loyalty written in a sealed roll."
 zin_aenor_royal_foundries:0 "The Royal Foundries"
 zin_aenor_royal_foundries_desc:0 "Furnaces ring the lake-towns, smelting iron for plough, nail and blade. The smoke is thick, and the King's smiths are paid in full."
 zin_aenor_royal_mint:0 "The Royal Mint"
 zin_aenor_royal_mint_desc:0 "New dies, true weights and an assay no clerk can bribe. Coin from Parim rings clear in every market again."
 zin_aenor_royal_triumph:0 "A Royal Triumph"
 zin_aenor_royal_triumph_desc:0 "Banners, drums and a procession from the lake gate to the palace steps. The crowds cheer a king whose battles are always won by someone else."
 zin_aenor_sale_of_offices:0 "The Sale of Offices"
 zin_aenor_sale_of_offices_desc:0 "Seals, tolls and captaincies go to whoever bids highest. The treasury fills at once, and the honest begin to leave the court."
 zin_aenor_scholars_of_the_cause:0 "The Scholars of the Cause"
 zin_aenor_scholars_of_the_cause_desc:0 "Loremasters at Parim and Selen are paid to search the old records for whatever the dark powers did before, and how they were stopped."
 zin_aenor_sea_routes:0 "Trade Across the Sea"
 zin_aenor_sea_routes_desc:0 "Aenoran cogs call at harbours from the Ocean of Peace to the western isles, and foreign merchants know the lake colours."
 zin_aenor_sea_trade:0 "Trade Across the Sea"
 zin_aenor_sea_trade_desc:0 "Aenoran cogs carry lake grain and Parim cloth out to the central sea, and come back with spice, glass and gossip from lands the court has never seen."
 zin_aenor_seals_of_government:0 "The Seals of State"
 zin_aenor_seals_of_government_desc:0 "A new chancery is founded in the palace, with scribes in white and seals of silver. Every decree of the realm now passes beneath the Deliverer's eye."
 zin_aenor_seize_the_ledgers:0 "Seize the Houses' Ledgers"
 zin_aenor_seize_the_ledgers_desc:0 "Royal officers enter the Houses of the First Light and carry off every roll and tally. The temples protest, loudly, and the ledgers are read aloud in open court."
 zin_aenor_selen_accord:0 "An Accord with Selen"
 zin_aenor_selen_accord_desc:0 "Selen's rangers hold the frontier and owe Parim little love. A written accord, signed in the green hall of Selen, offers them honour in place of orders."
 zin_aenor_send_for_the_stranger:0 "Send for the Stranger"
 zin_aenor_send_for_the_stranger_desc:0 "The captains have heard of a man from the frontier whom the common folk hail as their king. They send riders to find him and ask him to come."
 zin_aenor_shield_of_deliverance:0 "The Shield of Deliverance"
 zin_aenor_shield_of_deliverance_desc:0 "Wards are carved above the gates of Parim, and the temple guard is posted in every tower. The Deliverer's city will not be taken."
 zin_aenor_shield_of_the_concord:0 "The Shield of the Concord"
 zin_aenor_shield_of_the_concord_desc:0 "The Lost Cause stops being an ornament. Companies in the field, stores on the frontier and a charter of shields for every dominion that will take one."
 zin_aenor_silence_the_dissenters:0 "Silence the Dissenters"
 zin_aenor_silence_the_dissenters_desc:0 "Lords and captains who question the new reign are called to the temple and spoken to kindly. Most of them stop questioning."
 zin_aenor_sobered_king:0 "A Sobered King"
 zin_aenor_sobered_king_desc:0 "The King has stopped gilding his halls. He listens, he decides and the realm feels the difference."
 zin_aenor_son_of_ein:0 "The Hailed King's Claim"
 zin_aenor_son_of_ein_desc:0 "The line of Aen did not end with the Golden Court. The heralds have found the proof, and a stranger from the frontier carries it in his blood."
 zin_aenor_southern_warnings:0 "Heed the Southern Warnings"
 zin_aenor_southern_warnings_desc:0 "Mirolon's envoy brought word of the Ember Lands in 4A 1736 and was laughed out of the hall. Perhaps the archive still holds his letters."
 zin_aenor_speakers_concord:0 "The Speakers' Council"
 zin_aenor_speakers_concord_desc:0 "Each dominion speaks with one voice and one vote. Debates are long, and the decisions are respected."
 zin_aenor_speakers_council:0 "The Speakers' Council"
 zin_aenor_speakers_council_desc:0 "Each dominion sends a speaker with a single voice. The council meets in the open hall and votes by raised hands, and the loudest do not always win."
 zin_aenor_strait_fortresses:0 "Fortresses on the Strait"
 zin_aenor_strait_fortresses_desc:0 "The narrow waters between Aenor and the Dark Lands are lined with stone keeps, each with its own chain, harbour and fire-pit."
 zin_aenor_sworn_realm:0 "The Oaths of the Realm"
 zin_aenor_sworn_realm_desc:0 "Every lord has knelt, every captain has sworn. The oaths are kept in a book in the temple vault."
 zin_aenor_temple_and_crown:0 "Temple and Crown"
 zin_aenor_temple_and_crown_desc:0 "Altar and throne are joined: the temples sit in the council, and the crown shelters the temples. Few remember a time it was otherwise."
 zin_aenor_temple_scholars:0 "The Temple Schools"
 zin_aenor_temple_scholars_desc:0 "The temples teach the young their letters and their prayers in one lesson."
 zin_aenor_temple_schools:0 "The Temple Schools"
 zin_aenor_temple_schools_desc:0 "Children of every rank learn their letters under the temple roofs. The teachers are kind, patient and thoroughly sure of what a child should believe."
 zin_aenor_temples_of_the_deliverer:0 "The Temples of the Deliverer"
 zin_aenor_temples_of_the_deliverer_desc:0 "In every town of the Middle Kingdom the white-stoned temples of the Deliverer give bread, medicine and counsel. The King favours them; his people love them."
 zin_aenor_the_captains_rule:0 "The Captains' Rule"
 zin_aenor_the_captains_rule_desc:0 "The captains of the Host take the keys of the capital. They have never ruled before, and they intend to do it briefly."
 zin_aenor_the_concord_stands:0 "The Concord Stands"
 zin_aenor_the_concord_stands_desc:0 "The old compact has been remade by consent, and it is stronger for it. Aenor and its dominions keep their charters, their quarrels and their peace."
 zin_aenor_the_fourth_age_ends:0 "The Fourth Age Ends"
 zin_aenor_the_fourth_age_ends_desc:0 "A king crowned among ruins, a realm that must learn to live in peace. The chroniclers will write that the Fourth Age ended here, and will not yet know what it cost."
 zin_aenor_the_golden_court:0 "The Golden Court"
 zin_aenor_the_golden_court_desc:0 "Seventeen centuries of the crown have gilded Parim until its halls outshine the lake. The King holds court at the water's edge, and every petitioner pays for the privilege of being heard."
 zin_aenor_the_hidden_hand:0 "The Hidden Hand"
 zin_aenor_the_hidden_hand_desc:0 "Appointments to the great offices follow a pattern that no king set. Whoever is drawing it knows the court better than the King does."
 zin_aenor_the_kings_tasters:0 "The King's Tasters"
 zin_aenor_the_kings_tasters_desc:0 "Every dish that reaches the King's table is first sampled by a trusted servant. The cooks are nervous, the King is amused and the physicians are quietly relieved."
 zin_aenor_the_kings_war:0 "The King's War"
 zin_aenor_the_kings_war_desc:0 "The Council's friends have taken up arms. The King, sobered and furious, rides out at the head of his Host."
 zin_aenor_the_last_alliance:0 "The Last Alliance of Men"
 zin_aenor_the_last_alliance_desc:0 "Banners of the Middle Lands, the Cold Lands and the western clans stand together under the Hailed King. It is the largest muster of men since the Grand Alliance."
 zin_aenor_the_loyal_clergy:0 "The Loyal Clergy"
 zin_aenor_the_loyal_clergy_desc:0 "Priests who served the crown before the Deliverer's temples filled the city are brought back to the great altar. They preach obedience to the King, and the people hear them out."
 zin_aenor_the_people_choose:0 "The People Choose Their King"
 zin_aenor_the_people_choose_desc:0 "In the ruins of the lake gate the people raise their hands. They ask for the Hailed King, and he, at last, says yes."
 zin_aenor_the_southern_front:0 "The Southern Front"
 zin_aenor_the_southern_front_desc:0 "Companies from the southern marches rally at Mirolon's passes. The Ember Lands are no longer a rumour but a border."
 zin_aenor_the_strait_betrayed:0 "The Strait Betrayed"
 zin_aenor_the_strait_betrayed_desc:0 "The north shore is no longer a friend. Lerendor has left the old treaty, and the narrow waters must be guarded as a frontier."
 zin_aenor_the_wall_holds:0 "The Wall Holds"
 zin_aenor_the_wall_holds_desc:0 "From the Organ Mountains to Kingson the watchfires burn. The Wall has been breached before, and every man on it knows the story."
 zin_aenor_treasury_of_war:0 "The Treasury of War"
 zin_aenor_treasury_of_war_desc:0 "The Regency pours its hoard into forges and storehouses. The gold of seventeen centuries becomes spears."
 zin_aenor_treaties_not_conquest:0 "Treaties, Not Conquest"
 zin_aenor_treaties_not_conquest_desc:0 "Heralds ride to every realm still at war with Aenor with the same offer: peace now, on equal terms. The King wants no more enemies."
 zin_aenor_tribute_roads:0 "The Tribute Roads"
 zin_aenor_tribute_roads_desc:0 "Tribute wagons rumble towards Parim on new causeways, and the dominions learn exactly how far the King's hand can reach."
 zin_aenor_triumph_of_the_league:0 "A Triumph for the League"
 zin_aenor_triumph_of_the_league_desc:0 "A procession of knights in gilt mail winds through the capital to honour the Lost Cause. The people throw flowers, and the ledgers throw up a sum."
 zin_aenor_universities:0 "The Universities of Parim and Selen"
 zin_aenor_universities_desc:0 "The old halls of learning are endowed anew. Scholars of Parim and Selen share their books, and their quarrels, across the whole Middle Kingdom."
 zin_aenor_wall_charter:0 "The Wall Charter"
 zin_aenor_wall_charter_desc:0 "Kingson, who keeps the gate in the Great Wall, is granted a charter of its own: freedom from tolls in return for an unbroken watch."
 zin_aenor_wall_garrisons:0 "Garrisons of the Wall"
 zin_aenor_wall_garrisons_desc:0 "Companies are quartered in the towers along the Wall, and relieved each season. Kingson's lords send wine for the watch."
 zin_aenor_wall_watch:0 "Watchers on the Wall"
 zin_aenor_wall_watch_desc:0 "Beacon-keepers and signal-masters sleep in the towers, and their lamps are lit before dusk."
 zin_aenor_watchers_on_the_wall:0 "Watchers on the Wall"
 zin_aenor_watchers_on_the_wall_desc:0 "Beacon-keepers are posted every league along the Great Wall, with signal fires laid and ready. They watch the east and the south and pray to see nothing."
 zin_aenor.500.a:0 "Gild the tables."
 zin_aenor.500.b:0 "A modest board will do."
 zin_aenor.500.d:0 "The steward of the household asks how the high table is to be laid. Three hundred guests will sit before the lamps are lit, and every one of them has sent a gift."
 zin_aenor.500.t:0 "A Feast in the Golden Court"
 zin_aenor.501.a:0 "Publish it in open court."
 zin_aenor.501.b:0 "Keep it in the royal archive."
 zin_aenor.501.d:0 "The auditors lay their finished ledger before the throne. It lists every gift, bribe and borrowed seal of the last ten years, and it runs to nine volumes."
 zin_aenor.501.t:0 "The Auditors' Ledger"
 zin_aenor.502.a:0 "Welcome them with open doors."
 zin_aenor.502.b:0 "Receive them, and watch them."
 zin_aenor.502.d:0 "Envoys from the Middle Kingdom have crossed the rift sea with silks, glass and the Golden King's greeting. They ask nothing but a place at the caravan masters' feast."
 zin_aenor.502.t:0 "Envoys from Parim"
 zin_aenor.503.a:0 "Accept the accord."
 zin_aenor.503.b:0 "Ask for more."
 zin_aenor.503.d:0 "A rider in Aenor's gold reaches the green hall of Selen with a scroll under the King's seal. It offers the rangers honour and relief from tolls in exchange for friendship, which is more than Parim has offered in a generation."
 zin_aenor.503.t:0 "An Accord with Parim"
 zin_aenor.504.a:0 "Accept the honour."
 zin_aenor.504.b:0 "Decline politely."
 zin_aenor.504.d:0 "A herald in the King's livery presents a crown of gilded iron and a scroll naming this realm an honorary member of the Lost Cause. It is a gift of ribbons and ceremony, and it carries the King's friendship."
 zin_aenor.504.t:0 "An Honour from Parim"
 zin_aenor.505.a:0 "Let the banners fly."
 zin_aenor.505.d:0 "Knights in gilt mail wind through the capital beneath the banners of the Lost Cause. The people throw flowers, the heralds shout the old oaths, and the treasury quietly pays for all of it."
 zin_aenor.505.t:0 "A Triumph for the League"
 zin_aenor.506.a:0 "Send rangers."
 zin_aenor.506.b:0 "Keep them home."
 zin_aenor.506.d:0 "The King's letter asks Selen to lend its rangers to the Lost Cause. The captains of Selen read it aloud in the green hall, and the room is divided between pride and suspicion."
 zin_aenor.506.t:0 "The Rangers Answer"
 zin_aenor.507.a:0 "Dismiss them as fishermen's tales."
 zin_aenor.507.b:0 "Send a ship north to look."
 zin_aenor.507.d:0 "Fishermen on the western coast tell of black hulls that move without wind and show lanterns of the wrong colour. The harbour-master wants to know whether the King's court will listen."
 zin_aenor.507.t:0 "The Black Ships"
 zin_aenor.508.a:0 "Laugh, as the court did before."
 zin_aenor.508.b:0 "Listen at last."
 zin_aenor.508.d:0 "In 4A 1736 an envoy from Mirolon came to Parim with a warning about the Ember Lands, and the court laughed. The archive still holds his letters, and someone has begun to read them."
 zin_aenor.508.t:0 "Warnings from the South"
 zin_aenor.509.a:0 "Mark the pattern, and say nothing."
 zin_aenor.509.d:0 "In the long evenings the King's clerks lay the rolls of appointments side by side. Whoever filled the great offices of the realm did so with a patience and a purpose no courtier ever showed. It is hard to say whose hand it is, and harder to stop asking."
 zin_aenor.509.t:0 "The Hidden Hand"
 zin_aenor.510.a:0 "Let the choir sing."
 zin_aenor.510.d:0 "On the longest night every hearth in Aenor lights a white candle, and the temple halls serve bread to all who come. In the great hall of the Houses of the First Light the choir sings until dawn."
 zin_aenor.510.t:0 "The Feast of the Deliverer"
 zin_aenor.511.a:0 "Rule in the crown's name."
 zin_aenor.511.b:0 "Search the old rolls for an heir."
 zin_aenor.511.d:0 "For thirty days the throne has been empty. The Regency's clerks open the great rolls and read out the names of the royal house, and the court argues over who may be named and who may be safely forgotten."
 zin_aenor.511.t:0 "The Ledger of Heirs"
 zin_aenor.512.a:0 "Accept the gifts."
 zin_aenor.512.b:0 "Refuse them."
 zin_aenor.512.d:0 "A new king in Aenor sends his greeting across the rift sea: caskets of gold, bolts of white cloth and a letter that asks for nothing. The court of the East turns the letter over and over."
 zin_aenor.512.t:0 "Gifts from Parim"
 zin_aenor.513.a:0 "March with the Hailed King."
 zin_aenor.513.b:0 "Guard Selen first."
 zin_aenor.513.d:0 "The rangers have heard the Hailed King speak, and they are of one mind. The captains ask only whether Selen marches now or after the border is safe."
 zin_aenor.513.t:0 "The Men of Selen"
 zin_aenor.514.a:0 "Accept the arms."
 zin_aenor.514.b:0 "Decline."
 zin_aenor.514.d:0 "A column of Aenoran wagons halts at the Mirolon passes, bearing spears and shields from the arsenals of Parim. The captain says only that the court has remembered a warning it once laughed at."
 zin_aenor.514.t:0 "Aid from Aenor"
 zin_aenor.515.a:0 "Decline for now."
 zin_aenor.515.b:0 "Join the league."
 zin_aenor.515.d:0 "The Speakers of the Concord of Equals write to your court. Aenor has no wish to rule beyond its borders, but it asks you to stand beside it against the powers of the dark."
 zin_aenor.515.t:0 "The League of Free Crowns"
 zin_aenor.516.a:0 "Accept peace."
 zin_aenor.516.b:0 "Fight on."
 zin_aenor.516.d:0 "A herald in the new king's colours stands at your gate. The King of Aenor offers peace on equal terms, with no tribute asked and no land taken."
 zin_aenor.516.t:0 "Treaties, Not Conquest"
 zin_aenor.517.a:0 "So the age ends."
 zin_aenor.517.d:0 "The bells of Parim ring for three days. A king has been crowned among the ruins, and the heralds cry that the Fourth Age is over. He wears a necklace of black stone about his throat, which the chroniclers describe and do not explain. What it costs him is not known."
 zin_aenor.517.t:0 "The Fourth Age Ends"
 zin_aenor.518.a:0 "Stand alone."
 zin_aenor.518.b:0 "Fight beside Aenor."
 zin_aenor.518.d:0 "A beacon burns on the hill and a rider stands at the gate. The Hailed King of Aenor asks every realm that fights the dark to stand under one banner."
 zin_aenor.518.t:0 "The Free Peoples Are Called"
 zin_aenor.519.a:0 "Refuse."
 zin_aenor.519.b:0 "Open the roads."
 zin_aenor.519.d:0 "Aenor sends word that the roads of its realm are open to every host that fights the dark, and asks that the roads of yours be open in return."
 zin_aenor.519.t:0 "A Common Cause"
