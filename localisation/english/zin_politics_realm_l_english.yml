l_english:
 zin_politics_realm_button:0 "Roots and Sign"
 zin_politics_realm_button_desc:0 "Read how the realm came to be and what its sign means."
 zin_politics_realm_text:0 "[ROOT.GetZinRealmLore]"
 zin_politics_realm_title:0 "[ROOT.GetFlag] [ROOT.GetName]"
 zin_realm_lore_ADE:0 "The Sign\nA long tapered sounding lead hanging on its line, in lead grey and chart white on deep ink blue.\n\nThe sounding lead is the pilot's proof of a reef, dropped before any reef may be named, and the lead the Andaios chart-house calls Senra's hangs in the Chart Hall at Sanderz. The league's chart-office flew a lead on its line over Adel's harbour from 1A 900, and the Chart Hall took it back as its banner when it became the copy-house of record in 4A 388.\n\nNothing named until it is proved: to every crown that buys an island chart a promise that it is true, and to rival chart-houses the reminder of who keeps the record.\n\nThe Roots\nThe chart-houses of Adel descend from the oldest craft of the Boreal peoples. Long before Aen, when the Sunfields still stood in the Cold Lands, the proto-Boreal sailors who went west by sea to the arcs carried words for reef, strait, cape and tide that are older than any chart, and they kept a rule that the chart-houses still swear by: no reef is named until it has been proved by the lead. A pilot who found a reef dropped the sounding lead on it, read the depth and only then gave it a name, and the first namer of a reef was honoured by every sailor who passed it afterwards. When the chart-islanders were sworn into Margorodai, the Sea-Roads, at Halgohavnai in about 1A 820, the league set its chart-office at Adel in 1A 900, and the fleet captain Senra of the Pupor Isles, who brought the Grand Alliance's supply fleets through, is claimed by the Andaios chart-house as its forebear; its strong-room at Sanderz keeps a sounding lead it calls hers. When the Grey Breath ended the league, the chart-office became one chart-house among many, and for four centuries after Aenor's restoration the chart-houses quarrelled over who had first named which reef, until in 4A 388 the houses of Adel agreed to copy every chart at Sanderz and to record there the first namer of every reef. From the lead come Adel's customs: a chart is sworn true by the pilot who sounded it; the Drowned Names are read together with the reefs that took them; and the Chart Hall sells its newest chart to whichever crown it chooses, because the lead belongs to the house that dropped it."
 zin_realm_lore_AEN:0 "The Sign\nA spread cloak, black outside and red within, hanging open from a gold crown-shaped clasp at its throat, on a field of lake blue.\n\nThe Mantle of Aen is the cloak under which the last kings of the War of Men knelt at the Mantling, so that no king knelt to another. It hung above the throne of the old capital as the realm's first relic until Volgan's armies carried it off with the archives in 1A 1612, and no chronicle says where it went. Edran, crowned beneath the Moot Tree, was wrapped in a ranger's cloak dyed black and red for want of the true one; the dyed cloak became the banner of the Grand Alliance's Aenoran host and then of the restored crown, and Harion's heralds set the gold clasp at its throat in 4A 3 to say that the crown held it together again.\n\nShelter under one law: every house beneath the cloak keeps its own and draws no sword on another without the crown. To the dominions it promises protection; to the Orran heirs and the West it is the cloth that covered a conquest, and the lake ports mock the Golden King's gilded copy as a mantle with no king inside it.\n\nThe Roots\nBefore Aen there were kingdoms of men in the Vale and round the Great Lake, and the eldest of them were the Orran houses that had come up the rivers out of the drowning Low Country with their cords and their mothers' law; others were older peoples of men whose names survive only in the Vale's hill-forts. For hundreds of years these kingdoms fought the War of Men over inheritance, fields and the question whether one crown should exist at all. Aen, born of magic and power and without a father, fought through that whole war, and the realm he made at its end was built on bargains as much as on victories: the kings who knelt kept their lands, customs and gods, and lost only the right to make war on one another. The chroniclers of Parim tell that the last kings knelt together in the Vale and that Aen spread his cloak, black outside and red within, over all of them at once, so that no king knelt before another, only beneath the same cloth; that is the Mantling, and the Peace of the One Crown is the law spoken beneath it. From it came the realm's whole character: a crown that rules by keeping houses at peace rather than by ruling them; a nobility in which every great house counts its blood from one of Aen's hundreds of sons, and so argues not over whether it is royal but over which branch is first; a law in which a lord's war without the crown's judgement is the first meaning of rebellion; and a grudge it has never paid, for the Orran houses that would not come under the cloak withdrew into the downs and the forest, and their heirs still say the Vale's rivers have Orran names because the Vale was theirs. The cloak itself was lost with the archives and the sacred objects when Volgan took the capital, and every king since has been crowned under a copy."
 zin_realm_lore_ALR:0 "The Sign\nA white stair of five steps climbing from the lower hoist toward the upper fly, with a narrow river-king's crown resting on the top step, on river blue.\n\nThe stair is the first stair of the temple chronicles, raised above the flood of the Breaking, and the crown on its top step is the crown of the man who carried the first stone. The river crowns painted it above the flood-line on their temples before Aen won his war, and the Alerhides flew it from the river galleys that burned the black hulls at the river mouth in 1A 1214. The Furanides, who won the crown in the War of the Two Floods, added nothing to it, because a Furanid king reigns under the river's name and not his own; the steps are always five, because the oldest stair at Porrenva has five steps above the flood-mark.\n\nThe king below the gods and above the river: a promise that the crown will never leave the valley in a flood, and a reminder to every claimant of the bridge that its heir is a stair and not a master.\n\nThe Roots\nAlerhia is the primary shadow of Tarkia, the Bridge Kingdom, whose one Eastern people held both shores before the rift. Its scribes still write the reed letters of the stair-temples, and its kings are still crowned standing in the river, as the bridge-kings were anointed at it. When the neck broke in the war of the two heirs and the sea came in, the flood of the Breaking drowned the low valley; the temple chronicles say the survivors raised a stair of stone above the flood-line so that the river and the gods would each have a place, and crowned the man who carried the first stone to its top. Alerhia's law comes from that stair: the king stands below the gods and above the river, the scribe-council keeps what the king must not forget, and a king who abandons the valley in a flood forfeits the crown. The scribes also keep a claim they never write out in full, the old title of the bridge-kings, the great king of both shores, which appears in the king-lists only as an empty line at the head of every list. The Black Tribute shaped the rest. When Volgan's envoys came in 1A 1214, the Kalioth kings, who called themselves the restorers of the Bridge Kingdom, had already paid; the scribe-council answered that the Bridge Kingdom had left a stair and not a master, and the king burned the black-sailed hulls at the river mouth. From that refusal come Alerhia's pride, its distrust of every crown that claims the bridge, and its habit of trading with the elven shore while kneeling to nobody on either side of the water."
 zin_realm_lore_ANE:0 "The Sign\nA slender lake-boat with a tall curled prow, seen from the side and empty, in water silver on lake teal: the Court-Boat of Enliras.\n\nThe boat is the Court-Boat, in which Enlire held the first Water-Court on open water so that no grove could own the ground the court sat on. It is the same boat, rebuilt plank by plank whenever a plank fails, that is moored on the largest lake at Enliras today, and the Speaker sits in it to judge. The groves sewed it on their sails when the Weir Compact was sworn in 1A 480, and they show it empty because the court belongs to no grove and any grove may come aboard.\n\nThat the water is shared and judged in common: to the groves the promise of a fair court afloat, and to strangers the lake elves' welcome, which takes them in at dusk and carries them on at dawn.\n\nThe Roots\nLong before Aen the lake elves were boat-folk with no land of their own: groves that lived on the waters of the Andos, took the water's name and moved the name with them when the water changed. Their oldest custom is the guest-night, in which a lake house shelters any stranger for one night and sends him on at dawn, because a boat can carry a guest but cannot keep one. The federation was forced on them by a drought. In the Year of the Broken Weirs, a few years before the Weir Compact, the lakes fell so low that the groves broke one another's weirs to keep their own water, and a boat carrying the children of the grove of Ilawen was overturned in the race loosed by a broken dam. The elder of that grove, Enlire, called the groves to the largest lake and would not let them ashore; she held the first Water-Court in her own boat, moored on open water, so that no grove could claim the ground the court stood on. The Weir Compact of 1A 480 was sworn there, and the court has sat afloat ever since. From that drought come the Water-Court's law of weirs and boats, the rule that the Speaker owns no land and takes the name of the largest lake, the federation's habit of judging by water rather than by blood, and its old fear of every dry summer. Its boats still carry Lerendor's letters and the guests of every realm, and they still put them ashore at dawn."
 zin_realm_lore_ANR:0 "The Sign\nA closed black pine-cone, upright, on deep forest green.\n\nThe closed cones are those the rangers found laid in rows at the forest's edge after the Burnt Edge and after the cutters who did not return, the cones of the dead trees kept unopened. Selen's rangers have marked the forest's boundary with a painted closed cone since 2A 1121, as a sign to their own people and to the Redbark, and the moots call the forest by it in their books, since the Baelim have never shown a sign of their own.\n\nWhat falls is kept, and the forest waits. It tells every axe and every fire that the forest remembers its dead; what the cones are kept for, and whether they will ever open, nobody outside the forest knows.\n\nThe Roots\nThe Baelim say that their oldest stand, Graulvoa, was already standing when the sea first reached the north coast, and the Selen rangers who live round the forest have no story older than the Baelim's low voices. What the rangers have learned in four ages of watching is a pattern rather than a history. The great wet forest has never been cut and never burned twice: when the Redbark fired its eastern edge in 2A 1120 the Baelim came out and pulled down the raiders' camp trees, and when the Order's woodcutters went in for its giant conifers in 3A 860 not one came back. After each of these the forest kept a silence, a whole year in which no Baelim voice was heard, and where trees had fallen the rangers found the cones of the dead trees gathered and laid closed in rows at the forest's edge, never opened, as if kept for something. The Standing Silence is the rangers' name for those years, and the Baelim's way of life seems to grow from it: they do not grieve aloud; they keep what the dead trees leave; they never share a forest with the ents; and they listen, the rangers think, to something under the roots that is older than the stand. What it is, the Baelim will not say, and the moots have learned not to send anyone in to ask. Selen leaves water at the edge in dry summers, and nobody knows whether the Baelim drink it."
 zin_realm_lore_AUT:0 "The Sign\nThe Tusk of Vaestia: one long spiral whale-tusk standing upright, white on a deep sea-red field, with a black hem of curling waves.\n\nThe device is the tusk of the white spear-whale that led the first crew through the Siroler pack and beached itself below the cliffs, which the Ezhair jarls keep upright beside their seat in the harbour hall. Crews cut its shape into their prows long before the jarldom, and when Jarl Kolim Ezhair hung the harbour boom in 4A 612 he flew the tusk on red sailcloth from the winch-post, the red standing for the first catch of the season given back to the sea; it has flown there every Long Light since.\n\nThe whale-oath: the first catch to the sea, every whale to one harbour and no white whale hunted; it promises a jarl who has followed the whale and tells the crowns that the east coast answers to its harbour.\n\nThe Roots\nThe east coast was not peopled from the Sunfields' meadows but from the sea. The jarls' tale is that a crew of seal-hunters, driven north-east by a gale out of the Siroler ice in a year no one counts, lost every landmark and followed a white spear-whale that surfaced ahead of them each morning until it led them through the pack into the sheltered water below the eastern cliffs, where it beached and died. The crew ate of it, built their first hall from its ribs and swore over its tusk never to hunt a white whale, to give the sea back the first catch of every season, and to land every whale at one harbour so that no crew could starve while another feasted. That oath is the root of the whale-tithe that Jarl Kolim Ezhair claimed when he built the harbour hall and its boom at Vaestia in 4A 612, and of the custom that a jarl must have captained a whaling crew, because the jarl is the one who has followed the whale. The Tusk of Vaestia still stands beside the jarl's seat, and every crew touches it before the first voyage of the Long Light. The east coast takes its law from that harbour rather than from any crown because, as the whalers say, the whale chose the harbour and no queen did, and in 4A 1748 the jarl still answers every envoy from Fandanar by pointing at the tusk."
 zin_realm_lore_AZA:0 "The Sign\nTwo halves of a split tally-stick side by side, notched along their edges, in bronze gold on dark wine red.\n\nThe split tally is the stick of the last Kalioth king's debt, a notched rod of black wood split lengthwise so that the creditor and the debtor each kept one half. The king's half was lost when his hall was walled up; the house's half lies in the counting-room of the bronze-roofed house over Ceralon's market. Since the charter of 4A 1033 the house has flown both halves together, the paid and the unpaid, and an Azano loan is still sealed by splitting a stick.\n\nWhat is owed will be collected: to the house's partners the promise that an Azano word is as good as its tally, and to every court in the house's ledgers the reminder that the house has outlived one crown already.\n\nThe Roots\nHouse Azano's ancestry goes back further than its charter by three ages, and the house tells it to every new debtor. The Azani were paymasters of the Kalioth Crown, tally-lords who kept the empire's debts with its mine-lords, its pass-houses and its suppliers, and they were the only servants of the Crown spared when the mine-lords overthrew the last king in 2A 12, because they held the tallies of what everyone owed and nobody wished them burned. The last king owed the Azani the price of a whole season's grain for his besieged hall; he died without paying, and the house kept its half of the tally as proof that even a crown can owe. From that half-tally comes the house's creed: every debt is real until it is paid, a debt outlives the debtor, and a family that holds the right ledgers outlives kings. For three ages the house lent quietly to the river crowns and the bronze towns, and in 4A 1033 it bought the charter of Ceralon outright from the bench of houses, which let the town go because the house paid in gold and because half the bench owed it money. The Ledger Feud with House Prudo and the Silk Wager of 4A 1688 are told in the house as lessons in the same creed: the feud ended in a marriage because a dead rival cannot repay, and the wager was won because the house knew which silk merchants of the South Lands owed it most. Mylana Azano's ledgers record loans to half the courts of the East."
 zin_realm_lore_BEN:0 "The Sign\nA hermit crab in a spiral shell with its claws raised, in shell white and crab red on cove black.\n\nThe crab in the borrowed shell is Urai the Lame's saying, made into a banner when he opened the haven at Torni in 2A 980: corsairs live in shells other men built. The haven's captains have flown it over the hidden cove since, and a corsair who pays the haven's dues is given a small shell to hang at his masthead, which every Benan pilot respects.\n\nWe live in what others left: to the corsairs a promise of the haven's peace, to the Charter the reminder that Benan holds the Square in name, and to every captain the warning never to crawl into a dead man's shell.\n\nThe Roots\nBenan holds the reefs where the Sea-Roads died and will not go near them. Halgohavnai, the Holy Harbour of Margorodai, stood on the reef shelf inside the arcs, a harbour where any ship of any flag paid one due; the Grey Breath came into it first and it was left to its dead and never relit, and the gale season of 2A 904 broke its four moles into the square of reefs that wrecks ships, the Cursed Square. The corsairs of the Benan Mountains, whose coves no fleet can find without a Benan pilot, claimed the Square in 2A 925 because nobody else wanted it, and none of them has ever sailed into it. In 2A 980 a captain named Urai the Lame made the cove of Torni a haven for every corsair who would pay its dues and keep its peace. The haven's captains say Urai taught that a corsair is a crab in a borrowed shell, living in harbours other men built and leaving when a bigger crab comes, and that the one shell a crab must never crawl into is the one its owner died in. When a royal Aenoran ship was lost with all hands on the Square in 2A 1507, Benan's corsairs took nothing from the wreck, and they have refused to sail into the Square since. From the borrowed shell come Torni's customs: the haven chooses its captain from those who pay its dues; the haven's peace and the Ransom Tide are kept inside the cove; nothing is taken from the Square; and the chart-houses' tribute, paid since 4A 1480, buys peace only as long as it is paid on time."
 zin_realm_lore_BLD:0 "The Sign\nA white swallow-tailed pennon on its staff, seamed down its length with a black stitch, on grey.\n\nThe first banners of the companies were sewn by the women of Toples from the shrouds of the plague dead, and the black seam is the stitch that closed the shroud. The Captain-General's pennon at Toples is said to be the first shroud-banner itself, sewn in 2A 1100 and never carried into battle so that it can never fall; every company sews a black seam into its own banner at its founding.\n\nOur dead march with us and our word is written. It promises a hirer that the companies keep their contracts to the last man and tells an enemy that a Buldor banner does not fall while one man of the company can hold it; it promises nothing else, to anyone.\n\nThe Roots\nBuldor was born in a list of the dead. When the plagues of the Long Grief emptied the valleys south of the Fog and Eye range in the Second Age, the clerks of the toll-town of Toples kept the rolls of the plague dead on long sheets for the lords who would inherit, and soon there were no lords left to inherit. The landless men who survived gathered at the crossroads and swore themselves into companies, each under a banner of its own, and the women of Toples sewed the first banners from the shrouds of the plague dead, because there was no other cloth. In 2A 1100 the company-lords wrote the first contract-book on the backs of the plague-rolls, so that every company was sworn on the names of the dead, and elected a Captain-General. From the shroud-banners come the company state's faith and law: a company's banner is its soul and its dead are sewn into it; a fallen banner ends the company, because a shroud that falls cannot be raised; a company is bound by its contract and nothing else, and may meet another Buldor company in the field, since the dead on both banners are the same dead; and the men of Buldor hold that a land which lost everyone owes no one anything except what is written. Buldor lives by selling the one thing the plague left it, which is men who are not afraid of dying, and it sells them to anyone, Gunwyn and Girdon alike, and Aenor's envoys too when they pay."
 zin_realm_lore_BLK:0 "The Sign\nThe Empty Seat: a tall-backed high seat, empty, in white on black, with a sea-green hem.\n\nThe seat stands in the moot-hall at Dontadur where the founders set it in 4A 1102: a high seat of black-stained timber with a tall back, built for a lord and sworn to stay empty. At every moot the speaker turns to it before the vote and says that the seat is still empty, and the burghers answer that it will stay so. The towns sewed the empty seat on their banners when they first manned their walls together, white on black because the seat is black and the cloth was the burghers' mourning colour, and the Leren quarter keeps an old copy of that banner from the charter quarrel.\n\nNo master in Blackton: the five towns rule themselves together, and the empty seat warns every would-be lord, Leren or Dondric, that the towns mean to keep it empty.\n\nThe Roots\nThe five walled harbours of the eastern coast grew on a shore where two old enemies met. In the Raiding Years of the Second Age the beaches below the Iron Road were the launching places of the iron holds' raids across the Northern Dark Strait, and Leren fleets came back to burn them so often that the Dondric fishers who lived there learned to build in stone and to keep no lord who could be blamed. When Leren merchants came to Dontadur in 4A 1071 to buy Dondor's iron, they came as the grandchildren of those who had burned the beaches, and they married the grandchildren of those who had raided the North. The league sworn in 4A 1102 was made to keep that peace: the five towns gave their harbour-keys to one moot, and the founders set up a high seat in the moot-hall at Dontadur and swore that nobody would ever sit in it, so that no Dondric house and no Leren house could rule the other. The empty seat is why Blackton chooses a moot-speaker each year who sits below it, why its burghers hold that a town is free when it has walls and no master, and why the charter quarrel of 4A 1688 was so bitter: a Leren-born burgher asked to sit in the seat, and the moot refused him by a single voice. In 4A 1748 every generation argues about the seat again, and the towns trade with everyone while keeping out of the Accord's wars where they can."
 zin_realm_lore_BLN:0 "The Sign\nThe Broken Shackle: an open iron shackle snapped through at one side, salt-white on deep sea-green, with a black hem.\n\nThe shackle is the rowers' own. When the bench-chains were broken in the Belonton waters after Dardan, each rower kept the shackle from his own ankle, and the oldest holds of the confederacy still keep a few of them, eaten thin by salt, in their halls. When the holds swore at Notle in 3A 940 each captain threw one shackle into the harbour and the Sea-Chief nailed the last to his mast, and Belonton's ships have flown a broken shackle on green ever since; Leren sailors call it the bench-mark and know it before they see the hull.\n\nNo sea orc rows for a master again: to friends the shackle promises a free people of the sea, and to Goldoroth it says that Belonton remembers what masters cost.\n\nThe Roots\nThe sea orcs say they were rowers before they were raiders. In the second millennium of the First Age Volgan's eastern and southern clients crossed the waters toward the Middle Lands in great galleys, and the oars of many were pulled by orcs chained to the benches, bought or taken from the holds of the Dark Lands. When Dardan was lost the masters fled south and left a fleet of galleys stranded in the Belonton waters with their rowers still chained; the rowers broke their shackles, threw the last overseers into the sea and took the Lestern Isles and the borderland coast with the masters' own ships. They have been a seafaring people ever since, as no other orcs are. From the benches they kept three things. The Salt Tithe: every voyage gives the sea a measure of salt, the share the masters used to take from them, now paid to the sea alone. The Sea-Chief chosen by voyages won, because on the benches only the stroke counted and nobody's birth. And the oath that no sea orc rows for a master again, which is why Belonton raided every strait through the Third Age and swore its confederacy at Notle in 3A 940 only so that its ships would raid others rather than each other. It is also why the Dark Sea Accord of 4A 1604 holds: the sea orcs and the men of Dondor are both peoples left behind by masters who never came back for them, and the Accord's iron bar and skull were sunk together as the bench-chains had been. In 4A 1748 Goldoroth offers Belonton harbours and plunder, and the Sea-Chiefs hear in the offer the sound of a bench."
 zin_realm_lore_BLO:0 "The Sign\nA red oak leaf, stem upward, letting fall one red drop, on black.\n\nThe bleeding leaf is the cord-tree's, the oak the Redbark say took the drowned into it with their names. The cord-mothers cut a leaf and a drop into every cord-tree when a new name is tied there, and the war-chiefs carry it painted on a hide on a raid so that the clan's dead go with them; the Selen rangers who burned the cord-trees at the forest's rim in the Red Winter of 4A 1608 learned what the sign meant the next spring.\n\nThe forest bleeds for its dead and its dead are counted. It promises the clans a blood-price for every wrong and tells the Vale that the Redbark have not forgotten the rivers; on a raid it means the war-chief goes with the dead's leave.\n\nThe Roots\nThe Redbark are the warlike heirs of the Low Country, and their forest is a cord-hall made of trees. When the sea drove the Orran houses east off the drowning plain, those of the Wolf, Bear and Raven clans who would not settle under the valley kings went north into the great red-oak forest above the Konorar and hung their mothers' cords in the oaks. The Redbark tell that the oaks bled when the cords were tied to them and have bled since whenever their bark is cut, because the forest took the drowned into it with their names; the oaks of the forest do run red when cut, and no other red-oak wood in Aoaz does the same. From the cord-trees comes the Redbark's double life: in peace the cord-mothers rule and read the names on the trees; for a raid the moot chooses a war-chief and takes the office back at the peace, as the Low Country did in its wars; a blood-price is paid by tying a knot for the dead into the killer's clan cord; and a feud is ended by the mothers, never by the chiefs. They kept the old tongue and the beast-clans long after the Vale forgot them, and they keep a hunter's grievance: the rivers of the Vale have Orran names, the Redbark say, because those rivers were theirs, and they would take the names back. Under the Order the Necromancer's dead came into the forest and did not come out, and the Redbark say it was because the trees hold the names, and what is already counted cannot be raised."
 zin_realm_lore_BOR:0 "The Sign\nKargesk's Horn: a great curved black war-horn bound with two red bands, on a dust-ochre field with a red hem.\n\nThe horn Kargesk blew from the gorge's cliff in 3A 700 hangs in Zubudor's gate, a great curved horn of black bone bound with red-painted iron bands, too heavy for one orc to lift to his mouth. It is blown for every caravan that enters the Road-Peace and for every challenge of the ring. Bordon's road-wardens carry the horn sewn on ochre cloth, the colour of the gorge's dust, so that a caravan master can tell from a distance that the riders coming toward him are the road's keepers and not raiders.\n\nWhile the horn's note lasts the road is at peace: the horn promises safe passage to every caravan and warns every army that Bordon's road is not for sale.\n\nThe Roots\nThe Black Road through the gorge by Soun Lake is the oldest road of the iron hills, worn by orc carriers long before Aen and blackened by the slag they spread to keep it firm in the wet. In the Buried Wars it was the free holds' only road between the hills, and the Necromancer's garrison sat in the gorge to close it. In 3A 700 Kargesk of the road-clans brought the free runners through the gorge at night by blowing a great horn from the cliff-top at the moment the garrison changed its watch, so that every runner on the road moved at once and the garrison fought shadows; by dawn the runners held the gorge and the garrison was dead or gone. Kargesk built the hold at Zubudor where his horn had sounded, and the horn hangs in its gate. When the wars ended his heirs turned the barracks into caravan inns, and the horn became the sign of the Road-Peace: when a caravan enters the gorge the horn is blown, and from that note until the caravan leaves no blade may be drawn on it, by the hold or by anyone else, on pain of the ring. Bordon lives by that peace. It is why caravans pay its tolls gladly, why its chiefs take Volgan's gifts and Goldoroth's threats with the same grin, and why the Night of the Trolls of 4A 1390 became Bordon's own grief: the caravan the troll king smashed had camped in the forest beyond the horn's reach and was under no peace, because it had left the road. In 4A 1748 the hold keeps the road open to everyone, and every master who wants the Black Road must first want the Road-Peace broken."
 zin_realm_lore_BRR:0 "The Sign\nA shuttered iron lantern with one shutter open on a yellow light, on dark red-brown.\n\nThe lantern is the first warband's, set in the throne-cave of Glimzig in 3A 38 and relit from its own flame at every king's death. The Lamp Truce of 4A 96 was sworn over it, carried up to the Accord tower by the hobgoblin king himself, and the warren-bosses paint it on their shields with as many shutters open as they dare, since a shutter open too wide is a boast the king may answer.\n\nWhile the lamp burns the warren stands. Half-open, it promises the dwarves and the Guard that the truce holds and promises every goblin that the range is theirs by stubbornness; a closed lantern on a warren's shield means the warren has gone dark and is free to be taken.\n\nThe Roots\nThe goblins of Burrikkrit came to the Cursed Mountains as the Order's hirelings, and they are not ashamed of it. In 3A 38 Elzon's Order sent goblin warbands from the southern ranges into the warm caves under the mountains to watch the South Pass and the unconquered elves, paid them in plunder and promised them, the warrens say, the whole range for ever. The first warband carried a single shuttered lantern, and its boss set it in the throne-cave of Glimzig and said that while it burned the warren would stand; it has been relit from its own flame at every king's death since, and the hobgoblin kings hold the throne by holding the lantern. When the Necromancer fell, the goblins learned the thing on which their realm stands: that a promise outlives the one who made it, if you are stubborn enough. Nobody could dig them out. From the lantern and the promise come the warrens' customs: the king is the one who keeps the lamp and the biggest who can; a warren whose lamp goes out is finished and its goblins are taken in by others; every bargain, from the Lamp Truce with the dwarves to the smugglers' rate on the under-roads, is sworn with a lit lamp between the parties; and the goblins measure their right to the range not by any charter but by how long nobody has managed to remove them. The dwarves call that theft and the Guard calls it a siege; the warrens call it the promise kept."
 zin_realm_lore_BRT:0 "The Sign\nThe Running Boar: a black boar running with white tusks bared, on iron-red, with a black hem.\n\nWhen something breathed out of the Hollow in Volgan's war, the black boars of the hills ran first, down from the pits to the headlands, and the orcs who followed them lived. The Brakgul took the running boar as their clan's sign that night and painted it on the slag that sealed the Hollow, and since Bredesk joined the headland to Fontadon in 4A 1380 it has been sewn on the hold's banner and branded on its iron bars. No Brakgul hunts the black boar, and a boar seen running down from the hills is still reason enough to empty the pits.\n\nFollow the boar and live: the banner promises that Britadon's iron is won without waking what lies deep, and warns that the hold flees nothing else.\n\nThe Roots\nThe iron hills of the south-east coast were dug by small orc holds long before Aen, and their deepest pit is the reason Britadon digs wide and never deep. In the First Age the holds of these hills sank a shaft deeper than any other, the pit the orcs now call the Hollow, and in Volgan's war, when the Damned Spirits rose from beneath the mountains, something breathed out of the Hollow that the hill-orcs will not describe. The black boars of the hills fled first, out of the hills and down to the headlands, and the orcs who followed the boars lived; those who stayed by the pits did not. The survivors sealed the Hollow with slag and stone, and from that night come the hills' laws: no shaft may go deeper than the Brakgul measure, the iron is won from wide pits and shallow galleries, and nobody hunts the black boar, which the Brakgul clan holds saved it. Bredesk of the Brakgul, who brought the headland hold of Beriath under Fontadon's iron in 4A 1380, did it partly to own the headlands the boars had led the clans to, and the same caution made his heirs sell their iron by sea from 4A 1500 rather than send it through Goldoroth's lands. They took a seat at the Free Moot in 4A 1520 because they wanted friends in the hills if Goldoroth came. In 4A 1748 the Hollow is still sealed, Goldoroth's smiths would like to know how deep the coast's iron goes, and Britadon's chiefs answer that it goes exactly as deep as the measure."
 zin_realm_lore_BRU:0 "The Sign\nA black iron fire-pot hung on a chain, a red fire rising from it, on dusty ochre.\n\nThe fire-pot is the one in which the delvers of Hrennost say they carried the Road-Fire out of the western road before the Sea-Door was sealed in 1A 1660. It hangs over the forge of the fire-hold, the powder-smiths of 4A 1561 lit the West's first burning powder from it, and the gate-wardens hang a painted fire-pot over the Outer Gate while the hold is trading and take it down when the doors are shut.\n\nThe fire of the Stone Road still burns here. It promises buyers at the gate iron, gold and powder from the oldest forge in the West; to Kunhrim it says that the western holds kept the fire while the eastern gate kept the crown, and that Brundahrim will bring its fire to no moot until Kunhrim owns what it urged.\n\nThe Roots\nThe dwarves of the Herlitz and Dusty Mountains were the western end of the Stone Road, the dwarves' realm of deep roads under the sea, and Hrennost, the fire-hold, was its western forge. When the Damned Spirits came into the roads in Volgan's war and the roads under the sea were broken and the sea let in, Brundahrim sealed its western Sea-Door with the names of its last delvers and lost at once its trade, its kin and its light, for the deep roads had been lit from the Great Hall's lamps and the western holds were left in the dark. The fire-hold's delvers say they carried one live fire out of the road before the door was shut, in an iron fire-pot on a chain, and that the forge of Hrennost has been lit from it ever since; they call it the Road-Fire, and it is the hold's soul. From the drowning come the hold's grudges and its pride. It blames Kunhrim's lords for urging the Letting-In of the Sea and will not sit in any moot Kunhrim calls; it trusts no court and opens its doors only to those who earn it, and shut them to men for three generations after the looting of Gromkerm's gate; it keeps the small folk's high passes shut, as much to keep the basin's secret as its own; and in 4A 1561 its smiths learned to make a burning powder from the saltpetre of the Dusty Mountains, which they say only the Road-Fire could have kindled, and which the West now buys from them at any price they name."
 zin_realm_lore_BUN:0 "The Sign\nThe Fire at the Door: a black tunnel-arch with a yellow fire burning in its mouth, on a rust-red field with a yellow hem.\n\nThe sign is Snikkit's lie of 3A 1004: the mouth of a deep way with the sulphur fire burning in it, the sight that sent the Necromancer's recruiters back up the mountain. The goblins painted it at the mouth of every warren afterwards as a warning to strangers, and when Burnikit began to sell its powder in 4A 1566 the same sign was burned into every keg, so that the orcs of Cocanoor and the men of Notbuton learned to read it before they could read anything else of the warrens.\n\nKeep out unless you pay: what burns inside is the warrens' own, it was paid for once in goblins, and it costs every buyer dear.\n\nThe Roots\nThe goblins of the warm caves under the Goldoroth Mountains were there before any orc warking, living in the deepest and warmest rock because they hate the cold and the sun weakens them. They have one great grief and one great trick, and both made Burnikit what it is. The grief is the Unpaid: in 2A 2110 the warrens opened their deep ways to the Necromancer's hosts for a promised price, his recruiters took goblins with them as guides and levies, and neither the price nor the goblins came back. The warrens cut a notch on the Unpaid Stick for every goblin lost, and it hangs in the hall of fire still. The trick is the Fire at the Door: when the recruiters came again in 3A 1004, the warrens chose their loudest and cleverest boss, Snikkit, to speak for all of them, and Snikkit had a fire of the yellow crusts lit in the mouth of every deep way and told the recruiters that the warrens were burning with a sickness; the stinking smoke made the lie true enough to send them away. The fire in the hall's mouth was never let out, and it is the great lamp of Burnikzig. From the grief comes the warrens' law that payment comes first and nobody is trusted on credit; from the trick come the Big Sniks, one voice that lies for everyone, and the craft of the yellow crusts, which in 4A 1566 became the first powder of the Dark Lands. Burnikit sells to whoever pays and charges its enemies more, because it learned from the Necromancer what a promise is worth."
 zin_realm_lore_CLD:0 "The Sign\nThe Ember-Horn: a curved horn bound with bronze bands, mouth upward, with a single red coal glowing at its mouth, gold and red on a deep night-blue field, with a white hem of square hearth-stones.\n\nThe Ember-Horn is the clay-lined aurochs horn in which the last fire-keepers of the Sunfields carried a coal of the old king's hearth into the first Long Dark. It hangs in the Frost-Hall above the fire that the keepers say has never gone out, and Queen Ilvra I was crowned with her hand on it in 4A 850. The clans had sewn the horn on their moot-cloths long before there was a crown, as the mark of a fire that feeds all comers, and when the Winter Crown raised its first banner it took the clans' mark instead of inventing one, so that no clan could say the crown had come from outside the hearth.\n\nBread and fire for every clan that comes to the hearth in the Long Dark, and the hearth-law over every feud; to an enemy it says that the crown's strength is a store and a fire, and that the clans who have eaten from it remember.\n\nThe Roots\nWhen the winters of the Sunfields lengthened and the ice came south over the Fandan meadows, the clans that would not leave the north gathered at the last of the old king's halls, and when that hall too was given to the snow its fire-keepers did not let the fire die. They carried a coal of the hall's hearth in an aurochs horn lined with clay and bound with bronze, feeding it through the first Long Dark that men of the north ever lived through, and from that coal every clan that stayed relit its fire. Out of that winter came the hearth-law that still rules the Cold Lands: no feud may be carried past a shared fire, a house that lets its fire die in the Long Dark relights it only from the clan fire, and whoever keeps the fire must feed whoever reaches it. The horn passed from keeper to keeper among the Fandan clans for longer than any song can count; it was at the horn's fire that Kolar fed every clan in the Hunger Winters, and around it that the first Frost-Hall was raised in 2A 600. The Winter Crown is therefore a crown of keepers rather than conquerors: its queens are crowned with a hand on the horn, its fire-keepers teach that the land was punished and the fire is what was spared, and its whole authority in 4A 1748 still rests on the promise the old keepers made, that whoever reaches the fire will eat."
 zin_realm_lore_CRG:0 "The Sign\nA rolled letter tied with red cord under an unbroken black seal, on blue over white.\n\nThe letter is Aenor's letter of claim to the West, landed with Oslodon's first settlers about 1A 240, which the merchant houses swore in 1A 940 never to open; it lies in its iron chest on the bay under two locks, one key in each consul's keeping. The consulate has flown it since the first pair of consuls, the blue and white the colours of the two keys, and the consuls showed the Aenoran captain of 4A 188 the unopened chest instead of reading his letters.\n\nNo warrant rules here. It promises the merchant houses that no one of them will ever be a prince and tells Parim that Corogon keeps the crown's claim sealed, neither surrendered nor accepted; a broken seal would mean either a prince in Oslodon or Aenor's claim come home.\n\nThe Roots\nOslodon was the first Aenoran settlement on the western coast, and the first thing its settlers landed was a letter. The settlers of about 1A 240 carried the crown's letter of claim, sealed in black wax, which named the whole West as Aenor's by right of finding it, and the settlement's governors kept it in an iron chest on the bay as the warrant for everything they did. The merchant houses that grew rich in Oslodon learned what that letter cost: every war with the clans was fought in its name, and every governor who used it made himself a prince. When Aenor's grip failed the great houses governed the town, and in 1A 940, to make sure that no house could ever claim the crown's warrant for itself, they swore never to break the seal, chose two consuls to rule for a year at a time and gave the chest two locks, one key to each consul. From the sealed letter come Corogon's customs: two consuls, because one man with a warrant becomes a prince; a year's office, because a warrant held too long becomes a crown; an old refusal to read any letter of claim, as the consuls refused the letters of the first Aenoran ship to return in 4A 188; and a merchant people who trade with Aenor gladly and treat its claims as a cargo they will not unload. The letter is still in the chest with its seal unbroken; what it says exactly, no consul has read, and the highland inns have a dozen stories of what the forgetful wizard Gwilid thought it said."
 zin_realm_lore_CUR:0 "The Sign\nA grey cord hanging in a loop, tied in one black knot, on sour grey-green.\n\nThe black knot is the last tie of the Last Cord, the knot the Moot tied for the Night of the Sea, which lies with the cord in the eldest barrow of the grey downs. The cord-mothers tie a black knot into the cord of every Veiled child at its naming, so that each carries the drowning with her, and the Concord host of the Grey March in 4A 1310 found a black knot tied to the rope of every poisoned well.\n\nWhat was taken is never untied. It promises the Veiled that their dead and their drowned are counted, and tells every crown that comes to the downs that it is asking, and that the cord-mothers know what asking does to a land.\n\nThe Roots\nThe Veiled are the eldest heirs of the Low Country, the drowned plain whose Moot of Mothers governed more land than Aenor ever held, and without a crown. Its law was kept on knotted cords, one knot for every field, debt, marriage and death, and when the mothers overdrew the land's magic and the ground sank below the sea, every field the sea took was tied on the Moot's cord as a black knot; the last black knot was tied for the Night of the Sea. The Orran kingdoms that survived on the river valleys kept the cords through the War of Men, and when Aen's victory ended it the houses that would not kneel carried the Moot's cord, the Last Cord, into the eldest barrow of the grey downs. Since then the cord-mothers have kept its count on the Old Tallies, and the Veiled have built their life on the lesson of the black knots: a land must never be asked for more than it gives; a name tied into the mother's cord is never untied, and a name stolen is a knot cut; and the hood their women wear, from which the Vale took its name for them, is the mourning hood for the drowned. The second death of land they suffered taught it again. In 3A 744 the Black Roots of the Necromancer reached the downs, and his attempt to turn the land's magic soured the ground for ever; the Veiled count the sour downs as the second land to die of being asked too much. They stayed, learned to grow roots and mushrooms in it, and refuse every crown, because every crown asks."
 zin_realm_lore_DAK:0 "The Sign\nThe Grounded Spear: a black spear turned point-down, its shaft wound with a white thong, on blood-red, with a black hem.\n\nGrimduth carried meat into the ogres' caves on a spear turned point-down in the hard winter of 4A 1222, so that the ogres would see food before they saw a weapon, and the ogre clan-heads took the meat off the point. The spear is kept at Notdertu with its shaft still wound in the thong that tied the meat, and the moot sits only after every spear in the hall has been grounded the same way. The Darks' war-bands carry the grounded spear on red so that both peoples march under a sign both of them made.\n\nThe moot's peace: orcs and ogres share before they speak, and the spear promises that the two peoples will not turn on each other, while warning outsiders that a point can be lifted.\n\nThe Roots\nThe orcs of the Dark Forests and the ogres of the caves under the Hills of Dark tell two different stories of where they came from, and the moot at Notdertu keeps both. The forest holds say their forebears were among the bands that came home from Dardan and found the iron hills full, and went into the Dark Forests' shade because nobody else wanted it. The ogres say their clans walked from the sunrise long before Aen, from lands where their kin still live on the far side of a sea, and came into the caves of the Darkness because the caves were dark and full of meat; nobody can test it, and the scholars of other lands note only that ogres live on both sides of the eastern seas. For centuries the two raided each other, until the hard winter of 4A 1222 left both starving and the orc chief Grimduth walked into the ogres' caves with meat on his spear and its point turned to the ground. The ogre clan-heads ate with him, and the Meat Moot was made. Everything the Darks are comes from that meal: at Notdertu every spear is grounded point-down before the moot sits, meat is shared before words, and nothing is decided until the orcs and the ogres both agree. The moot also carries one shame, the Broken Cairn of 4A 1483, when orcs of the holds broke a cairn of the giants' Borderline for its stone and the giants broke their hold, and it has forbidden its people to touch a cairn since. In 4A 1748 the orcs need the ogres' strength and the ogres need the orcs' hunting, and every envoy who would buy one without the other finds the spear still point-down."
 zin_realm_lore_DLB:0 "The Sign\nA broken column whose capital is a horse's head, in pillar white on grass green.\n\nAmong the fallen pillars of the fair one column stands to half its height, and its fallen capital, a horse's head carved in a manner no mason of Delbiz knows, lies in the grass at its foot. The first fair-king took his oath on that capital at the Horse-Fair Oath of 2A 1488, and the horse-lords sewed the broken column with its horse-head on the oath's banner. The Fosocides keep it on a green field; it is the one sign of the East that was cut from Qadurum itself.\n\nThe eastern gate remembered: to the horse-lords a promise that the fair's law outranks the crown, and to Alerhia the reminder that half of the old city was never in its keeping.\n\nThe Roots\nThe horse-lords of the grasslands are the keepers of the eastern gate. Long before Aen the coast where Furtonlin stands was the eastern end of Qadurum, the city on the bridge, and the grass round it was where the Bridge Kingdom bred the horses it carried west; the riders of the Middle Lands and the horse-lords of Delbiz share a memory of horses that crossed the neck. When the bridge broke, Qadurum broke in two and its eastern half fell among the grass, and its pillars still stand where the horse-fair is held. The horse-lords say the herds of the fair descend from the last horses that came back over the bridge before the sea came in, the Gate-Horses, whose line is kept apart and never sold beyond the rift. For two ages the horse-lords kept Alerhia's war-horses and fought under the river crown, until the War of the Two Floods left the Furanides unable to pay them, and in 2A 1488 they swore at the fair among the pillars to keep their horses and their grass for themselves. Their law is the fair's law: a horse is sold only among the pillars and under the eyes of the fair; a Gate-Horse is never sold at all; and a king of Delbiz is the master of the fair before he is anything else. The Great Murrain of 4A 1622 killed two in three of the herds and spared the Gate-Horses, which the horse-lords took as proof that the old line is watched over, and the caravan houses that lent after the Murrain still expect to be repaid in horses."
 zin_realm_lore_DLN:0 "The Sign\nA crown of jagged white salt crystals, in salt white on obsidian black.\n\nThe salt crown is the crown of the first queen, the ring of brine crystals she took from the rim of the headman's pan, and the queens of Dolon have been crowned in brine and worn a crown of salt since 2A 1120. The house's banners have shown it since the pact-hall of Unzeky was raised, and the tribute galleys have flown it beneath the Gate of Nafeher along the Veshir coast since 4A 1651.\n\nLaws written in salt: to the thralls the promise that a pact can free them, and to every power that takes Dolon's oath the warning that the queen can let the sea wash it away.\n\nThe Roots\nThe queens of Dolon rule by pact and write their laws in salt, and both customs come from the first of them. The house that became Dolon was a house of the Nether's Halls whose demons dealt in pacts with the living, the bargains that bind a mortal in service, obedience or tribute for life and end with him, because the dead are Zol's. In 2A 1120 its queen, whom the old accounts call Khirara, came up out of the Maw with her house onto the salt coast of the island and took the salt pans from the men who worked them; the coast tells that she drowned their headman in his own brine-pan and set on her head a ring of the salt crystals that grew on the pan's rim, which the heat of her body never melted. She raised the pact-hall of Unzeky over the brine pans, where the salt and the sulphur of the Maw could both be had, and her house has kept the coast since. From the salt crown come Dolon's laws: an oath of Dolon is written in salt, so that the sea can wash away any oath the queen regrets; the queen wears a crown of salt and is crowned in brine; and a thrall of the salt coast may buy his freedom only with a pact. The forge followed the pans. Since 4A 1651 Dolon's galleys have carried salt, sulphur and ash-glass to Nafeher as tribute, and since 4A 1693 the forges of Unzeky have compounded black powder from the coast's salts and the Maw's sulphur and armed Volgan's orc companies with powder-engines and casks. Queen Zhorith keeps the Dominion's forge."
 zin_realm_lore_DND:0 "The Sign\nThe Garrison Helm: an old open-faced iron helm with a tall ridge-crest, iron-grey on blood-red, with a black hem.\n\nThe Brute-Kings were never crowned. Dromand of the Barand was given the helm of the garrison's last captain, and every king since has been made by having that helm set on his head before the clan-moot. At Dardan the Charter of Free Banners let every people fight under its own sign, and Rovek of Dondor had none, so he lifted the king's helm on a spear above his veterans on the flank they held, and the helm on red cloth was sewn for the first time from that day's account. The spears of the Burning Gate hang around the same helm in the king's hall at Notbuton.\n\nWe are the garrison that stayed: what Dondor holds it holds without relief, and the helm reminds every king that he is a captain of the line before he is a king.\n\nThe Roots\nDondor's men are the garrison that was never relieved. In the first half of the First Age Aen's heirs kept soldiers on the Dondor plain to hold the chart-harbours and watch the strait, men of the old Ainic crown who were paid in iron bars from Aenor's forges. When the ships stopped coming around 1A 352 the last pay-chest was opened on the stockade's ground and its bars divided among the hearths, one bar to each family, and the captains swore at the stockade to hold the plain as if the relief were still on its way. That chest is the root of the Hearth-Iron: every hearth of Dondor keeps a bar of iron and passes it to its eldest, and a house that loses its bar loses its place at the clan-moot. The captains chose the strongest of them, Dromand of the Barand, to lead, and the orcs called him Brute-King in scorn; his men kept the name as a boast and set the garrison's old helm on his head instead of a crown. Living beside the orc holds wore their speech into Dondric and their law into the blood-price, but it also taught them that orcs are neighbours and not one enemy, which is why Rovek of Dondor could lead Dark Lands soldiers into Edran's Grand Alliance, and why in 2A 1388 Brunmar of the Urdung took Dondor's spears south to close the Burning Gate of Nezer beside southern men and elves. In 4A 1748 Dondor still thinks of itself as the line that holds, and its beacon towers are the stockade's answer to Goldoroth's bombards."
 zin_realm_lore_DNL:0 "The Sign\nA silver beech leaf laid on a green grave-mound, on twilight blue.\n\nAt the Staying of 1A 1678 the Eldest sent Herrodon's envoy home with a single leaf from the grave-beeches instead of an answer, and the queen of Herrodon kept it in the book where she wrote the household's name as lost. The household has borne the leaf on the mound since; its guides wore it painted on their cloaks over the Lunhrim Notch on winter nights, so that a fugitive of the resistance would know whom to follow.\n\nWe stay with our dead. It promises the travellers of the pass road guides who will not leave them, and tells Herrodon that the household's answer is still the leaf; a household that took up the leaf for a war would be carrying its dead with it.\n\nThe Roots\nThe elves who lived on both sides of the Great Wall before the First Age ended were hill elves of the western woods, kin of Herrodon, and they buried their dead in the Kingdom Forests at the foot of Lunhrim with a beech planted on each grave, so that the grave would have a voice when the wind came through it. The household of Thamiel is the one that would not leave them. After Edran's campaign in the Ember Lands, in which many elves died for a war they had opposed, the elves of the western woods were called home east of the range, and the household's dead from that campaign were too newly buried to leave. The Eldest answered Herrodon that a beech planted on a grave cannot be carried over the mountains, and the household stayed; Herrodon wrote its name as lost, and the household wrote the queen's as mistaken. From the graves comes everything that makes Dunelaeth what it is: it lives on the wrong side of the mountains because of its dead; it sings the Kindred Song in its old western form because its dead learned it so; it guided the resistance over the Lunhrim Notch under the Order because the grave-beeches showed the way in snow; and it gives the pass road its guides, because a household that keeps graves must keep the roads to them. Each Eldest is buried among the beeches, and the household's quarrel with Herrodon is not about who left whom but about whether the dead can be left at all."
 zin_realm_lore_DOB:0 "The Sign\nA round brown loaf stamped with a small thumb-print, on harvest green.\n\nThe Famine Bread was baked from the basin's seed-grain in 3A 899 and stamped with the thumb of the household that baked it, so that the clans of Thenon and Kradlon would know who had given. The Ronbo Oath was sworn in 3A 904 over the last of those loaves, every Warden of the Fields since has been chosen with a thumb pressed into a loaf at the moot-hall of Luddum, and the Watch carries the loaf painted on its pass-standards.\n\nWhat we give freely keeps us. It promises the Watch its pay in grain and leaf and the hungry bread without price, and tells the world that the basin has never needed a wall, only friends who remember being fed.\n\nThe Roots\nThe small folk of the Ronbo basin have farmed below the Herlitz range for longer than any western song remembers, and they think of their history as a list of harvests. They trust the ground, the weather and their own hedges; set a place at every table for Lumae of the hearth, Aurlan of the harvest and Vaelei of births and ask no other god into the house; and believe that a household which shares its harvest is never robbed of it. The dwarves of Brundahrim knew them first, trading for leaf and cheese at the high passes, and the basin's warmth and seclusion behind its passes kept it out of most of the West's wars. The wars of the Aenoran settlements reached it once: in 1A 612 households fled a burning valley on an Aenoran grain ship and never came back, and the basin learned long after that they had found a home inside the giants' ring of the Middle Lands. Its defining deed came in the western famine of 3A 899. The householders baked their seed-grain into round loaves, stamped each with the thumb of the house that baked it so that the clansmen would know who had given, and carried them over the Ronbo passes to the starving clans of Thenon and Kradlon, asking nothing; the clansmen they fed swore the Ronbo Oath in 3A 904 to guard the basin's passes for ever, and the dwarves closed the high passes above it. From the Famine Bread come the basin's customs: bread is never sold to the hungry; a guard is paid in grain and leaf, never coin; a household's thumb on a loaf is its oath; and the small folk's settled belief that what is given freely buys more safety than any wall."
 zin_realm_lore_DOL:0 "The Sign\nA white boat with four oars seen from above, on deep lake blue.\n\nThe four-oared boat is the four boats of the Mid-Lake Moot, lashed together in the middle of the lake so that no shore was nearer to one town than another. When the lake-court was founded at Parur in 4A 1580 its judges took their seats afloat on its first day under a banner showing one boat with four oars, one for each walled town, and the league has flown it since.\n\nJudged on the deep water, and sunk if broken. It promises the lake towns one voice each and every crown of the North a court that is not for sale; to Eekedor it says that the lake has never needed the vale's steelyard.\n\nThe Roots\nThe lake Dolpar is deep, cold and ringed by hills, and its people say it has no bottom, only darker water. In the Raiding Years, when the walled towns of the lake ring, the Hold, Stork, Cinargo and Solenkovi, built the walls that still stand, raiders could take a town by land but none by water, and the towns learned to meet on the lake. When a quarrel arose between them, each town sent one boat to the middle of the lake, where no shore was nearer to one town than another; the four boats were lashed together and the quarrel was judged there by the four steersmen, and the lake people said that a judgement made on the deep water would sink anyone who broke it. This Mid-Lake Moot was the lake ring's only rule for centuries, and when the towns' merchants grew tired of riding to Eekedor's Arbitration Court to settle every quarrel, they made it a court again in 4A 1580: the lake-court of Parur, whose judges still sit afloat on the first day of every session. From the four boats come the league's customs: every town has one voice, as every boat had one oar; a judgement is sworn on the water; no town may build a harbour to rival Parur's, the market all four can reach in a day; and the rivalry with Eekedor, which the lake-court regards as a shop that sells judgements by weight. The Judgement of the Mills in 4A 1694, the first the lake-court gave beyond the lake, was given afloat."
 zin_realm_lore_DRA:0 "The Sign\nAn open iron collar broken at its hinge, in red-hot orange on black.\n\nThe collar is the one a smith of the southern forges wore at the Kalioth's last furnace and broke on the night the garrisons fled; the forge-songs say he carried it over the ridge and hung it on the first forge under the Drak Furnace. The forge-houses struck the broken collar into their iron as their mark for three ages, and at the Furnace Oath of 4A 802 they chose it over a crown for the Forge-Prince's banner, because a prince of Drak is first among free smiths and nothing more. Every master's ring struck from an apprentice's neck is hung beside the first collar in the forge-hall of Castronuro.\n\nNo master but the forge: a promise to every smith of Drak that he will never be sold with his iron, and a warning to any crown that would yoke the mountain that its iron was forged by men who broke the last yoke laid on them.\n\nThe Roots\nThe forge-houses of the Drak Mountains descend, by their own oath-songs, from the slave-smiths of the Kalioth Crown. The mountain kings of the First Age worked their mines with chained mine-folk and bound their best smiths to the forges with iron collars, so that the siege-craft for which the Kalioth were feared was made by men who could not leave the furnace. When the Kalioth host died at Dardan and the garrisons starved, the smiths of the southern forges broke their collars, carried their tools north over the Drak ridge to the smoking cone the Kalioth had feared to mine, and swore to one another under the Furnace that no smith of theirs would ever again wear a master's iron. The houses of the mountain kept that oath for three ages as small, suspicious forge-clans, each guarding its craft in a locked chest, until the Furnace Oath of 4A 802 joined them under one Forge-Prince of House Barzio, whose name means iron. Their customs come from the collar: an apprentice is made a master when his master strikes a ring of iron from his neck at the forge; a Forge-Prince is chosen and never born; and the houses sell their iron but never their smiths. The irony every house of Drak knows is that the Furnace Oath bound them to sell only through Stabilo's weigh-houses, and that the black powder their forge-master Arcan Dolgio compounded in 4A 1532 from the Furnace's sulphur has made the descendants of slave-smiths the master-smiths of other men's wars."
 zin_realm_lore_DRE:0 "The Sign\nThe Three Piles: three black piles standing upright, the middle one tallest, rising out of a wavy band of fen-green, on a pale reed-yellow field.\n\nThe three piles are the first ones driven at Dolido in 3A 520 by the three eel-fishers who led the escaped levies into the fens, and the hall on black piles still stands on them. The reed-council keeps three path-elders in their memory, and when a council is called its elders touch the three piles before they sit. The fen orcs embroidered the piles on reed-coloured cloth when the Free Moot first asked them to send a band to the hills, so that the other holds would know the fen-folk by their own sign and never mistake them for anybody's levies.\n\nWe stand where no one else can: the piles promise refuge to every runaway and warn every host that the ground beneath Dreson belongs to the council alone.\n\nThe Roots\nThe fen orcs of Dreson are the levies who would not go. In the Buried Wars the Necromancer's recruiters took the young orcs of the iron holds in chains for his garrisons in Aenor, and in 3A 520 a column of them broke their chains on the march and fled into the fens, where the garrisons' horses sank and their carts could not follow. Three of them, who had grown up as eel-fishers on the fen's edge, knew the paths, and they drove the first three piles into the reeds at Dolido so that the others had somewhere to stand. Those three were the first path-elders, and the reed-council of Dreson is their heirs: elders who know the fen paths and teach them only by walking them, never by drawing them, so that no map of the fens exists outside the council's memory. From the flight comes the fen-law that no chains enter the fens: no slave, no thrall and no prisoner is held at Dolido, and an escaped captive who reaches the reeds is free. From the paths comes Dreson's way of war, the guide who walks ahead of a host and then is no longer there, which drowned the Necromancer's patrols in the Third Age and a Goldoroth host in the Reed Drowning of 4A 1561. The hall on black piles still stands on the first three piles, and every path-elder is buried standing in the reeds beside them. In 4A 1748 Dreson belongs to nobody, and the reed-council weighs every envoy against the fen-law."
 zin_realm_lore_DRK:0 "The Sign\nThe Gate-Chain: a heavy black chain of three great links hanging in an arc, on a dull gold field with a black hem.\n\nThe chain Zugash hung across the narrows at Doldes in 3A 880 still hangs there; each of its three links is the height of an orc, and it is lowered for every traveller who pays and for nobody who does not. Before it there was the smith's chain of the Buried Wars that broke the Necromancer's carts in the dark, and the gate-chiefs say the middle link was forged from it. The chain on gold was the toll-sign that caravans looked for on the road south, meaning that the gate was open to those who paid; since 4A 1470 the gate-chief has flown it under Cocanoor's banner.\n\nNothing passes the gate unpaid and uncounted: to its own people the chain is their freedom, and to Goldoroth it is the yoke the gate-hold bears.\n\nThe Roots\nThe pass at the foot of the Goldoroth Mountains has always been the throat of the Goldoroth arm, and the orcs who hold it remember every host that has gone through it. In the First Age Volgan's envoys came north by it and the orcs of the arm went south by it to the Southern Burning; after Dardan the broken bands came back through it, and those who kept the pass let them through for food and weapons, the first toll the pass ever took. In the Buried Wars the Necromancer's columns used the same road, and a band of free orcs held the narrows against them by stretching a smith's chain across the path at night, so that horses and carts broke on it in the dark. Zugash, who built the gate-fort at Doldes in 3A 880, was of that band, and he forged a great chain of three links to hang across the narrows and lowered it for any traveller who paid. From that chain comes the gate-hold's one law, that nothing and nobody passes unpaid and uncounted, not friends, not kin and not the envoys of a Great Spirit, and its tally-keepers still cut a notch for every caravan. When the first Warking made the gate-hold his tributary in 4A 1470 he did not take the chain down: he made the gate-chief pay Cocanoor out of it, so the chain that made Doldes free became the yoke it pays. In 4A 1748 the gate-chief tolls Volgan's envoys like any caravan, and remembers that the pass has been sold to the south before."
 zin_realm_lore_DUL:0 "The Sign\nThe Four Fires: four red flames rising side by side from one black hearthstone, their tips leaning together, on charcoal with a yellow hem.\n\nThe four fires lit on one hearthstone at Lesderle in 3A 1150 have burned there ever since, each tended by its own valley's keepers. When the four valleys first marched together under the oath their chiefs had no common sign, and the hall's weavers stitched the four fires on one stone so that every valley could see its own fire in the banner and none of them stood above the others. The holds of the Free Moot carry small copies of it to Lesderle when they come to speak.\n\nFour fires, one hall: no valley stands alone and none rules the others, and the banner warns Cocanoor that an iron yoke must put out all four fires at once.\n\nThe Roots\nThe four valleys of the long valley were four holds of the Iron Clans long before Aen, each with its own fire-rite: the north valley kept its fire in an iron basket, the river valley on a flat stone, the high valley in a pit and the south valley on an open hearth, and each held the others' rites in contempt. What made one realm of them was the Necromancer's last levy. In the late Third Age his recruiters came for the young orcs of all four valleys in the same season, and each valley found that it could not hide its young alone. In 3A 1150 the four chiefs carried their fires to the hall at Lesderle, the only hall all four could reach in a day, lit them side by side on one hearthstone and swore that the four fires would burn together or not at all; the recruiters found four valleys under arms and went back without a single orc. From that oath come Dulundur's laws: each valley keeps its own chief and its own fire, the hall speaks only when all four agree, and an envoy who asks one valley to break from the others is put out of the hall, as Goldoroth's envoy was in 4A 1612. The goblins of the valleys, who ran messages between the fires on the night of the oath, keep a lamp beside them in the hall to this day. From the same oath came the Free Moot of 4A 1488, when the Four Fires called the free holds to Lesderle against the Iron Yoke and offered them the same bargain: keep your own fire, and keep it beside ours. In 4A 1748 Dulundur is the free holds' strongest voice, and its people say that a hall with one fire is a hall waiting for a master."
 zin_realm_lore_DUN:0 "The Sign\nThe Turned Sail: a black ship with one square sail split down the middle, red on one half and white on the other, on a sea-grey field with a black hem.\n\nThe turned sail has been the toll-king's ship-sign since Rukhesk took Dobudo in 4A 1300: a sail of two halves, each dyed in the colour of a paying neighbour, turned on the yard whenever the payment changes. Ships entering the Dun Sea look at the toll-king's mast to know which side the channel favours that season. The red and white sewn on Dun's banner are the colours of the first two neighbours the Zhaggul sold the channel to, and the toll-kings like to say they have never needed a third.\n\nEverything has its season and its price: the sail promises any buyer the channel for a time, and warns everyone that Dun's favour turns with the wind.\n\nThe Roots\nThe toll-kings of Dun claim a crooked ancestor and are proud of him. The Zhaggul say their forefather was an orc ship-captain of the First Age who sold the Grand Alliance the hour of Volgan's crossing and sold Volgan the hour of the Alliance's, took gold from both, and was paid by neither when they found out; whether it is true nobody can say, and the chroniclers of other lands have never found his name, but every Zhaggul child learns it. The peninsula at the mouth of the Dun Sea suited that lesson. Every ship into or out of the inner channel passes under Dobudo's walls, and when Rukhesk of the Zhaggul took the toll-town in 4A 1300 he set up the custom his house has kept since: the toll-king's ship flies a sail of two halves, each dyed in the colour of a neighbour who pays, and the halves are turned on the yard whenever the payment changes, so that the paymaster's colour faces the channel. The toll-kings marry into every hold that will have them, the crown goes to the son or daughter who wins the ring, and the house's law is that a promise lasts as long as its price, which made the Swing of 4A 1596 a matter of pride at Dobudo and of disgust everywhere else. From the ancestor's tale also comes the Zhaggul fear that a buyer who learns he has been sold will one day come back, which is why Dobudo's walls are the strongest on the Dun Sea. In 4A 1748 Dun is the least trusted crown of the Dark Lands and perhaps the best informed."
 zin_realm_lore_EEK:0 "The Sign\nA black steelyard balance with its hanging weight, on gold.\n\nThe steelyard is the grain-weigher of Viktara's harbour, on which the grain-families weighed the raider chief's sword against grain, silver and blood in 2A 1205, and which has hung above the council's table since the counting houses formed their council in 4A 620. The Arbitration Court opens every judgement by hanging a weight on it, and the vale's bills of exchange bear its mark, so that a Viktara bill is honoured from Sonargur to Parim.\n\nEverything can be weighed. It promises every crown a fair judgement for a fair fee and every debtor an honest account; to its enemies it says that the vale will price their war before they start it, and to Dolpar's lake-court it is the scale of the North's first bench.\n\nThe Roots\nThe Eekedor Vale has always been the North's granary, and its people have always preferred to weigh a danger rather than fight it. In the Raiding Years, when orc and goblin bands crossed from the Dark Lands and the crowns of the interior raised hill-forts, a raider host came down the vale to Viktara in 2A 1205, and the grain-families met its chief at the harbour with the great steelyard on which they weighed the barges' grain. They hung his own sword from the hook and weighed it against grain, then against silver, then against what a siege would cost him in his men's lives, and told him the price of each; the host took the silver and left, and three of its captains stayed behind to guard the vale for wages. The vale has lived by the steelyard since. From it come the council's laws and its court: everything has a weight, and a quarrel is settled when both sides agree what it weighs; the counting houses lend to every crown, because a debtor weighs more than an enemy; the Arbitration Court founded in 4A 906 is the steelyard made into a bench, and the North's crowns pay to have their feuds weighed there; and the vale has never raised a great host of its own, because it has always found it cheaper to buy one. The old steelyard still hangs above the council's table at Viktara, and the Speakers say no grain has ever been weighed on it short."
 zin_realm_lore_ELD:0 "The Sign\nA spear broken in two, the halves laid apart with a gap between them, in quay silver on night sea: the Broken Spears of the Road's End.\n\nThe broken spear is the first deed of the Archive: in 2A 9 the witnesses of Lenkei broke the spears of the elves who fell in the Ember Lands across the treaty-stone at the road's end and wrote each name before they let the companies pass. The loremasters sewed one broken spear on the cloth that covers the Book of the Fallen, and they carry that cloth as a banner whenever the Archive's books leave Lenkei. The halves are always shown apart and never mended.\n\nThat war is read before it is waged: to the Kindred a warning that every march is paid for in names, and to anyone who would ask the elves to fight a promise that the Archive will read him the cost first.\n\nThe Roots\nThe loremasters keep a treaty older than their house: long before Aen the elders of the shore let the road of an eastern kingdom cross the southern rift shore on condition that no army of that kingdom came with it, and the house that kept the treaty kept the road's end at Lenkei, where the old roads still stop. It was a house of witnesses, whose duty was to see who came along the road and to remember it. Its great change came after the Ember Lands. When the companies of the Grand Alliance came home along the old roads, those who carried the spears of the fallen laid them down at the road's end, and the witnesses would not let the companies pass until every spear had been named. They broke each spear across the treaty-stone so that it could never be carried to war again, buried the heads, and wrote the names in the first book of the Archive in 2A 9. From that day come the Archive's rule that no elf should march until the names of the last war have been read, its keeping of every vote of the Refusal, its right to refuse any reader, king or elf, and its custom of reading the names of the fallen aloud at the road's end every spring. The unfinished book of 3A 1180 lies in the same hall as the broken spears, and the loremasters say only that both are records of something that stopped. In 4A 1748 they are copying the oldest books, and some of them have begun to ask whether a second heap of spears is coming."
 zin_realm_lore_ELV:0 "The Sign\nA white silk-moth with its broad wings spread, on deep loom violet.\n\nThe moth is the silk-moth of the cape, whose thread closes wounds and makes the Sunhot's silks, and on every banner of Elvana it is woven, not painted, in the moth's own thread. When the sanctuary chose its own Speaker in 2A 640, the healers hung a moth banner over the door of Googavis, and the Weavers' Judgement of 4A 1517 was a contest of two banners, Elvana's moth against Igara's crane, which the Noon Council could not tell apart in worth.\n\nHealing and weaving with one thread: to the sick a promise of care before payment, and to Igara a standing challenge.\n\nThe Roots\nThe sanctuary on the Cape of Elvana was a house of healers long before it was a realm, and its elves say their craft came from the silk-moth. In their telling, long before Aen the healers of the cape found that the thread a white moth of the cape spins about itself would close a wound and leave no fever behind, and they learned to keep the moths, unwind the thread and weave with it. From that they became both the weavers and the healers of the Sunhot: the same hands that stitch a wound weave the bright silks the Sunhot wear, and the healers of the cape say a wound is a torn cloth and must be mended with the same patience. The moths are kept in the sanctuary of Googavis, which looks over both the cape shore and the Elvini shore so that its healers could serve the shrines of both; a moth is never killed for its thread before it has flown, and no Elvanan weaver sells a cloth she has not first offered to the sick. In 2A 640 the sanctuary chose its own Speaker rather than answer to Eldoga, and Igara followed sixty-two years later, which the Elvanans have called envy ever since. The Quarrel of the Shallows over the sun-cranes, the Weavers' Judgement of 4A 1517 and every song and petition between the two realms make a rivalry without blood, and the Elvanans would not give it up for anything, because it is the one quarrel in the world they enjoy."
 zin_realm_lore_ENH:0 "The Sign\nA round grey diving stone with a hole through it, hung on a looped cord, on lagoon turquoise.\n\nThe diving stone is the holed stone Nuoyo nau Enhis tied at his waist to sink to the drowned shrine after the Rising Tide of 2A 40. It hangs in the shrine-house at Suyowan, every Priest-Elder makes the dive with it before taking office, and its cord is renewed by each new Priest-Elder with his own hands. The lagoon villages carry the stone's banner at the head of every pilgrimage on the Reef Road.\n\nGoing down to keep the names: to the islanders a promise that the tally beneath the tide will never be lost, and to anyone who would disturb the shrine the reminder that its keepers go where others drown.\n\nThe Roots\nThe Yonic-speaking seafarers who settled the two arcs long before Aen came from somewhere their oldest songs do not name, and the first thing every canoe did on reaching a new island was to count its dead: each lost crewman was carved as one wave on the reef rock, so that the sea would know whom it had taken. The lagoon villages of the Great Isle kept the largest of these tallies, and when a stone shrine on the Great Isle's southern shore came to bear a carved name over its door in the First Age, the tally-keepers read the name as Aen and took it into the tally of the dead without knowing why. In the Year of the Grey Sea, 2A 40, a storm tide drowned the southern shore and the shrine with it. The lagoon villages thought the name lost, until the tally-keeper Nuoyo nau Enhis swam down to the drowned shrine with a holed stone tied at his waist to sink him, found the door and the carved name still there, and came up alive; the villages made him the first Priest-Elder, and he founded the Calling of Names beneath the water. From the Rising Tide come the realm's customs: the Priest-Elders are chosen from tally-keepers who have made the dive with the stone; every islander may walk the Reef Road to the shrine to bring a name for the tally; and the names are called beneath the tide because, the islanders say, the names are needed, though who needs them they do not say. The guest-right of the whole south was sworn again at the drowned shrine after the Fever Years, and since the Year of Ash of 4A 1622 nobody on the Great Isle doubts the Priest-Elders."
 zin_realm_lore_ERC:0 "The Sign\nA black iron diadem of seven points turned upside down, its points downward, on stone grey.\n\nWhen Rhanoth's mine-lords took the last Kalioth king's diadem in 2A 12, they set it on the floor of his hall with its points down before they walled it up, so that it would crown no one, and the first banner of the mine-lords showed the diadem as they left it. Its seven points became the seven forts of the Kalioth upland when Erco raised them in 4A 1120. A Rhanid king is shown the walled place once, at his crowning, and told that the crown under the mountain is turned downward and must stay so.\n\nA crown that rules nobody: to the mine-folk the promise that no Kalioth will rule them again, to Alerhia and Noris the assurance that Erco is not the old empire, and to anyone who knows the old songs the threat that a crown kept is a crown that can be turned upright.\n\nThe Roots\nErco is the shadow tempted to become what it overthrew. Its mountains were the iron height of the Kalioth Crown, the empire the mountain kings proclaimed in about 1A 1000 as Rhabtarkia, the Greater Bridge Kingdom, swearing to rejoin the shores; its kings ruled mine-folk, desert tribes and the pass-houses from walled upland cities, paid Volgan the Black Tribute and held the downs of Herez and Noleksun for him for about a century. The mine-folk of the southern mountains were the Crown's miners and fort-builders, ruled but never trusted. When the Kalioth host died at Dardan and the beaten garrisons came home starving, the mine-lord Rhanoth, who had held the river ford through the whole war, shut the passes against them, besieged the last king in his hall and was crowned in the southern river in 2A 12. The mine-lords would neither wear the king's iron diadem nor melt it; they walled it up in the hall of Barzoth, and every Rhanid king swears at his crowning to keep the seven forts and to pay what the mountain asks. Erco's customs are those of people who live over a buried crown. No miner may strike the wall in Barzoth's hall. The forts are manned by miners who are also soldiers, because the Kalioth's walled cities taught the mine-folk that a mountain is held by those who dig it. And the fire-tithe the realm has paid to the Smoking Teeth since 4A 1206 is called a tax by the people and an offering by the priests, because nobody in Atonto wants to say aloud that the old kings paid the mountain too."
 zin_realm_lore_FEA:0 "The Sign\nThe Bound Spears: seven upright spears bound together at the middle by a red cord, white on a dark moss-green field, with a brown hem of hide stitching.\n\nEach steading lord brings his own spear to the hall at Azenoalion and lays it in the bundle when the moot opens; the red cord is tied round the bundle by the eldest lord present and cut by the first lord when the moot closes. The clans say the first bundle was tied on the Naepu ice when their forebears refused the last king of the old hall, and the banner of seven spears was first sewn for the Free Steadings in 4A 1304, one spear for each steading that swore the refusal; the banners of the Melkgard raiders lost on the open snow in 4A 1112 hang beneath it in the hall.\n\nMany lords bound to one another and to no crown: a promise that no steading goes hungry while another has stores, and a warning to Fandanar and Minnolomak alike that the bundle does not break one spear at a time.\n\nThe Roots\nThe steading lords of Fearno tell the end of the Sunfields differently from the fire-keepers of Fandanar. In their telling, when the fields failed the last king of the old hall called every clan to bring its herds to him so that the hall might live, and the moor clans of the Naepu, who saw that the herds would be eaten and the hall would empty all the same, bound their spears together on the river ice and refused him. The king's hall died that winter, the moor clans lived, and from that refusal the moor folk took the conviction that a crown eats first and feeds last. Their law came out of it: no lord above the lords, a first lord chosen only to speak and only for a term, every steading's stores open to a hungry neighbour, and a spear laid in the bundle by each lord at the moot to show that he is bound to the others and to nobody else. The Naepu clans kept the Spear-Binding through the Second Age while they learned to sow moor oats in the river bends, and when Fandanar and Minnolomak both sent for their oath in 4A 1304 the steading lords did at Azenoalion what their forebears had done on the river. In 4A 1748 the hall still argues for a month before it agrees, because agreement must be every lord's, and the Free Steadings are the one people of the north who would refuse a crown of the Sunfields even if it were offered to them as their own."
 zin_realm_lore_FNG:0 "The Sign\nA white ram's head with heavy curled horns, in fleece white on ice grey.\n\nThe ram is the white ram of the first crossing to the Kile Islands, which walked out onto the frozen channel ahead of the flock. The pilots' isles carved its head on the prow of every pilot boat long before there was a Speaker, and the Speakers of Kapai have flown it over the pilots' harbour since 4A 520; a Fineger pilot boarding a foreign ship hangs a small ram's head of horn at its bow.\n\nThe pilot goes first: to every ship in the northern waters the promise of safe passage for the fee, and to any fleet that would cross without a Fineger pilot the warning of the ice.\n\nThe Roots\nThe cold northern isles of the arcs are the nearest to the Cold Lands, and their folk are the island kin who kept the most of the old north. Their pilots' words for ice and reef are the proto-Boreal words of the Sunfields, and the pilots say their forefathers came down from the north over the ice when the long winters drove the Sunfield clans out of their halls long before Aen, driving their sheep before them. Their oldest tale is of the first crossing to the Kile Islands: the channel had frozen and nobody knew whether the ice would bear them, until a white ram walked out onto it ahead of the flock and crossed, and the families followed where its hooves had held. The ram that leads the flock over the ice has been the pilots' sign since, and the pilots of the northern isles still say that a pilot is the ram of his ship. They lived by kelp, sheep and piloting other men's ships through waters only they knew, and in 4A 520 the pilots of the Fineger Islands, Ziza and the Kile Islands met at Kapai and chose a Speaker to set one fee for every ship that enters their waters. From the ram's crossing come the isles' customs: a Speaker must have piloted a ship through the Poolho ice; a pilot goes first and is paid first; and a debt is worked off, as the pilots worked off for ten years the grain that Raerby's brokers carried north in the Kelp Famine of 4A 1601. The Norrai Pilotage with the harbour council of Vindael, made in 4A 1466, is the oldest standing compact between the isles and the Cold Lands."
 zin_realm_lore_FOT:0 "The Sign\nA black chain drawn taut straight across the field, on a field of red over white.\n\nThe chain is the anchor-chain of Ostvar's Leren ship, which he cut from its anchor and stretched across the landing at Deoreh when the Order's tribute ships came to cross in 3A 1104. A link of it is hammered into the toll-post at the landing and the lord of Fotan wears another at his throat; the red over white are the colours of the two families, the Leren captain's and the Aenoran ferry-house's, who held the chain between them.\n\nThe crossing is ours to open and to shut. It promises any ship that pays a safe passage and tells both crowns that the shortest road between the North and the Vale runs under a house that owes neither; since the Toll of Parim the chain has been drawn tighter against Aenoran hulls.\n\nThe Roots\nFotan's chain is young, but the crossing it closes is the oldest road between the Middle Lands and the North. Before the Ship-Bond of 1A 207 the narrowest crossing of the strait was worked by ferry-families on both shores who had no king and paid no one, and the strait-folk's eldest saying is that a crossing belongs to whoever keeps the boats in repair. The ferry-folk of Deoreh also tell, and nobody has disproved it, that in the deep winters of their grandmothers' grandmothers they heard knocking under the landing, slow and regular, as of picks far below the strait, and that one winter the knocking stopped and never came back. The house of Ostvar grew out of the Order's centuries. In 3A 1104 a Leren sea-captain of that name married the daughter of the Aenoran ferry-house at Deoreh, and when the Order's tribute ships came to cross he cut his ship's anchor-chain from the anchor and stretched it across the landing, and the two families charged the Order to pass. The Order burned their tower twice and never kept them out. From the chain come the lordship's habits: the strait-folk pay their toll to a house, not a crown; Fotan refuses any charter that would make its toll a crown's; it belongs half to the North and half to the Vale and marries into both; and its lords count their descent from a Leren house whose name the margraves of Molot also bear."
 zin_realm_lore_FRE:0 "The Sign\nA white ox kneeling, on a field of warm red-brown.\n\nThe kneeling ox is the drovers' ox that found the spring, whose horns hung over the first spring-house until demon raiders burned the house in 2A 1240 and the horns were lost. The spring-masters had the kneeling ox carved over the new door and painted on the carts that carried the sick to the spring-houses, and in fever years a cart bearing the kneeling ox was let through every closed road of the southern Vale.\n\nWater before questions, and healing for any who come. It promises every traveller that he will be served at the spring; its rivals read it as a town that kneels to whoever pays, and the Golden Charter has made the joke sharper in 4A 1748.\n\nThe Roots\nThe warm spring of Hordorton is older than any name the drovers gave it, and the drovers of the south road tell how it was found: long before Aen, in a summer of drought, a drover's ox, dying of thirst at the crossing of the roads, went down on its knees and struck the ground with its horn, and warm water came up where it knelt. The drovers buried the ox beside the water and set its horns over the spring, and the first spring-house of Sulethe was raised over the grave before there was a town. The spring-masters' customs come from that kneeling: whoever comes to the spring is given water before he is asked his business, ox or king; no beast is slaughtered within sight of the spring-house; a drover's ox is watered free; and the masters bow when they draw water, because the spring was given to a creature on its knees. The water's healing was proved in the fever years of 2A 640, when the sick who drank only from the spring died less often than the rest, and the spring-houses became the hospitals of the southern Vale. That gift has its other side. Freshon has always served whoever came, and in 4A 1731 the spring-masters knelt to the Golden King for a Golden Charter at a price that emptied three generations of savings, which Pazoma's guild-masters never tire of mentioning."
 zin_realm_lore_GAA:0 "The Sign\nA white hind with her head lowered to drink, on deep harbour blue.\n\nThe hind is the white hind of the First Rain, which drank first from the spring at Sodoli and did not flee; the keepers say the spring is hers and the court only keeps it. Lorien's host carried her to Dardan on blue silk, and the captains of the Alliance who saw the late banner come over the ridge called the Gala the hind's host. Since the Garden of the Dead was planted in 2A 9, the banner has gone beyond the Lands of the Sun only once, to the Refusal, where Gala's envoy laid it on the table folded.\n\nThe court that keeps and does not take: to the Sunhot and to Aenor a promise of courtesy and of help freely given, and to any king who would spend the Gala's host for a crown the warning that the hind does not come when called.\n\nThe Roots\nThe Gala keep the oldest court of Aoaz and will not say where it began. What they do tell, and tell every guest, is the First Rain: the court's memory begins on a dry shore under the dormant volcanoes, where a rain fell such as that shore had never had, and where it soaked into the rock a spring rose in a courtyard of stone. A white hind came down to drink from it first and did not flee from the people who found her there, and the court has kept the spring ever since as the Mirror of First Rain, whose still water shows true traces of the past and possible futures. Whether the Gala came to that shore from elsewhere, and whether they are kin to the Sunhot, are questions the court answers with silence. From the Mirror come the Gala's customs: lineages are remembered by the keepers of the Mirror and not by dates; no Gala hunts a deer; and a vision shown too plainly is not spoken aloud, because the keepers hold that a prophecy said plainly makes people do what it shows. The Gala are the most powerful of the elves, and their long memory has made them slow to anger and slower to forgive. Lorien led their host to Dardan at the call of Edran's Grand Alliance and saved a collapsing flank, then watched Edran spend his elves in the Ember Lands against his advice. The Garden of the Dead at Sodoli and the Refusal of 2A 2121 grew from that grief, and the court still distrusts every king who turns a victory into a crown."
 zin_realm_lore_GHH:0 "The Sign\nThe Song-Whorl: one broad white spiral winding inward, with notched edges as if carved, on a dark slate field, with a white hem of notches.\n\nThe spiral is the mark that the height clans carve on horn, bone and the walls of the song-caves for the one song that every clan's song continues, winding back to its first turn. The only one men have seen close is on the carved horn given to the Coldic envoy at Huummal in 4A 1270, which hangs in the Frost-Hall; the height clans paint the same spiral beside the mouth of Huummal, and the shelf yeti say that a height clan going to war paints it on its own breast.\n\nThe song that has no end and waits for every broken turn to be taken up: to a friend it promises remembrance, and to an army in the high snows it says that each of its dead will be sung for and answered.\n\nThe Roots\nThe height clans of Ghaahu say their song is the older, and the shelf clans, who will argue about almost anything, do not dispute it. In the height clans' telling every clan's song is one turn of a single song that began before the clans, so that a clan singing at dusk sings its own turn and, beneath it, every turn that came before it back to the first; a song that is broken off is not ended but waits to be taken up. This is why the height clans answered the avalanche of 4A 1515 by singing every dusk for a year for the buried clan, so that its turn would not be lost, and why the shelf heard the singing across the mountains. The heights follow wild herds through the Cold Mountains rather than the seal, live in song-caves rather than at a fire, and keep no truce with men because they have never needed one: in their song men are a turn that has not yet been sung. The one envoy they received, a Coldic man vouched for by a shelf Eldest in 4A 1270, came back with a carved horn wound with the spiral of the song, which hangs in the Frost-Hall; after the hunters of the east coast followed a herd into the high snows without leave in 4A 1650 and did not return, no man has been received at Huummal. In 4A 1748 the heights are almost never seen, and a crown that wants them must first be sung to them by the shelf."
 zin_realm_lore_GIR:0 "The Sign\nA line of five grey stepping-stones across a single blue river band, on green.\n\nThe stones are those the first wardens carried from their own fords and laid across the main ford at Arligon in 1A 640, so that a warden could cross dry on his brothers' stones. The commonwealth's banner has shown them since the Settler Wars, and a warden who dies is mourned by lifting his ford's stone and laying it again; the fifth stone of the banner is the Grey Ford's, which the wardens painted black for the forty-three years of the border war.\n\nThe crossings are held together or not at all. It promises every ford its share and every quarrel a hearing at the stones; to Gunwyn it is a line with a stone missing, and the truce of 4A 1745 has not yet put it back.\n\nThe Roots\nLong before Aenor's ships came, the clans of the Girdon plain lived by the fords of the Grey River, and their oldest custom was the ford-share: whoever kept a crossing clear of drowned trees and silt took a share of what crossed it, and the river, they said, mistook the ford-keeper's town for a guest and spared it in flood as long as the keeper fed it a loaf at every high water. When the settlers came up the river the fords became the frontier, and in 1A 640 the clansmen who held them met at Arligon and swore at the ford-stone to keep every crossing against the settlers and to judge every quarrel on the river by one law. Each sworn man carried a flat stone from his own ford to Arligon and laid it in the river there, so that the wardens' stones made one line of stepping-stones across the main ford and any warden could cross dry on his brothers' stones; each took the name of the ford his stone came from, and the wardens chose a Warden-Speaker among themselves. From the stepping-stones comes the commonwealth: no king, because no stone in a line stands higher than another; the blood-price before revenge, because a warden who breaks the line with a feud drowns the crossing; the river-court, where every quarrel on the water is judged at the stones; and a grievance that has run into every war since, for when a Gunwyn war-thane killed the ford-warden at the Grey Ford in 4A 1702 and the blood-price was refused, the wardens said a stone had been pulled from the line."
 zin_realm_lore_GLI:0 "The Sign\nThe Crossing Lantern: a closed copper lantern with green horn panes hanging from a short black chain, on a black field, with a white hem of steam-curls.\n\nThe lantern is Drik's, which led the warrens over the winter ice of the Coldor Channel; it hangs in the hall of the great spring at Drikzig, and every warren's own lantern was lit from it. The goblins hammered its shape into the copper badges their trappers wore to the first snowline fair in 2A 1290, so that the coast clans would know that a goblin with a lantern came to trade and not to steal, and the same shape, sewn in green and copper on black, has flown over Drikzig ever since.\n\nThe Warren Luck: while the lantern burns the warren lives; it promises good traps and lamps at the fair and warns that the warrens will defend to the last the springs that saved them.\n\nThe Roots\nThe goblins of Glimkit remember the south only as the country of the burning roads. When the wars of the Long Grief drove their warrens north around 2A 1000, a column of warren-folk with a few hobgoblins and their bone-hounds reached the coast facing the Coldor Channel in the Long Dark, where goblins should never be, and the warrens tell that they would have died on the shore if a lamp-keeper called Drik had not seen, across the frozen channel, a pale plume rising from the mountains under the stars. Drik closed his lamp against the wind with panes of horn and led the column over the ice toward the plume, and his lantern was the only light they had; those who lost sight of it froze. The plume was the breath of the great spring of Agoron, and the warrens dug in around it and built Drikzig, the hall of the warm water. From the crossing come the Warren Luck and its laws: every warren keeps a closed lantern burning that was lit from Drik's, a warren whose lantern goes out is doomed until it is lit again from the hall, the hot springs are the mountain's breath and bathing in them is the one solemn rite, and no goblin goes out on open snow without a lantern-bearer. The hobgoblin chief is made big enough to frighten the coast clans, but the warrens obey the lantern-keepers, and Plickit the Broad, the chief of 4A 1748, knows that the lantern in the hall matters more than he does."
 zin_realm_lore_GNW:0 "The Sign\nA black rook carrying a gold barley-ear in its beak, on downs green.\n\nThe rook is the bird of the clan song, which went before the clans over the neck carrying ears from their last barley-carts and led them to the downs where barley grew. The Rookwyn took their name from it, and Cadyn was acclaimed at the Oath-Ring in 1A 880 under a hide painted with the rook and the ear; Taryn's western host carried the same hide at the head of its banners in the war against Volgan.\n\nWe sow it, so it is ours. It promises the clans that the land they sow will not be taken by any fleet or charter, and reminds Aenor that the West was found by people who walked there long before the ships; to Werlendor the ear in the rook's beak is the crown of Bulligon, which it says the moot gave to the wrong son.\n\nThe Roots\nThe clans of the downs remember a country they have never seen. Their singers keep the song of Faenn-Cheulu, a land of sun and fields in the north where their people lived before the winters lengthened, and tell how over many lifetimes the ice came a little farther south, the fields failed and the halls emptied, until the clans left. They came south over the neck into the green downs, and the song says the rooks went before them, following the clans' last barley-carts and leading them to where barley would grow again; the clan that walked behind the rooks took the name of the Rookwyn and was the first to sow the downs. From that long walk the clans built their law: a country is held by the people who sow it, which is why the downs never accepted that Aenor's ships could own the West by finding it; land belongs to the clan, and the king rules by the clans' law and never above it, because the old kings of the north could not stop the ice; and the Lawspeaker remembers every oath, as the singers remember the lost country. When the Aenoran settlers came, the clans fought them for four centuries under war-chiefs chosen for one war at a time, and when the settlers' grip failed in 1A 880 the chiefs at the Oath-Ring acclaimed Cadyn of the Rookwyn king for life, heir of the clan that had walked behind the rooks. Gunwyn has fought every war since as a people who were once driven out of a country and have sworn not to be driven out of another."
 zin_realm_lore_GOF:0 "The Sign\nA great winged seed, a single seed with one long curved wing, in pale leaf green on deep forest green.\n\nThe Sunhot say the God Forest grew from one seed the Keepers planted, and the winged seed is the sign the sanctuaries drew for the forest long before anyone asked the Keepers for one. When the Noon Council's invitation came back in 4A 88 tied with a living vine, a winged seed was found inside the binding; the Sunhot took it as the Keepers' answer and their only word, and whoever speaks for the wood at its edge has carried a banner of that seed since.\n\nWhat grows here was planted before you: to the forest's neighbours a promise that the wood will shelter whom it chooses, and to anyone who enters without leave the warning that the wood does not give its pilgrims back on demand.\n\nThe Roots\nThe God Forest is older than every Sunhot record, and its Keepers say nothing about it. What the Sunhot tell is that when the first sanctuary was built on Sun Lake long before Aen, the wood south of the lake was already closed and already kept, and that its Keepers were seen only at its edge, where they took what was left for them and gave back nothing that could be named. The Sunfolk call them elves; the Sunhot, who have seen them closer, say they are never quite shaped like anyone else and move through the trees as if the trees moved with them. The Sunhot believe the forest grew from one seed planted by the Keepers before there was any other wood on that shore, and they call it the God Forest because they hold it nearer to the gods than any sanctuary; no Sunhot cuts a tree within sight of it. The Keepers' only recorded deeds are refusals and returns. After Dardan they closed the forest to every outsider and its paths grew over; three Sunfolk pilgrims who walked in without leave in 3A 811 came out a year later unharmed and with nothing to say; and when the Radiant Speaker invited them to the Noon Council in 4A 88, they sent the invitation back tied with a living vine. From them comes the law of the closed wood: nobody enters without the Keepers' leave; a pilgrim who walks in is not stopped and is not expected back; and the forest's silence is treated as holy by everyone who lives near it. Whose kin the Keepers are, nobody outside the wood knows."
 zin_realm_lore_GOL:0 "The Sign\nThe Crown of Broken Blades: a black iron crown of unequal jagged points, each one a broken sword-blade, on a fire-red field with a charcoal hem.\n\nWhen Skarag of the Krumgul broke the last rival chief in the ring at Sungodor in 4A 1452, the chiefs of the four blocs brought him the blades of every chief he had beaten on his way to the ring, snapped at the hilt as the custom of the ring demands of the beaten. The chain-smiths of Sungodor hammered the broken blades into a ring for his head, and every Warking since has added the blade of the challenger he broke. The banner shows the crown as it first was, all jagged points and no gold, because the Volcano Clans hold that a crown of broken blades is the only crown an orc should trust.\n\nGoldoroth is made of beaten rivals: the banner promises the holds that every Warking won his seat with his own hands, and warns every chief that the crown has room for one more blade.\n\nThe Roots\nThe Volcano Clans did not begin at the Fire-Mountain. Their songs start in the iron hills, where the oldest orc holds were dug long before Aen, and they turn on one grief: the march to Dardan. In the second millennium of the First Age Volgan's envoys came into the hills with gifts and promises, and the four great clan-lines of the hills, the forebears of the four clan blocs, sent their young to his host. Orcs held the forward lines at Dardan and died there in heaps, and when the battle was lost the masters who had promised them the Middle Lands left them on the field. The few who came home walked the whole way north through hostile country, and the Fire-Speakers still chant the Long Walk from Dardan at the Ember-Night, naming the hills where the walkers fell. From that walk came the two laws Goldoroth is built on. The first is the ring: a chief who cannot win his place with his own hands has no right to send others to die, so every chief, and since 4A 1452 every Warking, holds his seat only until a stronger challenger breaks him in the ring. The second is the moot's saying that no spirit rules the Dark, which the clans swore after Dardan and which many of them broke when they kept fighting in Volgan's name through the Second Age. The Fire-Mountain became holy later, when the clans moved into the volcano country and found that its heat kept off the cold and its smoke the glare of the sun; the Fire-Speakers say the mountain is the one master that never left them. In 4A 1748 the old grief divides the court: one party says Goldoroth must never march for a southern master again, and the other that this time the orcs should take the Middle Lands for themselves."
 zin_realm_lore_GOO:0 "The Sign\nA spear reversed, its point downward resting on a ground line, in ash brown and iron grey on harvest gold.\n\nThe reversed spear is the guests' spear of the first landing, carried point down by the elders who walked up to the first sanctuary. The steadings of Goodin carried it to the Steadings' Moot at Elgagen in 3A 905, and Talae the Guest stood before the Noon Council with a reversed spear in 4A 412, the first man to speak there; the levies of Goodin carry their spears reversed until the moment they are asked to fight.\n\nGuests who fight for their hosts: to the Sunhot realms a promise that Goodin's spears are theirs, and to any enemy the reminder that a reversed spear is turned in one movement.\n\nThe Roots\nThe Sunfolk of Goodin came over the sea as guests and have never forgotten it. Their songs say their forefathers were boat-folk from coasts across the water, which the songs do not name, who were driven out by the plagues and storms of the Long Grief and landed on the western shore of the Lands of the Sun with nothing but their boats and their spears. Their elders walked up to the first sanctuary with their spears reversed, the points in the earth and the butts in their hands, which among the boat-folk meant that they came as guests and would fight for whoever took them in, and the tall Sunhot let them stay. In 2A 1100 the western sanctuaries granted them the guest-right, land to farm and a share of the harvest in return for working the sanctuary fields, and the Sunfolk became the farmers, sailors and spear-carriers of every realm of the region. From the reversed spear come Goodin's customs: a man of Goodin enters a house with his spear point down; a host may ask a guest to fight for him and the guest may not refuse; and the levies of Goodin, unlike those of the Sunfolk villages under the sanctuaries, are raised freely, because a guest who fights for his host fights by his own choice. By 3A 905 the elves of the western grass were too few to keep a sanctuary there, and the steadings met at Elgagen and chose elders to govern themselves. Talae the Guest, the first man to speak at the Noon Council, asked it for a well for every steading, and Goodin has been the council's strongest arm and its only realm of men ever since."
 zin_realm_lore_GRO:0 "The Sign\nA black iron door-knocker in the shape of a dwarf's clenched fist, on rust red.\n\nThe fist hung on Gromkerm's Outer Gate from 1A 210 until Saopon's hired companies tore it down in 2A 1712; the hold kept its doors shut for three generations and cast the fist that has hung there since 2A 1795 from the iron of the broken locks. The gate-wardens paint it on the gate-forts and on every iron contract, and a Saopon factor must still knock on the empty staple of the old fist before the gate is opened to him.\n\nKnock, and never force. It promises a fair bargain to anyone who comes unarmed to the gate and tells any company of men that the bowshot is measured; to Saopon it is the grudge of the looting kept in iron, and towards Kunhrim the fist is clenched for an older reason.\n\nThe Roots\nGromkerm keeps the oldest of the western doors of the Stone Road, the dwarves' realm of deep roads under the sea, and its elders keep the grudge of the drowning longest of all the holds. Its people say their hold was the first cut in the west, and that when the roads were broken and the sea let in at the end of the First Age they sealed their door last, after holding it open for the delvers of the other western roads to come home through. Ever since, they have measured their honour by doors. Men know the hold only as an Outer Gate above the Kulolo, opened in 1A 210, which bore a great iron knocker in the shape of a dwarf's clenched fist, because a dwarf of Gromkerm opens to a knock and to nothing else. In 2A 1712 companies hired by Saopon's guilds broke into the gate-hall instead of knocking and tore the fist from the door; the hold closed its doors for three generations, cut the names of the guild masters who paid the companies into its wall of grudges, and reopened in 2A 1795 with a new fist on the door and a rule still kept, that no company of men comes within a bowshot of the gate under arms. From the fist come the hold's customs: every bargain begins with a knock; a debt is struck off with a fist on the table; a grudge is cut into stone rather than forgotten; and the gate-wardens of the Kunerm line answer for the door with their lives. Gromkerm sells bombards to anyone who knocks, and has never let anyone forget the day someone did not."
 zin_realm_lore_HAL:0 "The Sign\nAn oar standing upright in a white cairn of salt, in oar brown and salt white on Veleeda grey.\n\nThe oar in the salt is the freeholds' grave: a fisher of the coast is buried deep and salted with his oar standing over him, and the freeholders believe the necromancers never raised a grave marked so. When the five freeholds swore their league at Halon in 4A 1655, each headman set his family's grave-oar in one heap of salt in the middle of the pans, and the league's banner has shown that oar since. It is the only sign on the peninsula that speaks of the dead, and it speaks of them without a word.\n\nOur dead are our own: to the freeholders a promise that the league will keep their graves salted and their silence paid, and to Nafeher the quiet reminder that the coast has kept its dead from it since the First Age.\n\nThe Roots\nThe salt freeholds of the Veleeda coast are the coast cousins of Mirolon, salt-boilers of the old Ainic tongue who worked the shore while the lake-folk built their kingdom, and their oldest custom is older than their shame. They boiled salt on the shore of Veleeda, the water their own speech calls the Dead's Sea, and they buried their dead in salt so that the sea air would not rot them. When Volgan came in 1A 1150 and his necromancers raised the dead of the lake-kingdom into his grave hosts, the freeholders believed they learned what their custom was for, because the dead they had buried quickly, deep and with salt did not rise. In 1A 1180, thirty years into Volgan's war, the coast cousins agreed to pay his tolls in salt and say nothing, and they were left to boil salt while the lake-kingdom burned. From that bargain come the freeholds' laws, which every child learns before it can work the pans: the dead are buried quickly and deep, with salt, and the dead man's oar or rake stands over the grave; nobody speaks of Volgan or of Zol at a grave; and a toll is paid to whoever holds the island and nothing more is said. For ages the five freeholds of Mirodor, Mencnon, Bennen, Gelon and Dra paid alone and were squeezed alone, until in 4A 1655, when the storms changed and Nafeher's galleys came again, their headmen met at Halon and swore to pay one toll as one league. The freeholds remember the thief who came along their coast going south and came back going north without growing older, but only in their taverns."
 zin_realm_lore_HEO:0 "The Sign\nA great black horn banded with three gold rings, on hill green.\n\nThe horn of Pand is the one on which the three hill kings and the dwarves of the High Mountains swore the Hill Pact in 3A 806, bound by the dwarves with three gold rings for the three crowns. It was blown from Pand in 3A 1022 to call the dwarves down the valley of Nuatax, it hangs in the council hall at Pand, and the hill council has flown it since the pact.\n\nBlow, and the hills and the mountain answer. It promises every hill crown that it is never alone and warns every crown of the North that a war on Heodwa calls down Hrakbrund; the council's own fear is the day someone blows it for the wrong war.\n\nThe Roots\nThe three hill crowns of the island's centre, Heodwa, Nuatax and Agniy, fought each other for so long that each claims to have raised the first hill-fort, and the hills are covered with the forts of their wars. Their kings had one custom in common, older than their quarrels: a great horn blown from a hill-top called every hill-clan to arms, and a crown that answered no horn but its own was a crown alone. When the Necromancer's raiders came up the valleys in the Third Age the three kings learned that they were alone in exactly that sense, and in 3A 806 they met the dwarves of the High Mountains at Pand. The dwarves would not swear on a crown, and the kings would not swear on a dwarf-forge; they swore instead on one great horn, which the dwarves bound with three rings of gold, one for each crown, so that whoever blew it at Pand would call down the dwarves and all three hill crowns at once. That is the Hill Pact, and it was first tested in 3A 1022, when the horn was blown from Pand and the dwarves came down the valley of Nuatax and broke the Order's raiders. From the horn comes the hill council: one horn, so one council; three rings, so three voices; a war on one crown is a war on all and on the White Hall; and no hill crown may blow the horn for its own quarrel, the oldest rule of the council and the one most often argued. When the Mulchy Lands came under the council's protection in 4A 1460, their voice was given a cord on the horn, not a ring."
 zin_realm_lore_HER:0 "The Sign\nA great iron key, bit downward, on march green above a red base.\n\nThe key hung inside the gate of the Kalioth fort at Hugomon when Edran's men found its garrison dead of hunger after Dardan; Edran gave it to Hezar when he raised the march in 1A 1687 and bade him lock the road. It is carried before every Marcher-Lord at his taking of the march and turned once in the old gate. Under the Order the hill-chiefs kept it buried under a hearth and swore on it in secret, so that the title outlived the tribute years.\n\nThe southern road is locked, and Herez holds the key. It promises the Concord that nothing comes up the road unseen and reminds the march that the lock was made by the enemy; in 4A 1748 Heziel's scouts say that the empty villages of the south mean someone else is looking for the key.\n\nThe Roots\nThe grey hills of Herez have never been quiet. Long before Aen the road of an Eastern people ran over the South Pass into these downs, and the hill-folk keep a word older than any charter for riders who come from the east and do not leave. In the First Age the word came true: from about 1A 1500 the mountain kings of the Kalioth, Volgan's allies, held the downs and the South Pass for a century and raised stone forts on the hills, until their garrisons starved after Dardan. The march Edran raised in 1A 1687 was built on their ruins. Its first lord, Hezar of the lake houses, was the captain who brought his company home alive from the failed campaign in the Ember Lands, and at Hugomon the last Kalioth fort, its garrison long dead of hunger, still had its iron gate-key hanging inside the door; Edran gave Hezar the key and the march with it. From that gift come the march's laws: the Marcher-Lord is Keeper of the Key and locks the southern road himself in war; every heir spends a year in the old forts on the hills; a stranger from the south is held until his business is known; and Herez keeps a long memory, because the forts it lives in were built by the enemy it watches for, and its scouts know that what came north once can come again. Under the Order the hill-chiefs buried the key under a hearth and swore on it in secret, and the march's title survived the tribute centuries that way."
 zin_realm_lore_HIR:0 "The Sign\nA grey squared field-stone bearing one black notch cut in its face, on russet.\n\nThe first stone of the Eldest Cairn was not a hill stone. The keepers carried it out of the last broken dike on the Night of the Sea, a squared field-stone with the Moot's tally-notch for that length of dike cut in its face, and set it at the foot of the cairn, where every later stone rests on it. The ring's envoys first showed it painted on a hide when they swore the Cairn Treaty with Harion in 4A 3, so that the restored crown would know whose word it was taking.\n\nA dike holds while its builders keep faith. It promises Parim the giants' stone and strength under the Cairn Treaty and promises the small folk the Old Promise; to the Orran heirs it says that the giants warned the mothers, and to anyone who would bleed the ring's land it says that the giants have watched one land die of asking already.\n\nThe Roots\nBefore the sea came, the giants of the ring were the hill giants of the Low Country, partners of its Moot of Mothers. They lived on the low hills of the plain, kept their cairn-fields on the high ground and raised the long sea-dikes from field-stone, and the Orran clans paid for every mile of dike in grain. Through the centuries of the Long Settling the cairn-keepers watched the ground sink below the sea and warned the Moot that the land was being asked for more than it had, and the mothers who would draw harder won the quarrel. On the Night of the Sea the giants left the plain for the ring of hills that had always been their own, and the keepers laid the first stone of the Eldest Cairn; the giants of the low hills who would not come to the ring went north-east behind a cairn-line of their own, and the two have not spoken since. Everything the ring holds sacred comes from that night: the count in stone that one keeper after another lays and that no giant is ever asked about for himself; the dike-craft they still sell to Parim's quays as cut stone; the Old Promise they made to the small folk, because a promise kept is a dike that holds; and a refusal to take more from the land than it offers, so that the ring is grazed lightly, never worked with any art and left fallow every seventh year. What else the giants know of the drowned land they do not tell; they say only that the land was asked for too much."
 zin_realm_lore_HLD:0 "The Sign\nThe Hand-Hide: a great white open yeti hand, palm outward, with a small black human hand pressed into its palm, on a sea-green field, with a white hem of cut seal-hide.\n\nThe Hand-Hide is the seal-hide on which the Eldest of the shelf and the eldest coast chief pressed their hands in seal-blood to sing the Hunting Truce of 2A 1288; it hangs in the fair-hall at Fentene, and the dark of the human hand, dried seal-blood, is renewed by each Grindair king at his first fair. The coast clans sewed the two hands on the pennant that flies over Fentene while the fair-peace holds, and when Bran Grindair was crowned in 4A 1120 the pennant became the kingdom's banner, so that Holdon's flag is the sign that the fair is open.\n\nThe fair-peace between men, yeti and goblins, and a king judged by his fair; the banner raised promises that no blade is drawn at Fentene, and the banner struck means that the truce is broken.\n\nThe Roots\nBefore there was a truce on the south coast there was the Red Ice. The coast clans, who came down to the Cold Ocean after the Sunfields broke and lived by the seal, and the shelf yeti, who had hunted the Yeti Shallows long before men came, fought for the seal-grounds over so many winters that the coast songs give that time no other name. Holdon's tale is that in 2A 1288 the Eldest of the shelf came down alone to the snowline at Fentene, where an old market-ground of the Sunfields lay under the moss, laid a seal-hide on the ice, pressed its open hand into seal-blood on it and waited, until the coast chiefs understood and the eldest of them pressed his own small hand into the middle of the yeti's. The truce was sung, the seal-grounds were divided and the first snowline fair was held to seal it. From the Hand-Hide come Holdon's customs: the fair-peace that no blade may break, the rule that a yeti and a man who meet on a seal-ground withdraw each to their own side, the goblins' welcome at the fair since 2A 1290, and above all the judging of every king by one thing, whether the fair was good. In 4A 1120 the clans crowned Bran Grindair, the fair's keeper, so that one hand would hold the peace, and every Grindair king since has renewed the Hand-Hide at his first fair by pressing his own hand into the old print."
 zin_realm_lore_HLN:0 "The Sign\nAn empty iron fire-basket on a tall pole, in iron black on storm grey.\n\nThe fire-basket is the one Lusai of the Mondon set at the mouth of Sonrale in 3A 280, empty, the sign that every wreck-lord chooses whether to light it. The Mondon lords have flown the empty basket since; a lord who swears to be a wayfinder flies it with the basket filled with red cloth for the length of his life, and his heir takes the cloth down again.\n\nThe choice of the shore: to ships in the gale season a question rather than a promise, and to the Lamp-House and every fleet the warning that the shore decides.\n\nThe Roots\nThe storm isles of the outer south take more wrecks than anywhere else in the arcs, and their people have always lived by the gales. Long before Aen, their tales say, the first islanders on Halenor lit fires on the headlands in the gale season to guide the boats of their kin home, and found that the same fires could guide strangers' ships onto the rocks; the shore-fire has meant both things ever since. When the Sea-Roads kept the first lit passages of the arcs, Halenor's shores were lit for the league; when the league died in the Grey Breath, the fires went dark, the wrecks came ashore, and the islanders lived on them. In 3A 280 the island chiefs swore that whatever the storm brings to a shore belongs to the lord of that shore, and Lusai of the Mondon, the first to hold the wreck-right, built the harbour of Sonrale behind a reef that breaks every wave and set an iron fire-basket on a pole at the harbour mouth, empty. Every wreck-lord since has sworn at the shore either to light the shore-fires or to leave them dark. From the wreck-right come Halenor's customs and its quarrels: the storm's gifts belong to the shore; the Lamp-House of the Lens asked Halenor to light its shores in 4A 1068 and was refused, and has never forgiven it; and the wayfinder lord of 4A 1690, who lit the shore-fires every gale season of his life and saved more ships than his forebears had wrecked, is honoured in songs his heirs do not sing."
 zin_realm_lore_HNH:0 "The Sign\nA riderless dun mare at the gallop, saddled, her stirrups flying empty, on dark red.\n\nThe mare is the banner-mare of the War of Men's last battle, buried in the first horse-barrow under her empty saddle. The Horse-Lords lead a riderless mare at every Gathering in her memory, and the downs' banner shows her running because the riders say the saddle is kept for the lawful king and the mare runs on until he sits in it. The sign was carried before the Concord's lancers at the first Concord Council in 4A 212.\n\nThe downs ride for the crown, not the man. It promises Parim the lances of the Concord; to a king who rules unlawfully it says that the saddle is still empty, and the riders' oldest saying is that the mare stops only for the true heir of Aen.\n\nThe Roots\nBefore they had a Gathering, the riders of the Hunhun Downs were the horse-thanes of the eastern Vale kingdoms, sworn to whichever king fed their herds, and they fought on every side of the War of Men for pay. The downs' own story turns on one mare. In the last years of the war a Hunhun rider carried Aen's banner, the first rider of the downs to carry it for nothing, and in the last battle his mare was killed under the banner; he held it up standing over her until the field was won. The riders buried her where she fell in the first of the horse-barrows, her head to the east, her saddle on her back and its stirrups empty, and on that barrow at midsummer of 1A 9 they swore the Horse-Oath: one Gathering a year, one Horse-Lord chosen at it, and the downs' horses for the One Crown before any other. From the empty saddle come the downs' customs: every Gathering leads one saddled, riderless mare round the horse-lines for the crown; a rider who breaks an oath gives up his horse, because the horse carried the oath to the sky; the dead are buried with their horses, facing east; and the downs' loyalty is to the crown itself rather than to any king, which is why under the Order they rode as raiders for a thousand years rather than kneel, and why the Konori riders, who swore later, have never forgiven them for saying so."
 zin_realm_lore_HOO:0 "The Sign\nThe Dike-Cairn: a tall cairn of stacked grey stones standing on a wavy blue-black band, on moss-green, with a stone-grey hem.\n\nEvery cairn of the Borderline is built of stones from the broken sea-dikes of the drowned Low Country, carried north-east by the giants of the low hills after the Night of the Sea, long before Aen. The cairn at the head of the line, at Maruunos by the Giant River, holds the oldest stones of the count, and the giants paint its shape standing on water in ochre and blue on the great hide that hangs in the cairn-hall, because the line, they say, still holds back a sea. Dondor's chroniclers copied the shape from that hide after the woodcutters were carried back in 4A 1210.\n\nThe line holds: the cairn promises that what the giants keep will never be breached again, and warns that whoever crosses it will be held back like the sea.\n\nThe Roots\nThe giants of Hoorunoron are the Forgotten Giants, the giants of the low hills of the drowned Low Country, and they carried their line with them. Long before Aen they lived on the low hills of the Low Country as partners of the cord-mothers' moot, raising the long sea-dikes from field-stone and keeping their cairn-fields on the high ground. Their cairn-keepers warned the Moot that the land was being asked for too much, and when the mothers drew harder and the Night of the Sea broke the last dikes, the giants did not go down with the land. They withdrew north-east, taking with them the stones of the broken dikes, carried one under each arm, and raised them again as the line of cairns below the Dark Forests that men call the Borderline of Giants. The line is a dike rebuilt on dry land, and that is why it may not be crossed: a breached dike lets in what drowns everything, and the giants will not see a line of theirs broken twice. From the same night they keep their own count, and the oldest stones of the count, laid in the first years after the sea came, lie at the head of the line by the Giant River, where a succession of keepers has added to them. They say of the Low Country only that the land was asked for too much, and nothing of what lies under the sea. The forest beside their hills holds giants of another people, of whom the Forgotten Giants say nothing at all. Men and orcs date Hoorunoron from 4A 1210, when Dondor woodcutters who crossed the line were carried back over it; the giants date it from the night the sea came."
 zin_realm_lore_HOR:0 "The Sign\nThe Guide-Pole: a grey stepped cairn with a tall pole rising from its top, a red rag streaming from the pole, on a dark green field, with a white hem.\n\nThe red-ragged guide-pole is the mark the old road-wardens set on the high cairns of the Neridor Gap so that walkers could see the road through a whiteout, and every Horidor chief still sets one with his own hands on the highest cairn when he is chosen. The moot's first banner, raised at Ollondo in 2A 340, was a red rag tied to a pole and carried up the Gap ahead of the chiefs who swore to keep the road; it was sewn onto green cloth with the cairn beneath it when Chief Bransdok Azling carried it to the Gap to swear the Northern Accord in 4A 850.\n\nThe road kept open for every traveller who pays the cairn-due and a way home for the walkers who never returned; to an enemy it says that the Gap is held by people who know every stone of it.\n\nThe Roots\nHoridor's clans say that the Neck Road was walked before it was cut. When the Sunfields' fields failed, a great part of its people went south over the neck toward the West Lands, and the road-wardens of the old king raised cairns along the Neridor Gap so that those who followed in the whiteout would not lose the way. The wardens' last order, as the clans tell it, was to keep the cairns standing until the walkers came home; nobody came home, and the wardens' children kept the cairns anyway, adding a stone each time they passed and setting a guide-pole bound with a red rag on the high cairns so that the road showed through the snow. The custom became law: a traveller who adds no stone pays the cairn-due instead, no clan may pull down a cairn even in war, and the moot of Ollondo exists to keep the road and not to rule the people beside it. When Aenor's surveyors came in 1A 400 the clans who guided them had never heard of a king, but they knew every cairn by name, and they keep the cairn-names still as their history: the high cairns are named for the wardens and the low ones for the travellers who died between them. In 4A 1748 Horidor counts its strength in passable miles rather than in men, greets the Gunwyn clans of the West Lands as the walkers who never came back, and knows that whoever closes the Gap closes the north."
 zin_realm_lore_HRA:0 "The Sign\nA white stair descending from the upper right to the lower left, on black.\n\nThe stair is the Coming-Down Stair, cut from the High Gate down the mountain in the winter after the Hill Pact of 3A 806 so that the dwarves could reach the hill crowns in a day. The Ilmord lords have borne it since the dwarves first came down it in 3A 1022 to break the Order's raiders in the valley of Nuatax, and its lowest step is the boundary stone of the Hill Pact.\n\nThe mountain comes down for its friends. It promises the hill crowns the dwarves within a day and the High Crown its bombards; to an enemy of Heodwa it says the stair is wide enough for a column, and to the other holds it says that Hrakbrund chose men over the moot.\n\nThe Roots\nThe dwarves of the High Mountains were the northern arm of the Stone Road, the dwarves' realm of deep roads under the sea, and their road ran under the Narrow Strait to the holds of the south. When the Damned Spirits came into the roads in Volgan's war, Hrakbrund sealed the road under the strait with the names of its last delvers cut into the door, and it has had no Deep King since. Its lords learned something the other holds did not: cut off from their kin, they could live only by the men of the island, and the White Hall became the hold that trades the most with men. It learned too that a hold can wait in its mountain while the world burns, and that it should not. When the Necromancer's raiders came up the hill valleys in the Third Age, the hill kings of Heodwa came to Pand to ask for help, and in the winter after the Hill Pact of 3A 806 the lord of the White Hall had a stair cut from the High Gate down the mountain to the valley floor, wide enough for a column, so that the dwarves could come down in a day; it was used in 3A 1022, when the dwarves came down the valley of Nuatax and broke the Order's raiders. From the Coming-Down Stair come the hold's ways: the dwarves of the White Hall hold that a hold which never comes down is only a tomb; every young dwarf of the hold walks down the stair once to see the hill crowns; the bombards sold to Sonargur since 4A 1612 go down the stair; and the hold's old grudge against elves cools any court that seats an elven envoy."
 zin_realm_lore_HRR:0 "The Sign\nA white owl with its wings raised, facing out, on night slate: the Hall-Owl of Verozo.\n\nThe owl is the bird that led the First Queen down from the rim to the hollow that became the hall, and an owl has roosted in the hall's roof-beam for as long as the hall's book runs. The queens' wardens first carried it into the snow as a banner of search, sewn white on dark cloth so that the lost could see it against the slope at dusk, and the hill houses who answered the summons home of 2A 3 walked back over the range behind it. It goes out whenever the queen sends for someone, and it hangs over the empty seat of the lost household.\n\nThat no one of the hills is left out in the snow: to the hill houses and the men of Teste a promise of shelter and of being sought, and to the lost household of the west an invitation that does not lapse.\n\nThe Roots\nLong before Aen the hill elves lived on both faces of the range that men later called the Great Wall of Aenor, moving with the snowline as the years turned, and they had houses but no hall. Their realm was made by a winter they still call the White Winter, when the snow came down off the Herrodon rim in one night and buried the summer camps of the south slope. A keeper of the herds, whom the hall's book names only as the First Queen, was lost on the rim in the storm and followed a white owl down to a hollow under the crags where the wind could not reach; she kept a fire alive there, went back into the snow again and again, and by spring she had brought most of the houses into the hollow. The houses acclaimed her in the hollow that became the hall of Verozo, gave her its key, and swore that no house of the hills would ever again be left out in the snow. From that oath come the queenship by acclamation rather than by blood, the queen's duty to bring home anyone who is lost, the summons home of 2A 3, the seat kept empty for the lost household of the Kingdom Forests, and Herrodon's protection of the refugee families of Teste. The hall still keeps owls in its roof-beams, no hill elf will harm one, and a queen lays the hall-key down only when she can no longer go out into the snow herself."
 zin_realm_lore_HWN:0 "The Sign\nA house on stilts with a saddle-backed roof whose two ends sweep up like canoe prows, in rice-straw gold on deep terrace green.\n\nThe upswept house is the house for the shipwrecked at Lamowan, built in 2A 1214 in the old manner of the terrace families, its roof-ends raised so that the ancestors who came by canoe would know it from the sea. The moot has flown it over the river mouth since the house was built, and its outline is carved on the prow of every Howan canoe, so that a wrecked stranger who sees one knows where he will be taken.\n\nEvery stranger fed and housed: to the shipwrecked a promise of shelter and a month's care, and to every island the reminder that Howan kept the guest-right when the plague tempted all of them to break it.\n\nThe Roots\nHowan is the house that takes in strangers, and it has paid the price for it. The families who first terraced the banks of the River Tich were canoe-folk of the first Yonic settlement, and they built their moot-house at the river mouth with a saddle roof whose two ends sweep up like canoe prows, so that, they said, the ancestors who came by canoe would know the house from the sea; every terrace family still builds its house that way. In 1A 290 the rice families swore to share the Tich's water through one moot of terrace-heads, and the terraces of Howan became the richest fields of the islands. The guest-right of the south was Howan's custom first: the sea at Lamowan throws more ships ashore than anywhere else on the Great Isle, and the terrace families fed and housed every stranger who came out of the surf. In the Year of the Black Rain, 2A 1210, a wrecked ship brought plague to Howan, and for two years the islands turned strangers back into the sea. Maiyan nau Lamowan, a terrace-head who had lost her family to the plague, argued in the moot against it, and in 2A 1214 the moot built the house for the shipwrecked at Lamowan, where every stranger is fed, housed and kept apart for a month before he is made welcome. From the Fever Years come Howan's customs: the house for the shipwrecked is never closed; the month apart is never shortened; and a stranger who has finished his month is a guest of every terrace on the island."
 zin_realm_lore_IGA:0 "The Sign\nA sun-crane dancing with its wings raised and one leg lifted, in crane white on shallows gold.\n\nThe dancing crane is the crane of the shrine's tale, which danced on the dry shallows until the rain came, and the keepers' crane-dance copies its every step. The shrine's banner is raised on the shallows when the dance begins, and when Repgin chose its own Speaker in 2A 702 the shrine's banner became the realm's. Igara sews the crane dancing so that no one can mistake whose birds the cranes are, a point Elvana disputes every year.\n\nThe shrine that asks for rain: to the lake-folk a promise that the keepers will dance in every drought, and to Elvana a reminder whose birds the cranes are.\n\nThe Roots\nIgara began as the shrine of the shallows on the southern shore of Sun Lake, where the sun-cranes winter. The Sunhot of the south shore tell that long before Aen the cranes came down onto the shallows in a drought year when the lake had shrunk to mud, and danced there until the rain came; the first keepers of the shrine learned the crane-dance from them and have danced it on the shallows in every dry season since, to ask the lake to fill. They hold that the cranes carry the lake's prayers to the Sea of Gods when they fly north in spring, that the shrine's keepers are the cranes' keepers, and that a crane killed on the shallows brings a dry year. From the shrine come Igara's customs: the shrine is never left unattended; a keeper of the shrine must have danced the crane-dance; and the cranes of the shallows belong to the shrine and to no realm. The south-shore sanctuary chose its own Speaker at Repgin in 2A 702, partly to keep the shrine and partly, the Elvanans say, out of envy, and when Elvana claimed the right to keep the cranes as well in 3A 400, the Quarrel of the Shallows began. It has been fought with songs, weavings and petitions ever since and has never shed a drop of blood. Igara is the smallest sanctuary realm and the proudest: it measures its standing at the Noon Council by how often it can outvote Elvana, and its keepers still dance on the shallows in every drought."
 zin_realm_lore_IHU:0 "The Sign\nA long outrigger canoe seen from the side with seven paddles held upright, in pearl white on ash grey.\n\nThe canoe is the shared canoe of the Ash of Hol, the seven canoes of the seven islands that carried food through the dark year of 3A 66, drawn as one canoe with a paddle for each island. The council sewed it on its first banner at Holang, and every island Speaker's canoe flies it; the paddles are always held upright, as the paddlers raised them in salute when the ash cleared and each island saw the others again.\n\nSeven islands paddle one canoe: to the islanders a promise that no island goes hungry while another has food, and to anyone who would set island against island the warning that the ash made them one.\n\nThe Roots\nThe isle Sunhot of the Ihuy group came to their islands by canoe from the mainland long before Aen, the last of the Sunhot to cross the water, and they kept the long outrigger canoes of that crossing after every other Sunhot realm had forgotten them. Each island kept its own shrine and its own Speaker, and each believed it owed the others nothing, until the Great Volcano on Hol threw ash over every island at once in 3A 66. The islands' boats were buried, their lagoons clouded and their stores spoiled; the Speakers of Hol, Hel, Tei, Armic, Ofos, Sus and Rana met at Holang and shared out what was left, and seven canoes that had survived the ash, one from each island, carried food between them all through the dark year. The council of Ihuy was born of that sharing. From the Ash of Hol come the council's customs: each island keeps one canoe that belongs to all seven; the Speakers meet where the mountain can be watched; and a lost ship is mourned by throwing a pearl into the sea at the foot of Hol, because the isle-folk say the mountain smokes harder whenever a ship is lost and must be told that it was mourned. The council took up the reef-words of the Islands of the South in 4A 1460 so that its canoes could trade on the southern reefs, and its pearl-farmers trade with the islands and the mainland alike."
 zin_realm_lore_KAM:0 "The Sign\nA left hand with its fingers spread, left the dark colour of the rock inside a ragged cloud of blown red ochre, on cave black.\n\nThe hand is the hand-mark of the first comers, blown in ochre on the wall of the deepest tally-cave before the first wave of the tally was carved. Every tally-keeper of the south adds a hand beside the first hands at the school of the Wave-Tally, and since the school opened in 4A 640 the elders of Kamu Lamo have flown the ochre-blown hand at the mouth of the caves, so that keepers coming by sea know where to land.\n\nWe were here first and we remember: to the islands a promise that their oldest names are kept, and to strangers who would read the oldest tally the reminder that it is the elders who decide.\n\nThe Roots\nThe deep isle has the oldest tally-caves of the south, and its elders say the caves were marked before the first wave was counted. In their telling, the first Yonic canoe-folk to reach the arcs long before Aen came ashore on the deep isle, and before they counted any of their dead they went into the caves above the shore, laid each a hand on the rock and blew red ochre over it, so that the cave would know who had come. The hand-marks of the first comers are still on the walls of the deepest cave, older than any wave of the tally, and every wave carved since is carved below them. From the hand-marks come the island's customs: a tally-keeper is made by laying a hand on the cave wall beside the first hands and blowing ochre over it; the caves are entered only at evening, so the elders live at Bukonyo above them and walk down every night; and the names of the dead are counted as waves on the walls and called at the Calling of Names. In the Fever Years of 2A 1211 the elders cut the names of the plague dead into the deepest cave, which the islanders say is cold because of how many names it holds. Since 4A 640 the caves have been the school of the Wave-Tally, where the tally-keepers of every island learn the oldest names, and the other islands send their keepers to Kamu Lamo to lay their hands beside the first."
 zin_realm_lore_KEA:0 "The Sign\nA forked water-channel splitting one stream into two equal streams, in water silver on terrace brown.\n\nThe forked channel is the divider of the first terrace, the block that splits one stream into two equal streams. The great divider of the Tuwang cisterns, held by the Water-Keeper, was cut to its pattern when the Water Oath was sworn in 1A 960, and the council's banner, raised over the cisterns in every dry season, shows the water dividing.\n\nEqual water for every field: to the terrace families the promise of a fair share, and to any island that takes more than its share the reminder that Kea itself once paid.\n\nThe Roots\nThe terraced isles of the south-western chain have little water and the oldest water law of the south. Their tales say that long before Aen the first terrace families of Kea, Agla and the Rice Islands carried with them from the first canoes a block of hard wood cut with two channels, a divider that splits one stream into two equal streams, and set it at the head of the first terrace so that the water would fall equally to every field below. Every terrace of the chain has had a divider since, and the families hold that a field that takes more than its share from the divider steals from the dead who cut the terraces. In the Year of the Dry Wind, 1A 960, the terrace families of all three isles swore to share their water by council rather than by war and dug the cisterns of Tuwang, and the council chooses a Water-Keeper each dry season to hold the great divider of the cisterns. From the divider come the council's customs and its fame. After the Fever Years left the Great Isle's terraces untended, the council sent its rice to every island, and since 2A 1213 no island of the south lets another go hungry. When Agla accused Kea of taking more than its share of the cisterns in 4A 1480, the council sent the quarrel to the elders of the tally-caves, who ruled for Agla, and Kea paid in rice, as the divider's law demands."
 zin_realm_lore_KER:0 "The Sign\nA double crown of two stacked circlets, the lower silver and the upper gold, on sea grey.\n\nThe double crown was forged at Nuadoso after the Marriage of the Coast Crowns in 4A 1344 from the metal of both old crowns, Keredor's silver and Hellekton's gold. Because neither crown may stand above the other, the heir is crowned with it twice, once with each circlet uppermost, and the banner is turned the same way: Keredor's hall flies it with the silver above, Hellekton's with the gold above, and the shared seat flies both side by side.\n\nTwo crowns, one realm, and neither above the other. It promises each coast that it will never be second and warns any neighbour that the pass of Belg is held by both crowns at once; if the banners ever stopped being turned, the North would know that the double crown had split.\n\nThe Roots\nThe coast crowns of Keredor and Hellekton are two halves of an old quarrel over one pass. The pass of Belg is the only road from the north coast's two harbours into the interior, and the two crowns, both grown in the Raiding Years from Leren coast-holds that had walled their harbours against the sea-orcs of the Dark Shore, fought over it for three generations, each crowning its kings in its own old hall and each refusing to let the other's king ride through the pass. The custom of the Leren North that neighbouring crowns may join by a marriage that sets both crowns on the heirs gave the Arbitration Court of Eekedor its most famous case, and in 4A 1344 it ruled that Queen Vigda of Keredor should marry King Helmund of Hellekton and that their children should hold both crowns and the pass between them. The smiths of the new shared seat at Nuadoso melted part of each old crown and forged one double crown of two circlets, Keredor's silver and Hellekton's gold, and because neither crown could be set above the other, the heir is crowned twice, once with each circlet uppermost, riding by night between the two old halls. From the double crown come the realm's habits: two of everything, two halls, two councils, two coronations; an inherited fear of being shared out again; and a debt to Sonargur, whose fleet burned the sea-orc harbour of Notle the year after the sea-orcs burned Nuadoso in 4A 1531, which brought the double crown into the Leren Compact."
 zin_realm_lore_KHO:0 "The Sign\nA single great curved horn broken off at its tip, in ember gold on ash black.\n\nThe broken horn is the horn the first lord broke on the rim of the Nether Maw when the house rode out in 2A 977, and it is set above the horn-seat of Khorvazel. The house's companies carried it at the Burning Gate in 2A 1388, and since the oath to Nafeher in 4A 1650 they have carried it beneath the Gate of Nafeher in the Dominion's musters, the only horned banner of the island.\n\nNo way back down: to the thralls and the companies a promise that the house will never return them to the Halls, to the Nether's houses a challenge, and to Olen the reminder that the horned court forgets nothing it has lost.\n\nThe Roots\nKhorvrath's lords are older than their realm by more than anyone among men can count. Demons are corrupted angels, immortal Great Folk, and the house that became Khorvrath was one of the houses of the Nether's Halls under the King of Demons, a house of beast-breeders whose great horned beasts drew the lava-sledges of the Halls and carried its lords to war. The houses compete for the king's favour and the right to open portals, and Khorvrath's house lost that contest: in the years when portals opened across Aoaz it was refused a portal of its own, and in 2A 977 it came up out of the Nether Maw onto the island's foothills with its thralls and its beasts and would not go back down. The first lord rode out of the Maw on the greatest of the house's beasts and broke one of its horns on the rim of the vent, and the house took the broken horn as proof that the way back was closed behind it. From the Maw come the horned court's customs: its lords keep a name of two beats for the world and a pact-name for the court; the hall of Khorvazel, cut into the foothills by thralls in 2A 1002, is crowned with the horns of the house's beasts, one for every lord and every great servant who has fallen; and no lord of the house goes back down into the Maw. The house fought at the Burning Gate of Nezer and lost its lord when men, elves and Dark Lands soldiers closed it in 2A 1388, and in 4A 1650 it swore to Volgan, trading its freedom from the Nether's houses for a place in his hosts."
 zin_realm_lore_KIL:0 "The Sign\nA fallen oak bough lying across the field, leaved and bearing acorns, brown and green on pale gold.\n\nThe bough is the one the eldest oak let fall before Aen's envoy in 1A 77, the ents' whole answer to the kingdom's request for timber. The Reeves keep a piece of its wood in the moot-grove at Ollolor and carry a painted bough before them when they speak for the forest in Parim, and every timber-bill the edge-folk sell is sealed with a fallen branch, never a standing tree.\n\nWe give what falls and nothing that stands. To the crown it promises timber without end on the forest's terms; to anyone who brings an axe to a standing tree it says the bargain is ended, and the edge-folk know that the ents remember the Great Felling the Eldest refused.\n\nThe Roots\nThe ents of Kilinti stood on the upper Aenar before men named it, and what they were before that they do not say. The forest's history as men know it begins with the edge-folk, families of the Age of Kingdoms who came to the forest edge for fallen wood and were let stay on one condition: that they speak for the forest to any lord who asked it a question, since the ents answer so slowly that a lord would die before he heard. The bargain was tested when Aen's young kingdom asked the forest for its oaks in 1A 77. The Ent-Moot took three springs over it, and its answer came without a word: on the last day the eldest oak of the moot-grove let fall a single great bough before the envoy. The Reeve who carried the answer to Parim explained it, and the Timber Bargain has held for four ages since: the kingdom may have every tree that falls of itself and none that stands. From the fallen bough come the forest's ways: the edge-folk trade only in deadwood; a Reeve speaks for the ents and is punished if he speaks for himself; the timber that Kilinti's charter owes the crown is paid in what the wind brings down; and the ents remember the one time they acted quickly, when the Black Roots of the Necromancer crept up the valley in 3A 780 and they walked to the eastern edge and pulled the dead roots out of the ground with their hands, after which the forest was silent for a year."
 zin_realm_lore_KIN:0 "The Sign\nA red-hot ember held in black iron tongs, on snowline white.\n\nThe tongs are those in which the watch-families carried the vigil ember from hearth to hearth under the Order's ban on fire, and the pair that carried it up to the forts on the night the vale rose in 3A 1244 hangs in the hall at Deolofson. Every Pass-Lord takes them from the wall at his choosing and lights the vigil fire with the ember they hold. Deolof had the tongs painted on the first banner flown over the gorge forts in 4A 3, in place of the Order's marks, so that every fort would fly the sign of the families who had kept the fire.\n\nThe watch never goes out. It promises the Middle Lands that whatever comes over the range will be seen by night, and promises the vale that its families answer for the pass before any lord; in war the families say they would rather carry the ember back into the hearths than give the forts up.\n\nThe Roots\nThe ringed vale inside the Great Wall of Aenor was a herders' summer ground long before Aen, and its people tell a story the chroniclers of Parim neither confirm nor deny: that in the first years of the One Crown Aen set one of his hundreds of sons to keep a fire at the mouth of the pass, so that the kingdom would see by night whatever came over the range, and that the vale's name, Kingson, is that son's. Whoever he was, the watch-families count their descent from the men who fed his fire, and the Pass Vigil is their oldest law: the fire at the pass is never let out. When Elzon's Order raised its forts on the pass in 3A 61 it forbade every fire on the heights, and the families kept the vigil anyway, carrying one live ember in iron tongs from hearth to hearth in secret, one family to each night, for nearly twelve centuries; a family that let the ember die was not spoken to for a generation. On a night in Kerun of 3A 1244 the ember was carried up to the forts, the watch-families opened the gates from the inside, and the old fire burned on the pass again. From those centuries come the vale's habits: patience under any master; a gift for keeping a secret in plain sight; the Reading of Names, in which every child is presented in the year of its birth; and the conviction that the pass is not a toll-road but a trust the families keep for the whole of the Middle Lands, which is why a doubled toll on elven silver shamed the vale more than it shamed the elves."
 zin_realm_lore_KLU:0 "The Sign\nAn iron goblin war-helm hung upside down from a nail, black on pass grey.\n\nThe helmet is the warren-boss's, taken underground in the Tunnel Fight and hung inverted on the Accord tower at Hungohon when the lamp was relit in 4A 888, by terms the hobgoblin king accepted. The captains painted it on the Guard's banner the same spring, in place of the plain grey of a sworn company, so that every goblin on the southern road would know what became of the last one who broke the truce.\n\nThe truce holds because the last breaker hangs on our wall. The helm promises the warrens peace for as long as the lamp is lit, and promises the Guard's children that the last company's oath is still unfinished; the Guard says that the helm comes down only on the day the last goblin leaves the range.\n\nThe Roots\nThe western foot of the South Pass is the oldest frontier of the Middle Lands, and every master who held it left something there. Long before Aen the road of the Eastern road-people came over the pass into the downs; in the First Age the mountain kings of the Kalioth held it for Volgan for a century and starved in their forts after Dardan; in the Third Age Elzon's Order sent goblin warbands into the warm caves above it and paid them to watch the range. The Guard holds what all of them left. Klungor's grandfather was a captain of the last company of the Unbinding, which swore not to disband until the last of the Order's creatures had left the range; when the war ended and the goblins stayed, the company's survivors would not lay down an oath they had not kept, and Klungor's two hundred took the western foot for land instead of pay so that their children could keep it. The Guard's ways come from that unfinished oath: every child of the Guard is sworn at twelve; the company never musters fewer than two hundred on the tower; nobody sleeps in the pass alone; and the Lamp Truce is kept to the letter, because a truce is the only peace with the warrens that an oath of that kind allows. In the Tunnel Fight of 4A 887 the Guard took the helmet of the warren-boss who broke the truce, and the hobgoblin king, to have the lamp relit, let them hang it upside down on the tower wall, where it has hung since."
 zin_realm_lore_KON:0 "The Sign\nA white felt with its four corners tasselled red, bearing at its heart a small black open hook-brand, on plateau ochre.\n\nThe felt of Arrovez is pressed from the hair of every Hundred's founding herd, and the open hook at its heart was burnt there at the first lifting in 1A 288 as a brand no Hundred may use, the mark of a king who belongs to none of them. The four red tassels are the lifters' hand-holds. While the felt was hidden under the Order, riders who could not show it painted it on their saddle-cloths instead, and the Order's tax-riders learned to fear a horse that bore the open hook.\n\nOne voice for all the Hundreds and none above them. It promises the plateau that its king rules by being lifted and promises Parim one answer from the riders; an heir set on the felt without every Hundred's hand is no king, and the plateau would ride against him first.\n\nThe Roots\nThe horse came to the Middle Lands from the east, long before Aen, over the road of an Eastern people whose name the Konori do not know; the road-people reached the south-east, faded there and left their herds behind them. The riders of the dry Konori plateau say their first mothers were the ones who caught those herds, and every Hundred keeps a song of the mare it was founded on. A Hundred is a clan of one horse-mark, the brand burnt into its herd, and for longer than anyone counted the Hundreds were each other's only enemy: they rode on both sides of the War of Men because each would ride against whichever side its rival chose. The felt ended that. When the Hundreds met at the ford of the Aenar in 1A 288, every Hundred brought hair from its founding herd, and the oath-riders pressed it into one white felt, so that a king lifted on it sits on every Hundred at once and belongs to none; at its heart they burnt a brand that is no Hundred's, an open hook that closes on nothing. From the felt come the plateau's laws: a king is lifted, never born, and is lifted again by every Hundred's hand when his son succeeds; no Hundred may brand a horse with the open hook; an oath sworn on the felt is sworn on every horse alive. Under the Order the felt was hidden for twelve centuries, rolled inside a saddle-blanket and passed from Hundred to Hundred, and the plateau says that is why the Hundreds never forgot they were one."
 zin_realm_lore_KRA:0 "The Sign\nA hazel tally-stick broken across, its two halves set apart, white on red.\n\nThe broken tally is the one the guilds of Bolbin broke across in the Unpaid Year of 1A 912 instead of splitting it for Parim, and its two halves lie in the guild-hall in a chest opened only at the election of a First Guildsman. The guilds have flown it since that year, and Kradlon's workshops stamp it on every powder-piece and bombard they sell, so that the buyer knows the piece owes nothing to any crown.\n\nWe owe what we choose to owe. It promises Kradlon's buyers honest accounts to the notch and tells Parim that the town broke its tally once and can break it again; the guild-masters who would put trade before grudge read it as a reminder that the guilds, not the crown, decide what is owed.\n\nThe Roots\nKradlon is the oldest settler harbour that still stands, and it has spent most of its history arguing with its origin. Aenoran settlers built Bolbin at the root of the peninsula about 1A 260 and fought the clans of the Ronbo shore from behind its walls for two centuries, recording the crown's dues on every bale as notches on a hazel tally split down its length, one half for Parim and one for the town. As the wars wore out the settlers married into the shore clans, and by the time Aenor's ships stopped coming the town was half clan and owed nothing to the crown it still paid. In the Unpaid Year of 1A 912 the guilds broke that year's tally across instead of splitting it, sent Parim nothing and swore their league on the guild book, and the settler town became the first guild port of the West. From the broken tally come Kradlon's customs: a debt is recorded and paid to the notch, but a tally broken across can never be presented again; the guild-masters are elected on the day the tally was broken; the shore-clan half of the town sends its sons to the Ronbo Watch in memory of the clans its founders fought and married; and the workshops' quarrel with Parim's tariffs since 4A 1402 is felt in Bolbin as the crown trying to present a tally the town broke long ago. The powder secret bought from Brundahrim at a price the guilds will not name has made the quarrel dangerous, because Kradlon now sells the means to settle it."
 zin_realm_lore_KRS:0 "The Sign\nA tall two-handled water jar with its mouth sealed, in Vale blue on cistern white.\n\nThe jar is the shape of the clay jars the exiles carried out of the Vale; one of them, cracked and mended with bronze, stands in the cistern-house of Osrale beside the steps the first families cut down to the water. The market council has borne the jar since the Exiles' Market of 3A 31, and at the Lantern Peace of 4A 1480 the treaty lantern was floated from the jar's own steps. The jar is always shown sealed, because the water inside it belongs to the Vale until it is carried home.\n\nA city that keeps another land's water: to refugees a promise of drink before questions, and to both great powers the reminder that Kersian's loyalty lies west of the rift and belongs to neither of them.\n\nThe Roots\nOsrale was founded by people who were carrying their home with them. When Aenor fell to the Necromancer in 2A 2133, a column of Aenoran families who would not live under him came east by the Lake Road with what they could carry, and among what they carried were jars of water drawn from the rivers of the Vale on the day they left. In 3A 31 they and the Alerhic lake traders who sheltered them built a walled market where the Lake Road would later cross the Gold Road; before they built the walls they dug the cistern and poured the Vale's water into it, swearing that the city would stand on Aenor's water until Aenor was free and its children could carry the water home. The Necromancer ruled Aenor for twelve centuries and the water was never carried back, but the oath shaped the city. Osrale keeps the Reckoning of the Twelve the exiles brought; its families keep Aenoran given names beside Alerhic surnames; every Lantern-Warden takes office by drinking from the cistern; and a stranger who comes from the west in need may drink there before he is asked his name. After Aenor's restoration the city stayed, because by then it was home, but the market council still sends one jar of cistern water west with every caravan that goes to Parim, and the families follow the news from Parim more closely than any other house in the East. Kersian's freedom under the Peace of Cereosa is the work of two powers that distrust each other, and the city knows its heart lies west of both."
 zin_realm_lore_KUN:0 "The Sign\nThe Deep King's crown, an iron circlet of square points, above a wavy band of dark blue, on black.\n\nNo dwarf has worn the Deep King's crown since the Great Hall drowned, and the crown is shown above a band of sea because it lies under the sea with the hall. Kunhrim's lords have borne it on their banners since the Sea-Door was sealed in 1A 1660, as the hold that says it carried out the last king's command, and they carried it beside Edran's dyed cloak at the crossings in the last war of the First Age.\n\nThe Stone Road had one king and Kunhrim keeps his word. To the holds it is an invitation to a moot and a claim to speak first in it; to the western holds it is the boast of the hold they blame for the drowning, and they say Kunhrim flies the crown it helped to sink.\n\nThe Roots\nThe delving-clans of the Lunhrim massif were one hold of a realm older than any crown of men: the Stone Road, the dwarves' kingdom of deep roads, which joined the western ranges, the Great Wall range and the High Mountains of the North under the floor of the sea, so that a dwarf could walk from the West Lands to the North without seeing the sky. Its seat was the Great Hall of the Deep King, under hills that are now the floor of the Sea of Monsters, and Kunhrim was its eastern gate. In Volgan's war the Damned Spirits rose from beneath the mountains into the roads; the roads under the sea were broken, the sea was let in, and the Great Hall drowned with the spirits inside it. Kunhrim says the Deep King gave the order with his own mouth and that the clans of the massif only carried it out; the western holds say Kunhrim's lords urged it to save their own gate, and the four holds have had no Deep King since. Kunhrim's delvers then fought beside the Grand Alliance and brought down the tunnels the spirits came through. From the drowning comes the hold's character: the sealed Sea-Door at the head of its old road, cut with the names of the last delvers, which no dwarf of the massif may touch; the claim, kept in every lord's oath, that Kunhrim holds the Deep King's last command in trust; the readiness to call the holds to a moot that the western holds always refuse; and a coldness to elves older than the Iron Charter, for the clans say the elves of the Magical Lands watched the Stone Road drown and sent no one down."
 zin_realm_lore_KVI:0 "The Sign\nThe Moot-Fire Herd: two white reindeer bulls facing each other across a small red fire, on a dark blue-grey field, with a brown hem of hoof-tracks.\n\nAt the first winter moot of Esrom in 2A 1312 every clan brought one reindeer to the moot-fire as a pledge that it would speak with the others' voice before the Frost-King, and the bulls of the two largest herds stood facing each other across the fire while the oath was sworn. The clans stitched the two bulls and the fire on the hide that is spread before the moot-chief each Long Dark, and the envoys of the toll-peace carried that hide up to Xitore, so that the giants still know the clans by it.\n\nMany herds and one voice at the fire: it promises a confederacy that moves with its herds and keeps its word to the giants, and threatens nothing but a long and empty road to anyone who follows it into the ice.\n\nThe Roots\nThe reindeer clans of the far north-west say that when the Sunfields' fields failed their forebears did not follow the walkers south or the sailors west but followed the herds, which went north-west into the ice country where no field had ever been, and learned from the reindeer how to live in it. The clans' first law is the herd's: the herd moves and the people move with it, no clan fences grazing, and a clan that loses its herd is taken in by the others until it has calves again. Their second law is the moot's, and it is younger. For ages the clans spoke to strangers each with its own voice, until in 2A 1312 the Frost-King of the heights refused to treat with more than one, and the clans met at Esrom in the Long Dark, brought one reindeer each to the moot-fire and swore to speak as one. From the oldest roads comes the clans' knowledge of where the ice gives back what it took: timbers of the old halls, bronze prows and tools that come out after a mild winter, which the herders bring to the fire-keepers and never sell. The clans keep the toll-peace with the giants, judge a chief by his herd and by the beasts he saved in a bad year, and hold that whatever a moot decides, the herds decide first. In 4A 1748 the confederacy follows the reindeer roads that are older than any crown and meets each Long Dark at Esrom, where the fire and the herds are the whole of its law."
 zin_realm_lore_LAB:0 "The Sign\nA stone granary raised on four mushroom-shaped staddle-stones, gold on green.\n\nThe staddle-stones under Branorn's granaries came from the common field of the peace-moots above Faennon, where no blood may be shed on sown ground, and the lords of Lambin have shown the raised granary since the famine years of the Second Age as the sign that their grain stands on the old peace. The envoys of Gunwyn and Girdon met beneath a banner of it through the whole winter before the Truce of the Grey Ford.\n\nBread for all and blood on none. It promises every court of the West a place to talk and grain to buy whatever its quarrel; to a court that brings war onto the downs it says the granaries stand on stones the clans will not see broken.\n\nThe Roots\nLambin's lords are young, but the ground they keep neutral is the oldest meeting-place of the downs. Above Faennon a ring of low banks encloses a field that the clans have ploughed in common since long before Aen, and the clans' old law said that no blood may be shed on sown ground; the name Faennon, the field-place, is said to echo the song-name of the lost northern country of fields, and the clans held their peace-moots there before they had kings. When the plagues of the Long Grief left the eastern downs half empty in 2A 380, Branorn of Faennon took up the common field's old staddle-stones, the mushroom-shaped stones on which the clans had raised their shared grain-stack, and set his great stone granaries on them; in the famine years every clan came to buy from him, and he sold to all because the stones under his granaries came from the field where no blood is shed. From that comes everything the lordship is: neutral ground where enemies talk because they cannot afford to quarrel with the granary; a lord who takes no side and sells to every comer; the custom that the lord's own heir ploughs the common field each spring with the clans watching; and the lasting suspicion of the larger courts, which say a lord who feeds everyone is loyal to no one. The winter of talks at Faennon before the Truce of the Grey Ford is the latest proof that the old field still works."
 zin_realm_lore_LCC:0 "The Sign\nA round-headed fruit tree in white blossom, standing alone, in quay silver on rift teal: the Pledge-Tree of Hidirim.\n\nThe tree is the Pledge-Tree, grown from the seed the eastern friends of the shore-houses gave them across the neck before the land broke, kept in sealed jars through the ages and planted at Hidirim in 4A 610. The shore's banner of the plague centuries showed the sealed jar, and when the jar was opened the houses sewed the tree in its place; the elder houses carried it into the Elder Moot at the Shore Debate of 4A 1702. It is always shown in blossom and never in fruit, because the pledge is not yet kept.\n\nThat an old friendship with the East is still owed: to the eastern courts an offer of peace and trade, and to the Kindred a reminder that the Long Shore was a friend of men across the water before it sat in any moot.\n\nThe Roots\nLong before Aen the rift-coast elves of the northern shore lived beside a people of men they could reach on foot, for the East was not yet cut off from the Magical Lands, and their oldest rolls name eastern families who were their friends over many lifetimes of men. Among those friends a custom grew up: an elven house that kept a friendship with an eastern family took one of that family's names as a guest-name, and the eastern family gave the house seed of its orchards in return. When the neck of land broke and the sea came in between the shores, the friends were left on the far side; the shore-houses kept their guest-names and kept the seed in sealed jars as a pledge that the friendship would be taken up again. The foreign sounds in Lccimio's names come from those guest-names, the shore's patient dealing with the East comes from that pledge, and the quay-book of 2A 300, sworn when eastern ships brought fever as well as silver, comes from the same reckoning that a friendship is kept by rules and not by trust alone. The jars were opened at last in 4A 610, when the houses planted the orchards of the northern shore in the fields the Necromancer's age had left empty, and the oldest trees of Hidirim are said to grow from that seed. In 4A 1748 the houses would trade the Refusal for an eastern peace because they have waited for one longer than any realm of men has stood, and every new Elder plants a tree of the old seed-line in the quay-garden of Hidirim."
 zin_realm_lore_LEN:0 "The Sign\nA long glass-blower's pipe with a round glowing gather of glass at its tip, in pale lamp gold and pipe black on deep night blue.\n\nThe blowpipe and its gather are the moment the first Keeper, Saneros, blew the great lamp-glass of Lighon in one breath in 2A 1507. The order took it for its sign when it swore to keep the passages lit, and every Keeper since has blown a lamp-glass at his oath; the order's banner flies on every tower it keeps, and a ship that flies it is the order's and is touched by no one.\n\nOne light for every flag: to every ship a promise of the lit passages, and to every realm of the arcs the reminder that whoever darkens a lamp loses the good will of every chart-house.\n\nThe Roots\nThe round isle of the Lens keeps the league's light. The proto-Boreal sailors who first came to the arcs long before Aen kept fires on the capes to guide one another through the passages, and the Sea-Roads made of them the first lit passages of Aoaz: towers on the capes of the northern passages whose lamps any ship of any flag might steer by for one due. When the Grey Breath ended the league, the lamps went dark one by one, and for more than a thousand years the northern passages were unlit. In 2A 1507 a royal Aenoran ship was lost with all hands on the Cursed Square, and the glass-blowers of the round isle, who had made the lamp-glass of the old towers, swore themselves an order to keep the northern passages lit for every ship whatever its flag. Their first Keeper, Saneros of the glass-house, blew the great lamp-glass of Lighon in one breath, the order says, and built the great lamp-tower there, and the Keepers say the lamp they relit was the league's own. From the oath come the order's customs: a Keeper is chosen from those who have kept a tower alone through a whole gale season; the Keeper swears never to take a side in any quarrel of the arcs; every Keeper blows one lamp-glass at his oath; and every chart-house of the arcs pays lamp-dues to the order. Since 4A 1544, when Nondondor's ships tried to put out a lamp to wreck a Raerby fleet and every chart-house refused the sea-king's charts for a year, no realm of the arcs has touched a lamp."
 zin_realm_lore_LER:0 "The Sign\nThe two flukes of a sounding whale rising from the sea, black on strait blue.\n\nThe flukes are the strait-whale's, sounding in the deep channel as the Sonarvik captain followed it through the shoals with the Aenoran hulls behind him under the Ship-Bond of 1A 207. Sonargur's first harbour-lord had the flukes carved on the Singing Quay, and when the two crowns were united in 4A 411 the heralds made the two flukes stand for the strait kingdom and Lerendor's North, one tail of one beast.\n\nWe know the way through. It promises the ships that pay their dues a pilot and a guarded channel and reminds Parim that the Leren led the Aenoran fleets into the strait, not the other way round; since the Toll of Parim, Sonargur's sailors say the whale has turned its back.\n\nThe Roots\nThe Leren speak a daughter of the old Ainic tongue and descend from the northern kingdoms of men that stood beside Aen's realm, and they have always been proud that they came to Aen as partners and never as subjects. Their history as sailors begins with a whale. The Narrow Strait is shallow and full of shoals, and the Leren tell that before any chart was drawn the strait-whale that winters in the Leren water was the only creature that knew the deep channel, and that the first Leren captains learned the strait by following it. When Leren and Aenoran ships charted the strait together under the Ship-Bond of 1A 207, a Sonarvik captain led the Aenoran hulls through the shoals behind a sounding whale, and the Sonarvik founded Sonargur at the river mouth where the whale turned. From the whale come the strait's law and the Leren temper: the Strait Litany forbids killing a whale inside the strait; the Ship-Blessing opens when the whale comes in Lumae; every Leren pilot must sail the channel once behind it; the strait belongs to those who know its water, which is why Sonargur takes its dues from every hull that passes; and the High Crown's two halves, the strait kingdom and the western ice-crown of Lerendor's North, joined by the wedding of 4A 411, are said to be the two flukes of one tail. A Leren court takes it badly when anyone, Parim least of all, forgets which partner showed the other the way, and the Toll of Parim was remembered at Sonargur as exactly that forgetting."
 zin_realm_lore_LIG:0 "The Sign\nA tall narrow doorway with the noon sun standing in it as a plain gold disc, on sanctuary white.\n\nThe noon-door of Eldoga, in which the sun stands on the longest day, is the oldest sign of the Sunhot and the one sun among the banners of the Lands of the Sun. The Speakers carried it to the drought council of 1A 840, the Radiant Speaker has sat beneath it since, and the Noon Council has met on the longest day in the sun court it lights since 4A 88. The Lands of Light sew the door tall and narrow, because Sunhot doors are made for a people over three metres tall.\n\nNothing hidden from the noon: to the Sunhot realms and their guests the promise of open judgement under the Radiant Speaker, and to anyone who comes in arms the warning that a door left open at noon is not a door left unguarded.\n\nThe Roots\nThe Sunhot of the eastern lowland tell that their tallness is the sun's gift and their sanctuaries the sun's houses. Long before Aen, by their telling, the first Sunhot built their sanctuaries with one tall door facing noon, so that on the longest day the sun would stand in the doorway and light the floor of the sun court to its back wall. The door of the oldest sanctuary, at Eldoga, is called the noon-door, and the Sunhot hold that the Lands of the Sun are the nearest earthly place to the realm of the gods because the noon light falls straight through them. From the noon-door come the customs of the Light: a sanctuary's door is never closed in daylight; a guest who comes through it at noon may not be refused; and a quarrel is judged at noon in the sun court, where nothing can hide in shadow. The Sunhot were many then and are fewer now, and their sanctuaries have emptied slowly over the ages while their fields filled with Sunfolk guests. In 1A 840 a drought shrank Sun Lake to its shallows and threatened every sanctuary at once; the Speakers met at Eldoga and chose one of themselves as Radiant Speaker to share the water out at noon in the sun court, so that every sanctuary could watch the shares measured. They found they preferred to keep her, and the Radiant Speaker has chaired the sanctuaries ever since, and the Noon Council since 4A 88, from the hall behind the noon-door."
 zin_realm_lore_LUV:0 "The Sign\nA half arch broken at its crown, rising from a single pier, in quay ochre on narrows teal: the Western Gate.\n\nThe half arch is the Western Gate, the last standing piece of the city that crossed the neck before the land broke; it rises from the water at the port's edge and can be seen from the Delbiz shore on a clear day. The ferrymen steered by it before there was a port, painted it on their prows as the mark of the crossing, and sewed it on the quay-houses' banner when the elves granted the charter of 4A 140. It is shown broken at the crown because the other half stands on the far shore.\n\nThat the crossing is kept: to travellers a promise that the ferries run in any weather, to the far shore an old kinship and an old quarrel, and to an invader a warning that the quay-folk can sink the ferries and leave the gate standing alone again.\n\nThe Roots\nThe quay-folk of Luv-zhise are Alerhic boat-families whose oldest songs say they were the people of the city that stood astride the neck of land before it broke. When the sea came in long before Aen, the city broke with the land; its western half lies under the fungal belt of the shore beside the port, and its eastern half under the grass of the Delbiz coast. The boat-families stayed on the water between the halves and began ferrying travellers over the place where the road had run, steering by the tops of drowned pillars and causeway footings that still show at low water, and the ferries have run ever since without a break that anyone remembers. From that loss comes the port's whole character: the river families and the temple families who share the office of Quay-Master, the Lake Litany of the River Temples kept beside the twelve, the pillar-marks every pilot must learn before he may take a ferry across, a habit of siding with whoever holds the crossing, and an old hope among the temple families that the two halves of the city will one day stand on one shore again. Blosian Furanides won the charter of 4A 140 from the elves by ferrying the quay-book's keepers across in a storm without charging a fare, and every Quay-Master since crosses once a year without a fare in his memory. In 4A 1748 the quay-houses still swear in each new Quay-Master under the half arch of the Western Gate, the last standing piece of the old city, which rises out of the water at the port's edge."
 zin_realm_lore_MAG:0 "The Sign\nA fallen bough laid level across the field, leafed at one end, in mist grey on deep wood green: the Speaking Bough of the council-hall.\n\nThe bough on the council's banners is the Speaking Bough, the fallen branch the first houses picked up under the oldest Singing Grove so that only one of them would speak at a time. The war-speaker Sirael carried a bough of the same grove at Dardan instead of a standard, and the companies of the Grand Alliance learned to look for it in the smoke; after the Ember Lands the houses sewed it on grey-green cloth so that every company of the forest would carry the precedent with it. It is always shown lying level, never upright and never held, because no house owns it.\n\nThat the right to speak is lent and laid down again, and that the forest takes only what it gives: to its own houses a promise of the council's peace, and to anyone who would cut the living wood a warning.\n\nThe Roots\nLong before Aen the houses that became the council came into the Living Forest from many directions, and their own songs disagree about whence; what every song agrees on is the quarrel. Each house claimed the glades it had found first, and for a long season the forest knew feuds over hunting runs and springs. The houses met under the oldest Singing Grove meaning to fight, and by their own telling they stayed to listen, because the grove was singing. The first precedent was made there: a house that wished to speak had first to pick up a bough the grove had let fall, hold it while it spoke and lay it down for the next, and nobody might break a bough from a living tree to get a turn. From that night come the customs that still shape the realm: the council's vote and its book of precedents; the rule that the houses take fallen wood only and never cut a living tree, which they wrote even into the Worshipdom's grant of the Zilin valleys; and the Speaking Bough itself, a fallen bough kept in the council-hall at Lyrion and passed from hand to hand at every Elder Moot. The rule was broken once, in 3A 802, when the houses felled the northern wood themselves to cut the Black Roots' anchors; each house carried one bough of the trees it had felled to Lyrion, and the heap lies behind the council-hall as the hardest page of the book, written in wood. In 4A 1748 a First Speaker still takes office by picking the bough up from the floor rather than being handed it, and a house that interrupts a speaker who holds it loses its voice for the session."
 zin_realm_lore_MIA:0 "The Sign\nA miner's iron pick standing upright with a gold circlet hung on its haft, on slate grey.\n\nThe pick is the one the king of Mina took down into the fallen gallery in 4A 1567 and was found under the fall with his crown hung on its haft. It hangs in the hall at Gilvian with that crown still on it, every king since has been crowned by lifting his circlet off its haft, and the miners paint the crowned pick on the gallery doors so that each crew knows its king has worked there.\n\nOur kings dig. It promises the miners a crown that goes down with them and the strait fleets iron from the North's deepest hills; to the High Crown it says that Mina's king answers to his galleries before he answers to Sonargur.\n\nThe Roots\nThe ore hills of Etonia were dug for iron by Leren miners from the Second Age, who owed their lord a share of every cartload and lived in fear of the hills, because the deep galleries kept breaking into older workings that no man had cut, smooth and square, which the miners walled up and did not enter. In 4A 640 the miners' lord, Stenolf of the Korn, opened the great galleries the North calls the Delvings and was crowned king of the ore hills at Gilvian, and the crown has been bound to the galleries since. Its defining night came in 4A 1567, when the deepest gallery fell in on two hundred miners: the king went down to the rescue himself with a pick and did not come up, and when the gallery was cleared the miners found his body under the fall and his crown hung on the haft of his pick, where he had hung it to work. From the crown on the pick come Mina's laws: every king works a season in the galleries before he is crowned and one every year after; a king's crown hangs on a pick at his coronation before it is set on his head; no gallery is opened into the old square workings, which the miners still wall up; and the mining crown takes pride that its kings dig. Whether the square workings were cut by dwarves, and where they lead, the miners do not ask, and the dwarves of the High Mountains, when they are asked, say nothing at all."
 zin_realm_lore_MIE:0 "The Sign\nA black ibex standing with its long horns swept back, on dust gold.\n\nThe ibex is the one of the gorge-mother's tale, which showed the first path through the Hardtmuth when it came down to drink, and the pass-houses carved it on the rock at the head of every gorge they guide through. When the pass-houses elected Rhanios of the Upper Gorge the first Lord of the Passes at Erdozan in 4A 664, each pass-fort brought its own rock-cut ibex to the election, and the lords agreed on one banner for the whole chain: the black ibex that knows the way and drinks at nobody's leave.\n\nThe way through, at a price: to every caravan a promise that a guide of Miaed never loses the path, and to every host the reminder that the passes were sold to the Kalioth and to their beaten remnant alike.\n\nThe Roots\nThe pass-houses of the Hardtmuth are older than the Sand Road and remember the price of every water they have sold. Long before Aen the gorges of the volcanic chain were the only way from the desert to the coast, and the families who lived in them found their paths by following the black ibex of the high rocks, which they never hunt; their oldest tale is that the first path through the Hardtmuth was shown to a gorge-mother by an ibex that came down to drink at her spring, and that whoever follows an ibex does not die of thirst. In the First Age the pass-houses sold water and guides to the Kalioth Crown, which claimed their passes, and to the eastern hosts that marched north through them to Volgan's war. After Dardan, when the beaten Kalioth garrisons came back south starving, the pass-houses sold them water too, at a price they could not pay, and many died in the gorges. The pass-lords remember both sales and are ashamed of neither: water sold to the going and to the coming alike is the law of the passes, and it is why Miaed sells passage to the higher bidder without asking which way a host is marching. The pass-lords keep a dry temple stair at Erdozan though they have no river, because the River Temples faith came south with the Kalioth's subject peoples, and they say their first Lord of the Passes bargained with the mountain and paid it in the first caravan's bells. The pass fires they have lit every dry season since 4A 1240 are a guide for caravans and an offering to the mountain, and the gorge-houses say a fire is lit for the ibex as much as for men."
 zin_realm_lore_MIR:0 "The Sign\nA grey heron standing upright with its neck drawn back, watchful, in heron grey and white on night blue.\n\nThe heron is the watcher of the swamp years, the bird whose rising warned the hidden villages of Volgan's patrols and whose stillness told them the reeds were empty. Hadric's scouts sewed it on the reed-cloth they carried out of the Great Swamp after Dardan, and the High Wardens have flown it since 2A 3 over Miherta's beacon tower, where the lake-kings' crown hangs unworn.\n\nThe watch that never sleeps: to the peninsula a promise that the towers are manned every night, and to Nafeher the warning that nothing crosses the Sound unseen.\n\nThe Roots\nMirolon was a lake-kingdom before it was a watch. Ainic lake-folk founded it on its lake and the peninsula's north shore in 1A 377, their speech became the southern daughter of Old Ainic, and the lake-kings built Miherta's beacon tower to guide boats home across the lake, not to watch the south. In 1A 1150 Volgan crossed the Sound with fleets the storms did not hinder, took Miherta and killed the last lake-king, and Mirolon became the opening of his war on Aenor. The survivors went into the Great Swamp and the hills and stayed there for more than five centuries. The swamp years made the wardens: the hidden villages learned to read Volgan's patrols by the herons of the swamp, which rose when strangers came and stood still when the reeds were empty, and the watchers who stood night after night as still as the herons became the first scouts. When Volgan's host broke at Dardan and his garrisons starved, the survivors came back out of the swamp, and in 2A 3 the pass-lords and the lake towns chose Hadric of Miherta to watch the south for life. He refused to wear the lake-kings' crown and hung it in the beacon tower instead, and Mirolon has never again trusted a single royal line. From the swamp years and from Hadric come the wardens' laws: every tower keeps a lamp lit toward the south each night; a warden who lets his lamp go out is struck from the rolls; the High Warden is elected for life and may not pass the office to a child; and the crown stays in the beacon tower."
 zin_realm_lore_MLK:0 "The Sign\nThe Sworn Gauntlet: a black iron gauntlet raised with its fist closed, on a storm-grey field, with a black hem of jagged teeth.\n\nZorak forged the gauntlet from the keel-bolts of the first raider ship that the Black Wind drove onto the rocks of the Gulf of Minnolomak, and every oath-man of the first companies swore by putting his hand inside it while Zorak closed his own hand over the iron. The gauntlet was burned with him on his pyre and taken out of the ashes whole, which the march counts as the wind's answer, and since then each new warlord is chosen over his predecessor's pyre with the gauntlet on his hand and never a crown on his head. The oath-companies painted the closed fist on their shields before the march had any banner, and the black-stone forts fly it on grey.\n\nA realm held by the sworn hand and never by birth or crown: to its own men it promises that an oath binds the warlord as much as the sworn, and to Fandanar it says that the march will kneel to no fire it did not light.\n\nThe Roots\nThe Ormolak valley was never a land of the hearth-keepers. The clans who came up its sheltered floor after the Sunfields fell were hunters and bog-smiths, and for longer than the songs can count they were raided from the Frozen Ocean coast by sea-wolves whose home no southern chart has fixed. The march's own tale says that in 2A 1779 Zorak, a bog-smith's son, went down into the cliff below Minnolomak where the north wind howls through the rock and bargained there with the storm that had sunk more raiders than any warrior had killed. What answered him the Storm Court calls the Black Wind; the fire-keepers of Fandanar say it was one of the corrupted servants who fled an Old God and came to Aoaz, a devil by its true name, and the march will hear neither word spoken aloud. Zorak forged a gauntlet of black iron from the keel-bolts of the first raider ship the wind broke, swore his men into it hand by hand, and set them to cut the Black Gallery, where the wind's token still hangs. From that bargain come the laws of the march: no warlord wears a crown, because Zorak promised the wind that no man of the valley would rule by birth; every oath is sworn with the hand inside the gauntlet; a token is kept for every wind that sinks an enemy; and the oath-companies would rather go hungry than eat bread they did not take or earn. The Iron Crown that hangs unworn in the Black Gallery is the crown Zorak refused, and Melkgard's refusal of the Winter Crown in 4A 850 was, to the march, only the same refusal said again."
 zin_realm_lore_MOA:0 "The Sign\nA white steam-eel rising in an S-curve with its head raised, on deep lake teal.\n\nThe eel is the lake-steam eel, the only fish that lives in the hottest water, which kept the shore-folk alive in the years when the lake turned hot. The lake towns carved it over the door of the fish-hall of Gonnois when the council first met there after the Purchase of 3A 802, and the Speaker wears an eel-skin girdle as the sign of office. When the eels died in the Year of Steam, the council flew its banner reversed for a season and raised it the right way only when the first eels were netted again.\n\nEndurance where nothing else lives: to the shore a promise that Mora feeds whoever stays, and to the lake's lords and neighbours the reminder that the lake towns have outlasted every master who held their shore.\n\nThe Roots\nThe lake towns of the Hot Lake's east shore are the people who stayed. Their Lake Litany remembers that long before Aen the lake was cool and full of fish, and that in the years of the Breaking it grew hot and steamed and everything in it died but the steam-eels, which live where nothing else can. The shore-folk who did not flee lived on the eels and on the salt the hot water left in the pans, and they learned two things that still govern them. The lake must not be woken, so nobody beats a drum, rings a bell or shouts on the water, and the Litany is sung low. And merchants and fishers must pray together at the water, because in the starving years the fishers fed the shore and the merchants carried its salt away to buy grain. The salt-boilers say that something under the lake breathes; the shore-folk have never asked what it is. The towns lived under highland lords until 3A 802, when the fishers and grain-farmers of Gonnois bought their lord's rights with three years of harvests rather than fight him, and Mora has been the only realm of the East that was bought rather than won. Its council has met in the fish-hall of Gonnois ever since, its grain feeds every host that has ever crossed the East, and the Year of Steam of 4A 1655, when the lake boiled over the eastern pans and killed the eels and the pan-workers alike, is remembered in the Litany as the year the lake turned over in its sleep."
 zin_realm_lore_MOO:0 "The Sign\nA single white path-stake standing crooked in black marsh water, on dark green.\n\nThe stake is one of those Helmund's men moved on the night the raider host drowned in the marsh in 2A 1240. The margraves keep it in the hall of Altovian, and the march's banner has shown it crooked ever since, because a stake that stands straight shows the true path; every spring the margrave drives the first new stake of the marsh-paths himself.\n\nThe way through is ours to show. It promises friends a safe path and enemies the deep water, and tells Sonargur and Parim that the margrave decides which of them is shown the way this year.\n\nThe Roots\nThe northern march of the island is a country of marsh and hill facing the Dark Shore, and the margraves were made by the Raiding Years. When orc and goblin bands began crossing from the Dark Lands in the Second Age they came through the marsh, which only its own folk could cross, along paths marked with stakes. In 2A 1240 the strait kings gave the march's defence to Helmund of the Ostvar, and the march tells his story as a single night: when a raider host came into the marsh, Helmund's men waded out in the dark and moved the path-stakes, and by dawn the host had walked into the deep water and drowned. The fortress line he built behind the marsh made him margrave. From the moved stakes come the march's customs and its politics: every marsh-path is staked anew each spring by the margrave's men alone, and a stranger who moves a stake is drowned; the margraves show the true path only to friends and change it when friends change; and they learned to stake the march's way between the High Crown and Parim in the same manner, leaning towards Aenor whenever Sonargur leans away, so that neither would ever think it needed to take the march for itself. The house of Ostvar also claims kin in the lords of Fotan across the strait, who bear the same name and neither confirm nor deny it."
 zin_realm_lore_MOS:0 "The Sign\nA sheathed sword with its hilt upward, the hilt bound to the sheath with a white cord, on caravan red.\n\nThe tied blade is the gate-weighers' rule made into a banner. The first weighers of Cereosa hung a tied sword over the inn gate in 4A 688 so that every caravan could see the rule before it came in, and when the city became free in 4A 1394 the weighers' council took the same sword for its banner and swore that the cord on it would be cut only if Cereosa itself were attacked. The cord has never been cut.\n\nA junction where nobody draws: to every caravan the promise of a fair weighing, and to both great powers the warning that on the day the cord is cut, Cereosa fights.\n\nThe Roots\nCereosa stands where the old roads of the East cross, and the junction is older than the city by three ages. In the First Age the Kalioth Crown's tax-masters met the desert tribes and the lake traders at the crossing to take the empire's tolls, and the place was so feared that the tribes called it the Knife-Ground: every quarrel over a weight ended in blood, and the Kalioth took the dead men's goods as well. After the Crown fell, the crossing was a place where nobody would camp for ages, and caravans that met there fought. When Stabilic weighers built an inn and weigh-house at the junction in 4A 688, they made one rule before any other: every man who came in at the gate had his blade tied into its sheath with a white cord by the gate-weigher, and anyone who cut the cord inside the walls was weighed against his goods and lost them. The caravans of every road began to settle their weights there, because it was the one place in the East where nobody could draw. The weighers' council that governs the city is still the council of the gate: the First Weigher is chosen each year from among the weighers who have tied the most cords without a single cut; a contract signed in Cereosa is honoured on every road; and when the Peace of Cereosa made the city free in 4A 1394, it was signed in the weighers' hall by envoys of Noris and Stabilo who both wore tied blades."
 zin_realm_lore_MSH:0 "The Sign\nA pale cap rising from a black severed root, in cap cream and loam dark on spore purple: the Bale-Mark of the rings.\n\nThe cap on the severed root is the mark stamped on every bale the mycids have brought to the market of Luv-zhise since 4A 388, and it is the only sign of theirs that any other people has seen. The quay-houses copied it onto the cloth that marks the mycids' place at the market, and the rift-coast elves read it as the belt remembering the Black Roots it rotted away in 3A 820. What the mycids themselves mean by it has never been said.\n\nRead by others as a warning that what is dead in the belt feeds what grows there, and as a sign that the belt cannot be poisoned; what it means to the mycids is not known.\n\nThe Roots\nWhat is known of the mycids' past is only what other peoples have seen of them, and the rift-coast elves, who have watched the belt longest, insist that it is very little. Their oldest rolls say the belt of giant fungi already stood on the rift shore when the neck of land broke long before Aen, and that it grew over the western half of the drowned city on that shore, so that pillars and causeway footings now stand among the stems; the quay-folk of Luv-zhise steer by the ones that reach the water. The elves have never ruled the belt and say they have never been asked in. The one great deed anyone can tell of the belt came in the Third Age: when the Black Roots crept through the land's magic toward the rift coast in 3A 820, the fungi grew over them and the dead roots rotted away there, while the elves of the north had to fell their own wood to stop them. Whether the mycids did this, allowed it or only lived through it, nobody outside the forest knows, and the mycids have never said. Since 4A 388 they have come to the market of Luv-zhise in rings, standing in a circle, with fungi, dyes and spore-cloth, and every bale they bring bears the same stamped mark: a pale cap rising from a black severed root. The traders read the mark as the belt's own memory of the Black Roots; the mycids have never explained it, and the quay-books record it as the only sign of the mycids that anyone has."
 zin_realm_lore_MUS:0 "The Sign\nA laden pedlar's pack-frame with a white salt-bag tied on top, brown on saffron.\n\nThe pack-frame is the one the first band of packmen carried home from the far end of the long road in 4A 1497 with a sack of salt tied on top; it hangs above the boss's seat at Krakur, its salt-bag long empty. Every packman burns the sign of the pack and the salt-bag into his own frame, and northern innkeepers have learned that a frame with the sign belongs to a pedlar of Mustnom, who will pay the boss's due on everything he sells them.\n\nThe road gives and the cave takes. It promises the North goods and news from every road and tells every town that a packman of Mustnom always comes home; the locked doors he finds there are part of the bargain.\n\nThe Roots\nThe dwarf goblins of the southern hills are a people of their own, neither dwarves nor goblins, and they do not say where they came from; asked, a Mustnom packman says only that his people came out of the hill when the road called them. They have lived in the caves below the Solondor ridge for longer than the Leren remember, trading and stealing on the island's roads, and their history as they tell it begins with salt. In 4A 1497 the boss of Krakur sent his packmen out on the long road across the whole island, and the first band came back before winter with a single sack of white salt from the far end of the road, a thing the caves had never had; the boss poured a pinch of it at the cave-mouth to thank the road and took the rest for himself, and the Boss's Due was born. From the salt come Mustnom's customs: what a traveller brings home is owed to the cave; the spirits of the road are thanked with a pinch of salt at every crossroads, and the Leren find it on their milestones; half the people are always away on the roads, each carrying a pack-frame that is the packman's whole fortune; the Homecoming before winter is the year's one feast; and the packmen's habit, which has made them valuable to the High Crown since they brought word of a Belonton raid three days ahead of its own riders in 4A 1702, of noticing everything and selling what they notice."
 zin_realm_lore_NAA:0 "The Sign\nA ship with a prow at both ends, both stems curling up alike, without mast or sail, in sea white on deep slate.\n\nWhen the fleets did not come back, the harbour-mothers of Hacsen and Vigodor each built one ship with a stem at either end, so that it could row out to the North Mouth and come home without turning, and they rowed it out every year to call the names of the lost. The two harbours quarrelled over everything else for two ages, but each kept its double-prowed ship. At the Wedding of the Two Harbours in 3A 1102 the heiress of Hacsen stepped from her harbour's ship to Vigodor's at sea and the two were lashed together; since then the sea crown has kept one such ship, the Returning Ship, which is the queen's own and carries no mast.\n\nA ship that always comes back: the crown's promise that no fleet of Naamis sails for a stranger without the queen's word, and a warning to any lord who asks for its ships that the coast remembers the last time.\n\nThe Roots\nNaamis is young as a crown and old as a coast. The harbour-folk of the north coast plain sailed the Kusmeel shore and the North Mouth of the Rift long before Aen, and in the First Age the harbours of Hacsen and Vigodor were among the eastern ports that gave Volgan ships when he opened his war. Their fleets sailed south with his eastern clients and none came back; the coast's chronicles say only that the black hulls went into the Rift Sea and the sea kept them. The harbours were left to the women, the harbour-mothers, who rebuilt the boats, fished the coast and swore at the harbour mouths that no fleet of the coast would ever again sail for a foreign lord on a man's word alone. From that oath come the laws that make Naamis what it is: the crown passes most often to a queen, because the first keepers of the harbours were women; the council of ship-masters may refuse the queen's ships but not her crown, because the mothers kept the ships and the masters kept the sea; and every year the queen's ship rows out to the North Mouth, where the old fleets were last seen, and back. The boat clans who refused to give Volgan their boats fled north onto the ice and became the sealers of Woqood, and the two peoples kept a cold distance for three ages, until the Ice Winter of 4A 1604, when Naamis fed the clans and the old shame was paid. The Wedding of the Two Harbours in 3A 1102 joined two harbour-mothers' lines, and the sea crown of Duum-Saah still counts its queens from them."
 zin_realm_lore_NAN:0 "The Sign\nA dark storm-petrel skimming low with its wings bent, in storm black on grey.\n\nThe petrel is the bird the wayfinders of Nan followed through the Tempest Reach, the bird that knows the gaps in the storm. Feron the Grey flew a petrel banner from the mast of the ship that brought him through the storm to take Larorun in 4A 1188, and every warlord since has flown it over the fort; Nan's pilots wear a petrel feather in their caps, and a ship that carries one is under the warlord's protection, whoever has paid for it.\n\nThe way through the storm: to the chieftains a promise that the warlord holds the only road, and to Mirolon and Nafeher alike the reminder that the road is for sale.\n\nThe Roots\nThe hill-folk of the dark Nan Mountains are the men who ran from the gate. When Volgan's power first reached the old coast of the island in the First Age, the men of that coast who would not serve the Dominion took their boats across the storm belt to the southern tip of the peninsula and the isles beyond it, and hid in the mountains where the storms of the Tempest Reach break on the peaks. The storms that had nearly drowned them became their wall, and the families who learned to read the weather became the chieftains of the mountains. Their oldest wayfinders found that the storm-petrels, the small dark birds that fly low through the worst weather and seem to walk on the water, always know the gaps in a storm, and the wayfinders of Nan learned the storm-pilots' route through the Tempest Reach by following them. For ages the hill chieftains fought each other for every cove, until in 4A 1188 Feron the Grey, a chieftain who had learned the petrels' route, took the fort of Larorun and made the others swear to him as warlord; his chieftains named him for the grey of the storm, not of his hair. From the petrels' route come Nan's customs: the warlord is the captain the chieftains will follow and keeps the office only by success; the wayfinders' charts are secret, so that only Nan's pilots can bring a ship to the island and back; and a Nan pilot is sold to whoever pays most, Nafeher included. Almon the Small, a wayfinder from the southern isles, has held Larorun since 4A 1731."
 zin_realm_lore_NAR:0 "The Sign\nA fishing torch turned head downward and unlit, in torch-wood brown on dusk violet.\n\nThe quenched torch is the oath of the Day Rule. When the survivors of the storm year of 1A 800 met at Riwang, each drove his night-fishing torch head down into the wet sand of the beach and left it there unlit, and swore to fish the reef only by day; the torches stood on the beach until they rotted, and the moot cut the first of them into the post of its moot-house. Since then a Naran fisher's first boat is given a torch that is never lit, and the moot's banner, raised at dusk when the elders blow the conch to call the boats in, shows the torch turned down.\n\nHome before dark: to the fishers a promise that the moot will count every boat back, and to anyone tempted onto the reef at night the island's oldest warning.\n\nThe Roots\nThe fishers of the long island Ancha have one law older than their moot, and they obey it more strictly than any other people of the south. Their tales say that the first canoes that came to Ancha fished the great reef off its north-east coast by night, by torchlight, as the Yonic folk fished everywhere, and that the reef took them. In 1A 800 a storm year drowned half the island's boats on the reef in one night, and the survivors met at Riwang, swore to fish the reef only by day and to bring every boat home before dark, and became a moot of elders; the eldest speaks for the island and counts the boats back each evening. The elders call the boats in at dusk with a conch blown from the moot-house, and a boat that has not answered the conch by the time the sun touches the water is mourned. In 2A 1420 fishers caught on the reef at night came home saying that drowned voices had called them onto the rocks, and the moot added the voices to the Day Rule; nobody of Nara has crossed the reef after dark for any reason since. The island's customs come from the reef: the conch is the elders' voice; a fisher's first catch of the year is given to the families of the drowned; and a shipwrecked stranger is taken in as everywhere in the islands, as the survivors of the Aenoran refugee ship wrecked on the Night Reef in 3A 1040 were taken in. Their grandchildren still speak a few Aenoran words in Riwang."
 zin_realm_lore_NET:0 "The Sign\nThe King's seal: a five-pointed figure drawn in one unbroken line within a ring of fire, in pact gold on hall black.\n\nThe seal is the King of Demons' own sign, burned into every pact the Halls make with the living, and it is the only such figure on any banner of Aoaz. The houses of the Halls carry it above their own signs in every company the king sells to Nafeher, and a mortal who bears it burned into his skin is under a pact and may be touched by no house but the king's.\n\nPower in life, at a price: to those who seek the king the promise that the bargain is kept to the word, and to every house and every mortal the warning that the seal is never broken while the bargainer lives.\n\nThe Roots\nThe Nether is the oldest court of the demons in Aoaz and the seat of their king. Demons are corrupted angels, immortal Great Folk, and the houses of the Halls tell that when the first of them came down corrupted they went into the heat beneath the volcanic island ringed by the Sea of Lava, where nothing living could follow, and cut the Halls beneath Mount Nether. There they took one of themselves for king, the King of Demons, whose own name is not spoken among men, and they count only the years of their pacts. The court's order comes from the king's seal. A pact of the Nether is sealed when the king's seal, a five-pointed figure drawn in one unbroken line within a ring of fire, is burned into the bargain; the pact binds the living who make it, in service, obedience or tribute, and grants them real power in life, and when they die they are Zol's and not the king's, so the Halls take their price in life and nothing after. The houses compete for the king's favour and the right to open portals, and the house of the demon Agon is one of the oldest and least obedient. In the Second Age portals opened across Aoaz and demons raided Aenor, not all of them at Elzon's bidding; when the Burning Gate on the Nezer coast was closed in 2A 1388 and the houses quarrelled among themselves and with the Necromancer's order, the portals closed one by one, and by 3A 700 the Nether had withdrawn behind the Sea of Lava. Since 4A 1650 the king has sold companies of demons to Nafeher by bargain, renewed each reign and never sworn, and the Nether Maw is disputed with Volgan's servants."
 zin_realm_lore_NEZ:0 "The Sign\nA black galley with two steering oars at its stern, one at each quarter, in ember gold on nether red.\n\nThe two-oared galley is the lava galley of the ferrymen's house, the ship that holds its course only when both steersmen pull together. The queen and the lord who took the empty hills in 4A 3 crossed the Sea of Lava under it, and the twin crowns of Gelroze have flown it since; when the crowns disagree, the galley is flown with one oar shipped.\n\nTwo crowns, one course: to the thralls and companies of Nezer the promise that the realm moves only when its crowns agree, and to Nafeher and the Nether the warning that the house that carries their trade can stop carrying it.\n\nThe Roots\nThe two crowns of Nezer are a family of the Nether's ferrymen. In the Halls under Mount Nether their house kept the galleys that cross the Sea of Lava, the only ships that can, and its lords and queens were the steersmen of the Halls' trade with the surface. A galley of the lava sea has two steering oars, one at each quarter, and it holds its course only when both steersmen pull together, so the house has always been ruled by two of one blood. In the Second Age the Nezer hills were Nazerun, the seat of the Great Necromancer, and the coast of the Sea of Nazerch was his; the house ferried demons to the Burning Gate on the Nezer coast in the years of the portals and lost many when men, elves and Dark Lands soldiers closed the gate in 2A 1388. When the Necromancer died in Aenor his seat stood empty and his necromancers scattered, and in 4A 3 a queen and a lord of the ferrymen's house crossed the lava sea with their galleys, took the empty hills and the Nazerch coast, renamed them Nezer in their own speech and began to rule them together from Gelroze. From the galley come the crowns' customs: two crowns of one house rule and must agree on war; each crown keeps its own lands so that neither need cross the other's; and the trade with the Nether crosses the Sea of Lava on galleys that only demons sail. The crowns keep the Necromancer's hills and nothing of him, and they guard the broken ring of the Burning Gate on their coast. Nezer swore to Nafeher in 4A 1650, its two crowns agreeing for the first time in a century."
 zin_realm_lore_NIV:0 "The Sign\nThe Frost-King's Maul: a great stone maul standing upright, its head bound with iron bands, white and grey on a deep ice-blue field, with a white hem of stepped stones.\n\nThe maul is the stone hammer with which, in the cairn-keepers' song, the first Frost-King broke the glacier to make the seat of Xitore; it lies across the knees of each Frost-King at his enthronement, and an iron band is added to its head for every Frost-King who keeps the toll-peace through his reign. The giants carve its shape on the toll-halls of the herd roads, where a clan that pays may pass, and the envoys of the reindeer clans in 2A 1312 were the first men to see it raised over the ice-throne.\n\nThe heights held by staying and not by fleeing, and nothing given that is not paid for; to the clans it promises a road for the toll, and to an army a shut door of ice.\n\nThe Roots\nThe ice giants of Nivaros were on the heights before men came north and were still there when the Sunfields fell, and their own tale of that fall is not one of punishment but of breath: the snow, they say, breathes in and out over the ages, and when it breathed out over the Fandan meadows the giants did not go down before it as men did, because the first Frost-King had taught them to stay where the ice is. That first Frost-King, in the song of the cairn-keepers, broke the glacier of the heights with a stone maul to make the seat at Xitore, so that the giants would sit in the ice rather than flee it, and the maul is laid across the knees of every Frost-King at his enthronement. From that seat come the giants' laws: the Frost-King is chosen by the cairn-keepers and never born to the seat, a stone is laid on the cairns for every winter a giant lives and no giant tells a man how high any cairn has grown, the heights are closed to any crown that comes in arms, and passage is never free, because what the snow gives must be paid for. The giants of Hirolon in the Middle Lands share their speech and their custom of stones, and the cairn-keepers of Xitore say only that the two peoples knew each other once, which is all they will say. In 4A 1748 the giants keep the toll-peace with the reindeer clans and the hunting pact with the Winter Crown, take their toll in iron at the Orewell lowland, and meet every army on the heights with the doors of ice shut."
 zin_realm_lore_NLR:0 "The Sign\nA curved war-horn with a split bell, mouth to the left, in dawn silver on pass grey-green: the Cracked Horn of Ennaton.\n\nThe horn is the herders' great horn that Nolanwe blew over the Lake of Mirolon on the night Volgan's fires came round the shore, until its bell split. The families who swore the Oath of the Posts at dawn sewed it on the cloth of the first watch-post, and the horn itself has hung over the warden-hall at Ennaton since the hall was built. The wardens show it cracked on purpose, so that every post-captain who looks up at it remembers that a warning once came too late.\n\nThat the warning will always come in time: to Mirolon and the lake shore the promise of an unsleeping watch, and to anything coming up from the south a threat that the heights already know it is coming.\n\nThe Roots\nBefore they were wardens the families of the southern crags were herders of the heights, few and proud, who drove their goats over the passes above the Lake of Mirolon and traded milk and wool with the men of Mirolon's shore, whom they counted as neighbours. When Volgan fell on Mirolon in 1A 1150, the herders saw his fires come round the lake by night and could not reach the shore in time. Their eldest herder, Nolanwe, blew the great horn of the heights to warn the lake towns and blew it until its bell split, and the warning still came too late; at dawn the families saw what was left of the shore. They swore that same morning, each family to one post, that nothing of Volgan's would come up through the heights and that the warning would never again come late, and the cracked horn was hung in the first warden-hall, where every Pass-Warden since has sworn on it. From that night comes the whole law of the wardenship: one family to one post, a vigil that never stops, a count of everyone who crosses, a Pass-Warden unmade if a vigil breaks on his watch, the watch on the Lake of Mirolon that has never once ceased, and an old shame that keeps the wardens closer to Mirolon's people than most elves are to any men. In 4A 1748 the post-captains still learn the horn-calls before they learn the bow, and a warden who sends word late is not forgiven."
 zin_realm_lore_NND:0 "The Sign\nA crown twisted from a ship's anchor cable with its strands showing, in rope tan on deep sea black.\n\nThe cable crown is the crown Kusion of the Kilai twisted from his ship's anchor rope at Kudaini in 2A 760, when there was no gold for a crown among the corsairs he had beaten. Every sea-king since has been crowned with a new one twisted from his own ship's cable, and the old crowns hang in the hall of Kudaini; the royal galleys fly the cable crown, and the king's sailing-writ is sealed with a twist of tarred rope.\n\nA crown made at sea and kept at sea: to the king's captains a promise of writs and plunder in war, and to the corsairs who sail without one the threat of the rope.\n\nThe Roots\nNondondor is the only crown of the arcs, and its crown was made of rope. The southern half of the western island was a nest of corsair captains after the Grey Breath emptied the harbours of the Sea-Roads, and for six centuries the captains fought one another for its coves. In 2A 760 a captain of the Kilai named Kusion beat the others one by one at sea, hanged on their own yards those who would not swear, and called the survivors to the cliff harbour of Kudaini; there being no gold among them for a crown, he had a length of his ship's anchor cable twisted into a ring, set it on his own head and called himself sea-king. He made his corsairs fishers in peacetime and his fishers corsairs in war, and his line has held the cliff harbour since. The Kilai claim more than their island. They say that the league that died in the Grey Breath had one due and one law for every flag, and that a crown is needed to keep both; the claim to the Southern Banks, pressed since 4A 1398, is their first step toward that, and Seite and Raerby refuse it every year. From the rope crown come the sea-kings' customs: the crown passes to the eldest son or daughter who has commanded a ship; every Kilai king is crowned with a cable twisted from his own ship's anchor rope; and a corsair in the king's waters sails by the king's writ or hangs. In 4A 1630, after the burning of Straton, the sea-king hanged forty corsairs who had sailed without his writ, so that the western fleets would not come for Kudaini next."
 zin_realm_lore_NOL:0 "The Sign\nA long-handled ditching spade, blade down, its blade cut in steps, silver on dark green.\n\nAt the Oath of Eight Hearths in 4A 774 each town's founder-family drove its own ditching spade into the common ground at Saelori and left it standing, and the first Chief Speaker took up the eldest of them as the confederacy's staff of office. The stepped blade copies the old stone lining the farmers find under their drains, which the spade-smiths of Saelori took for the proper shape of a spade without knowing why.\n\nWhat lies under the fields belongs to those who farm them. The spade promises that the eight towns share water, roads and tolls and dig together; it also says that the confederacy will dig up its own past before anyone else does, and the Chief Speakers know that the scholars of Parim have begun to ask what the steps are.\n\nThe Roots\nNoleksun's eight towns are young, but the ground under them is the oldest farmed earth of the south-east. Long before Aen the western march of a kingdom of the Eastern people ran along the road through these downs, and its farmers cut the stone-lined ditches that still drain the fields; when that kingdom broke far to the east, the western branch of its royal house faded among these hills, and the farmers of the march were left with ditches no one else knew how to cut. Later masters added their own layers: the Kalioth forts of the First Age, the tribute farms of the Order. The founders of the eight towns came after the Order fell, landless families of the march who took up the fields and found, every time they deepened a drain, an older drain beneath it. Their law is the law of the ditch: a field's water belongs to the field below it, so no town may close its drains on another; the tolls of a crossing road are shared, because the road like the water runs through them all; and a quarrel ends in digging, for the eight towns swore the Oath of Eight Hearths over the ditches at Saelori by each driving a spade into the common ground. The diggers of 4A 832 showed the farmers a second ditch under the first; the scholars who have seen the stonework say no mason of the march cut it, and the Chief Speakers have so far declined to let anyone dig further."
 zin_realm_lore_none:0 "No chronicle of this realm has been written yet."
 zin_realm_lore_NRS:0 "The Sign\nAn upright rider's lance with a round water-gourd hung by its cord beneath the blade, in well white on deep indigo.\n\nQasud ben Melar of the Khadi ended the War of the Eighth Well in 2A 1214 without a battle at its close. He rode into the camp of each warring tribe with a gourd of water from the Seven Wells hung under his lance-head and offered it, and every tribe that drank became kin to the others under the Well-Oath and could no longer fight them; the tribes that would not drink he fought. The well-lords chose him king at the wells, and the gourd-lance became the standard of the Khadi: it is carried before the king at every muster and filled at the Seven Wells before every war. A king the well-lords no longer trust is not deposed; the gourd is simply not filled for him, and no rider follows an empty gourd.\n\nWater shared makes kin, and the king leads only those who drink: to the tribes a promise that no Khadi will ever hold back the water, and to every enemy a warning that Noris rides as one tribe once the gourd is filled.\n\nThe Roots\nLong before Aen the forefathers of the desert tribes were the drovers of the Bridge Kingdom, which they call Tarqis: they walked its caravans of horses and cedar along the eastern march and knew every water-hole between the Melty Pass and the neck. When the bridge broke, the road ended under the sea, and the drovers became a people of wells without a road, wandering from water to water. In the First Age the Kalioth kings brought the desert tribes under their iron and set water-masters over the wells, who sealed them with iron lids and opened them only for tribes that sent riders and camels to the Crown's hosts. When the Kalioth host died with Volgan's at Dardan, the tribes broke the lids from every well between the wadi and the north coast in a single season, and the riders swore that water would never again belong to one man. That oath is the root of the Well-Oath: whoever has drunk from a household's water is kin of that household, a tribe that shares a well may not raid it, and no king of Noris owns a well. The Seven Wells were dug by seven tribes together on one hill so that no tribe could own them; the War of the Eighth Well was fought when one tribe dug a well of its own below the hill; and the Khadi king is chosen by the well-lords because a king who held the water would be a water-master again. The riders' scorn of black powder comes from the same memory: the iron hosts that held them down were hosts of engines and forges, and the tribes say that men who need forges need masters."
 zin_realm_lore_OBM:0 "The Sign\nA black hornbill with a great curved casque, wings closed, on gum amber.\n\nThe hornbill is the bird the old cutters followed upslope in the fever of 4A 1319, and the factors took it for the town's banner when they rebuilt Kerdoco on the ridge. Its casque is carved on the lintel of every house built since, and a hornbill's nest found in a felling ground closes the ground for a season. The town's companies of cutters and gum-tappers carry it on amber cloth, the colour of the jungle gum that made Kerdoco rich.\n\nGo where the hornbill goes and you live: to the town a promise that the factors will move before they let it die, and to outsiders the warning that Kerdoco knows the jungle and they do not.\n\nThe Roots\nKerdoco is a city of the caravan princes that the jungle has taught. The jungle edge was the end of the Kalioth Crown's fever road: the mountain kings sent condemned men south to cut hardwood for their siege engines, and those who lived through three wet seasons were set free, because the Crown reckoned that a man the fever had not killed would not soon die of anything else. The freed men stayed at the jungle edge and learned from it; their descendants were the timber-cutters the Stabilic factors hired when they set up their camp in 4A 912, and it was they who showed the factors how to tap the gum that seals casks and seams. The jungle's oldest lesson came in 4A 1319, when a fever out of the wet season killed half of Kerdoco. The old cutters noticed that the hornbills had left the low trees and were nesting on the ridge, and the families who followed them upslope lived. The factors moved the whole town to the higher ground where it now stands, and the rule has been law since: build where the hornbill nests, cut no tree where a hornbill nests, and never stay in the low ground through the wet. The factors' council keeps the Ledger Count like its old houses, but the town's oldest families still count their years by the wet seasons they have survived, as the freed men of the fever road did, and the gum Kerdoco sells to Drak for its powder casks has made it rich on the Stabilo Pact's war-trade."
 zin_realm_lore_OLE:0 "The Sign\nA sea-kestrel hanging still in the air with its wings spread and its tail fanned, in cliff white on storm blue.\n\nThe hovering kestrel is the bird the fishers saw hanging in the Holy Breeze above the cliffs in the winter of 2A 412, where the shrine of Gelbus was built. The lamp-keepers carved it over the shrine door and have flown it from the lamp-cliffs since, and a refugee who reaches the cliffs is given a small cloth kestrel to wear, which every boat of Olen respects.\n\nHeld up by the breeze: to whoever reaches its cliffs the promise of shelter, and to the Dominion's sworn realms the isle's refusal to give back what the breeze has brought.\n\nThe Roots\nThe isle of Olen was a fishing isle under the storm belt, poor and dark, whose cliff lamps went out every winter when the storms came off the Tempest Reach. In 2A 412 a breeze blew out of the storm belt for a whole winter and kept the lamps lit on the cliffs of the isle while every other light on the coast went out, and the fishers saw sea-kestrels hanging still above the cliffs in that breeze, as if it held them up. They built a shrine where the kestrels hung, at Gelbus, and named the isle for the Holy Breeze, and the lamp-keepers of the shrine became the isle's rulers. The fishers believe the breeze came from beyond the storms as a sign that the isle is watched over, and the lamp-keepers do not say who watches. From the Holy Breeze come Olen's customs: the cliff lamps are kept lit through every storm; whoever reaches the cliffs out of the storm belt is sheltered and not asked where he came from; and the shrine is never moved from the place the breeze chose. The isle pays its toll to Nafeher like every coast of the peninsula and says nothing, but it has kept its shelter law even against the Dominion's sworn realms. In 4A 1712 three hundred thralls of Khorvrath stole boats and crossed Veleeda to Olen, and the lamp-keepers sheltered them and have refused every demand to give them back. The freehold of Luminor on the lamp-cliffs joined the shrine-realm in 4A 1590, and Olen holds the whole line of cliffs on the peninsula's south coast; its lamps are the first lights a ship sees coming out of the storm belt."
 zin_realm_lore_OLO:0 "The Sign\nA crown beaten from the gold rim of a cooking-pot, its two handles standing as side-points, on dark green.\n\nThe first village-king of Tovodor was crowned with the rim of his own pot, struck off when it was full of gold freely given and beaten round into a circlet, and every crowning since has made a new one the same way. The kings' old rims hang in the king's holt in order, the eldest at the top, and the gnomes cut the pot-rim crown into the doors of their holts where only another gnome knows to look.\n\nA king is as lucky as what he was given. It promises fortune to anyone who brings gold freely and ruin to anyone who takes it; to the masons of Parim who knock before they cut, it is the sign that they have knocked on the right stone.\n\nThe Roots\nThe gnomes of the Deodolor Hills say their first holt was dug under an old tree north of the Stone Forest before the War of Men reached the hills, and that the war taught them the only law they keep. In those years a beaten king of the Vale hid his treasury in the hills, and the gnomes found it and took it; the warlord who came after it took it from them by force, and every man who carried a coin of it away died badly within the year, the warlord first. The gnomes concluded that gold has a memory: given freely it brings fortune back with it, taken it brings ruin. They have kept the account since, and Naisa of the twelve, whom they honour as the keeper of fortune's ledger, is the only god they ask into a holt. The first village-king was the gnome whose pot was fullest of gold freely given, and he was crowned with the rim of his own pot, struck off and beaten round into a circlet, so that his crown was the measure of his luck; every village-king since has been crowned the same way whenever a pot is full. From the account come the holts' customs: a pot of gold left freely on a quarry ledge buys a mason's good fortune; a stolen coin is never kept; a holt that grows too rich gives its gold away before the luck turns; and the gnomes' great fear is not being found but being robbed, which is why they hide so well within a day's walk of Parim."
 zin_realm_lore_OMR:0 "The Sign\nThe Refusal Skull: a white reindeer skull with full antlers, facing outward, on a black field, with a white hem of notches like a tally.\n\nThe skull is the clan's old sign of refusal, first sent bound to a sledge to the stewards of the old king of the Sunfields and sent again to Melkgard's warlord in 4A 1150 when he demanded the clan's oath. A skull with its antlers hangs over the gate of Vaesdeon, and the clan painted it on the shields of the men who held the hill-fort through the siege of 4A 1412; after that siege the white skull on black became the clan's banner, and the notched hem copies the antler-tally of its debts.\n\nWe have eaten our own and owe nothing: no oath, no hostage and every debt counted; to a crown that asks for an oath it is the answer before the question is asked.\n\nThe Roots\nThe Omar clan carries the oldest refusal in the north. Its songs say that in the last winters of the Sunfields, when the old king's stewards rode the moors demanding the clans' herds for the hall, the Omar forebears slaughtered one reindeer bull, ate it at their own fire and sent the stewards back with its skull and antlers bound to a sledge, which meant, then as now, that the clan had eaten its own and owed nothing. The clan wandered the moors for ages afterwards with that refusal as its only law, owing no oath, giving no hostage and paying debts only in kind, until Kerdok drove its herds onto the border moor between the Ormolak country and the valley of Mp'E ahead of the hard winter of 2A 1520 and built Vaesdeon on the moor's one rise. Kerdok's line keeps the clan's two laws: a chief must have spent a winter alone on the moor, as the forebears did when the king's hall fell, and every debt is counted on the antler-tally that hangs in the hill-fort, a notch cut for each gift taken and a notch filled for each repaid. The skull went to Melkgard's warlord in 4A 1150 for the same reason it went to the old king's stewards, and in 4A 1748 the tally shows a debt to Coldor for the Hill-Fort Winter and one to Melkgard for the White Year, which the chief counts with great care and pays to neither."
 zin_realm_lore_ORA:0 "The Sign\nA curved signal horn with its mouth upward and a cord at its waist, in horn white on night blue.\n\nThe horn is the great horn of the northern height, which the families say was blown in the flood of the Breaking to call the boats home. It is kept in the lord's house at Nodoqood and carried up to the height at the opening of every fishing season. The families sewed it on their boat-flags long before there was a lord, and the Lords of the Boats took it for their own when the first of them built the stone harbour in 4A 1150.\n\nSomething new on the sea: to the boats a promise that a horn will always call them home, and to the courts the warning they have ignored once already.\n\nThe Roots\nThe fishing families of Orato and Fladev are the people of the heights. Their oldest tale is of the Breaking: when the sea came in from the north and the south and the neck broke, the flood ran along the north coast, and the families of the low shore fled onto the heights of the two isles and watched the sea take everything below. The watchers on the heights blew horns to call the boats in through the flood, and every boat that heard a horn came home; the families swore on the heights that a horn would always be kept on every headland of the isles and blown whenever the sea brought something new. That oath is the watch of Orato. Every night a watcher of each fishing family sits on a headland with a horn and counts the lights on the Kusmeel; the black isles to the north are never fished; and a horn blown on Orato brings every boat of the isle home without a question. The Lords of the Boats are the keepers of the headland horns as much as of the stone harbour of Nodoqood, and an heir is accepted only after the boats have heard him blow the great horn on the northern height. In 4A 1744 the watchers blew the horns for ships without lights or oars moving among the black isles, and every boat of Orato came home. The courts of Duum-Saah and Furvior laughed, and the families say this is the first time in their memory that a horn of Orato was blown and nobody beyond the isles came."
 zin_realm_lore_ORH:0 "The Sign\nA white steering-oar standing upright, blade down, on a field of sea-blue over black.\n\nThe oar is the steering-oar the Water clan's eldest woman held through the Night of the Sea, and every queen since has been chosen by taking her house's oar in the tide-chamber at the turn of the tide and holding it until the water stands still. When the five eldest women swore the Tide-Oath at Borrak in 1A 133, they set five oars upright in the harbour mud with the queen's in the middle, and the isle's ships have flown the white oar since.\n\nWe steered through the night the land drowned. It promises that the queen keeps the isle's course and that any fleet crossing from the West must pass the oar; to the Veiled and the Redbark it says that the Isle Houses still keep the last law of the drowned country, and that the tide-mothers remember whose the sea once was.\n\nThe Roots\nThe Isle Houses are what is left of the Water clan of the Low Country. When the plain still lay where the Crown Sea is now, Aenor Isle and the Tinta Hills were its eastern heights, and the Water clan's cord-mothers kept the harbours and sluices of the plain's eastern edge. On the Night of the Sea the eldest woman of the clan steered the last boat out of the drowning streets, standing at the steering-oar through the whole night until the tide turned at dawn, and brought it to the heights with the clan's mothers aboard; the five daughters' lines of that boat became the houses of Orohaf, Rish, Tinta, Holod and Faber. They lost the Orran tongue in the centuries after and kept everything else of the Low Country's last law: the eldest women rule; the dead are given to the tide that took the land; and the queen of the isle is chosen in the tide-chamber at the turn of the tide, the hour the steerswoman's boat touched the heights, when the queen-to-be takes the steering-oar of her house and holds it until the water stands still. Every isle child learns to dive before it learns its letters, and the old divers of Borrak say that at the lowest spring tides a mound breaks the water west of the isle, and that the houses have always known what lies under it and have never dived for it. Whether that is true, the tide-mothers will not say."
 zin_realm_lore_ORW:0 "The Sign\nThe Falling Fire: a black iron star-stone falling slantwise with a long red flame-tail behind it, on a pale grey field, with a red hem of wavy bog-water.\n\nThe Falling Fire is the burning stone that the clans say came down over the far north-west in the Long Dark long before Aen and left its iron in the Orewell bog. The miners scratched its shape over every shaft-head as the mark of the sky's iron, and when Ezhdok Siulak signed the factor-house charter at the dwarves' gate in 4A 1302 the dwarves stamped the same mark on every ingot of Orewell ore they bought; the clan sewed it in black and red on grey cloth for the lordship's banner that year.\n\nIron given by the sky and dug with thanks, sold only to those who pay: it promises the truest iron of the north and warns that Orewele's iron goes to no war unpaid.\n\nThe Roots\nThe Orewell lowland has iron because, in the clans' telling, the sky gave it. In a Long Dark that the songs call the Night of the Falling Fire, a burning stone came down over the far north-west, lit the snow from the giants' heights to the coast and struck the lowland, where the bog round the Orewell Water has run red ever since. The clan's founders were reindeer herders who followed the light to its fall and found black iron in the bog that took an edge no bronze could match, and they settled to dig it when every other clan kept moving. The giants of the heights call the lowland the place where the sky broke, and the Frost-Kings take their toll there in iron and never in meat. From the Falling Fire come Orewele's customs: the bog-iron is the sky's and is dug only with thanks spoken at the shaft-head, the first bloom of every smelting is laid back in the bog, and no Orewele smith forges a weapon for a crown that has not first paid for the ore. The dwarves of Brundahrim, who know iron better than any man, chartered their factor-house at Guerlon in 4A 1302 because Orewell ore smelts truer than anything else they could buy in the north, and the dwarves' refusal to say how their pumps worked in 4A 1677 is matched in 4A 1748 by the clan's refusal to say where the deepest red water rises."
 zin_realm_lore_OST:0 "The Sign\nA closed cedar lantern with a peaked roof and four pale panes, hung from a ring, in lantern gold on deep pine green.\n\nThe lantern is the one the lake-readers floated at Ohitus in 3A 515, which the Ostorides keep in the shrine; it is closed on every side, because an open flame on the lake breaks the lake-readers' law. The counts of Ernois, Grova and Nethnu carry it at the Lantern Float every year, and the kingdom's companies have marched under it since the Lakeshore Quarrel of 4A 1477, when the lake-readers forbade the king to fight under any sign that could be mistaken for a single lord's.\n\nThe king keeps the shrine's light and not his own: to the clans a promise that the crown belongs to the lakes, and to every enemy the warning that the highlands fight as one once the lantern moves.\n\nThe Roots\nThe highland clans of the north-east lakes call themselves the cedar-folk, and their songs say that long before Aen their forefathers cut the cedar that the Bridge Kingdom carried west over the neck, so that the halls of the far western march were roofed with highland wood. When the bridge broke the cedar had nowhere to go, and the clans turned their axes on each other: for ages the lords of Ernois, Grova and Nethnu fought for the lakes, the cedar and the hot springs between them. What held the highlands together was the shrine on the water at Ohitus, where the lake-readers read the steam that rises from the lakes on cold mornings and say what the lakes want. The lake-readers keep three laws that every clan obeys: no blood is shed within sight of the shrine; no cedar is cut that the lake-readers have not marked; and whoever brings a light onto the water in the dark is under the lake's protection until morning. In 3A 515 the lake-readers shamed the warring lords by floating a closed lantern on the water at night and declaring that the lord on whose shore it came to rest would be king, so that the shrine would always be in a king's keeping. It drifted to Ohitus. The counts of the three old lordships still carry the king's lantern at the Lantern Float in memory of that night, and Ostoroth took the Reckoning of the Twelve from the western charts in 3A 990 so that its cedar merchants could keep one calendar with the halls their forefathers once roofed."
 zin_realm_lore_PAZ:0 "The Sign\nA bronze bell whose clapper is a sword-blade, gold on deep blue.\n\nThe bell is the guild-hall bell of Horlomon, cast in 1A 410 from the swords the Peace of the One Crown took from the lords, with one blade left whole to strike it. The paper-makers printed it inside every book they hid under the Order, so that the books could be found again, and the guild council flies it over the hall whenever the bell is rung.\n\nThe sword serves the bell. It promises that Horlomon makes for the peace and rings against any wrong; to the Golden Court it recalls the Bell Riot, and to an enemy it says that the town will ring before it yields.\n\nThe Roots\nPazoma began as a mercy. In the last years of the War of Men the craftsmen of the beaten kings, smiths, glass-blowers, dyers and the rest, were gathered at the deep bay of Horlomon by victors who had no use for craftsmen bound to dead crowns, and the guilds' own chronicle says they were spared on one condition: that they make things for the peace and none for war. When Aen's Peace of the One Crown forbade the lords to make war on one another, the crown took up the lords' surplus swords, and in 1A 410 the seven guilds of the bay bought the whole hoard by weight and melted it into the guild-hall bell, the largest ever cast in the Middle Lands, with one blade kept whole for its clapper. From the bell come Horlomon's laws and pride: no guild of the bay forges a weapon, though its glass, paper and cloth go to every army of the Concord; the bell rings for every guild election, every charter and every wrong the town will not bear, as it rang for three days in the Bell Riot of 4A 1610; the town has never had a lord, because its craftsmen were the beaten kings' and swore never to serve one again; and the paper-makers' conviction, proved under the Order when they hid the kingdom's books in the guild cellars, that a city of craft outlives a city of soldiers."
 zin_realm_lore_PLL:0 "The Sign\nThree keys hanging from one ring with their bits downward, in iron grey and market gold on deep harbour red.\n\nThe three keys are the keys of the league's strong-room that the last key-holder carried home from Halgohavnai in the Grey Breath. They hang on one ring in the strong-room at Havnai, and the guild-masters have flown them over the market since the market law was written in 4A 140; a Pollos merchant's seal still shows three keys, and a bargain sealed with it is good in every harbour of the Charter.\n\nNo purse opened by one hand: to the Charter a promise that its treasury is safe, and to anyone who would rob or debase the market the reminder of the quay where the coiners hang.\n\nThe Roots\nHavnai has always been where island goods change hands, and the guild-masters of Pollos trace their right to keep the islands' money to the plague that ended the league. When the chart-islanders were sworn into Margorodai at Halgohavnai in about 1A 820, the league's dues, one due from every ship of every flag, were counted into a strong-room at the Holy Harbour that had three locks, and its three keys were held by three captains so that no one of them could open it alone; from 1A 1000 a second strong-room at Pollos held the dues of the western arc. When the Grey Breath came into Halgohavnai, the three key-holders were among the first to fall ill. The key-holder from Pollos was the last of them alive; he carried all three keys home on a ship of the dying, and Pollos has claimed the league's strong-room by survival ever since. In 4A 140 the guild-masters of Havnai wrote the market law that every buyer and seller in the harbour swears to and opened the strong-room where the chart-houses keep their coin, and its three locks are still held by three guild-masters who must turn their keys together. From the three keys come Pollos's customs: no purse of the market is opened by one hand; every coin has been weighed at the strong-room door since 4A 1288, when the guild-masters hanged a ring of corsair coiners on the quay; and the Polai family, who keep the strong-room, are first among the guild-masters because they keep the keys and not because they own them."
 zin_realm_lore_PLO:0 "The Sign\nA black glass ploughshare, point downward, edged in ember red, on ash grey.\n\nThe glass share is the one the valley folk chipped from the vents when the Kalioth kings took back their iron every autumn; the oldest of them hangs in the princes' hall at Vobibiz, too brittle to plough with, beside the barge-hook of the first valley lord. The valley lords bore it when they chose their first prince in 2A 377 to treat with Erco for the water, and the princes fly it at the head of the Gold Road, where every caravan takes on its first loads of ore and grain.\n\nThe valley feeds itself and owes no lord its iron: to the farmers a promise that the prince will never rent their ploughs, and to creditors and kings the warning that glass cuts the hand that grips it too hard.\n\nThe Roots\nLong before Aen the southern valley under the Plutondo Vents was a field of grey ash where nothing was planted, and the valley people say their forefathers were the first who dared to plough it. They tell that the vents are the breath of whatever sleeps beneath the East, the same breath the salt-boilers feel under the Hot Lake, and that the ash it breathes out is a gift that must not be refused; the temples deny that anything sleeps there, and the valley has never cared which telling is true as long as the grain grows. In the First Age the valley became the granary of the Kalioth Crown. The mountain kings took its harvests in their barges for the iron height and rented the valley their iron ploughshares, which they took back every autumn so that the valley could never forge itself weapons. The valley people learned to chip ploughshares from the black glass of the vents, which no king could count or take back. When the Kalioth host died at Dardan, the valley lords sent their grain to the mine-lords besieging the last king and not to the king, and the iron height starved: the barges that had fed the Crown fed its fall. From that comes the princedom's character, proud of its ash and obliged to no lord for its iron, and at its worst in debt, because the princes have always paid in grain while others kept the ledgers. The Vent Year of 4A 1590 put the valley in Stabilo's books, and the princes resent the caravan houses that fed them more than the vents that starved them."
 zin_realm_lore_PLT:0 "The Sign\nThe Burned Oar: a white steering oar standing upright with its blade red, on a deep blue field, with a white hem of river-ice blocks.\n\nThe first pilot's steering oar was kept by the guild as its master's staff long before 3A 702, but on the night of the March of Bones Harbour-Master Zenka Grindair used it to push the burning ship of the Necromancer's buyers away from the quay, and its blade came back charred red. The guild has carried the oar with its red blade at the head of every harbour procession since, sewn it on the flag that flies over the book-house, and had every Harbour-Master swear his office with his hand on the burned wood.\n\nA free harbour piloted by its own and closed to the trade in the dead; it promises every honest captain a guild pilot and the harbour's protection, and warns any power of the dead that the port remembers what it burned.\n\nThe Roots\nFandhavn's guild counts its history from two ships. The older pilots say that the Fandan mouth was where the last sea-craft of the Sunfields put out west for the isles, and that the river ice has always been read by those who stayed behind; the first ship the guild remembers by name, though, is the Aenoran post's ship that came to the Fandan mouth around 1A 310, whose pilot was a man of the Coldic coast hired at Alorio because no southerner could read the river ice. The post's pilots were his apprentices, and the guild that chose the first Harbour-Master in 1A 905 was theirs. The second ship is the one they burned. In 3A 702 servants of the Necromancer's Order moored at Fandhavn to load the dead they had bought from a starving coast clan, and Harbour-Master Zenka Grindair, with the Fandan chiefs' riders on the quay, set the ship alight and pushed it off with the first pilot's steering oar, whose blade was charred red in the burning. From that night come the harbour's laws: no ship may load the dead at Fandhavn, a ship that refuses a guild pilot is not protected, the harbour book records every ship and every refusal, and the free port sells to every flag but bows to none. The charred oar hangs over the guild's book still, and the free port of 4A 1748 is proud above all of being the harbour that the Necromancer's ship never left."
 zin_realm_lore_PON:0 "The Sign\nA balance-scale with its beam snapped and one pan hanging, in ash black on ember orange.\n\nThe broken scale is the caravan of 4A 744: of all its people, camels and goods the mountain left only the scales, set out in a row on the scorched stone, and the first wardens brought the largest of them down with its beam snapped. It hangs in the wardens' hall of Nerhuus, and every tithe is weighed on a sound scale beside it before it is carried up the mountain. The wardens took the broken scale for the city's sign in 4A 745, the year they first paid, so that no warden would forget what an unpaid road weighs.\n\nAn honest tithe for a quiet mountain: to the city's guilds a promise that the wardens will always pay, and to every caravan the warning that the road beyond Nerhuus belongs to something that keeps no ledger.\n\nThe Roots\nNerhuus was built on an old road by people who did not know whose road it was. The mountain road below Mount Ergo was the southern road of the Kalioth Crown, which ran from the iron height through the Smoking Teeth to the Crown's south-eastern provinces, and the Alerhic chronicles say that the Kalioth kings, allies of Volgan, paid the devils of the mountain to let their convoys pass and to fall on those who did not pay. Devils are corrupted Lesser Spirits who once served an Old God and escaped to Aoaz, and many serve Volgan; when the Kalioth fell the payments stopped, the road was abandoned, and for three ages nobody used it. The caravan factors who built a waystation by the mountain's springs in 4A 713 knew the mountain smoked and did not know what lived on it. In 4A 744 a whole caravan vanished on the mountain road and the searchers found only its scales, laid out in a row on a scorched stone; the next year the wardens carried a tithe of gold and goods up to the stone, and no caravan was taken. Without knowing it, Nerhuus had taken up the Kalioth payment where the Kalioth left it. The life of the city follows from the stone: the tithe-wardens are its government; it trades with everyone because it cannot afford an enemy; and since the Unpaid Year of 4A 1502, when the council kept the tithe back and the upper town burned, nobody has again proposed that the tithe is a superstition. Whether the tithe does more than keep a custom the devils remember, nobody in Nerhuus can say."
 zin_realm_lore_POT:0 "The Sign\nThe Keel-Hall: a black ship's hull turned keel-up, with a row of red oar-ports along its side, on a white field, with a grey hem of sea-ice.\n\nUlvar Azlak's men dragged the last whole hulls of the broken fleet up the beach at Fellodor in 3A 410 and turned them keel-up as halls so that nobody could sail back, and the first of them still roofs the lord's hall. The survivors painted it in pitch on the sealskin they raised over the beach to tell Melkgard's watchers that the raiders had come to stay, and the sealers have flown the black keel on white ever since; the red oar-ports are the oars they burned that first night for warmth, the only wood of the fleet they ever burned.\n\nA people who came to burn and stayed to build: a promise that the north coast will never raid again, and a reminder that it remembers how.\n\nThe Roots\nThe sealers of Fellodor are proud of being descended from the enemy. Their forebears were the sea-raiders of the Frozen Ocean coast who burned the Ormolak valley for ages, a people whose songs begin at sea and say nothing of where the first ships were launched, only that something behind them in the far north was worse than any wind; a belief of Fandanar's fire-keepers holds that they fled the country of the dead, and the sealers neither confirm nor deny it. When the last great fleet broke on the forts of the Gulf of Minnolomak in 3A 410, its captain Ulvar Azlak took the survivors along the bare coast below the Olsuaon Massif, dragged the last whole hulls up the beach and turned them keel-up to make halls, so that no man of the fleet could put to sea and go back to whatever they had fled. From the upturned hulls come the customs of the north coast: a lord's hall is always roofed with a ship's keel, the sealers bury a worn-out hull and never burn one, a new captain spends his first night under the keel of the first hall, and raiding is remembered with pride and forbidden by law. In 4A 1748 Fellodor sells hides, ivory and seal-fat along the Frozen Sea, its captains wear the bear-mantles of the Bear Winter, and its lords are careful not to remind Melkgard whose sons they are."
 zin_realm_lore_PRT:0 "The Sign\nThe Black-Faced Ram: a white ram with a black face and black curled horns, standing, on a deep green field, with a red hem of woven wool.\n\nThe ram is the leader of the flock that came down out of the valley of Mp'E in the thaw, from whose line every black-faced ram of the vale is bred. The shepherds stitched him on the cloth in which the ram's due is carried to the Silent Road long before the vale had a lord, and Hildra Hozening hung that cloth over the wool-market at Minsentia when she built the hall in 4A 760; the lords have flown it since and have refused every offer to quarter it with the arms of either crown, even after the Vale Marriage of 4A 1590.\n\nFaith kept with whatever feeds the vale, a flock that comes home and a debt to the high ground that is paid and never questioned; to the crowns it says that the vale will feed a friend and has not yet chosen one.\n\nThe Roots\nThe sheep vale east of the Ormolak country is the only valley of the north where sheep do better than reindeer, and its people say they know why. In their tale, long before the vale had a hall, a shepherd clan of the Sunfields lost its flock in a whiteout on the high ground and gave it up for dead, and in the thaw the flock came down out of the valley of Mp'E behind a black-faced ram, fat and whole, with no one to say where it had wintered. The clan settled where the ram stopped and has bred from his line ever since, and the vale has paid what it calls the ram's due: each Long Light the shepherds carry a loaf and a fleece to the start of the Silent Road beyond the town of Yeldenne and leave them for the hall, and nobody walks on. The vale's customs come from that debt: a shepherd who loses a beast in the snow does not curse the high ground, nobody of the vale goes up the Silent Road, the black-faced rams are never sold out of the vale, and the town of Yeldenne below the silent castle, which lies in the vale's land, has always been treated as kin and never taxed as a subject. The Hozening lords, who were given the wool-market in 4A 760, keep the ram's due along with the market, and the vale's careful friendship with both crowns in 4A 1748 is the same habit seen from below: the vale keeps faith with whatever feeds it and asks no questions of the high ground."
 zin_realm_lore_PUV:0 "The Sign\nThe Gate of Nafeher: a plain upright gateway in bone white standing within a plain ring of bone white, on grave black.\n\nThe gate is Volgan's own sign, as old as his dominion on the plateau, and it appears on no other banner of Aoaz. The ring round it is the ring of names cut round the gateway, in which every servant of the Dominion is written; on the banners it is shown plain, because the names are spoken in the Rite-Tongue and never sewn. The grave hosts carried the gate at the taking of Miherta in 1A 1150 and at Dardan, Elzon's orders carried it through the Second and Third Ages in Volgan's name, and the sworn realms of the Southern Dominion fly their own banners beneath it.\n\nWhoever passes through the gate belongs to it: to the orders and the sworn realms the promise that service is remembered in the ring, and to every living realm the threat that the dead will march under it again.\n\nThe Roots\nPuvulan is the realm of a power, and its roots are the power's own. Long before Aen, Volgan was the servant of a New God, overcame that god and founded his own dominion; which god, and when, nobody in Aoaz knows. The necromantic orders that serve him on the grey plateau teach that Nafeher's gate was the first thing raised on the dust fields, before the orders, before the grave-fields and before any living thing that now serves there; their rolls begin with his name and admit no earlier one, and how the Great Spirit came to hold the plateau is not written in them. The orders' customs grow from the gate. Whoever passes through it to serve the Dominion has his name cut in the ring of names round the gateway, and the dead of the grave hosts are raised under the names of those who served before them; offices are given in the Rite-Tongue; the Musters, not months, measure the year; and a servant who betrays the Dominion has his name cut out of the ring, which the orders hold to be worse than death. The First Age made the gate known beyond the plateau. The Kalioth kings paid it the Black Tribute and marched with Volgan to Dardan, his fleets crossed the Sound to take Mirolon in 1A 1150, and demons, devils, orcs, goblins and dragons marched under it. After Dardan Volgan was cast into the Void and Elzon governed in his name; the Necromancer brought his presence back in 2A 1544 and served him until his own death in 3A 1260. Since then the Dominion has been rebuilt behind the Veil of Storms, the demon realms have sworn to the gate, and the ring of names has begun to fill again."
 zin_realm_lore_RAE:0 "The Sign\nA great banks-fish of the cod kind, with its fins, chin-barbel and square tail drawn plain, swimming, cut through its middle by a thin white line, in silver on deep bank green.\n\nThe cut fish is the first fish of a disputed shoal, cut in two before both crews under the oldest law of the banks, and the league's banks-court cut one at the opening of every case from 1A 950. The broker-captains of Ese kept the cut fish as their banner when they chose their first Captain-Speaker in 3A 610, and the court-ship still flies it when it anchors over a disputed bank.\n\nAn even share, settled on the water: to every fishing crew the promise of a fair judgment, and to Nondondor the reminder that the banks have a court older than its crown.\n\nThe Roots\nRaerby is the court of the banks. The proto-Boreal sailors who settled the eastern arc long before Aen lived by the great fishing banks of the inner sea, and their first law was the law of the shared catch: when two boats claimed the same shoal, the first great banks-fish taken from it was cut in two before both crews and each took a half, and both fished the shoal for the season. When Margorodai was sworn, the league set its court for the fishing banks at Raerby in 1A 950, and the banks-court judged every quarrel over the shoals of the arcs on the deck of a court-ship anchored over the disputed bank, beginning each case by cutting a fish. After the Grey Breath the court had no league behind it, but the captains of Ese went on settling quarrels on the banks for a fee, and in the centuries when the islands lived by carrying the West's and the Cold Lands' goods they grew rich enough to lend ships to others. In 3A 610 they chose a Captain-Speaker to keep the freight-book and the peace of the banks. From the banks-court come Raerby's customs: a quarrel is settled where it arose, on the water; the freight-book records every hull lent and every share owed; and a broker-captain who keeps the book dishonestly loses the right to judge. The gale season of 2A 904, which sank a third of Raerby's and Adel's fleets, began the reading of the Drowned Names, and the Southern Banks quarrel with Nondondor, open since 4A 1398, is the one case the court has never closed."
 zin_realm_lore_REN:0 "The Sign\nA black cormorant perched on a grey rock with a silver fish in its beak, on white.\n\nThe cormorant was Torik's own byname, from the cape-clans' custom of taking one fish from every boat that passed under the rocks, and he flew a painted cormorant over the forts of Farnardur when he refused the strait kings their payment in 1A 1240. The princes have kept it since, and every ship that pays the cape's toll is given a wooden token cut with the cormorant, so that it will not be asked again before the next tide.\n\nOne fish from every boat, and no master. It promises passing ships a light toll and a safe passage and tells both Sonargur and Parim that the cape is the prince's; a cormorant with an empty beak on the forts would mean the strait was shut.\n\nThe Roots\nThe strait cape at the Narrow Strait's narrowest point has always belonged to whoever could sit on it, and its people have always taken a share of whatever passed. Before the strait kings built forts there, fisher-clans lived on the cape's rocks and took toll of every boat that crossed in the old way of the cape: a boat that passed under the rocks gave up one fish, and the clans called themselves cormorants, after the birds that sit on the same rocks between the two seas. When the cape became a watch-post of the strait kings its keepers kept the custom, and in 1A 1240 its keeper, Torik of the Farnur, whom the strait called the Cormorant, refused to pay the Sonarvik for the forts he had built and declared himself prince of the cape, living on the Aenoran ships that passed under his walls. From the cormorant come the principality's habits: a prince who serves two masters and is owned by neither; a toll on everything that passes, light enough to be paid rather than fought; a court that faces both seas, marrying into Parim and trading with Sonargur; and a stubbornness proved under the Order, when the princes held Farnardur as the North's southern gate for twelve centuries and twice beat off its hosts at the forts. The strait says a cormorant always keeps one eye on each sea, and the princes of R'en have never taken it as an insult."
 zin_realm_lore_RHA:0 "The Sign\nA seated mother-figure of fired clay, wide-hipped and armless, in kiln red on ash white.\n\nThe figure is the eldest of the clay mothers kept in the kiln-shrine of Pordoce, which the villages say was shaped by the first mothers in the caves of the vent-field. Every spring each village refires its own figures, and the kiln-mothers carry the eldest through the villages before the refiring. When the towns rose in 4A 1719, Moiria of the Kilns walked at the head of the villagers with the eldest figure in her arms and the king's guards would not strike at it; the tribunes took it for the banner of the commonwealth the next spring, and the village militias sew it on ash-white cloth.\n\nThe land is the mothers' and is fed by them, not owned by kings: to the villages a promise that no clay pit will be seized again, and to every claimant crown the warning that the Red Lands rose once for their mothers' bones.\n\nThe Roots\nThe Red Lands were a burned land long before Aen. The temple chronicles of Alerhia record that the vents of the Rhachia Fires covered the country in red ash in the years after the Breaking and that nothing grew there for a lifetime. The clay-folk's own telling is that a band of mothers lived through the ash in the caves under the vent-field with their children and no men, and that when they came out they found the ash turned to red clay in the rain. They shaped the clay into figures of their dead husbands and sons and fired them in the cave mouths, so that the dead would have bodies to stand in, and they founded the first kilns of the Red Lands. From the first mothers come the Red Hearth, which holds that the red clay is the bone of the mothers, and every custom of the commonwealth: the clay figures of the first mothers are refired every spring; a village is governed by its kiln-mothers and its elected head; and land belongs to the village that fires the clay dug from it. A king was always a stranger in the Red Lands. The Kalioth kings took the kilns' clay for their siege-moulds and were hated for it; the cadet line of Alerhia that ruled the kilns from 4A 1288 never understood that it taxed the mothers' bones; and when King Mirodeus doubled the kiln-tax and seized the clay pits of villages that could not pay, the kiln-mothers opened the gates of Pordoce to the villagers. The tribunes elected since 4A 1719 swear their office in front of the first mothers' figures."
 zin_realm_lore_SAO:0 "The Sign\nA closed book weighted with a black iron ingot, on fen green.\n\nThe league was sworn on the guild book in 1A 930 with a dwarf ingot laid on its cover as the oath's weight, by the boatmen's old custom of swearing a load on its weight. The ingot still sits on the book in Lochon's guild-hall, and when Gromkerm reopened its trade with the league in 4A 1530 its factors asked to see it there before they would sign; the league has flown the weighted book since its founding.\n\nA bargain is as heavy as its iron. It promises every buyer of the Kulolo's trade a contract that holds and reminds the league that the iron on its book comes from a hold it once robbed; a book with no ingot on it would mean the dwarves had stopped sending iron down the river.\n\nThe Roots\nSaopon was made by iron that came down a river. Before the settlers, the boatmen of the Kulolo poled the dwarves' iron from Gromkerm's gate down to the Ilurdor lagoon, and their landing at Lochon was where the river's iron met the sea's traders; the boatmen's law, older than any guild, was that a load is sworn on its weight, so a bargain was struck with an iron bar laid on the scales between the parties. When the guilds of Lochon and the fen towns swore their league in 1A 930 they swore it on the guild book with a dwarf ingot laid on its cover as the weight of the oath, and contracts in Saopon are still sworn with iron on the book. That gives the league its character and its shame. Its character is law by contract and by weight, a First Guildsman who is only the keeper of the book, and a city whose whole life is what the dwarves send down the river. Its shame is the year 2A 1712, when its guilds hired companies who looted Gromkerm's gate and the league disowned them too late; the dwarves shut their doors for three generations, the iron stopped, and Lochon nearly died. The league has sworn every contract since with the ingot on the book, as the boatmen did, in sight of the dwarves' factors, and its guild-masters know that the names of their forebears are cut into Gromkerm's wall of grudges. The Canako Cut and the fen boundary are newer quarrels; the iron is the old one."
 zin_realm_lore_SDE:0 "The Sign\nAn upright slit-drum hollowed from a log, its long slit facing outward, in drum-wood brown on storm grey.\n\nThe slit-drum is the drum of Yumbo that beat the first elder's summons in 2A 300 and the first warning of the drum road in 3A 700. It stands under its own roof at Yumbo and is carried to the harbour of Ponwan when the elder calls the islets together, and the islets' banner has shown it since the drummers made the first elder.\n\nThe first warning: to the Great Isle a promise that the islets will always beat the storm's coming, and to the elder the reminder that the drums choose whom they summon for.\n\nThe Roots\nThe islets at the end of the western arc are the first land of the south that the storms reach and the last that help reaches. Long before Aen, the drummers of Yumbo say, the families of the islets learned to hollow a log into a slit-drum whose voice carries further over water than a man can shout, and used it to call each other across the channels when the storms closed the sea. In the Year of the Long Wind, 2A 300, a storm cut the islets off from the Great Isle for a whole season, and the families chose one elder to speak for all of them; the drummers of Yumbo beat his first summons from islet to islet, and every elder of Sidea since has held office only as long as the drummers will beat his summons. In 3A 700 the drummers learned to beat messages faster than a canoe can sail, and the drum road was born: a storm seen first from the western islets is beaten from drum to drum to the Great Isle before it arrives. From the drums come Sidea's customs: the drummers' consent is the elder's authority; every islet keeps a drum that is never beaten except for the islands; and since the storm year of 4A 1550, when the islets' canoes sank in one night and the three realms of the Great Isle rebuilt them under the guest-right, Sidea has sent its first catch of every year to the drowned shrine. It is the first land of the islands that a ship blown south from the West sees."
 zin_realm_lore_SEI:0 "The Sign\nA grey seal rising from the water with its head raised, in seal grey on reef teal.\n\nThe seal is the reef-spirits' messenger of the first wreck, which bore the first pilots ashore. A carved seal stands on every reef-shrine the moot raised in 2A 1600, and the households sewed it on the moot's banner at Vesko; the moot-reader reads the year's decisions under the shrine with the banner behind him.\n\nSpared by the reef: to every household a promise that the fathers' banks stay theirs, and to the sea-king a refusal sent home every year.\n\nThe Roots\nThe households of the four Seite isles and Mondeluz have fished the same banks for as long as their songs go back, and their songs go back to the reefs. Long before Aen the first pilots who came to the Seite isles in the first crossings were wrecked on the reefs, and the households say that the grey seals of the reefs bore the survivors ashore on their backs: the reef-spirits came as seals, and the seals are their messengers. No household of Seite has killed a grey seal since, and when the moot raised shrines on the reefs where the first pilots were spared, in 2A 1600, it set a carved seal on each; island pilots of every arc still leave a token there as they pass. The banks the first pilots fished became the fathers' banks, and in 2A 1340 every household met on the moot isle of Vesko and swore that the banks their fathers fished belong to their children. No lord has ruled Seite since: the moot of every household chooses a moot-reader each year to keep its decisions, and the moot-reader stands under the reef-shrine when he reads them. From the seals and the fathers' banks come Seite's customs: every household speaks at the moot; a bank fished by the fathers is never sold, leased or shared without the moot; and since 4A 1398, when Nondondor's sea-king claimed the Southern Banks, the moot has sent his envoys home every year, knowing that its fishers alone cannot hold the banks against his fleet."
 zin_realm_lore_SEL:0 "The Sign\nThree arrows bound together point-down with a green withy, white on forest green.\n\nThe arrows are the three the broken bands laid at the root of the Moot Tree when they swore the Quiet Law; the moot-books say they lay there until the root grew over them, and the tree-wardens cut a withy from the oak to bind three new arrows at every First Warden's choosing. When Edran was hidden in the Weald in 1A 1614 his ranger guards carried the bound arrows as their only standard, so the sign went to war beside the crown long before Selen held a charter.\n\nThe Weald draws no bow first. Bound and pointing down, the arrows promise shelter to anyone who keeps the Quiet Law; when the Host of Selen musters, custom cuts the withy and carries the arrows points up, and the Bloody Forest edge has seen that banner more than once.\n\nThe Roots\nBefore the War of Men ended, the Selen Weald was a wood where hunted men went to disappear. The moots' own telling begins with three bands of men broken in that war, the Vothrim, the Svenlor and the Ulgus, who fled into the great oak wood from three sides in one winter and found each other at the ford of the Selenar under the oak that is now the Moot Tree. The rangers say the wood had a lord, a Wild Spirit of the green whom they still call the Lord of the Weald, and that it let the three bands stay on terms: no arrow loosed in it without asking, no standing tree felled, and every stranger sheltered, because the wood itself had sheltered them. Each band laid one arrow point-down at the oak's root to swear it, and the Quiet Law of 1A 230 is that bargain made law at the first moot of the three bands as one. Everything Selen is grew from that winter: the rangers' craft of moving unseen; the tree-wardens who ask before the hunt and keep the bow unstrung through the Hallow Month; the habit of taking in the hunted, from the Vale's plague families to Edran himself and the survivors of the capital's fall; and a stubborn pride that the Weald answers to its moot before any crown, which the Roll Quarrel and the Golden King's taxes have sharpened. Whether the Lord of the Weald is a Lesser Spirit, something older or only the wood's own silence, the moots do not say, and they take the question as an insult."
 zin_realm_lore_SFT:0 "The Sign\nA black ship's hull, keel upward, rising out of a mud-brown base, on pale sea-green.\n\nThe keel-up hull is a sunken ship rising from the Safen mud, the sign the smugglers of the Order's centuries chalked on the doors of houses that had a hull in the river. When the Order fell in 3A 1260 the ship-houses raised every hidden hull on one tide and sailed them into Lotrenri under the chalked sign, and the Council of Ship-Houses has flown it over the harbour since.\n\nWe go under and come up again. It promises the harbour that no master can take what the river hides, and tells any lord who would rule Safeton that the ships will be under the mud before his men reach the quays.\n\nThe Roots\nSafeton's people are bargemen before they are anything else. The Safen is the Great Lake's only outflow, and long before Aen the barge-folk who poled the lake's grain down it to the sea were their own small people of boats, with a custom the ship-houses still keep: at the river mouth, where the lake's sweet water meets the salt, every barge pours one bucket of lake water into the sea at the spring sailing, so that the lake will know where its children have gone. The ship-houses that owned the warehouses at the mouth grew from barge-families, and the harbour has had no lord since the Grey Breath of 2A 410 killed the crown's governor and the ship-houses ran the town through the plague and would not give it back. Their whole craft is the craft of surviving masters. When Elzon's Order took the Vale, the ship-houses sank their best hulls in the Safen mud, raised them on moonless nights to smuggle for the Isle Houses and sank them again before dawn, and for nine centuries and more the Order taxed a harbour of rotten fishing boats. From that comes the harbour's character: no lord, because a lord can be made to give up his ships; council votes taken by hull, not by house; a contempt for anything that cannot float; and the knowledge, taught to every ship-house child, of where in the mud the hulls once lay."
 zin_realm_lore_SKR:0 "The Sign\nGrashdug's Axe: a broad felling axe bitten into a black tree-stump, iron-grey and black on charcoal-red, with a black hem.\n\nThe stump of the Old Black still stands at the forest's edge at Gollonlon with Grashdug's axe bitten into it, where he left it in 4A 1120 when the tree came down. Every forest-chief swears on the stump with his hand on the haft, and the axe is never drawn out, because the hold believes that the day it comes out the forest will take its revenge. The felling camps branded the axe in the stump on Skragdurg's timber long before anyone sewed it, and shipwrights on both sides of the straits know it as the mark of good timber.\n\nWe cut what others fear: the axe promises timber to every buyer and warns that Skragdurg has already done the one thing everyone said could not be done.\n\nThe Roots\nSkragdurg's chiefs say the forest-hold began with a tree nobody dared to cut. The Fonoor Forest has given timber to the straits since the Raiding Years of the Second Age, when the iron holds' raiders built their boats from it to cross the Northern Dark Strait; but at the forest's edge where Gollonlon now stands grew the Old Black, a tree so wide that its shade kept the sun off the felling camps all summer, and the camps held that the forest would take its revenge on whoever felled it. In 4A 1120 a chief called Grashdug cut it down with his own axe in a single season, and when no revenge came the camps followed him and built the forest-hold around the stump. The axe is still bitten into the stump at Gollonlon, and every chief must fell a great tree with his own hands before he may swear on it. From that felling comes the hold's character: the forest-hold cuts what others fear to, sells to anyone who pays and takes no side, because its people say the timber does not care which hull it becomes, and the charcoal-burners of Colost swore the same oath on the stump when they joined the hold in 4A 1350. It also comes with a fear the orcs do not say aloud, that the forest has not yet taken its revenge, which is why the hold plants a sapling for every great tree it fells and never cuts within sight of the giants' cairns. In 4A 1748 Skragdurg sells the timber for the Accord's ships and for Goldoroth's in the same season, and both sides suspect it of laughing at them."
 zin_realm_lore_SNT:0 "The Sign\nA black sail, full-bellied in the wind, without ship or mast, on blood red.\n\nThe black sail was the Sea-Roads' sign for a ship of the dead in the Grey Breath, flown so that healthy ships would keep away. Hanei of the Black Sail took one from a plague-ship and sailed it into Straton in 2A 130, and the captains of the outer arc have flown it since; a captain of Straton is made by raising the black sail on his own ship in the harbour, and it comes down when a better captain raises his.\n\nDeath comes under it: to the captains the promise of the Ransom Tide's law, and to every merchant who sees it the plain threat of a prize taken.\n\nThe Roots\nThe corsair captaincy of Santon was built in dead harbours. When the Grey Breath came into Halgohavnai and the Sea-Roads' own fleets carried it to every isle, ships that carried the sick flew black sails, the old sea-sign of the league for a ship of the dead, so that no healthy ship would come near. The outer western arc emptied; Santon, Dani and Kusu were left to their dead, and the captains who took the emptied harbours were men nobody would fight, because they came in under black sails. In 2A 130 the strongest of them, Hanei of the Black Sail, who had taken a plague-ship's black sail for his own and sailed it into the strait-place harbour of Straton, made the other captains swear the Ransom Tide law: a captive ransomed by the next tide-feast goes home under the god of the harbour, and one not ransomed belongs to the sea. The outer arc has been a corsair captaincy since, held by whichever captain is best until a better one comes. From the black sail come Santon's customs: a captain holds Straton by the sword; every captain swears to the Ransom Tide; and a Santon ship raises its black sail only when it means to take a prize, because the sail still means that whoever it comes for may not live. Corogon's fleet and Varnondor's sea watch burned Straton in 4A 1622 after Santon's corsairs took three Corogon grain ships, and the captains rebuilt it within ten years; since the ransom of the consul's son in 4A 1701, Corogon has sworn to burn it again."
 zin_realm_lore_SOY:0 "The Sign\nA bare curved white keel with its stem and stern posts rising at either end and no planks, on deep tide blue.\n\nThe bare keel is the Mother-Keel of Ileslia, the keel of the first white ship of the isles, from which every keel of the council is measured. The Archipelago Council took it for its banner in 3A 512, because the one thing every isle shared was the keel all their ships came from, and since 4A 1366 the white ships of Gala's court have carried a small Soyano keel stitched under their own colours as the builders' mark.\n\nEvery ship from one keel: to the shipwrights the promise that the council's ships will always be true, and to anyone who buys one the reminder that the isles that built it can build a fleet.\n\nThe Roots\nThe shipwrights of the northern isles keep a keel older than their council. The isle Sunhot say that long before Aen the first white ship of the isles was built at Ossi Luni by a shipwright who laid its keel along the noon shadow of a standing tree, and that when the ship was worn out its keel was drawn up and kept, because every keel since has been measured from it. The Mother-Keel lies in the council house at Ileslia, dark with age, and every white ship's keel is laid beside it and marked to its proportions before the first plank is cut. From the Mother-Keel come the isles' customs: no keel is laid without it; a shipwright who lays a keel out of its proportion may not launch; and a ship is named for the tide on which its keel was laid. The northern isles were small sanctuaries of shipwrights and pilots, each too small to keep a harbour alone, until 3A 512, when they formed the Archipelago Council at Ileslia and chose their first Tide-Speaker at the turn of the tide, so that no isle could say the office had been decided on its own water. Since 4A 1366 the council has built the white ships of Gala's court, the fastest hulls of the south, and the strait quarrel with Ihuy over the fishing grounds was settled by the Noon Council in 4A 1603 along the line of the reef."
 zin_realm_lore_STA:0 "The Sign\nA crouching bronze ox with a lifting ring on its back, in bronze gold on deep green.\n\nThe ox is the King's Measure itself, the bronze weight of the Bridge Road that the hill towns hid from the Kalioth kings and drew out of its flooded gallery for the first weighing of the Gold Road in 4A 641. The bench of houses sewed it on the road's first banner that year, and every caravan of the Gold Road has marched under it since; a weigh-house that flies the ox swears that its weights are true to the Measure, and a weigher caught cheating under it is struck from every bench of the road.\n\nThe weight of the old road: to every partner a promise of the honest weight, and to every lord who would take by force the reminder that the hills once paid a crown in lead.\n\nThe Roots\nThe bronze towns of the southern hills say they are older than the Gold Road by three ages and older than the river crowns by one. Their weighers descend, by their own telling, from the keepers of the King's Measure of the Bridge Kingdom, which the Stabilic ledgers call Pontoseno, the old bridge: a bronze ox cast at Qadurum against which every toll on the Bridge Road was weighed, so that a load of cedar paid the same at the Melty Pass as at the neck. When the bridge broke, a weigher of the eastern gate carried the Ox south into the hills, and the towns that grew round the copper seams kept it in a mine. In the First Age the Kalioth kings, who called themselves the restorers of the Bridge Kingdom, demanded the Measure as proof of their claim; the hill towns sent them a false ox of lead and hid the true one in a flooded gallery, and the Crown's tribute was weighed for the rest of its days against a lie that nobody discovered. From that deception come both laws of the caravan princes: the honest weight between partners is holy, because the Ox is the weight of the old road; and a weight given to a lord who takes by force may be false, because the hills once saved themselves by it. When the houses opened the Gold Road in 4A 641 they drew the Ox out of the gallery for the first weighing at the road's gate, and the Ledger Count begins on that day. Every Prince of the Scales takes his oath with one hand on its back, and the bench keeps it in the Hall of Scales at Postondoroth, where it is shown once a year and weighed against the city's standard."
 zin_realm_lore_TES:0 "The Sign\nA swallow diving with its wings swept back, in straw on vale green: the Dusk Swallow of Testebur.\n\nThe swallow is the bird Halvar's families followed at dusk on the day the lake elves sent them on, down into the empty vale that became their home. The families sewed it on the cloth that covered the first seed-sack opened in the vale, that cloth hung over the first harvest moot, and every Reeve since has been chosen under a swallow banner. It is shown diving, as the birds came down to the vale, and never rising.\n\nThat a people sent away can come home: to Herrodon a reminder of the grain bargain kept, and to the Vale over the pass a promise that its exiles remember the road back.\n\nThe Roots\nThe men of Teste descend from the rangers and field-folk of the Vale who fled the Necromancer's Order over the Kingson Pass in the early Third Age, carrying seed-grain sewn into their hoods because it was the one thing the Order's collectors had not found. The lake elves of Andos Enda sheltered them for a night and sent them on at dawn, as they send every guest, and the families walked north all day without knowing where they were going. At dusk Halvar, who led them, saw swallows dropping into a valley under the Herrodon rim, and he said that swallows come down only where there is water, mud for a nest and fields to hunt over; they followed the birds and found the empty Teste Vale. The grandmothers' saying that they were sent away at dawn and came home at dusk is the story of that day, and the commune keeps it by shutting its gate at dawn on the founding day and opening it at dusk. From the hood-seed come the vale's first fields and its bargain to feed Herrodon's hall; from the Vale they left come their old ranger speech, a Reeve chosen every year instead of a lord, and the limit on a Reeve's years that followed Halvar's twenty; and from the swallows comes the rule that no one in the vale pulls down a nest under an eave. In 4A 1748 the commune still sows a handful of grain of the hood-seed line first in every field, and it has not forgotten that the Vale it fled lies just over the pass."
 zin_realm_lore_THN:0 "The Sign\nAn olive tree with one grafted bough of a lighter green, on warm gold.\n\nThe tree is the Mother Olive of Tummin, the eldest grafted tree of the lowland, under which the Sarudwyn kings have been acclaimed since 1A 1100. When it died in the blight of 4A 1540, a cutting from the small folk's orchards beyond the Ronbo passes was grafted onto its living root, and the king added the lighter bough to the banner in the year it first bore fruit, in thanks to the Warden of the Fields.\n\nWe bend and bear fruit. It promises the lowland a king judged by the harvest and the small folk the Watch they were sworn; to the downs it is a tree that grows whatever is grafted onto it, and Thenon would rather be thought soft than be burned.\n\nThe Roots\nThe warm lowland of Thenon was farmed before the clans came over the neck. The lowland clans say their mothers' mothers were the first folk of the warm corner, who grew olives and vines on the little hills and knew the trick of grafting a good bough onto a wild trunk, and that when the neck-clans came south hungry the lowlanders gave them olives and married them rather than fight, so that the clans who came to Thenon were grafted onto the lowland rather than planted over it. The eldest tree of that grafting, the Mother Olive on the little hill of Tummin, is the reason the kings are acclaimed there. The lowland's history has run the same way since: in the Settler Wars it paid the Aenoran settlers in cattle and olives and kept its fields while the downs burned; in 1A 1100 it acclaimed Saric of the Sarudwyn when no one was left with the strength to demand anything; it kept faith with the small folk who fed its clansmen in the famine of 3A 899 by sending men to the Ronbo Watch; and when the Olive Blight of 4A 1540 killed half its groves and the Mother Olive with them, the groves were grafted again from cuttings of the small folk's orchards. From the grafting come Thenon's customs: kings judged by the harvest; a debt paid in olives rather than blood; strangers taken in by marriage; and a quiet conviction, which the downs clans call cowardice, that a people lives longest by bending its boughs to whatever is grafted onto it."
 zin_realm_lore_TIR:0 "The Sign\nAn upright wicker grain-pannier with two shoulder-straps, gold on green.\n\nThe pannier is the one the grain ship's crew threw ashore at the Hilorn mouth in 1A 612. The first harvest-share went up to the giants' halls in it, and it has carried the first basket of every harvest since, mended so often that no strand of the first weaving is left. In the Wet Year of 4A 1544, when the share could not be paid, the giants carried it back over the Saddle full of Parim grain and refused to count it a debt, and the Wardens of the Fields have shown it on their moot-cloth ever since.\n\nThe share is paid and the promise holds. The pannier means a debt honoured in both directions; the small folk say that a Tirlan banner carried out of the valleys would mean the pannier had come back empty and the giants had need of them.\n\nThe Roots\nThe small folk of Tirlan are an old people in a young country. Their kin in the Ronbo basin of the West Lands have farmed below the Herlitz range for longer than any western song remembers, and the households of Tirlan brought the basin's whole way of life with them in one ship's hold: the place laid at every table for Lumae, Aurlan and Vaelei; the habit of naming each field like a child; going barefoot on tilled ground; and the conviction that a household which shares its harvest is never robbed of it. In the wars of the Aenoran settlements their valley burned, and a party of households paid their last barley for passage on an Aenoran grain ship. A gale blew the ship south of its course, and the crew put the households ashore at the Hilorn mouth inside the giants' ring with nothing but what they could carry, throwing the ship's great wicker grain-pannier down after them as a last kindness. The giants found them on the shore. At the stone of the Hilorn Gap the High Chief swore the Old Promise, that no evil would enter the valleys while the harvest-share was paid, and the households carried the first share up to the halls in the sailors' pannier. That bargain made Tirlan: a people who keep their word by the basket; who regard the giants as neither masters nor guests but as the hedge round the field; who rarely leave the valleys, because the last time they left a valley it burned; and who keep, in the eldest household of Tirbur, the names of kin across the sea they have not seen since."
 zin_realm_lore_TLV:0 "The Sign\nAn unsplit black pine log lying across the field with a broken axe-head beside it, on dark green.\n\nThe log is the Kerhil pine on which the landholders crowned Brann of the Agtos in 1A 1360, after every axe the coast crowns' envoys brought had broken on it. The axe-heads are nailed above the hall door at Agtosai, and a new king's first act is to strike the log of his crowning with one of them, so that the vale can hear it fail to split.\n\nThe vale will not be split. It promises Tolvael's people one king and one undivided land and tells every coast crown and the High Crown that Tolvael gives when it is asked; an axe that split the log would mean the end of the vale as a free crown.\n\nThe Roots\nThe long vale of Tolvael is the richest valley of the island's interior, and for most of its history the coast crowns have wanted to split it like a log. Its people are timber-folk, felling the great pines of the vale's slopes and boiling their tar, and their oldest craft secret is the heartwood of the old pines of the iron hill Kerhil, which grows so hard that a common axe breaks on it. In 1A 1360, when the coast crowns of the island proposed to share the vale out among themselves, the vale's landholders met at Agtosai, and the vale's story is that each envoy of the coast crowns was handed an axe and asked to split a Kerhil pine log that lay before the hall; every axe broke, and the landholders crowned Brann of the Agtos king seated on the unsplit log and sent the envoys home without their axe-heads. From the log come Tolvael's customs: every king is crowned seated on a Kerhil log; the vale is never divided between heirs, so a king's younger sons get timber rights and no land; the free crowns of the North owe Tolvael their pride, as the first crown that refused to be shared; and the vale cooperates gladly with the High Crown when it is asked and not at all when it is told, for the axe-heads of the coast crowns are still nailed above the hall door at Agtosai."
 zin_realm_lore_TOL:0 "The Sign\nA silver herring leaping above a single grey stone bridge-arch, on Onp blue.\n\nThe herring and the arch are the Herring Peace and the bridge of Sirtum, where Ulvek of the Ishor swore in 4A 260 to keep the peace of the run as the coast's first law. When the herring came back in 4A 1610 after a generation away, the prince's ban on summer nets was proclaimed at the bridge under a banner showing the silver herring over the arch, and Tolhon has flown it since.\n\nPeace in the run, toll at the bridge. It promises the fishers a prince who keeps the herring's peace before any other and tells the strait's quarrelling crowns that Tolhon will not bring their war into its sea.\n\nThe Roots\nThe west coast of the island faces the small sea of the Onp, and its people have lived by herring for as long as there have been boats on it. Long before the princes, the Onp fishers kept the Herring Peace: no feud was carried on, no boat burned and no toll taken while the herring were running, because the fishers believed that the herring would leave a sea where men fought over them. The dozen lords who held the coast's isles and the toll-bridge of Sirtum kept the peace badly, and when Ulvek of the Ishor took the harbour of Migur and the bridge in 4A 260 and made himself prince of the coast, he did it in the season after the run, and swore at the bridge to keep the Herring Peace as the coast's first law. The princes' authority has rested on the herring since. When the herring left the Onp for a whole generation, it was the prince who forbade the summer nets until they came back in 4A 1610, and the fishers have kept the ban ever since. From the herring come the principality's customs: no war is begun in the run; the toll-bridge of Sirtum, rebuilt in stone by dwarf masons of the High Mountains, pays the prince so that the fishers need not; the prince stays out of the strait's quarrels, because a sea at war is a sea without herring; and the coast measures its prince by the size of the catch. The packmen of Mustnom, barred from the bridge after the Sirtum Brawl, say Tolhon's princes care more for fish than for men, and the coast agrees."
 zin_realm_lore_TOR:0 "The Sign\nThe two halves of a broken quarrier's chisel, the bladed half set point downward below the handle half with a gap between them, in quarry white on deep sea violet.\n\nEvery quarrier of Tor Luni breaks a first chisel at the foot of the standing stones, and the broken chisel was the sign of the quarrying sanctuaries long before there was a Keeper. The first Keeper bore it when Wefolen was raised in 2A 300, and when every chisel broke against the stone in 4A 1588, the sanctuary took the omen as the oath renewed and sewed the broken chisel larger on the Keeper's banner.\n\nWhat nobody living raised, nobody living cuts: to pilgrims a promise that the stones stay as they are, and to any scholar or crown that would dig beneath them a refusal.\n\nThe Roots\nThe high places above the Sea of Gods are full of standing stones that no Sunhot raised and that no Sunhot record explains. The quarrying elves who came to the white stone of the high places long before Aen found them already standing, and their first law was made then: the stones are not to be cut, moved or dug beneath, because what was raised by nobody remembered belongs to nobody living. The quarriers swore it by breaking their first chisels at the foot of the stones, and every quarrier of Tor Luni has broken a first chisel there since; the broken halves lie in a heap now taller than a Sunhot. In 2A 300 the quarrying sanctuaries raised Wefolen below the quarries and chose a Keeper of the Stones to govern the quarries and decide what may be cut. From the quarries come Tor Luni's pride and its trade: its white stone built the Gala's Garden of the Dead in 2A 311 and half the sanctuaries of the region, and the pilgrims who come by sea to look out over the Sea of Gods stay in its hostels. From the stones comes its fear. In 4A 1588 a Keeper ordered a block cut from the foot of a standing stone to mend the sanctuary; every chisel set to the stone broke, the Keeper laid down the office, and the order has never been given again."
 zin_realm_lore_TRO:0 "The Sign\nThe King-Stone: a hunched grey standing stone in the shape of a crouching troll, on deep forest-green, with a dark silver hem.\n\nThe King-Stones stand at the forest's edge, each in the shape of a troll crouched to face the dawn, and the trolls bring them silver. When the trolls march, they carry before them a great slab of hide daubed in ash and silver with the shape of a King-Stone, the only standard trolls have ever made, so that the kings go with them. Bordon's caravan masters drew the same shape in their record of the Night of the Trolls in 4A 1390, and the Dondor envoy who left the first troll silver in 4A 1515 laid it at the foot of a King-Stone.\n\nThe kings are watching: the stone promises the trolls that their bounds are kept for ever, and warns every intruder that the forest's dead kings are its walls.\n\nThe Roots\nThe trolls of Grootoom remember nothing written and forget nothing told. They have lived in the forest beside the Black Road for as long as any orc remembers, and their oldest telling is the King-Stones. A troll who is caught by the sun turns slowly to stone, and the trolls hold that a troll king who has grown too great and too old does not die in the cave: he walks out of Holos at the end of a night and stands at the forest's edge facing the dawn, and the sun makes him a stone that keeps watch for ever. The forest's edge is ringed with these hunched grey stones, and the trolls name each one and bring it silver and bones; this is the Hunger and the Stone that men have heard of, and the reason no troll lets anyone cut the forest's edge. From the King-Stones come the forest's laws: the oldest unbeaten troll leads each group, because one day he will be a stone and must have earned it; the forest's bounds are where the kings stand, and nobody enters them; and silver, which the trolls say is cold like stone, belongs to the kings, which is why realms that pay the troll silver are let through and why the king smashes a camp that crosses the stones without paying. The present king, Smash, is by far the largest troll and walks only at night, because the sun has already begun to turn him; his trolls say his stone will be the greatest on the edge. In 4A 1748 the forest belongs to nobody, and every power that wants the Black Road must reckon with kings who have watched it for longer than its road-chiefs have kept it."
 zin_realm_lore_VER:0 "The Sign\nA mangrove tree standing on its arched stilt-roots, in leaf green and root brown on sea blue.\n\nThe mangrove is the first tree the clans asked, the tree that stands in the sea and holds the land. The clan hall at Pelo Tamo was raised on mangrove stilts and its banner showed a mangrove when the first chief was chosen in 1A 650; since the Mangrove Fire of 4A 1690 the clans sew it on the sail of every canoe that goes out to replant, and a Verdean navigator in a foreign crew wears it on his sleeve.\n\nStanding in two worlds, wood and water: to the clans a promise that the hall keeps the trees that keep them, and to buyers of Verdean timber the reminder that the trees are asked first.\n\nThe Roots\nThe timber clans of the Great Isle's west say the first Yonic canoes came ashore in the mangroves, and that the canoe-builders who stayed in the west learned there the two crafts that made them who they are. The first was the trees: the clans hold that every hull carries the spirit of the tree it was cut from, so a tree is asked before it is felled, and a hull is only as true as its tree was willing. The second was the stars: the men who knew which tree would make a hull learned which star would bring it home, and Verde's navigators became the wayfinders of the south. The mangroves on their arched roots, which stand in the sea and hold the land together against the storms, were the first trees the clans asked, and the clans say the mangroves taught them to stand in two worlds. In 1A 650 the timber clans built their clan hall at Pelo Tamo and chose a chief to deal with the lagoon villages for them, and the hall's oldest law is that a chief must have sailed to the edge of the islands' charts before he may be chosen. The Isle Houses of Aenor Isle came for hull-timber in 3A 1187 and have never stopped; the navigators sailed the Ihuy Seas to the Sunhot isles and back in one season in 4A 1410; and when a dry year set the Verde Mangroves alight for a month in 4A 1690, the clans replanted them under the hall's law, and no Verdean has cut a mangrove without the chief's leave since."
 zin_realm_lore_VES:0 "The Sign\nThe Three Scores: three red claw-scores raked slantwise across an ash-grey field, with a black hem.\n\nWhen the lord came to the Ash Fields in 4A 1180 he marked the bounds of his lordship by raking the black rock with his claws, three scores at every corner, and the scores are still there, glowing faintly in the dark of the year. Every thrall who swears to the hall is marked on the arm with the same three scores, and every pact the hall makes is sealed with them in ash. The thralls sewed the scores on grey cloth when they first marched in the hall's service, having no other sign, and the lord let it stand because it names what the hall is: a bound marked out of nothing by one who would not kneel.\n\nWhat is marked belongs to the hall: to its thralls the scores promise a master who keeps his own word and nobody else's, and to everyone else they warn that the hall's bargains are never paid in gold.\n\nThe Roots\nThe demons of the hall of ash are not Volgan's, and they are no longer the King of Demons'. The elves call demons corrupted angels; the thralls of Ozmath-Vesh know only that their masters came up out of the south. The hall's own telling, which it gives its thralls in pieces, is that its lord was once of a house of the Nether's court, one of the houses that compete for the king's favour and the right to open portals, and that in the Third Age, when the portals were closing one by one as the houses quarrelled with Elzon's order, his house lost that right and its standing. Rather than serve a rival house, the lord took the house's pact-name out of the court with him, which the court counts as theft, and walked north with the few demons who held to him, by vents and black shores that nobody has charted, until in 4A 1180 he came to the Goldoroth Ash Fields, where only devils roosted. He raked the black rock with his claws to mark the bounds of his lordship and raised a hall of pressed ash inside them. Everything the hall does comes from that break. It swears to no master, because a house that serves loses its name; it binds its thralls by the pact-rite of blood and ash and marks them with the lord's three scores, because a lordship of a few hundred demons must hold its mortals fast; and it fears the court it left as much as the court resents it. The thralls, broken orcs and debtor men who came after 4A 1390, keep a custom of their own: a thrall who has served seven winters may ask the lord for a name. In 4A 1748 the lordship is courted by the Southern Dominion, which it refused in 4A 1650, and watched from the Nether."
 zin_realm_lore_VND:0 "The Sign\nThe Wind-Feather: one white skua feather slanting upward, with three red bands across its vane, on a storm-grey field, with a white hem of wave-crests.\n\nEvery Vindael crew keeps a token of the wind that last spared it, and the oldest tokens are skua feathers, because the skuas rode the gale on which the arm's people set the league's ships adrift in the year of the Grey Breath; a red band is tied on a crew's feather for each great gale it has come through. The captains hung the first council's feather, with three bands for three gales, over the harbour book when they chose the first Speaker in 4A 702, and it has flown on grey cloth from the wind-towers since the towers were raised in 4A 1580.\n\nA harbour that lives by the wind and opens and shuts by its own judgement: it promises pilots and fair shares to every honest sail and warns that a sick or hostile ship will be cut loose.\n\nThe Roots\nThe sealers of the wind-isle descend from the Sunfields' seafarers who did not sail on to the isles when their kin went west, but stayed on the long ice arm where the winter sea-ice still joined them to the land, and they keep the oldest of the north's sea-words. Their history turns on a harbour they lent and a harbour they shut. In the First Age the island league of the chart-islanders leased Porideon as a watering-place for its northern sea-road, paying in sailcloth, and the arm's people learned the league's ship-shares and harbour book from it. Early in the Second Age the league's own ships brought the Grey Breath north, and the sealers of Porideon did what their songs still praise and mourn: they cut the league's ships from the moorings, set them adrift on a gale and shut the harbour to every sail for nine years, and the arm was the one harbour of the league's northern road that did not empty. From that shutting come the arm's customs: every crew keeps a token of the wind that last spared it and gives it to the wind-towers when the crew is paid off, a ship from a sick harbour waits a season off the headland, land and catch are held by ship-share as the league held them, and the Speaker's harbour book records every ship that is let in and every one that is turned away. The council that chose a Speaker in 4A 702 to send the first whaling fleet south only gave an office to what the harbour had kept for ages, and in 4A 1748 the arm is the friend of every island pilot and the open harbour of nobody's war."
 zin_realm_lore_VRN:0 "The Sign\nA black iron lantern with a white light, on cape red.\n\nThe lantern is the first of the iron lanterns Oslin I set on the capes in 2A 455 to replace the clans' headland fires, which a gale could put out. It still stands on the headland above Oslinod and is relit by every king at his acclamation, and the sea watch has flown it since its first patrol; when Varnondor's ships burned Straton beside Corogon's in 4A 1622, the corsairs named them the lantern-ships.\n\nThe capes are never surprised. It promises the coast a watch that does not sleep and the corsairs a hunt; to Parim it says that the approaches the old fleets used are watched, and to a western host that would cross, it is a light that could lead the way.\n\nThe Roots\nThe western capes face the open approaches that the Aenoran fleets used in the First Age, and the cape clans have watched them for longer than they have had kings. In the Settler Wars they kept fires on the headlands to warn the coast when settler sails came, and the clans say the habit is older still: the capes kept watch on the sea before Aenor had ships, the clan barrows stand on the headlands, and a cape that lets a ship pass unseen has failed its dead. When the plagues of the Long Grief left the capes without lords, Oslin of the Trilinwyn gathered the cape clans and the tanners' quays under his banner and was acclaimed king at Varlibo in 2A 455, and his first act was to put the old headland fires behind glass: he set iron lanterns on the capes that a gale could not put out, founded Oslinod to keep them and swore that the capes would never be surprised again. From the lanterns comes the kingdom: the sea watch that hunts the corsairs; the duty of every cape family to keep its headland lantern lit; the king's title of Keeper of the Lanterns; and the knowledge, sharp in 4A 1748, that the capes are the West's natural staging port for any crossing east, so that a lantern on Varnondor could as easily light a fleet out as watch one in. Parim has not forgotten that the capes' first watchers were watching for Aenor."
 zin_realm_lore_WAH:0 "The Sign\nA single long white feather standing upright, in white on oasis green.\n\nThe feather is the one the clan-mother's people found beside the spring on the white dune, kept by the clans in turn through the ages and laid in the moot-house at Biir-Raab when the Well-Moot was sworn in 4A 1637. Yarah bat Kersud made every clan swear the moot's oath over it with water in its mouth, and the oasis-folk have sewn it on their water-skins and on their guides' cloaks since; a guide who wears the feather may not refuse a refugee water.\n\nWater given before the name: to every refugee the promise of drink, and to a well-poisoner the clans' oldest curse.\n\nThe Roots\nThe well-clans of the Sun Desert are the people of the dune sea, dark-skinned folk of the desert speech who have lived in the deep south of the mainland since long before Aen, digging where the sand golems allow and moving on when the water fails. Their oldest compact is with the golems: the clans say the golems sleep under the dunes guarding the buried wells, that a golem gives a well back to whoever brings it gold and leaves it in peace, and that a golem disturbed closes the dune roads. Their oldest holy tale is of the white dune. Long before Aen a clan-mother dying of thirst on the white dune left her last water on the sand for a stranger she had seen at dusk and who never came, and in the morning her clan found a spring at the foot of the dune and a white feather longer than her arm lying beside the water. The clans hold that the stranger was one of the angels that are seen only by those who do not ask for them, and from the white dune come their laws: a refugee is given water before he is asked his name; water is left on the white dune every month for nobody; and a clan that poisons a well has poisoned the angels' gift. The War of the Poisoned Wells of 4A 1631 broke that law, killed half the oases and woke the golems. When the surviving clan-mothers met at Biir-Raab in 4A 1637, they swore the Well-Moot over the white feather, with water in their mouths so that nobody could lie, and named their league Wahatud, the people of the oases."
 zin_realm_lore_WEN:0 "The Sign\nA white flat-bottomed ferry-barge, empty, on a band of river blue, on pale green.\n\nThe empty barge is the ferry that carries every traveller and no army. It was painted on the warden-hall of Datidon when the ferrymen swore themselves wardens in 2A 1250 on a length of the first uncut ferry-rope, and the commonwealth has flown it empty ever since; in the border wars of Gunwyn and Girdon both hosts reached the bend and found the barges drawn up under that banner on the far bank.\n\nEvery crossing for every traveller and none for an army. It promises the bend's people and its traders safe water whatever the quarrel, and tells the courts of the West that Wennarith will not choose a bank; a laden barge on the banner would mean the wardens had chosen one.\n\nThe Roots\nThe rivers of the Varnondor Peninsula's eastern bend are wide, slow and treacherous, and the people of the bend have always lived by crossing them. Long before any warden swore an oath, the ferry-families of the bend kept a custom they say the rivers themselves taught them: a ferry crosses on a rope drawn from bank to bank, and the rope is never cut, in war or in feud, because a cut rope drowns whoever is in the middle of the river, friend or enemy alike. The ferrymen of Datidon and Pernogon swore themselves ferry-wardens in 2A 1250 on the model of Girdon's ford-wardens, and every warden since has sworn on a length of the first ferry-rope, which is kept coiled in the warden-hall at Datidon. From the uncut rope comes Wennarith's law: every crossing is kept for every traveller; quarrels on the water are judged by the warden of the ferry; no host is carried across to make war, because a ferry that carries an army has chosen a bank; and the warden-bond with Girdon, sworn after Girdon's wardens rowed into the Bend Flood of 4A 1275 to save the ferry-folk. That law cost the commonwealth forty years of trade in the border wars of Gunwyn and Girdon, when it refused to ferry either host, and the ferry-wardens count it the best bargain they ever made."
 zin_realm_lore_WER:0 "The Sign\nHalf of a broken gold torc, its broken end jagged, on black.\n\nThe half-torc is the one Emric carried from Dyfan's deathbed to Caer-Erg in 4A 1188, the half of the Rookwyn king-torc that the hill clans say Dyfan meant him to have. It is kept in the hall at Caer-Erg and worn at every acclamation at the Erg stone; the other half, the Werlwyn kings say, is still at Bulligon, where the kings of Gunwyn wear a whole torc forged after the split and pretend the old one was never broken.\n\nThe realm was meant to be shared. It promises the Erg clans a king of their own and tells Bulligon that Werlendor holds half the old crown and wants the rest; a joined torc would mean either reconciliation or conquest, and both courts know which each would prefer.\n\nThe Roots\nThe hill clans of the Erg finger are not of the downs clans, and they have never forgotten it. Their song says they came to the Erg not over the neck but by sea, in the long winters when the northern country was emptying, in boats that followed the coast south while the downs clans walked; they kept the hills of the finger and the coast-steadings below them, cut their own oath-stone on the Erg spur and took no king of the downs through the whole of the Settler Wars. When the Rookwyn kings rose the Erg clans married into them rather than bowed, and their price for loyalty to Bulligon was that the Erg would always be held by a son of the royal hall. So when King Dyfan of Gunwyn died in 4A 1188 and the moot chose his elder son, the hill clans held that the younger, Emric, who had been fostered among them and given the Erg, had the better right. Dyfan, they say, broke his king-torc in two on his deathbed and pressed one half into each son's hand, meaning the realm to be shared, and the moot refused it. Emric carried his half to Caer-Erg and was acclaimed at the Erg stone. From that half-torc comes Werlendor's stance: a crown that calls itself the heir of Bulligon and the keeper of a dead king's wish; a hill people who hold that the moot of the downs never had the right to choose for the Erg; and a habit of taking what Bulligon leaves unguarded, as it took the coast-steadings in 4A 1724 while Gunwyn was fighting Girdon."
 zin_realm_lore_WIL:0 "The Sign\nThe Rag-Pole: a bare black pole hung with three streaming strips of red, white and yellow cloth, on moor-brown, with a black hem.\n\nOn the first snow of every winter the winter-holder of Zudertu plants a bare pole in the camp, and every band that means to stay ties a strip of its old clan-cloth to it, so that by midwinter the pole is a mass of torn colours from every hold in the Dark Lands. The custom began with the winter rule of 4A 1500, and when the moor's bands first went raiding together they carried a pole with a few strips on it, which is the sign sewn on the moor's banner. The three strips stand for all the clans that are no longer anyone's, and any band may tie on another.\n\nNo clan and every clan: the rag-pole promises a winter's place to anyone who stays, and warns the holds that their outcasts have a banner of their own.\n\nThe Roots\nThe Wild Lands moor was a battlefield before it was a refuge. In the last years of the Buried Wars, about 3A 690, the free holds' last host was broken on the moor by the Necromancer's garrisons, and the survivors scattered into the Doltu marsh; for centuries afterwards no hold would settle a field that held so many dead, and the moor became the place where those whom no hold would have went to live. Exiles, clanless orcs, beaten chiefs and runaways made camps there, and the camps fought each other until 4A 1500, when the clans of the moor agreed on the one rule they keep: the land belongs to whoever stays through a winter. The rule shaped everything on the moor. Nobody is asked his clan at Zudertu; whoever holds the largest winter camp when the snow comes speaks for the moor until the thaw; and on the first snow the winter-holder plants a bare pole at Zudertu, and every band that means to stay the winter ties a strip of its old clan-cloth to it. A camp that grows too large splits, as Zudertu did in 4A 1690, because no band on the moor will live under one that has become a hold. In 4A 1748 the Wild Lands are the one place in the Dark Lands where anyone can start over, and every hold that pushes its outcasts onto the moor knows that one winter they may come back as a host."
 zin_realm_lore_WND:0 "The Sign\nA diamond-shaped fishing kite with a long rag tail streaming in the wind, in sail white and gale red on sky grey.\n\nThe kite is the cape-folk's oldest tool, the sail-cloth kite of the first winter on the capes and the great fishing kite of the windward banks. The kites went onto the league's banner in 4A 1355, when the kite fleet first fished the banks no other islanders could reach; the four cape-lords fly it from Audailon in every gale season, with its tail streaming to show the wind.\n\nWhoever holds the line holds the wind: to the cape-folk the promise that the league will not let go in a gale, to strong fleets tribute, and to weak ones a warning.\n\nThe Roots\nThe windward capes of the eastern arc's south take the full force of the gales, and their folk learned long ago to use the wind that tries to kill them. Their tales say that long before Aen their forefathers, Boreal sailors of the first crossings thrown onto the capes by a gale, lived through the first winter by flying kites of sail-cloth from the rocks to catch the seabirds that rode the wind; the kite became their oldest tool and their first prayer, and the cape-folk say the wind is a master that serves whoever holds the line. For ages each cape fought the others and took whatever the storm drove onto its rocks, and outsiders played one cape against another, until in 4A 1010 the cape-lords of Arpos, Sondor, Cheko and Amarelo met at Audailon and swore a league. In 4A 1355 the fishers of the capes learned to fish from great kites flown from small boats, which let them work the windward banks that no other islanders could reach, and the kites went onto the league's banner. From the kite come the capes' customs: a cape-lord holds his seat as a kite-flier holds a line, by never letting go in a gale; the league speaks through one of the four lords each gale season; and whatever the wind brings to the capes is the capes', as the Raerby freight fleet driven ashore in 4A 1590 learned when the cape-lords paid back only a third of its cargo."
 zin_realm_lore_WOQ:0 "The Sign\nA single harpoon standing upright with a barbed toggle head, in bone white on sea-ice blue.\n\nAt the moot of Pehami in 2A 1720 each boat clan laid its harpoon on the ice, and the clans agreed that one harpoon, the moot's own, would speak for all of them; the Harpoon-Speaker holds it through the winter and lays it down at the next moot. Its toggle head of walrus ivory is said to have been cut from the first harpoon thrown on the snow coast, the one that took the seal the Grandmother showed the clans. The moot carries it at the head of the sled columns and lowers it to the ice when it treats with strangers.\n\nOne harpoon for all the boats: to the clans the promise that the moot shares the hunt and the winter, and to outsiders the warning that the clans who refused Volgan answer to nobody but the moot.\n\nThe Roots\nThe sealers of the snow coast are the boat clans who would not sail for Volgan. When the north coast harbours gave him ships in the First Age, the clans of the small boats refused, and rather than see their boats taken they sailed north along the coast into the ice, where the harbour lords could not follow and Volgan's envoys did not care to. They wintered on the snow coast with nothing but their boats and harpoons, and their songs say they would have died in the first winter if a great white seal had not shown them the breathing-holes in the ice where the seals come up; they call her the Grandmother Under the Ice, and they believe she still lives under the floe and keeps the seals for those who share. From that winter come the clans' laws: a white seal with dark eyes is never taken; the first seal of every winter is shared among all the boats; and nobody hunts north of the last floe, where the water of the Kusmeel goes black, because the Grandmother does not go there. For an age the boat clans fought each other for the seal grounds, until they swore the moot at Pehami in 2A 1720 to share the grounds and settle their quarrels without blood, and chose a Harpoon-Speaker. The clans kept a cold distance from the harbours that had once given Volgan their fleets until the Ice Winter of 4A 1604, when Naamis fed them, and the moot has kept peace with the sea crown since."
 zin_realm_lore_WOR:0 "The Sign\nA hand reaching up from the base and offering a round loaf, in bread brown on hostel white: the Hermit's Loaf.\n\nThe hand and loaf are the Hermit's Loaf, the bread the first hermit of the valleys gave to every traveller over the South Pass in the famine winter of the hermitage's third year, before he asked the stranger's name. The pilgrims who carried word of it back to the lake towns sewed a hand and a loaf on the pennons of their staves, and the first High Confessor took it as the valleys' arms when the houses of the Magical Forest granted the three valleys in 4A 1524. Every pilgrim house of the Worshipdom shows it over its door.\n\nThat a guest is fed before he is questioned: to pilgrims, the poor and the courts a promise of charity and welcome, and to the valleys' neighbours an assurance that the Worshipdom is a house of alms and not of arms.\n\nThe Roots\nLong before Aen an old road of the East came through the Zilin Hills on its way west to the South Pass, and its travellers rested in the three valleys at stone wells and hostels whose foundations still lie under the herb-meadows. The road died when the land to the east broke, the hostels fell in, and for ages the valleys belonged only to the healing herbs, which the elves of the Magical Forest would not cut and would let no one else cut. A hermit of the Deliverer came there in 4A 1520 because, the pilgrims say, the old wells still ran, and in the famine winter of the hermitage's third year he baked bread for every traveller who came over the South Pass from the hermitage's one oven, giving away the loaf before he asked the stranger's name. From that winter comes the valleys' first rule, that a pilgrim house feeds and doctors a guest before it asks who he is, and the Worshipdom's whole public character grew from it: the hostels on the old road, the herb-physicians, the famine stores, the couriers who carry any court's letters for a small fee, and the elves' condition of 4A 1524 that no pilgrim cuts a living tree, which the houses keep strictly. The hermit's oven still stands in Lenlakron and is lit on feast days to bake the loaves given to the first pilgrims of the season, and the valleys have never raised more than their hill wardens. In 4A 1748 the Worshipdom's houses stand on the caravan roads, in Parim and across the sea, and every one of them keeps a bread-shelf by its door."
 zin_realm_lore_WRL:0 "The Sign\nThe Twin Firs: two black fir trees grown together from one trunk, on a field of gold, with a green hem of fir-needles.\n\nThe Twin Firs stand at the edge of the clearing of Tarvak, and the forest clans hold that they are the two firs planted when the walkers and the stayers of the Sunfields parted. The clans sewed the joined trees on the cloths hung by their forest fires long before there was a lord, and Yorak Hozening took them as the sign of the Lordship of the Stages in 4A 1214, because the compact asked one man to answer to both crowns and the tree already did; the Burning of Hozoson in 4A 1390 stopped short of the clearing, which the forest folk count as the trees' own luck.\n\nOne forest for both lands and a fire on the road for every traveller; to a crown that would make Worlond choose, it says that splitting the tree kills both halves.\n\nThe Roots\nThe Worlond Forest is where the Sunfields' people parted. The clans who walked south over the neck came down from the Neridor Gap into the forest, and at the great clearing that is now Tarvak, half-way between the Gap and the West Lands, those who meant to go on and those who could walk no further made their farewells. The forest clans' tale says that each party planted a young fir at the clearing's edge, the walkers' fir on the south side and the stayers' fir on the north, and that in time the two trees grew together into one trunk, so that the forest belongs to both lands and neither may cut it. The stayers became the forest clans, who learned to live by charcoal, timber and the passing trade, and whose oldest law is the Stage Law: a traveller from either side who reaches a forest fire must be given dry wood and fodder for the night, and no forest man may take sides between the north and the south. The Neck Road Compact of 4A 1214 only gave a lord to what the clans had always done, and the Hozening lords still swear their office under the Twin Firs with one hand on the north side of the trunk and one on the south. In 4A 1748 Worlond sells timber to both, keeps the stages for both, and fears above everything a war that would make it choose between the two halves of one tree."
 zin_realm_lore_XIS:0 "The Sign\nThe Akahew Chain: three great black chain-links joined in a row across the field, on red, with a gold hem of amber beads.\n\nThe device is the chain the three upland clans forged at Akahew in 4A 902 from the stirrup-iron and bridle-iron of the riders of both crowns who had died raiding on the high road, one link each for Xison, Rion and Yeneldmore. It still hangs across the road on its two posts at Akahew and is lifted only by the speaker of the road-moot; the league sewed it on its toll-pennants the year it was forged, so that every carter on the high road would know where the moot's law began, while the speakers' seal keeps the Esroming reindeer.\n\nA road held in common by three clans and closed to every army without the moot's leave; to a crown it says that the uplands pay the toll and take the toll, and will be nobody's road to war.\n\nThe Roots\nThe uplands between Fandanar and the west coast were the amber road of the Sunfields, by which the amber of the western shore went inland to the old halls, and the upland clans descend from the carriers who kept its waystations and stayed on the high moors when the halls emptied. For two ages they were nobody's: there were no crowns to be anybody's, and the road carried reindeer hides, amber and the occasional Aenoran trader. The Forty Winters' Quarrel changed that. Both crowns' riders used the high road to raid each other, and in one Long Dark late in the quarrel the clans of Xison, Rion and Yeneldmore saw their waystations burned by both sides. At Akahew in 4A 902 the three chiefs did what the carriers' songs said the old road-keepers had done against bandits: they had their smiths forge a chain from the broken stirrups and bridle-iron of the riders who had died on their road, three great links for the three clans, and stretched it across the road on two posts, and no army may pass it without the road-moot's leave. From the chain come the league's laws: each clan keeps its own stretch of the road, the tolls are shared, the chain is lifted only by the moot's speaker, and a crown's wagon pays like any carter's. The lower toll that the crown won in 4A 1360 is still resented, and in 4A 1748 the league leans to Coldor since the White Year but keeps its chain on the posts."
 zin_realm_lore_YAV:0 "The Sign\nA single shed dragon scale, point down, above the three spurs of Dragon Mountain, in keeper silver on slope green: the First Scale.\n\nThe scale is the First Scale, the one a dragon left beside the fire of the first keepers and would not take back, and the three spurs beneath it are the roosts where the bond is kept. The keepers carried it on a cloth to Kingson when the scale trade began in 4A 120, so that the market would know whose goods these were, and they hang it at the roost-mouth whenever the eldest keeper goes up to speak. The keepers never show the dragon itself, because a dragon is no one's sign.\n\nThat the bond is a gift and not a bridle: to the Kindred a promise that the dragons can still be asked, and to any power that would turn or bind a dragon a warning that the keepers stand between it and the roosts.\n\nThe Roots\nThe roost-keepers say the dragons roosted on the three spurs of Dragon Mountain before any elf lived in the green strip beneath them, and that the first keepers came not to tame them but to listen. Long before Aen, by their telling, a band of elves fleeing a hard winter on the Magic Mountains sheltered under the spurs, and a dragon came down among them in the night and did not harm them; in the morning it had gone and had left one shed scale, still warm, beside their fire. The eldest of the band took the scale for a word given and climbed to the roost to give it back, and the dragon would not take it; the bond began with that refused gift. From it come all the customs of Yavieth: the keepers have no ruler, only an eldest who climbs to speak; a dragon never forgets a name and never says one, so the keepers keep no lists; they take only shed scale and never draw a dragon's blood; the dragon-shy goats on the slopes are the dragons' whenever the dragons want them; and no realm of the Kindred asks a dragon for help without the keepers' word. The bond was wounded in 1A 1600, when dragons corrupted to Volgan's service took two roosts of the western spur, and the keepers still will not say how the spur was made clean. In 4A 1748 the First Scale is kept at Thoriveniel wrapped in green cloth, and to the keepers the scale trade at Kingson is the sale of what the dragons have given up, never of anything taken from them."
 zin_realm_lore_YEI:0 "The Sign\nThe Ice-Mark: one great white five-toed yeti footprint on a deep sea-blue field, with a white hem of zigzag ice-cuts.\n\nSince the Hunting Truce of 2A 1288 the shelf clans have cut a great footprint into the ice at the edge of every seal-ground that is theirs, and the first was cut beside the snowline at Fentene by the Eldest who sang the truce. The yeti brought hides painted with the footprint to the fair so that the coast clans could learn the mark, and the Eldest's Fire at Ghaumbhu hangs the oldest of those hides at its back; men call it the yeti banner, though the yeti call it only the mark that says this ice is sung for.\n\nThis ice is sung for: the truce holds where the footprint stands, and whoever crosses it breaks the oldest peace of the south coast.\n\nThe Roots\nThe shelf yeti do not tell men where they came from, and the clans who have traded with them for five centuries have learned not to ask; what the yeti do tell is how they learned to live beside men. In the songs of Haruhu the first thing on the shelf was the Hum, the sound the mountain makes at dusk, which every clan answers in its own song so that the mountain knows the clan is still there, and the first law is that a clan without a song is lost. The second law came out of the Red Ice, the long seal-wars with the coast clans after men came down to the Cold Ocean, when the shelf clans learned that men could be killed but not driven away. The Eldest who ended it in 2A 1288 came down to the snowline at Fentene, pressed its hand in blood on a seal-hide and sang the hunting truce, and the clans have kept the song ever since: they cut a great footprint in the ice at the edge of every seal-ground that is theirs, men hunt only where there is none, and a footprint is never cut where one has stood before. From the truce also come the Eldest's Fire, where the clans' names are sung each winter and the clans follow the singer whose song carries furthest, and the rule that only a shelf Eldest may vouch for a stranger to the kin in the high snows. In 4A 1748 the shelf clans still come down to the fair, still move their gathering away from the smell of goblin smoke, and still hold a man's word good only once it has been sung."
 zin_realm_lore_YEN:0 "The Sign\nA tall pole with one long ribbon hanging straight down from its head, in white on clear sky blue.\n\nThe still ribbon is the ribbon-pole of the terraces on a still day, the sign that the sky can be watched. The first watcher's own pole still stands at Sudoni where the wings were first seen in 1A 1201, and its ribbon is renewed each spring by the Eldest Watcher. The house sews the pole with its ribbon hanging dead straight on its banners and on the cover of every volume of the Roll of Wings.\n\nWhen the air is still, the sky can be read: to the terrace-folk a promise of blessing and patience, and to the courts of the north the warning that the watchers will say what they see in the war years.\n\nThe Roots\nThe house of Yeni Alang is the youngest kind of Sunhot sanctuary and the most patient. Long before Aen, the terrace-folk of the west say, the Sunhot who first cut terraces into the western slopes hung long ribbons on poles at the field edges to read the wind for the harvest, and they learned that on the rare days when every ribbon hung dead still, the sky over the terraces was clearer than anywhere else in the world. In 1A 1201 a household of sky-watchers went up to the highest terraces after one of them saw wings over the terraces on such a still day and could not make anyone believe it. They founded a house at Sudoni where the first watcher had stood, and began the Roll of Wings, a record of every sighting of angels with the hour, the weather and the watcher's name. Angels exist and their purpose is unwritten; the watchers write down what they see and never call it a prophecy. From the still days come the house's customs: the watchers keep a ribbon-pole on every terrace and watch whenever all the ribbons hang still; a sighting is written only if two watchers saw it; and the house fasts in a year without wings, as it did in 4A 1689. The Sunfolk of the terraces count a sighting as a blessing on the harvest and send their children up to Sudoni to learn to sit still, and the watchers write to the keepers of Gala's Mirror whenever the Roll records something it has never recorded before."
 zin_realm_lore_YON:0 "The Sign\nA woven cane fish-trap, long and conical, with its mouth upward, in cane gold on lagoon green.\n\nThe trap is Yong's trap, the first fish-trap of the lagoon, woven to the pattern every Yong village still uses. At the swearing of the ring-council in 4A 902 each village brought one trap to the shrine stone of Yongrost and the elders wove them together into one, which hangs in the council house at Yongwa; the ring's banner shows the single trap that all the villages share.\n\nOne weaver's children: to the villages a promise that the lagoon is shared, and to anyone who would set the Yong against each other the warning that the ring remembers the burning.\n\nThe Roots\nAll the villages round the Yong lagoon carry the same name because, their elders say, they are all the children of one weaver. In their telling, long before Aen a canoe-builder named Yong came to the lagoon with his household and wove the first cane fish-trap in its shallows; his children each set their traps in a different reach of the lagoon and founded a village there, every village since has been Yong, and every trap is woven to his pattern. Villages of one name quarrel as only kin can, and for most of their history the Yong villages fought each other over the reaches where the traps were set. In 4A 899, the Year of the Red Wind, a quarrel over fish-traps burned three of the villages and the lagoon went unfished for a season. In 4A 902 the survivors swore a ring-council of the Yong elders on the shrine stone of Yongrost, so that the lagoon would never again be divided by fire, and the isles of Jingar and Torsor joined it in the same year. From Yong's trap and the burning come the ring's customs: every village keeps one trap that belongs to the ring and not to itself; the council speaks only when every elder agrees; and a quarrel over a reach is settled by weaving, not fighting, because the village whose trap catches more in a set season wins the reach. The ring carves shell, makes the islands' rope and nets and cuts shrine stone on Yongrost, and it fears its own feuds more than any foreign fleet."
 zin_realm_lore_ZOL:0 "The Sign\nBroken concentric rings in cold grey on a void-black field, each ring open on the same side: the sigil of the Will of Zol.\n\nThe sign first appears on an Aenoran chart of 1A 470, where a pilot of the northern voyages drew rings on flat water beside the name Zol's Mistake, broken where his pen lifted, as the mark of a sea that lay still and a coast where no bird followed the ships. When the Leren fishers came to the outer isles in 4A 230 they found the same figure laid on the black shore in stones, the burial rings of a people nobody remembers, each ring left open toward the north. Whose hand laid the first rings is not known, and the sign has no maker anyone can name: it belongs to the black north the way its silence does, and it is the sigil the charts and the courts give the Will of Zol, the emblem in whose name the realm is held.\n\nTo the living it means the open ring of the dead: what dies is owed to the Old God of Death and is not kept from him. Raised over the hosts of the black north it threatens that every grave in their path is open, and that what they take does not come back.\n\nThe Roots\nWhat built the black north is the oldest silence in Aoaz, and every people who tells of it tells only what it saw from the sea. Zol, the Old God of Death, came there long before Aen and Volgan, and the land was already black rock, ash and black frost when the first sailors of the north-west came near it; their oldest sea-words, older than any chart, have a word for that coast that means only the shore from which nothing comes back. No people of men ever lived on the mainland in any memory, so the Mistake has no founder, no first king, no oath and no tongue of its own, and nobody knows why it is called a Mistake. What the living of the north keep instead is a custom. On the outer isles, before any Leren fisher wintered there, someone laid the dead inside rings of black stones and left every ring open on its northern side, and the fishers who came in 4A 230 found those rings older than any record and took up the custom as their own: the dead belong to the Old God of Death, they say, and a closed ring would be a theft from him. From that one belief come all the rest: the first fish of every season left on the black shore, the silence and the low lamps on still nights, the name never spoken at sea, and the winter tale of Kusven, the grave-wind who serves the Old God of Death, which the shore folk tell as a warning and no court takes for more than a tale. In 4A 1748 the open rings are still laid on Peledor, Drolkot and Erinlor, and the sailors who chart the Rim still draw them beside the still sea, because nothing the world has learned about the black north in four ages is more than that."
