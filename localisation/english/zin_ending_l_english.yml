l_english:
 zin_chronicle_cp01_1:0 "The age began in peace, in the gilded years of a king who sold his offices."
 zin_chronicle_cp02_1:0 "A man woke in the ice of the Cold Lands."
 zin_chronicle_cp02_2:0 "The man in the ice woke at an hour no one had foretold."
 zin_chronicle_cp02_2_early:0 "The man in the ice woke early, before the world was ready for him."
 zin_chronicle_cp02_2_late:0 "The man in the ice woke late, when the world had stopped looking north."
 zin_chronicle_cp03_1:0 "The Truce of the Grey Ford broke, and the western clans remembered their old quarrels."
 zin_chronicle_cp03_2:0 "The Grey Ford truce held, and the clans kept their bows strung but quiet."
 zin_chronicle_cp04_1:0 "In the West he made a peace and laid a crown down."
 zin_chronicle_cp04_2:0 "Another hand made the western peace."
 zin_chronicle_cp04_3:0 "The West never knew him."
 zin_chronicle_cp05_1:0 "In Gaelor the Golden King died in his sleep, and Parim rang its bells for a day."
 zin_chronicle_cp05_2:0 "The Golden King did not die in the year the age foretold."
 zin_chronicle_cp05_2_exiled:0 "The Golden King lost his kingdom while he lived, and went on living in exile."
 zin_chronicle_cp05_2_natural:0 "The Golden King died in his bed in his own time, and no hand hastened him."
 zin_chronicle_cp05_2_revealed:0 "The Golden King did not die as the Council planned."
 zin_chronicle_cp06_1:0 "The temples laid the crown before [zin_loc_deliverer]."
 zin_chronicle_cp06_2:0 "Another camp took the seals of Parim."
 zin_chronicle_cp06_3:0 "No god took Aenor's crown."
 zin_chronicle_cp07_1:0 "Storms carried the stranger to the Islands of the South."
 zin_chronicle_cp08_1:0 "At Gala, Lorien named him Eindil, son of Ein."
 zin_chronicle_cp08_2:0 "He learned his name by another road."
 zin_chronicle_cp08_3:0 "Nobody named him."
 zin_chronicle_cp09_1:0 "At Yeldenne the guardian fell and gave Glo to [zin_loc_eindil]."
 zin_chronicle_cp09_2:0 "The hall of Yeldenne ended another way."
 zin_chronicle_cp09_3:0 "Glo never left the north."
 zin_chronicle_cp10_1:0 "He warned Aenor, and Aenor called him an impostor."
 zin_chronicle_cp10_2:0 "Aenor listened to him."
 zin_chronicle_cp11_1:0 "The War of the Last Crowns began."
 zin_chronicle_cp11_2:0 "The war of the crowns began on a day the chroniclers had not foretold."
 zin_chronicle_cp11_2_early:0 "The war of the crowns began early, before the chroniclers had finished their warnings."
 zin_chronicle_cp11_2_late:0 "The war of the crowns began late, after the chroniclers had grown tired of warning."
 zin_chronicle_cp12_1:0 "The North abandoned the old alliance."
 zin_chronicle_cp12_2:0 "The North kept, or broke, its oath in its own way."
 zin_chronicle_cp13_1:0 "The West crossed the wide sea."
 zin_chronicle_cp13_2:0 "The West did not cross as conquerors."
 zin_chronicle_cp14_1:0 "Eastern banners crossed the rift."
 zin_chronicle_cp14_2:0 "No eastern coalition crossed the rift."
 zin_chronicle_cp15_1:0 "Volgan retook Mirolon and marched north."
 zin_chronicle_cp15_2:0 "Mirolon held the passes."
 zin_chronicle_cp16_1:0 "The dead rose out of the north."
 zin_chronicle_cp16_2:0 "The dead rose at another hour, or not at all."
 zin_chronicle_cp16_3:0 "The north stayed silent."
 zin_chronicle_cp17_1:0 "The god-king fled east and was named King of the East; the world learned his name."
 zin_chronicle_cp17_1_plain:0 "[zin_loc_deliverer] stood in Parim instead."
 zin_chronicle_cp17_2:0 "[zin_loc_deliverer] stood in Parim instead."
 zin_chronicle_cp18_1:0 "Western armies took Parim."
 zin_chronicle_cp18_2:0 "Parim did not fall to the West."
 zin_chronicle_cp19_1:0 "On a dragon, with Varner and Golbran, came [zin_loc_eindil] back to the war."
 zin_chronicle_cp19_2:0 "In the quiet after, [zin_loc_eindil] came back to no battle."
 zin_chronicle_cp19_3:0 "The stranger did not come back."
 zin_chronicle_cp20_1:0 "Varner died shielding the living."
 zin_chronicle_cp21_1:0 "Volgan cast [zin_loc_eindil] down, and the New Gods raised him."
 zin_chronicle_cp22_1:0 "Volgan's body was broken by [zin_loc_eindil]."
 zin_chronicle_cp22_2:0 "Volgan's body was not broken."
 zin_chronicle_cp23_1:0 "Kusven, the grave-wind of the winter tales, came forth out of the black north, and Lorien died forcing him back."
 zin_chronicle_cp23_2:0 "Kusven, the grave-wind of the winter tales, came forth out of the black north and withdrew without the death of the King of Gala."
 zin_chronicle_cp24_1:0 "Afrit came back from the East and cast his brother from a cliff."
 zin_chronicle_cp24_1_plain:0 "The stranger's trial came in another shape."
 zin_chronicle_cp24_1_revealed:0 "The second betrayal went another way."
 zin_chronicle_cp24_2:0 "The stranger's trial came in another shape."
 zin_chronicle_cp24_2_revealed:0 "The second betrayal went another way."
 zin_chronicle_cp25_1:0 "In the palace the false god was stripped and killed; Golbran died saving [zin_loc_eindil]."
 zin_chronicle_cp25_1_plain:0 "The palace held against [zin_loc_eindil]."
 zin_chronicle_cp25_2:0 "The palace held against [zin_loc_eindil]."
 zin_chronicle_cp26_1:0 "Eindil, son of Ein, was crowned King of Aenor."
 zin_chronicle_cp26_3:0 "No king of Aen's line was crowned."
 zin_chronicle_heading_0:0 "The Fourth Age ended on [GetDateText]."
 zin_chronicle_heading_1:0 "The Fourth Age ended on [GetDateText]: the Lost Cause prevailed."
 zin_chronicle_heading_2:0 "The Fourth Age ended on [GetDateText]: the children of Volgan inherited a ruined world."
 zin_chronicle_heading_3:0 "The Fourth Age ended on [GetDateText]: the Ashen Throne was raised."
 zin_chronicle_heading_4:0 "The Fourth Age ended on [GetDateText]: the Golden Court endured."
 zin_chronicle_heading_5:0 "The Fourth Age ended on [GetDateText]: a western crown held Parim."
 zin_chronicle_heading_6:0 "The Fourth Age ended on [GetDateText]: Lerendor became master of the strait."
 zin_chronicle_heading_7:0 "The Fourth Age ended on [GetDateText]: the East was gathered under one crown."
 zin_chronicle_heading_8:0 "On [GetDateText] the chroniclers closed the Fourth Age unfinished: no crown had ended it."
 zin_chronicle_meter:0 "The Gathering Dark stood at [?global.zin_gathering_dark|0] of a hundred."
 zin_chronicle_none:0 "§!"
