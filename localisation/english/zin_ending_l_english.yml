 zin_chronicle_unknown_:0 "What the Fifth Age will be, no chronicle of this age can say."
 zin_chronicle_unknown_v:0 "What remains of Volgan, and what the Fifth Age will be, no chronicle of this age can say."
 zin_chronicle_unknown_vz:0 "What remains of Volgan, what the Old God keeps in the dark, and what the Fifth Age will be, no chronicle of this age can say."
 zin_chronicle_unknown_z:0 "What the Old God keeps in the dark, and what the Fifth Age will be, no chronicle of this age can say."
 zin_cost_all:0 "[zin_loc_cost_dead][zin_loc_cost_zol][zin_loc_cost_volgan][zin_loc_cost_necklace]"
 zin_cost_dead_1:0 " Lorien did not live to see it."
 zin_cost_dead_10:0 " Varner and Golbran did not live to see it."
 zin_cost_dead_11:0 " Lorien, Varner and Golbran did not live to see it."
 zin_cost_dead_12:0 " Horos and Golbran did not live to see it."
 zin_cost_dead_13:0 " Lorien, Horos and Golbran did not live to see it."
 zin_cost_dead_14:0 " Varner, Horos and Golbran did not live to see it."
 zin_cost_dead_15:0 " Lorien, Varner, Horos and Golbran did not live to see it."
 zin_cost_dead_2:0 " Varner did not live to see it."
 zin_cost_dead_3:0 " Lorien and Varner did not live to see it."
 zin_cost_dead_4:0 " Horos did not live to see it."
 zin_cost_dead_5:0 " Lorien and Horos did not live to see it."
 zin_cost_dead_6:0 " Varner and Horos did not live to see it."
 zin_cost_dead_7:0 " Lorien, Varner and Horos did not live to see it."
 zin_cost_dead_8:0 " Golbran did not live to see it."
 zin_cost_dead_9:0 " Lorien and Golbran did not live to see it."
 zin_cost_necklace:0 " The king wears the Necklace of the Abyss, and its price is not yet known."
 zin_cost_volgan:0 " Volgan's body was broken; what remains of him, no one can say."
 zin_cost_zol:0 " The dead of the black north were driven back, not destroyed."
 zin_ending_dues_paid:0 "Dues Paid at the Chain"
 zin_ending_dues_resented:0 "Dues Resented"
 zin_ending_envoys_south:0 "Envoys in Nafeher"
 zin_ending_gifts_to_parim:0 "Gifts to Parim"
 zin_ending_homage_paid:0 "Homage Paid"
 zin_ending_homage_refused:0 "Homage Refused"
 zin_ending_old_claims:0 "Old Claims Remembered"
 zin_ending_open_roads:0 "Open Roads"
 zin_ending_temple_paid:0 "The Temples Were Paid"
 zin_ending_temple_refused:0 "The Temples Were Refused"
 zin_ending_treaty_of_equals:0 "Treaty Among Equals"
 zin_ending.1.d:0 "Chroniclers say the Fourth Age is ending. They do not agree how, and they have begun to quarrel in the margins of one another's pages."
 zin_ending.1.opt1:0 "Then let us write its last page."
 zin_ending.1.opt1_tip1:0 "The ends still open to the age:[zin_loc_endings_possible]"
 zin_ending.1.t:0 "The Age Draws to Its Close"
 zin_ending.10.d:0 "The king's council asks what Aenor shall ask of the crowns that fought beside it. He answers: nothing they did not offer."
 zin_ending.10.opt1:0 "Treaties, not conquest."
 zin_ending.10.opt2:0 "Let them come to us."
 zin_ending.10.t:0 "No Crown Over Crowns"
 zin_ending.11.d:0 "Parim offers a treaty of mutual defence between equals. It claims no land and no oath of service. In this telling of the age, the crowns may sign or not."
 zin_ending.11.opt1:0 "Sign as equals."
 zin_ending.11.opt2:0 "We keep our own counsel."
 zin_ending.11.t:0 "A Treaty Among Equals"
 zin_ending.12.d:0 "The war is over. The old claims are not. Our court remembers what Aenor was before the heir, and what it may be after him."
 zin_ending.12.opt1:0 "Remember."
 zin_ending.12.opt2:0 "Let the next age judge."
 zin_ending.12.t:0 "Grievances Remain"
 zin_ending.13.d:0 "The king remembers who nursed a stranger from the ice, who made peace beside him, who sheltered him when he was hunted."
 zin_ending.13.opt1:0 "We remember too."
 zin_ending.13.opt1_tip1:0 "The crown has already named your court among the First Friends of the King."
 zin_ending.13.t:0 "First Friends of the King"
 zin_ending.14.d:0 "The king still wears the necklace he took from his brother. He does not speak of it, and nobody asks him to."
 zin_ending.14.opt1:0 "Nobody asks."
 zin_ending.14.t:0 "The Necklace at His Throat"
 zin_ending.15.d:0 "The Houses of the First Light still keep grain and hospitals. Their god is dead. In this telling of the age, each crown must decide what they are now."
 zin_ending.15.opt1:0 "Keep them as the crown's hospitals."
 zin_ending.15.opt2:0 "Close them."
 zin_ending.15.opt3:0 "Let them go on as they are."
 zin_ending.15.t:0 "The Houses Without a God"
 zin_ending.2.d:0 "If no crown has ended the age by the first day of 4A 1762, the chroniclers will judge it by what each crown holds. They have already begun to count."
 zin_ending.2.opt1:0 "A year remains."
 zin_ending.2.opt1_tip1:0 "What the chroniclers will weigh:[zin_loc_outcomes_possible]"
 zin_ending.2.t:0 "The Last Year of Judgement"
 zin_ending.20.d:0 "The lords of the Dominion kneel in the hall of Nafeher. The world is his, as he always said it would be once men divided."
 zin_ending.20.opt1:0 "Let the clients rule in my name."
 zin_ending.20.opt2:0 "Let them fear."
 zin_ending.20.t:0 "The Court of Nafeher"
 zin_ending.21.d:0 "Our crown is a gift of Nafeher now. Our people have stopped asking whose."
 zin_ending.21.opt1:0 "Serve."
 zin_ending.21.t:0 "A Client Crown"
 zin_ending.22.d:0 "Parim belongs to the south. Those of Aen's kingdom who still fight do so from the hills and the lakes."
 zin_ending.22.opt1:0 "Fight on from the hills."
 zin_ending.22.opt2:0 "Seek terms with Nafeher."
 zin_ending.22.t:0 "The Dark Over Parim"
 zin_ending.23.d:0 "The trade roads are empty and the harbours are full of people who have nowhere to go. Every court is learning how little a crown is worth without a market."
 zin_ending.23.opt1:0 "Endure."
 zin_ending.23.opt2:0 "Send envoys south."
 zin_ending.23.t:0 "A Ruined World"
 zin_ending.3.d:0 "Volgan's hosts hold Parim, and his client crowns are many. If nothing changes, the world will be his."
 zin_ending.3.opt1:0 "Not while we stand."
 zin_ending.3.t:0 "Shadows Over Parim"
 zin_ending.30.d:0 "The council asks how the King of All Aoaz will rule a world that knows his name."
 zin_ending.30.opt1:0 "As a god."
 zin_ending.30.opt2:0 "As a king; let them forget the rest."
 zin_ending.30.t:0 "The Worshipped King"
 zin_ending.31.d:0 "Our councillors owe the temples of Afrit favours older than our grandfathers. Now the temples ask openly."
 zin_ending.31.opt1:0 "Pay it."
 zin_ending.31.opt2:0 "Refuse it."
 zin_ending.31.t:0 "The Temple Asks Its Due"
 zin_ending.32.d:0 "A false god rules the old kingdom of Aen. Our court must decide whether to bow, or to wait."
 zin_ending.32.opt1:0 "Close our borders to his priests."
 zin_ending.32.opt2:0 "Send gifts and keep our counsel."
 zin_ending.32.t:0 "The Ash Settles"
 zin_ending.4.d:0 "Afrit holds Parim, and too many crowns owe him their councils. If the palace is not taken, the age will end in ash."
 zin_ending.4.opt1:0 "Not while we stand."
 zin_ending.4.t:0 "The Ash Gathers"
 zin_ending.40.d:0 "The old King holds a feast for the end of the war. He laughs louder than anyone, and the candles of the Golden Court burn until dawn."
 zin_ending.40.d_exposed:0 "The old King holds a feast for the end of the war, and he laughs louder than anyone. He eats nothing his tasters have not touched."
 zin_ending.40.opt1:0 "Another feast, another year."
 zin_ending.40.t:0 "The King's Long Feast"
 zin_ending.41.d:0 "The King reigns. The Council governs. Nobody outside this room knows the difference."
 zin_ending.41.opt1:0 "So it has been, and so it will be."
 zin_ending.41.t:0 "The Temples and the King"
 zin_ending.50.d:0 "Our captains govern the oldest city of men. They do not know the language of its prayers."
 zin_ending.50.opt1:0 "Rule it as conquerors."
 zin_ending.50.opt2:0 "Rule it as guests."
 zin_ending.50.t:0 "Governors of the Old Kingdom"
 zin_ending.51.d:0 "The kingdom has lost its capital to the West. The Concord meets in exile, and the empty chair of the Speaker is turned to face the lake."
 zin_ending.51.opt1:0 "We will take it back."
 zin_ending.51.t:0 "Aenor Beyond Parim"
 zin_ending.60.d:0 "The harbour chain of Sonargur is raised for every ship. The toll of 4A 1716 is paid a thousand times over."
 zin_ending.60.opt1:0 "Long live the Sovereign."
 zin_ending.60.t:0 "The Chain at Sonargur"
 zin_ending.61.d:0 "Our ships pay Lerendor's dues now, in the same coin and at the same quay that once humbled its envoys."
 zin_ending.61.opt1:0 "Pay."
 zin_ending.61.opt2:0 "Resent it."
 zin_ending.61.t:0 "Northern Dues"
 zin_ending.70.d:0 "Every caravan from the rift to the deep sand pays one treasury."
 zin_ending.70.opt1:0 "Lower the tolls."
 zin_ending.70.opt2:0 "Raise them."
 zin_ending.70.t:0 "Master of All Roads"
 zin_ending.71.d:0 "The High King's envoys ask for homage. They have brought the old words, and a very large chair."
 zin_ending.71.opt1:0 "Pay homage."
 zin_ending.71.opt2:0 "Refuse."
 zin_ending.71.t:0 "Homage to the High King"
 zin_ending.80.d:0 "The heir is gone. The league he gathered is still in the field, and the dark has not gone home."
 zin_ending.80.opt1:0 "Fight on."
 zin_ending.80.opt1_tip1:0 "A worthy crown may seek Glo as its bearer."
 zin_ending.80.t:0 "The League Without the Heir"
 zin_list_outcome_eastern:0 "\n§YOne king in the East§!: the caravan roads answer to one crown."
 zin_list_outcome_golden:0 "\n§YThe Golden Court endures§!: the Golden King still reigns."
 zin_list_outcome_strait:0 "\n§YMaster of the Strait§!: Lerendor holds both shores."
 zin_list_outcome_western:0 "\n§YA western crown in Parim§!: western banners hold the city."
 zin_list_outcomes:0 "[zin_loc_list_outcome_golden][zin_loc_list_outcome_western][zin_loc_list_outcome_strait][zin_loc_list_outcome_eastern][zin_loc_list_outcome_none]"
 zin_list_outcomes_none:0 "\nNo outcome holds yet."
 zin_list_possible:0 "[zin_loc_list_possible_lost_cause][zin_loc_list_possible_children][zin_loc_list_possible_ashen]"
 zin_list_possible_ashen:0 "\n§YThe Ashen Throne§!: Afrit's temples ruling from Parim."
 zin_list_possible_children:0 "\n§YChildren of Volgan§!: the Great Spirit's hosts holding Parim."
 zin_list_possible_lost_cause:0 "\n§YThe Lost Cause§!: the heir of Aen crowned in Parim."
 zin_world.100.d:0 "The Fourth Age ends with a king of Aen's line on the throne of Aenor. The Lost Cause that a vain king founded for his own glory has become something else: the league of the living, who stood together against the dark and asked no crown to kneel. The Middle Lands lie in ruins. [zin_loc_ending_lost_cause_cost]"
 zin_world.100.opt1:0 "So ends the Fourth Age."
 zin_world.100.opt2:0 "So ends the Fourth Age."
 zin_world.100.t:0 "The Lost Cause"
 zin_world.101.d:0 "In this telling of the age, the Great Spirit of the Ember Lands rules a ruined world. His grave hosts stand on the plains of the Middle Lands, his client crowns kneel in their halls, and the monsters of the south walk where the kingdoms of men were."
 zin_world.101.opt1:0 "So ends the Fourth Age."
 zin_world.101.opt2:0 "So ends the Fourth Age."
 zin_world.101.t:0 "Children of Volgan"
 zin_world.102.d:0 "In this telling of the age, Afrit, son of Ein, who was worshipped as the Deliverer, rules from Parim. His temples are full. His council sits in every court that owes it favours. Those who know what he is keep silent, or are silenced."
 zin_world.102.opt1:0 "So ends the Fourth Age."
 zin_world.102.opt2:0 "So ends the Fourth Age."
 zin_world.102.t:0 "The Ashen Throne"
 zin_world.103.d:0 "In this telling of the age, the Golden King still reigns in Parim. The feasts go on. Whatever the war took from the world, the Golden Court kept its gold."
 zin_world.103.opt1:0 "So ends the Fourth Age."
 zin_world.103.opt2:0 "So ends the Fourth Age."
 zin_world.103.t:0 "The Golden Court Endures"
 zin_world.104.d:0 "In this telling of the age, western banners still fly over Parim. The old quarrel of the West and Aenor has ended the other way round."
 zin_world.104.opt1:0 "So ends the Fourth Age."
 zin_world.104.opt2:0 "So ends the Fourth Age."
 zin_world.104.t:0 "A Western Crown in Parim"
 zin_world.105.d:0 "In this telling of the age, Lerendor is Sovereign of the Narrow Sea. Every ship that crosses between the North and the Middle Lands pays Sonargur's dues."
 zin_world.105.opt1:0 "So ends the Fourth Age."
 zin_world.105.opt2:0 "So ends the Fourth Age."
 zin_world.105.t:0 "Master of the Strait"
 zin_world.106.d:0 "In this telling of the age, the East has one king, and no temple raised him. The caravan roads answer to one crown."
 zin_world.106.d_revealed:0 "In this telling of the age, the East has one king, and he is not the false god. The caravan roads answer to one crown."
 zin_world.106.opt1:0 "So ends the Fourth Age."
 zin_world.106.opt2:0 "So ends the Fourth Age."
 zin_world.106.t:0 "One King in the East"
 zin_world.107.d:0 "No crown ended the Fourth Age. The chroniclers leave the last pages blank, for someone else to write."
 zin_world.107.opt1:0 "So it continues."
 zin_world.107.t:0 "The Age Unfinished"
 zin_world.110.d:0 "[zin_loc_chronicle_heading]\n\n[zin_loc_chronicle_p1]\n[zin_loc_chronicle_p2]\n[zin_loc_chronicle_p3]\n[zin_loc_chronicle_p4]\n[zin_loc_chronicle_p5]\n\n[zin_loc_chronicle_meter]\n\n[zin_loc_chronicle_unknown]"
 zin_world.110.opt1:0 "Let the chronicle stand."
 zin_world.110.t:0 "The Chronicle of the Age"
 zin_world.111.d:0 "The chroniclers have set down what became of your crown.\n\n[zin_loc_your_part]"
 zin_world.111.opt1:0 "So ends my part."
 zin_world.111.t:0 "Your Part in the Age"
 zin_world.112.d:0 "The Fourth Age is over, but the world is not. The chroniclers will keep their pens until 4A 1800, and no other ending will be judged."
 zin_world.112.opt1:0 "Let the world go on."
 zin_world.112.t:0 "The Age Has Turned"
 zin_your_part_coalition:0 "Your banners stood with the heir when it mattered."
 zin_your_part_fallen:0 "Your realm did not see the end of the war as a free crown."
 zin_your_part_friend:0 "The king will remember what you did for a stranger."
 zin_your_part_hermitage:0 "The hermitage outlived its god."
 zin_your_part_holder_ashen:0 "The age ended in your hands. The temples are full, the council sits in every court, and your name is spoken as a god's."
 zin_your_part_holder_children:0 "The age ended in your hands. The grave hosts hold the plains, and the clients kneel in your name."
 zin_your_part_holder_eastern:0 "The age ended in your hands. One crown rules the caravan roads, and it is yours."
 zin_your_part_holder_golden:0 "The age ended in your hands. The feasts go on in Parim, and the gold has not run out."
 zin_your_part_holder_lost_cause:0 "The age ended in your hands. You crowned the king the league fought for, and asked no crown to kneel."
 zin_your_part_holder_strait:0 "The age ended in your hands. No ship crosses the Narrow Sea without passing your chain."
 zin_your_part_holder_western:0 "The age ended in your hands. Your banners hold the oldest city of men."
 zin_your_part_knelt:0 "You knelt. History will remember to whom."
 zin_your_part_other:0 "Your realm lived through the end of an age."
 zin_your_part_zol:0 "The north keeps its counsel. The dead are patient."
