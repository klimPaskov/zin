l_english:
 zin_shared_dark_lands_a_chief_at_cocanoor:0 "A Chief at Cocanoor"
 zin_shared_dark_lands_a_chief_at_cocanoor_desc:0 "A trusted elder of [ROOT.GetName] takes a seat in the lower hall at Cocanoor, where he hears everything and says as little as he can. The hold gains a voice in the councils of the one that rules it."
 zin_shared_dark_lands_accord_kin:0 "Axes for the Accord"
 zin_shared_dark_lands_accord_kin_desc:0 "Axes marked with the hold's sign and the rune of the shared oath arm the Accord's muster."
 zin_shared_dark_lands_accord_oath:0 "Sworn to the Accord"
 zin_shared_dark_lands_answer_the_moot:0 "Answer the Moot"
 zin_shared_dark_lands_answer_the_moot_desc:0 "The Free Moot has been called, and its horn is heard across the hills. The chief of [ROOT.GetName] rides to the stone with his best warriors and swears to answer the next summons."
 zin_shared_dark_lands_axes_for_the_accord:0 "Axes for the Accord"
 zin_shared_dark_lands_axes_for_the_accord_desc:0 "The smiths of [ROOT.GetName] turn out a hundred axes for the muster of the Accord, each marked with the hold's sign and a rune of the shared oath. The warriors who carry them say they feel lighter in the hand."
 zin_shared_dark_lands_beach_fires:0 "Fire on the Beaches"
 zin_shared_dark_lands_beach_fires_desc:0 "Pitch and brushwood are heaped on the strand and lit when the dead come ashore."
 zin_shared_dark_lands_bear_the_yoke:0 "Bear the Yoke"
 zin_shared_dark_lands_bear_the_yoke_desc:0 "The chief of [ROOT.GetName] kneels at the foot of the black seat and swears to bear the yoke without complaint. Goldoroth is pleased, and the hold learns what comes after pleasing an iron master."
 zin_shared_dark_lands_black_iron_seams:0 "Black Iron Seams"
 zin_shared_dark_lands_black_iron_seams_desc:0 "Miners follow the black seams deeper into the hills, and the smiths learn to work the harder ore. The hold gains axe-heads for its warbands and a surplus to trade."
 zin_shared_dark_lands_black_sail_watch:0 "Watch for Black Sails"
 zin_shared_dark_lands_black_sail_watch_desc:0 "Lookouts crouch on every headland with horns and tarred torches."
 zin_shared_dark_lands_brutes_and_axes:0 "Brutes and Axes"
 zin_shared_dark_lands_brutes_and_axes_desc:0 "The big warriors of Dondor and the axe-bands of [ROOT.GetName] drill side by side on the same field. They learn each other's signals, and the Accord gains a line that neither could form alone."
 zin_shared_dark_lands_brutes_and_axes_spirit:0 "Brutes and Axes"
 zin_shared_dark_lands_brutes_and_axes_spirit_desc:0 "Dondor's big warriors and the hold's axe-bands drill side by side on the same field."
 zin_shared_dark_lands_call_the_moot:0 "Call the Moot"
 zin_shared_dark_lands_call_the_moot_desc:0 "Messengers ride out from [ROOT.GetName] to every free hold, bearing a carved stick as the summons. If enough chiefs answer, the Free Moot will meet, and Cocanoor will have to take notice."
 zin_shared_dark_lands_chief_at_cocanoor:0 "A Chief at Cocanoor"
 zin_shared_dark_lands_chief_at_cocanoor_desc:0 "A trusted elder sits in the lower hall at Cocanoor, hearing everything and saying little."
 zin_shared_dark_lands_chiefs_fire:0 "One Chief, One Fire"
 zin_shared_dark_lands_chiefs_fire_desc:0 "The lesser fires are put out and one hearth burns. Every warrior who eats by it answers to the one who feeds it."
 zin_shared_dark_lands_clan_meet:0 "The Clan-Meet"
 zin_shared_dark_lands_clan_meet_desc:0 "Every clan sends a speaker to the meet, and each is heard in turn around the fire."
 zin_shared_dark_lands_dark_sea_fishers:0 "Fishers of the Dark Sea"
 zin_shared_dark_lands_dark_sea_fishers_desc:0 "Hide boats put out in the pale morning, and the nets come back heavy."
 zin_shared_dark_lands_dark_sea_traders:0 "The Swing of the Dark Seas"
 zin_shared_dark_lands_dark_sea_traders_desc:0 "Whoever holds the harbours of the Dark Sea holds the balance, and the hold is in no hurry to choose."
 zin_shared_dark_lands_dead_on_our_shore:0 "Dead on Our Shore"
 zin_shared_dark_lands_dead_on_our_shore_desc:0 "Black hulls grind onto the shingle and grey shapes wade out of the surf. The watchers of [ROOT.GetName] light every beacon and run for the hall."
 zin_shared_dark_lands_every_clan:0 "Every Clan a Voice"
 zin_shared_dark_lands_every_clan_a_voice:0 "Every Clan a Voice"
 zin_shared_dark_lands_every_clan_a_voice_desc:0 "Each clan of [ROOT.GetName] keeps its own fire and its own right to speak, and the chief is first among equals. The hold is slower to decide and much harder to break."
 zin_shared_dark_lands_every_clan_desc:0 "Each clan keeps its own fire and its own right to speak, and the chief is first among equals."
 zin_shared_dark_lands_feast_of_the_hold:0 "Feast of the Hold"
 zin_shared_dark_lands_feast_of_the_hold_desc:0 "Whole boars turn on spits, ale is rolled in by the barrel and the warriors beat their shields until the rafters ring. It is the one night of the year that nobody counts what the hold can afford."
 zin_shared_dark_lands_fire_on_the_beaches:0 "Fire on the Beaches"
 zin_shared_dark_lands_fire_on_the_beaches_desc:0 "Pitch and brushwood are heaped along the strand and set alight as the dead come ashore. Fire breaks their shapes. It does not end them."
 zin_shared_dark_lands_fishers_of_the_dark_sea:0 "Fishers of the Dark Sea"
 zin_shared_dark_lands_fishers_of_the_dark_sea_desc:0 "Hide-covered boats put out in the pale morning, and the nets come back heavy with strange silver fish. The fishers of [ROOT.GetName] know the Dark Sea's moods and do not trust its calm."
 zin_shared_dark_lands_forge_pits_of_the_hold:0 "Forge-Pits of [ROOT.GetName]"
 zin_shared_dark_lands_forge_pits_of_the_hold_desc:0 "Pits are dug near the iron seams and lined with clay, and the bellows-men work in shifts through day and night. The axes that come out of them are heavy, crude and very hard to blunt."
 zin_shared_dark_lands_gifts_returned:0 "Gifts Returned"
 zin_shared_dark_lands_hall_of_the_hold:0 "The Hall of [ROOT.GetName]"
 zin_shared_dark_lands_hall_of_the_hold_desc:0 "A long timber hall with a fire-pit down its length, benches worn smooth by generations of elbows, and a chief's seat that has never been moved. Here [ROOT.GetName] decides what to be, and the decision starts with who speaks first."
 zin_shared_dark_lands_harbour_of_the_hold:0 "Harbour of [ROOT.GetName]"
 zin_shared_dark_lands_harbour_of_the_hold_desc:0 "A stone mole is built out into the water and a chain is slung between its tower and the shore. For the first time [ROOT.GetName] has a harbour that a fleet could shelter in."
 zin_shared_dark_lands_hearth_speakers:0 "The Hearth Speakers"
 zin_shared_dark_lands_hearth_speakers_desc:0 "Elders and matrons who tend the sacred fire speak first in the council of [ROOT.GetName]. Warriors still carry the axes, but the speakers carry the law."
 zin_shared_dark_lands_hearth_speakers_spirit:0 "The Hearth Speakers"
 zin_shared_dark_lands_hearth_speakers_spirit_desc:0 "Elders and matrons who tend the sacred fire speak first in council."
 zin_shared_dark_lands_heralds:0 "Heralds of the South"
 zin_shared_dark_lands_heralds_desc:0 "Black-robed heralds sit in the place of honour and speak of a new future."
 zin_shared_dark_lands_heralds_of_the_south:0 "Heralds of the South"
 zin_shared_dark_lands_heralds_of_the_south_desc:0 "Black-robed heralds from the south are given a place of honour in the hall of [ROOT.GetName]. They bring promises, banners and a new way of speaking about the future, and the young warriors listen closely."
 zin_shared_dark_lands_herds_of_the_hills:0 "Herds of the Hills"
 zin_shared_dark_lands_herds_of_the_hills_desc:0 "Shaggy cattle and horned goats graze the high pastures under the eye of young herders. A hold that can feed itself without raiding is a hold that is hard to starve."
 zin_shared_dark_lands_hide_and_reed_boats:0 "Hide and Reed Boats"
 zin_shared_dark_lands_hide_and_reed_boats_desc:0 "Boat-builders learn to stretch hides over willow ribs and to bind reeds into long, shallow hulls. They are light and cheap, and a raiding fleet of them can cross a strait in a night."
 zin_shared_dark_lands_hill_herds:0 "Herds of the Hills"
 zin_shared_dark_lands_hill_herds_desc:0 "Shaggy cattle and horned goats graze the high pastures, and no hold member goes hungry."
 zin_shared_dark_lands_hills_with_beacons:0 "Beacons on Our Hills"
 zin_shared_dark_lands_hills_with_beacons_desc:0 "Piles of tarred wood are stacked on the highest ridges of [ROOT.GetName], and a watcher sleeps beside each. When the first beacon lights, the whole coast will know within the hour."
 zin_shared_dark_lands_hold_kin:0 "Kin of the Free Holds"
 zin_shared_dark_lands_hold_market:0 "A Market for the Holds"
 zin_shared_dark_lands_hold_market_desc:0 "Iron for hides and salt for ale: the neighbouring holds trade here on neutral ground."
 zin_shared_dark_lands_hold_provides:0 "The Hold Provides"
 zin_shared_dark_lands_hold_provides_desc:0 "Pits, herds and market work together, and the hold needs nothing it cannot make."
 zin_shared_dark_lands_hold_raiders:0 "Raiders of the Hold"
 zin_shared_dark_lands_hold_raiders_desc:0 "Fast riders slip out at night to burn camps and cut supply lines."
 zin_shared_dark_lands_hold_the_hall:0 "Hold the Hall"
 zin_shared_dark_lands_hold_the_hall_desc:0 "Warriors dig in behind the hall's thick walls and fill the gateway with timber and stone. They will fight for every doorway, because after the hall there is nowhere else to go."
 zin_shared_dark_lands_hold_the_hall_spirit:0 "Hold the Hall"
 zin_shared_dark_lands_hold_the_hall_spirit_desc:0 "Warriors dig in behind the thick walls and fight for every doorway."
 zin_shared_dark_lands_knife_runners:0 "Knife-Runners"
 zin_shared_dark_lands_knife_runners_desc:0 "Lithe scouts with long knives and short tempers range far ahead of the warbands, cutting throats and burning storehouses before the enemy has seen a banner. They are not much to look at, and they are never where they are expected."
 zin_shared_dark_lands_long_memory:0 "The Long Memory"
 zin_shared_dark_lands_long_memory_desc:0 "The elders teach the young what the south has done before, and the hold is harder to fool."
 zin_shared_dark_lands_market_of_the_holds:0 "A Market for the Holds"
 zin_shared_dark_lands_market_of_the_holds_desc:0 "Once a season the neighbouring holds meet on neutral ground to trade iron for hides and salt for ale. [ROOT.GetName] sets up its stalls early and haggles hardest."
 zin_shared_dark_lands_no_master_but_our_own:0 "No Master but Our Own"
 zin_shared_dark_lands_no_master_but_our_own_desc:0 "Cocanoor sends gifts and flattering messengers, and the chief of [ROOT.GetName] sends them home with a clear reply: the hold answers to nobody who has not shared its fire. The hold grows prouder and harder to bend."
 zin_shared_dark_lands_oath_of_the_accord:0 "The Oath of the Accord"
 zin_shared_dark_lands_oath_of_the_accord_desc:0 "Chiefs of the Dark Sea Accord drink from one horn and swear to answer each other's fires. [ROOT.GetName] takes the oath beside Dondor's Brutes, and the horn is passed back with a nod."
 zin_shared_dark_lands_ogre_chiefs:0 "Ogre Chiefs"
 zin_shared_dark_lands_ogre_chiefs_desc:0 "The big folk of the hills send their chiefs to the hall to sit among the warriors and drink their ale. They are loud, proud and fearfully strong, and they respect nothing but a stronger fist."
 zin_shared_dark_lands_ogre_chiefs_spirit:0 "Ogre Chiefs"
 zin_shared_dark_lands_ogre_chiefs_spirit_desc:0 "The big folk of the hills sit among the warriors, loud, proud and strong."
 zin_shared_dark_lands_one_chief_one_fire:0 "One Chief, One Fire"
 zin_shared_dark_lands_one_chief_one_fire_desc:0 "The fire-pits of the lesser clans are put out, and their embers carried to the chief's hearth. In [ROOT.GetName] one fire burns, and every warrior who eats by it answers to the one who feeds it."
 zin_shared_dark_lands_proud_hall:0 "The Proud Hall"
 zin_shared_dark_lands_proud_hall_desc:0 "Banners hang from every beam and the doors are carved with victories. This hall cannot be bought."
 zin_shared_dark_lands_raiders_of_the_hold:0 "Raiders of the Hold"
 zin_shared_dark_lands_raiders_of_the_hold_desc:0 "Fast riders slip out of the hills at night to burn camps and cut supply lines. The enemy never knows where the next blow will fall, and the hold gains a reputation it will not soon lose."
 zin_shared_dark_lands_return_cocanoors_gifts:0 "Return Cocanoor's Gifts"
 zin_shared_dark_lands_return_cocanoors_gifts_desc:0 "Chests of silver and bundles of fine furs are carried back to Cocanoor with their seals unbroken. Such an insult will not be forgotten, but nobody in [ROOT.GetName] can say they owe Goldoroth a thing."
 zin_shared_dark_lands_send_them_back_south:0 "Send Them Back South"
 zin_shared_dark_lands_send_them_back_south_desc:0 "The chief of [ROOT.GetName] returns the strangers' gifts and sends them back down the road with a warning. A hold that keeps its own counsel does not need the favour of far-off masters."
 zin_shared_dark_lands_slag_roads:0 "Roads of Slag"
 zin_shared_dark_lands_slag_roads_desc:0 "The waste of the forge-pits is packed into the mud, and the cart-tracks of [ROOT.GetName] harden into black roads that do not wash out in spring. Wagons of ore and hides roll where only mules went before."
 zin_shared_dark_lands_slip_the_yoke:0 "Slip the Yoke"
 zin_shared_dark_lands_slip_the_yoke_desc:0 "When Cocanoor looks away, the hold of [ROOT.GetName] stops sending its tithe and quietly sharpens its axes. The yoke is not broken, only loosened, and it will be a long time before Goldoroth can tighten it again."
 zin_shared_dark_lands_south_refused:0 "Envoys Turned Away"
 zin_shared_dark_lands_speak_at_the_moot_stone:0 "Speak at the Moot Stone"
 zin_shared_dark_lands_speak_at_the_moot_stone_desc:0 "A great flat stone stands in a hollow of the hills where free holds meet to speak. [ROOT.GetName] sends its chief to stand on it and say who the hold is and who it is not."
 zin_shared_dark_lands_spoils_from_the_south:0 "Spoils from the South"
 zin_shared_dark_lands_spoils_from_the_south_desc:0 "The strangers speak of a war in the north that will shake every hold and of spoils for those who march. The hold of [ROOT.GetName] takes their iron, listens to their promises and wonders what the price will be."
 zin_shared_dark_lands_strangers_from_the_south:0 "Strangers from the South"
 zin_shared_dark_lands_strangers_from_the_south_desc:0 "Riders in dark mail come up the coast road with gifts and fair words. They are courteous, they pay for what they take, and they ask a great many questions about the hold and its neighbours."
 zin_shared_dark_lands_swing_of_the_dark_seas:0 "The Swing of the Dark Seas"
 zin_shared_dark_lands_swing_of_the_dark_seas_desc:0 "Whoever holds the harbours of the Dark Sea holds the balance between the powers that fear and use it. [ROOT.GetName] is courted by all sides and is in no hurry to choose."
 zin_shared_dark_lands_the_chiefs_word:0 "The Chief's Word"
 zin_shared_dark_lands_the_chiefs_word_desc:0 "The chief of [ROOT.GetName] says what the hold will do, and the hold does it. A hall that has one voice can move fast, and fast is sometimes all that keeps a hold alive."
 zin_shared_dark_lands_the_clan_meet:0 "The Clan-Meet"
 zin_shared_dark_lands_the_clan_meet_desc:0 "Every clan sends a speaker to the meet, and each is heard in turn around the fire. The talk is long and loud, but nobody leaves the hall with a grievance he did not get to shout."
 zin_shared_dark_lands_the_great_hall:0 "The Great Hall of [ROOT.GetName]"
 zin_shared_dark_lands_the_great_hall_desc:0 "Beams are cut from the black pines of the hills, and the roof is raised in a single day by every hand in the hold. When the last rafter is set, the hall of [ROOT.GetName] can seat a thousand and is known for a hundred miles."
 zin_shared_dark_lands_the_hall_answers_no_one:0 "The Hall Answers No One"
 zin_shared_dark_lands_the_hall_answers_no_one_desc:0 "The old chiefs say it plainly: no crown, no warlord and no lord of the south will give orders in this hall. Warriors sharpen their axes and wait for anyone fool enough to test the claim."
 zin_shared_dark_lands_the_hold_at_war:0 "[ROOT.GetName] at War"
 zin_shared_dark_lands_the_hold_at_war_desc:0 "War has come to the hold, and every axe is taken from the wall. Women bank the forges, children carry water and the chief orders the beacons lit."
 zin_shared_dark_lands_the_hold_provides:0 "The Hold Provides"
 zin_shared_dark_lands_the_hold_provides_desc:0 "The pits, the herds and the market work together, and the hold has what it needs without begging from anyone. Chiefs of larger realms start to say that [ROOT.GetName] is not worth the trouble of taking."
 zin_shared_dark_lands_the_holds_peace:0 "The Hold's Peace"
 zin_shared_dark_lands_the_holds_peace_desc:0 "The horns are silent, the beacons are put out and the warriors hang their axes on the wall once more. The hold of [ROOT.GetName] counts its dead and begins to mend what was broken."
 zin_shared_dark_lands_the_iron_tithe:0 "The Iron Tithe"
 zin_shared_dark_lands_the_iron_tithe_desc:0 "Each year [ROOT.GetName] sends a tenth of its iron and a tenth of its sons to Cocanoor. In return the hold is left alone by the warbands that serve Goldoroth, which is the price of a quiet life."
 zin_shared_dark_lands_the_living_stand_together:0 "The Living Stand Together"
 zin_shared_dark_lands_the_living_stand_together_desc:0 "Old feuds are set aside on the shore, and warbands of rival holds march through each other's lands without a fight. The dead are not the only enemy, but they are the one that no hold can face alone."
 zin_shared_dark_lands_the_long_memory:0 "The Long Memory"
 zin_shared_dark_lands_the_long_memory_desc:0 "Elders of [ROOT.GetName] gather the young and tell them what the south has done to orcs before. The tales are old, ugly and not always true, but they make the hold harder to fool."
 zin_shared_dark_lands_the_moot_rides:0 "The Moot Rides"
 zin_shared_dark_lands_the_moot_rides_desc:0 "War has come, and the free holds ride together from the Moot Stone. For the first time in many lifetimes, free orcs from a dozen halls march under a common banner."
 zin_shared_dark_lands_the_proud_hall:0 "The Proud Hall"
 zin_shared_dark_lands_the_proud_hall_desc:0 "Banners of the hold hang from every beam, and the doors are carved with its victories. Strangers who enter the hall of [ROOT.GetName] are made to feel that they have come to a place that cannot be bought."
 zin_shared_dark_lands_the_southern_road:0 "The Southern Road"
 zin_shared_dark_lands_the_southern_road_desc:0 "The road from Nafeher is open, and the host of the south marches up it under black banners. The hold of [ROOT.GetName] sends its warriors to take a place in the line."
 zin_shared_dark_lands_the_warchiefs_host:0 "The Warchief's Host"
 zin_shared_dark_lands_the_warchiefs_host_desc:0 "A single warchief commands every axe in [ROOT.GetName], and his word is the only one the hold needs. Rival clans have been invited to submit or to leave."
 zin_shared_dark_lands_the_warrens_below:0 "The Warrens Below"
 zin_shared_dark_lands_the_warrens_below_desc:0 "Beneath the hall of [ROOT.GetName] runs a maze of tunnels, home to small, quick folk who rarely show their faces. They come up at night to trade, to spy and to ask for a place at the fire."
 zin_shared_dark_lands_the_yoke_lies_lighter:0 "The Yoke Lies Lighter"
 zin_shared_dark_lands_the_yoke_lies_lighter_desc:0 "Whether it was borne or slipped, the weight of Cocanoor eases on the shoulders of [ROOT.GetName]. The scribes write the settlement down, and the elders let themselves believe it will last."
 zin_shared_dark_lands_troll_kin:0 "Troll-Kin of the Hold"
 zin_shared_dark_lands_troll_kin_desc:0 "Great grey shapes at the back of the hall break gates and obey the chief who can make himself understood."
 zin_shared_dark_lands_troll_kin_of_the_hold:0 "Troll-Kin of [ROOT.GetName]"
 zin_shared_dark_lands_troll_kin_of_the_hold_desc:0 "Great grey shapes sit at the back of the hall and eat more than three warriors. They break gates, hurl boulders and obey a chief who can make himself understood."
 zin_shared_dark_lands_walls_of_the_hold:0 "Walls of [ROOT.GetName]"
 zin_shared_dark_lands_walls_of_the_hold_desc:0 "Ramparts of piled stone and sharpened stakes rise around the hall, and the gate is closed at dusk. Raiders of the black coast find that [ROOT.GetName] keeps a long memory and a short temper."
 zin_shared_dark_lands_warbands_for_cocanoor:0 "Warbands of [ROOT.GetName] for Cocanoor"
 zin_shared_dark_lands_warbands_for_cocanoor_desc:0 "The young warriors of [ROOT.GetName] march to Cocanoor under the black banner and learn war as Goldoroth wages it. They return with scars, silver and a deep respect for the strength of the one who feeds them."
 zin_shared_dark_lands_warbands_sent:0 "Warbands Sent"
 zin_shared_dark_lands_warchiefs_host:0 "The Warchief's Host"
 zin_shared_dark_lands_warchiefs_host_desc:0 "One warchief commands every axe, and his word is the only one the hold needs."
 zin_shared_dark_lands_warrens:0 "The Warrens Below"
 zin_shared_dark_lands_warrens_desc:0 "Small, quick folk from the tunnels beneath the hall come up at night to fight for a place at the fire."
 zin_shared_dark_lands_watch_for_black_sails:0 "Watch for Black Sails"
 zin_shared_dark_lands_watch_for_black_sails_desc:0 "Lookouts crouch on the headlands with horns and tarred torches. Ships with black sails are said to come out of the north on moonless nights, and the watchers of [ROOT.GetName] intend to be awake."
 zin_shared_dark_lands_when_the_south_falls_silent:0 "When the South Falls Silent"
 zin_shared_dark_lands_when_the_south_falls_silent_desc:0 "The southern camps are quiet, and the riders who once came and went have not been seen for weeks. What remains of their master, no one at the hall can say."
 zin_shared_dark_lands.1.a:0 "The chief speaks first."
 zin_shared_dark_lands.1.b:0 "The clans speak first."
 zin_shared_dark_lands.1.d:0 "The fire in the long pit has been fed since before the oldest warrior was born. Tonight the hold gathers around it to decide who speaks first, and a hush falls as the chief rises."
 zin_shared_dark_lands.1.t:0 "The Hall-Fire of [ROOT.GetName]"
 zin_shared_dark_lands.2.a:0 "Let them speak."
 zin_shared_dark_lands.2.d:0 "Men from the south stand before the fire, with gifts and good iron, and speak of spoils in the north. They say they come from Nafeher. They do not say more."
 zin_shared_dark_lands.2.t:0 "Strangers at the Hall"
