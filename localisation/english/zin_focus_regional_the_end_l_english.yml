l_english:
 zin_regional_the_end_archers_of_the_end:0 "Archers of the End"
 zin_regional_the_end_archers_of_the_end_desc:0 "Black yew from the northern slopes makes the End's longbows. They are heavy to draw and long in the shaft, and an archer takes ten years to master one."
 zin_regional_the_end_archive_of_the_end:0 "The Archive of the End"
 zin_regional_the_end_archive_of_the_end_desc:0 "In a hall older than Aenor's crown the scribes of the End copy rolls by hand, as they have always done. A fire is never lit in the room where the oldest are kept."
 zin_regional_the_end_beacon_towers:0 "Beacon Towers"
 zin_regional_the_end_beacon_towers_desc:0 "Every tower is given a beacon and a stock of dry wood, and every watcher a horn. A flame at the shore reaches the Warden's hall before the sun has crossed a hand's breadth."
 zin_regional_the_end_deep_orchards:0 "Deep Orchards"
 zin_regional_the_end_deep_orchards_desc:0 "Orchards are planted in terraces down the sheltered valleys, and their roots go deeper than any frost. The End has never gone hungry for long."
 zin_regional_the_end_deep_orchards_spirit:0 "Deep Orchards"
 zin_regional_the_end_deep_orchards_spirit_desc:0 "Terraced orchards feed the End's many, though the labour is long and the cloth coarse."
 zin_regional_the_end_edge_of_the_woods:0 "The Edge of the Woods"
 zin_regional_the_end_edge_of_the_woods_desc:0 "The dark is at the border, and every tree is a post and every strand a wall."
 zin_regional_the_end_end_provides:0 "The End Provides"
 zin_regional_the_end_end_provides_desc:0 "A remote realm that makes what it needs, and trades what it does not."
 zin_regional_the_end_endarils_watch:0 "Endaril's Watch"
 zin_regional_the_end_endarils_watch_desc:0 "Endaril keeps a watch on all that passes the last road: pedlars, pilgrims and the weather. The Warden's office has always been more about listening than ruling."
 zin_regional_the_end_endarils_watch_spirit:0 "Endaril's Watch"
 zin_regional_the_end_endarils_watch_spirit_desc:0 "A Warden who listens to everything that passes the last road misses little of what is coming."
 zin_regional_the_end_essence_workshops:0 "Essence Workshops"
 zin_regional_the_end_essence_workshops_desc:0 "Distillers and dyers set up beside the orchards to draw the oils and tinctures that the elves prize above gold."
 zin_regional_the_end_eyes_on_the_black_north:0 "Eyes on the Black North"
 zin_regional_the_end_eyes_on_the_black_north_desc:0 "Fishers on the northern shore speak of lights among black islands where no one lives. The Warden does not dismiss them, and he does not repeat them either."
 zin_regional_the_end_first_age_rolls:0 "Rolls of the First Age"
 zin_regional_the_end_first_age_rolls_desc:0 "The oldest rolls are brought down from the upper shelves and read aloud: cures, songs, boundary-lays and the names of rivers that no longer run."
 zin_regional_the_end_great_watch:0 "The Great Watch"
 zin_regional_the_end_great_watch_desc:0 "The End's numbers stand as a watch on every road, never as a host that marches."
 zin_regional_the_end_healers_from_the_end:0 "Healers from the End"
 zin_regional_the_end_healers_from_the_end_desc:0 "The End has more herbalists than it needs, and its healers leave in twos and threes, walking down the old roads to wherever there is fever."
 zin_regional_the_end_hold_the_last_shore:0 "Hold the Last Shore"
 zin_regional_the_end_hold_the_last_shore_desc:0 "Every cove, ford and strand is manned. Stone is rolled into the roads, and the wardens take their stations along the cliff-tops."
 zin_regional_the_end_last_shore_watch:0 "Watch on the Last Shore"
 zin_regional_the_end_last_shore_watch_desc:0 "Watchers in grey towers see every sail on the cold sea."
 zin_regional_the_end_lore_of_the_unbinding:0 "Lore of the Unbinding"
 zin_regional_the_end_lore_of_the_unbinding_desc:0 "The scribes copy out what the Third Age learned about lifting curses, in case the knowledge is needed again. The rolls say much about the binding, and nothing about where a wise man might be found."
 zin_regional_the_end_merchants_whisper:0 "Merchants Whisper"
 zin_regional_the_end_merchants_whisper_desc:0 "Merchants tell of eastern courts gathering ships, steersmen and timber in quantities no trade could need. The Warden listens to all of them, and believes more than he says."
 zin_regional_the_end_quays_of_the_end:0 "Quays of the End"
 zin_regional_the_end_quays_of_the_end_desc:0 "A sheltered cove below the Warden's hall is walled and quayed. Ships that come to the End now have somewhere to lie, and the End has somewhere to watch them from."
 zin_regional_the_end_rolls_of_the_first_men:0 "Rolls of the First Men"
 zin_regional_the_end_rolls_of_the_first_men_desc:0 "The archive's oldest rolls of the First Men are brought out and laid beside the tale of [zin_loc_eindil]. The seals, the names and the lines of descent agree, and the scribes put their pens down."
 zin_regional_the_end_rolls_of_the_two_shores:0 "Rolls of the Two Shores"
 zin_regional_the_end_rolls_of_the_two_shores_desc:0 "The oldest rolls of the Archive were written when the eastern shore could be reached on foot, and they speak of neighbours there by name. The keepers of the rolls bring them up from the deepest vault, more out of courtesy to the dead than in hope of use."
 zin_regional_the_end_seat_of_the_warden:0 "The Warden's Seat"
 zin_regional_the_end_seat_of_the_warden_desc:0 "The Warden of the End sits where the old roads stop, in a hall of grey stone that no one remembers raising. Endaril presides over the houses, and the houses, for once, listen."
 zin_regional_the_end_shipyards_of_the_end:0 "Shipyards of the End"
 zin_regional_the_end_shipyards_of_the_end_desc:0 "On the last shore, where the cold sea begins, the houses raise slipways and cut keels from the dark timber of the northern slopes."
 zin_regional_the_end_silver_sails:0 "Silver Sails"
 zin_regional_the_end_silver_sails_desc:0 "Pale sails are cut for the End's few ships. They are light enough to outrun weather, and bright enough that a friend can find them at dusk."
 zin_regional_the_end_star_readers:0 "The Star-Readers"
 zin_regional_the_end_star_readers_desc:0 "On the last shore the sky is wide and the nights are long. The star-readers set down what the heavens do, year on year, and their tables are trusted by every steersman who knows them."
 zin_regional_the_end_star_readers_spirit:0 "The Star-Readers"
 zin_regional_the_end_star_readers_spirit_desc:0 "The tables of the star-readers guide the steersmen, the planters and the scholars alike."
 zin_regional_the_end_stone_roads_of_the_end:0 "Stone Roads of the End"
 zin_regional_the_end_stone_roads_of_the_end_desc:0 "The old roads are relaid in grey stone, and the milestones, long worn smooth, are cut again with the names of the houses that tend them."
 zin_regional_the_end_the_edge_of_the_woods:0 "The Edge of the Woods"
 zin_regional_the_end_the_edge_of_the_woods_desc:0 "The dark has come to the edge of the woods, and the End is the last green thing before it. Every tree on the northern slope has become a post, and every post a watcher."
 zin_regional_the_end_the_end_endures:0 "The End Endures"
 zin_regional_the_end_the_end_endures_desc:0 "Whatever else comes down the old roads, the hall at their end will stand, and the houses within it will know each other by name."
 zin_regional_the_end_the_end_holds:0 "The End Holds"
 zin_regional_the_end_the_end_holds_desc:0 "The first landing is broken and the whole realm stands behind its wardens."
 zin_regional_the_end_the_end_keeps_the_refusal:0 "The End Keeps the Refusal"
 zin_regional_the_end_the_end_keeps_the_refusal_desc:0 "Whenever men ask for hosts, the End gives them healers. The Warden restates the Refusal in a hall whose roof has sheltered it since before the Third Age."
 zin_regional_the_end_the_end_provides:0 "The End Provides"
 zin_regional_the_end_the_end_provides_desc:0 "What the orchards, springs and slipways make is traded along the old roads to the south, and the End finds that its remoteness has become a kind of wealth."
 zin_regional_the_end_the_end_stands:0 "The End Stands"
 zin_regional_the_end_the_end_stands_desc:0 "The horns sound from the last shore to the Warden's hall. The End has never been conquered, and its people have no intention of being the first to learn how."
 zin_regional_the_end_the_great_watch:0 "The Great Watch"
 zin_regional_the_end_the_great_watch_desc:0 "The End's numbers are gathered not as a host but as a watch: companies in rotation on every road, tower and ford. It is a host that never marches and never sleeps."
 zin_regional_the_end_the_houses_of_the_end:0 "The Houses of the End"
 zin_regional_the_end_the_houses_of_the_end_desc:0 "Every house of the End keeps its own hearth and its own tale. The Warden asks only that they tell the tales to each other more often than they tell them against each other."
 zin_regional_the_end_the_kin_ride_to_the_end:0 "The Kin Ride to the End"
 zin_regional_the_end_the_kin_ride_to_the_end_desc:0 "Kin from the great groves ride the long road north to stand beside the End's wardens. They have never been asked to come so far, and they come anyway."
 zin_regional_the_end_the_kindred_called:0 "The Kindred Called"
 zin_regional_the_end_the_kindred_called_desc:0 "The Kindred of the Woods has been raised to defend elven land. The End takes its place without ceremony, as it has taken every duty laid on it."
 zin_regional_the_end_the_last_shore_quiet:0 "The Last Shore Is Quiet"
 zin_regional_the_end_the_last_shore_quiet_desc:0 "The war is over and the sea is empty. The watchers climb back to their towers, and the Warden writes one line in the long rolls."
 zin_regional_the_end_the_long_memory:0 "The Long Memory"
 zin_regional_the_end_the_long_memory_desc:0 "The End remembers what other realms have let slip. Its elders recite the long rolls at the turning of the year, and the young learn them by heart."
 zin_regional_the_end_the_treaty_kept_shut:0 "The Treaty Kept Shut"
 zin_regional_the_end_the_treaty_kept_shut_desc:0 "The treaty was made with a kingdom that broke itself in two, and the warden sees no reason to lend it to whoever claims the pieces. The roll goes back into the deepest vault, and the vault is sealed."
 zin_regional_the_end_the_treaty_opened:0 "The Treaty Opened"
 zin_regional_the_end_the_treaty_opened_desc:0 "The Archive keeps the treaty of passage that let the old road cross the elven shore, and the warden is willing to show it to an eastern court that asks in peace. The keepers of the rolls make no promise beyond that."
 zin_regional_the_end_throw_them_back:0 "Throw Them Back"
 zin_regional_the_end_throw_them_back_desc:0 "The first landing is broken on the grey rock, and the defenders drive it back into the surf. Whatever comes next will find the End awake."
 zin_regional_the_end_warden_for_life:0 "A Warden for Life"
 zin_regional_the_end_warden_for_life_desc:0 "One voice holds the seat until death, and the houses have learned to follow it."
 zin_regional_the_end_wardens_by_turns:0 "Wardens by Turns"
 zin_regional_the_end_wardens_by_turns_desc:0 "The seat passes between the great houses in a fixed order, a lifetime for each. No house grows too proud, and none is quite sure it will see its turn."
 zin_regional_the_end_wardens_by_turns_spirit:0 "Wardens by Turns"
 zin_regional_the_end_wardens_by_turns_spirit_desc:0 "The seat passes between the houses in order, and every house has a stake in keeping the peace."
 zin_regional_the_end_wardens_for_life:0 "A Warden for Life"
 zin_regional_the_end_wardens_for_life_desc:0 "The Warden holds the seat until the Warden dies. The office is old and the Wardens have been few, and the houses see no reason to make it shorter."
 zin_regional_the_end_wardens_of_the_black_shore:0 "Wardens of the Black Shore"
 zin_regional_the_end_wardens_of_the_black_shore_desc:0 "A chain of small forts is built along the northern strand, each manned by wardens who do not discuss what they have seen out on the water."
 zin_regional_the_end_wardens_of_the_end:0 "Wardens of the End"
 zin_regional_the_end_wardens_of_the_end_desc:0 "The wardens of the End are the most numerous in the Magical Lands and the least eager to leave home. They drill in the cold, in all weathers, and they do not boast."
 zin_regional_the_end_watch_the_last_shore:0 "Watch the Last Shore"
 zin_regional_the_end_watch_the_last_shore_desc:0 "Towers of grey stone stand along the final coast, and a watcher sits in each through the long nights, looking out over the cold sea and the narrow rift."
 zin_regional_the_end_wellsprings_of_the_end:0 "Wellsprings of the End"
 zin_regional_the_end_wellsprings_of_the_end_desc:0 "Cold springs well from the grey rock at the world's edge, and the houses wall them and build their first workshops beside the water."
 zin_regional_the_end_white_riders:0 "White Riders"
 zin_regional_the_end_white_riders_desc:0 "White deer from the high moors are trained to carry a rider across ice and bog. They are fleet, quiet, and unafraid of the dark."
 zin_regional_the_end_with_the_kin:0 "With the Kin"
 zin_regional_the_end_with_the_kin_desc:0 "The Warden sends gifts of dark apples and grey wool to the great groves, and asks only that the kin remember the End at the turning of the year."
 zin_regional_the_end.1.a:0 "For the archive."
 zin_regional_the_end.1.b:0 "For the shore."
 zin_regional_the_end.1.d:0 "Endaril rises in the grey hall and says that the houses may have only one thing in the coming year: the Archive, whose rolls are older than any crown, or the shore, whose towers are fewer than the dark hours."
 zin_regional_the_end.1.t:0 "The Warden Speaks"
 zin_regional_the_end.2.a:0 "Warn the kin."
 zin_regional_the_end.2.b:0 "Sell them timber."
 zin_regional_the_end.2.d:0 "A merchant of the quays tells the Warden that courts across the rift are gathering ships, steersmen and timber past any trade's needs. He has been offered a high price for the End's black yew, and has not yet said yes."
 zin_regional_the_end.2.t:0 "Merchants Whisper"
 zin_regional_the_end.3.a:0 "Send a boat."
 zin_regional_the_end.3.b:0 "Fishers' tales."
 zin_regional_the_end.3.d:0 "Fishers return from the northern strand with a tale of lights moving among black islands where nothing should live. They say the lights keep step with the tide, and they will not say more."
 zin_regional_the_end.3.t:0 "Black Ships off the Last Shore"
