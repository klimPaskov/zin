l_english:
 cat_zin_advanced_cost_factor:0 "Advanced Learning Research Cost"
 zin_dev_endow_learning:0 "Endow a House of Learning"
 zin_dev_endow_learning_desc:0 "The crown endows a house where scholars teach the crafts of the libraries and workshops, and pays its masters for years to come."
 zin_dev_learning:0 "Learning of the Realm"
 zin_dev_learning_desc:0 "The standing of the realm's learning decides what the advanced crafts cost it. Learned Realm: no extra cost; Settled Realm: advanced crafts cost 30 per cent more research; Realm of Custom: advanced crafts cost 75 per cent more research. Each library, university, conclave of scholars and royal academy researched, each band of students sent abroad and each house of learning endowed adds to the realm's learning, and every 3 such steps raise it one standing."
 zin_dev_send_scholars:0 "Send Students to Learned Lands"
 zin_dev_send_scholars_desc:0 "Young scholars go to study in a learned neighbour or league partner and come home with books, methods and friends."
 zin_development:0 "Learning of the Realm"
 zin_development_desc:0 "How far the realm's scholars, schools and workshops reach. A realm with less learning pays more research for the advanced crafts of the age until its learning grows."
 zin_development_learn_tt:0 "The realm's learning grows."
 zin_development_rise_tt:0 "The realm rises to a higher standing of learning, and the advanced crafts cost it less research."
