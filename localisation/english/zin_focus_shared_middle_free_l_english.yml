l_english:
 zin_shared_middle_free_a_chance_to_be_found:0 "A Chance to Be Found"
 zin_shared_middle_free_a_chance_to_be_found_desc:0 "Parim is a day's walk away and growing, and sooner or later a lord of the crown will come up the hills. The kings must decide what he finds."
 zin_shared_middle_free_a_door_under_the_bridge:0 "A Door Under the Bridge"
 zin_shared_middle_free_a_door_under_the_bridge_desc:0 "One of the holts has cut its back door into the Stendorler stone under a bridge of Parim, and a mason is about to find it. The kings decide to let him."
 zin_shared_middle_free_a_free_realm:0 "A Free Realm"
 zin_shared_middle_free_a_free_realm_desc:0 "Hidden, befriended or simply known, [ROOT.GetName] has settled how the world will find it, and it means to stay free of the Charters while it does."
 zin_shared_middle_free_a_stand_that_moves:0 "A Stand That Moves"
 zin_shared_middle_free_a_stand_that_moves_desc:0 "For the first time any ranger alive has seen, a whole stand of the Baelim walks, slowly, from the deep wood to the edge, and stops there."
 zin_shared_middle_free_a_word_with_the_dwarves:0 "A Word with the Dwarves"
 zin_shared_middle_free_a_word_with_the_dwarves_desc:0 "The clans of Kunhrim above the forest keep the Iron Charter's rule against elves, and the household keeps off their roads. The Eldest sends a guide to the outer gate to ask whether it must always be so."
 zin_shared_middle_free_an_envoy_to_parim:0 "An Envoy to Parim"
 zin_shared_middle_free_an_envoy_to_parim_desc:0 "An envoy goes to the crown with a modest gift and a modest request: that Parim should count [ROOT.GetName] among its friends and stand by it if it is attacked."
 zin_shared_middle_free_baelim_heard:0 "The Baelim Heard"
 zin_shared_middle_free_burnt_edge:0 "The Burnt Edge Remembered"
 zin_shared_middle_free_chiromaw_hunts:0 "Chiromaw Hunts"
 zin_shared_middle_free_chiromaw_hunts_desc:0 "The chiromaws of the caves have always been more trouble to the holts than any king of men, and the young gnomes are sent down with lanterns to clear the lower galleries."
 zin_shared_middle_free_each_holt_its_own_king:0 "Each Holt Its Own King"
 zin_shared_middle_free_each_holt_its_own_king_desc:0 "Every holt keeps its own king and its own secrets, as it always has, and the holts meet under Tovodor only when they are found."
 zin_shared_middle_free_fallen_wood_for_the_edge:0 "Fallen Wood for the Edge"
 zin_shared_middle_free_fallen_wood_for_the_edge_desc:0 "Men may gather the wood that falls, as the ents of Kilinti let them do, and the edge-villages carry it out on their backs and say thank you to the trees."
 zin_shared_middle_free_forest_refuge:0 "Under the Stands"
 zin_shared_middle_free_forest_refuge_desc:0 "The people of the forest's edge shelter under the great conifers, and the Baelim speak to them in the moot for the first time anyone remembers."
 zin_shared_middle_free_forest_wakes_spirit:0 "The Forest Wakes"
 zin_shared_middle_free_forest_wakes_spirit_desc:0 "The Baelim have come out of the wood, slowly and without mercy, and the host that burned its edge is learning why no road was ever made through the north coast."
 zin_shared_middle_free_found_at_last:0 "Found at Last"
 zin_shared_middle_free_found_at_last_desc:0 "The holts let themselves be found. If their luck holds, the world that finds them will be a friendly one; if it does not, the gnomes will know whom to blame."
 zin_shared_middle_free_found_at_last_tip_1:0 "With thirty or more in the holts' pots, the finding goes well; with less, ill luck follows."
 zin_shared_middle_free_friends_in_parim:0 "Friends in Parim"
 zin_shared_middle_free_friends_in_parim_desc:0 "Parim is within reach and the crown is the strongest power in the Middle Lands, so [ROOT.GetName] decides that a friend at court is worth the risk of being remembered there."
 zin_shared_middle_free_gifts_for_the_neighbours:0 "Gifts for the Neighbours"
 zin_shared_middle_free_gifts_for_the_neighbours_desc:0 "Gifts go over the border to the nearest courts and moots, chosen with care and carried by folk who know which hand to shake first."
 zin_shared_middle_free_gold_brought:0 "Gold Brought Freely"
 zin_shared_middle_free_gold_ill_luck:0 "Gold Taken from the Gnomes"
 zin_shared_middle_free_gold_ill_luck_desc:0 "The crown's men took the gold behind the gnome door, and the masons of Parim will not cut stone on that side of the river any more."
 zin_shared_middle_free_gold_taken:0 "Gold Taken"
 zin_shared_middle_free_good_neighbour_wood:0 "Water at the Forest's Edge"
 zin_shared_middle_free_good_neighbours:0 "Good Neighbours"
 zin_shared_middle_free_guides_for_an_army:0 "Guides for an Army"
 zin_shared_middle_free_guides_for_an_army_desc:0 "The household chooses a side in a war of men for the first time since the Staying, and its guides lead a host over the Lunhrim Notch by paths that admit only raiders."
 zin_shared_middle_free_guides_of_the_pass_road:0 "Guides of the Pass Road"
 zin_shared_middle_free_guides_of_the_pass_road_desc:0 "Under the Accord of the Passes the household guides travellers on the road to the Kingson Pass, and the forts on both sides pay it in salt and silver."
 zin_shared_middle_free_guides_spirit:0 "Guides of the Pass Road"
 zin_shared_middle_free_guides_spirit_desc:0 "The guides of Thamiel take travellers to the Kingson Pass for salt and silver, and the forts on both sides of the range pay them for it."
 zin_shared_middle_free_hidden_ways_of_the_range:0 "The Ways over the Notch"
 zin_shared_middle_free_hidden_ways_of_the_range_desc:0 "Guides of Thamiel lead a host by paths that admit only raiders, and the enemy finds banners where he expected snow."
 zin_shared_middle_free_holts_luck:0 "The Luck of the Gnomes"
 zin_shared_middle_free_holts_luck_desc:0 "Gold was carried to the gnome door under the bridge and left there freely, and the masons of Parim swear that nothing has gone wrong for the crown since."
 zin_shared_middle_free_home_over_the_range:0 "Home over the Range"
 zin_shared_middle_free_home_over_the_range_desc:0 "The household answers Herrodon at last. The houses will go east over the pass to their kin, carrying their dead's names with them, and the Kingdom Forests will be left without guides."
 zin_shared_middle_free_household_of_thamiel:0 "The Household of Thamiel"
 zin_shared_middle_free_household_of_thamiel_desc:0 "One elven household of a few hundred houses lives in the Kingdom Forests where its dead lie, on the wrong side of the mountains from all its kin."
 zin_shared_middle_free_how_the_world_finds_us:0 "How the World Finds Us"
 zin_shared_middle_free_how_the_world_finds_us_desc:0 "Sooner or later every hidden folk is found by someone, and the eldest of [ROOT.GetName] would rather choose who it is."
 zin_shared_middle_free_ill_luck:0 "Ill Luck in the Holts"
 zin_shared_middle_free_ill_luck_desc:0 "Gold has been taken from the holts, and the gnomes say that ill luck follows taken gold as surely as rain follows cloud, for the taker and for the robbed alike."
 zin_shared_middle_free_kin_letters:0 "Letters Between Kin"
 zin_shared_middle_free_kin_of_herrodon:0 "Kin of Herrodon"
 zin_shared_middle_free_kin_of_herrodon_desc:0 "Herrodon takes the household into its book again, and the elves who stayed west teach their kin every way men use through the mountains."
 zin_shared_middle_free_kin_of_the_east:0 "Kin of the East"
 zin_shared_middle_free_kin_of_the_east_desc:0 "The household has answered Herrodon at last, and the elves of the Magical Lands have a household that knows every way men use through the mountains."
 zin_shared_middle_free_kin_returned:0 "The Lost Kin Returned"
 zin_shared_middle_free_kindred_verse:0 "The Western Verse"
 zin_shared_middle_free_kindred_verse_desc:0 "The household sings the Kindred Song in its old western form, which the eastern elves find quaint, and stands with the Kindred of the Woods."
 zin_shared_middle_free_luck_for_the_giver:0 "Luck for the Giver"
 zin_shared_middle_free_luck_for_the_giver_desc:0 "Gold brought freely brings luck, and the holts make sure that the luck reaches whoever brought it."
 zin_shared_middle_free_luck_of_the_holts:0 "The Luck of the Holts"
 zin_shared_middle_free_luck_of_the_holts_2:0 "The King of Tovodor's Luck"
 zin_shared_middle_free_luck_of_the_holts_2_desc:0 "The village-kings meet under the king of Tovodor, the pots are full, and the old gnomes say the holts have not been so lucky since before the War of Men."
 zin_shared_middle_free_luck_of_the_holts_desc:0 "Every holt keeps a pot, and the gnome whose pot is fullest is crowned; luck follows gold given freely, and the holts have always had plenty of both."
 zin_shared_middle_free_naisa_keeps_the_account:0 "Naisa Keeps the Account"
 zin_shared_middle_free_naisa_keeps_the_account_desc:0 "The gnomes honour Naisa above every other power, because she keeps the account of luck, and the holts bring her the first gold of the year."
 zin_shared_middle_free_naisa_keeps_the_account_tip_1:0 "The first gold of the year goes to Naisa: the holts' luck rises."
 zin_shared_middle_free_near_friends:0 "Good Neighbours"
 zin_shared_middle_free_near_friends_desc:0 "[ROOT.GetName] knows the folk across its borders by name, and they know it, which keeps the quarrels small."
 zin_shared_middle_free_never_found:0 "Never Found"
 zin_shared_middle_free_never_found_desc:0 "The kings close the back doors, let the paths grow over and leave a pot of gold on the quarry ledge for anyone who comes too close, as their grandfathers did."
 zin_shared_middle_free_no_axe_in_the_wood:0 "No Axe in the Wood"
 zin_shared_middle_free_no_axe_in_the_wood_desc:0 "No axe is lifted inside the forest, not for fallen wood and not for a king, and the moot lets the edge-villages know it in a way they will remember."
 zin_shared_middle_free_nobody_passes_uninvited:0 "Nobody Passes Uninvited"
 zin_shared_middle_free_nobody_passes_uninvited_desc:0 "The watchers and the drilled folk are joined into one guard of the borders, and a host that comes into [ROOT.GetName] uninvited will meet both."
 zin_shared_middle_free_outside_the_charters:0 "Outside the Charters"
 zin_shared_middle_free_outside_the_charters_desc:0 "[ROOT.GetName] never took the Charters of Parim, and the crown has never quite noticed that it did not. It owes no levies and no tolls to anyone, which is a fine thing until somebody stronger comes asking."
 zin_shared_middle_free_parim_friends:0 "Friends in Parim"
 zin_shared_middle_free_parim_friends_desc:0 "There is a name in Parim that answers letters from [ROOT.GetName], and in the Middle Lands that is worth more than a wall."
 zin_shared_middle_free_parim_friendship:0 "Friendship of Parim"
 zin_shared_middle_free_refuge:0 "A Refuge in the War"
 zin_shared_middle_free_refuge_desc:0 "Families from the burnt lands sleep under the roofs of [ROOT.GetName], and they work for their bread without being asked."
 zin_shared_middle_free_roads_refused:0 "The Roads Refused"
 zin_shared_middle_free_roads_shared:0 "The Lower Road Shared"
 zin_shared_middle_free_shelter_the_fleeing:0 "Shelter the Fleeing"
 zin_shared_middle_free_shelter_the_fleeing_desc:0 "The hidden ways are opened to the families fleeing the war, and [ROOT.GetName] shares its roofs and its bread with folk who did not know it existed a month ago."
 zin_shared_middle_free_stand_with_the_living:0 "Stand with the Living"
 zin_shared_middle_free_stand_with_the_living_desc:0 "[ROOT.GetName] has never taken sides in the quarrels of men, but the dead are no quarrel of men, and its folk go out to stand beside the living."
 zin_shared_middle_free_stands_awake:0 "The Stands Awake"
 zin_shared_middle_free_stands_awake_desc:0 "A stand has walked, which no ranger living has seen, and the whole forest listens as it has not listened since the Order sent its woodcutters in."
 zin_shared_middle_free_stay_unseen:0 "Stay Unseen"
 zin_shared_middle_free_stay_unseen_desc:0 "The paths are let grow over, the smoke is kept low, and [ROOT.GetName] goes on living as it always has, out of sight of the roads."
 zin_shared_middle_free_tend_the_land:0 "Tend the Land"
 zin_shared_middle_free_tend_the_land_desc:0 "The work goes into the land itself, its gardens, groves and hidden fields, so that it gives more without anyone outside seeing why."
 zin_shared_middle_free_the_burnt_edge_remembered:0 "The Burnt Edge Remembered"
 zin_shared_middle_free_the_burnt_edge_remembered_desc:0 "The Redbark set fire to the forest's eastern edge once, to drive game, and the Baelim came out and pulled their camp trees down. The stands remember, and so do the Redbark."
 zin_shared_middle_free_the_edge_markets:0 "The Edge Markets"
 zin_shared_middle_free_the_edge_markets_desc:0 "Twice a year a market is held where the realm meets the roads, and the folk of [ROOT.GetName] go home richer and no better known than before."
 zin_shared_middle_free_the_eldest_speaks:0 "The Eldest Speaks"
 zin_shared_middle_free_the_eldest_speaks_desc:0 "The Eldest of Graulvoa speaks to the moots of men at the forest's edge, slowly and in words the oldest rangers can follow, and the Middle Lands learn that the largest forest in them has an opinion."
 zin_shared_middle_free_the_felling_question:0 "The Felling Question"
 zin_shared_middle_free_the_felling_question_desc:0 "The woodcutters of the edge-villages are cutting closer to the stands every year, and the moot must decide whether any wood of the forest may be taken at all."
 zin_shared_middle_free_the_folk_under_arms:0 "The Folk Under Arms"
 zin_shared_middle_free_the_folk_under_arms_desc:0 "Every household of [ROOT.GetName] sends someone to drill, and the folk who never fight learn at least how to stand together."
 zin_shared_middle_free_the_forest_shelters:0 "The Forest Shelters"
 zin_shared_middle_free_the_forest_shelters_desc:0 "When the dead come down from the north, the Baelim let the people of the edge shelter under the stands, and the great wood becomes a refuge for the first time in its history."
 zin_shared_middle_free_the_forest_wakes:0 "The Forest Wakes"
 zin_shared_middle_free_the_forest_wakes_desc:0 "A host has cut or burned the forest's edge, and the Baelim come out of the wood as they did against the Redbark, slowly and without mercy."
 zin_shared_middle_free_the_free_realms_endure:0 "The Free Realms Endure"
 zin_shared_middle_free_the_free_realms_endure_desc:0 "The war has passed over [ROOT.GetName] and left it standing, which is more than can be said for some of the great houses that took the Charters."
 zin_shared_middle_free_the_gold_seams:0 "The Gold Seams"
 zin_shared_middle_free_the_gold_seams_desc:0 "The gnomes dig the gold of the Deodolor Hills as they always have, quietly, and this year the seams run richer than the oldest digger can remember."
 zin_shared_middle_free_the_gold_seams_tip_1:0 "Gold for the pots: the holts' luck rises."
 zin_shared_middle_free_the_graves_of_thamiel:0 "The Graves of Thamiel"
 zin_shared_middle_free_the_graves_of_thamiel_desc:0 "The household stayed in the Kingdom Forests when its kin went east, because its dead lie here, and it has kept the graves through three Ages. The Eldest asks the houses what the household is for now."
 zin_shared_middle_free_the_guides_stay:0 "The Guides Stay"
 zin_shared_middle_free_the_guides_stay_desc:0 "The household stays where its graves are and keeps the pass road, as it has since the Accord, and the Eldest sends Herrodon gifts and no answer."
 zin_shared_middle_free_the_herrodon_letters:0 "The Herrodon Letters"
 zin_shared_middle_free_the_herrodon_letters_desc:0 "The queen of Herrodon has written twice in an Age to ask the household home. This time the Eldest writes first."
 zin_shared_middle_free_the_hidden_ways:0 "The Hidden Ways"
 zin_shared_middle_free_the_hidden_ways_desc:0 "Every path into [ROOT.GetName] is learned by its own folk and forgotten by everyone else, and a stranger who finds one tends to find that it brings him back where he started."
 zin_shared_middle_free_the_household_endures:0 "The Household Endures"
 zin_shared_middle_free_the_household_endures_desc:0 "Whether its houses went east, stayed with their graves or stood with the Kindred, the household of Thamiel is still one household, and its Eldest still speaks for it."
 zin_shared_middle_free_the_kindred_song:0 "The Kindred Song"
 zin_shared_middle_free_the_kindred_song_desc:0 "Elves riding west on the pass road bring word that the Kindred of the Woods has been raised, and the household asks to stand with its kin without leaving its graves."
 zin_shared_middle_free_the_king_of_tovodor:0 "The King of Tovodor"
 zin_shared_middle_free_the_king_of_tovodor_desc:0 "The pots are counted and the king of Tovodor is crowned again with a pot of gold, as the first king was, and the holts are as lucky as they have ever been."
 zin_shared_middle_free_the_kings_meet_at_tovodor:0 "The Kings Meet at Tovodor"
 zin_shared_middle_free_the_kings_meet_at_tovodor_desc:0 "The village-kings walk to Tovodor by night and meet under the eldest of them, which has not happened in living memory, and the hills are suddenly much busier."
 zin_shared_middle_free_the_near_neighbours:0 "The Near Neighbours"
 zin_shared_middle_free_the_near_neighbours_desc:0 "The crown is far and busy, but the folk across the border are near and will still be there next year, so [ROOT.GetName] makes its friends at home."
 zin_shared_middle_free_the_notch_guides:0 "The Notch Guides"
 zin_shared_middle_free_the_notch_guides_desc:0 "Under the Order the household guided fugitives over the Lunhrim Notch on winter nights, and the old paths are walked again so that nobody forgets them."
 zin_shared_middle_free_the_old_defences:0 "The Old Defences"
 zin_shared_middle_free_the_old_defences_desc:0 "Nobody has made war on [ROOT.GetName] in living memory, and the eldest would like to keep it that way by making sure that anybody who tries regrets it early."
 zin_shared_middle_free_the_pots_of_tovodor:0 "The Pots of Tovodor"
 zin_shared_middle_free_the_pots_of_tovodor_desc:0 "Every holt of Olodor keeps a pot of gold, and the gnome whose pot is fullest is crowned. The village-king of Tovodor, the eldest of them, counts the pots this year with more care than usual."
 zin_shared_middle_free_the_pots_of_tovodor_tip_1:0 "The holts' luck is counted in their pots: gold given freely fills them, gold taken empties them."
 zin_shared_middle_free_the_slow_moot:0 "The Slow Moot"
 zin_shared_middle_free_the_slow_moot_desc:0 "The Baelim meet in a moot that nobody outside the forest has ever heard end, and the Eldest of Graulvoa speaks for the stands. Something has made the moot sit longer than usual this year."
 zin_shared_middle_free_the_stands:0 "The Stands"
 zin_shared_middle_free_the_stands_desc:0 "The Baelim stand in the oldest wood of the Middle Lands, slow to decide anything and slower to forgive, and no road has ever been cut through them."
 zin_shared_middle_free_the_tunnels_under_deodolor:0 "The Tunnels Under Deodolor"
 zin_shared_middle_free_the_tunnels_under_deodolor_desc:0 "The holts are joined by tunnels under the Deodolor Hills, long enough and secret enough to hide a great many folk who are not gnomes, if the gnomes should choose to."
 zin_shared_middle_free_the_tzikor_clearings:0 "The Tzikor Clearings"
 zin_shared_middle_free_the_tzikor_clearings_desc:0 "The tzikor flower in the forest's clearings, moving flowers with thorns and poisoned blossoms, and the Baelim let them spread to every path a host might use."
 zin_shared_middle_free_the_western_verse:0 "The Western Verse"
 zin_shared_middle_free_the_western_verse_desc:0 "The household sings its verse of the Kindred Song in the old western form, and the eastern elves, who find it quaint, are surprised to find themselves moved."
 zin_shared_middle_free_trade_at_the_edge:0 "Trade at the Edge"
 zin_shared_middle_free_trade_at_the_edge_desc:0 "Goods are left at the edge of [ROOT.GetName] for the traders of men to collect, and the traders leave a fair price, because they want to come back."
 zin_shared_middle_free_unseen:0 "Unseen"
 zin_shared_middle_free_unseen_2:0 "The Hidden Ways"
 zin_shared_middle_free_unseen_2_desc:0 "Every path into [ROOT.GetName] is known to its own folk and to nobody else, and a stranger who finds one usually finds that it goes round in a circle."
 zin_shared_middle_free_unseen_desc:0 "[ROOT.GetName] lets the world go by on the road outside, and the world, for the most part, does not notice it is there."
 zin_shared_middle_free_voices_in_the_wood:0 "Voices in the Wood"
 zin_shared_middle_free_voices_in_the_wood_desc:0 "Rangers at the forest's edge hear the Baelim's low voices night after night, and this time the voices are speaking to them."
 zin_shared_middle_free_watchers_at_the_edge:0 "Watchers at the Edge"
 zin_shared_middle_free_watchers_at_the_edge_desc:0 "Watchers sit in the high branches and on the hilltops along the border, and nothing that walks on the roads goes unseen for long."
 zin_shared_middle_free_water_at_the_edge:0 "Water at the Edge"
 zin_shared_middle_free_water_at_the_edge_desc:0 "The rangers of Selen leave water at the forest's edge in dry summers, and the Baelim, who never thank anyone, let it be known that they have noticed."
 zin_shared_middle_free_what_the_land_gives:0 "What the Land Gives"
 zin_shared_middle_free_what_the_land_gives_desc:0 "Hills, forest or valley, the land of [ROOT.GetName] has fed its folk since before the Charters, and the eldest think it could feed them better."
 zin_shared_middle_free_when_the_dead_come:0 "When the Dead Come"
 zin_shared_middle_free_when_the_dead_come_desc:0 "War has come to the Middle Lands, and the roads past [ROOT.GetName] are full of carts going one way and smoke going the other."
 zin_shared_middle_free.1.a:0 "Leave the door shut, as the masons do."
 zin_shared_middle_free.1.b:0 "Leave gold at the door, freely given."
 zin_shared_middle_free.1.c:0 "Open it and take what is behind it."
 zin_shared_middle_free.1.d:0 "A mason repairing a pier of the old grey bridges has found a small round door cut into the Stendorler stone, with a brass knocker no bigger than a thumb. The guild says to knock before you cut, the treasury says there is gold behind it, and the master mason is waiting to be told which of them to listen to."
 zin_shared_middle_free.1.t:0 "A Door Under the Bridge"
 zin_shared_middle_free.2.a:0 "Let them keep their graves on the far side."
 zin_shared_middle_free.2.b:0 "Welcome them home."
 zin_shared_middle_free.2.d:0 "The household of [FROM.GetName], which refused the call home after the Ember Lands and has been written in our book as lost ever since, has sent its Eldest over the pass to ask whether the door is still open. She has brought the names of their dead and asks that they be written beside ours."
 zin_shared_middle_free.2.t:0 "The Lost Kin Ask to Come Home"
 zin_shared_middle_free.3.a:0 "No elf walks the hold's roads."
 zin_shared_middle_free.3.b:0 "Let the guides use the lower road."
 zin_shared_middle_free.3.d:0 "The Eldest of [FROM.GetName] has sent a guide to the outer gate, very politely, to ask whether the household may use the lower road past the galleries in winter, when the forest paths are under snow. The gate-wardens remind the hall that no elf has walked its roads since the Iron Charter was sworn."
 zin_shared_middle_free.3.t:0 "[FROM.GetName] Asks Leave to Use the Roads"
 zin_shared_middle_free.4.a:0 "Leave water at the edge and let the wood be."
 zin_shared_middle_free.4.b:0 "Send a ranger in with water and a question."
 zin_shared_middle_free.4.d:0 "Rangers camped at the edge of the great forest have heard the Baelim's low voices for nine nights running, and on the tenth night the voices said something the oldest of them could almost understand. The moots would like to know whether anyone means to answer."
 zin_shared_middle_free.4.t:0 "The Baelim Speak"
 zin_shared_middle_free.5.a:0 "Receive them courteously and promise nothing."
 zin_shared_middle_free.5.b:0 "Promise them the crown's protection."
 zin_shared_middle_free.5.d:0 "An envoy of [FROM.GetName], a realm that has never taken the Charters and never quarrelled with the crown either, waits in the antechamber with a modest gift and a request for the crown's friendship. The clerks had to look up where it is."
 zin_shared_middle_free.5.t:0 "[FROM.GetName] Asks for Parim's Friendship"
