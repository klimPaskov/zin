l_english:
 zin_noris_against_the_eastern_throne:0 "Against the King of the East"
 zin_noris_against_the_eastern_throne_desc:0 "The Free Crowns give Noris leave to strike. The throne of the King of the East has no right in the sands, and Furvior will say so in iron."
 zin_noris_aid_to_the_elder_groves:0 "Aid to the Elder Groves"
 zin_noris_aid_to_the_elder_groves_desc:0 "Across the rift the old forests burn under a foreign host. Furvior pledges to defend the elven realms and sends riders and grain."
 zin_noris_answer_the_coalition:0 "Answer the Eastern Coalition"
 zin_noris_answer_the_coalition_desc:0 "Noris has joined the eastern coalition. The host crosses the rift in boats built for the purpose, and the riders go with it."
 zin_noris_banner_over_the_sands:0 "One Banner Over the Sands"
 zin_noris_banner_over_the_sands_desc:0 "One banner flies over every tent of the Treaty. The courts that march beneath it are protected, and they are expected to remember whose banner it is."
 zin_noris_break_the_coalition:0 "Break the Coalition"
 zin_noris_break_the_coalition_desc:0 "Silver, hostages and threats pass between the camps. By the end of the season, half the coalition has remembered that it has neighbours at home."
 zin_noris_bride_from_the_tents:0 "A Bride from the Tents"
 zin_noris_bride_from_the_tents_desc:0 "A marriage binds more tents than a treaty. The king asks the great houses which of their daughters shall sit beside his heir."
 zin_noris_bring_the_riders_home:0 "Bring the Riders Home"
 zin_noris_bring_the_riders_home_desc:0 "The cost is too high, and the roads at home are open. The king calls the riders back across the rift, though some companies will not come."
 zin_noris_bring_the_riders_home_tip_1:0 "Some companies will not come home."
 zin_noris_camel_corps:0 "The Camel Banners"
 zin_noris_camel_corps_desc:0 "Camel-men cross the sand where horses would die and appear where no one looked for them."
 zin_noris_captains_of_the_temple:0 "Captains of the Temple"
 zin_noris_captains_of_the_temple_desc:0 "Riders of the royal house are sent to the temples to be taught the new order of battle. They return with new songs and new orders."
 zin_noris_caravan_guilds:0 "The Caravan Guilds"
 zin_noris_caravan_guilds_desc:0 "Drivers, guides and well-keepers form guilds with sworn rules and shared purses. The crown lets them rule themselves and takes a tenth."
 zin_noris_caravan_guilds_spirit:0 "The Caravan Guilds"
 zin_noris_caravan_guilds_spirit_desc:0 "Drivers, guides and well-keepers keep their own rules and purses, and the crown takes its tenth."
 zin_noris_caravanserais_of_the_north:0 "Caravanserais of the North"
 zin_noris_caravanserais_of_the_north_desc:0 "Walled yards with fountains, stables and a sleeping gallery rise along the northern stretch of the road. A caravan that sleeps safe is a caravan that returns."
 zin_noris_cisterns_of_furvior:0 "The Cisterns of Furvior"
 zin_noris_cisterns_of_furvior_desc:0 "Vaulted stone cisterns beneath the city hold a year of rain. Furvior can no longer be starved by a dry season."
 zin_noris_claim_every_road:0 "Claim Every Road"
 zin_noris_claim_every_road_desc:0 "Heralds ride to every road of the East and proclaim the charters of Furvior. Merchants of Postondoroth read the proclamations and say nothing."
 zin_noris_claim_the_rift_road:0 "Claim the Rift Road"
 zin_noris_claim_the_rift_road_desc:0 "The Rift Road runs to the ports on the narrow sea, where the trade of the Magical Lands comes ashore. Whoever holds its charter holds the richest door in the East."
 zin_noris_clan_marshals:0 "The Clan Marshals"
 zin_noris_clan_marshals_desc:0 "Each great clan gives the host a marshal, and the marshals sit in a ring around the king when a ride is planned. No marshal outranks another."
 zin_noris_clan_marshals_spirit:0 "The Clan Marshals"
 zin_noris_clan_marshals_spirit_desc:0 "Each clan names a marshal to the king's ring, and the host is led by all of them at once."
 zin_noris_close_the_roads_to_stabilo:0 "Close the Roads to Stabilo"
 zin_noris_close_the_roads_to_stabilo_desc:0 "Tolls rise, wells close and watchmen turn merchants of Postondoroth back at the border. It is the first step toward the Caravan War."
 zin_noris_close_the_temple_houses:0 "Close the Temple Houses"
 zin_noris_close_the_temple_houses_desc:0 "The houses of the generous friends are shut and sealed, and their keepers are escorted to the border. The king has seen what their silver bought."
 zin_noris_council_of_the_sands:0 "The Council of the Sands"
 zin_noris_council_of_the_sands_desc:0 "The throne, the moot and the caravan houses sit together at last. What the council decides, the whole East will hear before the dust settles."
 zin_noris_count_the_temple_gold:0 "Count the Temple Gold"
 zin_noris_count_the_temple_gold_desc:0 "The treasurer opens every temple ledger and counts the silver twice. Gifts are welcome, but the king wants to know where the money goes."
 zin_noris_crown_of_the_high_king:0 "The Crown of the High King"
 zin_noris_crown_of_the_high_king_desc:0 "In the evening light the clans raise Esiurth above the wells of Furvior and place a circlet of dyed cloth on his brow. He is High King of the Sands."
 zin_noris_desert_fox_doctrine:0 "The Desert-Fox Doctrine"
 zin_noris_desert_fox_doctrine_desc:0 "Never meet the enemy where he is strong, never follow where he is waiting. The riders of Noris learn to vanish in the dust and strike his supply."
 zin_noris_desert_throne:0 "The Desert Throne"
 zin_noris_desert_throne_desc:0 "Furvior is a city of tents around one stone hall, and its crown has never been more than the promise of the riders to follow it. Esiurth the Second sits where his fathers sat and must now decide whom the tents obey."
 zin_noris_desert_war_masters:0 "Masters of the Desert War"
 zin_noris_desert_war_masters_desc:0 "Noris has fought in sand, rock and salt flat, and no foreign host has outlasted it."
 zin_noris_desert_wardens:0 "The Desert Wardens"
 zin_noris_desert_wardens_desc:0 "Wardens ride the edge of the sand, find lost caravans and bury the dead who cannot be carried home. The desert is easier to cross with them than without them."
 zin_noris_desert_wardens_spirit:0 "The Desert Wardens"
 zin_noris_desert_wardens_spirit_desc:0 "Wardens ride the sand edge, find the lost and bury the dead. Armies cross the desert with fewer losses than before."
 zin_noris_down_the_lake_road:0 "Down the Lake Road"
 zin_noris_down_the_lake_road_desc:0 "The Lake Road winds toward Mora and Ostoroth, past reed towns that have never seen a Noris banner. The first caravan carries gifts instead of goods."
 zin_noris_embassy_to_alerhia:0 "An Embassy to Alerhia"
 zin_noris_embassy_to_alerhia_desc:0 "Alerhia lies between the roads of Furvior and Postondoroth and listens to both. Noris sends an embassy with a gift of horses."
 zin_noris_envoys_to_the_eastern_courts:0 "Envoys to the Eastern Courts"
 zin_noris_envoys_to_the_eastern_courts_desc:0 "Envoys in indigo robes set out for every court that will receive them, carrying letters, spices and the promise of the Salt Road."
 zin_noris_envoys_to_zilin:0 "Envoys to the Zilin Hills"
 zin_noris_envoys_to_zilin_desc:0 "Envoys cross the rift sea to the Zilin Hills, carrying the king's gifts and returning with blessings. The road to the Deliverer is open."
 zin_noris_eyes_on_the_priests:0 "Eyes on the Priests"
 zin_noris_eyes_on_the_priests_desc:0 "A quiet clerk is assigned to every temple and writes down who comes and goes. The priests smile and offer him tea."
 zin_noris_faith_and_treasury:0 "Faith and Treasury"
 zin_noris_faith_and_treasury_desc:0 "Faith and silver are weighed on the same scale at Furvior. The king takes what is offered and keeps his own counsel."
 zin_noris_first_among_the_eastern_crowns:0 "First Among the Eastern Crowns"
 zin_noris_first_among_the_eastern_crowns_desc:0 "Furvior asks for no throne above the others, only the chair at the head of the ring. Where the Treaty sits, Noris speaks first and listens longest."
 zin_noris_first_of_the_free_crowns:0 "First of the Free Crowns"
 zin_noris_first_of_the_free_crowns_desc:0 "The courts that refused the King of the East look to Furvior to lead them. Esiurth takes the chair at the head of the ring and raises the banner of the Free Crowns."
 zin_noris_forges_of_furvior:0 "The Forges of Furvior"
 zin_noris_forges_of_furvior_desc:0 "Smiths from the lake towns are lured to Furvior with free forges and high wages. They turn out lances, curved blades and camel-armour."
 zin_noris_forts_on_the_stabilo_march:0 "Forts on the Stabilo March"
 zin_noris_forts_on_the_stabilo_march_desc:0 "Mud-brick forts rise on the border where the lands of Noris meet the lands of Postondoroth. A watchman on the tower can see the other kingdom's dust."
 zin_noris_free_crowns_banner:0 "Banner of the Free Crowns"
 zin_noris_free_crowns_banner_desc:0 "The courts that refused the King of the East ride beneath the banner of Furvior, and they do not forget it."
 zin_noris_free_east:0 "The Free East"
 zin_noris_free_east_desc:0 "The East is its own again. Courts that knelt are forgiven, and courts that refused are praised."
 zin_noris_free_riders_for_the_coalition:0 "Free Riders for the Stranger"
 zin_noris_free_riders_for_the_coalition_desc:0 "A band of free riders, tired of the quarrels of the East, takes service with the stranger's coalition in the west. Furvior does not stop them."
 zin_noris_friendship_with_gondolin:0 "Friendship with Gondolin"
 zin_noris_friendship_with_gondolin_desc:0 "Furvior sends gifts and a rider of the royal house to the court of Gondolin. The old friendship is renewed in the old words."
 zin_noris_furvior_queen_of_roads:0 "Furvior, Queen of Roads"
 zin_noris_furvior_queen_of_roads_desc:0 "Every road of the East begins or ends at the gates of Furvior. The city is called the Queen of Roads, and for a season even her rivals say so."
 zin_noris_garden_in_the_sands:0 "A Garden in the Sands"
 zin_noris_garden_in_the_sands_desc:0 "Palm, fig and barley rise around a new-dug well, and the sand retreats. It is the first garden in the south since the old kings' day."
 zin_noris_garden_in_the_sands_spirit:0 "A Garden in the Sands"
 zin_noris_garden_in_the_sands_spirit_desc:0 "Palm, fig and barley stand where there was only sand. Families settle, and children are born."
 zin_noris_gathering_of_the_clans:0 "The Gathering of the Clans"
 zin_noris_gathering_of_the_clans_desc:0 "Once in a lifetime the clans ride to Furvior together and sleep within sight of one another. The king feeds them all and asks no oath that he cannot afford to keep."
 zin_noris_gift_goodwill:0 "Gifts of the Noris Treaty"
 zin_noris_gold_of_the_desert:0 "Gold of the Desert"
 zin_noris_gold_of_the_desert_desc:0 "Gold dust, ivory and indigo cloth pile up in the warehouses of Furvior. The king has more silver than he has places to spend it."
 zin_noris_gondolins_watch:0 "Gondolin's Watch on the North"
 zin_noris_gondolins_watch_desc:0 "The seamen of Gondolin watch the northern water. Furvior asks them to tell it what they see, and to send word of anything that does not belong."
 zin_noris_guard_the_rift_ports:0 "Guard the Rift Ports"
 zin_noris_guard_the_rift_ports_desc:0 "Heavy gates and stone towers rise over the rift quays. No host will land there without a fight."
 zin_noris_harbours_of_gondolin:0 "The Harbours of Gondolin"
 zin_noris_harbours_of_gondolin_desc:0 "The salt ends its journey at the quays of Gondolin. Noris pays for new jetties there and makes a lasting friend of the harbour masters."
 zin_noris_high_king_of_the_sands:0 "High King of the Sands"
 zin_noris_high_king_of_the_sands_desc:0 "The clans raise a shield with Esiurth upon it. Let the East have one king, a king of the sands and the roads, and let him be crowned at the wells."
 zin_noris_high_kings_ambition:0 "The High King's Ambition"
 zin_noris_high_kings_ambition_desc:0 "One king for all the sands, and the clans have agreed to it. What they will do when he asks for more, no one can say."
 zin_noris_house_of_esiur:0 "The House of Esiur"
 zin_noris_house_of_esiur_desc:0 "The royal House of Esiur has held the indigo banner for nine generations. Its sons are taught the law of the wells before they are taught the sword."
 zin_noris_house_of_esiur_spirit:0 "The House of Esiur"
 zin_noris_house_of_esiur_spirit_desc:0 "The royal line keeps the indigo banner and the law of the wells. Its word is heard in every tent."
 zin_noris_houses_of_healing:0 "Houses of Healing"
 zin_noris_houses_of_healing_desc:0 "Rows of white-washed beds line the new houses of healing, tended by silent men and women with clean hands. Fever no longer empties a street."
 zin_noris_indigo_court:0 "The Indigo Court"
 zin_noris_indigo_court_desc:0 "Veils of indigo dye hang in the audience hall, and a petitioner is judged by how he stands before them. The court of Furvior is small, shrewd and very old."
 zin_noris_indigo_guard:0 "The Indigo Guard"
 zin_noris_indigo_guard_desc:0 "The king's own riders, veiled in indigo and mounted on black horses, have never been broken."
 zin_noris_into_the_deep_sand:0 "Into the Deep Sand"
 zin_noris_into_the_deep_sand_desc:0 "An expedition sets out past the last cairn into the deep sand, where the maps end. The guides say it is not wise to ask where."
 zin_noris_kersi_caravan_houses:0 "The Kersi Caravan Houses"
 zin_noris_kersi_caravan_houses_desc:0 "The Kersi own the camels, the scales and the salt contracts. Alodar Kersi lends the crown his seals, and in return the crown keeps the roads open."
 zin_noris_kings_law_in_the_sand:0 "The King's Law in the Sand"
 zin_noris_kings_law_in_the_sand_desc:0 "A king who judges himself, and judges all alike, is feared and obeyed. The law of Furvior is written on sheepskin and read aloud at every well."
 zin_noris_kneel_to_the_king:0 "Kneel to the King of the East"
 zin_noris_kneel_to_the_king_desc:0 "Esiurth walks barefoot into the temple at Furvior and lays his sword before the King of the East. The clans watch from the courtyard, and some of them do not kneel."
 zin_noris_letters_to_erco_and_plutondo:0 "Letters to Erco and Plutondo"
 zin_noris_letters_to_erco_and_plutondo_desc:0 "Erco and Plutondo lie in the shadow of Postondoroth. Furvior writes to their kings, quietly, offering a second friend."
 zin_noris_letters_to_the_eastern_kings:0 "Letters to the Eastern Kings"
 zin_noris_letters_to_the_eastern_kings_desc:0 "Letters in the king's own hand go out to every court that has not yet knelt. They ask only that the East decide for itself."
 zin_noris_long_ride:0 "The Long Ride"
 zin_noris_long_ride_desc:0 "Riders of Noris cover eighty miles in a night on spare mounts and a handful of dates."
 zin_noris_march_west_with_the_king:0 "March West with the King"
 zin_noris_march_west_with_the_king_desc:0 "The King's host turns west, and Noris rides with it. The road leads to Parim, and the riders sing as they go."
 zin_noris_marching_west:0 "Marching West"
 zin_noris_marching_west_desc:0 "The host of Noris rides west behind the King's banner, with the road laid out before it."
 zin_noris_master_of_caravans:0 "The Master of Caravans"
 zin_noris_master_of_caravans_desc:0 "One officer of the crown is made master of every caravan that leaves the city, and answers to the king alone. Merchants complain and trade grows."
 zin_noris_master_of_caravans_spirit:0 "The Master of Caravans"
 zin_noris_master_of_caravans_spirit_desc:0 "One officer answers for every caravan that leaves Furvior. Merchants grumble, and trade is trusted."
 zin_noris_masters_of_the_charters:0 "Masters of the Charters"
 zin_noris_masters_of_the_charters_desc:0 "The charters of the roads are read aloud at Furvior in the presence of every house. Caravans know whose seal is on the road they travel."
 zin_noris_masters_of_the_charters_tip_1:0 "Caravans favour Furvior on every road."
 zin_noris_masters_of_the_desert_war:0 "Masters of the Desert War"
 zin_noris_masters_of_the_desert_war_desc:0 "Noris has fought in sand, rock and salt flat, and no foreign host has outlasted it. Its marshals write the lessons in a book that is read only in Furvior."
 zin_noris_moot_at_the_wells:0 "The Moot at the Wells"
 zin_noris_moot_at_the_wells_desc:0 "The moot meets at the oldest wells of the desert, where no tent may stand taller than another. Whatever is decided there, the clans call their own."
 zin_noris_mora_and_the_lake_towns:0 "Mora and the Lake Towns"
 zin_noris_mora_and_the_lake_towns_desc:0 "Mora, Ernois and Ostoroth fish the lakes and trade with whoever comes. Furvior sends them envoys and a promise of cheaper salt."
 zin_noris_muster_of_the_tents:0 "The Muster of the Tents"
 zin_noris_muster_of_the_tents_desc:0 "Every clan lights its fire on the night of the muster and counts its riders in the morning. The more willing the clans, the longer the line."
 zin_noris_no_god_king_in_the_east:0 "No God-King in the East"
 zin_noris_no_god_king_in_the_east_desc:0 "The East has no god-king, and Furvior will not have one. The High King's riders ride to meet the King of the East on his own ground."
 zin_noris_noris_treaty:0 "The Noris Treaty"
 zin_noris_noris_treaty_desc:0 "The Treaty binds the crown of Furvior to Gondolin in friendship and open roads. Its seal is a hand laid over a hand, and any eastern king may lay his own."
 zin_noris_oasis_keepers:0 "The Oasis-Keepers"
 zin_noris_oasis_keepers_desc:0 "The Oasis-Keepers wander from well to well and answer to no king. Furvior asks only that they remember who pays for the cisterns."
 zin_noris_oath_of_the_furan:0 "The Oath of the Furan"
 zin_noris_oath_of_the_furan_desc:0 "The Furan hold the horse-herds and the first line of every ride. Their chieftain swears on his saddle that the clan will go where Furvior points."
 zin_noris_oaths_of_the_tents:0 "Oaths of the Tents"
 zin_noris_oaths_of_the_tents_desc:0 "Each clan swears a second oath, to the High King as to the tents. The more willing the clans, the deeper the oath."
 zin_noris_one_crown_many_tents:0 "One Crown, Many Tents"
 zin_noris_one_crown_many_tents_desc:0 "The throne and the tents have found a way to live under one sky. The king rides from camp to camp so that every clan sees the crown on his head."
 zin_noris_one_east_under_furvior:0 "One East Under Furvior"
 zin_noris_one_east_under_furvior_desc:0 "The roads, the courts and the clans answer to one throne. The East has become one realm, and the first High King of the Sands sits upon it."
 zin_noris_one_east_under_furvior_tip_1:0 "An outcome of this game, not history."
 zin_noris_open_the_treaty:0 "Open the Treaty"
 zin_noris_open_the_treaty_desc:0 "The Treaty has been a friendship of two crowns. Now Furvior opens its doors and invites every eastern court to lay a hand on the seal."
 zin_noris_passes_of_miaed:0 "The Passes of Miaed"
 zin_noris_passes_of_miaed_desc:0 "Miaed holds the high passes between the desert and the lake country. A friend there keeps the northern caravans safe in winter."
 zin_noris_pilgrim_tax:0 "Pilgrims Taxed at the Rift Ports"
 zin_noris_pilgrim_welcome:0 "Pilgrims Welcomed at the Rift Ports"
 zin_noris_promised_spoils:0 "Promised Spoils Beyond the Rift"
 zin_noris_promised_spoils_desc:0 "The King of the East has promised the lands beyond the rift to those who ride with him. Furvior writes its claim in advance."
 zin_noris_protectorate_of_the_sands:0 "The Wardenship of the Sands"
 zin_noris_protectorate_of_the_sands_desc:0 "The High King offers protection to the courts that lean toward him, in return for a tenth of their harvest and a seat at the moot."
 zin_noris_protectorate_of_the_sands_tip_1:0 "Courts at lean 60 may be offered protection."
 zin_noris_queen_of_roads:0 "Furvior, Queen of Roads"
 zin_noris_queen_of_roads_desc:0 "Every road of the East begins or ends at the gates of Furvior, and all the world knows it."
 zin_noris_question_of_the_east:0 "The Question of the East"
 zin_noris_question_of_the_east_desc:0 "Word has come to Furvior of a king in the far East who calls himself the Deliverer, and of an army on the rift. The council must decide how Noris will answer."
 zin_noris_question_of_the_east_tip_1:0 "Opens three answers."
 zin_noris_rider_general_tumo:0 "Rider-General Tumo Furan"
 zin_noris_rider_general_tumo_desc:0 "Tumo Furan led the border riders for thirty years and has never lost a well. The king names him Rider-General, and the clans cheer."
 zin_noris_riders_for_the_host:0 "Riders for the Eastern Host"
 zin_noris_riders_for_the_host_desc:0 "A column of riders sets out from Furvior with banners rolled and horses watered for a long march. They go to join the eastern host."
 zin_noris_riders_of_the_sand:0 "Riders of the Sand"
 zin_noris_riders_of_the_sand_desc:0 "Noris is a kingdom that learned war from its herds. Every boy of the clans can ride before he can write his name, and every summer the riders meet to test their horses."
 zin_noris_rift_ports:0 "The Rift Ports"
 zin_noris_rift_ports_desc:0 "A harbour on the rift sea at last. Pilgrims bound for the Zilin Hills and merchants of Aenor crowd the quays, and each wants something from Furvior."
 zin_noris_royal_tax_farms:0 "The Royal Tax Farms"
 zin_noris_royal_tax_farms_desc:0 "The crown sells the right to gather the road-tolls, season by season, to whoever bids the most. The treasury of Furvior fills, and the farmers are not loved."
 zin_noris_salt_markets_of_furvior:0 "The Salt Markets of Furvior"
 zin_noris_salt_markets_of_furvior_desc:0 "Furvior opens a second market under the walls where salt, dye and spice are weighed under the king's seal. Buyers come from three crowns."
 zin_noris_salt_pans:0 "The Salt Pans"
 zin_noris_salt_pans_desc:0 "White crusts shimmer on the dry lakes of the south. Labourers cut the salt in slabs and load it on camels bound for Furvior."
 zin_noris_salt_road:0 "The Salt Road"
 zin_noris_salt_road_desc:0 "The Salt Road runs from the pans of the desert to the harbours of Gondolin, and it made Furvior rich. Its guardians must keep the wells open, the camels fed and the toll-keepers honest."
 zin_noris_satrap_of_the_sands:0 "Satrap of the Sands"
 zin_noris_satrap_of_the_sands_desc:0 "For its loyalty, the throne is granted rule over the sands in the name of the King of the East. Furvior has never been so great, or so bound."
 zin_noris_seize_the_gold_road:0 "Seize the Gold Road"
 zin_noris_seize_the_gold_road_desc:0 "The riders ride down the Gold Road under the king's writ. Every well and caravanserai on the way is claimed for Furvior."
 zin_noris_shield_of_the_east:0 "The Shield of the East"
 zin_noris_shield_of_the_east_desc:0 "Furvior will not kneel. Esiurth calls the riders to the walls and tells them that the East is not one man's road."
 zin_noris_siege_trains:0 "Siege Columns"
 zin_noris_siege_trains_desc:0 "Not all wars are won in the open. Carpenters and ropewrights follow the riders with beams, windlasses and heavy throwing arms."
 zin_noris_spoils_of_the_elder_groves:0 "Spoils of the Elder Groves"
 zin_noris_spoils_of_the_elder_groves_desc:0 "The conquered groves of the Magical Lands pay tribute in wood and wine. Furvior claims a portion of every harvest."
 zin_noris_sun_and_steel:0 "Sun and Iron"
 zin_noris_sun_and_steel_desc:0 "Curved blades are forged beneath a noon sun and quenched in sour milk. A rider of Noris carries a weapon that is lighter than his enemy's and sharper."
 zin_noris_survey_the_noris_desert:0 "Survey the Noris Desert"
 zin_noris_survey_the_noris_desert_desc:0 "Rope-men and measurers walk the desert from end to end and mark where water lies beneath the crust. Their maps are worth more than a host of riders."
 zin_noris_sword_of_the_east:0 "Sword of the East"
 zin_noris_sword_of_the_east_desc:0 "The riders of Noris have sworn to ride wherever the King of the East bids them. They ride gladly and in good order."
 zin_noris_temple_charity:0 "The Temples' Charity"
 zin_noris_temple_charity_desc:0 "The generous friends feed the poor of Furvior at their own cost. The court grows used to their gifts."
 zin_noris_temples_and_gold:0 "Temples and Gold"
 zin_noris_temples_and_gold_desc:0 "Strangers in plain robes have come to Furvior from the Zilin Hills. They build houses for the sick, lend silver without interest and ask for nothing but the king's blessing."
 zin_noris_tent_moot:0 "The Tent Moot"
 zin_noris_tent_moot_desc:0 "Every clan sends its eldest to sit in a ring on the sand, and nothing is decided until the last of them has spoken. It is slow, and the riders will follow it anywhere."
 zin_noris_tent_moot_spirit:0 "The Tent Moot"
 zin_noris_tent_moot_spirit_desc:0 "The clans sit in a ring and decide together. The riders follow willingly, and the treasury is thinner for it."
 zin_noris_the_camel_corps:0 "The Camel Banners"
 zin_noris_the_camel_corps_desc:0 "The camel rides where a horse would die. Furvior raises banners of camel-men who cross the sand in a night and strike where nobody looked for them."
 zin_noris_the_caravan_peace:0 "The Caravan Peace"
 zin_noris_the_caravan_peace_desc:0 "With the Gold Road in its hands, Furvior offers terms at the wells. The Caravan War may end as it began, with a handshake and a contract."
 zin_noris_the_deliverers_sword:0 "The Deliverer's Sword"
 zin_noris_the_deliverers_sword_desc:0 "The generous friends in Furvior ask Noris to stand with them. Esiurth swears to send his riders wherever the Deliverer's banner goes."
 zin_noris_the_free_east:0 "The Free East"
 zin_noris_the_free_east_desc:0 "The King of the East is gone, or his claim is not heard. The courts of the sands meet beneath the open sky and swear to keep the East their own."
 zin_noris_the_free_east_tip_1:0 "An outcome of this game, not history."
 zin_noris_the_great_kingdoms_bend:0 "The Great Kingdoms Bend"
 zin_noris_the_great_kingdoms_bend_desc:0 "Envoys carry the High King's letter to Alerhia, Miaed, Erco and Plutondo. Each court must decide whether to bend the knee or to make an enemy."
 zin_noris_the_greater_treaty:0 "The Greater Treaty"
 zin_noris_the_greater_treaty_desc:0 "The old Treaty is rewritten on a single scroll sealed by every member. Gifts pass between the courts, and the East is for the first time one table."
 zin_noris_the_high_kings_due:0 "The High King's Due"
 zin_noris_the_high_kings_due_desc:0 "A king may demand his due from those who owe it. The High King sets his seal on a writ against the rival of the East."
 zin_noris_the_host_of_noris:0 "The Host of Noris"
 zin_noris_the_host_of_noris_desc:0 "The call goes out on the wind, and every clan sends all it has. A host gathers on the sands outside Furvior such as the East has not seen in a lifetime."
 zin_noris_the_indigo_guard:0 "The Indigo Guard"
 zin_noris_the_indigo_guard_desc:0 "The king's own riders wear indigo veils and ride black horses. They never leave his side, and they have never been broken."
 zin_noris_the_kings_own_coffers:0 "The King's Own Coffers"
 zin_noris_the_kings_own_coffers_desc:0 "The king builds his own coffers behind a locked door and names the key-bearer himself. Temple silver is welcome, but he will not live on it."
 zin_noris_the_long_ride:0 "The Long Ride"
 zin_noris_the_long_ride_desc:0 "The riders learn to cover eighty miles in a night with spare horses and a handful of dates. A war host that moves like a rumour is hard to catch."
 zin_noris_the_road_to_parim:0 "The Road to Parim"
 zin_noris_the_road_to_parim_desc:0 "The coalition turns west toward Parim, and the riders of Noris ride at its head. For the first time in an age, an eastern host looks on the Golden City."
 zin_noris_the_sand_road:0 "The Sand Road"
 zin_noris_the_sand_road_desc:0 "A track of wells and cairns crosses the deep sand from Noris to the courts of the south. The camel-men call it the Sand Road and swear to keep it open."
 zin_noris_the_temples_loans:0 "The Temples' Loans"
 zin_noris_the_temples_loans_desc:0 "The temples offer a loan on easy terms, to be repaid when the roads are rich. Furvior listens to the offer and weighs what else it might cost."
 zin_noris_the_war_council:0 "The War Council"
 zin_noris_the_war_council_desc:0 "The marshals and the clans meet behind closed tents and speak of the rift, the roads and the long peace that may not last. They agree on little, except that the host must be ready."
 zin_noris_throne_of_furvior:0 "The Throne of Furvior"
 zin_noris_throne_of_furvior_desc:0 "One hand on the sceptre and one hand on the purse. The king names the marshals, and the clans learn to ask before they ride."
 zin_noris_throne_of_furvior_spirit:0 "The Throne of Furvior"
 zin_noris_throne_of_furvior_spirit_desc:0 "A strong crown at the head of the tents. The king names the marshals, and the clans learn to ask before they ride."
 zin_noris_treaty_council:0 "The Treaty Council"
 zin_noris_treaty_council_at_furvior:0 "The Treaty Council at Furvior"
 zin_noris_treaty_council_at_furvior_desc:0 "Delegates of the Treaty meet once a year at Furvior and sit in a ring so that no one is first. Quarrels are settled there before they become wars."
 zin_noris_treaty_council_desc:0 "Delegates of the Treaty meet each year and settle their quarrels in a ring where no one is first."
 zin_noris_treaty_levies:0 "The Treaty Levies"
 zin_noris_treaty_levies_desc:0 "Each member of the Treaty pledges a number of riders to a common muster. The levies drill together once a year on the sands outside Furvior."
 zin_noris_treaty_levies_spirit:0 "The Treaty Levies"
 zin_noris_treaty_levies_spirit_desc:0 "Each court of the Treaty pledges riders to a common muster, and the levies drill side by side."
 zin_noris_treaty_renewed:0 "The Noris Treaty Renewed"
 zin_noris_tribute_of_the_free_crowns:0 "Tribute of the Free Crowns"
 zin_noris_tribute_of_the_free_crowns_desc:0 "Courts that refused the King of the East are made to pay for it. Camel caravans bring their tribute to the gates of Furvior."
 zin_noris_undercut_the_gold_road:0 "Undercut the Gold Road"
 zin_noris_undercut_the_gold_road_desc:0 "The Gold Road belongs to Postondoroth, but a caravan will take the cheaper way. Noris lowers its tolls and waits for the merchants of Stabilo to notice."
 zin_noris_watchful_court:0 "A Watchful Court"
 zin_noris_watchful_court_desc:0 "A quiet clerk sits in every temple and writes down who comes and goes. Little escapes Furvior now."
 zin_noris_water_rights_of_the_south:0 "Water Rights of the South"
 zin_noris_water_rights_of_the_south_desc:0 "Furvior writes the water law of the south on clay tablets and sets them at the wells. A court that signs it has already leaned toward the king."
 zin_noris_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_noris_welcome_the_generous_friends_desc:0 "The king welcomes the temple envoys into the great hall and gives them a house beside the market. The poor are fed, and the court notices who is feeding them."
 zin_noris_wells_of_mylunur:0 "The Wells of Mylunur"
 zin_noris_wells_of_mylunur_desc:0 "Mylunur holds the deep wells on the western edge of the Salt Road. Furvior offers silver for the right to water its camels there."
 zin_noris_wells_of_the_south:0 "The Wells of the South"
 zin_noris_wells_of_the_south_desc:0 "South of the dunes lie wells that have not been dug in a hundred years. Noris sends surveyors with long ropes and iron-shod poles."
 zin_noris_when_the_king_falls:0 "When the King Falls"
 zin_noris_when_the_king_falls_desc:0 "The King of the East is dead, and with him his banners and his promises. Noris must now answer for the oaths it swore in his name."
 zin_noris_when_the_king_falls_tip_1:0 "Furvior must answer for its oaths."
 zin_noris.1.a:0 "Furvior first."
 zin_noris.1.b:0 "The tents first."
 zin_noris.1.d:0 "The tents of the clans ring the stone hall of Furvior in a hundred colours. Esiurth has asked his counsellors whether the throne should speak first, or the tents."
 zin_noris.1.t:0 "The Desert Throne"
 zin_noris.10.a:0 "Grant passage rights."
 zin_noris.10.b:0 "The passes are ours."
 zin_noris.10.d:0 "Caravans from Furvior would cross the high passes of Miaed and pay in silver for the right. The lords of the passes say that an open road is a road for every army."
 zin_noris.10.t:0 "The Passes of Miaed"
 zin_noris.11.a:0 "Gladly."
 zin_noris.11.b:0 "Furvior pays for its own shrines."
 zin_noris.11.d:0 "The temples of the generous friends offer to regild the great shrine of Furvior at their own cost. The priests are courteous, and their gold is very bright."
 zin_noris.11.t:0 "Temples and Gold"
 zin_noris.12.a:0 "The king will answer."
 zin_noris.12.d:0 "The council of the sands has met in the great hall. The rival of Postondoroth, the doubts of the courts, the footholds of the temples and the host on the rift are laid out on the carpet like a map. Each man waits for the king to speak."
 zin_noris.12.t:0 "The Question of the East"
 zin_noris.13.a:0 "Accept the blessing."
 zin_noris.13.d:0 "Pilgrim envoys have come down from the Zilin Hills with blessings, sealed purses and a promise that the Deliverer remembers those who remember him."
 zin_noris.13.t:0 "Gifts from the Zilin Hills"
 zin_noris.14.a:0 "Keep the watch."
 zin_noris.14.b:0 "We see only fishing boats."
 zin_noris.14.d:0 "The captains of Gondolin have been asked by Furvior to watch the northern water. Their fishing boats have seen strange ships on the horizon, but nobody can name them."
 zin_noris.14.t:0 "Gondolin's Watch"
 zin_noris.15.a:0 "Long live the High King."
 zin_noris.15.d:0 "The clans raise Esiurth on a shield above the wells of Furvior, and the evening light turns the dyed cloth of his circlet to gold. The riders call him High King, and the sands answer."
 zin_noris.15.t:0 "The Crown of the High King"
 zin_noris.2.a:0 "Honour the Furan riders."
 zin_noris.2.b:0 "Honour the Kersi caravan houses."
 zin_noris.2.c:0 "Honour all, favour none."
 zin_noris.2.d:0 "The clans have ridden in, and each chieftain has laid a gift before the king. A king can honour only so many at his own table, and the others will be watching."
 zin_noris.2.t:0 "The Gathering of the Clans"
 zin_noris.20.a:0 "Grant the clans' petition."
 zin_noris.20.b:0 "Ride them down."
 zin_noris.20.d:0 "The clans murmur at the council fires. The lesser chieftains say that Furvior takes more than it gives, and a delegation waits at the gate with a petition."
 zin_noris.20.t:0 "Unrest in the Tents"
 zin_noris.21.a:0 "Let them ride."
 zin_noris.21.d:0 "At the turn of the season every clan lights its fire at once, and the glow runs across the desert to the horizon. For a night, the riders of Noris are a single host."
 zin_noris.21.t:0 "The Clans Ride as One"
 zin_noris.22.a:0 "Water the camels."
 zin_noris.22.d:0 "The elders of Mylunur have sold the rights of the deep wells to Furvior, and riders bring the sealed deed. The camels of the Salt Road may drink there from this day."
 zin_noris.22.t:0 "Mylunur's Answer"
 zin_noris.23.a:0 "Read it to the council."
 zin_noris.23.d:0 "A rider returns from Gondolin with a letter in the harbour kings' own hand. The Treaty is renewed, and the court of Furvior may judge how warmly."
 zin_noris.23.t:0 "Gondolin's Answer"
 zin_noris.24.a:0 "Weigh it."
 zin_noris.24.d:0 "The embassy returns from Alerhia. The court there has heard the riders of Furvior and the letters of Postondoroth, and has given a measured reply."
 zin_noris.24.t:0 "Alerhia's Answer"
 zin_noris.25.a:0 "Open the road."
 zin_noris.25.d:0 "The lords of the passes have granted passage to the caravans of Furvior, and the first camels cross the snow-line before the week is out."
 zin_noris.25.t:0 "Miaed's Answer"
 zin_noris.26.a:0 "So be it."
 zin_noris.26.d:0 "The elders of Mylunur have sent back the silver. The wells are theirs, they say, and always have been. The Salt Road will have to find water elsewhere."
 zin_noris.26.t:0 "Mylunur Keeps Its Wells"
 zin_noris.27.a:0 "So be it."
 zin_noris.27.d:0 "The lords of Miaed have refused the caravans passage. Snow lies deep in the passes, and the messenger says they intend to keep it so."
 zin_noris.27.t:0 "The Passes Stay Closed"
 zin_noris.28.a:0 "Keep the watch."
 zin_noris.28.b:0 "We see only fishing boats."
 zin_noris.28.d:0 "The captains of Gondolin report that the dead walk the northern shores, and that black hulls have been seen far from any harbour. They ask whether Furvior will send riders."
 zin_noris.28.t:0 "Gondolin's Watch on the Dead"
 zin_noris.3.a:0 "A daughter of the Furan."
 zin_noris.3.b:0 "A daughter of the Kersi."
 zin_noris.3.c:0 "A princess of Gondolin."
 zin_noris.3.d:0 "The heir of Furvior is of an age to marry. Three houses have sent their daughters to the king's table, and each has sent a dowry of camels and secrets."
 zin_noris.3.t:0 "A Bride from the Tents"
 zin_noris.4.a:0 "So it shall be."
 zin_noris.4.d:0 "The king rides from tent to tent at the end of the season, and the clans line the road to see him pass. For a day, nobody remembers that the tents were ever many."
 zin_noris.4.t:0 "One Crown, Many Tents"
 zin_noris.5.a:0 "Sell the well rights to Furvior."
 zin_noris.5.b:0 "The wells stay ours."
 zin_noris.5.d:0 "Riders in indigo have come to Mylunur with silver and a scroll. Furvior wishes to water its camels at the deep wells and will pay for the privilege, if the elders agree."
 zin_noris.5.t:0 "The Wells of Mylunur"
 zin_noris.6.a:0 "Tax the pilgrims."
 zin_noris.6.b:0 "Welcome them."
 zin_noris.6.d:0 "Merchants of Aenor and pilgrims bound for the Zilin Hills crowd the new quays of Furvior. The harbour masters ask whether the crown will tax the pilgrims or bid them welcome."
 zin_noris.6.t:0 "The Rift Ports"
 zin_noris.7.a:0 "Honour them."
 zin_noris.7.b:0 "Rule them."
 zin_noris.7.d:0 "The keepers of the deep wells have come out of the sand to ask that their old water rights be honoured. They carry no weapons, and they have been waiting at the gate since dawn."
 zin_noris.7.t:0 "The Oasis-Keepers"
 zin_noris.8.a:0 "Renew the Treaty."
 zin_noris.8.b:0 "Ask more of Furvior."
 zin_noris.8.d:0 "A rider of the royal house of Furvior has come to the court of Gondolin with gifts and the old words of the Treaty. The harbour kings are pleased, and they will say so."
 zin_noris.8.t:0 "Friendship with Gondolin"
 zin_noris.9.a:0 "Welcome the riders."
 zin_noris.9.b:0 "Hear both sides."
 zin_noris.9.c:0 "Postondoroth pays better."
 zin_noris.9.d:0 "Riders in indigo have come to Alerhia with horses and a letter from King Esiurth. Postondoroth has sent letters too, and Alerhia can read both."
 zin_noris.9.t:0 "An Embassy from Furvior"
