l_english:
 zin_regional_erco_a_queens_consort:0 "A Queen's Consort"
 zin_regional_erco_a_queens_consort_desc:0 "The question of a consort touches every lord and every road. Obmia hears the suits in her own time, and no suitor is told how it will end."
 zin_regional_erco_caravans_from_obmi:0 "Caravans From Obmi"
 zin_regional_erco_caravans_from_obmi_desc:0 "Caravans from the southern desert bring dyes, glass and dried fruit, and take iron tools home. The carters sing as they enter the square."
 zin_regional_erco_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_erco_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_erco_close_the_houses:0 "Close the Houses"
 zin_regional_erco_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_erco_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_erco_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_erco_crown_of_the_peaks:0 "Crown of the Peaks"
 zin_regional_erco_crown_of_the_peaks_desc:0 "The old crown is reforged from the grey stone of the first seam, and the queen wears it at the midwinter court. The mine-lords kneel, one by one, and none of them has been forced."
 zin_regional_erco_crown_of_the_peaks_spirit:0 "Crown of the Peaks"
 zin_regional_erco_crown_of_the_peaks_spirit_desc:0 "The Queen's crown is cut from the same grey stone as the mountain, and the peaks themselves seem to wear it. Her word runs in every shaft and on every ridge."
 zin_regional_erco_deep_shafts:0 "Deep Shafts"
 zin_regional_erco_deep_shafts_desc:0 "Shafts go down past the old workings into stone no miner has seen. Lamp-men, rope-makers and prop-setters learn their trades from fathers who died young."
 zin_regional_erco_eastern_oath:0 "Oath to the King in the East"
 zin_regional_erco_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_erco_end_of_the_sand_road:0 "The End of the Sand Road"
 zin_regional_erco_end_of_the_sand_road_desc:0 "The Sand Road climbs out of the dunes and ends at a paved square under Erco's walls. Everything that has travelled this far has something to sell."
 zin_regional_erco_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_erco_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_erco_foundries_of_erco:0 "Foundries of Erco"
 zin_regional_erco_foundries_of_erco_desc:0 "The foundry fires burn night and day beside the swift mountain streams, and ingots go down the slope in long lines. Smiths from three kingdoms come to buy."
 zin_regional_erco_free_crown_court:0 "A Free Crown"
 zin_regional_erco_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_erco_generous_friends:0 "The Generous Friends"
 zin_regional_erco_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_erco_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_erco_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_erco_healing_houses:0 "Houses of Healing"
 zin_regional_erco_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_erco_hill_companies:0 "Hill Companies"
 zin_regional_erco_hill_companies_desc:0 "The hill companies muster at the passes and drill on the slopes, long spears in one hand and a sling in the other. Their captains grow grey on the rocks."
 zin_regional_erco_houses_of_healing:0 "Houses of Healing"
 zin_regional_erco_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_erco_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_erco_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_erco_levies_for_the_host:0 "Levies for the Host"
 zin_regional_erco_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_erco_markets_of_the_heights:0 "Markets of the Heights"
 zin_regional_erco_markets_of_the_heights_desc:0 "Stall-keepers fill the square with cloth, ore and salt, and a covered hall is raised against the winter. The market-wardens keep the peace with brass staves."
 zin_regional_erco_masters_of_iron:0 "Masters of Iron"
 zin_regional_erco_masters_of_iron_desc:0 "A guild of master smiths now stands above every forge, setting marks, grades and prices. Erco's iron is stamped, and a stamp from the high halls is trusted in every market."
 zin_regional_erco_masters_of_iron_spirit:0 "Masters of Iron"
 zin_regional_erco_masters_of_iron_spirit_desc:0 "Erco's smiths know a hundred ways of folding iron, and each house keeps its own ways in a locked chest. Their blades, plates and tools are known across the East."
 zin_regional_erco_melt_the_diadem:0 "Melt the Diadem"
 zin_regional_erco_melt_the_diadem_desc:0 "The mine-lords swore in 2A 12 that no crown of the Kalioth would ever sit on a head again, and Erco keeps the oath with grim pride. The diadem goes into the crucible, and the iron of it goes into the forges."
 zin_regional_erco_mine_lords_council:0 "The Council of Mine-Lords"
 zin_regional_erco_mine_lords_council_desc:0 "The lords of the deep seams sit at a table of black stone and vote with their ore-tallies. Queen Obmia listens, and then she decides."
 zin_regional_erco_mountain_forts:0 "Mountain Forts"
 zin_regional_erco_mountain_forts_desc:0 "Every pass of Erco is closed by a fort, and every fort is within sight of the next. The queen's engineers add new towers where the old ones are weakest."
 zin_regional_erco_mountain_realm:0 "The Mountains Keep Their Own"
 zin_regional_erco_mountain_realm_desc:0 "The passes are narrow and the lords are many, and every trail has a fort on it. A host that comes to Erco finds the mountain already awake."
 zin_regional_erco_open_ore_market:0 "The Open Ore Market"
 zin_regional_erco_open_ore_market_desc:0 "Any buyer with coin may bid for Erco's ore, and the auctions on the high square are watched from three kingdoms. The price rises every season, and so does the envy."
 zin_regional_erco_ore_for_any_buyer:0 "Ore for Any Buyer"
 zin_regional_erco_ore_for_any_buyer_desc:0 "The ore goes to whoever pays most on the high square, and the queen's clerks write down the price and no names. Erco's neutrality is never so profitable as on auction day."
 zin_regional_erco_ore_for_the_pact:0 "Ore for the Pact"
 zin_regional_erco_ore_for_the_pact_desc:0 "Postondoroth's armouries and the Pact's forges take Erco's best ore at a price both sides can live with. The queen keeps Erco outside the Pact, but she keeps the Pact well supplied."
 zin_regional_erco_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_erco_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_erco_own_counsel:0 "Our Own Counsel"
 zin_regional_erco_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_erco_queen_obmias_council:0 "Queen Obmia's Council"
 zin_regional_erco_queen_obmias_council_desc:0 "The council sits at the black table, the queen at its head and the mine-lords on either hand. Each lord brings an ore-tally, and each tally tells a different story."
 zin_regional_erco_question_of_the_east:0 "The Question of the East"
 zin_regional_erco_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_erco_royal_match:0 "A Match With Erco"
 zin_regional_erco_sand_road_markets:0 "Markets of the Sand Road"
 zin_regional_erco_sand_road_markets_desc:0 "Where the Sand Road ends the markets begin, and every stall sells something that came a long way. Carters stay a night and spend a month's wages."
 zin_regional_erco_siege_engineers_of_erco:0 "Siege Engineers of Erco"
 zin_regional_erco_siege_engineers_of_erco_desc:0 "Erco's engineers can break a wall and mend one, and they teach both arts in the same school. Their trebuchets are carried in pieces on mule-back."
 zin_regional_erco_smiths_of_the_heights:0 "Smiths of the Heights"
 zin_regional_erco_smiths_of_the_heights_desc:0 "The highest forges make plate and blade that the lowland smiths cannot match. Apprentices come from the sand cities to learn the hammer-turn, and stay for years."
 zin_regional_erco_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_erco_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_erco_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_erco_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_erco_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_erco_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_erco_the_glacier_road:0 "The Glacier Road"
 zin_regional_erco_the_glacier_road_desc:0 "The old kings kept a road over the glacier of the Melty Pass to provinces beyond the edge of every chart. A company of mountaineers goes up to see whether anything of the road, or of those provinces, is left."
 zin_regional_erco_the_high_halls:0 "The High Halls"
 zin_regional_erco_the_high_halls_desc:0 "The great hall is relit, its pillars rebuilt and its long tables relaid with silver. Envoys who climb the stair arrive out of breath and leave humbled."
 zin_regional_erco_the_high_passes_guarded:0 "The High Passes Guarded"
 zin_regional_erco_the_high_passes_guarded_desc:0 "Beacons are raised above the snow line, and guard-huts stand at every col. The watch is hard in winter, and the watchers are well paid for it."
 zin_regional_erco_the_last_well:0 "The Last Well"
 zin_regional_erco_the_last_well_desc:0 "The last well on the Sand Road is sweet and deep, and carters bless it by name. Obmia has it walled, roofed and garrisoned, and its water is never sold."
 zin_regional_erco_the_mines_of_erco:0 "The Mines of Erco"
 zin_regional_erco_the_mines_of_erco_desc:0 "Iron, silver and a little gold come out of Erco in rattling carts, and the pit-heads are never quiet. A new smelting-hall at the capital makes the best of it."
 zin_regional_erco_the_mountain_clans:0 "The Mountain Clans"
 zin_regional_erco_the_mountain_clans_desc:0 "The clans of the heights send their young men to the queen's banner every autumn. They bring goat-hair cloaks, iron-shod staves and a very long memory of old debts."
 zin_regional_erco_the_mountain_road:0 "The Mountain Road"
 zin_regional_erco_the_mountain_road_desc:0 "The last miles to the capital are paved, cambered and ditched on both sides. A loaded wagon no longer needs six oxen on the final grade."
 zin_regional_erco_the_mountain_throne:0 "The Mountain Throne"
 zin_regional_erco_the_mountain_throne_desc:0 "Erco's queens have ruled from the high halls since before the caravan roads opened. Queen Obmia holds the throne by the loyalty of the mine-lords and the strength of her walls."
 zin_regional_erco_the_mountains_keep_their_own:0 "The Mountains Keep Their Own"
 zin_regional_erco_the_mountains_keep_their_own_desc:0 "The old saying is read aloud in the high hall: what the mountains hold, the mountains keep. Erco's gates are shut to every host, whatever banner it carries."
 zin_regional_erco_the_wall_nobody_strikes:0 "The Wall Nobody Strikes"
 zin_regional_erco_the_wall_nobody_strikes_desc:0 "In the iron hall at the heart of the old shafts there is a stretch of walling that no miner is allowed to strike, and every foreman knows why without being told. The queen asks to be told anyway."
 zin_regional_erco_the_wall_nobody_strikes_tip_1:0 "Behind the walling lies what the mine-lords of 2A 12 would neither wear nor melt."
 zin_regional_erco_under_the_seven_forts:0 "Under the Seven Forts"
 zin_regional_erco_under_the_seven_forts_desc:0 "The seven forts of the Kalioth stand on older walls, and the deepest shafts of the mines run into halls that no miner of Erco cut. The foremen ask leave to open the old shafts properly, with timber and lamps."
 zin_regional_erco_wait_upon_events:0 "Wait Upon Events"
 zin_regional_erco_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_erco_wall_it_up_again:0 "Wall It Up Again"
 zin_regional_erco_wall_it_up_again_desc:0 "An old foreman who has buried men in these shafts says it plainly: some things are walled up for a reason, and the reason has not gone away. The masons close the niche again with fresh stone and lime."
 zin_regional_erco_walls_of_erco:0 "Walls of Erco"
 zin_regional_erco_walls_of_erco_desc:0 "The new walls are cut straight from the rock and set with iron pins. They are thick enough to stop a ram and plain enough to look like part of the mountain."
 zin_regional_erco_watch_the_quays:0 "Watch the Quays"
 zin_regional_erco_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_erco_watchful_quays:0 "Watchful Quays"
 zin_regional_erco_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_erco_wear_the_diadem:0 "Wear the Diadem"
 zin_regional_erco_wear_the_diadem_desc:0 "There are lords at court who have waited a long time to be told that Erco is great, and the dark iron diadem tells them so. Whoever wears it will be called heir to the old mountain kings, and the neighbours will remember what those kings did."
 zin_regional_erco_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_erco_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_erco_when_the_king_falls:0 "When the King Falls"
 zin_regional_erco_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_erco.1.a:0 "A mine-lord of our own mountains"
 zin_regional_erco.1.b:0 "A prince of Plutondo"
 zin_regional_erco.1.c:0 "A lord of Ostoroth"
 zin_regional_erco.1.d:0 "Queen Obmia has no consort, and the council of mine-lords has begun to speak of it. Plutondo's prince has sent a portrait, Ostoroth's king a letter, and the deep-seam lords a list of their own sons."
 zin_regional_erco.1.t:0 "A Queen's Consort"
