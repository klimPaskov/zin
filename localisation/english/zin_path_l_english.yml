 zin_path.1.a:0 "The age begins."
 zin_path.11.a:0 "We will watch how they wear it."
 zin_path.11.desc:0 "The court that answered for Aenor is no longer what it was. [zin_role_aenor.GetName] now keeps the charters and seals of the old crown, and every court that owes Aenor anything must decide what it owes the new keeper."
 zin_path.11.t:0 "The Crown of Parim Passes"
 zin_path.13.a:0 "May the new banner hold."
 zin_path.13.desc:0 "The realm that sheltered the Host of Eindil can shelter it no longer. Its captains have carried their banners to [zin_role_host.GetName], and the war of the living goes on from there."
 zin_path.13.t:0 "The Host Finds a New Banner"
 zin_path.16.a:0 "The West will follow whoever can lead it."
 zin_path.16.desc:0 "The crown that led the Ford Council can lead it no longer, and the western courts have turned to [zin_role_crossing_lead.GetName] to speak for them and to lead them if they sail."
 zin_path.16.t:0 "The Ford Council Looks Elsewhere"
 zin_path.17.a:0 "The strait has a new keeper."
 zin_path.17.desc:0 "The old crown that kept the Narrow Strait has fallen from its place. [zin_role_leren_crown.GetName] now holds the northern shore and with it the old quarrel over the strait, its tolls and its treaty."
 zin_path.17.t:0 "A New Warden of the Strait"
