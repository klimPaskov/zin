l_english:
 zin_dark.80.a:0 "Watch the shore."
 zin_dark.80.b:0 "The dead are the North's trouble."
 zin_dark.80.b.tt:0 "Our court keeps its authority for other quarrels."
 zin_dark.80.desc:0 "The fishermen of the northern strait will not put out after dark any more, because the boats that did came back empty or did not come back. Across the water the dead of the black north are on the move in their thousands, and some have already been found walking on our side, in the shallows below the cliffs, as though they had crossed the strait along the bottom. The old men of the shore have started saying the name from the winter tales again, Kusven, and nobody laughs at them now."
 zin_dark.80.t:0 "Dead on the Dark Shore"
 zin_dark.82.a:0 "Make our own peace."
 zin_dark.82.a.tt:0 "We make peace with Cocanoor and with every realm of the Dark Sea Accord that is at war with us."
 zin_dark.82.b:0 "Fight on."
 zin_dark.82.desc:0 "The body of Volgan has been broken in the Middle Lands, and the voice from Nafeher that held the sworn holds to their oaths has fallen silent. Our chiefs who swore to the south now find that nobody answers their messengers, and the clans who never liked the oath are asking loudly in the hall what it has bought them."
 zin_dark.82.t:0 "The South Falls Silent"
 zin_diplo.23.a:0 "We will take the seat."
 zin_diplo.23.a.tt:0 "We become an honorary crown of the Lost Cause."
 zin_diplo.23.b:0 "We thank them, and stay as we are."
 zin_diplo.23.desc:0 "Envoys of [From.GetName] have brought us a seat in the Lost Cause, the league of the crowns that mean to stand together when the dark powers come for the living. The seat carries no oath of war and no tribute, only our name on the roll at Parim and the plain expectation that we will answer if the league ever calls on us."
 zin_diplo.23.t:0 "A Seat in the Lost Cause"
 zin_diplo.31.a:0 "The woods keep their own counsel again."
 zin_diplo.31.a.tt:0 "We leave any league that a realm of men leads."
 zin_diplo.31.desc:0 "Our war against the dark powers is over, and the houses have taken up the Refusal again as they promised when they laid it down. The companies are coming home from the lands of men, and the envoys of the human leagues will be thanked for their friendship and sent back to their own courts with gifts and without promises."
 zin_diplo.31.t:0 "The Refusal Taken Up Again"
 zin_dominion.10.a:0 "North."
 zin_dominion.10.b:0 "To the passes!"
 zin_dominion.10.desc:0 "The storms that have stood over the Ember Lands for an age have opened, and the host that waited under them is on the roads north, greater than any the south has sent out since the First Age. The wardens of Mirolon are about to learn how much of what they told the world was true."
 zin_dominion.10.desc1:0 "The storms over the Ember Lands have opened, and out of them has come an army greater than any since the First Age. The beacons on the passes are lit from end to end, and the High Warden has called every company to the walls."
 zin_dominion.10.t:0 "Out of the Storms"
 zin_dominion.11.a:0 "Mirolon was right all along."
 zin_dominion.11.desc:0 "Mirolon has fallen. The passes its wardens kept for twenty years are in the hands of the south, and the ledgers of the watch went north with the last riders out. Whatever is left of its court will have to keep the watch from exile."
 zin_dominion.11.t:0 "Mirolon Falls"
 zin_dominion.12.a:0 "Then we must meet them."
 zin_dominion.12.desc:0 "The south is moving. The hosts of the Dominion have left the passes of Mirolon behind them and are on the high roads to the Middle Lands, and the villages in their way are emptying faster than the heralds can ride."
 zin_dominion.12.t:0 "The March North"
 zin_dominion.13.a:0 "Then we break them too."
 zin_dominion.13.a.tt:0 "We go to war with Zol's Mistake for a state on our border, not for the whole of it."
 zin_dominion.13.b:0 "Not yet."
 zin_dominion.13.desc:0 "Our riders on the northern edge of the march have met the dead of the black north, and the two hosts stand a few miles apart in the Middle Lands with nothing between them but burned fields. Neither side has sent a herald, and the captains are waiting for the word."
 zin_dominion.13.t:0 "The Dead Against the Dead"
 zin_dominion.14.a:0 "The court decides."
 zin_dominion.15.a:0 "Turn every host against the living."
 zin_dominion.15.a.tt:0 "Our hosts gain experience from the peace in the north."
 zin_dominion.15.desc:0 "The dead of the north have given their answer. Their hosts have drawn back from ours and keep their own camps, and our captains have orders to let them pass on the roads. Nobody at Nafeher calls it friendship, and nobody needs to."
 zin_dominion.15.t:0 "The Compact Holds"
 zin_dominion.16.a:0 "Bury them."
 zin_dominion.16.desc:0 "The champion of men is down. He stood before the lord of Nafeher on the southern front and spoke of men who have chosen to stand together, and the answer he was given threw him to the ground, where his own people are now carrying him from the field."
 zin_dominion.16.t:0 "Then I Will Bury Them Together"
 zin_dominion.17.a:0 "What remains, no one can say."
 zin_dominion.17.desc:0 "Volgan's manifested body has been destroyed on the field, and a storm of magic tore through the southern host as it broke apart. What remains of him, no one living can say."
 zin_dominion.17.t:0 "The Body Breaks"
 zin_dominion.18.a:0 "The oath stands."
 zin_dominion.18.b:0 "We go our own road."
 zin_dominion.18.desc:0 "Word has come from Nafeher that the lord of the Dominion was struck down, and that the Steward who sits in his place speaks in a name that does not answer. Our oath was sworn to Volgan, and the council wants to know whether it still binds us."
 zin_dominion.18.t:0 "Old Allegiances"
 zin_dominion.19.a:0 "Let Mirolon go."
 zin_dominion.19.a.tt:0 "Peace with Mirolon, and its home states are returned to it."
 zin_dominion.19.b:0 "Hold what we took."
 zin_dominion.19.b.tt:0 "Mirolon's home states rise against us."
 zin_dominion.19.desc:0 "The hosts that hold Mirolon's passes now answer to the Steward, and Mirolon's people have not stopped watching them. The Steward may give back what the Dominion took, or keep it in a name that no longer answers."
 zin_dominion.19.t:0 "The Steward's Choice"
 zin_dominion.23.a:0 "So the compact ends."
 zin_dominion.23.desc:0 "The dead of the north and the hosts of the south no longer keep apart by agreement. The roads that were open between them have been shut again, and neither side has sent a herald to say why."
 zin_dominion.23.t:0 "The Compact Ends"
 zin_dominion.24.a:0 "The watch goes on."
 zin_dominion.24.desc:0 "Mirolon has yielded, but its court has not. The High Warden and the keepers of the ledgers have gone into exile under the banners of the watch, and from a borrowed hall they still count the hosts of the south."
 zin_dominion.24.t:0 "A Court in Exile"
 zin_dominion.29.a:0 "Let the storms keep him."
 zin_dominion.29.desc:0 "Nafeher has fallen and the Dominion is broken, but nobody saw Volgan fall. The last riders out of the south say that he went down into the storms with his crown on his head, and no one living can say where he is now."
 zin_dominion.29.t:0 "Nafeher Falls Silent"
 zin_east.41.a:0 "The court decides."
 zin_east.42.a:0 "We sail with the host."
 zin_east.42.a.tt:0 "We join the eastern coalition and share its ambition in the west."
 zin_east.42.b:0 "This is not our war."
 zin_east.42.b.tt:0 "We take no part in the crossing of the rift."
 zin_east.42.desc:0 "The courts of the East are looking to us. The kings of the rift coast have agreed that the elven shore across the water is rich, and that Aenor has too many quarrels of its own to defend anybody else's, and they want one crown at the head of the host before it sails. Our captains say it should be ours, and they have already begun to count the ships."
 zin_east.42.desc1:0 "Envoys of the court that will lead the eastern host have come to us with a plan and a share of the spoils. The elven shore across the Rift Sea is rich, they say, and Aenor is too busy with its own troubles to come to its aid, so that a host that sails this season will be home by harvest with more than it took."
 zin_east.42.t:0 "The Eastern Coalition Asks"
 zin_east.43.a:0 "The East has gone to war."
 zin_east.43.desc:0 "Eastern banners have crossed the Rift Sea into the Magical Lands. The kings of the rift coast put their companies ashore on the elven side within a few days of one another, and the wardens of the woods are falling back on the groves, as the elves have always done when men came over the water."
 zin_east.43.t:0 "The Crossing of the Rift"
 zin_east.44.a:0 "So the war comes to the Vale."
 zin_east.44.desc:0 "The eastern host has turned from the elven woods toward Aenor. Its captains sent heralds to Parim with a declaration and nothing else, and the roads of the Vale are full of carts going the other way, piled with bedding and children and whatever the families could not bear to leave behind."
 zin_east.44.t:0 "The Host Turns West"
 zin_east.45.a:0 "Make peace and bring the host home."
 zin_east.45.a.tt:0 "We make peace with every enemy we fight in the Magical and Middle Lands, and give up the coalition's ambition."
 zin_east.45.b:0 "We fight on for our own gain."
 zin_east.45.desc:0 "The host that crossed the rift sailed under many banners, and now our captains are asking whose war they are fighting. A king has been proclaimed in the East who expects every court to kneel to him, and our lords want to know whether the spoils of the elven shore are worth a war that somebody else means to finish and to keep."
 zin_east.45.desc1:0 "The host that crossed the rift sailed under many banners, and the banners no longer agree. Our captains say that the spoils of the elven shore have cost more than they were worth, and that if we make our own peace now we may bring home most of the men we took away."
 zin_east.45.t:0 "The Coalition Breaks"
 zin_east.46.a:0 "Let them serve the stranger."
 zin_east.46.a.tt:0 "Our companies march with the stranger's coalition, and our captains learn from the war."
 zin_east.46.b:0 "Order them home."
 zin_east.46.b.tt:0 "The companies come home, and their levies return to us."
 zin_east.46.desc:0 "Our companies in the west were left behind when the eastern host broke apart, and they are camped among people who were their enemies a season ago. Now the stranger from the north has come back out of the sky on a dragon and is gathering everybody who will fight the dead, and our captains want to know whether they may march with him or should come home while there is still a road to come home by."
 zin_east.46.t:0 "Abandoned Companies"
 zin_east.50.a:0 "Send gifts to the King."
 zin_east.50.a.tt:0 "The King of the East thinks better of us, and we owe him nothing for it."
 zin_east.50.b:0 "We will not kneel to him."
 zin_east.50.b.tt:0 "We stand with the courts that refuse the King of the East."
 zin_east.50.c:0 "Say nothing, and wait."
 zin_east.50.desc:0 "[zin_loc_deliverer] has been proclaimed King of the East, and his heralds have reached every court that was not asked to kneel to him. They bring no demands, only the news and the offer of a place at his table, and they have made it quite plain that the place will not be kept empty for ever."
 zin_east.50.t:0 "A King in the East"
 zin_east.51.a:0 "Then we will answer for them."
 zin_east.51.a.tt:0 "We may call the courts that refuse the King of the East to our side."
 zin_east.51.desc:0 "The courts that would not kneel to the King of the East have looked about them for somebody to stand at their head, and their envoys have come to us. They do not ask for a crown or an oath, only that we answer for them when the King's heralds come again, and that ours is the banner the others can see from their own walls."
 zin_east.51.t:0 "First of the Free Crowns"
 zin_east.52.a:0 "Send the levies."
 zin_east.52.a.tt:0 "Our levies march to the King's host."
 zin_east.52.b:0 "Send gold instead."
 zin_east.52.b.tt:0 "We pay the King in authority rather than in men."
 zin_east.52.c:0 "Plead a bad harvest, and delay."
 zin_east.52.c.tt:0 "We put the King off for a year, and his court will not forget it."
 zin_east.52.desc:0 "The King of the East has come back from his war in the west, and his heralds are at our gate with a reckoning of what each of his courts owes him: men for his host, or gold for its wages. They are polite about it, and they have brought enough soldiers of their own to make sure that nobody mistakes the politeness for anything else."
 zin_east.52.t:0 "The King Calls His Host"
 zin_east.60.a:0 "Our seals are our own again."
 zin_east.60.b:0 "We were right to refuse him."
 zin_east.60.c:0 "The East goes back to its old quarrels."
 zin_east.60.desc:0 "The King of the East is dead, and the dominion he built has nobody left to hold it together. His officers have ridden away from our court and our seals are our own again, though the debts he made us run up in his name have not died with him, and the courts that refused him are not inclined to forget which of us knelt."
 zin_east.60.desc1:0 "The King of the East is dead. The courts that would not kneel to him have been proved right, and in our halls the lords say so loudly and often, though the old quarrels of the East are already coming back now that nobody needs to stand together against him."
 zin_east.60.desc2:0 "The King of the East is dead, and the East is at once what it was before him: a crowd of courts with long memories and short tempers, each counting what the others gained while he reigned."
 zin_east.60.t:0 "The King of the East Is Fallen"
 zin_elves.51.a:0 "The woods will remember him."
 zin_elves.51.desc:0 "Word has come along the elven roads from the Middle Lands that Varner, the wizard of the Unbinding, is dead. The men who saw it say that he stood between them and the dead of the north with nothing but his wards, and held until there was nothing left of him to hold with. The elders have not agreed on what his passing means for the woods, though they agree that he should not have had to stand there alone."
 zin_elves.51.t:0 "The Wizard Is Gone"
 zin_elves.70.a:0 "Every tree is a wall."
 zin_elves.70.b:0 "Double the watch at the Wall gates."
 zin_elves.70.desc:0 "Sails have come out of the east across the Rift Sea, more of them than the fishermen of the rift coast have ever counted, and the banners above them belong to the eastern kings. They have landed on our shore with ladders and siege engines, and the wardens who rode back to the groves say that nobody aboard those ships had come to trade."
 zin_elves.70.desc1:0 "Sails have come out of the east across the Rift Sea, and the eastern kings have landed their companies on the elven shore. The wardens of the Wall say the elves are falling back on their groves and asking nothing of us, as they have asked nothing of men for a very long time."
 zin_elves.70.t:0 "Sails on the Rift Sea"
 zin_elves.71.a:0 "Keep the gates shut to all."
 zin_elves.71.a.tt:0 "The gates of the Wall stay shut, to the elves as to the eastern host."
 zin_elves.71.b:0 "Offer them companies of ours."
 zin_elves.71.b.tt:0 "The Magical Forest is asked whether it will open the Wall gates to our companies."
 zin_elves.71.desc:0 "Riders in green have come down from the Magical Forest to the gates of the Wall. They have not come to ask for help, they say, because the elves do not ask men for armies; they have come so that nobody on our side of the Wall can say afterwards that he was not told. An eastern host is in the woods, and the gates between our two peoples are the only road it could take into our country if it wished to."
 zin_elves.71.t:0 "Elven Envoys at the Gate"
 zin_elves.9.a:0 "Let the Houses build their halls."
 zin_elves.9.a.tt:0 "The grievance over the Wall eases, and the Houses of the First Light open halls on our roads."
 zin_elves.9.b:0 "The woods keep no temples."
 zin_elves.9.b.tt:0 "The grievance over the Wall grows, and our houses are the calmer for the refusal."
 zin_elves.9.desc:0 "Envoys of King Aurevan have come up to the Wall with the new tolls of Parim in one hand and an offer in the other. The tolls on the elven roads will be lifted, they say, if the Houses of the First Light may raise their halls beside those roads, so that the pilgrims who walk them have somewhere to sleep that is not an elven grove. They are courteous about it, and they have brought gifts for the wardens' children."
 zin_elves.9.t:0 "The New King's Customs"
 zin_leren.30.a:0 "The North holds its own shores."
 zin_leren.30.desc:0 "Lerendor has left the Treaty of the Narrow Strait. The squadrons that watched the strait for Aenor are coming home, the oath of 4A 512 is struck from the rolls of Sonargur, and from today the North will hold its own shores and nobody else's."
 zin_leren.30.t:0 "The Treaty of the Narrow Strait Is Ended"
 zin_leren.31.a:0 "Then we hold the strait ourselves."
 zin_leren.31.desc:0 "A rider from Sonargur has brought the king's letter to the council: Lerendor has left the Treaty of the Narrow Strait. The North will not make war on us, the letter says, but it will not fight for us either, and its ships will no longer keep the strait on our behalf."
 zin_leren.31.t:0 "The North Withdraws"
 zin_leren.32.a:0 "The old alliance is over."
 zin_leren.32.desc:0 "Lerendor has left the Treaty of the Narrow Strait, which bound the North to Aenor for more than twelve hundred years. Sonargur says that the North will hold its own shores, and it has not declared war on anyone."
 zin_leren.32.t:0 "The Narrow Strait Treaty Ends"
 zin_leren.33.a:0 "The North keeps its word."
 zin_leren.33.desc:0 "Lerendor keeps the old promise. The king of the North has answered Aenor's call under the Treaty of the Narrow Strait, and the Leren squadrons have put out from Sonargur to fight beside the ships of Aenor."
 zin_leren.33.t:0 "The Old Alliance Holds"
 zin_leren.35.a:0 "The court decides."
 zin_leren.36.a:0 "We wait and watch."
 zin_leren.36.a.tt:0 "Our standing with Aenor falls a little while we keep it waiting."
 zin_leren.36.b:0 "Honour the oath now."
 zin_leren.36.b.tt:0 "Lerendor joins Aenor's defensive wars under the treaty."
 zin_leren.36.c:0 "Leave the treaty now."
 zin_leren.36.c.tt:0 "Lerendor leaves the Treaty of the Narrow Strait without making war on Aenor."
 zin_leren.36.desc:0 "Every crown on the shores of the central sea is arming, and the old treaty still binds Sonargur to Parim. The captains want to know before the ice breaks whether the North will keep its oath to Aenor, or leave it, or let the king go on deciding later, which is what he has done all winter."
 zin_leren.36.t:0 "The War and the Treaty"
 zin_leren.45.a:0 "Parim knows its own business."
 zin_leren.45.b:0 "Have our merchants listen for more."
 zin_leren.45.b.tt:0 "The stranger will think better of the North."
 zin_leren.45.desc:0 "Merchants back from Parim say that a stranger has come down into Aenor whom the Golden Court calls an impostor, and that [zin_loc_eindil] talks of the black north as though he had seen it from the ice. The captains in the hall laughed when they heard it, and then they went quiet."
 zin_leren.45.t:0 "A Stranger in Aenor"
 zin_mistake.10.a:0 "South, to Aenor."
 zin_mistake.10.b:0 "The northern shores."
 zin_mistake.10.c:0 "The edge of the elven woods."
 zin_mistake.10.desc:0 "The dead stand on every black isle and on every road of the Mistake, and the tide has turned south. No voice is raised in the hall of Furviatlon, and none is needed, for the hosts wait only to be told which shore to take."
 zin_mistake.10.t:0 "Whither the Dead"
 zin_mistake.11.a:0 "So the fishermen were right."
 zin_mistake.11.desc:0 "Black hulls came ashore on the northern coasts in the night, and in the morning the dead were on the roads. The fishermen of the Kusmeel had been saying for a year that this would happen, and nobody at any court had listened to them."
 zin_mistake.11.t:0 "The Dead Come Out of the North"
 zin_mistake.16.a:0 "Let the two hosts keep apart."
 zin_mistake.16.a.tt:0 "The dead and the Dominion make peace and open their roads to each other, without joining one league."
 zin_mistake.16.b:0 "The dead answer to no herald."
 zin_mistake.16.desc:0 "A herald of Nafeher has ridden to the edge of the black plain under a grey banner, and he waits there as the living wait, for an answer. The hosts of the south will stop fighting the dead of the north if the dead will do the same, for as long as the heir and his coalition still stand in the field."
 zin_mistake.16.t:0 "The Brief Accord"
 zin_mistake.2.a:0 "Sailors' tales."
 zin_mistake.2.b:0 "Send a ship to look."
 zin_mistake.2.b.tt:0 "If the dead ever come out of the north, our captains will not be taken by surprise."
 zin_mistake.2.desc:0 "The harbour-master has heard the same story from three crews this month: black hulls moving among the islands of the Kusmeel with no lamp aboard, and lights on the shore there that are not fires. None of the three will fish those waters again before spring, whatever herring fetches at market."
 zin_mistake.2.t:0 "Tales of Black Ships"
 zin_mistake.20.a:0 "Hold the line."
 zin_mistake.20.desc:0 "The sky went dark over the field at noon. Out of the north came a shape more than twice the height of a man, black and shrouded, with pale clawed hands, and wherever it passed the dead stood straighter and the living could not get their breath. The Leren who saw it from their ships have a name for it that they say only in a whisper: Kusven, the grave-wind, Zol's most loyal servant."
 zin_mistake.20.t:0 "Kusven Comes Forth"
 zin_mistake.21.a:0 "The servant is wounded, and the sword is shards."
 zin_mistake.21.b:0 "Carry the heir from the field."
 zin_mistake.21.desc:0 "The heir charged, and Kusven stopped him with one finger. He took the blue sword of Horos out of the heir's hand and crushed it into glittering shards, then caught him by the throat until the light in his armour dimmed. With what strength he had left the heir closed his hand on a shard of the broken blade and drove it into the servant's side, and because the shard still carried Glernaen's power, Kusven shook."
 zin_mistake.21.t:0 "The Blue Sword Breaks"
 zin_mistake.22.a:0 "We ride, for all the living."
 zin_mistake.22.a.tt:0 "Lorien rides north with the old lords against Zol's servant."
 zin_mistake.22.b:0 "This is not our war."
 zin_mistake.22.desc:0 "Word has come down from the north that Kusven walks the field, the grave-wind of the old winter tales, and that the living cannot hold him. Lorien has risen from his seat. The oldest lords of the world are gathered in the hall, and they are waiting to hear whether the King of Gala means to ride."
 zin_mistake.22.t:0 "The Old Lords Ride"
 zin_mistake.23.a:0 "Remember the King of Gala."
 zin_mistake.23.desc:0 "Lorien, King of Gala, who fought at Dardan, rode against Kusven with the oldest lords of the world and died forcing him back, and other spirits of great age were broken beside him. Zol's servant left the field wounded, and he was not destroyed."
 zin_mistake.23.t:0 "Lorien's Stand"
 zin_mistake.24.a:0 "Bury the dead."
 zin_mistake.24.desc:0 "Kusven has gone back into the dark of the black north. He was not slain, and he has left behind him a wasteland and a continent full of dead, which the living must now bury."
 zin_mistake.24.t:0 "Kusven Withdraws"
 zin_mistake.25.a:0 "Let the north keep its dead."
 zin_mistake.25.desc:0 "Kusven could not stay on the field any longer. The Presence that held him there was spent, and he went back into the dark of the north wounded and not slain, while the dead who had marched beside him lay down where they stood."
 zin_mistake.25.desc1:0 "The dead have gone back into the north. Their hosts lost their hold on the roads one after another, and the black hulls left the coasts as quietly as they had come."
 zin_mistake.25.t:0 "The North Falls Quiet"
 zin_mistake.26.a:0 "The court decides."
 zin_sun_council_of_gala:0 "The Council of Gala"
 zin_sun.40.a:0 "The King of Gala rides."
 zin_sun.40.desc:0 "The King of Gala has ridden north out of the Lands of the Sun with the oldest lords of the world behind him, elves in white and gold and others that are older than elves. The roads emptied ahead of them, and nobody who watched them pass thought to ask where they were going."
 zin_sun.40.t:0 "The Old Lords Ride"
 zin_sun.42.a:0 "The Keeper of the Mirror."
 zin_sun.42.a.tt:0 "Heveneya, Keeper of the Mirror, keeps the court, and the Mirror shows more clearly."
 zin_sun.42.b:0 "The Master of the King's Ships."
 zin_sun.42.b.tt:0 "The Master of the King's Ships keeps the court, and the fleet gains experience."
 zin_sun.42.c:0 "A Council of the Old Houses."
 zin_sun.42.c.tt:0 "The old houses keep the court together, and Gala is calmer for it."
 zin_sun.42.desc:0 "Lorien is dead, and in all the years of Gala nobody has had to ask who keeps the court after him. The old houses are gathered by the Mirror, and before they leave the hall they must choose who keeps the court now."
 zin_sun.42.t:0 "After the King"
