l_english:
 zin_regional_andos_enda_a_slight_remembered:0 "A Slight Remembered"
 zin_regional_andos_enda_a_slight_remembered_desc:0 "An old grove-speaker recites the list of Herrodon's offences before the moot, as she does every year. This year the younger speakers listen."
 zin_regional_andos_enda_andosiels_voice:0 "Andosiel's Voice"
 zin_regional_andos_enda_andosiels_voice_desc:0 "Speaker Andosiel carries the moot's word to every grove and brings the groves' word back. The office has no crown, and a good Speaker needs none."
 zin_regional_andos_enda_answer_in_kind:0 "Answer in Kind"
 zin_regional_andos_enda_answer_in_kind_desc:0 "The federation's archers drill at the edge of the boundary groves, in plain sight of Herrodon's watchers. Nobody draws a bow, and everybody knows what the drill is for."
 zin_regional_andos_enda_eastern_water_watch:0 "Watch on the Eastern Water"
 zin_regional_andos_enda_eastern_water_watch_desc:0 "Watchers on the river heads see every keel on the eastern water."
 zin_regional_andos_enda_eastern_woods:0 "The Eastern Woods"
 zin_regional_andos_enda_eastern_woods_desc:0 "The eastern woods are the federation's livelihood, and its first workshops rise where the woods are thickest and the rivers are near."
 zin_regional_andos_enda_every_grove:0 "Every Grove Its Voice"
 zin_regional_andos_enda_every_grove_desc:0 "Each grove keeps its voice and its veto, and the federation keeps its peace."
 zin_regional_andos_enda_every_grove_its_voice:0 "Every Grove Its Voice"
 zin_regional_andos_enda_every_grove_its_voice_desc:0 "Each grove keeps its own voice and its own veto. The moot is slow, and what it decides is not easily undone."
 zin_regional_andos_enda_federal_host:0 "The Federal Host"
 zin_regional_andos_enda_federal_host_desc:0 "Five groves, one banner, and a host that drills as a single company."
 zin_regional_andos_enda_federal_moot:0 "The Federal Moot"
 zin_regional_andos_enda_federal_moot_desc:0 "The moot speaks slowly and loudly, and what it decides is hard to turn."
 zin_regional_andos_enda_federation_defends:0 "The Federation Defends"
 zin_regional_andos_enda_federation_defends_desc:0 "Every grove is a fortress and every speaker at the walls."
 zin_regional_andos_enda_forgive_the_old_slights:0 "Forgive the Old Slights"
 zin_regional_andos_enda_forgive_the_old_slights_desc:0 "The moot resolves to forgive, slowly and in order, the offences of the western crown. It is a long list, and the Speaker reads it only once."
 zin_regional_andos_enda_grove_roads:0 "Grove Roads"
 zin_regional_andos_enda_grove_roads_desc:0 "Mossy tracks between the groves are widened and paved, so that a speaker may reach the moot in a day instead of three."
 zin_regional_andos_enda_grove_scouts:0 "Grove Scouts"
 zin_regional_andos_enda_grove_scouts_desc:0 "Scouts of the eastern groves slip through the underbrush on nights without a moon. They carry shuttered lanterns, and signal in the old hand-speech of the woods."
 zin_regional_andos_enda_grove_scouts_spirit:0 "Grove Scouts"
 zin_regional_andos_enda_grove_scouts_spirit_desc:0 "Silent scouts and shuttered lanterns see farther than any host."
 zin_regional_andos_enda_groves_shared_with_herrodon:0 "The Groves Shared with Herrodon"
 zin_regional_andos_enda_groves_shared_with_herrodon_desc:0 "With the quarrel cold, the Speaker offers Herrodon the boundary groves in common: tended by both, owned by neither, and named in no one's boundary-lay."
 zin_regional_andos_enda_hold_the_eastern_groves:0 "Hold the Eastern Groves"
 zin_regional_andos_enda_hold_the_eastern_groves_desc:0 "Every grove is made a fortress. Barricades of thorn and fallen oak close the lanes, and archers take the high boughs."
 zin_regional_andos_enda_kin_of_andos_enda:0 "Kin of Andos Enda"
 zin_regional_andos_enda_kin_of_andos_enda_desc:0 "The Speaker sends gifts of resin and amber to the great forest and a promise that Andos Enda will not forget its kin."
 zin_regional_andos_enda_letters_from_sonargur:0 "Letters from Sonargur"
 zin_regional_andos_enda_letters_from_sonargur_desc:0 "Ships from the north call at the eastern rivers for timber, and the merchants of Sonargur know the grove-speakers by name. The Speaker answers their letters warmly, and signs nothing."
 zin_regional_andos_enda_longbows_of_andos_enda:0 "Longbows of Andos Enda"
 zin_regional_andos_enda_longbows_of_andos_enda_desc:0 "The eastern bowyers cut yew from the oldest groves and string their bows with resin-waxed gut. Each stave is dated by the year its tree fell."
 zin_regional_andos_enda_northern_letters:0 "Letters from Sonargur"
 zin_regional_andos_enda_northern_timber:0 "Timber for Leren Ships"
 zin_regional_andos_enda_northern_timber_desc:0 "Fallen timber is sold to the northern yards, and the trade brings goodwill."
 zin_regional_andos_enda_one_voice:0 "One Voice for Andos Enda"
 zin_regional_andos_enda_one_voice_desc:0 "In time of need the Speaker carries one voice for all five groves."
 zin_regional_andos_enda_one_voice_for_andos_enda:0 "One Voice for Andos Enda"
 zin_regional_andos_enda_one_voice_for_andos_enda_desc:0 "The groves agree that in times of need the Speaker shall carry one voice for them all. Decisions come faster, and a few grove-speakers grow quiet."
 zin_regional_andos_enda_peace_in_the_woods:0 "Peace in the Woods"
 zin_regional_andos_enda_peace_in_the_woods_desc:0 "The enemy is gone, the groves are whole and the moot meets again beneath the leaves. The Speaker reads the names of the fallen, and the moot sits in silence."
 zin_regional_andos_enda_remember_every_slight:0 "Remember Every Slight"
 zin_regional_andos_enda_remember_every_slight_desc:0 "The moot resolves that no slight of Herrodon's shall be forgotten. The Queen's crown is remembered as the first of them."
 zin_regional_andos_enda_resin_and_timber:0 "Resin and Timber"
 zin_regional_andos_enda_resin_and_timber_desc:0 "Amber resin and dry timber are barrelled on the river quays and sold to all who ask. The groves lose nothing they would not have lost to the autumn."
 zin_regional_andos_enda_resin_trade:0 "Resin and Timber"
 zin_regional_andos_enda_resin_trade_desc:0 "Amber and dry timber move down the rivers, though the groves buy less cloth than they used to."
 zin_regional_andos_enda_seek_the_forests_word:0 "Seek the Forest's Word"
 zin_regional_andos_enda_seek_the_forests_word_desc:0 "The Speaker sends an envoy to the Magical Forest to ask whose the boundary groves are. The great forest has judged between elves since before any grove had a name."
 zin_regional_andos_enda_shore_beacons:0 "Shore Beacons"
 zin_regional_andos_enda_shore_beacons_desc:0 "Beacon stacks of resinous pine are raised on the eastern headlands and lit on the first sign of a strange keel."
 zin_regional_andos_enda_shore_levies:0 "Shore Levies"
 zin_regional_andos_enda_shore_levies_desc:0 "Shore-folk are asked to keep bows by their doors and a rota of watchers on the river mouths. It is not a host, but it would answer if one were needed."
 zin_regional_andos_enda_speakers_wardens:0 "The Speakers' Wardens"
 zin_regional_andos_enda_speakers_wardens_desc:0 "The wardens of the federation serve their groves first and the moot second. They are taught by the old foresters, who prize silence above speed and patience above both."
 zin_regional_andos_enda_stand_apart:0 "The Elves Stand Apart"
 zin_regional_andos_enda_stand_apart_desc:0 "The federation writes warmly to the north and signs nothing."
 zin_regional_andos_enda_stand_with_the_kindred:0 "Stand with the Kindred"
 zin_regional_andos_enda_stand_with_the_kindred_desc:0 "The Kindred of the Woods has been raised, and the Speaker lets the moot vote on it once. The vote is unanimous, which has never happened before."
 zin_regional_andos_enda_the_elves_stand_apart:0 "The Elves Stand Apart"
 zin_regional_andos_enda_the_elves_stand_apart_desc:0 "The speakers write warmly to Sonargur and sign nothing. Trade is welcome, kindness is welcome, and a seat in any northern league is not."
 zin_regional_andos_enda_the_federal_host:0 "The Federal Host"
 zin_regional_andos_enda_the_federal_host_desc:0 "On the Speaker's call the wardens of five groves assemble beneath the moot's green banner. A host of five voices, it seldom needs to be called."
 zin_regional_andos_enda_the_federal_moot:0 "The Federal Moot"
 zin_regional_andos_enda_the_federal_moot_desc:0 "The moot is given a fixed hall among the eastern trees, with a circle of stumps for seats and a rule that none may speak twice before all have spoken once."
 zin_regional_andos_enda_the_federation_defends:0 "The Federation Defends"
 zin_regional_andos_enda_the_federation_defends_desc:0 "Strangers have crossed the eastern border in arms. The moot meets under the open sky, the horns sound in all five groves, and no seat is empty."
 zin_regional_andos_enda_the_federation_endures:0 "The Federation Endures"
 zin_regional_andos_enda_the_federation_endures_desc:0 "Five groves, one moot and no crown. Whatever the Federation may lack in splendour, it makes up in endurance."
 zin_regional_andos_enda_the_feud_of_the_groves:0 "The Feud of the Groves"
 zin_regional_andos_enda_the_feud_of_the_groves_desc:0 "The moot has decided that the quarrel will no longer be argued, and the federation takes the boundary groves by force. It is meant to be a local war, and the elders say so loudly."
 zin_regional_andos_enda_the_grove_speakers:0 "The Grove-Speakers"
 zin_regional_andos_enda_the_grove_speakers_desc:0 "Each grove-speaker holds their seat for as long as their grove trusts them. They are not clever men, but they are honest, and the federation has endured on little else."
 zin_regional_andos_enda_the_kin_answer:0 "The Kin Answer"
 zin_regional_andos_enda_the_kin_answer_desc:0 "The kin of the neighbouring groves arrive without being called, bringing arrows, bread and a willingness to stand in the front rank."
 zin_regional_andos_enda_the_refusal_remembered:0 "The Refusal Remembered"
 zin_regional_andos_enda_the_refusal_remembered_desc:0 "The moot recalls why the elves sent no armies after Edran's folly. Healers will go, hosts will not, and the federation will say so to anyone who asks."
 zin_regional_andos_enda_the_speakers_federation:0 "The Speakers' Federation"
 zin_regional_andos_enda_the_speakers_federation_desc:0 "Five clusters of eastern groves send their grove-speakers to one moot and choose one Speaker from among them. Andos Enda holds no crown and thinks crowns vain, and it has never regretted the habit."
 zin_regional_andos_enda_the_woods_prosper:0 "The Woods Prosper"
 zin_regional_andos_enda_the_woods_prosper_desc:0 "Craftsmen from five groves share their patterns, and the federation's workshops begin to turn out wares that no single grove could have made."
 zin_regional_andos_enda_timber_for_leren_ships:0 "Timber for Leren Ships"
 zin_regional_andos_enda_timber_for_leren_ships_desc:0 "The eastern groves sell fallen timber to the shipwrights of the north. The elves cut nothing living, and the northerners learn to wait for the wind to do their felling."
 zin_regional_andos_enda_wanderers_of_andos_enda:0 "Wanderers of Andos Enda"
 zin_regional_andos_enda_wanderers_of_andos_enda_desc:0 "Grove-healers and forest-wardens travel the roads as wanderers, answering the calls of strangers and asking no price."
 zin_regional_andos_enda_watch_the_eastern_water:0 "Watch the Eastern Water"
 zin_regional_andos_enda_watch_the_eastern_water_desc:0 "The federation's woods face east, toward the rift. A chain of watchers is posted on the river heads and the eastern headlands, to see whatever comes over the water."
 zin_regional_andos_enda_woods_prosper:0 "The Woods Prosper"
 zin_regional_andos_enda_woods_prosper_desc:0 "Shared patterns of craft speed every new building."
 zin_regional_andos_enda.1.a:0 "The groves decide."
 zin_regional_andos_enda.1.b:0 "The Speaker leads."
 zin_regional_andos_enda.1.d:0 "The grove-speakers of the five eastern groves gather beneath the open sky for the year's first moot. They have agreed on everything except who shall speak first."
 zin_regional_andos_enda.1.t:0 "The Grove-Speakers Meet"
 zin_regional_andos_enda.2.a:0 "Let it pass."
 zin_regional_andos_enda.2.b:0 "Answer it."
 zin_regional_andos_enda.2.d:0 "An old grove-speaker rises in the moot and recites, as she does each year, the oldest of Herrodon's offences: a crown set up over free groves. The younger speakers do not ask her to sit down."
 zin_regional_andos_enda.2.t:0 "A Slight Remembered"
 zin_regional_andos_enda.3.a:0 "We will judge."
 zin_regional_andos_enda.3.b:0 "The rivals must settle it."
 zin_regional_andos_enda.3.d:0 "An envoy from Andos Enda stands before the elders of the Magical Forest and asks them to judge the quarrel of the boundary groves. The elders have judged many quarrels, and few so old."
 zin_regional_andos_enda.3.t:0 "Andos Enda Asks for Judgement"
 zin_regional_andos_enda.4.a:0 "Share the groves."
 zin_regional_andos_enda.4.b:0 "Herrodon remembers."
 zin_regional_andos_enda.4.d:0 "A herald from Andos Enda brings the Queen of Herrodon an offer she did not expect: the boundary groves held in common, tended by both and claimed by neither. The Queen has never been asked to forgive anyone before breakfast."
 zin_regional_andos_enda.4.t:0 "The Groves Shared"
