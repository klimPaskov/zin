l_english:
 zin_regional_corogon_a_ship_for_the_houseless_king:0 "A Ship for the King Without a House"
 zin_regional_corogon_a_ship_for_the_houseless_king_desc:0 "Several western courts have made a houseless stranger their war-king. Corogon, which knows ships better than kings, sends him a hull and a wayfinder of the old school."
 zin_regional_corogon_consul_canaks_embassy:0 "Consul Canak's Embassy"
 zin_regional_corogon_consul_canaks_embassy_desc:0 "Sobra Canak sends an embassy to Raerby, where the island captains judge the disputes of the western seas. She wants them as friends, and as witnesses."
 zin_regional_corogon_consular_charter:0 "The Consular Charter"
 zin_regional_corogon_consular_charter_desc:0 "The ship-owners and the quays have written one charter between them, and the consuls rule by it. Every voter can read it, and many can recite it."
 zin_regional_corogon_consulates:0 "Consulates Abroad"
 zin_regional_corogon_consulates_abroad:0 "Consulates Abroad"
 zin_regional_corogon_consulates_abroad_desc:0 "A consul is posted in every large harbour on the southern coast. Each has a small house, a flag and a ledger, and each writes home every week."
 zin_regional_corogon_consulates_desc:0 "Corogon keeps a consul in every harbour of the southern coast and on the isles. They collect news, settle disputes and send word home before the news is stale."
 zin_regional_corogon_convoy_charters:0 "Escort Charters"
 zin_regional_corogon_convoy_charters_desc:0 "Merchantmen sail in company under the guard of armed hulls, and pay a share of the cargo for it. The charters are cut on tablets and hung in the harbour-house."
 zin_regional_corogon_convoy_charters_kept:0 "Escort Charters"
 zin_regional_corogon_convoy_charters_kept_desc:0 "Merchant ships sail in company under the protection of armed hulls, paid for by a share of every cargo. The sea is long, but the charters hold it together."
 zin_regional_corogon_corogon_sea_soldiers:0 "Sea Soldiers of Corogon"
 zin_regional_corogon_corogon_sea_soldiers_desc:0 "Quay-hands and deck-crews are drilled to fight when the ship is boarded. They are not many, but they know what a gunwale is for."
 zin_regional_corogon_corogons_stranded:0 "Corogon's Stranded Sea-Soldiers"
 zin_regional_corogon_corogons_stranded_desc:0 "Some of Corogon's sea soldiers did not sail home. They hold a quay beyond the sea, and they will follow a banner that promises to bring them back."
 zin_regional_corogon_crossbow_decks:0 "Crossbow Decks"
 zin_regional_corogon_crossbow_decks_desc:0 "A platform for crossbowmen is built on every merchantman, with a rack of bolts and a screen against the spray. A pirate approaching a Corogon ship is a bad day for the pirate."
 zin_regional_corogon_crossing_purse:0 "The Crossing Purse"
 zin_regional_corogon_crossing_purse_desc:0 "The treasury of Corogon has been poured into the western fleet. Ships are chartered, crews are paid and the quays are empty of goods."
 zin_regional_corogon_elections_at_the_harbour:0 "Elections at the Harbour"
 zin_regional_corogon_elections_at_the_harbour_desc:0 "Every four years the harbour assembly elects its consuls. The ships dress their masts, and the quays throw their caps in the water."
 zin_regional_corogon_embassy:0 "An Embassy of Corogon"
 zin_regional_corogon_harbour_guard:0 "The Harbour Guard"
 zin_regional_corogon_harbour_guard_desc:0 "The quays raise a guard of dockers and chandlers, with staves, hooks and a few good swords. It is not an army, but it holds the pier."
 zin_regional_corogon_home_ports:0 "Home Ports"
 zin_regional_corogon_home_ports_desc:0 "The ships come home to Corogon, one by one. The consuls count them in the harbour, and the quays are loud with welcome."
 zin_regional_corogon_hulls_for_hire:0 "Hulls for Hire"
 zin_regional_corogon_hulls_for_hire_desc:0 "The Ford Council needs hulls and Corogon has them. The consuls quote a price for each, to be paid in advance, and the council agrees."
 zin_regional_corogon_island_trade:0 "The Island Routes"
 zin_regional_corogon_island_trade_desc:0 "A regular sailing now links the harbours of Corogon with the market of Pollos. Salt-fish goes south, wool goes north and both are cheaper for it."
 zin_regional_corogon_merchant_fleet:0 "The Merchant Fleet"
 zin_regional_corogon_merchant_fleet_desc:0 "The yards of Corogon build the broad-beamed merchantmen that carry its goods to every shore of the central sea. New slips are cut, and the old ones are lengthened."
 zin_regional_corogon_parims_charter_ships:0 "Under Parim's Charter"
 zin_regional_corogon_parims_charter_ships_desc:0 "Corogon's ships fly the royal charter in Aenoran waters and pay no second duty. The consuls complain about the first, but they pay it."
 zin_regional_corogon_relief_from_the_south_sea:0 "Relief from the South Sea"
 zin_regional_corogon_relief_from_the_south_sea_desc:0 "The West will sail to defend the Middle Lands, and Corogon sends hulls with the relief. The ships carry grain as well as spears."
 zin_regional_corogon_sea_captains_of_corogon:0 "Sea-Captains of Corogon"
 zin_regional_corogon_sea_captains_of_corogon_desc:0 "Lio Marren is the best of a generation of captains who learned their trade running the southern coast. The consuls give him a commission and a stern message."
 zin_regional_corogon_sea_soldiers_of_corogon:0 "Sea Soldiers of Corogon"
 zin_regional_corogon_sea_soldiers_of_corogon_desc:0 "The guard learns to fight on a heaving deck, where a spear is better than a sword and a rope is better than a shield. They practise in the harbour on market days."
 zin_regional_corogon_southern_trade:0 "Southern Trade"
 zin_regional_corogon_southern_trade_desc:0 "Corogon's fleets sail south for spice, silk and sugar, and north for wool and iron. The quays are widened to take the new cargo."
 zin_regional_corogon_spice_and_salt:0 "Spice and Salt"
 zin_regional_corogon_spice_and_salt_desc:0 "Dried peppers, cloves and rock-salt fill the warehouses in the southern quarter. The consuls take a tenth and sell the rest to the West."
 zin_regional_corogon_tariff_squeeze:0 "Squeezed by Parim's Tariffs"
 zin_regional_corogon_tariff_squeeze_desc:0 "Every cargo that crosses the wide sea pays duty twice, once at the Aenoran pier and again at the gate of Parim. The consuls keep the ledger of what they have paid, and they never lose it."
 zin_regional_corogon_tariffs_and_the_sea:0 "Tariffs and the Sea"
 zin_regional_corogon_tariffs_and_the_sea_desc:0 "Parim's tariffs squeeze Corogon hard, and its consuls know the figure to the last coin. The question is whether to bargain or to remember."
 zin_regional_corogon_the_consular_charter:0 "The Consular Charter"
 zin_regional_corogon_the_consular_charter_desc:0 "The harbour writes its customs into a charter, and the charter into its law. After this, a consul who breaks the dues must answer to the assembly, not the other way round."
 zin_regional_corogon_the_consuls:0 "The Consuls of Corogon"
 zin_regional_corogon_the_consuls_desc:0 "Corogon is governed by consuls, chosen by the ship-owners and the quays. Sobra Canak speaks for them now, from a tall chair in a hall that smells of tar and spice."
 zin_regional_corogon_the_corogon_pledge:0 "The Corogon Pledge"
 zin_regional_corogon_the_corogon_pledge_desc:0 "The consuls swear on the harbour-stone that Corogon will cross. The oath is witnessed by the captains, and entered in the ledger."
 zin_regional_corogon_the_counting_houses:0 "The Counting-Houses"
 zin_regional_corogon_the_counting_houses_desc:0 "The counting-houses of Corogon lend to half the West. Ves Doran has run the biggest of them for twenty years, and gives the consuls good advice at a reasonable rate."
 zin_regional_corogon_the_crossing_purse_spent:0 "The Crossing Purse Spent"
 zin_regional_corogon_the_crossing_purse_spent_desc:0 "The treasury has been poured out on the Crossing, and the counting-houses are empty. Corogon has bought the sea for the West, and now it has to live on credit."
 zin_regional_corogon_the_harbour_assembly:0 "The Harbour Assembly"
 zin_regional_corogon_the_harbour_assembly_desc:0 "The assembly meets on the quay at the turn of the tide. Captains, dockers and chandlers all have a voice, and the loudest is the one nearest the water."
 zin_regional_corogon_the_harbour_host:0 "The Harbour Host"
 zin_regional_corogon_the_harbour_host_desc:0 "The guard, the sea soldiers and the crossbow crews are joined into a single host. It is the first in the history of Corogon."
 zin_regional_corogon_the_island_routes:0 "The Island Routes"
 zin_regional_corogon_the_island_routes_desc:0 "A route is charted between Corogon and the market of Pollos, with beacons, anchorages and a list of rates. The consuls propose it to Pollos with a good dinner and a better map."
 zin_regional_corogon_the_long_keels:0 "The Long Keels"
 zin_regional_corogon_the_long_keels_desc:0 "Corogon builds its first great hulls for war: long, deep and fitted for ramming. They are expensive, and they are very good."
 zin_regional_corogon_the_market_quays:0 "The Market Quays"
 zin_regional_corogon_the_market_quays_desc:0 "Three new quays are built to the north of the old harbour, each with a market hall and a customs-house. The harbour is twice the size, and twice as loud."
 zin_regional_corogon_the_merchants_peace:0 "The Merchants' Peace"
 zin_regional_corogon_the_merchants_peace_desc:0 "The consuls decide that a lower duty is worth more than a longer grudge. They send an offer to Parim: a charter for their ships, in return for a lasting peace."
 zin_regional_corogon_the_purse_of_the_crossing:0 "The Purse of the Crossing"
 zin_regional_corogon_the_purse_of_the_crossing_desc:0 "The consuls open the treasury to the Crossing. Ships are chartered, crews are paid, and the counting-houses are told to lend whatever is needed."
 zin_regional_corogon_the_sea_remembers:0 "The Sea Remembers"
 zin_regional_corogon_the_sea_remembers_desc:0 "Every duty paid and every cargo seized is written on a tablet, and the tablets are carried to the harbour-house. The sea is long, and so is Corogon's memory."
 zin_regional_corogon_under_parims_charter:0 "Under Parim's Charter"
 zin_regional_corogon_under_parims_charter_desc:0 "The charter arrives under the royal seal, and the ships of Corogon fly it at the masthead. They pay one duty, not two, and the consuls say it is the best bargain of the decade."
 zin_regional_corogon_war_galleys_of_corogon:0 "War Galleys of Corogon"
 zin_regional_corogon_war_galleys_of_corogon_desc:0 "Galleys with thick sides and high prows are laid down in the northern yards. The captains argue about their names, and the carpenters argue about their cost."
 zin_regional_corogon.1.a:0 "The ship-owners win"
 zin_regional_corogon.1.b:0 "The quays win"
 zin_regional_corogon.1.d:0 "The harbour assembly meets on the quay, and the vote is counted in pebbles. The ship-owners want a consul who will lower the dues, and the quays want one who will raise the wages. Both have many pebbles."
 zin_regional_corogon.1.t:0 "Election at the Harbour"
 zin_regional_corogon.2.a:0 "Refuse"
 zin_regional_corogon.2.b:0 "Grant it"
 zin_regional_corogon.2.d:0 "A consul of Corogon stands in the antechamber at Parim, with a charter of the kind granted to friendly merchants. He asks that the ships of Corogon be treated as the ships of a friend, and promises that the consuls will remember the kindness."
 zin_regional_corogon.2.t:0 "A Charter for Corogon's Ships"
 zin_regional_corogon.3.a:0 "Not now"
 zin_regional_corogon.3.b:0 "Receive them"
 zin_regional_corogon.3.d:0 "A consul of Corogon and two clerks have landed at Raerby with a casket of seals. They come to open a regular embassy, to settle disputes between the harbours and to share the news of the western shore."
 zin_regional_corogon.3.t:0 "An Embassy from Corogon"
 zin_regional_corogon.4.a:0 "Keep the market for islanders"
 zin_regional_corogon.4.b:0 "Open the routes"
 zin_regional_corogon.4.d:0 "The consuls of Corogon propose a regular trade between their quays and the market of Pollos: fish and salt south, wool and iron-ware north. The routes will be marked on both charts, and the dues set at a fair figure."
 zin_regional_corogon.4.t:0 "The Island Routes"
