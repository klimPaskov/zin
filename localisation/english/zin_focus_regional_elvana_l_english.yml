l_english:
 zin_regional_elvana_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_elvana_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_elvana_a_fair_market_with_igara:0 "A Fair Market With Igara"
 zin_regional_elvana_a_fair_market_with_igara_desc:0 "Elvana proposes a fair market with Igara: shared weights, shared dues and a common bench for disputes. The Council is pleased, and Igara, to its surprise, agrees."
 zin_regional_elvana_a_seat_at_noon:0 "A Seat at Noon"
 zin_regional_elvana_a_seat_at_noon_desc:0 "The Sunhot realms meet at midday in an open court with no roof, where nothing is decided before the sun is overhead. [ROOT.GetName] takes its seat among them and speaks in its turn."
 zin_regional_elvana_ask_gala_to_judge:0 "Ask Gala to Judge"
 zin_regional_elvana_ask_gala_to_judge_desc:0 "If Elvana and Igara cannot agree, the King of Gala might judge between them. A letter is written, sealed and sent south."
 zin_regional_elvana_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_elvana_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_elvana_elvana_and_elvini:0 "Elvana and Elvini"
 zin_regional_elvana_elvana_and_elvini_desc:0 "Elvana is one state on two shores: the old towns of Elvana and Elvini, united under one council. Its fairs are the busiest of the Sunhot realms, and its merchants' great rival is Igara next door."
 zin_regional_elvana_elvini_remembers:0 "Elvini Remembers"
 zin_regional_elvana_elvini_remembers_desc:0 "Elvini keeps its own archive, and its scholars remember what the union cost them. The Speaker visits the archive and leaves a gift."
 zin_regional_elvana_harbours_on_the_sea_of_gods:0 "Harbours on the Sea of Gods"
 zin_regional_elvana_harbours_on_the_sea_of_gods_desc:0 "The Sea of Gods lies warm and green off the coast of [ROOT.GetName], and its harbours are kept swept and whitewashed. Pilgrims and merchants both come in fair weather, and every one is given a berth."
 zin_regional_elvana_healing_houses:0 "The Healing Houses"
 zin_regional_elvana_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_elvana_honour_the_president:0 "Honour the Chair"
 zin_regional_elvana_honour_the_president_desc:0 "The realm that keeps the Council's chair holds it for all and answers to all. [ROOT.GetName] sends gifts and an envoy to its court, and is thanked in the old words."
 zin_regional_elvana_markets_of_elvana:0 "The Markets of Elvana"
 zin_regional_elvana_markets_of_elvana_desc:0 "Elvana's squares are filled with stalls from dawn, and its warehouses stretch along the river. A new covered market is raised on the oldest square."
 zin_regional_elvana_merchant_houses:0 "Merchant Houses of Elvana"
 zin_regional_elvana_merchant_houses_desc:0 "The great houses of Elvana trade in sun-silk, spice and dyed wool, and keep agents in every Sunhot capital. Their ledgers are among the best in the south."
 zin_regional_elvana_merchant_houses_of_elvana:0 "Merchant Houses of Elvana"
 zin_regional_elvana_merchant_houses_of_elvana_desc:0 "The great merchant houses of Elvana set up counting-halls on both shores, and their agents travel to every Sunhot capital. A bargain struck at their tables is honoured everywhere."
 zin_regional_elvana_old_strength:0 "The Old Strength"
 zin_regional_elvana_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_elvana_one_council_two_shores:0 "One Council, Two Shores"
 zin_regional_elvana_one_council_two_shores_desc:0 "The single council seats equal delegates from each shore, with a bench at the middle for the Speaker. Debates are conducted in turn, and neither shore interrupts."
 zin_regional_elvana_our_share_of_the_sun_guard:0 "Our Share of the Sun Guard"
 zin_regional_elvana_our_share_of_the_sun_guard_desc:0 "A guard of tall spearmen from every realm keeps the open court and the roads that lead to it. [ROOT.GetName] sends its share, drilled in the slow, heavy step that Sunhot spears have always kept."
 zin_regional_elvana_peace_among_the_realms:0 "Peace Among the Realms"
 zin_regional_elvana_peace_among_the_realms_desc:0 "The Council's oldest custom is that no realm raises a hand against another, and that a quarrel over a boundary stone is settled by an elder from a third realm. [ROOT.GetName] swears it again, and means it."
 zin_regional_elvana_peace_of_noon:0 "The Peace of Noon"
 zin_regional_elvana_peace_of_noon_desc:0 "No realm of the Council raises a hand to another, and [ROOT.GetName] guards that peace as closely as its own gates."
 zin_regional_elvana_pilgrims_of_the_sea_of_gods:0 "Pilgrims of the Sea of Gods"
 zin_regional_elvana_pilgrims_of_the_sea_of_gods_desc:0 "White sails come along the coast each summer carrying pilgrims to the shrines of the Sea of Gods. [ROOT.GetName] gives them water, shade and a safe road, and is spoken of kindly all along the shore."
 zin_regional_elvana_priests_from_afar:0 "Priests From Afar"
 zin_regional_elvana_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_elvana_ready_for_the_noon_league:0 "Ready for the Noon League"
 zin_regional_elvana_ready_for_the_noon_league_desc:0 "When danger passes the borders, the Council can bind its realms into one league with one banner and one watch-fire. [ROOT.GetName] gives its word beforehand, so that nobody need ask it twice."
 zin_regional_elvana_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_elvana_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_elvana_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_elvana_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_elvana_ships_for_the_isles:0 "Ships for the Isles"
 zin_regional_elvana_ships_for_the_isles_desc:0 "South of the Sea of Gods lie islands that trade with the Sunhot coasts and remember them in song. [ROOT.GetName] sends ships and gifts to their harbours, and the isles send back fruit and fair words."
 zin_regional_elvana_speaker_of_two_shores:0 "The Speaker of Two Shores"
 zin_regional_elvana_speaker_of_two_shores_desc:0 "Vinael is the Speaker of both shores, and the only man trusted by both. He holds the office by a vote of two councils and the goodwill of a bridge."
 zin_regional_elvana_sun_fairs:0 "The Sun Fairs"
 zin_regional_elvana_sun_fairs_desc:0 "Fairs fill the market squares of both shores from thaw to harvest, and every Sunhot trader has a stall at one. A bargain struck at Elvana is honoured in every realm of the south."
 zin_regional_elvana_sun_guard_share:0 "Our Share of the Sun Guard"
 zin_regional_elvana_sun_guard_share_desc:0 "A company of tall spearmen from [ROOT.GetName] stands in the Council's guard, and its drill is the finest in the south."
 zin_regional_elvana_the_council_endures:0 "The Council Endures"
 zin_regional_elvana_the_council_endures_desc:0 "Generations of Sunhot elves have sat in that court without once drawing a blade in it. [ROOT.GetName] adds its name to the long roll of those who kept it so."
 zin_regional_elvana_the_first_market_of_the_sun:0 "The First Market of the Sun"
 zin_regional_elvana_the_first_market_of_the_sun_desc:0 "Elvana's squares are now the first market of the Lands of the Sun, and its merchants quote their prices as the measure of every other. The Speaker lights the lamp himself."
 zin_regional_elvana_the_old_strength:0 "The Old Strength"
 zin_regional_elvana_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_elvana_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_elvana_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_elvana_the_rival_at_igara:0 "The Rival at Igara"
 zin_regional_elvana_the_rival_at_igara_desc:0 "Igara is next door, and its merchants undercut every price in the south. The rivalry is old, loud and bloodless, and the Noon Council is tired of hearing about it."
 zin_regional_elvana_the_sun_fairs:0 "The Sun Fairs"
 zin_regional_elvana_the_sun_fairs_desc:0 "The great fairs of Elvana draw traders from every Sunhot realm, and the stalls fill the squares on both shores. The Speaker opens each fair by lighting a lamp."
 zin_regional_elvana_the_union_endures:0 "The Union Endures"
 zin_regional_elvana_the_union_endures_desc:0 "The union is renewed in an oath on the bridge, sworn by both shores at once. The words are the same on each side, and are heard on the other."
 zin_regional_elvana_the_union_feast:0 "The Union Feast"
 zin_regional_elvana_the_union_feast_desc:0 "Every year the two shores keep the day they became one, with lanterns on the bridge and a feast on each bank. Neither shore will be the first to leave the table."
 zin_regional_elvana_two_shores_speaker:0 "The Speaker of Two Shores"
 zin_regional_elvana_two_shores_speaker_desc:0 "Vinael speaks for Elvana and Elvini in one voice, in a hall built across the river mouth so that neither shore can say it was kept waiting. He is careful never to sit with his back to either."
 zin_regional_elvana_undercut_igara:0 "Undercut Igara"
 zin_regional_elvana_undercut_igara_desc:0 "The guild-halls vote to cut their prices to beat Igara's, and the Speaker lets them. The market is sharper, the rivalry is sourer, and the Council is displeased."
 zin_regional_elvana_union_endures:0 "The Union Endures"
 zin_regional_elvana_union_endures_desc:0 "The two shores keep the day they became one, with lanterns on the bridge and a feast on each bank. A child of Elvana weds a child of Elvini more often than not."
 zin_regional_elvana_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_elvana_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_elvana_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_elvana_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_elvana_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_elvana_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_elvana_white_sails:0 "White Sails"
 zin_regional_elvana_white_sails_desc:0 "The ships of this coast carry sails of undyed cloth, so that a fleet in the distance looks like a flock of gulls. [ROOT.GetName] builds and rigs them in its own yards and teaches its captains every wind of the Sea of Gods."
 zin_regional_elvana.1.a:0 "Feast on the Elvana shore"
 zin_regional_elvana.1.b:0 "Feast on the Elvini shore"
 zin_regional_elvana.1.d:0 "The two shores keep the day they became one council, with lanterns on the bridge and a feast on each bank. The Speaker is asked on which shore he will break the first loaf."
 zin_regional_elvana.1.t:0 "The Union Feast"
 zin_regional_elvana.2.a:0 "Complain to the Council"
 zin_regional_elvana.2.b:0 "Lower our prices"
 zin_regional_elvana.2.d:0 "Igara's merchants sell sun-silk below our price again, and the guild-halls of Elvana buzz with complaint. The Speaker is asked to say whether to lower our prices or to carry the complaint to the Council."
 zin_regional_elvana.2.t:0 "The Rival at Igara"
 zin_regional_elvana.3.a:0 "Gala does not judge markets"
 zin_regional_elvana.3.b:0 "The King will speak for peace between them"
 zin_regional_elvana.3.d:0 "A letter arrives from Elvana in the Speaker's hand, courteous and brief. Elvana and Igara have quarrelled over prices for as long as the oldest merchants can remember, and Elvana asks the King of Gala to judge between them."
 zin_regional_elvana.3.t:0 "Elvana Asks the King to Judge"
 zin_regional_elvana.4.a:0 "Open our harbours to them"
 zin_regional_elvana.4.b:0 "Let them pass by"
 zin_regional_elvana.4.d:0 "White sails carry pilgrims along the coast for the summer feasts. The harbour keeper of [ROOT.GetName] asks whether they are to be given moorings and a feast-day, or left to sail on."
 zin_regional_elvana.4.t:0 "Pilgrims on the Sea of Gods"
