l_english:
 zin_regional_herrodon_a_crown_above_the_houses:0 "A Crown Above the Houses"
 zin_regional_herrodon_a_crown_above_the_houses_desc:0 "The Queen's word is made the final one in all disputes between the houses. Quarrels are shorter, though a few elders remember when the houses would have argued longer."
 zin_regional_herrodon_a_crown_among_the_houses:0 "A Crown Among the Houses"
 zin_regional_herrodon_a_crown_among_the_houses_desc:0 "The Queen sits as the first of equals, and the houses decide with her, not under her. The crown wins a deeper loyalty and gives up a measure of command."
 zin_regional_herrodon_a_wing_for_herrodon:0 "A Wing for Herrodon"
 zin_regional_herrodon_a_wing_for_herrodon_desc:0 "In the hour of need the Keeper sends a dragon to the groves. It will fight for Herrodon as long as the Queen holds faith with the roost, and the cost is not small."
 zin_regional_herrodon_ask_the_forest_to_judge:0 "Ask the Forest to Judge"
 zin_regional_herrodon_ask_the_forest_to_judge_desc:0 "The Queen sends a message to the Magical Forest, whose elders have judged between elves since before there was a crown to quarrel over, and asks that they say whose the groves are."
 zin_regional_herrodon_bows_of_herrodon:0 "Bows of Herrodon"
 zin_regional_herrodon_bows_of_herrodon_desc:0 "Herrodon's bowyers cut the long yew of the western groves. A Herrodon bow has a pale limb and a dark one, and the pair is never separated."
 zin_regional_herrodon_crown_above:0 "A Crown Above the Houses"
 zin_regional_herrodon_crown_above_desc:0 "The Queen's word ends disputes quickly and the court speaks with one voice."
 zin_regional_herrodon_crown_among:0 "A Crown Among the Houses"
 zin_regional_herrodon_crown_among_desc:0 "The Queen sits as the first of equals; the houses are loyal because they are heard."
 zin_regional_herrodon_customs_at_the_wall:0 "Customs at the Wall"
 zin_regional_herrodon_customs_at_the_wall_desc:0 "Herrodon's factors treat the Great Wall's toll-keepers as honoured guests and settle every old complaint at the gate, with a smile and a purse."
 zin_regional_herrodon_gifts_to_the_keeper:0 "Gifts to the Keeper"
 zin_regional_herrodon_gifts_to_the_keeper_desc:0 "Herrodon sends gifts to the Keeper of the dragons: honey, silver and a wreath of the oldest boughs. Whoever keeps Dragon Mountain is a friend worth the cost."
 zin_regional_herrodon_grove_knights:0 "Grove Knights"
 zin_regional_herrodon_grove_knights_desc:0 "Mounted wardens ride the grove lanes in the Queen's livery, carrying lances of ash and bright pennons. They are for show as much as for war, and not only for show."
 zin_regional_herrodon_groves_defended:0 "The Groves Defended"
 zin_regional_herrodon_groves_defended_desc:0 "Every tree is a wall and every elder a sentry."
 zin_regional_herrodon_groves_shared:0 "The Groves Shared"
 zin_regional_herrodon_groves_shared_desc:0 "With the quarrel cooled, Herrodon proposes to Andos Enda that the boundary groves be held in common, tended by both and owned by none."
 zin_regional_herrodon_healers_of_herrodon:0 "Healers of Herrodon"
 zin_regional_herrodon_healers_of_herrodon_desc:0 "The Queen's healers go out in grey cloaks, not green, so that none may say Herrodon has sent a host. They carry herbs, bandages and few words."
 zin_regional_herrodon_herrowyns_court:0 "Herrowyn's Court"
 zin_regional_herrodon_herrowyns_court_desc:0 "The Queen's court is a living hall of arching trees. Heralds, wardens and elders come and go beneath the boughs, and the Queen hears each of them in turn."
 zin_regional_herrodon_honour_the_old_slights:0 "Honour the Old Slights"
 zin_regional_herrodon_honour_the_old_slights_desc:0 "The houses recite the grievances against Andos Enda, one by one, in the old order. Every slight is remembered, and none is yet avenged."
 zin_regional_herrodon_kin_bond_sacomananos:0 "A Kin-Bond with Sacomananos"
 zin_regional_herrodon_kin_bond_sacomananos_desc:0 "The Queen sends a ring of green gold to Sacomananos and a promise that Herrodon's hand will never be raised against its lost kin."
 zin_regional_herrodon_kin_bond_velakton:0 "A Kin-Bond with Velakton"
 zin_regional_herrodon_kin_bond_velakton_desc:0 "The same ring, in silver, goes to Velakton, with the same promise and the same hope that the kin will answer it."
 zin_regional_herrodon_kin_of_herrodon:0 "Kin of Herrodon"
 zin_regional_herrodon_kin_of_herrodon_desc:0 "Herrodon sends its heralds to the Magical Forest with songs and gifts, and asks that the old forest remember it as kin, not as a rival."
 zin_regional_herrodon_let_the_groves_grow_wild:0 "Let the Groves Grow Wild"
 zin_regional_herrodon_let_the_groves_grow_wild_desc:0 "The Queen declares that no marker shall be set among the boundary groves and no axe lifted. If the trees may have them, neither realm can."
 zin_regional_herrodon_markers_of_stone:0 "Markers of Stone"
 zin_regional_herrodon_markers_of_stone_desc:0 "Cairns of grey stone and a small watch-post mark the Queen's claim in the boundary groves. Her neighbours look on with narrowed eyes."
 zin_regional_herrodon_one_crown_of_the_woods:0 "One Crown of the Woods"
 zin_regional_herrodon_one_crown_of_the_woods_desc:0 "The Queen offers her lost kin a place beneath one crown. They may take it as subject realms with Herrodon's protection, or keep their own songs and their own borders."
 zin_regional_herrodon_queens_host:0 "The Queen's Host"
 zin_regional_herrodon_queens_host_desc:0 "The wardens muster in green and gold, and drill as one company."
 zin_regional_herrodon_queens_peace:0 "The Queen's Peace"
 zin_regional_herrodon_queens_peace_desc:0 "No feud enters the court, and no blade is bared beneath the boughs."
 zin_regional_herrodon_queens_wardens:0 "The Queen's Wardens"
 zin_regional_herrodon_queens_wardens_desc:0 "The Queen's wardens wear green and bear her sigil on their quivers. They are taught by the oldest foresters, who tell them the groves are the true armour of Herrodon."
 zin_regional_herrodon_roost_songs:0 "Roost Songs"
 zin_regional_herrodon_roost_songs_desc:0 "The oldest songs of the groves are sung at the foot of Dragon Mountain, in the tongue the wyrms are said to prefer. The roosts are quiet, and the singers are not unwelcome."
 zin_regional_herrodon_songs_of_the_western_groves:0 "Songs of the Western Groves"
 zin_regional_herrodon_songs_of_the_western_groves_desc:0 "Herrodon's singers walk west to the small realms that sing its songs without wearing its crown, and sing them again where they were first learned."
 zin_regional_herrodon_stand_with_the_kindred:0 "Stand with the Kindred"
 zin_regional_herrodon_stand_with_the_kindred_desc:0 "The Kindred of the Woods stands, and the Queen puts her name to it. Herrodon will defend elven land, but will not march beyond it, and will not stand beside men."
 zin_regional_herrodon_the_boundary_groves:0 "The Boundary Groves"
 zin_regional_herrodon_the_boundary_groves_desc:0 "Between Herrodon and its eastern neighbour stands a stretch of groves that both realms claim, and neither will name. Herrodon's oldest quarrel grows there, one root at a time."
 zin_regional_herrodon_the_crown_of_herrodon:0 "The Crown of Herrodon"
 zin_regional_herrodon_the_crown_of_herrodon_desc:0 "The crown of leaves and old gold is lifted from its cedar chest and worn for the first time in a generation. Herrodon is a realm, and it wishes to be seen as one."
 zin_regional_herrodon_the_crowned_houses:0 "The Crowned Houses"
 zin_regional_herrodon_the_crowned_houses_desc:0 "Each great house has a seat beneath the Queen's own, and a voice in her council. The crown may be hers, but the council is theirs."
 zin_regional_herrodon_the_feud_of_the_groves:0 "The Feud of the Groves"
 zin_regional_herrodon_the_feud_of_the_groves_desc:0 "Patience is spent. Herrodon lays a claim on the nearest of Andos Enda's groves and takes up the old quarrel in earnest, though the elders pray it will stay a quarrel of one state."
 zin_regional_herrodon_the_groves_defended:0 "The Groves Defended"
 zin_regional_herrodon_the_groves_defended_desc:0 "The first stranger's boot has touched the western groves. The horns of Herrodon sound under the boughs, and every house sends its strong to the Queen."
 zin_regional_herrodon_the_groves_quiet:0 "The Groves Are Quiet"
 zin_regional_herrodon_the_groves_quiet_desc:0 "The enemy is gone and the groves are whole. The Queen lays aside her mantle, and the herders raise their eyes to the sky again."
 zin_regional_herrodon_the_kin_answer:0 "The Kin Answer"
 zin_regional_herrodon_the_kin_answer_desc:0 "Companies of kin come in from the neighbouring groves, with bows strung and food for ten days. No one told them to come."
 zin_regional_herrodon_the_queen_rides:0 "The Queen Rides"
 zin_regional_herrodon_the_queen_rides_desc:0 "Herrowyn herself rides at the head of her wardens, in a mantle of green and gold. The sight is worth a thousand bows."
 zin_regional_herrodon_the_queens_host:0 "The Queen's Host"
 zin_regional_herrodon_the_queens_host_desc:0 "On the great feast days the Queen's wardens muster beneath her banner. It is a spectacle, and a promise to everyone who sees it."
 zin_regional_herrodon_the_queens_peace:0 "The Queen's Peace"
 zin_regional_herrodon_the_queens_peace_desc:0 "Queen Herrowyn lays down her peace over the groves: no feud may be carried into the court, and no blade may be bared beneath the boughs."
 zin_regional_herrodon_the_woodland_crown:0 "The Woodland Crown"
 zin_regional_herrodon_the_woodland_crown_desc:0 "Long ago the houses of the western groves chose a queen, and kept choosing her line. Herrowyn holds court beneath the great boughs, and the houses come to her because they wish to."
 zin_regional_herrodon_wall_trade:0 "Customs at the Wall"
 zin_regional_herrodon_wall_trade_desc:0 "The Wall's toll-keepers are courted, and the merchants of Herrodon pass easily."
 zin_regional_herrodon_wings_at_dusk:0 "Wings at Dusk"
 zin_regional_herrodon_wings_at_dusk_desc:0 "At dusk a wide shadow crosses the western groves, and the herders lower their eyes. The Queen has the seasons' offerings set out on the high ridge."
 zin_regional_herrodon.1.a:0 "The houses kneel."
 zin_regional_herrodon.1.b:0 "The houses sit."
 zin_regional_herrodon.1.d:0 "The houses assemble beneath the great boughs for the first court of the Queen's year. The only question is whether they will kneel, as their grandmothers did, or sit."
 zin_regional_herrodon.1.t:0 "The Queen's Court"
 zin_regional_herrodon.2.a:0 "Leave the groves to the trees."
 zin_regional_herrodon.2.b:0 "Set our markers."
 zin_regional_herrodon.2.d:0 "Herrodon's foresters find fresh markers set among the boundary groves, in a hand not their own. They ask the Queen whether to set markers of their own beside them, or to leave the trees to grow."
 zin_regional_herrodon.2.t:0 "Markers in the Groves"
 zin_regional_herrodon.3.a:0 "We will judge."
 zin_regional_herrodon.3.b:0 "The rivals must settle it."
 zin_regional_herrodon.3.d:0 "A herald from Herrodon stands before the elders of the Magical Forest and asks that they judge the quarrel of the boundary groves, as they judged quarrels before there were crowns. The elders look at one another in silence."
 zin_regional_herrodon.3.t:0 "Herrodon Asks for Judgement"
 zin_regional_herrodon.4.a:0 "Share the groves."
 zin_regional_herrodon.4.b:0 "Andos Enda remembers."
 zin_regional_herrodon.4.d:0 "A herald of Herrodon brings Andos Enda an offer that no one expected: that the boundary groves be held in common, tended by both and claimed by neither. The Speaker and the grove-speakers must decide whether the old quarrel is worth keeping."
 zin_regional_herrodon.4.t:0 "The Groves Shared"
 zin_regional_herrodon.5.a:0 "We keep our own songs."
 zin_regional_herrodon.5.b:0 "Take Herrodon's crown."
 zin_regional_herrodon.5.d:0 "The Queen of Herrodon has offered her lost kin a place beneath her crown, as subject realms under her protection. The elders of the small realm listen to the herald, and remember how long they have sung Herrodon's songs without wearing its crown."
 zin_regional_herrodon.5.t:0 "Under One Crown"
 zin_regional_herrodon.6.a:0 "It is written."
 zin_regional_herrodon.6.d:0 "A rider from [FROM.GetName] reaches the Queen's court with an answer, and the groves have heard it before the Queen has. Herrodon reads it twice and sets it among the court rolls."
 zin_regional_herrodon.6.t:0 "An Answer in the Groves"
