l_english:
 zin_eindil:0 "The Man from the Ice"
 zin_eindil_alone_in_the_snow:0 "Alone in the Snow"
 zin_eindil_alone_in_the_snow_desc:0 "Every man who sailed with him lies behind in the white. He walks on with their names."
 zin_eindil_ask_counsel:0 "Ask the Stranger's Counsel"
 zin_eindil_ask_counsel_desc:0 "The guest knows more than he remembers. An evening in his company steadies the court and the camp."
 zin_eindil_bearer_of_glo:0 "Bearer of Glo"
 zin_eindil_bearer_of_glo_desc:0 "The green light beats at his breast. The sword of the guardian is in his hand."
 zin_eindil_blessed_of_the_new_gods:0 "Blessed of the New Gods"
 zin_eindil_blessed_of_the_new_gods_desc:0 "The gods gathered round him on the field and gave what they could. Lightning stands in his eyes."
 zin_eindil_burned_granaries:0 "Burned Granaries"
 zin_eindil_burned_granaries_desc:0 "The bridge held, and the grain did not. The stranger saved what he could, and the rest was ash."
 zin_eindil_call_stranded:0 "Call the Stranded Armies"
 zin_eindil_call_stranded_desc:0 "Send word again to the soldiers who stayed behind in a foreign land. The heir does not ask them to kneel, only to stand together."
 zin_eindil_companion_1:0 "First Companion of the Voyage"
 zin_eindil_companion_2:0 "Second Companion of the Voyage"
 zin_eindil_denounced_the_impostor:0 "Denounced the Impostor"
 zin_eindil_detain_him:0 "Detain Him"
 zin_eindil_detain_him_desc:0 "A great warrior at a small court is a prize. Keep him half a year more, and let the court bear what comes of it."
 zin_eindil_enforce_peace:0 "Enforce the War-King's Peace"
 zin_eindil_enforce_peace_desc:0 "The war-king's terms were refused. The confederation's crowns may close their roads to those who fight on."
 zin_eindil_enter_palace:0 "Enter the Palace"
 zin_eindil_enter_palace_desc:0 "The passages are found and the rebels wait. Go in, and take the false king's gifts from him one by one."
 zin_eindil_feast_at_the_ford:0 "A Feast at the Ford"
 zin_eindil_find_passages:0 "Find the Old Service Passages"
 zin_eindil_find_passages_desc:0 "Parim's palace has passages the architects forgot and the cooks remember. Send scouts to ask."
 zin_eindil_first_friends:0 "First Friends of the King"
 zin_eindil_first_friends_desc:0 "Those who fed the stranger, mended his ship or opened a gate to him are remembered at the court of Parim."
 zin_eindil_ford_shunned:0 "Shunned at the Ford"
 zin_eindil_ford_shunned_desc:0 "The crowns of the confederation will not meet our envoys while the war-king's peace stands refused."
 zin_eindil_grievously_wounded:0 "Grievously Wounded"
 zin_eindil_grievously_wounded_desc:0 "He fights on, and each step shows what it costs."
 zin_eindil_guest:0 "The Stranger's Road"
 zin_eindil_guest_desc:0 "A tall man is a guest in your hall. He will leave when his road calls him, whatever you decide."
 zin_eindil_guest_of_lorien:0 "Guest of Lorien"
 zin_eindil_guest_of_lorien_desc:0 "A tall stranger from the south sits at Lorien's table and listens to the oldest histories of the First Men."
 zin_eindil_guest_trait:0 "Guest of Lorien"
 zin_eindil_guest_trait_desc:0 "The elder court gives him its oldest records and its patience."
 zin_eindil_heeded_the_impostor:0 "Heeded the Impostor"
 zin_eindil_heir_has_fallen:0 "The Heir Has Fallen"
 zin_eindil_heir_has_fallen_desc:0 "The champion lies on the field and the line wavers. Each captain looks to the next."
 zin_eindil_heir_of_aen:0 "Heir of Aen"
 zin_eindil_heir_of_aen_desc:0 "Lorien named him son of Ein, and what he had forgotten came back to him as weight."
 zin_eindil_host:0 "The Host of the Heir"
 zin_eindil_host_desc:0 "The heir's host is raised. Strangers and old enemies ride under one banner, and each must be asked."
 zin_eindil_host_of_the_heir:0 "The Host of the Heir"
 zin_eindil_host_of_the_heir_desc:0 "Aenoran survivors, frontier captains and strangers from across the sea ride under one banner and the heir's name."
 zin_eindil_judgment_honoured:0 "The Stranger's Judgment"
 zin_eindil_judgment_honoured_desc:0 "A stranger asked only that the law be the same for him as for any man. The lawspeakers have not forgotten the lesson."
 zin_eindil_king_is_dead:0 "They Say the King Is Dead"
 zin_eindil_king_is_dead_desc:0 "The rumour ran faster than the riders. Half the host believes it."
 zin_eindil_king_without_a_house:0 "King Without a House"
 zin_eindil_king_without_a_house_desc:0 "He rules a host and no hall, and asks the captains only to stand together."
 zin_eindil_maimed_unbroken:0 "Maimed, Unbroken"
 zin_eindil_maimed_unbroken_desc:0 "He lost an arm and a kingdom, and came back with a simpler sword and no fear of heights."
 zin_eindil_man_from_the_ice:0 "The Man from the Ice"
 zin_eindil_man_from_the_ice_desc:0 "He came out of the ice warm. Cold has not troubled him since."
 zin_eindil_name_named:0 "Eindil"
 zin_eindil_palace:0 "The Palace of Parim"
 zin_eindil_palace_desc:0 "Armies cannot storm the palace. One man and a few friends may find the way in."
 zin_eindil_palace_failed:0 "The Palace Holds"
 zin_eindil_palace_failed_desc:0 "The service passages ran with blood, and the false king's wards held. The rebels in the palace have gone quiet."
 zin_eindil_rally_rebels:0 "Rally the Palace Rebels"
 zin_eindil_rally_rebels_desc:0 "Servants, guardsmen and a few honest clerks stand ready inside the walls. Alleria knows whom to trust."
 zin_eindil_rally_rebels_unaided:0 "Rally the Palace Rebels, Unaided"
 zin_eindil_rally_rebels_unaided_desc:0 "No friend of the heir knows the palace's servants. Gold and patience may buy what a name cannot."
 zin_eindil_remembered:0 "Remembered by the Heir"
 zin_eindil_restless_guest:0 "A Restless Guest"
 zin_eindil_restless_guest_desc:0 "We would not let him go, and he has not forgotten. The halls are quieter than they were."
 zin_eindil_rightful_king:0 "The Rightful King"
 zin_eindil_rightful_king_desc:0 "Aen's line is on the throne of Aenor again, and the crown rests lightly on a man who did not seek it."
 zin_eindil_seize_failed:0 "The Seizure Failed"
 zin_eindil_speed_him_on:0 "Speed Him On"
 zin_eindil_speed_him_on_desc:0 "Give him a horse, a guide and a purse, and let his road take him. The court will not forget the courtesy."
 zin_eindil_stage_0:0 "Asleep"
 zin_eindil_stage_0_desc:0 "Nothing in Aoaz stirs that the chronicles know of."
 zin_eindil_stage_1:0 "The Man in the Ice"
 zin_eindil_stage_1_desc:0 "Hunters cutting a path across the old ice have found a man inside it, and he breathes."
 zin_eindil_stage_10:0 "The Cliff"
 zin_eindil_stage_10_desc:0 "A brother's blade, and a road above a gorge."
 zin_eindil_stage_11:0 "The Palace"
 zin_eindil_stage_11_desc:0 "Armies cannot take the palace of Parim. One man and his friends may go in."
 zin_eindil_stage_12:0 "Crowned"
 zin_eindil_stage_12_desc:0 "The crown of Aenor is offered, and the Fourth Age turns."
 zin_eindil_stage_2:0 "The Road South"
 zin_eindil_stage_2_desc:0 "He travels with the traders of the West Lands, and keeps three promises on the way."
 zin_eindil_stage_3:0 "The War-King"
 zin_eindil_stage_3_desc:0 "A truce breaks at a grey ford, and a stranger is asked to stand between two armies."
 zin_eindil_stage_4:0 "The Storm"
 zin_eindil_stage_4_desc:0 "He sails for the old kingdom, and the sea carries him somewhere else."
 zin_eindil_stage_5:0 "Gala"
 zin_eindil_stage_5_desc:0 "In the oldest court of the living, a king who remembers Dardan speaks with him for weeks."
 zin_eindil_stage_6:0 "The Voyage North"
 zin_eindil_stage_6_desc:0 "A ship like no other goes north through the ice with a mixed crew, and the ports it passes take notice."
 zin_eindil_stage_7:0 "Yeldenne"
 zin_eindil_stage_7_desc:0 "Snow, a quiet shore, and a castle with one lamp lit."
 zin_eindil_stage_8:0 "The Warnings"
 zin_eindil_stage_8_desc:0 "He tells the courts what is coming. Some of them listen."
 zin_eindil_stage_9:0 "The Return"
 zin_eindil_stage_9_desc:0 "A dragon comes down on the field."
 zin_eindil_stranger_among_us:0 "The Stranger Among Us"
 zin_eindil_stranger_among_us_desc:0 "A tall man works at our fires and asks no pay. The hunters watch him; the children follow him; no one has yet asked what he is."
 zin_eindil_struck_down:0 "Struck Down"
 zin_eindil_struck_down_desc:0 "The southern lord's blast threw him to the ground. He has not yet risen."
 zin_eindil_swear_to_heir:0 "Swear to the Heir"
 zin_eindil_swear_to_heir_desc:0 "Pledge the realm's host to the stranger's cause. When he returns, your realm will be the one he raises."
 zin_eindil_the_sea_went_silent:0 "The Sea Went Silent"
 zin_eindil_the_sea_went_silent_desc:0 "The drowned voices on the reef fell quiet the night a stranger swam out and brought the children back."
 zin_eindil_tt_alleria:0 "Alleria of Selen stands with the heir"
 zin_eindil_tt_delay_less:0 "The stranger's road is shortened by 30 days"
 zin_eindil_tt_delay_more:0 "The stranger's road is lengthened by 90 days, and he stays 180 days more"
 zin_eindil_tt_floor:0 "The month of the palace has come"
 zin_eindil_tt_host:0 "Eindil is a guest of your realm"
 zin_eindil_tt_late:0 "The year of the warnings has begun"
 zin_eindil_tt_no_alleria:0 "No friend of the heir knows the palace"
 zin_eindil_tt_not_gala:0 "The host is not the court of Gala or the keeper of the castle"
 zin_eindil_tt_parim:0 "The false king holds Parim and claims all Aoaz"
 zin_eindil_tt_passages:0 "The old service passages are known"
 zin_eindil_tt_rebels:0 "The palace rebels are rallied"
 zin_eindil_tt_recovered:0 "The heir has risen from the ravine"
 zin_eindil_tt_stranded:0 "Soldiers of a foreign land stand beyond the sea"
 zin_eindil_tt_swear:0 "Eindil's regard for you is 25 or more and his renown has reached 40"
 zin_eindil_tt_the_host:0 "Your realm is the Host of Eindil"
 zin_eindil_tt_war:0 "The war-king's peace has been refused"
 zin_eindil_war_king:0 "The King Without a House"
 zin_eindil_war_king_desc:0 "He was a war-king for one season, and laid the crown on a table when the peace was made."
 zin_eindil_war_kings_banner:0 "The War-King's Banner"
 zin_eindil_war_kings_banner_desc:0 "For one season our captains march beneath a borrowed banner and a stranger's name."
 zin_eindil_war_kings_peace:0 "The War-King's Peace"
 zin_eindil_war_kings_peace_desc:0 "Two old enemies ate at one table at the ford. Neither wishes to be the first to break the bread."
 zin_eindil_warning_heeded:0 "The Warning Heeded"
 zin_eindil_warning_heeded_desc:0 "We were told what was coming and we did not laugh. Our watchtowers are manned and our levies counted."
 zin_eindil_wronged:0 "Wronged the Heir"
 zin_golbran:0 "Golbran"
 zin_host_of_eindil:0 "The Host of Eindil"
 zin_host_of_eindil_ADJ:0 "of the Host of Eindil"
 zin_host_of_eindil_DEF:0 "the Host of Eindil"
 ZIN_RULE_EINDIL_JOURNEY:0 "The Stranger's Road"
 ZIN_RULE_EINDIL_JOURNEY_DEFAULT:0 "Follows the Historical Path"
 ZIN_RULE_EINDIL_JOURNEY_DEFAULT_DESC:0 "The realms in the stranger's way choose as the Historical Path rule says."
 ZIN_RULE_EINDIL_JOURNEY_DESC:0 "How the realms in the stranger's way choose. Players always choose freely."
 ZIN_RULE_EINDIL_JOURNEY_FREE:0 "Every Realm Chooses"
 ZIN_RULE_EINDIL_JOURNEY_FREE_DESC:0 "Each realm in the stranger's way weighs its own interest. Kindness and cruelty both find hosts."
 ZIN_RULE_EINDIL_JOURNEY_HISTORICAL:0 "As the Chronicle Tells It"
 ZIN_RULE_EINDIL_JOURNEY_HISTORICAL_DESC:0 "Realms in the stranger's way always take the choice the chronicle records. The road runs on time."
 zin_varner:0 "Varner"
