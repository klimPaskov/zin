l_english:
 zin_regional_hunhun_elect_the_ride_captains:0 "Elect the Ride-Captains"
 zin_regional_hunhun_elect_the_ride_captains_desc:0 "Each brotherhood chooses its own captain by a race over the old course, and the captains choose the Horse-Lord. The method has the virtue of being unarguable."
 zin_regional_hunhun_escort_companies:0 "Escort Companies"
 zin_regional_hunhun_escort_companies_desc:0 "Companies of riders are hired to escort merchants on the lake roads. They are quick, loyal and expensive, and merchants who skimp tend to be robbed."
 zin_regional_hunhun_escort_companies_spirit:0 "Escort Companies"
 zin_regional_hunhun_escort_companies_spirit_desc:0 "Quick, loyal and expensive riders escort the merchants of the lake roads."
 zin_regional_hunhun_free_riders:0 "Lords of Horses"
 zin_regional_hunhun_free_riders_desc:0 "No crown, charter or king can command a free ride."
 zin_regional_hunhun_great_herds:0 "Herds of Hunhun"
 zin_regional_hunhun_great_herds_2:0 "Wealth on Hooves"
 zin_regional_hunhun_great_herds_2_desc:0 "Herds, remounts, escorts and saddlers make Hunhun rich."
 zin_regional_hunhun_great_herds_desc:0 "Herds grazing from horizon to horizon, counted in thousands."
 zin_regional_hunhun_harry_the_invaders:0 "Harry the Invaders"
 zin_regional_hunhun_harry_the_invaders_desc:0 "Hunhun's riders strike at the flanks and rear of the invader, in small bands that appear and vanish. The enemy never finds the same riders twice."
 zin_regional_hunhun_heavy_riders:0 "Heavy Riders"
 zin_regional_hunhun_heavy_riders_desc:0 "The Horse-Lord's own riders wear mail and carry lances. They are slower than their cousins and a good deal harder to stop."
 zin_regional_hunhun_herds_of_hunhun:0 "Herds of Hunhun"
 zin_regional_hunhun_herds_of_hunhun_desc:0 "The herds of Hunhun graze the open grass from one horizon to the next. The riders count them in thousands and the Golden Court counts them in coin."
 zin_regional_hunhun_home_to_the_grass:0 "Home to the Grass"
 zin_regional_hunhun_home_to_the_grass_desc:0 "The war is over, and the riders come home to the open grass. They stable their horses, mend their saddles and settle, at last, their quarrels over grazing."
 zin_regional_hunhun_horse_archery:0 "Horse Archery"
 zin_regional_hunhun_horse_archery_desc:0 "Hunhun's riders loose from the saddle at a full gallop, three shafts for every breath of the horse. A host of them is a storm that moves."
 zin_regional_hunhun_horse_lords_law:0 "The Horse-Lord's Law"
 zin_regional_hunhun_horse_lords_law_desc:0 "The Horse-Lord's judgements are written down and kept in a saddlebag, so that they may be cited by the next. It is the nearest thing Hunhun has to a law."
 zin_regional_hunhun_horse_roads:0 "Horse Roads"
 zin_regional_hunhun_horse_roads_desc:0 "Broad tracks of beaten earth cross the grass between the horse-fairs. They are not paved, but a herd can move along them without breaking its legs."
 zin_regional_hunhun_lords_of_horses:0 "Lords of Horses, Not of Men"
 zin_regional_hunhun_lords_of_horses_desc:0 "The riders say that they are lords of horses and not of men, and that no crown, charter or king can command a free ride. Whoever rules Parim, the grass is Hunhun's."
 zin_regional_hunhun_old_freedoms_of_the_ride:0 "The Old Freedoms of the Ride"
 zin_regional_hunhun_old_freedoms_of_the_ride_desc:0 "The Horse-Lord reads aloud the old freedoms of the ride, which the charter does not mention. He asks Parim to restore them in a Free Charter, and Parim is unlikely to oblige."
 zin_regional_hunhun_one_ride_one_lord:0 "One Ride, One Lord"
 zin_regional_hunhun_one_ride_one_lord_desc:0 "The brotherhoods agree to ride as one when the Horse-Lord sounds the horn. It is not a crown, and no rider would call it one, but it does the work of one."
 zin_regional_hunhun_remount_contracts:0 "Remount Contracts"
 zin_regional_hunhun_remount_contracts_desc:0 "The Royal Army buys its remounts from Hunhun and pays late. The riders laugh at that over beer and remember every debt."
 zin_regional_hunhun_ride_captains:0 "The Ride-Captains"
 zin_regional_hunhun_ride_captains_desc:0 "The ride-captains are given a standing place in the Horse-Lord's council, with a say in the choice of the field. They have never lost an argument about horses."
 zin_regional_hunhun_ride_captains_spirit:0 "The Ride-Captains"
 zin_regional_hunhun_ride_captains_spirit_desc:0 "The captains sit in council and have never lost an argument about horses."
 zin_regional_hunhun_ride_with_the_heir:0 "Ride with the Heir"
 zin_regional_hunhun_ride_with_the_heir_desc:0 "The Heir has returned, and Hunhun's fastest riders carry the word to every brotherhood. Within a fortnight the grass is empty of horses."
 zin_regional_hunhun_riders_at_the_crossings:0 "Riders at the Crossings"
 zin_regional_hunhun_riders_at_the_crossings_desc:0 "Every ford and bridge on the lake roads is held by a company of riders. A host that crosses will have to do it under their bows."
 zin_regional_hunhun_riders_for_the_royal_army:0 "Riders for the Royal Army"
 zin_regional_hunhun_riders_for_the_royal_army_desc:0 "Hunhun lends its riders to the Royal Army as scouts and skirmishers. They come on their own horses and wear their own cloaks, and they do not always salute."
 zin_regional_hunhun_riders_moot:0 "The Riders' Moot"
 zin_regional_hunhun_riders_moot_2:0 "The Horse-Lord's Law"
 zin_regional_hunhun_riders_moot_2_desc:0 "The Horse-Lord's judgements are written down and kept in a saddlebag."
 zin_regional_hunhun_riders_moot_desc:0 "The brotherhoods elect their Horse-Lord in the open air at midsummer."
 zin_regional_hunhun_riders_of_hunhun:0 "The Riders of Hunhun"
 zin_regional_hunhun_riders_of_hunhun_desc:0 "The riders of Hunhun are the fastest in the Middle Lands. They live on horseback, sleep in the saddle and treat walking as an affliction."
 zin_regional_hunhun_riders_of_the_free_dominions:0 "Riders of the Free Dominions"
 zin_regional_hunhun_riders_of_the_free_dominions_desc:0 "With the Golden King dead, the riders of Hunhun cast in their lot with the dominions who would have their charters back. They have always ridden where they pleased."
 zin_regional_hunhun_riding_drills:0 "Riding Drills"
 zin_regional_hunhun_riding_drills_2:0 "Swift as Wind"
 zin_regional_hunhun_riding_drills_2_desc:0 "A hundred miles between dawn and dusk, with fresh horses at every halt."
 zin_regional_hunhun_riding_drills_desc:0 "The brotherhoods drill together on the open grass, learning to wheel, feint and charge as one. The first drill is chaos; the tenth is poetry."
 zin_regional_hunhun_riding_drills_spirit:0 "Riding Drills"
 zin_regional_hunhun_riding_drills_spirit_desc:0 "The brotherhoods wheel, feint and charge as one."
 zin_regional_hunhun_saddleries:0 "Saddleries"
 zin_regional_hunhun_saddleries_desc:0 "Saddlers, bit-makers and harness-wrights set up beside the herds. A Hunhun saddle is made to last a rider's lifetime and his horse's."
 zin_regional_hunhun_scouting_ride:0 "The Scouting Ride"
 zin_regional_hunhun_scouting_ride_desc:0 "Riders range far ahead of the line and return with the freshest news."
 zin_regional_hunhun_scouts_for_the_lost_cause:0 "Scouts for the Lost Cause"
 zin_regional_hunhun_scouts_for_the_lost_cause_desc:0 "Hunhun's scouts join the Lost Cause's frontier companies and ride the southern road. They are paid late, as always, but they do not complain."
 zin_regional_hunhun_swift_as_wind:0 "Swift as Wind"
 zin_regional_hunhun_swift_as_wind_desc:0 "The riders of Hunhun are taught to cover a hundred miles between dawn and dusk, with fresh horses at every halt. The wind itself seems to follow behind."
 zin_regional_hunhun_the_great_ride:0 "The Great Ride"
 zin_regional_hunhun_the_great_ride_desc:0 "Once in a generation the brotherhoods muster for the Great Ride, a progress of ten thousand horses around the rim of the grass. The sound of it is heard across three states."
 zin_regional_hunhun_the_long_ride:0 "The Long Ride"
 zin_regional_hunhun_the_long_ride_desc:0 "The horn sounds over the open grass, and every brotherhood saddles up. The riders of Hunhun have been waiting for this ride, and they intend to make it count."
 zin_regional_hunhun_the_long_ride_spirit:0 "The Long Ride"
 zin_regional_hunhun_the_long_ride_spirit_desc:0 "Every brotherhood is saddled, and the horn has sounded."
 zin_regional_hunhun_the_open_grass:0 "The Open Grass"
 zin_regional_hunhun_the_open_grass_desc:0 "The grass belongs to the brotherhoods, and the brotherhoods quarrel over every acre of it. The Horse-Lord rides out each spring to settle the worst of the disputes before they become feuds."
 zin_regional_hunhun_the_riders_moot:0 "The Riders' Moot"
 zin_regional_hunhun_the_riders_moot_desc:0 "The brotherhoods of Hunhun meet in the open air at midsummer and elect a Horse-Lord from among their ride-captains. The chair is a saddle on a stump, and nobody has proposed improving it."
 zin_regional_hunhun_the_saddle_charter:0 "The Saddle Charter"
 zin_regional_hunhun_the_saddle_charter_desc:0 "The charter that made Hunhun a dominion was signed in the saddle, and the parchment still smells of horse. The riders honour it as long as the debts are paid."
 zin_regional_hunhun_the_scouting_ride:0 "The Scouting Ride"
 zin_regional_hunhun_the_scouting_ride_desc:0 "The crown's marches are scouted by Hunhun riders, who range far ahead of the line and return with news that is days fresher than anyone else's."
 zin_regional_hunhun_the_temple_tents:0 "The Temple Tents"
 zin_regional_hunhun_the_temple_tents_desc:0 "Almoners have begun to put up tents at the riders' gatherings, with bread, linen and a place to tend the sick. The riders are curious, if not yet convinced."
 zin_regional_hunhun_wealth_on_hooves:0 "Wealth on Hooves"
 zin_regional_hunhun_wealth_on_hooves_desc:0 "Herds, remounts, escorts and saddlers together make Hunhun the wealthiest country of the open grass. The riders do not boast of it, and pay their debts early."
 zin_regional_hunhun.1.a:0 "The Horse-Lord judges."
 zin_regional_hunhun.1.b:0 "Let the ride-captains race for it."
 zin_regional_hunhun.1.d:0 "Two brotherhoods have driven their herds onto the same stretch of grass, and neither will give way. The Horse-Lord may judge between them from the saddle, or let the ride-captains race for it as their grandfathers did."
 zin_regional_hunhun.1.t:0 "A Quarrel over Grazing"
 zin_regional_hunhun.2.a:0 "Riders heal their own."
 zin_regional_hunhun.2.b:0 "Welcome the healers."
 zin_regional_hunhun.2.d:0 "Almoners of the Deliverer have raised tents at the great gathering and are offering bread and linen to all who come. The riders are curious, and a little suspicious of anyone who gives something for nothing."
 zin_regional_hunhun.2.t:0 "The Deliverer's Tents"
 zin_regional_hunhun.3.a:0 "Pay a fair price."
 zin_regional_hunhun.3.b:0 "Pay late, as always."
 zin_regional_hunhun.3.d:0 "The riders of Hunhun have delivered another year's remounts to the Royal Army, and the treasury must decide whether to settle the account on time. The riders will remember either answer."
 zin_regional_hunhun.3.t:0 "Remount Contracts"
