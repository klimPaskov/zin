l_english:
 zin_cold_accord:0 "The Northern Accord"
 zin_cold_accord_desc:0 "The Accord is a league, not a crown: Coldor and Horidor hold the passes together, and the clans choose where to stand. Every steading leans a little toward Fandanar or toward Isengard, and the winters decide how far. The Accord's reach stands at §Y[?zin_cold_accord_reach|0]§! of a hundred."
 zin_cold_accord_kin:0 "Sworn in the Accord"
 zin_cold_bread_for_isengard:0 "Bread for Isengard"
 zin_cold_bread_for_isengard_desc:0 "In a hard winter Fandanar sends grain over the March Forts to the people of Isengard, who are cold and hungry and do not much care whose carts they are. For ninety days Isengard's calm improves, and its defiance wears down by the day."
 zin_cold_bread_from_fandanar:0 "Bread From Fandanar"
 zin_cold_bread_from_fandanar_desc:0 "Carts of Fandanar's grain have crossed the March Forts. Nobody in Isengard says thank you; everybody eats."
 zin_cold_far_ice:0 "The Far Ice"
 zin_cold_far_ice_charted_idea:0 "The Far Ice Charted"
 zin_cold_far_ice_charted_idea_desc:0 "Wardens have walked the far north-western ice and drawn what they found. The cold is no kinder, but the crossings are marked."
 zin_cold_far_ice_desc:0 "The north-western ice is empty, windy and very far from any supply cart."
 zin_cold_fed_us:0 "Fed Us in the Winter"
 zin_cold_feed_the_steadings:0 "Feed the Steadings"
 zin_cold_feed_the_steadings_cheap:0 "Feed the Steadings"
 zin_cold_feed_the_steadings_cheap_desc:0 "In a hard winter Fandanar opens its granaries to a steading and sends carts over the snow. The steading's calm improves and its lean toward Fandanar rises by fifteen. At the Winter Moot it will be remembered who fed whom."
 zin_cold_feed_the_steadings_desc:0 "In a hard winter Fandanar opens its granaries to a steading and sends carts over the snow. The steading's calm improves and its lean toward Fandanar rises by fifteen. At the Winter Moot it will be remembered who fed whom."
 zin_cold_hall_friend:0 "Friend of the Hall"
 zin_cold_hall_guard:0 "A Guard Outside the Hall"
 zin_cold_hall_guard_desc:0 "Coldor keeps a company of spears outside the hall of Yeldenne. They guard the road and the gate. They have never been through the door."
 zin_cold_harbour_compact:0 "The Harbour Compact"
 zin_cold_harbour_compact_desc:0 "Coldor's ports and [Y04.GetName]'s share lights, steersmen and charts, and neither undercuts the other's tolls."
 zin_cold_invite_to_accord:0 "Invite to the Accord"
 zin_cold_invite_to_accord_desc:0 "A steading that already leans to Fandanar is asked to take a seat in the Northern Accord. It may decline; the invitation is never forgotten either way."
 zin_cold_isengard:0 "Isengard's Answer"
 zin_cold_isengard_desc:0 "The warlord of Isengard cannot match the Winter Crown's granaries, so he matches its gifts. Every clan that eats at Isengard's table is a clan that will not kneel at Fandanar's. Defiance stands at §Y[?zin_cold_isengard_defiance|0]§! of a hundred."
 zin_cold_isengard_feeds:0 "Isengard Feeds the Steadings"
 zin_cold_isengard_feeds_desc:0 "Isengard cannot feed everyone, but it can feed the steadings that matter. In a hard winter the warlord opens his stores to a neighbour, whose lean away from Fandanar grows by fifteen."
 zin_cold_marriage_kin:0 "Married Across the March"
 zin_cold_neck_road_trade:0 "The Neck Road"
 zin_cold_neck_road_trade_desc:0 "Caravans of the north and the west use the road over the broad neck of land, and both sides take a share of the tolls."
 zin_cold_offer_protection:0 "Offer the Crown's Protection"
 zin_cold_offer_protection_desc:0 "The Winter Crown offers a realm that leans far toward Fandanar its banners on the passes and its granaries in lean years. The price is a herald in the hall who speaks last at every council. A realm that accepts becomes a vassal."
 zin_cold_reach_mod:0 "The Accord's Reach"
 zin_cold_reach_mod_desc:0 "The more of the Cold Lands the Accord holds, the more Fandanar's word is worth and the better its armies endure the cold."
 zin_cold_renew_old_pact:0 "Renew the Old Pact"
 zin_cold_renew_old_pact_desc:0 "A refused offer may be made again after a season of silence, with new gifts and a humbler speech. The old peoples do not answer quickly, and they do not answer to threats."
 zin_cold_road_refused:0 "Closed the Neck Road"
 zin_cold_sell_timber_west:0 "Sell Timber to the West"
 zin_cold_sell_timber_west_desc:0 "The West Lands are building ships, and the northern forests have the timber. A rafted cargo of seasoned logs goes south for gold, and the West's fleet grows by five. The Crown earns forty Authority."
 zin_cold_send_envoys:0 "Send Envoys to a Steading"
 zin_cold_send_envoys_cheap:0 "Send Envoys to a Steading"
 zin_cold_send_envoys_cheap_desc:0 "A rider with the Winter Crown's seal, gifts of salt and iron, and the Queen's greeting. The steading's headman listens, eats, and leans a little closer to Fandanar. The lean rises by ten."
 zin_cold_send_envoys_desc:0 "A rider with the Winter Crown's seal, gifts of salt and iron, and the Queen's greeting. The steading's headman listens, eats, and leans a little closer to Fandanar. The lean rises by ten."
 zin_cold_sworn_to_the_accord:0 "Sworn to the Accord"
 zin_cold_sworn_to_the_accord_desc:0 "The warlord kept his forts and his justice, and swore to the Accord as one hall among the halls. Sworn halls watch each other's backs."
 zin_cold_temple_swords:0 "Temple Swords Left Unchallenged"
 zin_cold_trade:0 "Timber and the Old Pacts"
 zin_cold_trade_desc:0 "The north sells what the south has burned and keeps faith with peoples who owe no crown anything. Both take patience."
 zin_cold_tt_feed:0 "The target is fed this winter: its lean toward Fandanar rises by §Y15§!, its calm improves, and the Winter Moot will remember it."
 zin_cold_tt_hard_winter:0 "A hard or bitter winter lies on the Cold Lands."
 zin_cold_tt_invite_lean:0 "The target leans at least §Y50§! toward Fandanar."
 zin_cold_tt_isengard_feed:0 "The target is fed by Isengard this winter: its lean toward Isengard grows by §Y15§!, its calm improves, and the Winter Moot will remember it."
 zin_cold_tt_lean_down:0 "The target's lean toward Fandanar falls."
 zin_cold_tt_lean_up:0 "The target's lean toward Fandanar rises."
 zin_cold_tt_not_fed:0 "The target has not been fed this winter."
 zin_cold_tt_pact_waiting:0 "A season of silence has passed since the last refusal."
 zin_cold_tt_protect_lean:0 "The target leans at least §Y80§! toward Fandanar."
 zin_cold_tt_protect_reach:0 "The Accord's reach is at least §Y40§!."
 zin_cold_tt_room_to_lean:0 "The target does not yet lean wholly toward Fandanar."
 zin_cold_tt_room_to_lean_isengard:0 "The target does not yet lean wholly toward Isengard."
 zin_cold_tt_west_ready:0 "The West's Ford Council sits, or the West has chosen its course."
 zin_cold_winter_gifts:0 "Winter Gifts"
 zin_cold_winter_gifts_desc:0 "Isengard's riders carry furs, mead and a warlord's compliments to a steading. The steading remembers who came first. Its lean toward Fandanar falls by ten."
 zin_cold_winter_mod:0 "The Long Winter"
 zin_cold_winter_mod_desc:0 "The winter lies on the Cold Lands. Armies freeze, steadings go hungry, and calm wears thin. A realm with winter stores bears half of it."
 zin_cold.11.a:0 "We have survived worse."
 zin_cold.11.d_bitter:0 "The cold came down like a gate shutting. Wells froze to the bottom, and wolves took sheep from the byres. The old people say they have seen one such winter in their lives, and that it was long."
 zin_cold.11.d_hard:0 "The snow came early and deep, and the passes closed behind it. Granaries are counted twice. A hard winter is the ordinary trouble of the north, and the north is practised at it."
 zin_cold.11.d_mild:0 "The first snow came late and lay light. The steadings will eat what they stored, and the herders say it is a kind winter, which they say with suspicion."
 zin_cold.11.t:0 "The Winter Comes"
 zin_cold.12.a:0 "Pay them off."
 zin_cold.12.b:0 "Ride them down."
 zin_cold.12.c:0 "Feed them."
 zin_cold.12.d:0 "A hungry clan has come down out of the hills with torches and empty sacks. Two barns are stripped, and a child's ewe has gone with them. The headmen of the steadings ask what the Crown will do about it, and the Crown knows that whichever answer it gives, the clan will remember."
 zin_cold.12.t:0 "Raiders from the Snow"
 zin_cold.21.a:0 "The count is kept."
 zin_cold.21.d:0 "On the first day of Deepwinter the headmen met at the moot stones and counted the winter's debts: who was fed, and by whom. Those who ate from Fandanar's stores remembered Fandanar. Those who ate from Isengard's remembered Isengard. The count is kept, because nobody forgets it."
 zin_cold.21.t:0 "The Winter Moot"
 zin_cold.30.a:0 "Refuse."
 zin_cold.30.b:0 "Swear to the Accord."
 zin_cold.30.d:0 "Riders from Fandanar bring a charter sealed with the Winter Crown's mark. It asks Isengard to swear to the Northern Accord as one hall among the halls, keeping its warlord, its forts and its own justice. The Accord, they say, is a league and not a crown. The warlord reads it twice, and his counsellors read it three times."
 zin_cold.30.t:0 "The Winter Charter"
 zin_cold.31.a:0 "Meet them at the forts."
 zin_cold.31.d:0 "Isengard's banners have been seen at the March Forts, and the warlord's riders say aloud what they want: the high pass, the toll, and an end to the Winter Crown's pretensions. The border is a day's ride from Fandanar's granaries."
 zin_cold.31.t:0 "Isengard Rides to the Forts"
 zin_cold.32.a:0 "The pass is quiet again."
 zin_cold.32.d_coldor:0 "The fighting at the March Forts is over. Coldor's banners hold the pass, and Isengard's warlord has sent riders to ask what terms the Winter Crown would grant."
 zin_cold.32.d_isengard:0 "The fighting at the March Forts is over. Isengard's banners hold the pass, and the Winter Crown has learned the price of its pride."
 zin_cold.32.t:0 "The March Forts"
 zin_cold.33.a:0 "Refuse."
 zin_cold.33.b:0 "Accept."
 zin_cold.33.d:0 "Fandanar proposes a marriage between the Queen's house and the warlord's, to be sealed at the March Forts under a truce flag. The warlord's counsellors argue that a bride is a hostage in a better dress. The warlord's mother says she has seen worse alliances."
 zin_cold.33.t:0 "A Marriage Across the March"
 zin_cold.40.a:0 "Decline."
 zin_cold.40.b:0 "Take the seat."
 zin_cold.40.d:0 "Fandanar invites us into the Northern Accord: a league of the north under the Winter Crown, with shared watch on the passes and shared stores in bad winters. The herald is courteous. The seat is real. So is the Crown."
 zin_cold.40.t:0 "An Invitation from Fandanar"
 zin_cold.41.a:0 "Refuse."
 zin_cold.41.b:0 "Accept the protection."
 zin_cold.41.d:0 "Fandanar offers the Winter Crown's protection: its banners on our passes, its granaries in our lean years. The price is a herald in our hall who speaks last at every council. The headmen are divided between those who would sooner be safe and those who would sooner be asked."
 zin_cold.41.t:0 "The Crown's Protection"
 zin_cold.50.a:0 "Stay in the snow."
 zin_cold.50.b:0 "Answer the call."
 zin_cold.50.d:0 "The old compact is called. Strangers have crossed into the lands of the Winter Crown, and the people of the hearth remember what was sworn at it. Nobody can make them ride. Nobody has ever needed to."
 zin_cold.50.t:0 "Hearth and Height"
 zin_cold.51.a:0 "Turn the envoys away."
 zin_cold.51.b:0 "Accept the truce."
 zin_cold.51.d:0 "Fandanar's envoys have climbed to the yeti hunting grounds with gifts of salt and iron and a request: that the white hunters leave the Winter Crown's herds alone and take what they need from the south slope. They do not ask for service. Nobody has asked the yeti for service since before the first kings."
 zin_cold.51.t:0 "Envoys at the Hunting Grounds"
 zin_cold.52.a:0 "Send them home."
 zin_cold.52.b:0 "Take the toll."
 zin_cold.52.d:0 "Envoys from Fandanar have walked three days up the road of the giants to Titanos, bringing barrels and a long speech. They ask that the Crown pay a toll for the passes the giants hold, in return for a hall that is never closed to the Crown's riders. The hall is large and the envoys are small, and the speech is shortened accordingly."
 zin_cold.52.t:0 "Envoys at the Frost-King's Hall"
 zin_cold.60.a:0 "Keep out of it."
 zin_cold.60.b:0 "Warn the castle."
 zin_cold.60.d:0 "Watchers on the northern coast report a party of pilgrims camped below the headland: forty or so, in temple grey, with too many swords for a pilgrimage and too few prayers. They ask for nothing. They are waiting for a boat, or for weather. Whoever sent them did not send a name."
 zin_cold.60.t:0 "Strangers in the Snow"
 zin_cold.61.a:0 "Refuse."
 zin_cold.61.b:0 "Accept the guard."
 zin_cold.61.d:0 "The Winter Crown offers a company of spears to stand outside the hall of Yeldenne, at the gate and on the road, and never to enter. Horos has kept this hall alone for ages. A guard is a courtesy or a claim, depending on who is asking."
 zin_cold.61.t:0 "A Crown Offers a Guard"
 zin_cold.70.a:0 "Keep it closed."
 zin_cold.70.b:0 "Open the road."
 zin_cold.70.d:0 "[Y07.GetName] asks leave for its caravans to use the Neck Road, the old way over the broad neck of land between the north and the west. Salt, horses and gossip would come north; furs and iron would go south. The steadings of the neck would have to be garrisoned, fed and watched."
 zin_cold.70.t:0 "The Neck Road"
 zin_cold.71.a:0 "Refuse Fandanar's terms."
 zin_cold.71.b:0 "A Harbour Compact."
 zin_cold.71.d:0 "Fandanar's harbour-masters propose a compact: [Y04.GetName]'s ships and Coldor's ports to share lights, steersmen and charts, and neither to undercut the other's tolls. [Y04.GetName]'s council distrusts any compact signed in a throne room."
 zin_cold.71.t:0 "The [Y04.GetName] Question"
