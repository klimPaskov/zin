l_english:
 zin_regional_howan_a_seat_by_the_fire:0 "A Seat by the Fire"
 zin_regional_howan_a_seat_by_the_fire_desc:0 "A stranger from the wreck is given dry clothes and a place at the hearth. He eats little, speaks softly, and asks the way to an old kingdom whose name the fishers have never heard."
 zin_regional_howan_a_seat_by_the_fire_tip_1:0 "A stranger from the wreck sits by our fire and asks the way to the old kingdom."
 zin_regional_howan_close_the_houses_of_the_isle:0 "Close the Houses of the Isle"
 zin_regional_howan_close_the_houses_of_the_isle_desc:0 "The house on the quay is shuttered, the well sealed and the healers' ledgers surrendered to the elders. The island's kindness has limits, and the elders have chosen where they lie."
 zin_regional_howan_far_from_the_kings_wars:0 "Far From the Kings' Wars"
 zin_regional_howan_far_from_the_kings_wars_desc:0 "The island declares that the wars of the great are not its wars. The harbour is closed to warships, the boats stay in their sheds, and the elders send word to every side that [ROOT.GetName] wants only to be left alone."
 zin_regional_howan_far_from_the_war:0 "Far From the Kings' Wars"
 zin_regional_howan_far_from_the_war_desc:0 "The harbour is closed to warships and the boats stay in their sheds. The island wants only to be left alone."
 zin_regional_howan_free_elections_of_howan:0 "Free Elections of Howan"
 zin_regional_howan_free_elections_of_howan_desc:0 "Every household may cast a pebble in the voting-jars at the quay. The jars are counted in public, and the smallest village has as loud a voice as the largest."
 zin_regional_howan_healers_at_the_quays:0 "Healers at the Quays"
 zin_regional_howan_healers_at_the_quays_desc:0 "Healers in grey robes tend the sick on the quay and feed the hungry."
 zin_regional_howan_honour_his_choice:0 "Honour His Choice"
 zin_regional_howan_honour_his_choice_desc:0 "The stranger will not stay to rule, and the Speakers do not ask him twice. They give him a boat, a chart and a blessing, and let him go."
 zin_regional_howan_howan_the_rice_isle:0 "Howan, the Rice Isle"
 zin_regional_howan_howan_the_rice_isle_desc:0 "Howan is the westernmost of the southern isles, a rice island with stepped terraces and one deep harbour. Its Speaker, Tich Howa, presides over a quiet people who sell rice to every passing ship."
 zin_regional_howan_hulls_for_the_west:0 "Hulls for the West"
 zin_regional_howan_hulls_for_the_west_desc:0 "The West is building a fleet for a crossing of the central sea, and has asked the isles for hulls. Howan's yards offer five, delivered and paid."
 zin_regional_howan_keepers_of_old_names:0 "Keepers of Old Names"
 zin_regional_howan_keepers_of_old_names_desc:0 "The names of stars, currents, winds and reefs are taught to the children as soon as they can speak. Learned visitors take notes and are astonished at how much has been remembered."
 zin_regional_howan_old_tales:0 "Old Tales of the Isles"
 zin_regional_howan_old_tales_desc:0 "A choir sings the island's oldest songs to every ship, and sailors carry them away to ports the islanders will never see."
 zin_regional_howan_old_tales_of_the_isles:0 "Old Tales of the Isles"
 zin_regional_howan_old_tales_of_the_isles_desc:0 "The old women of [ROOT.GetName] sit in the lee of the boat-sheds and tell the tales their grandmothers told them. Nobody has ever written them down, and nobody who has heard them forgets them."
 zin_regional_howan_priests_at_the_quays:0 "Priests at the Quays"
 zin_regional_howan_priests_at_the_quays_desc:0 "Grey-robed priests from the north have begun to meet the ships, offering blessings, bread and news. The islanders of [ROOT.GetName] are polite to them, and a little curious."
 zin_regional_howan_republic_of_howan:0 "The Commonwealth of Howan"
 zin_regional_howan_republic_of_howan_desc:0 "Terrace and harbour have learned to share one table, and a quarrel between them is settled by the Speakers before supper. Howan is small, and it is steady."
 zin_regional_howan_rescue_boats:0 "The Rescue Boats"
 zin_regional_howan_rescue_boats_desc:0 "Two strong boats are kept ready at the mouth of the harbour, crewed by fishers who have pulled drowned men from the reef. They go out in any weather and ask no name."
 zin_regional_howan_rice_for_the_ships:0 "Rice for the Ships"
 zin_regional_howan_rice_for_the_ships_desc:0 "A rice-market is set up on the quay, with scales, sacks and a bell to announce the price. Ships' cooks line up at dawn, and the market closes when the last sack is sold."
 zin_regional_howan_rice_merchants:0 "Rice Merchants"
 zin_regional_howan_rice_merchants_desc:0 "A guild of rice merchants takes the sacks from the farmers and sells them to ships at a steady price. Their warehouse is the biggest building in the island."
 zin_regional_howan_rice_terraces:0 "The Rice Terraces"
 zin_regional_howan_rice_terraces_desc:0 "Stepped paddies climb the hills in a hundred green tiers, each fed by the one above. Howan's villages open the sluices together at planting, and feast together at harvest."
 zin_regional_howan_send_them_on_their_way:0 "Send Them on Their Way"
 zin_regional_howan_send_them_on_their_way_desc:0 "The elders of [ROOT.GetName] thank the priests for their kindness, give them a good meal and put them on the next boat out. There is no insult in it, only the island's way of keeping what is its own."
 zin_regional_howan_ships_for_the_strangers_host:0 "Ships for the Gathering Host"
 zin_regional_howan_ships_for_the_strangers_host_desc:0 "When a host gathers against the dead, the isles can send it boats and men."
 zin_regional_howan_ships_of_howan:0 "Ships of Howan"
 zin_regional_howan_ships_of_howan_desc:0 "Shipwrights lay down a new yard beside the harbour, with a slipway for ocean hulls. Howan's boats are narrow and quick, and they ride the swell like gulls."
 zin_regional_howan_songs_for_strangers:0 "Songs for Visitors"
 zin_regional_howan_songs_for_strangers_desc:0 "A choir is formed to sing the island's songs to every ship that calls. The tunes are simple, the words are old, and sailors carry them away to ports the islanders will never see."
 zin_regional_howan_speakers_house:0 "The Speakers' House"
 zin_regional_howan_speakers_house_desc:0 "The Speakers are chosen by the terrace villages and the harbour guilds, and they meet in a long house above the quay. A Speaker holds office for three seasons and is never chosen twice running."
 zin_regional_howan_terraces_of_howan:0 "The Terraces of Howan"
 zin_regional_howan_terraces_of_howan_desc:0 "Every hillside is cut into green steps, and every step is mended after the rains. The terrace-masters walk the stairs each dawn, tapping the walls with long wooden staves."
 zin_regional_howan_the_granary_of_the_isles:0 "The Granary of the Isles"
 zin_regional_howan_the_granary_of_the_isles_desc:0 "Howan's granaries stand on stilts above the flood, and a seal is set on every door. In a bad season the other isles send boats to the quay, and nobody leaves empty."
 zin_regional_howan_the_harbour_guilds:0 "The Harbour Guilds"
 zin_regional_howan_the_harbour_guilds_desc:0 "Boatwrights, rope-makers and net-menders form their own guilds, each with a hall and a seal. The guilds send their wardens to the Speakers' House and are listened to."
 zin_regional_howan_the_harvest_festival:0 "The Harvest Festival"
 zin_regional_howan_the_harvest_festival_desc:0 "The drums sound at the first cut, and the whole island climbs to the highest terrace for a feast. Even the harbour guilds are quiet for a night."
 zin_regional_howan_the_house_of_castaways:0 "The House of Castaways"
 zin_regional_howan_the_house_of_castaways_desc:0 "Howan has kept a house for the shipwrecked for as long as there have been storms. A fire is never allowed to go out, and a bed is never allowed to be empty."
 zin_regional_howan_the_house_of_castaways_tip_1:0 "Howan has kept a house for the shipwrecked for as long as there have been storms."
 zin_regional_howan_the_isles_stand_together:0 "The Isles Stand Together"
 zin_regional_howan_the_isles_stand_together_desc:0 "Boats go out to every neighbouring island carrying a knotted cord, the island way of saying that peace is promised. [ROOT.GetName] and its neighbours agree to keep the peace between them for as long as the war lasts."
 zin_regional_howan_the_reef_singers:0 "The Reef Singers"
 zin_regional_howan_the_reef_singers_desc:0 "Old fishers sing a song about a reef where drowned voices call ships onto the rocks. Everyone knows the tune, and no one will say on which reef it began."
 zin_regional_howan_the_republic_of_howan:0 "The Commonwealth of Howan"
 zin_regional_howan_the_republic_of_howan_desc:0 "The terraces and the harbour are named one commonwealth under one seal, and the seal is carried in procession at midwinter. The island sets its name on every chart."
 zin_regional_howan_the_rescue_boats:0 "The Rescue Boats"
 zin_regional_howan_the_rescue_boats_desc:0 "The harbour fishers form a company of rescue boats, with oilskins, lines and a lantern for every thwart. They are paid only when they bring someone back."
 zin_regional_howan_the_road_to_gala:0 "The Road to Gala"
 zin_regional_howan_the_road_to_gala_desc:0 "The islanders say that when the tales of men grow too old for any man to explain, they should be carried to Gala. The Speakers send a boat south with a keeper of tales."
 zin_regional_howan_the_road_to_gala_tip_1:0 "When the tales of men grow too old for any man to explain, carry them to Gala."
 zin_regional_howan_the_speakers_house:0 "The Speakers' House"
 zin_regional_howan_the_speakers_house_desc:0 "The long house above the quay seats a Speaker from every terrace village and every harbour guild. Their talk is slow, and their decisions stand for years."
 zin_regional_howan_the_storm_years:0 "The Storm Years"
 zin_regional_howan_the_storm_years_desc:0 "Word arrives by every boat that the kings of the north and west are at war. The islanders of [ROOT.GetName] look out across the empty sea, count their stores and decide to keep the war on the far side of the horizon."
 zin_regional_howan_the_stranger_mends_our_quarrels:0 "Mending Old Quarrels"
 zin_regional_howan_the_stranger_mends_our_quarrels_desc:0 "The Speakers settle an old quarrel between the terraces and the harbour, and the island is calmer for it. Nobody quite remembers who first proposed the compromise."
 zin_regional_howan_the_stranger_mends_our_quarrels_tip_1:0 "The stranger among us helped the Speakers settle them."
 zin_regional_howan_the_water_stairs:0 "The Water Stairs"
 zin_regional_howan_the_water_stairs_desc:0 "Channels, sluices and stone aqueducts carry mountain water from step to step. The water-wardens count each drop, and have never been known to lose one."
 zin_regional_howan_the_western_harbour:0 "The Western Harbour"
 zin_regional_howan_the_western_harbour_desc:0 "The deep harbour is cleared of silt, its quay is extended and a second mole is begun. Ships from the west find Howan the first safe water after the storm seas."
 zin_regional_howan_traders_to_the_west:0 "Traders to the West"
 zin_regional_howan_traders_to_the_west_desc:0 "Howan's merchants sail north to the West Lands coast with rice and return with iron and rope. The route is long and well worn, and each captain keeps his own chart."
 zin_regional_howan_watch_the_southern_waves:0 "Watch the Southern Waves"
 zin_regional_howan_watch_the_southern_waves_desc:0 "Whatever else the war brings, it may bring ships. Lookouts take their places on the headlands of [ROOT.GetName], and the boats are kept ready on their rollers."
 zin_regional_howan_welcome_the_healers:0 "Welcome the Healers"
 zin_regional_howan_welcome_the_healers_desc:0 "The healers of the Deliverer ask for a house on the quay, where the sick can be tended and the hungry fed. [ROOT.GetName] gives them a building, a well and a cautious welcome."
 zin_regional_howan_western_trade:0 "Trade With the West"
 zin_regional_howan_western_trade_desc:0 "Howan's rice goes north to the coast of the West Lands, and what it brings back is salt, tools and gossip. A ship that has called once calls again."
 zin_regional_howan.1.a:0 "Fill the island's granary first"
 zin_regional_howan.1.b:0 "Sell to every ship"
 zin_regional_howan.1.d:0 "The terraces are cut and the boats come for rice. The festival drums sound along the stairs of the hills, and the Speakers must say how much of the crop goes to the quay and how much to the granary."
 zin_regional_howan.1.t:0 "The Harvest Festival"
