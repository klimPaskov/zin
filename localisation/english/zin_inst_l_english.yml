 zin_sp_wellspring_rite:0 "The Wellspring Rite"
 zin_sp_wellspring_rite_desc:0 "A rite worked at a deep spring, where the stone is slow to give. When it holds, essence flows from the earth for the whole realm."
 zin_sp_wind_reading:0 "Wind-Reading"
 zin_sp_wind_reading_desc:0 "Flags, feathers and a wise old keeper, taught to read the sky for a day ahead."
