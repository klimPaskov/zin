l_english:
 zin_ab_charge_home:0 "Press the Attack"
 zin_ab_charge_home_desc:0 "The host throws itself forward. Blows land harder and the line breaks sooner, but the dead are many and no one may turn back."
 zin_ab_deeper_trenches:0 "Deeper Ditches"
 zin_ab_deeper_trenches_desc:0 "The master of sappers sets every company to the spade. Ditches deepen far faster than usual."
 zin_ab_foraging:0 "Forage the Country"
 zin_ab_foraging_desc:0 "Companies spread out and take what the land offers, so the host does not go hungry for a week."
 zin_ab_ford_and_raft:0 "Fords and Rafts"
 zin_ab_ford_and_raft_desc:0 "Sappers lash rafts and mark fords. The river is no longer a wall."
 zin_ab_healers_afield:0 "Healers Afield"
 zin_ab_healers_afield_desc:0 "Healers walk the field behind the line, and more of the hurt return to the ranks."
 zin_ab_hold_in_depth:0 "Defence in Depth"
 zin_ab_hold_in_depth_desc:0 "The host spreads itself in layers behind the line. Plans are harder to make, but the ground is held more deeply."
 zin_ab_overrun:0 "Ride Them Down"
 zin_ab_overrun_desc:0 "Once the line breaks, the host presses on without stopping. It tires less on the move and bleeds less of its plan."
 zin_ab_probe:0 "Probe the Line"
 zin_ab_probe_desc:0 "Light attacks test the enemy without leaving the earthworks. The blows are weak, but the ditch is kept."
 zin_ab_rotate_reserves:0 "Rotate the Reserves"
 zin_ab_rotate_reserves_desc:0 "Tired companies are drawn back and fresh ones sent in, so the line is always filled."
 zin_ab_ships_gathered:0 "Gather the Ships"
 zin_ab_ships_gathered_desc:0 "Every hull in the harbour is pressed into the landing, and the plan is made in half the time."
 zin_ab_siege_engines:0 "Raise the Engines"
 zin_ab_siege_engines_desc:0 "Siege engines are hauled forward and set against the walls. Forts fall faster, and the town beside them suffers."
 zin_ab_stand_fast:0 "Stand to the Last"
 zin_ab_stand_fast_desc:0 "The host digs in and swears to hold. It cannot give ground, and it loses men for every hour it stands."
 zin_ab_war_council:0 "Council of War"
 zin_ab_war_council_desc:0 "The captains gather round the map and settle the plan in a fraction of the usual time."
 ZIN_ASSAULT_TT:0 "Raises the chance of a successful assault and shock."
 zin_chief_banner_1:0 "Keeper of Banners I"
 zin_chief_banner_1_desc:0 "Every company knows its standard, and clings to it when the day turns."
 zin_chief_banner_2:0 "Keeper of Banners II"
 zin_chief_banner_2_desc:0 "Every company knows its standard, and clings to it when the day turns."
 zin_chief_banner_3:0 "Keeper of Banners III"
 zin_chief_banner_3_desc:0 "Every company knows its standard, and clings to it when the day turns."
 zin_chief_battle_line_1:0 "Master of the Line I"
 zin_chief_battle_line_1_desc:0 "Teaches captains to hold station and let the great hulls speak."
 zin_chief_battle_line_2:0 "Master of the Line II"
 zin_chief_battle_line_2_desc:0 "Teaches captains to hold station and let the great hulls speak."
 zin_chief_battle_line_3:0 "Master of the Line III"
 zin_chief_battle_line_3_desc:0 "Teaches captains to hold station and let the great hulls speak."
 zin_chief_ditch_1:0 "Ditch-Master I"
