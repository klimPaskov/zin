 zin_workshop_armourers_p3_desc:0 "Shaped plates over the chest and thigh, proof against a bodkin."
 zin_workshop_armourers_s1:0 "Patrons"
 zin_workshop_armourers_s1_desc:0 "Lords and merchants give the guild their custom, and fund its study."
 zin_workshop_armourers_s2:0 "The Journeymen's Hall"
 zin_workshop_armourers_s2_desc:0 "A hall where the guild keeps its books and trains its young. More work can be taken at once."
 zin_workshop_armourers_s3:0 "The Counting-House"
 zin_workshop_armourers_s3_desc:0 "The guild's coin is counted, lent and returned with interest."
