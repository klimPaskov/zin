 zin_workshop_armourers_initial_desc:0 "Every Armourers' Hall item starts with this."
 zin_workshop_armourers_m1:0 "Fair Dealing"
 zin_workshop_armourers_m1_desc:0 "Honest weights and a plain ledger mean fewer disputes and cheaper work."
 zin_workshop_armourers_m2:0 "Guild Habits"
 zin_workshop_armourers_m2_desc:0 "Journeymen pass on their tricks, and the work gets faster each season."
