 zin_hq_banner:0 "Standard-Bearers"
 zin_hq_banner_desc:0 "The banner and its guard. Where they stand, the host knows its lord is present."
 zin_hq_eyrie_liaison:0 "Eyrie Liaison"
 zin_hq_eyrie_liaison_desc:0 "A rider of the wings who rides with the camp and tells the host where its beasts will strike."
 zin_hq_harbour_liaison:0 "Harbour Liaison"
 zin_hq_harbour_liaison_desc:0 "A captain of the fleet who rides with the camp and speaks for the ships."
 zin_hq_healers_tent:0 "The Healers' Tent"
 zin_hq_healers_tent_desc:0 "Herbs, bandages and patient hands. The hurt are carried here first."
 zin_hq_horn_master:0 "Master of Horns"
 zin_hq_horn_master_desc:0 "Sets the calls and the beacons that carry the lord's orders across the field."
 zin_hq_household_foot:0 "Household Foot"
 zin_hq_household_foot_desc:0 "The lord's own foot, picked men who guard the camp and the banner."
 zin_hq_household_grave:0 "Household of the Grave"
 zin_hq_household_grave_desc:0 "The risen dead who never leave their lord's side."
 zin_hq_household_kin_ents:0 "Great-Kin Guard of the Ents"
 zin_hq_household_kin_ents_desc:0 "A grove of ents who stand around the camp and do not move until they must."
 zin_hq_household_kin_giants:0 "Great-Kin Guard of the Giants"
 zin_hq_household_kin_giants_desc:0 "Giants of the lord's own kin, who carry the banner at three times the height of a man."
 zin_hq_household_kin_trolls:0 "Great-Kin Guard of the Trolls"
 zin_hq_household_kin_trolls_desc:0 "Trolls of the lord's own warren, bound by hunger and loyalty to the camp."
 zin_hq_household_kin_yeti:0 "Great-Kin Guard of the Yeti"
 zin_hq_household_kin_yeti_desc:0 "Yeti of the high snows, who keep the camp from the cold as well as from the foe."
 zin_hq_household_knights:0 "Household Knights"
 zin_hq_household_knights_desc:0 "Armoured lords of the lord's own house, who ride at the centre of the charge."
 zin_hq_household_nether:0 "Household of the Nether"
 zin_hq_household_nether_desc:0 "Bound demons sworn to guard their master's tent."
 zin_hq_household_riders:0 "Household Riders"
 zin_hq_household_riders_desc:0 "Mounted guards who carry the lord's word and ride down those who flee."
 zin_hq_master_armourer:0 "Master Armourer"
 zin_hq_master_armourer_desc:0 "Mends mail, grinds blades and keeps the host's iron in order."
 zin_hq_provost_marshal:0 "Provost-Marshal"
 zin_hq_provost_marshal_desc:0 "Keeps order in the camp and on the road, and hangs thieves."
 zin_hq_quartermaster_general:0 "Quartermaster-General"
 zin_hq_quartermaster_general_desc:0 "Counts the wagons, the sacks and the days to the next depot."
 zin_hq_ranger_captain:0 "Ranger-Captain"
 zin_hq_ranger_captain_desc:0 "Leads the few who go ahead of the scouts and behind the enemy."
 zin_hq_sapper_master:0 "Master of Sappers"
 zin_hq_sapper_master_desc:0 "Digs the ditches, breaks the walls and builds the camp palisade."
 zin_hq_scout_master:0 "Master of Scouts"
 zin_hq_scout_master_desc:0 "Sends riders and woodsmen ahead of the host and reads their reports."
 ZIN_IMPROVISER_TT:0 "+10% movement speed in every kind of country."
 zin_inst_great_manoeuvres:0 "Great Manoeuvres"
 zin_inst_great_manoeuvres_cost_tt:0 "20 Orders"
 zin_inst_great_manoeuvres_desc:0 "Muster the hosts in the field for a season of drill. Some will be hurt, and the stores will be much spent, but the captains learn."
 zin_inst_great_manoeuvres_wear_tt:0 "2% of the strength of the hosts is lost to the drill"
 zin_inst_hallowed:0 "Hallowed Ground"
 zin_inst_hallowed_desc:0 "A circle of wards keeps this land. Foes tire here, and friends are fed."
 zin_inst_scar_blighted:0 "Blighted Wellspring"
 zin_inst_scar_blighted_desc:0 "The working went wrong. What came up from the deep stones has soured the whole country."
 zin_inst_scar_hollow:0 "Hollow Ground"
 zin_inst_scar_hollow_desc:0 "The working went wrong. The ground here is dull and sour, and the wagon-roads sink."
 zin_inst_scar_scorched:0 "Scorched Roost"
 zin_inst_scar_scorched_desc:0 "The working went wrong. The perches are charred and the beasts will not settle."
 zin_inst_scar_wrecked:0 "Wrecked Moorings"
 zin_inst_scar_wrecked_desc:0 "The working went wrong. The quay-stones are cracked and the water here is sour."
 zin_inst_sea_trials:0 "Sea Trials"
 zin_inst_sea_trials_cost_tt:0 "15 Orders"
 zin_inst_sea_trials_desc:0 "Send the fleet out on a long cruise in bad weather. Hulls will be strained, but the crews come home sailors."
 zin_inst_sea_trials_wear_tt:0 "5% of the strength of the ships is lost to the drill"
 zin_inst_valour:0 "Valour and Drill"
 zin_inst_valour_desc:0 "Hosts, fleets and wings grow fierce only by drilling. Each drill costs Orders, stores and some blood."
 zin_inst_wild_surge:0 "Wild Surge"
 zin_inst_wild_surge_desc:0 "A working slipped its leash for a night. The land is unsettled, and the hosts uneasy."
 zin_inst_wing_trials:0 "Wing Trials"
 zin_inst_wing_trials_cost_tt:0 "15 Orders"
 zin_inst_wing_trials_desc:0 "Fly every wing hard for a season. Some beasts will be lost to the wind, but the riders learn their trade."
 zin_inst_wing_trials_wear_tt:0 "5% of the strength of the wings is lost to the drill"
 zin_inst.1.a:0 "The camp-fires burn low."
 zin_mio_armourers_sign:0 "The Plate Tally"
 zin_mio_armourers_sign_desc:0 "The Armourers' Hall lend their Tempered Plate at half strength, and take a cost in return."
 zin_mio_bowyers_sign:0 "The Quiver Ledger"
 zin_mio_bowyers_sign_desc:0 "The Bowyers' Hall lend their Composite Secret at half strength, and take a cost in return."
 zin_mio_dark_forges_sign:0 "The Grave-Ledger"
 zin_mio_dark_forges_sign_desc:0 "The Grave-Forges lend their Deep Forging at half strength, and take a cost in return."
 zin_mio_elven_forges_sign:0 "The Leaf-Song"
 zin_mio_elven_forges_sign_desc:0 "The Leaf-Forges lend their Song-Forged at half strength, and take a cost in return."
 zin_mio_engineers_sign:0 "The Engine Yard"
 zin_mio_engineers_sign_desc:0 "The Engineers' Lodge lend their Great Engines at half strength, and take a cost in return."
 zin_mio_guild_charters:0 "Guild Charters"
 zin_mio_guild_charters_desc:0 "A royal charter fixes the guild's prices and its privileges. Work is cheaper to commission."
 zin_mio_head_capstone:0 "Capstone"
 zin_mio_head_methods:0 "Methods"
 zin_mio_head_patterns:0 "Patterns"
 zin_mio_head_standing:0 "Standing"
 zin_mio_masters_marks:0 "Master's Marks"
 zin_mio_masters_marks_desc:0 "Every piece leaves the hall under a master's mark and he answers for its fall."
 zin_mio_royal_warrants:0 "Royal Warrants"
 zin_mio_royal_warrants_desc:0 "The crown buys the guild's whole output at a fixed price. The line runs full."
 zin_mio_shipwrights_sign:0 "Slip and Keel"
 zin_mio_shipwrights_sign_desc:0 "The Shipwrights' Guild lend their Master Shipwrights at half strength, and take a cost in return."
 zin_mio_smiths_sign:0 "The Iron Hall"
 zin_mio_smiths_sign_desc:0 "The Smiths' Guild lend their Master's Mark at half strength, and take a cost in return."
 zin_mio_stud_sign:0 "The Stud Book"
 zin_mio_stud_sign_desc:0 "The Royal Stud lend their Great Studs at half strength, and take a cost in return."
 zin_mio_wardsmiths_sign:0 "The Lantern Count"
 zin_mio_wardsmiths_sign_desc:0 "The Wardsmiths lend their Warded Cloth at half strength, and take a cost in return."
 ZIN_NEEDS_TERRAIN_TT:0 "Needs at least one terrain trait."
 zin_oc_banner_fast:0 "Fast Banners"
 zin_oc_banner_fast_desc:0 "Captains of a hundred are trusted to move on their own word."
 zin_oc_boarders_pride:0 "Boarders' Pride"
 zin_oc_boarders_pride_desc:0 "Crews are proud of their grapples; they land well and keep their nerve."
 zin_oc_chain_of_banners:0 "Chain of Banners"
 zin_oc_chain_of_banners_desc:0 "Orders pass from standard to standard down the line, each one repeated."
 zin_oc_chair_of_strategy:0 "Chair of Strategy"
 zin_oc_chair_of_strategy_desc:0 "A seat at the Council is kept for one who studies old campaigns."
 zin_oc_chart_room:0 "The Chart Room"
 zin_oc_chart_room_desc:0 "Every shore sketched by a captain is copied, corrected and kept."
 zin_oc_dragon_wardens:0 "Dragon Wardens"
 zin_oc_dragon_wardens_desc:0 "Sworn wardens keep the great beasts fed, rested and obedient to their riders."
 zin_oc_eyrie_watch:0 "The Eyrie Watch"
 zin_oc_eyrie_watch_desc:0 "A rider is always aloft over the border, whatever the season."
 zin_oc_foragers:0 "The Foragers"
 zin_oc_foragers_desc:0 "Every company keeps a few who can find supper in an empty field."
 zin_oc_free_captains:0 "Free Captains"
 zin_oc_free_captains_desc:0 "Each captain plans his own part of the field and answers for it."
 zin_oc_free_corsair_captains:0 "Free Corsair Captains"
 zin_oc_free_corsair_captains_desc:0 "Raiding captains sail on their own account and know when to run."
 zin_oc_group_academy_spirit:0 "The Yard"
 zin_oc_group_air_force_academy_spirit:0 "The Roost School"
 zin_oc_group_air_force_command_spirit:0 "Banner of the Wing"
 zin_oc_group_air_force_spirit:0 "Customs of the Wing"
 zin_oc_group_army_spirit:0 "Customs of the Host"
 zin_oc_group_division_command_spirit:0 "Banner Customs"
 zin_oc_group_naval_academy_spirit:0 "The Slip"
 zin_oc_group_naval_command_spirit:0 "Banner of the Sea"
 zin_oc_group_navy_spirit:0 "Customs of the Fleet"
 zin_oc_harbour_masters:0 "The Harbour Masters"
 zin_oc_harbour_masters_desc:0 "Victualling is kept in every port, so the fleet can range further and longer."
 zin_oc_heralds_school:0 "Heralds' School"
 zin_oc_heralds_school_desc:0 "Riders and heralds are drilled to carry word faster than the enemy can learn of it."
 zin_oc_household_levy:0 "Household Levy"
 zin_oc_household_levy_desc:0 "Every great house sends its household to the muster, and replaces its dead."
 zin_oc_lane_wardens:0 "The Lane Wardens"
 zin_oc_lane_wardens_desc:0 "Galleys shadow the merchant fleets along every trade lane."
 zin_oc_line_of_battle_custom:0 "The Line of Battle"
 zin_oc_line_of_battle_custom_desc:0 "Ships hold station in a long line and let the great hulls decide the day."
 zin_oc_master_of_wings:0 "The Master of Wings"
 zin_oc_master_of_wings_desc:0 "One captain commands every wing and sends each where the ground host needs it."
 zin_oc_oath_companies:0 "Oath Companies"
 zin_oc_oath_companies_desc:0 "Companies swear to one lord and one banner, and stand or fall with them."
 zin_oc_pilots_school:0 "The Pilots' Hall"
 zin_oc_pilots_school_desc:0 "Young captains serve a year under the harbour pilots before they command."
 zin_oc_roost_school:0 "The Roost School"
 zin_oc_roost_school_desc:0 "Young riders learn first to keep a beast calm, then to keep it fighting."
 zin_oc_rope_and_rigging:0 "Rope and Rigging"
 zin_oc_rope_and_rigging_desc:0 "Crews learn to mend sails in a gale and to keep hulls sound on long voyages."
 zin_oc_sea_lords_council:0 "The Sea-Lords' Council"
 zin_oc_sea_lords_council_desc:0 "Fleet commanders meet each winter to settle one plan for the year."
 zin_oc_shield_wall_custom:0 "The Shield Wall"
 zin_oc_shield_wall_custom_desc:0 "When the horn sounds, the first rank locks shields and the second sets spears over them."
 zin_oc_spear_rush_custom:0 "The Spear Rush"
 zin_oc_spear_rush_custom_desc:0 "The host charges as one body; a broken charge costs the host dear."
 zin_oc_squires_yard:0 "Squires' Yard"
 zin_oc_squires_yard_desc:0 "Young captains learn the field by taking it in turn at the standard."
 zin_oc_veterans_lodge:0 "Veterans' Lodge"
 zin_oc_veterans_lodge_desc:0 "Old soldiers teach new ones how to keep a host fed, warm and in good heart."
 zin_oc_wind_masters:0 "The Wind-Masters"
 zin_oc_wind_masters_desc:0 "Riders learn to read the wind from a stable window before they ever fly."
 zin_oc_wing_oaths:0 "Wing Oaths"
 zin_oc_wing_oaths_desc:0 "Each wing swears to fly together and to return together."
 zin_op_boost_resistance:0 "Arm the Hidden"
 zin_op_boost_resistance_desc:0 "Spears, shields and the knowledge to use them, handed to the unwilling subjects of a rival's holding."
 zin_op_capture_cipher:0 "Steal the Cipher-Book"
 zin_op_capture_cipher_desc:0 "A courier's book of seals, copied in a night. The Reading Room does the rest."
 zin_op_collaboration:0 "Seat a Friendly Regent"
 zin_op_collaboration_desc:0 "In a conquered land, a regent of our choosing governs in our name, and the folk obey him more readily than they would us."
 zin_op_consumes_token_tt:0 "The token is spent when the scheme succeeds."
 zin_op_coordinated_strike:0 "The Dawn Blow"
 zin_op_coordinated_strike_desc:0 "Agents open a gate, cut the signal fires and guide the host in, so that war begins with the fort already ours."
 zin_op_coordinated_strike_tt:0 "Our hosts begin the war with the gates already open."
 zin_op_coup:0 "Raise the Captains"
 zin_op_coup_desc:0 "The captains rise against their lord. Arms are sent ahead, and a few of the household look the other way."
 zin_op_fake_intel:0 "Plant False Letters"
 zin_op_fake_intel_desc:0 "A forged letter, planted where the enemy's seals will find it. Their captains march after phantoms."
 zin_op_fake_intel_result_tt:0 "Phantom hosts appear near our capital, and fade after 90 days."
 zin_op_fake_intel_tt:0 "Phantom hosts appear near our capital. The enemy will count them."
 zin_op_infiltrate_air:0 "Befriend the Roost"
 zin_op_infiltrate_air_desc:0 "A friend among a rival's dragon-keepers and riders, who talks over wine."
 zin_op_infiltrate_army:0 "Enlist on the Roll"
 zin_op_infiltrate_army_desc:0 "A name added to a rival's muster rolls, and a friend among his captains."
 zin_op_infiltrate_civilian:0 "Take Service at Court"
 zin_op_infiltrate_civilian_desc:0 "An agent takes a place in a rival household and learns who comes and goes."
 zin_op_infiltrate_navy:0 "Sign Aboard"
 zin_op_infiltrate_navy_desc:0 "A berth in a rival's fleet, and a quiet word with the boatswain."
 zin_op_rescue_general:0 "Ransom a Captain"
 zin_op_rescue_general_desc:0 "A captain of ours is held by a rival lord. Agents may parley a ransom, storm the hold or smuggle him out in a carriage."
 zin_op_rescue_operative:0 "Bring Our Own Home"
 zin_op_rescue_operative_desc:0 "Free an agent of ours who sits in a rival's cells. A sound plan, a quiet door and a fast horse are all it takes."
 zin_op_resistance_boost_tt:0 "The hidden in this holding grow bolder."
 zin_op_resistance_contacts:0 "Find the Hidden"
 zin_op_resistance_contacts_desc:0 "Friends among the unwilling, found in markets and chapels, who will remember a kindness."
 zin_op_sabotage_industry_more_tt:0 "The workshops of this holding will suffer many fires."
 zin_op_sabotage_industry_once_tt:0 "The workshops of this holding will suffer several fires."
 zin_op_sabotage_industry_tt:0 "The rival's workshops suffer fire and ruin."
 zin_op_sabotage_infrastructure_more_tt:0 "The roads of this holding will be cut in many places."
 zin_op_sabotage_infrastructure_once_tt:0 "The roads of this holding will be cut in several places."
 zin_op_sabotage_infrastructure_tt:0 "The rival's roads and bridges are cut."
 zin_op_sabotage_mines:0 "Flood the Mines"
 zin_op_sabotage_mines_desc:0 "Drowned shafts, spoiled granaries and blighted fields in the rival's lands."
 zin_op_sabotage_resources_more_tt:0 "The mines and stores of this holding will suffer many blows."
 zin_op_sabotage_resources_once_tt:0 "The mines and stores of this holding will suffer several blows."
 zin_op_sabotage_resources_tt:0 "The rival's mines and stores are ruined."
 zin_op_sabotage_roads:0 "Cut the Roads"
 zin_op_sabotage_roads_desc:0 "A bridge, a ford, a mountain road. The rival's carts and hosts go the long way round."
 zin_op_sabotage_workshops:0 "Spoil the Workshops"
 zin_op_sabotage_workshops_desc:0 "Pitch and fire in the halls of the rival's smiths and joiners."
 zin_op_steal_air:0 "Copy the Roost-Lore"
 zin_op_steal_air_desc:0 "The old keepers' lore of feed and handling, copied from a rival's roosts."
 zin_op_steal_army:0 "Copy the Smiths' Patterns"
 zin_op_steal_army_desc:0 "Arms, mail and engines drawn from a rival's armouries and copied."
 zin_op_steal_civilian:0 "Copy a Guild's Secrets"
 zin_op_steal_civilian_desc:0 "Pattern-books copied by candlelight from a rival's guild halls."
 zin_op_steal_navy:0 "Copy the Shipwrights' Plans"
 zin_op_steal_navy_desc:0 "Hull plans and rigging drawings, copied in a rival's yards."
 zin_ph_agent_camp:0 "At the Camp"
 zin_ph_agent_camp_desc:0 "Our agent sits in a camp lock-up. A friend inside opens the gate."
 zin_ph_agent_camp_outcome:0 "A gate opened from within, and our agent walked out."
 zin_ph_agent_tools:0 "Hidden Tools"
 zin_ph_agent_tools_desc:0 "A file in a loaf, a key in a boot. The prisoner does the rest."
 zin_ph_agent_tools_outcome:0 "Our agent had the tools he needed and made his own way out."
 zin_ph_agent_transit:0 "In Transit"
 zin_ph_agent_transit_desc:0 "Our agent is moved between two strongholds. The cart is stopped on a lonely road."
 zin_ph_agent_transit_outcome:0 "Our agent was freed on the road, and the guards never found out which way he went."
 zin_ph_captain_carriage:0 "A Disguised Carriage"
 zin_ph_captain_carriage_desc:0 "A closed carriage, a false pass and a driver who does not speak."
 zin_ph_captain_carriage_outcome:0 "The captain rode out in a lady's carriage, and no guard looked inside."
 zin_ph_captain_hold:0 "A Stormed Hold"
 zin_ph_captain_hold_desc:0 "The captain is held in a small keep. Agents, a few friends and a ladder will do."
 zin_ph_captain_hold_outcome:0 "The hold was taken in a night, and the captain brought out through the postern."
 zin_ph_captain_parley:0 "A Ransom Parley"
 zin_ph_captain_parley_desc:0 "Envoys meet the captor and name a price. The ransom is paid in silver and in promises."
 zin_ph_captain_parley_outcome:0 "The ransom was paid, and our captain came home on a borrowed horse."
 zin_ph_cipher_courier:0 "A Bribed Courier"
 zin_ph_cipher_courier_desc:0 "The rider who carries the book is paid to lose it for a single night."
 zin_ph_cipher_courier_outcome:0 "The courier was paid, and the cipher-book was copied before dawn."
 zin_ph_cipher_raid:0 "A Raid on the Seal-Room"
 zin_ph_cipher_raid_desc:0 "Three agents, a lantern and a stolen key take the seal-room while the clerks sleep."
 zin_ph_cipher_raid_outcome:0 "The seal-room was emptied and filled again before the clerks woke."
 zin_ph_cipher_scribe:0 "A Wooed Scribe"
 zin_ph_cipher_scribe_desc:0 "A scribe who dines with an agent, and who likes to be asked about his work."
 zin_ph_cipher_scribe_outcome:0 "The scribe talked all evening, and the agent remembered it all."
 zin_ph_cipher_smuggle:0 "A Smuggled Book"
 zin_ph_cipher_smuggle_desc:0 "The cipher-book is borrowed under a merchant's cloak and carried out in a bale of cloth."
 zin_ph_cipher_smuggle_outcome:0 "The book was carried out in a bolt of cloth and carried back the same way."
 zin_ph_cipher_wheel:0 "A Copied Wheel"
 zin_ph_cipher_wheel_desc:0 "A brass cipher wheel is pressed in wax, and a founder in our pay casts a twin."
 zin_ph_cipher_wheel_outcome:0 "A twin of the cipher wheel now turns in our Reading Room."
 zin_ph_coup_meet:0 "The Captains Meet"
 zin_ph_coup_meet_desc:0 "In a hunting lodge, far from the court, the captains agree who will rise and when."
 zin_ph_coup_meet_outcome:0 "The captains met in secret and swore to rise together."
 zin_ph_coup_standard:0 "The Standard Is Raised"
 zin_ph_coup_standard_desc:0 "A banner, new-sewn, is hung from a captain's tower, and the host splits in two."
 zin_ph_coup_standard_outcome:0 "The captains raised their own standard, and the host divided."
 zin_ph_fake_fires:0 "Decoy Camp-Fires"
 zin_ph_fake_fires_desc:0 "Hundreds of fires lit on a ridge where no host lies, to be counted by the enemy's scouts."
 zin_ph_fake_fires_outcome:0 "A ridge of fires drew the enemy's scouts, and he counted a host that was never there."
 zin_ph_fake_horns:0 "False Signal Horns"
 zin_ph_fake_horns_desc:0 "Horn calls from the wrong hills, sounded at the hours when an army would sound them."
 zin_ph_fake_horns_outcome:0 "False horns called from the wrong hills, and the enemy answered them."
 zin_ph_fake_leaks:0 "Deliberate Leaks"
 zin_ph_fake_leaks_desc:0 "A word dropped in a tavern frequented by clerks, which the enemy will pass up the line."
 zin_ph_fake_leaks_outcome:0 "A well-placed whisper reached the enemy's council as a warning."
 zin_ph_fake_prisoner:0 "A Released Prisoner"
 zin_ph_fake_prisoner_desc:0 "A captive freed with a head full of what he was told, and a plausible story of how he escaped."
 zin_ph_fake_prisoner_outcome:0 "A freed prisoner carried our story home, and swore it was true."
 zin_ph_fake_proofs:0 "Planted Proofs"
 zin_ph_fake_proofs_desc:0 "Orders, tallies and a sealed letter, left where a careless officer will find them."
 zin_ph_fake_proofs_outcome:0 "The planted proofs were found, and carried to the enemy council as truth."
 zin_ph_fake_rumours:0 "Market Rumours"
 zin_ph_fake_rumours_desc:0 "Traders tell a tale of our muster at every fair, and the tale grows in the telling."
 zin_ph_fake_rumours_outcome:0 "The rumour ran the length of the high road and was believed."
 zin_ph_fake_turncoat:0 "A Turned Agent"
 zin_ph_fake_turncoat_desc:0 "An enemy spy who works for us, and feeds his masters what we choose."
 zin_ph_fake_turncoat_outcome:0 "The enemy's spy sent home a report that we wrote."
 zin_ph_force_believer:0 "A Believer"
 zin_ph_force_believer_desc:0 "Someone who holds a creed of our people close to his heart, and little love for his own lord."
 zin_ph_force_believer_outcome:0 "A believer in our cause gave us his service freely."
 zin_ph_force_bribe:0 "A Bribe"
 zin_ph_force_bribe_desc:0 "A purse changes hands in a back room of an inn."
 zin_ph_force_bribe_outcome:0 "The purse was taken and the debt noted."
 zin_ph_force_lover:0 "A Lover"
 zin_ph_force_lover_desc:0 "A friendship of the heart gives an agent the ear of someone who matters."
 zin_ph_force_lover_outcome:0 "A fond word gave our agent the ear of a person with the keys."
 zin_ph_force_prisoner:0 "A Prisoner Turned"
 zin_ph_force_prisoner_desc:0 "A captive taken in the last quarrel is offered his freedom for a few small favours."
 zin_ph_force_prisoner_outcome:0 "A prisoner chose his freedom, and now writes to us."
 zin_ph_in_border:0 "By the Border"
 zin_ph_in_border_desc:0 "The agents cross the march on foot, between two watch-posts, in the dark of the moon."
 zin_ph_in_border_outcome:0 "Our agents slipped across the border and were not challenged."
 zin_ph_in_embassy:0 "Through the Embassy"
 zin_ph_in_embassy_desc:0 "The agents travel openly with an envoy's train, and are lodged with the envoy's household."
 zin_ph_in_embassy_outcome:0 "Our agents entered under the envoy's cloak, and the court was too polite to ask questions."
 zin_ph_in_ship:0 "By a Night Ship"
 zin_ph_in_ship_desc:0 "A small boat puts them ashore on a quiet beach, and sails again before dawn."
 zin_ph_in_ship_outcome:0 "A night ship set our agents ashore, and no watch saw her."
 zin_ph_in_wing:0 "By Wing"
 zin_ph_in_wing_desc:0 "A dragon-keeper in our debt carries them over the border on a night flight."
 zin_ph_in_wing_outcome:0 "A rider set our agents down in a pasture far from any road."
 zin_ph_out_border:0 "Out by the Border"
 zin_ph_out_border_desc:0 "The agents walk home by the way they came, with the passes closing behind them."
 zin_ph_out_border_outcome:0 "Our agents crossed the border safely."
 zin_ph_out_border_outcome_extra:0 "Our agents were last seen at the border. They did not report back, and the watch-posts were loud that night."
 zin_ph_out_ground:0 "To Ground"
 zin_ph_out_ground_desc:0 "The agents hide in a safe house in the capital until the hunt is over."
 zin_ph_out_ground_outcome:0 "Our agents lay hidden until the search had ended, and walked out as merchants."
 zin_ph_out_ground_outcome_extra:0 "Our agents went to ground, but a neighbour talked. The safe house was searched."
 zin_ph_out_ship:0 "A Sea Pickup"
 zin_ph_out_ship_desc:0 "A fishing boat comes in on the night tide to take them off the shore."
 zin_ph_out_ship_outcome:0 "A boat took our agents off a lonely beach."
 zin_ph_out_ship_outcome_extra:0 "A boat came for our agents, but the shore was watched. Some did not return."
 zin_ph_out_wing:0 "Out by Wing"
 zin_ph_out_wing_desc:0 "A rider lifts the agents out of a quiet field at midnight."
 zin_ph_out_wing_outcome:0 "A rider carried our agents out over the hills."
 zin_ph_out_wing_outcome_extra:0 "A rider came for our agents, but beasts were heard and archers were set. Some did not return."
 zin_ph_regent_captains:0 "Friendly Captains"
 zin_ph_regent_captains_desc:0 "Captains of the old order are won over one by one with titles and with promises."
 zin_ph_regent_captains_outcome:0 "The old captains accepted the regent, and brought their companies."
 zin_ph_regent_council:0 "A Planning Council"
 zin_ph_regent_council_desc:0 "Our envoys sit with the chosen regent and sketch how the land will be governed."
 zin_ph_regent_council_outcome:0 "The regent and our envoys settled how the land would be ruled."
 zin_ph_regent_garrison:0 "Training a Garrison"
 zin_ph_regent_garrison_desc:0 "The regent's own guard is drilled in our ways, and sworn to him and to us."
 zin_ph_regent_garrison_outcome:0 "The regent has a guard that answers to him, and to us."
 zin_ph_res_barn:0 "A Briefing in a Barn"
 zin_ph_res_barn_desc:0 "A night meeting among the straw, with a lantern shuttered."
 zin_ph_res_barn_outcome:0 "A meeting in a barn settled who will be asked and who will answer."
 zin_ph_res_beacons:0 "Beacon Codes"
 zin_ph_res_beacons_desc:0 "Hill-top fires are lit in a pattern only the hidden know."
 zin_ph_res_beacons_outcome:0 "A beacon code was agreed, and the hidden know which fires are ours."
 zin_ph_res_birds:0 "Carrier Birds"
 zin_ph_res_birds_desc:0 "Pigeons taken to the unwilling villages, with a promise of more."
 zin_ph_res_birds_outcome:0 "The hidden have birds now, and will send word when they need us."
 zin_ph_sab_bridge:0 "A Broken Bridge"
 zin_ph_sab_bridge_desc:0 "A pier cut half through, so that the bridge falls under the first heavy cart."
 zin_ph_sab_bridge_outcome:0 "The bridge fell under the first loaded wagon, and the stream took it."
 zin_ph_sab_carts:0 "Stranded Carts"
 zin_ph_sab_carts_desc:0 "Axles cut halfway through, so that a long train breaks down far from any smith."
 zin_ph_sab_carts_outcome:0 "A train of carts broke down on the high road, and the goods were left to rot."
 zin_ph_sab_gallery:0 "A Collapsed Gallery"
 zin_ph_sab_gallery_desc:0 "Props cut in the old mine road, so that the roof comes down on the next shift."
 zin_ph_sab_gallery_outcome:0 "The old gallery fell, and the road beyond it is closed for a season."
 zin_ph_sab_granary:0 "A Burned Granary"
 zin_ph_sab_granary_desc:0 "A fire in the stores at harvest, set by someone who knew where the rats were."
 zin_ph_sab_granary_outcome:0 "The granary burned to the ground, and the winter will be hard."
 zin_ph_sab_meetings:0 "Stalled Meetings"
 zin_ph_sab_meetings_desc:0 "Quarrels at the guild table, over small things, until nothing is decided."
 zin_ph_sab_meetings_outcome:0 "The guild masters argued for a season and made nothing."
 zin_ph_sab_pitch:0 "Pitch in the Halls"
 zin_ph_sab_pitch_desc:0 "Casks of pitch carried in with the morning delivery, and a spark at midnight."
 zin_ph_sab_pitch_outcome:0 "The halls burned, and the fire could not be traced to a hand."
 zin_ph_sab_signposts:0 "Stolen Signposts"
 zin_ph_sab_signposts_desc:0 "Milestones turned about and signposts taken down, so that carters lose their way."
 zin_ph_sab_signposts_outcome:0 "Carters took the wrong road for a month, and many never arrived."
 zin_ph_sab_tools:0 "Spoiled Mining Tools"
 zin_ph_sab_tools_desc:0 "Picks quenched too hot, so that they shatter on the first deep stone."
 zin_ph_sab_tools_outcome:0 "The miners' picks broke one by one, and the shaft was left idle."
 zin_ph_steal_apprentice:0 "A Charming Apprentice"
 zin_ph_steal_apprentice_desc:0 "An apprentice of ours takes a place beside the master, who is fond of a willing pupil."
 zin_ph_steal_apprentice_outcome:0 "The apprentice copied the master's patterns, line by line."
 zin_ph_steal_chest:0 "A Copied Plan-Chest"
 zin_ph_steal_chest_desc:0 "Night after night, a few sheets are taken, copied and returned before the yard wakes."
 zin_ph_steal_chest_outcome:0 "A plan-chest was copied and returned with no seal broken."
 zin_ph_steal_clerk:0 "A Bribed Clerk"
 zin_ph_steal_clerk_desc:0 "A clerk who keeps the keys is short of silver and long on grudges."
 zin_ph_steal_clerk_outcome:0 "The clerk let us into the plan-chests and kept the door."
 zin_ph_steal_foreman:0 "A Talkative Foreman"
 zin_ph_steal_foreman_desc:0 "A foreman who drinks too long on market days, and speaks too freely when he does."
 zin_ph_steal_foreman_outcome:0 "The foreman told us all he knew, and thought he was only complaining."
 zin_ph_steal_model:0 "A Stolen Model"
 zin_ph_steal_model_desc:0 "A small wooden model of the working, meant to be carried to the master's bench."
 zin_ph_steal_model_outcome:0 "A model was taken from the bench and carried across the border."
 zin_ph_strike_bridges:0 "Seizing the Bridges"
 zin_ph_strike_bridges_desc:0 "At the signal, the agents and a few friends hold the bridges against the garrison."
 zin_ph_strike_bridges_outcome:0 "The bridges were held until the host came up."
 zin_ph_strike_fires:0 "Cutting the Signal Fires"
 zin_ph_strike_fires_desc:0 "On the night of the blow, every beacon on the border is put out before it is lit."
 zin_ph_strike_fires_outcome:0 "The beacons were put out one by one, and the realm slept on."
 zin_ph_strike_guide:0 "Guiding the Host"
 zin_ph_strike_guide_desc:0 "Agents wait at every crossroads with a lantern and show the vanguard the paths."
 zin_ph_strike_guide_outcome:0 "The vanguard found its way through the dark by our lanterns."
 zin_ph_strike_mark:0 "Marking the Targets"
 zin_ph_strike_mark_desc:0 "Chalk on doors, coloured ribbons on posts. The host will know what to take first."
 zin_ph_strike_mark_outcome:0 "The targets were marked in a way that only the host could read."
 zin_ph_strike_scout:0 "Scouting the Gate"
 zin_ph_strike_scout_desc:0 "Agents walk every wall and note every sentry, every hour and every lamp."
 zin_ph_strike_scout_outcome:0 "Every gate was walked and written down, and the plan was drawn."
 zin_ph_sup_armouries:0 "Hidden Armouries"
 zin_ph_sup_armouries_desc:0 "Spears and bows buried in a dry well, wrapped in oiled cloth."
 zin_ph_sup_armouries_outcome:0 "A hidden armoury was laid, and the hidden know where it lies."
 zin_ph_sup_bands:0 "Joining the Bands"
 zin_ph_sup_bands_desc:0 "Agents ride with the hidden for a season, and show them the paths between the holds."
 zin_ph_sup_bands_outcome:0 "Our agents rode with the hidden and showed them the safe paths."
 zin_ph_sup_drill:0 "Teaching Drill"
 zin_ph_sup_drill_desc:0 "A few veterans of our host teach the hidden to hold a line."
 zin_ph_sup_drill_outcome:0 "The hidden learned to march and stand, and will not break at the first charge."
 zin_ph_sup_handout:0 "Arms Handed Out"
 zin_ph_sup_handout_desc:0 "A cart of hoes and scythes, each with an edge a smith has set."
 zin_ph_sup_handout_outcome:0 "A cartload of tools with edges was shared out on a feast day."
 zin_sch_artificer:0 "Artificer"
 zin_sch_artificer_desc:0 "Happier at the bench than at the lectern."
 zin_sch_bright:0 "Quick Student"
 zin_sch_bright_desc:0 "Learns a rite on the first telling."
 zin_sch_cautious:0 "Cautious"
 zin_sch_cautious_desc:0 "Checks the circle thrice before lighting it."
 zin_sch_elder_memory:0 "Elder Memory"
 zin_sch_elder_memory_desc:0 "Remembers the rites as they were first taught, long before the Fourth Age."
 zin_sch_gifted:0 "Gifted"
 zin_sch_gifted_desc:0 "A mind that seems to see the whole working at once."
 zin_sch_loremaster:0 "Loremaster"
 zin_sch_loremaster_desc:0 "Knows the old books better than the librarians who keep them."
 zin_sch_marked:0 "Marked"
 zin_sch_marked_desc:0 "A working went wrong and left a mark on the scholar. Until it is lifted, he works slower and sees less."
 zin_sch_old_lore:0 "Keeper of Old Lore"
 zin_sch_old_lore_desc:0 "Holds a few leaves of lore that no one else has seen."
 zin_sch_restless:0 "Restless"
 zin_sch_restless_desc:0 "Cannot leave a working alone. Quick, and quick to err."
 zin_sch_steady_hand:0 "Steady Hand"
 zin_sch_steady_hand_desc:0 "Never hurries a circle, and a working under his hand seldom goes wrong."
 zin_sp_calm_waters:0 "Calm Waters"
 zin_sp_calm_waters_desc:0 "A rite sung over the harbour on the first tide of spring, to ease the storms for a season and the fleets that sail through them."
 zin_sp_dragon_speech:0 "Dragon-Speech"
 zin_sp_dragon_speech_desc:0 "Old words that quiet a great beast's temper. A rider who knows them is less often thrown, and his mount flies a little further."
 zin_sp_grave_binding_rite:0 "The Grave-Binding Rite"
 zin_sp_grave_binding_rite_desc:0 "A rite worked in the deep halls to bind the grave hosts more tightly to their lord's will, so that they hold together under heavier blows."
 zin_sp_hallowed_ground:0 "Hallowed Ground"
 zin_sp_hallowed_ground_desc:0 "A ring of stones set in the field, sung over by the wardens. No foe lingers here, and friends find the supply wagons already there."
 zin_sp_lantern_ward:0 "The Lantern Ward"
 zin_sp_lantern_ward_desc:0 "A chain of wards, lit in a certain order, so that any host sheltering behind it cannot be surprised. The lanterns burn with no flame at all."
 zin_sp_lifting_the_curse:0 "Lifting the Curse"
 zin_sp_lifting_the_curse_desc:0 "A rite of unbinding, sung over a ruined place by the best scholars of the realm. A scar of earlier workings fades, and the marked among the scholars are made whole."
 zin_sp_out_calm_waters:0 "Calm Waters"
