 zin_workshop_armourers_p1:0 "Riveted Mail"
 zin_workshop_armourers_p1_desc:0 "Each ring is riveted shut, and the mail turns a blade."
 zin_workshop_armourers_p2:0 "Padded Under-Coats"
 zin_workshop_armourers_p2_desc:0 "A quilted coat beneath the mail spreads each blow."
