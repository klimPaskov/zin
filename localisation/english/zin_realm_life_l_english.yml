l_english:
 zin_realm_autonomy_tt:0 "A looser bond"
 zin_realm_broke_the_bond:0 "Broke Their Oath to Us"
 zin_realm_cause_tt:0 "We may justify a war against the raiders for a year."
 zin_realm_cb_raiders:0 "The Raids Answered"
 zin_realm_cb_raiders_desc:0 "Raiders out of this realm have burned our villages, and we have every right to ride into their hills and see that they do not come again."
 zin_realm_court:0 "The Court"
 zin_realm_court_desc:0 "The business every crown in Aoaz has to see to sooner or later: heirs, marriages, wars that have gone on too long, exiles at the gate and raiders in the hills."
 zin_realm_court_housed_tt:0 "The fallen court comes to live under our roof."
 zin_realm_courtship:0 "A Royal Courtship"
 zin_realm_crisis:0 "The Crown in Dispute"
 zin_realm_crisis_desc:0 "There is no ruler everyone will bow to, the claimants keep their own courts in their own halls, and every lord has started counting his friends."
 zin_realm_demanded_autonomy:0 "Demanded a Looser Bond"
 zin_realm_disputed_crown:0 "A Disputed Crown"
 zin_realm_disputed_crown_desc:0 "The heir wears the crown, but a rival who says it should be his keeps his own hall and his own friends, and every writ from the throne is read twice before it is obeyed."
 zin_realm_exiled_court:0 "A Court in Exile"
 zin_realm_exiled_court_desc:0 "A fallen court lives under our roof, eats at our table and keeps its own seals, and its lords never stop talking about the day they will go home."
 zin_realm_heir_named_tt:0 "A kinsman of the ruler is named heir before the court."
 zin_realm_kept_faith:0 "Kept Faith in a Hard Season"
 zin_realm_kin_answered:0 "Answered the Call of Kin"
 zin_realm_kin_failed:0 "Failed the Call of Kin"
 zin_realm_match_refused:0 "A Match Refused"
 zin_realm_match_sent_tt:0 "The envoys set out with the gifts and the portrait."
 zin_realm_name_heir:0 "Name an Heir"
 zin_realm_name_heir_desc:0 "The court has no heir it can agree on, and every lord with a royal grandmother has noticed. If one of the ruler's kin is named before the court in good time, the realm may be spared a quarrel at the graveside."
 zin_realm_name_heir_tt:0 "When the ruler dies, the named kinsman takes the crown without a quarrel."
 zin_realm_offer_terms:0 "Offer Terms to [FROM.GetName]"
 zin_realm_offer_terms_desc:0 "Send heralds under a green branch with terms: peace on the old borders, a land given up by treaty, or silver to buy an end to it, as the war allows."
 zin_realm_offer_terms_tt:0 "Heralds carry our terms to [FROM.GetName]: peace on the old borders if the war is even, the land our hosts hold of theirs if we are winning, or silver for peace if we are losing."
 zin_realm_punish_raiders:0 "Punish the Raiders"
 zin_realm_punish_raiders_desc:0 "Raise a host to ride into the raiders' hills, burn their halls and hang their chiefs, so that the next band thinks twice before it crosses our border."
 zin_realm_punish_raiders_tt:0 "We gain a cause of war against the raiders and a host raised to punish them."
 zin_realm_punitive_host:0 "The Raids Answered"
 zin_realm_punitive_host_desc:0 "A host has been raised to ride into the raiders' hills and burn their halls, and the border villages are glad to feed it."
 zin_realm_raid_spoils:0 "Spoils of the Raid"
 zin_realm_raid_spoils_desc:0 "The bands came home with silver, cattle and boasting, and every hall in the hills is feasting on what they brought."
 zin_realm_raided:0 "Raiders in the Hills"
 zin_realm_raided_desc:0 "The border villages sleep with their doors barred and their beasts inside, and the levies spend the nights on watch instead of in bed."
 zin_realm_raided_us:0 "Raided Our Villages"
 zin_realm_regency:0 "A Council of Regency"
 zin_realm_regency_desc:0 "The crown sits on a child, and a council of lords signs every writ in the young ruler's name, each of them sure that the realm would be better governed if the others signed less."
 zin_realm_restored_us:0 "Gave Us Back Our Land"
 zin_realm_royal_match:0 "Kin by Marriage"
 zin_realm_seek_match:0 "Seek a Match with [FROM.GetName]"
 zin_realm_seek_match_desc:0 "Send envoys with gifts and a proposal of marriage between our royal house and theirs. Kin by marriage stand by each other, at least in the songs."
 zin_realm_seek_match_tt:0 "Envoys carry a proposal of marriage to [FROM.GetName], who may accept it or refuse it."
 zin_realm_shelter_exiles:0 "Shelter the Court of [FROM.GetName]"
 zin_realm_shelter_exiles_desc:0 "The court of a fallen realm has nowhere to go. Offer them a hall, a guard of honour and a place at our table until better days, and they will remember who opened the door."
 zin_realm_shelter_exiles_tt:0 "The court of [FROM.GetName] comes to live under our roof. We gain claims on their lands that others hold, and they may one day go home."
 zin_realm_sheltered_us:0 "Sheltered Our Court"
 zin_realm_terms_refused:0 "Refused Our Terms"
 zin_realm_terms_sent_tt:0 "The heralds set out under a green branch."
 zin_realm_turned_us_away:0 "Turned Our Court Away"
 zin_realm_usurper_rule:0 "A Captain's Crown"
 zin_realm_usurper_rule_desc:0 "The crown was taken with a host at the gate, and the lords who swore to the new ruler swore with soldiers standing behind them."
 zin_realm.1.a:0 "The week turns."
 zin_realm.10.a:0 "Let the bells ring and the tables be laid for everyone."
 zin_realm.10.b:0 "Keep the old councillors in their seats and change nothing."
 zin_realm.10.desc:0 "The old ruler of [ROOT.GetName] was laid in the earth this week, and the heir the court had been grooming walked behind the bier and came back from the grave as ruler. The household has changed its colours, the clerks have changed the names on the writs, and the market wants to know only whether [ROOT.GetLeader] will change the tolls as well."
 zin_realm.10.desc1:0 "The ruler of [ROOT.GetName] is dead, and the kinsman named before the court in good time has taken the seals without a quarrel. A few of the old lords grumble that nobody asked them, but none of them has gone home to call out his levies, and [ROOT.GetLeader] has already held a first council."
 zin_realm.10.desc2:0 "The ruler of [ROOT.GetName] is dead, and the court has passed over the heir it had been grooming. His rival had more friends at the graveside, and [ROOT.GetLeader] took the seals while the heir rode home to his own hall. Those who backed him are keeping very quiet."
 zin_realm.10.desc3:0 "The ruler of [ROOT.GetName] is dead, and those who choose by the old custom of the realm have met and chosen [ROOT.GetLeader] to lead in turn. The feasting was short and the oaths were long, as they always are, and riders have gone out to every hall with the news."
 zin_realm.10.desc4:0 "The ruler of [ROOT.GetName] is dead, and the nearest of the blood, [ROOT.GetLeader], took the seals before anyone thought to dispute them. The court mutters, as courts do, and the realm is quiet."
 zin_realm.10.t:0 "The Crown Passes"
 zin_realm.11.a:0 "Let the council of regency govern by the old charters."
 zin_realm.11.b:0 "Give the regency to the captain-general and the hosts."
 zin_realm.11.desc:0 "The ruler of [ROOT.GetName] has died, and the heir who takes the crown is still a child who had to be lifted onto the throne for the oath. Until [ROOT.GetLeader] is grown, a council of regency will sign in the young ruler's name, and every lord who sits on it means to be the one who signs most often."
 zin_realm.11.t:0 "A Child on the Throne"
 zin_realm.12.a:0 "Let the claimants come forward and make their case."
 zin_realm.12.a.tt:0 "The claimants will plead before the court within the month."
 zin_realm.12.b:0 "Proclaim the nearest kinsman before the others can gather."
 zin_realm.12.desc:0 "The ruler of [ROOT.GetName] is dead, and those who choose the next by the old custom of the realm have met three times and parted three times without a choice. Each side has its candidate, each candidate has his friends among the captains, and the longer the choosing goes on, the less it looks like a choosing and the more like a quarrel."
 zin_realm.12.desc1:0 "The ruler of [ROOT.GetName] is dead and left no child and no named heir, and before the mourning bells had stopped, three or four houses had remembered that their grandmothers married into the royal line. Every one of them has a claim written out in a fair hand, and every one of them has friends among the captains."
 zin_realm.12.t:0 "No Heir of the Body"
 zin_realm.13.a:0 "Let the council choose the best of them."
 zin_realm.13.b:0 "Let the captain-general take the crown."
 zin_realm.13.b.tt:0 "The ablest captain of the realm takes the crown."
 zin_realm.13.c:0 "Let the claimants settle it in the field."
 zin_realm.13.c.tt:0 "The realm splits between the claimants, and the crown goes to whoever holds the field."
 zin_realm.13.d:0 "Accept the prince of our kin by marriage."
 zin_realm.13.d.tt:0 "A prince of the house we married into takes the crown, and that house will expect to be remembered for it."
 zin_realm.13.desc:0 "The claimants have come to court with their banners, their lawyers and rather more armed men than a lawsuit needs, and the envoys of the house we married into have let it be known that a prince of their blood would be glad of the crown. The council may choose among them all, a captain with a host behind him may settle it by taking the crown, and the claimants are ready to settle it in the field if nobody else will."
 zin_realm.13.desc1:0 "The claimants have come to court with their banners, their lawyers and rather more armed men than a lawsuit needs. The council of the realm may choose among them, a captain with a host behind him may settle it by taking the crown, and the claimants are ready to settle it in the field if nobody else will."
 zin_realm.13.t:0 "The Claimants"
 zin_realm.14.a:0 "Thank the regents and send them home to their estates."
 zin_realm.14.b:0 "Keep the wisest of them on the council."
 zin_realm.14.desc:0 "[ROOT.GetLeader] is old enough now to rule without a council at the elbow, and the regents have handed back the seals with long speeches about how well they kept them. Some of them kept them very well indeed, and their own estates grew handsomely while they did."
 zin_realm.14.t:0 "The Regency Ends"
 zin_realm.15.a:0 "So the crown is settled."
 zin_realm.15.desc:0 "The claimants could not be reconciled, and the one the council would not have has raised a banner and called the lords who owe him to his side. The crown of [ROOT.GetName] will go to whoever holds the field when the fighting is done."
 zin_realm.15.desc1:0 "A prince of the house we married into has ridden in with a retinue in foreign colours and taken the crown of [ROOT.GetName], and his kin will expect to be remembered for it. The claimants have bowed, some of them more deeply than others."
 zin_realm.15.desc2:0 "The captain-general settled the matter the way captains do, by marching into the council hall with the officers of the host and asking who would object. Nobody did, and [ROOT.GetLeader] now wears the crown the claimants had been arguing over."
 zin_realm.15.desc3:0 "The court proclaimed the nearest kinsman before the other claimants could reach the capital, and [ROOT.GetLeader] was crowned while their riders were still on the road. They will complain about it for a generation, and they will do their complaining from their own halls."
 zin_realm.15.desc4:0 "The council of [ROOT.GetName] sat for nine days and chose [ROOT.GetLeader], and the claimants who lost have gone home with gifts and promises, which is how these things are usually settled. Nobody is entirely happy, and the realm is at peace."
 zin_realm.15.t:0 "The Crisis Settled"
 zin_realm.16.a:0 "Crown the heir and let the rival sulk in his hall."
 zin_realm.16.a.tt:0 "The heir takes the crown, but it sits uneasily for a year."
 zin_realm.16.b:0 "Pass the heir over and let the rival rule."
 zin_realm.16.b.tt:0 "The heir leaves the succession, and the custom of the realm chooses another."
 zin_realm.16.c:0 "Let the sword decide between them."
 zin_realm.16.c.tt:0 "The heir is crowned, and the rival raises his banner against him."
 zin_realm.16.d:0 "Let the captain-general end the quarrel."
 zin_realm.16.d.tt:0 "The ablest captain of the realm takes the crown, and the heir is set aside."
 zin_realm.16.desc:0 "The ruler of [ROOT.GetName] is dead, and the heir everyone expected to step into the ring has found another already standing there. The challenger has as many friends among the warriors as the heir has, and they are both waiting to see which way the court leans before anyone throws the first blow."
 zin_realm.16.desc1:0 "The ruler of [ROOT.GetName] is dead, and those who choose by the realm's custom are split down the middle: half of them are for the heir the old ruler favoured, and half for a rival who has spent the last year buying dinners. Nobody will give way, and the hall is full of armed retainers."
 zin_realm.16.desc2:0 "The ruler of [ROOT.GetName] is dead, and before the heir could take the seals a cousin with a better grandmother and a louder voice rode into the capital with his banners. He says the heir's claim is a clerk's fiction, and some of the lords who listen are nodding."
 zin_realm.16.t:0 "A Disputed Succession"
 zin_realm.17.a:0 "Name another of the blood before the court."
 zin_realm.17.a.tt:0 "A kinsman of the ruler is named heir before the court, and takes the crown without a quarrel when the ruler dies."
 zin_realm.17.b:0 "Mourn him, and leave the next choice to the custom."
 zin_realm.17.b.tt:0 "No heir is named; when the ruler dies, the realm's custom decides, or the claimants do."
 zin_realm.17.desc:0 "The heir of [ROOT.GetName] went to the war with the host and has come home on a bier. The court has put on black, the ruler has not left the chapel, and in the halls of every lord with a drop of royal blood, the clerks have begun to look through the old rolls."
 zin_realm.17.desc1:0 "The heir of [ROOT.GetName] took a fever in the spring and did not get up again. The ruler grieves, the court grieves with him, and behind the grief everyone is asking the same question: who will take the crown now?"
 zin_realm.17.t:0 "The Heir Is Dead"
 zin_realm.20.a:0 "Buy the captain's loyalty with land and titles."
 zin_realm.20.b:0 "Strip the captain of the command before anything moves."
 zin_realm.20.b.tt:0 "The captain may go quietly, or the host may follow its captain to the gates."
 zin_realm.20.c:0 "Let the captain come, for the realm needs a strong hand."
 zin_realm.20.c.tt:0 "The captain takes the crown."
 zin_realm.20.desc:0 "With the realm unsettled and the court divided, one of the captains of [ROOT.GetName] has taken to dining with the other captains rather more often than friendship needs, and the soldiers of that host have started cheering their captain's name before the ruler's. The court is sure what it means, even if nobody will say it aloud."
 zin_realm.20.t:0 "A Captain's Ambition"
 zin_realm.21.a:0 "Swear the oath and keep your heads down."
 zin_realm.21.b:0 "Purge the old ruler's friends from the court."
 zin_realm.21.desc:0 "The captain marched on the capital of [ROOT.GetName] with the host, and the guards at the gate, who had served in that host, opened it and stood aside. The old ruler has been put out of the palace, and [ROOT.GetLeader] now sits in the council chair with a sword across the knees, taking the lords' oaths one by one."
 zin_realm.21.t:0 "The Usurper Crowned"
 zin_realm.22.a:0 "Hang the traitor at the city gate."
 zin_realm.22.b:0 "Send the captain over the border with a whole skin."
 zin_realm.22.desc:0 "The captain was taken in camp before the host could be roused, and the officers who had dined there all winter have suddenly remembered their oaths to the crown of [ROOT.GetName]. The court wants the matter dealt with in a way that the next ambitious captain will remember."
 zin_realm.22.t:0 "The Usurper Fails"
 zin_realm.30.a:0 "Break the bond while they cannot stop us."
 zin_realm.30.a.tt:0 "[ROOT.GetName] no longer answers to [ROOT.Overlord.GetName], which will not forgive it."
 zin_realm.30.b:0 "Demand a looser bond and a smaller tribute."
 zin_realm.30.b.tt:0 "The bond with [ROOT.Overlord.GetName] loosens, and the overlord thinks less of us for asking."
 zin_realm.30.c:0 "Keep faith with the oath we swore."
 zin_realm.30.desc:0 "[ROOT.GetName] has sent its levies and its tribute to [ROOT.Overlord.GetName] for many years, and with the overlord's hosts away at war, the lords of the council have begun to ask aloud what the bond is still worth to them. They want an answer from the throne before the overlord comes home."
 zin_realm.30.t:0 "The Subject Stirs"
 zin_realm.31.a:0 "Hang the ringleaders and burn their villages."
 zin_realm.31.b:0 "Treat with the village elders and lighten the levies."
 zin_realm.31.c:0 "Leave the garrisons to deal with it."
 zin_realm.31.desc:0 "The folk of [zin_realm_rising_place.GetName] have had enough of foreign garrisons, and in the last few weeks the roads there have become places where couriers vanish and granaries burn in the night. The garrison captains write that they can hold the towns, but not the hills around them."
 zin_realm.31.t:0 "A Rising in Occupied Lands"
 zin_realm.32.a:0 "So it ends."
 zin_realm.32.desc:0 "The rising in [zin_realm_rising_place.GetName] has ended the way the rebels hoped, for the land is no longer ours to garrison, and the last of our captains there has come home with whatever the wagons could carry."
 zin_realm.32.desc1:0 "The hills around [zin_realm_rising_place.GetName] are quiet again, and the couriers ride the roads there without an escort for the first time since the rising began. The garrison has sent home its spare levies and kept its gallows."
 zin_realm.32.t:0 "The Rising Ends"
 zin_realm.40.a:0 "Accept the terms."
 zin_realm.40.a.tt:0 "The war with [zin_realm_terms_from.GetName] ends on the terms the heralds brought."
 zin_realm.40.b:0 "Send the heralds back with their branch."
 zin_realm.40.desc:0 "Heralds have come from [zin_realm_terms_from.GetName] with terms: they will make peace if [zin_realm_terms_land.GetName], which their hosts already hold, is given to them by treaty. They point out, politely, that they could try to take a good deal more."
 zin_realm.40.desc1:0 "Heralds have come from [zin_realm_terms_from.GetName] with chests of silver and a request for peace. Their masters will pay for the war to end on the old borders, which tells us a good deal about how it has been going for them."
 zin_realm.40.desc2:0 "Heralds have come from [zin_realm_terms_from.GetName] under a green branch, and they say their masters are tired of a war that has gained nobody anything. They offer peace on the old borders, with no tribute asked and none given."
 zin_realm.40.t:0 "Terms Offered"
 zin_realm.41.a:0 "Bring the hosts home."
 zin_realm.41.b:0 "Then we fight on, and harder."
 zin_realm.41.c:0 "We will ask again when they have lost another battle."
 zin_realm.41.desc:0 "[zin_realm_terms_to.GetName] has accepted our terms, and the heralds have come home with a sealed treaty and the news that the hosts on both sides are already breaking camp."
 zin_realm.41.desc1:0 "[zin_realm_terms_to.GetName] has sent our heralds back with their branch and no answer worth repeating, and the war goes on."
 zin_realm.41.t:0 "The Answer to Our Terms"
 zin_realm.42.a:0 "Send heralds and end it."
 zin_realm.42.a.tt:0 "The war with [zin_realm_pointless_foe.GetName] ends on the old borders."
 zin_realm.42.b:0 "We have not bled this long for nothing."
 zin_realm.42.desc:0 "The war that the King of the East began has outlived him, and the courts that knelt to him have nobody left to kneel to. [zin_realm_pointless_foe.GetName] is still at war with us only because nobody has told the heralds to stop."
 zin_realm.42.desc1:0 "Our hosts have been in the field against [zin_realm_pointless_foe.GetName] for a long time now, and the captains can no longer say what they are fighting for, since neither side can reach the other and the cause that started it is long forgotten. The levies want to go home for the harvest."
 zin_realm.42.t:0 "War Without Purpose"
 zin_realm.50.a:0 "Give them a hall and a guard of honour."
 zin_realm.50.a.tt:0 "The fallen court lives under our roof. We gain claims on their lands that others hold, and one day they may go home."
 zin_realm.50.b:0 "We cannot feed another court, so send them on their way."
 zin_realm.50.desc:0 "The Golden King has come to us with what is left of his court: a train of gilded carriages, a great many servants, rather fewer lords, and the crown of Aenor in an iron-bound chest. He asks for a hall worthy of him, and his steward has already been round to measure ours."
 zin_realm.50.desc1:0 "The court of [zin_realm_fallen.GetName] has fled its own country with its ruler, its seals and as much of the treasury as the wagons could carry, and it asks to be sheltered under our roof until better days. Whoever holds their land now will not thank us for it."
 zin_realm.50.t:0 "A Court in Exile"
 zin_realm.51.a:0 "Raise their banners and give the land back to them."
 zin_realm.51.a.tt:0 "[zin_realm_fallen.GetName] stands again on the lands we hold of theirs, free of any bond to us."
 zin_realm.51.b:0 "Restore them, under our protection."
 zin_realm.51.b.tt:0 "[zin_realm_fallen.GetName] stands again on the lands we hold of theirs, as a realm sworn to us."
 zin_realm.51.c:0 "The land is ours now, and so it stays."
 zin_realm.51.d:0 "Wish them a safe road."
 zin_realm.51.desc:0 "The war that drove the court of [zin_realm_fallen.GetName] from its country is over, and the exiles have taken their leave of us with a great deal of ceremony and a few unpaid debts. They are going home."
 zin_realm.51.desc1:0 "Our hosts hold the old lands of Aenor again, and the Golden Court that has eaten at our table for so long is packing its chests and polishing its crown. The King asks only to be given back what was his, and swears that he will remember who gave it."
 zin_realm.51.desc2:0 "Our hosts hold the old lands of [zin_realm_fallen.GetName] again, and the exiled court that has eaten at our table for so long is packing its chests. Their lords ask only to be given back what was theirs, and swear that they will remember who gave it."
 zin_realm.51.t:0 "The Exiles Return"
 zin_realm.60.a:0 "Accept the match."
 zin_realm.60.a.tt:0 "The two royal houses become kin by marriage."
 zin_realm.60.b:0 "Decline it with every courtesy."
 zin_realm.60.desc:0 "Envoys from [zin_realm_suitor.GetName] have come with gifts, a portrait in a gilt frame and a proposal of marriage between their royal house and ours. The match would bind the two crowns in friendship, and the envoys hint that it might bind them in other ways too, should either ever need help."
 zin_realm.60.t:0 "A Royal Match Proposed"
 zin_realm.61.a:0 "Seal it with a pledge to defend them."
 zin_realm.61.a.tt:0 "We guarantee the independence of [zin_realm_match_answer.GetName]."
 zin_realm.61.b:0 "A wedding is bond enough."
 zin_realm.61.desc:0 "[zin_realm_match_answer.GetName] has accepted our proposal, and the wedding was held with the usual feasting, the usual speeches and rather more wine than usual. The two houses are kin now, and the envoys say that kin is a word their court takes seriously."
 zin_realm.61.t:0 "The Match Accepted"
 zin_realm.62.a:0 "We will remember it."
 zin_realm.62.b:0 "Let it pass, for there are other houses."
 zin_realm.62.desc:0 "[zin_realm_match_answer.GetName] has sent our envoys home with the portrait, the gifts and a letter so full of courtesies that the clerks needed an evening to find the refusal in it. The court is offended, and the ladies of the household more offended still."
 zin_realm.62.t:0 "The Match Refused"
 zin_realm.63.a:0 "Our kin shall not fight alone."
 zin_realm.63.a.tt:0 "We go to war with [zin_realm_kin_foe.GetName] beside [zin_realm_kin.GetName]."
 zin_realm.63.b:0 "Send them silver instead of swords."
 zin_realm.63.b.tt:0 "[zin_realm_kin.GetName] gains the authority we spend."
 zin_realm.63.c:0 "We cannot spare the hosts."
 zin_realm.63.c.tt:0 "The marriage bond with [zin_realm_kin.GetName] is broken."
 zin_realm.63.desc:0 "Riders have come from [zin_realm_kin.GetName], whose house is bound to ours by marriage: they are fighting [zin_realm_kin_foe.GetName] and ask us, as kin, to send our hosts to stand beside theirs. The court knows that a family which does not answer such a call will not be asked to many weddings afterwards."
 zin_realm.63.t:0 "The Kinship Called"
 zin_realm.70.a:0 "Ride out after them and burn their halls."
 zin_realm.70.a.tt:0 "We gain a cause of war against [zin_realm_raider.GetName] for a year, and the raiders learn of our answer."
 zin_realm.70.b:0 "Pay them to stay on their own side of the hills."
 zin_realm.70.b.tt:0 "[zin_realm_raider.GetName] gains the authority we pay."
 zin_realm.70.c:0 "Bar the gates and wait for them to tire of it."
 zin_realm.70.c.tt:0 "The border villages live with the raiders for half a year."
 zin_realm.70.desc:0 "Black-sailed ships out of [zin_realm_raider.GetName] came into the bay before dawn, and by the time the harbour bell rang the warehouses on the quay were burning and the fishing boats were gone, towed out to sea with their catch still in them. The corsairs will come again with the next fair wind unless they are given a reason not to."
 zin_realm.70.desc1:0 "Riders out of [zin_realm_raider.GetName] came over the downs in a cloud of dust, three hundred horses or more, and swept the border farms of their herds and their harvest before the levies could saddle. They rode home faster than anyone could follow, and the steppe will send them back as soon as the grass is green."
 zin_realm.70.desc2:0 "Raiders out of [zin_realm_raider.GetName] came over the border by night, burned two villages and a mill, and drove off every beast they could find before the levies were out of bed. They have gone home with their loot, and they will be back next season unless they are given a reason not to come."
 zin_realm.70.t:0 "Raiders on the March"
 zin_realm.71.a:0 "Pull back into the hills until their tempers cool."
 zin_realm.71.b:0 "Let them come, and we will see whose halls burn."
 zin_realm.71.c:0 "Share the silver among the bands."
 zin_realm.71.d:0 "Keep it in the chief's own chest."
 zin_realm.71.desc:0 "[zin_realm_raid_victim.GetName] did not wait for the next raid: their warships came hunting along our coast, burned two of our ships at anchor and hanged the crews they took from the yardarms. The captains are shouting at each other about whose fault it was."
 zin_realm.71.desc1:0 "[zin_realm_raid_victim.GetName] did not wait for the next raid: their riders crossed into our hills, burned the outlying halls and hanged the first of our people they caught. The war-chiefs are shouting at each other about whose fault it was."
 zin_realm.71.desc2:0 "[zin_realm_raid_victim.GetName] has sent silver to buy peace on its border, and the bands who rode there are boasting about it in every hall. The chiefs want to know how the silver will be shared out."
 zin_realm.71.desc3:0 "[zin_realm_raid_victim.GetName] has barred its gates and left its villages to fend for themselves, and the bands who rode there came home fat and laughing. They are already talking about going back."
 zin_realm.71.e:0 "Ride again next season."
 zin_realm.71.e.tt:0 "The bands feast on what they brought home."
 zin_realm.71.t:0 "The Raid Answered"
