l_english:
 zin_se_afrit_dead:0 "Cantata BWV 147: Jesus bleibet meine Freude (Johann Sebastian Bach)"
 zin_se_afrit_dead_a:0 "Even he could die."
 zin_se_afrit_dead_d:0 "Afrit, son of Ein, whom half of Aoaz worshipped as the Deliverer and the other half learned to fear, is dead, and the heralds who brought the news to the courts have been made to repeat it twice, because nobody quite believed it the first time.\n\nHis temples in the East have shut their doors, his councillors are slipping out of the courts that kept them, and the Houses of the First Light, which fed half the poor of the Middle Lands, no longer know whom they serve.\n\nIn the markets they are already arguing over whether a god can die, and the priests of the twelve, for once, are content to let them argue."
 zin_se_afrit_dead_q:0 "In this year died Afrit, son of Ein, who was called the Deliverer, and the annalist, who served his Council for most of his life without knowing it, has nothing to add except that he is sorry.\n- The Annals of Parim"
 zin_se_afrit_dead_t:0 "Afrit Is Dead"
 zin_se_black_compact:0 "The Descent (Kevin MacLeod)"
 zin_se_black_compact_a:0 "Then the living must stand together."
 zin_se_black_compact_d:0 "The hosts of the Ember Lands and the dead of the black north, who spent the first years of the war fighting each other as readily as anyone else, have stopped, and scouts on both fronts tell the same story of southern grave-hosts and northern dead marching on the same roads and turning together towards the Host of Eindil.\n\nNobody has seen a treaty, and the priests say there could be none, since the dead keep no oaths; the wardens of Mirolon, who know Volgan better than anyone, say only that he has never minded what kind of ally he had, so long as it was pointed the right way.\n\nAcross Aoaz the crowns of the living have begun counting their friends again."
 zin_se_black_compact_q:0 "The south lot and the north lot used to fight each other over the same graveyard while we cheered them on from the hill, and I want you to know that I miss those days very much.\n- A serjeant of the Host of Eindil"
 zin_se_black_compact_t:0 "The Black Compact"
 zin_se_black_north_marches:0 "Oppressive Gloom (Kevin MacLeod)"
 zin_se_black_north_marches_a:0 "Burn the dead and bar the doors."
 zin_se_black_north_marches_d:0 "From the black shore of Zol's Mistake the dead have come out in their thousands, marching in better order than most living hosts have ever managed, along the frozen coasts and over the northern passes towards the lands of men.\n\nThe priests of every faith agree on very little, but they agree that this is the work of the Old God of Death whose name the black north bears, and in the villages nearest the Mistake the people have begun burning their own dead so that nothing they loved can be made to march.\n\nThe courts that once laughed at the fishermen's tales of black ships are sending for their harbour-masters to hear those tales again."
 zin_se_black_north_marches_q:0 "We buried my father in the field behind the house with his boots on, because he always said he would sooner walk to the next life than be carried there, and this morning I am afraid he has taken us at our word.\n- A cottager of the Cold Lands"
 zin_se_black_north_marches_t:0 "The Black North Marches"
 zin_se_deliverer_crowned:0 "Missa Papae Marcelli: IV. Sanctus (Giovanni Pierluigi da Palestrina)"
 zin_se_deliverer_crowned_a:0 "Parim has a king again, of a kind."
 zin_se_deliverer_crowned_d:0 "In the great temple of Parim, before the seat-holders of the Concord and more pilgrims than the squares could hold, the crown of Aenor has been set on the head of [zin_loc_deliverer], and the crowd that came to the city to mourn a king stayed to cheer the god they believe him to be.\n\nThe faithful say that the Deliverer healed the sick on the temple steps that same afternoon, and the Houses of the First Light opened their granaries to every poor family in the city, so that Parim went to bed with full bellies for the first time in a long while.\n\nThe old dominions keep their counsel, and the envoys of foreign crowns have written home that they have never seen Parim so happy, nor so quiet."
 zin_se_deliverer_crowned_q:0 "We have prayed for a deliverer since the Necromancer burned our grandfathers' fields, and if the gods have answered at last, I do not see why we should be ashamed to say thank you.\n- Abbot-Steward Lozan Heron, at the crowning"
 zin_se_deliverer_crowned_t:0 "The Deliverer Takes the Crown"
 zin_se_east_crosses_the_rift:0 "Tabuk (Kevin MacLeod)"
 zin_se_east_crosses_the_rift_a:0 "The forests will not burn quietly."
 zin_se_east_crosses_the_rift_d:0 "A host of the eastern crowns has crossed the great rift into the Magical Lands, the first army of men to march under the elves' trees with fire and axes in living memory, and the border-wardens of the forests have fallen back on the old roosts and the deep groves.\n\nThe courts of the East say they have come for timber, for the roads and for old wrongs, and the elves say nothing at all, which those who know them like least of all; the dragons of the roosts have been seen in the air by day.\n\nIn the West and the Middle Lands, crowns busy with their own wars have begun to ask how the eastern courts, who agree on nothing, came to agree on this."
 zin_se_east_crosses_the_rift_q:0 "The men of the East have brought axes enough to fell a forest, which is generous of them, because it will take them a good many generations to learn which of our trees are only trees.\n- A warden of the Magical Forest"
 zin_se_east_crosses_the_rift_t:0 "The East Crosses the Rift"
 zin_se_ending_ashen_throne:0 "O Lord God (Luther chorale) (Musicatluther)"
 zin_se_ending_ashen_throne_a:0 "The bells ring for him now."
 zin_se_ending_ashen_throne_d:0 "In this telling of the age Afrit, son of Ein, who was worshipped as the Deliverer, rules all Aoaz from the throne of Parim. His temples are full again, his councillors sit in every court that owes the Houses of the First Light a favour, and the few who still say aloud what he is are not often heard saying it twice.\n\nThe crowns that fought him have made their peace or gone into the hills, and the bells of Parim ring for him on every feast day, as they once rang for the king before him."
 zin_se_ending_ashen_throne_q:0 "We still keep the feast of the Deliverer in our village, because the steward counts who comes, and my mother says a candle costs less than a visit from the Houses.\n- A cottager of the Middle Lands"
 zin_se_ending_ashen_throne_t:0 "The Ashen Throne"
 zin_se_ending_children_of_volgan:0 "Missa Papae Marcelli: VI. Agnus Dei II (Giovanni Pierluigi da Palestrina)"
 zin_se_ending_children_of_volgan_a:0 "The wardens warned us."
 zin_se_ending_children_of_volgan_d:0 "In this telling of the age the Great Spirit of the Ember Lands rules a ruined world. His grave-hosts stand on the plains of the Middle Lands, his client crowns kneel in their own halls and rule in his name, and the beasts of the south walk the roads where the caravans used to run.\n\nThe wardens of Mirolon warned every court of Aoaz, and every court thanked them, gave them supper and sent them home, and there are very few of those courts left to be sorry."
 zin_se_ending_children_of_volgan_q:0 "He never hated the kingdoms of men, the last song of the wardens says; he only waited for them to quarrel, and they never once kept him waiting long.\n- The last song of the wardens of Mirolon"
 zin_se_ending_children_of_volgan_t:0 "Children of Volgan"
 zin_se_ending_eastern_king:0 "Oud music, 1V2 long (Andy R. Jordan)"
 zin_se_ending_eastern_king_a:0 "One road, one toll."
 zin_se_ending_eastern_king_d:0 "In this telling of the age the East has one king of its own. The courts that quarrelled over every well and caravan road from the rift to the deep sand now answer to one crown, and the caravan masters pay one treasury instead of seven, which is the first thing about the new order that anyone in the East has been glad of.\n\nThe envoys of the High King are already on the roads west, asking the other crowns of Aoaz what they mean to do about it."
 zin_se_ending_eastern_king_q:0 "In my father's day a caravan from the rift to the deep sand paid seven tolls and three bribes, and now it pays one toll and nobody can tell me where the bribes have gone, which worries me more than the king does.\n- A caravan master of Stabilo"
 zin_se_ending_eastern_king_t:0 "One King in the East"
 zin_se_ending_golden_court:0 "Suite HWV 427 No. 2: Allegro (George Frideric Handel)"
 zin_se_ending_golden_court_a:0 "Pass the gold plate."
 zin_se_ending_golden_court_d:0 "In this telling of the age the Golden Court still rules in Parim. Whatever the long war took from the rest of Aoaz, the Golden Court kept its gold: the feasts go on, the offices are still for sale, and the men who bought them sit at the high table louder than ever.\n\nThe chroniclers, who expected to write the end of a dynasty, have instead been asked to write a very long poem in its praise, and are being paid by the line."
 zin_se_ending_golden_court_q:0 "I have sold the same office in the customs house four times since the war began, and every buyer has thanked me for it, which tells you all you need to know about the state of the realm.\n- Lord Treasurer Halmor Infous"
 zin_se_ending_golden_court_t:0 "The Golden Court Endures"
 zin_se_ending_lost_cause:0 "Noble Race (Kevin MacLeod)"
 zin_se_ending_lost_cause_a:0 "Long live the king of Aen's line."
 zin_se_ending_lost_cause_d:0 "In the great hall of Parim, before the captains of every crown that fought beside him, Eindil, son of Ein, son of Aen, has been crowned King of Aenor, and the Lost Cause that a vain old king founded for his own glory has ended the age as the league of the living.\n\nThe Middle Lands are in ruins, the dead of the war are not yet all buried, and the new king has asked the crowns that stood with him for nothing they did not offer freely.\n\nThe chroniclers have begun the last pages of the Fourth Age, and for once they find they have very little to complain about."
 zin_se_ending_lost_cause_q:0 "And so the heir of Aen came home to Parim at the end of the Fourth Age, and the annalist, who began this book under a king he did not admire, closes it under one he does.\n- The Chronicle of Aoaz, Fourth Age"
 zin_se_ending_lost_cause_t:0 "A King of Aen's Line"
 zin_se_ending_strait_master:0 "Royal Coupling (Kevin MacLeod)"
 zin_se_ending_strait_master_a:0 "Pay the toll at Sonargur."
 zin_se_ending_strait_master_d:0 "In this telling of the age Lerendor is master of the Narrow Strait, and every ship that crosses between the North Lands and the Middle Lands lowers its sail at Sonargur and pays the Sovereign's dues. The great harbour chain is raised for any keel that pays and lowered for any that does not, and the counting-house of Sonargur keeps longer hours than the king.\n\nThe crowns of the south, who grumble at every toll in Aoaz, grumble at this one too, and pay it."
 zin_se_ending_strait_master_q:0 "We have kept the chain at Sonargur for longer than anyone has kept a record of it, and in all that time no captain has ever paid the dues without telling us they were robbery, nor sailed past without paying them.\n- The harbour-master of Sonargur"
 zin_se_ending_strait_master_t:0 "Master of the Strait"
 zin_se_ending_unfinished:0 "Minuet in G major, Anh. 114 (Attributed to Johann Sebastian Bach)"
 zin_se_ending_unfinished_a:0 "Leave the last pages blank."
 zin_se_ending_unfinished_d:0 "No crown has ended the Fourth Age. The wars have dragged on into feuds and truces and the great quarrels of the age into treaties nobody quite keeps, and the chroniclers, who had hoped to close their books, have left the last pages blank for someone else to write.\n\nThe common folk do not seem to mind very much: the harvest is in, most of the roads are open, and an unfinished age is still one in which a person may grow old."
 zin_se_ending_unfinished_q:0 "The annalist had hoped to close this book with a coronation or a ruin, and must close it instead with the price of barley, which has gone up again.\n- The Chronicle of Aoaz, Fourth Age"
 zin_se_ending_unfinished_t:0 "The Age Unfinished"
 zin_se_ending_western_crown:0 "Village Consort (Kevin MacLeod)"
 zin_se_ending_western_crown_a:0 "The debt is paid in full."
 zin_se_ending_western_crown_d:0 "In this telling of the age western banners still fly over Parim, and the old quarrel of the West and Aenor has ended the other way round. The clans that crossed the central sea for an old debt have stayed to collect it for good, and their captains govern the oldest city of men with the help of its own clerks, whose prayers they still cannot follow.\n\nThe Concord meets in exile, in whatever hall it can find, and talks of the day it will take the city back."
 zin_se_ending_western_crown_q:0 "My grandfather wanted the debt back with interest, and I have given him Parim, so I hope he is satisfied wherever he is, because I have run out of things to give him.\n- A western captain-general in Parim"
 zin_se_ending_western_crown_t:0 "A Western Crown in Parim"
 zin_se_golden_king_dead:0 "Komm, süsser Tod, BWV 478 (Johann Sebastian Bach)"
 zin_se_golden_king_dead_a:0 "Ring the bells and count the seals."
 zin_se_golden_king_dead_d:0 "The bells of Parim rang through the night, and by morning the whole city knew that the Golden King was dead, and the cooks who had been making ready for the next feast were sent home with the meat still on the spits.\n\nHe leaves a treasury full of promissory notes, a court full of men who bought their offices from him, and no heir that every camp of the Concord will accept, so the dominions have called their riders home and locked their seals in their strong-rooms.\n\nThe heralds will cry the mourning for thirty days, and the realm will spend every one of them deciding who wears the crown next."
 zin_se_golden_king_dead_q:0 "For as long as he reigned he sold the offices of the realm to any man with the price of them, and now that he is dead every one of those men has come up to the palace to tell us how dearly he loved him.\n- A clerk of the treasury of Parim"
 zin_se_golden_king_dead_t:0 "The Golden King Is Dead"
 zin_se_hall_of_horos:0 "Missa Papae Marcelli: V. Agnus Dei I (Giovanni Pierluigi da Palestrina)"
 zin_se_hall_of_horos_a:0 "Keep the light burning."
 zin_se_hall_of_horos_d:0 "The old lord of the castle above Yeldenne is dead. The townsfolk of that small grey town in Pertolor's land called him Horos, as their grandmothers' grandmothers did, for he was a Great Spirit who had kept the high hall since before the town had a name.\n\nThose who climbed to the hall afterwards found only dust on the high seat, and the heir of Aen coming down the castle road with a blue sword at his side and a crystal of old and holy power in his keeping, which the townsfolk say gives off a light like a clear winter morning.\n\nWhat passed between the old spirit and the heir in that hall, the heir has not said, and the townsfolk, who have lived under the castle all their lives, would rather not guess."
 zin_se_hall_of_horos_q:0 "My father carried peat up to the castle every winter of his life, and the old lord thanked him every time, very gravely, as if a sack of peat were a great gift, and I believe now that to him it was.\n- A peat-cutter of Yeldenne"
 zin_se_hall_of_horos_t:0 "The Hall of Horos"
 zin_se_heir_of_aen:0 "Teller of the Tales (Kevin MacLeod)"
 zin_se_heir_of_aen_a:0 "Then the line of Aen is not ended."
 zin_se_heir_of_aen_d:0 "In the hall of King Lorien, before the oldest lords of the Gala, the stranger who came out of the northern ice has been given back his name: he is Eindil, son of Ein, son of Aen, an heir of the first king of men by his own blood.\n\nLorien, who remembers Dardan, says that he knew the face before he heard the voice, and the Keepers of the Mirror say the water showed them the same thing.\n\nOutside that hall nobody yet knows it, and the Gala, who are very good at keeping things, have not decided whom to tell."
 zin_se_heir_of_aen_q:0 "Men count their kings by the names on the rolls, but we counted the line of Aen by their faces, and I had not seen that face in my halls for a very long time.\n- Words the Gala give to King Lorien"
 zin_se_heir_of_aen_t:0 "The Heir of Aen"
 zin_se_heir_returns:0 "Heroic Age (Kevin MacLeod)"
 zin_se_heir_returns_a:0 "Then the heir has friends after all."
 zin_se_heir_returns_d:0 "Eindil has come back to the war, and he has not come back on foot: the heir of Aen flew south out of the Magical Forest on the back of a dragon of the elven roosts, and the hosts who saw him pass over the lines say that they heard the dragon before they saw it and the cheering before either.\n\nHis friends have raised their banners to him, and crowns that have no love for one another are sending their captains to the Host of Eindil because it is the one army in the Middle Lands that everyone else's enemies fear.\n\nIn Parim, the men who called him an impostor not so long ago have become very careful about what they call him now."
 zin_se_heir_returns_q:0 "I have counted the dragons over the roosts every morning for longer than your kingdoms have kept records, and I have never once seen one carry a man willingly, so you may take it from me that this one chose him.\n- Perlan, Warden of the Dragon Roosts"
 zin_se_heir_returns_t:0 "The Heir Returns"
 zin_se_king_of_the_east:0 "Maqam al-Saba (Faisal al-Otaibi)"
 zin_se_king_of_the_east_a:0 "Let the East keep him, if it can."
 zin_se_king_of_the_east_d:0 "Afrit did not go into the wilderness, as his enemies hoped, but east, where the courts that owed his temples their councillors, their granaries and their debts have knelt to him one after another, and in the halls of the East he has been proclaimed king over them all.\n\nThe envoys of the kneeling courts call his realm the Dominion of the East and speak of him with the old reverence, as though nothing had been said in Parim, while the courts that did not kneel are counting the temples in their own towns and closing the doors of the Houses one by one.\n\nThe caravan roads still run, but the caravan masters have started paying two tolls on every road, one to the old lords and one to the new."
 zin_se_king_of_the_east_q:0 "A caravan master in the East has always paid one king for the road and another for the well, so you will forgive us if a third, who calls himself a god, does not strike us as much of a change.\n- A caravan master of Noris"
 zin_se_king_of_the_east_t:0 "A King in the East"
 zin_se_kusven_forth:0 "Missa Papae Marcelli: I. Kyrie (Giovanni Pierluigi da Palestrina)"
 zin_se_kusven_forth_a:0 "Close up the line."
 zin_se_kusven_forth_d:0 "Out of the host of the black north something has come onto the field that is not one of the walking dead, a Great Spirit so tall that the soldiers who saw it measure it against the banners, and wherever it passes the dead stand straighter and the living cannot get their breath.\n\nThe Leren sailors who watched it from their ships know it from the oldest of their winter tales, and they say its name only in a whisper: Kusven, the grave-wind, the most loyal servant of the Old God of Death.\n\nThe priests say that the Old God himself does not walk the world and never has, and in the camps tonight the soldiers are finding that a very small comfort."
 zin_se_kusven_forth_q:0 "I have stood in the line against orcs, trolls and the walking dead, and I never minded any of them half so much as the moment that thing looked down our line and the dead on either side of it stopped moving, as if they were waiting to see what we would do.\n- A serjeant of the living on the northern field"
 zin_se_kusven_forth_t:0 "The Grave-Wind"
 zin_se_last_crowns:0 "Crusade (Kevin MacLeod)"
 zin_se_last_crowns_a:0 "Call the banners."
 zin_se_last_crowns_d:0 "There has been no single declaration and no single enemy, but the chroniclers have stopped pretending that the wars breaking out across Aoaz are separate quarrels: the dark powers are on the march, the old grudges between the crowns of men have found their excuse, and every road from the Wall to the southern sea is full of levies going one way and townsfolk going the other.\n\nIn the taverns of Parim they have already found a name for it, the War of the Last Crowns, because, as the wine-sellers put it, there will be fewer crowns at the end of it than at the start, and they mean to sell to whoever is left."
 zin_se_last_crowns_q:0 "In this year the wars of the age ran together like rivers in a spring flood, so that a man who marched against one enemy at sowing found himself fighting three by harvest, and the annalist, who has tried to keep them apart, begs the reader's patience.\n- The Chronicle of Aoaz, Fourth Age"
 zin_se_last_crowns_t:0 "The War of the Last Crowns"
 zin_se_lorien_falls:0 "Past the Edge (Kevin MacLeod)"
 zin_se_lorien_falls_a:0 "Let the forests keep silence."
 zin_se_lorien_falls_d:0 "King Lorien of the Gala, who remembered Dardan, rode out with the oldest lords of his people and the ancient spirits who still answered him to stand between the living and Kusven, and none of them came home.\n\nThe soldiers who were there say that the old king's light was the last thing they saw on the field before the grave-wind drew back, wounded but not destroyed, into the black north, and the Gala have not yet told the other elves how they mean to mourn a king who has reigned since the First Age.\n\nIn every forest of the elves the songs have stopped, because nobody alive among them can remember a world without him in it."
 zin_se_lorien_falls_q:0 "We asked him once why he stayed at home when the rest of the world went to war, and he said that he had been to war, and was only keeping the door open for the rest of us when we came back tired.\n- A lord of the Gala, after the king's fall"
 zin_se_lorien_falls_t:0 "King Lorien Falls"
 zin_se_mirolon_falls:0 "Death of Kings (Kevin MacLeod)"
 zin_se_mirolon_falls_a:0 "Give the envoys a seat by the fire."
 zin_se_mirolon_falls_d:0 "The passes of Mirolon have fallen. Out of the storms of the Ember Lands came grave-hosts, ogre clans and worse, and the wardens who had held the mountain roads against the south for longer than any kingdom of men has kept records were driven from their towers one by one.\n\nThe court of Mirolon has gone into exile with the few banners it could save, and its envoys, who spent years warning every crown of Aoaz that this day would come, are knocking at the same doors again to say that it has.\n\nThe envoys say that Volgan himself leads the southern hosts, though there are still courts that would rather not believe it, and the scouts who got out say the hosts are camped in the passes and show no sign of going home."
 zin_se_mirolon_falls_q:0 "We held the high gate for nine days on half rations, and on the tenth the captain told us to go down the back road and tell the world, so here I am telling you, and I would be grateful if you listened faster than the last court did.\n- A warden of Mirolon, in exile"
 zin_se_mirolon_falls_t:0 "The Passes of Mirolon Fall"
 zin_se_music_off:0 "Music: off"
 zin_se_music_off_tip:0 "The great moments of the age play no music for you. Click to hear this one and those still to come."
 zin_se_music_on:0 "Music: on"
 zin_se_music_on_tip:0 "Each great moment of the age plays its own music. Click to silence it for the great moments still to come. The game's music volume also applies."
 zin_se_nafeher_falls:0 "Plaint (Kevin MacLeod)"
 zin_se_nafeher_falls_a:0 "Keep a watch on the passes."
 zin_se_nafeher_falls_d:0 "Nafeher has fallen and the Dominion of the Ember Lands is broken: its grave-hosts are scattered, its sworn realms have torn up their oaths and gone their own way, and the hosts of the living stand in the hall where Volgan held his court.\n\nNobody, though, saw Volgan fall. The last riders out of the south say that he went down into the storms with his crown on his head, and the captains who searched the ruins found his throne cold and empty, with no body before it and no sign of where he went.\n\nThe wardens of Mirolon have gone back to their passes, and they have told every court that will listen that a Great Spirit who came back out of the Void once may well come back out of the storms."
 zin_se_nafeher_falls_q:0 "The old songs said he would come back out of the Void, and he did, so you will forgive us if we keep a fire burning at the passes for as long as there is anyone left in Mirolon to tend it.\n- A warden of Mirolon"
 zin_se_nafeher_falls_t:0 "The Fall of Nafeher"
 zin_se_name_of_the_deliverer:0 "Intrepid (Kevin MacLeod)"
 zin_se_name_of_the_deliverer_a:0 "Write the name down."
 zin_se_name_of_the_deliverer_d:0 "The man the temples worshipped as Aurevan the Deliverer has another name, and it is now being shouted in every market of the Middle Lands: he is Afrit, son of Ein, grandson of Aen, who has lived far longer than any man should, and the Royal Council that governed Aenor in the Golden King's name answered to him all along.\n\nWhat else he is, the priests of the twelve and the confessors of his own temples cannot agree, and both sides have begun to argue the point with stones as well as sermons.\n\nThe Houses of the First Light still keep their granaries open, though fewer of the poor are willing to be seen at their doors."
 zin_se_name_of_the_deliverer_q:0 "I kept his birth rolls for twenty years and never once asked who was keeping mine, which I suppose is exactly what the rolls were for.\n- Sefan Daldar, Warden of the Rolls"
 zin_se_name_of_the_deliverer_t:0 "The Name of the Deliverer"
 zin_se_parim_taken:0 "Lament for Owen Roe O'Neill (bagpipe arrangement) (Turlough O'Carolan)"
 zin_se_parim_taken_a:0 "A debt collected, and a city to keep."
 zin_se_parim_taken_d:0 "Parim has fallen to the hosts of the Western Crossing, which fought their way up the vale from the shores of the Concord to the oldest city of men and now hang their clan banners from the walls where the gold of Aenor flew for an age.\n\nThe court of Aenor has gone to another seat with what it could carry, the temples are shut, and the western captains, who do not understand the language of the city's prayers, are learning to govern it from its own clerks.\n\nEvery court of Aoaz is now waiting to see whether the West came to rule Parim or only to punish it."
 zin_se_parim_taken_q:0 "We took the gate at dawn and the market by noon, and by evening my lads had learned that a man who conquers Parim must also feed it, which nobody mentioned at the Ford Council.\n- A western captain in Parim"
 zin_se_parim_taken_t:0 "Western Banners over Parim"
 zin_se_the_cliff:0 "Nänie, Op. 113 (Robert Schumann)"
 zin_se_the_cliff_a:0 "Show us the body."
 zin_se_the_cliff_d:0 "Afrit has come back out of the East with an army, and the heir of Aen, who went out to meet him, has not come back. The few who were near say that the two of them met on the heights, that the heir was struck down and thrown from the cliff, and that nobody has found him since.\n\nAfrit's heralds are already riding to every court to say that the heir is dead and that the war of the living is over.\n\nThe Host of Eindil has not broken up, though it does not know what it is waiting for, and in the camps the old soldiers say they will believe the heir is dead when they have seen the body."
 zin_se_the_cliff_q:0 "I have heard the heir declared dead twice in this war already, and both times he turned up for supper, so you will excuse me if I keep his place at the fire a while longer.\n- A cook of the Host of Eindil"
 zin_se_the_cliff_t:0 "The Cliff"
 zin_se_varner_falls:0 "Mass for Four Voices: Agnus Dei (William Byrd)"
 zin_se_varner_falls_a:0 "Put out the lamps for him."
 zin_se_varner_falls_d:0 "Varner the wizard is dead. When the dead of the black north broke the southern front and the hosts of the living began to give way, the old wizard of the Magical Lands raised wards over them such as nobody living had ever seen, and held them up until there was nothing left of him to hold them with, and the living came off the field only because he stayed on it.\n\nThe elves of the Magical Forest have put out their lamps for him, and the wizards of men, Bastian among them, have said in public what they used to say only among themselves, that nobody else alive knew half of what he knew."
 zin_se_varner_falls_q:0 "He told us once that a ward is only a promise made with your whole strength, and that the trick of it is to choose carefully what you promise, because you will be held to it.\n- As the elves of the Magical Forest remember Varner"
 zin_se_varner_falls_t:0 "Varner Falls"
 zin_se_volgan_broken:0 "Mass for Four Voices: Kyrie (William Byrd)"
 zin_se_volgan_broken_a:0 "Sing, but not too loudly."
 zin_se_volgan_broken_d:0 "On the field where the hosts of the living at last stood against the Ember Lands, the body that Volgan wore when he came back out of the Void has been broken apart like a burnt log in the hand, and the Great Spirit has gone from the field.\n\nHis grave-hosts fell where they stood or fled south without orders, the great ones of his court are quarrelling over what is left of his dominion, and the wardens of Mirolon have gone back to their passes to see what remains of their homes.\n\nWhat remains of Volgan himself, no priest or wizard will say for certain, and the old wardens, who have been right about him before, are not yet singing the songs of victory."
 zin_se_volgan_broken_q:0 "When the spirits threw him out of the world the first time, the wardens' song says, the wardens of that age danced in the passes for a week, and it is because we remember the dancing that we will not dance this time.\n- Song of the wardens of Mirolon"
 zin_se_volgan_broken_t:0 "The Body of Volgan Is Broken"
 zin_se_volgan_marches:0 "Wretched Destroyer (Kevin MacLeod)"
 zin_se_volgan_marches_a:0 "Mirolon was right."
 zin_se_volgan_marches_d:0 "Mirolon has fallen, and the hosts of the Ember Lands have come up out of the storms behind it: grave-hosts and ogre clans, the beasts of the southern deeps, and at their head Volgan himself, the Great Spirit whom the spirits of an older age stripped of his strength and threw into the Void, crowned and marching north.\n\nThe wardens of Mirolon warned every court of Aoaz for years that he was arming, and every court thanked them, gave them supper and sent them home.\n\nThe few envoys of Mirolon who still live have stopped asking for help and ask only for fresh horses, so that they can carry the warning further north."
 zin_se_volgan_marches_q:0 "He waited a whole age in the dark beyond the world, the old song of the wardens says, and he will not mind waiting a little longer at your gate while you finish arguing about who should hold it.\n- Song of the wardens of Mirolon"
 zin_se_volgan_marches_t:0 "Volgan Marches North"
 zin_se_western_crossing:0 "Crossing the Chasm (Kevin MacLeod)"
 zin_se_western_crossing_a:0 "So the West remembers."
 zin_se_western_crossing_d:0 "The war-fleets of the West have put out across the central sea, every keel the Ford Council could buy, borrow or build, and the first of them have already run up on the beaches of the Middle Lands with their hosts behind them.\n\nThe western clans have come for an old debt, the one they say the kings in Parim have owed them since the truce of the Grey Ford, and their captains say openly that they mean to collect it in the capital itself.\n\nOn the shores of the Concord the beacons are burning, and the fishermen who saw the sails at dawn say there were too many of them to count before the light failed."
 zin_se_western_crossing_q:0 "My grandfather swore at the Grey Ford that we would have the debt back with interest, and he made us all swear it again over his grave, so you will understand that I have no choice in the matter but to get into this boat.\n- A clansman of Gunwyn, at the embarkation"
 zin_se_western_crossing_t:0 "The Western Crossing"
 zin_se_window_button:0 "[zin_loc_super_event_button]"
 zin_se_window_button_tip:0 "Close this page of the chronicle and return to the realm."
 zin_se_window_date:0 "[GetDateText]"
 zin_se_window_desc:0 "[zin_loc_super_event_desc]"
 zin_se_window_queue:0 "More news of the age waits to be told: [?zin_se_queue^num|0]"
 zin_se_window_quote:0 "[zin_loc_super_event_quote]"
 zin_se_window_title:0 "[zin_loc_super_event_title]"
 zin_se_without_the_heir:0 "Symphony No. 3 \"Eroica\", II. Marcia funebre (Ludwig van Beethoven)"
 zin_se_without_the_heir_a:0 "Fight on without him."
 zin_se_without_the_heir_d:0 "In this telling of the age the heir of Aen does not come back. Whatever happened to him, and the soldiers of his Host tell it a dozen different ways, he is gone out of the war, and the league that gathered round him must decide whether it can stand without him.\n\nHis captains still hold the field and the dark has not gone home, so the crowns of the living have done what crowns do: they have sent their envoys to argue about who should lead, and their armies to keep fighting while the envoys argue."
 zin_se_without_the_heir_q:0 "We followed him because he was the heir, and we kept following him because he was the kind of man you follow, and now I suppose we shall find out which of those two reasons was the real one.\n- A captain of the league of the living"
 zin_se_without_the_heir_t:0 "Without the Heir"
 zin_super_event.104.a:0 "Elves will be elves."
 zin_super_event.104.d:0 "Merchants back from the Gala say the elves have taken a great interest in a stranger from the north who is lodged in their king's own hall with more honour than any guest of men in living memory, and that nobody outside the hall will say why."
 zin_super_event.104.t:0 "Talk from the Gala Court"
 zin_super_event.127.a:0 "The north keeps its secrets."
 zin_super_event.127.d:0 "Carters coming down from the far north say that something has happened at the old castle above Yeldenne: the lights in its high windows went out one night, and the townsfolk have gone about with long faces ever since and will not say why."
 zin_super_event.127.t:0 "Lights at Yeldenne"
 zin_super_event.128.a:0 "Send someone to find out."
 zin_super_event.128.d:0 "Herders coming up from the south say that the watch-fires on the passes of Mirolon have gone out, and that the road down from the high gate is full of people carrying everything they own on their backs."
 zin_super_event.128.t:0 "Smoke over the Passes"
 zin_super_event.129.a:0 "Keep the caravans at the wells."
 zin_super_event.129.d:0 "Traders back from the East say that the eastern crowns have taken an army over the great rift into the elves' forests, and that the caravans are waiting at the wells until they know who holds the roads."
 zin_super_event.129.t:0 "Trouble across the Rift"
