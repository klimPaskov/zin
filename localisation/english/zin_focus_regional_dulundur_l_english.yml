l_english:
 zin_regional_dulundur_chiefs_of_four_valleys:0 "Chiefs of the Four Valleys"
 zin_regional_dulundur_chiefs_of_four_valleys_desc:0 "The chiefs of the four valleys sit at Dulgash's table in order of age, and each swears the hall's oath in his own words. They leave with a charge, a gift and an extra spear or two."
 zin_regional_dulundur_defiance:0 "Defiance"
 zin_regional_dulundur_defiance_desc:0 "Dulundur has refused the Iron Yoke and the black banner, and the whole hold knows what the refusal will cost. They fight the way a cornered thing fights."
 zin_regional_dulundur_defy_cocanoor:0 "Defy Cocanoor"
 zin_regional_dulundur_defy_cocanoor_desc:0 "The Warking's host has crossed the border, and Dulundur's answer is the Four Fires lit on every ridge. Whatever Cocanoor wanted, it will have to take with iron."
 zin_regional_dulundur_dulgashs_law:0 "Dulgash's Law"
 zin_regional_dulundur_dulgashs_law_desc:0 "Dulgash sets down a few plain laws in the hall: no blood-feud within the four valleys, no hearth turned away, no debt left unpaid. They are cut into the doorposts so that no one can claim not to have seen them."
 zin_regional_dulundur_dulgashs_law_spirit:0 "Dulgash's Law"
 zin_regional_dulundur_dulgashs_law_spirit_desc:0 "Chief Dulgash's word is law in the four valleys, and the hearth-keepers make sure that his word is heard. It is rough justice, and it is quick."
 zin_regional_dulundur_envoys_at_the_fires:0 "Envoys at the Fires"
 zin_regional_dulundur_envoys_at_the_fires_desc:0 "Strangers from Nafeher arrive at the hall with gifts of silver and sweet words. The chiefs listen and say little, and the hearth-keepers watch the strangers' hands."
 zin_regional_dulundur_every_hall_a_fortress:0 "Every Hall a Fortress"
 zin_regional_dulundur_every_hall_a_fortress_desc:0 "Every hall in the four valleys is made ready for siege: gates barred, wells covered, a store of arrows in each loft. The chiefs sleep in their armour."
 zin_regional_dulundur_first_among_holds:0 "First Among the Holds"
 zin_regional_dulundur_first_among_holds_desc:0 "Dulundur's voice carries at the Moot, and the small halls look to it for a lead. A leader of equals is trusted for as long as he does not forget it."
 zin_regional_dulundur_first_among_the_holds:0 "First Among the Holds"
 zin_regional_dulundur_first_among_the_holds_desc:0 "At the Moot, Dulundur's voice is heard first, and the others look to it for the sign. Dulgash holds up a hand, and the room falls quiet."
 zin_regional_dulundur_gifts_returned:0 "Gifts Returned"
 zin_regional_dulundur_gifts_to_the_small_halls:0 "Gifts to the Small Halls"
 zin_regional_dulundur_gifts_to_the_small_halls_desc:0 "The small halls are the first that Cocanoor will swallow, so Dulundur sends them barley, iron and a quiet promise. The gifts are small and well-timed, and they matter."
 zin_regional_dulundur_hall_answers_no_one:0 "The Hall Answers No One"
 zin_regional_dulundur_hall_answers_no_one_desc:0 "The Four Fires are lit and Dulgash stands before them. The hall answers no master, he says, and the war-drums begin to beat."
 zin_regional_dulundur_hall_forges:0 "Hall Forges"
 zin_regional_dulundur_hall_forges_desc:0 "Forges are raised inside the hall's own walls, and their smoke blackens the roof-beams. A blade made there carries the hall's mark, and the mark is worth money."
 zin_regional_dulundur_hill_forts:0 "Hill Forts"
 zin_regional_dulundur_hill_forts_desc:0 "Stone forts rise on the heads of the valleys, built by the clans and manned by their sons. Whatever comes through the passes will meet iron first."
 zin_regional_dulundur_hill_runners:0 "Hill Runners"
 zin_regional_dulundur_hill_runners_desc:0 "Light bowmen run the high ridges with short horn bows, loosing three arrows to every breath. They are hard to catch and harder to ignore."
 zin_regional_dulundur_hill_watch:0 "Whispers in the Hills"
 zin_regional_dulundur_hill_watch_desc:0 "Spies and listeners are placed in every valley and on every pass. A word spoken against the hall is known before supper."
 zin_regional_dulundur_hills_provide:0 "The Hills Provide"
 zin_regional_dulundur_hills_provide_desc:0 "Iron, charcoal and hands to work them: the hills have never been short of any of them. A well-supplied hold builds fast and does not complain."
 zin_regional_dulundur_holds_kin:0 "Kin of the Free Holds"
 zin_regional_dulundur_iron_for_blackton:0 "Iron for Blackton"
 zin_regional_dulundur_iron_for_blackton_desc:0 "A long road of iron wagons leaves the hills for the harbour towns, guarded and counted at each stage. Blackton pays in silver and in friendship."
 zin_regional_dulundur_iron_friends:0 "Iron Friends"
 zin_regional_dulundur_iron_of_the_hills:0 "Iron of the Hills"
 zin_regional_dulundur_iron_of_the_hills_desc:0 "Dulundur sits on seams of dark iron, which the clans have dug for more winters than anyone has counted. The hall decides to dig deeper and to sell what it digs to those who pay fairly."
 zin_regional_dulundur_iron_trade:0 "Iron for Blackton"
 zin_regional_dulundur_iron_trade_desc:0 "Dulundur iron goes to the five towns by the cartload, and the harbour silver comes back the same way. Both sides are the richer for it."
 zin_regional_dulundur_no_yoke:0 "No Yoke for Dulundur"
 zin_regional_dulundur_no_yoke_desc:0 "Cocanoor's envoys speak of a light yoke, a fair tithe and a seat at the Warking's table. Dulgash listens, thanks them for the wine and has the chains they brought as gifts hung up as a curiosity."
 zin_regional_dulundur_one_chief_one_hall:0 "One Chief, One Hall"
 zin_regional_dulundur_one_chief_one_hall_desc:0 "The valleys agree to let one chief speak for all of them, and that chief is Dulgash. The hearth-keepers give up their old right to veto, and the hall grows quicker and harder."
 zin_regional_dulundur_one_hall:0 "One Chief, One Hall"
 zin_regional_dulundur_one_hall_desc:0 "The four hearths have agreed to speak through one mouth, and the mouth is Dulgash's. A hold with a single voice is harder to split than one that must be asked."
 zin_regional_dulundur_ore_roads:0 "Ore Roads"
 zin_regional_dulundur_ore_roads_desc:0 "Rough tracks are widened into ore roads, with stone beds and timber culverts. A wagon of iron can reach the harbour in half the time it once took."
 zin_regional_dulundur_peace_of_the_hills:0 "Peace of the Hills"
 zin_regional_dulundur_peace_of_the_hills_desc:0 "With the cores held and the passes closed, Dulgash sends a messenger to Cocanoor under a white pennant. The hills are not worth another winter of fighting, he says, and the Warking is welcome to agree."
 zin_regional_dulundur_pride_of_dulundur:0 "The Pride of Dulundur"
 zin_regional_dulundur_pride_of_dulundur_desc:0 "Dulundur's chiefs have a name for the feeling that rises in them when Cocanoor sends its gifts. It is pride, and it is also the thing that has kept the four valleys free."
 zin_regional_dulundur_proud_hold:0 "The Proud Hold"
 zin_regional_dulundur_proud_hold_desc:0 "Dulundur remembers who built Goldoroth and how, and has resolved to be neither its tool nor its supper. The pride is old, and it holds."
 zin_regional_dulundur_send_back_the_gifts:0 "Send Back the Gifts"
 zin_regional_dulundur_send_back_the_gifts_desc:0 "The gifts of black iron are loaded onto the same carts that brought them and sent north, with a courteous note. Cocanoor receives them in silence."
 zin_regional_dulundur_send_them_south:0 "Send Them South"
 zin_regional_dulundur_send_them_south_desc:0 "Dulgash has the envoys escorted to the southern pass, and the gifts, unopened, escorted after them. The chiefs laugh, or they do not."
 zin_regional_dulundur_sent_south:0 "Sent Back South"
 zin_regional_dulundur_shields_of_the_valleys:0 "Shields of the Four Valleys"
 zin_regional_dulundur_shields_of_the_valleys_desc:0 "Each valley paints its shields with its own sign, and the signs are known on every field of the Dark Lands. A man will not run from his own valley's shield."
 zin_regional_dulundur_speak_to_the_holds:0 "Speak to the Holds"
 zin_regional_dulundur_speak_to_the_holds_desc:0 "Dulundur sends envoys with gifts of iron to every free hold in the Dark Lands. They carry a simple message: we are not alone in our refusal, and need not stand alone."
 zin_regional_dulundur_strike_the_tributaries:0 "Strike the Tributaries"
 zin_regional_dulundur_strike_the_tributaries_desc:0 "The tributaries of Cocanoor lie open along Dulundur's border, held by garrisons that did not choose their master. Some of the chiefs say that a blow struck there would be a blow struck for freedom."
 zin_regional_dulundur_the_deep_pits:0 "The Deep Pits"
 zin_regional_dulundur_the_deep_pits_desc:0 "The old pits are cleared of rubble and sunk another fifty paces. Ozgar Ironhand, the Pit-Master, drives the diggers hard and feeds them well."
 zin_regional_dulundur_the_four_fires:0 "The Four Fires"
 zin_regional_dulundur_the_four_fires_desc:0 "Four valleys, four hearths, one hall: when Chief Dulgash speaks, each fire sends an ember to the hall's great hearth. The Four Fires burn together only a few times a year, and the clans remember each of them."
 zin_regional_dulundur_the_hills_provide:0 "The Hills Provide"
 zin_regional_dulundur_the_hills_provide_desc:0 "Mines, roads and forges are drawn into a single plan. What the hills provide, the hall uses, and nothing is wasted."
 zin_regional_dulundur_the_hold_endures:0 "The Hold Endures"
 zin_regional_dulundur_the_hold_endures_desc:0 "The war is over, and the four valleys are still four valleys. The Fires are lit one by one, and the clans eat together for the first time in a year."
 zin_regional_dulundur_the_moot_answers:0 "The Moot Answers"
 zin_regional_dulundur_the_moot_answers_desc:0 "Dulundur sends riders to every hold of the Moot with a single message: the Warking has struck, and the Moot is called. Drums begin to answer from the farthest hills."
 zin_regional_dulundur_the_moot_rides:0 "The Moot Rides"
 zin_regional_dulundur_the_moot_rides_desc:0 "When Cocanoor moves against any of the Moot's holds, every drum in the free Dark Lands begins to beat. Dulundur's sons ride out to meet the threat, and the Moot rides with them."
 zin_regional_dulundur_the_moot_stone:0 "The Moot Stone"
 zin_regional_dulundur_the_moot_stone_desc:0 "A stone is raised on the high moor between the valleys, and the free holds are called to gather at it. Dulundur is the first to speak, and the first to listen."
 zin_regional_dulundur_the_price_of_spoils:0 "The Price of Spoils"
 zin_regional_dulundur_the_price_of_spoils_desc:0 "Some chiefs say that the strangers offer what Dulundur lacks: arms, silver and a promise of spoils from the northern wars. The price is not discussed in the hall, and that is the worry."
 zin_regional_dulundur_the_proud_hold:0 "The Proud Hold"
 zin_regional_dulundur_the_proud_hold_desc:0 "Dulundur declares itself a proud hold, beholden to none and frightened of none. The declaration is read in every valley and shouted at the passes."
 zin_regional_dulundur_the_valleys_speak:0 "The Valleys Speak"
 zin_regional_dulundur_the_valleys_speak_desc:0 "The valleys decide instead that no one chief shall decide. Each hearth sends a voice to the hall, and Dulgash must win them over one at a time."
 zin_regional_dulundur_valleys_speak:0 "The Valleys Speak"
 zin_regional_dulundur_valleys_speak_desc:0 "Each valley keeps its own hearth and sends its own voice to the hall. Decisions take longer, and once taken are not broken."
 zin_regional_dulundur_war_drums:0 "War-Drums of Dulundur"
 zin_regional_dulundur_war_drums_desc:0 "The drums of the four valleys beat a single rhythm that carries across a battlefield. A host that fights to a common beat does not lose heart."
 zin_regional_dulundur_war_drums_of_dulundur:0 "War-Drums of Dulundur"
 zin_regional_dulundur_war_drums_of_dulundur_desc:0 "The drums of the four valleys are tuned to a common beat, and drummers are trained to hold it against any din. A host that marches to a steady drum does not stray."
 zin_regional_dulundur_warbands_of_dulundur:0 "Warbands of Dulundur"
 zin_regional_dulundur_warbands_of_dulundur_desc:0 "The clans raise warbands under their own chiefs, and each warband carries its own banner and its own boast. In the field they are loud and in the line they are steady."
 zin_regional_dulundur_whispers_in_the_hills:0 "Whispers in the Hills"
 zin_regional_dulundur_whispers_in_the_hills_desc:0 "Whatever the hall decided about the envoys, it now keeps listeners on every pass. Nothing is said in the Dark Lands that Dulundur does not hear within a week."
 zin_regional_dulundur.1.a:0 "Let every valley speak."
 zin_regional_dulundur.1.b:0 "Let the Chief speak for all."
 zin_regional_dulundur.1.d:0 "From the four valleys the clan fires climb into the dusk, and the chiefs gather in the great hall to hear Dulgash. He has asked each of them to say what the hold needs most, and he has promised to listen."
 zin_regional_dulundur.1.t:0 "The Four Fires Are Lit"
 zin_regional_dulundur.2.a:0 "Hear them out."
 zin_regional_dulundur.2.d:0 "Strangers from Nafeher sit at the hall's fire and speak of spoils in the north and old friendships. The chiefs laugh, or do not, and Grushka of the Four Fires watches the faces of those who do not."
 zin_regional_dulundur.2.t:0 "Envoys at the Fires"
 zin_regional_dulundur.3.a:0 "Dulundur will kneel."
 zin_regional_dulundur.3.b:0 "The hills are not worth it."
 zin_regional_dulundur.3.d:0 "A messenger in Dulundur colours has come to Cocanoor under a white pennant. He says that the hills are not worth another winter's fighting, and that Dulundur will gladly take back its dead."
 zin_regional_dulundur.3.t:0 "Peace of the Hills"
 zin_regional_dulundur.4.a:0 "The hills are ours."
 zin_regional_dulundur.4.d:0 "The Warking's banners are seen going north, and the passes are quiet. Cocanoor has gone home, and Dulundur is still Dulundur."
 zin_regional_dulundur.4.t:0 "The Hills Answer"
