l_english:
 zin_elves_bar_wall_gates:0 "Bar the Wall Gates"
 zin_elves_bar_wall_gates_desc:0 "End the right of passage given at the Wall gates. The woods settle behind their own bars."
 zin_elves_call_elder_moot:0 "Call the Elder Moot"
 zin_elves_call_elder_moot_desc:0 "Summon the speakers of the houses to the council ring and ask what the moot should speak of first."
 zin_elves_call_wall_moot:0 "Call a Wall Moot at the Gate"
 zin_elves_call_wall_moot_desc:0 "Ask the crown's customs men to hear the elves in open moot at the Wall gate, on the tolls and the cold roads."
 zin_elves_close_the_wall_roads:0 "Close the Wall Roads"
 zin_elves_close_the_wall_roads_desc:0 "Shut the elven gates along the Great Wall. The Accord is not broken, but no caravan will pass either way."
 zin_elves_gates_barred:0 "The Gates Are Barred"
 zin_elves_gates_barred_desc:0 "The Wall gates are closed again, and the woods feel safer behind their own bars."
 zin_elves_high_passes:0 "The High Passes"
 zin_elves_high_passes_2:0 "The High Passes, Held"
 zin_elves_kin:0 "The Kin and the Wall"
 zin_elves_kin_desc:0 "The business of the elven houses: the moot, the Kindred, the Wall, the passes and the pilgrim roads."
 zin_elves_mediate_rivals:0 "Mediate Between Herrodon and Andos Enda"
 zin_elves_mediate_rivals_desc:0 "Send speakers with open hands between the two old rivals, so that the quarrel of the groves cools before it burns."
 zin_elves_open_wall_gates:0 "Open the Wall Gates to Aenoran Companies"
 zin_elves_open_wall_gates_desc:0 "Give Aenor, its vassals and Kingson right of passage through the Wall gates. Men may come to stand beside the woods; this does not set the Refusal aside."
 zin_elves_pilgrim_roads_close_decision:0 "Close the Pilgrim Roads"
 zin_elves_pilgrim_roads_close_decision_desc:0 "Turn every pilgrim back at the edge of the woods. The roads stay empty and the hermitage takes it ill."
 zin_elves_pilgrim_roads_open:0 "Pilgrims on Our Roads"
 zin_elves_pilgrim_roads_open_decision:0 "Open the Roads to Pilgrims"
 zin_elves_pilgrim_roads_open_decision_desc:0 "Let pilgrims cross the woods freely, with hostels and fire along the way. Their gifts fill the roadside towns."
 zin_elves_pilgrim_roads_open_desc:0 "Pilgrims cross our woods in their hundreds, and the hostels along the road have never been busier."
 zin_elves_pilgrim_roads_toll_decision:0 "Toll the Pilgrims"
 zin_elves_pilgrim_roads_toll_decision_desc:0 "Take a toll at the pilgrim gates. The treasury is fuller, and the hermitage in the hills remembers it."
 zin_elves_pilgrim_tolls:0 "Tolls on the Pilgrim Roads"
 zin_elves_pilgrim_tolls_desc:0 "Every pilgrim pays at the gate. The coffers are heavier, and the pilgrims grumble."
 zin_elves_raise_the_kindred:0 "Raise the Kindred of the Woods"
 zin_elves_raise_the_kindred_desc:0 "Bind the elven houses into a league for the defence of the woods. It takes in only elves and never marches for men."
 zin_elves_refusal_set_aside:0 "The Refusal Set Aside"
 zin_elves_refusal_set_aside_desc:0 "The woods have set the Refusal aside for this war. They will take it up again when the war is over."
 zin_elves_reopen_the_wall_roads:0 "Reopen the Wall Roads"
 zin_elves_reopen_the_wall_roads_desc:0 "Unbar the elven gates and let the caravans walk the Wall road again."
 zin_elves_roosts:0 "The Roosts of the Mountain"
 zin_elves_roosts_desc:0 "The Keeper's care of the dragon roosts on the mountain."
 zin_elves_seek_the_wizard:0 "Seek the Wizard"
 zin_elves_seek_the_wizard_desc:0 "Send quiet word through the old ways to the wizard of the Unbinding. Nobody can say who will answer, or how."
 zin_elves_send_healers:0 "Send Healers and Loremasters"
 zin_elves_send_healers_desc:0 "Send healers and loremasters to sit in another realm's halls for a year. They bring no banner and take no side."
 zin_elves_send_wardens:0 "Send Wardens to a Friend in Need"
 zin_elves_send_wardens_desc:0 "Let wardens of the woods walk to a realm at war with the dark. They go as individuals, not as a host, and return when the season turns."
 zin_elves_settle_the_feud:0 "Settle the Feud of the Groves"
 zin_elves_settle_the_feud_desc:0 "The old quarrel has run past mediation. Claim the boundary groves and take up the cause of war against the rival house."
 zin_elves_tend_the_roosts:0 "Tend the Roosts"
 zin_elves_tend_the_roosts_desc:0 "Send the roost-singers to the mountain with salt, song and green boughs, so that the dragons keep their trust in the Keeper."
 zin_elves_varners_counsel:0 "Varner's Counsel"
 zin_elves_varners_counsel_desc:0 "An unsigned letter in an old hand answered what we asked. Scholars and wardens work to its plain advice."
 zin_elves_wall_roads_shut:0 "Roads Shut at the Wall"
 zin_elves_wall_roads_shut_desc:0 "The elven gates along the Wall stand barred. Goods pile at the barriers, and the woods keep close to their own."
 zin_elves_wanderers:0 "The Wanderers"
 zin_elves_wanderers_desc:0 "Healers, loremasters and wardens who walk among other peoples as individuals. They are no host and no league."
 zin_elves_wanderers_lore:0 "Elven Wanderers"
 zin_elves_wanderers_lore_desc:0 "Healers and loremasters of the woods sit in our halls, mending the sick and copying old books."
 zin_elves_wanderers_lore_gala:0 "Healers of Gala"
 zin_elves_wanderers_lore_gala_desc:0 "Healers of the Gala elves walk our towns, and the lore they bring has been kept by the water for ages."
 zin_elves_wanderers_wardens:0 "Elven Wardens Among Us"
 zin_elves_wanderers_wardens_desc:0 "Grey-cloaked wardens of the woods hold our border villages. They answer to no one in our court."
 zin_elves_wandering_paths:0 "Paths That Wander"
 zin_elves_wardens_for_the_passes:0 "Wardens for the Passes"
 zin_elves_wardens_for_the_passes_desc:0 "Send wardens up to Nolorim's high passes to raise stone and watch fires against whatever comes over the snow."
 zin_elves_wizard_gone:0 "The Wizard Is Gone"
 zin_elves_wizard_gone_desc:0 "Word has come that the wizard of the Unbinding is no more. The woods are uneasy, and their resolve is hard."
 zin_elves_woods_defended:0 "Every Tree a Wall"
 zin_elves_woods_defended_desc:0 "Every grove is a rampart and every elder a sentry. The woods fight on ground they have loved for ages."
 zin_elves.10.a:0 "The Wall is cold"
 zin_elves.10.d:0 "The elven gates along the Great Wall are shut. No caravan from the Magical Lands will cross to Aenor, and none from Aenor will pass in. The elves say the Accord is unbroken; they have only stopped walking on it."
 zin_elves.10.t:0 "The Wall Roads Are Closed"
 zin_elves.20.a:0 "Set our markers"
 zin_elves.20.b:0 "Leave the groves to the trees"
 zin_elves.20.d:0 "The old marker-trees between Herrodon and Andos Enda have been blazed afresh, and nobody will say whose axe it was. The elders of the border groves ask what Herrodon will do."
 zin_elves.20.t:0 "The Boundary Groves"
 zin_elves.21.a:0 "Answer it in kind"
 zin_elves.21.b:0 "Let it pass"
 zin_elves.21.d:0 "At the last midsummer feast the speaker of Herrodon sat down at the high table before Andos Enda's envoy had been greeted. It was a small thing. It has been remembered for a hundred years."
 zin_elves.21.t:0 "A Slight Remembered"
 zin_elves.22.a:0 "Favour Herrodon"
 zin_elves.22.b:0 "Favour Andos Enda"
 zin_elves.22.c:0 "The roost belongs to the dragons"
 zin_elves.22.d:0 "Both Herrodon and Andos Enda claim the eastern roosts, because their grandmothers once sang there to the wyrms. The Keeper of the mountain must say whose song the dragons will hear."
 zin_elves.22.t:0 "The Roost Claim"
 zin_elves.23.a:0 "We will listen"
 zin_elves.23.d:0 "Speakers of the Magical Forest have walked between Herrodon and Andos Enda with open hands. Neither house has forgotten the quarrel, but both have agreed to let the old words cool."
 zin_elves.23.t:0 "The Rivals Hear Mediation"
 zin_elves.24.a:0 "Sorrow in the woods"
 zin_elves.24.d:0 "Herrodon and Andos Enda have taken up the old quarrel in earnest. Bows are strung in the boundary groves, and the kin of both houses are choosing which hand to hold."
 zin_elves.24.t:0 "The Feud of the Groves"
 zin_elves.25.a:0 "Accept a peace without spoils"
 zin_elves.25.b:0 "Fight on"
 zin_elves.25.d:0 "A year of strife has cost both houses more trees than they cost each other. Envoys of the Magical Forest offer a peace without spoils."
 zin_elves.25.t:0 "An End to the Feud?"
 zin_elves.30.a:0 "Speak of the old peace"
 zin_elves.30.b:0 "Speak of the Wall"
 zin_elves.30.c:0 "Speak of the rivals"
 zin_elves.30.d:0 "The houses of the Magical Lands have come to the council ring beneath the silver trees. The old speakers ask what the moot should speak of first."
 zin_elves.30.t:0 "The Elder Moot"
 zin_elves.31.a:0 "Stand with the kin"
 zin_elves.31.b:0 "We keep our own counsel"
 zin_elves.31.d:0 "The Magical Forest has raised the Kindred of the Woods, a league of elves for the defence of elven lands. It takes in no one who is not of the woods. Every house is asked to stand with the kin."
 zin_elves.31.t:0 "The Kindred of the Woods"
 zin_elves.32.a:0 "The woods stand together"
 zin_elves.32.d:0 "The elven houses of the Magical Lands have bound themselves in the Kindred of the Woods. It is a league of defence for the woods alone, and its heralds say it will not march for men."
 zin_elves.32.t:0 "The Kindred Is Raised"
 zin_elves.40.a:0 "Our thanks"
 zin_elves.40.d:0 "Wardens from the kin have come up to Nolorim's high passes and asked only for fire and bread. They will stay as long as the snow lets them."
 zin_elves.40.t:0 "Wardens for the Passes"
 zin_elves.41.a:0 "The woods remember"
 zin_elves.41.d:0 "Every high pass of Nolorim is under foreign banners. The kin in the lowlands have watched the signal fires go dark, one after another."
 zin_elves.41.t:0 "The Passes Are Lost"
 zin_elves.45.a:0 "Guard the roosts"
 zin_elves.45.b:0 "The dragons are free"
 zin_elves.45.d:0 "In the night a dragon rose from the mountain and flew east without a backward look. The roost-singers say something called it. They will not say what it sounded like. The roosts are restless."
 zin_elves.45.d_revealed:0 "In the night a dragon rose from the mountain and flew east without a backward look. The roost-singers found the Deliverer's priests on the mountain roads, and no one will say how long they had been there. The roosts are restless."
 zin_elves.45.t:0 "A Dragon Flies East"
 zin_elves.5.a:0 "Hear the elves"
 zin_elves.5.b:0 "The crown's tolls stand"
 zin_elves.5.d:0 "Elven speakers have come down to the great gate and asked that the crown's customs men hear them in open moot. They say the tolls on the Wall road have grown heavier than the Accord of 4A 96 allows, and that the road has gone cold with it."
 zin_elves.5.t:0 "A Wall Moot at the Gate"
 zin_elves.50.a:0 "We will heed it"
 zin_elves.50.d:0 "A letter lay on the table this morning, in an old hand, unsigned. Nobody saw it come in. It answers the question we asked, and a few we did not."
 zin_elves.50.t:0 "Word From the Wizard"
 zin_elves.55.a:0 "Welcome them"
 zin_elves.55.d:0 "Healers and loremasters of the elven woods have come to our towns and asked leave to sit in our halls and tend our sick. They are no host and bear no banner but their own."
 zin_elves.55.t:0 "Elven Wanderers Arrive"
 zin_elves.56.a:0 "Welcome them"
 zin_elves.56.d:0 "Wardens of the elven woods stand in our border villages, tall and quiet, in grey cloaks with long bows. Their king did not send them, they say. They have simply come."
 zin_elves.56.t:0 "Elven Wardens Arrive"
 zin_elves.6.a:0 "So it is at the Wall"
 zin_elves.6.d:0 "The speakers have come back from the gate with the crown's answer. The tolls stand as they were, and the road will stay cold."
 zin_elves.6.d_heard:0 "The speakers have come back from the gate with the crown's answer. The customs men heard them out, the tolls will be eased, and the elven gates will open again."
 zin_elves.6.t:0 "The Crown Answers"
 zin_elves.60.a:0 "Close every road"
 zin_elves.60.b:0 "Watch and wait"
 zin_elves.60.d:0 "The pilgrims' hermitage in the Zilin Hills was never what its priests said. Our wardens have seen what it is, and every road that leads there runs through our woods."
 zin_elves.60.t:0 "The Temple in the Hills"
 zin_elves.7.a:0 "Pay the herdsmen"
 zin_elves.7.b:0 "The dragons are free"
 zin_elves.7.d:0 "A wild wyrm of the mountain crossed the Wall in the night and took herds on the Aenor side. The herdsmen are at the gate with what is left of the carcasses, and the king's men are watching to see what the woods will say."
 zin_elves.7.t:0 "Dragon Over the Wall"
 zin_elves.72.a:0 "Accept the companies"
 zin_elves.72.b:0 "We defend our own"
 zin_elves.72.d:0 "Aenor's envoys ask leave to send companies through the Wall gates, to stand beside the woods against the sails on the rift sea. They ask no more than a road."
 zin_elves.72.t:0 "Aenor Offers Companies"
 zin_elves.73.a:0 "Make a peace without spoils"
 zin_elves.73.b:0 "Fight on"
 zin_elves.73.d:0 "No foreign banner now stands in the woods of the rift coast. The wardens ask whether the war should end here, or follow the sails home."
 zin_elves.73.t:0 "The Rift Is Quiet"
 zin_elves.8.a:0 "So it is at the Wall"
 zin_elves.8.d:0 "No silver has come for the herds the dragon took. The elves say the wyrms of the mountain are no one's to keep, and the herdsmen are bitter."
 zin_elves.8.d_paid:0 "Elven factors came to the Wall villages with silver for every beast the dragon took. The herdsmen could hardly believe it, and the customs men are puzzled."
 zin_elves.8.t:0 "Herds Lost Below the Wall"
 zin_opinion_cold_roads:0 "Cold roads at the Wall"
 zin_opinion_elven_goodwill:0 "Elven goodwill"
 zin_opinion_feud_of_groves:0 "The Feud of the Groves"
 zin_opinion_kindred:0 "Sworn kin of the woods"
 zin_opinion_pilgrim_roads_closed:0 "The pilgrim roads are closed"
 zin_opinion_pilgrim_tolls:0 "Tolls on the pilgrim roads"
 zin_opinion_wall_roads_closed:0 "The Wall roads are shut"
