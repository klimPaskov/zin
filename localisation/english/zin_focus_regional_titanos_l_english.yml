l_english:
 zin_regional_titanos_doors_of_ice_closed:0 "The Doors of Ice Closed"
 zin_regional_titanos_doors_of_ice_closed_desc:0 "Great doors of blue ice are swung across the passes and sealed with meltwater. Nothing larger than a bird will cross until the Frost-King allows it."
 zin_regional_titanos_envoys_in_the_snow:0 "Envoys in the Snow"
 zin_regional_titanos_envoys_in_the_snow_desc:0 "Coldor's envoys climb to Titanos on hired sledges, in furs so thick they look like walking hills. They bring gifts and an old question: whether the pacts of the past still hold."
 zin_regional_titanos_fair_toll:0 "A Fair Toll"
 zin_regional_titanos_frost_kings_hall:0 "The Frost-King's Hall"
 zin_regional_titanos_frost_kings_hall_desc:0 "Frost-King Huk keeps the great hall of Titanos, where benches are cut from single trunks and the hearth could roast an ox whole. Visitors are made to feel small, and the giants do not apologise."
 zin_regional_titanos_giants_against_the_dark:0 "Giants Against the Dark"
 zin_regional_titanos_giants_against_the_dark_desc:0 "Some giants say that the dark does not respect snowlines, and that the host should go out and meet it. The Frost-King listens, and the hammers are taken down from their pegs."
 zin_regional_titanos_giants_on_the_passes_sworn:0 "Giants on the Passes"
 zin_regional_titanos_giants_on_the_passes_sworn_desc:0 "A pair of giants stands guard at each of the passes that lead to Fandanar, sworn to the pact and paid in salt. No army has yet found a way around them."
 zin_regional_titanos_giants_on_the_southern_road:0 "Giants on the Southern Road"
 zin_regional_titanos_giants_on_the_southern_road_desc:0 "A band of giants walks south out of Titanos, taller than the pines they pass. The folk of the lowlands stand at their doors to watch them go, and are glad."
 zin_regional_titanos_gifts_for_the_frost_king:0 "Gifts for the Frost-King"
 zin_regional_titanos_gifts_for_the_frost_king_desc:0 "Fandanar sends gifts to the Frost-King each year: salt, spiced wine, iron-bound chests. In return the giants send down a few great stones, shaped by hand, that the Winter Crown sets before its gates."
 zin_regional_titanos_glacier_host:0 "The Glacier Host"
 zin_regional_titanos_glacier_host_desc:0 "Skarn's band moves across the ice like a slow tide: heavy, steady and irresistible. It does not hurry, because it has never needed to."
 zin_regional_titanos_great_hammers:0 "Great Hammers"
 zin_regional_titanos_great_hammers_desc:0 "The smiths of Titanos forge hammers the weight of a pony, with hafts of whole ash trunks. Used with both hands, one swing will break a gate."
 zin_regional_titanos_hearth_and_height_answered:0 "Hearth and Height"
 zin_regional_titanos_hearth_and_height_answered_desc:0 "The oldest pact is renewed in full: hearth for the lowlands, height for the giants. The two halls swear that neither will see the other beset alone."
 zin_regional_titanos_high_snows_apart:0 "The High Snows Apart"
 zin_regional_titanos_high_snows_apart_desc:0 "The passes are closed and the halls are barred. The high snows ask nothing of any crown and answer none, and the winter wall is made stronger by the silence."
 zin_regional_titanos_high_snows_hold:0 "The High Snows Hold"
 zin_regional_titanos_high_snows_hold_desc:0 "The giants of Titanos keep their passes and their peace while the south burns. The snow is deep, the halls are warm, and the dark has not yet found the way up."
 zin_regional_titanos_ice_halls:0 "Halls in the Ice"
 zin_regional_titanos_ice_halls_desc:0 "New halls are dug beneath the glacier, where the cold is constant and the walls are smooth as glass. Stores keep for a decade there, and the workshops warm themselves with their own hearths."
 zin_regional_titanos_memory_of_the_giants:0 "Memory of the Giants"
 zin_regional_titanos_memory_of_the_giants_desc:0 "The giants of Titanos keep their own count of years, long and slow, and have no wish to match it to anyone else's. What they remember, they remember exactly."
 zin_regional_titanos_memory_of_the_giants_tip_1:0 "The giants keep their own count of years."
 zin_regional_titanos_moot_of_the_high_snows:0 "Moot of the High Snows"
 zin_regional_titanos_moot_of_the_high_snows_desc:0 "Once each winter the halls of Titanos send their elders to the Frost-King's table. They speak slowly and at length, and the moot does not end until everyone has had their say."
 zin_regional_titanos_no_crown_above_the_snow:0 "No Crown Above the Snow"
 zin_regional_titanos_no_crown_above_the_snow_desc:0 "The elders declare that no crown rules above the snowline, and the moot carves the words on the peak above the hall. The giants of Titanos answer to themselves."
 zin_regional_titanos_old_peoples_of_the_ice:0 "Old Peoples of the Ice"
 zin_regional_titanos_old_peoples_of_the_ice_desc:0 "The giants and the yeti, the ice-folk and the hill clans each keep a place in the memory of the high snows. The elders meet once a generation to name them, and name no one superior."
 zin_regional_titanos_pass_guardians:0 "Giants on the Passes"
 zin_regional_titanos_pass_guardians_desc:0 "At the narrowest passes a giant stands at either side, and no one has yet passed between them uninvited. Their presence alone has ended more quarrels than any army."
 zin_regional_titanos_quarries_of_the_ice:0 "Quarries of the Ice"
 zin_regional_titanos_quarries_of_the_ice_desc:0 "Blocks of blue ice and grey granite are cut from the glacier-edge and hauled to the halls. The giants build in stone the way other folk build in timber, and they build to last."
 zin_regional_titanos_salt_and_iron_traders:0 "Salt and Iron Traders"
 zin_regional_titanos_salt_and_iron_traders_desc:0 "Traders from the south wait at the foot of the passes with salt on their mules and ask leave to climb. The giants bargain for a long time and rarely cheat."
 zin_regional_titanos_skarns_band:0 "Skarn's Band"
 zin_regional_titanos_skarns_band_desc:0 "Skarn Glacier-Hand leads the first full band of the giants' host, a hundred strong, in white fur and iron-studded kilts. When it marches, the ground feels it long before the horns."
 zin_regional_titanos_the_dark_wakes:0 "The Dark Wakes"
 zin_regional_titanos_the_dark_wakes_desc:0 "Something is stirring in the south, beyond the snow and beyond the forests. The old mothers say the dark is awake, and the Frost-King calls the halls to council."
 zin_regional_titanos_the_frost_kings_court:0 "The Frost-King's Court"
 zin_regional_titanos_the_frost_kings_court_desc:0 "The hall of Titanos is built of glacier-stone and lit by fires that never go out. Frost-King Huk sits in it, and the old mothers sit beside him, and between them nothing is forgotten."
 zin_regional_titanos_the_frost_levy:0 "The Frost Levy"
 zin_regional_titanos_the_frost_levy_desc:0 "The levy of Titanos is smaller than other realms' but each warrior takes up the space of three. They come with their own spears, which are mostly young pines with iron heads."
 zin_regional_titanos_the_giants_host:0 "The Giants' Host"
 zin_regional_titanos_the_giants_host_desc:0 "When the horn is blown from the high hall, the giants of Titanos come down from the glaciers in groups of a dozen. A host of them can cross a valley in an afternoon and level it in an evening."
 zin_regional_titanos_the_giants_toll_roads:0 "The Toll Roads"
 zin_regional_titanos_the_giants_toll_roads_desc:0 "The ice roads between the halls of Titanos carry salt up and iron down, and the giants take a toll from every traveller. They ask for a fair share and no more, and the traders have learned to rely on it."
 zin_regional_titanos_the_high_snows_apart:0 "The High Snows Apart"
 zin_regional_titanos_the_high_snows_apart_desc:0 "The old mothers say that the pacts were made for other winters, and that the high snows are better left alone. The Frost-King agrees, and the envoys are shown the way down."
 zin_regional_titanos_the_high_snows_hold:0 "The High Snows Hold"
 zin_regional_titanos_the_high_snows_hold_desc:0 "The giants decide that the high snows will hold. The passes are closed to the dark as they are to everything else, and the halls prepare for a long winter."
 zin_regional_titanos_the_hurlers:0 "The Hurlers"
 zin_regional_titanos_the_hurlers_desc:0 "Giants stand beside the great frames and hurl boulders by hand, at a range that others need a trebuchet to match. The hurlers are proud, and aim well."
 zin_regional_titanos_the_light_in_the_north:0 "The Light in the North"
 zin_regional_titanos_the_light_in_the_north_desc:0 "A green light burns in the northern dark, steady and cold. The old mothers say it is not a fire, and the giants do not go there."
 zin_regional_titanos_the_light_in_the_north_tip_1:0 "A green light burns in the north. The giants do not go there."
 zin_regional_titanos_the_old_mothers:0 "The Old Mothers"
 zin_regional_titanos_the_old_mothers_desc:0 "The old mothers of Titanos keep its memory in song and in notched sticks. Old Mother Hrimla is the eldest, and when she speaks the Frost-King listens with his head bowed."
 zin_regional_titanos_the_old_pacts_kept:0 "The Old Pacts Kept"
 zin_regional_titanos_the_old_pacts_kept_desc:0 "The Frost-King holds out a hand the size of a shovel and says that the pacts were sworn on ice, and ice remembers. Fandanar's envoys are asked to stay for the feast."
 zin_regional_titanos_the_snows_edge:0 "The Snow's Edge"
 zin_regional_titanos_the_snows_edge_desc:0 "At the edge of the snow, where the giants' grazing meets the forests below, there are neighbours: some friendly, some wary. The Frost-King sends envoys down the lower roads."
 zin_regional_titanos_the_snows_long_breath:0 "The Snow's Long Breath"
 zin_regional_titanos_the_snows_long_breath_desc:0 "The old mothers of the high snows say the snow breathes in and out over the ages, and that it breathed in over the green north long ago. The giants will tell ice-walkers where the snow has breathed out this year, if they ask politely."
 zin_regional_titanos_the_yeti_neighbours:0 "The Yeti Neighbours"
 zin_regional_titanos_the_yeti_neighbours_desc:0 "The yeti of the neighbouring snows have shared grazing with the giants since before anyone counted. Old boundaries are retraced and marked with cairns, and a truce is sworn on a bear's skull."
 zin_regional_titanos_toll_halls:0 "Toll-Halls on the Passes"
 zin_regional_titanos_toll_halls_desc:0 "Every pass has its hall, and every hall its toll-keeper. The toll is fair, the keepers are large, and traders have learned to pay on the first asking."
 zin_regional_titanos_toll_halls_on_the_passes:0 "Toll-Halls on the Passes"
 zin_regional_titanos_toll_halls_on_the_passes_desc:0 "A stone hall is raised at the head of each pass, with a fire inside and a hook for every traveller's cloak. Its keeper counts every pack that goes through."
 zin_regional_titanos.1.a:0 "A fair toll."
 zin_regional_titanos.1.b:0 "A giant's toll."
 zin_regional_titanos.1.d:0 "A trader has climbed to the toll-hall with a string of mules and a small purse. He asks, politely, whether the giants will take salt for passage, or whether iron would be better."
 zin_regional_titanos.1.t:0 "Salt for Iron"
