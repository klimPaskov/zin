l_english:
 zin_people_demons:0 "Demons"
 zin_people_demons_desc:0 "Corrupted angels: terrible in battle and few in number."
 zin_people_elves:0 "Elves"
 zin_people_elves_desc:0 "Immortal Great Folk of the forests: few, patient and long-sighted."
 zin_people_ents:0 "Ents"
 zin_people_ents_desc:0 "Ancient tree-folk: slow to rouse, nearly impossible to break."
 zin_people_giants:0 "Giants"
 zin_people_giants_desc:0 "Few and enormous; a single giant is worth a company of men."
 zin_people_men:0 "Men"
 zin_people_men_desc:0 "Mortal folk: numerous, adaptable and short-lived."
 zin_people_orcs:0 "Orcs and Goblins"
 zin_people_orcs_desc:0 "Many, fierce and quarrelsome, bound to no crown."
 zin_people_sun_elves:0 "Sunhot Elves"
 zin_people_sun_elves_desc:0 "Elves of the Lands of the Sun, over three metres tall: among the strongest and most peaceful folk of Erdae."
 zin_people_the_dead:0 "Grave Hosts"
 zin_people_the_dead_desc:0 "The restless dead, raised and sustained by dark power: they never tire, never starve and never forget."
 zin_people_trolls:0 "Trolls"
 zin_people_trolls_desc:0 "Brutal, hardy and hungry; difficult to command."
 zin_people_yeti:0 "Yeti"
 zin_people_yeti_desc:0 "Furred folk of the frozen north, at home in the coldest winters."
