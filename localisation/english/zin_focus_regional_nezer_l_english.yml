l_english:
 zin_regional_nezer_a_crown_not_a_chain:0 "A Crown, Not a Chain"
 zin_regional_nezer_a_crown_not_a_chain_desc:0 "Queen Nazara says that she wears a crown, not a chain, and that a crown can be taken off. The words are repeated through every hall of the Ember Coast before the night is out."
 zin_regional_nezer_a_name_that_does_not_answer:0 "A Name That Does Not Answer"
 zin_regional_nezer_a_name_that_does_not_answer_desc:0 "The summons from Nafeher have stopped. The Steward speaks in a name that does not answer, and the court of the Ember Coast sits in a silence it has never known."
 zin_regional_nezer_answer_the_summons:0 "Answer the Summons"
 zin_regional_nezer_answer_the_summons_desc:0 "Nafeher's summons reaches the coast in a black-sealed scroll, and the queen reads it standing. Nezer has sworn to answer, and Nezer answers."
 zin_regional_nezer_burning_vanguard:0 "The Burning Vanguard"
 zin_regional_nezer_burning_vanguard_desc:0 "The vanguard is anointed with ember-wax and lit at the edges, and goes forward as a wall of heat and smoke. Whoever stands in its path remembers the smell for the rest of his life."
 zin_regional_nezer_burning_vanguard_spirit:0 "The Burning Vanguard"
 zin_regional_nezer_burning_vanguard_spirit_desc:0 "The vanguard of Nezer goes forward in a wall of heat and smoke, and the ground it crosses stays warm for days. Whoever stands before it feels it long before he sees it."
 zin_regional_nezer_dominion_vanguard:0 "The Dominion's Vanguard"
 zin_regional_nezer_dominion_vanguard_desc:0 "Nezer's war-bands are the first to answer a summons, and the last to be recalled. They fight with the fury of a house that has something to prove."
 zin_regional_nezer_ember_forges:0 "Ember Forges"
 zin_regional_nezer_ember_forges_desc:0 "Forges are raised on the glass shore, fed by the natural heat of the vents. They roar day and night, and the smiths work in shifts."
 zin_regional_nezer_ember_trade:0 "Ember Trade"
 zin_regional_nezer_ember_trade_desc:0 "Nezer begins to sell its wares to the free ports without Nafeher's seal. Traders come to the coast with silver, and leave with black glass and a sense of having broken a rule."
 zin_regional_nezer_ember_trade_spirit:0 "Ember Trade"
 zin_regional_nezer_ember_trade_spirit_desc:0 "Black glass, ember-salt and cinder-iron go out by the free ports on the Ember Coast. Nezer has no lord to ask permission of when it sells what the vents provide."
 zin_regional_nezer_houses_rule:0 "The Houses Rule"
 zin_regional_nezer_houses_rule_desc:0 "The great houses of Nezer and Nezerun sit as equals, and the queen is the first among them rather than above. Every decision is argued three times, and none is ever reversed."
 zin_regional_nezer_keep_the_gate_sealed:0 "Keep the Gate Sealed"
 zin_regional_nezer_keep_the_gate_sealed_desc:0 "The wardens agree that the gate shall stay closed, whatever Nafeher asks. It is the first step on a road away from the oath, and everyone at the table knows it."
 zin_regional_nezer_nazaras_court:0 "Nazara's Court"
 zin_regional_nezer_nazaras_court_desc:0 "The queen holds court in a hall of black glass, lit by braziers that never go out. Vharos Ember-Tongue whispers at her shoulder, and the court decides to listen."
 zin_regional_nezer_nezer_marches_north:0 "Nezer Marches North"
 zin_regional_nezer_nezer_marches_north_desc:0 "Nafeher has turned its face to the north, and Nezer marches with it. The war-bands cross the border by night and are in the first towns by morning."
 zin_regional_nezer_nezers_furnaces:0 "Nezer's Furnaces"
 zin_regional_nezer_nezers_furnaces_desc:0 "A great furnace is built at the heart of the coast, drawn directly from a vent. It never goes out, and the smiths who tend it say that it breathes."
 zin_regional_nezer_nezers_furnaces_spirit:0 "Nezer's Furnaces"
 zin_regional_nezer_nezers_furnaces_spirit_desc:0 "Furnaces fed by the vents themselves roar night and day on the coast, and the glass-smiths work at them in shifts. Nothing in Nezer ever goes cold."
 zin_regional_nezer_obsidian_quarries:0 "Obsidian Quarries"
 zin_regional_nezer_obsidian_quarries_desc:0 "Black glass is cut from the cliffs in slabs and shaped into blades, mirrors and spear-heads. A single flake is sharper than any iron, and it is sold by the weight of a feather."
 zin_regional_nezer_old_portal_lore:0 "Old Portal Lore"
 zin_regional_nezer_old_portal_lore_desc:0 "The scholars of Nezerun read the old records of the gate and copy them in glass-ink on leaves of black slate. What they learn they keep to themselves."
 zin_regional_nezer_one_family:0 "One Family"
 zin_regional_nezer_one_family_desc:0 "Nezer and Nezerun reaffirm that they are one family, and the old names are read aloud in the court. A family that remembers its names is hard to divide."
 zin_regional_nezer_one_family_spirit:0 "One Family"
 zin_regional_nezer_one_family_spirit_desc:0 "Nezer and Nezerun are two lands of one family, and the family quarrels like any other. Outsiders mistake the quarrels for weakness, and are surprised when the family closes ranks."
 zin_regional_nezer_open_the_gate_for_nafeher:0 "Open the Gate for Nafeher"
 zin_regional_nezer_open_the_gate_for_nafeher_desc:0 "Nafeher asks, and the wardens unlock the gate's stronghold. What passes through is not said, and no one in Nezer will write it down."
 zin_regional_nezer_own_crown:0 "The Queen's Own Crown"
 zin_regional_nezer_own_crown_desc:0 "The queen wears her own crown at last, forged on her own coast, and bows to none. Nezer is a free realm, and its people feel the weight of it."
 zin_regional_nezer_queens_hand:0 "The Queen's Hand"
 zin_regional_nezer_queens_hand_desc:0 "Queen Nazara's hand rests on both crowns, and her word carries from the glass cliffs to the smoking vents. She is feared, obeyed and, in a quiet way, loved."
 zin_regional_nezer_quiet_councils:0 "Quiet Councils"
 zin_regional_nezer_quiet_councils_desc:0 "Small councils meet in the glass-halls at night, with the shutters closed and a single lamp. What is discussed there is not recorded."
 zin_regional_nezer_sealed_gate:0 "The Gate Kept Sealed"
 zin_regional_nezer_sealed_gate_desc:0 "The Burning Gate is closed by walls three men thick, and wardens of the old houses watch it day and night. Whatever lies behind it stays there."
 zin_regional_nezer_stand_with_the_steward:0 "Stand with the Steward"
 zin_regional_nezer_stand_with_the_steward_desc:0 "The queen decides that Nezer's oath was sworn to Nafeher, not to a name. The Steward speaks for Nafeher, and the war-bands will follow the Steward's banner."
 zin_regional_nezer_the_burning_gate_remembered:0 "The Burning Gate Remembered"
 zin_regional_nezer_the_burning_gate_remembered_desc:0 "In an older age a gate of fire stood open in one of Nezer's border strongholds, and men, elves and dark soldiers fought together to close it. The houses of Nezer still argue about who opened it."
 zin_regional_nezer_the_dominions_vanguard:0 "The Dominion's Vanguard"
 zin_regional_nezer_the_dominions_vanguard_desc:0 "Nezer's war-bands are formed into a vanguard, picked from the swiftest and the most eager. They will be the first to answer when the horn is blown."
 zin_regional_nezer_the_ember_coast:0 "The Ember Coast"
 zin_regional_nezer_the_ember_coast_desc:0 "The Ember Coast is a land of black glass and smoking vents, and its people are proud to call it theirs. A great hall is raised at its centre, and the queen opens it with a torch."
 zin_regional_nezer_the_ember_coast_endures:0 "The Ember Coast Endures"
 zin_regional_nezer_the_ember_coast_endures_desc:0 "Whatever the throne in Nafeher has become, the Ember Coast remains. The vents glow, the glass is cut and the court gathers in the great hall to eat."
 zin_regional_nezer_the_ember_host:0 "The Ember Host"
 zin_regional_nezer_the_ember_host_desc:0 "The war-bands of the Ember Coast are formed into a single host, under the queen's own banner. The drums are made of glass, and they ring."
 zin_regional_nezer_the_hot_roads:0 "The Hot Roads"
 zin_regional_nezer_the_hot_roads_desc:0 "Roads of fused glass are laid across the cooler ground, smooth as ice and warm underfoot. Wagons roll over them without a sound."
 zin_regional_nezer_the_houses_rule:0 "The Houses Rule"
 zin_regional_nezer_the_houses_rule_desc:0 "The houses decide that no single hand shall rest on both crowns. The queen is the first among them, and her seat is no higher than theirs."
 zin_regional_nezer_the_nezerun_houses:0 "The Nezerun Houses"
 zin_regional_nezer_the_nezerun_houses_desc:0 "The houses of Nezerun send their eldest to the queen's table, each with a banner and a grievance. They are given seats, wine and a patient hearing."
 zin_regional_nezer_the_oath_weighs_heavy:0 "The Oath Weighs Heavy"
 zin_regional_nezer_the_oath_weighs_heavy_desc:0 "The queen speaks to her cousins in a low voice, behind closed doors. The oath was sworn by their grandfathers, she says, and weighs on the coast more heavily each year."
 zin_regional_nezer_the_queens_hand:0 "The Queen's Hand"
 zin_regional_nezer_the_queens_hand_desc:0 "The court agrees that the queen's hand shall rest on both crowns, and her word be the final one. The houses mutter, but they sign."
 zin_regional_nezer_the_queens_own_crown:0 "The Queen's Own Crown"
 zin_regional_nezer_the_queens_own_crown_desc:0 "Nazara has a crown forged on her own coast, of black glass and ember-iron. She sets it on her head in the great hall, and the court kneels to the only throne that answers."
 zin_regional_nezer_the_war_bands_ride:0 "The War-Bands Ride"
 zin_regional_nezer_the_war_bands_ride_desc:0 "The horns of Nezer have sounded, and the war-bands answer in a single night. Black armour glints on the glass roads, and the coast is empty by dawn."
 zin_regional_nezer_tribute_of_nezer:0 "The Tribute of Nezer"
 zin_regional_nezer_tribute_of_nezer_desc:0 "Ember-salt, black glass and cinder-iron are loaded on carts and sent north to Nafeher in the autumn. Ummath the Tallykeeper counts every cart, and writes the count on a strip of glass."
 zin_regional_nezer_two_crowns_of_nezer:0 "The Two Crowns of Nezer"
 zin_regional_nezer_two_crowns_of_nezer_desc:0 "Nezer and Nezerun are one family under two crowns, and Queen Nazara wears the second. In the ember-lit halls of her court, the cousins sit shoulder to shoulder and argue in low voices."
 zin_regional_nezer_war_bands_for_the_dominion:0 "War-Bands for the Dominion"
 zin_regional_nezer_war_bands_for_the_dominion_desc:0 "The war-bands of the Ember Coast ride north in their black armour, and the vents glow red behind them. They go to serve the Dominion, and they return with scars and stories."
 zin_regional_nezer_wardens_of_the_gate:0 "Wardens of the Gate"
 zin_regional_nezer_wardens_of_the_gate_desc:0 "A watch is set on the gate's old stronghold, drawn from the oldest houses of the Ember Coast. They stand there night and day, and do not talk about what they guard."
 zin_regional_nezer.1.a:0 "Nezerun leads."
 zin_regional_nezer.1.b:0 "Nezer and Nezerun as equals."
 zin_regional_nezer.1.d:0 "The cousins of Nezer and Nezerun are summoned to the black-glass hall, each with a banner and a grievance. The queen waits until they are seated, and then asks who shall lead."
 zin_regional_nezer.1.t:0 "Two Crowns, One Family"
 zin_regional_nezer.2.a:0 "Let the gate be remembered."
 zin_regional_nezer.2.d:0 "In an older age a gate of fire stood open in one of Nezer's strongholds, and men, elves and dark soldiers closed it together and forgot it together. Nobody in Nezer says who opened it."
 zin_regional_nezer.2.t:0 "The Burning Gate"
 zin_regional_nezer.3.a:0 "Wait and watch."
 zin_regional_nezer.3.d:0 "The summons have stopped. The Steward speaks in a name that does not answer, and what remains of the master of Nafeher, no one living can say."
 zin_regional_nezer.3.t:0 "The Silence from Nafeher"
