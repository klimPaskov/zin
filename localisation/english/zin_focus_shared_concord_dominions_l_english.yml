l_english:
 zin_shared_concord_dominions_a_free_land:0 "A Free Land"
 zin_shared_concord_dominions_a_free_land_desc:0 "[ROOT.GetName] owes no oath to any crown, and its lords keep the keys of their own gates. The Concord looks on, and other free lands of the Middle Lands look back."
 zin_shared_concord_dominions_a_governors_hand:0 "A Governor's Hand"
 zin_shared_concord_dominions_a_governors_hand_desc:0 "A single governor is appointed to rule [ROOT.GetName] in the name of the crown. His seal is on every writ, and his captains carry his word to the farthest steading."
 zin_shared_concord_dominions_a_prosperous_land:0 "A Prosperous [ROOT.GetAdjective] Land"
 zin_shared_concord_dominions_a_prosperous_land_desc:0 "Roads busy, barns full and guildhalls ringing: [ROOT.GetName] has more than it needs and finds buyers for the rest. Travellers remark on the neat hedges and the well-fed children."
 zin_shared_concord_dominions_a_shield_for_the_concord:0 "A Shield for the Concord"
 zin_shared_concord_dominions_a_shield_for_the_concord_desc:0 "The crown asks every dominion to drill its levy to a common pattern, with the same shields and the same signals. [ROOT.GetName] sends its drill-masters to learn the new drill."
 zin_shared_concord_dominions_a_watchful_court:0 "A Watchful Court"
 zin_shared_concord_dominions_a_watchful_court_desc:0 "The court of [ROOT.GetName] has begun to count how much of its grain passes through the temples, and how many of the new almoners ask about the lord's household. Its stewards take notes."
 zin_shared_concord_dominions_after_the_last_crowns:0 "After the Last Crowns"
 zin_shared_concord_dominions_after_the_last_crowns_desc:0 "The war is over, and the dominion of [ROOT.GetName] counts its dead. Roads are mended, fields are seeded, and the council sits again beneath a king in Parim."
 zin_shared_concord_dominions_against_the_deathless:0 "Against the Deathless"
 zin_shared_concord_dominions_against_the_deathless_desc:0 "The dead come out of the black north and do not fall to ordinary iron. The captains of [ROOT.GetName] stand firm and learn how little their arms can do."
 zin_shared_concord_dominions_against_the_deathless_tip_1:0 "Ordinary arms break Zol's dead; they do not end them."
 zin_shared_concord_dominions_answer_the_muster:0 "Answer the Muster"
 zin_shared_concord_dominions_answer_the_muster_desc:0 "The crown calls every dominion to arms, and the banner of [ROOT.GetName] goes down the road with the rest. Many of those marching have never seen a battle, and some will not see another."
 zin_shared_concord_dominions_ask_for_a_charter:0 "Ask Parim for a Charter"
 zin_shared_concord_dominions_ask_for_a_charter_desc:0 "An embassy sets out for Parim with presents for the keeper of the royal seal and a petition for a place among the chartered dominions. The road is long, and the answer may not please every lord at home."
 zin_shared_concord_dominions_banners_of_the_lost_cause:0 "Banners of the Lost Cause"
 zin_shared_concord_dominions_banners_of_the_lost_cause_desc:0 "The Golden King's old league against the powers of the dark has banners for every dominion. [ROOT.GetName] hangs its own in the great hall, and its captains swear to carry it when the dark returns."
 zin_shared_concord_dominions_bowmen_of_the_villages:0 "Bowmen of the Villages"
 zin_shared_concord_dominions_bowmen_of_the_villages_desc:0 "Every village has its butts and its master-archer, and the bows of [ROOT.GetName] are known from the lake to the border. On feast days the young men shoot for a ribbon and a barrel of ale."
 zin_shared_concord_dominions_charter_loyalists:0 "Charter Loyalists"
 zin_shared_concord_dominions_charter_loyalists_desc:0 "The old families of [ROOT.GetName] swear themselves to the Charter and to the crown that sealed it. They sit on the council, hold the keys of the town and answer to nobody but the king."
 zin_shared_concord_dominions_charter_loyalists_spirit:0 "Charter Loyalists"
 zin_shared_concord_dominions_charter_loyalists_spirit_desc:0 "The old families hold the keys of the town and the seals of the Charter. They serve the crown, and the crown rewards them for it."
 zin_shared_concord_dominions_charter_of_the_dominion:0 "The Charter of [ROOT.GetName]"
 zin_shared_concord_dominions_charter_of_the_dominion_desc:0 "The Charters of Parim are read aloud in the market square, as they have been every spring since they were sealed. [ROOT.GetName] takes stock of what the crown has promised it and what it has promised the crown."
 zin_shared_concord_dominions_children_of_the_restoration:0 "Children of the Restoration"
 zin_shared_concord_dominions_children_of_the_restoration_desc:0 "The folk of [ROOT.GetName] still tell how the Middle Kingdom was rebuilt from ruin, and how each village gave what it had. The tale is told in schools and sung in taverns, and it binds the young to the old."
 zin_shared_concord_dominions_coastal_watch:0 "Coastal Watch"
 zin_shared_concord_dominions_coastal_watch_desc:0 "Beacon towers stand on every headland of [ROOT.GetName], each in sight of the next. A strange sail is signalled from end to end of the coast before it has dropped anchor."
 zin_shared_concord_dominions_concord_levy_answered:0 "The Concord Levy Answered"
 zin_shared_concord_dominions_concord_levy_answered_desc:0 "The crown calls for spearmen under the Concord, and [ROOT.GetName] sends its levy to the muster at the Great Lake. The men march off singing and return older."
 zin_shared_concord_dominions_concord_shield_drill:0 "A Shield for the Concord"
 zin_shared_concord_dominions_concord_shield_drill_desc:0 "Levies drilled to a common pattern, with the same shields and the same signals as every other dominion."
 zin_shared_concord_dominions_council_of_the_lake_towns:0 "Council of the Lake Towns"
 zin_shared_concord_dominions_council_of_the_lake_towns_desc:0 "The free towns of the lake shore send their speakers to a common table. What one town decides, the others weigh, and [ROOT.GetName] takes the lead in making rules for them all."
 zin_shared_concord_dominions_dominion_host:0 "The Dominion Host"
 zin_shared_concord_dominions_dominion_host_desc:0 "Every banner of the dominion is called to a single muster, and the host fills the meadow from hedge to hedge."
 zin_shared_concord_dominions_elected_magistrates:0 "Elected Magistrates"
 zin_shared_concord_dominions_elected_magistrates_desc:0 "Judges, wardens and reeves are chosen by the council for a year and a day. They may be recalled, and so they listen."
 zin_shared_concord_dominions_elven_markets:0 "Elven Markets"
 zin_shared_concord_dominions_elven_markets_desc:0 "A market is set up beside the Wall where men and elves meet to trade. Honey, glass and carved horn change hands, and the elves are said to haggle with great courtesy."
 zin_shared_concord_dominions_fishing_fleets:0 "Fishing Fleets"
 zin_shared_concord_dominions_fishing_fleets_desc:0 "Boats go out at dawn from every cove, and the catch is salted, smoked or sold fresh in the market the same afternoon. The fishers of [ROOT.GetName] grow bold and brown."
 zin_shared_concord_dominions_fishing_fleets_spirit:0 "Fishing Fleets"
 zin_shared_concord_dominions_fishing_fleets_spirit_desc:0 "Boats go out at dawn from every cove, and the catch feeds the whole coast."
 zin_shared_concord_dominions_for_order_and_the_crown:0 "For Order and the Crown"
 zin_shared_concord_dominions_for_order_and_the_crown_desc:0 "The old families hold that a crown is a crown, whoever wears it, and that the Charters bind the dominion to Parim. [ROOT.GetName] sends its seal to the court and awaits the new king's word."
 zin_shared_concord_dominions_for_the_free_dominions:0 "For the Free Dominions"
 zin_shared_concord_dominions_for_the_free_dominions_desc:0 "Let each dominion keep its own counsel, say the lords: the Charters were a bargain, and the other party is dead. [ROOT.GetName] backs the dominions that mean to stand on their own."
 zin_shared_concord_dominions_for_the_popular_host:0 "For the Popular Host"
 zin_shared_concord_dominions_for_the_popular_host_desc:0 "A host is gathering behind a banner no lord of the old court has raised, and the common folk of [ROOT.GetName] cheer it in the streets. The lords are not sure what they will gain, but they know who is shouting loudest."
 zin_shared_concord_dominions_fortify_the_homeland:0 "Fortify the Homeland"
 zin_shared_concord_dominions_fortify_the_homeland_desc:0 "Every wall in [ROOT.GetName] is raised another course, and every gate is given a second bar. Women and old men carry stones, and the levy drills in the fields."
 zin_shared_concord_dominions_free_and_apart:0 "Free and Apart"
 zin_shared_concord_dominions_free_and_apart_desc:0 "The lords of [ROOT.GetName] decide that freedom is better than a charter. They post a notice on the gate that no seal but their own will hold in this land."
 zin_shared_concord_dominions_free_banners:0 "Free Banners"
 zin_shared_concord_dominions_free_banners_desc:0 "When the dark comes, a free land answers to no one but itself. [ROOT.GetName] unfurls its banners and rallies every man who can hold a spear."
 zin_shared_concord_dominions_free_council:0 "The Free Council"
 zin_shared_concord_dominions_free_council_2:0 "Council of the Lake Towns"
 zin_shared_concord_dominions_free_council_2_desc:0 "The free towns send their speakers to a common table, and what one decides the others weigh."
 zin_shared_concord_dominions_free_council_desc:0 "Burghers meet in the guildhall and vote by show of hands."
 zin_shared_concord_dominions_free_land:0 "A Free Land"
 zin_shared_concord_dominions_free_land_2:0 "Free and Apart"
 zin_shared_concord_dominions_free_land_2_desc:0 "No seal but the lords' own will hold in this land, and the folk know it."
 zin_shared_concord_dominions_free_land_desc:0 "The dominion owes no oath to any crown, and its lords keep the keys of their own gates."
 zin_shared_concord_dominions_full_granaries:0 "The Granaries"
 zin_shared_concord_dominions_full_granaries_desc:0 "Tall stone granaries stand beside the market, filled each autumn against a bad year."
 zin_shared_concord_dominions_garrison_the_wall:0 "Garrison the Wall"
 zin_shared_concord_dominions_garrison_the_wall_desc:0 "The Great Wall needs men to keep it, and [ROOT.GetName] sends its share. The garrisons cut watch-notches in the parapet and learn to sleep in all weathers."
 zin_shared_concord_dominions_governors_men:0 "The Governor's Men"
 zin_shared_concord_dominions_governors_men_desc:0 "Clerks, bailiffs and guardsmen follow the governor. They are efficient, and they are not loved."
 zin_shared_concord_dominions_granaries:0 "The Granaries"
 zin_shared_concord_dominions_granaries_desc:0 "Tall stone granaries rise beside the market, and the reeves fill them each autumn against a bad year. [ROOT.GetName] will not starve while the doors hold."
 zin_shared_concord_dominions_guild_workshops:0 "Guild Workshops"
 zin_shared_concord_dominions_guild_workshops_desc:0 "Smiths, weavers and coopers form guilds with their own halls, their own apprentices and their own marks. The guildmasters of [ROOT.GetName] answer for the quality of every piece that leaves their doors."
 zin_shared_concord_dominions_harbour_works:0 "Harbour Works"
 zin_shared_concord_dominions_harbour_works_desc:0 "Stone quays, a mole and a chain across the harbour mouth: [ROOT.GetName] builds a proper port at last. Shipwrights set up their yards on the shore, and the town fills with the sound of mallets."
 zin_shared_concord_dominions_heed_mirolon:0 "Heed Mirolon"
 zin_shared_concord_dominions_heed_mirolon_desc:0 "The wardens of Mirolon have watched the south for generations, and what they say is worth hearing. [ROOT.GetName] sends gifts and an ear, and receives warnings in return."
 zin_shared_concord_dominions_home_fields:0 "The Fields of [ROOT.GetName]"
 zin_shared_concord_dominions_home_fields_desc:0 "Ploughs bite into the spring soil, and the reeves count the furrows of every manor. A good harvest in [ROOT.GetName] feeds more than its own people."
 zin_shared_concord_dominions_horse_and_lance:0 "Horse and Lance"
 zin_shared_concord_dominions_horse_and_lance_desc:0 "The richer families of [ROOT.GetName] raise a company of mounted knights, trained at the tilt and ready for the charge. Lances are cut from ash, and warhorses are bred in the water-meadows."
 zin_shared_concord_dominions_houses_watched:0 "A Watchful Court"
 zin_shared_concord_dominions_houses_watched_desc:0 "The stewards count how much grain passes through the temples and note who asks after the lord's household."
 zin_shared_concord_dominions_join_the_free_dominions:0 "Join the Free Dominions"
 zin_shared_concord_dominions_join_the_free_dominions_desc:0 "Other lands that broke with Parim have raised a banner of their own, and [ROOT.GetName] adds its name to the roll. Free of the crown, they are not free of one another."
 zin_shared_concord_dominions_league_banners:0 "Banners of the Lost Cause"
 zin_shared_concord_dominions_league_banners_desc:0 "The dominion's banner hangs beside the Golden King's, and its captains have sworn to carry it against the dark."
 zin_shared_concord_dominions_levies_trained:0 "Levies Trained"
 zin_shared_concord_dominions_levies_trained_desc:0 "The reeves of [ROOT.GetName] drill the levy on the village green on every feast day, and the drill-masters teach them to hold a line. A levy trained in peace costs less in blood in war."
 zin_shared_concord_dominions_lords_moot:0 "The Lords' Moot"
 zin_shared_concord_dominions_lords_moot_2:0 "The Moot Agrees"
 zin_shared_concord_dominions_lords_moot_2_desc:0 "The lords reach a decision without a drawn sword, and the moot's word becomes the law of the land."
 zin_shared_concord_dominions_lords_moot_desc:0 "Landholders meet beneath the old oak and speak in order of seniority."
 zin_shared_concord_dominions_march_walls:0 "March Walls"
 zin_shared_concord_dominions_march_walls_desc:0 "A free land has no friend to cover its borders, so [ROOT.GetName] raises walls. The masons work from first light, and the lords send their own sons to carry stone."
 zin_shared_concord_dominions_market_charter:0 "Market Charter"
 zin_shared_concord_dominions_market_charter_desc:0 "A weekly market is given its charter, with a bell, a scale and a reeve to settle quarrels. Farmers, carters and tinkers from three days around come to trade in the capital of [ROOT.GetName]."
 zin_shared_concord_dominions_middle_kingdom_levies:0 "Middle Kingdom Levies"
 zin_shared_concord_dominions_middle_kingdom_levies_desc:0 "The old levy rolls of the Middle Kingdom are brought out of the chest and read in every parish. [ROOT.GetName] finds that its muster is larger than anyone remembered."
 zin_shared_concord_dominions_ocean_route:0 "The Ocean Route"
 zin_shared_concord_dominions_ocean_route_desc:0 "Charts are drawn and steersmen trained for the long passage, and the harbour sees sails it never saw before."
 zin_shared_concord_dominions_old_customs:0 "Old Customs"
 zin_shared_concord_dominions_old_customs_desc:0 "The ancient rites of [ROOT.GetName] are written down at last: how a lord is made, how a quarrel is judged, how a guest is fed. Having them on parchment makes the elders prouder and the young more patient."
 zin_shared_concord_dominions_old_kin:0 "The Kin Stand with Us"
 zin_shared_concord_dominions_old_kin_desc:0 "Giants and tree-folk stand beside the spearmen, and no enemy has seen such a line."
 zin_shared_concord_dominions_petition_for_a_free_charter:0 "Petition for a Free Charter"
 zin_shared_concord_dominions_petition_for_a_free_charter_desc:0 "The lords of [ROOT.GetName] draft a petition to Parim, asking for the rights of a free dominion: its own law, its own levy, its own purse. The crown has granted such letters before, but never gladly."
 zin_shared_concord_dominions_privileges_bought_in_parim:0 "Privileges Bought in Parim"
 zin_shared_concord_dominions_privileges_bought_in_parim_desc:0 "Parim sells its favours to those who can pay, and [ROOT.GetName] sends a purse to the right clerk. A golden charter is not cheap, but it is the cheapest way to be left alone."
 zin_shared_concord_dominions_prosperous_land:0 "A Prosperous Land"
 zin_shared_concord_dominions_prosperous_land_desc:0 "Roads busy, barns full and guildhalls ringing; the dominion has more than it needs."
 zin_shared_concord_dominions_refugees_on_the_roads:0 "Refugees on the Roads"
 zin_shared_concord_dominions_refugees_on_the_roads_desc:0 "Families from the fallen lands come up the roads with what they can carry. [ROOT.GetName] must decide whether to open its gates to them."
 zin_shared_concord_dominions_road_wardens:0 "Wardens of the Roads"
 zin_shared_concord_dominions_road_wardens_desc:0 "Riders in green cloaks keep the roads safe by day and lit by night."
 zin_shared_concord_dominions_roads_to_the_lake:0 "Roads to the Great Lake"
 zin_shared_concord_dominions_roads_to_the_lake_desc:0 "Barges and wagons carry grain and timber toward the Great Lake, and the road is widened to match. Every mile of new paving brings the markets of [ROOT.GetName] closer to the heart of the kingdom."
 zin_shared_concord_dominions_seat_at_the_concord_council:0 "A Seat at the Concord Council"
 zin_shared_concord_dominions_seat_at_the_concord_council_desc:0 "The Concord holds its council beside the Great Lake, and every chartered dominion may send a speaker. [ROOT.GetName] sends its most patient elder, for the council hears what is said slowly."
 zin_shared_concord_dominions_ships_for_the_concord:0 "Ships for the Concord"
 zin_shared_concord_dominions_ships_for_the_concord_desc:0 "The dominion's shipwrights lay down war galleys for the Concord fleet. Oarsmen are recruited among the fishers, who need little persuasion when the pay is regular."
 zin_shared_concord_dominions_smithies:0 "The Smithies"
 zin_shared_concord_dominions_smithies_desc:0 "Good iron needs good charcoal and a smith who knows its moods. The armourers of [ROOT.GetName] raise a new forge-row and send for pattern books from the Great Lake."
 zin_shared_concord_dominions_southern_forts:0 "Southern Forts"
 zin_shared_concord_dominions_southern_forts_desc:0 "A line of stone towers is raised along the southern border, each within a day's ride of the next. Their garrisons live on cheese and salt pork and watch the horizon."
 zin_shared_concord_dominions_southern_watch:0 "Watch on the South"
 zin_shared_concord_dominions_southern_watch_desc:0 "Pickets on every southern pass look out over the Ember Lands."
 zin_shared_concord_dominions_stone_forts:0 "Stone Forts"
 zin_shared_concord_dominions_stone_forts_desc:0 "Border towers and gate-keeps are rebuilt in cut stone, with deep ditches and walls three men thick. [ROOT.GetName] intends to be there when the next wave breaks."
 zin_shared_concord_dominions_swords_for_the_coalition:0 "Swords for the Coalition"
 zin_shared_concord_dominions_swords_for_the_coalition_desc:0 "A host has risen against the dead, and it asks for swords from every realm that will give them. [ROOT.GetName] sends what it can spare, and the rest of its men besides."
 zin_shared_concord_dominions_temples_and_almshouses:0 "Temples and Almshouses"
 zin_shared_concord_dominions_temples_and_almshouses_desc:0 "The almoners of the Deliverer ask leave to open houses in the market-towns of [ROOT.GetName]: a hospital, a grain store and a hall for the aged. The lords weigh the cost against the goodwill."
 zin_shared_concord_dominions_the_charter_read_aloud:0 "The Charter Read Aloud"
 zin_shared_concord_dominions_the_charter_read_aloud_desc:0 "Heralds ride from steading to steading to read the Charter to people who cannot read it themselves. The folk of [ROOT.GetName] hear what they are owed, and what they owe, in plain words."
 zin_shared_concord_dominions_the_dark_comes:0 "The Dark Comes"
 zin_shared_concord_dominions_the_dark_comes_desc:0 "Word comes by courier, by beacon and by refugee that war has broken out on every side. [ROOT.GetName] has never been so afraid, and has never been so united."
 zin_shared_concord_dominions_the_dark_comes_spirit:0 "The Dark Comes"
 zin_shared_concord_dominions_the_dark_comes_spirit_desc:0 "Every wall is raised another course, every gate barred twice. The dominion has never been so afraid, or so united."
 zin_shared_concord_dominions_the_dominion_guard:0 "The [ROOT.GetAdjective] Guard"
 zin_shared_concord_dominions_the_dominion_guard_desc:0 "A standing guard is raised in the capital of [ROOT.GetName], armed from the dominion's own armoury and paid from its own purse. It wears the dominion's colours and knows every road by name."
 zin_shared_concord_dominions_the_dominion_host:0 "The Dominion Host"
 zin_shared_concord_dominions_the_dominion_host_desc:0 "Every banner of [ROOT.GetName] is called to a single muster, and the host that gathers fills the meadow from hedge to hedge. It will not win a war alone, but it will hold a river crossing."
 zin_shared_concord_dominions_the_free_council:0 "The Free Council"
 zin_shared_concord_dominions_the_free_council_desc:0 "The burghers of [ROOT.GetName] meet in the guildhall and vote by show of hands. Speakers are chosen by lot from every guild, and no decree stands that the council has not heard."
 zin_shared_concord_dominions_the_golden_king_is_dead:0 "The Golden King Is Dead"
 zin_shared_concord_dominions_the_golden_king_is_dead_desc:0 "The bells of Parim have tolled, and the king is gone. The lords of [ROOT.GetName] gather in the hall to decide what a dominion owes a throne that sits empty."
 zin_shared_concord_dominions_the_governors_men:0 "The Governor's Men"
 zin_shared_concord_dominions_the_governors_men_desc:0 "A household of clerks, bailiffs and guardsmen follows the governor, and the dominion learns to obey them quickly. They are efficient, and they are not loved."
 zin_shared_concord_dominions_the_kin_stand_with_us:0 "The Kin Stand with Us"
 zin_shared_concord_dominions_the_kin_stand_with_us_desc:0 "Giants and tree-folk take their places beside the dominion's spearmen, and the host of [ROOT.GetName] grows taller by a head. No enemy has seen such a line."
 zin_shared_concord_dominions_the_kings_highway:0 "The King's Highway"
 zin_shared_concord_dominions_the_kings_highway_desc:0 "A paved road runs from the capital of [ROOT.GetName] to the nearest crown road, built by corvee and paid for by the crown. Wagons, couriers and companies of foot now cross the dominion in half the time."
 zin_shared_concord_dominions_the_lords_moot:0 "The Lords' Moot"
 zin_shared_concord_dominions_the_lords_moot_desc:0 "The landholders of [ROOT.GetName] meet beneath the old oak and speak in order of seniority. Disputes are settled by custom, and custom is whatever the oldest lord remembers."
 zin_shared_concord_dominions_the_moot_agrees:0 "The Moot Agrees"
 zin_shared_concord_dominions_the_moot_agrees_desc:0 "For the first time in memory the lords of [ROOT.GetName] reach a decision without a single drawn sword. The moot's word becomes the law of the land, and the lords accept it."
 zin_shared_concord_dominions_the_ocean_route:0 "The Ocean Route"
 zin_shared_concord_dominions_the_ocean_route_desc:0 "Charts are drawn and steersmen trained for the long passage over open water. Trade with distant coasts begins, and the harbour of [ROOT.GetName] sees sails it has never seen before."
 zin_shared_concord_dominions_the_old_kin_of_the_land:0 "The Old Kin of the Land"
 zin_shared_concord_dominions_the_old_kin_of_the_land_desc:0 "The older peoples of the land, who were here before the charters, are asked to the council fire. They come slowly and speak little, and the elders of [ROOT.GetName] listen well."
 zin_shared_concord_dominions_the_wall_road:0 "The Wall Road"
 zin_shared_concord_dominions_the_wall_road_desc:0 "The road along the Great Wall is old, and the elves on the other side have always been polite to those who travel it in peace. [ROOT.GetName] opens its own stretch to wagons from both sides."
 zin_shared_concord_dominions_trained_levies:0 "Levies Trained"
 zin_shared_concord_dominions_trained_levies_desc:0 "The village green is a drill-ground on every feast day, and the drill-masters know their trade."
 zin_shared_concord_dominions_wall_road_trade:0 "The Wall Road"
 zin_shared_concord_dominions_wall_road_trade_desc:0 "Wagons from both sides of the Great Wall use the same road in peace."
 zin_shared_concord_dominions_wardens_of_the_roads:0 "Wardens of the Roads"
 zin_shared_concord_dominions_wardens_of_the_roads_desc:0 "Riders in green cloaks patrol the roads of [ROOT.GetName], carrying lanterns by night and warrants by day. Robbers and rumour-mongers alike have learned to fear them."
 zin_shared_concord_dominions_watch_on_the_south:0 "Watch on the South"
 zin_shared_concord_dominions_watch_on_the_south_desc:0 "South of [ROOT.GetName], the road leads into the Ember Lands. Pickets are posted on every pass, and the old men tell the young what lies on the other side."
 zin_shared_concord_dominions.1.a:0 "Confirm the old charter"
 zin_shared_concord_dominions.1.b:0 "Grant the charter"
 zin_shared_concord_dominions.1.c:0 "Refuse"
 zin_shared_concord_dominions.1.d:0 "The seal-bearer of [FROM.GetName] lays a sealed petition before the chancery. The dominion asks that its charter be changed, and the clerks have drawn up the deed for a ready hand to sign."
 zin_shared_concord_dominions.1.t:0 "A Petition from [FROM.GetName]"
 zin_shared_concord_dominions.2.a:0 "So it is sealed"
 zin_shared_concord_dominions.2.d:0 "A rider in the livery of Parim arrives with the new charter, its wax still soft. The seal is whole, the terms are plain, and the town clerk reads them aloud from the steps of the hall."
 zin_shared_concord_dominions.2.t:0 "Parim Grants the Charter"
 zin_shared_concord_dominions.3.a:0 "Parim has dominions enough"
 zin_shared_concord_dominions.3.b:0 "Grant the Charters of Parim"
 zin_shared_concord_dominions.3.d:0 "Envoys from [FROM.GetName] wait in the antechamber of the royal court, bearing gifts and a request to be numbered among the chartered dominions. The keeper of the seal has their petition in hand and looks to the throne for an answer."
 zin_shared_concord_dominions.3.t:0 "[FROM.GetName] Asks for a Charter"
 zin_shared_concord_dominions.4.a:0 "Grant it"
 zin_shared_concord_dominions.4.b:0 "Politely refuse"
 zin_shared_concord_dominions.4.d:0 "The almoners of the Houses of the First Light have found a site for a new house of healing and ask the court for the land. They bring bread, ledgers and no complaints."
 zin_shared_concord_dominions.4.t:0 "The Almoners Ask for Land"
 zin_shared_concord_dominions.5.a:0 "Open the gates"
 zin_shared_concord_dominions.5.b:0 "Close the roads"
 zin_shared_concord_dominions.5.d:0 "Wagons loaded with bedding, children and frightened livestock fill the road to the gates of [ROOT.GetName]. The gatewardens look to the council to say whether they are to be let in."
 zin_shared_concord_dominions.5.t:0 "Refugees on the Roads"
 zin_shared_concord_dominions.6.a:0 "Confirm the old charter"
 zin_shared_concord_dominions.6.b:0 "Refuse"
 zin_shared_concord_dominions.6.d:0 "The petition of [FROM.GetName] lies on the table, but the clerks advise that the charter it asks for cannot be granted now. The treasury is closed to such a change, and the last alteration is too recent to answer."
 zin_shared_concord_dominions.6.t:0 "A Petition from [FROM.GetName]"
 zin_shared_concord_dominions.7.a:0 "As it was written"
 zin_shared_concord_dominions.7.d:0 "A courier from Parim brings the dominion's old charter back, newly signed and sealed. Nothing has changed, but the crown has said it twice."
 zin_shared_concord_dominions.7.t:0 "Parim Confirms the Old Charter"
 zin_shared_concord_dominions.8.a:0 "So be it"
 zin_shared_concord_dominions.8.d:0 "The seal-bearer returns with the petition unopened and the royal answer in two curt lines. The lords of the dominion read it in silence."
 zin_shared_concord_dominions.8.t:0 "Parim Refuses"
