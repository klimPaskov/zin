l_english:
 zin_regional_selen_a_treaty_not_a_crown:0 "A Treaty, Not a Crown"
 zin_regional_selen_a_treaty_not_a_crown_desc:0 "After the coronation Selen drops the name of the Host and stays a free realm, bound to the new crown by treaty and not by charter. The wardens go home, and the lodges open their doors again."
 zin_regional_selen_alleria_investigates:0 "Alleria Investigates"
 zin_regional_selen_alleria_investigates_desc:0 "Alleria has seen a traveller at the edge of the greenwood who does not move like a common man. She follows him by night and begins to wonder who the Stranger is."
 zin_regional_selen_alleria_s_company:0 "Alleria's Company"
 zin_regional_selen_alleria_s_company_desc:0 "Alleria of Selen, ranger and archer, gathers a company of the finest woodsmen of the coast. They answer to no lord but the Warden of Selen, and ask very little of him."
 zin_regional_selen_armouries_of_selen:0 "The Armouries of Selen"
 zin_regional_selen_armouries_of_selen_desc:0 "Great armouries rise in the river towns, stocked with mail, spears and long ranger-bows. They are meant to be quiet places, and they are not."
 zin_regional_selen_break_the_charter:0 "Break the Charter"
 zin_regional_selen_break_the_charter_desc:0 "Selen declares the Charter void and leaves the Concord, taking its rangers, its university and its grievances. It is a bitter choice, and a long time coming."
 zin_regional_selen_companies_for_the_league:0 "Companies for the League"
 zin_regional_selen_companies_for_the_league_desc:0 "Selen raises companies for the Golden King's league against the dark. They march south in good order and write home that the frontier is as quiet as the grave."
 zin_regional_selen_count_the_almoners:0 "Count the Almoners"
 zin_regional_selen_count_the_almoners_desc:0 "A ranger-captain quietly counts the Houses of the First Light in Selen: how many, where, and how well they are supplied. The Deliverer's almoners are generous, and generosity has a price."
 zin_regional_selen_eyes_on_the_south:0 "Eyes on the South"
 zin_regional_selen_eyes_on_the_south_desc:0 "Rangers go quietly beyond the frontier posts and come back with dust on their boots and odd tales. The tales are too regular to be dismissed."
 zin_regional_selen_fields_and_forges:0 "Fields and Forges"
 zin_regional_selen_fields_and_forges_desc:0 "Selen's river valleys are green and its smiths are patient. A new workshop is raised at the capital, beside the mill-race, in sight of the fields it serves."
 zin_regional_selen_first_among_dominions:0 "First Among the Dominions"
 zin_regional_selen_first_among_dominions_desc:0 "Selen speaks for dominions that will not speak for themselves."
 zin_regional_selen_for_order_in_parim:0 "For Order in Parim"
 zin_regional_selen_for_order_in_parim_desc:0 "Selen declares for order. The Concord has lasted seventeen centuries, and the wardens will not be the ones to break it, whoever sits in Parim."
 zin_regional_selen_for_the_free_dominions:0 "For the Free Dominions"
 zin_regional_selen_for_the_free_dominions_desc:0 "Selen throws its weight behind the dominions who would have their charters back. The Golden Court reads the news in silence, and does not forget it."
 zin_regional_selen_for_the_strangers_host:0 "For the Stranger's Host"
 zin_regional_selen_for_the_strangers_host_desc:0 "Selen sends word to the Stranger's popular host that the greenwood will stand with it. The wardens have chosen their side, and it is not the one with the palace."
 zin_regional_selen_free_banners:0 "Free Banners of Selen"
 zin_regional_selen_free_banners_desc:0 "Green banners on a white field, and rangers who need no order to hold them."
 zin_regional_selen_free_banners_of_selen:0 "Free Banners of Selen"
 zin_regional_selen_free_banners_of_selen_desc:0 "Selen raises banners that belong to no king: the green stag of the wardens on a white field. Wherever they are carried, the greenwood goes with them."
 zin_regional_selen_frontier_hub:0 "The Frontier Hub"
 zin_regional_selen_frontier_hub_desc:0 "Selen is the meeting-place of the frontier companies, and its captains know it."
 zin_regional_selen_granaries_of_selen:0 "The Granaries of Selen"
 zin_regional_selen_granaries_of_selen_desc:0 "Great granaries are built at the river crossings and filled each autumn. A winter in Selen is never a hungry one."
 zin_regional_selen_greenwood_ways:0 "The Greenwood Ways"
 zin_regional_selen_greenwood_ways_desc:0 "Every trail has a name and every child knows it; strangers lose their way, and the wardens lose none of theirs."
 zin_regional_selen_harions_country:0 "Harion's Country"
 zin_regional_selen_harions_country_desc:0 "Harion the Restorer was Selen's son before he was Aenor's king. Every Thaw the wardens keep the Restorer's Day, and every child of Selen is told whose country this is."
 zin_regional_selen_harions_heirs:0 "Harion's Heirs"
 zin_regional_selen_harions_heirs_desc:0 "The wardens claim no crown, but they honour the line of Harion in every hall of Selen. A land that remembers its king is a land that does not forget itself."
 zin_regional_selen_heed_the_warning:0 "Heed the Warning"
 zin_regional_selen_heed_the_warning_desc:0 "The Stranger speaks of a darkness in the south and a king who cannot hear it. Selen's wardens have listened to stranger things, and have learned to take warning seriously."
 zin_regional_selen_hunters_of_the_coast:0 "Hunters of the Coast"
 zin_regional_selen_hunters_of_the_coast_desc:0 "The coast road is watched by hunters who know the tides and the smugglers' coves. They have found strange campfires and stranger company."
 zin_regional_selen_keep_him_hidden:0 "Keep Him Hidden"
 zin_regional_selen_keep_him_hidden_desc:0 "Rangers cover the Stranger's tracks, change his lodging each night and answer all questions with a shrug. Anyone who comes asking will find only trees."
 zin_regional_selen_lake_trade:0 "Trade with the Great Lake"
 zin_regional_selen_lake_trade_desc:0 "Barge-loads of grain and cloth cross the Great Lake, and goodwill returns with the empties."
 zin_regional_selen_lodges_on_every_road:0 "Lodges on Every Road"
 zin_regional_selen_lodges_on_every_road_desc:0 "A lodge is raised at every crossroads, with a hearth, a rack of bows and a map on the wall. A ranger who reaches one is never more than a day from help."
 zin_regional_selen_men_of_selen:0 "The Men of Selen"
 zin_regional_selen_men_of_selen_desc:0 "The men of Selen take their place in the Stranger's coalition, with their own banners and their own captains. They came on foot, and they came from every glade."
 zin_regional_selen_mourning_in_selen:0 "Mourning in Selen"
 zin_regional_selen_mourning_in_selen_desc:0 "The Golden King is dead, and Selen mourns him as it mourned the kings before. The wardens close the lodges for thirty days and think about what comes after."
 zin_regional_selen_oath_to_the_heir:0 "An Oath to the Heir"
 zin_regional_selen_oath_to_the_heir_desc:0 "On the old stone of Harion the wardens of Selen swear to the Heir. It is an oath of men who have chosen with open eyes, and who know what it may cost them."
 zin_regional_selen_peace_of_the_wardens:0 "The Wardens' Peace"
 zin_regional_selen_peace_of_the_wardens_desc:0 "A free realm under a treaty, and builders at work on every lodge."
 zin_regional_selen_petition_for_the_old_liberties:0 "Petition for the Old Liberties"
 zin_regional_selen_petition_for_the_old_liberties_desc:0 "Selen asks Parim, in the Charters' own words, for the liberties its people held in the days of Harion. The Golden Court will read it and be polite."
 zin_regional_selen_proof_in_the_rolls:0 "Proof in the Old Rolls"
 zin_regional_selen_proof_in_the_rolls_desc:0 "The University's oldest rolls are laid beside the Stranger's own tale. The lines agree, to the letter, and for the first time in years the scholars of Selen forget to be careful."
 zin_regional_selen_ranger_lodges:0 "Ranger Lodges"
 zin_regional_selen_ranger_lodges_2:0 "Lodges on Every Road"
 zin_regional_selen_ranger_lodges_2_desc:0 "A lodge at every crossroads: rangers are never far from shelter, a map or a friend."
 zin_regional_selen_ranger_lodges_desc:0 "Hearths and bow-racks in the greenwood school the finest woodsmen in the Concord."
 zin_regional_selen_ranger_watch:0 "The Rangers Keep Watch"
 zin_regional_selen_ranger_watch_desc:0 "Patrols watch the southern road day and night."
 zin_regional_selen_rangers_of_selen:0 "The Rangers of Selen"
 zin_regional_selen_rangers_of_selen_desc:0 "Selen is the land of rangers. Every hill farm sends a son or a daughter to the greenwood, and the lodges that school them are older than the Charters of Parim."
 zin_regional_selen_restorers_land_2:0 "Harion's Heirs"
 zin_regional_selen_restorers_land_2_desc:0 "The line of Harion is honoured in every hall, and the wardens stand a little straighter."
 zin_regional_selen_river_mills:0 "River Mills"
 zin_regional_selen_river_mills_desc:0 "Mill-wheels turn on every stream, grinding grain, sawing timber and fulling cloth. The valley roads are widened to carry what they make."
 zin_regional_selen_rumours_of_an_heir:0 "Rumours of an Heir"
 zin_regional_selen_rumours_of_an_heir_desc:0 "Scholars of the First Men have heard that the line of kings did not die out. Letters pass between the university and a few trusted lodges, and the wardens begin to listen."
 zin_regional_selen_scholars_of_the_first_men:0 "Scholars of the First Men"
 zin_regional_selen_scholars_of_the_first_men_desc:0 "The university's scholars study the genealogies of the First Men and the lines of their kings. They are few, and what they find, they keep in cases and lock."
 zin_regional_selen_selen_granaries:0 "The Granaries of Selen"
 zin_regional_selen_selen_granaries_desc:0 "Great granaries and full barns keep the valleys fed and quiet."
 zin_regional_selen_selen_under_arms:0 "Selen Under Arms"
 zin_regional_selen_selen_under_arms_desc:0 "Horns sound in every lodge of the greenwood, and rangers who have not left their glades in years take down their bows. Selen is going to war."
 zin_regional_selen_selen_under_arms_spirit:0 "Selen Under Arms"
 zin_regional_selen_selen_under_arms_spirit_desc:0 "Every lodge is a muster-point and every ranger carries a bow."
 zin_regional_selen_shelter_of_the_stranger:0 "The Stranger Sheltered"
 zin_regional_selen_shelter_of_the_stranger_desc:0 "A guest in the greenwood is a secret all the glades keep together."
 zin_regional_selen_smithies_of_selen:0 "The Smithies of Selen"
 zin_regional_selen_smithies_of_selen_desc:0 "Smiths set up beside the mill-races, where the water drives the hammers. Selen's iron is not the finest, but there is a great deal of it."
 zin_regional_selen_the_coast_watch:0 "The Coast Watch"
 zin_regional_selen_the_coast_watch_desc:0 "The coast is watched by beacon, by boat and by patrol. Selen will see a keel on the horizon before the harbour-master does."
 zin_regional_selen_the_frontier_hub:0 "The Frontier Hub"
 zin_regional_selen_the_frontier_hub_desc:0 "Selen becomes the meeting-place of the league's frontier companies, with a map-hall in its capital and a court of captains who argue in front of it."
 zin_regional_selen_the_frontier_watch:0 "The Frontier Watch"
 zin_regional_selen_the_frontier_watch_desc:0 "Selen sends its best rangers to the Lost Cause's frontier companies, the one part of the league that is real. They watch the road south and report what they see."
 zin_regional_selen_the_greenwood_ways:0 "The Greenwood Ways"
 zin_regional_selen_the_greenwood_ways_desc:0 "Selen's rangers have a hundred names for the trails of the greenwood, and they have taught them all to their children. No stranger finds the right path by accident."
 zin_regional_selen_the_kings_taxes:0 "The King's Taxes"
 zin_regional_selen_the_kings_taxes_desc:0 "Parim's tax-farmers arrive each autumn with a new levy and the same smile. Selen pays, as it always has, and counts the cost twice."
 zin_regional_selen_the_long_patrol:0 "The Long Patrol"
 zin_regional_selen_the_long_patrol_desc:0 "Rangers walk the whole border in a single season, from the coast to the hills, and sleep in no bed twice. They return with maps, and with knowledge nobody in Parim has asked for."
 zin_regional_selen_the_old_service_passages:0 "The Old Service Passages"
 zin_regional_selen_the_old_service_passages_desc:0 "Alleria remembers the tunnels the palace servants once used, and the rangers know where each one ends. A way into Parim is found that the palace guard has long forgotten."
 zin_regional_selen_the_ploughmens_roads:0 "The Ploughmen's Roads"
 zin_regional_selen_the_ploughmens_roads_desc:0 "The farmers of Selen pave their own lanes, stone by stone, and in a season the whole valley is linked by roads a cart can use in any weather."
 zin_regional_selen_the_rangers_shelter:0 "The Rangers' Shelter"
 zin_regional_selen_the_rangers_shelter_desc:0 "The Stranger is lodged in the hall of a ranger, among the quiet and the observant. No one in the greenwood will say that he is there, and no one has to."
 zin_regional_selen_the_ravine_road:0 "The Ravine Road"
 zin_regional_selen_the_ravine_road_desc:0 "Rangers comb the cliff paths below the palace, calling the Stranger's name down every gully. They find nothing at first, and they go on looking."
 zin_regional_selen_the_restorers_land:0 "The Restorer's Land"
 zin_regional_selen_the_restorers_land_desc:0 "Harion's country remembers its king, and does not forget itself."
 zin_regional_selen_the_wardens_moot:0 "The Wardens' Moot"
 zin_regional_selen_the_wardens_moot_desc:0 "The wardens meet each season at the old stone circle, to settle what the Warden may and may not decide alone. The list of what he may not is the longer one."
 zin_regional_selen_trade_with_the_lake:0 "Trade with the Great Lake"
 zin_regional_selen_trade_with_the_lake_desc:0 "Barges carry Selen's grain and cloth across the Great Lake to Parim and bring back coin, lamp-tallow and news. The wardens like the coin and the news equally."
 zin_regional_selen_university_of_selen:0 "The University of Selen"
 zin_regional_selen_university_of_selen_desc:0 "Founded beside Parim's in 4A 340, the University of Selen keeps old genealogies, older maps and a few scholars who still read them. It is the only place in the Concord where one may ask a hard question."
 zin_regional_selen_university_of_selen_spirit:0 "The University of Selen"
 zin_regional_selen_university_of_selen_spirit_desc:0 "A university where a hard question may be asked, and sometimes answered."
 zin_regional_selen_voice_of_the_dominions:0 "A Voice for the Dominions"
 zin_regional_selen_voice_of_the_dominions_desc:0 "Selen offers to speak for the dominions at the Concord Council when they do not wish to speak for themselves. Few will say yes, and many will remember who asked."
 zin_regional_selen_warden_host:0 "The Warden Host"
 zin_regional_selen_warden_host_desc:0 "When the Warden of Selen sounds the horn, the rangers of every lodge assemble beneath his banner. It is a small host, and a very hard one to catch."
 zin_regional_selen_warden_host_spirit:0 "The Warden Host"
 zin_regional_selen_warden_host_spirit_desc:0 "The rangers of every lodge muster beneath the Warden's banner."
 zin_regional_selen_wardens_moot:0 "The Wardens' Moot"
 zin_regional_selen_wardens_moot_desc:0 "The wardens settle what the Warden may not decide alone."
 zin_regional_selen_woodcraft_and_bow:0 "Woodcraft and Bow"
 zin_regional_selen_woodcraft_and_bow_desc:0 "Selen's bowyers and its woodsmen share what they know. A bow drawn by a ranger who understands the grain of the stave outshoots any other."
 zin_regional_selen.1.a:0 "Enlist them."
 zin_regional_selen.1.b:0 "Send them to the Houses."
 zin_regional_selen.1.c:0 "Hang the leaders."
 zin_regional_selen.1.d:0 "A band of landless men has camped on the coast road, and the rangers do not know whether they are brigands or only hungry. The wardens must decide what Selen does with those who have nothing."
 zin_regional_selen.1.t:0 "The Rangers' Reports"
 zin_regional_selen.2.a:0 "Pay it."
 zin_regional_selen.2.b:0 "Protest to the Moot."
 zin_regional_selen.2.d:0 "Parim's tax-farmers have come with a new levy and the same smile. The Warden may pay it without a word, or he may take the matter to the Moot and have it recorded with the others."
 zin_regional_selen.2.t:0 "The King's Taxes"
 zin_regional_selen.3.a:0 "Keep the rangers watching."
 zin_regional_selen.3.b:0 "Send word to Parim."
 zin_regional_selen.3.d:0 "Rangers on the southern road report dust on the horizon, and the dust has been there every morning for a week. Beyond Herez the roads are being used by someone who does not wish to be seen."
 zin_regional_selen.3.t:0 "Rumours from the South"
 zin_regional_selen.4.a:0 "Keep it among the rangers."
 zin_regional_selen.4.b:0 "Bring him before the Moot."
 zin_regional_selen.4.d:0 "Alleria has walked with the Stranger for a month, and she believes that he is [zin_loc_eindil], son of Ein. She asks the Moot whether the wardens should stand with him openly, or whether it is better that the rangers alone know."
 zin_regional_selen.4.t:0 "Alleria's Report"
