l_english:
 zin_regional_horidor_a_seat_at_the_moot_fire:0 "A Seat at the Moot Fire"
 zin_regional_horidor_a_seat_at_the_moot_fire_desc:0 "A valley elder is given a seat at the moot's fire, to listen though not to vote. It costs Horidor nothing, and it makes friends of neighbours who would otherwise be strangers."
 zin_regional_horidor_accord_shield:0 "Shield of the Accord"
 zin_regional_horidor_accord_shield_desc:0 "Horidor stands in the Northern Accord and its borders are watched by friends. The cost is a share of every decision, and the benefit is a shield on the south and east."
 zin_regional_horidor_accord_war_council:0 "The Accord's War Council"
 zin_regional_horidor_accord_war_council_desc:0 "The Accord's captains meet at Fandanar over a table of carved ridges, and Horidor's chiefs show the passes by name. When they ride home, both sides know the other's drill."
 zin_regional_horidor_beside_fandanar:0 "Beside Fandanar"
 zin_regional_horidor_beside_fandanar_desc:0 "Horidor has chosen the Winter Crown's side in the war of the south, without marching beyond its own passes. The highlands hold, and the moot is easy in its conscience."
 zin_regional_horidor_cairn_wardens:0 "Cairn Wardens"
 zin_regional_horidor_cairn_wardens_desc:0 "Each cairn names a warden to guard the passes under it, armed from the cairn's own stores. Better spears are forged for them, and they carry them with pride."
 zin_regional_horidor_chiefs_of_the_cairns:0 "Chiefs of the Cairns"
 zin_regional_horidor_chiefs_of_the_cairns_desc:0 "Every glen has its chief and every chief a cairn, and the moot is where the cairns are counted. Horidor is slow to decide and very slow to be moved."
 zin_regional_horidor_clan_levies:0 "The Clan Levies"
 zin_regional_horidor_clan_levies_desc:0 "When the horn sounds from the moot-ground, every glen sends its quota of spearmen. They bring their own blankets and bread, and they bring their cousins."
 zin_regional_horidor_granite_and_iron:0 "Granite and Iron"
 zin_regional_horidor_granite_and_iron_desc:0 "The high cliffs yield granite for walls and the deep seams yield iron for blades. The moot allots the quarries by lot, so that no cairn grows richer than its neighbour."
 zin_regional_horidor_high_pass_scouts:0 "High-Pass Scouts"
 zin_regional_horidor_high_pass_scouts_desc:0 "Maela Highcairn teaches the scouts who watch the passes, and teaches them to read the snow like a page. A column that cannot be seen cannot be struck."
 zin_regional_horidor_highland_envoys:0 "Highland Envoys"
 zin_regional_horidor_highland_envoys_desc:0 "Highland envoys sit in the Winter Crown's councils as equals, and say so. They carry back what they hear, and the moot weighs it before it acts."
 zin_regional_horidor_highland_herds:0 "Herds of the High Pastures"
 zin_regional_horidor_highland_herds_desc:0 "Shaggy cattle and mountain sheep graze the high pastures from thaw to first frost, and the herd-wives know every beast by its voice. The wool, hide and cheese of Horidor go down the roads to the markets."
 zin_regional_horidor_highland_host:0 "The Highland Host"
 zin_regional_horidor_highland_host_desc:0 "The clan levies march under one banner, in step to the pipes of the moot. A highland host strikes hard on the first morning, when its blood is up."
 zin_regional_horidor_highland_moot:0 "The Highland Moot"
 zin_regional_horidor_highland_moot_desc:0 "Under the open sky, on a plateau ringed with cairns, the chiefs of Horidor meet to hear Chieftain Ollon and to say what he does not wish to hear. Nothing is decided that the moot has not heard."
 zin_regional_horidor_highland_moot_united:0 "One Moot, One Voice"
 zin_regional_horidor_highland_moot_united_desc:0 "The chiefs still quarrel, but they quarrel inside the moot and leave it speaking as one. Envoys from abroad have learned to ask for the moot, not for any single chief."
 zin_regional_horidor_highland_stores:0 "Highland Stores"
 zin_regional_horidor_highland_stores_desc:0 "Cold stone cellars are dug into the hillsides and filled with barley, cheese and salted mutton. When the winters come hard, Horidor feeds its own and has something to spare."
 zin_regional_horidor_highlanders_beside_the_heir:0 "Highlanders Beside the Heir"
 zin_regional_horidor_highlanders_beside_the_heir_desc:0 "The highland spears go south to stand beside the host of the returned heir. They carry the banners of the cairns and march in step to a tune their grandfathers sang."
 zin_regional_horidor_hill_forts:0 "Hill Forts"
 zin_regional_horidor_hill_forts_desc:0 "Stone forts rise at the heads of the passes, each with a spring inside its walls. A fort on a high pass can be held by a handful against a host."
 zin_regional_horidor_king_of_the_cairns:0 "King of the Cairns"
 zin_regional_horidor_king_of_the_cairns_desc:0 "A heap of stones is raised at the moot-ground, taller than any cairn, and the chiefs name it the King's Cairn. Whoever sits beside it is more than a chieftain."
 zin_regional_horidor_left_accord:0 "Left the Accord"
 zin_regional_horidor_markets_for_the_valleys:0 "Markets for the Valleys"
 zin_regional_horidor_markets_for_the_valleys_desc:0 "Horidor builds a market at the foot of each great pass, free of toll for a season. The valley folk come to sell cheese and stay to hear the moot's news."
 zin_regional_horidor_ollons_hearth:0 "Ollon's Hearth"
 zin_regional_horidor_ollons_hearth_desc:0 "Ollon keeps a long hearth in the highland hall, and Old Tarvo, the Keeper of the Cairns, sits at its head. He remembers every oath ever sworn in Horidor and the name of every man who broke one."
 zin_regional_horidor_one_moot_one_voice:0 "One Moot, One Voice"
 zin_regional_horidor_one_moot_one_voice_desc:0 "At the autumn gathering the chiefs bind themselves to speak abroad with one voice, decided in the moot. It is the first time in a lifetime that every cairn has agreed on anything."
 zin_regional_horidor_our_own_hearth:0 "Our Own Hearth"
 zin_regional_horidor_our_own_hearth_desc:0 "The moot hangs the highland banner above Ollon's hearth and swears to keep it there. No friend is turned away, and none is let sit in the high seat."
 zin_regional_horidor_own_hearth:0 "Our Own Hearth"
 zin_regional_horidor_own_hearth_desc:0 "Horidor warms itself at its own fire and asks no crown for leave. The chiefs are proud of it, and the cold has made them proud of little else."
 zin_regional_horidor_pass_scouts:0 "High-Pass Scouts"
 zin_regional_horidor_pass_scouts_desc:0 "Scouts who have walked every pass since boyhood read the weather in the colour of the ridge. They are seldom surprised, and never twice."
 zin_regional_horidor_ride_with_the_white_companies:0 "Ride with the White Companies"
 zin_regional_horidor_ride_with_the_white_companies_desc:0 "If the White Companies ride south, some highland chiefs mean to ride with them. They have heard what the dark is doing, and they will not let it be said that Horidor stayed by its fire."
 zin_regional_horidor_shield_of_the_accord:0 "Shield of the Accord"
 zin_regional_horidor_shield_of_the_accord_desc:0 "Ollon speaks for the shield. An Accord of equals keeps the passes safe and the herds fat, and Fandanar has never yet asked a highland chief to bend."
 zin_regional_horidor_stand_with_fandanar:0 "Stand with Fandanar"
 zin_regional_horidor_stand_with_fandanar_desc:0 "Horidor stands beside the Winter Crown, in the passes and at the moot, and says so openly. The highlanders will not march south, but no foe will pass them northward."
 zin_regional_horidor_the_accord_question:0 "The Accord Question"
 zin_regional_horidor_the_accord_question_desc:0 "Horidor stands with Coldor in the Northern Accord, and the moot asks again what the Accord is: a league of equals, or a crown wearing a cloak. Envoys ride to every cairn with the question."
 zin_regional_horidor_the_cairn_crown:0 "The Cairn Crown"
 zin_regional_horidor_the_cairn_crown_desc:0 "Ollon is crowned beside the stones with a circlet of beaten iron, and the chiefs cry him king of the cairns. The Winter Crown hears of it, and does not smile."
 zin_regional_horidor_the_cairn_crown_tip_1:0 "Chieftain Ollon takes the title King of the Cairns."
 zin_regional_horidor_the_cairn_roads:0 "The Cairn Roads"
 zin_regional_horidor_the_cairn_roads_desc:0 "The old cairn roads, marked at every rise by a heap of stones, are widened and drained. A wagon that once took ten days to cross the passes takes six."
 zin_regional_horidor_the_chiefs_grumble:0 "The Chiefs Grumble"
 zin_regional_horidor_the_chiefs_grumble_desc:0 "Some chiefs say that Fandanar speaks for the highlands abroad without being asked. Ollon lets the grumbling be heard, for a grievance aired at the moot is a grievance half mended."
 zin_regional_horidor_the_highland_crown:0 "The Highland Crown"
 zin_regional_horidor_the_highland_crown_desc:0 "Others say that Horidor was a kingdom before the Accord was a word, and that a kingdom keeps its own banner. The chiefs who say so are loud, and their cairns are old."
 zin_regional_horidor_the_highland_host:0 "The Highland Host"
 zin_regional_horidor_the_highland_host_desc:0 "Once each summer the levies are drawn together in the great glen and shown how to move as a single host. When the pipes begin, the glens stop being a hundred bands and become an army."
 zin_regional_horidor_the_independent_valleys:0 "The Independent Valleys"
 zin_regional_horidor_the_independent_valleys_desc:0 "Below the highland passes lie valleys that bow to no crown, and Horidor's herdsmen have traded with them for longer than the Accord has had a name. The moot sends gifts and good words down the roads."
 zin_regional_horidor_two_banners:0 "Two Banners, One March"
 zin_regional_horidor_two_banners_desc:0 "The highland host and the Winter Crown's companies drill on the same field, behind the same horn. A column that has marched beside its ally does not break when the ally is at its flank."
 zin_regional_horidor_two_banners_raised:0 "Two Banners, One March"
 zin_regional_horidor_two_banners_raised_desc:0 "The banner of the cairns and the banner of the Winter Crown are carried side by side. The columns drill together and learn each other's horn-calls."
 zin_regional_horidor_valley_markets:0 "Markets for the Valleys"
 zin_regional_horidor_valley_markets_desc:0 "The independent valleys come to Horidor to sell, and Horidor opens its gates to buy. Goodwill grows where bargains are fair."
 zin_regional_horidor_voices_of_the_cairns:0 "Voices of the Cairns"
 zin_regional_horidor_voices_of_the_cairns_desc:0 "Each cairn is a name, and each name a family that has a voice in the moot. The old stones are set in order and the oldest voices are heard first."
 zin_regional_horidor_watch_on_isengard:0 "A Watch on Isengard"
 zin_regional_horidor_watch_on_isengard_desc:0 "To the south the iron hall of Isengard glowers at Fandanar, and the highland chiefs would rather watch it than fight it. Forts rise on the southern ridges, with horns at the ready."
 zin_regional_horidor_when_the_south_burns:0 "When the South Burns"
 zin_regional_horidor_when_the_south_burns_desc:0 "Smoke has risen in the south, and the great crowns are at war. The moot is called to the high ground, and Ollon asks what Horidor owes to a world beyond its passes."
 zin_regional_horidor_wool_and_hide:0 "Wool and Hide"
 zin_regional_horidor_wool_and_hide_desc:0 "Wool is carded in the glens and hide is tanned beside the rivers. Horidor's cloaks are warm enough to be sold as far south as the Windwaith harbours."
 zin_regional_horidor_wool_and_hide_trade:0 "Wool and Hide"
 zin_regional_horidor_wool_and_hide_trade_desc:0 "Fleeces and cured hides go down the cairn roads in long strings of wagons and come back as grain and salt. A well-clothed host does not fear the high winter."
 zin_regional_horidor.1.a:0 "Fandanar speaks for friends."
 zin_regional_horidor.1.b:0 "The moot speaks for itself."
 zin_regional_horidor.1.d:0 "At the autumn moot, the oldest chiefs rise one by one to say that Fandanar has been speaking for the highlands again. Ollon waits until the last has finished, and then waits a little longer."
 zin_regional_horidor.1.t:0 "The Chiefs Grumble"
