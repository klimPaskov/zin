l_english:
 zin_regional_noleksun_book_of_grievances:0 "The Book of Grievances"
 zin_regional_noleksun_book_of_grievances_desc:0 "The moot keeps a great book in which every tax, toll and indignity is written in the same hand. It has outlasted four Chief Speakers and shows no sign of running out of pages."
 zin_regional_noleksun_dominion_accord:0 "Dominions of One Voice"
 zin_regional_noleksun_frontier_burns:0 "The Frontier Burns"
 zin_regional_noleksun_frontier_burns_desc:0 "The beacons are lit from valley to valley and the Eight Towns have forgotten their quarrels."
 zin_regional_noleksun_frontier_law:0 "Frontier Law"
 zin_regional_noleksun_frontier_law_desc:0 "The valleys set down a body of frontier law, brief and plain, which every town may read and none may amend alone. It is applied in the saddle as often as in the hall."
 zin_regional_noleksun_frontier_law_spirit:0 "Frontier Law"
 zin_regional_noleksun_frontier_law_spirit_desc:0 "A brief, plain law, applied in the saddle as often as in the hall."
 zin_regional_noleksun_frontier_levies:0 "Frontier Levies"
 zin_regional_noleksun_frontier_levies_desc:0 "Every farmer of the valleys keeps a spear and a place in a levy. They muster by the town, serve by the season and go home by the harvest."
 zin_regional_noleksun_frontier_levies_spirit:0 "Frontier Levies"
 zin_regional_noleksun_frontier_levies_spirit_desc:0 "Every farmer keeps a spear and a place in a levy."
 zin_regional_noleksun_frontier_watch:0 "Watchtowers on the Passes"
 zin_regional_noleksun_frontier_watch_desc:0 "A beacon lit at one tower is answered at all of them within the hour."
 zin_regional_noleksun_herds_and_hides:0 "Herds and Hides"
 zin_regional_noleksun_herds_and_hides_desc:0 "The valley herds are the south-east's wealth. Tanners and fullers set up under the town walls, and the hide-market becomes the loudest in the Concord."
 zin_regional_noleksun_hold_the_valleys:0 "Hold the Valleys"
 zin_regional_noleksun_hold_the_valleys_desc:0 "The valley gates are barred and the levies stand to arms. Each town has sworn to hold its own wall, and each knows the others are watching."
 zin_regional_noleksun_hosts_of_the_march:0 "Hosts of the March"
 zin_regional_noleksun_hosts_of_the_march_desc:0 "The levies of the Eight Towns are organised into hosts, each led by the Speaker of its town and equipped from the common armouries."
 zin_regional_noleksun_league_of_free_dominions:0 "The League of Free Dominions"
 zin_regional_noleksun_league_of_free_dominions_desc:0 "Noleksun calls the seceded dominions to one table and offers them a league: no crown, no charter, only a promise to answer when one of them is struck. Few leagues begin so plainly."
 zin_regional_noleksun_march_riders:0 "March Riders"
 zin_regional_noleksun_march_riders_desc:0 "Riders of the Eight Towns patrol the foothills on shaggy mountain ponies. They are few, but they know each trail and each spring."
 zin_regional_noleksun_moot_of_eight:0 "The Moot of the Eight Towns"
 zin_regional_noleksun_moot_of_eight_2:0 "One Moot, One Voice"
 zin_regional_noleksun_moot_of_eight_2_desc:0 "The moot has spoken and the Chief Speaker speaks for all eight."
 zin_regional_noleksun_moot_of_eight_desc:0 "Eight towns, one moot and an unwritten rule that the loudest voice does not always win."
 zin_regional_noleksun_old_liberties:0 "The Old Liberties"
 zin_regional_noleksun_old_liberties_desc:0 "The valleys hold the liberties they held before the Charters, and say so."
 zin_regional_noleksun_one_moot_one_voice:0 "One Moot, One Voice"
 zin_regional_noleksun_one_moot_one_voice_desc:0 "The towns agree that when the moot has spoken, the Chief Speaker speaks for all eight. It is the nearest the valleys have come to a settled rule, and nobody has yet admitted it."
 zin_regional_noleksun_petition_parim:0 "Petition Parim"
 zin_regional_noleksun_petition_parim_desc:0 "Noleksun sends a petition to Parim asking, in the Charters' own words, for the liberties of a Free Charter. The Golden Court is unlikely to be moved, but the petition is on record."
 zin_regional_noleksun_prosperous_valleys:0 "Prosperous Valleys"
 zin_regional_noleksun_prosperous_valleys_desc:0 "Coin comes into the valleys faster than the moot can count it, and for the first time the towns quarrel over how to spend, not how to save."
 zin_regional_noleksun_prosperous_valleys_spirit:0 "Prosperous Valleys"
 zin_regional_noleksun_prosperous_valleys_spirit_desc:0 "Coin flows faster than the moot can count it; workshops keep their best hands."
 zin_regional_noleksun_ride_with_the_heir:0 "Ride with the Heir"
 zin_regional_noleksun_ride_with_the_heir_desc:0 "The Heir has come back, and Noleksun's riders set out to find him. They are late, they are dusty and they have brought every spear the valleys possess."
 zin_regional_noleksun_salt_and_iron:0 "Salt and Iron"
 zin_regional_noleksun_salt_and_iron_desc:0 "Salt is cut from the grey cliffs, and bog-iron is dug from the water-meadows. Neither is fine, and both are needed."
 zin_regional_noleksun_smiths_of_the_eight:0 "Smiths of the Eight"
 zin_regional_noleksun_smiths_of_the_eight_desc:0 "Each town sends its best smith to the great forge at the river-fork. They argue about the shape of every blade and make the best of them nonetheless."
 zin_regional_noleksun_speak_with_selen:0 "Speak with Selen"
 zin_regional_noleksun_speak_with_selen_desc:0 "Envoys ride north to Selen, the dominion that grumbles loudest after Noleksun, to ask whether the dominions might speak with one voice."
 zin_regional_noleksun_speakers_circuit:0 "The Speaker's Circuit"
 zin_regional_noleksun_speakers_circuit_desc:0 "Each season the Chief Speaker rides the circuit of the eight towns, hears the grievance of each and eats at each hearth. The ride takes a month and saves a year of quarrels."
 zin_regional_noleksun_the_charter_quarrel:0 "The Charter Quarrel"
 zin_regional_noleksun_the_charter_quarrel_desc:0 "The Golden King's tax-farmers ride into the valleys every autumn. The moot pays, slowly, and writes every coin into its Book of Grievances."
 zin_regional_noleksun_the_confederacy_stands:0 "The Confederacy Stands"
 zin_regional_noleksun_the_confederacy_stands_desc:0 "Eight towns, one moot, one law. The Confederacy of Noleksun has stood longer than anyone alive can say, and it means to stand a good while yet."
 zin_regional_noleksun_the_eight_rebuild:0 "The Eight Rebuild"
 zin_regional_noleksun_the_eight_rebuild_desc:0 "The war is done, and the Eight Towns turn to their walls and their fields. They rebuild what burned, and the Book of Grievances is put quietly on a high shelf."
 zin_regional_noleksun_the_eight_towns:0 "The Eight Towns"
 zin_regional_noleksun_the_eight_towns_desc:0 "Eight valley towns share one name and one moot. Each keeps its own walls and its own grudges, and together they elect a Chief Speaker who cannot afford to take either for granted."
 zin_regional_noleksun_the_free_dominion:0 "The Free Dominion"
 zin_regional_noleksun_the_free_dominion_desc:0 "With the Golden King in his grave, Noleksun declares that its charter is spent. The Eight Towns walk out of the Concord together, and the moot-hall fills with an unfamiliar quiet."
 zin_regional_noleksun_the_free_muster:0 "The Free Muster"
 zin_regional_noleksun_the_free_muster_desc:0 "The whole of the valleys musters beneath the moot's banner: every farmer with a spear, every smith with a hammer, every shepherd with a sling. It is the largest host the Eight Towns have ever raised."
 zin_regional_noleksun_the_frontier_burns:0 "The Frontier Burns"
 zin_regional_noleksun_the_frontier_burns_desc:0 "Smoke rises over the south-eastern passes. The beacons have been lit from valley to valley, and the Eight Towns have set their quarrels aside for the first time in a generation."
 zin_regional_noleksun_the_frontier_road:0 "The Frontier Road"
 zin_regional_noleksun_the_frontier_road_desc:0 "A paved road is built along the length of the frontier, linking the eight towns and the passes above them. Carts run on it where goats once ran."
 zin_regional_noleksun_the_long_border:0 "The Long Border"
 zin_regional_noleksun_the_long_border_desc:0 "The forts, towers and levy-posts are joined into one line, and the Chief Speaker can see all of it on a single map. It is not much of a wall, but it is very well watched."
 zin_regional_noleksun_the_old_liberties:0 "The Old Liberties"
 zin_regional_noleksun_the_old_liberties_desc:0 "The moot reads aloud the liberties the valleys held before the Charters of Parim, and resolves that they will be held again, whatever the Charters say."
 zin_regional_noleksun_the_south_east_march:0 "The South-East March"
 zin_regional_noleksun_the_south_east_march_desc:0 "Noleksun is the Concord's south-eastern frontier, and its people are used to being forgotten by Parim. The wardens of the valleys draw up their own maps and keep their own counsel."
 zin_regional_noleksun_the_temple_question:0 "The Temple Question"
 zin_regional_noleksun_the_temple_question_desc:0 "The Houses of the First Light ask the moot for land in the valleys, for a hospital, an almonry and a quiet hall. The towns are divided on whether to welcome so generous a neighbour."
 zin_regional_noleksun_town_charters:0 "Town Charters"
 zin_regional_noleksun_town_charters_desc:0 "Every town's charter is copied, sealed and set beside the others in the moot-hall. Where they disagree, the oldest wins, which is generally the quietest."
 zin_regional_noleksun_valley_forts:0 "Valley Forts"
 zin_regional_noleksun_valley_forts_desc:0 "The old valley forts are cleared of rubble, their gates rehung and their cisterns filled. A few have not been manned since the Wall Accord."
 zin_regional_noleksun_valley_herds:0 "Herds and Hides"
 zin_regional_noleksun_valley_herds_desc:0 "Valley herds feed the towns and the hide-market hums."
 zin_regional_noleksun_valley_markets:0 "Valley Markets"
 zin_regional_noleksun_valley_markets_desc:0 "Markets in the eight towns trade in wool, salt and hides, and the largest of them is given a proper hall and a seal. Merchants come from as far as Parim, grumbling at the road."
 zin_regional_noleksun_watchtowers_on_the_passes:0 "Watchtowers on the Passes"
 zin_regional_noleksun_watchtowers_on_the_passes_desc:0 "Towers are raised on the high passes at the head of every valley, each in sight of the next. A beacon lit at one is answered at all of them within the hour."
 zin_regional_noleksun.1.a:0 "The moot will think on it."
 zin_regional_noleksun.1.b:0 "Grant it."
 zin_regional_noleksun.1.d:0 "The Deliverer's almoners have come to the moot with a quiet request: a plot of land in the valleys for a hospital, where the sick of all eight towns may be tended without charge. The moot is divided between gratitude and unease."
 zin_regional_noleksun.1.t:0 "Houses in the Valleys"
 zin_regional_noleksun.2.a:0 "Pay the crown."
 zin_regional_noleksun.2.b:0 "Turn them away."
 zin_regional_noleksun.2.d:0 "Parim's tax-farmers have reached the moot-hall with their ledgers and their escorts, asking the Eight Towns for the autumn levy and a little more. The Chief Speaker waits for the moot to decide how loudly to say no."
 zin_regional_noleksun.2.t:0 "Tax-Farmers at the Moot"
 zin_regional_noleksun.3.a:0 "Selen speaks for itself."
 zin_regional_noleksun.3.b:0 "Agree."
 zin_regional_noleksun.3.d:0 "Envoys from Noleksun arrive in Selen with a simple proposal: the grumbling dominions might do better to grumble together. They offer their moot as the place to begin."
 zin_regional_noleksun.3.t:0 "Envoys from the Eight Towns"
 zin_regional_noleksun.4.a:0 "Stand alone."
 zin_regional_noleksun.4.b:0 "Join the league."
 zin_regional_noleksun.4.d:0 "Noleksun, which led the dominions out of the Concord, offers its fellows a league. It asks for no crown, no charter and no tribute, only the promise that when one is struck, the others will answer."
 zin_regional_noleksun.4.t:0 "The League of Free Dominions"
