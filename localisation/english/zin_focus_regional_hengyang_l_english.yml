l_english:
 zin_regional_hengyang_a_courteous_distance:0 "A Courteous Distance"
 zin_regional_hengyang_a_courteous_distance_desc:0 "The healers are thanked at the gate and given a night's lodging, but not a house. [ROOT.GetName] prefers to keep its own physicians and its own counsel, and says so with a gift of bread."
 zin_regional_hengyang_a_harbour_for_strangers:0 "A Harbour for Strangers"
 zin_regional_hengyang_a_harbour_for_strangers_desc:0 "A guest-harbour is built on the southern shore of the greatest isle, with a lamp that is never put out and a hall that is never shut. Hengyang offers shelter to any ship that asks for it."
 zin_regional_hengyang_a_seat_at_noon:0 "A Seat at Noon"
 zin_regional_hengyang_a_seat_at_noon_desc:0 "The Sunhot realms meet at midday in an open court with no roof, where nothing is decided before the sun is overhead. [ROOT.GetName] takes its seat among them and speaks in its turn."
 zin_regional_hengyang_close_the_houses_under_the_sun:0 "Close the Houses Under the Sun"
 zin_regional_hengyang_close_the_houses_under_the_sun_desc:0 "Doubt has come to [ROOT.GetName] about the grey healers and what they write in their ledgers. The Houses are asked to leave within the month, and their doors are sealed with white wax."
 zin_regional_hengyang_elven_hulls_of_hengyang:0 "Elven Hulls of Hengyang"
 zin_regional_hengyang_elven_hulls_of_hengyang_desc:0 "The elven hulls of the isles are long, narrow and swift, built of pale timber and rowed by crews of forty. A well-built hull outlasts three captains."
 zin_regional_hengyang_harbour_of_the_three_isles:0 "Harbour of the Three Isles"
 zin_regional_hengyang_harbour_of_the_three_isles_desc:0 "A great harbour opens between the isles, protected by two moles and a chain of white towers. Every ship that passes must be seen from three sides."
 zin_regional_hengyang_healing_houses:0 "The Healing Houses"
 zin_regional_hengyang_healing_houses_desc:0 "The Houses of the First Light have raised hospitals and grain stores in [ROOT.GetName], and the sick and the hungry speak well of them."
 zin_regional_hengyang_honour_the_president:0 "Honour the Chair"
 zin_regional_hengyang_honour_the_president_desc:0 "The realm that keeps the Council's chair holds it for all and answers to all. [ROOT.GetName] sends gifts and an envoy to its court, and is thanked in the old words."
 zin_regional_hengyang_masters_of_the_sun_sea:0 "Masters of the Sun-Sea"
 zin_regional_hengyang_masters_of_the_sun_sea_desc:0 "The fleet's captains have charted every reef and eddy of the sun-sea, and their word is law on its waters. Ships from every realm give way."
 zin_regional_hengyang_old_strength:0 "The Old Strength"
 zin_regional_hengyang_old_strength_desc:0 "The tall folk of [ROOT.GetName] remember what their arms were made for, and the enemies of the realm discover it too."
 zin_regional_hengyang_our_share_of_the_sun_guard:0 "Our Share of the Sun Guard"
 zin_regional_hengyang_our_share_of_the_sun_guard_desc:0 "A guard of tall spearmen from every realm keeps the open court and the roads that lead to it. [ROOT.GetName] sends its share, drilled in the slow, heavy step that Sunhot spears have always kept."
 zin_regional_hengyang_peace_among_the_realms:0 "Peace Among the Realms"
 zin_regional_hengyang_peace_among_the_realms_desc:0 "The Council's oldest custom is that no realm raises a hand against another, and that a quarrel over a boundary stone is settled by an elder from a third realm. [ROOT.GetName] swears it again, and means it."
 zin_regional_hengyang_peace_of_noon:0 "The Peace of Noon"
 zin_regional_hengyang_peace_of_noon_desc:0 "No realm of the Council raises a hand to another, and [ROOT.GetName] guards that peace as closely as its own gates."
 zin_regional_hengyang_pilots_of_the_sun_sea:0 "Steersmen of the Sun-Sea"
 zin_regional_hengyang_pilots_of_the_sun_sea_desc:0 "Steersmen of the isles guide ships through the shoals, reading the water by colour and the wind by sound. The harbour pays them well, and they spend it on shell-work."
 zin_regional_hengyang_priests_from_afar:0 "Priests From Afar"
 zin_regional_hengyang_priests_from_afar_desc:0 "Healers in plain grey robes have come down the southern roads, sent by [zin_loc_deliverer] to tend the sick for nothing. [ROOT.GetName] meets them at the gate and asks what they intend."
 zin_regional_hengyang_ready_for_the_noon_league:0 "Ready for the Noon League"
 zin_regional_hengyang_ready_for_the_noon_league_desc:0 "When danger passes the borders, the Council can bind its realms into one league with one banner and one watch-fire. [ROOT.GetName] gives its word beforehand, so that nobody need ask it twice."
 zin_regional_hengyang_reclaim_the_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_hengyang_reclaim_the_fields_desc:0 "The host of [ROOT.GetName] marches with its eyes on the terraces it means to light again."
 zin_regional_hengyang_reclaim_the_sunlit_fields:0 "Reclaim the Sunlit Fields"
 zin_regional_hengyang_reclaim_the_sunlit_fields_desc:0 "Terraces that the dark has taken lie dull and shadowed. [ROOT.GetName] sends its host back along the old roads to light them again, one step at a time."
 zin_regional_hengyang_sea_roads_to_the_isles:0 "Sea Roads to the Isles"
 zin_regional_hengyang_sea_roads_to_the_isles_desc:0 "Hengyang's traders sail the sea roads to the Islands of the South, with grain, cloth and glass. They return with news, spice and the islanders' sayings."
 zin_regional_hengyang_ships_with_the_league:0 "Ships With the League"
 zin_regional_hengyang_ships_with_the_league_desc:0 "The Noon League stands, and Hengyang's fleet puts to sea beneath its banner. The white hulls sail in line, and the sea gives way to them."
 zin_regional_hengyang_sun_guard_share:0 "Our Share of the Sun Guard"
 zin_regional_hengyang_sun_guard_share_desc:0 "A company of tall spearmen from [ROOT.GetName] stands in the Council's guard, and its drill is the finest in the south."
 zin_regional_hengyang_sun_sea_masters:0 "Masters of the Sun-Sea"
 zin_regional_hengyang_sun_sea_masters_desc:0 "Hengyang's captains have sailed the sun-sea since before the charts, and their white ships are the pride of every Sunhot fleet. A captain of the isles is never lost in his own water."
 zin_regional_hengyang_tales_from_the_isles:0 "Tales From the Isles"
 zin_regional_hengyang_tales_from_the_isles_desc:0 "Tales from the southern isles are gathered by Hengyang's scribes and copied into a great archive. Some are songs, some are sailing lore, and some are simply old."
 zin_regional_hengyang_the_archipelago_council:0 "The Archipelago Council"
 zin_regional_hengyang_the_archipelago_council_desc:0 "Hengyang is the northern archipelago of the Lands of the Sun, three island states governed by a council of the isles under a Tide-Speaker. Its white ships are the best of the Sunhot fleets."
 zin_regional_hengyang_the_council_endures:0 "The Council Endures"
 zin_regional_hengyang_the_council_endures_desc:0 "Generations of Sunhot elves have sat in that court without once drawing a blade in it. [ROOT.GetName] adds its name to the long roll of those who kept it so."
 zin_regional_hengyang_the_isle_councils:0 "The Isle Councils"
 zin_regional_hengyang_the_isle_councils_desc:0 "Each isle keeps a council of its own, with a bench for each village. The councils send delegates to the archipelago hall and keep the rest at home."
 zin_regional_hengyang_the_old_strength:0 "The Old Strength"
 zin_regional_hengyang_the_old_strength_desc:0 "The Sunhot elves are among the strongest people in Aoaz, and they have been careful for ages not to remember it. Now [ROOT.GetName] drills its tallest sons and daughters in the weapons that hung in its halls."
 zin_regional_hengyang_the_realms_close_ranks:0 "The Realms Close Ranks"
 zin_regional_hengyang_the_realms_close_ranks_desc:0 "The Noon League lights its watch-fire, and [ROOT.GetName] answers it before the smoke has cleared the hills. A realm that stands alone against the dark is only a smaller target."
 zin_regional_hengyang_the_saying_of_the_isles:0 "The Saying of the Isles"
 zin_regional_hengyang_the_saying_of_the_isles_desc:0 "The islanders say that when the tales of men grow too old for any man to explain, they must be carried to Gala. The council wonders what the saying means."
 zin_regional_hengyang_the_sun_sea_fleets:0 "The Sun-Sea Fleets"
 zin_regional_hengyang_the_sun_sea_fleets_desc:0 "Hengyang's yards are among the busiest in the south, and the white hulls slide into the water in a never-ending line. The shipwrights sing as they work."
 zin_regional_hengyang_the_three_isles:0 "The Three Isles"
 zin_regional_hengyang_the_three_isles_desc:0 "Ferries ply between the three isles on a fixed timetable, and the quays are rebuilt in white stone. A traveller can reach any isle in a single tide."
 zin_regional_hengyang_the_tide_charter:0 "The Tide Charter"
 zin_regional_hengyang_the_tide_charter_desc:0 "The charter is written out afresh on a roll of palm-leaf and sung in the council hall at the spring tide. Every islander knows its first verse."
 zin_regional_hengyang_the_white_fleet:0 "The White Fleet"
 zin_regional_hengyang_the_white_fleet_desc:0 "Hengyang's war-hulls are painted white from keel to masthead, so that they can be seen from shore. Few fleets are as proud, and fewer as well drilled."
 zin_regional_hengyang_tide_charter:0 "The Tide Charter"
 zin_regional_hengyang_tide_charter_desc:0 "The charter of the isles is written on a long scroll of palm-leaf and renewed at every spring tide. It binds the three islands as a net binds a catch."
 zin_regional_hengyang_tide_speaker:0 "The Tide-Speaker"
 zin_regional_hengyang_tide_speaker_desc:0 "Hengara speaks for the three isles in the council hall above the harbour, and her voice is heard over the sound of the surf. She is chosen by the isle-councils, who count their votes in shells."
 zin_regional_hengyang_tide_speaker_hengara:0 "The Tide-Speaker"
 zin_regional_hengyang_tide_speaker_hengara_desc:0 "Hengara is the Tide-Speaker of the three isles, chosen by the council for her calm voice. She hears every dispute from a bench on the harbour wall."
 zin_regional_hengyang_trade_with_the_southern_isles:0 "Trade With the Southern Isles"
 zin_regional_hengyang_trade_with_the_southern_isles_desc:0 "The southern isles sell shell, salt and fish, and buy grain and tools in return. The merchants learn each other's weights and tongues, and the prices stay fair."
 zin_regional_hengyang_voices_of_the_tides:0 "Voices of the Tides"
 zin_regional_hengyang_voices_of_the_tides_desc:0 "The council sends speakers to every Sunhot court, each with a shell and a message. A shell is a good gift: it carries the sound of the sea home with it."
 zin_regional_hengyang_walls_of_white_stone:0 "Walls of White Stone"
 zin_regional_hengyang_walls_of_white_stone_desc:0 "The same hands that cut the terraces now cut a wall of white stone around the capital, thick enough to turn a siege engine and tall enough to shade the street."
 zin_regional_hengyang_welcome_the_healing_houses:0 "Welcome the Healing Houses"
 zin_regional_hengyang_welcome_the_healing_houses_desc:0 "The Houses of the First Light ask only for a roof and a plot for herbs, and in return they raise a hospital and a grain store. [ROOT.GetName] gives them both and watches the queue of the sick grow shorter."
 zin_regional_hengyang_when_shadows_reach_the_sun:0 "When Shadows Reach the Sun"
 zin_regional_hengyang_when_shadows_reach_the_sun_desc:0 "Nothing in the long peace of the Lands of the Sun prepared [ROOT.GetName] for the dark that now stands at its border. The old strength that the tall folk never use is called out of its sleep, and the whole realm turns toward it."
 zin_regional_hengyang.1.a:0 "Keep it in our archive"
 zin_regional_hengyang.1.b:0 "Carry it to Gala"
 zin_regional_hengyang.1.d:0 "Island traders bring a tale nobody can explain and say it must go to Gala. Their saying is older than the harbour: when the tales of men grow too old for any man to explain, carry them to Gala."
 zin_regional_hengyang.1.t:0 "The Saying of the Isles"
