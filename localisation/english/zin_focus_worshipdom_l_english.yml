 zin_worshipdom_seat_of_whispers_desc:0 "[zin_wsd_seat_of_whispers_desc]"
 zin_worshipdom_seat_of_whispers_tip_1:0 "Corvel may be hired as an advisor."
 zin_worshipdom_servants_beyond_the_veil:0 "[zin_wsd_servants_beyond_the_veil_name]"
 zin_worshipdom_servants_beyond_the_veil_desc:0 "[zin_wsd_servants_beyond_the_veil_desc]"
 zin_worshipdom_ships_for_the_northern_pilgrims:0 "[zin_wsd_ships_for_the_northern_pilgrims_name]"
 zin_worshipdom_ships_for_the_northern_pilgrims_desc:0 "[zin_wsd_ships_for_the_northern_pilgrims_desc]"
 zin_worshipdom_ships_of_the_eastern_seas:0 "Ships of the Eastern Seas"
 zin_worshipdom_ships_of_the_eastern_seas_desc:0 "Ships from the eastern harbours are fitted out for a long voyage. Their crews are volunteers, and their captains are given sealed orders."
 zin_worshipdom_temple_masons:0 "Temple Masons"
 zin_worshipdom_temple_masons_desc:0 "The temple masons raise walls, bridges and tall halls from the red stone of the hills. Their work is simple and does not fall down."
 zin_worshipdom_temple_state:0 "The Temple-State of Zilin"
 zin_worshipdom_temple_state_desc:0 "Three hill valleys under the rule of a temple. Its people are devout, its pilgrims are many and its soldiers are few."
 zin_worshipdom_the_ashen_throne:0 "[zin_wsd_the_ashen_throne_name]"
 zin_worshipdom_the_ashen_throne_desc:0 "[zin_wsd_the_ashen_throne_desc]"
 zin_worshipdom_the_chancellors_charge:0 "The Seal-Keeper's Charge"
 zin_worshipdom_the_chancellors_charge_desc:0 "The royal seal-keeper is charged with the rule of the realm during the Deliverer's absences. Aenor must run smoothly while its king is away."
 zin_worshipdom_the_coronation_oaths:0 "[zin_wsd_the_coronation_oaths_name]"
 zin_worshipdom_the_coronation_oaths_desc:0 "[zin_wsd_the_coronation_oaths_desc]"
 zin_worshipdom_the_councils_verdict:0 "[zin_wsd_the_councils_verdict_name]"
 zin_worshipdom_the_councils_verdict_desc:0 "[zin_wsd_the_councils_verdict_desc]"
 zin_worshipdom_the_deliverers_peace:0 "The Deliverer's Peace"
 zin_worshipdom_the_deliverers_peace_desc:0 "The Deliverer's peace is preached from every pulpit and kept at every gate. It is the Hermitage's great gift to Aoaz, and its great ambition."
 zin_worshipdom_the_eastern_chapter:0 "[zin_wsd_the_eastern_chapter_name]"
 zin_worshipdom_the_eastern_chapter_desc:0 "[zin_wsd_the_eastern_chapter_desc]"
 zin_worshipdom_the_eastern_war_council:0 "[zin_wsd_the_eastern_war_council_name]"
 zin_worshipdom_the_eastern_war_council_desc:0 "[zin_wsd_the_eastern_war_council_desc]"
 zin_worshipdom_the_endless_regency:0 "[zin_wsd_the_endless_regency_name]"
 zin_worshipdom_the_endless_regency_desc:0 "[zin_wsd_the_endless_regency_desc]"
 zin_worshipdom_the_faithful_rise:0 "[zin_wsd_the_faithful_rise_name]"
 zin_worshipdom_the_faithful_rise_desc:0 "[zin_wsd_the_faithful_rise_desc]"
 zin_worshipdom_the_famine_stores:0 "The Famine Stores"
 zin_worshipdom_the_famine_stores_desc:0 "The Hermitage sets aside stores of grain for the worst years. In the hungry season a House with an open granary is a House beloved."
 zin_worshipdom_the_first_seal:0 "[zin_wsd_the_first_seal_name]"
 zin_worshipdom_the_first_seal_desc:0 "[zin_wsd_the_first_seal_desc]"
 zin_worshipdom_the_gods_palace:0 "The God's Palace"
 zin_worshipdom_the_gods_palace_desc:0 "The palace at Parim is made a fortress of the faith. Its wards are renewed and its gates are guarded by the faithful."
 zin_worshipdom_the_great_almonry:0 "The Great Almonry"
 zin_worshipdom_the_great_almonry_desc:0 "The Great Almonry gathers the alms of the Houses into one hand and spends them where the need is greatest. It is the largest charity in Aoaz."
 zin_worshipdom_the_host_of_the_east:0 "[zin_wsd_the_host_of_the_east_name]"
 zin_worshipdom_the_host_of_the_east_desc:0 "[zin_wsd_the_host_of_the_east_desc]"
 zin_worshipdom_the_long_courtship:0 "The Long Courtship"
 zin_worshipdom_the_long_courtship_desc:0 "A patient courtship of the eastern crowns, with letters, gifts and understanding, begins to bear fruit. A king who has been courted for a decade finds it hard to refuse a friend."
 zin_worshipdom_the_mistfall_vigil:0 "[zin_wsd_the_mistfall_vigil_name]"
 zin_worshipdom_the_mistfall_vigil_desc:0 "[zin_wsd_the_mistfall_vigil_desc]"
 zin_worshipdom_the_old_council_resumes:0 "[zin_wsd_the_old_council_resumes_name]"
 zin_worshipdom_the_old_council_resumes_desc:0 "[zin_wsd_the_old_council_resumes_desc]"
 zin_worshipdom_the_open_door:0 "The Open Door"
 zin_worshipdom_the_open_door_desc:0 "The gates of the Hermitage are never closed. Envoys, merchants and pilgrims of every crown walk in and are fed."
 zin_worshipdom_the_quiet_court:0 "The Quiet Court"
 zin_worshipdom_the_quiet_court_desc:0 "The throne of Aenor has not changed hands, and nothing seems to have changed in the palace. Counsellors come and go in the Hermitage's white, and the court goes on as it always has."
 zin_worshipdom_the_quiet_hands:0 "[zin_wsd_the_quiet_hands_name]"
 zin_worshipdom_the_quiet_hands_desc:0 "[zin_wsd_the_quiet_hands_desc]"
 zin_worshipdom_the_radiant_face:0 "[zin_wsd_the_radiant_face_name]"
 zin_worshipdom_the_radiant_face_desc:0 "[zin_wsd_the_radiant_face_desc]"
 zin_worshipdom_the_reliquary_vaults:0 "The Reliquary Vaults"
 zin_worshipdom_the_reliquary_vaults_desc:0 "The temple's reliquary is a vault of stone, iron and oak, kept under three keys. Its inventory is old, long and known to very few."
 zin_worshipdom_the_return:0 "[zin_wsd_the_return_name]"
 zin_worshipdom_the_return_desc:0 "[zin_wsd_the_return_desc]"
 zin_worshipdom_the_seals_will_pass:0 "[zin_wsd_the_seals_will_pass_name]"
 zin_worshipdom_the_seals_will_pass_desc:0 "[zin_wsd_the_seals_will_pass_desc]"
 zin_worshipdom_the_thiefs_errands:0 "The Thief's Errands"
 zin_worshipdom_the_thiefs_errands_desc:0 "A trusted servant of the Hermitage travels the roads on errands too small to be noticed. He is cheerful, courteous and impossible to describe afterward."
 zin_worshipdom_the_whisper_network:0 "[zin_wsd_the_whisper_network_name]"
 zin_worshipdom_the_whisper_network_desc:0 "[zin_wsd_the_whisper_network_desc]"
 zin_worshipdom_those_who_refused:0 "[zin_wsd_those_who_refused_name]"
 zin_worshipdom_those_who_refused_desc:0 "[zin_wsd_those_who_refused_desc]"
 zin_worshipdom_through_the_elven_woods:0 "[zin_wsd_through_the_elven_woods_name]"
 zin_worshipdom_through_the_elven_woods_desc:0 "[zin_wsd_through_the_elven_woods_desc]"
 zin_worshipdom_tutors_for_princes:0 "Tutors for Princes"
 zin_worshipdom_tutors_for_princes_desc:0 "The Hermitage offers tutors to the princes of far courts. A prince taught by the temple is a prince who loves it."
 zin_worshipdom_valley_granaries:0 "Granaries of the Three Valleys"
 zin_worshipdom_valley_granaries_desc:0 "Three valleys send their harvests to the temple granaries, which stand full in the leanest year. The Hermitage has never been hungry."
 zin_worshipdom_wards_of_the_palace:0 "Wards of the Palace"
 zin_worshipdom_wards_of_the_palace_desc:0 "Wards, seals and bolted doors are set around the palace at Parim. Pilgrims are still welcome in the outer halls, but the inner ones are barred."
 zin_worshipdom_warned_quietly:0 "Warned Quietly at the Passes"
 zin_worshipdom_watchers_of_the_south:0 "[zin_wsd_watchers_of_the_south_name]"
 zin_worshipdom_watchers_of_the_south_desc:0 "[zin_wsd_watchers_of_the_south_desc]"
 zin_worshipdom_zilin_hermitage:0 "The Hermitage of Zilin"
 zin_worshipdom_zilin_hermitage_desc:0 "In the Zilin Hills a temple-state keeps its gates open to every pilgrim, every beggar and every wandering scholar. The Hermitage begins by feeding those who come and by turning no one away."
 zin_worshipdom.1.a:0 "Feed them all."
 zin_worshipdom.1.b:0 "Bless them and send them home."
 zin_worshipdom.1.d:0 "A long line of pilgrims waits at the gate of the Hermitage, hungry, footsore and singing. The keepers ask whether they should be fed first or blessed first."
 zin_worshipdom.1.t:0 "Pilgrims at the Gate"
 zin_worshipdom.10.a:0 "Bind them to the hermitage."
 zin_worshipdom.10.b:0 "Send them abroad."
 zin_worshipdom.10.d:0 "The servants beyond the veil have heard the summons and have come. They stand in the courtyard of the Hermitage without speaking, and the pilgrims have been sent indoors."
 zin_worshipdom.10.t:0 "Servants Beyond the Veil"
 zin_worshipdom.11.a:0 "So it is arranged."
 zin_worshipdom.11.d:0 "The Hermitage will be kept while the Deliverer reigns. The High Confessor has agreed to take the keys, the gates and the granaries, and the faithful are glad of it."
 zin_worshipdom.11.t:0 "A Keeper for the Hermitage"
 zin_worshipdom.12.a:0 "Let him reign."
 zin_worshipdom.12.d:0 "The old king still sits upon his throne, signs what is placed before him and sees the people his counsellors wish him to see. He never knew, and he never will."
 zin_worshipdom.12.t:0 "The Quiet Court"
 zin_worshipdom.13.a:0 "Let him reign."
 zin_worshipdom.13.d:0 "A child sits on the throne of Aenor with a tutor at his ear and a regent at his shoulder. The court is calm, and the child is happy."
 zin_worshipdom.13.t:0 "The Quiet Court of the Child"
 zin_worshipdom.2.a:0 "Receive every envoy."
 zin_worshipdom.2.b:0 "Receive the eastern envoys first."
 zin_worshipdom.2.d:0 "Envoys of a dozen courts have arrived at the Hermitage in a single week. The keepers do not wish to offend any of them, but there is only one chair at the head of the table."
 zin_worshipdom.2.t:0 "Envoys of Many Crowns"
 zin_worshipdom.3.a:0 "Grant it."
 zin_worshipdom.3.b:0 "The elves keep their own counsel."
 zin_worshipdom.3.d:0 "Pilgrims from the Hermitage have come to the elven forest bearing gifts and a letter. The Hermitage asks for quiet borders and open roads, and promises in return the friendship of its prayers."
 zin_worshipdom.3.t:0 "The Hermitage Asks for Quiet Borders"
 zin_worshipdom.4.a:0 "Feed their pride."
 zin_worshipdom.4.b:0 "Counsel patience."
 zin_worshipdom.4.c:0 "Only listen."
 zin_worshipdom.4.d:0 "Your couriers have returned from the court of Sonargur. The sea-kings are proud, restless and unhappy with their treaty. They will say as much to anyone who listens."
 zin_worshipdom.4.t:0 "The Mood of the Leren Court"
 zin_worshipdom.5.a:0 "Warn Parim quietly."
 zin_worshipdom.5.b:0 "Let the court laugh."
 zin_worshipdom.5.d:0 "Pilgrims returned from Mirolon with an account of the passes, the garrisons and a storm that never seems to move. They are certain that the walls are watched by something more than men."
 zin_worshipdom.5.t:0 "Report from the Passes"
 zin_worshipdom.6.a:0 "He serves well."
 zin_worshipdom.6.b:0 "Remind him whom he serves."
 zin_worshipdom.6.d:0 "The keeper of the royal seals has written again. His letter is long, courteous and full of small requests. At its end he asks to be remembered to the Deliverer."
 zin_worshipdom.6.t:0 "A Letter from Merovan"
 zin_worshipdom.7.a:0 "Close the book."
 zin_worshipdom.7.d:0 "The keepers of the reliquary have finished their inventory. It lists the Necklace of the Abyss and three lesser pieces, each of which is attuned to one hand alone."
 zin_worshipdom.7.t:0 "The Reliquary Inventory"
 zin_worshipdom.8.a:0 "Give him a chair in the Council."
 zin_worshipdom.8.b:0 "Keep him on the road."
 zin_worshipdom.8.d:0 "A stranger has come to the reliquary, a pleasant man who looks no older than he did on the day he first came. He asks nothing, and he knows the name of every relic in the vault."
 zin_worshipdom.8.t:0 "The Guest Who Does Not Age"
 zin_worshipdom.9.a:0 "Watch the castle."
 zin_worshipdom.9.b:0 "Leave it until there is cause."
 zin_worshipdom.9.d:0 "Your listeners report that a green light has been seen at night above a castle in the north. A single man is said to watch it from the battlements."
 zin_worshipdom.9.t:0 "What the Council Knows of Yeldenne"
