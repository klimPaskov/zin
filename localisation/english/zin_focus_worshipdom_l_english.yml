 zin_worshipdom_a_keeper_for_the_hermitage:0 "A Keeper for the Hermitage"
 zin_worshipdom_a_keeper_for_the_hermitage_desc:0 "A trusted keeper is named for the Hermitage, to hold its gates and its granaries while the Deliverer sits upon a throne in the Middle Lands."
 zin_worshipdom_a_kingdom_without_war:0 "A Kingdom Without War"
 zin_worshipdom_a_kingdom_without_war_desc:0 "Aenor is at peace and Aoaz is at peace. If the world is quiet long enough, no one will remember that it was ever otherwise."
 zin_worshipdom_a_kingdom_without_war_tip_1:0 "Counts toward the proposed outcome of a surviving Golden Court."
 zin_worshipdom_a_pliant_heir:0 "[zin_wsd_a_pliant_heir_name]"
 zin_worshipdom_a_pliant_heir_desc:0 "[zin_wsd_a_pliant_heir_desc]"
 zin_worshipdom_a_steady_hand_on_the_seals:0 "[zin_wsd_a_steady_hand_on_the_seals_name]"
 zin_worshipdom_a_steady_hand_on_the_seals_desc:0 "[zin_wsd_a_steady_hand_on_the_seals_desc]"
 zin_worshipdom_a_vigil_for_the_king:0 "[zin_wsd_a_vigil_for_the_king_name]"
 zin_worshipdom_a_vigil_for_the_king_desc:0 "[zin_wsd_a_vigil_for_the_king_desc]"
 zin_worshipdom_alms_of_the_faithful:0 "The Alms of the Faithful"
 zin_worshipdom_alms_of_the_faithful_desc:0 "The faithful of the Deliverer give freely. Their alms are sorted and counted at the temple door and spent on grain, medicine and mending."
 zin_worshipdom_blessing_of_the_kings_table:0 "[zin_wsd_blessing_of_the_kings_table_name]"
 zin_worshipdom_blessing_of_the_kings_table_desc:0 "[zin_wsd_blessing_of_the_kings_table_desc]"
 zin_worshipdom_brother_against_brother:0 "[zin_wsd_brother_against_brother_name]"
 zin_worshipdom_brother_against_brother_desc:0 "[zin_wsd_brother_against_brother_desc]"
 zin_worshipdom_buy_the_offices:0 "[zin_wsd_buy_the_offices_name]"
 zin_worshipdom_buy_the_offices_desc:0 "[zin_wsd_buy_the_offices_desc]"
 zin_worshipdom_cast_off_the_mask:0 "[zin_wsd_cast_off_the_mask_name]"
 zin_worshipdom_cast_off_the_mask_desc:0 "[zin_wsd_cast_off_the_mask_desc]"
 zin_worshipdom_chairs_at_the_universities:0 "Chairs at the Universities"
 zin_worshipdom_chairs_at_the_universities_desc:0 "The temple endows chairs at the universities of Selen and beyond. A scholar fed by the temple teaches what the temple would like taught."
 zin_worshipdom_confessors_abroad:0 "Confessors at Foreign Courts"
 zin_worshipdom_confessors_abroad_desc:0 "The Hermitage sends confessors to foreign courts to hear the troubles of kings and the burdens of queens. They listen very well."
 zin_worshipdom_counsel_for_the_chancellor:0 "[zin_wsd_counsel_for_the_chancellor_name]"
 zin_worshipdom_counsel_for_the_chancellor_desc:0 "[zin_wsd_counsel_for_the_chancellor_desc]"
 zin_worshipdom_couriers:0 "Pilgrim Couriers"
 zin_worshipdom_couriers_desc:0 "Pilgrims carry letters from city to city and are the best-informed travellers in Aoaz."
 zin_worshipdom_crowned_deliverer:0 "The Throne Blessed"
 zin_worshipdom_crowned_deliverer_desc:0 "The throne of Aenor is blessed, and the new king is anointed with balm. The court is pleased, and the temples are full."
 zin_worshipdom_debts_of_gratitude:0 "Debts of Gratitude"
 zin_worshipdom_debts_of_gratitude_desc:0 "A man who has been fed remembers it. The Houses keep no accounts, but they keep a memory of who owes them what."
 zin_worshipdom_deliverers_peace:0 "The Deliverer's Peace"
 zin_worshipdom_deliverers_peace_desc:0 "The Deliverer's peace is preached from every pulpit and kept at every gate. The Hermitage seeks no war."
 zin_worshipdom_denounce_the_impostor:0 "Denounce the Impostor"
 zin_worshipdom_denounce_the_impostor_desc:0 "A stranger claims royal blood and slanders the Deliverer. The crown calls him what he is: an impostor."
 zin_worshipdom_doctrine_of_deliverance:0 "The Doctrine of Deliverance"
 zin_worshipdom_doctrine_of_deliverance_desc:0 "The doctrine of the Deliverer is written out in plain words and taught in every temple school. It is gentle, sure and nearly impossible to refute."
 zin_worshipdom_doctrine_of_deliverance_spirit:0 "The Doctrine of Deliverance"
 zin_worshipdom_doctrine_of_deliverance_spirit_desc:0 "The doctrine is written in plain words and taught in every temple school. It is gentle, sure and very hard to refute."
 zin_worshipdom_doors_in_the_hermitage_walls:0 "[zin_wsd_doors_in_the_hermitage_walls_name]"
 zin_worshipdom_doors_in_the_hermitage_walls_desc:0 "[zin_wsd_doors_in_the_hermitage_walls_desc]"
 zin_worshipdom_ears_in_sonargur:0 "[zin_wsd_ears_in_sonargur_name]"
 zin_worshipdom_ears_in_sonargur_desc:0 "[zin_wsd_ears_in_sonargur_desc]"
 zin_worshipdom_eastern_fleets:0 "Ships of the Eastern Seas"
 zin_worshipdom_eastern_fleets_desc:0 "Ships from the eastern harbours are fitted out for a long voyage, with volunteer crews and sealed orders."
 zin_worshipdom_eastern_throne:0 "Banners of the Dawn"
 zin_worshipdom_eastern_throne_desc:0 "The banners of the dawn lands are raised at the Hermitage. The host that gathers beneath them is devoted and orderly."
 zin_worshipdom_elves_declined:0 "The Elves Kept Their Own Counsel"
 zin_worshipdom_endless_regency:0 "A Wise Regency"
 zin_worshipdom_endless_regency_desc:0 "A wise regency governs in the king's name, and the realm is calm, orderly and very quiet."
 zin_worshipdom_endow_the_genealogists:0 "[zin_wsd_endow_the_genealogists_name]"
 zin_worshipdom_endow_the_genealogists_desc:0 "[zin_wsd_endow_the_genealogists_desc]"
 zin_worshipdom_every_house_a_fortress:0 "[zin_wsd_every_house_a_fortress_name]"
 zin_worshipdom_every_house_a_fortress_desc:0 "[zin_wsd_every_house_a_fortress_desc]"
 zin_worshipdom_every_road:0 "Every Road a Pilgrim Road"
 zin_worshipdom_every_road_desc:0 "Every road of Aoaz is linked by an unbroken line of wayhouses, and news travels faster than any courier."
 zin_worshipdom_every_road_has_ears:0 "[zin_wsd_every_road_has_ears_name]"
 zin_worshipdom_every_road_has_ears_desc:0 "[zin_wsd_every_road_has_ears_desc]"
 zin_worshipdom_fear_and_worship:0 "[zin_wsd_fear_and_worship_name]"
 zin_worshipdom_fear_and_worship_desc:0 "[zin_wsd_fear_and_worship_desc]"
 zin_worshipdom_fear_and_worship_spirit:0 "Awe of the Faithful"
 zin_worshipdom_fear_and_worship_spirit_desc:0 "The temples are packed, the streets are quiet and the people cannot tell awe from fear."
 zin_worshipdom_feed_the_kings_appetite:0 "[zin_wsd_feed_the_kings_appetite_name]"
 zin_worshipdom_feed_the_kings_appetite_desc:0 "[zin_wsd_feed_the_kings_appetite_desc]"
 zin_worshipdom_first_of_his_name:0 "[zin_wsd_first_of_his_name_name]"
 zin_worshipdom_first_of_his_name_desc:0 "[zin_wsd_first_of_his_name_desc]"
 zin_worshipdom_friends_among_the_elves:0 "Friends Among the Elves"
 zin_worshipdom_friends_among_the_elves_desc:0 "The Hermitage lies close to the elven forest, and the Deliverer has always sought the friendship of its wardens. Gifts and messages are exchanged in the old way."
 zin_worshipdom_gifts_to_eastern_kings:0 "Gifts to the Eastern Kings"
 zin_worshipdom_gifts_to_eastern_kings_desc:0 "Gifts of silk, grain and holy balm are sent to the courts of the East. Each is chosen with care and presented with a blessing."
 zin_worshipdom_gods_court:0 "The God's Court"
 zin_worshipdom_gods_court_desc:0 "The Houses are restored in every land, with new gifts, new wards and new patrons. The court that sits above them is not of this world."
 zin_worshipdom_grain_of_charity:0 "Grain of Charity"
 zin_worshipdom_grain_of_charity_desc:0 "Carts of grain leave the Hermitage for the hungry quarters of distant cities. Wherever they stop, a House of the First Light is soon to follow."
 zin_worshipdom_great_almonry:0 "The Great Almonry"
 zin_worshipdom_great_almonry_desc:0 "The alms of the Houses are gathered in one hand and spent where the need is greatest."
 zin_worshipdom_guardians_of_the_hills:0 "Guardians of the Hills"
 zin_worshipdom_guardians_of_the_hills_desc:0 "A small guard is raised to keep the roads safe and the temple unmolested. They carry staves and spears and are trained to defend, never to attack."
 zin_worshipdom_guardians_of_the_hills_spirit:0 "Guardians of the Hills"
 zin_worshipdom_guardians_of_the_hills_spirit_desc:0 "A small guard of the Hermitage holds the hilltops and the roads. They are trained to defend and not to attack."
 zin_worshipdom_healers_of_zilin:0 "Healers of Zilin"
 zin_worshipdom_healers_of_zilin_desc:0 "The healers of Zilin are known in every court. They treat the poor for nothing and the rich for a fair fee, and none of them has ever been seen to refuse a patient."
 zin_worshipdom_healers_of_zilin_spirit:0 "Healers of Zilin"
 zin_worshipdom_healers_of_zilin_spirit_desc:0 "The healers of the Hermitage treat the poor for nothing, and the hill valleys are known for their health."
 zin_worshipdom_hear_the_dominions:0 "[zin_wsd_hear_the_dominions_name]"
 zin_worshipdom_hear_the_dominions_desc:0 "[zin_wsd_hear_the_dominions_desc]"
 zin_worshipdom_hermitage_scriptorium:0 "The Hermitage Scriptorium"
 zin_worshipdom_hermitage_scriptorium_desc:0 "In the scriptorium monks copy the scrolls of the temple, the old histories of the Ages and the letters of pilgrims. A good copyist is worth more than a good soldier here."
 zin_worshipdom_hill_wardens:0 "Hill Wardens"
 zin_worshipdom_hill_wardens_desc:0 "Watch-towers rise on the hilltops and the gates are fitted with iron. The Hermitage has no enemies, but it is wise not to be careless."
 zin_worshipdom_hospitals_of_parim:0 "The Hospitals of Parim"
 zin_worshipdom_hospitals_of_parim_desc:0 "A great hospital rises in Parim, with a hundred beds and a physician for every ten. The royal court is generous and the physicians are grateful."
 zin_worshipdom_host_of_the_east:0 "The Gathered Faithful"
 zin_worshipdom_host_of_the_east_desc:0 "The faithful of the East march beneath banners of white and gold, singing as they go."
 zin_worshipdom_houses_across_the_sea:0 "Houses Across the Sea"
 zin_worshipdom_houses_across_the_sea_desc:0 "Ships carry grain, bandages and sisters of the temple across the western sea. The Houses of the West are the first to open their doors to the wounded of the Gunwaith wars."
 zin_worshipdom_houses_in_the_north:0 "Houses in the North"
 zin_worshipdom_houses_in_the_north_desc:0 "In the harsh cold of the North Lands the Houses are warmer than the inns and cheaper than the alehouses. Sailors of Lerendor learn to go there first."
 zin_worshipdom_houses_of_the_first_light:0 "The Houses of the First Light"
 zin_worshipdom_houses_of_the_first_light_desc:0 "The Houses of the First Light are halls of charity: hostels for the poor, schools for orphans and wards for the sick. They open wherever a patron can be found to pay for their lamps."
 zin_worshipdom_houses_of_the_islands:0 "Houses of the Islands"
 zin_worshipdom_houses_of_the_islands_desc:0 "Fishermen, sailors and island farmers receive the Houses gladly. The sisters learn the island tongues and sing at the island festivals."
 zin_worshipdom_houses_on_the_caravan_roads:0 "Houses on the Caravan Roads"
 zin_worshipdom_houses_on_the_caravan_roads_desc:0 "Wayhouses on the eastern caravan roads give water to the camel-men and soup to the drivers. The caravan houses are well pleased and say so."
 zin_worshipdom_houses_under_the_sun:0 "Houses Under the Sun"
 zin_worshipdom_houses_under_the_sun_desc:0 "The Houses open under the white-gold sun of the elven kingdoms. Their sisters learn what the elves already know and keep their counsel."
 zin_worshipdom_houses_without_number:0 "Houses Without Number"
 zin_worshipdom_houses_without_number_desc:0 "There is a House of the First Light in every city, a ward in every hospital and a lamp in every window. The Deliverer's name is spoken in all of them."
 zin_worshipdom_houses_without_number_spirit:0 "Houses Without Number"
 zin_worshipdom_houses_without_number_spirit_desc:0 "There is a House of the First Light in every city, a ward in every hospital and a lamp in every window."
 zin_worshipdom_hunters_on_the_ice:0 "[zin_wsd_hunters_on_the_ice_name]"
 zin_worshipdom_hunters_on_the_ice_desc:0 "[zin_wsd_hunters_on_the_ice_desc]"
 zin_worshipdom_hymns:0 "Hymns of Deliverance"
 zin_worshipdom_hymns_desc:0 "Choirs sing the Hymns in the great hall and at the gates. The tunes are simple and easily learned, and they spread."
 zin_worshipdom_hymns_for_a_new_reign:0 "[zin_wsd_hymns_for_a_new_reign_name]"
 zin_worshipdom_hymns_for_a_new_reign_desc:0 "[zin_wsd_hymns_for_a_new_reign_desc]"
 zin_worshipdom_hymns_of_deliverance:0 "Hymns of Deliverance"
 zin_worshipdom_hymns_of_deliverance_desc:0 "Choirs of the Hermitage sing the Hymns of Deliverance in the great hall and at the gates. The tunes are simple and easily learned, and they spread."
 zin_worshipdom_keepers_of_the_birth_rolls:0 "Keepers of the Birth Rolls"
 zin_worshipdom_keepers_of_the_birth_rolls_desc:0 "The Houses keep rolls of births, deaths and marriages for any family that asks. A parish that trusts the rolls trusts the keepers of them."
 zin_worshipdom_keepers_of_the_crown:0 "Keepers of the Crown"
 zin_worshipdom_keepers_of_the_crown_desc:0 "The crown's keepers are the temple's men. The royal edicts are drafted at the Hermitage and signed in Parim."
 zin_worshipdom_king_of_the_east:0 "[zin_wsd_king_of_the_east_name]"
 zin_worshipdom_king_of_the_east_desc:0 "[zin_wsd_king_of_the_east_desc]"
 zin_worshipdom_lamps_in_the_deep_vault:0 "[zin_wsd_lamps_in_the_deep_vault_name]"
 zin_worshipdom_lamps_in_the_deep_vault_desc:0 "[zin_wsd_lamps_in_the_deep_vault_desc]"
 zin_worshipdom_ledger_of_debts:0 "The Ledger of Debts"
 zin_worshipdom_ledger_of_debts_desc:0 "The Hermitage keeps a ledger of the favours it has done for the great and the small. The ledger is never consulted, but it is never lost either."
 zin_worshipdom_letters_to_every_court:0 "Letters to Every Court"
 zin_worshipdom_letters_to_every_court_desc:0 "A letter goes to every court in Aoaz in the Hermitage's own hand. It is polite, unthreatening and signed with a blessing."
 zin_worshipdom_levies_of_the_caravan_kings:0 "[zin_wsd_levies_of_the_caravan_kings_name]"
 zin_worshipdom_levies_of_the_caravan_kings_desc:0 "[zin_wsd_levies_of_the_caravan_kings_desc]"
 zin_worshipdom_long_live_the_golden_king:0 "[zin_wsd_long_live_the_golden_king_name]"
 zin_worshipdom_long_live_the_golden_king_desc:0 "[zin_wsd_long_live_the_golden_king_desc]"
 zin_worshipdom_lord_of_all_aoaz:0 "[zin_wsd_lord_of_all_aoaz_name]"
 zin_worshipdom_lord_of_all_aoaz_desc:0 "[zin_wsd_lord_of_all_aoaz_desc]"
 zin_worshipdom_maps_of_the_cold_coast:0 "Maps of the Cold Coast"
 zin_worshipdom_maps_of_the_cold_coast_desc:0 "Mapmakers of the Hermitage copy the charts of the northern coasts and mark the passes, the anchorages and the ice. Pilgrims who go north will have maps."
 zin_worshipdom_merchants_gossip:0 "[zin_wsd_merchants_gossip_name]"
 zin_worshipdom_merchants_gossip_desc:0 "[zin_wsd_merchants_gossip_desc]"
 zin_worshipdom_ministers_from_the_houses:0 "Counsellors from the Houses"
 zin_worshipdom_ministers_from_the_houses_desc:0 "Counsellors trained in the Houses are recommended to the royal court. They are honest, diligent and very well informed."
 zin_worshipdom_miracles_at_the_wells:0 "Miracles at the Wells"
 zin_worshipdom_miracles_at_the_wells_desc:0 "It is said that the wells of the Hermitage never run dry and that the sick who drink from them are healed. Pilgrims by the thousand come to see."
 zin_worshipdom_new_god_of_men:0 "New God of Men"
 zin_worshipdom_new_god_of_men_desc:0 "The faithful of Aenor raise their eyes to the throne and see a king who is more than a king. The priests do not correct them."
 zin_worshipdom_new_god_of_men_spirit:0 "New God of Men"
 zin_worshipdom_new_god_of_men_spirit_desc:0 "The faithful raise their eyes to the throne and see a king who is more than a king. The priests do not correct them."
 zin_worshipdom_oaths_in_gold:0 "[zin_wsd_oaths_in_gold_name]"
 zin_worshipdom_oaths_in_gold_desc:0 "[zin_wsd_oaths_in_gold_desc]"
 zin_worshipdom_oaths_of_the_royal_army:0 "[zin_wsd_oaths_of_the_royal_army_name]"
 zin_worshipdom_oaths_of_the_royal_army_desc:0 "[zin_wsd_oaths_of_the_royal_army_desc]"
 zin_worshipdom_open_letters:0 "Letters to Every Court"
 zin_worshipdom_open_letters_desc:0 "A letter from the Hermitage reaches every court in Aoaz, polite and signed with a blessing."
 zin_worshipdom_palace_wards:0 "Wards of the Palace"
 zin_worshipdom_palace_wards_desc:0 "Wards, seals and bolted doors surround the palace at Parim, and the outer halls are open to pilgrims."
 zin_worshipdom_parim_shall_not_fall:0 "[zin_wsd_parim_shall_not_fall_name]"
 zin_worshipdom_parim_shall_not_fall_desc:0 "[zin_wsd_parim_shall_not_fall_desc]"
 zin_worshipdom_parim_shall_not_fall_spirit:0 "Parim Shall Not Fall"
 zin_worshipdom_parim_shall_not_fall_spirit_desc:0 "The city will not fall. The faithful gather within its walls, and the garrison fights with a hard, calm resolve."
 zin_worshipdom_patrons_of_the_lost_cause:0 "[zin_wsd_patrons_of_the_lost_cause_name]"
 zin_worshipdom_patrons_of_the_lost_cause_desc:0 "[zin_wsd_patrons_of_the_lost_cause_desc]"
 zin_worshipdom_peace_for_the_realm:0 "[zin_wsd_peace_for_the_realm_name]"
 zin_worshipdom_peace_for_the_realm_desc:0 "[zin_wsd_peace_for_the_realm_desc]"
 zin_worshipdom_physicians_of_the_houses:0 "Physicians of the Houses"
 zin_worshipdom_physicians_of_the_houses_desc:0 "Physicians in white robes are sent to the Houses, and the poor are treated without payment. A grateful patient remembers the hand that healed him."
 zin_worshipdom_pilgrim_couriers:0 "Pilgrim Couriers"
 zin_worshipdom_pilgrim_couriers_desc:0 "Pilgrims carry letters from city to city and are glad of the Hermitage's hospitality. They are the best-informed travellers in Aoaz."
 zin_worshipdom_pilgrim_roads:0 "Mend the Pilgrim Roads"
 zin_worshipdom_pilgrim_roads_desc:0 "The roads that lead to the Hermitage are mended stone by stone. Wayhouses are built at every day's journey, and pilgrims bless the name of the temple that built them."
 zin_worshipdom_pilgrim_roads_spirit:0 "The Pilgrim Roads"
 zin_worshipdom_pilgrim_roads_spirit_desc:0 "Mended roads and wayhouses link the Hermitage to every land. Pilgrims arrive with news, silver and goodwill."
 zin_worshipdom_pray_for_patience:0 "[zin_wsd_pray_for_patience_name]"
 zin_worshipdom_pray_for_patience_desc:0 "[zin_wsd_pray_for_patience_desc]"
 zin_worshipdom_private_10_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_12_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_4_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_5_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_6_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_7_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_8_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_9_tip_1:0 "The chapter sends word."
 zin_worshipdom_private_afrit_10_tip_1:0 "The faithful pray for the King."
 zin_worshipdom_private_afrit_11_tip_1:0 "The physicians attend the King."
 zin_worshipdom_private_afrit_15_tip_1:0 "A vigil is kept for the King."
 zin_worshipdom_private_afrit_54_tip_1:0 "The Dawn holds council."
 zin_worshipdom_radiant_face:0 "The Radiant Face"
 zin_worshipdom_radiant_face_desc:0 "The Deliverer's face is radiant and mild. The faithful weep to see it, and the doubters fall quiet."
 zin_worshipdom_remedies_of_the_royal_physicians:0 "[zin_wsd_remedies_of_the_royal_physicians_name]"
 zin_worshipdom_remedies_of_the_royal_physicians_desc:0 "[zin_wsd_remedies_of_the_royal_physicians_desc]"
 zin_worshipdom_remember_the_jubilee:0 "Remember the Jubilee"
 zin_worshipdom_remember_the_jubilee_desc:0 "The Thousand-Year Jubilee of 4A 1000 is remembered in the royal court of Aenor, with hymns, torches and the solemn reading of old oaths."
 zin_worshipdom_renew_the_thousand_oaths:0 "Renew the Thousand Oaths"
 zin_worshipdom_renew_the_thousand_oaths_desc:0 "The oaths sworn on the Jubilee are renewed in every temple. The faithful kneel, the choirs sing, and a hundred thousand voices repeat the old words."
 zin_worshipdom_rest_at_the_hermitage:0 "[zin_wsd_rest_at_the_hermitage_name]"
 zin_worshipdom_rest_at_the_hermitage_desc:0 "[zin_wsd_rest_at_the_hermitage_desc]"
 zin_worshipdom_roads_to_the_dawn:0 "Roads to the Dawn"
 zin_worshipdom_roads_to_the_dawn_desc:0 "The long courtship of the East is made plain. The Hermitage declares that it has friends in every eastern court and that those friends will receive it."
 zin_worshipdom_rumours_of_a_green_light:0 "[zin_wsd_rumours_of_a_green_light_name]"
 zin_worshipdom_rumours_of_a_green_light_desc:0 "[zin_wsd_rumours_of_a_green_light_desc]"
 zin_worshipdom_scriptorium:0 "The Hermitage Scriptorium"
 zin_worshipdom_scriptorium_desc:0 "Monks copy the scrolls of the temple, the histories of the Ages and the letters of pilgrims."
 zin_worshipdom_seat_of_censers:0 "[zin_wsd_seat_of_censers_name]"
 zin_worshipdom_seat_of_censers_desc:0 "[zin_wsd_seat_of_censers_desc]"
 zin_worshipdom_seat_of_censers_tip_1:0 "Ilvane may be hired as an advisor."
 zin_worshipdom_seat_of_relics:0 "[zin_wsd_seat_of_relics_name]"
 zin_worshipdom_seat_of_relics_desc:0 "[zin_wsd_seat_of_relics_desc]"
 zin_worshipdom_seat_of_seals:0 "[zin_wsd_seat_of_seals_name]"
 zin_worshipdom_seat_of_seals_desc:0 "[zin_wsd_seat_of_seals_desc]"
