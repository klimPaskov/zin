l_english:
 zin_regional_plutondo_a_seat_in_the_pact:0 "A Seat in the Pact"
 zin_regional_plutondo_a_seat_in_the_pact_desc:0 "Stabilo's Pact would welcome Plutondo, and Blozan's debts make the friendship easy. A seat at the Pact's table would also seat Postondoroth's bankers at his."
 zin_regional_plutondo_between_drak_and_erco:0 "Between Drak and Erco"
 zin_regional_plutondo_between_drak_and_erco_desc:0 "Plutondo lies between the sword-kingdom of Drak and the mountain kingdom of Erco, and both are touchy about the line. Blozan's surveyors have been asked to walk it once more."
 zin_regional_plutondo_blozans_household:0 "Blozan's Household"
 zin_regional_plutondo_blozans_household_desc:0 "The prince's household is large, loud and well informed. It holds the keys to every granary and the names of every debtor in the principality."
 zin_regional_plutondo_blozans_household_spirit:0 "Blozan's Household"
 zin_regional_plutondo_blozans_household_spirit_desc:0 "The prince's household fills a hill fortress with cooks, scribes and stewards, and every one of them listens at doors. Blozan knows what is said in his halls before it is finished."
 zin_regional_plutondo_caravan_porters:0 "Caravan Porters"
 zin_regional_plutondo_caravan_porters_desc:0 "Plutondo's porters carry the Gold Road's goods up the last steep miles, and the road-houses that feed them are said to be the best in the East. Postondoroth's factors pay a fair rate for such labour."
 zin_regional_plutondo_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_plutondo_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_plutondo_close_the_houses:0 "Close the Houses"
 zin_regional_plutondo_close_the_houses_desc:0 "Whatever the Houses once promised, [ROOT.GetName] has seen enough. Their doors are barred, their ledgers seized and their almoners escorted to the border with their belongings."
 zin_regional_plutondo_coastal_watch:0 "The Coastal Watch"
 zin_regional_plutondo_coastal_watch_desc:0 "A tower is built on the headland and a beacon-keeper posted day and night. Smugglers have learned to sail by other coasts."
 zin_regional_plutondo_count_the_temple_gold:0 "Count the Temple Gold"
 zin_regional_plutondo_count_the_temple_gold_desc:0 "The court's treasurer asks for the temples' ledgers, as he asks for every landholder's. It is an audit of accounts and not an accusation, and he is careful to say so at every door."
 zin_regional_plutondo_eastern_gate_of_the_gold_road:0 "Eastern Gate of the Gold Road"
 zin_regional_plutondo_eastern_gate_of_the_gold_road_desc:0 "The Gold Road reaches its eastern gate in Plutondo, and every cart that arrives has come through Postondoroth's hands. A paved court and a toll-house make the gate worth its name."
 zin_regional_plutondo_eastern_oath:0 "Oath to the King in the East"
 zin_regional_plutondo_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_plutondo_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_plutondo_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_plutondo_fields_of_plutondo:0 "Fields of Plutondo"
 zin_regional_plutondo_fields_of_plutondo_desc:0 "New terraces climb the hillsides, and canals bring snow-melt to dry fields. The yield is small per acre and large in total."
 zin_regional_plutondo_free_crown_court:0 "A Free Crown"
 zin_regional_plutondo_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_plutondo_galleys_of_the_hill_coast:0 "Galleys of the Hill Coast"
 zin_regional_plutondo_galleys_of_the_hill_coast_desc:0 "Oared galleys with high prows suit the coast's short chop. The yards at the capital's port turn them out in pairs."
 zin_regional_plutondo_generous_friends:0 "The Generous Friends"
 zin_regional_plutondo_generous_friends_desc:0 "The Houses of the First Light give freely, and the court remembers their kindness."
 zin_regional_plutondo_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_plutondo_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_plutondo_granaries_of_the_hills:0 "Granaries of the Hills"
 zin_regional_plutondo_granaries_of_the_hills_desc:0 "Stone granaries rise in every hill village, built by the people they feed. The prince's seal on the lintel promises a winter without hunger."
 zin_regional_plutondo_harbour_of_plutondo:0 "Harbour of Plutondo"
 zin_regional_plutondo_harbour_of_plutondo_desc:0 "A stone mole reaches into the bay, and warehouses crowd the quay behind it. Ships from the south now put in where the hills meet the water."
 zin_regional_plutondo_healing_houses:0 "Houses of Healing"
 zin_regional_plutondo_healing_houses_desc:0 "Clean wards with cool floors treat every fever and every wound."
 zin_regional_plutondo_hill_granaries:0 "Granaries of the Hills"
 zin_regional_plutondo_hill_granaries_desc:0 "Stone granaries stand in every hill village, sealed with the prince's mark and filled before the first frost. A poor harvest in Plutondo means a thin winter, not a famine."
 zin_regional_plutondo_houses_of_healing:0 "Houses of Healing"
 zin_regional_plutondo_houses_of_healing_desc:0 "Clean wards with cool floors and shaded courtyards open in the market towns of [ROOT.GetName]. The Houses' healers treat every fever and every wound, and ask no questions of the patients."
 zin_regional_plutondo_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_plutondo_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_plutondo_levies_for_the_host:0 "Levies for the Host"
 zin_regional_plutondo_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_plutondo_levy_rolls:0 "The Levy Rolls"
 zin_regional_plutondo_levy_rolls_desc:0 "The rolls are rewritten each autumn, village by village. A man's name, trade and age are copied by two clerks, and the second copy goes to the prince."
 zin_regional_plutondo_levy_rolls_spirit:0 "The Levy Rolls"
 zin_regional_plutondo_levy_rolls_spirit_desc:0 "Every household has its name on the long scroll, and every name has its place in a company. The prince can call ten thousand in a week and feed them for a month."
 zin_regional_plutondo_lords_of_the_desert_hills:0 "Lords of the Desert Hills"
 zin_regional_plutondo_lords_of_the_desert_hills_desc:0 "The hill lords bring their riders in on the prince's call and take their share of the road-tolls in return. Their loyalty is bought every season, and so far it has held."
 zin_regional_plutondo_no_mans_debtor:0 "No Man's Debtor"
 zin_regional_plutondo_no_mans_debtor_desc:0 "The last coin is paid, the last ledger closed, and the prince walks out of Postondoroth's counting-house a free man. His hill lords cheer in the streets."
 zin_regional_plutondo_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_plutondo_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_plutondo_own_counsel:0 "Our Own Counsel"
 zin_regional_plutondo_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_plutondo_pacts_right_hand:0 "The Pact's Right Hand"
 zin_regional_plutondo_pacts_right_hand_desc:0 "Plutondo's spears ride beside Stabilo's in every drill and parade. The Pact's captains say the hill levies are the best-fed troops in the East."
 zin_regional_plutondo_pay_down_the_ledger:0 "Pay Down the Ledger"
 zin_regional_plutondo_pay_down_the_ledger_desc:0 "Blozan sets aside a fixed share of every toll for Postondoroth's clerks. The debt shrinks slowly, and with it the prince's need to flatter."
 zin_regional_plutondo_prince_of_plutondo:0 "The Prince of Plutondo"
 zin_regional_plutondo_prince_of_plutondo_desc:0 "Hill lords bow at the gate, desert lords at the hall and the Pact's envoys at the high seat. The prince is no longer one lord among many, and he has begun to dress as if he knew it."
 zin_regional_plutondo_question_of_the_east:0 "The Question of the East"
 zin_regional_plutondo_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_plutondo_sailors_of_plutondo:0 "Sailors of Plutondo"
 zin_regional_plutondo_sailors_of_plutondo_desc:0 "The coast's fishers and ferrymen are taken into the prince's service and taught to row in time. They are the first sailors Plutondo has ever had."
 zin_regional_plutondo_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_plutondo_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_plutondo_stones_settled:0 "The Boundary Stones Settled"
 zin_regional_plutondo_temples_of_the_deliverer:0 "Temples of the Deliverer"
 zin_regional_plutondo_temples_of_the_deliverer_desc:0 "The temples of the Deliverer have a name for gentle hands and open purses, and [ROOT.GetName] gives them land and a hearing. Their priests keep the roadside shrines, bless the caravans and ask only that the court remember them kindly."
 zin_regional_plutondo_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_plutondo_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_plutondo_the_gold_roads_end:0 "The Gold Road's End"
 zin_regional_plutondo_the_gold_roads_end_desc:0 "Wagons unload in Plutondo's yards and the porters start their long walk home. The prince's market is the busiest of the eastern gates."
 zin_regional_plutondo_the_great_levy:0 "The Great Levy"
 zin_regional_plutondo_the_great_levy_desc:0 "When the prince sounds the great horn, every village sends its companies to the hill fortress. A host of that size has not been seen in the East since the roads were opened."
 zin_regional_plutondo_the_hill_coast:0 "The Hill Coast"
 zin_regional_plutondo_the_hill_coast_desc:0 "The short coast under the hills has small bays and rough water. Fishermen have sailed it for generations, and the prince now wants the shipwrights to follow."
 zin_regional_plutondo_the_many_of_plutondo:0 "The Many of Plutondo"
 zin_regional_plutondo_the_many_of_plutondo_desc:0 "Plutondo has more people than any other southern crown, and the prince counts them with pride. Porters, guards and ploughmen all answer to the muster."
 zin_regional_plutondo_the_pacts_right_hand:0 "The Pact's Right Hand"
 zin_regional_plutondo_the_pacts_right_hand_desc:0 "Plutondo's levies now stand at the Pact's right, and their captains drill beside Stabilo's veterans. The prince's name is read first at the Pact's table after the king's."
 zin_regional_plutondo_the_prince_of_plutondo:0 "The Prince of Plutondo"
 zin_regional_plutondo_the_prince_of_plutondo_desc:0 "The title is read aloud in the hill fortress, and the hill lords answer with one voice. The prince is now the first of Plutondo, not one of its many."
 zin_regional_plutondo_the_princes_court:0 "The Prince's Court"
 zin_regional_plutondo_the_princes_court_desc:0 "Prince Blozan rules sixteen states of desert, hills and a short coast, and fills the caravans of the Gold Road with his porters and guards. Plutondo is crowded, poor and proud."
 zin_regional_plutondo_the_princes_treasury:0 "The Prince's Treasury"
 zin_regional_plutondo_the_princes_treasury_desc:0 "A vaulted treasury with three locks takes the place of the old strongbox. The prince's clerks keep two ledgers, one for Postondoroth's eyes and one for their own."
 zin_regional_plutondo_wait_upon_events:0 "Wait Upon Events"
 zin_regional_plutondo_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_plutondo_watch_the_quays:0 "Watch the Quays"
 zin_regional_plutondo_watch_the_quays_desc:0 "Port-wardens and gate-clerks are told to record every chest, bale and passenger that crosses the quays of [ROOT.GetName]. The court learns who comes and goes, and for whom."
 zin_regional_plutondo_watchful_quays:0 "Watchful Quays"
 zin_regional_plutondo_watchful_quays_desc:0 "Every chest, bale and passenger that crosses the quays is recorded."
 zin_regional_plutondo_welcome_the_generous_friends:0 "Welcome the Generous Friends"
 zin_regional_plutondo_welcome_the_generous_friends_desc:0 "The Houses of the First Light offer hospitals, grain stores and loans at easy terms, and the court of [ROOT.GetName] opens its doors to them. Their friends have long memories for kindness shown."
 zin_regional_plutondo_when_the_king_falls:0 "When the King Falls"
 zin_regional_plutondo_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_plutondo_workshops_of_the_many:0 "Workshops of the Many"
 zin_regional_plutondo_workshops_of_the_many_desc:0 "Joiners, weavers and rope-makers set up in long sheds beside the caravan yards. They work cheaply, because there are always more hands."
 zin_regional_plutondo.1.a:0 "Let the stones lie"
 zin_regional_plutondo.1.b:0 "Settle it with Drak"
 zin_regional_plutondo.1.c:0 "Settle it with Erco"
 zin_regional_plutondo.1.d:0 "Boundary stones between the three crowns have moved again, and the shepherds on each side swear that the others moved them. The prince's surveyors have walked the line twice and found it a little different each time."
 zin_regional_plutondo.1.t:0 "Between Drak and Erco"
