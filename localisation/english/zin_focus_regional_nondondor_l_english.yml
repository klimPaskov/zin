l_english:
 zin_regional_nondondor_banks_fishers:0 "Fishers of the Banks"
 zin_regional_nondondor_banks_fishers_desc:0 "The royal fishers are given better boats and a share of the catch tax. They work the banks longer hours than anyone, and keep their weapons within reach."
 zin_regional_nondondor_banks_galleys:0 "Galleys on the Banks"
 zin_regional_nondondor_banks_galleys_desc:0 "A line of royal galleys lies at anchor over the best fishing grounds. Any boat that comes without leave is asked its business."
 zin_regional_nondondor_banks_quiet:0 "The Banks Stay Quiet"
 zin_regional_nondondor_banks_quiet_desc:0 "Whatever the great crowns do, Nondondor holds its galleys in harbour and its nets in the water. The banks are fished in peace, and the king is content."
 zin_regional_nondondor_banks_war_galleys:0 "Galleys on the Banks"
 zin_regional_nondondor_banks_war_galleys_desc:0 "A third of the royal galleys are moved to the southern stations, and are stripped of their cargo space. Their commanders are told to hold their fire, and to hold the line."
 zin_regional_nondondor_corsair_kings:0 "Corsair Kings"
 zin_regional_nondondor_corsair_kings_desc:0 "The captains holding letters become lords in their own right, and sail with the king's flag at the mast. They are rich, feared, and very hard to refuse."
 zin_regional_nondondor_corsair_kings_spirit:0 "Corsair Kings"
 zin_regional_nondondor_corsair_kings_spirit_desc:0 "The king grants letters to the best of his corsair captains and takes a tenth of what they bring home. They raid the lanes of others, and they sail under his flag."
 zin_regional_nondondor_corsair_letters:0 "Letters for the Corsairs"
 zin_regional_nondondor_corsair_letters_desc:0 "The king signs letters that let his captains take any ship that flies the wrong flag. The letters are very popular, and the harbour fills with salvage."
 zin_regional_nondondor_crown_of_the_banks:0 "The Crown of the Banks"
 zin_regional_nondondor_crown_of_the_banks_desc:0 "King Benan wears a crown of silver fish-scales and sits at the head of the island clans. The banks feed him, and he rules them."
 zin_regional_nondondor_fishers_of_the_banks:0 "Fishers of the Banks"
 zin_regional_nondondor_fishers_of_the_banks_desc:0 "The king's own fishers are given larger boats and a larger share. They sail with the galleys at their backs."
 zin_regional_nondondor_fishing_rights:0 "A Charter of Fishing Rights"
 zin_regional_nondondor_fishing_rights_charter:0 "A Charter of Fishing Rights"
 zin_regional_nondondor_fishing_rights_charter_desc:0 "The accord is written into a charter and read aloud in both harbours. A net is a net and a catch is a catch, and the stone is there to remind them."
 zin_regional_nondondor_fishing_rights_desc:0 "The banks are divided by agreement, season by season, between the king's boats and the Seite fishers. A neighbour's net now means a neighbour's catch, and nothing worse."
 zin_regional_nondondor_galley_yards:0 "The Galley Yards"
 zin_regional_nondondor_galley_yards_desc:0 "A second line of slips is cut into the beach and roofed against the rain. The king wants a dozen new galleys by the next spring."
 zin_regional_nondondor_galleys_for_hire:0 "Galleys for Hire"
 zin_regional_nondondor_galleys_for_hire_desc:0 "The western fleets are short of hulls and long on silver. Nondondor lets its galleys go to the Crossing, one season at a time."
 zin_regional_nondondor_hang_the_corsairs:0 "Hang the Corsairs"
 zin_regional_nondondor_hang_the_corsairs_desc:0 "The king decides to end the trade. The worst of the captains are hanged from the harbour mole, and the rest are told to find honest work."
 zin_regional_nondondor_harbour_for_strangers:0 "A Harbour for Strangers"
 zin_regional_nondondor_harbour_for_strangers_desc:0 "The king orders his harbour-master to receive every ship that comes in peace. A stranger's money is as good as a clansman's, and the harbour is better for it."
 zin_regional_nondondor_king_benans_hall:0 "King Benan's Hall"
 zin_regional_nondondor_king_benans_hall_desc:0 "Nondondor is a single island under a king who sits in a hall of black timber above the harbour. Benan has held the throne for a long time, and the clans still come to his table when he calls."
 zin_regional_nondondor_patrol_the_banks:0 "Patrol the Banks"
 zin_regional_nondondor_patrol_the_banks_desc:0 "A pair of royal galleys is sent to sit over the banks and watch. They carry no orders to fight, only to be seen."
 zin_regional_nondondor_press_the_banks:0 "Press Our Claim to the Banks"
 zin_regional_nondondor_press_the_banks_desc:0 "The king has a herald read his claim to the Seite elders. It is long, formal and perfectly clear, and it says that the banks are Nondondor's."
 zin_regional_nondondor_royal_stores:0 "Royal Stores"
 zin_regional_nondondor_royal_stores_desc:0 "The king's steward counts every barrel, sack and coil of rope in the royal stores. In a bad winter he opens them to the clans."
 zin_regional_nondondor_salt_fish:0 "Salt Fish"
 zin_regional_nondondor_salt_fish_desc:0 "Nondondor's cod is cured with local salt and packed in barrels. It keeps for a year and sells for twice what a fresh fish brings."
 zin_regional_nondondor_share_the_banks:0 "Share the Banks"
 zin_regional_nondondor_share_the_banks_desc:0 "The king offers a share to each side: the banks fished by turns, the catch landed on whichever pier the weather allows. It is not what his captains want, but it is what keeps the sea quiet."
 zin_regional_nondondor_southern_squadron:0 "The Southern Flotilla"
 zin_regional_nondondor_southern_squadron_desc:0 "The royal galleys have a home port, a signal-book and a drill-master. They can sail in line and fight as one, and they know the southern banks by night."
 zin_regional_nondondor_the_banks_accord_kept:0 "The Banks Accord"
 zin_regional_nondondor_the_banks_accord_kept_desc:0 "The banks are shared at last, and the quarrel is carved into a stone on the quay. Nondondor keeps its half of the bargain, and expects the Seite fishers to keep theirs."
 zin_regional_nondondor_the_banks_by_force:0 "The Banks by Force"
 zin_regional_nondondor_the_banks_by_force_desc:0 "The galleys leave their moorings, the drums are beaten in the harbour and the herald's boat goes out under a red flag. The king has chosen."
 zin_regional_nondondor_the_banks_by_right:0 "The Banks by Right"
 zin_regional_nondondor_the_banks_by_right_desc:0 "The king's lawyers draw a map in which the banks lie wholly within Nondondor's waters. If it is not accepted, it will be defended."
 zin_regional_nondondor_the_banks_stay_quiet:0 "The Banks Stay Quiet"
 zin_regional_nondondor_the_banks_stay_quiet_desc:0 "The king declares that the banks will be fished as they always were. His galleys remain in harbour, and the great quarrels of the mainland pass by."
 zin_regional_nondondor_the_contested_banks:0 "The Contested Banks"
 zin_regional_nondondor_the_contested_banks_desc:0 "The fishing banks south of the island are claimed by the king and by the Seite fishers alike. Boats are boarded and nets are cut, and every captain keeps a watch for the other side."
 zin_regional_nondondor_the_corsair_coves:0 "The Corsair Coves"
 zin_regional_nondondor_the_corsair_coves_desc:0 "Some of Nondondor's captains sail as corsairs when trade is lean. The king has not yet decided whether to hang them or to give them letters."
 zin_regional_nondondor_the_crown_of_the_banks:0 "The Crown of the Banks"
 zin_regional_nondondor_the_crown_of_the_banks_desc:0 "The king has a crown made from the scales of the first fish of the season. He wears it at the clan feast, and no one says that the island is not his."
 zin_regional_nondondor_the_great_war_at_sea:0 "The War at Sea"
 zin_regional_nondondor_the_great_war_at_sea_desc:0 "Great fleets have taken to the water. The king calls the clans to the hall to say what Nondondor will do, and none of them are quite sure."
 zin_regional_nondondor_the_harbour_town:0 "The Harbour Town"
 zin_regional_nondondor_the_harbour_town_desc:0 "The little town below the king's hall is given a proper quay, a customs shed and a warehouse. A ship may now lie alongside and unload."
 zin_regional_nondondor_the_high_speakers_seat:0 "The High Speaker's Seat"
 zin_regional_nondondor_the_high_speakers_seat_desc:0 "The old charts name a High Speaker of the Roads whom every harbour obeyed, and the king of the banks reads the title with great interest. Nobody at court mentions that the Speaker was elected."
 zin_regional_nondondor_the_island_clans:0 "The Island Clans"
 zin_regional_nondondor_the_island_clans_desc:0 "The island is held by a dozen clans, each with its own cove and its own grudges. Benan feasts them in turn and listens to what each has to say."
 zin_regional_nondondor_the_kings_galleys_for_the_living:0 "The King's Galleys for the Living"
 zin_regional_nondondor_the_kings_galleys_for_the_living_desc:0 "The stranger has returned, and the king remembers his own father's stories of the southern ship. He sends his galleys north, with a crew who will not be turned back."
 zin_regional_nondondor_the_kings_market:0 "The King's Market"
 zin_regional_nondondor_the_kings_market_desc:0 "A covered market is built beside the harbour, and the king takes a toll at its gate. Traders come from the neighbouring isles, grumbling as they pay."
 zin_regional_nondondor_the_rams:0 "The Rams"
 zin_regional_nondondor_the_rams_desc:0 "The prow of each new galley is shod with a bronze ram. Whoever meets one in a narrow channel will not meet it twice."
 zin_regional_nondondor_the_royal_fleet:0 "The Royal Fleet"
 zin_regional_nondondor_the_royal_fleet_desc:0 "Admiral Saric Benan, the king's cousin, takes command of the galleys. He is a strict man and a fine sailor, and the galleys have begun to behave."
 zin_regional_nondondor_the_royal_galleys:0 "The Royal Galleys"
 zin_regional_nondondor_the_royal_galleys_desc:0 "The king's galleys lie in a row at the head of the harbour. The shipwrights are told to make them lighter and the oarsmen are told to row faster."
 zin_regional_nondondor_the_royal_peace_at_sea:0 "The King's Peace at Sea"
 zin_regional_nondondor_the_royal_peace_at_sea_desc:0 "The king proclaims a peace at sea and sends envoys to the chart houses to join their league. The corsairs are gone, and the lanes are quiet."
 zin_regional_nondondor_the_sea_roads_by_the_crown:0 "The Sea-Roads by the Crown"
 zin_regional_nondondor_the_sea_roads_by_the_crown_desc:0 "The league never gave its sea to a king, and the king of the banks means to take it all the same. Seite and Raerby will refuse, and the king has galleys for that."
 zin_regional_nondondor_the_southern_banks:0 "The Southern Banks"
 zin_regional_nondondor_the_southern_banks_desc:0 "The shallow grounds south of Nondondor teem with cod and herring. The king calls them his, and the Seite fishers call them their fathers'."
 zin_regional_nondondor_the_southern_squadron:0 "The Southern Flotilla"
 zin_regional_nondondor_the_southern_squadron_desc:0 "The galleys are given a home port, a signal-book and a drill-master. They are no longer a crowd of boats, but a fleet."
 zin_regional_nondondor.1.a:0 "Yield the banks"
 zin_regional_nondondor.1.b:0 "Our fathers fished there"
 zin_regional_nondondor.1.d:0 "A royal galley has dropped anchor off the Seite pier with a herald in the bow. King Benan, he says, holds the southern banks by right, and the Seite fishers are to buy leave to cast their nets there. The moot stone is cold, and the elder's boat has not come in."
 zin_regional_nondondor.1.t:0 "Nondondor Claims the Southern Banks"
 zin_regional_nondondor.2.a:0 "Share them"
 zin_regional_nondondor.2.b:0 "We trust no king"
 zin_regional_nondondor.2.d:0 "A boat flying the king's flag comes in under a white sail. The herald says that King Benan will share the southern banks, season by season, and would sooner settle the matter at the moot stone than at the oar. The moot has heard fair words before."
 zin_regional_nondondor.2.t:0 "Nondondor Offers to Share the Banks"
