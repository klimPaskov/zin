l_english:
 zin_regional_troll_forest_deep_forest:0 "The Deep Forest"
 zin_regional_troll_forest_deep_forest_desc:0 "The paths shift, the trees close behind a traveller and the light fails at midday. An army entering the Deep Forest finds that the forest has already decided what to do with it."
 zin_regional_troll_forest_forest_law:0 "The Forest Law"
 zin_regional_troll_forest_forest_law_desc:0 "No tree is felled without leave, no path is trodden without invitation and no stranger leaves without being seen. The law is old, unwritten and enforced by trolls."
 zin_regional_troll_forest_forest_wakes:0 "The Forest Wakes"
 zin_regional_troll_forest_forest_wakes_desc:0 "The trees lean in, the paths close and every troll in the wood is out of his hollow. The forest has woken, and it is not pleased."
 zin_regional_troll_forest_hide_plates:0 "Hide Plates"
 zin_regional_troll_forest_hide_plates_desc:0 "Hide is cured with oak-bark and bound in layers, and plates of it are laced across the chest and thighs. A troll in hide plates is almost as hard to hurt as a troll in stone."
 zin_regional_troll_forest_kin_for_any_coin:0 "Troll-Kin for Any Coin"
 zin_regional_troll_forest_kin_for_any_coin_desc:0 "The forest will fight for anyone, if the coin is right and the quarrel is not the forest's own. It is an honest offer, and the whole Dark Lands knows it."
 zin_regional_troll_forest_kin_for_cocanoor:0 "Troll-Kin for Cocanoor"
 zin_regional_troll_forest_kin_for_cocanoor_desc:0 "Cocanoor has always paid well and paid in advance. Brunn writes to the Warking with an offer, and wonders how much of the forest's goodwill the offer includes."
 zin_regional_troll_forest_kin_for_the_accord:0 "Troll-Kin for the Accord"
 zin_regional_troll_forest_kin_for_the_accord_desc:0 "Dondor is small and needs help more than most. Brunn Silver-Counter writes to Notbuton offering a band of trolls at a fair price."
 zin_regional_troll_forest_lighter_envoys:0 "Envoys Sent Back Lighter"
 zin_regional_troll_forest_long_memories:0 "Long Memories"
 zin_regional_troll_forest_long_memories_desc:0 "Whatever the forest decided, it remembers. It recalls every name, every face and every price, and it will recall them again when they are needed."
 zin_regional_troll_forest_long_memories_spirit:0 "Long Memories"
 zin_regional_troll_forest_long_memories_spirit_desc:0 "Trolls recall every slight and every gift for longer than a man lives. Strangers who come to the wood find that their names are known."
 zin_regional_troll_forest_nobody_enters:0 "Nobody Enters"
 zin_regional_troll_forest_nobody_enters_desc:0 "It is said in the Dark Lands that nobody enters the Troll Forest and walks out again. The saying is mostly true, and Troy does nothing to make it less so."
 zin_regional_troll_forest_old_trees_watch:0 "The Old Trees Watch"
 zin_regional_troll_forest_old_trees_watch_desc:0 "The oldest trees are marked with white bark-paint, and a troll sits at the root of each through the night. Nothing moves in the wood that they do not know."
 zin_regional_troll_forest_old_trees_watch_spirit:0 "The Old Trees Watch"
 zin_regional_troll_forest_old_trees_watch_spirit_desc:0 "The oldest trees of the forest are marked with white bark-paint, and trolls sit at their roots through the night. Nothing moves under the canopy that they do not hear."
 zin_regional_troll_forest_old_ways:0 "The Old Ways"
 zin_regional_troll_forest_old_ways_desc:0 "The elders of the wood hold that nothing changes without a reason as old as the forest. A troll who follows the old ways is slow to anger and slower to forgive."
 zin_regional_troll_forest_paths_that_wander:0 "Paths That Wander"
 zin_regional_troll_forest_paths_that_wander_desc:0 "The forest paths shift overnight, so that a traveller who walked in yesterday cannot walk out today. Troy says nothing about how it is done."
 zin_regional_troll_forest_send_them_back_lighter:0 "Send Them Back Lighter"
 zin_regional_troll_forest_send_them_back_lighter_desc:0 "The strangers leave the forest with less than they brought: their gifts stay, and so does their pride. Troy says that the forest has no use for a friend who needs to buy one."
 zin_regional_troll_forest_stone_clubs:0 "Stone Clubs"
 zin_regional_troll_forest_stone_clubs_desc:0 "Clubs of black oak are bound with strips of iron and studded with granite. A swing of one is a hammer-blow, and the sound carries a long way."
 zin_regional_troll_forest_stone_for_the_south:0 "Stone for the South"
 zin_regional_troll_forest_stone_for_the_south_desc:0 "The strangers ask for strong young trolls, and offer stone-hard coin. The elders say no, and the young say yes, and the young have their way."
 zin_regional_troll_forest_stone_hides:0 "Stone Hides"
 zin_regional_troll_forest_stone_hides_desc:0 "The hides of the oldest trolls turn to grey stone with age, and spears glance from them. The younger trolls rub themselves with clay and mica, in hope."
 zin_regional_troll_forest_strangers_under_the_eaves:0 "Strangers Under the Eaves"
 zin_regional_troll_forest_strangers_under_the_eaves_desc:0 "Strangers from Nafeher have come to the eaves of the forest, asking leave to walk its paths. The trolls let them in, which is rare, and watch them closely."
 zin_regional_troll_forest_the_forest_answers_none:0 "The Forest Answers None"
 zin_regional_troll_forest_the_forest_answers_none_desc:0 "Cocanoor's envoy waits at the edge of the forest for three days and is not received. On the fourth day he goes home, and the trees close behind him."
 zin_regional_troll_forest_the_forest_endures:0 "The Forest Endures"
 zin_regional_troll_forest_the_forest_endures_desc:0 "The war is over, and the forest stands. The trolls return to their hollows and the paths open a little, and Troy sits down in his clearing and says nothing at all."
 zin_regional_troll_forest_the_forest_law:0 "The Forest Law"
 zin_regional_troll_forest_the_forest_law_desc:0 "The law of the forest is cut into the bark of the oldest oaks and renewed at every equinox. A troll who breaks it is shown the cut and asked to explain."
 zin_regional_troll_forest_the_forest_moot:0 "The Forest Moot"
 zin_regional_troll_forest_the_forest_moot_desc:0 "Elders and young trolls sit in a ring under the oldest oak, and for a day and a night they argue without raising their voices. At dawn, there is a decision."
 zin_regional_troll_forest_the_forest_wakes:0 "The Forest Wakes"
 zin_regional_troll_forest_the_forest_wakes_desc:0 "The trees lean in, the paths close and every troll in the wood is out of his hollow. The forest has woken, and Troy is among those who walk."
 zin_regional_troll_forest_the_moot_and_the_forest:0 "The Moot and the Forest"
 zin_regional_troll_forest_the_moot_and_the_forest_desc:0 "The free holds send an invitation to their Moot, and Troy has it read to him twice. The forest, he says, may find friends among those who knock before they enter."
 zin_regional_troll_forest_the_old_ones_forest:0 "The Old One's Forest"
 zin_regional_troll_forest_the_old_ones_forest_desc:0 "Troy the Old keeps the heart of the forest, a clearing of moss and standing stones where he sits and says little. The trolls come to him with their quarrels, and leave with their answers."
 zin_regional_troll_forest_the_old_ways:0 "The Old Ways"
 zin_regional_troll_forest_the_old_ways_desc:0 "The elders speak for the old ways: stay in the wood, trade little and keep the paths hidden. The forest has outlasted a hundred crowns by being forgotten."
 zin_regional_troll_forest_the_silver_hoard:0 "The Silver Hoard"
 zin_regional_troll_forest_the_silver_hoard_desc:0 "Troll silver accumulates in a hollow oak, guarded by a very old troll with a very poor memory for faces. The hoard grows, and so does its guard."
 zin_regional_troll_forest_the_trolls_march:0 "The Trolls March"
 zin_regional_troll_forest_the_trolls_march_desc:0 "When the trolls leave the forest in a body, the ground shakes and the birds go quiet. The drums are hollow logs, and they carry for leagues."
 zin_regional_troll_forest_the_young_ways:0 "The Young Ways"
 zin_regional_troll_forest_the_young_ways_desc:0 "The young speak for something new: coin for work, fame for strength, a place in the wide world for those who can hold one. The elders mutter, but they do not forbid it."
 zin_regional_troll_forest_the_younger_trolls:0 "The Younger Trolls"
 zin_regional_troll_forest_the_younger_trolls_desc:0 "The young trolls of the forest are strong, restless and curious about what lies beyond the trees. Troy lets them go out in bands and bids them come home before the first frost."
 zin_regional_troll_forest_troll_bands:0 "Troll Bands"
 zin_regional_troll_forest_troll_bands_desc:0 "Troll bands of fifty each are formed under their own captains, with banners of dyed bark and horns of hollow oak. They fight for a season and come home with their pay."
 zin_regional_troll_forest_troll_bands_spirit:0 "Troll Bands"
 zin_regional_troll_forest_troll_bands_spirit_desc:0 "Troll bands that have hired out for pay and returned bring home stories, scars and tricks. The next generation learns faster for it."
 zin_regional_troll_forest_troll_brutes:0 "Troll Brutes"
 zin_regional_troll_forest_troll_brutes_desc:0 "Troll brutes are chosen at their coming of age, tested against a tree and a boulder and given a club of black oak. They will fight until they are hurt, and a while after that."
 zin_regional_troll_forest_troll_silver:0 "Troll Silver"
 zin_regional_troll_forest_troll_silver_desc:0 "Trolls like silver, though they could not say why. Troy announces that the forest's young will fight for any hold that pays, and the offer goes out on every wind."
 zin_regional_troll_forest_trolls_in_the_line:0 "Trolls in the Line"
 zin_regional_troll_forest_trolls_in_the_line_desc:0 "Troll bands go out of the forest and take their stations in the line, each beside a hold's own spears. They fight with their clubs, and when the clubs break, with their fists."
 zin_regional_troll_forest_trolls_march:0 "The Trolls March"
 zin_regional_troll_forest_trolls_march_desc:0 "When the trolls leave the wood in a body, the ground shakes and the birds go quiet. A line of them is slow to form, and impossible to stop."
 zin_regional_troll_forest_troy_speaks:0 "Troy Speaks"
 zin_regional_troll_forest_troy_speaks_desc:0 "Troy speaks seldom, but when he does, the trolls fall silent and the leaves seem to stop moving. His words are short, strange and always right, and nobody asks him to repeat them."
 zin_regional_troll_forest_young_ways:0 "The Young Ways"
 zin_regional_troll_forest_young_ways_desc:0 "The young want coin, fame and a place in the wide world beyond the trees. They are loud, strong and quick to start a fight, and they get their way more often than the elders like."
 zin_regional_troll_forest.1.a:0 "Listen."
 zin_regional_troll_forest.1.b:0 "Ask him about the south."
 zin_regional_troll_forest.1.d:0 "The clearing is silent, and the trolls who have gathered there hold their breath. Troy lifts his head, and the moss on his shoulders ripples. Whatever he says will be remembered."
 zin_regional_troll_forest.1.t:0 "Troy the Old Speaks"
 zin_regional_troll_forest.2.a:0 "Not trolls."
 zin_regional_troll_forest.2.b:0 "Hire them."
 zin_regional_troll_forest.2.d:0 "A troll in a cloak of moss stands at the gate with a letter from the forest. It offers a band of trolls for a season, for a fair price, and says that the forest asks no questions about the quarrel."
 zin_regional_troll_forest.2.t:0 "Trolls for Hire"
 zin_regional_troll_forest.3.a:0 "Watch them go."
 zin_regional_troll_forest.3.d:0 "The trolls let the strangers in, which is rare, and let them out again, which is rarer. They walk away with a good deal less than they brought, and a good deal to think about."
 zin_regional_troll_forest.3.t:0 "Strangers Under the Eaves"
