l_english:
 zin_regional_lccimio_answer_the_elder_moot:0 "Answer the Elder Moot"
 zin_regional_lccimio_answer_the_elder_moot_desc:0 "When the Elder Moot calls the realms to speak with one voice, Lccimio does not leave the answer to others. Its elders ride to the moot with their houses behind them."
 zin_regional_lccimio_beacons_of_lccimio:0 "Beacons of Lccimio"
 zin_regional_lccimio_beacons_of_lccimio_desc:0 "Stone beacons rise on the headlands, each in sight of the next, ready to carry a warning from the last quay to the council hall before the tide turns."
 zin_regional_lccimio_council_of_the_long_shore:0 "Council of the Long Shore"
 zin_regional_lccimio_council_of_the_long_shore_desc:0 "With the houses agreed on how they sit, the council speaks for the whole shore, from the first orchard to the last white quay."
 zin_regional_lccimio_elder_wardens:0 "Elder Wardens"
 zin_regional_lccimio_elder_wardens_desc:0 "The oldest wardens teach the youngest in the rhythms of a long defence. They have not fought in generations, and they have forgotten none of it."
 zin_regional_lccimio_elder_wardens_spirit:0 "Elder Wardens"
 zin_regional_lccimio_elder_wardens_spirit_desc:0 "Old wardens teach the young the long patience of a defence that never stops."
 zin_regional_lccimio_elders_of_lccimio:0 "The Elders of Lccimio"
 zin_regional_lccimio_elders_of_lccimio_desc:0 "The elder houses of the Long Shore sit beneath the lantern-trees, and Elder Lusmio calls them to order. On this shore nobody decides alone what the houses may decide together."
 zin_regional_lccimio_elven_sails_of_the_shore:0 "Elven Sails of the Shore"
 zin_regional_lccimio_elven_sails_of_the_shore_desc:0 "The shipwrights lay down hulls meant to go out and look, not to stay and fight. White sails are sewn for the long crossing that nobody on the shore has yet needed to make."
 zin_regional_lccimio_every_grove_a_fortress:0 "Every Grove a Fortress"
 zin_regional_lccimio_every_grove_a_fortress_desc:0 "Every orchard is made a stronghold, with its lanes barred, its wells covered and its tallest trees manned with archers."
 zin_regional_lccimio_grove_riders:0 "Grove Riders"
 zin_regional_lccimio_grove_riders_desc:0 "White deer are gentled in the high orchards, trained to carry a rider through the trees without sound. They are a scout's mount, never a charger's."
 zin_regional_lccimio_grove_workshops:0 "Grove Workshops"
 zin_regional_lccimio_grove_workshops_desc:0 "Joiners, coopers and weavers set up under the orchard eaves, working the wood and fibre the groves shed. Nothing is felled that has not first fallen."
 zin_regional_lccimio_groves_of_lccimio:0 "Groves of Lccimio"
 zin_regional_lccimio_groves_of_lccimio_desc:0 "The orchard groves that give the shore its wealth are tended again in their old rows, and a pressing-house is raised where the best fruit is brought."
 zin_regional_lccimio_healers_of_lccimio:0 "Healers of Lccimio"
 zin_regional_lccimio_healers_of_lccimio_desc:0 "The shore has more healers than wars to heal. Lccimio sends the surplus abroad, one by one, to wherever the sick are many and the herbs are few."
 zin_regional_lccimio_houses_of_the_long_shore:0 "Houses of the Long Shore"
 zin_regional_lccimio_houses_of_the_long_shore_desc:0 "Orchard-houses, quay-houses and wellspring-houses each keep a seat and a grudge. A fixed place at the table for every house quiets the quarrels before they begin."
 zin_regional_lccimio_into_the_rift_sea:0 "Into the Rift Sea"
 zin_regional_lccimio_into_the_rift_sea_desc:0 "The wardens throw the first landing back into the water, and the shore holds. The Elders ask only that it hold for a year more."
 zin_regional_lccimio_keep_the_roads_open:0 "Keep the Roads Open"
 zin_regional_lccimio_keep_the_roads_open_desc:0 "The roads stay free to any footsore traveller. A shore that turns away the weary has forgotten what its wellsprings are for."
 zin_regional_lccimio_kin_of_the_woods:0 "Kin of the Woods"
 zin_regional_lccimio_kin_of_the_woods_desc:0 "Lccimio sends its elders to the great groves of the Magical Forest with fruit, wine and an open hand. The kin of the woods are slow to forget, and slower to refuse."
 zin_regional_lccimio_long_shore_prospers:0 "The Long Shore Prospers"
 zin_regional_lccimio_long_shore_prospers_desc:0 "Rich quays and busy yards: building goes quickly, though the shore buys more luxuries than it used to."
 zin_regional_lccimio_longbow_companies:0 "Longbow Companies"
 zin_regional_lccimio_longbow_companies_desc:0 "Bowyers of the shore cut yew from the oldest rows and string their bows with silk from the quay-looms. Each company draws its own mark."
 zin_regional_lccimio_lusmios_counsel:0 "Lusmio's Counsel"
 zin_regional_lccimio_lusmios_counsel_desc:0 "Lusmio has sat in council longer than Aenor has had its present dynasty, and he remembers what each house promised and in which year. His patience is the shore's slowest and surest tool."
 zin_regional_lccimio_lusmios_counsel_spirit:0 "Lusmio's Counsel"
 zin_regional_lccimio_lusmios_counsel_spirit_desc:0 "The oldest voice in the Elders' hall teaches the younger houses to wait, and what they wait for tends to arrive."
 zin_regional_lccimio_old_houses:0 "The Old Houses Hold"
 zin_regional_lccimio_old_houses_desc:0 "The council keeps its ancient order, and the shore is stubborn in defence of its customs."
 zin_regional_lccimio_open_houses:0 "The Open Houses"
 zin_regional_lccimio_open_houses_desc:0 "Young houses and newcomers sit in council, and ideas travel from the quays to the high seats."
 zin_regional_lccimio_orchard_roads:0 "Orchard Roads"
 zin_regional_lccimio_orchard_roads_desc:0 "Paved lanes run between the orchard rows so that carts may reach the quays in any weather. The first frost no longer spoils a season's fruit."
 zin_regional_lccimio_pilgrims_on_the_shore_road:0 "Pilgrims on the Shore Road"
 zin_regional_lccimio_pilgrims_on_the_shore_road_desc:0 "Grey-robed pilgrims have begun to walk the Shore Road toward the Zilin Hills. The orchard gates stay open to them, and the Elders have not yet decided what that means."
 zin_regional_lccimio_rift_watch:0 "The Watch on the Rift"
 zin_regional_lccimio_rift_watch_desc:0 "Lantern-keepers on every headland see ships long before the ships see the shore."
 zin_regional_lccimio_shipwrights_of_the_shore:0 "Shipwrights of the Shore"
 zin_regional_lccimio_shipwrights_of_the_shore_desc:0 "The only elven sails on the rift are built in Lccimio's yards, on keels of timber the groves give willingly, and every hull is blessed before it meets the water."
 zin_regional_lccimio_shore_holds:0 "The Shore Holds"
 zin_regional_lccimio_shore_holds_desc:0 "The wardens have thrown the landing back into the sea, and every grove stands as a wall behind them."
 zin_regional_lccimio_shore_wardens:0 "Shore Wardens"
 zin_regional_lccimio_shore_wardens_desc:0 "Wardens are posted along the whole length of the shore road, with bows, signal horns and orders to light the beacons at the first strange keel."
 zin_regional_lccimio_songs_with_the_forest:0 "Songs with the Forest"
 zin_regional_lccimio_songs_with_the_forest_desc:0 "Choirs of the Long Shore learn the warding-songs of the great forest, and the old protections are sung over the headlands at the turn of every season."
 zin_regional_lccimio_stand_with_the_kindred:0 "Stand with the Kindred"
 zin_regional_lccimio_stand_with_the_kindred_desc:0 "The Kindred of the Woods has been raised, to defend elven land and nothing beyond it. Lccimio takes its place among the kin, and no man is asked to stand beside them."
 zin_regional_lccimio_talk_on_the_eastern_quays:0 "Talk on the Eastern Quays"
 zin_regional_lccimio_talk_on_the_eastern_quays_desc:0 "Merchants home from the far quays speak of courts across the rift gathering timber, rope and steersmen. Nobody can say who the ships are for, and nobody likes not knowing."
 zin_regional_lccimio_the_kin_ride_to_the_shore:0 "The Kin Ride to the Shore"
 zin_regional_lccimio_the_kin_ride_to_the_shore_desc:0 "Word has reached the great groves, and the kin come down to the coast with their bows. Where the Refusal forbids armies abroad, it has never forbidden armies at home."
 zin_regional_lccimio_the_long_shore_prospers:0 "The Long Shore Prospers"
 zin_regional_lccimio_the_long_shore_prospers_desc:0 "Fruit, cloth and timber go out from the white quays, and silver comes home. The shore is rich, and for once it says so aloud."
 zin_regional_lccimio_the_old_houses_hold:0 "The Old Houses Hold"
 zin_regional_lccimio_the_old_houses_hold_desc:0 "The oldest houses keep the council's old order: speech by age, decision by agreement, and nothing altered that the dead would not recognise."
 zin_regional_lccimio_the_open_houses:0 "The Open Houses"
 zin_regional_lccimio_the_open_houses_desc:0 "Young houses and newcomers from the quays are given seats and a voice. The council loses a little of its solemnity and gains a great deal of news."
 zin_regional_lccimio_the_patient_council:0 "The Patient Council"
 zin_regional_lccimio_the_patient_council_desc:0 "The Elders never hurry. A matter that takes seven meetings is settled for seven generations, and the shore has learned to prefer it that way."
 zin_regional_lccimio_the_refusal_kept:0 "The Refusal Kept"
 zin_regional_lccimio_the_refusal_kept_desc:0 "The question is put again whether the elves owe men anything. The Elders answer as their grandfathers did: healers may go, hosts may not, and the shore will say so plainly."
 zin_regional_lccimio_the_rift_burns:0 "The Rift Burns"
 zin_regional_lccimio_the_rift_burns_desc:0 "Black sails fill the narrow water. The beacons are lit from the first headland to the last, and the whole shore wakes to the sound of horns."
 zin_regional_lccimio_the_shore_is_quiet:0 "The Shore Is Quiet"
 zin_regional_lccimio_the_shore_is_quiet_desc:0 "The last ship has left the horizon, and no banner of the east remains in the war. The beacons are put out one by one, and the orchards bloom without a guard."
 zin_regional_lccimio_the_temple_on_the_road:0 "The Temple on the Road"
 zin_regional_lccimio_the_temple_on_the_road_desc:0 "Word comes out of the Zilin Hills that the hermitage of [zin_loc_deliverer] is no house of peace. The Elders close the Shore Road to pilgrims and turn the footsore back with water, not welcome."
 zin_regional_lccimio_the_wizards_trail:0 "The Wizard's Trail"
 zin_regional_lccimio_the_wizards_trail_desc:0 "Old rolls speak of a wanderer who once knew the cure for every curse. Lccimio's scholars follow the rumour road by road, and learn a good deal on the way, though not where it ends."
 zin_regional_lccimio_toll_the_pilgrims:0 "Toll the Pilgrims"
 zin_regional_lccimio_toll_the_pilgrims_desc:0 "A toll-house is built at the road's first bridge. Pilgrims may pass, but each pays a small coin, and the Elders put it to the upkeep of the road."
 zin_regional_lccimio_wardens_for_friends:0 "Wardens for Friends"
 zin_regional_lccimio_wardens_for_friends_desc:0 "Single wardens, bound to no banner, go out to the friends who ask for them. They carry bows and herbs, and they go as guests, not as an army."
 zin_regional_lccimio_wardens_for_the_passes:0 "Wardens for the Passes"
 zin_regional_lccimio_wardens_for_the_passes_desc:0 "Far to the south, in the high valleys of Nolorim, the towers on the passes have too few wardens. Lccimio sends a company from the shore, and the kin remember it."
 zin_regional_lccimio_wardens_of_lccimio:0 "Wardens of Lccimio"
 zin_regional_lccimio_wardens_of_lccimio_desc:0 "The wardens of the Long Shore are few, quiet and very good. They are drilled in the orchards, in the rain, and taught to shoot at what they cannot yet see."
 zin_regional_lccimio_watch_on_the_rift:0 "The Watch on the Rift"
 zin_regional_lccimio_watch_on_the_rift_desc:0 "The rift sea is narrow here, and the elders remember how quickly a narrow sea can be crossed. Lantern-keepers are set on every headland to watch the far water."
 zin_regional_lccimio_wellsprings:0 "Wellsprings of the Shore"
 zin_regional_lccimio_wellsprings_desc:0 "Walled and kept springs lift the craft of every workshop that draws from them."
 zin_regional_lccimio_wellsprings_of_the_shore:0 "Wellsprings of the Shore"
 zin_regional_lccimio_wellsprings_of_the_shore_desc:0 "Clear springs rise along the shore road. Each is walled, named and kept by one family, and every workshop that draws their water works the better for it."
 zin_regional_lccimio.1.a:0 "The old voices first."
 zin_regional_lccimio.1.b:0 "Let the young houses speak."
 zin_regional_lccimio.1.d:0 "The Elders of Lccimio gather beneath the old lantern-trees, and the first matter is the order of speaking. Lusmio waits until the murmuring settles before he asks who will begin."
 zin_regional_lccimio.1.t:0 "The Elders Gather"
 zin_regional_lccimio.2.a:0 "Warn the kin."
 zin_regional_lccimio.2.b:0 "Trade is trade."
 zin_regional_lccimio.2.d:0 "Merchants home from the far quays tell a tale that sits ill with the harbour-masters. Courts across the rift are buying timber, rope and steersmen, and nobody can say whom the ships are for."
 zin_regional_lccimio.2.t:0 "Talk on the Eastern Quays"
 zin_regional_lccimio.3.a:0 "Let them pass."
 zin_regional_lccimio.3.d:0 "A long line of pilgrims in grey walks the Shore Road toward the Zilin Hills, bound for the hermitage of [zin_loc_deliverer]. They are polite and footsore, they buy bread at every orchard gate, and they ask for nothing else."
 zin_regional_lccimio.3.t:0 "Pilgrims on the Shore Road"
