l_english:
 zin_shared_ember_lands_a_client_crown:0 "A Client Crown"
 zin_shared_ember_lands_a_client_crown_desc:0 "The banner of Nafeher flies over the hall of [ROOT.GetName], and its lord holds his seat at the pleasure of another. The people are ordered to be quiet and, for the most part, are."
 zin_shared_ember_lands_a_warlords_rule:0 "A Warlord's Rule"
 zin_shared_ember_lands_a_warlords_rule_desc:0 "One strong man has taken the hall of [ROOT.GetName] and holds it by the strength of his household. His laws are short, his punishments are quick and his captains have never lost a quarrel."
 zin_shared_ember_lands_ash_forges:0 "Ash Forges"
 zin_shared_ember_lands_ash_forges_desc:0 "Forges burn night and day beside the vents, and their ash is carted to the fields to sweeten the soil. The swords that come out of them are grey, hard and slightly warm to the touch."
 zin_shared_ember_lands_behind_our_walls:0 "Behind Our Walls"
 zin_shared_ember_lands_behind_our_walls_desc:0 "Neither tribute nor friendship: [ROOT.GetName] will keep itself to itself and trust to stone. Masons fill the ditches, raise the gatehouses and set a watch on every road."
 zin_shared_ember_lands_cistern_roads:0 "Cistern Roads"
 zin_shared_ember_lands_cistern_roads_desc:0 "In a land where rain is rare, every road runs from one cistern to the next. [ROOT.GetName] lays new stone beside the old and puts a water-house at every league."
 zin_shared_ember_lands_cliff_beacons:0 "Cliff Beacons"
 zin_shared_ember_lands_cliff_beacons_desc:0 "Fires burn on the headlands from dusk to dawn, and keepers sleep in stone huts beside them. A ship that sees the beacons knows where the reefs are, and a raider that sees them knows he has been seen."
 zin_shared_ember_lands_essence_vents:0 "The Essence Vents"
 zin_shared_ember_lands_essence_vents_desc:0 "Where the ground breathes out a thick, warm essence, the folk of [ROOT.GetName] have put up sealed cisterns and learned to catch it. It lights lamps, tempers blades and, mixed with the right salts, drives a forge twice as hot."
 zin_shared_ember_lands_essence_vents_spirit:0 "The Essence Vents"
 zin_shared_ember_lands_essence_vents_spirit_desc:0 "Warm essence is caught from the vents in sealed cisterns and carried to the forges."
 zin_shared_ember_lands_exiles_return:0 "The Exiles Return"
 zin_shared_ember_lands_free_of_nafeher:0 "Free of Nafeher"
 zin_shared_ember_lands_free_of_nafeher_desc:0 "No rider has come from the south in months, and the tribute wagons stand empty in the yard. The lord of [ROOT.GetName] declares the old debts ended, and nobody answers him back."
 zin_shared_ember_lands_freeholders_moot:0 "The Freeholders' Moot"
 zin_shared_ember_lands_freeholders_moot_desc:0 "Each farm sends one voice, and the moot decides by the show of hands."
 zin_shared_ember_lands_furnace_lands:0 "Furnace Lands"
 zin_shared_ember_lands_furnace_lands_desc:0 "South of the old border the earth is hot to the touch, and iron comes out of the hills almost clean. [ROOT.GetName] builds its first smelting-hall among the vents and puts a roof over the heat."
 zin_shared_ember_lands_hold_the_walls:0 "Hold the Walls"
 zin_shared_ember_lands_hold_the_walls_desc:0 "Farmers become sentries, and wagons become barricades. The walls of the freehold are lined with archers, and the gate is held by a man who has sworn not to leave it."
 zin_shared_ember_lands_hold_the_walls_spirit:0 "Hold the Walls"
 zin_shared_ember_lands_hold_the_walls_spirit_desc:0 "Farmers become sentries and wagons become barricades."
 zin_shared_ember_lands_houses_of_healing:0 "Houses of Healing"
 zin_shared_ember_lands_houses_of_healing_desc:0 "A house of healing opens on the market square: clean beds, warm broth and scribes who teach the children their letters. The poor of [ROOT.GetName] bless it, and the lord is not sure why he feels uneasy."
 zin_shared_ember_lands_houses_of_healing_spirit:0 "Houses of Healing"
 zin_shared_ember_lands_houses_of_healing_spirit_desc:0 "Clean beds, warm broth and scribes who teach the children their letters."
 zin_shared_ember_lands_join_the_warden_league:0 "Join the Warden League"
 zin_shared_ember_lands_join_the_warden_league_desc:0 "Mirolon has raised its banner over a league of the free south, and [ROOT.GetName] has been asked to stand beneath it. The terms are simple: a watch on the passes and a seat at the wardens' table."
 zin_shared_ember_lands_keep_the_old_quiet:0 "Keep the Old Quiet"
 zin_shared_ember_lands_keep_the_old_quiet_desc:0 "The quiet that has lain between Nafeher and the freeholds is older than any treaty. [ROOT.GetName] sends a gift of grain and iron, and asks nothing but that the quiet go on."
 zin_shared_ember_lands_lake_trade:0 "Trade with the Lake Towns"
 zin_shared_ember_lands_lake_trade_desc:0 "Barges from the northern lakes bring grain, salt fish and cut timber down to [ROOT.GetName], and return with iron and ember-glass. Lake towns learn to love the south, and the south learns to love their coin."
 zin_shared_ember_lands_lake_trade_spirit:0 "Trade with the Lake Towns"
 zin_shared_ember_lands_lake_trade_spirit_desc:0 "Barges bring grain and timber down from the north and carry iron and ember-glass back."
 zin_shared_ember_lands_lords_writ:0 "The Lord's Writ"
 zin_shared_ember_lands_lords_writ_desc:0 "The lord's seal is on every deed and every summons, and the bailiffs carry his word to the farthest farmstead."
 zin_shared_ember_lands_night_cults:0 "The Night Cults"
 zin_shared_ember_lands_night_cults_desc:0 "Black-robed congregations sing to the dark in cellars, and the by-day silence is deeper for it."
 zin_shared_ember_lands_one_watch:0 "One Watch"
 zin_shared_ember_lands_one_watch_desc:0 "The wardens' signal-fires and the freehold's beacons are joined in one chain, and a watcher on a hill of [ROOT.GetName] can send word to Mirolon in an hour. There is one watch now, and it does not sleep."
 zin_shared_ember_lands_one_watch_spirit:0 "One Watch"
 zin_shared_ember_lands_one_watch_spirit_desc:0 "The wardens' signal-fires and the freehold's beacons form one chain, and the watch does not sleep."
 zin_shared_ember_lands_our_own_healers:0 "Our Own Healers"
 zin_shared_ember_lands_our_own_healers_desc:0 "The leeches and midwives of [ROOT.GetName] form a guild of their own and refuse the strangers' offer. Their medicine is slower and less gentle, but it asks no one for anything."
 zin_shared_ember_lands_own_healers:0 "Our Own Healers"
 zin_shared_ember_lands_own_healers_desc:0 "The leeches and midwives form a guild of their own and ask nothing of strangers."
 zin_shared_ember_lands_pass_levies:0 "Levies for the Passes"
 zin_shared_ember_lands_pass_levies_desc:0 "Young men of [ROOT.GetName] go north to hold the mountain passes of Mirolon under the grey cloak. They are fed, paid and drilled by wardens who have held those passes for generations."
 zin_shared_ember_lands_quiet_hearts:0 "Quiet Hearts"
 zin_shared_ember_lands_quiet_hearts_desc:0 "The people of [ROOT.GetName] have learned that the safest thing to feel is nothing, and the safest thing to say is less. Quarrels end before they begin, and the gaols stand empty."
 zin_shared_ember_lands_quiet_hearts_spirit:0 "Quiet Hearts"
 zin_shared_ember_lands_quiet_hearts_spirit_desc:0 "The safest thing to feel is nothing, and the safest thing to say is less."
 zin_shared_ember_lands_return_of_the_exiles:0 "The Exiles Return"
 zin_shared_ember_lands_return_of_the_exiles_desc:0 "Families who fled the south in the dark years come home along the roads of Mirolon, thin, travel-stained and unbowed. [ROOT.GetName] gives them bread, beds and a place at the fire."
 zin_shared_ember_lands_serve_the_dark_crown:0 "Serve the Dark Crown"
 zin_shared_ember_lands_serve_the_dark_crown_desc:0 "The lord of [ROOT.GetName] gives up all pretence and serves the crown of Nafeher as a loyal retainer. The old customs fall away one by one, and the hall is hung with black."
 zin_shared_ember_lands_southern_stone:0 "Stone of the South"
 zin_shared_ember_lands_southern_stone_desc:0 "Pale stone cut from the hills builds houses, walls and bridges that last."
 zin_shared_ember_lands_stone_of_the_south:0 "Stone of the South"
 zin_shared_ember_lands_stone_of_the_south_desc:0 "Pale quarries are opened in the hills, and the cut stone is rafted down the dry river-beds in flood season. Houses, walls and bridges rise from them, and [ROOT.GetName] looks sturdier by the year."
 zin_shared_ember_lands_storm_coast_harbour:0 "A Harbour on the Storm Coast"
 zin_shared_ember_lands_storm_coast_harbour_desc:0 "The coast is cursed with storms that wreck foreign ships on its reefs, but the steersmen of [ROOT.GetName] know every rock. A sheltered quay is dug into a cove, and a watch-house is raised on the cliff above."
 zin_shared_ember_lands_storm_shelter:0 "The Storm Shelters Us"
 zin_shared_ember_lands_storm_shelter_desc:0 "The storms that wreck strangers on the reefs keep the coast safe from landings."
 zin_shared_ember_lands_storm_wise_sailors:0 "Storm-Wise Sailors"
 zin_shared_ember_lands_storm_wise_sailors_desc:0 "Sailors from [ROOT.GetName] learn to read a storm by the colour of the evening sky and the taste of the wind. They sail when others hide and return when others have been wrecked."
 zin_shared_ember_lands_the_crown_remembers:0 "The Crown Remembers"
 zin_shared_ember_lands_the_crown_remembers_desc:0 "With the master of Nafeher silent, the crown of [ROOT.GetName] remembers that it was a crown before it was a client. Its seal is brought out of the strongbox and polished."
 zin_shared_ember_lands_the_free_folk:0 "The Free Folk"
 zin_shared_ember_lands_the_free_folk_desc:0 "The yeomen of [ROOT.GetName] have never bent the knee to a lord who did not first buy their grain. They meet in the churchyard and keep a muster-roll in an oak chest."
 zin_shared_ember_lands_the_freehold:0 "The Freehold of [ROOT.GetName]"
 zin_shared_ember_lands_the_freehold_at_war:0 "[ROOT.GetName] at War"
 zin_shared_ember_lands_the_freehold_at_war_desc:0 "The beacons are lit, the bell is rung and every house sends its sons to the muster-field. Whatever this war is, [ROOT.GetName] has not chosen it, and will not forget who did."
 zin_shared_ember_lands_the_freehold_desc:0 "Fields, farmsteads and a few walled towns make up [ROOT.GetName], and every man who owns a plough has a say in what is done. The hall is opened, the bell is rung, and the freeholders gather to settle who will lead them through the storm years."
 zin_shared_ember_lands_the_freehold_endures:0 "The Freehold Endures"
 zin_shared_ember_lands_the_freehold_endures_desc:0 "Whatever rules [ROOT.GetName], its people have agreed that it will go on. Barns are mended, fences are walked and the old grudges are kept for a quieter year."
 zin_shared_ember_lands_the_freehold_returns:0 "The Freehold Returns"
 zin_shared_ember_lands_the_freehold_returns_desc:0 "The last foe has gone, and the freeholders come home to ruined barns and trampled fields. They rebuild, because there is nothing else to do and no one else to do it."
 zin_shared_ember_lands_the_freeholders_moot:0 "The Freeholders' Moot"
 zin_shared_ember_lands_the_freeholders_moot_desc:0 "Each farm of [ROOT.GetName] sends one voice to the moot, and the moot decides by the show of hands. It is slow, loud and fair, and nobody who has sat in it will ever call it a mere custom."
 zin_shared_ember_lands_the_freeholders_rise:0 "The Freeholders Rise"
 zin_shared_ember_lands_the_freeholders_rise_desc:0 "Where the enemy has taken a farm or a mill, the freeholders of [ROOT.GetName] take it back by night. They have no banners, no drill and no mercy for those who burned their barns."
 zin_shared_ember_lands_the_furnace_provides:0 "The Furnace Provides"
 zin_shared_ember_lands_the_furnace_provides_desc:0 "Between the vents and the quarries, [ROOT.GetName] has all it needs to build. Guilds rise, apprentices multiply and the first merchant-barons begin to dream of ships."
 zin_shared_ember_lands_the_houses_come_south:0 "The Houses Come South"
 zin_shared_ember_lands_the_houses_come_south_desc:0 "Healers and scribes in white-trimmed robes arrive at the gates of [ROOT.GetName], carrying herbs, ledgers and letters of introduction. They ask for nothing but leave to open a house."
 zin_shared_ember_lands_the_lords_hall:0 "The Lord's Hall"
 zin_shared_ember_lands_the_lords_hall_desc:0 "The oldest family of [ROOT.GetName] holds the great hall and keeps its keys. Its lord sits at the head of the board, hears every petition and settles it before the soup is cold."
 zin_shared_ember_lands_the_lords_writ:0 "The Lord's Writ"
 zin_shared_ember_lands_the_lords_writ_desc:0 "The lord's seal is pressed to every deed and every summons, and the bailiffs carry his writ to the farthest farmstead. Order is quick and plain, and few dare answer back."
 zin_shared_ember_lands_the_night_cults:0 "The Night Cults"
 zin_shared_ember_lands_the_night_cults_desc:0 "When the sun goes down over [ROOT.GetName], black-robed congregations meet in cellars and old crypts to sing to the dark. By day they pay their taxes and say nothing."
 zin_shared_ember_lands_the_quiet_kept:0 "The Quiet Kept"
 zin_shared_ember_lands_the_quiet_kept_desc:0 "Nafeher has taken the gift and has sent no riders. The folk of [ROOT.GetName] dare to breathe again, and the merchants begin to trade on the southern roads."
 zin_shared_ember_lands_the_south_breathes:0 "The South Breathes"
 zin_shared_ember_lands_the_south_breathes_desc:0 "Fields are sown that lay fallow for a generation, and the roads of [ROOT.GetName] fill with carts. The sky over the south is merely cloudy now, and people look up at it without flinching."
 zin_shared_ember_lands_the_southern_storm:0 "The Storm over Nafeher"
 zin_shared_ember_lands_the_southern_storm_desc:0 "The storms over Nafeher have not lifted in a year, and the folk of [ROOT.GetName] watch the southern sky with unease. Riders from the south buy iron and ask no prices, which is more worrying than a bad bargain."
 zin_shared_ember_lands_the_storm_lifts:0 "The Storm Lifts"
 zin_shared_ember_lands_the_storm_lifts_desc:0 "The storms over Nafeher thin. What remains of its master, no one living can say."
 zin_shared_ember_lands_the_storm_shelters_us:0 "The Storm Shelters Us"
 zin_shared_ember_lands_the_storm_shelters_us_desc:0 "The same storms that wreck strangers keep the coast of [ROOT.GetName] safe from landings. The folk say the sea itself is on their side, and the sailors have stopped arguing."
 zin_shared_ember_lands_the_walls_hold:0 "The Walls Hold"
 zin_shared_ember_lands_the_walls_hold_desc:0 "Every stone of the new wall has been laid by a freeholder who knows he will stand behind it. When the south tests it, the wall will remember that."
 zin_shared_ember_lands_the_wardens_banner:0 "Under the Wardens' Banner"
 zin_shared_ember_lands_the_wardens_banner_desc:0 "The banner of Mirolon's wardens flies on the tower of [ROOT.GetName], and the garrison wears the grey cloak. The freehold keeps its laws, and the wardens keep the watch."
 zin_shared_ember_lands_the_wardens_friend:0 "The Wardens' Friend"
 zin_shared_ember_lands_the_wardens_friend_desc:0 "Mirolon's wardens have watched the south for generations, and a freehold that stands beside them is no longer alone. [ROOT.GetName] sends a delegation with an offer of friendship."
 zin_shared_ember_lands_the_wardens_way:0 "The Wardens' Way"
 zin_shared_ember_lands_the_wardens_way_desc:0 "The wardens of Mirolon teach that a free people keeps its own watch, and [ROOT.GetName] takes the lesson to heart. Every village has a watch-bell, and every watch-bell has a rope within a child's reach."
 zin_shared_ember_lands_tribute_to_nafeher:0 "Tribute to Nafeher"
 zin_shared_ember_lands_tribute_to_nafeher_desc:0 "Each season a line of wagons leaves [ROOT.GetName] for the south, heavy with grain, hides and silver. The drivers are sworn never to speak of what they see at the other end."
 zin_shared_ember_lands_wait_for_the_storm_to_pass:0 "Wait for the Storm to Pass"
 zin_shared_ember_lands_wait_for_the_storm_to_pass_desc:0 "The elders of [ROOT.GetName] say that every storm ends and that a client crown is only a crown that waits. They keep the old laws in cellars, teach them to the children and bide their time."
 zin_shared_ember_lands_walls_hold:0 "The Walls Hold"
 zin_shared_ember_lands_walls_hold_desc:0 "Every stone of the wall was laid by a freeholder who knew he would stand behind it."
 zin_shared_ember_lands_wardens_friends:0 "Friends of the Wardens"
 zin_shared_ember_lands_wardens_way:0 "The Wardens' Way"
 zin_shared_ember_lands_wardens_way_desc:0 "Every village keeps a watch-bell, and every bell has a rope within a child's reach."
 zin_shared_ember_lands_warlords_rule:0 "A Warlord's Rule"
 zin_shared_ember_lands_warlords_rule_desc:0 "One strong man holds the hall by the strength of his household, and his laws are short."
 zin_shared_ember_lands.1.a:0 "The lord speaks."
 zin_shared_ember_lands.1.b:0 "The freeholders speak."
 zin_shared_ember_lands.1.d:0 "The great doors of the hall stand open, and the benches fill from the front. The lord of the house waits at one end of the board and the elder of the freeholders at the other, and the whole hall waits to see who rises first."
 zin_shared_ember_lands.1.t:0 "The Hall of [ROOT.GetName]"
 zin_shared_ember_lands.2.a:0 "We shall watch."
 zin_shared_ember_lands.2.d:0 "A pedlar from the south tells the hall that the storms over Nafeher have not lifted in a year. Riders from there buy iron and ask no prices, and the pedlar does not like the way they look at the road north."
 zin_shared_ember_lands.2.t:0 "The Storm over Nafeher"
 zin_shared_ember_lands.3.a:0 "The quiet holds."
 zin_shared_ember_lands.3.b:0 "Nafeher takes no gifts."
 zin_shared_ember_lands.3.d:0 "A line of wagons from [FROM.GetName] waits at the southern gate, heavy with grain and iron. Its steward asks for nothing but that the old quiet be kept between the freehold and Nafeher."
 zin_shared_ember_lands.3.t:0 "Tribute from [FROM.GetName]"
 zin_shared_ember_lands.4.a:0 "Stand together."
 zin_shared_ember_lands.4.b:0 "We keep our own counsel."
 zin_shared_ember_lands.4.d:0 "Envoys of [FROM.GetName] stand in the wardens' hall, in their best cloaks, and ask for a place at the table of the free south. They bring no tribute, only a hand held out."
 zin_shared_ember_lands.4.t:0 "Friendship from [FROM.GetName]"
 zin_shared_ember_lands.5.a:0 "Let them in."
 zin_shared_ember_lands.5.d:0 "Healers and scribes of the Houses of the First Light stand at the gate of [ROOT.GetName]. They ask leave to open a house of healing, and they bring bread, herbs and little else."
 zin_shared_ember_lands.5.t:0 "The Houses Come South"
 zin_shared_ember_lands.6.a:0 "The south breathes."
 zin_shared_ember_lands.6.d:0 "The storms over Nafeher thin. What remains of its master, no one living can say."
 zin_shared_ember_lands.6.t:0 "The Storm Lifts"
