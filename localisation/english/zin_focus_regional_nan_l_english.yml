l_english:
 zin_regional_nan_between_storm_and_sea:0 "Between Storm and Sea"
 zin_regional_nan_between_storm_and_sea_desc:0 "Nafeher in the south and Mirolon in the north both want Nan's wayfinders. Dumar listens to both and gives neither a firm answer."
 zin_regional_nan_black_reefs_charted:0 "The Black Reefs Charted"
 zin_regional_nan_black_reefs_charted_desc:0 "Every reef and shoal is charted by the wayfinders, and the charts are cut in slate and kept in the warlord's strongroom. A fleet that has them can sail the coast blind, and a fleet that has not will run aground."
 zin_regional_nan_captains_moot:0 "The Captains' Moot"
 zin_regional_nan_captains_moot_desc:0 "The captains of the isles meet on the deck of a beached hulk and argue from dawn until the tide turns. What they decide at the turn, they do."
 zin_regional_nan_dark_coin:0 "Dark Coin"
 zin_regional_nan_dark_coin_desc:0 "The coin from Nafeher is black glass, stamped with a horned head. It spends well in the free ports, and no one asks where it came from."
 zin_regional_nan_dumars_captains:0 "Dumar's Captains"
 zin_regional_nan_dumars_captains_desc:0 "Dumar keeps a dozen captains who have each sailed for him a lifetime. They meet over a map scratched in the floor and argue about the reefs."
 zin_regional_nan_exiles_carried:0 "Our Exiles Carried"
 zin_regional_nan_harbour_of_nan:0 "The Harbour of Nan"
 zin_regional_nan_harbour_of_nan_desc:0 "A deep harbour is cut into the rock of the main island, with a mole against the swell and a chain across the mouth. Its dockyard rings with caulking-mallets."
 zin_regional_nan_island_warbands:0 "Island Warbands"
 zin_regional_nan_island_warbands_desc:0 "Each island and each peninsula raises its own warband, led by a captain of its own, with its own banner and its own battle-cry. They are rough, ready and fond of ambushes."
 zin_regional_nan_leave_the_deep_alone:0 "Leave the Deep Alone"
 zin_regional_nan_leave_the_deep_alone_desc:0 "The elders agree that what lies below should be left alone. The Stair is fenced, the paths to it are closed and the children are taught to keep away."
 zin_regional_nan_nan_and_vez_nan:0 "Nan and Vez Nan"
 zin_regional_nan_nan_and_vez_nan_desc:0 "Nan and Vez Nan are declared one realm, with one banner and one law. The islands send fish and sailors, and the hills send iron and spears."
 zin_regional_nan_nan_and_vez_nan_spirit:0 "Nan and Vez Nan"
 zin_regional_nan_nan_and_vez_nan_spirit_desc:0 "The islands of Nan and the hills of Vez Nan are one realm, bound by marriage, sea-roads and a common dislike of outsiders. Where one is struck, the other bleeds."
 zin_regional_nan_one_warlord:0 "One Warlord"
 zin_regional_nan_one_warlord_desc:0 "The captains and the lords agree that there shall be one warlord and one will. Dumar takes the seat in the stern, and nobody argues with the man at the tiller."
 zin_regional_nan_one_warlord_spirit:0 "One Warlord"
 zin_regional_nan_one_warlord_spirit_desc:0 "Dumar of Vez Nan speaks for all the isles, and the captains obey because he speaks seldom and is seldom wrong. A single voice is a hard thing to argue with in a gale."
 zin_regional_nan_own_storms:0 "Wayfinders for No One"
 zin_regional_nan_own_storms_desc:0 "Nan's wayfinders serve no fleet but their own, and they sail their storms for Nan alone. Visitors are welcome to look at the sea from the shore."
 zin_regional_nan_peninsula_forts:0 "Peninsula Forts"
 zin_regional_nan_peninsula_forts_desc:0 "Stone forts are raised at the neck of every peninsula, with a gate that can be shut in a breath. A host that lands on Nan must take them one by one."
 zin_regional_nan_pilots_for_hire:0 "Wayfinders for Hire"
 zin_regional_nan_pilots_for_hire_desc:0 "Wayfinders are hired out to foreign merchants for a season, and come home with silver and stories. The warlord takes a tenth, and asks nothing about the stories."
 zin_regional_nan_pilots_for_nafeher:0 "Wayfinders for Nafeher"
 zin_regional_nan_pilots_for_nafeher_desc:0 "Nafeher would pay well for wayfinders who can steer a fleet through the storm belt. Dumar considers the offer, and the coin, and the silence that would follow."
 zin_regional_nan_pilots_for_no_one:0 "Wayfinders for No One"
 zin_regional_nan_pilots_for_no_one_desc:0 "Dumar decides that Nan's wayfinders will serve no fleet but their own. The storm belongs to Nan, and Nan is not for hire to the great."
 zin_regional_nan_pilots_for_the_wardens:0 "Wayfinders for the Wardens"
 zin_regional_nan_pilots_for_the_wardens_desc:0 "Mirolon's wardens ask for wayfinders to carry their exiles north if the passes fall. Dumar does not refuse, and does not promise."
 zin_regional_nan_pilots_friend:0 "Wayfinders as Friends"
 zin_regional_nan_pilots_of_nafeher:0 "Wayfinders of Nan"
 zin_regional_nan_pilots_of_nafeher_desc:0 "Wayfinders of Nan guide Nafeher's hulls through the storm belt, for a fee and a promise of silence. The fleet that follows them sails faster and lands sooner."
 zin_regional_nan_raiders_of_the_reefs:0 "Raiders of the Reefs"
 zin_regional_nan_raiders_of_the_reefs_desc:0 "Reef raiders slip out of the shallows by night and take whatever they find. The enemy never sees them coming, and never sees them go."
 zin_regional_nan_reef_raiders:0 "Reef Raiders"
 zin_regional_nan_reef_raiders_desc:0 "Light boats run between the reefs with crews of ten, who board a becalmed merchantman and are gone before the wind returns. They are the isles' answer to a fleet."
 zin_regional_nan_rim_watch:0 "Watchers on the Rim"
 zin_regional_nan_rim_watch_desc:0 "Watchers sit on the inland rim of Vez Nan, looking down into the dark and listening. They have seen nothing come up the Stair in living memory, and they mean to keep it so."
 zin_regional_nan_storm_pilots:0 "The Storm Wayfinders"
 zin_regional_nan_storm_pilots_desc:0 "Nan's sailors know the reefs and the storm belt of the Ember Lands' coast, where foreign fleets founder and no other men sail for a living. The master wayfinder Seska runs the school that teaches the young to read the waves."
 zin_regional_nan_storm_pilots_spirit:0 "The Storm Wayfinders"
 zin_regional_nan_storm_pilots_spirit_desc:0 "The wayfinders of Nan know the reefs, the currents and the moods of the storm belt as other folk know their own street. Foreign fleets founder where Nan's hulls sail through."
 zin_regional_nan_storm_shelter:0 "The Storm Shelters Us"
 zin_regional_nan_storm_shelter_desc:0 "The storm closes in around the isles like a hand. An enemy fleet sailing toward Nan must pass through it, and Nan's own hulls do not."
 zin_regional_nan_storm_wall:0 "The Storm Is Our Wall"
 zin_regional_nan_storm_wall_desc:0 "Nan's coast is guarded by the storm itself, and by bunkers that make use of it. An enemy that tries to land must first survive the weather, and then the defenders."
 zin_regional_nan_tales_of_the_stair:0 "Tales of the Stair"
 zin_regional_nan_tales_of_the_stair_desc:0 "Inland of Vez Nan, the elders say, a stair goes down into the dark. Long ago a stranger from the north went down it and came back up, and the tale is told at the warlord's fire."
 zin_regional_nan_the_captains_moot:0 "The Captains' Moot"
 zin_regional_nan_the_captains_moot_desc:0 "The captains persuade Dumar that a moot of the fleet is wiser than a single will, and he agrees. They meet on the deck of a beached hulk and argue from dawn until the tide turns."
 zin_regional_nan_the_exiles_road:0 "The Exiles' Road"
 zin_regional_nan_the_exiles_road_desc:0 "Nan's wayfinders carry Mirolon's exiles north on moonless nights, through the storm belt and out of reach of Nafeher. The warlord is paid in gratitude, which he accepts."
 zin_regional_nan_the_island_lords:0 "The Island Lords"
 zin_regional_nan_the_island_lords_desc:0 "The lords of the outer isles come to the warlord's hall once a year, each in his own boat. They swear to the warlord, drink his ale and sail home before the weather turns."
 zin_regional_nan_the_isles_at_war:0 "The Isles at War"
 zin_regional_nan_the_isles_at_war_desc:0 "The signal-fires burn on every headland, and the warlord's horn is heard across the strait. The isles are at war, and Dumar has not been so cheerful in years."
 zin_regional_nan_the_isles_endure:0 "The Isles Endure"
 zin_regional_nan_the_isles_endure_desc:0 "The war is over, and the isles are still isles. The storm is still the wall, and the wayfinders put out to sea again."
 zin_regional_nan_the_storm_is_our_wall:0 "The Storm Is Our Wall"
 zin_regional_nan_the_storm_is_our_wall_desc:0 "Nan's captains say that the storm is their wall, and set bunkers on the beaches that make the most of it. A fleet that crosses the belt arrives weakened, and meets a defender who is waiting."
 zin_regional_nan_the_storm_shelters_us:0 "The Storm Shelters Us"
 zin_regional_nan_the_storm_shelters_us_desc:0 "The storm closes in around the isles like a hand. An enemy fleet sailing toward Nan must pass through it, and Nan's own hulls do not."
 zin_regional_nan_the_warlords_host:0 "The Warlord's Host"
 zin_regional_nan_the_warlords_host_desc:0 "The warbands are drawn into a single host under the warlord's banner. It is loud, ragged and surprisingly well-fed."
 zin_regional_nan_the_warlords_neutrality:0 "The Warlord's Neutrality"
 zin_regional_nan_the_warlords_neutrality_desc:0 "Dumar announces that the isles are neutral and will remain so. The announcement is read in every harbour, and is received without surprise."
 zin_regional_nan_warlord_of_vez_nan:0 "The Warlord of Vez Nan"
 zin_regional_nan_warlord_of_vez_nan_desc:0 "Warlord Dumar holds the hills of Vez Nan and the islands of Nan with a few thousand spears and a very good memory for faces. His hall is a longhouse of black timber on a rise above the sea."
 zin_regional_nan_warlords_host:0 "The Warlord's Host"
 zin_regional_nan_warlords_host_desc:0 "The warbands of the isles and the peninsulas are drawn into a single host under the warlord's banner. It is loud, ragged and surprisingly well-fed."
 zin_regional_nan_watchers_on_the_rim:0 "Watchers on the Rim"
 zin_regional_nan_watchers_on_the_rim_desc:0 "Watchers are posted on the inland rim, in huts of piled stone, each with a horn and a store of firewood. Nothing has come up the Stair in living memory, but the watch goes on."
 zin_regional_nan_what_the_deep_keeps:0 "What the Deep Keeps"
 zin_regional_nan_what_the_deep_keeps_desc:0 "The elders say that the Abyss-folk keep to their dark, and Nan keeps to its sea. Neither disturbs the other, and both are content."
 zin_regional_nan.1.a:0 "The captains obey."
 zin_regional_nan.1.b:0 "The isles are heard."
 zin_regional_nan.1.d:0 "The longhouse is full, and the fire is built high. Dumar of Vez Nan stands, folds his arms and tells the gathered captains and island lords what he expects of them."
 zin_regional_nan.1.t:0 "The Warlord Speaks"
 zin_regional_nan.2.a:0 "Let the tale be told."
 zin_regional_nan.2.d:0 "Inland of Vez Nan a stair goes down into the dark. Long ago a stranger from the north went down it and came back up. The elders do not say what he carried, and no one in Nan has gone to look."
 zin_regional_nan.2.t:0 "Tales of the Stair"
 zin_regional_nan.3.a:0 "Nafeher needs no ships."
 zin_regional_nan.3.b:0 "Take the wayfinders."
 zin_regional_nan.3.d:0 "A boat from the isles has come to the coast of the Dominion, carrying a master wayfinder and a modest request. Nan offers its wayfinders to Nafeher's fleet, for a fee and a promise to be left alone."
 zin_regional_nan.3.t:0 "Wayfinders from Nan"
 zin_regional_nan.4.a:0 "Carry our people north."
 zin_regional_nan.4.d:0 "Black hulls come out of the storm at dusk, with lamps hooded and oars muffled. The wayfinders of Nan have kept their promise, and the exiles of Mirolon go aboard in silence."
 zin_regional_nan.4.t:0 "Ships for the Exiles"
 zin_regional_nan.5.a:0 "The isles are paid."
 zin_regional_nan.5.d:0 "A boat from Nan comes in on the tide with a message from the warlord. The offer has been taken, and Dumar sends his thanks, which are brief."
 zin_regional_nan.5.t:0 "An Answer from the Isles"
 zin_regional_nan.6.a:0 "Nan sells to anyone."
 zin_regional_nan.6.b:0 "Take their hands."
 zin_regional_nan.6.d:0 "Envoys from the isles stand in the lake-hall of Mirolon and offer the wardens their wayfinders, to carry the free south's exiles if the worst comes. Dumar's price is a handshake and a promise of silence."
 zin_regional_nan.6.t:0 "Wayfinders for the Wardens"
 zin_regional_nan.7.a:0 "Then we keep our storm."
 zin_regional_nan.7.d:0 "The envoys come back with nothing, and a bad grace. Dumar listens to the report, shrugs and says that the storm needs no allies."
 zin_regional_nan.7.t:0 "The Offer Refused"
