l_english:
 zin_regional_lambin_a_delegate_from_lambin:0 "A Delegate from Lambin"
 zin_regional_lambin_a_delegate_from_lambin_desc:0 "The Ford Council meets, and Lambin sends a lord of the downs to sit at the table. He brings a bag of grain as a gift, and a list of claims in his coat."
 zin_regional_lambin_a_neutral_hall:0 "A Neutral Hall"
 zin_regional_lambin_a_neutral_hall_desc:0 "Lambin sells grain to both Gunwaith and Girdon, and its hall has a seat for each. The lords agree to keep their personal quarrels outside the door."
 zin_regional_lambin_a_stranger_on_the_downs:0 "A Stranger on the Downs"
 zin_regional_lambin_a_stranger_on_the_downs_desc:0 "Traders brought a man south who settles quarrels and asks for nothing. Lord Werl gives him a bed and a seat, and listens when he speaks."
 zin_regional_lambin_a_stranger_on_the_downs_tip_1:0 "Traders brought a man south who settles quarrels and asks for nothing."
 zin_regional_lambin_across_the_sea:0 "Across the Sea"
 zin_regional_lambin_across_the_sea_desc:0 "The host of Lambin has crossed the water, with its own grain and its own horses. It is tired, it is far from home and it is better provisioned than most."
 zin_regional_lambin_aenoran_grain_buyers:0 "Aenoran Grain Buyers"
 zin_regional_lambin_aenoran_grain_buyers_desc:0 "The lords decide that old claims can wait while the grain is selling. A factor goes to Parim with a list of prices, and a free hand."
 zin_regional_lambin_bread_for_the_host:0 "Bread for the Host"
 zin_regional_lambin_bread_for_the_host_desc:0 "A crossing needs bread, and Lambin has it. Wagons roll to the coast with sacks of flour, dried meat and arms for the western host."
 zin_regional_lambin_bread_for_the_stranded:0 "Bread for the Stranded"
 zin_regional_lambin_bread_for_the_stranded_desc:0 "Some of the host did not come home. Lambin sends ships with bread and warm cloaks to the shore where they wait."
 zin_regional_lambin_downs_granaries:0 "Granaries of the Downs"
 zin_regional_lambin_downs_granaries_desc:0 "The chalk downs of Lambin grow more grain than the lordship can eat. The surplus fills barns from the coast to the hills, and a good harvest means a rich winter."
 zin_regional_lambin_downs_kept:0 "The Downs Kept"
 zin_regional_lambin_downs_kept_desc:0 "Lambin keeps to its chalk hills and its grain fields. If the West fights across the sea, the lords of the downs will have bread for those who return."
 zin_regional_lambin_downs_united:0 "The Downs United"
 zin_regional_lambin_downs_united_desc:0 "The lords of the downs have agreed to speak with one voice at the council fire. A quarrel between two manors is now a matter for Lord Werl, not for swords."
 zin_regional_lambin_envoys_to_the_ford:0 "Envoys to the Ford"
 zin_regional_lambin_envoys_to_the_ford_desc:0 "Lord Werl sends envoys to the Grey Ford with offers of bread and a plain tent for talking. The wardens and the thanes both come to look."
 zin_regional_lambin_foot_of_the_mill_towns:0 "Foot of the Mill Towns"
 zin_regional_lambin_foot_of_the_mill_towns_desc:0 "The mill towns raise companies of foot, armed with spear and shield. They march behind the lancers and hold the ground the horse has won."
 zin_regional_lambin_grain_contract:0 "Grain for Parim"
 zin_regional_lambin_grain_contract_desc:0 "A standing contract sends Lambin's grain across the central sea to Parim's granaries. The lords of the downs are paid in Aenoran silver, and they spend it at home."
 zin_regional_lambin_grain_for_both_banks:0 "Grain for Both Banks"
 zin_regional_lambin_grain_for_both_banks_desc:0 "Grain barges go to both banks of the river at the same price. Neither side may complain, and both depend on it."
 zin_regional_lambin_grain_for_the_sea:0 "Grain for the Sea"
 zin_regional_lambin_grain_for_the_sea_desc:0 "Shiploads of grain leave Lambin's coast for the markets across the central sea. They come back with silver and with the news from Parim."
 zin_regional_lambin_granaries_of_the_downs:0 "Granaries of the Downs"
 zin_regional_lambin_granaries_of_the_downs_desc:0 "New granaries rise on the high ground, lined with chalk to keep the damp out. A bad harvest in one valley is a good one in the next, and the lordship eats either way."
 zin_regional_lambin_horse_runs:0 "Horse Runs"
 zin_regional_lambin_horse_runs_desc:0 "Wide runs of grass are fenced for the lordship's herds. The best mares are kept for breeding, and the geldings are sold to riders in three realms."
 zin_regional_lambin_horse_runs_kept:0 "Horse Runs"
 zin_regional_lambin_horse_runs_kept_desc:0 "Long grass-runs on the downs keep the lordship's herds fat and its riders ready. A Lambin horse is bred for stamina, not speed."
 zin_regional_lambin_host_the_peace_talks:0 "Host the Peace Talks"
 zin_regional_lambin_host_the_peace_talks_desc:0 "The truce is broken, and the two banks want to talk. Lord Werl offers his hall, his bread and his word that no sword will be drawn."
 zin_regional_lambin_lambin_crosses:0 "Lambin Crosses"
 zin_regional_lambin_lambin_crosses_desc:0 "The lancers and the foot take ship with their own bread, and sail for the far shore. Behind them the granaries stand open."
 zin_regional_lambin_lambin_keeps_the_downs:0 "Lambin Keeps the Downs"
 zin_regional_lambin_lambin_keeps_the_downs_desc:0 "Lord Werl decides that the downs are worth more than any distant claim. The lords bring in the harvest, bolt the gates and wait for the war to be decided elsewhere."
 zin_regional_lambin_lances_of_lambin:0 "Lances of Lambin"
 zin_regional_lambin_lances_of_lambin_desc:0 "The lords of the downs keep a company of lancers, each with a horse, a lance and a manor behind him. They are fast, and they are proud."
 zin_regional_lambin_lances_ride:0 "The Lances Ride"
 zin_regional_lambin_lances_ride_desc:0 "The lancers of Lambin ride out in line, long poles levelled and banners streaming. A charge from the downs is a thing the plains remember."
 zin_regional_lambin_lord_werls_court:0 "Lord Werl's Court"
 zin_regional_lambin_lord_werls_court_desc:0 "Lambin is a lordship of ten states, and Lord Werl's hall is where its manors send their quarrels. His table seats two hundred, and is never empty."
 zin_regional_lambin_neutral_ground:0 "The Neutral Ground"
 zin_regional_lambin_neutral_ground_desc:0 "The Downs have become a place where enemies may sit at the same table. Neither Gunwaith nor Girdon can call it hostile, and both send envoys."
 zin_regional_lambin_peace_talks:0 "Peace Talks at Lambin"
 zin_regional_lambin_peace_talks_desc:0 "Delegates from both banks of the river have come to the downs to bargain. Lambin keeps the doors open and the bread coming."
 zin_regional_lambin_riders_of_the_downs:0 "Riders of the Downs"
 zin_regional_lambin_riders_of_the_downs_desc:0 "Essa of the Downs takes command of the riders. She has hunted over the chalk since she could walk, and teaches the young lancers how to ride a ridge."
 zin_regional_lambin_ruins_of_the_old_stations:0 "Ruins of the Old Stations"
 zin_regional_lambin_ruins_of_the_old_stations_desc:0 "On the coast stand the broken walls of trading stations that Aenor built in the First Age. The lords pass them every day, and they remember who built them."
 zin_regional_lambin_ruins_of_the_old_stations_tip_1:0 "Aenor's traders built here in the First Age. Their stones still stand."
 zin_regional_lambin_the_call_from_the_ford:0 "The Call from the Ford"
 zin_regional_lambin_the_call_from_the_ford_desc:0 "The Ford Council has chosen its course, and Lambin must choose its own. Lord Werl calls the lords to his hall and asks them what they want to do."
 zin_regional_lambin_the_claims_remembered:0 "The Claims Remembered"
 zin_regional_lambin_the_claims_remembered_desc:0 "The deeds are read aloud at the council fire, one after the other. Nobody speaks of war, but everyone remembers what the stones were for."
 zin_regional_lambin_the_downs_levy:0 "The Downs Levy"
 zin_regional_lambin_the_downs_levy_desc:0 "Each manor is asked for a man in twenty. The levy is raised without a murmur, because the harvest is in and the granaries are full."
 zin_regional_lambin_the_downs_pledge:0 "The Downs' Pledge"
 zin_regional_lambin_the_downs_pledge_desc:0 "The lords of the downs stand up in turn and give their word. They will ride, and they will bring their hosts, and they will not turn back until the old claims are answered."
 zin_regional_lambin_the_downs_united:0 "The Downs United"
 zin_regional_lambin_the_downs_united_desc:0 "Ten states, ten manors and one banner: a white horse on green. The lords of the downs swear the oldest oath they have, and it holds."
 zin_regional_lambin_the_grain_lords:0 "The Grain Lords"
 zin_regional_lambin_the_grain_lords_desc:0 "Orrin the Grain-Reeve keeps the tallies of every barn in the lordship. Lord Werl gives him a seat at the high table and a say in what is sold."
 zin_regional_lambin_the_great_granary:0 "The Great Granary"
 zin_regional_lambin_the_great_granary_desc:0 "A vast stone barn is built at the heart of the lordship, with room for three years of harvests. In a lean season, it will feed the downs and anyone who comes asking."
 zin_regional_lambin_the_lances_ride:0 "The Lances Ride"
 zin_regional_lambin_the_lances_ride_desc:0 "Horse and foot are drilled together on the great common. When the drum beats, the lances level and the line rolls forward like a wave."
 zin_regional_lambin_the_mill_towns:0 "The Mill Towns"
 zin_regional_lambin_the_mill_towns_desc:0 "Water-mills grind the grain, and roads carry the flour to the coast. The mill towns grow rich and loud, and Lord Werl takes a toll at each gate."
 zin_regional_lambin_the_neutral_ground:0 "The Neutral Ground"
 zin_regional_lambin_the_neutral_ground_desc:0 "The downs become a place where quarrels may be laid down. A man who comes unarmed to Lambin is a guest, and a guest is not to be touched."
 zin_regional_lambin_the_old_claims:0 "The Old Claims"
 zin_regional_lambin_the_old_claims_desc:0 "The lords of Lambin have kept the old deeds that show where Aenoran stations once stood. They are not for use, only for remembering."
 zin_regional_lambin_the_peace_of_the_west:0 "The Peace of the West"
 zin_regional_lambin_the_peace_of_the_west_desc:0 "Lambin wants the western peace to last, because peace sells grain. Lord Werl says so at every feast, and sends bread to prove it."
 zin_regional_lambin_the_war_kings_hosts:0 "Hosts of the War-King"
 zin_regional_lambin_the_war_kings_hosts_desc:0 "Several courts have made the stranger their war-king. Lambin, the host of his first peace-talks, sends riders and bread to his banner."
 zin_regional_lambin_under_the_war_kings_banner_again:0 "Under the War-King's Banner Again"
 zin_regional_lambin_under_the_war_kings_banner_again_desc:0 "The war-king has returned, and his banner is raised once more. The riders of Lambin remember the peace-talks and the bread, and saddle up."
 zin_regional_lambin.1.a:0 "Sign the contract"
 zin_regional_lambin.1.b:0 "Refuse"
 zin_regional_lambin.1.d:0 "A grain-factor from Lambin has landed at Parim with a ship laden to the rail. Lord Werl offers the crown a standing contract: every autumn, so many hundred loads at a fixed price, for as long as the crown wishes. The royal granaries are not full."
 zin_regional_lambin.1.t:0 "Grain from Lambin"
