l_english:
 zin_stabilo_a_bid_for_the_rift_road:0 "A Bid for the Rift Road"
 zin_stabilo_a_bid_for_the_rift_road_desc:0 "The Rift Road has long been Noris's, but its charter lapses at the next reckoning. Postondoroth sends its best advocates to Delbiz and its heaviest purses with them."
 zin_stabilo_answer_the_coalition:0 "Answer the Eastern Coalition"
 zin_stabilo_answer_the_coalition_desc:0 "Stabilo has joined the eastern coalition. The companies cross the rift in hired boats, and the clerks go with them."
 zin_stabilo_arms_for_the_elder_groves:0 "Arms for the Elder Groves"
 zin_stabilo_arms_for_the_elder_groves_desc:0 "Crates of spears, bows and mail are shipped across the rift to the forests of the elves. The prince sends them without being asked and without a bill."
 zin_stabilo_army_of_the_pact:0 "The Army of the Pact"
 zin_stabilo_army_of_the_pact_desc:0 "The Pact calls out all its companies, and the roads are full of shields. A host such as the East has never seen marches out of Postondoroth."
 zin_stabilo_arsenal_of_fudol:0 "The Arsenal of Fudol"
 zin_stabilo_arsenal_of_fudol_desc:0 "Fudol's arsenal is rebuilt around a central armoury and a dozen new forges. A company paid in the morning is armed by the afternoon."
 zin_stabilo_audit_the_temples:0 "Audit the Temples"
 zin_stabilo_audit_the_temples_desc:0 "The prince's auditors open the temple ledgers and read them line by line. What they find, they keep to themselves."
 zin_stabilo_bankers_of_fudol:0 "The Bankers of Fudol"
 zin_stabilo_bankers_of_fudol_desc:0 "Fudol is the oldest banking town of the East. Its bankers take deposits in gold, silver and salt and pay out in letters that are honoured from the rift to the dunes."
 zin_stabilo_bargain_with_miaed:0 "A Bargain with Miaed"
 zin_stabilo_bargain_with_miaed_desc:0 "The lords of Miaed hold the high passes between the dunes and the lakes. A bargain with them would open the roads in winter."
 zin_stabilo_beyond_the_dunes:0 "Beyond the Dunes"
 zin_stabilo_beyond_the_dunes_desc:0 "A caravan commissioned by the Guild of Scales walks into the deep sand with a year's supply of water. The clerks record its departure and wait."
 zin_stabilo_buy_off_the_coalition:0 "Buy Off the Coalition"
 zin_stabilo_buy_off_the_coalition_desc:0 "Gold and promises pass between the camps of the coalition. By season's end, half its captains have remembered debts they owe at home."
 zin_stabilo_buy_the_charters:0 "Buy the Charters"
 zin_stabilo_buy_the_charters_desc:0 "The charters of the roads are bought one by one, at prices that make the sellers rich and the buyer richer."
 zin_stabilo_call_back_the_companies:0 "Call Back the Companies"
 zin_stabilo_call_back_the_companies_desc:0 "The war is no longer profitable, and the coin has run dry. The prince recalls the companies across the rift, though some contracts will never be paid."
 zin_stabilo_call_back_the_companies_tip_1:0 "Some contracts will never be paid."
 zin_stabilo_caravan_insurance:0 "Caravan Insurance"
 zin_stabilo_caravan_insurance_desc:0 "A caravan that pays the Guild of Scales a small fee is repaid in full if it is robbed. The roads grow busier, and the Guild's ledgers fatter."
 zin_stabilo_caravanserais_of_the_gold_road:0 "Caravanserais of the Gold Road"
 zin_stabilo_caravanserais_of_the_gold_road_desc:0 "Walled yards with cisterns, stables and sleeping galleries mark each day's journey along the Gold Road. The prince's seal on the gate is a promise of a roof and a clean well."
 zin_stabilo_close_the_books_to_the_temples:0 "Close the Books to the Temples"
 zin_stabilo_close_the_books_to_the_temples_desc:0 "The temple clerks are barred from the counting-houses, and the debtors of Postondoroth are told to pay in coin of the prince's mint."
 zin_stabilo_close_the_kings_books:0 "Close the King's Books"
 zin_stabilo_close_the_kings_books_desc:0 "The King is dead, and his accounts are open at last. The clerks of Postondoroth go through them, line by line, to find who owes what to whom."
 zin_stabilo_close_the_kings_books_tip_1:0 "Postondoroth must answer for its loans."
 zin_stabilo_close_the_roads_to_noris:0 "Close the Roads to Noris"
 zin_stabilo_close_the_roads_to_noris_desc:0 "Tolls rise, wells close and the riders of Furvior are turned back at the border. It is the first step toward the Caravan War."
 zin_stabilo_close_the_temple_accounts:0 "Close the Temple Accounts"
 zin_stabilo_close_the_temple_accounts_desc:0 "The temple accounts are closed, the temple clerks are sent home, and the houses that served them are shut. The prince has read what was in the books."
 zin_stabilo_collect_the_debts:0 "Collect the Debts"
 zin_stabilo_collect_the_debts_desc:0 "A debtor who does not pay is visited by a polite clerk, then by a less polite one. The ledger records everything and forgives nothing."
 zin_stabilo_companies_for_the_stranger:0 "Companies for the Stranger"
 zin_stabilo_companies_for_the_stranger_desc:0 "A band of Stabilo's hired companies, paid in advance and unconcerned by politics, takes service with the stranger's coalition. The prince sees no reason to stop them."
 zin_stabilo_contract_courts:0 "The Contract Courts"
 zin_stabilo_contract_courts_desc:0 "Disputes between merchants are settled before a bench of sworn clerks, not before the prince. A contract in Postondoroth is worth what is written on it."
 zin_stabilo_contract_courts_spirit:0 "The Contract Courts"
 zin_stabilo_contract_courts_spirit_desc:0 "Benches of sworn clerks settle disputes between merchants. A contract sealed in Postondoroth is worth what is written on it."
 zin_stabilo_contracts_of_service:0 "Contracts of Service"
 zin_stabilo_contracts_of_service_desc:0 "Every contract is now written on the same form, with the same oaths and the same compensation for the wounded. The companies know their rights and stand firm for them."
 zin_stabilo_contracts_of_service_spirit:0 "Contracts of Service"
 zin_stabilo_contracts_of_service_spirit_desc:0 "Every hireling is sworn on the same form, and the wounded are compensated by the same law."
 zin_stabilo_contracts_with_the_temple:0 "Contracts with the Temple"
 zin_stabilo_contracts_with_the_temple_desc:0 "A hundred contracts are drawn between the counting-houses of Postondoroth and the temple banks of the Zilin Hills. Each is worth more than the paper."
 zin_stabilo_council_of_houses:0 "The Council of Houses"
 zin_stabilo_council_of_houses_desc:0 "The great houses sit as a council and the prince sits among them. Nothing is decided without a majority of seals, and so nothing is decided in haste."
 zin_stabilo_council_of_houses_spirit:0 "The Council of Houses"
 zin_stabilo_council_of_houses_spirit_desc:0 "The great houses govern together. Nothing is rushed, nothing is hidden, and the peace is rarely broken."
 zin_stabilo_credit:0 "Credit from Postondoroth"
 zin_stabilo_credit_desc:0 "A loan from the bankers of Fudol eases the court's purse for a year. The ledger notes the day it falls due."
 zin_stabilo_credit_for_the_rift:0 "Credit for the Rift Ports"
 zin_stabilo_credit_for_the_rift_desc:0 "Postondoroth lends silver to the port-masters of the rift sea, secured against their harbour dues. A harbour in debt is a harbour that remembers its friends."
 zin_stabilo_creditor_of_kings:0 "Creditor of Kings"
 zin_stabilo_creditor_of_kings_desc:0 "Four crowns of the East owe Postondoroth more than they can ever repay. The prince does not say it aloud, but the whole East knows it."
 zin_stabilo_debts_of_the_refusers:0 "The Debts of the Refusers"
 zin_stabilo_debts_of_the_refusers_desc:0 "Courts that refused the King of the East still owe Postondoroth. The prince, now the King's own creditor, calls the debts in."
 zin_stabilo_debts_paid_in_iron:0 "Debts Paid in Iron"
 zin_stabilo_debts_paid_in_iron_desc:0 "A court that cannot pay in coin may pay in arms. Wagon-loads of spears, shields and mail roll into the arsenals of Fudol, and the debt is struck from the page."
 zin_stabilo_defaulted:0 "Defaulted on Postondoroth"
 zin_stabilo_desert_patrols:0 "Desert Patrols"
 zin_stabilo_desert_patrols_desc:0 "Riders in hired livery patrol the dunes in pairs, mapping the wells and guiding lost caravans to the road. Their pay is high, and their reports are accurate."
 zin_stabilo_desert_shield:0 "The Desert Shield"
 zin_stabilo_desert_shield_desc:0 "A line of forts, wells and towers runs along the edge of the dunes, and raiders find the shields of Postondoroth waiting."
 zin_stabilo_envoys_of_the_pact:0 "Envoys of the Pact"
 zin_stabilo_envoys_of_the_pact_desc:0 "Envoys in grey travelling-cloaks set out for the courts of the East with sample cloths, letters of credit and a polite proposal."
 zin_stabilo_faith_and_interest:0 "Faith and Interest"
 zin_stabilo_faith_and_interest_desc:0 "Faith and interest sit at the same table in Postondoroth, and neither is permitted to speak first. The prince keeps both accounts."
 zin_stabilo_foreign_captains:0 "Foreign Captains"
 zin_stabilo_foreign_captains_desc:0 "Captains from the far west, the ember lands and the cold north are paid to teach the companies their arts. They come for the silver and stay for the wine."
 zin_stabilo_fortified_caravanserais:0 "Fortified Caravanserais"
 zin_stabilo_fortified_caravanserais_desc:0 "Towers are raised over the great caravanserais of the Gold Road, and the gates are fitted with iron. A raider who approaches finds the guards awake."
 zin_stabilo_fortified_caravanserais_spirit:0 "Fortified Caravanserais"
 zin_stabilo_fortified_caravanserais_spirit_desc:0 "Towers and iron-bound gates guard the great caravanserais, and raiders find the walls awake."
 zin_stabilo_forts_on_the_noris_march:0 "Forts on the Noris March"
 zin_stabilo_forts_on_the_noris_march_desc:0 "Walls rise along the border where the lands of Postondoroth meet the lands of Furvior. The watchmen hired to man them are paid by the tower."
 zin_stabilo_free_crowns_purse:0 "The Free Crowns' Purse"
 zin_stabilo_free_crowns_purse_desc:0 "The courts that refused the King of the East draw on the vaults of Postondoroth, and remember it."
 zin_stabilo_free_roads:0 "The Free Roads"
 zin_stabilo_free_roads_desc:0 "The roads of the East belong to those who walk them, and the scales of Postondoroth weigh for every court alike."
 zin_stabilo_friendship_of_drak:0 "The Friendship of Drak"
 zin_stabilo_friendship_of_drak_desc:0 "Drak is the oldest friend of the Pact and its oldest debtor. The prince sends a gift and a reminder."
 zin_stabilo_general_shindor:0 "Captain-General Hardfic Shindor"
 zin_stabilo_general_shindor_desc:0 "Hardfic Shindor has led hired companies for forty years and has never broken a contract. The prince names him Captain-General, and the companies cheer louder than the pay requires."
 zin_stabilo_gold_for_the_deliverer:0 "Gold for the Deliverer"
 zin_stabilo_gold_for_the_deliverer_desc:0 "The prince empties a vault into temple chests. Within the month, the temples have repaid the favour with promises, which he finds more durable than coin."
 zin_stabilo_gold_for_the_deliverer_tip_1:0 "The temples will remember."
 zin_stabilo_great_ledger:0 "The Great Ledger"
 zin_stabilo_great_ledger_desc:0 "The ledgers of the East are bound in a single book, and its keepers know every debt and every debtor."
 zin_stabilo_guild_of_scales:0 "The Guild of Scales"
 zin_stabilo_guild_of_scales_desc:0 "The Guild of Scales sets the weights and measures of every road. A false weight is punished by the loss of the right to trade."
 zin_stabilo_hall_of_the_golden_ledger:0 "The Hall of the Golden Ledger"
 zin_stabilo_hall_of_the_golden_ledger_desc:0 "A great hall of white stone houses the ledgers of the principality, ten thousand volumes on cedar shelves. Clerks copy them out in triplicate."
 zin_stabilo_hire_the_sellswords:0 "Hire the Sellswords"
 zin_stabilo_hire_the_sellswords_desc:0 "A recruiting table stands in the market-square of Postondoroth. Any man with a sword and a clean record may sign for a year's service at triple pay."
 zin_stabilo_house_of_azano:0 "The House of Azano"
 zin_stabilo_house_of_azano_desc:0 "Lady Mylun Azano keeps the treasury of the principality. Her books are said to be honest, and nobody has yet proved it otherwise."
 zin_stabilo_house_of_shindor:0 "The House of Shindor"
 zin_stabilo_house_of_shindor_desc:0 "Captain-General Hardfic Shindor holds the contracts of the shield-companies. His house is paid in advance and its debtors are never late."
 zin_stabilo_interest_of_peace:0 "The Interest of Peace"
 zin_stabilo_interest_of_peace_desc:0 "A war empties the vault and brings no interest. The bankers of Fudol will lend to either side of a quarrel but profit most when there is none."
 zin_stabilo_kings_mint:0 "The King's Mint"
 zin_stabilo_kings_mint_desc:0 "The mint of Postondoroth strikes coin in the King's image and is trusted in every market of the East."
 zin_stabilo_kneel_with_open_ledgers:0 "Kneel with Open Ledgers"
 zin_stabilo_kneel_with_open_ledgers_desc:0 "The prince lays his ledgers on the temple altar, open to the last page. He kneels before the King of the East, and the books are signed."
 zin_stabilo_law_of_the_scales:0 "The Law of the Scales"
 zin_stabilo_law_of_the_scales_desc:0 "The Guild's rules are written into law. Courts, markets and harbours follow one measure, and the quarrels that once troubled the city grow rare."
 zin_stabilo_ledger_of_the_east:0 "The Ledger of the East"
 zin_stabilo_ledger_of_the_east_desc:0 "The bankers of Fudol open a ledger with the name of every eastern court at the top of a page. Some of the courts do not yet know they are in it."
 zin_stabilo_letters_of_credit:0 "Letters of Credit"
 zin_stabilo_letters_of_credit_desc:0 "A merchant carries a sealed letter in place of a purse, and a banker in a distant city pays him on sight. Robbers on the roads find the trade less rewarding."
 zin_stabilo_letters_of_credit_spirit:0 "Letters of Credit"
 zin_stabilo_letters_of_credit_spirit_desc:0 "A merchant carries a sealed letter in place of a purse. Robbers on the roads find the trade less rewarding."
 zin_stabilo_loans_to_the_kings:0 "Loans to the Kings"
 zin_stabilo_loans_to_the_kings_desc:0 "The ledger now has room for kings. The Great Loan is offered only to courts with large lands and larger pride, who rarely read the terms."
 zin_stabilo_markets_of_the_moco:0 "The Markets of The Moco"
 zin_stabilo_markets_of_the_moco_desc:0 "The Moco lies at the lake end of the Gold Road, and its markets have never been fully served. Postondoroth buys stalls, warehouses and debts."
 zin_stabilo_marriage_in_the_pact:0 "A Marriage in the Pact"
 zin_stabilo_marriage_in_the_pact_desc:0 "A marriage between houses ties the Pact more firmly than any treaty. Three courts have offered daughters and dowries, and the prince must choose."
 zin_stabilo_mines_of_erco:0 "The Mines of Erco"
 zin_stabilo_mines_of_erco_desc:0 "Erco's mountains hold copper and tin, and its prince has no way to bring them down. A road and a loan, offered together, may buy a friend."
 zin_stabilo_minted_crowns:0 "The Minted Crowns"
 zin_stabilo_minted_crowns_desc:0 "A new mint rings day and night, and the coin of Postondoroth is taken at face value in every market of the East. Its prince has his likeness stamped on every piece."
 zin_stabilo_no_credit_for_a_god_king:0 "No Credit for a God-King"
 zin_stabilo_no_credit_for_a_god_king_desc:0 "Not one coin will be lent to the King of the East, and no merchant of Postondoroth will weigh his goods. The prince has closed the ledger against him."
 zin_stabilo_one_east_under_postondoroth:0 "One East Under Postondoroth"
 zin_stabilo_one_east_under_postondoroth_desc:0 "The roads, the courts and the debts of the East all end at Postondoroth. One prince sits on the counting-table of the East, and no court is outside his ledger."
 zin_stabilo_one_east_under_postondoroth_tip_1:0 "An outcome of this game, not history."
 zin_stabilo_open_the_pact:0 "Open the Pact"
 zin_stabilo_open_the_pact_desc:0 "The Pact has been a friendship of two. Now Postondoroth opens its doors and invites every eastern court that wants to weigh its goods on the prince's scales."
 zin_stabilo_oreton_and_the_red_lands:0 "Oreton and the Red Lands"
 zin_stabilo_oreton_and_the_red_lands_desc:0 "Oreton and the Avalon hills trade red clay, copper bowls and dyed wool. Postondoroth maps the roads and offers to carry the goods to market."
 zin_stabilo_pact_council:0 "The Pact Council"
 zin_stabilo_pact_council_desc:0 "Representatives of the Pact meet in the hall of weights and settle their quarrels by arbitration. No member may draw a blade in the hall."
 zin_stabilo_pact_council_spirit:0 "The Pact Council"
 zin_stabilo_pact_council_spirit_desc:0 "Delegates of the Pact settle their quarrels by arbitration in the hall of weights."
 zin_stabilo_pact_garrisons:0 "Pact Garrisons"
 zin_stabilo_pact_garrisons_desc:0 "Each member of the Pact keeps a small garrison in the common fort at Postondoroth. They drill together, eat together and fight alongside one another."
 zin_stabilo_pact_garrisons_spirit:0 "Pact Garrisons"
 zin_stabilo_pact_garrisons_spirit_desc:0 "Small garrisons of every member drill together in the common fort and fight alongside one another."
 zin_stabilo_pact_goodwill:0 "Gifts of the Stabilo Pact"
 zin_stabilo_pact_of_equals:0 "The Pact of Equals"
 zin_stabilo_pact_of_equals_desc:0 "Each court of the Pact sits at the same table and speaks in turn. Postondoroth asks for the first cup and for no other privilege."
 zin_stabilo_pact_renewed:0 "The Stabilo Pact Renewed"
 zin_stabilo_pact_under_the_prince:0 "The Pact Under the Prince"
 zin_stabilo_pact_under_the_prince_desc:0 "Protection contracts are drafted for every court that wishes one. The prince will defend them, and they will pay him a fixed tenth."
 zin_stabilo_paid_in_full:0 "Paid in Full"
 zin_stabilo_paid_in_full_desc:0 "The companies are paid in full, and the prince adds arms to the wages. Rarely has the East seen a better-equipped hireling."
 zin_stabilo_partners_of_the_temple_banks:0 "Partners of the Temple Banks"
 zin_stabilo_partners_of_the_temple_banks_desc:0 "The prince makes the temple banks partners in the caravan trade. Their silver flows into his vaults, and his accounts become part of theirs."
 zin_stabilo_paymaster_of_the_free_crowns:0 "Paymaster of the Free Crowns"
 zin_stabilo_paymaster_of_the_free_crowns_desc:0 "The prince refuses the King of the East and offers his purse to those who do the same. The Free Crowns will not want for silver."
 zin_stabilo_paymaster_of_the_host:0 "Paymaster of the Eastern Host"
 zin_stabilo_paymaster_of_the_host_desc:0 "The wages of the eastern host are paid from Postondoroth. The arms follow, wagon by wagon, with a clerk to count each spear."
 zin_stabilo_pikes_of_postondoroth:0 "The Pikes of Postondoroth"
 zin_stabilo_pikes_of_postondoroth_desc:0 "The pikemen of the shield-companies march in blocks of a hundred, with spears three men long. A cavalry charge breaks against them like the sea on rock."
 zin_stabilo_prince_and_houses:0 "The Prince and the Houses"
 zin_stabilo_prince_and_houses_desc:0 "The prince and the houses sign a charter of duties on a single sheet. For the first time in a generation the principality speaks with one voice."
 zin_stabilo_prince_blozan:0 "A Letter to Prince Blozan"
 zin_stabilo_prince_blozan_desc:0 "Prince Blozan of Plutondo is young, ambitious and short of silver. A friendly letter from Postondoroth, with a draft attached, is likely to be welcome."
 zin_stabilo_prince_of_all_roads:0 "The Prince of All Roads"
 zin_stabilo_prince_of_all_roads_desc:0 "Why should the East be ruled by a sword when it can be ruled by a contract? The prince resolves to buy every charter, sign every court and wear one crown."
 zin_stabilo_prince_of_caravans:0 "Prince of the Caravans"
 zin_stabilo_prince_of_caravans_desc:0 "Every caravan on the southern roads carries a letter from Postondoroth, and the drivers call the prince by a title that is not yet official."
 zin_stabilo_prince_of_postondoroth:0 "The Prince of Postondoroth"
 zin_stabilo_prince_of_postondoroth_desc:0 "The prince's household is large, gilded and expensive, and every merchant of the city wants a son in it. Its upkeep is cheaper than a war."
 zin_stabilo_prince_of_the_caravans:0 "Prince of the Caravans"
 zin_stabilo_prince_of_the_caravans_desc:0 "Every caravan on the Gold, Sand and Lake Roads carries a letter from Postondoroth. The drivers call the prince by a title that is not yet official."
 zin_stabilo_princes_ambition:0 "The Prince's Ambition"
 zin_stabilo_princes_ambition_desc:0 "One prince, one ledger, one East. The houses have agreed to it, for now."
 zin_stabilo_princes_auditors:0 "The Prince's Auditors"
 zin_stabilo_princes_auditors_desc:0 "Sworn auditors count every temple and counting-house and report to the prince alone."
 zin_stabilo_princes_household:0 "The Prince's Household"
 zin_stabilo_princes_household_desc:0 "A large, gilded household that every merchant's son wishes to join. It costs less than a war and wins more friends."
 zin_stabilo_princes_purse:0 "The Prince's Purse"
 zin_stabilo_princes_purse_desc:0 "The prince holds the purse and the houses advise. Decisions are made quickly, and the houses remember who made them."
 zin_stabilo_princes_purse_spirit:0 "The Prince's Purse"
 zin_stabilo_princes_purse_spirit_desc:0 "The prince holds the purse and decides quickly. The houses grumble and pay."
 zin_stabilo_protection_contracts:0 "Protection Contracts"
 zin_stabilo_protection_contracts_desc:0 "A form is drawn up in two columns. On one side, the protection of Postondoroth. On the other, a tenth of every harvest."
 zin_stabilo_protection_contracts_tip_1:0 "Courts at lean 60 may be offered protection."
 zin_stabilo_reckoning_of_the_east:0 "The Reckoning of the East"
 zin_stabilo_reckoning_of_the_east_desc:0 "A king calls himself the Deliverer, and an army waits on the rift. The ledger of the East has never held a question like this one."
 zin_stabilo_reckoning_of_the_east_tip_1:0 "Opens three answers."
 zin_stabilo_relief_houses_of_fudol:0 "The Relief Houses of Fudol"
 zin_stabilo_relief_houses_of_fudol_desc:0 "Houses of relief open in Fudol, funded half by the temple banks and half by the prince. Hunger and fever are rarer in the quarter where they stand."
 zin_stabilo_rivals_of_the_temple_banks:0 "Rivals of the Temple Banks"
 zin_stabilo_rivals_of_the_temple_banks_desc:0 "The temples lend as freely as the bankers, and they do not charge interest. Postondoroth quietly lets it be known that charity has a price too."
 zin_stabilo_rivals_of_the_temple_banks_tip_1:0 "Courts in Postondoroth's debt listen less to the temples' friends."
 zin_stabilo_sand_road_charter:0 "The Sand Road Charter"
 zin_stabilo_sand_road_charter_desc:0 "Beyond the last cairn, the Sand Road runs south through the dunes. Postondoroth drafts a charter to guard it and invites the desert courts to sign."
 zin_stabilo_seat_at_postondoroth:0 "The Seat at Postondoroth"
 zin_stabilo_seat_at_postondoroth_desc:0 "The old seat of the princes is repaired and rebuilt. Marble floors, a hall of weights and measures, and a vault with three locks."
 zin_stabilo_seize_the_salt_road:0 "Seize the Salt Road"
 zin_stabilo_seize_the_salt_road_desc:0 "The companies of Postondoroth ride the Salt Road under the prince's writ. Every well and caravanserai on it is claimed for the ledger."
 zin_stabilo_shield_companies:0 "The Shield-Companies"
 zin_stabilo_shield_companies_desc:0 "Stabilo does not raise armies, it hires them. The shield-companies march under contract, are paid on the day, and are the best-trained troops in the East."
 zin_stabilo_shield_companies_spirit:0 "The Shield-Companies"
 zin_stabilo_shield_companies_spirit_desc:0 "Stabilo hires its armies, pays them on the day and keeps them well trained."
 zin_stabilo_siege_engineers:0 "Siege Engineers"
 zin_stabilo_siege_engineers_desc:0 "Engineers from half a dozen lands are hired to design walls that cannot be scaled and engines that can scale any wall. Their drawings fill a room."
 zin_stabilo_spoils_for_the_ledger:0 "Spoils for the Ledger"
 zin_stabilo_spoils_for_the_ledger_desc:0 "The taken groves are valued by the prince's assessors and entered in the ledger. Every harvest brings a portion home."
 zin_stabilo_stabilo_pact:0 "The Stabilo Pact"
 zin_stabilo_stabilo_pact_desc:0 "The Pact binds Postondoroth and Drak to open roads, shared tariffs and a common watch. Its seal is a pair of scales held by a single hand."
 zin_stabilo_standing_companies:0 "The Standing Companies"
 zin_stabilo_standing_companies_desc:0 "The best companies are offered permanent posts at higher pay. They keep their arms, their captains and their banners, and they are never disbanded."
 zin_stabilo_standing_companies_spirit:0 "The Standing Companies"
 zin_stabilo_standing_companies_spirit_desc:0 "The best companies hold permanent posts, keep their banners and are never disbanded."
 zin_stabilo_subsidies_for_the_courts:0 "Subsidies for the Courts"
 zin_stabilo_subsidies_for_the_courts_desc:0 "Silver flows from Postondoroth to the courts that stand against the King of the East. In return, their ledgers are opened and their debts eased."
 zin_stabilo_temple_accounts:0 "The Temple Accounts"
 zin_stabilo_temple_accounts_desc:0 "The envoys of the Zilin Hills have asked to see the prince's books. They offer, in return, a partnership in the caravan trade."
 zin_stabilo_temple_loans_for_the_roads:0 "Temple Loans for the Roads"
 zin_stabilo_temple_loans_for_the_roads_desc:0 "The temples offer silver for the roads, on terms the clerks find too generous. The prince reads the contract slowly, twice."
 zin_stabilo_temple_partners:0 "Partners of the Temple Banks"
 zin_stabilo_temple_partners_desc:0 "Temple silver flows into the prince's vaults, and relief houses open in the poor quarters."
 zin_stabilo_terms_at_postondoroth:0 "Terms at Postondoroth"
 zin_stabilo_terms_at_postondoroth_desc:0 "With the Salt Road in its hands, Postondoroth offers terms. The Caravan War may end with a handshake and a contract."
 zin_stabilo_the_counting_houses:0 "The Counting Houses"
 zin_stabilo_the_counting_houses_desc:0 "Counting houses open in every city of the principality, each with a vault, a clerk and a man with a sword. Interest accrues, and the prince is pleased."
 zin_stabilo_the_crowned_ledger:0 "The Crowned Ledger"
 zin_stabilo_the_crowned_ledger_desc:0 "The prince is crowned on the counting-table of Postondoroth with a circlet made from melted coin. The houses applaud, and the ledger is bound in gold."
 zin_stabilo_the_desert_shield:0 "The Desert Shield"
 zin_stabilo_the_desert_shield_desc:0 "A line of forts, wells and watch-towers runs along the edge of the dunes. A raider who reaches it finds the shields of Postondoroth already waiting."
 zin_stabilo_the_free_crowns_purse:0 "The Free Crowns' Purse"
 zin_stabilo_the_free_crowns_purse_desc:0 "The courts that refused the King of the East gather at Postondoroth. The prince opens his vault, and the banner of the Free Crowns is raised over his counting-table."
 zin_stabilo_the_free_roads:0 "The Free Roads"
 zin_stabilo_the_free_roads_desc:0 "The King of the East is gone, or his claim is not heard. The roads of the East belong again to those who walk them, and the scales of Postondoroth weigh for every court alike."
 zin_stabilo_the_free_roads_tip_1:0 "An outcome of this game, not history."
 zin_stabilo_the_great_kingdoms_sign:0 "The Great Kingdoms Sign"
 zin_stabilo_the_great_kingdoms_sign_desc:0 "Envoys carry the prince's charter to Alerhia, Miaed, Erco and Plutondo. Each court must sign, or explain to the ledger why it will not."
 zin_stabilo_the_great_ledger:0 "The Great Ledger"
 zin_stabilo_the_great_ledger_desc:0 "The ledgers of the East are merged into one volume, bound in indigo leather and kept under three locks. It is said that a king may be ruined by a single page."
 zin_stabilo_the_greater_pact:0 "The Greater Pact"
 zin_stabilo_the_greater_pact_desc:0 "The Pact is rewritten and sealed by every member. Gifts pass from hand to hand, and the debts of the weakest are forgiven in part. The whole table is satisfied."
 zin_stabilo_the_houses_vote:0 "The Houses Vote"
 zin_stabilo_the_houses_vote_desc:0 "Once a year the houses cast their stones in the urn and decide where the principality will spend its silver. The count is long, and the prince listens to every stone."
 zin_stabilo_the_kings_mint:0 "The King's Mint"
 zin_stabilo_the_kings_mint_desc:0 "The mint of Postondoroth strikes coin in the King's image. It is the only mint of the East that is trusted in every market."
 zin_stabilo_the_merchant_houses:0 "The Merchant Houses"
 zin_stabilo_the_merchant_houses_desc:0 "Postondoroth is a city of counting-tables, and its prince reigns because the great houses agree to let him. Prince Cereos has asked the houses who keeps the keys."
 zin_stabilo_the_mountain_road:0 "The Mountain Road to Erco"
 zin_stabilo_the_mountain_road_desc:0 "A paved road is cut through the mountains to Erco, and mule-strings are replaced by wagons. The ore comes down cheaper, and Erco learns who paid for the road."
 zin_stabilo_the_pact_council_sits:0 "The Pact Council Sits"
 zin_stabilo_the_pact_council_sits_desc:0 "Representatives of the Stabilo Pact gather at Postondoroth for the first time. They sit in the hall of weights and are served the same wine."
 zin_stabilo_the_princes_auditors:0 "The Prince's Auditors"
 zin_stabilo_the_princes_auditors_desc:0 "A company of sworn auditors is sent to every temple and counting-house in the principality. They count, they cross-check, and they report to the prince alone."
 zin_stabilo_the_princes_due:0 "The Prince's Due"
 zin_stabilo_the_princes_due_desc:0 "The prince claims what is owed him, and his writ runs against the rival of the East. Clerks and companies set out together."
 zin_stabilo_the_road_to_parim:0 "The Road to Parim"
 zin_stabilo_the_road_to_parim_desc:0 "The coalition turns west toward Parim, and the companies of Stabilo march at its head. The Golden City is within sight, and the contract is for its sack."
 zin_stabilo_the_southern_roads:0 "The Southern Roads"
 zin_stabilo_the_southern_roads_desc:0 "Postondoroth was founded on the Gold Road, and its first prince was a toll-keeper. The caravans of the south have not forgotten it."
 zin_stabilo_trade_of_the_south_lands:0 "Trade of the South Lands"
 zin_stabilo_trade_of_the_south_lands_desc:0 "The courts of the south sell dyes, spices and the sweet resin of their trees. Postondoroth offers to buy them all, on delivery, at a fair price."
 zin_stabilo_treasurer_of_the_east:0 "Treasurer of the East"
 zin_stabilo_treasurer_of_the_east_desc:0 "The generous friends in Postondoroth have offered the prince a new partnership. Stabilo pledges its ledgers to the Deliverer's cause."
 zin_stabilo_treasury_of_the_east:0 "Treasury of the East"
 zin_stabilo_treasury_of_the_east_desc:0 "Postondoroth pays the wages of the King of the East, and its ledgers are open to the throne."
 zin_stabilo_vassals_by_contract:0 "Vassals by Contract"
 zin_stabilo_vassals_by_contract_desc:0 "A court whose debt cannot be paid is offered a choice: the debtor's chains, or the protector's banner. Few read the small print."
 zin_stabilo_war_chest_of_the_pact:0 "The War Chest of the Pact"
 zin_stabilo_war_chest_of_the_pact_desc:0 "The treasurers of the Pact count out coin for a war that nobody has yet declared. It is stored in iron-bound chests beneath the hall of weights."
 zin_stabilo_war_for_the_free_crowns:0 "War for the Free Crowns"
 zin_stabilo_war_for_the_free_crowns_desc:0 "The companies of Stabilo are hired to fight for the Free Crowns. The prince offers a bonus for every day that the King's banner does not fly."
 zin_stabilo_wells_of_obmi:0 "The Wells of Obmi"
 zin_stabilo_wells_of_obmi_desc:0 "Obmi holds the wells on the central Sand Road. The prince offers a lease of the wells in return for a share of the tolls."
 zin_stabilo_west_to_alerhia:0 "West to Alerhia"
 zin_stabilo_west_to_alerhia_desc:0 "West of the Gold Road lie Alerhia, Kersian and Azano, rich in grain and short of silver. Postondoroth is happy to lend."
 zin_stabilo.1.a:0 "The prince keeps the keys."
 zin_stabilo.1.b:0 "The houses share the table."
 zin_stabilo.1.d:0 "The great houses of Postondoroth sit around the table with the prince at its head. The treasurer asks, as she does each year, who will hold the keys of the vault."
 zin_stabilo.1.t:0 "The Merchant Houses"
 zin_stabilo.10.a:0 "A daughter of Drak's royal house."
 zin_stabilo.10.b:0 "A prince of Plutondo."
 zin_stabilo.10.c:0 "A daughter of the House of Azano."
 zin_stabilo.10.d:0 "Three houses offer a marriage to bind the Pact more firmly than any treaty. The prince's counsellors are divided, and the guests are already on the road."
 zin_stabilo.10.t:0 "A Marriage in the Pact"
 zin_stabilo.11.a:0 "Consider it."
 zin_stabilo.11.b:0 "Send them the auditors' compliments."
 zin_stabilo.11.d:0 "The temple banks of the Zilin Hills offer the prince a partnership in the caravan trade. Their envoys are courteous, and their ledgers are very orderly."
 zin_stabilo.11.t:0 "The Temple Accounts"
 zin_stabilo.12.a:0 "Long live the Prince of All Roads."
 zin_stabilo.12.d:0 "On the counting-table of Postondoroth the prince is crowned with a circlet of melted coin. The houses file in one by one and lay their seals before him."
 zin_stabilo.12.t:0 "The Crowned Ledger"
 zin_stabilo.13.a:0 "The prince will answer."
 zin_stabilo.13.d:0 "The hall of weights is full. The rivalry with Furvior, the debts of the courts, the temples' footholds and the host on the rift are set out on the great table like goods at market. Every eye is on the prince."
 zin_stabilo.13.t:0 "The Reckoning of the East"
 zin_stabilo.21.a:0 "Water the camels."
 zin_stabilo.21.d:0 "The elders of Obmi have leased the wells of the central road to Postondoroth. The first caravan of the Pact waters there before the month is out."
 zin_stabilo.21.t:0 "Obmi's Answer"
 zin_stabilo.22.a:0 "Read it to the houses."
 zin_stabilo.22.d:0 "A rider returns from Drak with a sealed reply. The old friendship is as warm as ever, and the old debt is as old as ever."
 zin_stabilo.22.t:0 "Drak's Answer"
 zin_stabilo.23.a:0 "Weigh it."
 zin_stabilo.23.d:0 "Prince Blozan's answer arrives in a gilded case. It is courteous, long and not entirely clear."
 zin_stabilo.23.t:0 "Plutondo's Answer"
 zin_stabilo.24.a:0 "Weigh the ore."
 zin_stabilo.24.d:0 "The mountain lords of Erco have agreed to sell their ore to the Pact. The first string of mules comes down the mountain a week later."
 zin_stabilo.24.t:0 "Erco's Answer"
 zin_stabilo.25.a:0 "Open the road."
 zin_stabilo.25.d:0 "The lords of Miaed have opened the passes. Caravans of the Pact will cross the snow-line in winter, and pay the toll in silver."
 zin_stabilo.25.t:0 "Miaed's Answer"
 zin_stabilo.26.a:0 "So be it."
 zin_stabilo.26.d:0 "The elders of Obmi have returned the lease unsealed. The wells are theirs, they say, and the Pact may dig its own."
 zin_stabilo.26.t:0 "Obmi Keeps Its Wells"
 zin_stabilo.27.a:0 "So be it."
 zin_stabilo.27.d:0 "The mountain lords of Erco have sent back the prince's offer with a lump of raw copper and a polite refusal."
 zin_stabilo.27.t:0 "Erco Keeps Its Ore"
 zin_stabilo.28.a:0 "So be it."
 zin_stabilo.28.d:0 "The lords of Miaed have turned the Pact's merchants away. Snow is already deep in the passes, and they intend to keep it so."
 zin_stabilo.28.t:0 "The Passes Stay Closed"
 zin_stabilo.3.a:0 "Vote for roads."
 zin_stabilo.3.b:0 "Vote for credit."
 zin_stabilo.3.c:0 "Vote for companies."
 zin_stabilo.3.d:0 "The stones are cast in the urn, and the clerk counts them aloud. Roads, credit and companies each have their patrons, and the prince will spend the year's silver where the count falls."
 zin_stabilo.3.t:0 "The Houses Vote"
 zin_stabilo.30.a:0 "Accept."
 zin_stabilo.30.b:0 "Decline."
 zin_stabilo.30.d:0 "A banker of Fudol has called at the palace with a sealed offer. The sum is large, the interest is fair, and the repayment is written in a hand that looks very like a threat."
 zin_stabilo.30.t:0 "A Loan from Postondoroth"
 zin_stabilo.31.a:0 "Pay in gold."
 zin_stabilo.31.b:0 "Pay in kind."
 zin_stabilo.31.c:0 "Default."
 zin_stabilo.31.d:0 "A polite clerk of Postondoroth stands at the gate with the ledger open to the right page. The debt is due, and he has all day to wait."
 zin_stabilo.31.t:0 "Postondoroth Calls In a Debt"
 zin_stabilo.32.a:0 "Restructure the loan."
 zin_stabilo.32.b:0 "Press for payment."
 zin_stabilo.32.c:0 "Forgive the debt."
 zin_stabilo.32.d:0 "A court at the far end of the ledger has missed its payment for the third time. The clerks bring the file to the prince, and the prince wishes to hear all opinions before he chooses a mercy."
 zin_stabilo.32.t:0 "A Debtor Cannot Pay"
 zin_stabilo.33.a:0 "Acknowledge."
 zin_stabilo.33.d:0 "The debtor has refused to pay and sent no explanation. The ledger records the default, and the clerks quietly note which roads the defaulter holds."
 zin_stabilo.33.t:0 "A Court Defaults"
 zin_stabilo.4.a:0 "Sealed."
 zin_stabilo.4.d:0 "The prince and the great houses have drawn up a charter of duties on a single sheet. Every seal is set to it, and the ink is still wet when the bells ring."
 zin_stabilo.4.t:0 "The Prince and the Houses"
 zin_stabilo.5.a:0 "Lease the wells to Postondoroth."
 zin_stabilo.5.b:0 "The wells are ours."
 zin_stabilo.5.d:0 "Clerks of Postondoroth have come to Obmi with a lease of the central wells and an offer to share the tolls. The elders say that a lease is a rope with two ends."
 zin_stabilo.5.t:0 "The Wells of Obmi"
 zin_stabilo.6.a:0 "Renew the Pact."
 zin_stabilo.6.b:0 "Ask Postondoroth to forgive our debt."
 zin_stabilo.6.d:0 "The prince of Postondoroth has sent Drak a gift and a reminder of the Pact. Drak is the oldest friend of the scales, and the oldest debtor."
 zin_stabilo.6.t:0 "The Friendship of Drak"
 zin_stabilo.7.a:0 "Accept the Pact's friendship."
 zin_stabilo.7.b:0 "Ask for a loan first."
 zin_stabilo.7.c:0 "Keep our distance."
 zin_stabilo.7.d:0 "A courier in a grey cloak has brought Prince Blozan a letter bearing the scales of Postondoroth. It offers friendship, a place at the Pact table and, in the second paragraph, a loan."
 zin_stabilo.7.t:0 "A Letter from Postondoroth"
 zin_stabilo.8.a:0 "Sell ore to the Pact."
 zin_stabilo.8.b:0 "The mountains keep their own."
 zin_stabilo.8.d:0 "Postondoroth offers to buy the copper and tin of Erco and to build a road to carry it. The mountain lords do not like to sell their ore for the promise of a road."
 zin_stabilo.8.t:0 "The Mines of Erco"
 zin_stabilo.9.a:0 "Open the passes to Pact caravans."
 zin_stabilo.9.b:0 "The passes stay closed."
 zin_stabilo.9.d:0 "The merchants of Postondoroth ask the lords of Miaed to open the passes to Pact caravans, in exchange for protection against winter raiders. The lords weigh the offer."
 zin_stabilo.9.t:0 "A Bargain with Miaed"
