l_english:
 zin_regional_mora_a_republic_among_kings:0 "A Commonwealth Among Kings"
 zin_regional_mora_a_republic_among_kings_desc:0 "Mora is the only council commonwealth among the crowns of the East, and its neighbours treat it as a curiosity. The Speaker asks the council how a commonwealth should behave among kings."
 zin_regional_mora_a_shield_for_the_lake:0 "A Shield for the Lake"
 zin_regional_mora_a_shield_for_the_lake_desc:0 "The lake is small and the towns are many, and a host marching along the shore could take them one by one. The council writes to Furvior for a guarantee."
 zin_regional_mora_an_honest_inquiry:0 "An Honest Inquiry"
 zin_regional_mora_an_honest_inquiry_desc:0 "A committee of clerks, boatmen and two elders is chosen by lot to inquire into the temples' loans. They are told to find the truth and to say only what they can prove."
 zin_regional_mora_boatwrights_of_mora:0 "Boatwrights of Mora"
 zin_regional_mora_boatwrights_of_mora_desc:0 "Boatwrights build lake barges and fast cutters on the north shore, and the yard bell is heard across the water. Every boat carries the guild mark."
 zin_regional_mora_bows_of_the_east:0 "Bows of the East"
 zin_regional_mora_bows_of_the_east_desc:0 "Curved bows of horn and sinew, short enough to shoot from the saddle, are issued to the court's archers. Their range is long, their draw is smooth and the arrows are tipped in iron."
 zin_regional_mora_captains_of_the_court:0 "Captains of the Court"
 zin_regional_mora_captains_of_the_court_desc:0 "The court's best officers are called to the audience hall to study maps, argue over routes and drink the king's wine. By the end of the season they have a plan for every road in the land."
 zin_regional_mora_charter_of_mora:0 "The Charter of Mora"
 zin_regional_mora_charter_of_mora_desc:0 "The charter is carved on a stone slab at the lake front and read aloud each spring. Any townsman may stand beside it and ask the Speaker a question."
 zin_regional_mora_close_the_gates_to_the_host:0 "Close the Gates to the Host"
 zin_regional_mora_close_the_gates_to_the_host_desc:0 "The king's host is marching up the road, and the gates of [ROOT.GetName] are barred before it arrives. Masons fill the postern, archers climb the walls and the court waits."
 zin_regional_mora_close_the_houses_of_mora:0 "Close the Houses of Mora"
 zin_regional_mora_close_the_houses_of_mora_desc:0 "The council votes to shut the houses that have lent so freely and asked so little, and the doors are closed in a single morning. The lake's debts are honoured, and its trust is a little less easily given."
 zin_regional_mora_drill_the_levies:0 "Drill the Levies"
 zin_regional_mora_drill_the_levies_desc:0 "Village headmen send their able men to the muster-yard twice a year, where court drill-masters teach them to hold a line. A levy that has drilled once is worth three that have not."
 zin_regional_mora_drilled_levies:0 "Drilled Levies"
 zin_regional_mora_drilled_levies_desc:0 "A levy that has drilled once is worth three that have not."
 zin_regional_mora_eastern_oath:0 "Oath to the King in the East"
 zin_regional_mora_eastern_oath_desc:0 "Gifts and levies have been sworn to a king proclaimed in the east."
 zin_regional_mora_faith_in_the_deliverers_friends:0 "Faith in the Deliverer's Friends"
 zin_regional_mora_faith_in_the_deliverers_friends_desc:0 "The Houses of the First Light have been generous. When [zin_loc_deliverer] calls, [ROOT.GetName] will answer."
 zin_regional_mora_fisheries_of_the_lake:0 "Fisheries of the Lake"
 zin_regional_mora_fisheries_of_the_lake_desc:0 "Boats go out at dawn from every town, and nets are hung to dry along the shore. The catch is salted, smoked or sold fresh, and nothing is wasted."
 zin_regional_mora_forts_on_the_marches:0 "Forts on the Marches"
 zin_regional_mora_forts_on_the_marches_desc:0 "Mud-brick forts are raised on the hills along the borders, each with a well, a granary and a signal-tower. They are not grand, but a column that must pass them knows it has been seen."
 zin_regional_mora_free_crown_court:0 "A Free Crown"
 zin_regional_mora_free_crown_court_desc:0 "The court stands among the courts that refused a god-king."
 zin_regional_mora_free_elections_of_mora:0 "Free Elections of Mora"
 zin_regional_mora_free_elections_of_mora_desc:0 "Every household in the towns has a voice in choosing the Speaker, and the elections are held with painted tokens in open boats. The losers sail home and the winners buy the ale."
 zin_regional_mora_free_lake:0 "The Free Lake"
 zin_regional_mora_free_lake_desc:0 "The lake is open water, and no king may close it. Boats of every flag drop anchor here and are charged the same dues."
 zin_regional_mora_friendship_with_ostoroth:0 "Friendship With Ostoroth"
 zin_regional_mora_friendship_with_ostoroth_desc:0 "The highland king's riders come down to the lake each spring, and a pact of neighbours is spoken of. The council debates it for a month and signs it in a day."
 zin_regional_mora_gifts_for_the_king:0 "Gifts for the King in the East"
 zin_regional_mora_gifts_for_the_king_desc:0 "A king has been proclaimed in the east, and [ROOT.GetName] sends him gifts: gold, horses and a company of its best archers. The gifts are sent under escort, and so is a reminder of what the king expects in return."
 zin_regional_mora_horse_and_camel:0 "Horse and Camel"
 zin_regional_mora_horse_and_camel_desc:0 "Camel riders for the dry roads and horsemen for the grassland: [ROOT.GetName] learns to use each where it serves best. Their mounts are bred from the finest stock the court can buy."
 zin_regional_mora_keep_our_own_counsel:0 "Keep Our Own Counsel"
 zin_regional_mora_keep_our_own_counsel_desc:0 "The king in the east has sent for [ROOT.GetName], and the court sends back a carefully worded reply. It will not oppose him, it will not serve him, and it will remember everything."
 zin_regional_mora_lake_fisheries:0 "Fisheries of the Lake"
 zin_regional_mora_lake_fisheries_desc:0 "Boat-guilds fish the lake with long nets and sell the catch fresh on the quays. A good season is measured in barrels and a bad one in complaints."
 zin_regional_mora_lake_towns:0 "The Lake Towns"
 zin_regional_mora_lake_towns_desc:0 "Five towns ring the lake, each with a quay, a market and a guild-hall. The council builds a common workshop on the busiest shore."
 zin_regional_mora_ledgers_of_the_temples:0 "Ledgers of the Temples"
 zin_regional_mora_ledgers_of_the_temples_desc:0 "The council demands to read the temples' ledgers, and the temples, gently, agree. Every loan is copied by two clerks and checked against the lake's own books."
 zin_regional_mora_levies_for_the_host:0 "Levies for the Host"
 zin_regional_mora_levies_for_the_host_desc:0 "The king of the east is gathering a host, and [ROOT.GetName] has been asked for its share. Young men are counted off by village and sent east under the court's banner."
 zin_regional_mora_neutral_waters:0 "Neutral Waters"
 zin_regional_mora_neutral_waters_desc:0 "The lake is declared neutral, and its boats may carry any flag. Both great roads are welcome and neither is trusted."
 zin_regional_mora_open_ledgers:0 "Open Ledgers"
 zin_regional_mora_open_ledgers_desc:0 "The council has set a clerk to read every loan that comes into the towns, and every clerk is a little suspicious. A lender who has something to hide soon finds the lake unwelcoming."
 zin_regional_mora_our_court_kneels_to_no_god:0 "Our Court Kneels to No God"
 zin_regional_mora_our_court_kneels_to_no_god_desc:0 "Whoever comes out of the east proclaiming himself a god, [ROOT.GetName] will not bend the knee. The king has the doors barred, the tax collectors paid in advance and the walls manned."
 zin_regional_mora_own_counsel:0 "Our Own Counsel"
 zin_regional_mora_own_counsel_desc:0 "The court opposes nothing, serves nothing and remembers everything."
 zin_regional_mora_question_of_the_east:0 "The Question of the East"
 zin_regional_mora_question_of_the_east_desc:0 "The Deliverer's friends have asked for something more than prayers, and the court of [ROOT.GetName] must decide what it will answer. Every court in the east is being asked, and every court knows the others are listening."
 zin_regional_mora_speakers_hall:0 "The Speaker's Hall"
 zin_regional_mora_speakers_hall_desc:0 "The Speaker sits in a hall of pale timber on the lake front, and the town delegates sit on benches below. Debate is long, loud and usually settled by supper."
 zin_regional_mora_stand_with_the_free_crowns:0 "Stand With the Free Crowns"
 zin_regional_mora_stand_with_the_free_crowns_desc:0 "Other courts of the east have also refused any god-king, and [ROOT.GetName] sends them a banner and a pledge. Together the Free Crowns are weaker than the king in the east, and stronger than any of them alone."
 zin_regional_mora_the_charter_of_mora:0 "The Charter of Mora"
 zin_regional_mora_the_charter_of_mora_desc:0 "The charter is cut on a slab at the lake front, so that every boatman can read what the council may and may not do. Kings have asked to see it, and have gone away thoughtful."
 zin_regional_mora_the_councils_question:0 "The Council's Question"
 zin_regional_mora_the_councils_question_desc:0 "The council asks, in open session, why the temples lend so freely and ask so little. Nobody has a good answer, which is itself an answer."
 zin_regional_mora_the_councils_question_tip_1:0 "The council asks why the temples lend so freely."
 zin_regional_mora_the_court_guard:0 "The [ROOT.GetAdjective] Guard"
 zin_regional_mora_the_court_guard_desc:0 "A standing company in the court's colours is posted at the gates, the treasury and the audience hall. They wear mail from the armoury of [ROOT.GetName] and drill each morning in the yard."
 zin_regional_mora_the_crowns_vindicated:0 "The Crowns Vindicated"
 zin_regional_mora_the_crowns_vindicated_desc:0 "The king of the east has fallen, and the courts that refused him stand unbroken. The court of [ROOT.GetName] hangs its banner over the gate, and the folk call it a day of vindication."
 zin_regional_mora_the_embassy_at_furvior:0 "The Lake's Embassy"
 zin_regional_mora_the_first_citizens:0 "The First Townsmen"
 zin_regional_mora_the_first_citizens_desc:0 "A small circle of old families takes the first seats in the council by right of wealth. The commonwealth is steadier for it, and a little less free."
 zin_regional_mora_the_free_lake:0 "The Free Lake"
 zin_regional_mora_the_free_lake_desc:0 "The lake is free, and the council has said so in a charter that every harbour has copied. Whatever else the East may become, Mora's water will stay open."
 zin_regional_mora_the_guilds_of_the_lake:0 "The Guilds of the Lake"
 zin_regional_mora_the_guilds_of_the_lake_desc:0 "Boat-guilds, rope-walks and wharf-masters meet in their own hall and send delegates to the council. Their coin keeps the commonwealth afloat and their votes keep it honest."
 zin_regional_mora_the_lake_republic:0 "The Lake Commonwealth"
 zin_regional_mora_the_lake_republic_desc:0 "Five lake towns choose a Speaker and a council of boat-guilds and wharf-masters. Moira Eraver presides, and the whole commonwealth is proud of its elections and wary of kings."
 zin_regional_mora_the_lake_road_wharves:0 "The Lake Road Wharves"
 zin_regional_mora_the_lake_road_wharves_desc:0 "Caravans from Furvior reach the lake at Mora's wharves and trans-ship to boats for the northern towns. The wharves are long, and their ledgers are longer."
 zin_regional_mora_the_lake_schools:0 "The Lake Schools"
 zin_regional_mora_the_lake_schools_desc:0 "Clerks, surveyors and ship-masters learn their trades in the schools on the quays. The tuition is paid by the guilds, and nobody is turned away for lack of coin."
 zin_regional_mora_the_noris_embassy:0 "The Noris Embassy"
 zin_regional_mora_the_noris_embassy_desc:0 "An embassy is sent to Furvior with gifts of lake-pearls and a respectful letter. The riders are told that Mora likes their coin more than their spears."
 zin_regional_mora_the_richest_lake_in_the_east:0 "The Richest Lake in the East"
 zin_regional_mora_the_richest_lake_in_the_east_desc:0 "The lake's towns are the richest per head in the East, and the council knows it. Merchants quote Mora's prices as a measure of every other market."
 zin_regional_mora_the_speakers_hall:0 "The Speaker's Hall"
 zin_regional_mora_the_speakers_hall_desc:0 "The Speaker's hall is a long timber house with open doors, where any townsman may come in to hear the debate. The council argues in front of the people, and is better for it."
 zin_regional_mora_the_temples_charity:0 "The Temples' Charity"
 zin_regional_mora_the_temples_charity_desc:0 "The temples open kitchens in every lake town, and no poor man goes hungry. The council accepts the gift with thanks and does not ask what it costs."
 zin_regional_mora_wait_upon_events:0 "Wait Upon Events"
 zin_regional_mora_wait_upon_events_desc:0 "The court of [ROOT.GetName] says neither yes nor no. It sends gifts to both sides, fills its granaries and waits for the wind to show which way to lean."
 zin_regional_mora_when_the_king_falls:0 "When the King Falls"
 zin_regional_mora_when_the_king_falls_desc:0 "The king in the east is dead, and the court of [ROOT.GetName] stands in an empty hall. Its oaths are void, its gifts are lost and its people look to the throne for something to say."
 zin_regional_mora.1.a:0 "We cannot spare the riders"
 zin_regional_mora.1.b:0 "Furvior guards the lake"
 zin_regional_mora.1.d:0 "A deputation from Mora arrives at Furvior with a fine speech, a sealed petition and a plain request: a guarantee of the lake's freedom. The riders are needed elsewhere, and the court knows it."
 zin_regional_mora.1.t:0 "The Lake Commonwealth Asks for a Shield"
 zin_regional_mora.2.a:0 "Keep the findings in the council's chest"
 zin_regional_mora.2.b:0 "Publish the findings"
 zin_regional_mora.2.d:0 "The council's clerks have read the temples' loan books line by line. The loans are too generous and the lenders too well informed, and nobody on the council can say why. The Speaker asks what the council should do with the report."
 zin_regional_mora.2.t:0 "An Honest Inquiry"
