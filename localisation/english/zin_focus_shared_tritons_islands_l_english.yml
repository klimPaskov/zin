l_english:
 zin_shared_tritons_islands_a_harbour_for_any_sail:0 "A Harbour for Any Sail"
 zin_shared_tritons_islands_a_harbour_for_any_sail_desc:0 "The island lights its harbour lamps for any ship, whatever flag she flies and whatever she carries. No captain is asked his business, and nobody is turned away on a rough night."
 zin_shared_tritons_islands_a_house_of_healing:0 "A House of Healing"
 zin_shared_tritons_islands_a_house_of_healing_desc:0 "Grey-robed healers have landed at the quay with a chest of herbs and a letter of introduction. They ask for a room, a garden and the island's trust, and promise a hospital and a grain store in return."
 zin_shared_tritons_islands_a_house_of_healing_tip_1:0 "The Houses of the First Light offer a hospital and a grain store."
 zin_shared_tritons_islands_a_voice_in_the_hall:0 "A Voice in the Hall"
 zin_shared_tritons_islands_a_voice_in_the_hall_desc:0 "An islander is sent to the overlord's hall to speak for the island, and told to be heard. He is a stubborn man, a patient talker and a very good listener, and the overlord's steward comes to dread him."
 zin_shared_tritons_islands_a_word_from_parim:0 "A Word from Parim"
 zin_shared_tritons_islands_a_word_from_parim_desc:0 "A courier from Parim brings a sealed letter, handsomely written and not very informative. The hall of [ROOT.GetName] reads it twice, answers it once and files it where the mice cannot reach."
 zin_shared_tritons_islands_a_word_from_parim_tip_1:0 "Parim's tariffs reach even the islands."
 zin_shared_tritons_islands_beside_the_heir:0 "Beside the Coalition"
 zin_shared_tritons_islands_beside_the_heir_desc:0 "A host has gathered in the south under a single banner, and it has asked every shore to send what it can. [ROOT.GetName] sends its best hulls and its youngest captains, and lets the coalition decide where to put them."
 zin_shared_tritons_islands_boats_for_the_evacuation:0 "Boats for the Evacuation"
 zin_shared_tritons_islands_boats_for_the_evacuation_desc:0 "The western host is coming home, and the sea between is crowded with the wounded and their families. The boats of [ROOT.GetName] put out in every weather to carry them to dry land, and nobody asks under whose banner they served."
 zin_shared_tritons_islands_chart_makers:0 "The Chart-Makers' Guild"
 zin_shared_tritons_islands_chart_makers_desc:0 "The seal of the guild on a chart promises that the shoals are where it says, and every captain on the Pupor believes it."
 zin_shared_tritons_islands_charter_patrols:0 "Charter Patrols"
 zin_shared_tritons_islands_charter_patrols_desc:0 "Charter galleys patrol the lanes in pairs, one bright and one dull, and the dull one is usually the dangerous one. [ROOT.GetName] lends a hull and a crew each summer and learns a great deal about what corsairs do not want seen."
 zin_shared_tritons_islands_charts_for_sale:0 "Charts for Sale"
 zin_shared_tritons_islands_charts_for_sale_desc:0 "A copy of a chart, signed and sealed, still fetches a good price at any court. [ROOT.GetName] sets two clerks to copying and a third to make sure that none of them copies a mistake."
 zin_shared_tritons_islands_corsair_season:0 "Corsair Season"
 zin_shared_tritons_islands_corsair_season_desc:0 "The coves are full of lean ships and fat purses, and the island has never had so many friends in so many ports."
 zin_shared_tritons_islands_council_of_harbours:0 "Council of Harbours"
 zin_shared_tritons_islands_council_of_harbours_desc:0 "Islands that sit in councils learn to meet in other councils. [ROOT.GetName] sends its speaker to a gathering of harbours and returns with fair terms of trade and an appetite for more."
 zin_shared_tritons_islands_courts_of_the_charter:0 "A Pirate Trial"
 zin_shared_tritons_islands_courts_of_the_charter_desc:0 "A corsair crew taken by the Charter's galleys must be tried somewhere, and [ROOT.GetName] has the nearest rope. The hall is cleared, the elders are summoned and the island waits to see what the sea's justice looks like on dry land."
 zin_shared_tritons_islands_drying_sheds:0 "The Drying Sheds"
 zin_shared_tritons_islands_drying_sheds_desc:0 "Racks of split fish and sheds of salt keep the larders of [ROOT.GetName] full through the lean weeks."
 zin_shared_tritons_islands_envoys_to_the_west:0 "Envoys to the Western Shore"
 zin_shared_tritons_islands_envoys_to_the_west_desc:0 "The western shore is a day's sail away on a good wind and a week's on a bad one. [ROOT.GetName] sends envoys with salt, dried fish and charts, and they return with grain, iron and gossip."
 zin_shared_tritons_islands_fish_salt_and_sail:0 "Fish, Salt and Sail"
 zin_shared_tritons_islands_fish_salt_and_sail_desc:0 "Fish are caught, salt is raked from the pans and sailcloth is woven through the long winter. [ROOT.GetName] raises a Guild Workshop on the quay where the three trades meet."
 zin_shared_tritons_islands_fishers_not_fighters:0 "Fishers, Not Warriors"
 zin_shared_tritons_islands_fishers_not_fighters_desc:0 "A fisher who hauls his nets at dawn and sleeps at dusk has no time for politics. [ROOT.GetName] makes a creed of this, and finds that it is also a defence."
 zin_shared_tritons_islands_galleys_of_the_isle:0 "Galleys of the Isle"
 zin_shared_tritons_islands_galleys_of_the_isle_desc:0 "A galley is only a long boat with ambition. The islanders build theirs lean and low, with a ram of black oak at the bow, and teach their rowers to keep a stroke through a gale."
 zin_shared_tritons_islands_harbour_charters:0 "Council of Harbours"
 zin_shared_tritons_islands_harbour_charters_desc:0 "The speaker of [ROOT.GetName] sits in the gathering of harbours, and its merchants profit from what he hears there."
 zin_shared_tritons_islands_harried_lanes:0 "Harried Sea Lanes"
 zin_shared_tritons_islands_harried_lanes_desc:0 "Corsairs ravage the lanes, and the chart houses pay for it in lost cargoes, lost ships and a tired temper."
 zin_shared_tritons_islands_hearth_and_harbour:0 "Hearth and Harbour"
 zin_shared_tritons_islands_hearth_and_harbour_desc:0 "A good hearth and a good harbour are the whole of an island's wealth. [ROOT.GetName] mends the quay, tars the boats and counts the winter stores."
 zin_shared_tritons_islands_island_neutrality:0 "Island Neutrality"
 zin_shared_tritons_islands_island_neutrality_desc:0 "The great courts quarrel, and the islands trade with all of them. [ROOT.GetName] makes it known that its harbours are open to every flag and its quarrels to none."
 zin_shared_tritons_islands_island_neutrality_spirit:0 "Island Neutrality"
 zin_shared_tritons_islands_island_neutrality_spirit_desc:0 "The harbours of [ROOT.GetName] are open to every flag and its quarrels to none. It is a comfortable creed, and a slightly sleepy one."
 zin_shared_tritons_islands_island_pilots:0 "Island Steersmen"
 zin_shared_tritons_islands_island_pilots_desc:0 "The steersmen of [ROOT.GetName] read the sea by its colour, the birds by their flight and the wind by the taste of the spray. A young captain who has sailed a season with one will not need a chart again."
 zin_shared_tritons_islands_island_pilots_spirit:0 "Island Steersmen"
 zin_shared_tritons_islands_island_pilots_spirit_desc:0 "The steersmen of [ROOT.GetName] read the sea by its colour and the wind by the taste of the spray, and take every ship further."
 zin_shared_tritons_islands_islanders_oath:0 "The Islanders' Oath"
 zin_shared_tritons_islands_islanders_oath_desc:0 "Every household of [ROOT.GetName] has sworn on the hall's oar to share in a bad season and to hold the shore in a bad year."
 zin_shared_tritons_islands_isle_apart:0 "The Isle Keeps Apart"
 zin_shared_tritons_islands_isle_apart_desc:0 "The boats are drawn up the beach and the harbour is chained. [ROOT.GetName] is a rock in the middle of the sea."
 zin_shared_tritons_islands_isle_bows:0 "Bows of the Isle"
 zin_shared_tritons_islands_isle_bows_desc:0 "Yew is rare on the islands, and sea-wind makes it brittle. The bowyers of [ROOT.GetName] learn to cure horn and sinew instead, and their short bows shoot true in a gale."
 zin_shared_tritons_islands_isle_squadron:0 "The Isle Fleet"
 zin_shared_tritons_islands_isle_squadron_desc:0 "Six hulls and one standard, rowed by the same crews since boyhood, keep the waters of [ROOT.GetName] to themselves."
 zin_shared_tritons_islands_join_the_pupor_charter:0 "Join the Pupor Charter"
 zin_shared_tritons_islands_join_the_pupor_charter_desc:0 "The chart houses keep the lanes, mark the shoals and hang the corsairs. [ROOT.GetName] adds its name to the Pupor Charter and its lamp to the lane-marks, and asks only that its own boats be safe in every harbour that signs."
 zin_shared_tritons_islands_keep_to_our_own_waters:0 "Keep to Our Own Waters"
 zin_shared_tritons_islands_keep_to_our_own_waters_desc:0 "The island's waters are its own, and so are its quarrels. [ROOT.GetName] will not hang a corsair for the Charter nor feed one for the coves; it fishes, it salts and it sleeps with the door barred."
 zin_shared_tritons_islands_lean_season:0 "A Lean Season in the Coves"
 zin_shared_tritons_islands_lean_season_desc:0 "The sea is quiet and the merchants are careful. The coves sit idle, and the island's purse grows thin."
 zin_shared_tritons_islands_mainland_trade:0 "Trade with the Mainland"
 zin_shared_tritons_islands_mainland_trade_desc:0 "Envoys with salt and charts have opened the mainland harbours to the boats of [ROOT.GetName]."
 zin_shared_tritons_islands_old_freedoms:0 "The Old Freedoms"
 zin_shared_tritons_islands_old_freedoms_desc:0 "The island's ancient rights have been recorded and sent to its overlord, and the overlord has not dared dispute them."
 zin_shared_tritons_islands_open_lanes:0 "Open Sea Lanes"
 zin_shared_tritons_islands_open_lanes_desc:0 "The Charter keeps the lanes clear and the corsairs are few. Merchants sail where they like and pay less for the privilege."
 zin_shared_tritons_islands_own_waters:0 "Our Own Waters"
 zin_shared_tritons_islands_own_waters_desc:0 "The island fishes, salts and sleeps. Its waters are its own and so are its quarrels."
 zin_shared_tritons_islands_pay_tribute_tip_1:0 "The overlord is paid its tribute."
 zin_shared_tritons_islands_sail_with_the_crossing:0 "Sail with the Crossing"
 zin_shared_tritons_islands_sail_with_the_crossing_desc:0 "A banner of the western courts has gone up on the quay, and the island's best captains have gone down to look at it. [ROOT.GetName] weighs its old quiet against its young men's restlessness, and the young men win."
 zin_shared_tritons_islands_sea_soldiers:0 "Sea Soldiers"
 zin_shared_tritons_islands_sea_soldiers_desc:0 "Men who have rowed for twenty years are not afraid of a beach landing. [ROOT.GetName] teaches its levy to leap from a boat in armour and be on dry sand before the wave has reached them."
 zin_shared_tritons_islands_sea_soldiers_isle:0 "Sea Soldiers"
 zin_shared_tritons_islands_sea_soldiers_isle_desc:0 "The levy of [ROOT.GetName] leaps from the boat in armour and is on dry sand before the wave arrives."
 zin_shared_tritons_islands_seek_voice_tip_1:0 "A voice in the overlord's hall: the island gains a little freedom."
 zin_shared_tritons_islands_sell_to_any_buyer:0 "Sell to Any Buyer"
 zin_shared_tritons_islands_sell_to_any_buyer_desc:0 "Silk, spice, iron and other men's wine pass through the coves of [ROOT.GetName] at a discount, and every buyer on the shore knows where to ask. The island's treasury has never been fuller or less able to explain itself."
 zin_shared_tritons_islands_ships_for_the_crossing:0 "Ships for the Crossing"
 zin_shared_tritons_islands_ships_for_the_crossing_desc:0 "The western courts have asked for hulls, and [ROOT.GetName] has hulls to sell. Its shipwrights are paid in good silver and its captains in better stories, and no island boat is ever listed among the ships that fight."
 zin_shared_tritons_islands_soundings_of_the_pupor:0 "Soundings of the Pupor"
 zin_shared_tritons_islands_soundings_of_the_pupor_desc:0 "Lead-line and long patience: the steersmen of the isles sound the deeps by hand and chalk the results on slate. [ROOT.GetName] adds its own soundings to the roll."
 zin_shared_tritons_islands_stores_against_the_storm:0 "Stores Against the Storm"
 zin_shared_tritons_islands_stores_against_the_storm_desc:0 "The storms of the Pupor Ocean come without warning and last a week. [ROOT.GetName] lays up grain, lamp-fat and dried fish in cellars cut into the rock, and sleeps easier."
 zin_shared_tritons_islands_the_boatyard:0 "The Boatyard"
 zin_shared_tritons_islands_the_boatyard_desc:0 "A slip, a steaming-box and a hut of tools make a boatyard. The shipwrights of [ROOT.GetName] build for their own fishers first and for visiting captains second, and are known up and down the coast for the order of their queue."
 zin_shared_tritons_islands_the_chart_makers_guild:0 "The Chart-Makers' Guild"
 zin_shared_tritons_islands_the_chart_makers_guild_desc:0 "Inkers, parchment-makers and navigators form a guild to protect their craft and their prices. Its seal on a chart is a promise that the shoals are where they say."
 zin_shared_tritons_islands_the_cove_raiders:0 "The Cove Raiders"
 zin_shared_tritons_islands_the_cove_raiders_desc:0 "The cove crews strike at anything that sails slow, and every merchant on the Pupor learns the shape of their sails. [ROOT.GetName] sends its own boats out beside them and calls it trade."
 zin_shared_tritons_islands_the_drying_sheds:0 "The Drying Sheds"
 zin_shared_tritons_islands_the_drying_sheds_desc:0 "Racks of split fish stand in the wind from the first frost, and the sheds smell of them for a month. What is dried and stacked now will feed the island through the lean weeks of Thaw."
 zin_shared_tritons_islands_the_free_coves:0 "The Free Coves"
 zin_shared_tritons_islands_the_free_coves_desc:0 "A cove with a good rock and a short memory is worth more to a corsair than a purse. [ROOT.GetName] opens its inlets to ships that ask no questions and pay in coin, and takes its share of whatever they bring."
 zin_shared_tritons_islands_the_great_war_at_sea:0 "The War at Sea"
 zin_shared_tritons_islands_the_great_war_at_sea_desc:0 "The great courts of the mainland have gone to war, and the sea between them is the road they fight along. [ROOT.GetName] watches the horizon fill with sails and must decide what its quiet island will be in the new season."
 zin_shared_tritons_islands_the_island_boats:0 "The Island Boats"
 zin_shared_tritons_islands_the_island_boats_desc:0 "The boats of [ROOT.GetName] are small, clinker-built and as old as the families that row them. A proper harbour wall gives them a berth in any weather and a place to count the catch."
 zin_shared_tritons_islands_the_island_elders:0 "The Island Elders"
 zin_shared_tritons_islands_the_island_elders_desc:0 "The oldest fishers sit nearest the fire and speak last. [ROOT.GetName] has found that a quarrel which survives their silence is a quarrel worth hearing."
 zin_shared_tritons_islands_the_island_hall:0 "The Island Hall of [ROOT.GetName]"
 zin_shared_tritons_islands_the_island_hall_desc:0 "Every island has a hall where its families meet, and on [ROOT.GetName] it stands above the harbour with its door facing the sea. The elders hang their oars on the walls, set the great hearth burning and begin the island's year."
 zin_shared_tritons_islands_the_island_levy:0 "The Island Levy"
 zin_shared_tritons_islands_the_island_levy_desc:0 "Every household sends one spear to the island muster, and the muster sends them to the beach to learn which end goes forward. By the end of the week there is a levy where there was a fishing fleet."
 zin_shared_tritons_islands_the_island_market:0 "The Island Market"
 zin_shared_tritons_islands_the_island_market_desc:0 "Boats put in from three islands on market day, and the quay becomes a bazaar of fish, rope, nets and gossip. A year's news is traded here for a week's wages."
 zin_shared_tritons_islands_the_islanders_oath:0 "The Islanders' Oath"
 zin_shared_tritons_islands_the_islanders_oath_desc:0 "Every household of [ROOT.GetName] swears on the hall's oar to share the catch in a bad season and to hold the shore in a bad year. Nobody has ever been seen to break it twice."
 zin_shared_tritons_islands_the_isle_council:0 "The Isle Council"
 zin_shared_tritons_islands_the_isle_council_desc:0 "The island's families set aside the elders' bench and elect a council from every quay. It meets in the open, argues in the open and records every vote on a slate by the door."
 zin_shared_tritons_islands_the_isle_keeps_apart:0 "The Isle Keeps Apart"
 zin_shared_tritons_islands_the_isle_keeps_apart_desc:0 "The island has seen kings and wars come and go and has no wish to be remembered for either. [ROOT.GetName] draws its boats up the beach, chains its harbour and declares itself a rock in the middle of the sea."
 zin_shared_tritons_islands_the_isle_squadron:0 "The Isle Fleet"
 zin_shared_tritons_islands_the_isle_squadron_desc:0 "Six hulls, one standard and a crew that has rowed together since boyhood: the fleet of [ROOT.GetName] is small, quick and not to be argued with in its own waters."
 zin_shared_tritons_islands_the_mainland_courts:0 "The Mainland Courts"
 zin_shared_tritons_islands_the_mainland_courts_desc:0 "Across the water the great courts of the mainland make laws, tariffs and wars. [ROOT.GetName] sends a letter to each to say that it is still here, and still has fish."
 zin_shared_tritons_islands_the_old_charts:0 "The Old Charts"
 zin_shared_tritons_islands_the_old_charts_desc:0 "The islanders charted the Pupor Ocean a thousand years ago and sold the charts to every crown that asked. The rolls are still kept in the hall, mildewed at the edges and worth more than the walls."
 zin_shared_tritons_islands_the_old_charts_tip_1:0 "Our forebears charted the Pupor Ocean and sold the charts to every crown."
 zin_shared_tritons_islands_the_old_freedoms:0 "The Old Freedoms of the Isle"
 zin_shared_tritons_islands_the_old_freedoms_desc:0 "The island's ancient rights are copied out and sent to the overlord with a courteous note. They are not disputed, and so the island keeps them."
 zin_shared_tritons_islands_the_open_assembly:0 "The Open Assembly"
 zin_shared_tritons_islands_the_open_assembly_desc:0 "Every islander who can walk to the quay can speak in the assembly, and many do. It is long, loud and wearying, and nobody can claim that he was not asked."
 zin_shared_tritons_islands_the_pupor_question:0 "The Pupor Question"
 zin_shared_tritons_islands_the_pupor_question_desc:0 "The Pupor Ocean is too wide for any island to keep clear, and its corsairs are too many for any island to ignore. The elders of [ROOT.GetName] must decide what their island is to the sea: a keeper of its lanes, a haven for its raiders, or neither."
 zin_shared_tritons_islands_the_pupor_question_tip_1:0 "Some islands keep the sea lanes. Some shelter those who prey on them."
 zin_shared_tritons_islands_the_quiet_isle:0 "The Quiet Isle"
 zin_shared_tritons_islands_the_quiet_isle_desc:0 "The Pupor Ocean boils with corsairs and charters, and the isle sits in the middle of it as quiet as an egg. Ships pass at a distance, sailors point and call it lucky, and the island lets them."
 zin_shared_tritons_islands_the_salt_pans:0 "The Salt Pans"
 zin_shared_tritons_islands_the_salt_pans_desc:0 "Shallow pans cut into the rock fill at the spring tide and are raked white in the summer sun. Salt is the one coin every coast accepts, and [ROOT.GetName] has plenty."
 zin_shared_tritons_islands_the_sea_watch:0 "The Sea Watch"
 zin_shared_tritons_islands_the_sea_watch_desc:0 "A stone tower on the highest rock holds a fire all night and a watcher all day. Ships that pass the island are noted in a ledger, and those that do not pass are noted more carefully."
 zin_shared_tritons_islands_the_southern_ship:0 "The Southern Ship"
 zin_shared_tritons_islands_the_southern_ship_desc:0 "Fishers on the outer rock tell of a long white ship that passed in the dusk, faster than any oar or wind they knew. Some say there were elves at her rail, and all agree that she did not stop."
 zin_shared_tritons_islands_the_southern_ship_tip_1:0 "Sailors speak of a fast ship from the south, with elves among its crew."
 zin_shared_tritons_islands_tribute_of_fish:0 "Tribute of Fish and Salt"
 zin_shared_tritons_islands_tribute_of_fish_desc:0 "Barrels of salted fish and sacks of salt go out on the tribute boat each autumn. The overlord's steward counts them, tastes one and writes down a number that is always a little higher than the count."
 zin_shared_tritons_islands_under_a_greater_flag:0 "Under a Greater Flag"
 zin_shared_tritons_islands_under_a_greater_flag_desc:0 "A great banner flies over [ROOT.GetName] now, and the hall's old oar is hung with a ribbon of a colour that is not the island's. The elders say the sea is patient, and the sea has been patient with greater flags than this."
 zin_shared_tritons_islands.1.a:0 "Hang them."
 zin_shared_tritons_islands.1.b:0 "Ransom them."
 zin_shared_tritons_islands.1.d:0 "Charter galleys have brought in a corsair crew, chained at the wrist and still arguing over whose fault it was. The island must judge them, and everybody on the quay has an opinion."
 zin_shared_tritons_islands.1.t:0 "A Pirate Trial in [ROOT.GetName]"
 zin_shared_tritons_islands.2.a:0 "Welcome them."
 zin_shared_tritons_islands.2.b:0 "Not now."
 zin_shared_tritons_islands.2.d:0 "[FROM.GetName] asks for a place among the chart houses that keep the sea lanes. Its envoys wait on the quay with a chart in one hand and an oath in the other."
 zin_shared_tritons_islands.2.t:0 "An Island Asks to Join the Pupor Charter"
 zin_shared_tritons_islands.3.a:0 "Accept the judgment."
 zin_shared_tritons_islands.3.b:0 "Refuse."
 zin_shared_tritons_islands.3.d:0 "The brokers of [FROM.GetName] offer to judge the Southern Banks, where the fishing boats of two islands have quarrelled over the same water for longer than anyone can say. They ask nothing for it but an answer."
 zin_shared_tritons_islands.3.t:0 "[FROM.GetName] Offers to Judge the Banks"
