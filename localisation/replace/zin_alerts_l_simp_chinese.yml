 LOW_SUPPLIES_TIPS:0 "These steps may help you set the matter right:\n - Spread your hosts out or move them elsewhere to lessen the local use of supply.\n\n - Improve the roads and make sure no high road bottleneck lies between the capital and the army.\n\n - If you have enough pack trains, you can give the depots of the region more of them, which raises their supply cap and reach.\n\nIf supply in the area comes by sea, you can also:\n - Raise the level of the harbours at both ends of the route.\n\n - Make sure you have enough merchant fleets.\n\n - Guard the merchant fleets along the route with the Guard mission. Deliveries slow when ships are sunk."
