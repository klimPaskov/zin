 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_ASKSTATECONTROL:0 "\n§Y$COUNTRY|U$§! has §Gaccepted§! our request to be given charge of a conquered land.\n\nThe land is now ours to rule."
