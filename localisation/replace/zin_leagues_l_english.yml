 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_DOCKING_RIGHTS:0 "\nOur request for harbour rights was §Gaccepted§! by §Y$COUNTRY$§!.\n\nOur ships may now lie in their harbours to take stores and mend."
