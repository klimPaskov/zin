l_english:
 adaptable:0 "Wayfarer"
 adaptable_desc:0 "§LHe is at home wherever his host has to lie that night.§!"
 aggressive_assaulter:0 "Spear-Lord"
 aggressive_assaulter_desc:0 "§LHe counts a day without a charge as a day wasted.§!"
 air_chief:0 "Master of the Eyries"
 ambusher:0 "Lie-in-Wait"
 ambusher_desc:0 "§LThe road he picks always has a ditch beside it, and a company in it.§!"
 arctic_water_expert:0 "Ice-Sea Hand"
 arctic_water_expert_desc:0 "§LHe sails among floes as if they were quays.§!"
 army_chief:0 "Master of the Host"
 battleship_adherent:0 "Friend of the Great Hulls"
 battleship_adherent_desc:0 "§LHe trusts the great hull above all, and little else at sea.§!"
 big_guns_expert:0 "Master of Great Hulls"
 big_guns_expert_desc:0 "§LHe has commanded nothing smaller than a great warship in thirty years.§!"
 blockade_runner:0 "Strait-Runner"
 blockade_runner_desc:0 "§LNo closed harbour has stopped him, and no chain was ever taut enough.§!"
 blue_water_expert:0 "Deep-Water Master"
 blue_water_expert_desc:0 "§LHe has crossed the open sea so often that land seems a nuisance.§!"
 bold:0 "Daring"
 bold_desc:0 "§LHe sails faster than he should, and hits harder than he ought.§!"
 branch_crypto:0 "The Reading Room"
 branch_defense:0 "Watch and Ward"
 branch_intelligence:0 "Informants"
 branch_operation:0 "Daring Work"
 branch_operative:0 "Schools of Whispers"
 brave:0 "Fearless"
 brave_desc:0 "§LHe is first through the gate, and his men follow because they must.§!"
 brilliant_strategist:0 "Far-Sighted"
 brilliant_strategist_desc:0 "§LHe sees three battles ahead, and has usually drawn the second one on a table.§!"
 career_officer:0 "Seasoned Captain"
 career_officer_desc:0 "§LHe has served in every garrison from the Wall to the coast, and rose one step at a time.§!"
 caustic_personality:0 "Sour Tongue"
 caustic_personality_desc:0 "§LHis captains sail slow to reach him, and arrive in worse humour.§!"
 cavalry_expert:0 "Master of Riders"
 cavalry_expert_desc:0 "§LHis riders hold a line as well as they break one.§!"
 cavalry_leader:0 "Rider-Lord"
 cavalry_leader_desc:0 "§LHe commands from the saddle and does not recognise a field too wide.§!"
 cavalry_officer:0 "Rider Captain"
 cavalry_officer_desc:0 "§LHe has ridden since he could stand, and counts distance in horses.§!"
 cc_leader:0 "Host-Captain"
 chief_engineer:0 "Shipwright-Captain"
 chief_engineer_desc:0 "§LHe started in the yard and still checks the planking.§!"
 COMMAND_POWER:0 "Orders"
 commando:0 "Night-Raider"
 commando_desc:0 "§LHis hosts march when others sleep and fight when others cannot see.§!"
 concealment_expert:0 "Master of Fog"
 concealment_expert_desc:0 "§LHe sails in the mist the others avoid, and finds the harbour first.§!"
 craven:0 "Faint-Hearted"
 craven_desc:0 "§LHe finds a reason to turn at the first sight of a larger fleet.§!"
 crisis_magician:0 "Hull-Saver"
 crisis_magician_desc:0 "§LA ship that should have sunk is still afloat, and her captain has his name.§!"
 cuts_corners:0 "Short-Cutter"
 cuts_corners_desc:0 "§LHe saves time on the rigging and ships take more damage for it.§!"
 defensive_doctrine:0 "Stand of the Host"
 defensive_doctrine_desc:0 "§LThe host digs first, and talks of marching afterward.§!"
 demoted:0 "Disgraced"
 demoted_desc:0 "Lowered in rank for some failure, and still smarting."
 desert_fox:0 "Sand-Runner"
 desert_fox_desc:0 "§LHe has crossed the dry lands more times than the guides.§!"
 disgruntled:0 "Sullen"
 disgruntled_desc:0 "Passed over for a post he thought his own. His heart is not in the work."
 DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0:0 "Captain of a Hundred"
 DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1:0 "Captain of a Hundred"
 DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2:0 "Banneret"
 DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3:0 "Banneret"
 DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4:0 "Warden of Hosts"
 DIVISION_EXPERIENCE_TITLE_DEFAULT:0 "Captain"
 engineer_officer:0 "Sapper Captain"
 engineer_officer_desc:0 "§LTrained among the wall-builders, he sees every field as a problem of stone and earth.§!"
 exiled_leader:0 "Captain in Exile"
 exiled_leader_desc:0 "A captain without a realm, who leads the hosts of his fallen house."
 expert_delegator:0 "Trusting Lord"
 expert_delegator_desc:0 "§LHe gives his captains their orders and then stays out of their way.§!"
 expert_improviser:0 "Improviser"
 expert_improviser_desc:0 "§LGive him rope, timber and a night, and he will give you a crossing.§!"
 fast_planner:0 "Swift Planner"
 fast_planner_desc:0 "§LThe plan is on the table before the messengers have unsaddled.§!"
 fleet_protector:0 "Fleet Guardian"
 fleet_protector_desc:0 "§LThe merchant fleets sleep easier when he is on the lane.§!"
 fm_leader:0 "Marshal"
 fortress_buster:0 "Siege-Breaker"
 fortress_buster_desc:0 "§LNo wall has held against him longer than the engines took to arrive.§!"
 gentlemanly:0 "Courteous Captain"
 gentlemanly_desc:0 "§LHe spares the defeated, and the defeated remember it.§!"
 green_water_expert:0 "Coast-Wise"
 green_water_expert_desc:0 "§LHe knows every shoal between here and the border.§!"
 ground_pounder:0 "Shore-Breaker"
 ground_pounder_desc:0 "§LHe lays the fleet close to shore and does not mind the answer.§!"
 guerilla_fighter:0 "Hedge-Fighter"
 guerilla_fighter_desc:0 "§LHe is behind a hedge before the enemy knows there was a road.§!"
 gunnery_expert:0 "Engine-Layer"
 gunnery_expert_desc:0 "§LHe drills his crews at the great arbalests until they can hit a gull.§!"
 harsh_leader:0 "Stern Master"
 harsh_leader_desc:0 "§LHis hosts are drilled until they hate him, and they win.§!"
 high_command:0 "Marshal of the Council"
 hill_fighter:0 "Hill-Fighter"
 hill_fighter_desc:0 "§LHe always wants the high ground, and generally gets it.§!"
 infantry_expert:0 "Master of Foot"
 infantry_expert_desc:0 "§LHe trains pikes and axes until the hedge moves like one animal.§!"
 infantry_leader:0 "Foot-Lord"
 infantry_leader_desc:0 "§LHe has grown old among the pike-hedges and knows how they hold.§!"
 infantry_officer:0 "Foot Captain"
 infantry_officer_desc:0 "§LBorn in the ranks, he thinks like a soldier on his own two feet.§!"
 inflexible_strategist:0 "Hard Planner"
 inflexible_strategist_desc:0 "§LOnce a plan is made he keeps it, and the road to change it is long.§!"
 inshore_fighter:0 "Fjord Fighter"
 inshore_fighter_desc:0 "§LHe fights between cliffs and knows each echo.§!"
 inspirational_leader:0 "Rallying Voice"
 inspirational_leader_desc:0 "§LWhen he rides down the line, even the dying sit up straighter.§!"
 invader_ii:0 "Master of Landings"
 invader_ii_desc:0 "§LHis landings take supper ashore the first night, and not a day later.§!"
 ironside:0 "Iron-Hull"
 ironside_desc:0 "§LThe great hulls take blows for him, and he takes none himself.§!"
 jungle_rat:0 "Jungle-Wise"
 jungle_rat_desc:0 "§LHe finds paths in the green gloom that the maps do not show.§!"
 logistics_wizard:0 "Master of Stores"
 logistics_wizard_desc:0 "§LThe sacks are never late, and never early; they arrive on the day he said.§!"
 lone_wolf:0 "Lone Raider"
 lone_wolf_desc:0 "§LHe sails with a few hulls and a long list of grudges.§!"
 marksman:0 "True Eye"
 marksman_desc:0 "§LEvery shot he orders seems to find a seam.§!"
 media_personality:0 "Beloved of the Singers"
 media_personality_desc:0 "§LThe taverns sing of him; the Council cannot easily replace so loved a man.§!"
 motivated:0 "Heartened"
 motivated_desc:0 "A recent victory has lifted him and his hosts."
 naval_invader:0 "Sea-Lander"
 naval_invader_desc:0 "§LHe has stepped out of more boats into more surf than any other captain.§!"
 naval_liason:0 "Friend of the Fleet"
 naval_liason_desc:0 "§LThe fleet is happy to lay its great engines at his orders.§!"
 naval_lineage:0 "Sea-Born"
 naval_lineage_desc:0 "§LHis father, grandfather and his father before him were sea-lords.§!"
 naval_rank1:0 "Sea-Captain"
 naval_rank2:0 "Sea-Warden"
 naval_rank3:0 "Admiral"
 naval_rank4:0 "Lord Admiral"
 navy_career_officer:0 "Lifelong Mariner"
 navy_career_officer_desc:0 "§LHe has served in every ship of the fleet and learned from each of them.§!"
 navy_chief:0 "Lord of the Fleet"
 navy_leader:0 "Sea-Lord"
 navy_media_personality:0 "Harbour Hero"
 navy_media_personality_desc:0 "§LThe quays cheer when he sails, and his crews fight for the cheer.§!"
 offensive_doctrine:0 "Drive of the Host"
 offensive_doctrine_desc:0 "§LThe host moves as one body and does not stop to ask why.§!"
 old_guard:0 "Greybeard"
 old_guard_desc:0 "§LHe has seen many seasons and fears few of them. He will not make trouble, and will not be hurried.§!"
 old_guard_navy:0 "Old Salt"
 old_guard_navy_desc:0 "§LHe commands as his master did, and sees no reason to learn a new knot.§!"
 OPERATION_TOKEN_INFILTRATED_AIRFORCE:0 "Place in the Roost"
 OPERATION_TOKEN_INFILTRATED_AIRFORCE_DESC:0 "Has a friend among this realm's dragon-keepers, and hears what is said in the roosts."
 OPERATION_TOKEN_INFILTRATED_ARMY:0 "Name on the Roll"
 OPERATION_TOKEN_INFILTRATED_ARMY_DESC:0 "Has a name on the muster rolls of this realm's host, and hears what is said in the ranks."
 OPERATION_TOKEN_INFILTRATED_CIVILIAN:0 "Seat in the Household"
 OPERATION_TOKEN_INFILTRATED_CIVILIAN_DESC:0 "Holds a seat in the household of this court, and hears what is said there."
 OPERATION_TOKEN_INFILTRATED_NAVY:0 "Berth Aboard"
 OPERATION_TOKEN_INFILTRATED_NAVY_DESC:0 "Holds a berth in this realm's fleet, and hears what is said on its decks."
 OPERATION_TOKEN_INFILTRATED_RESISTANCE_CONTACTS:0 "Hidden Friends"
 OPERATION_TOKEN_INFILTRATED_RESISTANCE_CONTACTS_DESC:0 "Has friends among the unwilling subjects of this realm, who will act when asked."
 operative_commando:0 "Knife-Hand"
 operative_commando_desc:0 "Skilled in quiet violence. Fewer eyes on the agent, and cleaner thefts of ciphers."
 operative_demolition_expert:0 "Fire-Setter"
 operative_demolition_expert_desc:0 "Knows which beam to burn and which to leave."
 operative_double_agent:0 "Turncoat"
 operative_double_agent_desc:0 "Serves two lords, and tells each only what the other would tell him."
 operative_escape_artist:0 "Slips the Chains"
 operative_escape_artist_desc:0 "Won by an agent who has walked out of a locked cell."
 operative_infiltrator:0 "Gate-Walker"
 operative_infiltrator_desc:0 "Gets into households, muster rolls and ships without being asked who he is."
 operative_linguist:0 "Many Tongues"
 operative_linguist_desc:0 "Speaks as a native in every court he serves in."
 operative_master_interrogator:0 "Questioner"
 operative_master_interrogator_desc:0 "Draws the truth out of captured agents, patiently and without noise."
 OPERATIVE_MISSION_BOOST_IDEOLOGY_ACTION:0 "Raising a faction"
 OPERATIVE_MISSION_BOOST_IDEOLOGY_TITLE:0 "Raise a Faction"
 OPERATIVE_MISSION_BUILD_INTEL_NETWORK_ACTION:0 "Weaving a web of informants"
 OPERATIVE_MISSION_BUILD_INTEL_NETWORK_TITLE:0 "Weave a Web of Informants"
 OPERATIVE_MISSION_CONTROL_TRADE_ACTION:0 "Holding the purse"
 OPERATIVE_MISSION_CONTROL_TRADE_TITLE:0 "Hold the Purse"
 OPERATIVE_MISSION_COUNTER_INTELLIGENCE_ACTION:0 "Guarding the court against strangers"
 OPERATIVE_MISSION_COUNTER_INTELLIGENCE_TITLE:0 "Guard the Court"
 OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_ACTION:0 "Pressing the envoys"
 OPERATIVE_MISSION_DIPLOMATIC_PRESSURE_TITLE:0 "Press the Envoys"
 OPERATIVE_MISSION_PROPAGANDA_ACTION:0 "Spreading a tale"
 OPERATIVE_MISSION_PROPAGANDA_TITLE:0 "Spread a Tale"
 OPERATIVE_MISSION_QUIET_INTEL_NETWORK_ACTION:0 "Letting a web of informants sleep"
 OPERATIVE_MISSION_QUIET_INTEL_NETWORK_TITLE:0 "Let the Web Sleep"
 OPERATIVE_MISSION_ROOT_OUT_RESISTANCE_ACTION:0 "Rooting out the hidden"
 OPERATIVE_MISSION_ROOT_OUT_RESISTANCE_TITLE:0 "Root Out the Hidden"
 operative_natural_orator:0 "Pulpit Voice"
 operative_natural_orator_desc:0 "Draws a crowd in any market, and sends it home with a new opinion."
 operative_safe_cracker:0 "Lock-Wise"
 operative_safe_cracker_desc:0 "No chest, plan-case or cipher-book stays shut for long."
 operative_seducer:0 "Honeyed Tongue"
 operative_seducer_desc:0 "Few doors stay closed to a fair word and a fair face."
 operative_skill_1:0 "Runner"
 operative_skill_2:0 "Courier"
 operative_skill_3:0 "Whisperer"
 operative_skill_4:0 "Shadow"
 operative_skill_5:0 "Master of Whispers"
 operative_tough:0 "Hard to Break"
 operative_tough_desc:0 "The questioner's patience will run out before this agent's silence does."
 operative_well_groomed:0 "Courtier's Grace"
 operative_well_groomed_desc:0 "Sits at the lord's table and is soon asked for his opinion on the price of grain."
 organisational_leader:0 "Master of Banners"
 organisational_leader_desc:0 "§LEvery company knows where to find its banner, and the rolls are never wrong.§!"
 organizer:0 "Council Hand"
 organizer_desc:0 "§LHe works from the plan the Council sent and keeps it clean.§!"
 politically_connected:0 "Court Favourite"
 politically_connected_desc:0 "§LHis uncle sits near the throne, and he is promoted before he is proven.§!"
 raid_category_fluff_text_zin_night_raids:0 "§LA few fast riders and a lantern.§!"
 raid_category_header_zin_night_raids:0 "Night Raids"
 raid_category_zin_night_raids:0 "Night Raid"
 raid_type_zin_raid_depot_night:0 "Burn the Depot"
 raid_type_zin_raid_depot_night_desc:0 "A band falls on a depot of the enemy and burns the stores before the guard can wake."
 raid_type_zin_raid_granary_fire:0 "Fire the Granary"
 raid_type_zin_raid_granary_fire_desc:0 "A band finds the enemy's granary on the edge of a town and sets it alight."
 raid_type_zin_raid_ransom_captain:0 "Ransom a Captain by Night"
 raid_type_zin_raid_ransom_captain_captive_line:0 "§Y$NAME$§! is held captive here."
 raid_type_zin_raid_ransom_captain_desc:0 "A band slips into the hold where an enemy keeps one of our captains and brings him out by night."
 ranger:0 "Woodsman"
 ranger_desc:0 "§LThe forest hides his hosts and gives them up only when he chooses.§!"
 rank1:0 "Banneret"
 rank2:0 "Warden of Hosts"
 rank3:0 "Captain-General"
 rank4:0 "Marshal of the Crown"
 reassigned:0 "Newly Posted"
 reassigned_desc:0 "Just given a new command; he does not yet know his captains."
 recently_promoted:0 "Newly Raised"
 recently_promoted_desc:0 "A new rank sits awkwardly for the first season."
 safety_first:0 "Careful Sea-Lord"
 safety_first_desc:0 "§LHe brings every hull home and thinks that the best victory.§!"
 scavenger:0 "Battlefield Gleaner"
 scavenger_desc:0 "§LNothing is left on a field after his host has passed.§!"
 search_pattern_expert:0 "Sweep-Master"
 search_pattern_expert_desc:0 "§LHis ships fan out like fingers, and the sea gives up what it hides.§!"
 sick:0 "Ailing"
 sick_desc:0 "A fever has laid him low. He cannot command at full strength until it breaks."
 skilled_staffer:0 "Staff Master"
 skilled_staffer_desc:0 "§LGive him a hundred hosts and he will find the road for each.§!"
 skirmisher:0 "Harrier"
 skirmisher_desc:0 "§LHe pricks the enemy line a hundred times and never gives it a target.§!"
 smoke_screen_expert:0 "Fog-Bank Master"
 smoke_screen_expert_desc:0 "§LWhen the day goes ill, he is gone into the grey.§!"
 specialization_air:0 "Sky Rites"
 specialization_land:0 "War Rites"
 specialization_naval:0 "Tide Rites"
 specialization_nuclear:0 "Deep Rites"
 spotter:0 "Lookout"
 spotter_desc:0 "§LHe sees sails at the edge of the world and knows whose they are.§!"
 superior_tactician:0 "Master Tactician"
 superior_tactician_desc:0 "§LHe stands the fleet where the wind and the sun are his.§!"
 swamp_fox:0 "Fen-Runner"
 swamp_fox_desc:0 "§LThe marsh is his road; he knows where it holds.§!"
 theorist:0 "Master of Lore"
 thorough_planner:0 "Patient Planner"
 thorough_planner_desc:0 "§LHe will spend a winter on a plan, and the plan will not fail.§!"
 tooltip_raid_category_zin_night_raids:0 "§HNight raids§!\nSmall bands slip behind the enemy's line in the dark, to burn what he stores, free those he holds and be gone by dawn."
 trait_cautious:0 "Careful"
 trait_cautious_desc:0 "§LHe counts his men before and after, and prefers the count to be the same.§!"
 trait_engineer:0 "Wall-Breaker"
 trait_engineer_desc:0 "§LTo him a river is a ditch with an opinion, and a wall is a delay.§!"
 trait_mountaineer:0 "Mountain-Walker"
 trait_mountaineer_desc:0 "§LHe climbs where goats fear to go, and expects his host to follow.§!"
 trait_reckless:0 "Headlong"
 trait_reckless_desc:0 "§LHe has never waited for the second rank, and has the scars to prove it.§!"
 trickster:0 "Cunning"
 trickster_desc:0 "§LHe is never where the enemy looks, and always where they have not.§!"
 unyielding_defender:0 "Unyielding Warden"
 unyielding_defender_desc:0 "§LHe has never been moved from a post he chose to hold.§!"
 upgrade_airforce_department:0 "Eyrie Informants"
 upgrade_airforce_department_desc:0 "§LDragon-keepers and stable-hands tell us how many wings fly, and how well they are fed.§!"
 upgrade_anti_partisan:0 "Root Out the Hidden"
 upgrade_anti_partisan_desc:0 "§LTrusted men learn to find those who plot in barns and cellars, and bring them to the magistrate.§!"
 upgrade_army_department:0 "Barracks Informants"
 upgrade_army_department_desc:0 "§LSutlers and armourers carry word of musters, marches and the mood of the ranks.§!"
 upgrade_blueprint_stealing:0 "Copyists' Bribes"
 upgrade_blueprint_stealing_desc:0 "§LA purse in the right hand opens a guild's plan-chests for a single night.§!"
 upgrade_commando_training:0 "Knife-School"
 upgrade_commando_training_desc:0 "§LA few agents are taught to fight as hard as they hide.§!"
 upgrade_crypto_strength:0 "The School of Seals"
 upgrade_crypto_strength_2:0 "Learned Seals"
 upgrade_crypto_strength_2_desc:0 "§LScholars design seals no clerk could copy by eye, and a cipher that changes with the season.§!"
 upgrade_crypto_strength_desc:0 "§LCouriers are taught new knots, new wax and new words, so that stolen letters are harder to read.§!"
 upgrade_decryption_boost:0 "Cipher Wheels in Hand"
 upgrade_decryption_boost_2:0 "Learned Tables"
 upgrade_decryption_boost_2_desc:0 "§LScholars of the great schools compile every frequency of every tongue, and the Reading Room grows quicker.§!"
 upgrade_decryption_boost_desc:0 "§LBrass wheels and ruled tables turn a night of guessing into an afternoon of reading.§!"
 upgrade_diplo_training:0 "The Envoy's Tongue"
 upgrade_diplo_training_desc:0 "§LAgents are taught to haggle over tolls, press envoys and win a quarrel with a smile.§!"
 upgrade_economy_civilian:0 "Market Informants"
 upgrade_economy_civilian_desc:0 "§LStall-keepers, carters and counting-house clerks tell us what the rival court buys, sells and owes.§!"
 upgrade_form_department:0 "Found the Reading Room"
 upgrade_form_department_desc:0 "§LA locked room under the chancery where seals are copied, wheels are turned and letters are read. Unlocks reading, and gives a first seal.§!"
 upgrade_interrogation_techniques:0 "The Questioners"
 upgrade_interrogation_techniques_desc:0 "§LPatient men learn to draw more from captured agents, and to do it quietly.§!"
 upgrade_invisible_ink:0 "Secret Writing"
 upgrade_invisible_ink_desc:0 "§LLetters in lemon-juice and wax-blind scripts carry more word home, and are safer to carry.§!"
 upgrade_naval_department:0 "Harbour Informants"
 upgrade_naval_department_desc:0 "§LPilots and quay-hands tell us which hulls sail, and with what cargo.§!"
 upgrade_passive_defense:0 "Watchful Households"
 upgrade_passive_defense_desc:0 "§LEvery steward, porter and cook is taught to remember strangers. Hostile deeds against the realm cost more to carry out.§!"
 upgrade_plastic_explosives:0 "Fire-Pots and Pitch"
 upgrade_plastic_explosives_desc:0 "§LAgents learn which barrel burns slow and which burns fast, and where to leave each.§!"
 upgrade_portable_radios:0 "Rider Relays"
 upgrade_portable_radios_desc:0 "§LA chain of fast riders and beacon keepers lets agents in the field strike together on a single signal.§!"
 upgrade_psycho_warfare:0 "Whisper Campaigns"
 upgrade_psycho_warfare_desc:0 "§LTales told in the right tavern at the right hour move factions faster than any edict.§!"
 upgrade_suicide_pills:0 "Hidden Poison"
 upgrade_suicide_pills_desc:0 "§LA vial sewn into a hem. A captured agent can end the questioning, and the questioners know it.§!"
 upgrade_training_centers:0 "Courtier Schools"
 upgrade_training_centers_desc:0 "§LA house in the capital where young folk learn manners, languages and the weight of a rumour. A further agent can be trained at a time.§!"
 urban_assault_specialist:0 "Wall-Stormer"
 urban_assault_specialist_desc:0 "§LWalled towns are the work he knows best, and the slowest.§!"
 war_hero:0 "Hero of the Songs"
 war_hero_desc:0 "§LThe singers have given him a name, and now every lord wants him at his table.§!"
 winter_expert:0 "Frost-Walker"
 winter_expert_desc:0 "§LThe cold does not slow his host; it slows only the enemy's.§!"
 winter_specialist:0 "Winter-Born"
 winter_specialist_desc:0 "§LHe grew up under snow and moves as easily over it as other men on a road.§!"
 wounded:0 "Hurt"
 wounded_desc:0 "Hurt in the field. He still gives orders, but cannot ride or call the abilities of the camp."
