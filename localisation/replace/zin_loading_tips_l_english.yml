l_english:
 LOADING_TIP_0:0 "A crown is gold on the outside and work on the inside. Most kings only look at the outside.\n- Saying of the Middle Lands"
 LOADING_TIP_1:0 "Parim was built on the Great Lake so that no king could forget where the grain comes from.\n- Proverb of the lake-country"
 LOADING_TIP_2:0 "Plough the old fields deep. The wizard pulled up what the Necromancer sowed there, but the earth remembers.\n- Ploughmen's saying, Middle Lands"
 LOADING_TIP_3:0 "The Charters call the dominions partners of the crown. Partners are asked. Subjects are told.\n- Saying of the Concord dominions"
 LOADING_TIP_4:0 "Buy a judgeship in Highsun, sell it again at Harvest. At the Golden Court even justice has a season.\n- Jest of the Parim markets"
 LOADING_TIP_5:0 "More than a thousand years without a war worth the name. Every veteran in Parim is made of bronze.\n- Tavern saying of Parim"
 LOADING_TIP_6:0 "Aen had hundreds of sons. That is why every lord in the Middle Lands can prove he is royal, and none can prove he is king.\n- Saying of the heralds of Parim"
 LOADING_TIP_7:0 "Selen gave Aenor a king when Aenor had none. Selen has not let Aenor forget it.\n- Saying of the Middle Lands"
 LOADING_TIP_8:0 "The giants of Hiloron do not hurry. The hills they stand on have not hurried either.\n- Saying of Hiloron's neighbours"
 LOADING_TIP_9:0 "Never ask an ent the way. You will arrive, but your grandchildren will be there to greet you.\n- Saying of the Kilinti woodcutters"
 LOADING_TIP_10:0 "A rider of Hunhun owns three things: his horse, his word and the sky above the steppe.\n- Horse-lords' saying, Hunhun"
 LOADING_TIP_11:0 "Asgard was the first harbour Aenor's ships ever found, and Asgard's houses have charged harbour dues ever since.\n- Saying of Aenor Isle"
 LOADING_TIP_12:0 "The Wall keeps the elves on their side, the customs men on ours, and the dragons, we are told, far away.\n- Gate-wardens' jest at Kingson"
 LOADING_TIP_13:0 "Behind the Wall the elves count in centuries. In front of it the customs men count in coins.\n- Saying of Kingson"
 LOADING_TIP_14:0 "Herez faces south so that Parim can go on facing its mirrors.\n- Marcher saying of Herez"
 LOADING_TIP_15:0 "A full grain store is a sermon nobody argues with.\n- Saying of the Houses of the First Light"
 LOADING_TIP_16:0 "Men lived for thousands of years before Aen. He was not the first of men. He was the first of his name.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_17:0 "For centuries the kingdoms of men fought over whether there should be one crown. Aen answered the question.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_18:0 "The western shores were not empty when Aenor's ships arrived. That is the whole quarrel, and it has lasted four ages.\n- A western reading of the Chronicle"
 LOADING_TIP_19:0 "The Dead Lands guarded themselves. Storms turned back the ships, and the heat turned back the men who landed.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_20:0 "When the capital fell to Volgan, its archives burned with it. The kingdom lost its memory before it lost its walls.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_21:0 "Men, elves, dwarves, giants and spirits stood in one alliance. It happened once. The chroniclers still argue about why it worked.\n- The Chronicle of Erdae: the Grand Alliance"
 LOADING_TIP_22:0 "Dardan cost millions of lives and left a wasteland. The victory was real. So was the price.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_23:0 "The spirits did not destroy Volgan. They stripped his strength and cast him into the Void. A banishment is a door, and doors open.\n- A commentary on the Chronicle"
 LOADING_TIP_24:0 "King Edran won the war and lost the peace. He would not stop at Dardan, and the elves paid for it in the Dead Lands.\n- The Chronicle of Erdae: the First Age"
 LOADING_TIP_25:0 "They called the Second Age the Long Grief. Yet its farmers learned to keep seed, its healers to end plagues, its builders to raise walls that held.\n- The Chronicle of Erdae: the Second Age"
 LOADING_TIP_26:0 "King Edran, greatest of kings since Aen, died of a sickness no sword could reach.\n- The Chronicle of Erdae: the Second Age"
 LOADING_TIP_27:0 "When the Necromancer came, the elves did not. Men called it betrayal. The elves called it memory.\n- The Chronicle of Erdae: the Second Age"
 LOADING_TIP_28:0 "Elzon raised the dead who fell fighting him. Every lost battle cost Aenor twice.\n- The Chronicle of Erdae: the Second Age"
 LOADING_TIP_29:0 "In the two thousand one hundred and thirty-third year of the Second Age, Elzon took Aenor. So began the Third Age.\n- The Chronicle of Erdae: the Second Age"
 LOADING_TIP_30:0 "The Necromancer's dead faded, and Aenor's earth would not feed his magic. He ruled for twelve centuries on borrowed strength.\n- The Chronicle of Erdae: the Third Age"
 LOADING_TIP_31:0 "Elzon did not fade, and he did not sleep. He died, wholly and for good.\n- The Chronicle of Erdae: the Third Age"
 LOADING_TIP_32:0 "When the Necromancer fell, the Deliverer stood between the people and the ruin. That day the temples were full, and they have been full since.\n- The Chronicle of Erdae: the Fourth Age"
 LOADING_TIP_33:0 "Harion of Selen took up a crown that had waited twelve hundred years, and found that it still fitted a good man.\n- The Annals of Parim"
 LOADING_TIP_34:0 "4A 96. The elves and the crown agreed to keep the Necromancer's wall. The elves wanted their old distance. The kings wanted the tolls.\n- The Annals of Parim"
 LOADING_TIP_35:0 "4A 1000. Parim feasted a thousand years of peace. Envoys came from every coast, and nobody brought a sword.\n- The Annals of Parim"
 LOADING_TIP_36:0 "4A 1736. An envoy of Mirolon warned the court that the Dead Lands were arming. The court laughed. The annalist did not record the joke.\n- The Annals of Parim"
 LOADING_TIP_37:0 "4A 1744. Fishermen speak of black ships among the islands of the Ocean of Zol. Entered here as a curiosity.\n- The Harbour Rolls of Sonargur"
 LOADING_TIP_38:0 "4A 1745. Gunwaith and Girdon sign the Truce of the Grey Ford. The West is quiet. The scribes do not trust it.\n- The Annals of Gunwaith"
 LOADING_TIP_39:0 "If the walls cannot be saved, save the books. A kingdom can be rebuilt from its memory.\n- Arelon, Keeper of the Last Seal"
 LOADING_TIP_40:0 "One crown, so that no more crowns need be buried.\n- Words the heralds give to Aen, First of His Name"
 LOADING_TIP_41:0 "Let every banner keep its own colour. We march together; we do not march as one.\n- King Edran to the Grand Alliance"
 LOADING_TIP_42:0 "Taryn of Gunwaith would not march for Aenor until Aenor wrote down that she was not its subject. Then she marched to Dardan and did not stop.\n- Song of Taryn's banner, Gunwaith"
 LOADING_TIP_43:0 "Senra's ships carried bread to Dardan when no road could. The islands fed the Grand Alliance and sent the bill afterwards.\n- Island song of Senra"
 LOADING_TIP_44:0 "A healer does not ask which banner a wound was made under.\n- Tavriel of the Magical Forest"
 LOADING_TIP_45:0 "The dead are not wicked. They are only tired, and someone will not let them rest.\n- Varner, as the elves remember him"
 LOADING_TIP_46:0 "A kingdom is restored by its grain stores before it is restored by its crowns.\n- Harion the Restorer, in the Annals of Parim"
 LOADING_TIP_47:0 "I remember the War of Men. I remember Dardan. Forgive me if I do not hurry to remember your war.\n- King Lorien of Gala"
 LOADING_TIP_48:0 "Do not frighten your people with prophecy. Frightened people make prophecies come true.\n- King Lorien of Gala"
 LOADING_TIP_49:0 "Gold does not rust. Neither, I am pleased to say, do I.\n- The Golden King"
 LOADING_TIP_50:0 "The Lost Cause shall guard Erdae against the powers of the dark. See that the triumph is painted in gold.\n- The Golden King, founding the Lost Cause, 4A 1741"
 LOADING_TIP_51:0 "The seals of the kingdom are heavy. I carry them so that the King need not.\n- Chancellor Merovan"
 LOADING_TIP_52:0 "Everything at court has a price. I am only the one man honest enough to write it down.\n- Lord Treasurer Halmor Infous"
 LOADING_TIP_53:0 "An army is not a parade that happens to carry swords.\n- Marshal Corwen Hornan of Aenor"
 LOADING_TIP_54:0 "The court branch of the Lost Cause wears the badge. The frontier companies earn it.\n- Lord-Commander Tarec Belurith"
 LOADING_TIP_55:0 "Every great house in Parim descends from Aen. I have checked. I have also checked what they paid the heralds.\n- Master Ilsabet Vothrim, University of Parim"
 LOADING_TIP_56:0 "In Selen we teach children two things: how to read tracks, and how to keep quiet about what they read.\n- Alleria of Selen"
 LOADING_TIP_57:0 "Selen loves the crown the way the forest loves the road. It lets it through.\n- First Warden Daeric Svenlor of Selen"
 LOADING_TIP_58:0 "Hurry is a thing that happens to men.\n- Eldest Gronnar of Kilinti"
 LOADING_TIP_59:0 "The temples ask for nothing but your trust. Trust is the only tithe that grows.\n- Ilvane, High Confessor of the Deliverer"
 LOADING_TIP_60:0 "Zilin has three valleys, no army and the busiest roads in Erdae.\n- Abbot-Steward Lozan Heron of the Worshipdom"
 LOADING_TIP_61:0 "The houses have debated the matter for forty years. We are nearly ready to begin.\n- First Speaker Lusiel Velakorin of the Magical Forest"
 LOADING_TIP_62:0 "A dragon is not a weapon. It is a neighbour who has agreed, for now, to be polite.\n- Perlan, Warden of the Dragon Roosts"
 LOADING_TIP_63:0 "We did not refuse Aenor. We refused King Edran, a little late and for a very long time.\n- Loremaster Aenwe Lozari of the Magical Forest"
 LOADING_TIP_64:0 "We were not humiliated in Parim in 4A 1716. We were taught the price of a toll. We have been studying it since.\n- King Ferlin III of Lerendor and Lerenwaith"
 LOADING_TIP_65:0 "A queen of the Cold Lands rules ice, wind and men, in that order of obedience.\n- Queen Vaestia of Coldor"
 LOADING_TIP_66:0 "I signed the truce at the Grey Ford with my left hand. My right was on my sword, out of habit.\n- King Herlic of Gunwaith"
 LOADING_TIP_67:0 "The law of Gunwaith binds the king as it binds the shepherd. The shepherd finds this more comforting than the king does.\n- Lawspeaker Ilurda of Gunwaith"
 LOADING_TIP_68:0 "A truce is only a war that has decided to rest.\n- Thane Datid Werlen of Gunwaith"
 LOADING_TIP_69:0 "A caravan is a kingdom that moves. Mine simply moves faster than Stabilo's.\n- King Esiurth II of Noris"
 LOADING_TIP_70:0 "Noris owns the desert. We own the people who must cross it.\n- Prince Cereos of Postondoroth"
 LOADING_TIP_71:0 "A warking who cannot win a fight cannot keep a crown. A warking who must fight every day has already lost it.\n- Warking Gorduth of Cocanoor"
 LOADING_TIP_72:0 "Mirolon does not ask the north to love us. Only to look south once a year.\n- First Warden Aldis Veleran of Mirolon"
 LOADING_TIP_73:0 "I told the court in Parim that the Dead Lands were arming. They laughed so hard the King spilt his wine. I hope it stained.\n- Envoy Hessa Mencnor of Mirolon"
 LOADING_TIP_74:0 "Watch the dust on the southern road. Dust does not lie, and it does not laugh at you in Parim.\n- Captain Bennar of the Passes"
 LOADING_TIP_75:0 "He stood between us and the ruin when the Necromancer fell. Ask nothing more of a god.\n- The Litany of the Deliverer"
 LOADING_TIP_76:0 "Deliverance for the fallen, protection for the faithful, renewal for the land.\n- The threefold blessing of the temples"
 LOADING_TIP_77:0 "The Houses of the First Light keep three books: the grain, the sick and the born. A kingdom written down is a kingdom cared for.\n- Rule of the Houses of the First Light"
 LOADING_TIP_78:0 "Come to Zilin with empty hands. You will leave with a blessing and a letter for a friend in your own city.\n- Pilgrims' saying of the Zilin Hills"
 LOADING_TIP_79:0 "Every court in Erdae has a friend of the temples. That is why the roads are so safe.\n- Merchants' saying of the East Lands"
 LOADING_TIP_80:0 "Pray to the Deliverer for rain and he sends rain. Pray to him for wisdom and he sends a priest.\n- Peasants' jest of the Middle Lands"
 LOADING_TIP_81:0 "A god who heals the sick asks only gratitude. Gratitude is cheap. Pay it gladly.\n- Teaching of the Faithful, as preached in Parim"
 LOADING_TIP_82:0 "Old scrolls speak of Seven who made the gods. Old scrolls also speak of fish that sing to sailors.\n- Lecture-room jest, University of Parim"
 LOADING_TIP_83:0 "The Old Gods are dead, says one priest. Asleep, says another. The fishermen of the north say nothing, and do not sail at night.\n- Saying of the North Lands coasts"
 LOADING_TIP_84:0 "Only one Old God dwells in Erdae, and he cannot walk in it. That is the best news the north has ever had.\n- Saying of the northern shores"
 LOADING_TIP_85:0 "Great Spirit or god, what does it matter to the village it burns? The priests can argue over the ashes.\n- Saying of the Mirolon passes"
 LOADING_TIP_86:0 "The New Gods are young, the proverb says. Young as the mountains are young.\n- Saying of the Magical Lands"
 LOADING_TIP_87:0 "There are spirits under the mountains that have never seen the sun. Miners who dig too deep come back quiet, or not at all.\n- Miners' saying of the Dark Lands"
 LOADING_TIP_88:0 "Spirits come in two ranks, the scholars say: Great and Lesser. The farmer whose barn is burning does not ask which.\n- Lecture-room jest, University of Selen"
 LOADING_TIP_89:0 "Whatever you met in the forest, do not call it a god. It may agree with you.\n- Saying of the Magical Lands frontier"
 LOADING_TIP_90:0 "Zol was old before Aen was born. His land was black before anyone thought to give it a name.\n- Saying of the northern shores"
 LOADING_TIP_91:0 "We hold elections in the Magical Forest because no elf alive is old enough to be trusted alone.\n- Saying of the houses of the Magical Forest"
 LOADING_TIP_92:0 "Men ask why we keep the Wall. We kept our distance long before there was a wall. The stones only made it visible.\n- An elder of the Magical Forest"
 LOADING_TIP_93:0 "Herrodon and Andos Enda have quarrelled for so long that their grudges have grandchildren.\n- Saying of Nolorim"
 LOADING_TIP_94:0 "Nolorim keeps the high passes. Nobody remembers asking Nolorim to. Nobody remembers Nolorim asking.\n- Saying of the Magical Lands"
 LOADING_TIP_95:0 "Only the elves can call the dragons of Dragon Mountain. Men have tried. Men have stopped trying.\n- Saying of the gate-wardens of Kingson"
 LOADING_TIP_96:0 "The elves were never conquered, not even by the Necromancer. They mention it rarely, and never by accident.\n- Saying of Aenoran envoys"
 LOADING_TIP_97:0 "The wizard and his small purple servant walked our roads in the worst of the Third Age. Where the wizard went, the dead lay down.\n- Elven tale of Varner and Golbran"
 LOADING_TIP_98:0 "Varner never asked to be thanked. So the elves thank him every spring, loudly, in case he is listening.\n- Custom of the Magical Forest"
 LOADING_TIP_99:0 "The mycids of the Mushroom Forest are older than your kingdom and considerably more polite.\n- Elven saying"
 LOADING_TIP_100:0 "Two crowns, one kingdom, one fleet. Lerendor married Lerenwaith, and the strait has paid the dowry ever since.\n- Saying of Sonargur"
 LOADING_TIP_101:0 "The Treaty of the Narrow Strait is an old promise. Parim keeps the promise. Sonargur keeps the strait.\n- Saying of the Leren court"
 LOADING_TIP_102:0 "Sensai answers to no crown, and sells timber to all of them.\n- Saying of Sensai"
 LOADING_TIP_103:0 "Molot and R'en sit between two masters of the strait. Small crowns learn to smile in both directions.\n- Saying of the North Lands"
 LOADING_TIP_104:0 "Never run the narrow strait without paying the dues. The Leren fleet does not argue. It collects.\n- Sailors' saying, Sea of R'en"
 LOADING_TIP_105:0 "In the Cold Lands a guest is fed first and questioned in spring.\n- Hospitality law of the Cold Lands tribes"
 LOADING_TIP_106:0 "Coldor has one crown for the whole frozen interior. Isengard has one answer to it: no.\n- Saying of Fandanar"
 LOADING_TIP_107:0 "Winter is the only king every tribe of the Cold Lands obeys.\n- Saying of the Cold Lands"
 LOADING_TIP_108:0 "There is a castle in the far north where nobody goes. On clear nights a green light burns in it. Turn your sledge around.\n- Traders' tale of Mp'E"
 LOADING_TIP_109:0 "The yeti will trade you furs for salt, and directions for silence. Take the directions.\n- Saying of the ice road"
 LOADING_TIP_110:0 "The ice-giants of Titanos remember every winter. That is why they are so seldom cheerful.\n- Saying of the Cold Lands coast"
 LOADING_TIP_111:0 "The Cold Lands run off the edge of every map. Mapmakers are honest men. They simply stop drawing.\n- Saying of Coldor's ports"
 LOADING_TIP_112:0 "Aenor calls it discovery. We call it what happened to our grandfathers' grandfathers.\n- Saying of the Gunwaith clans"
 LOADING_TIP_113:0 "The sea between us and Aenor is wide. That is the only reason we are still friends.\n- Saying of the harbours of Kradlon"
 LOADING_TIP_114:0 "Fifty years of war and one truce at the Grey Ford. In the West we call that a short quarrel.\n- Saying of the Girdon wardens"
 LOADING_TIP_115:0 "A clan forgives a debt, a feud and a bad harvest. A clan does not forgive a tariff.\n- Saying of the Corogon traders"
 LOADING_TIP_116:0 "The Buldor companies will fight for anyone. They will not fight for free.\n- Saying of the West Lands"
 LOADING_TIP_117:0 "The Pupor Ocean has no king. Every captain who tried to be one is now part of the reef.\n- Saying of Triton's Islands"
 LOADING_TIP_118:0 "We charted the Pupor Ocean and sold the charts to every crown. Each crown believes it bought the only copy.\n- Chart-makers' saying of Adel"
 LOADING_TIP_119:0 "When the tales of men grow too old for any man to explain, carry them to Gala.\n- Saying of the Islands of the South"
 LOADING_TIP_120:0 "At the tide shrine the priests sing a name they do not understand. They sing it carefully, in case it understands them.\n- Saying of the Islands of the South"
 LOADING_TIP_121:0 "Do not cross the reef of voices at night. The voices know your name. You do not know theirs.\n- Fisherfolk's saying, Islands of the South"
 LOADING_TIP_122:0 "A stranger who lands on our beach is fed. A stranger who lands twice is family.\n- Hospitality saying of Howan"
 LOADING_TIP_123:0 "The Sunhot elves stand over three metres tall and have never once needed to raise their voices.\n- Saying of the Goodin Sunfolk"
 LOADING_TIP_124:0 "The strongest people in Erdae are also the most peaceful. The philosophers find this inconvenient.\n- Lecture-room jest, University of Selen"
 LOADING_TIP_125:0 "The Gala host marched to Dardan for a king it barely knew. Gala does not regret Dardan. It regrets what came after.\n- Saying of the court of Gala"
 LOADING_TIP_126:0 "The Lands of Light lead the Sunhot realms by never once giving an order.\n- Saying of the Sea of Gods"
 LOADING_TIP_127:0 "The white ships of Hengyang have long memories and short patience with pirates.\n- Saying of Hengyang's Tide-Speakers"
 LOADING_TIP_128:0 "Goldoroth was many holds and many chiefs. Now it is one hold, one chief and many graves.\n- Saying of Cocanoor"
 LOADING_TIP_129:0 "Dondor has held the line against Goldoroth for three hundred years. In Notbuton they call it a pastime.\n- Saying of Notbuton"
 LOADING_TIP_130:0 "Bordon, Dreson and Dulundur answer to nobody. They have done it so long that nobody bothers to ask any more.\n- Saying of the Dark Lands"
 LOADING_TIP_131:0 "In the Troll Forest the trees are old and the trolls are older. Neither cares for visitors.\n- Saying of the Dark Lands"
 LOADING_TIP_132:0 "The fire-speakers read the smoke above Cocanoor. When the smoke drifts south, they stop talking.\n- Saying of the Volcano Clans"
 LOADING_TIP_133:0 "Strangers from the south bring good iron and better promises. Take the iron.\n- Saying of the free holds"
 LOADING_TIP_134:0 "Volgan has been quiet longer than Aenor has had kings. Quiet is not the same as gone.\n- Saying of the watch of Mirolon"
 LOADING_TIP_135:0 "Mirolon was the first kingdom Volgan took. It means to be the last he ever tries to take.\n- Saying of the passes"
 LOADING_TIP_136:0 "The kingdoms of men always divide. I have only to wait.\n- Words that Mirolon's old songs give to Volgan"
 LOADING_TIP_137:0 "No ship has seen what lies behind the storms of the Dead Lands. The ships that might have are on the sea floor.\n- Saying of the southern coasts"
 LOADING_TIP_138:0 "The south is hot, the seas are wild, and the Nether lies farther south than both. Travellers' advice: go north.\n- Saying of the Herez marches"
 LOADING_TIP_139:0 "Nothing lives in Zol's Mistake. Things walk there anyway.\n- Fishermen's saying, Ocean of Zol"
 LOADING_TIP_140:0 "Never put in at a black island. The islands are patient, and you are not.\n- Fishermen's saying of the north"
 LOADING_TIP_141:0 "Why is it called Zol's Mistake? Ask the scholars. Then ask why none of them has gone to look.\n- Saying of the Leren harbours"
 LOADING_TIP_142:0 "A man killed in battle stays dead. The dead of the north were never told.\n- Saying of the northern coasts"
 LOADING_TIP_143:0 "Black ships among the islands, the fishermen said. The court said fishermen drink. Both were telling the truth.\n- Saying of the Sonargur docks"
 LOADING_TIP_144:0 "Noris and Stabilo fight over every road east. The camels have not noticed.\n- Saying of the salt road"
 LOADING_TIP_145:0 "A Noris camel rider can cross the desert on one skin of water and one insult to Stabilo.\n- Saying of Furvior"
 LOADING_TIP_146:0 "In Postondoroth they weigh gold, salt and promises on the same scale. Only the gold never comes up short.\n- Saying of the Stabilo Pact"
 LOADING_TIP_147:0 "The East is the richest land in Erdae and the most divided. Every merchant says the two are related. Every king blames the other king.\n- Saying of the caravan masters"
 LOADING_TIP_148:0 "Gondolin, Drak, Alerhia, Miaed: four courts, forty quarrels and one road for all of them.\n- Caravan saying of the East Lands"
 LOADING_TIP_149:0 "Easterlings, the old charts call us. We were here before the charts.\n- Saying of the East Lands"
 LOADING_TIP_150:0 "§YCounsel:§! The Erdae bar under your flag shows the year of the Fourth Age, the Gathering Dark and up to three meters of your own realm. Hover any of them to learn what it means."
 LOADING_TIP_151:0 "§YCounsel:§! The Realm button opens the Realm panel: your people, your alignment and stance, and your standing among the crowns of Erdae."
 LOADING_TIP_152:0 "§YCounsel:§! Great powers have their own panel. Open it from the small sigil at the end of the Erdae bar. Panels show; decisions act."
 LOADING_TIP_153:0 "§YCounsel:§! The Gathering Dark measures how near Erdae is to catastrophe. It starts low, because the world seems at peace, and rises as hidden pressures build."
 LOADING_TIP_154:0 "§YCounsel:§! Erdae counts twelve months from Deepwinter to Longnight. The campaign opens on 1 Thaw, 4A 1748, the first day of spring."
 LOADING_TIP_155:0 "§YCounsel:§! Every realm belongs to one of ten peoples. Your people decides which hosts you can raise and which arms your armouries can make."
 LOADING_TIP_156:0 "§YCounsel:§! Four alignments divide Erdae: Light, Dominion, Shadow and the Wild. Each has its own stances, and each treats war and alliances differently."
 LOADING_TIP_157:0 "§YCounsel:§! At the start nobody can simply justify a war. A cause, such as a broken truce or an old grudge, lets one realm press a claim on one rival."
 LOADING_TIP_158:0 "§YCounsel:§! Declare war while the long peace holds and you are branded a breaker of the peace: stability and war support fall, and the Gathering Dark rises."
 LOADING_TIP_159:0 "§YCounsel:§! Seven leagues stand at the start: the Middle Kingdom Concord, the Leren Compact, the Northern Accord, the Noris Treaty, the Stabilo Pact, the Dark Sea Accord and the Southern Dominion."
 LOADING_TIP_160:0 "§YCounsel:§! The elves keep the Elven Refusal. They defend their own lands, but they will not send armies to fight for Aenor."
 LOADING_TIP_161:0 "§YCounsel:§! Erdae runs on Iron, Timber, Horses, Stone, Gold, Essence and Grain. Timber builds hulls, Horses mount riders, Essence feeds magical arms."
 LOADING_TIP_162:0 "§YCounsel:§! Guild Workshops build for the realm, Armouries forge arms for the hosts, and Shipwrights lay down hulls. Balance them to your needs."
 LOADING_TIP_163:0 "§YCounsel:§! Roads, High Roads and Depots carry supply. A host far from any road starves faster than any enemy can kill it."
 LOADING_TIP_164:0 "§YCounsel:§! Ballista companies pierce the hides of trolls, giants and the other great kin. A host without them barely scratches such foes."
 LOADING_TIP_165:0 "§YCounsel:§! Ordinary arms hardly harm Zol's deathless. Wards and hallowed arms help a little; only potent magic truly ends them."
 LOADING_TIP_166:0 "§YCounsel:§! Knights and heavy foot are the hammer of the hosts of men. They hit hard and cost dearly, so keep them where the battle is decided."
 LOADING_TIP_167:0 "§YCounsel:§! Support companies matter: scouts find the enemy, sappers break walls, healers return the wounded, and wardens stand against the dead."
 LOADING_TIP_168:0 "§YCounsel:§! Rangers, hill companies, sea soldiers and temple wardens are the special forces of Erdae. Few realms can field many of them."
 LOADING_TIP_169:0 "§YCounsel:§! Dragons cannot be bred or built. Only pacts with Dragon Mountain bring them, and a dragon lost in battle is never replaced."
 LOADING_TIP_170:0 "§YCounsel:§! The Great Wall of Aenor is a line of stone forts from the Organ Mountains past Lunhrim to Kingson. It needs upkeep, and every breach matters."
 LOADING_TIP_171:0 "§YCounsel:§! Galleys cannot cross the wide central sea. A fleet bound from the West Lands to the Middle Lands needs deep-water hulls."
 LOADING_TIP_172:0 "§YCounsel:§! The seas around the Dead Lands are wracked by storms. Without storm rigging, a fleet loses ships there before it meets an enemy."
 LOADING_TIP_173:0 "§YCounsel:§! Merchant cogs carry your trade and your armies across the water. Guard them: corsairs hunt the sea lanes."
 LOADING_TIP_174:0 "§YCounsel:§! A war galley's ram strikes hard at close quarters. Warships carry ballista decks and the reach to stay at sea for long."
 LOADING_TIP_175:0 "§YCounsel:§! The Historical Path rule decides whether the AI follows the chronicle of the age, leans toward it, or follows only its own interests."
 LOADING_TIP_176:0 "§YCounsel:§! The Story Pace rule stretches or shortens the time between the great moments of the age. It never changes what can happen."
 LOADING_TIP_177:0 "§YCounsel:§! With the skies rule off, there are no griffin riders in the air, and dragons fight beside armies instead of as wings."
 LOADING_TIP_178:0 "§YCounsel:§! Playing Aenor? The Golden Court meter shows how rotten your court is. A gilded court is rich, but rot weakens everything it touches."
 LOADING_TIP_179:0 "§YCounsel:§! Concord dominions show their loyalty as Steadfast, Loyal, Restless or Defiant. Keep them content, or they will ask for freer charters."
 LOADING_TIP_180:0 "§YCounsel:§! The Lost Cause begins as the King's ornament inside Aenor. Its frontier companies are real soldiers, and what it becomes is up to you."
 LOADING_TIP_181:0 "§YCounsel:§! Playing Lerendor? Your standing under the Treaty of the Narrow Strait decides how far the crowns of the strait trust you."
 LOADING_TIP_182:0 "§YCounsel:§! Playing Mirolon? Parim will not listen to rumours. Send scouts south and gather proof that no court can laugh away."
 LOADING_TIP_183:0 "§YCounsel:§! The West Lands are many crowns in an uneasy calm. The Truce of the Grey Ford holds at the start, and whether it lasts shapes the West."
 LOADING_TIP_184:0 "§YCounsel:§! The caravan roads make Noris and Stabilo rich, and keep them rivals. A price war on the salt road can turn into a real one."
 LOADING_TIP_185:0 "§YCounsel:§! Playing Volgan? Your grave hosts fray far from the Dead Lands. Necromancers slow the decay; patience serves you better than haste."
 LOADING_TIP_186:0 "§YCounsel:§! Playing Zol? Your presence in Erdae grows slowly and can thin away. Tend it, and let the dead do the walking."
 LOADING_TIP_187:0 "§YCounsel:§! Playing the Worshipdom? Your three valleys hold almost no army. Your strength lies in pilgrims, temples and friends in other courts."
 LOADING_TIP_188:0 "§YCounsel:§! Read your events. Many options open or close whole roads of history, and the age can end in more than one way."
 LOADING_TIP_189:0 "§YCounsel:§! Every realm has its own focus tree. Some branches open only as the age moves, so look again when the world changes."
