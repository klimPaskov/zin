l_english:
 LOADING_TIP_0:0 "My grandmother used to say that a crown is gold only on the outside, and that a king who never looks inside his own will never find out how much it weighs.\n- Saying of the Vale of Aenor"
 LOADING_TIP_1:0 "The old folk say they built Parim beside the Great Lake so that a king looking out of his window would never forget where his bread was grown.\n- Proverb of the lake-country"
 LOADING_TIP_2:0 "Plough the old grave-fields deep and keep your grumbling to yourself, because the wizard lifted the Necromancer's curse from that ground long ago, and it has given good barley ever since.\n- Ploughmen's saying, Middle Lands"
 LOADING_TIP_3:0 "The Charters call every dominion a partner of the crown, which is a handsome word, though I notice it is still the crown that does the asking and the partners that do the paying.\n- Grumble of the Concord dominions"
 LOADING_TIP_4:0 "You can buy a judgeship at the Golden Court in Rasthel and sell it again by Aurlan, and if you are clever you will turn a profit on the justice in between.\n- Market jest of Parim"
 LOADING_TIP_5:0 "The court gave us new banners for the jubilee and no new boots, so when the levy is called we shall march to the border looking very fine and limping.\n- Saying of the Aenoran levies"
 LOADING_TIP_6:0 "Aen had hundreds of sons, which is why every lord in the Middle Lands can show you a roll proving his royal blood, and why not one of them can show you a roll that makes him king.\n- Saying of the heralds of Parim"
 LOADING_TIP_7:0 "We hear the Baelim long before we see them, a low sound under the trees like a cart on a far road, and when we hear it we step off the path and wait, because they will not step off it for us.\n- Saying of the Selen rangers, Aenor Forest"
 LOADING_TIP_8:0 "Men come up into our hills to ask what we remember, and we tell them, and then they hurry down again to write it on a skin that will rot long before the cairn does.\n- Saying of the giants of Hirolon"
 LOADING_TIP_9:0 "If you ask an ent of Kilinti the way through the forest he will tell you truly and in full, but bring a loaf and a blanket, because the telling takes a good deal longer than the walk.\n- Saying of the Kilinti woodcutters"
 LOADING_TIP_10:0 "A rider of Hunhun will tell you that he owns three things in this world, his horse, his word and the sky over the steppe, and that he would sooner lose the first than the second.\n- Horse-lords' saying, Hunhun"
 LOADING_TIP_11:0 "On the first of Irumas every smith in the Vale lets his forge go cold at dawn and lights it again from the Anvil-Priest's fire, and anyone who wants a horseshoe before noon gets a blessing instead.\n- Custom of the smiths of the Vale of Aenor"
 LOADING_TIP_12:0 "Pass in peace, traveller, and open your packs to the toll-men, for this road runs through the mountains by leave of two peoples and belongs to neither of them.\n- Inscription over the gate of Kingson"
 LOADING_TIP_13:0 "We cut the stone for every guild-hall in Kradlon and the guild masons lay it, and when a hall falls down the guilds blame the stone, which is how you know they have never cut any.\n- Proverb of the dwarves of the Herlitz Mountains"
 LOADING_TIP_14:0 "We sell iron to the men of Kingson by the honest pound and to the elves by the elvish pound, which is the same weight at twice the price, and neither has ever complained to our faces.\n- Proverb of the dwarves of Kunhrim"
 LOADING_TIP_15:0 "When the granary of the House of the First Light is full they ring the bell at dawn, and in a lean year the bell stays silent, so every street knows how the harvest went before the bailiff does.\n- Custom of the Houses of the First Light"
 LOADING_TIP_16:0 "A scribe of Parim writes Aen, First of His Name, and never First of Men, because men had kings for thousands of years before him and the University will not let anyone forget it.\n- Rule of the scribes of Parim"
 LOADING_TIP_17:0 "For centuries the kingdoms of men fought over whether there should be one crown or many, and it was Aen who settled the matter in the end, at the cost of most of the others.\n- The Chronicle of Aoaz: the First Age"
 LOADING_TIP_18:0 "When Aenor's ships came to the western shores there were already people living there, and that, when you come down to it, is the whole of a quarrel that has lasted four ages.\n- A western reading of the Chronicle"
 LOADING_TIP_19:0 "In the First Age the south seemed to guard itself, for storms closed its coasts, and the few men who did get ashore found a heat that killed them faster than any army could.\n- The Chronicle of Aoaz: the First Age"
 LOADING_TIP_20:0 "The Leren fought beside Aen as allies and never as his subjects, and the Annals of Sonargur have taken care to repeat the point in every reign since, in case a king of Aenor should forget it.\n- The Annals of Sonargur"
 LOADING_TIP_21:0 "Men, elves, dwarves, giants and spirits once stood together under King Edran's banners, and no age since has managed it again, though the scholars of Parim have spent many winters arguing how he did it.\n- The Chronicle of Aoaz: the Grand Alliance"
 LOADING_TIP_22:0 "The Grand Alliance won at Dardan, and the clerks who counted the dead afterwards gave up long before they reached the end, for the field was a wasteland and every kingdom of the Alliance had sons buried in it.\n- The Chronicle of Aoaz: the First Age"
 LOADING_TIP_23:0 "The spirits did not kill Volgan when they beat him; they stripped him of his strength and threw him into the Void, and any warden of Mirolon will tell you that what is thrown out can find its way back.\n- A commentary on the Chronicle"
 LOADING_TIP_24:0 "King Edran won the war and could not leave well alone, for he would not stop at Dardan, and it was the elves who paid for his campaign in the Ember Lands with their dead.\n- The Chronicle of Aoaz: the First Age"
 LOADING_TIP_25:0 "They called the Second Age the Long Grief, and so it was, yet in those years the farmers learned to keep seed through a bad winter, the healers to stop a plague and the builders to raise walls that held.\n- The Chronicle of Aoaz: the Second Age"
 LOADING_TIP_26:0 "King Edran, the greatest king since Aen, came home from all his wars and died in his bed of a sickness that no physician of his court could cure.\n- The Chronicle of Aoaz: the Second Age"
 LOADING_TIP_27:0 "When the Necromancer came the elves did not, and the men of Aenor called it betrayal, though the elves, who had buried their own dead in King Edran's war, called it remembering.\n- The Chronicle of Aoaz: the Second Age"
 LOADING_TIP_28:0 "In the last centuries of the Second Age the Necromancer's war came from within, and orc and goblin hosts climbed out of the deep places in lands that had thought themselves safe.\n- The Chronicle of Aoaz: the Second Age"
 LOADING_TIP_29:0 "The Second Age was the longest of the four, two thousand one hundred and thirty-three years, and it ended in the last days of its last year, when the Necromancer took Aenor.\n- The Chronicle of Aoaz: the Second Age"
 LOADING_TIP_30:0 "The pass-lords of Miaed charge a toll at the top of the Hardtmuth road and another at the bottom, and they will tell you with a perfectly straight face that it is only fair, since the road goes both ways.\n- Saying of the desert caravans"
 LOADING_TIP_31:0 "Elzon did not fade like his dead and did not sleep as the Old Gods are said to; when his end came he died, wholly and for good, and the Chronicle has never had to correct the entry.\n- The Chronicle of Aoaz: the Third Age"
 LOADING_TIP_32:0 "When the Necromancer fell, the faithful say, the Deliverer stood between the people and the ruin, and the temples were full that day and have not been empty since.\n- The Chronicle of Aoaz: the Fourth Age"
 LOADING_TIP_33:0 "Harion of Selen took up a crown that had waited twelve hundred years for a head, and the Annals note with some surprise that it still fitted a good man.\n- The Annals of Parim"
 LOADING_TIP_34:0 "4A 96: the elves and the restored crown agreed at Kingson that the elves should keep the eastern forts of the passes and the crown the western, and that the crown should take the tolls, which pleased both.\n- The Annals of Parim"
 LOADING_TIP_35:0 "4A 1000: Parim kept the feast of a thousand years of peace, envoys came from every coast of Aoaz to drink the king's health, and the Annals record with pride that not one of them came armed.\n- The Annals of Parim"
 LOADING_TIP_36:0 "In the First Age the kings of the East did not all choose the same side, for some marched for Volgan and some did not, and the courts of the East still remember very well which was which.\n- The Chronicle of Aoaz: the First Age"
 LOADING_TIP_37:0 "4A 1744: the fishermen who came in this spring speak of black ships among the islands of the Kusmeel, and the harbour-master has had their tale written down, though he does not believe a word of it.\n- The Harbour Rolls of Sonargur"
 LOADING_TIP_38:0 "4A 1745: King Herlic of Gunwyn and the wardens of Girdon swore the Truce of the Grey Ford at the stone, and the West has been quiet since, though the annalist notes that he has bought a new sword.\n- The Annals of Gunwyn"
 LOADING_TIP_39:0 "Caravan men of the Sun Desert say the dunes run south until the sand turns to ash, and that beyond lies a country of fire no chart shows, and there they stop the story and talk about the price of salt.\n- Saying of the Sun Desert caravans"
 LOADING_TIP_40:0 "I mean to make one crown of all these crowns, so that the mothers of the Middle Lands may stop burying their sons for the sake of the rest.\n- Words the heralds give to Aen, First of His Name"
 LOADING_TIP_41:0 "Let every banner keep its own colours, for we march together and not as one, and no lord shall be asked to fold his standard under another's in order to fight beside him.\n- Preamble of the Charter of Free Banners"
 LOADING_TIP_42:0 "She asked that her name be written in the muster before she marched, and it was written, and she went to Dardan with the clans, and the banner of Gunwyn did not turn that day or any day after.\n- Song of Taryn's banner, Gunwyn"
 LOADING_TIP_43:0 "When no road could reach the host at Dardan the islands fed it, and the islanders will remind you of it at every table they set, usually while they are passing you the bread.\n- Island saying of Senra's people"
 LOADING_TIP_44:0 "A healer does not ask which banner a wound was made under, and if you are too proud to be tended beside your enemy, you are welcome to bleed outside.\n- Tavriel of the Magical Forest"
 LOADING_TIP_45:0 "When we lay the raised dead down again we speak to them gently, because the poor things meant no harm and only wanted to sleep, and it was someone else who would not let them.\n- Saying of the Lantern Chain's healers"
 LOADING_TIP_46:0 "Our king was only a hobgoblin once, like any other, but he ate well and grew, and now he is very big and very wise, and anyone who thinks the second does not follow from the first can tell him so.\n- Saying of the warrens of Glimik"
 LOADING_TIP_47:0 "Our king led the host to Dardan and remembers it still, and yet the Keepers write down every word he says, because they reckon the roll will outlast even him.\n- Keepers of the court of Gala"
 LOADING_TIP_48:0 "Do not frighten your people with prophecy, for a frightened people will work very hard to make it come true.\n- Proverb of the court of Gala"
 LOADING_TIP_49:0 "The oasis keepers tell every traveller never to sleep in a cave mouth that is warmer than the rock around it, because the sand golems lie there, and they are very slow to forgive being woken.\n- Saying of the oasis keepers, Sun Desert"
 LOADING_TIP_50:0 "We treat with the king in Parim as one crown with another and have never taken a charter from him, because a promise that needs a scribe to hold it was never much of a promise.\n- Saying of the High Chief's hall, Hirolon"
 LOADING_TIP_51:0 "The seals of the kingdom are heavy, Your Majesty, and I am glad to carry them for you, so that you need never trouble yourself with what they are pressed upon.\n- Merovan, Keeper of the Seals"
 LOADING_TIP_52:0 "The sun makes a goblin sleepy, which is why the warrens of Glimkit leave the whole day to the big folk, since it is plainly all they are fit for.\n- Saying of the warm valleys of Glimkit"
 LOADING_TIP_53:0 "I have told the court every spring for ten years that a host which drills only for the king's birthday will fight like one, and every spring they thank me and order new plumes.\n- Marshal Corwen Hornan of Aenor"
 LOADING_TIP_54:0 "The court companies of the Lost Cause wear the badge on their best coats, and my frontier companies wear it on their old ones, because they had to earn it in the mud.\n- Lord-Commander Tarec Belurith"
 LOADING_TIP_55:0 "The University has taught the learned art for centuries and has given the Middle Lands exactly one wizard whom everybody has heard of, which the masters find a good deal more awkward than Bastian does.\n- Jest of the students of Parim"
 LOADING_TIP_56:0 "We graze our sheep on the giants' eastern slopes for one fleece in ten, and in all the years my family has paid that rent, no giant has ever once miscounted.\n- Saying of the herders of the Grano slopes"
 LOADING_TIP_57:0 "Selen loves the crown the way the forest loves the road, which is to say we let it through and keep an eye on it the whole way.\n- First Warden Daeric Svenlor of Selen"
 LOADING_TIP_58:0 "The giants keep the passes and we keep the barley, and on a good evening we keep the giants as well, in ale, which is a fair bargain by anybody's reckoning.\n- Saying of the small folk of Tirlan"
 LOADING_TIP_59:0 "A lamp in the window and a loaf on the table for whoever is on the road tonight: that is all the Deliverer has ever asked of a house, and it is not much to ask.\n- Ilvane, High Confessor of the Deliverer"
 LOADING_TIP_60:0 "Our three valleys have no army to speak of and the busiest roads in Aoaz, and I would not change either, since pilgrims eat a great deal more than soldiers and pay for what they eat.\n- Abbot-Steward Lozan Heron of the Worshipdom"
 LOADING_TIP_61:0 "A decision of the houses is judged as one judges a young tree, by what it shelters when those who planted it are long gone.\n- First Speaker Lusiel Velakorin of the Magical Forest"
 LOADING_TIP_62:0 "No keeper of the roosts ever says my dragon; we say the dragon who allows me to stand near, and those who forget the difference seldom get the chance to forget anything else.\n- Perlan, Warden of the Dragon Roosts"
 LOADING_TIP_63:0 "Men often ask why we did not come when the Necromancer marched on Aenor, and we answer that we had come once already, for King Edran, and were still burying what that cost us.\n- Loremaster Aenwe Lozari of the Magical Forest"
 LOADING_TIP_64:0 "We were not humiliated in Parim in 4A 1716, whatever the Golden Court likes to say; we were taught the price of a toll, and we have been studying the lesson with great care ever since.\n- King Ferlin III of Lerendor and Lerendor's North"
 LOADING_TIP_65:0 "A queen of the Cold Lands rules ice, wind and men, and she learns early that the men are the only ones of the three who ever listen to her.\n- Queen Vaestia of Coldor"
 LOADING_TIP_66:0 "I signed the truce at the Grey Ford with my left hand, and my right stayed on my sword hilt the whole time, more out of habit than ill will, I assure you.\n- King Herlic of Gunwyn"
 LOADING_TIP_67:0 "The law of Gunwyn binds the king just as it binds the shepherd, and I have noticed over the years that the shepherd finds this a good deal more comforting than the king does.\n- Lawspeaker Ilurda of Gunwyn"
 LOADING_TIP_68:0 "Swear the truce at the stone if you must, but keep your blade greased, because the stone forgives nothing, and neither does the Lawspeaker, and the clans of Girdon know it as well as we do.\n- Thane Datid Werlen of Gunwyn"
 LOADING_TIP_69:0 "A caravan is a kingdom that happens to be moving, and mine moves rather faster than the Prince of Postondoroth's, which is the whole of our quarrel in a sentence.\n- King Esiurth II of Noris"
 LOADING_TIP_70:0 "Noris owns the desert, and I grant him that freely, but we own the people who have to cross it, and they settle their bills on time.\n- Prince Cereos of Postondoroth"
 LOADING_TIP_71:0 "A warking who cannot win a fight will not keep his crown for long, and a warking who must fight every day to keep it has lost it already and simply not noticed.\n- Warking Gorduth of Cocanoor"
 LOADING_TIP_72:0 "Mirolon has never asked the north to love us, only to look south once a year and see what we see every night from the beacon towers.\n- High Warden Maeric of Mirolon"
 LOADING_TIP_73:0 "I carried the warning to Parim in autumn with the dust of the southern road still on my cloak, and the court thanked me very kindly, fed me well and sent me home.\n- Envoy Hessa Mencnor of Mirolon"
 LOADING_TIP_74:0 "Watch the dust on the southern road, lad, because a scout's eyes will lie to you about how many are coming and how fast, but the dust never does.\n- Captain Bennar of the Passes"
 LOADING_TIP_75:0 "He stood between us and the ruin when the Necromancer fell, and so we keep a lamp lit in every window, that he may see we have not forgotten.\n- The Litany of the Deliverer"
 LOADING_TIP_76:0 "Deliverance for those who have fallen, protection for those who keep faith, and renewal for the land that feeds us all.\n- Blessing of the pilgrim-houses of the Zilin Hills"
 LOADING_TIP_77:0 "The islanders say their speech and the speech of Gunwyn were brothers once, and that Gunwyn went inland and grew fat on cattle while the islands stayed lean and kept the better words.\n- Saying of the Pupor Isles"
 LOADING_TIP_78:0 "Come to Zilin with empty hands, the pilgrims say, and you will go home with a blessing, a full belly and a letter to carry for some stranger in your own town.\n- Pilgrims' saying of the Zilin Hills"
 LOADING_TIP_79:0 "In the Hall of Scales at Postondoroth a false weight is reckoned a worse crime than a broken head, because a head will mend in a month and a merchant's name never does.\n- Saying of the Weighers of Stabilo"
 LOADING_TIP_80:0 "Rain for the barley, a priest for the fever and a lamp for the road, my mother used to say, and anyone who has all three and still grumbles about the tithe deserves to pay it twice.\n- Peasants' saying of the Middle Lands"
 LOADING_TIP_81:0 "In the Long Dark every house of the clan lets its own fire go out and comes to the clan fire to light it again, so that no family in the Cold Lands is ever left alone with its cold.\n- Custom of the Winter Hearth"
 LOADING_TIP_82:0 "The wreck-right lords of the outer arc pray every autumn for gales, though they take care to pray quietly, and the chart-houses of Adel, who live by keeping ships off those rocks, do not speak to them.\n- Saying of the Pupor Isles"
 LOADING_TIP_83:0 "Half the priests in Sonargur will tell you the Old Gods are dead and the other half that they only sleep, and the market wives, who have heard both sermons, keep a lamp lit either way.\n- Saying of the Leren coasts"
 LOADING_TIP_84:0 "The priests of the north say that of all the Old Gods only Zol dwells in Aoaz, and the old women of the strait add that this is one more than anybody would have chosen.\n- Saying of the Leren strait"
 LOADING_TIP_85:0 "A king who prays to Kerun for conquest is wasting his breath, the Watch-Chaplains say, because Kerun keeps the walls of the weak and has never once helped anyone to take a wall that was not his.\n- Saying of the Watch-Chaplains of Mirolon"
 LOADING_TIP_86:0 "A well shared makes kin and a well sealed makes enemies for seven generations, as the well-wives of the Noris desert teach every child old enough to carry a jar.\n- Teaching of the Well-Oath"
 LOADING_TIP_87:0 "Miners in the Dark Lands say there are spirits so far down under the mountains that they have never seen the sun, and the foremen keep a rope tied to the youngest lad, just in case he finds one.\n- Miners' saying of the Dark Lands"
 LOADING_TIP_88:0 "When a fever leaves a house the Bowl-Bearers of Sulethe break a bowl on the threshold, and the children of the village come running for the pieces, because a shard of a fever-bowl is the best luck there is.\n- Custom of the spring-houses of the southern islands"
 LOADING_TIP_89:0 "In the Free Crowns the Lamp-Mother puts out every fire in the village on the last night of Sulethe and lights them all again at dawn from the common hearth, so that no house begins the year alone.\n- Custom of the Free Crowns of the North"
 LOADING_TIP_90:0 "On the Night of Names the Name-Readers of Dondor read out every name in the roll of the dead, and nobody leaves before the end, because nobody wants a grandmother read to an empty hall.\n- Custom of the Name-Readers of Gaelor, Dondor"
 LOADING_TIP_91:0 "In the Magical Forest the houses vote and the First Speaker serves, and they reckon a precedent young until it has stood a hundred years and a habit young until it has stood a thousand.\n- Saying of the houses of the Magical Forest"
 LOADING_TIP_92:0 "Men ask why we keep the passes, and we tell them that we kept our distance long before any fort was built in the mountains, and that the forts only made it easier for men to see.\n- An elder of the Magical Forest"
 LOADING_TIP_93:0 "Herrodon and Andos Enda have been quarrelling for so long that their grudges have married and had grandchildren, and the grandchildren have quarrels of their own.\n- Saying of Nolorim"
 LOADING_TIP_94:0 "Nolorim keeps the high passes and sends no word to anyone about what it sees there, and the other houses have learned over the centuries to read a great deal into the silence.\n- Saying of the Magical Lands"
 LOADING_TIP_95:0 "Only the elves can call the dragons, but every few years some young lord rides up to our gate with a saddle made for one, and we let him through, and we keep the saddle when it comes back down without him.\n- Saying of the gate-wardens of Kingson"
 LOADING_TIP_96:0 "The elves were never conquered, not even by the Necromancer, and they mention it seldom, though an envoy soon learns that they never mention it by accident.\n- Saying of Aenoran envoys"
 LOADING_TIP_97:0 "In the worst years of the Third Age the wizard and his small purple servant walked our roads, and wherever the wizard went the dead lay down again and stayed down.\n- As the elves of the Magical Forest remember Varner"
 LOADING_TIP_98:0 "Varner never once asked to be thanked, so the elves thank him every spring, at length and rather loudly, in case he happens to be listening.\n- Custom of the Magical Forest"
 LOADING_TIP_99:0 "Walk softly in the Mushroom Forest, because the mycids feel every footstep through the floor of it, and they are slow to forget a heavy one.\n- Saying of the rift shore"
 LOADING_TIP_100:0 "When Lerendor and Lerendor's North were joined under one crown the old wives of Sonargur called it a good match, since the bride brought snow and the groom brought harbours and each had what the other lacked.\n- Saying of Sonargur"
 LOADING_TIP_101:0 "We thank our good cousin of Lerendor for his letter on the strait dues, and we have read it twice with great attention, once for its courtesy and once to see whether the figures improved.\n- From a letter of the Golden Court to Sonargur"
 LOADING_TIP_102:0 "Tolvael bows to no crown and sells its timber to all of them, and its foresters will tell you that no tree has ever once asked who was buying it.\n- Saying of Tolvael"
 LOADING_TIP_103:0 "Molot and R'en sit between the two masters of the strait, and like all small crowns they have learned to smile in both directions at once without straining their necks.\n- Saying of the Free Crowns"
 LOADING_TIP_104:0 "The dwarf goblins of the Leren hills are neither dwarves nor goblins, as they will tell you at length, and the quickest way out of one of their halls is to ask which of the two they are nearer.\n- Saying of the Leren uplands"
 LOADING_TIP_105:0 "In the Cold Lands a stranger at the door is given a seat by the fire and a bowl before anyone asks his name, and the questions can wait until the thaw.\n- Hospitality law of the Cold Lands clans"
 LOADING_TIP_106:0 "Coldor has one crown for the whole frozen interior, and the warlords of Melkgard have one answer to it, which they give from behind their black forts every time anyone asks.\n- Saying of Fandanar"
 LOADING_TIP_107:0 "Every clan of the Cold Lands has refused some king or other in its time, but I have yet to meet the clan that refused the winter.\n- Saying of the Coldor clans"
 LOADING_TIP_108:0 "The traders of Mp'E will tell any newcomer about the silent castle above the town, where a green light burns on clear nights, and then they will sell him a sledge pointed the other way.\n- Traders' tale of Mp'E"
 LOADING_TIP_109:0 "The yeti will trade you furs for salt and the way through the passes for your silence, and of the two bargains the second is much the better, so take it.\n- Saying of the ice road"
 LOADING_TIP_110:0 "We lay a stone on the cairn for every winter, and the stones are cold and the winters were colder, and that is why the young men of the south think we never laugh.\n- Saying of the ice giants of Nivaros"
 LOADING_TIP_111:0 "The Cold Lands run off the edge of every chart in Aoaz, and the chart-makers of Fandanar are honest men, so where they stop knowing they simply stop drawing.\n- Saying of Coldor's ports"
 LOADING_TIP_112:0 "Aenor calls it discovery and we call it what happened to our grandfathers' grandfathers, and both of us have been saying so for four ages without either one of us giving way.\n- Saying of the Gunwyn clans"
 LOADING_TIP_113:0 "The guild-halls of Kradlon swear their contracts on the guild book and not on any god, because a god may forgive a man and the book never has.\n- Saying of the Kradlon guilds"
 LOADING_TIP_114:0 "Fifty years of war and then one truce at the Grey Ford, and in the West we call that a short quarrel, so you may judge for yourself what we call a long one.\n- Saying of the Girdon wardens"
 LOADING_TIP_115:0 "A clan will forgive a debt, a feud and a bad harvest if you give it time, but no clan of the West has ever been known to forgive a toll.\n- Saying of the Corogon traders"
 LOADING_TIP_116:0 "The Buldor companies will fight for anyone who asks, and they fight well, but they have never once fought for nothing, and they would be insulted if you suggested it.\n- Saying of the West Lands"
 LOADING_TIP_117:0 "On the Pupor Isles a man may own a whole island and still not have soil enough to bury his father in, which is why the islanders grew rich on knowledge instead of land.\n- Saying of the Pupor Isles"
 LOADING_TIP_118:0 "We charted every reef in these waters and sold the charts to every crown in Aoaz, and each crown believes it bought the only good copy, which is why we are so polite to all of them.\n- Chart-makers' saying of Adel"
 LOADING_TIP_119:0 "When the old tales of men grow too old for any man to explain, the islanders say, carry them to Gala, because the elves there will remember what we have forgotten.\n- Saying of the Islands of the South"
 LOADING_TIP_120:0 "At the shrine beneath the tide the tally-keepers sing a name that none of them understands, and they sing it with great care, because the islanders say the name is needed.\n- Saying of Enhis Is Rond"
 LOADING_TIP_121:0 "Each island counts its dead as waves on the reef, so a child of the south learns to count on them, and the first sum most of us ever did was a sum of our grandmothers.\n- Saying of the tally-caves of Kamu Lamo"
 LOADING_TIP_122:0 "A stranger the sea throws onto our beach is fed and given a mat, and if the sea throws him back to us a second time, the elders say he is plainly meant to be family.\n- Hospitality saying of Howan"
 LOADING_TIP_123:0 "A Sunhot elf stands taller than a man on horseback and speaks more softly than a child, and the Sunfolk say a strong hand never had any need of a loud voice.\n- Saying of the Goodin Sunfolk"
 LOADING_TIP_124:0 "Where the strong are gentle the weak can sleep sound, and the Sunfolk have never needed a wall to keep the Sunhot from them, nor the Sunhot one to keep out the Sunfolk.\n- Saying of the Goodin Sunfolk"
 LOADING_TIP_125:0 "The host of Gala marched to Dardan for a king it hardly knew, and Gala has never regretted Dardan, though it has had a long time to regret what King Edran did afterwards.\n- Saying of the court of Gala"
 LOADING_TIP_126:0 "In the Lands of the Sun nothing is settled before noon, and the Lands of Light always speak last, so the other realms have learned to bring their dinners to the council.\n- Saying of the noon court"
 LOADING_TIP_127:0 "Pilgrims who come to rest by the Sea of Gods are given a bed and a bowl and asked nothing, for the keepers say a traveller who has come so far has already answered every question worth asking.\n- Saying of the sanctuaries of Tor Luni"
 LOADING_TIP_128:0 "Goldoroth was once many holds under many chiefs, and now it is one hold under one chief with a great many graves, which the warking's heralds like to call unity.\n- Saying of the Dondor marches"
 LOADING_TIP_129:0 "Dondor has held the line against Goldoroth for three hundred years, and in Notbuton they talk about it the way other towns talk about the weather.\n- Saying of Notbuton"
 LOADING_TIP_130:0 "Bordon, Dreson and Dulundur answer to nobody, and they have done it for so long that nobody has troubled to ask them anything in living memory.\n- Saying of the Dark Lands"
 LOADING_TIP_131:0 "Smash is king of the Troll Forest and of nothing beyond it, and he says so himself, but anybody who wants to argue the point about the forest is welcome to walk in and try.\n- Saying of the Bordon woodcutters"
 LOADING_TIP_132:0 "The fire-speakers of Cocanoor read the smoke above the Fire-Mountain every morning, and on the mornings when it drifts south they say nothing at all, which the clans have learned to take badly.\n- Saying of the Volcano Clans"
 LOADING_TIP_133:0 "Strangers from the south come up the coast with good iron and better promises, and the old men of the free holds tell their sons to take the iron and leave the promises on the beach.\n- Saying of the free holds"
 LOADING_TIP_134:0 "Keep the beacon on the southern pass burning, my son, because Volgan was quiet once before, for a very long time, and the quiet did not last.\n- Saying of the watch of Mirolon"
 LOADING_TIP_135:0 "Mirolon was the first kingdom Volgan ever took, and every warden of Mirolon means it to be the last he ever tries for.\n- Saying of the passes"
 LOADING_TIP_136:0 "The kingdoms of men always divide in the end, the old song has Volgan say, and I have only to wait for them to do it, which I have never minded.\n- Words that Mirolon's old songs give to Volgan"
 LOADING_TIP_137:0 "We bury our dead quickly down here, and deep, with salt in the grave, and we say nothing over them about Zol or about the master of the island, in case either of them is listening.\n- Saying of the Ember Lands freeholders"
 LOADING_TIP_138:0 "The lords of the Nether keep every bargain to the letter, and that, the old men of Herez say, is the very part that the men who bargain with them forget to fear.\n- Saying of the Herez marches"
 LOADING_TIP_139:0 "My father sailed past the black shore once in his life, and all he would ever say of it was that nothing grows there and something walks there, and that he would thank me not to ask again.\n- Saying of the Leren harbours"
 LOADING_TIP_140:0 "From the brown hills of Herrodon you can see the black shore on a clear day, and the elves who live there have built every house in the hills with its door facing the other way.\n- Saying of Herrodon"
 LOADING_TIP_141:0 "Ask a scholar of Parim why the black north is called Zol's Mistake and he will lecture you on everything but the answer, because nobody knows it, and no scholar has yet gone to look.\n- Jest of the students of Parim"
 LOADING_TIP_142:0 "The old men of the north coast say a sword that kills a man will only annoy the dead of the Mistake, so every village there keeps a Name-Reader of Gaelor as well as a smith, and pays him better.\n- Saying of the northern coasts"
 LOADING_TIP_143:0 "The wells of Woqood face the black sea, and the well-wives there pour the first water of the year back into the sand facing south, so that nothing out on the water thinks it was meant for it.\n- Custom of the well-wives of Woqood"
 LOADING_TIP_144:0 "Noris and Stabilo have fought over every road in the East for as long as anyone remembers, and the little courts along those roads have grown fat on selling water to both.\n- Saying of the salt road"
 LOADING_TIP_145:0 "In the Noris desert a stranger's map is a kind gift, but a rider's memory of the wells is a fortune, and no rider in his right mind has ever sold it.\n- Saying of the camel riders of Noris"
 LOADING_TIP_146:0 "In Postondoroth they weigh gold, salt and promises on the same scale, and somehow it is only ever the promises that come up light.\n- Market saying of Postondoroth"
 LOADING_TIP_147:0 "A caravan master carries three sets of scales, one for buying, one for selling and one for the customs house, and he trusts none of them as far as he trusts his camels.\n- Saying of the caravan masters"
 LOADING_TIP_148:0 "Naamis, Drak, Alerhia and Miaed are four courts with forty quarrels between them and one road to share, so a wise traveller learns four sets of manners before he sets out.\n- Caravan saying of the East Lands"
 LOADING_TIP_149:0 "The old charts of Aenor call us Easterlings, as though we were something that happened to the east of them, but our kings were crowned beside the rift long before the first chart was drawn.\n- Saying of the river kingdoms of the East"
 LOADING_TIP_150:0 "§YCounsel:§! The Aoaz bar under your flag shows the year of the Fourth Age, the Gathering Dark and up to three meters of your own realm. Hover any of them to learn what it means."
 LOADING_TIP_151:0 "§YCounsel:§! The Realm button opens the Realm panel: your people, your alignment and stance, and your standing among the crowns of Aoaz."
 LOADING_TIP_152:0 "§YCounsel:§! Great powers have their own panel, which opens from the small sigil at the end of the Aoaz bar. The panels show you the state of things; the decisions are where you act."
 LOADING_TIP_153:0 "§YCounsel:§! The Gathering Dark measures how near Aoaz is to catastrophe. It starts low, because the world seems at peace, and rises as hidden pressures build."
 LOADING_TIP_154:0 "§YCounsel:§! Aoaz counts twelve months, each named for one of the twelve main New Gods, from Glernaen to Naisa. The campaign opens on 1 Lumae, 4A 1748, the day of the Lamp-Lighting and the first day of spring."
 LOADING_TIP_155:0 "§YCounsel:§! Every realm belongs to one of ten peoples. Your people decides which hosts you can raise and which arms your armouries can make."
 LOADING_TIP_156:0 "§YCounsel:§! Four alignments divide Aoaz: Light, Dominion, Shadow and the Wild. Each has its own stances, and each treats war and alliances differently."
 LOADING_TIP_157:0 "§YCounsel:§! At the start nobody can simply justify a war. A cause, such as a broken truce or an old grudge, lets one realm press a claim on one rival."
 LOADING_TIP_158:0 "§YCounsel:§! Declare war while the long peace holds and you are branded a breaker of the peace: calm and the will to war fall, and the Gathering Dark rises."
 LOADING_TIP_159:0 "§YCounsel:§! Seven leagues stand at the start: the Middle Kingdom Concord, the Leren Compact, the Northern Accord, the Noris Treaty, the Stabilo Pact, the Dark Sea Accord and the Southern Dominion."
 LOADING_TIP_160:0 "§YCounsel:§! The elves keep the Elven Refusal. They defend their own lands, but they will not send armies to fight for Aenor."
 LOADING_TIP_161:0 "§YCounsel:§! Aoaz runs on Iron, Timber, Horses, Stone, Gold, Essence and Grain. Timber builds hulls, Horses mount riders, Essence feeds magical arms."
 LOADING_TIP_162:0 "§YCounsel:§! Guild Workshops build for the realm, Armouries forge arms for the hosts, and Shipwrights lay down hulls. Balance them to your needs."
 LOADING_TIP_163:0 "§YCounsel:§! Roads, High Roads and Depots carry supply. A host far from any road starves faster than any enemy can kill it."
 LOADING_TIP_164:0 "§YCounsel:§! Ballista companies pierce the hides of trolls, giants and the other great kin. A host without them barely scratches such foes."
 LOADING_TIP_165:0 "§YCounsel:§! Ordinary arms hardly harm Zol's deathless. Wards and hallowed arms help a little; only potent magic truly ends them."
 LOADING_TIP_166:0 "§YCounsel:§! Knights and heavy foot are the hammer of the hosts of men. They hit hard and cost dearly, so keep them where the battle is decided."
 LOADING_TIP_167:0 "§YCounsel:§! Support companies matter: scouts find the enemy, sappers break walls, healers return the wounded, and wardens stand against the dead."
 LOADING_TIP_168:0 "§YCounsel:§! Rangers, hill companies, sea soldiers and temple wardens are the picked troops of Aoaz, and few realms can field many of them."
 LOADING_TIP_169:0 "§YCounsel:§! Dragons cannot be bred or built. Only pacts with Dragon Mountain bring them, and a dragon lost in battle is never replaced."
 LOADING_TIP_170:0 "§YCounsel:§! The Great Wall of Aenor is a range of mountains, and forts hold its passes from the Organ Mountains past Lunhrim to Kingson. The forts need upkeep, and every breach matters."
 LOADING_TIP_171:0 "§YCounsel:§! Galleys cannot cross the wide central sea. A fleet bound from the West Lands to the Middle Lands needs deep-water hulls."
 LOADING_TIP_172:0 "§YCounsel:§! The seas around the Ember Lands are wracked by storms. Without storm rigging, a fleet loses ships there before it ever meets an enemy."
 LOADING_TIP_173:0 "§YCounsel:§! Merchant cogs carry your trade and your armies across the water. Guard them: corsairs hunt the sea lanes."
 LOADING_TIP_174:0 "§YCounsel:§! A war galley's ram strikes hard at close quarters. Warships carry ballista decks and the reach to stay at sea for long."
 LOADING_TIP_175:0 "§YCounsel:§! The Historical Path rule decides whether the AI follows the chronicle of the age, leans toward it, or follows only its own interests."
 LOADING_TIP_176:0 "§YCounsel:§! The Story Pace rule stretches or shortens the time between the great moments of the age. It never changes what can happen."
 LOADING_TIP_177:0 "§YCounsel:§! With the skies rule off, there are no griffin riders in the air, and dragons fight beside armies instead of as wings."
 LOADING_TIP_178:0 "§YCounsel:§! Playing Aenor? The Golden Court meter shows how rotten your court is. A gilded court is rich, but rot weakens everything it touches."
 LOADING_TIP_179:0 "§YCounsel:§! Concord dominions show their loyalty as Steadfast, Loyal, Restless or Defiant. Keep them content, or they will ask for freer charters."
 LOADING_TIP_180:0 "§YCounsel:§! The Lost Cause begins as the King's ornament inside Aenor. Its frontier companies are real soldiers, and what it becomes is up to you."
 LOADING_TIP_181:0 "§YCounsel:§! Playing Lerendor? Your standing under the Treaty of the Narrow Strait decides how far the crowns of the strait trust you."
 LOADING_TIP_182:0 "§YCounsel:§! Playing Mirolon? Parim will not listen to rumours. Send scouts south and gather proof that no court can laugh away."
 LOADING_TIP_183:0 "§YCounsel:§! The West Lands are many crowns in an uneasy calm. The Truce of the Grey Ford holds at the start, and whether it lasts shapes the West."
 LOADING_TIP_184:0 "§YCounsel:§! The caravan roads make Noris and Stabilo rich, and keep them rivals. A price war on the salt road can turn into a real one."
 LOADING_TIP_185:0 "§YCounsel:§! Playing Volgan's Dominion? Your grave hosts fray far from the Ember Lands. Necromancers slow the decay, and patience serves you better than haste."
 LOADING_TIP_186:0 "§YCounsel:§! Playing Zol's Mistake? The black north gathers its strength slowly, and strength left untended can ebb away. Tend it with patience, and let the dead do the walking."
 LOADING_TIP_187:0 "§YCounsel:§! Playing the Worshipdom? Your three valleys hold almost no army. Your strength lies in pilgrims, temples and friends in other courts."
 LOADING_TIP_188:0 "§YCounsel:§! Read your events. Many options open or close whole roads of history, and the age can end in more than one way."
 LOADING_TIP_189:0 "§YCounsel:§! Every realm has its own Path of the Realm, and some of its branches open only as the age moves on, so look again whenever the world changes."
 LOADING_TIP_190:0 "Ask a field only for what it can give. The low land under the sea was asked for more than that, and the sea came to collect.\n- Saying of the cord-mothers of the grey downs"
 LOADING_TIP_191:0 "When the nets come up heavy with field-stones we give them to the old women. They lay them out in rows on the shore and will not tell us why.\n- A fisher of Aenor Isle"
 LOADING_TIP_192:0 "The first stair was raised so that the river and the gods would each have a place. The scribes say the stair is older than the crown, and the priests say nothing.\n- Temple scribe of Alerhia"
 LOADING_TIP_193:0 "Nobody in Delbiz raised the pillars the horse-fair is held among. They are good for tying horses, and that is all a trader needs to know about them.\n- Horse-trader of the Delbiz coast"
 LOADING_TIP_194:0 "There is a wall in the old hall under the forts that no miner strikes. My father did not strike it, his father did not, and you will not either.\n- Mine-foreman of Erco"
 LOADING_TIP_195:0 "My grandfather's grandfather was told never to sleep in the stone forts on the downs. The eastern raiders who built them are an age gone, and still nobody sleeps there.\n- Farmer of Herez"
 LOADING_TIP_196:0 "There is a door at the bottom of our hall that no dwarf opens. The sea keeps it shut, and we are content to let the sea do the work.\n- A dwarf at the gate of Kunhrim, through a carrier"
 LOADING_TIP_197:0 "My grandmother's grandmother could walk to the northern holds without once seeing the sky. Now the road is full of sea, and a dwarf must take a ship like everyone else.\n- Delver of Brundahrim"
 LOADING_TIP_198:0 "No captain sails into the Square, whatever the prize. The reefs are not the reason, though they would be reason enough.\n- Corsair of Benan"
 LOADING_TIP_199:0 "The oldest names read at the close of the gale season belong to no isle anyone lives on. The readers read them anyway, every year, in the same order.\n- Reader of the Drowned Names"
 LOADING_TIP_200:0 "In a mild year the ice gives back old bronze. We take it to the fire-keepers, who look at it a long time and then send us out for more.\n- Herder of Kvittumm"
 LOADING_TIP_201:0 "Every hearth of the clan is lit from the clan fire in the Long Dark, as it was before there was any crown to tell us to.\n- Fire-keeper of the Frost-Hall"
