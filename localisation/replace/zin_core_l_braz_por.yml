 UNITS_HAS_NO_ORDERS_WARNING:0 "§RThe host belongs to an army but has no orders!§!\nDraw Defensive or Offensive Lines and assign hosts to them."
 UNITS_HAS_NO_ORDERS_WARNING_BUT_HAS_ARMY_GROUP:0 "§RThe host belongs to an army with no orders; it will follow the orders of the grand army instead.§!"
 UNITS_TOO_WEAK_TO_ATTACK:0 "§RThe host's cohesion is too low to advance.§!\nWait for it to recover, or consider changing the §YAggressiveness§! of the campaign plan."
 UNITS_VIEW_BTN_AREA_DEFENSE:0 "§HArea Defence§!\n - §GClick§! on states to add them to the army's order or remove them.\nAn army with this order cannot have other kinds of order at the same time.\n\nHosts in an army with this order will spread over the assigned area to guard important cities, harbours and other places and to deal with small enemy forces."
 UNITS_VIEW_BTN_DELETE_ORDER_ALT_RIGHT_CLICK:0 "§GAlt + Right-click§! this button to §Rdelete only the Sky Landing and Sea Landing orders§! of the chosen hosts."
 UNITS_VIEW_BTN_DISBAND_GROUP_TOOLTIP:0 "Click to §RDisband§! this army. Every host in it will be left unassigned."
 UNITS_VIEW_BTN_DRAW_DEFENCE:0 "§HFront Line§!\n - §GClick§! on one of the borders against another realm to set the assigned front along the whole border.\n - §GRight-click and drag§! the mouse on one of the borders against another realm to set the front over a shorter stretch.\n - §GRight-click and drag§! the mouse on the ends of an existing front line to edit them.\n\n§YFront Lines§! are the starting point of attacks into enemy land towards §YOffensive Lines§!, and they also let you place Hosts quickly along a foreign border."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0 "§HFront Line§!\n - §GClick§! on one of the borders against another realm to set the assigned front along the whole border.\n - §GShift + Click§! on one of the borders against another realm to set the assigned front without sub-army fronts along the whole border.\n - §GRight-click and drag§! the mouse on one of the borders against another realm to set the front over a shorter stretch.\n - §GShift + Right-click and drag§! the mouse on one of the borders against another realm to set the front without sub-army fronts over a shorter stretch.\n - §GRight-click and drag§! the mouse on the ends of an existing front line to edit them.\n\n§YFront Lines§! are the starting point of attacks into enemy land towards §YOffensive Lines§!, and they also let you place Hosts quickly along a foreign border."
 UNITS_VIEW_BTN_DRAW_FALLBACK:0 "§HFallback Line§!\n - §GRight-click and drag§! the mouse on friendly land to draw the §YSingle use§! defensive order.\n\n§YFallback Lines§! are useful for placing Hosts for defence, for example behind a river or elsewhere in friendly land."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV:0 "§HSea Landing Order§!\nStep 1) §GClick§! on one of the marked provinces to set where the landing starts.\nStep 2) §GRight-click§! on the coast province(s) you wish to land in.\nOnce the plan is active, the landing will begin to gather and set aside merchant fleets from your realm's store."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:0 "§HSea Landing Order (With a Floating Harbour)§!\nStep 1) §GClick§! on one of the marked provinces to set where the landing starts.\nStep 2) §GRight-click§! on the coast province(s) you wish to land in.\nOnce the plan is active, the landing will begin to gather and set aside merchant fleets and a Floating Harbour from your Arsenal."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR_NO_HARBOR:0 "§RWe have no §HFloating Harbour§! for this plan§!"
 UNITS_VIEW_BTN_DRAW_OFFENCE:0 "§HOffensive Line§!\n§GRight-click and hold§! the mouse button on the map to draw an §YOffensive Line§!.\nLines can only be drawn on land where you have set a §YFront Line§! or a §YSea Landing§!.\n\nHosts in a plan with an §YOffensive Line§! will try to take land and move their front line there. \n\n§GHold the mouse button§! and §Grelease§! it on an execute button to change how the plan is carried out"
 UNITS_VIEW_BTN_DRAW_PARADROP:0 "§HSky Landing Order§!\nStep 1) §GClick§! on our eyrie to set where the flight begins. The eyrie must have wings that can carry troops.\nStep 2) §GRight-click§! on the province in reach of the local wings to set where the troops land.\n§gRemember that only hosts able to land from the sky will be carried.§!"
 UNITS_VIEW_BTN_DRAW_PARADROP_NO_PARATROOPERS:0 "§RNo hosts able to land from the sky in the Command Group.§!"
 UNITS_VIEW_BTN_EXECUTE_TOOLTIP:0 "§GClick§! to $ACTION$ the carrying out of the §Ywhole plan.§!\n§GShift + Click§! and then §Yclick on the order you want§! to toggle its execution\n§GCtrl + Click§! to toggle the execution of all assigned hosts and armies"
 UNITS_VIEW_BTN_TRAIN_UNITS_TOOLTIP:0 "Click to begin an §Gexercise§! with this army. Its hosts will use up gear while gaining Experience. Your realm will also gain £army_experience Army Valour from each host whose Experience Level is at least $VAL|Y$ - $NAME|Y$"
