 SUPPLY_FLOW_DELAYED_DESC:0 "§HSupply Remaining§! shows how much supply reaches this province, and is made up of state supply and the depots within reach. The reach of a depot is affected by weather, the state of the ground, roads, high road level and pack trains. \n\n§HHosts§! will draw on provincial supply according to their supply weight. If their §HStored Supply§! is above the supply ratio of their location, they will draw on their own store until it falls to the level of the local supply.\n\nHold §GCtrl§! to show where the flow comes from."
 SUPPLY_FLOW_DISRUPTION:0 "Disrupted by enemy raids on the roads: §R-$SUPPLY$§!"
 SUPPLY_FLOW_SHOW_RANGE:0 "§HDepots§! spread supply to nearby provinces. Their reach and strength depend on weather, the state of the ground, roads, high road level and pack trains.\n\nTo widen the reach and raise the supply of a §HDepot§!, consider the §HImprove High Roads§! command, changing the §HPack Train Level§! or raising the §HRoad Level§!.\n\nHold §GShift§! to show the reach.\n§GShift-click§! to toggle pack trains.\n§GCtrl-click§! to toggle supply for our league."
