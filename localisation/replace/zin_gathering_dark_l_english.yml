 BUTTON_HINT_WORLD_TENSION:0 "Read what the scribes say of §HThe Gathering Dark§!"
 HINT_WORLD_TENSION:0 "Hint: The Gathering Dark"
 HINT_WORLD_TENSION_TEXT:0 "This is the £world_tension_icon  §YGathering Dark§! of the age, where every deed that frightens the courts of Aoaz is written down: wars declared, crowns taken, realms swallowed and the stranger things the old powers do.\n\nWhile the dark is thin, most realms may not move against a neighbour without a §Ygood cause§!, and those who break the peace are punished for it; as it deepens, leagues gather, causes come easily and old refusals give way.\n\nCrowns raise it by war and conquest and by some of their §Ychosen courses§!, and a long peace lowers it again.\n\nThe deeper it runs, the nearer the age comes to the War of the Last Crowns."
 HINT_WORLD_TENSION_TEXT_2:0 "The £world_tension_icon  §YGathering Dark§! is how frightened the courts of Aoaz have become, and the clerks who keep the rolls watch it more closely than the price of bread.\n\nWhile the dark is thin, most realms may not move against a neighbour without a §Ygood cause§!; as it deepens, leagues gather, causes come easily and old refusals give way.\n\nCrowns raise it by war and conquest and by some of their §Ychosen courses§!, and a long peace lowers it again.\n\nThe deeper it runs, the nearer the age comes to the War of the Last Crowns."
 SORT_BY_TENSION:0 "Order by the dark each deed added"
 THREAT_TOOLTIP:0 "§HThe Gathering Dark\n§! The courts' alarm stands at $VAL|1%H$"
 THREAT_WINDOW_NAME:0 "The Gathering Dark"
 WORLD_TENSION_NAME:0 "Gathering Dark"
 WORLD_TENSION_WARS:0 "Wars Waged"
