approval_policy = "never"

sandbox_mode = "danger-full-access"

project_doc_max_bytes = 184320

[agents]
max_threads = 24
max_depth = 2

[mcp_servers.hoi4_agent_tools]
command = "hoi4-agent-tools.cmd"
cwd = "."
startup_timeout_sec = 120
tool_timeout_sec = 600
default_tools_approval_mode = "auto"
# Codex keeps a server per subagent connected after the subagent finishes; an idle server exits.
env = { HOI4_AGENT_STDIO_IDLE_EXIT_MINUTES = "30" }

[mcp_servers.comfy_cloud_portraits]
url = "https://cloud.comfy.org/mcp"

# 3D MCP routes are intentionally absent until a feature actually needs a
# model. The 3D agent runs the repository-owned bootstrap at that point and
# materializes concrete Meshy and Blender entries without user editing.

# BEGIN AUTONOMOUS HOI4 3D MCP ROUTES
# This block is generated by .tools/3d_pipeline/bootstrap_3d_workflow.py.
# Do not replace it with a placeholder or ask the user to edit it manually.

[mcp_servers.meshy]
enabled = true
required = true
command = "C:\\Users\\klimp\\AppData\\Local\\HOI4 Mod Setup\\hoi4-mod-setup.exe"
args = ["--run-verified-meshy-mcp"]
cwd = "."
env_vars = ["MESHY_API_KEY"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"

[mcp_servers.blender_hoi4]
enabled = true
required = true
command = "cmd.exe"
args = ["/d", "/c", "call", ".tools/3d_pipeline/wrappers/run_blender_hoi4_adapter.cmd"]
cwd = "."
env_vars = []
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"

# Unrestricted Blender Lab is retained only as an isolated development aid.
# Production 3D work must use the repository-owned blender_hoi4 route above.
[mcp_servers.blender_lab]
enabled = false
required = false
command = "cmd.exe"
args = ["/d", "/c", "call", ".tools/3d_pipeline/wrappers/run_blender_lab_mcp.cmd"]
cwd = "."
env_vars = []
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "prompt"
